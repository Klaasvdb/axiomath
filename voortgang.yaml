# Voortgang van de handboeken. Dit bestand is de bron voor het overzicht op de landingspagina.
# Na een wijziging: python maak-voortgang.py
#
# Sleutel: <pakketnummer>/<rubriek>/<cursus> in de 3de graad ("4/Analyse/Integralen"), 2g<pakketnummer>/<rubriek>/<cursus>
# in de 2de graad ("2g5/Algebra/Reële getallen"); zie sleutel() in Ontwerp/voorkanten/maak-voorkanten.py.
# Een handboek dat hier niet staat, heeft de status "gepland".

statussen:
  gepland:
    percentage: 0
    teken: "⚪"
    uitleg: nog niet begonnen
  eerste-versie:
    percentage: 25
    teken: "🔴"
    uitleg: tekst en oefeningen voor het eerst volledig geschreven
  tweede-versie:
    percentage: 40
    teken: "🟠"
    uitleg: herwerkt na een eerste controle (ontwerpregels, figuren, oefeningen nagerekend)
  derde-versie:
    percentage: 55
    teken: "🟡"
    uitleg: opnieuw herwerkt, klaar om door andere leerkrachten te laten nalezen
  nagelezen:
    percentage: 75
    teken: "🔵"
    uitleg: nagelezen door leerkrachten, feedback verwerkt
  klaar:
    percentage: 100
    teken: "🟢"
    uitleg: in de klas gebruikt en bijgewerkt, versie 1.0

