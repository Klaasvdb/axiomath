# Wat uit de feedback van leerkrachten verwerkt is. Op axiomath.be staat bij elke plek een stippellijn naar rechts,
# met een kader "Verwerkt: <tekst>". Website/leerkrachten/maak.py zoekt de plek in elke PDF met `zoek` (een stukje
# gewone tekst uit de nieuwe versie, zonder formules; hoofdletters tellen niet; is het een lijst, dan de eerste die
# gevonden wordt) en neemt de eerste pagina waarop het staat. Staat het in een pakket niet, dan krijgt dat pakket
# geen kader. Houd dit bij voor elke verwerkte opmerking: nieuwste onderaan.
#   feedback: de nummers op de site (#id)       datum: wanneer verwerkt
#   tekst:    kort, voor de leerkracht: wat er veranderd is

