# Oefeningen van hoofdstuk 3 (tweedegraadsvergelijkingen). Zie Opmaak/oefeningenbank.py voor de velden.
# Dit hoofdstuk staat in pakket 2-5. pakketten: ontbinden met de oplossingen in 4-5 (h3-ontbindwortels, h3-o21, h3-t8),
# de gulden snede in 4-5 (h3-o20), som en product in 5 (h3-somproduct, h3-o22), een bewijsopdracht in 5 (h3-o23),
# parameters in 4-5 (h3-o26, h3-o27) en 5 (h3-o28).

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Schrijf als een product.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3x^2 - 12x$
      antwoord: |-
        $3x(x - 4)$
      uitwerking: |-
        $3x$ buiten haakjes.
    - opgave: |-
        $x^2 - 49$
      antwoord: |-
        $(x - 7)(x + 7)$
      uitwerking: |-
        $A^2 - B^2 = (A - B)(A + B)$.
    - opgave: |-
        $x^2 + 8x + 16$
      antwoord: |-
        $(x + 4)^2$
      uitwerking: |-
        $x^2 + 2 \cdot 4x + 4^2$.
    - opgave: |-
        $5x^2 + 10x$
      antwoord: |-
        $5x(x + 2)$
      uitwerking: |-
        $5x$ buiten haakjes.
    - opgave: |-
        $4x^2 - 9$
      antwoord: |-
        $(2x - 3)(2x + 3)$
      uitwerking: |-
        $(2x)^2 - 3^2$.
    - opgave: |-
        $x^2 - 6x + 9$
      antwoord: |-
        $(x - 3)^2$
      uitwerking: |-
        $x^2 - 2 \cdot 3x + 3^2$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem het product $(x - 2)(x + 5)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het product voor $x = 2$ en voor $x = -5$.
      antwoord: |-
        $0$ en $0$
      uitwerking: |-
        $0 \cdot 7 = 0$ en $(-7) \cdot 0 = 0$.
    - opgave: |-
        Is er nog een andere $x$ waarvoor het product $0$ is?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: voor elke andere $x$ zijn beide factoren verschillend van $0$, en dan is het product dat ook.
    - opgave: |-
        Ruben zegt: ``$(x - 2)(x + 5) = 8$, dus $x - 2 = 8$ of $x + 5 = 8$.'' Klopt dat? Controleer met $x = 10$.
      antwoord: |-
        nee
      uitwerking: |-
        Voor $x = 10$ is het product $8 \cdot 15 = 120$, niet $8$. Uit een product dat $8$ is, kun je niets besluiten over de factoren apart. Alleen met $0$ werkt die redenering.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h3-productnul
  soort: kort
  opgave: |-
    Los op met de product-nulregel.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x - 3)(x + 7) = 0$
      antwoord: |-
        $3$ of $-7$
      uitwerking: |-
        $x - 3 = 0$ of $x + 7 = 0$.
    - opgave: |-
        $x(2x - 5) = 0$
      antwoord: |-
        $0$ of $\tfrac52$
      uitwerking: |-
        $x = 0$ of $2x = 5$.
    - opgave: |-
        $(x + 1)^2 = 0$
      antwoord: |-
        $-1$
      uitwerking: |-
        Beide factoren zijn $x + 1$.
    - opgave: |-
        $3(x - 4)(x + 4) = 0$
      antwoord: |-
        $4$ of $-4$
      uitwerking: |-
        De factor $3$ is nooit $0$.

- id: h3-onvolledig
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 - 36 = 0$
      antwoord: |-
        $\pm 6$
      uitwerking: |-
        $x^2 = 36$.
    - opgave: |-
        $2x^2 = 50$
      antwoord: |-
        $\pm 5$
      uitwerking: |-
        $x^2 = 25$.
    - opgave: |-
        $x^2 + 9 = 0$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        $x^2 = -9$ kan niet.
    - opgave: |-
        $x^2 - 5x = 0$
      antwoord: |-
        $0$ of $5$
      uitwerking: |-
        $x(x - 5) = 0$.
    - opgave: |-
        $3x^2 + 12x = 0$
      antwoord: |-
        $0$ of $-4$
      uitwerking: |-
        $3x(x + 4) = 0$.
    - opgave: |-
        $4x^2 = 7x$
      antwoord: |-
        $0$ of $\tfrac74$
      uitwerking: |-
        $4x^2 - 7x = 0$, dus $x(4x - 7) = 0$. Niet delen door $x$!

- id: h3-ontbinden
  soort: kort
  opgave: |-
    Los op door te ontbinden in factoren.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 - 7x + 10 = 0$
      antwoord: |-
        $2$ of $5$
      uitwerking: |-
        $(x - 2)(x - 5) = 0$.
    - opgave: |-
        $x^2 + x - 6 = 0$
      antwoord: |-
        $-3$ of $2$
      uitwerking: |-
        $(x + 3)(x - 2) = 0$.
    - opgave: |-
        $x^2 + 8x + 16 = 0$
      antwoord: |-
        $-4$
      uitwerking: |-
        $(x + 4)^2 = 0$.
    - opgave: |-
        $x^2 - 2x - 15 = 0$
      antwoord: |-
        $5$ of $-3$
      uitwerking: |-
        $(x - 5)(x + 3) = 0$.
    - opgave: |-
        $x^2 + 9x + 14 = 0$
      antwoord: |-
        $-2$ of $-7$
      uitwerking: |-
        $(x + 2)(x + 7) = 0$.
    - opgave: |-
        $2x^2 - 2x - 12 = 0$
      antwoord: |-
        $3$ of $-2$
      uitwerking: |-
        Deel door $2$: $x^2 - x - 6 = (x - 3)(x + 2) = 0$.

- id: h3-nul
  soort: kort
  opgave: |-
    Herleid op nul en los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x(x + 2) = 15$
      antwoord: |-
        $3$ of $-5$
      uitwerking: |-
        $x^2 + 2x - 15 = 0$, dus $(x - 3)(x + 5) = 0$.
    - opgave: |-
        $x^2 = 3x + 10$
      antwoord: |-
        $5$ of $-2$
      uitwerking: |-
        $x^2 - 3x - 10 = 0$, dus $(x - 5)(x + 2) = 0$.
    - opgave: |-
        $(x + 4)(x - 1) = 6$
      antwoord: |-
        $2$ of $-5$
      uitwerking: |-
        $x^2 + 3x - 4 = 6$, dus $x^2 + 3x - 10 = (x - 2)(x + 5) = 0$.
    - opgave: |-
        $(x - 1)^2 = 2x + 6$
      antwoord: |-
        $5$ of $-1$
      uitwerking: |-
        $x^2 - 2x + 1 = 2x + 6$, dus $x^2 - 4x - 5 = (x - 5)(x + 1) = 0$.

- id: h3-discriminant
  soort: kort
  opgave: |-
    Los op met de discriminant.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 - 3x - 10 = 0$
      antwoord: |-
        $5$ of $-2$
      uitwerking: |-
        $D = 9 + 40 = 49$, $x = \tfrac{3 \pm 7}{2}$.
    - opgave: |-
        $2x^2 + 5x + 3 = 0$
      antwoord: |-
        $-1$ of $-1,5$
      uitwerking: |-
        $D = 25 - 24 = 1$, $x = \tfrac{-5 \pm 1}{4}$.
    - opgave: |-
        $x^2 + 4x + 7 = 0$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        $D = 16 - 28 = -12 < 0$.
    - opgave: |-
        $9x^2 - 6x + 1 = 0$
      antwoord: |-
        $\tfrac13$
      uitwerking: |-
        $D = 36 - 36 = 0$, $x = \tfrac{6}{18} = \tfrac13$.
    - opgave: |-
        $x^2 - 2x - 1 = 0$
      antwoord: |-
        $1 \pm \sqrt2$
      uitwerking: |-
        $D = 4 + 4 = 8$, $x = \tfrac{2 \pm \sqrt8}{2} = \tfrac{2 \pm 2\sqrt2}{2} = 1 \pm \sqrt2$.
    - opgave: |-
        $-x^2 + x + 6 = 0$
      antwoord: |-
        $-2$ of $3$
      uitwerking: |-
        $D = 1 + 24 = 25$, $x = \tfrac{-1 \pm 5}{-2}$: $-2$ of $3$.

- id: h3-ontbindwortels
  soort: kort
  pakketten: [4, 5]
  opgave: |-
    Ontbind in factoren met de oplossingen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 - 2x - 3$
      antwoord: |-
        $(x - 3)(x + 1)$
      uitwerking: |-
        Oplossingen $3$ en $-1$, $a = 1$.
    - opgave: |-
        $2x^2 - 5x + 2$
      antwoord: |-
        $(x - 2)(2x - 1)$
      uitwerking: |-
        $D = 9$, oplossingen $2$ en $\tfrac12$: $2(x - 2)\bigl(x - \tfrac12\bigr) = (x - 2)(2x - 1)$.
    - opgave: |-
        $3x^2 + 6x + 3$
      antwoord: |-
        $3(x + 1)^2$
      uitwerking: |-
        $D = 0$, oplossing $-1$.
    - opgave: |-
        $x^2 - 4x + 1$
      antwoord: |-
        $(x - 2 - \sqrt3)(x - 2 + \sqrt3)$
      uitwerking: |-
        Oplossingen $2 + \sqrt3$ en $2 - \sqrt3$.

- id: h3-somproduct
  soort: kort
  pakketten: [5]
  opgave: |-
    Gebruik de som en het product van de oplossingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef zonder op te lossen de som en het product van de oplossingen van $2x^2 + 6x - 5 = 0$.
      antwoord: |-
        som $-3$, product $-2,5$
      uitwerking: |-
        $D = 36 + 40 > 0$. Som $-\tfrac62 = -3$, product $\tfrac{-5}{2} = -2,5$.
    - opgave: |-
        Eén oplossing van $x^2 + bx - 12 = 0$ is $3$. Zoek de andere oplossing en $b$.
      antwoord: |-
        $-4$; $b = 1$
      uitwerking: |-
        Het product is $-12$, dus de andere oplossing is $-4$. De som is $-1 = -b$, dus $b = 1$.

- id: h3-grafisch
  soort: kort
  opgave: |-
    De figuur toont de parabool $y = x^2 - 2x - 3$ en de rechte $y = x + 1$.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.36cm]
        \rooster{-2}{1}{5}{-4}{1}{6}
        \parabool{1}{1}{-4}{-1.65}{4.15}
        \rechte[inkt]{-2}{5}{1}{1}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Los grafisch op: $x^2 - 2x - 3 = 0$ en $x^2 - 2x - 3 = -4$.
      antwoord: |-
        $-1$ of $3$; $1$
      uitwerking: |-
        De parabool snijdt de $x$-as in $-1$ en $3$. De rechte $y = -4$ raakt de parabool in de top $(1, -4)$: alleen $x = 1$.
    - opgave: |-
        Lees de snijpunten van de parabool en de rechte af.
      antwoord: |-
        $(-1, 0)$ en $(4, 5)$
      uitwerking: |-
        De snijpunten zijn $(-1, 0)$ en $(4, 5)$.
    - opgave: |-
        Controleer de snijpunten algebraïsch.
      antwoord: |-
        $x^2 - 3x - 4 = 0$ geeft $-1$ en $4$
      uitwerking: |-
        $x^2 - 2x - 3 = x + 1 \iff x^2 - 3x - 4 = 0 \iff (x - 4)(x + 1) = 0$. Voor $x = 4$ is $y = 5$, voor $x = -1$ is $y = 0$.

- id: h3-vraagstuk
  soort: kort
  opgave: |-
    Los op met een tweedegraadsvergelijking.
  lijst: enumerate
  delen:
    - opgave: |-
        Het product van twee opeenvolgende natuurlijke getallen is $132$. Welke getallen zijn het?
      antwoord: |-
        $11$ en $12$
      uitwerking: |-
        $n(n + 1) = 132$, dus $n^2 + n - 132 = 0$. $D = 1 + 528 = 529 = 23^2$, $n = \tfrac{-1 \pm 23}{2}$: $11$ of $-12$. Alleen $11$ is natuurlijk: de getallen zijn $11$ en $12$.
    - opgave: |-
        Een rechthoek is $3$ cm langer dan breed en heeft een oppervlakte van $40$ cm$^2$. Hoe groot zijn de zijden?
      antwoord: |-
        $5$ cm en $8$ cm
      uitwerking: |-
        $b(b + 3) = 40$, dus $b^2 + 3b - 40 = (b + 8)(b - 5) = 0$. Een breedte is positief: $b = 5$ cm, en de lengte is $8$ cm.

# --- Opdrachten ------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    de product-nulregel
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(x + 2)(x - 9) = 0$
      antwoord: |-
        $-2$ of $9$
    - opgave: |-
        $5x(x - 1) = 0$
      antwoord: |-
        $0$ of $1$
    - opgave: |-
        $(2x + 3)(x - 4) = 0$
      antwoord: |-
        $-1,5$ of $4$
    - opgave: |-
        $(x - 6)^2 = 0$
      antwoord: |-
        $6$
    - opgave: |-
        $(3 - x)(x + 3) = 0$
      antwoord: |-
        $3$ of $-3$
    - opgave: |-
        $x(x + 1)(x - 2) = 0$
      antwoord: |-
        $0$, $-1$ of $2$
  uitwerking: |-
    Stel elke factor gelijk aan $0$. \textbf{c.}~$2x + 3 = 0$ geeft $x = -1,5$. \textbf{e.}~$3 - x = 0$ geeft $x = 3$. \textbf{f.}~De regel werkt ook met drie factoren: drie oplossingen.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    onvolledige vergelijkingen
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 = 64$
      antwoord: |-
        $\pm 8$
    - opgave: |-
        $x^2 - 12 = 0$
      antwoord: |-
        $\pm 2\sqrt3$
    - opgave: |-
        $5x^2 - 20 = 0$
      antwoord: |-
        $\pm 2$
    - opgave: |-
        $x^2 + 4 = 0$
      antwoord: |-
        geen oplossing
    - opgave: |-
        $x^2 = 6x$
      antwoord: |-
        $0$ of $6$
    - opgave: |-
        $7x^2 + 14x = 0$
      antwoord: |-
        $0$ of $-2$
    - opgave: |-
        $-2x^2 + 18 = 0$
      antwoord: |-
        $\pm 3$
    - opgave: |-
        $x^2 - 0,25 = 0$
      antwoord: |-
        $\pm 0,5$
    - opgave: |-
        $3x^2 = 0$
      antwoord: |-
        $0$
  uitwerking: |-
    \textbf{b.}~$x = \pm\sqrt{12} = \pm 2\sqrt3$. \textbf{c.}~$x^2 = 4$. \textbf{e.}~$x^2 - 6x = x(x - 6) = 0$. \textbf{f.}~$7x(x + 2) = 0$. \textbf{g.}~$x^2 = 9$. \textbf{h.}~$x^2 = 0,25$.

- id: h3-o24
  soort: opdracht
  niveau: 1
  thema: |-
    oplossingen controleren door invullen
  opgave: |-
    Welke van de getallen zijn een oplossing? Ga na door in te vullen.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + 2x - 8 = 0$ \qquad met $2$, $-2$, $4$ en $-4$
      antwoord: |-
        $2$ en $-4$
      uitwerking: |-
        $4 + 4 - 8 = 0$ en $16 - 8 - 8 = 0$; $-2$ geeft $-8$ en $4$ geeft $16$.
    - opgave: |-
        $2x^2 - 3x = 5$ \qquad met $-1$, $1$, $2,5$ en $5$
      antwoord: |-
        $-1$ en $2,5$
      uitwerking: |-
        $2 + 3 = 5$ en $12,5 - 7,5 = 5$; $1$ geeft $-1$ en $5$ geeft $35$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    ontbinden met de som-productmethode
  opgave: |-
    Los op door te ontbinden in factoren.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 + 7x + 12 = 0$
      antwoord: |-
        $-3$ of $-4$
    - opgave: |-
        $x^2 - 8x + 15 = 0$
      antwoord: |-
        $3$ of $5$
    - opgave: |-
        $x^2 + 2x - 8 = 0$
      antwoord: |-
        $2$ of $-4$
    - opgave: |-
        $x^2 - 4x - 21 = 0$
      antwoord: |-
        $7$ of $-3$
    - opgave: |-
        $x^2 - 12x + 36 = 0$
      antwoord: |-
        $6$
    - opgave: |-
        $x^2 + 5x - 36 = 0$
      antwoord: |-
        $4$ of $-9$
    - opgave: |-
        $x^2 - 64 = 0$
      antwoord: |-
        $8$ of $-8$
    - opgave: |-
        $x^2 - 13x + 40 = 0$
      antwoord: |-
        $5$ of $8$
  uitwerking: |-
    \textbf{a.}~$(x + 3)(x + 4)$. \textbf{b.}~$(x - 3)(x - 5)$. \textbf{c.}~$(x - 2)(x + 4)$. \textbf{d.}~$(x - 7)(x + 3)$. \textbf{e.}~$(x - 6)^2$. \textbf{f.}~$(x - 4)(x + 9)$. \textbf{g.}~$(x - 8)(x + 8)$. \textbf{h.}~$(x - 5)(x - 8)$.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    het aantal oplossingen met de discriminant
  opgave: |-
    Hoeveel oplossingen heeft de vergelijking? Bereken alleen de discriminant.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 - 5x + 7 = 0$
      antwoord: |-
        geen ($D = -3$)
    - opgave: |-
        $2x^2 + 8x + 8 = 0$
      antwoord: |-
        één ($D = 0$)
    - opgave: |-
        $-x^2 + 3x + 4 = 0$
      antwoord: |-
        twee ($D = 25$)
    - opgave: |-
        $3x^2 - 2x - 9 = 0$
      antwoord: |-
        twee ($D = 112$)
    - opgave: |-
        $x^2 + x + 1 = 0$
      antwoord: |-
        geen ($D = -3$)
    - opgave: |-
        $0,25x^2 - x + 1 = 0$
      antwoord: |-
        één ($D = 0$)
  uitwerking: |-
    \textbf{a.}~$25 - 28 = -3$. \textbf{b.}~$64 - 64 = 0$. \textbf{c.}~$9 - 4 \cdot (-1) \cdot 4 = 9 + 16 = 25$. \textbf{d.}~$4 - 4 \cdot 3 \cdot (-9) = 4 + 108 = 112$. \textbf{e.}~$1 - 4 = -3$. \textbf{f.}~$1 - 4 \cdot 0,25 \cdot 1 = 0$.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    oplossen met de discriminant
  opgave: |-
    Los op met de discriminant. Rond af op twee decimalen als de oplossingen niet mooi uitkomen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 + 6x + 5 = 0$
      antwoord: |-
        $-1$ of $-5$
    - opgave: |-
        $3x^2 - x - 2 = 0$
      antwoord: |-
        $1$ of $-\tfrac23$
    - opgave: |-
        $x^2 - 4x + 5 = 0$
      antwoord: |-
        geen oplossing
    - opgave: |-
        $4x^2 + 4x + 1 = 0$
      antwoord: |-
        $-\tfrac12$
    - opgave: |-
        $2x^2 - 7x + 3 = 0$
      antwoord: |-
        $3$ of $\tfrac12$
    - opgave: |-
        $x^2 + 3x - 1 = 0$
      antwoord: |-
        $0,30$ of $-3,30$
    - opgave: |-
        $-3x^2 + 2x + 1 = 0$
      antwoord: |-
        $-\tfrac13$ of $1$
    - opgave: |-
        $5x^2 - 2x - 1 = 0$
      antwoord: |-
        $0,69$ of $-0,29$
  uitwerking: |-
    \textbf{a.}~$D = 36 - 20 = 16$, $x = \tfrac{-6 \pm 4}{2}$. \textbf{b.}~$D = 1 + 24 = 25$, $x = \tfrac{1 \pm 5}{6}$. \textbf{c.}~$D = 16 - 20 = -4$. \textbf{d.}~$D = 0$, $x = -\tfrac48$. \textbf{e.}~$D = 49 - 24 = 25$, $x = \tfrac{7 \pm 5}{4}$. \textbf{f.}~$D = 9 + 4 = 13$, $x = \tfrac{-3 \pm \sqrt{13}}{2}$. \textbf{g.}~$D = 4 + 12 = 16$, $x = \tfrac{-2 \pm 4}{-6}$. \textbf{h.}~$D = 4 + 20 = 24$, $x = \tfrac{2 \pm \sqrt{24}}{10}$.

- id: h3-o6
  soort: opdracht
  niveau: 2
  thema: |-
    eerst herleiden op nul
  opgave: |-
    Herleid op nul en los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x + 2)(x - 2) = 3x$
      antwoord: |-
        $4$ of $-1$
      uitwerking: |-
        $x^2 - 4 = 3x$, dus $x^2 - 3x - 4 = (x - 4)(x + 1) = 0$.
    - opgave: |-
        $x(x - 6) = -9$
      antwoord: |-
        $3$
      uitwerking: |-
        $x^2 - 6x + 9 = (x - 3)^2 = 0$.
    - opgave: |-
        $(2x - 1)^2 = 9$
      antwoord: |-
        $2$ of $-1$
      uitwerking: |-
        $2x - 1 = 3$ of $2x - 1 = -3$. Of: $4x^2 - 4x - 8 = 0$, dus $x^2 - x - 2 = (x - 2)(x + 1) = 0$.
    - opgave: |-
        $(x + 3)^2 = 2(x + 3)$
      antwoord: |-
        $-3$ of $-1$
      uitwerking: |-
        $(x + 3)^2 - 2(x + 3) = 0$, en $x + 3$ buiten haakjes: $(x + 3)(x + 1) = 0$. Niet delen door $x + 3$, anders verlies je $-3$.
    - opgave: |-
        $3x^2 + 5 = 2x^2 + 6x$
      antwoord: |-
        $1$ of $5$
      uitwerking: |-
        $x^2 - 6x + 5 = (x - 1)(x - 5) = 0$.
    - opgave: |-
        $x^2 - 2 = 3(x - 2)$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        $x^2 - 3x + 4 = 0$, $D = 9 - 16 = -7 < 0$.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    nulwaarden en snijpunten met de assen
  opgave: |-
    Geef de snijpunten van de grafiek met de $x$-as en met de $y$-as.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = x^2 - x - 20$
      antwoord: |-
        $(5, 0)$, $(-4, 0)$; $(0, -20)$
      uitwerking: |-
        $(x - 5)(x + 4) = 0$; $f(0) = -20$.
    - opgave: |-
        $g(x) = -2x^2 + 8x$
      antwoord: |-
        $(0, 0)$, $(4, 0)$; $(0, 0)$
      uitwerking: |-
        $-2x(x - 4) = 0$; de oorsprong ligt op beide assen.
    - opgave: |-
        $h(x) = x^2 + 6x + 10$
      antwoord: |-
        geen; $(0, 10)$
      uitwerking: |-
        $D = 36 - 40 = -4 < 0$: geen snijpunten met de $x$-as.

- id: h3-o7
  soort: opdracht
  niveau: 2
  thema: |-
    gemengd: kies zelf de methode
  opgave: |-
    Los op. Kies telkens de snelste methode.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 - 11x = 0$
      antwoord: |-
        $0$ of $11$
    - opgave: |-
        $x^2 - 11x + 30 = 0$
      antwoord: |-
        $5$ of $6$
    - opgave: |-
        $x^2 - 11 = 0$
      antwoord: |-
        $\pm\sqrt{11}$
    - opgave: |-
        $2x^2 + x - 6 = 0$
      antwoord: |-
        $1,5$ of $-2$
    - opgave: |-
        $x^2 + 11 = 0$
      antwoord: |-
        geen oplossing
    - opgave: |-
        $4x^2 - 12x + 9 = 0$
      antwoord: |-
        $1,5$
    - opgave: |-
        $-x^2 + 10x - 21 = 0$
      antwoord: |-
        $3$ of $7$
    - opgave: |-
        $6x^2 - x - 1 = 0$
      antwoord: |-
        $\tfrac12$ of $-\tfrac13$
    - opgave: |-
        $x^2 + 0,5x = 0$
      antwoord: |-
        $0$ of $-0,5$
    - opgave: |-
        $(x - 1)(x + 4) = 0$
      antwoord: |-
        $1$ of $-4$
  uitwerking: |-
    \textbf{a.}~$x(x - 11) = 0$. \textbf{b.}~$(x - 5)(x - 6) = 0$. \textbf{c.}~$x^2 = 11$. \textbf{d.}~$D = 1 + 48 = 49$, $x = \tfrac{-1 \pm 7}{4}$. \textbf{e.}~$x^2 = -11$. \textbf{f.}~$(2x - 3)^2 = 0$. \textbf{g.}~Maal $-1$: $x^2 - 10x + 21 = (x - 3)(x - 7) = 0$. \textbf{h.}~$D = 1 + 24 = 25$, $x = \tfrac{1 \pm 5}{12}$. \textbf{i.}~$x(x + 0,5) = 0$. \textbf{j.}~Al ontbonden.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstukken met getallen
  opgave: |-
    Los op met een vergelijking.
  lijst: enumerate
  delen:
    - opgave: |-
        Een getal plus zijn kwadraat is $56$. Welk getal kan het zijn?
      antwoord: |-
        $7$ of $-8$
      uitwerking: |-
        $x^2 + x - 56 = 0$, dus $(x - 7)(x + 8) = 0$. Controle: $7 + 49 = 56$ en $-8 + 64 = 56$.
    - opgave: |-
        Het kwadraat van een getal is $12$ meer dan vier keer dat getal. Welk getal kan het zijn?
      antwoord: |-
        $6$ of $-2$
      uitwerking: |-
        $x^2 = 4x + 12$, dus $x^2 - 4x - 12 = (x - 6)(x + 2) = 0$.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    grafisch oplossen
  opgave: |-
    De figuur toont de grafieken van $f(x) = -x^2 + 2x + 3$ en $g(x) = x - 3$. Los grafisch op.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.33cm]
        \rooster{-3}{1}{4}{-6}{1}{5}
        \parabool{-1}{1}{4}{-2.15}{3.65}
        \rechte[inkt]{-3}{4}{1}{-3}
        \node[accent,font=\scriptsize] at (-1.1,3) {$f$};
        \node[inkt,font=\scriptsize] at (4.3,1.6) {$g$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = 0$
      antwoord: |-
        $-1$ of $3$
      uitwerking: |-
        De snijpunten met de $x$-as.
    - opgave: |-
        $f(x) = 3$
      antwoord: |-
        $0$ of $2$
      uitwerking: |-
        De rechte $y = 3$ snijdt de parabool in $(0, 3)$ en $(2, 3)$.
    - opgave: |-
        $f(x) = 5$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        Het maximum van $f$ is $4$: de rechte $y = 5$ ligt boven de parabool.
    - opgave: |-
        $f(x) = g(x)$. Controleer daarna algebraïsch.
      antwoord: |-
        $-2$ of $3$
      uitwerking: |-
        Snijpunten $(-2, -5)$ en $(3, 0)$. Algebraïsch: $-x^2 + 2x + 3 = x - 3 \iff x^2 - x - 6 = 0 \iff (x - 3)(x + 2) = 0$.

- id: h3-o21
  soort: opdracht
  pakketten: [4, 5]
  niveau: 2
  thema: |-
    ontbinden met de oplossingen
  opgave: |-
    Ontbind in factoren.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2x^2 - x - 3$
      antwoord: |-
        $(2x - 3)(x + 1)$
      uitwerking: |-
        $D = 25$, oplossingen $1,5$ en $-1$: $2(x - 1,5)(x + 1) = (2x - 3)(x + 1)$.
    - opgave: |-
        $x^2 - 6x + 4$
      antwoord: |-
        $(x - 3 - \sqrt5)(x - 3 + \sqrt5)$
      uitwerking: |-
        $D = 20$, oplossingen $\tfrac{6 \pm 2\sqrt5}{2} = 3 \pm \sqrt5$.
    - opgave: |-
        $4x^2 - 12x + 9$
      antwoord: |-
        $(2x - 3)^2$
      uitwerking: |-
        $D = 0$, oplossing $1,5$: $4(x - 1,5)^2 = (2x - 3)^2$.
    - opgave: |-
        $-x^2 + 2x + 8$
      antwoord: |-
        $-(x - 4)(x + 2)$
      uitwerking: |-
        Oplossingen $4$ en $-2$, $a = -1$.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: een zwembad
  opgave: |-
    Een rechthoekig zwembad is $10$ m langer dan breed, en heeft een oppervlakte van $375$ m$^2$. Hoe lang en hoe breed is het zwembad?
  antwoord: |-
    $25$ m lang en $15$ m breed
  uitwerking: |-
    Noem de breedte $b$ (in m). $b(b + 10) = 375$, dus $b^2 + 10b - 375 = 0$. $D = 100 + 1500 = 1600$, $b = \tfrac{-10 \pm 40}{2}$: $15$ of $-25$. De breedte is $15$ m, de lengte $25$ m. Controle: $15 \cdot 25 = 375$.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    snijpunten van een parabool en een rechte
  opgave: |-
    Bereken de snijpunten van de parabool en de rechte.
  lijst: enumerate
  delen:
    - opgave: |-
        $y = x^2 - 4$ \quad en \quad $y = 3x$
      antwoord: |-
        $(4, 12)$ en $(-1, -3)$
      uitwerking: |-
        $x^2 - 4 = 3x \iff x^2 - 3x - 4 = 0 \iff (x - 4)(x + 1) = 0$. Dan $y = 12$ of $y = -3$.
    - opgave: |-
        $y = x^2 + 2x$ \quad en \quad $y = -2x - 4$
      antwoord: |-
        $(-2, 0)$: de rechte raakt de parabool
      uitwerking: |-
        $x^2 + 4x + 4 = 0 \iff (x + 2)^2 = 0$. Eén gemeenschappelijk punt $(-2, 0)$: de rechte raakt de parabool.
    - opgave: |-
        $y = -x^2 + 1$ \quad en \quad $y = x + 3$
      antwoord: |-
        geen snijpunten
      uitwerking: |-
        $-x^2 + 1 = x + 3 \iff x^2 + x + 2 = 0$, $D = 1 - 8 < 0$: de rechte ligt helemaal boven de parabool.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    de stopafstand van een auto
  opgave: |-
    Stel dat de stopafstand van een auto (reactieafstand plus remweg) $s(v) = 0,3v + 0,008v^2$ meter is, met $v$ de snelheid in km/h.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de stopafstand bij $50$ km/h.
      antwoord: |-
        $35$ m
      uitwerking: |-
        $15 + 0,008 \cdot 2500 = 15 + 20 = 35$ m.
    - opgave: |-
        Bij welke snelheid is de stopafstand $50$ m?
      antwoord: |-
        $62,5$ km/h
      uitwerking: |-
        $0,008v^2 + 0,3v - 50 = 0$. $D = 0,09 + 1,6 = 1,69$, $\sqrt D = 1,3$. $v = \tfrac{-0,3 + 1,3}{0,016} = 62,5$ (de andere oplossing is negatief).

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    eigenschappen van tweedegraadsvergelijkingen: waar of niet waar
  opgave: |-
    Waar of niet waar? Verklaar je antwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        De vergelijking $x^2 = 5x$ heeft als enige oplossing $5$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: ook $0$ is een oplossing, want $x(x - 5) = 0$.
    - opgave: |-
        Hebben $a$ en $c$ een verschillend teken, dan heeft $ax^2 + bx + c = 0$ twee oplossingen.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: dan is $-4ac > 0$, dus $D = b^2 - 4ac > 0$.
    - opgave: |-
        Een tweedegraadsvergelijking kan drie oplossingen hebben.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: een parabool snijdt de $x$-as hoogstens twee keer.
    - opgave: |-
        Als $D = 0$, raakt de parabool $y = ax^2 + bx + c$ de $x$-as in haar top.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: de enige oplossing is $-\tfrac{b}{2a}$, de $x$-coördinaat van de top.
    - opgave: |-
        Uit $(x - 1)(x - 2) = 2$ volgt $x = 3$ of $x = 4$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $(3 - 1)(3 - 2) = 2$ klopt toevallig, maar $(4 - 1)(4 - 2) = 6$. Juist: $x^2 - 3x = 0$, dus $x = 0$ of $x = 3$.

- id: h3-o25
  soort: opdracht
  niveau: 2
  thema: |-
    een open doos uit karton
  opgave: |-
    Uit een rechthoekig stuk karton van $30$ cm op $20$ cm knip je in elke hoek een vierkant van $x$ cm weg. Plooi je de randen omhoog, dan krijg je een open doos. De bodem moet $336$ cm$^2$ groot zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $(30 - 2x)(20 - 2x) = 336$.
      antwoord: |-
        de bodem is $30 - 2x$ op $20 - 2x$
      uitwerking: |-
        Van elke zijde gaan twee vierkanten af: de bodem is $30 - 2x$ cm lang en $20 - 2x$ cm breed.
    - opgave: |-
        Los de vergelijking op. Welke oplossing heeft zin?
      antwoord: |-
        $x = 3$ (niet $22$)
      uitwerking: |-
        $600 - 100x + 4x^2 = 336$, dus $4x^2 - 100x + 264 = 0$ en $x^2 - 25x + 66 = 0$. $D = 625 - 264 = 361$, $x = \tfrac{25 \pm 19}{2}$: $3$ of $22$. Met $x = 22$ is $20 - 2x$ negatief. Dus $x = 3$ cm.
    - opgave: |-
        Hoeveel cm$^3$ past er in de doos?
      antwoord: |-
        $1008$ cm$^3$
      uitwerking: |-
        De doos is $3$ cm hoog: $336 \cdot 3 = 1008$ cm$^3$.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    foutenjacht bij vergelijkingen
  opgave: |-
    Zoek de fout en verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Tom lost $x^2 - 5x = 0$ op: ``$x^2 = 5x$, deel door $x$: $x = 5$.''
      antwoord: |-
        $0$ ontbreekt; $V = \{0, 5\}$
      uitwerking: |-
        Delen door $x$ mag niet als $x = 0$ kan zijn. Juist: $x(x - 5) = 0$, dus $x = 0$ of $x = 5$.
    - opgave: |-
        Sara lost $(x - 3)(x + 1) = 5$ op: ``$x - 3 = 5$ of $x + 1 = 5$, dus $x = 8$ of $x = 4$.''
      antwoord: |-
        $V = \{-2, 4\}$
      uitwerking: |-
        De product-nulregel werkt alleen met $0$. Juist: $x^2 - 2x - 3 = 5$, dus $x^2 - 2x - 8 = (x - 4)(x + 2) = 0$. Dat $4$ klopt, is toeval.
    - opgave: |-
        Bram berekent de discriminant van $-x^2 + 4x - 3 = 0$: ``$D = 16 - 4 \cdot 1 \cdot (-3) = 28$.''
      antwoord: |-
        $D = 4$; $V = \{1, 3\}$
      uitwerking: |-
        Hier is $a = -1$: $D = 16 - 4 \cdot (-1) \cdot (-3) = 16 - 12 = 4$. Dan $x = \tfrac{-4 \pm 2}{-2}$: $1$ of $3$.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    de baan van een pijl
  opgave: |-
    Een boogschutter schiet een pijl recht omhoog. Na $t$ seconden is de pijl $h(t) = -5t^2 + 30t + 1,5$ meter hoog.
  lijst: enumerate
  delen:
    - opgave: |-
        Wanneer is de pijl op $41,5$ m hoogte?
      antwoord: |-
        na $2$ s en na $4$ s
      uitwerking: |-
        $-5t^2 + 30t + 1,5 = 41,5 \iff -5t^2 + 30t - 40 = 0 \iff t^2 - 6t + 8 = 0 \iff (t - 2)(t - 4) = 0$. Eén keer op weg naar boven, één keer naar beneden.
    - opgave: |-
        Komt de pijl ooit op $50$ m hoogte? Gebruik de discriminant.
      antwoord: |-
        nee
      uitwerking: |-
        $-5t^2 + 30t - 48,5 = 0 \iff t^2 - 6t + 9,7 = 0$, $D = 36 - 38,8 < 0$. Geen oplossing: de pijl komt hoogstens $h(3) = 46,5$ m hoog.
    - opgave: |-
        Wanneer valt de pijl op de grond? Rond af op een honderdste.
      antwoord: |-
        na $6,05$ s
      uitwerking: |-
        $t^2 - 6t - 0,3 = 0$, $D = 36 + 1,2 = 37,2$, $t = \tfrac{6 + \sqrt{37,2}}{2} \approx 6,05$ (de andere oplossing is negatief).

- id: h3-o17
  soort: opdracht
  niveau: 3
  thema: |-
    het aantal oplossingen met een onbekend getal
  opgave: |-
    Bepaal het onbekende getal.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $c$ heeft $x^2 + 6x + c = 0$ precies één oplossing?
      antwoord: |-
        $c = 9$
      uitwerking: |-
        $D = 36 - 4c = 0$, dus $c = 9$. Dan is $(x + 3)^2 = 0$.
    - opgave: |-
        Voor welke $c$ heeft $x^2 + 6x + c = 0$ twee oplossingen?
      antwoord: |-
        $c < 9$
      uitwerking: |-
        $36 - 4c > 0 \iff 4c < 36 \iff c < 9$.
    - opgave: |-
        Voor welke $b$ heeft $x^2 + bx + 16 = 0$ precies één oplossing?
      antwoord: |-
        $b = 8$ of $b = -8$
      uitwerking: |-
        $b^2 - 64 = 0$, dus $b^2 = 64$ en $b = \pm 8$. Dan $(x + 4)^2 = 0$ of $(x - 4)^2 = 0$.

- id: h3-o19
  soort: opdracht
  niveau: 3
  thema: |-
    vraagstuk: kosten delen
  opgave: |-
    Een groep vrienden huurt een chalet voor $1200$ euro, en deelt de kosten eerlijk. Als er nog twee vrienden meegaan, betaalt elk $50$ euro minder. Hoeveel vrienden waren er eerst?
  antwoord: |-
    $6$
  uitwerking: |-
    Met $n$ vrienden betaalt elk $\tfrac{1200}{n}$ euro. Dan is $\tfrac{1200}{n} - 50 = \tfrac{1200}{n + 2}$. Vermenigvuldig met $n(n + 2)$: $1200(n + 2) - 50n(n + 2) = 1200n$, dus $2400 - 50n^2 - 100n = 0$ en $n^2 + 2n - 48 = 0$. Dat is $(n - 6)(n + 8) = 0$: $n = 6$. Controle: $\tfrac{1200}{6} = 200$ en $\tfrac{1200}{8} = 150$, precies $50$ minder.

- id: h3-o18
  soort: opdracht
  niveau: 3
  thema: |-
    een oplossing is gegeven
  opgave: |-
    Het getal $2$ is een oplossing van $x^2 + bx - 10 = 0$. Bepaal $b$ en de andere oplossing.
  antwoord: |-
    $b = 3$; $-5$
  uitwerking: |-
    Vul $x = 2$ in: $4 + 2b - 10 = 0$, dus $b = 3$. Dan $x^2 + 3x - 10 = (x - 2)(x + 5) = 0$: de andere oplossing is $-5$.

- id: h3-o20
  soort: opdracht
  pakketten: [4, 5]
  niveau: 3
  thema: |-
    de gulden snede
  opgave: |-
    Een rechthoek is $x$ breed en $1$ hoog, met $x > 1$. Knip je er een vierkant van $1$ op $1$ af, dan houd je een rechthoek over van $x - 1$ op $1$. Bij de \textit{gulden rechthoek} heeft die kleine rechthoek dezelfde vorm als de grote: $\dfrac{x}{1} = \dfrac{1}{x - 1}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $x^2 - x - 1 = 0$.
      antwoord: |-
        maal $x - 1$
      uitwerking: |-
        Vermenigvuldig beide leden met $x - 1$: $x(x - 1) = 1$, dus $x^2 - x - 1 = 0$.
    - opgave: |-
        Bereken $x$ exact en afgerond op drie decimalen.
      antwoord: |-
        $\tfrac{1 + \sqrt5}{2} \approx 1,618$
      uitwerking: |-
        $D = 1 + 4 = 5$, $x = \tfrac{1 \pm \sqrt5}{2}$. Alleen de positieve oplossing heeft zin: $x = \tfrac{1 + \sqrt5}{2} \approx 1,618$. Dat getal heet de gulden snede.

- id: h3-o22
  soort: opdracht
  pakketten: [5]
  niveau: 3
  thema: |-
    som en product van de oplossingen
  opgave: |-
    Gebruik de som en het product van de oplossingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking $x^2 + bx + c = 0$ met oplossingen $3$ en $-5$.
      antwoord: |-
        $x^2 + 2x - 15 = 0$
      uitwerking: |-
        Som $-2 = -b$, dus $b = 2$; product $-15 = c$.
    - opgave: |-
        Geef een vergelijking $x^2 + bx + c = 0$ met oplossingen $2 + \sqrt3$ en $2 - \sqrt3$.
      antwoord: |-
        $x^2 - 4x + 1 = 0$
      uitwerking: |-
        Som $4$, dus $b = -4$; product $4 - 3 = 1$.
    - opgave: |-
        Toon aan dat voor de oplossingen van $ax^2 + bx + c = 0$ geldt: $x_1^2 + x_2^2 = \dfrac{b^2 - 2ac}{a^2}$.
      antwoord: |-
        $x_1^2 + x_2^2 = (x_1 + x_2)^2 - 2x_1x_2$
      uitwerking: |-
        \[x_1^2 + x_2^2 = (x_1 + x_2)^2 - 2x_1x_2 = \frac{b^2}{a^2} - \frac{2c}{a} = \frac{b^2 - 2ac}{a^2}.\]

- id: h3-o23
  soort: opdracht
  pakketten: [5]
  niveau: 3
  thema: |-
    bewijs met de discriminant
  opgave: |-
    Toon aan.
  lijst: enumerate
  delen:
    - opgave: |-
        De vergelijking $x^2 + px - 1 = 0$ heeft voor elk getal $p$ twee oplossingen.
      antwoord: |-
        $D = p^2 + 4 > 0$
      uitwerking: |-
        $D = p^2 + 4$. Een kwadraat is nooit negatief, dus $D \geqslant 4 > 0$.
    - opgave: |-
        Voor alle getallen $m$ en $n$ heeft $(x - m)(x - n) = 1$ twee oplossingen.
      antwoord: |-
        $D = (m - n)^2 + 4 > 0$
      uitwerking: |-
        Uitwerken: $x^2 - (m + n)x + mn - 1 = 0$. Dan is
        \[D = (m + n)^2 - 4(mn - 1) = m^2 + 2mn + n^2 - 4mn + 4 = (m - n)^2 + 4 > 0.\]

- id: h3-o26
  soort: opdracht
  pakketten: [4, 5]
  niveau: 2
  thema: |-
    vergelijkingen met een parameter
  opgave: |-
    Bepaal het onbekende getal.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $k$ is $x = 2$ een oplossing van $x^2 + kx - 10 = 0$? Wat is dan de andere oplossing?
      antwoord: |-
        $k = 3$; $x = -5$
      uitwerking: |-
        Vul $x = 2$ in: $4 + 2k - 10 = 0$, dus $k = 3$. Dan is $x^2 + 3x - 10 = (x + 5)(x - 2)$: de andere oplossing is $-5$.
    - opgave: |-
        Voor welke $m$ heeft $x^2 - 6x + m = 0$ precies één oplossing? Welke?
      antwoord: |-
        $m = 9$; $x = 3$
      uitwerking: |-
        Eén oplossing als $D = 36 - 4m = 0$, dus $m = 9$. Dan is $x^2 - 6x + 9 = (x - 3)^2$.
    - opgave: |-
        Voor welke $b$ heeft $x^2 + bx + 16 = 0$ precies één oplossing?
      antwoord: |-
        $b = 8$ of $b = -8$
      uitwerking: |-
        $D = b^2 - 64 = 0$, dus $b^2 = 64$: $b = 8$ (oplossing $-4$) of $b = -8$ (oplossing $4$).
    - opgave: |-
        Voor welke $k$ is $x = -1$ een oplossing van $kx^2 + 3x + 5 = 0$? Wat is dan de andere oplossing?
      antwoord: |-
        $k = -2$; $x = \tfrac52$
      uitwerking: |-
        $k - 3 + 5 = 0$, dus $k = -2$. Dan is $-2x^2 + 3x + 5 = 0$, of $2x^2 - 3x - 5 = (2x - 5)(x + 1) = 0$: de andere oplossing is $\tfrac52$.
    - opgave: |-
        Voor welke $a$ heeft $ax^2 - 4x + 1 = 0$ precies één oplossing? (Neem $a \neq 0$.)
      antwoord: |-
        $a = 4$; $x = \tfrac12$
      uitwerking: |-
        $D = 16 - 4a = 0$, dus $a = 4$. De oplossing is $-\tfrac{b}{2a} = \tfrac{4}{8} = \tfrac12$.
    - opgave: |-
        Voor welke $c$ is $0$ een oplossing van $2x^2 + 5x + c = 0$? Wat is dan de andere oplossing?
      antwoord: |-
        $c = 0$; $x = -\tfrac52$
      uitwerking: |-
        Vul $x = 0$ in: $c = 0$. Dan is $x(2x + 5) = 0$, met ook $x = -\tfrac52$.

- id: h3-o27
  soort: opdracht
  pakketten: [4, 5]
  niveau: 3
  thema: |-
    parameters: een stap verder
  opgave: |-
    Bepaal het onbekende getal, of toon aan.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $m$ heeft $(m - 1)x^2 + 4x + 2 = 0$ precies één oplossing? Let op: voor één waarde van $m$ is het geen tweedegraadsvergelijking.
      antwoord: |-
        $m = 1$ of $m = 3$
      uitwerking: |-
        Is $m = 1$, dan staat er $4x + 2 = 0$: één oplossing, $x = -\tfrac12$. Is $m \neq 1$, dan is $D = 16 - 8(m - 1) = 24 - 8m = 0$ als $m = 3$: $2x^2 + 4x + 2 = 2(x + 1)^2$, met oplossing $-1$.
    - opgave: |-
        Toon aan dat $x^2 - 2kx + k^2 - 1 = 0$ voor elke $k$ de oplossingen $k - 1$ en $k + 1$ heeft.
      antwoord: |-
        $D = 4$
      uitwerking: |-
        $D = 4k^2 - 4(k^2 - 1) = 4$, dus $x = \tfrac{2k \pm 2}{2} = k \pm 1$. Of korter: $x^2 - 2kx + k^2 - 1 = (x - k)^2 - 1 = 0$, dus $x - k = \pm1$.
    - opgave: |-
        De vergelijking $x^2 + px + 12 = 0$ heeft twee oplossingen, en de ene is het drievoud van de andere. Bepaal $p$.
      antwoord: |-
        $p = -8$ of $p = 8$
      uitwerking: |-
        Noem de oplossingen $r$ en $3r$. Dan is $x^2 + px + 12 = (x - r)(x - 3r) = x^2 - 4rx + 3r^2$. Dus $3r^2 = 12$, $r = \pm2$, en $p = -4r$: $p = -8$ (oplossingen $2$ en $6$) of $p = 8$ (oplossingen $-2$ en $-6$).
    - opgave: |-
        Voor welke $m$ is $x = m$ een oplossing van $x^2 + mx - 8 = 0$?
      antwoord: |-
        $m = 2$ of $m = -2$
      uitwerking: |-
        Vul $x = m$ in: $m^2 + m^2 - 8 = 0$, dus $m^2 = 4$.
    - opgave: |-
        Voor welke $k$ heeft $kx^2 + kx + 1 = 0$ precies één oplossing?
      antwoord: |-
        $k = 4$
      uitwerking: |-
        Voor $k = 0$ staat er $1 = 0$: geen oplossing. Voor $k \neq 0$ is $D = k^2 - 4k = k(k - 4) = 0$, dus $k = 4$: $4x^2 + 4x + 1 = (2x + 1)^2$, met oplossing $-\tfrac12$.

- id: h3-o28
  soort: opdracht
  pakketten: [5]
  niveau: 3
  thema: |-
    parameters met de som en het product
  opgave: |-
    Gebruik de som en het product van de oplossingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Een oplossing van $3x^2 - 7x + c = 0$ is $2$. Bepaal $c$ en de andere oplossing zonder de formule.
      antwoord: |-
        $c = 2$; $x = \tfrac13$
      uitwerking: |-
        Vul $x = 2$ in: $12 - 14 + c = 0$, dus $c = 2$. Het product is $\tfrac ca = \tfrac23$, dus de andere oplossing is $\tfrac23 : 2 = \tfrac13$. Controle met de som: $2 + \tfrac13 = \tfrac73 = -\tfrac ba$.
    - opgave: |-
        Voor welke $k$ is de som van de oplossingen van $x^2 + (k - 3)x - 5 = 0$ gelijk aan $7$?
      antwoord: |-
        $k = -4$
      uitwerking: |-
        De som is $-(k - 3) = 7$, dus $k = -4$. Er zijn wel twee oplossingen: $D = 49 + 20 > 0$.
    - opgave: |-
        Voor welke $m$ is het product van de oplossingen van $2x^2 - x + m = 0$ gelijk aan $-3$? Wat zijn dan de oplossingen?
      antwoord: |-
        $m = -6$; $x = 2$ of $x = -\tfrac32$
      uitwerking: |-
        Het product is $\tfrac m2 = -3$, dus $m = -6$. Dan is $2x^2 - x - 6 = (2x + 3)(x - 2)$.
    - opgave: |-
        Stel een vergelijking $x^2 + bx + c = 0$ op met de oplossingen $3 + \sqrt2$ en $3 - \sqrt2$.
      antwoord: |-
        $x^2 - 6x + 7 = 0$
      uitwerking: |-
        De som is $6 = -b$ en het product is $9 - 2 = 7 = c$.

- id: h3-o29
  soort: opdracht
  pakketten: [2, 3, 4, 5]
  niveau: 2
  thema: |-
    zelf een vergelijking maken, fouten zoeken
  opgave: |-
    Denk na voor je rekent.
  lijst: enumerate
  delen:
    - opgave: |-
        Maak zelf een tweedegraadsvergelijking met de oplossingen $4$ en $-1$.
      antwoord: |-
        bijvoorbeeld $x^2 - 3x - 4 = 0$
      uitwerking: |-
        $(x - 4)(x + 1) = 0$, uitgewerkt $x^2 - 3x - 4 = 0$. Elk veelvoud, zoals $2x^2 - 6x - 8 = 0$, is ook goed.
    - opgave: |-
        Maak een tweedegraadsvergelijking $x^2 + 6x + c = 0$ zonder oplossingen.
      antwoord: |-
        elke $c > 9$, bijvoorbeeld $x^2 + 6x + 10 = 0$
      uitwerking: |-
        $D = 36 - 4c < 0$ als $c > 9$. Of: $x^2 + 6x + c = (x + 3)^2 + c - 9$, en dat is nooit $0$ als $c - 9 > 0$.
    - opgave: |-
        Waar of niet waar? Is $a > 0$ en $c < 0$, dan heeft $ax^2 + bx + c = 0$ altijd twee oplossingen.
      antwoord: |-
        waar
      uitwerking: |-
        De parabool is naar boven geopend en snijdt de $y$-as in $(0, c)$, onder de $x$-as. Ze moet de $x$-as dus links en rechts van de $y$-as snijden. Met de discriminant: $-4ac > 0$, dus $D = b^2 - 4ac > 0$.
    - opgave: |-
        Lies lost $x^2 = 5x$ op door beide leden te delen door $x$, en vindt $x = 5$. Wat loopt er mis?
      antwoord: |-
        de oplossing $x = 0$ is weg
      uitwerking: |-
        Delen door $x$ mag niet als $x = 0$ kan zijn. Goed: $x^2 - 5x = x(x - 5) = 0$, dus $x = 0$ of $x = 5$.
    - opgave: |-
        Tom schrijft: $(x - 3)^2 = 16$, dus $x - 3 = 4$, dus $x = 7$. Wat ontbreekt er?
      antwoord: |-
        $x = -1$
      uitwerking: |-
        Er zijn twee getallen met kwadraat $16$: ook $x - 3 = -4$, dus $x = -1$.

- id: h3-o30
  soort: opdracht
  pakketten: [2, 3, 4, 5]
  niveau: 2
  thema: |-
    vraagstukken vertalen naar een vergelijking
  opgave: |-
    Schrijf eerst de vergelijking op, en los ze dan op.
  lijst: enumerate
  delen:
    - opgave: |-
        Een rechthoek is $3$ cm langer dan breed en heeft een oppervlakte van $40$ cm$^2$. Welke vergelijking past: $x + 3x = 40$, $x(x + 3) = 40$ of $x^2 + 3 = 40$? Hoe breed is de rechthoek?
      antwoord: |-
        $x(x + 3) = 40$; $5$ cm
      uitwerking: |-
        Breedte $x$, lengte $x + 3$, oppervlakte $x(x + 3)$. $x^2 + 3x - 40 = (x + 8)(x - 5) = 0$; een breedte is positief, dus $x = 5$ cm (en de lengte $8$ cm).
    - opgave: |-
        Het product van twee opeenvolgende even getallen is $168$. Welke getallen zijn het?
      antwoord: |-
        $12$ en $14$, of $-14$ en $-12$
      uitwerking: |-
        $x(x + 2) = 168$, dus $x^2 + 2x - 168 = (x + 14)(x - 12) = 0$.
    - opgave: |-
        Een getal en zijn kwadraat zijn samen $30$. Welk getal is het?
      antwoord: |-
        $5$ of $-6$
      uitwerking: |-
        $x^2 + x - 30 = (x + 6)(x - 5) = 0$. Beide voldoen: $25 + 5 = 30$ en $36 - 6 = 30$.
    - opgave: |-
        Een tuin van $12$ m op $8$ m krijgt in het midden een rechthoekig vijvertje. Rondom blijft overal een strook gras van dezelfde breedte. Het vijvertje is $32$ m$^2$. Hoe breed is de strook?
      antwoord: |-
        $2$ m
      uitwerking: |-
        Met strook $x$ is de vijver $(12 - 2x)(8 - 2x) = 32$, dus $4x^2 - 40x + 64 = 0$, of $x^2 - 10x + 16 = (x - 2)(x - 8) = 0$. Een strook van $8$ m kan niet ($8 - 16 < 0$): de strook is $2$ m breed, de vijver $8$ m op $4$ m.

- id: h3-o31
  soort: opdracht
  pakketten: [2, 3, 4, 5]
  niveau: 3
  thema: |-
    snijpunten van twee grafieken
  opgave: |-
    Bereken de snijpunten van de grafieken.
  lijst: enumerate
  delen:
    - opgave: |-
        $y = x^2 - 3$ en $y = -x^2 + 2x + 1$
      antwoord: |-
        $(2, 1)$ en $(-1, -2)$
      uitwerking: |-
        $x^2 - 3 = -x^2 + 2x + 1 \iff 2x^2 - 2x - 4 = 0 \iff x^2 - x - 2 = (x - 2)(x + 1) = 0$.
    - opgave: |-
        $y = x^2 + 1$ en $y = 2x$. Wat zie je op de grafiek?
      antwoord: |-
        één punt, $(1, 2)$: de rechte raakt de parabool
      uitwerking: |-
        $x^2 - 2x + 1 = (x - 1)^2 = 0$: één oplossing. De rechte raakt de parabool in $(1, 2)$.
    - opgave: |-
        $y = (x - 1)^2$ en $y = (x - 3)^2$. Leg uit waarom het snijpunt bij $x = 2$ moet liggen, zonder te rekenen.
      antwoord: |-
        $(2, 1)$
      uitwerking: |-
        De tweede parabool is de eerste, $2$ naar rechts verschoven. Ze zijn elkaars spiegelbeeld om de rechte $x = 2$, midden tussen de toppen $1$ en $3$, dus ze snijden elkaar op die rechte. Controle: $(2 - 1)^2 = 1 = (2 - 3)^2$.

- id: h3-symnul
  soort: kort
  pakketten: [2, 3, 4, 5]
  opgave: |-
    Bepaal de top met de nulwaarden, zonder de haakjes uit te werken.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = (x - 2)(x + 6)$
      antwoord: |-
        $(-2, -16)$
      uitwerking: |-
        Nulwaarden $2$ en $-6$; de as ligt in het midden, $x = -2$. $f(-2) = (-4) \cdot 4 = -16$.
    - opgave: |-
        $f(x) = -3(x - 1)(x - 5)$
      antwoord: |-
        $(3, 12)$
      uitwerking: |-
        Nulwaarden $1$ en $5$, as $x = 3$. $f(3) = -3 \cdot 2 \cdot (-2) = 12$.
    - opgave: |-
        $f(x) = (2x + 6)(x - 5)$
      antwoord: |-
        $(1, -32)$
      uitwerking: |-
        Nulwaarden $-3$ en $5$, as $x = 1$. $f(1) = 8 \cdot (-4) = -32$.
    - opgave: |-
        Een bal wordt opgegooid. Na $t$ seconden is hij $h(t) = -5t(t - 3)$ meter boven de grond. Hoe hoog komt hij?
      antwoord: |-
        $11,25$ m, na $1,5$ s
      uitwerking: |-
        $h(t) = 0$ bij $t = 0$ en $t = 3$; de top ligt in het midden, bij $t = 1,5$. $h(1,5) = -5 \cdot 1,5 \cdot (-1,5) = 11,25$.

# --- Test jezelf -----------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $4x^2 - 100 = 0$
      antwoord: |-
        $\pm 5$
      uitwerking: |-
        $x^2 = 25$.
    - opgave: |-
        $x^2 + 7x = 0$
      antwoord: |-
        $0$ of $-7$
      uitwerking: |-
        $x(x + 7) = 0$.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Los op door te ontbinden in factoren.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 - 9x + 20 = 0$
      antwoord: |-
        $4$ of $5$
      uitwerking: |-
        $(x - 4)(x - 5) = 0$.
    - opgave: |-
        $x^2 + 2x - 24 = 0$
      antwoord: |-
        $4$ of $-6$
      uitwerking: |-
        $(x - 4)(x + 6) = 0$.

- id: h3-t3
  soort: test
  niveau: 1
  opgave: |-
    Los op met de discriminant.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3x^2 - 5x - 2 = 0$
      antwoord: |-
        $2$ of $-\tfrac13$
      uitwerking: |-
        $D = 25 + 24 = 49$, $x = \tfrac{5 \pm 7}{6}$.
    - opgave: |-
        $x^2 - 6x + 7 = 0$
      antwoord: |-
        $3 \pm \sqrt2$
      uitwerking: |-
        $D = 36 - 28 = 8$, $x = \tfrac{6 \pm 2\sqrt2}{2} = 3 \pm \sqrt2$.

- id: h3-t4
  soort: test
  niveau: 1
  opgave: |-
    Hoeveel oplossingen heeft de vergelijking?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2x^2 - 3x + 4 = 0$
      antwoord: |-
        geen
      uitwerking: |-
        $D = 9 - 32 = -23 < 0$.
    - opgave: |-
        $4x^2 - 20x + 25 = 0$
      antwoord: |-
        één
      uitwerking: |-
        $D = 400 - 400 = 0$.

- id: h3-t5
  soort: test
  niveau: 2
  opgave: |-
    Los op: $(x - 2)(x + 3) = 14$.
  antwoord: |-
    $4$ of $-5$
  uitwerking: |-
    $x^2 + x - 6 = 14$, dus $x^2 + x - 20 = (x - 4)(x + 5) = 0$.

- id: h3-t6
  soort: test
  niveau: 2
  opgave: |-
    Bereken de snijpunten van de parabool $y = x^2 - 2x$ en de rechte $y = x + 4$.
  antwoord: |-
    $(4, 8)$ en $(-1, 3)$
  uitwerking: |-
    $x^2 - 2x = x + 4 \iff x^2 - 3x - 4 = 0 \iff (x - 4)(x + 1) = 0$. Voor $x = 4$ is $y = 8$, voor $x = -1$ is $y = 3$.

- id: h3-t7
  soort: test
  niveau: 2
  opgave: |-
    Een rechthoek is $5$ cm langer dan breed, en heeft een oppervlakte van $84$ cm$^2$. Hoe groot zijn de zijden?
  antwoord: |-
    $7$ cm en $12$ cm
  uitwerking: |-
    $b(b + 5) = 84$, dus $b^2 + 5b - 84 = 0$. $D = 25 + 336 = 361$, $b = \tfrac{-5 \pm 19}{2}$: $7$ of $-12$. De zijden zijn $7$ cm en $12$ cm.

- id: h3-t8
  soort: test
  pakketten: [4, 5]
  niveau: 2
  opgave: |-
    Ontbind $2x^2 + 5x - 3$ in factoren.
  antwoord: |-
    $(2x - 1)(x + 3)$
  uitwerking: |-
    $D = 25 + 24 = 49$, oplossingen $\tfrac{-5 \pm 7}{4}$: $\tfrac12$ en $-3$. Dus $2\bigl(x - \tfrac12\bigr)(x + 3) = (2x - 1)(x + 3)$.
