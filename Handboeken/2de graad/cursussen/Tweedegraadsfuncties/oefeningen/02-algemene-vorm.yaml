# Oefeningen van hoofdstuk 2 (de vorm ax^2 + bx + c). Zie Opmaak/oefeningenbank.py voor de velden.
# Dit hoofdstuk staat in pakket 2-5. pakketten: kwadraatafsplitsen in 4-5 (h2-afsplitsen, h2-o21, h2-o22),
# een opdracht met een familie parabolen in 5 (h2-o25). Testvraag h2-t7 heeft een variant voor 2-3 en een voor 4-5.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Werk uit.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(x + 5)^2$
      antwoord: |-
        $x^2 + 10x + 25$
      uitwerking: |-
        $x^2 + 2 \cdot 5x + 25$.
    - opgave: |-
        $(x - 4)^2$
      antwoord: |-
        $x^2 - 8x + 16$
      uitwerking: |-
        $x^2 - 2 \cdot 4x + 16$.
    - opgave: |-
        $(2x + 1)^2$
      antwoord: |-
        $4x^2 + 4x + 1$
      uitwerking: |-
        $(2x)^2 + 2 \cdot 2x \cdot 1 + 1$.
    - opgave: |-
        $-(x - 3)^2$
      antwoord: |-
        $-x^2 + 6x - 9$
      uitwerking: |-
        $-(x^2 - 6x + 9)$: elk teken verandert.
    - opgave: |-
        $3(x + 1)^2$
      antwoord: |-
        $3x^2 + 6x + 3$
      uitwerking: |-
        $3(x^2 + 2x + 1)$.
    - opgave: |-
        $(x + 2)(x - 6)$
      antwoord: |-
        $x^2 - 4x - 12$
      uitwerking: |-
        $x^2 - 6x + 2x - 12$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem de functie $f(x) = x^2 - 6x + 5$.
  lijst: enumerate
  delen:
    - opgave: |-
        Maak een tabel voor $x = 0, 1, 2, \ldots, 6$.
      antwoord: |-
        $5$, $0$, $-3$, $-4$, $-3$, $0$, $5$
      uitwerking: |-
        \waardetabel{7}{0 & 1 & 2 & 3 & 4 & 5 & 6}{5 & 0 & -3 & -4 & -3 & 0 & 5}
    - opgave: |-
        Welke waarden van $x$ geven dezelfde functiewaarde?
      antwoord: |-
        $0$ en $6$, $1$ en $5$, $2$ en $4$
      uitwerking: |-
        $f(0) = f(6) = 5$, $f(1) = f(5) = 0$, $f(2) = f(4) = -3$. De paren liggen symmetrisch rond $3$.
    - opgave: |-
        Waar ligt de top van de parabool, denk je?
      antwoord: |-
        $(3, -4)$
      uitwerking: |-
        In het midden van elk paar, bij $x = 3$: de top is $(3, -4)$.
    - opgave: |-
        Werk $(x - 3)^2 - 4$ uit. Wat merk je?
      antwoord: |-
        $x^2 - 6x + 5$: hetzelfde voorschrift
      uitwerking: |-
        $x^2 - 6x + 9 - 4 = x^2 - 6x + 5$. Het is hetzelfde voorschrift, in de topvorm met top $(3, -4)$.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h2-uitwerken
  soort: kort
  opgave: |-
    Schrijf in de algemene vorm, en geef $a$, $b$ en $c$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = (x + 4)^2 - 3$
      antwoord: |-
        $y = x^2 + 8x + 13$
      uitwerking: |-
        $x^2 + 8x + 16 - 3$: $a = 1$, $b = 8$, $c = 13$.
    - opgave: |-
        $y = -2(x - 1)^2 + 5$
      antwoord: |-
        $y = -2x^2 + 4x + 3$
      uitwerking: |-
        $-2(x^2 - 2x + 1) + 5 = -2x^2 + 4x - 2 + 5$: $a = -2$, $b = 4$, $c = 3$.
    - opgave: |-
        $y = 0,5(x + 2)^2$
      antwoord: |-
        $y = 0,5x^2 + 2x + 2$
      uitwerking: |-
        $0,5(x^2 + 4x + 4)$: $a = 0,5$, $b = 2$, $c = 2$.
    - opgave: |-
        $y = 7 - 3x^2 + x$
      antwoord: |-
        $y = -3x^2 + x + 7$
      uitwerking: |-
        Alleen de volgorde verandert: $a = -3$, $b = 1$, $c = 7$.

- id: h2-tweepunten
  soort: kort
  opgave: |-
    Zoek de symmetrieas met twee punten op dezelfde hoogte.
  lijst: enumerate
  delen:
    - opgave: |-
        Een parabool gaat door $(-1, 4)$ en $(5, 4)$. Wat is de symmetrieas?
      antwoord: |-
        $x = 2$
      uitwerking: |-
        In het midden: $\tfrac{-1 + 5}{2} = 2$.
    - opgave: |-
        Neem $f(x) = x^2 + 6x + 2$. Bereken $f(0)$. Voor welke andere $x$ is $f(x) = 2$? Wat is de symmetrieas?
      antwoord: |-
        $2$; $x = -6$; $x = -3$
      uitwerking: |-
        $f(0) = 2$. $x^2 + 6x + 2 = 2 \iff x(x + 6) = 0$: ook $x = -6$. De as ligt in het midden: $x = -3$.
    - opgave: |-
        Neem $g(x) = 2x^2 - 10x + 1$. Zoek de twee punten op hoogte $1$ en de symmetrieas.
      antwoord: |-
        $(0, 1)$ en $(5, 1)$; $x = 2,5$
      uitwerking: |-
        $2x^2 - 10x = 0 \iff 2x(x - 5) = 0$: $x = 0$ of $x = 5$. De as is $x = 2,5$.

- id: h2-top
  soort: kort
  opgave: |-
    Bereken de top van de parabool.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $y = x^2 - 8x + 3$
      antwoord: |-
        $(4, -13)$
      uitwerking: |-
        $x = -\tfrac{-8}{2} = 4$, $y = 16 - 32 + 3 = -13$.
    - opgave: |-
        $y = x^2 + 10x$
      antwoord: |-
        $(-5, -25)$
      uitwerking: |-
        $x = -\tfrac{10}{2} = -5$, $y = 25 - 50 = -25$.
    - opgave: |-
        $y = -x^2 + 4x + 1$
      antwoord: |-
        $(2, 5)$
      uitwerking: |-
        $x = -\tfrac{4}{-2} = 2$, $y = -4 + 8 + 1 = 5$.
    - opgave: |-
        $y = 3x^2 + 6x - 2$
      antwoord: |-
        $(-1, -5)$
      uitwerking: |-
        $x = -\tfrac{6}{6} = -1$, $y = 3 - 6 - 2 = -5$.
    - opgave: |-
        $y = -2x^2 + 12x - 10$
      antwoord: |-
        $(3, 8)$
      uitwerking: |-
        $x = -\tfrac{12}{-4} = 3$, $y = -18 + 36 - 10 = 8$.
    - opgave: |-
        $y = 0,5x^2 - 2x + 4$
      antwoord: |-
        $(2, 2)$
      uitwerking: |-
        $x = -\tfrac{-2}{1} = 2$, $y = 2 - 4 + 4 = 2$.

- id: h2-naartop
  soort: kort
  opgave: |-
    Schrijf in de topvorm.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = x^2 - 6x + 11$
      antwoord: |-
        $y = (x - 3)^2 + 2$
      uitwerking: |-
        Top: $x = 3$, $y = 9 - 18 + 11 = 2$.
    - opgave: |-
        $y = -x^2 - 4x + 1$
      antwoord: |-
        $y = -(x + 2)^2 + 5$
      uitwerking: |-
        Top: $x = -\tfrac{-4}{-2} = -2$, $y = -4 + 8 + 1 = 5$.
    - opgave: |-
        $y = 3x^2 - 6x$
      antwoord: |-
        $y = 3(x - 1)^2 - 3$
      uitwerking: |-
        Top: $x = 1$, $y = 3 - 6 = -3$.
    - opgave: |-
        $y = -0,5x^2 + 3x - 2$
      antwoord: |-
        $y = -0,5(x - 3)^2 + 2,5$
      uitwerking: |-
        Top: $x = -\tfrac{3}{-1} = 3$, $y = -4,5 + 9 - 2 = 2,5$.

- id: h2-afsplitsen
  soort: kort
  pakketten: [4, 5]
  opgave: |-
    Schrijf in de topvorm door kwadraatafsplitsen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $y = x^2 + 8x + 3$
      antwoord: |-
        $y = (x + 4)^2 - 13$
      uitwerking: |-
        $(x + 4)^2 - 16 + 3$.
    - opgave: |-
        $y = x^2 - 2x + 7$
      antwoord: |-
        $y = (x - 1)^2 + 6$
      uitwerking: |-
        $(x - 1)^2 - 1 + 7$.
    - opgave: |-
        $y = x^2 + 5x$
      antwoord: |-
        $y = (x + 2,5)^2 - 6,25$
      uitwerking: |-
        De helft van $5$ is $2,5$: $(x + 2,5)^2 - 6,25$.
    - opgave: |-
        $y = 2x^2 - 8x + 1$
      antwoord: |-
        $y = 2(x - 2)^2 - 7$
      uitwerking: |-
        $2(x^2 - 4x) + 1 = 2\bigl((x - 2)^2 - 4\bigr) + 1 = 2(x - 2)^2 - 8 + 1$.
    - opgave: |-
        $y = -x^2 + 6x$
      antwoord: |-
        $y = -(x - 3)^2 + 9$
      uitwerking: |-
        $-(x^2 - 6x) = -\bigl((x - 3)^2 - 9\bigr) = -(x - 3)^2 + 9$.

- id: h2-teken
  soort: kort
  opgave: |-
    Teken de grafiek met de top, het snijpunt met de $y$-as en zijn spiegelbeeld.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = -x^2 + 4x$
      antwoord: |-
        top $(2, 4)$, door $(0, 0)$ en $(4, 0)$
      uitwerking: |-
        Naar onder geopend, as $x = 2$, top $(2, 4)$. Door $(0, 0)$ en $(4, 0)$, en $(1, 3)$ en $(3, 3)$.
        \figuren{\begin{tikzpicture}[x=.45cm,y=.4cm]
          \rooster{-1}{1}{5}{-2}{1}{5}
          \symas{2}{-2}{5}
          \parabool{-1}{2}{4}{-.4}{4.4}
          \toppunt[above]{2}{4}{}
          \foreach \a in {0,1,3,4}{\punt{\a}{-(\a-2)^2+4}}
        \end{tikzpicture}}
    - opgave: |-
        $g(x) = 0,5x^2 - x - 1,5$
      antwoord: |-
        top $(1, -2)$, door $(0;\ -1,5)$ en $(2;\ -1,5)$
      uitwerking: |-
        Naar boven geopend, as $x = -\tfrac{-1}{1} = 1$, top $(1, -2)$. Door $(0;\ -1,5)$ en $(2;\ -1,5)$, en $(-1, 0)$ en $(3, 0)$.
        \figuren{\begin{tikzpicture}[x=.45cm,y=.4cm]
          \rooster{-2}{1}{4}{-3}{1}{3}
          \symas{1}{-3}{3}
          \parabool{.5}{1}{-2}{-2.2}{4.2}
          \toppunt[below]{1}{-2}{}
          \foreach \a in {-1,0,2,3}{\punt{\a}{(\a-1)^2/2-2}}
        \end{tikzpicture}}

- id: h2-kenmerken
  soort: kort
  opgave: |-
    Geef de top, het extremum, het bereik, waar de functie stijgt en daalt, en het snijpunt met de $y$-as.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^2 - 2x - 8$
      antwoord: |-
        $(1, -9)$; min.\ $-9$; $\ivgo{-9}{\pinf}$; dalend op $\ivog{\minf}{1}$, stijgend op $\ivgo{1}{\pinf}$; $(0, -8)$
      uitwerking: |-
        Top: $x = 1$, $y = 1 - 2 - 8 = -9$. $a > 0$: minimum $-9$ in $x = 1$, bereik $\ivgo{-9}{\pinf}$, dalend op $\ivog{\minf}{1}$ en stijgend op $\ivgo{1}{\pinf}$. Snijpunt met de $y$-as: $(0, -8)$.
    - opgave: |-
        $g(x) = -3x^2 - 6x + 2$
      antwoord: |-
        $(-1, 5)$; max.\ $5$; $\ivog{\minf}{5}$; stijgend op $\ivog{\minf}{-1}$, dalend op $\ivgo{-1}{\pinf}$; $(0, 2)$
      uitwerking: |-
        Top: $x = -\tfrac{-6}{-6} = -1$, $y = -3 + 6 + 2 = 5$. $a < 0$: maximum $5$ in $x = -1$, bereik $\ivog{\minf}{5}$, stijgend op $\ivog{\minf}{-1}$ en dalend op $\ivgo{-1}{\pinf}$. Snijpunt met de $y$-as: $(0, 2)$.

- id: h2-maxmin
  soort: kort
  opgave: |-
    Los op met de top van een parabool.
  lijst: enumerate
  delen:
    - opgave: |-
        Twee getallen hebben als som $20$. Voor welke getallen is hun product het grootst?
      antwoord: |-
        $10$ en $10$, product $100$
      uitwerking: |-
        Noem de getallen $x$ en $20 - x$. Het product is $P(x) = x(20 - x) = -x^2 + 20x$. Top: $x = -\tfrac{20}{-2} = 10$, $P(10) = 100$. De getallen zijn $10$ en $10$.
    - opgave: |-
        Een kraam op de schoolfuif verkoopt smoothies. Bij een prijs van $p$ euro is de winst $W(p) = -10p^2 + 120p - 200$ euro. Welke prijs geeft de grootste winst, en hoe groot is die?
      antwoord: |-
        $6$ euro; $160$ euro winst
      uitwerking: |-
        Top: $p = -\tfrac{120}{-20} = 6$, $W(6) = -360 + 720 - 200 = 160$. Bij $6$ euro per smoothie is de winst het grootst: $160$ euro.

# --- Opdrachten ------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    van topvorm naar algemene vorm
  opgave: |-
    Schrijf in de algemene vorm.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = 3(x - 1)^2 + 2$
      antwoord: |-
        $3x^2 - 6x + 5$
    - opgave: |-
        $y = -(x + 2)^2 + 4$
      antwoord: |-
        $-x^2 - 4x$
    - opgave: |-
        $y = (x - 5)^2$
      antwoord: |-
        $x^2 - 10x + 25$
    - opgave: |-
        $y = 2(x + 3)^2 - 18$
      antwoord: |-
        $2x^2 + 12x$
    - opgave: |-
        $y = -0,5(x - 4)^2 + 1$
      antwoord: |-
        $-0,5x^2 + 4x - 7$
    - opgave: |-
        $y = (x + 1)(x - 3)$
      antwoord: |-
        $x^2 - 2x - 3$
    - opgave: |-
        $y = x(4 - x)$
      antwoord: |-
        $-x^2 + 4x$
    - opgave: |-
        $y = (2x - 1)^2 - 3$
      antwoord: |-
        $4x^2 - 4x - 2$
  uitwerking: |-
    \textbf{a.}~$3(x^2 - 2x + 1) + 2$. \textbf{b.}~$-(x^2 + 4x + 4) + 4$. \textbf{c.}~Het merkwaardig product. \textbf{d.}~$2(x^2 + 6x + 9) - 18$. \textbf{e.}~$-0,5(x^2 - 8x + 16) + 1 = -0,5x^2 + 4x - 8 + 1$. \textbf{f.}~$x^2 - 3x + x - 3$. \textbf{g.}~$4x - x^2$. \textbf{h.}~$4x^2 - 4x + 1 - 3$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    de top berekenen
  opgave: |-
    Bereken de top.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = x^2 - 10x + 21$
      antwoord: |-
        $(5, -4)$
    - opgave: |-
        $y = x^2 + 4x$
      antwoord: |-
        $(-2, -4)$
    - opgave: |-
        $y = -x^2 + 2x + 3$
      antwoord: |-
        $(1, 4)$
    - opgave: |-
        $y = 3x^2 - 12x + 5$
      antwoord: |-
        $(2, -7)$
    - opgave: |-
        $y = -2x^2 - 8x - 3$
      antwoord: |-
        $(-2, 5)$
    - opgave: |-
        $y = 0,5x^2 + 3x$
      antwoord: |-
        $(-3;\ -4,5)$
    - opgave: |-
        $y = x^2 - 3x + 2$
      antwoord: |-
        $(1,5;\ -0,25)$
    - opgave: |-
        $y = -4x^2 + 4x$
      antwoord: |-
        $(0,5;\ 1)$
  uitwerking: |-
    Telkens $x = -\tfrac{b}{2a}$ en dan invullen. \textbf{a.}~$x = 5$, $25 - 50 + 21 = -4$. \textbf{b.}~$x = -2$, $4 - 8 = -4$. \textbf{c.}~$x = -\tfrac{2}{-2} = 1$, $-1 + 2 + 3 = 4$. \textbf{d.}~$x = \tfrac{12}{6} = 2$, $12 - 24 + 5 = -7$. \textbf{e.}~$x = -\tfrac{-8}{-4} = -2$, $-8 + 16 - 3 = 5$. \textbf{f.}~$x = -\tfrac{3}{1} = -3$, $4,5 - 9 = -4,5$. \textbf{g.}~$x = 1,5$, $2,25 - 4,5 + 2 = -0,25$. \textbf{h.}~$x = -\tfrac{4}{-8} = 0,5$, $-1 + 2 = 1$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    snijpunt met de y-as en opening
  opgave: |-
    Geef het snijpunt met de $y$-as. Is de parabool naar boven of naar onder geopend?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $y = 2x^2 - 5x + 7$
      antwoord: |-
        $(0, 7)$; boven
    - opgave: |-
        $y = -x^2 + 3$
      antwoord: |-
        $(0, 3)$; onder
    - opgave: |-
        $y = 4x - x^2$
      antwoord: |-
        $(0, 0)$; onder
    - opgave: |-
        $y = (x - 2)^2$
      antwoord: |-
        $(0, 4)$; boven
    - opgave: |-
        $y = -3(x + 1)^2 + 5$
      antwoord: |-
        $(0, 2)$; onder
    - opgave: |-
        $y = 0,1x^2 - 6$
      antwoord: |-
        $(0, -6)$; boven
  uitwerking: |-
    Het snijpunt met de $y$-as is $(0, f(0))$. In de algemene vorm is dat $(0, c)$. In de topvorm vul je $x = 0$ in: $(0 - 2)^2 = 4$ en $-3 \cdot 1 + 5 = 2$. De opening volgt uit het teken van $a$; bij $4x - x^2$ is $a = -1$.

- id: h2-o24
  soort: opdracht
  niveau: 1
  thema: |-
    functiewaarden van ax² + bx + c
  opgave: |-
    Gegeven is $f(x) = 2x^2 - 3x - 1$. Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(0)$
      antwoord: |-
        $-1$
    - opgave: |-
        $f(2)$
      antwoord: |-
        $1$
    - opgave: |-
        $f(-1)$
      antwoord: |-
        $4$
    - opgave: |-
        $f(0,5)$
      antwoord: |-
        $-2$
    - opgave: |-
        $f(-3)$
      antwoord: |-
        $26$
    - opgave: |-
        $f(10)$
      antwoord: |-
        $169$
  uitwerking: |-
    $f(2) = 8 - 6 - 1 = 1$, $f(-1) = 2 + 3 - 1 = 4$, $f(0,5) = 0,5 - 1,5 - 1 = -2$, $f(-3) = 18 + 9 - 1 = 26$, $f(10) = 200 - 30 - 1 = 169$. Let op: $-3 \cdot (-1) = +3$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    tweedegraadsfuncties herkennen
  opgave: |-
    Is het een tweedegraadsfunctie? Geef dan $a$, $b$ en $c$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = 5 - 2x^2$
      antwoord: |-
        ja: $-2$, $0$, $5$
    - opgave: |-
        $y = 3x - 1$
      antwoord: |-
        nee
    - opgave: |-
        $y = x(x - 7)$
      antwoord: |-
        ja: $1$, $-7$, $0$
    - opgave: |-
        $y = (x + 2)^2 - x^2$
      antwoord: |-
        nee
    - opgave: |-
        $y = \dfrac{x^2}{4}$
      antwoord: |-
        ja: $\tfrac14$, $0$, $0$
    - opgave: |-
        $y = \dfrac{1}{x^2}$
      antwoord: |-
        nee
    - opgave: |-
        $y = (3 - x)(3 + x)$
      antwoord: |-
        ja: $-1$, $0$, $9$
    - opgave: |-
        $y = 7$
      antwoord: |-
        nee
  uitwerking: |-
    \textbf{a.}~$a = -2$, $b = 0$, $c = 5$. \textbf{b.}~Eerste graad. \textbf{c.}~$x^2 - 7x$. \textbf{d.}~$x^2 + 4x + 4 - x^2 = 4x + 4$: de termen in $x^2$ vallen weg, dus eerste graad. \textbf{e.}~$a = \tfrac14$. \textbf{f.}~$x^2$ staat in de noemer: geen tweedegraadsfunctie. \textbf{g.}~$9 - x^2$. \textbf{h.}~Een constante functie.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    de grafiek tekenen
  opgave: |-
    Teken de grafiek.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = x^2 - 6x + 8$
      antwoord: |-
        top $(3, -1)$
      uitwerking: |-
        Top $(3, -1)$; $(0, 8)$ en $(6, 8)$; $(2, 0)$ en $(4, 0)$.
        \figuren{\begin{tikzpicture}[x=.35cm,y=.25cm]
          \rooster{-1}{1}{7}{-2}{1}{9}
          \symas{3}{-2}{9}
          \parabool{1}{3}{-1}{-.1}{6.1}
          \toppunt[below]{3}{-1}{}
          \foreach \a in {0,2,4,6}{\punt{\a}{(\a-3)^2-1}}
        \end{tikzpicture}}
    - opgave: |-
        $g(x) = -x^2 - 2x + 3$
      antwoord: |-
        top $(-1, 4)$
      uitwerking: |-
        Top $(-1, 4)$; $(0, 3)$ en $(-2, 3)$; $(1, 0)$ en $(-3, 0)$.
        \figuren{\begin{tikzpicture}[x=.35cm,y=.35cm]
          \rooster{-4}{1}{2}{-2}{1}{5}
          \symas{-1}{-2}{5}
          \parabool{-1}{-1}{4}{-3.4}{1.4}
          \toppunt[above]{-1}{4}{}
          \foreach \a in {-3,-2,0,1}{\punt{\a}{-(\a+1)^2+4}}
        \end{tikzpicture}}
    - opgave: |-
        $h(x) = 2x^2 + 4x$
      antwoord: |-
        top $(-1, -2)$
      uitwerking: |-
        Top $(-1, -2)$; $(0, 0)$ en $(-2, 0)$; $(1, 6)$ en $(-3, 6)$.
        \figuren{\begin{tikzpicture}[x=.35cm,y=.25cm]
          \rooster{-4}{1}{2}{-3}{1}{7}
          \symas{-1}{-3}{7}
          \parabool{2}{-1}{-2}{-3.1}{1.1}
          \toppunt[below]{-1}{-2}{}
          \foreach \a in {-3,-2,0,1}{\punt{\a}{2*(\a+1)^2-2}}
        \end{tikzpicture}}

- id: h2-o6
  soort: opdracht
  niveau: 2
  thema: |-
    kenmerken van een tweedegraadsfunctie
  opgave: |-
    Geef de top, het extremum, het bereik, waar de functie stijgt en daalt, en het snijpunt met de $y$-as.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = x^2 - 8x + 12$
      antwoord: |-
        $(4, -4)$; min.\ $-4$; $\ivgo{-4}{\pinf}$; dalend op $\ivog{\minf}{4}$, stijgend op $\ivgo{4}{\pinf}$; $(0, 12)$
      uitwerking: |-
        $x = 4$, $y = 16 - 32 + 12 = -4$. $a > 0$, dus een minimum.
    - opgave: |-
        $g(x) = -3x^2 + 6x + 1$
      antwoord: |-
        $(1, 4)$; max.\ $4$; $\ivog{\minf}{4}$; stijgend op $\ivog{\minf}{1}$, dalend op $\ivgo{1}{\pinf}$; $(0, 1)$
      uitwerking: |-
        $x = -\tfrac{6}{-6} = 1$, $y = -3 + 6 + 1 = 4$. $a < 0$, dus een maximum.
    - opgave: |-
        $h(x) = 0,5x^2 + 2x - 1$
      antwoord: |-
        $(-2, -3)$; min.\ $-3$; $\ivgo{-3}{\pinf}$; dalend op $\ivog{\minf}{-2}$, stijgend op $\ivgo{-2}{\pinf}$; $(0, -1)$
      uitwerking: |-
        $x = -\tfrac{2}{1} = -2$, $y = 2 - 4 - 1 = -3$. $a > 0$, dus een minimum.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    grootste oppervlakte van een rechthoek
  opgave: |-
    Een rechthoek heeft een omtrek van $20$ m. Noem de lengte $x$ (in m).
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de breedte $10 - x$ is, en geef de oppervlakte $A(x)$ in de algemene vorm.
      antwoord: |-
        $A(x) = -x^2 + 10x$
      uitwerking: |-
        Lengte plus breedte is de helft van de omtrek: $10$. Dus de breedte is $10 - x$ en $A(x) = x(10 - x) = -x^2 + 10x$.
    - opgave: |-
        Welke waarden van $x$ hebben hier zin?
      antwoord: |-
        $\ivoo{0}{10}$
      uitwerking: |-
        Lengte en breedte moeten positief zijn: $x > 0$ en $10 - x > 0$, dus $0 < x < 10$.
    - opgave: |-
        Welke rechthoek heeft de grootste oppervlakte?
      antwoord: |-
        het vierkant van $5$ m op $5$ m, $25$ m$^2$
      uitwerking: |-
        Top: $x = -\tfrac{10}{-2} = 5$, $A(5) = 25$. De lengte en de breedte zijn allebei $5$ m: een vierkant.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    van algemene vorm naar topvorm
  opgave: |-
    Schrijf in de topvorm.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = x^2 + 8x + 10$
      antwoord: |-
        $y = (x + 4)^2 - 6$
      uitwerking: |-
        Top: $x = -4$, $y = 16 - 32 + 10 = -6$.
    - opgave: |-
        $y = -x^2 + 6x - 4$
      antwoord: |-
        $y = -(x - 3)^2 + 5$
      uitwerking: |-
        Top: $x = 3$, $y = -9 + 18 - 4 = 5$.
    - opgave: |-
        $y = 2x^2 - 4x + 7$
      antwoord: |-
        $y = 2(x - 1)^2 + 5$
      uitwerking: |-
        Top: $x = 1$, $y = 2 - 4 + 7 = 5$.
    - opgave: |-
        $y = -3x^2 - 12x$
      antwoord: |-
        $y = -3(x + 2)^2 + 12$
      uitwerking: |-
        Top: $x = -\tfrac{-12}{-6} = -2$, $y = -12 + 24 = 12$.
    - opgave: |-
        $y = 0,5x^2 - 5x + 8$
      antwoord: |-
        $y = 0,5(x - 5)^2 - 4,5$
      uitwerking: |-
        Top: $x = 5$, $y = 12,5 - 25 + 8 = -4,5$.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    een opgegooide bal
  opgave: |-
    Iemand gooit een bal omhoog. Na $t$ seconden is de bal $h(t) = -5t^2 + 15t + 2$ meter hoog.
  lijst: enumerate
  delen:
    - opgave: |-
        Op welke hoogte verlaat de bal de hand?
      antwoord: |-
        $2$ m
      uitwerking: |-
        $h(0) = 2$ m.
    - opgave: |-
        Hoe hoog komt de bal, en na hoeveel seconden?
      antwoord: |-
        $13,25$ m na $1,5$ s
      uitwerking: |-
        Top: $t = -\tfrac{15}{-10} = 1,5$, $h(1,5) = -11,25 + 22,5 + 2 = 13,25$ m.
    - opgave: |-
        Wanneer is de bal weer op $2$ m hoogte?
      antwoord: |-
        na $3$ s
      uitwerking: |-
        Het spiegelbeeld van $t = 0$ om de as $t = 1,5$ is $t = 3$. Controle: $h(3) = -45 + 45 + 2 = 2$.
    - opgave: |-
        Schrijf $h(t)$ in de topvorm.
      antwoord: |-
        $h(t) = -5(t - 1,5)^2 + 13,25$
      uitwerking: |-
        $a = -5$ en de top is $(1,5;\ 13,25)$.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    grafiek en algemene vorm koppelen
  opgave: |-
    Welke grafiek hoort bij welk voorschrift? Gebruik het snijpunt met de $y$-as en de top.
    \[y = x^2 - 4x + 3 \qquad y = -x^2 + 4x - 3 \qquad y = x^2 + 2x + 3 \qquad y = -x^2 - 2x + 3\]
    \figuren{\begin{tikzpicture}[x=.3cm,y=.3cm]
      \rooster{-4}{1}{4}{-4}{1}{5}
      \parabool{-1}{-1}{4}{-3.83}{1.83}
      \node[font=\scriptsize\bfseries] at (0,-6) {A};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.3cm,y=.3cm]
      \rooster{-4}{1}{4}{-4}{1}{5}
      \parabool{1}{2}{-1}{-.45}{4}
      \node[font=\scriptsize\bfseries] at (0,-6) {B};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.3cm,y=.3cm]
      \rooster{-4}{1}{4}{-4}{1}{5}
      \parabool{-1}{2}{1}{-.24}{4}
      \node[font=\scriptsize\bfseries] at (0,-6) {C};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.3cm,y=.3cm]
      \rooster{-4}{1}{4}{-4}{1}{5}
      \parabool{1}{-1}{2}{-2.73}{.73}
      \node[font=\scriptsize\bfseries] at (0,-6) {D};
    \end{tikzpicture}}
  antwoord: |-
    A: $y = -x^2 - 2x + 3$, B: $y = x^2 - 4x + 3$, C: $y = -x^2 + 4x - 3$, D: $y = x^2 + 2x + 3$
  uitwerking: |-
    Drie grafieken snijden de $y$-as in $(0, 3)$, één in $(0, -3)$: dat is C, met $y = -x^2 + 4x - 3$ (naar onder geopend, top $(2, 1)$). Van de andere is A naar onder geopend: $y = -x^2 - 2x + 3$, met top $(-1, 4)$. B en D zijn naar boven geopend. De top van $y = x^2 - 4x + 3$ ligt bij $x = 2$: dat is B, met top $(2, -1)$. De top van $y = x^2 + 2x + 3$ ligt bij $x = -1$: dat is D, met top $(-1, 2)$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    grootste opbrengst
  opgave: |-
    Een fietsverhuurder verhuurt in de zomer elke dag $80$ fietsen aan $12$ euro per dag. Uit ervaring weet hij: per euro dat hij de prijs verhoogt, verhuurt hij $5$ fietsen minder. Noem $k$ het aantal euro dat hij de prijs verhoogt.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de opbrengst per dag bij een prijs van $12$ euro en bij een prijs van $15$ euro.
      antwoord: |-
        $960$ euro en $975$ euro
      uitwerking: |-
        $12 \cdot 80 = 960$ euro. Bij $15$ euro is $k = 3$: $80 - 15 = 65$ fietsen, dus $15 \cdot 65 = 975$ euro.
    - opgave: |-
        Toon aan dat de opbrengst $O(k) = (12 + k)(80 - 5k)$ is, en schrijf $O(k)$ in de algemene vorm.
      antwoord: |-
        $O(k) = -5k^2 + 20k + 960$
      uitwerking: |-
        De prijs is $12 + k$ euro, het aantal fietsen $80 - 5k$. Uitwerken: $960 - 60k + 80k - 5k^2 = -5k^2 + 20k + 960$.
    - opgave: |-
        Bij welke prijs is de opbrengst het grootst? Hoe groot is ze dan?
      antwoord: |-
        $14$ euro; $980$ euro
      uitwerking: |-
        Top: $k = -\tfrac{20}{-10} = 2$. De prijs is $14$ euro, met $70$ fietsen: $O(2) = 980$ euro.

- id: h2-o21
  soort: opdracht
  pakketten: [4, 5]
  niveau: 2
  thema: |-
    kwadraatafsplitsen
  opgave: |-
    Schrijf in de topvorm door kwadraatafsplitsen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = x^2 - 10x + 30$
      antwoord: |-
        $y = (x - 5)^2 + 5$
      uitwerking: |-
        $(x - 5)^2 - 25 + 30$.
    - opgave: |-
        $y = x^2 + 3x + 1$
      antwoord: |-
        $y = (x + 1,5)^2 - 1,25$
      uitwerking: |-
        $(x + 1,5)^2 - 2,25 + 1$.
    - opgave: |-
        $y = -x^2 + 8x - 10$
      antwoord: |-
        $y = -(x - 4)^2 + 6$
      uitwerking: |-
        $-(x^2 - 8x) - 10 = -\bigl((x - 4)^2 - 16\bigr) - 10 = -(x - 4)^2 + 16 - 10$.
    - opgave: |-
        $y = 3x^2 + 18x + 20$
      antwoord: |-
        $y = 3(x + 3)^2 - 7$
      uitwerking: |-
        $3(x^2 + 6x) + 20 = 3\bigl((x + 3)^2 - 9\bigr) + 20 = 3(x + 3)^2 - 27 + 20$.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    eigenschappen van de algemene vorm: waar of niet waar
  opgave: |-
    Waar of niet waar? Verklaar je antwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        De parabool $y = 2x^2 + bx + 5$ snijdt de $y$-as in $(0, 5)$, welk getal $b$ ook is.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $f(0) = 5$ voor elke $b$.
    - opgave: |-
        De top van $y = x^2 + 6x$ ligt op de $y$-as.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: de top ligt bij $x = -3$.
    - opgave: |-
        Als $b = 0$, ligt de top van $y = ax^2 + bx + c$ op de $y$-as.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $-\tfrac{0}{2a} = 0$.
    - opgave: |-
        De functie $f(x) = -x^2 + 4x + 1$ heeft een minimum.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $a < 0$, dus een maximum ($5$ in $x = 2$).
    - opgave: |-
        Als $a > 0$ en $c < 0$, heeft $y = ax^2 + bx + c$ twee nulwaarden.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: het punt $(0, c)$ ligt onder de $x$-as, en de parabool is naar boven geopend. Links en rechts stijgt ze boven de $x$-as uit, dus ze snijdt de as twee keer.
    - opgave: |-
        Twee parabolen met dezelfde top zijn gelijk.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $y = x^2$ en $y = 3x^2$ hebben dezelfde top, maar een andere vorm.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    kleinste kost
  opgave: |-
    Een transportbedrijf berekent de brandstofkost van een vrachtwagen per $100$ km als $K(v) = 0,02v^2 - 3,2v + 180$ euro, met $v$ de snelheid in km/h (tussen $50$ en $110$ km/h).
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de kost bij $60$ km/h en bij $100$ km/h.
      antwoord: |-
        allebei $60$ euro
      uitwerking: |-
        $K(60) = 72 - 192 + 180 = 60$ en $K(100) = 200 - 320 + 180 = 60$.
    - opgave: |-
        Bij welke snelheid is de kost het kleinst? Hoe groot is die kost?
      antwoord: |-
        $80$ km/h; $52$ euro
      uitwerking: |-
        Top: $v = -\tfrac{-3,2}{0,04} = 80$, $K(80) = 128 - 256 + 180 = 52$ euro.
    - opgave: |-
        Bij welke andere snelheid is de kost even groot als bij $70$ km/h? Reken niet, maar redeneer.
      antwoord: |-
        $90$ km/h
      uitwerking: |-
        De as is $v = 80$. $70$ ligt $10$ links van de as, dus $90$ ligt even ver rechts, op dezelfde hoogte. Zo ook bij vraag a: $60$ en $100$ liggen symmetrisch om $80$.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift uit de top en een punt, in de algemene vorm
  opgave: |-
    Geef het voorschrift van de parabool in de algemene vorm.
  lijst: enumerate
  delen:
    - opgave: |-
        De top is $(2, -3)$ en de parabool gaat door $(0, 5)$.
      antwoord: |-
        $y = 2x^2 - 8x + 5$
      uitwerking: |-
        $y = a(x - 2)^2 - 3$ door $(0, 5)$: $5 = 4a - 3$, dus $a = 2$. Uitwerken: $2(x^2 - 4x + 4) - 3 = 2x^2 - 8x + 5$.
    - opgave: |-
        De top is $(-1, 4)$ en de parabool gaat door $(1, 0)$.
      antwoord: |-
        $y = -x^2 - 2x + 3$
      uitwerking: |-
        $y = a(x + 1)^2 + 4$ door $(1, 0)$: $0 = 4a + 4$, dus $a = -1$. Uitwerken: $-(x^2 + 2x + 1) + 4 = -x^2 - 2x + 3$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    symmetrie gebruiken om b en c te vinden
  opgave: |-
    De parabool $y = x^2 + bx + c$ gaat door de punten $(1, 5)$ en $(7, 5)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de symmetrieas?
      antwoord: |-
        $x = 4$
      uitwerking: |-
        De punten liggen op dezelfde hoogte, dus de as ligt in het midden: $x = \tfrac{1 + 7}{2} = 4$.
    - opgave: |-
        Bepaal $b$.
      antwoord: |-
        $b = -8$
      uitwerking: |-
        $-\tfrac{b}{2} = 4$, dus $b = -8$.
    - opgave: |-
        Bepaal $c$, en geef de top.
      antwoord: |-
        $c = 12$; top $(4, -4)$
      uitwerking: |-
        Door $(1, 5)$: $1 - 8 + c = 5$, dus $c = 12$. Top: $16 - 32 + 12 = -4$, dus $(4, -4)$.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    kenmerken aflezen en controleren
  opgave: |-
    De figuur toont de grafiek van een tweedegraadsfunctie $f$.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.4cm,y=.4cm]
        \rooster{-3}{1}{5}{-3}{1}{5}
        \parabool{-.5}{1}{4.5}{-2.6}{4.6}
        \punt{1}{4.5}\punt{-2}{0}\punt{4}{0}\punt{0}{4}\punt{2}{4}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Lees de top, de nulwaarden en het snijpunt met de $y$-as af.
      antwoord: |-
        $(1;\ 4,5)$; $-2$ en $4$; $(0, 4)$
      uitwerking: |-
        De top ligt halverwege tussen $4$ en $5$: $(1;\ 4,5)$. De nulwaarden zijn $-2$ en $4$, symmetrisch om $x = 1$. Het snijpunt met de $y$-as is $(0, 4)$.
    - opgave: |-
        Geef het bereik, en waar $f$ stijgt en daalt.
      antwoord: |-
        $\ivog{\minf}{4,5}$; stijgend op $\ivog{\minf}{1}$, dalend op $\ivgo{1}{\pinf}$
      uitwerking: |-
        Maximum $4,5$ in $x = 1$.
    - opgave: |-
        Maak het tekenschema van $f$. Waar is de stijging afnemend, en waar is de daling toenemend?
      antwoord: |-
        $f(x) > 0$ op $\ivoo{-2}{4}$, $f(x) < 0$ daarbuiten; afnemende stijging op $\ivog{\minf}{1}$, toenemende daling op $\ivgo{1}{\pinf}$
      uitwerking: |-
        \tekenschema{5}{ & -2 & & 4 & }{- & 0 & + & 0 & -} Tussen de nulwaarden ligt de grafiek boven de $x$-as, erbuiten eronder. De parabool is naar onder geopend: tot aan de top stijgt ze steeds minder steil, daarna daalt ze steeds steiler.
    - opgave: |-
        Toon aan dat $f(x) = -0,5x^2 + x + 4$ bij de grafiek past.
      antwoord: |-
        top $(1;\ 4,5)$, $f(-2) = f(4) = 0$
      uitwerking: |-
        $c = 4$ klopt. Top: $x = -\tfrac{1}{-1} = 1$, $f(1) = -0,5 + 1 + 4 = 4,5$. En $f(4) = -8 + 4 + 4 = 0$, $f(-2) = -2 - 2 + 4 = 0$.

- id: h2-o17
  soort: opdracht
  niveau: 3
  thema: |-
    foutenjacht bij de top
  opgave: |-
    Lies berekent de top van $f(x) = -2x^2 + 8x - 1$ zo:
    \[x = -\frac{8}{2 \cdot 2} = -2, \qquad f(-2) = -2 \cdot (-2)^2 + 8 \cdot (-2) - 1 = -25, \qquad \text{top } (-2, -25).\]
  lijst: enumerate
  delen:
    - opgave: |-
        Zonder te rekenen: waarom kan $-25$ niet de $y$-coördinaat van de top zijn? Gebruik $f(0)$.
      antwoord: |-
        de top is het hoogste punt, en $f(0) = -1 > -25$
      uitwerking: |-
        $a < 0$, dus de top is het hoogste punt. Maar $f(0) = -1$ ligt al hoger dan $-25$.
    - opgave: |-
        Welke fout maakt Lies? Geef de juiste top.
      antwoord: |-
        $a = -2$, niet $2$; top $(2, 7)$
      uitwerking: |-
        Ze vult $a = 2$ in in plaats van $a = -2$. Juist: $x = -\tfrac{8}{2 \cdot (-2)} = 2$ en $f(2) = -8 + 16 - 1 = 7$. De top is $(2, 7)$.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    grootste en kleinste product
  opgave: |-
    Los op met de top van een parabool.
  lijst: enumerate
  delen:
    - opgave: |-
        Twee getallen hebben als som $14$. Hoe groot kan hun product hoogstens zijn?
      antwoord: |-
        $49$
      uitwerking: |-
        $P(x) = x(14 - x) = -x^2 + 14x$. Top: $x = 7$, $P(7) = 49$.
    - opgave: |-
        Twee getallen verschillen $10$. Hoe klein kan hun product zijn? Welke getallen zijn het dan?
      antwoord: |-
        $-25$, voor $-5$ en $5$
      uitwerking: |-
        Neem $x$ en $x + 10$. $P(x) = x(x + 10) = x^2 + 10x$, met $a > 0$: een minimum. Top: $x = -5$, $P(-5) = -25$. De getallen zijn $-5$ en $5$.

- id: h2-o18
  soort: opdracht
  niveau: 3
  thema: |-
    de top met een onbekend getal
  opgave: |-
    Bepaal het onbekende getal.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $c$ ligt de top van $y = x^2 - 6x + c$ op de $x$-as?
      antwoord: |-
        $c = 9$
      uitwerking: |-
        De top ligt bij $x = 3$. Op de $x$-as: $9 - 18 + c = 0$, dus $c = 9$. Dan is $y = (x - 3)^2$.
    - opgave: |-
        Voor welke $b$ heeft $y = x^2 + bx + 5$ als symmetrieas $x = -2$?
      antwoord: |-
        $b = 4$
      uitwerking: |-
        $-\tfrac{b}{2} = -2$, dus $b = 4$.
    - opgave: |-
        Voor welke $a$ ligt de top van $y = ax^2 + 4x + 1$ bij $x = 1$? Is de top dan het hoogste of het laagste punt?
      antwoord: |-
        $a = -2$; het hoogste punt
      uitwerking: |-
        $-\tfrac{4}{2a} = 1$, dus $2a = -4$ en $a = -2$. Omdat $a < 0$ is de top het hoogste punt, $(1, 3)$.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    de doorsnede van een tunnel
  opgave: |-
    De doorsnede van een tunnel is een parabool met voorschrift $y = -0,25x^2 + 2x$. De oorsprong ligt links onderaan op de weg, en de eenheid is $1$ m.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe hoog is de tunnel in het midden?
      antwoord: |-
        $4$ m
      uitwerking: |-
        Top: $x = -\tfrac{2}{-0,5} = 4$, $y = -4 + 8 = 4$ m.
    - opgave: |-
        Hoe breed is de tunnel op de weg? Gebruik de symmetrie.
      antwoord: |-
        $8$ m
      uitwerking: |-
        De linkervoet ligt in $(0, 0)$, $4$ m links van de as. De rechtervoet ligt $4$ m rechts ervan: in $(8, 0)$. De tunnel is $8$ m breed.
    - opgave: |-
        Een vrachtwagen is $2,5$ m breed en $3,5$ m hoog. Kan hij door de tunnel als hij precies in het midden rijdt?
      antwoord: |-
        ja
      uitwerking: |-
        De zijkanten van de vrachtwagen zitten op $x = 4 - 1,25 = 2,75$ en $x = 5,25$. Daar is de tunnel $-0,25 \cdot 2,75^2 + 2 \cdot 2,75 \approx 3,61$ m hoog: meer dan $3,5$ m.
    - opgave: |-
        En een vrachtwagen van $3$ m breed en $3,5$ m hoog?
      antwoord: |-
        nee
      uitwerking: |-
        Bij $x = 2,5$ is de tunnel $-0,25 \cdot 6,25 + 5 \approx 3,44$ m hoog: te laag voor de bovenhoeken.

- id: h2-o22
  soort: opdracht
  pakketten: [4, 5]
  niveau: 3
  thema: |-
    b en c uit de top
  opgave: |-
    Bepaal de onbekende getallen.
  lijst: enumerate
  delen:
    - opgave: |-
        De parabool $y = x^2 + bx + c$ heeft als top $(3, -2)$.
      antwoord: |-
        $b = -6$, $c = 7$
      uitwerking: |-
        De topvorm is $y = (x - 3)^2 - 2 = x^2 - 6x + 7$.
    - opgave: |-
        De parabool $y = ax^2 + bx + 3$ heeft als top $(2, 7)$.
      antwoord: |-
        $a = -1$, $b = 4$
      uitwerking: |-
        $y = a(x - 2)^2 + 7$ gaat door $(0, 3)$: $4a + 7 = 3$, dus $a = -1$. Uitwerken: $-(x^2 - 4x + 4) + 7 = -x^2 + 4x + 3$, dus $b = 4$.

- id: h2-o25
  soort: opdracht
  pakketten: [5]
  niveau: 3
  thema: |-
    de top van een familie parabolen
  opgave: |-
    Neem de parabolen $y = x^2 + bx + c$, met verschillende getallen $b$ en $c$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $c$ ligt de top van $y = x^2 - 6x + c$ op de $x$-as?
      antwoord: |-
        $c = 9$
      uitwerking: |-
        De top ligt bij $x = 3$, met $y = 9 - 18 + c = c - 9$. Die is $0$ als $c = 9$: dan is $y = (x - 3)^2$.
    - opgave: |-
        Neem $c = 0$. Toon aan dat de top van $y = x^2 + bx$ voor elke $b$ op de parabool $y = -x^2$ ligt.
      antwoord: |-
        de top is $\bigl(-\tfrac b2, -\tfrac{b^2}{4}\bigr)$
      uitwerking: |-
        Met kwadraatafsplitsen: $x^2 + bx = \bigl(x + \tfrac b2\bigr)^2 - \tfrac{b^2}{4}$. De top is $\bigl(-\tfrac b2, -\tfrac{b^2}{4}\bigr)$, en $-\bigl(-\tfrac b2\bigr)^2 = -\tfrac{b^2}{4}$: het punt ligt op $y = -x^2$.
    - opgave: |-
        Op welke kromme liggen de toppen van de parabolen $y = x^2 + bx + 1$?
      antwoord: |-
        op de parabool $y = -x^2 + 1$
      uitwerking: |-
        De top is $\bigl(-\tfrac b2, 1 - \tfrac{b^2}{4}\bigr)$. Met $x = -\tfrac b2$ is $\tfrac{b^2}{4} = x^2$, dus $y = 1 - x^2$.

# --- Test jezelf -----------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Schrijf in de algemene vorm.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = 2(x + 1)^2 - 5$
      antwoord: |-
        $y = 2x^2 + 4x - 3$
      uitwerking: |-
        $2(x^2 + 2x + 1) - 5$.
    - opgave: |-
        $y = -(x - 4)^2 + 1$
      antwoord: |-
        $y = -x^2 + 8x - 15$
      uitwerking: |-
        $-(x^2 - 8x + 16) + 1$.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Bereken de top.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = x^2 - 6x + 2$
      antwoord: |-
        $(3, -7)$
      uitwerking: |-
        $x = 3$, $y = 9 - 18 + 2 = -7$.
    - opgave: |-
        $y = -2x^2 - 4x + 1$
      antwoord: |-
        $(-1, 3)$
      uitwerking: |-
        $x = -\tfrac{-4}{-4} = -1$, $y = -2 + 4 + 1 = 3$.

- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    Schrijf $y = 3x^2 - 12x + 7$ in de topvorm.
  antwoord: |-
    $y = 3(x - 2)^2 - 5$
  uitwerking: |-
    Top: $x = \tfrac{12}{6} = 2$, $y = 12 - 24 + 7 = -5$. Met $a = 3$: $y = 3(x - 2)^2 - 5$.

- id: h2-t4
  soort: test
  niveau: 2
  opgave: |-
    Teken de grafiek van $f(x) = -x^2 + 2x + 3$.
  antwoord: |-
    top $(1, 4)$, door $(0, 3)$, $(2, 3)$, $(-1, 0)$ en $(3, 0)$
  uitwerking: |-
    Naar onder geopend, as $x = 1$, top $(1, 4)$. Snijpunt met de $y$-as $(0, 3)$, gespiegeld $(2, 3)$. Verder $f(3) = 0$, gespiegeld $(-1, 0)$.
