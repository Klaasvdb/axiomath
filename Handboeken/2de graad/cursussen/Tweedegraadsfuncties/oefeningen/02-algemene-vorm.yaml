- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Geef de kenmerken van $f(x) = x^2 + 4x - 1$: top, extremum, bereik, stijgen en dalen, snijpunt met de $y$-as.
  antwoord: |-
    $(-2, -5)$; min.\ $-5$ in $x = -2$; $\ivgo{-5}{\pinf}$; dalend op $\ivog{\minf}{-2}$, stijgend op $\ivgo{-2}{\pinf}$; $(0, -1)$
  uitwerking: |-
    Top: $x = -2$, $y = 4 - 8 - 1 = -5$. $a > 0$: minimum $-5$ in $x = -2$, bereik $\ivgo{-5}{\pinf}$, dalend op $\ivog{\minf}{-2}$, stijgend op $\ivgo{-2}{\pinf}$. Snijpunt met de $y$-as: $(0, -1)$.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Met $36$ m hekwerk zet je een rechthoekige moestuin af, met hekken aan alle vier de zijden. Welke afmetingen geven de grootste oppervlakte?
  antwoord: |-
    $9$ m op $9$ m, $81$ m$^2$
  uitwerking: |-
    Noem de lengte $x$; de breedte is dan $18 - x$. $A(x) = x(18 - x) = -x^2 + 18x$. Top: $x = 9$, $A(9) = 81$. Een vierkant van $9$ m op $9$ m.

- id: h2-t7
  soort: test
  pakketten: [2, 3]
  niveau: 2
  opgave: |-
    De parabool $y = x^2 + bx + 4$ heeft als symmetrieas $x = 3$. Bepaal $b$ en de top.
  antwoord: |-
    $b = -6$; top $(3, -5)$
  uitwerking: |-
    $-\tfrac b2 = 3$, dus $b = -6$. Top: $9 - 18 + 4 = -5$, dus $(3, -5)$.

- id: h2-t7
  soort: test
  pakketten: [4, 5]
  niveau: 2
  opgave: |-
    Schrijf in de topvorm door kwadraatafsplitsen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = x^2 + 10x + 18$
      antwoord: |-
        $y = (x + 5)^2 - 7$
      uitwerking: |-
        $(x + 5)^2 - 25 + 18$.
    - opgave: |-
        $y = 2x^2 - 4x + 5$
      antwoord: |-
        $y = 2(x - 1)^2 + 3$
      uitwerking: |-
        $2(x^2 - 2x) + 5 = 2\bigl((x - 1)^2 - 1\bigr) + 5 = 2(x - 1)^2 + 3$.
