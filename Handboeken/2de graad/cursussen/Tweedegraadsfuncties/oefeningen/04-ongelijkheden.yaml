# Oefeningen van hoofdstuk 4 (tweedegraadsongelijkheden). Zie Opmaak/oefeningenbank.py voor de velden.
# Dit hoofdstuk staat in pakket 2-5 (in 2 als keuzehoofdstuk). pakketten: parameters in 4-5 (h4-parameter, h4-o20,
# h4-o21, h4-o25, h4-o26, h4-t8), een bewijsopdracht in 5 (h4-o22).

- id: h4-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Herhaal het tekenschema en de intervallen.
  lijst: enumerate
  delen:
    - opgave: |-
        Maak het tekenschema van $f(x) = 2x - 6$ en van $g(x) = -3x + 6$.
      antwoord: |-
        $-$ $0$ $+$ (nulwaarde $3$); $+$ $0$ $-$ (nulwaarde $2$)
      uitwerking: |-
        \tekenschema{3}{ & 3 & }{- & 0 & +} \qquad \tekenschema[g(x)]{3}{ & 2 & }{+ & 0 & -}
    - opgave: |-
        Schrijf als interval: $x > 2$ en $-1 \leqslant x < 4$.
      antwoord: |-
        $\ivoo{2}{\pinf}$ en $\ivgo{-1}{4}$
      uitwerking: |-
        $\ivoo{2}{\pinf}$ en $\ivgo{-1}{4}$.
    - opgave: |-
        Los op: $-2x + 4 > 10$.
      antwoord: |-
        $x < -3$
      uitwerking: |-
        $-2x > 6$, en delen door $-2$ keert het teken om: $x < -3$, dus $V = \ivoo{\minf}{-3}$.

- id: h4-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad De figuur toont de grafiek van $f(x) = x^2 - 2x - 3$.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.4cm,y=.28cm]
        \rooster{-2}{1}{4}{-4}{1}{5}
        \parabool{1}{1}{-4}{-1.95}{3.95}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $x$ ligt de grafiek boven de $x$-as? En eronder?
      antwoord: |-
        $x < -1$ of $x > 3$; $-1 < x < 3$
      uitwerking: |-
        Boven de $x$-as links van $-1$ en rechts van $3$, eronder tussen $-1$ en $3$.
    - opgave: |-
        Wat is het teken van $f(-2)$, $f(0)$ en $f(5)$?
      antwoord: |-
        $+$, $-$, $+$
      uitwerking: |-
        $f(-2) = 5$, $f(0) = -3$, $f(5) = 12$.
    - opgave: |-
        Maak het tekenschema van $f$.
      antwoord: |-
        $+$ $0$ $-$ $0$ $+$
      uitwerking: |-
        \tekenschema{5}{ & -1 & & 3 & }{+ & 0 & - & 0 & +}
    - opgave: |-
        Voor welke $x$ is $x^2 - 2x - 3 < 0$?
      antwoord: |-
        $\ivoo{-1}{3}$
      uitwerking: |-
        Waar het tekenschema $-$ toont: tussen $-1$ en $3$.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h4-teken
  soort: kort
  opgave: |-
    Maak het tekenschema.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = x^2 - 5x + 4$
      antwoord: |-
        $+$ $0$ $-$ $0$ $+$ bij $1$ en $4$
      uitwerking: |-
        $(x - 1)(x - 4)$, $a > 0$.
        \tekenschema{5}{ & 1 & & 4 & }{+ & 0 & - & 0 & +}
    - opgave: |-
        $g(x) = -x^2 + 9$
      antwoord: |-
        $-$ $0$ $+$ $0$ $-$ bij $-3$ en $3$
      uitwerking: |-
        Nulwaarden $\pm 3$, $a < 0$.
        \tekenschema[g(x)]{5}{ & -3 & & 3 & }{- & 0 & + & 0 & -}
    - opgave: |-
        $h(x) = 4x^2 + 4x + 1$
      antwoord: |-
        $+$ $0$ $+$ bij $-\tfrac12$
      uitwerking: |-
        $(2x + 1)^2$, $D = 0$.
        \tekenschema[h(x)]{3}{ & -\tfrac12 & }{+ & 0 & +}
    - opgave: |-
        $k(x) = x^2 + x + 3$
      antwoord: |-
        overal $+$
      uitwerking: |-
        $D = 1 - 12 < 0$, $a > 0$: overal positief.
    - opgave: |-
        $l(x) = -x^2 + 6x - 9$
      antwoord: |-
        $-$ $0$ $-$ bij $3$
      uitwerking: |-
        $-(x - 3)^2$, $D = 0$.
        \tekenschema[l(x)]{3}{ & 3 & }{- & 0 & -}
    - opgave: |-
        $m(x) = 2x^2 - 8x$
      antwoord: |-
        $+$ $0$ $-$ $0$ $+$ bij $0$ en $4$
      uitwerking: |-
        $2x(x - 4)$, $a > 0$.
        \tekenschema[m(x)]{5}{ & 0 & & 4 & }{+ & 0 & - & 0 & +}

- id: h4-factoren
  soort: kort
  opgave: |-
    Maak het tekenschema zonder de haakjes uit te werken. Let op het teken van $a$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = 2(x - 1)(x + 3)$
      antwoord: |-
        $+$ $0$ $-$ $0$ $+$ bij $-3$ en $1$
      uitwerking: |-
        Nulwaarden $-3$ en $1$, $a = 2 > 0$.
        \tekenschema{5}{ & -3 & & 1 & }{+ & 0 & - & 0 & +}
    - opgave: |-
        $g(x) = -(x + 2)(x - 5)$
      antwoord: |-
        $-$ $0$ $+$ $0$ $-$ bij $-2$ en $5$
      uitwerking: |-
        Nulwaarden $-2$ en $5$, $a = -1 < 0$.
        \tekenschema[g(x)]{5}{ & -2 & & 5 & }{- & 0 & + & 0 & -}
    - opgave: |-
        $h(x) = (4 - x)(x + 1)$
      antwoord: |-
        $-$ $0$ $+$ $0$ $-$ bij $-1$ en $4$
      uitwerking: |-
        Nulwaarden $-1$ en $4$. De term in $x^2$ is $-x \cdot x = -x^2$, dus $a = -1 < 0$.
        \tekenschema[h(x)]{5}{ & -1 & & 4 & }{- & 0 & + & 0 & -}

- id: h4-wortelfout
  soort: kort
  opgave: |-
    Los op met een tekenschema, niet met een wortel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 < 25$
      antwoord: |-
        $\ivoo{-5}{5}$
      uitwerking: |-
        $x^2 - 25 < 0$: nulwaarden $\pm 5$, negatief ertussen.
    - opgave: |-
        $x^2 \geqslant 2$
      antwoord: |-
        $\ivog{\minf}{-\sqrt2} \cup \ivgo{\sqrt2}{\pinf}$
      uitwerking: |-
        $x^2 - 2 \geqslant 0$: nulwaarden $\pm\sqrt2$, positief erbuiten.
    - opgave: |-
        $4x^2 > 1$
      antwoord: |-
        $\ivoo{\minf}{-\tfrac12} \cup \ivoo{\tfrac12}{\pinf}$
      uitwerking: |-
        $4x^2 - 1 > 0$: nulwaarden $\pm\tfrac12$, positief erbuiten.

- id: h4-ongelijkheid
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 - 7x + 10 < 0$
      antwoord: |-
        $\ivoo{2}{5}$
      uitwerking: |-
        Nulwaarden $2$ en $5$, $a > 0$: negatief ertussen.
    - opgave: |-
        $x^2 - 9 \geqslant 0$
      antwoord: |-
        $\ivog{\minf}{-3} \cup \ivgo{3}{\pinf}$
      uitwerking: |-
        Nulwaarden $\pm 3$, $a > 0$: positief of nul erbuiten.
    - opgave: |-
        $-x^2 + 4x > 0$
      antwoord: |-
        $\ivoo{0}{4}$
      uitwerking: |-
        $-x(x - 4)$: nulwaarden $0$ en $4$, $a < 0$: positief ertussen.
    - opgave: |-
        $2x^2 + x - 3 \leqslant 0$
      antwoord: |-
        $\ivgg{-1,5}{1}$
      uitwerking: |-
        $D = 1 + 24 = 25$, nulwaarden $\tfrac{-1 \pm 5}{4}$: $1$ en $-1,5$. $a > 0$: negatief of nul ertussen.
    - opgave: |-
        $x^2 > 2x + 8$
      antwoord: |-
        $\ivoo{\minf}{-2} \cup \ivoo{4}{\pinf}$
      uitwerking: |-
        $x^2 - 2x - 8 > 0$, $(x - 4)(x + 2)$: positief erbuiten.
    - opgave: |-
        $(x + 1)(x - 5) \geqslant 7$
      antwoord: |-
        $\ivog{\minf}{-2} \cup \ivgo{6}{\pinf}$
      uitwerking: |-
        $x^2 - 4x - 5 \geqslant 7$, dus $x^2 - 4x - 12 = (x - 6)(x + 2) \geqslant 0$.

- id: h4-bijzonder
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 + 1 > 0$
      antwoord: |-
        $\R$
      uitwerking: |-
        Geen nulwaarden, $a > 0$: altijd positief.
    - opgave: |-
        $x^2 + 1 < 0$
      antwoord: |-
        $\emptyset$
      uitwerking: |-
        Nooit negatief.
    - opgave: |-
        $(x - 2)^2 \leqslant 0$
      antwoord: |-
        $\{2\}$
      uitwerking: |-
        Alleen in $2$ is het kwadraat $0$, nergens negatief.
    - opgave: |-
        $(x - 2)^2 > 0$
      antwoord: |-
        $\R \setminus \{2\}$
      uitwerking: |-
        Overal positief, behalve in $2$.
    - opgave: |-
        $-x^2 + 2x - 5 < 0$
      antwoord: |-
        $\R$
      uitwerking: |-
        $D = 4 - 20 < 0$, $a < 0$: altijd negatief.
    - opgave: |-
        $x^2 - 4x + 4 \geqslant 0$
      antwoord: |-
        $\R$
      uitwerking: |-
        $(x - 2)^2 \geqslant 0$ voor elke $x$.

- id: h4-grafisch
  soort: kort
  opgave: |-
    De figuur toont de grafieken van $f(x) = -x^2 + 4$ en $g(x) = x + 2$. Los op met de grafiek.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.36cm]
        \rooster{-3}{1}{3}{-3}{1}{5}
        \parabool{-1}{0}{4}{-2.65}{2.65}
        \rechte[inkt]{-3}{3}{1}{2}
        \punt{1}{3}\punt{-2}{0}
        \node[accent,font=\scriptsize] at (-2.6,-2.2) {$f$};
        \node[inkt,font=\scriptsize] at (2.6,5.2) {$g$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) > 0$
      antwoord: |-
        $\ivoo{-2}{2}$
      uitwerking: |-
        De parabool ligt boven de $x$-as tussen $-2$ en $2$.
    - opgave: |-
        $f(x) \leqslant 3$
      antwoord: |-
        $\ivog{\minf}{-1} \cup \ivgo{1}{\pinf}$
      uitwerking: |-
        De rechte $y = 3$ snijdt de parabool in $(\pm1, 3)$. Erbuiten ligt de parabool op of onder die rechte.
    - opgave: |-
        $f(x) > g(x)$
      antwoord: |-
        $\ivoo{-2}{1}$
      uitwerking: |-
        Snijpunten $(-2, 0)$ en $(1, 3)$. Ertussen ligt de parabool boven de rechte.
    - opgave: |-
        $f(x) \leqslant g(x)$. Controleer algebraïsch.
      antwoord: |-
        $\ivog{\minf}{-2} \cup \ivgo{1}{\pinf}$
      uitwerking: |-
        $-x^2 + 4 \leqslant x + 2 \iff x^2 + x - 2 \geqslant 0 \iff (x + 2)(x - 1) \geqslant 0$: buiten de nulwaarden, grenzen inbegrepen.

- id: h4-parameter
  soort: kort
  pakketten: [4, 5]
  opgave: |-
    Los op met de discriminant.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $m$ heeft $x^2 + mx + 4 = 0$ twee oplossingen? Voor welke geen?
      antwoord: |-
        $m < -4$ of $m > 4$; $-4 < m < 4$
      uitwerking: |-
        $D = m^2 - 16$. Twee oplossingen: $m^2 - 16 > 0$, dus $m < -4$ of $m > 4$. Geen: $m^2 - 16 < 0$, dus $-4 < m < 4$.
    - opgave: |-
        Voor welke $k$ ligt de parabool $y = x^2 - 2x + k$ volledig boven de $x$-as?
      antwoord: |-
        $k > 1$
      uitwerking: |-
        Geen nulwaarden en $a > 0$: $D = 4 - 4k < 0$, dus $k > 1$.

- id: h4-context
  soort: kort
  opgave: |-
    Los op met een ongelijkheid.
  lijst: enumerate
  delen:
    - opgave: |-
        Een bal wordt omhooggegooid. Na $t$ seconden is hij $h(t) = -5t^2 + 20t + 1$ meter hoog. Wanneer is de bal hoger dan $16$ m?
      antwoord: |-
        tussen $1$ s en $3$ s
      uitwerking: |-
        $-5t^2 + 20t + 1 > 16 \iff -5t^2 + 20t - 15 > 0 \iff t^2 - 4t + 3 < 0 \iff (t - 1)(t - 3) < 0$: $1 < t < 3$.
    - opgave: |-
        De kraam met smoothies uit hoofdstuk 2 maakt bij een prijs van $p$ euro een winst van $W(p) = -10p^2 + 120p - 200$ euro. Bij welke prijzen maakt de kraam winst?
      antwoord: |-
        tussen $2$ en $10$ euro
      uitwerking: |-
        $W(p) > 0 \iff p^2 - 12p + 20 < 0 \iff (p - 2)(p - 10) < 0$: $2 < p < 10$.

# --- Opdrachten ------------------------------------------------------------------------

- id: h4-o1
  soort: opdracht
  niveau: 1
  thema: |-
    het tekenschema van een tweedegraadsfunctie
  opgave: |-
    Maak het tekenschema.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^2 - x - 12$
      antwoord: |-
        $+$ $0$ $-$ $0$ $+$ bij $-3$ en $4$
    - opgave: |-
        $f(x) = -x^2 + 2x + 8$
      antwoord: |-
        $-$ $0$ $+$ $0$ $-$ bij $-2$ en $4$
    - opgave: |-
        $f(x) = x^2 - 16$
      antwoord: |-
        $+$ $0$ $-$ $0$ $+$ bij $-4$ en $4$
    - opgave: |-
        $f(x) = 3x^2 - 12x + 12$
      antwoord: |-
        $+$ $0$ $+$ bij $2$
    - opgave: |-
        $f(x) = -2x^2 - 3$
      antwoord: |-
        overal $-$
    - opgave: |-
        $f(x) = x^2 + 5x$
      antwoord: |-
        $+$ $0$ $-$ $0$ $+$ bij $-5$ en $0$
  uitwerking: |-
    \textbf{a.}~$(x + 3)(x - 4)$, $a > 0$. \textbf{b.}~$-(x^2 - 2x - 8) = -(x - 4)(x + 2)$, $a < 0$. \textbf{c.}~$(x - 4)(x + 4)$. \textbf{d.}~$3(x - 2)^2$: één nulwaarde. \textbf{e.}~$-2x^2 - 3 = 0$ geeft $x^2 = -1,5$: geen nulwaarden, $a < 0$. \textbf{f.}~$x(x + 5)$.

- id: h4-o2
  soort: opdracht
  niveau: 1
  thema: |-
    het tekenschema aflezen
  opgave: |-
    Geef het tekenschema van de functies met deze grafieken.
    \figuren{\begin{tikzpicture}[x=.3cm,y=.3cm]
      \rooster{-4}{1}{4}{-4}{1}{4}
      \parabool{1}{-.5}{-2.25}{-3}{2}
      \node[font=\scriptsize\bfseries] at (0,-5.5) {$f$};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.3cm,y=.3cm]
      \rooster{-4}{1}{4}{-4}{1}{4}
      \parabool{-1}{2}{0}{0}{4}
      \node[font=\scriptsize\bfseries] at (0,-5.5) {$g$};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.3cm,y=.3cm]
      \rooster{-4}{1}{4}{-4}{1}{4}
      \parabool{-.5}{-1}{-1}{-3.45}{1.45}
      \node[font=\scriptsize\bfseries] at (0,-5.5) {$h$};
    \end{tikzpicture}}
  antwoord: |-
    $f$: $+$ $0$ $-$ $0$ $+$ bij $-2$ en $1$; $g$: $-$ $0$ $-$ bij $2$; $h$: overal $-$
  uitwerking: |-
    \tekenschema{5}{ & -2 & & 1 & }{+ & 0 & - & 0 & +} \qquad \tekenschema[g(x)]{3}{ & 2 & }{- & 0 & -} \qquad \tekenschema[h(x)]{1}{ }{-}

- id: h4-o3
  soort: opdracht
  niveau: 1
  thema: |-
    tweedegraadsongelijkheden oplossen
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 - 3x - 4 > 0$
      antwoord: |-
        $\ivoo{\minf}{-1} \cup \ivoo{4}{\pinf}$
    - opgave: |-
        $x^2 - 3x - 4 \leqslant 0$
      antwoord: |-
        $\ivgg{-1}{4}$
    - opgave: |-
        $x^2 - 25 < 0$
      antwoord: |-
        $\ivoo{-5}{5}$
    - opgave: |-
        $-x^2 + 2x + 15 \geqslant 0$
      antwoord: |-
        $\ivgg{-3}{5}$
    - opgave: |-
        $x^2 + 6x > 0$
      antwoord: |-
        $\ivoo{\minf}{-6} \cup \ivoo{0}{\pinf}$
    - opgave: |-
        $2x^2 - 18 \leqslant 0$
      antwoord: |-
        $\ivgg{-3}{3}$
    - opgave: |-
        $-x^2 - 4x < 0$
      antwoord: |-
        $\ivoo{\minf}{-4} \cup \ivoo{0}{\pinf}$
    - opgave: |-
        $x^2 - 10x + 21 \geqslant 0$
      antwoord: |-
        $\ivog{\minf}{3} \cup \ivgo{7}{\pinf}$
  uitwerking: |-
    \textbf{a, b.}~$(x + 1)(x - 4)$, $a > 0$. \textbf{c.}~Nulwaarden $\pm 5$. \textbf{d.}~$-(x - 5)(x + 3)$, $a < 0$: positief ertussen. \textbf{e.}~$x(x + 6)$. \textbf{f.}~$2(x^2 - 9)$: nulwaarden $\pm 3$. \textbf{g.}~$-x(x + 4)$, $a < 0$: negatief erbuiten. \textbf{h.}~$(x - 3)(x - 7)$.

- id: h4-o24
  soort: opdracht
  niveau: 1
  thema: |-
    ongelijkheden uit een tekenschema
  opgave: |-
    Een functie $f$ heeft dit tekenschema. Los op.
    \[\tekenschema{5}{ & -2 & & 5 & }{+ & 0 & - & 0 & +}\]
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $f(x) > 0$
      antwoord: |-
        $\ivoo{\minf}{-2} \cup \ivoo{5}{\pinf}$
    - opgave: |-
        $f(x) \leqslant 0$
      antwoord: |-
        $\ivgg{-2}{5}$
    - opgave: |-
        $f(x) < 0$
      antwoord: |-
        $\ivoo{-2}{5}$
    - opgave: |-
        $f(x) \geqslant 0$
      antwoord: |-
        $\ivog{\minf}{-2} \cup \ivgo{5}{\pinf}$
  uitwerking: |-
    Lees af waar het teken klopt. Bij $\leqslant$ en $\geqslant$ horen de nulwaarden $-2$ en $5$ erbij, bij $<$ en $>$ niet.

- id: h4-o5
  soort: opdracht
  niveau: 1
  thema: |-
    bijzondere gevallen
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 + 3 \leqslant 0$
      antwoord: |-
        $\emptyset$
    - opgave: |-
        $(x + 1)^2 \geqslant 0$
      antwoord: |-
        $\R$
    - opgave: |-
        $-(x - 4)^2 \geqslant 0$
      antwoord: |-
        $\{4\}$
    - opgave: |-
        $x^2 - 2x + 1 < 0$
      antwoord: |-
        $\emptyset$
    - opgave: |-
        $x^2 + x + 1 > 0$
      antwoord: |-
        $\R$
    - opgave: |-
        $-x^2 + 6x - 9 < 0$
      antwoord: |-
        $\R \setminus \{3\}$
  uitwerking: |-
    \textbf{a.}~Altijd positief. \textbf{b.}~Een kwadraat is nooit negatief. \textbf{c.}~$-(x - 4)^2$ is nergens positief, en nul in $4$. \textbf{d.}~$(x - 1)^2 < 0$ kan niet. \textbf{e.}~$D = -3 < 0$, $a > 0$. \textbf{f.}~$-(x - 3)^2 < 0$ overal behalve in $3$.

- id: h4-o4
  soort: opdracht
  niveau: 1
  thema: |-
    ongelijkheden met de discriminant
  opgave: |-
    Los op. Gebruik de discriminant.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2x^2 - 3x - 2 > 0$
      antwoord: |-
        $\ivoo{\minf}{-\tfrac12} \cup \ivoo{2}{\pinf}$
      uitwerking: |-
        $D = 9 + 16 = 25$, nulwaarden $\tfrac{3 \pm 5}{4}$: $2$ en $-\tfrac12$.
    - opgave: |-
        $3x^2 + 5x - 2 \leqslant 0$
      antwoord: |-
        $\ivgg{-2}{\tfrac13}$
      uitwerking: |-
        $D = 25 + 24 = 49$, nulwaarden $\tfrac{-5 \pm 7}{6}$: $\tfrac13$ en $-2$.
    - opgave: |-
        $x^2 - 2x - 2 < 0$
      antwoord: |-
        $\ivoo{1 - \sqrt3}{1 + \sqrt3}$
      uitwerking: |-
        $D = 4 + 8 = 12$, nulwaarden $\tfrac{2 \pm 2\sqrt3}{2} = 1 \pm \sqrt3$.
    - opgave: |-
        $-4x^2 + 4x + 3 \geqslant 0$
      antwoord: |-
        $\ivgg{-\tfrac12}{\tfrac32}$
      uitwerking: |-
        $D = 16 + 48 = 64$, nulwaarden $\tfrac{-4 \pm 8}{-8}$: $-\tfrac12$ en $\tfrac32$. $a < 0$: positief ertussen.

- id: h4-o6
  soort: opdracht
  niveau: 1
  thema: |-
    de oplossing op een getallenas
  opgave: |-
    Los op en stel de oplossing voor op een getallenas.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 - 4 \geqslant 0$
      antwoord: |-
        $\ivog{\minf}{-2} \cup \ivgo{2}{\pinf}$
      uitwerking: |-
        Nulwaarden $\pm 2$, $a > 0$.
        \figuren{\begin{tikzpicture}[x=.45cm,y=.45cm]\getallenas{-4}{4}{-2/-2,0/0,2/2}\ivdeel{-4.4}{-2}\ivdeel{2}{4.4}\haakr{-2}\haakl{2}\end{tikzpicture}}
    - opgave: |-
        $x^2 - x < 0$
      antwoord: |-
        $\ivoo{0}{1}$
      uitwerking: |-
        $x(x - 1)$: nulwaarden $0$ en $1$, negatief ertussen.
        \figuren{\begin{tikzpicture}[x=.9cm,y=.45cm]\getallenas{-1}{2}{0/0,1/1}\ivdeel{0}{1}\haakr{0}\haakl{1}\end{tikzpicture}}

- id: h4-o7
  soort: opdracht
  niveau: 2
  thema: |-
    eerst herleiden
  opgave: |-
    Herleid en los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 < 4x$
      antwoord: |-
        $\ivoo{0}{4}$
      uitwerking: |-
        $x^2 - 4x = x(x - 4) < 0$.
    - opgave: |-
        $(x - 2)(x + 4) \geqslant 7$
      antwoord: |-
        $\ivog{\minf}{-5} \cup \ivgo{3}{\pinf}$
      uitwerking: |-
        $x^2 + 2x - 8 \geqslant 7$, dus $x^2 + 2x - 15 = (x + 5)(x - 3) \geqslant 0$.
    - opgave: |-
        $3x^2 + 2 > x^2 + 5x$
      antwoord: |-
        $\ivoo{\minf}{\tfrac12} \cup \ivoo{2}{\pinf}$
      uitwerking: |-
        $2x^2 - 5x + 2 > 0$, $D = 25 - 16 = 9$, nulwaarden $\tfrac{5 \pm 3}{4}$: $2$ en $\tfrac12$.
    - opgave: |-
        $x(x + 6) \leqslant -9$
      antwoord: |-
        $\{-3\}$
      uitwerking: |-
        $x^2 + 6x + 9 = (x + 3)^2 \leqslant 0$: alleen $x = -3$.
    - opgave: |-
        $(x - 1)^2 > 2(x - 1)$
      antwoord: |-
        $\ivoo{\minf}{1} \cup \ivoo{3}{\pinf}$
      uitwerking: |-
        $(x - 1)^2 - 2(x - 1) = (x - 1)(x - 3) > 0$.
    - opgave: |-
        $2x^2 \leqslant x^2 - 1$
      antwoord: |-
        $\emptyset$
      uitwerking: |-
        $x^2 + 1 \leqslant 0$ kan niet.

- id: h4-o11
  soort: opdracht
  niveau: 2
  thema: |-
    hoe lang is een bal hoog genoeg?
  opgave: |-
    Een bal wordt recht omhooggeschopt. Na $t$ seconden is hij $h(t) = -5t^2 + 25t$ meter hoog.
  lijst: enumerate
  delen:
    - opgave: |-
        Wanneer is de bal hoger dan $20$ m? Hoe lang duurt dat?
      antwoord: |-
        van $1$ tot $4$ s, $3$ s lang
      uitwerking: |-
        $-5t^2 + 25t > 20 \iff t^2 - 5t + 4 < 0 \iff (t - 1)(t - 4) < 0$: $1 < t < 4$, gedurende $3$ seconden.
    - opgave: |-
        Wanneer is de bal hoger dan $30$ m?
      antwoord: |-
        van $2$ tot $3$ s
      uitwerking: |-
        $t^2 - 5t + 6 < 0 \iff (t - 2)(t - 3) < 0$: $2 < t < 3$.
    - opgave: |-
        Wanneer is de bal in de lucht?
      antwoord: |-
        van $0$ tot $5$ s
      uitwerking: |-
        $h(t) > 0 \iff -5t(t - 5) > 0$: $0 < t < 5$.

- id: h4-o9
  soort: opdracht
  niveau: 2
  thema: |-
    eigenschappen van ongelijkheden: waar of niet waar
  opgave: |-
    Waar of niet waar? Verklaar je antwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 < 16$ betekent hetzelfde als $x < 4$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $x = -5$ voldoet aan $x < 4$, maar $25 > 16$. De oplossing is $\ivoo{-4}{4}$.
    - opgave: |-
        Als $a > 0$ en $D < 0$, dan is $ax^2 + bx + c > 0$ voor elke $x$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: de parabool ligt volledig boven de $x$-as.
    - opgave: |-
        De oplossing van $x^2 \geqslant 0$ is $\R$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: een kwadraat is nooit negatief.
    - opgave: |-
        De oplossing van $-x^2 + 4 > 0$ is $\ivoo{\minf}{-2} \cup \ivoo{2}{\pinf}$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $a < 0$, dus positief tussen de nulwaarden: $\ivoo{-2}{2}$. Controle met $x = 0$: $4 > 0$.
    - opgave: |-
        Een tweedegraadsongelijkheid heeft altijd oneindig veel oplossingen.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $(x - 3)^2 \leqslant 0$ heeft alleen de oplossing $3$, en $x^2 < 0$ heeft er geen.

- id: h4-o8
  soort: opdracht
  niveau: 2
  thema: |-
    ongelijkheden grafisch oplossen
  opgave: |-
    De figuur toont de grafieken van $f(x) = x^2 - 4x$ en $g(x) = -x + 4$. Los grafisch op.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.45cm,y=.3cm]
        \rooster{-2}{1}{5}{-4}{1}{6}
        \parabool{1}{2}{-4}{-1.15}{5.15}
        \rechte[inkt]{-2}{5}{-1}{4}
        \node[accent,font=\scriptsize] at (5.4,4.5) {$f$};
        \node[inkt,font=\scriptsize] at (-1.6,6.6) {$g$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) < 0$
      antwoord: |-
        $\ivoo{0}{4}$
      uitwerking: |-
        De parabool ligt onder de $x$-as tussen $0$ en $4$.
    - opgave: |-
        $f(x) \geqslant -3$
      antwoord: |-
        $\ivog{\minf}{1} \cup \ivgo{3}{\pinf}$
      uitwerking: |-
        De rechte $y = -3$ snijdt de parabool in $(1, -3)$ en $(3, -3)$.
    - opgave: |-
        $f(x) > g(x)$
      antwoord: |-
        $\ivoo{\minf}{-1} \cup \ivoo{4}{\pinf}$
      uitwerking: |-
        Snijpunten $(-1, 5)$ en $(4, 0)$. Erbuiten ligt de parabool boven de rechte.
    - opgave: |-
        $f(x) \leqslant g(x)$. Controleer algebraïsch.
      antwoord: |-
        $\ivgg{-1}{4}$
      uitwerking: |-
        $x^2 - 4x \leqslant -x + 4 \iff x^2 - 3x - 4 \leqslant 0 \iff (x - 4)(x + 1) \leqslant 0$: $\ivgg{-1}{4}$.

- id: h4-o13
  soort: opdracht
  niveau: 2
  thema: |-
    wanneer is er winst?
  opgave: |-
    Een kleine brouwerij maakt een winst van $W(x) = -0,5x^2 + 40x - 600$ euro per week, als ze $x$ vaten bier verkoopt.
  lijst: enumerate
  delen:
    - opgave: |-
        Bij hoeveel vaten maakt de brouwerij winst?
      antwoord: |-
        meer dan $20$ en minder dan $60$ vaten
      uitwerking: |-
        $W(x) > 0 \iff x^2 - 80x + 1200 < 0$. $D = 6400 - 4800 = 1600$, nulwaarden $\tfrac{80 \pm 40}{2}$: $20$ en $60$. Dus $20 < x < 60$.
    - opgave: |-
        Bij hoeveel vaten is de winst minstens $150$ euro?
      antwoord: |-
        van $30$ tot $50$ vaten
      uitwerking: |-
        $-0,5x^2 + 40x - 750 \geqslant 0 \iff x^2 - 80x + 1500 \leqslant 0$. $D = 400$, nulwaarden $30$ en $50$: $30 \leqslant x \leqslant 50$.
    - opgave: |-
        Wat is de grootste winst?
      antwoord: |-
        $200$ euro, bij $40$ vaten
      uitwerking: |-
        Top: $x = -\tfrac{40}{-1} = 40$, $W(40) = -800 + 1600 - 600 = 200$.

- id: h4-o10
  soort: opdracht
  niveau: 2
  thema: |-
    wanneer bestaat een vierkantswortel?
  opgave: |-
    Een vierkantswortel $\sqrt a$ bestaat alleen als $a \geqslant 0$. Voor welke $x$ bestaat de wortel?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sqrt{x^2 - 9}$
      antwoord: |-
        $\ivog{\minf}{-3} \cup \ivgo{3}{\pinf}$
      uitwerking: |-
        $x^2 - 9 \geqslant 0$.
    - opgave: |-
        $\sqrt{4 - x^2}$
      antwoord: |-
        $\ivgg{-2}{2}$
      uitwerking: |-
        $4 - x^2 \geqslant 0$, $a < 0$: tussen de nulwaarden.
    - opgave: |-
        $\sqrt{x^2 - 5x + 6}$
      antwoord: |-
        $\ivog{\minf}{2} \cup \ivgo{3}{\pinf}$
      uitwerking: |-
        $(x - 2)(x - 3) \geqslant 0$.
    - opgave: |-
        $\sqrt{-x^2 - 1}$
      antwoord: |-
        voor geen enkele $x$
      uitwerking: |-
        $-x^2 - 1 < 0$ voor elke $x$.

- id: h4-o20
  soort: opdracht
  pakketten: [4, 5]
  niveau: 2
  thema: |-
    aantal oplossingen met een parameter
  opgave: |-
    Bepaal de waarden van het onbekende getal.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $m$ heeft $x^2 + mx + 9 = 0$ geen oplossingen?
      antwoord: |-
        $-6 < m < 6$
      uitwerking: |-
        $D = m^2 - 36 < 0 \iff (m + 6)(m - 6) < 0 \iff -6 < m < 6$.
    - opgave: |-
        Voor welke $k$ heeft $kx^2 + 4x + 1 = 0$ twee oplossingen? Let op: het moet een tweedegraadsvergelijking blijven.
      antwoord: |-
        $k < 4$ en $k \neq 0$
      uitwerking: |-
        $D = 16 - 4k > 0 \iff k < 4$. Voor $k = 0$ is het geen tweedegraadsvergelijking meer: $4x + 1 = 0$ heeft maar één oplossing. Dus $k < 4$ en $k \neq 0$.

- id: h4-o12
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte van een rechthoek
  opgave: |-
    Een rechthoek heeft een omtrek van $24$ cm. Noem de lengte $x$ (in cm).
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de oppervlakte $A(x) = x(12 - x)$ is.
      antwoord: |-
        de breedte is $12 - x$
      uitwerking: |-
        Lengte plus breedte is de halve omtrek, $12$ cm. De breedte is dus $12 - x$.
    - opgave: |-
        Voor welke lengtes is de oppervlakte minstens $20$ cm$^2$?
      antwoord: |-
        van $2$ tot $10$ cm
      uitwerking: |-
        $12x - x^2 \geqslant 20 \iff x^2 - 12x + 20 \leqslant 0 \iff (x - 2)(x - 10) \leqslant 0$: $2 \leqslant x \leqslant 10$.

- id: h4-o15
  soort: opdracht
  niveau: 2
  thema: |-
    foutenjacht bij ongelijkheden
  opgave: |-
    Zoek de fout en verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Jan lost $x^2 > 9$ op: ``$x > 3$.''
      antwoord: |-
        $\ivoo{\minf}{-3} \cup \ivoo{3}{\pinf}$
      uitwerking: |-
        Ook $x < -3$ voldoet, bijvoorbeeld $(-4)^2 = 16 > 9$. Met het tekenschema van $x^2 - 9$: positief buiten $-3$ en $3$.
    - opgave: |-
        Lien lost $-x^2 + x + 2 > 0$ op: ``De nulwaarden zijn $-1$ en $2$, dus $x < -1$ of $x > 2$.''
      antwoord: |-
        $\ivoo{-1}{2}$
      uitwerking: |-
        Hier is $a < 0$: buiten de nulwaarden is het teken $-$. De oplossing ligt ertussen: $\ivoo{-1}{2}$. Controle: $x = 0$ geeft $2 > 0$.
    - opgave: |-
        Ahmed lost $x^2 - 4x < 0$ op: ``$x(x - 4) < 0$, dus $x < 0$ of $x - 4 < 0$.''
      antwoord: |-
        $\ivoo{0}{4}$
      uitwerking: |-
        De product-nulregel bestaat niet voor $< 0$. Een product is negatief als de factoren een verschillend teken hebben. Met het tekenschema: $\ivoo{0}{4}$.

- id: h4-o23
  soort: opdracht
  niveau: 2
  thema: |-
    waar is de waterstraal hoog genoeg?
  opgave: |-
    De straal van de fontein uit hoofdstuk 2 volgt $h(x) = -0,8x^2 + 3,2x + 0,4$, met $x$ en $h$ in meter. Waar is de straal hoger dan $2$ m? Rond af op een cm.
  antwoord: |-
    van $0,59$ m tot $3,41$ m van de spuitmond
  uitwerking: |-
    $-0,8x^2 + 3,2x + 0,4 > 2 \iff -0,8x^2 + 3,2x - 1,6 > 0 \iff x^2 - 4x + 2 < 0$ (deel door $-0,8$: teken om). $D = 16 - 8 = 8$, nulwaarden $2 \pm \sqrt2$, ongeveer $0,59$ en $3,41$. De straal is hoger dan $2$ m tussen $0,59$ m en $3,41$ m van de spuitmond.

- id: h4-o17
  soort: opdracht
  niveau: 2
  thema: |-
    parabool boven of onder een rechte
  opgave: |-
    Neem de parabool $y = x^2 - 3$ en de rechte $y = 2x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $x$ ligt de parabool onder de rechte?
      antwoord: |-
        $\ivoo{-1}{3}$
      uitwerking: |-
        $x^2 - 3 < 2x \iff x^2 - 2x - 3 < 0 \iff (x - 3)(x + 1) < 0$.
    - opgave: |-
        Voor welke $x$ ligt de parabool minstens $5$ eenheden boven de rechte?
      antwoord: |-
        $\ivog{\minf}{-2} \cup \ivgo{4}{\pinf}$
      uitwerking: |-
        $x^2 - 3 - 2x \geqslant 5 \iff x^2 - 2x - 8 \geqslant 0 \iff (x - 4)(x + 2) \geqslant 0$.

- id: h4-o14
  soort: opdracht
  niveau: 2
  thema: |-
    stopafstand en snelheid
  opgave: |-
    Stel dat de stopafstand van een auto $s(v) = 0,3v + 0,008v^2$ meter is, met $v$ de snelheid in km/h. Bij welke snelheden is de stopafstand korter dan $35$ m?
  antwoord: |-
    lager dan $50$ km/h
  uitwerking: |-
    $0,008v^2 + 0,3v - 35 < 0$. $D = 0,09 + 1,12 = 1,21$, $\sqrt D = 1,1$, nulwaarden $\tfrac{-0,3 \pm 1,1}{0,016}$: $50$ en $-87,5$. Negatief ertussen, en een snelheid is niet negatief: $0 \leqslant v < 50$ km/h.

- id: h4-o16
  soort: opdracht
  niveau: 3
  thema: |-
    een ongelijkheid bij een oplossing
  opgave: |-
    Geef een ongelijkheid met $x^2$ als hoogste macht, met de gegeven oplossing.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ivoo{-1}{5}$
      antwoord: |-
        bv.\ $x^2 - 4x - 5 < 0$
      uitwerking: |-
        Nulwaarden $-1$ en $5$, negatief ertussen: $(x + 1)(x - 5) < 0$.
    - opgave: |-
        $\ivog{\minf}{0} \cup \ivgo{3}{\pinf}$
      antwoord: |-
        bv.\ $x^2 - 3x \geqslant 0$
      uitwerking: |-
        Nulwaarden $0$ en $3$, positief erbuiten, grenzen erbij: $x(x - 3) \geqslant 0$.
    - opgave: |-
        $\{2\}$
      antwoord: |-
        bv.\ $(x - 2)^2 \leqslant 0$
      uitwerking: |-
        Alleen in $2$ is $(x - 2)^2$ niet positief.
    - opgave: |-
        $\R$
      antwoord: |-
        bv.\ $x^2 + 1 > 0$
      uitwerking: |-
        Geen nulwaarden en $a > 0$.

- id: h4-o18
  soort: opdracht
  niveau: 3
  thema: |-
    een dubbele ongelijkheid
  opgave: |-
    Voor welke $x$ is $0 < x^2 - 4x < 5$? Los beide ongelijkheden op en neem de getallen die aan allebei voldoen.
  antwoord: |-
    $\ivoo{-1}{0} \cup \ivoo{4}{5}$
  uitwerking: |-
    $x^2 - 4x > 0 \iff x(x - 4) > 0$: $x < 0$ of $x > 4$. En $x^2 - 4x < 5 \iff (x - 5)(x + 1) < 0$: $-1 < x < 5$. Op een getallenas zie je welke getallen aan allebei voldoen:
    \figuren{\begin{tikzpicture}[x=.6cm,y=.45cm]
      \getallenas{-2}{6}{-1/-1,0/0,4/4,5/5}
      \draw[grijs,thick] (-2.4,.55) -- (0,.55) (4,.55) -- (6.5,.55);
      \draw[inkt,thick] (-1,.85) -- (5,.85);
      \ivdeel{-1}{0}\ivdeel{4}{5}
    \end{tikzpicture}}
    $V = \ivoo{-1}{0} \cup \ivoo{4}{5}$.

- id: h4-o19
  soort: opdracht
  niveau: 3
  thema: |-
    een passe-partout
  opgave: |-
    Een foto van $20$ cm op $15$ cm krijgt rondom een passe-partout dat overal $x$ cm breed is. Foto en passe-partout samen mogen hoogstens $750$ cm$^2$ groot zijn, en het passe-partout moet minstens $1$ cm breed zijn. Welke breedtes kun je kiezen?
  antwoord: |-
    van $1$ cm tot $5$ cm
  uitwerking: |-
    $(20 + 2x)(15 + 2x) \leqslant 750 \iff 4x^2 + 70x + 300 \leqslant 750 \iff 2x^2 + 35x - 225 \leqslant 0$. $D = 1225 + 1800 = 3025 = 55^2$, nulwaarden $\tfrac{-35 \pm 55}{4}$: $5$ en $-22,5$. Dus $-22,5 \leqslant x \leqslant 5$, en met $x \geqslant 1$: $1 \leqslant x \leqslant 5$.

- id: h4-o21
  soort: opdracht
  pakketten: [4, 5]
  niveau: 3
  thema: |-
    een parabool volledig boven de x-as
  opgave: |-
    Voor welke waarden van $m$ ligt de parabool $y = x^2 + mx + m$ volledig boven de $x$-as? Controleer je antwoord met $m = 2$ en met $m = 5$.
  antwoord: |-
    $0 < m < 4$
  uitwerking: |-
    De parabool is naar boven geopend. Ze ligt volledig boven de $x$-as als er geen nulwaarden zijn: $D = m^2 - 4m < 0 \iff m(m - 4) < 0 \iff 0 < m < 4$. Controle: bij $m = 2$ is $D = 4 - 8 < 0$; bij $m = 5$ is $D = 25 - 20 > 0$.

- id: h4-o22
  soort: opdracht
  pakketten: [5]
  niveau: 3
  thema: |-
    bewijzen met een tekenschema
  opgave: |-
    Toon aan.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 - x + 1 > 0$ voor elke $x$.
      antwoord: |-
        $D = -3 < 0$ en $a > 0$
      uitwerking: |-
        $D = 1 - 4 = -3 < 0$ en $a = 1 > 0$: de parabool ligt volledig boven de $x$-as.
    - opgave: |-
        $a^2 + b^2 \geqslant 2ab$ voor alle getallen $a$ en $b$.
      antwoord: |-
        $a^2 + b^2 - 2ab = (a - b)^2 \geqslant 0$
      uitwerking: |-
        $a^2 + b^2 - 2ab = (a - b)^2$, en een kwadraat is nooit negatief.
    - opgave: |-
        $x + \dfrac1x \geqslant 2$ voor elke $x > 0$.
      antwoord: |-
        maal $x > 0$: $x^2 - 2x + 1 = (x - 1)^2 \geqslant 0$
      uitwerking: |-
        Omdat $x > 0$ mag je beide leden met $x$ vermenigvuldigen zonder dat het teken omkeert: de ongelijkheid is gelijkwaardig met $x^2 + 1 \geqslant 2x$, of $(x - 1)^2 \geqslant 0$. Dat klopt altijd.

- id: h4-boven
  soort: kort
  opgave: |-
    Voor welke $x$ geldt de ongelijkheid? Los algebraïsch op.
  lijst: enumerate
  delen:
    - opgave: |-
        De grafiek van $f(x) = x^2 + 1$ ligt boven die van $g(x) = 3x - 1$.
      antwoord: |-
        $V = \ivoo{\minf}{1} \cup \ivoo{2}{\pinf}$
      uitwerking: |-
        $x^2 + 1 > 3x - 1 \iff x^2 - 3x + 2 > 0 \iff (x - 1)(x - 2) > 0$. Naar boven geopend: buiten de nulwaarden.
    - opgave: |-
        $f(x) = x^2$ ligt op of onder $g(x) = -x^2 + 8$.
      antwoord: |-
        $V = \ivgg{-2}{2}$
      uitwerking: |-
        $x^2 \leqslant -x^2 + 8 \iff 2x^2 - 8 \leqslant 0 \iff 2(x + 2)(x - 2) \leqslant 0$: tussen de nulwaarden, grenzen inbegrepen.
    - opgave: |-
        $f(x) = x^2 - 4x$ ligt onder $g(x) = 2x - 9$.
      antwoord: |-
        $V = \emptyset$
      uitwerking: |-
        $x^2 - 4x < 2x - 9 \iff x^2 - 6x + 9 < 0 \iff (x - 3)^2 < 0$: nooit. De rechte raakt de parabool in $(3, -3)$ en ligt verder overal eronder.
    - opgave: |-
        $f(x) = -x^2 + 4x$ ligt boven $g(x) = x^2 - 2x$.
      antwoord: |-
        $V = \ivoo{0}{3}$
      uitwerking: |-
        $-x^2 + 4x > x^2 - 2x \iff -2x^2 + 6x > 0 \iff -2x(x - 3) > 0$. Naar onder geopend: tussen de nulwaarden $0$ en $3$.

- id: h4-o25
  soort: opdracht
  pakketten: [4, 5]
  niveau: 2
  thema: |-
    parameters met de discriminant
  opgave: |-
    Voor welke waarden van het onbekende getal geldt het?
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + 4x + k = 0$ heeft twee oplossingen.
      antwoord: |-
        $k < 4$
      uitwerking: |-
        $D = 16 - 4k > 0 \iff k < 4$.
    - opgave: |-
        $x^2 - 2x + m = 0$ heeft geen oplossingen.
      antwoord: |-
        $m > 1$
      uitwerking: |-
        $D = 4 - 4m < 0 \iff m > 1$.
    - opgave: |-
        $x^2 + bx + 4 = 0$ heeft minstens één oplossing.
      antwoord: |-
        $b \leqslant -4$ of $b \geqslant 4$
      uitwerking: |-
        $D = b^2 - 16 \geqslant 0$. Het tekenschema van $(b + 4)(b - 4)$: buiten de nulwaarden, grenzen inbegrepen.
    - opgave: |-
        $3x^2 + 6x + c > 0$ voor elke $x$.
      antwoord: |-
        $c > 3$
      uitwerking: |-
        De parabool is naar boven geopend; ze ligt volledig boven de $x$-as als ze die niet snijdt: $D = 36 - 12c < 0 \iff c > 3$.
    - opgave: |-
        $-x^2 + 2x + k < 0$ voor elke $x$.
      antwoord: |-
        $k < -1$
      uitwerking: |-
        Naar onder geopend; volledig onder de $x$-as als $D = 4 + 4k < 0$, dus $k < -1$.
    - opgave: |-
        De parabool $y = x^2 + kx + 1$ snijdt de $x$-as niet.
      antwoord: |-
        $-2 < k < 2$
      uitwerking: |-
        $D = k^2 - 4 < 0$: tussen de nulwaarden $-2$ en $2$.

- id: h4-o26
  soort: opdracht
  pakketten: [4, 5]
  niveau: 3
  thema: |-
    parameters: een stap verder
  opgave: |-
    Voor welke waarden van het onbekende getal geldt het? Let op de gevallen waarin het geen tweedegraadsvergelijking meer is.
  lijst: enumerate
  delen:
    - opgave: |-
        $mx^2 + 4x + 1 = 0$ heeft twee oplossingen.
      antwoord: |-
        $m < 4$ en $m \neq 0$
      uitwerking: |-
        Voor $m = 0$ staat er $4x + 1 = 0$: één oplossing. Voor $m \neq 0$: $D = 16 - 4m > 0 \iff m < 4$.
    - opgave: |-
        De parabool $y = kx^2 - 2x + k$ ligt volledig boven de $x$-as.
      antwoord: |-
        $k > 1$
      uitwerking: |-
        Er is nodig: naar boven geopend ($k > 0$) en geen nulwaarden: $D = 4 - 4k^2 < 0 \iff k^2 > 1 \iff k < -1$ of $k > 1$. Samen: $k > 1$.
    - opgave: |-
        De rechte $y = mx$ snijdt de parabool $y = x^2 + 4$ in twee punten.
      antwoord: |-
        $m < -4$ of $m > 4$
      uitwerking: |-
        $x^2 + 4 = mx \iff x^2 - mx + 4 = 0$, met $D = m^2 - 16 > 0$. Voor $m = \pm 4$ raakt de rechte de parabool.
    - opgave: |-
        $x^2 + px + p = 0$ heeft geen oplossingen.
      antwoord: |-
        $0 < p < 4$
      uitwerking: |-
        $D = p^2 - 4p = p(p - 4) < 0$: tussen de nulwaarden $0$ en $4$.

- id: h4-o27
  soort: opdracht
  niveau: 2
  thema: |-
    twee functies vergelijken in een context
  opgave: |-
    Een drukkerij rekent voor $x$ dozen flyers $K_1(x) = 0,5x^2 + 16$ euro. Een tweede drukkerij rekent $K_2(x) = 6x$ euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Bij hoeveel dozen is de eerste drukkerij goedkoper?
      antwoord: |-
        bij $5$, $6$ of $7$ dozen
      uitwerking: |-
        $0,5x^2 + 16 < 6x \iff x^2 - 12x + 32 < 0 \iff (x - 4)(x - 8) < 0$, dus $4 < x < 8$. Een aantal dozen is een geheel getal: $5$, $6$ of $7$.
    - opgave: |-
        Bij hoeveel dozen kosten ze evenveel?
      antwoord: |-
        bij $4$ en bij $8$ dozen
      uitwerking: |-
        De nulwaarden van $x^2 - 12x + 32$: $4$ en $8$. Controle: $K_1(4) = 24 = K_2(4)$ en $K_1(8) = 48 = K_2(8)$.
    - opgave: |-
        Teken beide grafieken voor $0 \leqslant x \leqslant 10$ en duid aan waar de eerste drukkerij goedkoper is.
      antwoord: |-
        tussen de snijpunten $(4, 24)$ en $(8, 48)$ ligt de parabool onder de rechte
      uitwerking: |-
        De parabool $K_1$ (top $(0, 16)$) ligt onder de rechte $K_2$ tussen de snijpunten.

# --- Test jezelf -----------------------------------------------------------------------

- id: h4-t1
  soort: test
  niveau: 1
  opgave: |-
    Maak het tekenschema van $f(x) = -x^2 + x + 6$.
  antwoord: |-
    $-$ $0$ $+$ $0$ $-$ bij $-2$ en $3$
  uitwerking: |-
    $-(x^2 - x - 6) = -(x - 3)(x + 2)$, $a < 0$.
    \tekenschema{5}{ & -2 & & 3 & }{- & 0 & + & 0 & -}

- id: h4-t2
  soort: test
  niveau: 1
  opgave: |-
    Maak het tekenschema van $g(x) = x^2 - 8x + 16$.
  antwoord: |-
    $+$ $0$ $+$ bij $4$
  uitwerking: |-
    $(x - 4)^2$: één nulwaarde, $a > 0$.
    \tekenschema[g(x)]{3}{ & 4 & }{+ & 0 & +}

- id: h4-t3
  soort: test
  niveau: 1
  opgave: |-
    Los op: $x^2 - 2x - 15 \leqslant 0$.
  antwoord: |-
    $\ivgg{-3}{5}$
  uitwerking: |-
    $(x - 5)(x + 3) \leqslant 0$: negatief of nul tussen de nulwaarden.

- id: h4-t4
  soort: test
  niveau: 1
  opgave: |-
    Los op: $-x^2 + 3x < 0$.
  antwoord: |-
    $\ivoo{\minf}{0} \cup \ivoo{3}{\pinf}$
  uitwerking: |-
    $-x(x - 3)$: nulwaarden $0$ en $3$, $a < 0$: negatief erbuiten.

- id: h4-t5
  soort: test
  niveau: 2
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 + 2x + 3 < 0$
      antwoord: |-
        $\emptyset$
      uitwerking: |-
        $D = 4 - 12 < 0$, $a > 0$: altijd positief.
    - opgave: |-
        $(x - 5)^2 > 0$
      antwoord: |-
        $\R \setminus \{5\}$
      uitwerking: |-
        Positief behalve in $5$.

- id: h4-t6
  soort: test
  niveau: 2
  opgave: |-
    Los op: $x^2 \geqslant 3x + 4$.
  antwoord: |-
    $\ivog{\minf}{-1} \cup \ivgo{4}{\pinf}$
  uitwerking: |-
    $x^2 - 3x - 4 = (x - 4)(x + 1) \geqslant 0$.

- id: h4-t7
  soort: test
  niveau: 2
  opgave: |-
    Een vuurpijl is na $t$ seconden $h(t) = -5t^2 + 30t$ meter hoog. Wanneer is hij hoger dan $40$ m?
  antwoord: |-
    tussen $2$ s en $4$ s
  uitwerking: |-
    $-5t^2 + 30t > 40 \iff t^2 - 6t + 8 < 0 \iff (t - 2)(t - 4) < 0$: $2 < t < 4$.

- id: h4-t8
  soort: test
  pakketten: [4, 5]
  niveau: 2
  opgave: |-
    Voor welke $c$ heeft $x^2 + 4x + c = 0$ geen oplossingen?
  antwoord: |-
    $c > 4$
  uitwerking: |-
    $D = 16 - 4c < 0 \iff c > 4$.
