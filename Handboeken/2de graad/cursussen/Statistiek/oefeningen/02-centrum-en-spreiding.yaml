# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.
# Alle gegevens zijn verzonnen. De standaardafwijking deelt door n (TI-84: sigma x).
# pakketten: h2-transformatie en h2-o21 alleen in pakket 5.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Reken uit.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        het gemiddelde van 6, 8 en 13
      antwoord: |-
        $9$
      uitwerking: |-
        $\tfrac{6 + 8 + 13}{3} = \tfrac{27}{3} = 9$.
    - opgave: |-
        de mediaan van 3, 9, 4, 7, 12
      antwoord: |-
        $7$
      uitwerking: |-
        $3, 4, 7, 9, 12$: het middelste getal.
    - opgave: |-
        $(-3)^2$ en $-3^2$
      antwoord: |-
        $9$ en $-9$
      uitwerking: |-
        Bij $(-3)^2$ is het grondtal $-3$.
    - opgave: |-
        $\sqrt{49}$ en $\sqrt{\tfrac{18}{2}}$
      antwoord: |-
        $7$ en $3$
      uitwerking: |-
        $\sqrt{\tfrac{18}{2}} = \sqrt9 = 3$.
    - opgave: |-
        $\sqrt{2}$ op twee cijfers na de komma
      antwoord: |-
        $1,41$
      uitwerking: |-
        $\sqrt2 \approx 1,414$.
    - opgave: |-
        $1 \cdot 5 + 2 \cdot 3 + 3 \cdot 2$
      antwoord: |-
        $17$
      uitwerking: |-
        $5 + 6 + 6 = 17$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Yasmine en Bram kregen vier toetsen op 20. Yasmine haalde 12, 12, 13 en 13. Bram haalde 6, 19, 8 en 17.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken voor elk het gemiddelde.
      antwoord: |-
        beide $12,5$
      uitwerking: |-
        Yasmine: $\tfrac{50}{4} = 12,5$. Bram: $\tfrac{50}{4} = 12,5$.
    - opgave: |-
        Wie haalt het meest regelmatige resultaat?
      antwoord: |-
        Yasmine
      uitwerking: |-
        Haar punten liggen allemaal dicht bij 12,5.
    - opgave: |-
        Bedenk een getal dat zegt hoe ver de punten van elk uit elkaar liggen.
      antwoord: |-
        bijvoorbeeld hoogste min laagste: 1 en 13
      uitwerking: |-
        Bijvoorbeeld het verschil tussen het hoogste en het laagste punt: $13 - 12 = 1$ en $19 - 6 = 13$. Ook het gemiddelde verschil met 12,5 kan: $0,5$ en $5,5$.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h2-gemiddelde
  soort: kort
  opgave: |-
    Bereken het gemiddelde.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $7,\ 9,\ 4,\ 12,\ 8$
      antwoord: |-
        $8$
      uitwerking: |-
        $\tfrac{40}{5} = 8$.
    - opgave: |-
        $1,5;\ 2,3;\ 1,9;\ 2,7$
      antwoord: |-
        $2,1$
      uitwerking: |-
        $\tfrac{8,4}{4} = 2,1$.
    - opgave: |-
        $-4,\ 2,\ {-1},\ 5,\ {-7},\ 0$
      antwoord: |-
        $\approx -0,83$
      uitwerking: |-
        $\tfrac{-5}{6} \approx -0,83$.
    - opgave: |-
        de punten 13, 15, 11 en 16 op 20
      antwoord: |-
        $13,75$
      uitwerking: |-
        $\tfrac{55}{4} = 13,75$.

- id: h2-gewogen
  soort: kort
  opgave: |-
    In een klas van 25 leerlingen telt elke leerling hoeveel keer hij per week sport.
    \gegevens{|c|c|c|c|c|c|}{\hline keer per week & 0 & 1 & 2 & 3 & 4 \\ \hline frequentie & 3 & 5 & 8 & 6 & 3 \\ \hline}
    Bereken het gemiddelde aantal keer per week.
  antwoord: |-
    $2,04$
  uitwerking: |-
    $\xbar = \dfrac{0 \cdot 3 + 1 \cdot 5 + 2 \cdot 8 + 3 \cdot 6 + 4 \cdot 3}{25} = \dfrac{51}{25} = 2,04$.

- id: h2-klassen
  soort: kort
  opgave: |-
    Een loopclub noteert de tijd die 50 leden over 5 km doen.
    \gegevens{|c|c|c|c|c|c|}{\hline tijd (min) & $[20, 25[$ & $[25, 30[$ & $[30, 35[$ & $[35, 40[$ & $[40, 45[$ \\ \hline frequentie & 4 & 12 & 18 & 11 & 5 \\ \hline}
  lijst: enumerate
  delen:
    - opgave: |-
        Schat de gemiddelde tijd.
      antwoord: |-
        $32,6$ minuten
      uitwerking: |-
        Klassenmiddens $22,5$; $27,5$; $32,5$; $37,5$; $42,5$: $\xbar \approx \dfrac{22,5 \cdot 4 + 27,5 \cdot 12 + 32,5 \cdot 18 + 37,5 \cdot 11 + 42,5 \cdot 5}{50} = \dfrac{1630}{50} = 32,6$.
    - opgave: |-
        Wat is de modale klasse?
      antwoord: |-
        $[30, 35[$
      uitwerking: |-
        De grootste frequentie: 18.

- id: h2-mediaanmodus
  soort: kort
  opgave: |-
    Een schoenwinkel noteert de schoenmaat van 21 klanten.
    \gegevens{|c|c|c|c|c|c|c|}{\hline maat & 37 & 38 & 39 & 40 & 41 & 42 \\ \hline frequentie & 2 & 4 & 6 & 5 & 3 & 1 \\ \hline}
    Bepaal de mediaan, de modus en het gemiddelde.
  antwoord: |-
    $\Me = 39$, $\Mo = 39$, $\xbar \approx 39,3$
  uitwerking: |-
    De mediaan staat op plaats 11. Cumulatief: 2, 6, 12: het 11de gegeven is 39. De modus is 39 (frequentie 6). $\xbar = \tfrac{37 \cdot 2 + 38 \cdot 4 + 39 \cdot 6 + 40 \cdot 5 + 41 \cdot 3 + 42 \cdot 1}{21} = \tfrac{825}{21} \approx 39,3$. Voor de winkel is de modus het nuttigst: die maat moet ze het meest in voorraad hebben.

- id: h2-gemofmed
  soort: kort
  opgave: |-
    In een straat werden zes huizen verkocht. De prijzen in duizend euro: 210, 245, 230, 260, 225, 1150.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het gemiddelde en de mediaan.
      antwoord: |-
        $\xbar \approx 386,7$, $\Me = 237,5$
      uitwerking: |-
        $\xbar = \tfrac{2320}{6} \approx 386,7$ duizend euro. Gerangschikt: $210, 225, 230, 245, 260, 1150$, dus $\Me = \tfrac{230 + 245}{2} = 237,5$.
    - opgave: |-
        Een makelaar schrijft: \textit{In deze straat kost een huis gemiddeld bijna 390\,000 euro.} Is dat een eerlijke beschrijving?
      antwoord: |-
        nee, de mediaan is beter
      uitwerking: |-
        Vijf van de zes huizen kosten minder dan 260\,000 euro. De villa van 1\,150\,000 euro is een uitschieter die het gemiddelde naar boven trekt.

- id: h2-vbika
  soort: kort
  opgave: |-
    Bereken de variatiebreedte en de interkwartielafstand.
  lijst: enumerate
  delen:
    - opgave: |-
        $14,\ 9,\ 21,\ 12,\ 17,\ 25,\ 11$
      antwoord: |-
        $\VB = 16$, $\IKA = 10$
      uitwerking: |-
        $9, 11, 12, \fbox{14}, 17, 21, 25$. $\VB = 25 - 9 = 16$. $Q_1 = 11$, $Q_3 = 21$, $\IKA = 10$.
    - opgave: |-
        $3,2;\ 4,8;\ 3,9;\ 5,5;\ 4,1;\ 3,5;\ 6,0;\ 4,4$
      antwoord: |-
        $\VB = 2,8$, $\IKA = 1,45$
      uitwerking: |-
        $3,2; 3,5; 3,9; 4,1 \mid 4,4; 4,8; 5,5; 6,0$. $\VB = 6,0 - 3,2 = 2,8$. $Q_1 = \tfrac{3,5 + 3,9}{2} = 3,7$ en $Q_3 = \tfrac{4,8 + 5,5}{2} = 5,15$, dus $\IKA = 1,45$.

- id: h2-sd
  soort: kort
  opgave: |-
    Bereken met een tabel de standaardafwijking.
  lijst: enumerate
  delen:
    - opgave: |-
        $4,\ 7,\ 5,\ 9,\ 10$
      antwoord: |-
        $s \approx 2,28$
      uitwerking: |-
        $\xbar = 7$. Afwijkingen $-3, 0, -2, 2, 3$ (samen 0), kwadraten $9, 0, 4, 4, 9$ (samen 26). $s = \sqrt{\tfrac{26}{5}} = \sqrt{5,2} \approx 2,28$.
    - opgave: |-
        $6,\ 7,\ 7,\ 7,\ 8$. Vergelijk met a.
      antwoord: |-
        $s \approx 0,63$
      uitwerking: |-
        $\xbar = 7$. Afwijkingen $-1, 0, 0, 0, 1$, kwadraten samen 2. $s = \sqrt{\tfrac25} \approx 0,63$. Hetzelfde gemiddelde, maar veel minder spreiding.

- id: h2-rekentoestel
  soort: kort
  opgave: |-
    Gebruik je rekentoestel.
  lijst: enumerate
  delen:
    - opgave: |-
        Twaalf leerlingen springen zo ver mogelijk (in dm): 48, 52, 61, 45, 57, 50, 66, 43, 55, 59, 47, 53. Bereken het gemiddelde, de standaardafwijking en de vijfgetallensamenvatting.
      antwoord: |-
        $\xbar = 53$, $s \approx 6,61$; $43$; $47,5$; $52,5$; $58$; $66$
      uitwerking: |-
        \texttt{1-Var Stats L1}: $\xbar = 53$, $\sigma x \approx 6,61$, \texttt{minX} $= 43$, $Q_1 = 47,5$, \texttt{Med} $= 52,5$, $Q_3 = 58$, \texttt{maxX} $= 66$.
    - opgave: |-
        Een voetbalploeg scoorde in 30 wedstrijden 0 doelpunten (5 keer), 1 (9 keer), 2 (9 keer), 3 (4 keer), 4 (2 keer) en 5 (1 keer). Bereken het gemiddelde en de standaardafwijking.
      antwoord: |-
        $\xbar \approx 1,73$, $s \approx 1,26$
      uitwerking: |-
        Waarden in \texttt{L1}, frequenties in \texttt{L2}, \texttt{1-Var Stats L1,L2}: $\xbar = \tfrac{52}{30} \approx 1,73$ en $\sigma x \approx 1,26$. Controleer: $n = 30$.

- id: h2-transformatie
  soort: kort
  pakketten: [5]
  opgave: |-
    In een stad is de middagtemperatuur in mei gemiddeld $15\,^\circ$C, met een standaardafwijking van $4\,^\circ$C. In graden Fahrenheit is de temperatuur $F = 1,8 \cdot C + 32$. Bereken het gemiddelde en de standaardafwijking in graden Fahrenheit.
  antwoord: |-
    $59\,^\circ$F en $7,2\,^\circ$F
  uitwerking: |-
    $a = 1,8$ en $b = 32$: $\xbar = 1,8 \cdot 15 + 32 = 59$ en $s = 1,8 \cdot 4 = 7,2$. De 32 verandert de spreiding niet.

# --- Opdrachten ------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    gemiddelde, mediaan, modus
  opgave: |-
    Bereken het gemiddelde, de mediaan en de modus.
  lijst: enumerate
  delen:
    - opgave: |-
        $5,\ 8,\ 8,\ 3,\ 6,\ 9,\ 8$
      antwoord: |-
        $\xbar \approx 6,71$, $\Me = 8$, $\Mo = 8$
      uitwerking: |-
        $\tfrac{47}{7} \approx 6,71$. Gerangschikt $3, 5, 6, \fbox{8}, 8, 8, 9$.
    - opgave: |-
        $12,\ 15,\ 11,\ 15,\ 18,\ 11$
      antwoord: |-
        $\xbar \approx 13,67$, $\Me = 13,5$, modi 11 en 15
      uitwerking: |-
        $\tfrac{82}{6} \approx 13,67$. Gerangschikt $11, 11, 12, 15, 15, 18$: $\Me = \tfrac{12 + 15}{2}$. Twee modi.
    - opgave: |-
        $2,4;\ 3,1;\ 2,8;\ 2,4;\ 3,5$
      antwoord: |-
        $\xbar = 2,84$, $\Me = 2,8$, $\Mo = 2,4$
      uitwerking: |-
        $\tfrac{14,2}{5} = 2,84$. Gerangschikt $2,4; 2,4; \fbox{2,8}; 3,1; 3,5$.
    - opgave: |-
        $-2,\ 5,\ 0,\ {-2},\ 3,\ 8,\ {-2},\ 4$
      antwoord: |-
        $\xbar = 1,75$, $\Me = 1,5$, $\Mo = -2$
      uitwerking: |-
        $\tfrac{14}{8} = 1,75$. Gerangschikt $-2, -2, -2, 0, 3, 4, 5, 8$: $\Me = \tfrac{0 + 3}{2}$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    variatiebreedte en interkwartielafstand
  opgave: |-
    Bereken de variatiebreedte en de interkwartielafstand.
  lijst: enumerate
  delen:
    - opgave: |-
        $45,\ 38,\ 52,\ 41,\ 60,\ 36,\ 49,\ 55$
      antwoord: |-
        $\VB = 24$, $\IKA = 14$
      uitwerking: |-
        $36, 38, 41, 45 \mid 49, 52, 55, 60$: $Q_1 = 39,5$, $Q_3 = 53,5$.
    - opgave: |-
        $7,5;\ 8,2;\ 6,9;\ 9,4;\ 7,1;\ 8,8;\ 7,7;\ 6,5;\ 9,0;\ 8,0;\ 7,3$
      antwoord: |-
        $\VB = 2,9$, $\IKA = 1,7$
      uitwerking: |-
        $6,5; 6,9; 7,1; 7,3; 7,5; \fbox{7,7}; 8,0; 8,2; 8,8; 9,0; 9,4$: $Q_1 = 7,1$, $Q_3 = 8,8$.
    - opgave: |-
        $120,\ 95,\ 140,\ 110,\ 105,\ 180,\ 125,\ 100,\ 130$
      antwoord: |-
        $\VB = 85$, $\IKA = 32,5$
      uitwerking: |-
        $95, 100, 105, 110, \fbox{120}, 125, 130, 140, 180$: $Q_1 = \tfrac{100 + 105}{2} = 102,5$, $Q_3 = \tfrac{130 + 140}{2} = 135$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    centrummaten uit een frequentietabel
  opgave: |-
    Emma gooit 60 keer met een dobbelsteen.
    \gegevens{|c|c|c|c|c|c|c|}{\hline ogen & 1 & 2 & 3 & 4 & 5 & 6 \\ \hline frequentie & 8 & 11 & 9 & 12 & 10 & 10 \\ \hline}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het gemiddelde aantal ogen.
      antwoord: |-
        $\approx 3,58$
      uitwerking: |-
        $\tfrac{1 \cdot 8 + 2 \cdot 11 + 3 \cdot 9 + 4 \cdot 12 + 5 \cdot 10 + 6 \cdot 10}{60} = \tfrac{215}{60} \approx 3,58$.
    - opgave: |-
        Bepaal de mediaan en de modus.
      antwoord: |-
        $\Me = 4$, $\Mo = 4$
      uitwerking: |-
        Het 30ste en het 31ste gegeven. Cumulatief: 8, 19, 28, 40: beide zijn 4. De modus is 4 (12 keer).

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    standaardafwijking met het rekentoestel
  opgave: |-
    Bereken met je rekentoestel het gemiddelde en de standaardafwijking. Rond af op twee cijfers na de komma.
  lijst: enumerate
  delen:
    - opgave: |-
        de massa van acht pakjes (in kg): 2,8; 3,4; 3,1; 2,5; 3,9; 3,0; 2,7; 3,6
      antwoord: |-
        $\xbar \approx 3,13$, $s \approx 0,45$
      uitwerking: |-
        $\xbar = 3,125$ en $\sigma x \approx 0,4465$.
    - opgave: |-
        de lengte van tien leerlingen (in cm): 152, 168, 175, 160, 181, 149, 171, 166, 158, 177
      antwoord: |-
        $\xbar = 165,7$, $s \approx 10,20$
      uitwerking: |-
        $\xbar = 165,7$ en $\sigma x \approx 10,1985$.
    - opgave: |-
        de reactietijd van zeven chauffeurs (in s): 0,45; 0,52; 0,38; 0,61; 0,49; 0,55; 0,42
      antwoord: |-
        $\xbar \approx 0,49$, $s \approx 0,07$
      uitwerking: |-
        $\xbar \approx 0,4886$ en $\sigma x \approx 0,0732$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    een centrummaat kiezen
  opgave: |-
    Welke centrummaat past het best: het gemiddelde, de mediaan of de modus? Leg uit.
  lijst: enumerate
  delen:
    - opgave: |-
        de lievelingskleur van de leerlingen van een klas
      antwoord: |-
        modus
      uitwerking: |-
        Kwalitatieve gegevens: alleen de modus bestaat.
    - opgave: |-
        het typische loon in een bedrijf met een paar zeer hoge lonen
      antwoord: |-
        mediaan
      uitwerking: |-
        De hoge lonen zijn uitschieters die het gemiddelde naar boven trekken.
    - opgave: |-
        hoeveel water een gezin per dag verbruikt, als je wilt weten hoeveel water een hele straat nodig heeft
      antwoord: |-
        gemiddelde
      uitwerking: |-
        Gemiddelde maal aantal gezinnen geeft het totaal.
    - opgave: |-
        welke kledingmaat een winkel het meest moet bestellen
      antwoord: |-
        modus
      uitwerking: |-
        De maat die het vaakst gekocht wordt.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    centrummaten bij klassen
  opgave: |-
    De boekentassen van 40 leerlingen worden gewogen.
    \gegevens{|c|c|c|c|c|c|}{\hline massa (kg) & $[2, 4[$ & $[4, 6[$ & $[6, 8[$ & $[8, 10[$ & $[10, 12[$ \\ \hline frequentie & 5 & 12 & 14 & 6 & 3 \\ \hline}
  lijst: enumerate
  delen:
    - opgave: |-
        Schat de gemiddelde massa.
      antwoord: |-
        $6,5$ kg
      uitwerking: |-
        $\tfrac{3 \cdot 5 + 5 \cdot 12 + 7 \cdot 14 + 9 \cdot 6 + 11 \cdot 3}{40} = \tfrac{260}{40} = 6,5$.
    - opgave: |-
        Wat is de modale klasse?
      antwoord: |-
        $[6, 8[$
      uitwerking: |-
        Frequentie 14.
    - opgave: |-
        In welke klasse ligt de mediaan?
      antwoord: |-
        $[6, 8[$
      uitwerking: |-
        Het 20ste en 21ste gegeven. Cumulatief: 5, 17, 31: beide in $[6, 8[$.
    - opgave: |-
        Een boekentas mag hoogstens $10~\%$ van je lichaamsgewicht wegen. Hoeveel van deze tassen zijn te zwaar voor een leerling van 60 kg?
      antwoord: |-
        23, op een tas van precies 6 kg na
      uitwerking: |-
        $10~\%$ van 60 kg is 6 kg. Te zwaar zijn alle tassen uit de klassen $[6, 8[$, $[8, 10[$ en $[10, 12[$, behalve een tas van precies 6 kg: samen $14 + 6 + 3 = 23$ tassen.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    een ontbrekend gegeven
  opgave: |-
    Na vier toetsen heeft Jonas gemiddeld $13,5$ op 20. Na de vijfde toets is zijn gemiddelde 14.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel haalde hij op de vijfde toets?
      antwoord: |-
        16
      uitwerking: |-
        De som van vier toetsen is $4 \cdot 13,5 = 54$, die van vijf toetsen $5 \cdot 14 = 70$. De vijfde: $70 - 54 = 16$.
    - opgave: |-
        Kan hij na de zesde toets gemiddeld 15 hebben?
      antwoord: |-
        alleen met 20 op 20
      uitwerking: |-
        Dan moet de som $6 \cdot 15 = 90$ zijn: hij heeft $90 - 70 = 20$ punten nodig, het maximum.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    gemiddelde of mediaan
  opgave: |-
    Een klein bedrijf heeft tien medewerkers. Hun maandlonen in euro: 2200, 2300, 2400, 2400, 2500, 2600, 2700, 2900, 3000 en 9500 (de directeur).
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het gemiddelde, de mediaan en de modus.
      antwoord: |-
        $3250$, $2550$, $2400$
      uitwerking: |-
        $\xbar = \tfrac{32\,500}{10} = 3250$, $\Me = \tfrac{2500 + 2600}{2} = 2550$, $\Mo = 2400$.
    - opgave: |-
        De directeur zegt in een advertentie: \textit{Bij ons verdien je gemiddeld 3250 euro.} Een medewerker vindt dat misleidend. Wie heeft gelijk?
      antwoord: |-
        de medewerker
      uitwerking: |-
        Het getal klopt, maar negen van de tien medewerkers verdienen minder. Het loon van de directeur is een uitschieter. De mediaan (2550 euro) zegt beter wat een nieuwe medewerker kan verwachten.
    - opgave: |-
        De directeur verdubbelt zijn eigen loon. Wat gebeurt er met het gemiddelde en de mediaan?
      antwoord: |-
        $\xbar$ wordt 4200, $\Me$ blijft 2550
      uitwerking: |-
        De som stijgt met 9500: $\tfrac{42\,000}{10} = 4200$. De volgorde blijft dezelfde, dus de mediaan verandert niet.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    standaardafwijking met een tabel
  opgave: |-
    Twee juryleden geven punten op 10 aan vijf dansers. Jurylid 1 geeft 6, 8, 7, 9, 5. Jurylid 2 geeft 3, 9, 7, 10, 6.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken voor elk jurylid het gemiddelde.
      antwoord: |-
        beide 7
      uitwerking: |-
        $\tfrac{35}{5} = 7$ en $\tfrac{35}{5} = 7$.
    - opgave: |-
        Bereken met een tabel de standaardafwijking van elk jurylid.
      antwoord: |-
        $s_1 \approx 1,41$, $s_2 \approx 2,45$
      uitwerking: |-
        Jurylid 1: afwijkingen $-1, 1, 0, 2, -2$, kwadraten samen 10, $s_1 = \sqrt{\tfrac{10}{5}} = \sqrt2 \approx 1,41$. Jurylid 2: afwijkingen $-4, 2, 0, 3, -1$, kwadraten samen 30, $s_2 = \sqrt{6} \approx 2,45$.
    - opgave: |-
        Welk jurylid maakt het grootste onderscheid tussen de dansers?
      antwoord: |-
        jurylid 2
      uitwerking: |-
        Zijn punten liggen verder uit elkaar: een grotere standaardafwijking.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    spreiding vergelijken
  opgave: |-
    De middagtemperaturen (in $^\circ$C) tijdens een week in twee steden:
    \gegevens{|c|c|c|c|c|c|c|c|}{\hline stad P & 18 & 19 & 21 & 20 & 22 & 19 & 21 \\ \hline stad Q & 12 & 25 & 16 & 28 & 14 & 26 & 19 \\ \hline}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken voor elke stad het gemiddelde en de mediaan.
      antwoord: |-
        P: 20 en 20; Q: 20 en 19
      uitwerking: |-
        P: $\tfrac{140}{7} = 20$, gerangschikt $18, 19, 19, \fbox{20}, 21, 21, 22$. Q: $\tfrac{140}{7} = 20$, gerangschikt $12, 14, 16, \fbox{19}, 25, 26, 28$.
    - opgave: |-
        Bereken voor elke stad de variatiebreedte, de interkwartielafstand en (met je rekentoestel) de standaardafwijking.
      antwoord: |-
        P: 4, 2, $1,31$; Q: 16, 12, $5,88$
      uitwerking: |-
        P: $\VB = 4$, $Q_1 = 19$, $Q_3 = 21$, $\IKA = 2$, $s \approx 1,31$. Q: $\VB = 16$, $Q_1 = 14$, $Q_3 = 26$, $\IKA = 12$, $s \approx 5,88$.
    - opgave: |-
        In welke stad pak je best voor elke dag dezelfde kleren in? Leg uit met de maten.
      antwoord: |-
        stad P
      uitwerking: |-
        Hetzelfde gemiddelde, maar in P zijn alle spreidingsmaten veel kleiner: de temperatuur is er elke dag ongeveer gelijk.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    een gegeven toevoegen
  opgave: |-
    Twintig leerlingen hebben op een toets gemiddeld $13,5$ op 20. Een leerling die ziek was, maakt de toets later en haalt 18.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is nu het gemiddelde van de 21 leerlingen?
      antwoord: |-
        $\approx 13,71$
      uitwerking: |-
        Som: $20 \cdot 13,5 + 18 = 288$. $\xbar = \tfrac{288}{21} \approx 13,71$.
    - opgave: |-
        Kun je de nieuwe mediaan berekenen?
      antwoord: |-
        nee
      uitwerking: |-
        Daarvoor moet je de afzonderlijke punten kennen. Je weet wel dat de mediaan niet daalt.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    groepen samenvoegen
  opgave: |-
    In klas 3A halen 20 leerlingen gemiddeld 14 op 20, in klas 3B halen 25 leerlingen gemiddeld 12. Sam zegt: \textit{Samen halen ze gemiddeld 13, want dat ligt in het midden.}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het gemiddelde van alle 45 leerlingen.
      antwoord: |-
        $\approx 12,89$
      uitwerking: |-
        Som: $20 \cdot 14 + 25 \cdot 12 = 280 + 300 = 580$. $\tfrac{580}{45} \approx 12,89$.
    - opgave: |-
        Waarom heeft Sam het mis? Wanneer zou hij gelijk hebben?
      antwoord: |-
        3B telt meer leerlingen
      uitwerking: |-
        De grotere klas weegt zwaarder door: het gemiddelde ligt dichter bij 12. Sam heeft alleen gelijk als beide klassen even groot zijn.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    maten uit een frequentietabel met het rekentoestel
  opgave: |-
    Een gezondheidsdienst vraagt aan 40 gezinnen hoeveel tv-toestellen ze hebben.
    \gegevens{|c|c|c|c|c|c|}{\hline toestellen & 0 & 1 & 2 & 3 & 4 \\ \hline frequentie & 2 & 13 & 15 & 8 & 2 \\ \hline}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het gemiddelde en de standaardafwijking met je rekentoestel.
      antwoord: |-
        $\xbar = 1,875$, $s \approx 0,95$
      uitwerking: |-
        \texttt{1-Var Stats L1,L2}: $\xbar = \tfrac{75}{40} = 1,875$ en $\sigma x \approx 0,954$.
    - opgave: |-
        Bepaal de mediaan en de modus.
      antwoord: |-
        $\Me = 2$, $\Mo = 2$
      uitwerking: |-
        Het 20ste en 21ste gegeven: cumulatief 2, 15, 30, dus beide 2. De modus is 2 (15 gezinnen).

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    eigenschappen van de maten
  opgave: |-
    Waar of niet waar? Geef een voorbeeld of een reden.
  lijst: enumerate
  delen:
    - opgave: |-
        Het gemiddelde is altijd een van de gegevens.
      antwoord: |-
        niet waar
      uitwerking: |-
        Het gemiddelde van 1 en 2 is $1,5$.
    - opgave: |-
        De standaardafwijking is nooit negatief.
      antwoord: |-
        waar
      uitwerking: |-
        Ze is een vierkantswortel.
    - opgave: |-
        Als de standaardafwijking 0 is, zijn alle gegevens gelijk.
      antwoord: |-
        waar
      uitwerking: |-
        Dan is elk kwadraat $(x - \xbar)^2$ gelijk aan 0, dus elk gegeven is $\xbar$.
    - opgave: |-
        De interkwartielafstand is nooit groter dan de variatiebreedte.
      antwoord: |-
        waar
      uitwerking: |-
        $Q_1$ en $Q_3$ liggen tussen het minimum en het maximum.
    - opgave: |-
        Als je het grootste gegeven groter maakt, verandert de mediaan.
      antwoord: |-
        niet waar
      uitwerking: |-
        De volgorde blijft dezelfde, dus ook het middelste gegeven (bij minstens 3 gegevens).
    - opgave: |-
        Het gemiddelde ligt altijd tussen het minimum en het maximum.
      antwoord: |-
        waar
      uitwerking: |-
        Maak je alle gegevens gelijk aan het minimum, dan is de som kleiner; gelijk aan het maximum, dan groter.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    maten uit boxplots
  figuur:
    code: |-
      \begin{tikzpicture}[x=.15cm,font=\scriptsize]
        \boxplot[.5]{1.3}{148}{158}{163}{167}{176} \node[left] at (143,1.3) {meisjes};
        \boxplot[.5]{.55}{150}{161}{168}{174}{189} \node[left] at (143,.55) {jongens};
        \getalas[cm]{145}{10}{185}
      \end{tikzpicture}
  opgave: |-
    De boxplots tonen de lengte van de meisjes en de jongens van het 3de jaar van een school.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees voor beide groepen de mediaan af.
      antwoord: |-
        163 cm en 168 cm
      uitwerking: |-
        De streep in de box.
    - opgave: |-
        Bereken voor beide groepen de variatiebreedte en de interkwartielafstand.
      antwoord: |-
        meisjes 28 en 9; jongens 39 en 13
      uitwerking: |-
        Meisjes: $176 - 148 = 28$ en $167 - 158 = 9$. Jongens: $189 - 150 = 39$ en $174 - 161 = 13$.
    - opgave: |-
        Welke groep heeft de grootste spreiding?
      antwoord: |-
        de jongens
      uitwerking: |-
        Beide spreidingsmaten zijn groter. In het 3de jaar zijn sommige jongens al volop gegroeid, andere nog niet.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    gewogen gemiddelde
  opgave: |-
    Op het rapport van Kato telt het dagelijks werk voor $20~\%$, de toetsen voor $30~\%$ en het examen voor $50~\%$. Ze haalt 16 op 20 voor dagelijks werk, 12 voor de toetsen en 10 voor het examen.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken haar eindcijfer op 20.
      antwoord: |-
        $11,8$
      uitwerking: |-
        $0,2 \cdot 16 + 0,3 \cdot 12 + 0,5 \cdot 10 = 3,2 + 3,6 + 5 = 11,8$.
    - opgave: |-
        Waarom is dat minder dan het gewone gemiddelde van 16, 12 en 10?
      antwoord: |-
        het laagste cijfer weegt het zwaarst
      uitwerking: |-
        Het gewone gemiddelde is $\tfrac{38}{3} \approx 12,67$. Het examen, haar laagste cijfer, telt voor de helft.
    - opgave: |-
        Hoeveel moet ze op het examen halen om een eindcijfer van 13 te hebben?
      antwoord: |-
        $12,4$
      uitwerking: |-
        $3,2 + 3,6 + 0,5 \cdot e = 13$, dus $0,5 \cdot e = 6,2$ en $e = 12,4$.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    schatting bij klassen
  opgave: |-
    In voorbeeld~\ref{vb:h2-klassen} schatten we de gemiddelde schermtijd met klassenmiddens: $167,5$ minuten. Met de 40 echte tijden is het gemiddelde ongeveer $165,6$ minuten.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom verschillen de twee getallen?
      antwoord: |-
        de gegevens liggen niet in het klassenmidden
      uitwerking: |-
        De schatting doet alsof elke tijd in het midden van zijn klasse ligt. In werkelijkheid liggen de tijden in sommige klassen eerder links van het midden.
    - opgave: |-
        Bedenk drie getallen in de klasse $[100, 150[$ waarvoor de schatting met het klassenmidden veel te groot is.
      antwoord: |-
        bijvoorbeeld 100, 101, 102
      uitwerking: |-
        Het klassenmidden 125 geeft samen 375, de echte som is 303. Hoe dichter de getallen bij de linkergrens, hoe groter de fout.
    - opgave: |-
        Wordt de schatting meestal beter als je smallere klassen kiest?
      antwoord: |-
        ja
      uitwerking: |-
        Dan ligt elk gegeven dichter bij zijn klassenmidden. Met klassen van breedte 1 minuut is de schatting zo goed als exact.

- id: h2-o23
  soort: opdracht
  niveau: 2
  thema: |-
    effect van een extra gegeven op gemiddelde en standaardafwijking
  opgave: |-
    De gegevens $4, 6, 8, 10, 12$ hebben gemiddelde 8 en standaardafwijking $\sqrt8 \approx 2,83$.
  lijst: enumerate
  delen:
    - opgave: |-
        Je voegt het getal 8 toe. Wat gebeurt er met het gemiddelde en de standaardafwijking? Denk eerst na, reken dan na met je rekentoestel.
      antwoord: |-
        $\xbar$ blijft 8, $s$ daalt tot $\approx 2,58$
      uitwerking: |-
        Een gegeven op het gemiddelde verandert de som van de afwijkingen niet, en voegt een kwadraat 0 toe. De som van de kwadraten blijft 40, maar je deelt door 6: $s = \sqrt{\tfrac{40}{6}} \approx 2,58$.
    - opgave: |-
        Je voegt in de plaats het getal 20 toe. Wat gebeurt er nu?
      antwoord: |-
        $\xbar = 10$, $s \approx 5,16$
      uitwerking: |-
        $\xbar = \tfrac{60}{6} = 10$. Het nieuwe gegeven ligt ver van het gemiddelde: de spreiding neemt sterk toe, $s \approx 5,16$. De mediaan gaat maar van 8 naar 9.

- id: h2-o18
  soort: opdracht
  niveau: 3
  thema: |-
    gegevens bij gegeven maten
  opgave: |-
    Bedenk telkens een rij gehele getallen.
  lijst: enumerate
  delen:
    - opgave: |-
        vijf getallen met gemiddelde 10 en mediaan 8
      antwoord: |-
        bijvoorbeeld $5, 6, 8, 12, 19$
      uitwerking: |-
        De som moet 50 zijn en het middelste getal 8. Bijvoorbeeld $5 + 6 + 8 + 12 + 19 = 50$. Een groot getal rechts trekt het gemiddelde boven de mediaan.
    - opgave: |-
        vier getallen met gemiddelde 6 en standaardafwijking 0
      antwoord: |-
        $6, 6, 6, 6$
      uitwerking: |-
        Standaardafwijking 0 betekent dat alle getallen gelijk zijn, en dan zijn ze gelijk aan het gemiddelde. Er is maar één oplossing.
    - opgave: |-
        twee rijen van vijf getallen met hetzelfde gemiddelde en dezelfde mediaan, maar een heel andere standaardafwijking
      antwoord: |-
        bijvoorbeeld $9, 10, 10, 10, 11$ en $1, 5, 10, 15, 19$
      uitwerking: |-
        Beide hebben gemiddelde 10 en mediaan 10. De eerste heeft $s \approx 0,63$, de tweede $s \approx 6,51$.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    standaardafwijking schatten zonder rekenen
  opgave: |-
    Zet de drie stippendiagrammen in volgorde van kleine naar grote standaardafwijking, zonder te rekenen. Leg uit.
    \figuren{\begin{tikzpicture}[x=.5cm,font=\scriptsize]
      \foreach \x/\k in {1/1,5/1,5/2,5/3,5/4,5/5,5/6,9/1}{\stip{\x}{\k}} \node[left] at (0,.4) {A};
      \getalas{0}{1}{10}
      \begin{scope}[xshift=6.6cm]
      \foreach \x/\k in {1/1,1/2,1/3,1/4,9/1,9/2,9/3,9/4}{\stip{\x}{\k}} \node[left] at (0,.4) {B};
      \getalas{0}{1}{10}
      \end{scope}
      \begin{scope}[yshift=-1.9cm,xshift=3.3cm]
      \foreach \x/\k in {1/1,2/1,3/1,4/1,6/1,7/1,8/1,9/1}{\stip{\x}{\k}} \node[left] at (0,.4) {C};
      \getalas{0}{1}{10}
      \end{scope}
    \end{tikzpicture}}
  antwoord: |-
    A, C, B
  uitwerking: |-
    Alle drie hebben gemiddelde 5. In A liggen zes van de acht stippen op het gemiddelde, en maar twee op afstand 4: kleine $s$ ($s = 2$). In B liggen alle stippen op afstand 4: $s = 4$. In C liggen de afstanden tussen 1 en 4: $s = \sqrt{7,5} \approx 2,74$. Volgorde A, C, B.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    gemiddelde snelheid
  opgave: |-
    Daan fietst 6 km naar zijn grootouders met 20 km/h, en terug met 30 km/h (de wind zit mee). Hij zegt: \textit{Gemiddeld reed ik 25 km/h.}
  lijst: enumerate
  delen:
    - opgave: |-
        Hoelang duren de heenrit en de terugrit?
      antwoord: |-
        18 en 12 minuten
      uitwerking: |-
        $\tfrac{6}{20}$ h $= 0,3$ h $= 18$ min en $\tfrac{6}{30}$ h $= 0,2$ h $= 12$ min.
    - opgave: |-
        Wat is zijn gemiddelde snelheid voor de hele rit? Waarom is dat niet 25 km/h?
      antwoord: |-
        24 km/h
      uitwerking: |-
        12 km in $0,5$ h: $24$ km/h. Hij rijdt langer met 20 km/h dan met 30 km/h, dus de lage snelheid weegt zwaarder door. Het gewone gemiddelde van twee snelheden klopt alleen als je even lang aan elke snelheid rijdt.

- id: h2-o21
  soort: opdracht
  pakketten: [5]
  niveau: 3
  thema: |-
    gegevens verschuiven en vermenigvuldigen
  opgave: |-
    Op een toets op 40 is het gemiddelde 26, de standaardafwijking 6, de mediaan 27 en de interkwartielafstand 8.
  lijst: enumerate
  delen:
    - opgave: |-
        De leerkracht zet alle punten om naar punten op 20 en telt er daarna 1 punt bij. Bereken de vier maten opnieuw.
      antwoord: |-
        $\xbar = 14$, $s = 3$, $\Me = 14,5$, $\IKA = 4$
      uitwerking: |-
        Elk punt $x$ wordt $0,5x + 1$. $\xbar = 0,5 \cdot 26 + 1 = 14$, $\Me = 0,5 \cdot 27 + 1 = 14,5$, $s = 0,5 \cdot 6 = 3$ en $\IKA = 0,5 \cdot 8 = 4$.
    - opgave: |-
        Een collega wil de punten omzetten met $a \cdot x + b$ zodat het gemiddelde 12 en de standaardafwijking 2 wordt. Bereken $a$ en $b$.
      antwoord: |-
        $a = \tfrac13$, $b = \tfrac{10}{3} \approx 3,33$
      uitwerking: |-
        $a \cdot 6 = 2$ geeft $a = \tfrac13$. Dan $\tfrac13 \cdot 26 + b = 12$, dus $b = 12 - \tfrac{26}{3} = \tfrac{10}{3}$.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    waarom kwadraten
  opgave: |-
    Tom wil de spreiding meten met het gemiddelde van de afwijkingen $x - \xbar$, zonder kwadraten.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken dat voor de gegevens 2, 5, 11. Wat valt op?
      antwoord: |-
        0
      uitwerking: |-
        $\xbar = 6$. Afwijkingen $-4, -1, 5$: samen 0, gemiddeld 0.
    - opgave: |-
        Leg uit waarom Tom voor elke rij gegevens 0 vindt.
      antwoord: |-
        de som van de afwijkingen is altijd 0
      uitwerking: |-
        $(x_1 - \xbar) + \cdots + (x_n - \xbar) = (x_1 + \cdots + x_n) - n\xbar = n\xbar - n\xbar = 0$.
    - opgave: |-
        Bereken voor route B van Lotte het gemiddelde van de afstanden $\abs{x - \xbar}$, en vergelijk met $s \approx 6,63$. Welke is groter, en waarom?
      antwoord: |-
        $6,2$; $s$ is groter
      uitwerking: |-
        Afstanden $8, 8, 5, 6, 7, 10, 6, 4, 7, 1$: samen 62, gemiddeld $6,2$. De standaardafwijking is groter, omdat het kwadrateren grote afwijkingen zwaarder laat doorwegen: $10^2 = 100$ telt veel meer dan $1^2 = 1$.

# --- Test jezelf -----------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    gemiddelde, mediaan en modus
  opgave: |-
    Bereken het gemiddelde, de mediaan en de modus van 7, 3, 9, 7, 5, 10, 7, 4.
  antwoord: |-
    $\xbar = 6,5$, $\Me = 7$, $\Mo = 7$
  uitwerking: |-
    $\tfrac{52}{8} = 6,5$. Gerangschikt $3, 4, 5, 7, 7, 7, 9, 10$: $\Me = \tfrac{7 + 7}{2} = 7$. De modus is 7 (drie keer).

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    gemiddelde uit een frequentietabel
  opgave: |-
    Op een zomerkamp zegt elk van de 30 kinderen hoeveel keer het al op kamp ging: 0 keer (6 kinderen), 1 keer (9), 2 keer (8), 3 keer (5), 4 keer (2). Bereken het gemiddelde.
  antwoord: |-
    $1,6$
  uitwerking: |-
    $\tfrac{0 \cdot 6 + 1 \cdot 9 + 2 \cdot 8 + 3 \cdot 5 + 4 \cdot 2}{30} = \tfrac{48}{30} = 1,6$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    gemiddelde bij klassen
  opgave: |-
    Een leerling meet de lengte van 30 bladeren (in cm): $[4, 6[$: 3; $[6, 8[$: 9; $[8, 10[$: 11; $[10, 12[$: 5; $[12, 14[$: 2. Schat de gemiddelde lengte en geef de modale klasse.
  antwoord: |-
    $8,6$ cm; $[8, 10[$
  uitwerking: |-
    $\tfrac{5 \cdot 3 + 7 \cdot 9 + 9 \cdot 11 + 11 \cdot 5 + 13 \cdot 2}{30} = \tfrac{258}{30} = 8,6$. De modale klasse is $[8, 10[$ (11 bladeren).

- id: h2-t4
  soort: test
  niveau: 1
  thema: |-
    variatiebreedte en interkwartielafstand
  opgave: |-
    Bereken de variatiebreedte en de interkwartielafstand van 31, 25, 40, 28, 36, 22, 45, 30, 33.
  antwoord: |-
    $\VB = 23$, $\IKA = 11,5$
  uitwerking: |-
    $22, 25, 28, 30, \fbox{31}, 33, 36, 40, 45$. $\VB = 45 - 22 = 23$. $Q_1 = \tfrac{25 + 28}{2} = 26,5$, $Q_3 = \tfrac{36 + 40}{2} = 38$, $\IKA = 11,5$.

- id: h2-t5
  soort: test
  niveau: 2
  thema: |-
    standaardafwijking met een tabel
  opgave: |-
    Bereken met een tabel de standaardafwijking van 3, 8, 6, 5, 8.
  antwoord: |-
    $s \approx 1,90$
  uitwerking: |-
    $\xbar = 6$. Afwijkingen $-3, 2, 0, -1, 2$, kwadraten $9, 4, 0, 1, 4$, samen 18. $s = \sqrt{\tfrac{18}{5}} = \sqrt{3,6} \approx 1,90$.

- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    gemiddelde of mediaan
  opgave: |-
    Een webwinkel verkoopt zeven modellen sneakers, voor 60, 75, 80, 85, 90, 95 en 400 euro. Bereken het gemiddelde en de mediaan. Welk getal beschrijft het best wat sneakers in deze winkel kosten? Leg uit.
  antwoord: |-
    $\xbar \approx 126,4$, $\Me = 85$; de mediaan
  uitwerking: |-
    $\xbar = \tfrac{885}{7} \approx 126,4$ euro, $\Me = 85$ euro. Zes van de zeven modellen kosten minder dan het gemiddelde: het model van 400 euro is een uitschieter. De mediaan beschrijft het beter.

- id: h2-t7
  soort: test
  niveau: 2
  thema: |-
    groepen vergelijken met gemiddelde en standaardafwijking
  opgave: |-
    Twee groepjes van acht leerlingen maken dezelfde toets op 20. Groep X haalt 12, 14, 13, 15, 11, 13, 14, 12. Groep Y haalt 8, 18, 10, 17, 9, 16, 19, 7.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken voor elke groep het gemiddelde en de standaardafwijking.
      antwoord: |-
        X: 13 en $1,22$; Y: 13 en $4,64$
      uitwerking: |-
        Beide groepen: som 104, $\xbar = 13$. Met het rekentoestel: $s_X \approx 1,22$ en $s_Y \approx 4,64$.
    - opgave: |-
        De leerkracht zegt: \textit{De twee groepen deden het even goed.} Klopt dat?
      antwoord: |-
        gemiddeld wel, maar Y is veel minder gelijkmatig
      uitwerking: |-
        Het gemiddelde is gelijk, maar in groep Y liggen de punten veel verder uit elkaar: vier leerlingen hebben een onvoldoende, vier haalden 16 of meer. In groep X zitten alle punten tussen 11 en 15.
