# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.
# Alle gegevens zijn verzonnen. Kwartielen: de mediaan van elke helft, zonder de mediaan als n oneven is.
# pakketten: h1-o22 heeft een variant voor 1-4 (dezelfde boxplot, ander histogram) en voor 5 (ongelijke klassen);
# h1-ordinaal alleen in 5; het stam-en-bladdiagram (h1-stamblad, h1-o9, h1-o18) niet in 1, dat een eigen h1-o18 heeft.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Reken uit zonder rekenmachine.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Hoeveel procent is 15 van 60?
      antwoord: |-
        $25~\%$
      uitwerking: |-
        $\tfrac{15}{60} = \tfrac14 = 25~\%$.
    - opgave: |-
        Hoeveel is $30~\%$ van $360^\circ$?
      antwoord: |-
        $108^\circ$
      uitwerking: |-
        $0,3 \cdot 360^\circ = 108^\circ$.
    - opgave: |-
        Schrijf $\tfrac{18}{24}$ als procent.
      antwoord: |-
        $75~\%$
      uitwerking: |-
        $\tfrac{18}{24} = \tfrac34 = 75~\%$.
    - opgave: |-
        Rangschik van klein naar groot: $3,4$; $3,12$; $3,7$; $2,95$.
      antwoord: |-
        $2,95$; $3,12$; $3,4$; $3,7$
      uitwerking: |-
        Vergelijk cijfer per cijfer: $3,12 < 3,40 < 3,70$.
    - opgave: |-
        Welk getal ligt halfweg tussen 7 en 12?
      antwoord: |-
        $9,5$
      uitwerking: |-
        $\tfrac{7 + 12}{2} = 9,5$.
    - opgave: |-
        Welk getal ligt halfweg tussen $3,2$ en $3,3$?
      antwoord: |-
        $3,25$
      uitwerking: |-
        $\tfrac{3,2 + 3,3}{2} = 3,25$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Tien leerlingen zeggen hoe ze naar school komen en hoeveel minuten dat duurt.
    \gegevens{|c|*{10}{c|}}{\hline
    vervoer & fiets & bus & fiets & te voet & auto & fiets & bus & fiets & te voet & bus \\ \hline
    minuten & 12 & 25 & 8 & 6 & 10 & 15 & 31 & 9 & 4 & 22 \\ \hline}
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel leerlingen komen met de fiets? Welk deel van de groep is dat, in procent?
      antwoord: |-
        4, dus $40~\%$
      uitwerking: |-
        Fiets komt 4 keer voor: $\tfrac{4}{10} = 40~\%$.
    - opgave: |-
        Kun je het gemiddelde vervoermiddel berekenen? En de gemiddelde tijd?
      antwoord: |-
        het vervoermiddel niet, de tijd wel
      uitwerking: |-
        Met woorden kun je niet rekenen. De gemiddelde tijd is $\tfrac{142}{10} = 14,2$ minuten.
    - opgave: |-
        Zet de tijden van klein naar groot. Welke tijd staat in het midden?
      antwoord: |-
        tussen 10 en 12, dus 11 minuten
      uitwerking: |-
        $4, 6, 8, 9, 10, 12, 15, 22, 25, 31$. Er zijn twee middelste getallen, 10 en 12. Halfweg ligt 11.
    - opgave: |-
        Hoeveel leerlingen doen er korter over dan de tijd uit c? En langer?
      antwoord: |-
        5 en 5
      uitwerking: |-
        De helft ligt eronder, de helft erboven.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h1-soorten
  soort: kort
  opgave: |-
    Is de variabele kwalitatief, discreet of continu?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de bloedgroep van een donor
      antwoord: |-
        kwalitatief
      uitwerking: |-
        De antwoorden zijn categorieën: A, B, AB of O.
    - opgave: |-
        het aantal berichten dat je per dag stuurt
      antwoord: |-
        discreet
      uitwerking: |-
        Je telt: 0, 1, 2, \dots
    - opgave: |-
        de massa van een appel
      antwoord: |-
        continu
      uitwerking: |-
        Een massa meet je, en ze kan elke waarde aannemen.
    - opgave: |-
        het rugnummer van een voetballer
      antwoord: |-
        kwalitatief
      uitwerking: |-
        Een getal, maar het is een naam: het gemiddelde rugnummer zegt niets.
    - opgave: |-
        de temperatuur om 12 uur
      antwoord: |-
        continu
      uitwerking: |-
        Je meet een temperatuur.
    - opgave: |-
        het aantal doelpunten in een wedstrijd
      antwoord: |-
        discreet
      uitwerking: |-
        Je telt doelpunten.

- id: h1-ordinaal
  soort: kort
  pakketten: [5]
  opgave: |-
    Is de kwalitatieve variabele nominaal of ordinaal?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de kledingmaat: S, M, L of XL
      antwoord: |-
        ordinaal
      uitwerking: |-
        De maten hebben een volgorde: S is kleiner dan M.
    - opgave: |-
        het land van je laatste vakantie
      antwoord: |-
        nominaal
      uitwerking: |-
        Landen hebben geen natuurlijke volgorde.
    - opgave: |-
        het antwoord op \textit{Hoe vaak sport je?}: nooit, soms, vaak
      antwoord: |-
        ordinaal
      uitwerking: |-
        Nooit, soms en vaak kun je rangschikken.
    - opgave: |-
        de bloedgroep van een donor
      antwoord: |-
        nominaal
      uitwerking: |-
        A, B, AB en O zijn namen zonder volgorde.
    - opgave: |-
        de medaille op een wedstrijd
      antwoord: |-
        ordinaal
      uitwerking: |-
        Goud, zilver, brons: een volgorde, maar geen getallen om mee te rekenen.
    - opgave: |-
        de smaak van een ijsje
      antwoord: |-
        nominaal
      uitwerking: |-
        Vanille is niet meer of minder dan chocolade.

- id: h1-tabel
  soort: kort
  opgave: |-
    Dertig gezinnen zeggen hoeveel huisdieren ze hebben:
    \gegevens{*{15}{c}}{0 & 1 & 2 & 0 & 1 & 1 & 3 & 0 & 2 & 1 & 0 & 1 & 2 & 4 & 1 \\ 0 & 0 & 1 & 2 & 1 & 3 & 0 & 1 & 1 & 2 & 0 & 1 & 5 & 1 & 2}
  lijst: enumerate
  delen:
    - opgave: |-
        Maak een frequentietabel met de relatieve en de cumulatieve frequentie.
      antwoord: |-
        frequenties 8, 12, 6, 2, 1, 1
      uitwerking: |-
        \begin{tabular}[t]{|c|c|c|c|}\hline aantal & frequentie & rel.\ frequentie & cum.\ frequentie \\ \hline 0 & 8 & $26,7~\%$ & 8 \\ \hline 1 & 12 & $40,0~\%$ & 20 \\ \hline 2 & 6 & $20,0~\%$ & 26 \\ \hline 3 & 2 & $6,7~\%$ & 28 \\ \hline 4 & 1 & $3,3~\%$ & 29 \\ \hline 5 & 1 & $3,3~\%$ & 30 \\ \hline \end{tabular}
    - opgave: |-
        Hoeveel gezinnen hebben hoogstens één huisdier?
      antwoord: |-
        20
      uitwerking: |-
        De cumulatieve frequentie bij 1: $8 + 12 = 20$.
    - opgave: |-
        Hoeveel procent van de gezinnen heeft meer dan twee huisdieren?
      antwoord: |-
        $13,3~\%$
      uitwerking: |-
        $30 - 26 = 4$ gezinnen: $\tfrac{4}{30} \approx 13,3~\%$.

- id: h1-klassen
  soort: kort
  opgave: |-
    De lengtes (in cm) van 25 leerlingen zijn:
    \gegevens{*{13}{c}}{162 & 171 & 158 & 166 & 174 & 169 & 155 & 163 & 177 & 168 & 160 & 172 & 165 \\ 181 & 159 & 167 & 170 & 164 & 176 & 161 & 168 & 173 & 157 & 166 & 170 & }
  lijst: enumerate
  delen:
    - opgave: |-
        Groepeer de lengtes in klassen met breedte 5 cm, te beginnen bij 155 cm. Geef ook de klassenmiddens.
      antwoord: |-
        frequenties 4, 5, 7, 6, 2, 1
      uitwerking: |-
        $[155, 160[$: 4 (midden 157,5); $[160, 165[$: 5 (162,5); $[165, 170[$: 7 (167,5); $[170, 175[$: 6 (172,5); $[175, 180[$: 2 (177,5); $[180, 185[$: 1 (182,5). Samen 25. Let op: 160, 165 en 170 horen bij de klasse die met dat getal begint.
    - opgave: |-
        In welke klasse liggen de meeste lengtes? Welk percentage is dat?
      antwoord: |-
        $[165, 170[$, $28~\%$
      uitwerking: |-
        7 van de 25: $\tfrac{7}{25} = 28~\%$.

- id: h1-staaf
  soort: kort
  opgave: |-
    Vijftig leerlingen kiezen hun favoriete sport: voetbal 14, basketbal 9, zwemmen 6, tennis 8, dans 13.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken een staafdiagram.
      antwoord: |-
        vijf staven van hoogte 14, 9, 6, 8 en 13
      uitwerking: |-
        Vijf even brede staven die elkaar niet raken, de verticale as van 0 tot 14 of 15.
        \figuren{\begin{tikzpicture}[x=1.2cm,y=.17cm,font=\scriptsize]
          \frequentieas{2}{14}{-.6}{4.6}
          \foreach \w/\f [count=\i from 0] in {voetbal/14,basket/9,zwemmen/6,tennis/8,dans/13}{\staaf{\i}{\f}{.55} \node[below] at (\i,0) {\w};}
        \end{tikzpicture}}
    - opgave: |-
        Waarom raken de staven elkaar niet?
      antwoord: |-
        de categorieën zijn afzonderlijk
      uitwerking: |-
        De variabele is kwalitatief: tussen voetbal en basketbal ligt geen waarde.

- id: h1-cirkel
  soort: kort
  opgave: |-
    Zestig leerlingen kiezen een bestemming voor de schooluitstap: 24 kiezen een pretpark, 18 de zee, 12 een museum en 6 een sportdag. Bereken de middelpuntshoeken en teken een cirkeldiagram.
  antwoord: |-
    $144^\circ$, $108^\circ$, $72^\circ$, $36^\circ$
  uitwerking: |-
    $\tfrac{24}{60} \cdot 360^\circ = 144^\circ$, $\tfrac{18}{60} \cdot 360^\circ = 108^\circ$, $\tfrac{12}{60} \cdot 360^\circ = 72^\circ$, $\tfrac{6}{60} \cdot 360^\circ = 36^\circ$. Samen $360^\circ$.
    \figuren{\begin{tikzpicture}[scale=.9]
      \sector{90}{-54}{accent!55}{pretpark}
      \sector{-54}{-162}{accent!35}{zee}
      \sector{-162}{-234}{accent!20}{museum}
      \sector{-234}{-270}{accent!80}{sport}
    \end{tikzpicture}}

- id: h1-lijn
  soort: kort
  opgave: |-
    Een boon groeit in een potje. Elke week meet Noor de hoogte (in cm): week 1: 2; week 2: 3,5; week 3: 5; week 4: 7; week 5: 9,5; week 6: 11; week 7: 12; week 8: 12,5.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken een lijndiagram.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        \figuren{\begin{tikzpicture}[x=.7cm,y=.22cm,font=\scriptsize]
          \frequentieas[cm]{2}{14}{.4}{8.4}
          \foreach \w/\h in {1/2,2/3.5,3/5,4/7,5/9.5,6/11,7/12,8/12.5}{\coordinate (p\w) at (\w,\h); \node[below] at (\w,0) {\w};}
          \draw[accent,thick] (p1) \foreach \w in {2,...,8}{-- (p\w)};
          \foreach \w in {1,...,8}{\fill[accent] (p\w) circle (2pt);}
          \node[below=8pt] at (4.5,0) {week};
        \end{tikzpicture}}
    - opgave: |-
        In welke week groeit de boon het snelst?
      antwoord: |-
        van week 4 naar week 5
      uitwerking: |-
        Daar is het lijnstuk het steilst: $9,5 - 7 = 2,5$ cm in één week.
    - opgave: |-
        Wat zie je op het einde?
      antwoord: |-
        de groei vertraagt
      uitwerking: |-
        Het lijndiagram wordt vlakker: de boon groeit nog maar een halve cm per week.

- id: h1-histogram
  soort: kort
  opgave: |-
    Een loopclub noteert de tijd die 50 leden over 5 km doen.
    \gegevens{|c|c|c|c|c|c|}{\hline tijd (min) & $[20, 25[$ & $[25, 30[$ & $[30, 35[$ & $[35, 40[$ & $[40, 45[$ \\ \hline frequentie & 4 & 12 & 18 & 11 & 5 \\ \hline}
  lijst: enumerate
  delen:
    - opgave: |-
        Teken een histogram.
      antwoord: |-
        vijf aansluitende rechthoeken
      uitwerking: |-
        \figuren{\begin{tikzpicture}[x=.3cm,y=.15cm,font=\scriptsize]
          \frequentieas{2}{18}{20}{46}
          \foreach \a/\f in {20/4,25/12,30/18,35/11,40/5}{\balk{\a}{\a+5}{\f}}
          \foreach \a in {20,25,...,45}{\node[below] at (\a,0) {\a};}
          \node[below=9pt] at (32.5,0) {tijd (min)};
        \end{tikzpicture}}
    - opgave: |-
        Hoeveel procent van de leden loopt de 5 km in minder dan 30 minuten?
      antwoord: |-
        $32~\%$
      uitwerking: |-
        $4 + 12 = 16$ van de 50: $32~\%$.

- id: h1-stamblad
  soort: kort
  pakketten: [2, 3, 4, 5]
  opgave: |-
    Achttien leerlingen doen zoveel mogelijk push-ups in één minuut: 23, 31, 18, 45, 27, 36, 29, 52, 33, 24, 40, 38, 15, 28, 34, 47, 30, 26.
  lijst: enumerate
  delen:
    - opgave: |-
        Maak een stam-en-bladdiagram.
      antwoord: |-
        stammen 1 tot 5
      uitwerking: |-
        \begin{tabular}[t]{r|l} 1 & 5\ 8 \\ 2 & 3\ 4\ 6\ 7\ 8\ 9 \\ 3 & 0\ 1\ 3\ 4\ 6\ 8 \\ 4 & 0\ 5\ 7 \\ 5 & 2 \end{tabular}\quad met $1 \mid 5 = 15$.
    - opgave: |-
        Hoeveel leerlingen doen minstens 30 push-ups?
      antwoord: |-
        10
      uitwerking: |-
        De rijen 3, 4 en 5: $6 + 3 + 1 = 10$.

- id: h1-mediaan
  soort: kort
  opgave: |-
    Bepaal de mediaan.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $8,\ 3,\ 11,\ 5,\ 9,\ 2,\ 7$
      antwoord: |-
        $7$
      uitwerking: |-
        $2, 3, 5, \fbox{7}, 8, 9, 11$: plaats 4.
    - opgave: |-
        $14,\ 20,\ 11,\ 17,\ 25,\ 13,\ 19,\ 16$
      antwoord: |-
        $16,5$
      uitwerking: |-
        $11, 13, 14, 16, 17, 19, 20, 25$: $\tfrac{16 + 17}{2} = 16,5$.
    - opgave: |-
        $4,5;\ 3,8;\ 5,2;\ 4,1;\ 6,0;\ 3,9$
      antwoord: |-
        $4,3$
      uitwerking: |-
        $3,8; 3,9; 4,1; 4,5; 5,2; 6,0$: $\tfrac{4,1 + 4,5}{2} = 4,3$.
    - opgave: |-
        $-3,\ 2,\ {-1},\ 0,\ 4,\ {-5},\ 1,\ 3,\ {-2}$
      antwoord: |-
        $0$
      uitwerking: |-
        $-5, -3, -2, -1, \fbox{0}, 1, 2, 3, 4$: plaats 5.

- id: h1-kwartielen
  soort: kort
  opgave: |-
    Bepaal de mediaan en de kwartielen.
  lijst: enumerate
  delen:
    - opgave: |-
        De wachttijden (in minuten) bij een loket: 17, 22, 9, 14, 30, 12, 19, 25, 15.
      antwoord: |-
        $\Me = 17$, $Q_1 = 13$, $Q_3 = 23,5$
      uitwerking: |-
        $9, 12, 14, 15, \fbox{17}, 19, 22, 25, 30$. Onderste helft $9, 12, 14, 15$: $Q_1 = \tfrac{12 + 14}{2} = 13$. Bovenste helft $19, 22, 25, 30$: $Q_3 = \tfrac{22 + 25}{2} = 23,5$.
    - opgave: |-
        De sprongen (in m) bij het verspringen: 5,4; 6,1; 4,8; 7,3; 5,9; 6,6; 5,0; 8,2; 6,0; 5,5; 7,0; 6,3.
      antwoord: |-
        $\Me = 6,05$, $Q_1 = 5,45$, $Q_3 = 6,8$
      uitwerking: |-
        $4,8; 5,0; 5,4; 5,5; 5,9; 6,0 \mid 6,1; 6,3; 6,6; 7,0; 7,3; 8,2$. $\Me = \tfrac{6,0 + 6,1}{2} = 6,05$. $Q_1 = \tfrac{5,4 + 5,5}{2} = 5,45$ en $Q_3 = \tfrac{6,6 + 7,0}{2} = 6,8$.

- id: h1-boxplot
  soort: kort
  opgave: |-
    Vijftien leerlingen tellen hoeveel minuten ze gisteren aan hun huiswerk werkten: 42, 55, 38, 61, 47, 50, 73, 44, 58, 49, 66, 52, 40, 57, 46. Bepaal de vijfgetallensamenvatting en teken een boxplot.
  antwoord: |-
    $38$, $44$, $50$, $58$, $73$
  uitwerking: |-
    Gerangschikt: $38, 40, 42, 44, 46, 47, 49, \fbox{50}, 52, 55, 57, 58, 61, 66, 73$. $\Me = 50$ (plaats 8), $Q_1 = 44$ (plaats 4), $Q_3 = 58$ (plaats 12), min 38, max 73.
    \figuren{\begin{tikzpicture}[x=.16cm,font=\scriptsize]
      \boxplot{.7}{38}{44}{50}{58}{73}
      \getalas[min]{35}{5}{75}
    \end{tikzpicture}}

- id: h1-lezen
  soort: kort
  figuur:
    code: |-
      \begin{tikzpicture}[x=.24cm,font=\scriptsize]
        \boxplot{.7}{0.5}{2}{4.5}{8}{21}
        \getalas[km]{0}{5}{20}
      \end{tikzpicture}
  opgave: |-
    De boxplot toont de afstand tussen huis en school van de 120 leerlingen van het 3de jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel leerlingen wonen minder dan 2 km van school?
      antwoord: |-
        ongeveer 30
      uitwerking: |-
        Onder $Q_1 = 2$ ligt ongeveer een kwart: $\tfrac14 \cdot 120 = 30$.
    - opgave: |-
        Welk percentage woont verder dan $4,5$ km?
      antwoord: |-
        ongeveer $50~\%$
      uitwerking: |-
        $4,5$ km is de mediaan.
    - opgave: |-
        Hoeveel leerlingen wonen tussen 2 en 8 km van school?
      antwoord: |-
        ongeveer 60
      uitwerking: |-
        De box bevat de helft: 60 leerlingen.
    - opgave: |-
        Lies zegt: \textit{Tussen 8 en 21 km wonen meer leerlingen dan tussen 2 en $4,5$ km, want dat stuk is veel langer.} Klopt dat?
      antwoord: |-
        nee
      uitwerking: |-
        Beide stukken bevatten ongeveer een kwart, dus ongeveer 30 leerlingen. Het lange stuk betekent alleen dat die afstanden verder uit elkaar liggen.

# --- Opdrachten ------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    soorten variabelen
  opgave: |-
    Is de variabele kwalitatief, discreet of continu?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        je schoenmaat
      antwoord: |-
        discreet
      uitwerking: |-
        Alleen bepaalde maten bestaan (38, 38,5, 39, \dots), er zijn geen tussenwaarden.
    - opgave: |-
        het land waar je geboren bent
      antwoord: |-
        kwalitatief
      uitwerking: |-
        Een categorie.
    - opgave: |-
        je tijd op de 100 m
      antwoord: |-
        continu
      uitwerking: |-
        Een gemeten tijd.
    - opgave: |-
        het aantal leerlingen in een klas
      antwoord: |-
        discreet
      uitwerking: |-
        Je telt leerlingen.
    - opgave: |-
        je telefoonnummer
      antwoord: |-
        kwalitatief
      uitwerking: |-
        Een getal, maar een naam: rekenen ermee heeft geen zin.
    - opgave: |-
        de hoeveelheid regen op een dag
      antwoord: |-
        continu
      uitwerking: |-
        Een gemeten hoeveelheid, in mm.
    - opgave: |-
        je tevredenheid: slecht, matig, goed of zeer goed
      antwoord: |-
        kwalitatief
      uitwerking: |-
        Categorieën, wel met een volgorde.
    - opgave: |-
        het aantal kamers in een huis
      antwoord: |-
        discreet
      uitwerking: |-
        Je telt kamers.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    frequentietabel
  opgave: |-
    Een voetbalploeg speelde 30 wedstrijden. Het aantal doelpunten per wedstrijd was:
    \gegevens{*{15}{c}}{2 & 1 & 0 & 3 & 1 & 2 & 4 & 1 & 0 & 2 & 2 & 3 & 1 & 0 & 1 \\ 5 & 2 & 1 & 3 & 2 & 0 & 1 & 2 & 1 & 3 & 2 & 1 & 0 & 4 & 2}
  lijst: enumerate
  delen:
    - opgave: |-
        Maak een frequentietabel met de relatieve en de cumulatieve frequentie.
      antwoord: |-
        frequenties 5, 9, 9, 4, 2, 1
      uitwerking: |-
        \begin{tabular}[t]{|c|c|c|c|}\hline doelpunten & frequentie & rel.\ frequentie & cum.\ frequentie \\ \hline 0 & 5 & $16,7~\%$ & 5 \\ \hline 1 & 9 & $30,0~\%$ & 14 \\ \hline 2 & 9 & $30,0~\%$ & 23 \\ \hline 3 & 4 & $13,3~\%$ & 27 \\ \hline 4 & 2 & $6,7~\%$ & 29 \\ \hline 5 & 1 & $3,3~\%$ & 30 \\ \hline \end{tabular}
    - opgave: |-
        In hoeveel wedstrijden scoorde de ploeg minder dan 3 doelpunten?
      antwoord: |-
        23
      uitwerking: |-
        De cumulatieve frequentie bij 2.
    - opgave: |-
        In hoeveel procent van de wedstrijden scoorde de ploeg minstens 3 keer?
      antwoord: |-
        $23,3~\%$
      uitwerking: |-
        $30 - 23 = 7$ wedstrijden: $\tfrac{7}{30} \approx 23,3~\%$.
    - opgave: |-
        Teken een staafdiagram met de relatieve frequenties.
      antwoord: |-
        zes staven
      uitwerking: |-
        \figuren{\begin{tikzpicture}[x=.7cm,y=.08cm,font=\scriptsize]
          \frequentieas[\%]{10}{30}{-.6}{5.6}
          \foreach \w/\f in {0/16.7,1/30,2/30,3/13.3,4/6.7,5/3.3}{\staaf{\w}{\f}{.5} \node[below] at (\w,0) {\w};}
        \end{tikzpicture}}

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    mediaan
  opgave: |-
    Bepaal de mediaan.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $15,\ 9,\ 22,\ 18,\ 11$
      antwoord: |-
        $15$
      uitwerking: |-
        $9, 11, \fbox{15}, 18, 22$.
    - opgave: |-
        $7,\ 3,\ 9,\ 3,\ 12,\ 6$
      antwoord: |-
        $6,5$
      uitwerking: |-
        $3, 3, 6, 7, 9, 12$: $\tfrac{6 + 7}{2} = 6,5$.
    - opgave: |-
        $1,8;\ 2,4;\ 1,5;\ 2,0;\ 2,9;\ 1,7;\ 2,2$
      antwoord: |-
        $2,0$
      uitwerking: |-
        $1,5; 1,7; 1,8; \fbox{2,0}; 2,2; 2,4; 2,9$.
    - opgave: |-
        $105,\ 98,\ 120,\ 87,\ 101,\ 110,\ 95,\ 115$
      antwoord: |-
        $103$
      uitwerking: |-
        $87, 95, 98, 101, 105, 110, 115, 120$: $\tfrac{101 + 105}{2} = 103$.
    - opgave: |-
        $-4,\ {-7},\ 0,\ {-2},\ {-9},\ {-1}$
      antwoord: |-
        $-3$
      uitwerking: |-
        $-9, -7, -4, -2, -1, 0$: $\tfrac{-4 + (-2)}{2} = -3$.
    - opgave: |-
        $40,\ 8,\ 15,\ 3,\ 8,\ 21,\ 40,\ 9,\ 15,\ 8,\ 40$
      antwoord: |-
        $15$
      uitwerking: |-
        $3, 8, 8, 8, 9, \fbox{15}, 15, 21, 40, 40, 40$: plaats 6.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    cirkeldiagram
  opgave: |-
    Tachtig leerlingen kiezen hun favoriete muziekgenre: pop 32, rap 20, rock 12 en ander 16. Bereken de middelpuntshoeken en teken een cirkeldiagram.
  antwoord: |-
    $144^\circ$, $90^\circ$, $54^\circ$, $72^\circ$
  uitwerking: |-
    $\tfrac{32}{80} \cdot 360^\circ = 144^\circ$, $\tfrac{20}{80} \cdot 360^\circ = 90^\circ$, $\tfrac{12}{80} \cdot 360^\circ = 54^\circ$, $\tfrac{16}{80} \cdot 360^\circ = 72^\circ$. Samen $360^\circ$.
    \figuren{\begin{tikzpicture}[scale=.9]
      \sector{90}{-54}{accent!55}{pop}
      \sector{-54}{-144}{accent!35}{rap}
      \sector{-144}{-198}{accent!20}{rock}
      \sector{-198}{-270}{accent!80}{ander}
    \end{tikzpicture}}

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    kwartielen en vijfgetallensamenvatting
  opgave: |-
    Geef de vijfgetallensamenvatting.
  lijst: enumerate
  delen:
    - opgave: |-
        $10,\ 14,\ 18,\ 21,\ 23,\ 27,\ 30,\ 35$
      antwoord: |-
        $10$; $16$; $22$; $28,5$; $35$
      uitwerking: |-
        Al gerangschikt, 8 getallen. $\Me = \tfrac{21 + 23}{2} = 22$, $Q_1 = \tfrac{14 + 18}{2} = 16$, $Q_3 = \tfrac{27 + 30}{2} = 28,5$.
    - opgave: |-
        $3,\ 5,\ 6,\ 8,\ 9,\ 11,\ 12,\ 15,\ 16,\ 20,\ 22$
      antwoord: |-
        $3$; $6$; $11$; $16$; $22$
      uitwerking: |-
        11 getallen: $\Me = 11$ (plaats 6). Onderste helft $3, 5, 6, 8, 9$: $Q_1 = 6$. Bovenste helft $12, 15, 16, 20, 22$: $Q_3 = 16$.
    - opgave: |-
        $47,\ 32,\ 58,\ 41,\ 39,\ 62,\ 50,\ 35,\ 44,\ 55,\ 38,\ 49,\ 60$
      antwoord: |-
        $32$; $38,5$; $47$; $56,5$; $62$
      uitwerking: |-
        $32, 35, 38, 39, 41, 44, \fbox{47}, 49, 50, 55, 58, 60, 62$. $Q_1 = \tfrac{38 + 39}{2} = 38,5$ en $Q_3 = \tfrac{55 + 58}{2} = 56,5$.
    - opgave: |-
        $2,3;\ 1,9;\ 3,1;\ 2,7;\ 2,0;\ 3,6;\ 2,5;\ 2,8;\ 1,6;\ 3,3$
      antwoord: |-
        $1,6$; $2,0$; $2,6$; $3,1$; $3,6$
      uitwerking: |-
        $1,6; 1,9; 2,0; 2,3; 2,5 \mid 2,7; 2,8; 3,1; 3,3; 3,6$. $\Me = \tfrac{2,5 + 2,7}{2} = 2,6$, $Q_1 = 2,0$ en $Q_3 = 3,1$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    histogram lezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.042cm,y=.17cm,font=\scriptsize]
        \frequentieas{2}{16}{100}{224}
        \foreach \a/\f in {100/4,120/9,140/16,160/13,180/6,200/2}{\balk{\a}{\a+20}{\f}}
        \foreach \a in {100,140,180,220}{\node[below] at (\a,0) {\a};}
        \node[below=8pt] at (160,0) {hoogte (cm)};
      \end{tikzpicture}
  opgave: |-
    Het histogram toont de hoogte van de zonnebloemen in een tuin.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel zonnebloemen staan er in de tuin?
      antwoord: |-
        50
      uitwerking: |-
        $4 + 9 + 16 + 13 + 6 + 2 = 50$.
    - opgave: |-
        In welke klasse liggen de meeste hoogtes?
      antwoord: |-
        $[140, 160[$
      uitwerking: |-
        De hoogste rechthoek: 16 zonnebloemen.
    - opgave: |-
        Hoeveel procent van de zonnebloemen is minstens 180 cm hoog?
      antwoord: |-
        $16~\%$
      uitwerking: |-
        $6 + 2 = 8$ van de 50: $16~\%$.
    - opgave: |-
        Kun je uit het histogram aflezen hoe hoog de hoogste zonnebloem is?
      antwoord: |-
        nee
      uitwerking: |-
        Je weet alleen dat ze tussen 200 en 220 cm hoog is.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    een diagram kiezen
  opgave: |-
    Welk diagram past het best: een staafdiagram, een cirkeldiagram, een lijndiagram of een histogram?
  lijst: enumerate
  delen:
    - opgave: |-
        het aantal inwoners van een gemeente van 2015 tot 2025
      antwoord: |-
        lijndiagram
      uitwerking: |-
        Een verloop in de tijd.
    - opgave: |-
        de lengte van 200 leerlingen
      antwoord: |-
        histogram
      uitwerking: |-
        Een continue variabele, in klassen.
    - opgave: |-
        hoe de leerlingen van een klas hun zakgeld verdelen over sparen, kleding, eten en uitgaan
      antwoord: |-
        cirkeldiagram
      uitwerking: |-
        Delen van een geheel, met weinig categorieën.
    - opgave: |-
        het aantal kinderen per gezin in een straat
      antwoord: |-
        staafdiagram
      uitwerking: |-
        Een discrete variabele met weinig waarden.
    - opgave: |-
        de favoriete smaak van ijs (12 smaken)
      antwoord: |-
        staafdiagram
      uitwerking: |-
        Kwalitatief, maar te veel categorieën voor een cirkeldiagram.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    klassen en histogram
  opgave: |-
    Dertig leerlingen lopen 1 km. Hun tijden in minuten zijn:
    \gegevens{*{10}{c}}{5,8 & 6,4 & 7,1 & 4,9 & 6,0 & 8,3 & 5,5 & 6,7 & 7,6 & 5,2 \\ 6,2 & 9,4 & 6,9 & 5,7 & 7,3 & 4,6 & 6,5 & 8,0 & 5,9 & 6,1 \\ 7,8 & 5,4 & 6,8 & 7,0 & 6,3 & 8,7 & 5,1 & 6,6 & 7,4 & 9,1}
  lijst: enumerate
  delen:
    - opgave: |-
        Maak een frequentietabel met klassen van 1 minuut breed, te beginnen bij 4 minuten.
      antwoord: |-
        frequenties 2, 7, 10, 6, 3, 2
      uitwerking: |-
        $[4, 5[$: 2; $[5, 6[$: 7; $[6, 7[$: 10; $[7, 8[$: 6; $[8, 9[$: 3; $[9, 10[$: 2. Samen 30. De tijd 6,0 hoort bij $[6, 7[$.
    - opgave: |-
        Teken een histogram.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        \figuren{\begin{tikzpicture}[x=1.1cm,y=.2cm,font=\scriptsize]
          \frequentieas{2}{10}{4}{10.2}
          \foreach \a/\f in {4/2,5/7,6/10,7/6,8/3,9/2}{\balk{\a}{\a+1}{\f}}
          \foreach \a in {4,...,10}{\node[below] at (\a,0) {\a};}
          \node[below=8pt] at (7,0) {tijd (min)};
        \end{tikzpicture}}
    - opgave: |-
        De leerkracht geeft een goede score aan wie minder dan 6 minuten loopt. Hoeveel procent van de leerlingen is dat?
      antwoord: |-
        $30~\%$
      uitwerking: |-
        $2 + 7 = 9$ van de 30.
    - opgave: |-
        Teken ook een histogram met klassen van 2 minuten breed, te beginnen bij 4 minuten. Wat zie je nu niet meer?
      antwoord: |-
        frequenties 9, 16, 5; minder details
      uitwerking: |-
        $[4, 6[$: $2 + 7 = 9$; $[6, 8[$: $10 + 6 = 16$; $[8, 10[$: $3 + 2 = 5$.
        \figuren{\begin{tikzpicture}[x=1.1cm,y=.12cm,font=\scriptsize]
          \frequentieas{4}{16}{4}{10.2}
          \foreach \a/\f in {4/9,6/16,8/5}{\balk{\a}{\a+2}{\f}}
          \foreach \a in {4,6,8,10}{\node[below] at (\a,0) {\a};}
          \node[below=8pt] at (7,0) {tijd (min)};
        \end{tikzpicture}}
        Je ziet nog dat de meeste tijden in het midden liggen, maar niet meer dat de drukste klasse van 6 tot 7 minuten gaat, en ook niet dat weinig leerlingen onder 5 minuten blijven. Hoe breder de klassen, hoe meer je samenvat, en hoe meer informatie je verliest.

- id: h1-o9
  soort: opdracht
  pakketten: [2, 3, 4, 5]
  niveau: 2
  thema: |-
    stam-en-bladdiagram lezen
  figuur:
    code: |-
      \renewcommand{\arraystretch}{1.15}\begin{tabular}{r|l}
      0 & 8 \\ 1 & 2\ 5\ 7 \\ 2 & 3\ 4\ 6\ 9 \\ 3 & 1\ 4\ 5\ 5\ 8 \\ 4 & 1\ 2\ 7 \\ 5 & 1\ 3\ 8 \\ 6 & 4\ 7 \\[1mm]
      \multicolumn{2}{l}{\scriptsize $1 \mid 2 = 12$ jaar}
      \end{tabular}
  opgave: |-
    Het diagram toont de leeftijden van de bezoekers van een buurtfeest om 15 uur.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel bezoekers zijn er? Hoe oud is de jongste en de oudste?
      antwoord: |-
        21; 8 en 67 jaar
      uitwerking: |-
        $1 + 3 + 4 + 5 + 3 + 3 + 2 = 21$ bladen.
    - opgave: |-
        Bepaal de mediaan en de kwartielen.
      antwoord: |-
        $\Me = 35$, $Q_1 = 23,5$, $Q_3 = 49$
      uitwerking: |-
        21 getallen: de mediaan is het 11de, 35. Onderste helft (10 getallen): $\tfrac{23 + 24}{2} = 23,5$. Bovenste helft $35, 38, 41, 42, 47, 51, 53, 58, 64, 67$: $\tfrac{47 + 51}{2} = 49$.
    - opgave: |-
        Welke leeftijd komt twee keer voor?
      antwoord: |-
        35
      uitwerking: |-
        Het blad 5 staat twee keer bij stam 3.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    boxplot lezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.016cm,font=\scriptsize]
        \boxplot{.7}{40}{95}{130}{210}{380}
        \getalas[\eur]{0}{100}{400}
      \end{tikzpicture}
  opgave: |-
    Een website verkoopt 80 tweedehandsfietsen. De boxplot toont hun prijzen. Waar of niet waar? Leg uit.
  lijst: enumerate
  delen:
    - opgave: |-
        De helft van de fietsen kost meer dan 130 euro.
      antwoord: |-
        waar
      uitwerking: |-
        130 euro is de mediaan.
    - opgave: |-
        Ongeveer 20 fietsen kosten minder dan 95 euro.
      antwoord: |-
        waar
      uitwerking: |-
        Een kwart van 80 is 20.
    - opgave: |-
        Er zijn meer fietsen tussen 210 en 380 euro dan tussen 95 en 130 euro.
      antwoord: |-
        niet waar
      uitwerking: |-
        Beide stukken bevatten ongeveer een kwart: 20 fietsen.
    - opgave: |-
        Ongeveer 60 fietsen kosten hoogstens 210 euro.
      antwoord: |-
        waar
      uitwerking: |-
        Onder $Q_3$ ligt ongeveer $75~\%$: 60 fietsen.
    - opgave: |-
        De prijzen tussen 130 en 210 euro liggen verder uit elkaar dan die tussen 95 en 130 euro.
      antwoord: |-
        waar
      uitwerking: |-
        Evenveel fietsen, maar op een langer stuk van de as.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    boxplot tekenen
  opgave: |-
    Veertien leerlingen meten hun reactietijd (in milliseconden) met een app: 312, 287, 345, 298, 276, 330, 305, 290, 362, 281, 318, 299, 341, 270. Bepaal de vijfgetallensamenvatting en teken een boxplot.
  antwoord: |-
    $270$; $287$; $302$; $330$; $362$
  uitwerking: |-
    Gerangschikt: $270, 276, 281, 287, 290, 298, 299 \mid 305, 312, 318, 330, 341, 345, 362$. $\Me = \tfrac{299 + 305}{2} = 302$. $Q_1 = 287$ (het 4de van de onderste zeven), $Q_3 = 330$ (het 4de van de bovenste zeven).
    \figuren{\begin{tikzpicture}[x=.08cm,font=\scriptsize]
      \boxplot{.7}{270}{287}{302}{330}{362}
      \getalas[ms]{260}{20}{380}
    \end{tikzpicture}}

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    lijndiagram
  opgave: |-
    Op een warme dag meet een leerling elk uur de temperatuur in de klas (in $^\circ$C): 8 uur: 17,5; 9 uur: 18; 10 uur: 19,5; 11 uur: 21; 12 uur: 22; 13 uur: 22,5; 14 uur: 23,5; 15 uur: 23; 16 uur: 22.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken een lijndiagram. Laat de verticale as beginnen bij 15 $^\circ$C, en zet een zigzag op de as om dat te tonen.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        \figuren{\begin{tikzpicture}[x=.7cm,y=.32cm,font=\scriptsize]
          \foreach \t in {2,4,6,8}{\draw[black!12] (7.5,\t) -- (16.5,\t); \pgfmathtruncatemacro{\l}{15+\t}\node[left] at (7.5,\t) {\l};}
          \draw[grijs] (7.5,0) -- (7.5,.3) -- (7.35,.5) -- (7.65,.7) -- (7.5,.9) -- (7.5,9) node[above,text=black] {$^\circ$C};
          \draw[grijs] (7.5,0) -- (16.5,0);
          \foreach \u/\c in {8/17.5,9/18,10/19.5,11/21,12/22,13/22.5,14/23.5,15/23,16/22}{\coordinate (p\u) at (\u,\c-15); \node[below] at (\u,0) {\u};}
          \draw[accent,thick] (p8) \foreach \u in {9,...,16}{-- (p\u)};
          \foreach \u in {8,...,16}{\fill[accent] (p\u) circle (2pt);}
          \node[below=8pt] at (12,0) {uur};
        \end{tikzpicture}}
    - opgave: |-
        Tussen welke uren stijgt de temperatuur het snelst?
      antwoord: |-
        tussen 9 en 10 uur en tussen 10 en 11 uur
      uitwerking: |-
        Telkens $1,5\,^\circ$C per uur: de steilste stukken.
    - opgave: |-
        Wanneer is het het warmst? Hoeveel graden steeg de temperatuur tot dan?
      antwoord: |-
        om 14 uur, $6\,^\circ$C
      uitwerking: |-
        $23,5 - 17,5 = 6\,^\circ$C.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    cirkeldiagram lezen
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.95]
        \sector{90}{-36}{accent!55}{$126^\circ$}
        \sector{-36}{-126}{accent!35}{$90^\circ$}
        \sector{-126}{-198}{accent!20}{$72^\circ$}
        \sector{-198}{-252}{accent!70}{$54^\circ$}
        \sector{-252}{-270}{accent!90}{$18^\circ$}
      \end{tikzpicture}
  opgave: |-
    Een bakker vraagt aan 200 klanten wat ze als ontbijt eten. Het cirkeldiagram toont de antwoorden: brood ($126^\circ$), granen ($90^\circ$), fruit ($72^\circ$), yoghurt ($54^\circ$) en niets ($18^\circ$).
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel klanten eten brood als ontbijt?
      antwoord: |-
        70
      uitwerking: |-
        $\tfrac{126}{360} \cdot 200 = 70$.
    - opgave: |-
        Welk percentage eet niets?
      antwoord: |-
        $5~\%$
      uitwerking: |-
        $\tfrac{18}{360} = 0,05$.
    - opgave: |-
        Maak een frequentietabel van de antwoorden.
      antwoord: |-
        70, 50, 40, 30, 10
      uitwerking: |-
        Brood $\tfrac{126}{360} \cdot 200 = 70$, granen 50, fruit 40, yoghurt 30, niets 10. Samen 200.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    frequentietabel aanvullen
  opgave: |-
    In een frequentietabel van het aantal uren sport per week zijn enkele vakjes leeg. Er waren 40 antwoorden. Vul de tabel aan.
    \gegevens{|c|c|c|c|}{\hline uren & frequentie & relatieve frequentie & cumulatieve frequentie \\ \hline 0 & 6 & \dots & \dots \\ \hline 1 & \dots & $25~\%$ & \dots \\ \hline 2 & \dots & \dots & 26 \\ \hline 3 & 8 & \dots & \dots \\ \hline 4 & \dots & \dots & \dots \\ \hline}
  antwoord: |-
    frequenties 6, 10, 10, 8, 6
  uitwerking: |-
    Bij 1 uur: $25~\%$ van 40 is 10. Cumulatief: 6, 16. Bij 2 uur: $26 - 16 = 10$. Bij 3 uur: cumulatief $26 + 8 = 34$. Bij 4 uur: $40 - 34 = 6$, cumulatief 40. Relatieve frequenties: $15~\%$, $25~\%$, $25~\%$, $20~\%$, $15~\%$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    cumulatieve frequentie bij klassen
  opgave: |-
    Gebruik de frequentietabel van de schermtijden in voorbeeld~\ref{vb:h1-klassen}.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel procent van de leerlingen zat minder dan 150 minuten op de smartphone?
      antwoord: |-
        $45~\%$
      uitwerking: |-
        Cumulatieve frequentie 18 bij de klasse $[100, 150[$: $\tfrac{18}{40} = 45~\%$.
    - opgave: |-
        Hoeveel procent zat minstens 200 minuten op de smartphone?
      antwoord: |-
        $30~\%$
      uitwerking: |-
        $40 - 28 = 12$ leerlingen: $30~\%$.
    - opgave: |-
        Kun je uit de tabel afleiden hoeveel leerlingen minder dan 2 uur op hun toestel zaten? Wat kun je wel zeggen?
      antwoord: |-
        niet precies; tussen 7 en 18
      uitwerking: |-
        120 minuten ligt midden in de klasse $[100, 150[$. Alleen de 7 leerlingen uit de eerste klasse zitten zeker onder 120 minuten, en hoogstens 18 leerlingen. (Met de ruwe gegevens: 12.)

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    histogram en boxplot koppelen
  opgave: |-
    Welke boxplot hoort bij welk histogram? Leg uit.
    \figuren{\begin{tikzpicture}[x=.36cm,y=.14cm,font=\scriptsize]
      \foreach \a/\f in {0/2,2/5,4/9,6/5,8/2}{\balk{\a}{\a+2}{\f}} \draw[grijs] (0,0) -- (10,0); \node at (5,-2.2) {A};
      \begin{scope}[xshift=4.4cm]\foreach \a/\f in {0/9,2/6,4/3,6/2,8/1}{\balk{\a}{\a+2}{\f}} \draw[grijs] (0,0) -- (10,0); \node at (5,-2.2) {B};\end{scope}
      \begin{scope}[xshift=8.8cm]\foreach \a/\f in {0/1,2/2,4/3,6/6,8/9}{\balk{\a}{\a+2}{\f}} \draw[grijs] (0,0) -- (10,0); \node at (5,-2.2) {C};\end{scope}
    \end{tikzpicture}}
    \figuren{\begin{tikzpicture}[x=.36cm,font=\scriptsize]
      \boxplot[.5]{0}{0}{5.2}{7.4}{8.8}{10} \node at (5,-.65) {1};
      \begin{scope}[xshift=4.4cm]\boxplot[.5]{0}{0}{3.5}{5}{6.5}{10} \node at (5,-.65) {2};\end{scope}
      \begin{scope}[xshift=8.8cm]\boxplot[.5]{0}{0}{1.2}{2.6}{4.8}{10} \node at (5,-.65) {3};\end{scope}
    \end{tikzpicture}}
  antwoord: |-
    A--2, B--3, C--1
  uitwerking: |-
    A is symmetrisch: de mediaan in het midden van de box, even lange snorharen (2). Bij B liggen de meeste gegevens links: de box ligt links en de rechtersnorhaar is lang (3). C is het spiegelbeeld van B (1).

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    fouten in een tabel en een histogram
  opgave: |-
    Ruben maakt een frequentietabel van de punten op 30 van zijn klas, met de klassen $[0, 10]$, $[10, 20]$ en $[20, 30]$. Daarna tekent hij een histogram met een ruimte tussen de rechthoeken.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is er mis met zijn klassen?
      antwoord: |-
        10 en 20 horen bij twee klassen
      uitwerking: |-
        Een score van 10 of 20 zou hij twee keer tellen. Beter: $[0, 10[$, $[10, 20[$ en $[20, 30]$ (de laatste klasse sluit hij, zodat 30 erbij hoort).
    - opgave: |-
        Wat is er mis met zijn histogram?
      antwoord: |-
        de rechthoeken moeten aansluiten
      uitwerking: |-
        Tussen de klassen is geen opening: een score van 9,5 bestaat ook. De rechthoeken van een histogram sluiten op elkaar aan.
    - opgave: |-
        Waarom zijn drie klassen wellicht te weinig?
      antwoord: |-
        je ziet de vorm niet
      uitwerking: |-
        Met drie rechthoeken zie je bijna niets van de verdeling. Klassen van 5 punten geven er zes.

- id: h1-o18
  soort: opdracht
  pakketten: [2, 3, 4, 5]
  niveau: 2
  thema: |-
    stam-en-bladdiagram en boxplot
  opgave: |-
    Een fruitteler weegt 25 appels (in g): 61, 74, 58, 83, 69, 77, 92, 65, 71, 88, 54, 79, 73, 66, 81, 70, 95, 62, 76, 85, 68, 72, 59, 80, 75.
  lijst: enumerate
  delen:
    - opgave: |-
        Maak een stam-en-bladdiagram.
      antwoord: |-
        stammen 5 tot 9
      uitwerking: |-
        \begin{tabular}[t]{r|l} 5 & 4\ 8\ 9 \\ 6 & 1\ 2\ 5\ 6\ 8\ 9 \\ 7 & 0\ 1\ 2\ 3\ 4\ 5\ 6\ 7\ 9 \\ 8 & 0\ 1\ 3\ 5\ 8 \\ 9 & 2\ 5 \end{tabular}\quad met $5 \mid 4 = 54$ g.
    - opgave: |-
        Bepaal de vijfgetallensamenvatting en teken een boxplot.
      antwoord: |-
        $54$; $65,5$; $73$; $80,5$; $95$
      uitwerking: |-
        25 getallen: $\Me$ is het 13de, 73. Onderste helft: de eerste 12, $Q_1 = \tfrac{65 + 66}{2} = 65,5$. Bovenste helft: het 14de tot het 25ste, $Q_3 = \tfrac{80 + 81}{2} = 80,5$.
        \figuren{\begin{tikzpicture}[x=.14cm,font=\scriptsize]
          \boxplot{.7}{54}{65.5}{73}{80.5}{95}
          \getalas[g]{50}{10}{100}
        \end{tikzpicture}}
    - opgave: |-
        Appels van minstens 80 g verkoopt de teler als klasse I. Is dat ongeveer een kwart van de appels?
      antwoord: |-
        ja, 7 van de 25
      uitwerking: |-
        $Q_3 = 80,5$, dus ongeveer een kwart weegt meer dan $80,5$ g. Tellen: 80, 81, 83, 85, 88, 92, 95, dat zijn 7 appels of $28~\%$.

- id: h1-o18
  soort: opdracht
  pakketten: [1]
  niveau: 2
  thema: |-
    boxplot van veel gegevens
  opgave: |-
    Een fruitteler weegt 25 appels (in g): 61, 74, 58, 83, 69, 77, 92, 65, 71, 88, 54, 79, 73, 66, 81, 70, 95, 62, 76, 85, 68, 72, 59, 80, 75.
  lijst: enumerate
  delen:
    - opgave: |-
        Rangschik de massa's, bepaal de vijfgetallensamenvatting en teken een boxplot.
      antwoord: |-
        $54$; $65,5$; $73$; $80,5$; $95$
      uitwerking: |-
        $54, 58, 59, 61, 62, 65, 66, 68, 69, 70, 71, 72, \fbox{73}, 74, 75, 76, 77, 79, 80, 81, 83, 85, 88, 92, 95$. 25 getallen: $\Me$ is het 13de, 73. Onderste helft: de eerste 12, $Q_1 = \tfrac{65 + 66}{2} = 65,5$. Bovenste helft: het 14de tot het 25ste, $Q_3 = \tfrac{80 + 81}{2} = 80,5$.
        \figuren{\begin{tikzpicture}[x=.14cm,font=\scriptsize]
          \boxplot{.7}{54}{65.5}{73}{80.5}{95}
          \getalas[g]{50}{10}{100}
        \end{tikzpicture}}
    - opgave: |-
        Appels van minstens 80 g verkoopt de teler als klasse I. Is dat ongeveer een kwart van de appels?
      antwoord: |-
        ja, 7 van de 25
      uitwerking: |-
        $Q_3 = 80,5$, dus ongeveer een kwart weegt meer dan $80,5$ g. Tellen: 80, 81, 83, 85, 88, 92, 95, dat zijn 7 appels of $28~\%$.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    gegevens bij een vijfgetallensamenvatting
  opgave: |-
    Bedenk acht gehele getallen met minimum 2, $Q_1 = 4$, $\Me = 7$, $Q_3 = 10$ en maximum 15.
  antwoord: |-
    bijvoorbeeld $2, 3, 5, 6, 8, 9, 11, 15$
  uitwerking: |-
    Bij acht getallen is $\Me$ het gemiddelde van het 4de en het 5de getal, $Q_1$ dat van het 2de en het 3de, en $Q_3$ dat van het 6de en het 7de. Kies dus het 2de en het 3de met som 8 (3 en 5), het 4de en 5de met som 14 (6 en 8), het 6de en 7de met som 20 (9 en 11). Er zijn veel andere oplossingen, zoals $2, 4, 4, 7, 7, 10, 10, 15$.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    een boxplot interpreteren
  opgave: |-
    In een boxplot is de linkersnorhaar 1 cm lang en de rechtersnorhaar 4 cm. Welke uitspraken volgen daaruit? Leg uit.
  lijst: enumerate
  delen:
    - opgave: |-
        Rechts van de box liggen meer gegevens dan links ervan.
      antwoord: |-
        volgt niet
      uitwerking: |-
        Beide snorharen bevatten ongeveer een kwart van de gegevens.
    - opgave: |-
        De grootste gegevens liggen verder uit elkaar dan de kleinste.
      antwoord: |-
        volgt wel
      uitwerking: |-
        Hetzelfde aantal gegevens is verspreid over een langer stuk.
    - opgave: |-
        Het maximum ligt verder van de mediaan dan het minimum.
      antwoord: |-
        volgt niet zonder meer
      uitwerking: |-
        Niet zeker. Van de mediaan tot het maximum is de rechterhelft van de box plus 4 cm, tot het minimum de linkerhelft plus 1 cm. Is de linkerhelft van de box meer dan 3 cm langer dan de rechterhelft, dan ligt het minimum verder van de mediaan.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    effect van een verandering op de boxplot
  opgave: |-
    Gegeven: $12, 15, 16, 18, 20, 21, 23, 26, 28$. Bepaal telkens de mediaan en de kwartielen, en zeg wat er veranderd is.
  lijst: enumerate
  delen:
    - opgave: |-
        de gegeven rij
      antwoord: |-
        $\Me = 20$, $Q_1 = 15,5$, $Q_3 = 24,5$
      uitwerking: |-
        Negen getallen: $\Me = 20$. $Q_1 = \tfrac{15 + 16}{2}$, $Q_3 = \tfrac{23 + 26}{2}$.
    - opgave: |-
        het grootste getal 28 wordt 82 (een tikfout)
      antwoord: |-
        niets verandert, behalve het maximum
      uitwerking: |-
        De volgorde blijft dezelfde, dus de mediaan en de kwartielen blijven. Alleen de rechtersnorhaar wordt veel langer.
    - opgave: |-
        het getal 30 komt erbij
      antwoord: |-
        $\Me = 20,5$, $Q_1 = 16$, $Q_3 = 26$
      uitwerking: |-
        Tien getallen: $\Me = \tfrac{20 + 21}{2}$. Onderste helft $12, 15, 16, 18, 20$: $Q_1 = 16$. Bovenste helft $21, 23, 26, 28, 30$: $Q_3 = 26$. Alles schuift een beetje naar rechts.
    - opgave: |-
        het getal 19 komt erbij (in plaats van 30)
      antwoord: |-
        $\Me = 19,5$, $Q_1 = 16$, $Q_3 = 23$
      uitwerking: |-
        $12, 15, 16, 18, 19 \mid 20, 21, 23, 26, 28$: $\Me = 19,5$, $Q_1 = 16$, $Q_3 = 23$. Een getal in het midden maakt de box smaller.

- id: h1-o22
  soort: opdracht
  pakketten: [1, 2, 3, 4]
  niveau: 3
  thema: |-
    dezelfde boxplot, andere gegevens
  opgave: |-
    Een boxplot toont niet alles. Je onderzoekt dat met twee rijen van zeven getallen.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de vijfgetallensamenvatting van $1, 2, 3, 4, 5, 6, 7$ en van $1, 2, 2, 4, 6, 6, 7$.
      antwoord: |-
        beide $1$; $2$; $4$; $6$; $7$
      uitwerking: |-
        Telkens: $\Me$ het 4de getal (4), $Q_1$ het 2de (2), $Q_3$ het 6de (6), min 1, max 7.
    - opgave: |-
        Teken van elke rij een stippendiagram: een stip boven de getallenas voor elk getal. Wat is het verschil?
      antwoord: |-
        de tweede rij heeft twee groepjes
      uitwerking: |-
        De eerste rij is gelijkmatig verspreid. In de tweede rij liggen de getallen in twee groepjes, rond 2 en rond 6, met niets bij 3 en 5. De boxplot toont dat niet.
    - opgave: |-
        Bedenk zelf een derde rij van zeven getallen met dezelfde boxplot.
      antwoord: |-
        bijvoorbeeld $1, 2, 4, 4, 4, 6, 7$
      uitwerking: |-
        Het 2de getal moet 2 zijn, het 4de 4 en het 6de 6, met 1 en 7 als uitersten. De andere twee kies je vrij in de juiste stukken: één tussen 2 en 4, één tussen 4 en 6.

- id: h1-o22
  soort: opdracht
  pakketten: [5]
  niveau: 3
  thema: |-
    histogram met ongelijke klassen
  opgave: |-
    Een bibliotheek telt haar 100 bezoekers op een zaterdag per leeftijdsklasse: $[0, 10[$: 12; $[10, 20[$: 18; $[20, 40[$: 22; $[40, 60[$: 30; $[60, 90[$: 18.
  lijst: enumerate
  delen:
    - opgave: |-
        Elien tekent een histogram met als hoogte de frequentie. Waarom geeft dat een vertekend beeld?
      antwoord: |-
        brede klassen lijken te groot
      uitwerking: |-
        De klassen zijn niet even breed. In een histogram zie je de oppervlakte: de klasse $[60, 90[$ is drie keer zo breed als $[0, 10[$ en lijkt met hoogte 18 veel groter dan ze is.
    - opgave: |-
        Bij ongelijke klassen neem je als hoogte het aantal bezoekers per 10 jaar. Bereken die hoogtes en teken het histogram.
      antwoord: |-
        $12$; $18$; $11$; $15$; $6$
      uitwerking: |-
        $[20, 40[$ is 2 keer 10 jaar breed: $\tfrac{22}{2} = 11$. $[40, 60[$: $\tfrac{30}{2} = 15$. $[60, 90[$: $\tfrac{18}{3} = 6$. Nu is de oppervlakte evenredig met het aantal bezoekers.
        \figuren{\begin{tikzpicture}[x=.12cm,y=.17cm,font=\scriptsize]
          \frequentieas[per 10 jaar]{2}{18}{0}{92}
          \foreach \a/\b/\h in {0/10/12,10/20/18,20/40/11,40/60/15,60/90/6}{\balk{\a}{\b}{\h}}
          \foreach \a in {0,10,20,40,60,90}{\node[below] at (\a,0) {\a};}
          \node[below=8pt] at (45,0) {leeftijd (jaar)};
        \end{tikzpicture}}
    - opgave: |-
        In welke leeftijdsklasse zijn de bezoekers het dichtst opeengepakt?
      antwoord: |-
        $[10, 20[$
      uitwerking: |-
        De hoogste rechthoek: 18 bezoekers per 10 jaar. De klasse $[40, 60[$ heeft wel de meeste bezoekers, maar over 20 jaar verspreid.

# --- Test jezelf -----------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    soorten variabelen
  opgave: |-
    Is de variabele kwalitatief, discreet of continu?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de lievelingskleur van een leerling
      antwoord: |-
        kwalitatief
      uitwerking: |-
        Een categorie.
    - opgave: |-
        de lengte van een regenworm
      antwoord: |-
        continu
      uitwerking: |-
        Een gemeten lengte.
    - opgave: |-
        het aantal fouten in een dictee
      antwoord: |-
        discreet
      uitwerking: |-
        Je telt fouten.
    - opgave: |-
        het nummer van een bus
      antwoord: |-
        kwalitatief
      uitwerking: |-
        Een getal dat een naam is.

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    frequentietabel
  opgave: |-
    Twintig leerlingen zeggen hoeveel boeken ze in de zomervakantie lazen: 0, 2, 1, 3, 1, 0, 2, 2, 1, 4, 1, 0, 3, 2, 1, 1, 2, 0, 1, 2. Maak een frequentietabel met de relatieve en de cumulatieve frequentie. Hoeveel procent las minstens 2 boeken?
  antwoord: |-
    frequenties 4, 7, 6, 2, 1; $45~\%$
  uitwerking: |-
    \begin{tabular}[t]{|c|c|c|c|}\hline boeken & frequentie & rel.\ frequentie & cum.\ frequentie \\ \hline 0 & 4 & $20~\%$ & 4 \\ \hline 1 & 7 & $35~\%$ & 11 \\ \hline 2 & 6 & $30~\%$ & 17 \\ \hline 3 & 2 & $10~\%$ & 19 \\ \hline 4 & 1 & $5~\%$ & 20 \\ \hline \end{tabular}\par
    Minstens 2 boeken: $20 - 11 = 9$ leerlingen, of $30~\% + 10~\% + 5~\% = 45~\%$.

- id: h1-t3
  soort: test
  niveau: 1
  thema: |-
    cirkeldiagram
  opgave: |-
    Op een receptie drinken 120 gasten: 50 koffie, 30 thee, 25 water en 15 niets. Bereken de middelpuntshoeken van een cirkeldiagram en teken het.
  antwoord: |-
    $150^\circ$, $90^\circ$, $75^\circ$, $45^\circ$
  uitwerking: |-
    $\tfrac{50}{120} \cdot 360^\circ = 150^\circ$, $\tfrac{30}{120} \cdot 360^\circ = 90^\circ$, $\tfrac{25}{120} \cdot 360^\circ = 75^\circ$, $\tfrac{15}{120} \cdot 360^\circ = 45^\circ$.
    \figuren{\begin{tikzpicture}[scale=.9]
      \sector{90}{-60}{accent!55}{koffie}
      \sector{-60}{-150}{accent!35}{thee}
      \sector{-150}{-225}{accent!20}{water}
      \sector{-225}{-270}{accent!80}{niets}
    \end{tikzpicture}}

- id: h1-t4
  soort: test
  niveau: 1
  thema: |-
    histogram
  opgave: |-
    Een postkantoor meet de wachttijd van 35 klanten: $[0, 5[$: 6; $[5, 10[$: 14; $[10, 15[$: 9; $[15, 20[$: 4; $[20, 25[$: 2 (in minuten). Teken een histogram. Hoeveel procent wachtte minstens 15 minuten?
  antwoord: |-
    $17,1~\%$
  uitwerking: |-
    $4 + 2 = 6$ van de 35: $\tfrac{6}{35} \approx 17,1~\%$.
    \figuren{\begin{tikzpicture}[x=.3cm,y=.18cm,font=\scriptsize]
      \frequentieas{2}{14}{0}{26}
      \foreach \a/\f in {0/6,5/14,10/9,15/4,20/2}{\balk{\a}{\a+5}{\f}}
      \foreach \a in {0,5,...,25}{\node[below] at (\a,0) {\a};}
      \node[below=8pt] at (12.5,0) {wachttijd (min)};
    \end{tikzpicture}}

- id: h1-t5
  soort: test
  niveau: 2
  thema: |-
    mediaan en kwartielen
  opgave: |-
    Bepaal de mediaan en de kwartielen van: 24, 31, 18, 27, 35, 22, 29, 40, 26, 33, 20, 38, 28.
  antwoord: |-
    $\Me = 28$, $Q_1 = 23$, $Q_3 = 34$
  uitwerking: |-
    $18, 20, 22, 24, 26, 27, \fbox{28}, 29, 31, 33, 35, 38, 40$. Onderste helft (zes getallen): $Q_1 = \tfrac{22 + 24}{2} = 23$. Bovenste helft: $Q_3 = \tfrac{33 + 35}{2} = 34$.

- id: h1-t6
  soort: test
  niveau: 2
  thema: |-
    boxplot tekenen
  opgave: |-
    Twaalf leerlingen halen deze punten op 10: 8,5; 6; 7,5; 9; 5,5; 7; 8; 6,5; 9,5; 4; 7,5; 8,5. Teken een boxplot.
  antwoord: |-
    $4$; $6,25$; $7,5$; $8,5$; $9,5$
  uitwerking: |-
    $4; 5,5; 6; 6,5; 7; 7,5 \mid 7,5; 8; 8,5; 8,5; 9; 9,5$. $\Me = 7,5$, $Q_1 = \tfrac{6 + 6,5}{2} = 6,25$, $Q_3 = \tfrac{8,5 + 8,5}{2} = 8,5$.
    \figuren{\begin{tikzpicture}[x=.9cm,font=\scriptsize]
      \boxplot{.7}{4}{6.25}{7.5}{8.5}{9.5}
      \getalas[punten]{3}{1}{10}
    \end{tikzpicture}}

- id: h1-t7
  soort: test
  niveau: 2
  thema: |-
    boxplot lezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.27cm,font=\scriptsize]
        \boxplot{.7}{4}{9}{12}{15}{19}
        \getalas[punten]{0}{5}{20}
      \end{tikzpicture}
  opgave: |-
    De boxplot toont de punten op 20 van 60 leerlingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel leerlingen haalden minder dan 9 punten?
      antwoord: |-
        ongeveer 15
      uitwerking: |-
        Een kwart van 60.
    - opgave: |-
        Welk percentage haalde minstens 12 punten?
      antwoord: |-
        ongeveer $50~\%$
      uitwerking: |-
        12 is de mediaan.
    - opgave: |-
        Hoeveel leerlingen haalden tussen 9 en 19 punten?
      antwoord: |-
        ongeveer 45
      uitwerking: |-
        Drie kwart van 60.
