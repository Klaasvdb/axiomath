# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.
# Notatie: in driehoek ABC is a = |BC|, b = |CA|, c = |AB|, en alpha, beta, gamma de hoeken in A, B, C.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of beantwoord.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin 130^\circ$, op vier decimalen
      antwoord: |-
        $0{,}7660$
      uitwerking: |-
        Met de rekenmachine.
    - opgave: |-
        $\sin 50^\circ$, op vier decimalen. Waarom is dat hetzelfde?
      antwoord: |-
        $0{,}7660$; supplementaire hoeken
      uitwerking: |-
        $130^\circ$ en $50^\circ$ zijn samen $180^\circ$ en hebben dezelfde sinus.
    - opgave: |-
        $\cos 130^\circ$, op vier decimalen
      antwoord: |-
        $-0{,}6428$
      uitwerking: |-
        Negatief, want $130^\circ$ ligt in het tweede kwadrant.
    - opgave: |-
        de oppervlakte van een driehoek met basis 8 en hoogte 5
      antwoord: |-
        $20$
      uitwerking: |-
        $\tfrac12 \cdot 8 \cdot 5 = 20$.
    - opgave: |-
        $x$ als $\dfrac{x}{\sin 40^\circ} = \dfrac{10}{\sin 70^\circ}$, op twee decimalen
      antwoord: |-
        $6{,}84$
      uitwerking: |-
        $x = \tfrac{10 \sin 40^\circ}{\sin 70^\circ} \approx 6{,}84$.
    - opgave: |-
        $x > 0$ als $x^2 = 25 + 64 - 80 \cdot 0{,}5$
      antwoord: |-
        $7$
      uitwerking: |-
        $x^2 = 89 - 40 = 49$, dus $x = 7$.
    - opgave: |-
        de hoek van een driehoek met cosinus $-0{,}5$
      antwoord: |-
        $120^\circ$
      uitwerking: |-
        $\cos 120^\circ = -\cos 60^\circ = -\tfrac12$, en bij de cosinus is er maar één hoek tussen $0^\circ$ en $180^\circ$.
    - opgave: |-
        de mogelijke hoeken van een driehoek met sinus $0{,}5$
      antwoord: |-
        $30^\circ$ of $150^\circ$
      uitwerking: |-
        Een scherpe hoek en zijn supplement hebben dezelfde sinus.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Teken een driehoek $ABC$ met $\lengte{AB} = 7$~cm, $\hoek{A} = 50^\circ$ en $\hoek{B} = 60^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        Meet $a = \lengte{BC}$ en $b = \lengte{CA}$ tot op een millimeter, en bereken $\hoek{C}$.
      antwoord: |-
        $a \approx 5{,}7$~cm, $b \approx 6{,}5$~cm, $\hoek{C} = 70^\circ$
      uitwerking: |-
        $\hoek{C} = 180^\circ - 50^\circ - 60^\circ = 70^\circ$. Een kleine meetfout is normaal.
    - opgave: |-
        Bereken $\dfrac{a}{\sin\hoek{A}}$, $\dfrac{b}{\sin\hoek{B}}$ en $\dfrac{c}{\sin\hoek{C}}$, op twee decimalen.
      antwoord: |-
        telkens ongeveer $7{,}45$
      uitwerking: |-
        $\tfrac{5{,}7}{\sin 50^\circ} \approx 7{,}44$, $\tfrac{6{,}5}{\sin 60^\circ} \approx 7{,}51$ en $\tfrac{7}{\sin 70^\circ} \approx 7{,}45$. Met exacte zijden zijn ze alle drie gelijk.
    - opgave: |-
        Wat valt je op? Teken eventueel een andere driehoek en probeer opnieuw.
      antwoord: |-
        de drie quotiënten zijn gelijk
      uitwerking: |-
        In elke driehoek is een zijde gedeeld door de sinus van de hoek ertegenover hetzelfde getal. Dat is de sinusregel.

- id: h2-opp
  soort: kort
  opgave: |-
    Bereken de oppervlakte van driehoek $ABC$, afgerond op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        $a = 6$, $b = 9$ en $\gamma = 35^\circ$
      antwoord: |-
        $15{,}49$
      uitwerking: |-
        $\tfrac12 \cdot 6 \cdot 9 \sin 35^\circ \approx 15{,}49$.
    - opgave: |-
        $b = 12$, $c = 7$ en $\alpha = 120^\circ$ (geef ook de exacte waarde)
      antwoord: |-
        $21\sqrt3 \approx 36{,}37$
      uitwerking: |-
        $\tfrac12 \cdot 12 \cdot 7 \sin 120^\circ = 42 \cdot \tfrac{\sqrt3}{2} = 21\sqrt3$.

- id: h2-sinus
  soort: kort
  opgave: |-
    Bereken de ontbrekende hoek en zijden van driehoek $ABC$, afgerond op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        $a = 12$, $\beta = 47^\circ$ en $\gamma = 68^\circ$
      antwoord: |-
        $\alpha = 65^\circ$, $b \approx 9{,}68$, $c \approx 12{,}28$
      uitwerking: |-
        $\alpha = 180^\circ - 47^\circ - 68^\circ$. Dan $b = \tfrac{12 \sin 47^\circ}{\sin 65^\circ}$ en $c = \tfrac{12 \sin 68^\circ}{\sin 65^\circ}$.
    - opgave: |-
        $b = 5$, $\alpha = 30^\circ$ en $\beta = 110^\circ$
      antwoord: |-
        $\gamma = 40^\circ$, $a \approx 2{,}66$, $c \approx 3{,}42$
      uitwerking: |-
        $\gamma = 40^\circ$. Het gekende paar is $b$ en $\beta$: $a = \tfrac{5 \sin 30^\circ}{\sin 110^\circ}$ en $c = \tfrac{5 \sin 40^\circ}{\sin 110^\circ}$.

- id: h2-zzh
  soort: kort
  opgave: |-
    Hoeveel driehoeken $ABC$ zijn er? Bereken ze, met zijden op twee decimalen en hoeken op $0{,}01^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        $a = 8$, $b = 10$ en $\alpha = 45^\circ$
      antwoord: |-
        twee: $\beta \approx 62{,}11^\circ$, $\gamma \approx 72{,}89^\circ$, $c \approx 10{,}81$; of $\beta \approx 117{,}89^\circ$, $\gamma \approx 17{,}11^\circ$, $c \approx 3{,}33$
      uitwerking: |-
        $\sin\beta = \tfrac{10 \sin 45^\circ}{8} \approx 0{,}8839$. Beide kandidaten passen, want $45^\circ + 117{,}89^\circ < 180^\circ$. Telkens $c = \tfrac{8 \sin\gamma}{\sin 45^\circ}$.
    - opgave: |-
        $a = 12$, $b = 10$ en $\alpha = 45^\circ$
      antwoord: |-
        één: $\beta \approx 36{,}10^\circ$, $\gamma \approx 98{,}90^\circ$, $c \approx 16{,}77$
      uitwerking: |-
        $\sin\beta = \tfrac{10 \sin 45^\circ}{12} \approx 0{,}5893$, dus $\beta \approx 36{,}10^\circ$ of $143{,}90^\circ$. Het supplement past niet: $45^\circ + 143{,}90^\circ > 180^\circ$.
    - opgave: |-
        $a = 5$, $b = 10$ en $\alpha = 45^\circ$
      antwoord: |-
        geen
      uitwerking: |-
        $\sin\beta = \tfrac{10 \sin 45^\circ}{5} \approx 1{,}41 > 1$.

- id: h2-aantal
  soort: kort
  pakketten: [5]
  opgave: |-
    Hoeveel driehoeken $ABC$ zijn er? Gebruik de stelling, zonder de hoeken te berekenen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\alpha = 30^\circ$, $b = 10$, $a = 4$
      antwoord: |-
        $0$
      uitwerking: |-
        $h = 10 \sin 30^\circ = 5$, en $a < h$.
    - opgave: |-
        $\alpha = 30^\circ$, $b = 10$, $a = 5$
      antwoord: |-
        $1$ (rechthoekig in $B$)
      uitwerking: |-
        $a = h$.
    - opgave: |-
        $\alpha = 30^\circ$, $b = 10$, $a = 7$
      antwoord: |-
        $2$
      uitwerking: |-
        $h = 5 < 7 < 10 = b$.
    - opgave: |-
        $\alpha = 30^\circ$, $b = 10$, $a = 12$
      antwoord: |-
        $1$
      uitwerking: |-
        $a \geqslant b$.
    - opgave: |-
        $\alpha = 120^\circ$, $b = 10$, $a = 9$
      antwoord: |-
        $0$
      uitwerking: |-
        $\alpha$ is stomp en $a \leqslant b$.
    - opgave: |-
        $\alpha = 120^\circ$, $b = 10$, $a = 15$
      antwoord: |-
        $1$
      uitwerking: |-
        $\alpha$ is stomp en $a > b$.

- id: h2-straal
  soort: kort
  pakketten: [5]
  opgave: |-
    Bereken de straal $R$ van de omgeschreven cirkel van driehoek $ABC$. Geef een exacte waarde als dat kan.
  lijst: enumerate
  delen:
    - opgave: |-
        $a = 10$ en $\alpha = 30^\circ$
      antwoord: |-
        $R = 10$
      uitwerking: |-
        $2R = \tfrac{10}{\sin 30^\circ} = 20$.
    - opgave: |-
        $c = 9$, $\alpha = 50^\circ$ en $\beta = 70^\circ$
      antwoord: |-
        $R = 3\sqrt3 \approx 5{,}20$
      uitwerking: |-
        $\gamma = 60^\circ$, dus $2R = \tfrac{9}{\sin 60^\circ} = \tfrac{18}{\sqrt3} = 6\sqrt3$.
    - opgave: |-
        $ABC$ is rechthoekig in $C$, met $c = 13$
      antwoord: |-
        $R = 6{,}5$
      uitwerking: |-
        $2R = \tfrac{13}{\sin 90^\circ} = 13$: de schuine zijde is een middellijn.

- id: h2-cos
  soort: kort
  opgave: |-
    Bereken de derde zijde van driehoek $ABC$, afgerond op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        $b = 6$, $c = 10$ en $\alpha = 40^\circ$
      antwoord: |-
        $a \approx 6{,}64$
      uitwerking: |-
        $a^2 = 36 + 100 - 120 \cos 40^\circ \approx 44{,}07$.
    - opgave: |-
        $a = 9$, $b = 4$ en $\gamma = 130^\circ$
      antwoord: |-
        $c \approx 11{,}97$
      uitwerking: |-
        $c^2 = 81 + 16 - 72 \cos 130^\circ \approx 143{,}28$. De term $-72\cos 130^\circ$ is positief: de hoek is stomp.

- id: h2-zzz
  soort: kort
  opgave: |-
    Bereken de gevraagde hoeken, afgerond op $0{,}01^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        alle hoeken van de driehoek met $a = 5$, $b = 7$ en $c = 8$
      antwoord: |-
        $\alpha \approx 38{,}21^\circ$, $\beta = 60^\circ$, $\gamma \approx 81{,}79^\circ$
      uitwerking: |-
        Grootste hoek eerst: $\cos\gamma = \tfrac{25 + 49 - 64}{70} = \tfrac17$, dus $\gamma \approx 81{,}79^\circ$. Dan $\cos\beta = \tfrac{25 + 64 - 49}{80} = \tfrac12$, dus $\beta = 60^\circ$, en $\alpha = 180^\circ - \beta - \gamma$.
    - opgave: |-
        de grootste hoek van de driehoek met zijden 4, 6 en 9
      antwoord: |-
        $127{,}17^\circ$
      uitwerking: |-
        Tegenover de zijde 9: $\cos\gamma = \tfrac{16 + 36 - 81}{48} \approx -0{,}6042$.

- id: h2-cosregel
  soort: kort
  opgave: |-
    Neem de cosinusregel $c^2 = a^2 + b^2 - 2ab\cos\gamma$.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat wordt de regel als $\gamma = 90^\circ$, als $\gamma = 60^\circ$ en als $\gamma = 120^\circ$?
      antwoord: |-
        $c^2 = a^2 + b^2$; $c^2 = a^2 + b^2 - ab$; $c^2 = a^2 + b^2 + ab$
      uitwerking: |-
        $\cos 90^\circ = 0$, $\cos 60^\circ = \tfrac12$ en $\cos 120^\circ = -\tfrac12$. Bij $90^\circ$ is het de stelling van Pythagoras.
    - opgave: |-
        Bereken $c$ exact voor $a = 3$ en $b = 5$, in elk van de drie gevallen. Klopt de volgorde met wat je verwacht?
      antwoord: |-
        $\sqrt{34}$; $\sqrt{19}$; $7$
      uitwerking: |-
        $9 + 25 = 34$, $34 - 15 = 19$ en $34 + 15 = 49$. Hoe groter de hoek tussen de zijden, hoe langer de derde zijde.

- id: h2-toep
  soort: kort
  opgave: |-
    Vanuit een punt $A$ zie je de top van een heuvel onder een hoogtehoek van $12^\circ$. Je stapt 500~m recht naar de heuvel toe, tot in $B$, en ziet de top nu onder $20^\circ$. Hoe hoog ligt de top boven je ogen, afgerond op een meter?
  antwoord: |-
    $255$~m
  uitwerking: |-
    In driehoek $ABT$ is de hoek in $B$ gelijk aan $160^\circ$ en die in $T$ gelijk aan $8^\circ$. Sinusregel: $\lengte{BT} = \tfrac{500 \sin 12^\circ}{\sin 8^\circ} \approx 746{,}95$. De hoogte is $\lengte{BT}\sin 20^\circ \approx 255$~m.

- id: h2-regel
  soort: kort
  opgave: |-
    Welke regel gebruik je eerst? Hoeveel driehoeken kunnen er zijn? Je hoeft niet te rekenen.
  lijst: enumerate
  delen:
    - opgave: |-
        $a = 5$, $b = 7$ en $\gamma = 48^\circ$
      antwoord: |-
        cosinusregel; één
      uitwerking: |-
        Twee zijden en de ingesloten hoek.
    - opgave: |-
        $\alpha = 40^\circ$, $\gamma = 75^\circ$ en $b = 9$
      antwoord: |-
        hoekensom, dan sinusregel; één
      uitwerking: |-
        Twee hoeken en een zijde: $\beta = 65^\circ$ vormt het paar met $b$.
    - opgave: |-
        $a = 6$, $b = 8$ en $c = 11$
      antwoord: |-
        cosinusregel; één
      uitwerking: |-
        Drie zijden: begin met de hoek tegenover 11.
    - opgave: |-
        $a = 6$, $b = 8$ en $\alpha = 35^\circ$
      antwoord: |-
        sinusregel; nul, één of twee
      uitwerking: |-
        Twee zijden en een niet-ingesloten hoek: het dubbelzinnige geval. (Hier zijn er twee.)
    - opgave: |-
        $\alpha = \beta = \gamma = 60^\circ$
      antwoord: |-
        niet op te lossen
      uitwerking: |-
        Er is geen zijde gegeven: elke gelijkzijdige driehoek past.

# --- Opdrachten ------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    oppervlakte met de ingesloten hoek
  opgave: |-
    Bereken de oppervlakte van driehoek $ABC$, afgerond op twee decimalen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $a = 7$, $b = 11$, $\gamma = 52^\circ$
      antwoord: |-
        $30{,}34$
      uitwerking: |-
        $\tfrac12 \cdot 7 \cdot 11 \sin 52^\circ$.
    - opgave: |-
        $b = 4{,}5$, $c = 8$, $\alpha = 150^\circ$
      antwoord: |-
        $9$
      uitwerking: |-
        $\tfrac12 \cdot 4{,}5 \cdot 8 \cdot \tfrac12 = 9$, want $\sin 150^\circ = \tfrac12$.
    - opgave: |-
        $a = c = 10$, $\beta = 36^\circ$
      antwoord: |-
        $29{,}39$
      uitwerking: |-
        $\tfrac12 \cdot 10 \cdot 10 \sin 36^\circ$.
    - opgave: |-
        $b = 12$, $c = 15$, $\alpha = 90^\circ$
      antwoord: |-
        $90$
      uitwerking: |-
        $\sin 90^\circ = 1$: de gewone formule voor een rechthoekige driehoek.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    sinusregel: twee hoeken en een zijde
  opgave: |-
    Los driehoek $ABC$ op. Rond zijden af op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        $c = 20$, $\alpha = 42^\circ$, $\beta = 71^\circ$
      antwoord: |-
        $\gamma = 67^\circ$, $a \approx 14{,}54$, $b \approx 20{,}54$
      uitwerking: |-
        $a = \tfrac{20 \sin 42^\circ}{\sin 67^\circ}$ en $b = \tfrac{20 \sin 71^\circ}{\sin 67^\circ}$.
    - opgave: |-
        $a = 7{,}5$, $\alpha = 35^\circ$, $\gamma = 105^\circ$
      antwoord: |-
        $\beta = 40^\circ$, $b \approx 8{,}40$, $c \approx 12{,}63$
      uitwerking: |-
        $b = \tfrac{7{,}5 \sin 40^\circ}{\sin 35^\circ}$ en $c = \tfrac{7{,}5 \sin 105^\circ}{\sin 35^\circ}$.
    - opgave: |-
        $b = 14$, $\alpha = 58^\circ$, $\gamma = 37^\circ$
      antwoord: |-
        $\beta = 85^\circ$, $a \approx 11{,}92$, $c \approx 8{,}46$
      uitwerking: |-
        $a = \tfrac{14 \sin 58^\circ}{\sin 85^\circ}$ en $c = \tfrac{14 \sin 37^\circ}{\sin 85^\circ}$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    cosinusregel: de derde zijde
  opgave: |-
    Bereken de derde zijde van driehoek $ABC$, afgerond op twee decimalen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $b = 7$, $c = 9$, $\alpha = 52^\circ$
      antwoord: |-
        $a \approx 7{,}24$
      uitwerking: |-
        $a^2 = 49 + 81 - 126 \cos 52^\circ \approx 52{,}43$.
    - opgave: |-
        $a = 12$, $c = 5$, $\beta = 120^\circ$
      antwoord: |-
        $b \approx 15{,}13$
      uitwerking: |-
        $b^2 = 144 + 25 - 120 \cos 120^\circ = 169 + 60 = 229$.
    - opgave: |-
        $a = 3{,}6$, $b = 4{,}8$, $\gamma = 90^\circ$
      antwoord: |-
        $c = 6$
      uitwerking: |-
        $\cos 90^\circ = 0$: de stelling van Pythagoras, $c^2 = 12{,}96 + 23{,}04 = 36$.
    - opgave: |-
        $a = b = 10$, $\gamma = 20^\circ$
      antwoord: |-
        $c \approx 3{,}47$
      uitwerking: |-
        $c^2 = 200 - 200 \cos 20^\circ \approx 12{,}06$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    cosinusregel: hoeken uit drie zijden
  opgave: |-
    Bereken de hoeken van driehoek $ABC$, afgerond op $0{,}01^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        $a = 6$, $b = 7$, $c = 8$
      antwoord: |-
        $\alpha \approx 46{,}57^\circ$, $\beta \approx 57{,}91^\circ$, $\gamma \approx 75{,}52^\circ$
      uitwerking: |-
        $\cos\gamma = \tfrac{36 + 49 - 64}{84} = 0{,}25$; $\cos\alpha = \tfrac{49 + 64 - 36}{112} \approx 0{,}6875$; $\beta$ uit de hoekensom.
    - opgave: |-
        $a = 3$, $b = 5$, $c = 7$
      antwoord: |-
        $\alpha \approx 21{,}79^\circ$, $\beta \approx 38{,}21^\circ$, $\gamma = 120^\circ$
      uitwerking: |-
        $\cos\gamma = \tfrac{9 + 25 - 49}{30} = -\tfrac12$; $\cos\alpha = \tfrac{25 + 49 - 9}{70} = \tfrac{65}{70}$; $\beta$ uit de hoekensom.
    - opgave: |-
        $a = 2$, $b = 3$, $c = 6$
      antwoord: |-
        geen driehoek
      uitwerking: |-
        $\cos\gamma = \tfrac{4 + 9 - 36}{12} \approx -1{,}92 < -1$. Ook: $2 + 3 < 6$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    scherp, recht of stomp
  opgave: |-
    Is de driehoek met deze zijden scherphoekig, rechthoekig of stomphoekig? Vergelijk het kwadraat van de grootste zijde met de som van de kwadraten van de andere twee, en verklaar met de cosinusregel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        5, 6, 7
      antwoord: |-
        scherp
      uitwerking: |-
        $49 < 25 + 36 = 61$, dus $\cos\gamma > 0$. Uit de cosinusregel $c^2 = a^2 + b^2 - 2ab\cos\gamma$ volgt: $c^2 < a^2 + b^2$ precies als $\cos\gamma > 0$, en dan is de grootste hoek scherp.
    - opgave: |-
        5, 12, 13
      antwoord: |-
        recht
      uitwerking: |-
        $169 = 25 + 144$, dus $\cos\gamma = 0$.
    - opgave: |-
        4, 5, 8
      antwoord: |-
        stomp
      uitwerking: |-
        $64 > 16 + 25 = 41$, dus $\cos\gamma < 0$.
    - opgave: |-
        6, 8, 11
      antwoord: |-
        stomp
      uitwerking: |-
        $121 > 36 + 64 = 100$.
    - opgave: |-
        7, 8, 10
      antwoord: |-
        scherp
      uitwerking: |-
        $100 < 49 + 64 = 113$.

- id: h2-o6
  soort: opdracht
  niveau: 2
  thema: |-
    twee zijden en een niet-ingesloten hoek
  opgave: |-
    Hoeveel driehoeken $ABC$ zijn er? Los ze op, met zijden op twee decimalen en hoeken op $0{,}01^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        $a = 9$, $b = 12$, $\alpha = 38^\circ$
      antwoord: |-
        twee: $\beta \approx 55{,}17^\circ$, $\gamma \approx 86{,}83^\circ$, $c \approx 14{,}60$; of $\beta \approx 124{,}83^\circ$, $\gamma \approx 17{,}17^\circ$, $c \approx 4{,}32$
      uitwerking: |-
        $\sin\beta = \tfrac{12 \sin 38^\circ}{9} \approx 0{,}8209$. Beide kandidaten passen. Telkens $c = \tfrac{9 \sin\gamma}{\sin 38^\circ}$.
    - opgave: |-
        $a = 15$, $b = 12$, $\alpha = 38^\circ$
      antwoord: |-
        één: $\beta \approx 29{,}51^\circ$, $\gamma \approx 112{,}49^\circ$, $c \approx 22{,}51$
      uitwerking: |-
        $\sin\beta = \tfrac{12 \sin 38^\circ}{15} \approx 0{,}4925$. Het supplement $150{,}49^\circ$ past niet naast $38^\circ$. (Of: $b < a$, dus $\beta < \alpha$.)
    - opgave: |-
        $a = 6$, $b = 12$, $\alpha = 38^\circ$
      antwoord: |-
        geen
      uitwerking: |-
        $\sin\beta = \tfrac{12 \sin 38^\circ}{6} \approx 1{,}23 > 1$.
    - opgave: |-
        $a = 6$, $b = 12$, $\alpha = 30^\circ$
      antwoord: |-
        één, rechthoekig: $\beta = 90^\circ$, $\gamma = 60^\circ$, $c = 6\sqrt3 \approx 10{,}39$
      uitwerking: |-
        $\sin\beta = \tfrac{12 \cdot 0{,}5}{6} = 1$, dus $\beta = 90^\circ$. Dan $c = \sqrt{144 - 36} = \sqrt{108} = 6\sqrt3$.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    driehoeken oplossen, gemengd
  opgave: |-
    Los driehoek $ABC$ op. Kies telkens zelf de regel. Rond zijden af op twee decimalen en hoeken op $0{,}01^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        $a = 9$, $b = 11$, $c = 15$
      antwoord: |-
        $\alpha \approx 36{,}58^\circ$, $\beta \approx 46{,}75^\circ$, $\gamma \approx 96{,}67^\circ$
      uitwerking: |-
        Drie zijden: $\cos\gamma = \tfrac{81 + 121 - 225}{198} \approx -0{,}1162$. Dan $\cos\alpha = \tfrac{121 + 225 - 81}{330} \approx 0{,}8030$, en $\beta$ uit de hoekensom.
    - opgave: |-
        $b = 8$, $c = 6$, $\alpha = 75^\circ$
      antwoord: |-
        $a \approx 8{,}67$, $\beta \approx 63{,}05^\circ$, $\gamma \approx 41{,}95^\circ$
      uitwerking: |-
        Ingesloten hoek: $a^2 = 64 + 36 - 96 \cos 75^\circ \approx 75{,}15$. Dan de kleinste hoek $\gamma$ met de sinusregel, $\sin\gamma = \tfrac{6 \sin 75^\circ}{a}$, en $\beta$ uit de hoekensom.
    - opgave: |-
        $a = 10$, $\alpha = 50^\circ$, $\beta = 65^\circ$
      antwoord: |-
        $\gamma = 65^\circ$, $b = c \approx 11{,}83$
      uitwerking: |-
        Twee hoeken en een zijde: $b = c = \tfrac{10 \sin 65^\circ}{\sin 50^\circ}$. De driehoek is gelijkbenig.
    - opgave: |-
        $a = 6$, $c = 8$, $\alpha = 35^\circ$
      antwoord: |-
        twee: $\gamma \approx 49{,}89^\circ$, $\beta \approx 95{,}11^\circ$, $b \approx 10{,}42$; of $\gamma \approx 130{,}11^\circ$, $\beta \approx 14{,}89^\circ$, $b \approx 2{,}69$
      uitwerking: |-
        Niet-ingesloten hoek: $\sin\gamma = \tfrac{8 \sin 35^\circ}{6} \approx 0{,}7648$. Beide kandidaten passen. Telkens $b = \tfrac{6 \sin\beta}{\sin 35^\circ}$.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    hoogte van een zendmast
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.0105,font=\scriptsize]
        \coordinate (A) at (0,0); \coordinate (B) at (120,0); \coordinate (V) at (309,0); \coordinate (T) at (309,164.3);
        \draw[lijngrijs] (-10,0) -- (325,0);
        \draw[grijs,line width=1.4pt] (V) -- (T);
        \draw[accent,thick] (A) -- (T) (B) -- (T);
        \hoeklabel{V}{A}{T}{8mm}{28^\circ} \hoeklabel{V}{B}{T}{6mm}{41^\circ}
        \node[below] at (A) {$A$}; \node[below] at (B) {$B$};
        \node[below] at (60,0) {120 m};
      \end{tikzpicture}
  opgave: |-
    Vanuit een punt $A$ zie je de top van een zendmast onder een hoogtehoek van $28^\circ$. In $B$, 120~m dichter bij de mast, is de hoogtehoek $41^\circ$. $A$, $B$ en de voet van de mast liggen op een rechte. Verwaarloos de ooghoogte en rond af op een decimeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de hoeken van driehoek $ABT$, met $T$ de top.
      antwoord: |-
        $28^\circ$, $139^\circ$ en $13^\circ$
      uitwerking: |-
        In $B$: $180^\circ - 41^\circ = 139^\circ$. In $T$: $180^\circ - 28^\circ - 139^\circ = 13^\circ$.
    - opgave: |-
        Bereken $\lengte{BT}$ en de hoogte van de mast.
      antwoord: |-
        $\lengte{BT} \approx 250{,}4$~m; hoogte $\approx 164{,}3$~m
      uitwerking: |-
        $\lengte{BT} = \tfrac{120 \sin 28^\circ}{\sin 13^\circ} \approx 250{,}44$. Dan $h = \lengte{BT} \sin 41^\circ \approx 164{,}30$.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    twee schepen
  opgave: |-
    Twee schepen vertrekken tegelijk uit dezelfde haven. Het ene vaart 18~km/h, het andere 24~km/h, en hun koersen maken een hoek van $75^\circ$. Hoe ver liggen ze na anderhalf uur uit elkaar, afgerond op een decimeter?
  antwoord: |-
    $39{,}0$~km
  uitwerking: |-
    Na 1,5 uur hebben ze 27~km en 36~km afgelegd. Met de cosinusregel: $d^2 = 27^2 + 36^2 - 2 \cdot 27 \cdot 36 \cos 75^\circ \approx 1521{,}86$, dus $d \approx 39{,}01$~km.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    parallellogram
  opgave: |-
    Een parallellogram heeft zijden van 8~cm en 5~cm, en een hoek van $60^\circ$. Geef exacte waarden en benaderingen op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe groot zijn de andere hoeken van het parallellogram?
      antwoord: |-
        $60^\circ$, $120^\circ$ en $120^\circ$
      uitwerking: |-
        Twee opeenvolgende hoeken zijn samen $180^\circ$.
    - opgave: |-
        Bereken de lengte van de twee diagonalen.
      antwoord: |-
        $7$~cm en $\sqrt{129} \approx 11{,}36$~cm
      uitwerking: |-
        De korte diagonaal ligt tegenover de hoek van $60^\circ$: $d^2 = 64 + 25 - 80 \cdot \tfrac12 = 49$. De lange tegenover $120^\circ$: $d^2 = 89 + 40 = 129$.
    - opgave: |-
        Bereken de oppervlakte.
      antwoord: |-
        $20\sqrt3 \approx 34{,}64$~cm$^2$
      uitwerking: |-
        Een diagonaal verdeelt het parallellogram in twee gelijke driehoeken: $2 \cdot \tfrac12 \cdot 8 \cdot 5 \sin 60^\circ = 40 \cdot \tfrac{\sqrt3}{2} = 20\sqrt3$.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    schiethoek op een doel
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=.11,font=\scriptsize]
        \coordinate (L) at (0,0); \coordinate (R) at (7.32,0);
        \coordinate (S) at (-6.5,-16.8);
        \draw[grijs,line width=1.6pt] (L) -- (R);
        \draw[accent,thick] (S) -- (L) (S) -- (R);
        \hoeklabel[angle eccentricity=1.8]{R}{S}{L}{9mm}{\theta}
        \fill (S) circle (12pt) node[below] {speler};
        \node[left] at (-3.3,-8.4) {18 m}; \node[right] at (1.2,-8.4) {21,5 m};
        \node[above] at (3.66,0) {7,32 m};
      \end{tikzpicture}
  opgave: |-
    De palen van een voetbaldoel staan 7,32~m uit elkaar. Een speler staat 18~m van de ene paal en 21,5~m van de andere. Onder welke hoek $\theta$ ziet hij het doel, afgerond op $0{,}01^\circ$? Zou de hoek groter of kleiner zijn als hij recht voor het doel stond, op dezelfde afstand van de doellijn?
  antwoord: |-
    $18{,}81^\circ$
  uitwerking: |-
    De hoek ligt tegenover de zijde van 7,32~m: $\cos\theta = \tfrac{18^2 + 21{,}5^2 - 7{,}32^2}{2 \cdot 18 \cdot 21{,}5} \approx 0{,}9466$, dus $\theta \approx 18{,}81^\circ$. Recht voor het doel ziet hij het onder een grotere hoek: daar staat het doel niet schuin voor hem.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    driehoek met een gegeven oppervlakte
  opgave: |-
    Een driehoek $ABC$ heeft oppervlakte 30, met $a = 8$ en $b = 10$. Bereken $\gamma$ en $c$. Er zijn twee oplossingen. Rond af op $0{,}01^\circ$ en op twee decimalen.
  antwoord: |-
    $\gamma \approx 48{,}59^\circ$ en $c \approx 7{,}63$, of $\gamma \approx 131{,}41^\circ$ en $c \approx 16{,}43$
  uitwerking: |-
    $\tfrac12 \cdot 8 \cdot 10 \sin\gamma = 30$ geeft $\sin\gamma = 0{,}75$, dus $\gamma \approx 48{,}59^\circ$ of $\gamma \approx 131{,}41^\circ$. Telkens met de cosinusregel: $c^2 = 164 - 160\cos\gamma$, wat $c \approx 7{,}63$ of $c \approx 16{,}43$ geeft.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    dakspant
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.42,font=\scriptsize]
        \coordinate (L) at (0,0); \coordinate (R) at (7.5,0); \coordinate (N) at (28.03:5.2);
        \fill[accent!10] (L) -- (R) -- (N) -- cycle;
        \draw[accent,thick] (L) -- (N) -- (R);
        \draw[grijs,thick] (L) -- (R);
        \draw[accent,dashed] (N) -- ({5.2*cos(28.03)},0);
        \node[above left] at (2.3,1.2) {5,2 m}; \node[above right] at (5.9,1.2) {3,8 m};
        \node[below] at (3.75,0) {7,5 m};
      \end{tikzpicture}
  opgave: |-
    Een dak heeft twee ongelijke dakvlakken. In een doorsnede zijn de spanten 5,2~m en 3,8~m lang, en de onderkant van het dak is 7,5~m breed.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de hellingshoeken van de twee dakvlakken en de hoek in de nok, op $0{,}01^\circ$.
      antwoord: |-
        $28{,}03^\circ$ en $40{,}02^\circ$; nok $111{,}95^\circ$
      uitwerking: |-
        De grootste hoek ligt in de nok, tegenover 7,5~m: $\cos = \tfrac{5{,}2^2 + 3{,}8^2 - 7{,}5^2}{2 \cdot 5{,}2 \cdot 3{,}8} \approx -0{,}3737$, dus $111{,}95^\circ$. Bij het lange spant, tegenover 3,8~m: $\cos = \tfrac{5{,}2^2 + 7{,}5^2 - 3{,}8^2}{2 \cdot 5{,}2 \cdot 7{,}5} \approx 0{,}8827$, dus $28{,}03^\circ$. De derde hoek is $40{,}02^\circ$.
    - opgave: |-
        Hoe hoog ligt de nok boven de onderkant, op een centimeter?
      antwoord: |-
        $2{,}44$~m
      uitwerking: |-
        $5{,}2 \sin 28{,}03^\circ \approx 2{,}44$ (of $3{,}8 \sin 40{,}02^\circ$).

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    fouten zoeken
  opgave: |-
    Elk van deze leerlingen maakt een fout. Zoek de fout en geef de juiste uitkomst.
  lijst: enumerate
  delen:
    - opgave: |-
        Jens berekent $a$ in driehoek $ABC$ met $b = 5$, $c = 8$ en $\alpha = 60^\circ$ zo: $a^2 = (25 + 64 - 2 \cdot 5 \cdot 8) \cdot \cos 60^\circ = 4{,}5$, dus $a \approx 2{,}12$.
      antwoord: |-
        $a = 7$
      uitwerking: |-
        De cosinus hoort alleen bij de term $2bc$: $a^2 = 25 + 64 - 80\cos 60^\circ = 49$. Een korte controle: $a \approx 2{,}12$ is veel te kort voor een hoek van $60^\circ$ tussen zijden van 5 en 8.
    - opgave: |-
        Lotte zoekt de driehoeken met $a = 7$, $b = 9$ en $\alpha = 40^\circ$. Ze vindt $\sin\beta \approx 0{,}8264$, dus $\beta \approx 55{,}73^\circ$, en rekent één driehoek uit.
      antwoord: |-
        er is ook $\beta \approx 124{,}27^\circ$
      uitwerking: |-
        Het supplement heeft dezelfde sinus, en $40^\circ + 124{,}27^\circ < 180^\circ$: er is een tweede driehoek.
    - opgave: |-
        Mila berekent in de driehoek met zijden 7, 8 en 13 eerst de kleinste hoek, $27{,}80^\circ$, met de cosinusregel. Dan vindt ze met de sinusregel $\sin\gamma \approx 0{,}866$ voor de hoek tegenover 13, en schrijft $\gamma = 60^\circ$.
      antwoord: |-
        $\gamma = 120^\circ$
      uitwerking: |-
        De sinus kent geen verschil tussen $60^\circ$ en $120^\circ$. Met $60^\circ$ zou de som van de hoeken niet kloppen met de derde hoek uit de cosinusregel. Begin daarom met de grootste hoek, met de cosinusregel: $\cos\gamma = -\tfrac12$.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    afstand over een meer
  opgave: |-
    De punten $A$ en $B$ liggen aan de twee uiteinden van een meer. Vanuit een punt $C$ op het land meet je $\lengte{CA} = 380$~m, $\lengte{CB} = 510$~m en $\hoek{ACB} = 64^\circ$. Hoe lang is het meer van $A$ tot $B$, afgerond op een meter? Maak een schets.
  antwoord: |-
    $484$~m
  uitwerking: |-
    De hoek in $C$ ligt tussen de twee gemeten zijden: $\lengte{AB}^2 = 380^2 + 510^2 - 2 \cdot 380 \cdot 510 \cos 64^\circ \approx 234\,587$, dus $\lengte{AB} \approx 484$~m.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    een vliegtuig tussen twee steden
  opgave: |-
    Twee waarnemers in de steden $A$ en $B$, 8~km uit elkaar, zien een vliegtuig dat tussen hen in vliegt, in hetzelfde verticale vlak. In $A$ is de hoogtehoek $35^\circ$, in $B$ is hij $50^\circ$. Hoe hoog vliegt het vliegtuig, afgerond op tien meter? Maak eerst een schets.
  antwoord: |-
    ongeveer $3530$~m
  uitwerking: |-
    In de driehoek met $A$, $B$ en het vliegtuig $V$ is de hoek in $V$ gelijk aan $180^\circ - 35^\circ - 50^\circ = 95^\circ$. Sinusregel: $\lengte{AV} = \tfrac{8 \sin 50^\circ}{\sin 95^\circ} \approx 6{,}152$~km. De hoogte is $\lengte{AV}\sin 35^\circ \approx 3{,}529$~km.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte uit drie zijden
  opgave: |-
    Een driehoekig perceel heeft zijden van 40~m, 55~m en 70~m. Bereken de oppervlakte, afgerond op een vierkante meter. Bereken eerst een hoek.
  antwoord: |-
    $1098$~m$^2$
  uitwerking: |-
    De hoek tegenover 70~m: $\cos\gamma = \tfrac{40^2 + 55^2 - 70^2}{2 \cdot 40 \cdot 55} \approx -0{,}0625$, dus $\gamma \approx 93{,}58^\circ$. Dan $A = \tfrac12 \cdot 40 \cdot 55 \sin\gamma \approx 1097{,}85$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    regelmatige vijfhoek
  opgave: |-
    Een regelmatige vijfhoek heeft zijden van 6~cm. Rond af op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat elke hoek van de vijfhoek $108^\circ$ is.
      antwoord: |-
        $\tfrac{3 \cdot 180^\circ}{5} = 108^\circ$
      uitwerking: |-
        Twee diagonalen uit één hoekpunt verdelen de vijfhoek in drie driehoeken: de hoeken zijn samen $3 \cdot 180^\circ = 540^\circ$, en ze zijn alle vijf even groot.
    - opgave: |-
        Bereken de lengte van een diagonaal.
      antwoord: |-
        $9{,}71$~cm
      uitwerking: |-
        Een diagonaal ligt tegenover een hoek van $108^\circ$ tussen twee zijden: $d^2 = 36 + 36 - 72 \cos 108^\circ \approx 94{,}25$.
    - opgave: |-
        Bereken de oppervlakte van de vijfhoek. (Tip: verdeel hem met twee diagonalen in drie driehoeken.)
      antwoord: |-
        $61{,}94$~cm$^2$
      uitwerking: |-
        Twee driehoeken met zijden 6, 6 en hoek $108^\circ$: elk $\tfrac12 \cdot 36 \sin 108^\circ \approx 17{,}12$. De middelste driehoek heeft zijden $d$, $d$, 6 en tophoek $108^\circ - 2 \cdot 36^\circ = 36^\circ$ (de basishoeken van de buitenste driehoeken zijn $36^\circ$): $\tfrac12 d^2 \sin 36^\circ \approx 27{,}70$. Samen ongeveer $61{,}94$.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    twee krachten
  opgave: |-
    Twee sleepboten trekken een schip met krachten van 4~kN en 6~kN, die een hoek van $40^\circ$ maken. Samen werken ze als één kracht, de resultante. Die is de diagonaal van het parallellogram met de twee krachten als zijden. Rond af op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke hoek van het parallellogram ligt tegenover de diagonaal? Bereken de grootte van de resultante.
      antwoord: |-
        $140^\circ$; $9{,}42$~kN
      uitwerking: |-
        In de driehoek met zijden 6 en 4 en de diagonaal is de hoek tussen die zijden $180^\circ - 40^\circ = 140^\circ$. Dan $R^2 = 36 + 16 - 48 \cos 140^\circ \approx 88{,}77$.
    - opgave: |-
        Welke hoek maakt de resultante met de kracht van 6~kN?
      antwoord: |-
        $15{,}84^\circ$
      uitwerking: |-
        Sinusregel: $\sin\theta = \tfrac{4 \sin 140^\circ}{R} \approx 0{,}2729$, en $\theta$ is scherp (ze ligt tegenover de kleinste zijde).

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    bewijzen met de cosinusregel
  opgave: |-
    Bewijs met de cosinusregel.
  lijst: enumerate
  delen:
    - opgave: |-
        De omgekeerde stelling van Pythagoras: als in driehoek $ABC$ geldt dat $c^2 = a^2 + b^2$, dan is $\gamma = 90^\circ$.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        De cosinusregel geeft $c^2 = a^2 + b^2 - 2ab\cos\gamma$. Met $c^2 = a^2 + b^2$ volgt $2ab\cos\gamma = 0$, en omdat $a, b > 0$ is $\cos\gamma = 0$. De enige hoek tussen $0^\circ$ en $180^\circ$ met cosinus 0 is $90^\circ$.
    - opgave: |-
        In een parallellogram met zijden $a$ en $b$ en diagonalen $d_1$ en $d_2$ is $d_1^2 + d_2^2 = 2a^2 + 2b^2$.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        Noem $\alpha$ een hoek van het parallellogram; de aanliggende hoek is $180^\circ - \alpha$. Dan $d_1^2 = a^2 + b^2 - 2ab\cos\alpha$ en $d_2^2 = a^2 + b^2 - 2ab\cos(180^\circ - \alpha) = a^2 + b^2 + 2ab\cos\alpha$. Optellen geeft $2a^2 + 2b^2$.
    - opgave: |-
        Controleer b met het parallellogram van 8~cm en 5~cm uit een vorige opdracht.
      antwoord: |-
        $49 + 129 = 178 = 2 \cdot 64 + 2 \cdot 25$
      uitwerking: |-
        De diagonalen waren $7$ en $\sqrt{129}$.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    een exacte oppervlakte
  opgave: |-
    Een driehoek heeft zijden 13, 14 en 15. Bereken zonder rekenmachine, met breuken.
  lijst: enumerate
  delen:
    - opgave: |-
        de cosinus van de hoek $\beta$ tegenover de zijde 14
      antwoord: |-
        $\cos\beta = \tfrac{33}{65}$
      uitwerking: |-
        $\cos\beta = \tfrac{13^2 + 15^2 - 14^2}{2 \cdot 13 \cdot 15} = \tfrac{198}{390} = \tfrac{33}{65}$.
    - opgave: |-
        $\sin\beta$, met de grondformule
      antwoord: |-
        $\sin\beta = \tfrac{56}{65}$
      uitwerking: |-
        $\sin^2\beta = 1 - \tfrac{1089}{4225} = \tfrac{3136}{4225}$, en $\sqrt{3136} = 56$, $\sqrt{4225} = 65$. De sinus van een hoek van een driehoek is positief.
    - opgave: |-
        de oppervlakte van de driehoek
      antwoord: |-
        $84$
      uitwerking: |-
        $\tfrac12 \cdot 13 \cdot 15 \cdot \tfrac{56}{65} = \tfrac{13 \cdot 15 \cdot 56}{130} = 84$. Een driehoek met gehele zijden en een gehele oppervlakte.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    afstand tussen twee eilanden
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.068,font=\scriptsize]
        \coordinate (A) at (0,0); \coordinate (B) at (50,0);
        \coordinate (P) at (80:31.644); \coordinate (Q) at (40:60.806);
        \fill[accent!8] (-6,10) rectangle (56,46);
        \draw[lijngrijs] (-6,0) -- (56,0);
        \fill[accent!35] (P) circle (2.2); \fill[accent!35] (Q) circle (2.2);
        \draw[accent] (A) -- (P) (A) -- (Q) (B) -- (P) (B) -- (Q);
        \draw[accent,dashed] (P) -- (Q);
        \fill (A) circle (30pt) node[below] {$A$}; \fill (B) circle (30pt) node[below] {$B$};
        \node[above left] at (P) {$P$}; \node[above right] at (Q) {$Q$};
        \node[below] at (25,0) {500 m};
      \end{tikzpicture}
  opgave: |-
    Op de kust liggen $A$ en $B$, 500~m uit elkaar. Voor de kust liggen twee eilandjes $P$ en $Q$. In $A$ meet je $\hoek{BAP} = 80^\circ$ en $\hoek{BAQ} = 40^\circ$, in $B$ meet je $\hoek{ABP} = 35^\circ$ en $\hoek{ABQ} = 85^\circ$. Hoe ver liggen de eilandjes uit elkaar, afgerond op een meter? (Tip: bereken eerst $\lengte{AP}$ en $\lengte{AQ}$.)
  antwoord: |-
    $418$~m
  uitwerking: |-
    In driehoek $ABP$ is de hoek in $P$ gelijk aan $65^\circ$, dus $\lengte{AP} = \tfrac{500 \sin 35^\circ}{\sin 65^\circ} \approx 316{,}44$. In driehoek $ABQ$ is de hoek in $Q$ gelijk aan $55^\circ$, dus $\lengte{AQ} = \tfrac{500 \sin 85^\circ}{\sin 55^\circ} \approx 608{,}06$. In driehoek $APQ$ is $\hoek{PAQ} = 80^\circ - 40^\circ = 40^\circ$: $\lengte{PQ}^2 = \lengte{AP}^2 + \lengte{AQ}^2 - 2\lengte{AP}\lengte{AQ}\cos 40^\circ$, dus $\lengte{PQ} \approx 418$~m.

- id: h2-o23
  soort: opdracht
  niveau: 3
  thema: |-
    de projectieformule
  opgave: |-
    In driehoek $ABC$ is $D$ het voetpunt van de hoogte uit $A$ op de rechte $BC$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat $a = b\cos\gamma + c\cos\beta$ als $\beta$ en $\gamma$ scherp zijn. (Tip: $D$ ligt dan op $[BC]$; druk $\lengte{BD}$ en $\lengte{DC}$ uit.)
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        In de rechthoekige driehoek $ABD$ is $\lengte{BD} = c\cos\beta$, en in $ADC$ is $\lengte{DC} = b\cos\gamma$. Omdat $D$ tussen $B$ en $C$ ligt, is $a = \lengte{BD} + \lengte{DC}$.
    - opgave: |-
        Toon aan dat de formule ook geldt als $\beta$ stomp is.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        Nu ligt $B$ tussen $D$ en $C$, en is $a = \lengte{DC} - \lengte{DB}$. In de rechthoekige driehoek $ABD$ is de hoek in $B$ gelijk aan $180^\circ - \beta$, dus $\lengte{DB} = c\cos(180^\circ - \beta) = -c\cos\beta$. Zo is $a = b\cos\gamma - (-c\cos\beta) = b\cos\gamma + c\cos\beta$.
    - opgave: |-
        Controleer de formule in de driehoek met $a = 7$, $b = 8$ en $c = 13$, met $\gamma = 120^\circ$ en $\beta \approx 32{,}20^\circ$.
      antwoord: |-
        klopt: $-4 + 11{,}00 \approx 7$
      uitwerking: |-
        $-4 + 13 \cdot 0{,}8462 \approx 7{,}00$.

- id: h2-o24
  soort: opdracht
  niveau: 3
  pakketten: [5]
  thema: |-
    sinusregel met 2R bij een rechte of stompe hoek
  opgave: |-
    Werk het bewijs van de sinusregel met de omgeschreven cirkel af. Noem $\alpha$ de grootste hoek van driehoek $ABC$, $M$ het middelpunt van de omgeschreven cirkel en $R$ de straal.
  lijst: enumerate
  delen:
    - opgave: |-
        Is $\alpha = 90^\circ$, dan ligt $M$ in het midden van de schuine zijde $[BC]$. Leid daaruit af dat $\frac{a}{\sin\alpha} = 2R$.
      antwoord: |-
        $a = 2R$ en $\sin 90^\circ = 1$
      uitwerking: |-
        $[BC]$ is dan een middellijn: $a = 2R$. Omdat $\sin 90^\circ = 1$, is $\frac{a}{\sin\alpha} = 2R$.
    - opgave: |-
        Is $\alpha$ stomp, dan ligt $M$ aan de andere kant van $BC$ dan $A$. Noem de basishoeken van de gelijkbenige driehoeken $MAB$, $MAC$ en $MBC$ opnieuw $x$, $z$ en $y$. Toon aan dat $\alpha = x + z$, $\beta = x - y$ en $\gamma = z - y$, en leid af dat $y = \alpha - 90^\circ$.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        In $A$ liggen de hoeken van $MAB$ en $MAC$ naast elkaar, dus $\alpha = x + z$. In $B$ ligt $\beta$ binnen de hoek $\hoek{ABM} = x$, en is ze die hoek min $\hoek{CBM} = y$; net zo in $C$. De hoekensom geeft $(x + z) + (x - y) + (z - y) = 180^\circ$, dus $x + z - y = 90^\circ$, of $\alpha - y = 90^\circ$.
    - opgave: |-
        Werk het bewijs af zoals bij een scherpe hoek, met de hoogte uit $M$ in driehoek $MBC$.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        In de rechthoekige driehoek $MNB$, met $N$ het midden van $[BC]$, is $\tfrac a2 = R\cos y = R\cos(\alpha - 90^\circ)$. Met tegengestelde en complementaire hoeken is $\cos(\alpha - 90^\circ) = \cos(90^\circ - \alpha) = \sin\alpha$. Dus $\frac{a}{\sin\alpha} = 2R$.

- id: h2-o25
  soort: opdracht
  niveau: 3
  pakketten: [5]
  thema: |-
    het dubbelzinnige geval met de cosinusregel
  opgave: |-
    Neem opnieuw de driehoeken met $a = 7$, $b = 9$ en $\alpha = 40^\circ$ uit voorbeeld \ref{vb:h2-twee}, en zoek nu $c$ met de cosinusregel voor $a$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat je de vierkantsvergelijking $c^2 - (18\cos 40^\circ)\,c + 32 = 0$ krijgt.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        $49 = 81 + c^2 - 2 \cdot 9 \cdot c \cos 40^\circ$, dus $c^2 - 18c\cos 40^\circ + 32 = 0$.
    - opgave: |-
        Los ze op, op twee decimalen. Vergelijk met voorbeeld \ref{vb:h2-twee}.
      antwoord: |-
        $c \approx 10{,}84$ of $c \approx 2{,}95$
      uitwerking: |-
        $18\cos 40^\circ \approx 13{,}789$; de discriminant is ongeveer $190{,}13 - 128 = 62{,}13 > 0$. De oplossingen $\tfrac{13{,}789 \pm 7{,}882}{2}$ zijn $10{,}84$ en $2{,}95$: precies de twee driehoeken van de sinusregel.
    - opgave: |-
        Wat betekent het voor de driehoeken als de discriminant negatief is, of nul?
      antwoord: |-
        geen driehoek; één (rechthoekige) driehoek
      uitwerking: |-
        Zonder oplossing is er geen driehoek; bij discriminant nul is er één. Ook een negatieve oplossing telt niet: een zijde is positief. Zo vind je met de cosinusregel hetzelfde aantal als met de stelling over het aantal driehoeken, zonder supplementen te controleren.

- id: h2-o26
  soort: opdracht
  niveau: 1
  thema: |-
    sinusregel of cosinusregel, gemengd
  opgave: |-
    Bereken de gevraagde zijde of hoek van driehoek $ABC$. Kies telkens zelf de regel. Rond zijden af op twee decimalen en hoeken op $0{,}01^\circ$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $a = 5$, $\beta = 40^\circ$, $\gamma = 60^\circ$; bereken $b$.
      antwoord: |-
        $3{,}26$
      uitwerking: |-
        $\alpha = 80^\circ$, dus $b = \tfrac{5 \sin 40^\circ}{\sin 80^\circ}$ (sinusregel).
    - opgave: |-
        $a = 5$, $b = 7$, $\gamma = 60^\circ$; bereken $c$.
      antwoord: |-
        $\sqrt{39} \approx 6{,}24$
      uitwerking: |-
        Ingesloten hoek: $c^2 = 25 + 49 - 35 = 39$ (cosinusregel).
    - opgave: |-
        $a = 8$, $b = 6$, $c = 5$; bereken $\alpha$.
      antwoord: |-
        $92{,}87^\circ$
      uitwerking: |-
        $\cos\alpha = \tfrac{36 + 25 - 64}{60} = -0{,}05$ (cosinusregel).
    - opgave: |-
        $b = 10$, $\alpha = 25^\circ$, $\beta = 120^\circ$; bereken $a$.
      antwoord: |-
        $4{,}88$
      uitwerking: |-
        Het paar $b$, $\beta$ is gekend: $a = \tfrac{10 \sin 25^\circ}{\sin 120^\circ}$ (sinusregel).
    - opgave: |-
        $b = 3$, $c = 4$, $\alpha = 150^\circ$; bereken $a$.
      antwoord: |-
        $6{,}77$
      uitwerking: |-
        $a^2 = 9 + 16 - 24\cos 150^\circ \approx 45{,}78$ (cosinusregel).
    - opgave: |-
        $a = 6$, $b = 10$, $c = 12$; bereken $\gamma$.
      antwoord: |-
        $93{,}82^\circ$
      uitwerking: |-
        $\cos\gamma = \tfrac{36 + 100 - 144}{120} \approx -0{,}0667$ (cosinusregel).

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    oppervlakte
  opgave: |-
    Bereken de oppervlakte van driehoek $ABC$ met $a = 9$, $c = 14$ en $\beta = 128^\circ$, afgerond op twee decimalen.
  antwoord: |-
    $49{,}64$
  uitwerking: |-
    $\beta$ is de ingesloten hoek van $a$ en $c$: $\tfrac12 \cdot 9 \cdot 14 \sin 128^\circ \approx 49{,}64$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    sinusregel
  opgave: |-
    Los driehoek $ABC$ op met $c = 25$, $\alpha = 38^\circ$ en $\beta = 77^\circ$. Rond af op twee decimalen.
  antwoord: |-
    $\gamma = 65^\circ$, $a \approx 16{,}98$, $b \approx 26{,}88$
  uitwerking: |-
    $\gamma = 180^\circ - 38^\circ - 77^\circ$. Dan $a = \tfrac{25 \sin 38^\circ}{\sin 65^\circ}$ en $b = \tfrac{25 \sin 77^\circ}{\sin 65^\circ}$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    cosinusregel: de derde zijde
  opgave: |-
    In driehoek $ABC$ is $a = 11$, $b = 7$ en $\gamma = 105^\circ$. Bereken $c$, afgerond op twee decimalen.
  antwoord: |-
    $14{,}49$
  uitwerking: |-
    $c^2 = 121 + 49 - 154 \cos 105^\circ \approx 209{,}86$.

- id: h2-t4
  soort: test
  niveau: 2
  thema: |-
    cosinusregel: een hoek
  opgave: |-
    Een driehoek heeft zijden 8, 10 en 15. Bereken de grootste hoek, afgerond op $0{,}01^\circ$. Is de driehoek scherphoekig, rechthoekig of stomphoekig?
  antwoord: |-
    $112{,}41^\circ$; stomphoekig
  uitwerking: |-
    De grootste hoek ligt tegenover 15: $\cos\gamma = \tfrac{64 + 100 - 225}{160} \approx -0{,}3813$.

- id: h2-t5
  soort: test
  niveau: 2
  thema: |-
    het dubbelzinnige geval
  opgave: |-
    Los de driehoeken $ABC$ op met $a = 10$, $b = 13$ en $\alpha = 42^\circ$. Rond zijden af op twee decimalen en hoeken op $0{,}01^\circ$.
  antwoord: |-
    $\beta \approx 60{,}44^\circ$, $\gamma \approx 77{,}56^\circ$, $c \approx 14{,}59$; of $\beta \approx 119{,}56^\circ$, $\gamma \approx 18{,}44^\circ$, $c \approx 4{,}73$
  uitwerking: |-
    $\sin\beta = \tfrac{13 \sin 42^\circ}{10} \approx 0{,}8699$. Beide kandidaten passen naast $42^\circ$. Telkens $c = \tfrac{10 \sin\gamma}{\sin 42^\circ}$.

- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    toepassing met de cosinusregel
  opgave: |-
    Twee wandelaars vertrekken op hetzelfde punt, langs twee rechte paden die een hoek van $58^\circ$ maken. De ene stapt 3,2~km, de andere 4,5~km. Hoe ver zijn ze dan van elkaar, afgerond op tien meter?
  antwoord: |-
    ongeveer $3{,}90$~km
  uitwerking: |-
    $d^2 = 3{,}2^2 + 4{,}5^2 - 2 \cdot 3{,}2 \cdot 4{,}5 \cos 58^\circ \approx 15{,}23$, dus $d \approx 3{,}90$~km.

- id: h2-t7
  soort: test
  niveau: 2
  thema: |-
    welke regel
  opgave: |-
    Welke regel gebruik je eerst, en hoeveel driehoeken kunnen er zijn? Je hoeft niet te rekenen.
  lijst: enumerate
  delen:
    - opgave: |-
        $b$, $c$ en $\beta$ zijn gegeven.
      antwoord: |-
        sinusregel; nul, één of twee
      uitwerking: |-
        $\beta$ ligt niet tussen $b$ en $c$: het dubbelzinnige geval.
    - opgave: |-
        $a$, $\beta$ en $\gamma$ zijn gegeven.
      antwoord: |-
        hoekensom, dan sinusregel; één
      uitwerking: |-
        Twee hoeken en een zijde.
    - opgave: |-
        $a$, $b$ en $\gamma$ zijn gegeven.
      antwoord: |-
        cosinusregel; één
      uitwerking: |-
        $\gamma$ ligt tussen $a$ en $b$.
    - opgave: |-
        $a$, $b$ en $c$ zijn gegeven.
      antwoord: |-
        cosinusregel; één of geen
      uitwerking: |-
        Begin met de grootste hoek. Er is geen driehoek als een zijde minstens zo lang is als de twee andere samen.
