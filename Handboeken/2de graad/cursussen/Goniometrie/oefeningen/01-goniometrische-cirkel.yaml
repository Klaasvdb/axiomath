# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of beantwoord.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin 30^\circ$, exact
      antwoord: |-
        $\tfrac12$
      uitwerking: |-
        In de halve gelijkzijdige driehoek met zijden 1, 2 en $\sqrt3$ ligt de zijde 1 tegenover de hoek van $30^\circ$: $\sin 30^\circ = \tfrac12$.
    - opgave: |-
        $\cos 30^\circ$, exact
      antwoord: |-
        $\tfrac{\sqrt3}{2}$
      uitwerking: |-
        Aanliggend $\sqrt3$, schuin 2.
    - opgave: |-
        $\tan 45^\circ$, exact
      antwoord: |-
        $1$
      uitwerking: |-
        In een gelijkbenige rechthoekige driehoek zijn de rechthoekszijden even lang.
    - opgave: |-
        $\sin^2 35^\circ + \cos^2 35^\circ$
      antwoord: |-
        $1$
      uitwerking: |-
        De grondformule.
    - opgave: |-
        het spiegelbeeld van $(3, -2)$ om de $y$-as
      antwoord: |-
        $(-3, -2)$
      uitwerking: |-
        De $x$-coördinaat verandert van teken, de $y$-coördinaat blijft.
    - opgave: |-
        het spiegelbeeld van $(3, -2)$ om de oorsprong
      antwoord: |-
        $(-3, 2)$
      uitwerking: |-
        Beide coördinaten veranderen van teken.
    - opgave: |-
        het spiegelbeeld van $(3, -2)$ om de rechte $y = x$
      antwoord: |-
        $(-2, 3)$
      uitwerking: |-
        De coördinaten wisselen van plaats.
    - opgave: |-
        het kwadrant waarin het punt $(-4, 1)$ ligt
      antwoord: |-
        het tweede kwadrant
      uitwerking: |-
        Links van de $y$-as en boven de $x$-as.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Teken op ruitjespapier een assenstelsel met 1~cm als eenheid, en een cirkel met middelpunt $O$ en straal 5~cm. Draai met je geodriehoek de positieve $x$-as rond $O$, in tegenwijzerzin, over $30^\circ$, $150^\circ$, $210^\circ$ en $330^\circ$. Duid telkens het snijpunt met de cirkel aan.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees de coördinaten van de vier punten af, tot op een millimeter.
      antwoord: |-
        $(\pm 4{,}3;\ \pm 2{,}5)$
      uitwerking: |-
        Bij $30^\circ$: $(4{,}3;\ 2{,}5)$, bij $150^\circ$: $(-4{,}3;\ 2{,}5)$, bij $210^\circ$: $(-4{,}3;\ {-2{,}5})$ en bij $330^\circ$: $(4{,}3;\ {-2{,}5})$. Een kleine meetfout is normaal.
    - opgave: |-
        Wat valt je op aan de coördinaten? Hoe liggen de punten ten opzichte van elkaar?
      antwoord: |-
        dezelfde getallen, op het teken na
      uitwerking: |-
        De punten zijn elkaars spiegelbeeld om de $x$-as, om de $y$-as of om de oorsprong. Daarom verschillen hun coördinaten alleen in het teken.
    - opgave: |-
        Deel de coördinaten van het punt bij $30^\circ$ door de straal 5. Vergelijk met $\cos 30^\circ$ en $\sin 30^\circ$.
      antwoord: |-
        $(0{,}86;\ 0{,}5)$: de cosinus en de sinus van $30^\circ$
      uitwerking: |-
        $\tfrac{4{,}3}{5} = 0{,}86 \approx \tfrac{\sqrt3}{2} \approx 0{,}87$ en $\tfrac{2{,}5}{5} = 0{,}5 = \tfrac12$. In de rechthoekige driehoek met schuine zijde 5 is de aanliggende zijde $5\cos 30^\circ$ en de overstaande $5\sin 30^\circ$.

- id: h1-kwadrant
  soort: kort
  opgave: |-
    In welk kwadrant ligt de hoek? Geef ook een hoek met het andere teken die hetzelfde eindbeen heeft.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $75^\circ$
      antwoord: |-
        I; $-285^\circ$
      uitwerking: |-
        $75^\circ - 360^\circ = -285^\circ$.
    - opgave: |-
        $160^\circ$
      antwoord: |-
        II; $-200^\circ$
      uitwerking: |-
        $160^\circ - 360^\circ = -200^\circ$.
    - opgave: |-
        $250^\circ$
      antwoord: |-
        III; $-110^\circ$
      uitwerking: |-
        $250^\circ - 360^\circ = -110^\circ$.
    - opgave: |-
        $345^\circ$
      antwoord: |-
        IV; $-15^\circ$
      uitwerking: |-
        $345^\circ - 360^\circ = -15^\circ$.
    - opgave: |-
        $-120^\circ$
      antwoord: |-
        III; $240^\circ$
      uitwerking: |-
        $120^\circ$ in wijzerzin brengt je linksonder. $-120^\circ + 360^\circ = 240^\circ$.
    - opgave: |-
        $-200^\circ$
      antwoord: |-
        II; $160^\circ$
      uitwerking: |-
        $-200^\circ + 360^\circ = 160^\circ$.

- id: h1-toeren
  soort: kort
  opgave: |-
    Beantwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de hoekwaarde tussen $0^\circ$ en $360^\circ$ met hetzelfde eindbeen, en het kwadrant: $400^\circ$, $590^\circ$, $1234^\circ$, ${-300^\circ}$, ${-600^\circ}$ en $1080^\circ$.
      antwoord: |-
        $40^\circ$ (I); $230^\circ$ (III); $154^\circ$ (II); $60^\circ$ (I); $120^\circ$ (II); $0^\circ$ (op een as)
      uitwerking: |-
        $400^\circ - 360^\circ = 40^\circ$, $590^\circ - 360^\circ = 230^\circ$, $1234^\circ - 3 \cdot 360^\circ = 154^\circ$, $-300^\circ + 360^\circ = 60^\circ$, $-600^\circ + 2 \cdot 360^\circ = 120^\circ$ en $1080^\circ - 3 \cdot 360^\circ = 0^\circ$: na drie volle toeren ligt het eindbeen op de positieve $x$-as.
    - opgave: |-
        Bereken $\sin 1234^\circ$ en $\sin 154^\circ$ op vier decimalen. Verklaar wat je ziet.
      antwoord: |-
        beide $0{,}4384$
      uitwerking: |-
        $1234^\circ$ en $154^\circ$ verschillen drie volle toeren. Ze hebben hetzelfde eindbeen en hetzelfde punt op de goniometrische cirkel, dus dezelfde sinus.

- id: h1-sincos
  soort: kort
  opgave: |-
    Beantwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken met de rekenmachine, op vier decimalen: $\cos 100^\circ$, $\sin 100^\circ$, $\cos 235^\circ$ en $\sin 235^\circ$. Klopt het teken met de plaats van het punt op de cirkel?
      antwoord: |-
        $-0{,}1736$; $0{,}9848$; $-0{,}5736$; $-0{,}8192$; ja
      uitwerking: |-
        $100^\circ$ ligt in het tweede kwadrant (cosinus negatief, sinus positief), $235^\circ$ in het derde (beide negatief).
    - opgave: |-
        Welke hoek tussen $0^\circ$ en $360^\circ$ hoort bij het punt $(-1, 0)$? En bij $(0, -1)$?
      antwoord: |-
        $180^\circ$ en $270^\circ$
      uitwerking: |-
        Een halve toer brengt je naar $(-1, 0)$, drie kwart toer naar $(0, -1)$.
    - opgave: |-
        Kan $\cos\alpha = 1{,}3$? Leg uit.
      antwoord: |-
        nee
      uitwerking: |-
        De cosinus is de $x$-coördinaat van een punt op een cirkel met straal 1. Die ligt altijd tussen $-1$ en $1$.

- id: h1-tan
  soort: kort
  opgave: |-
    Beantwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\tan 160^\circ$, $\tan 250^\circ$ en $\tan 300^\circ$ op vier decimalen. Verklaar het teken.
      antwoord: |-
        $-0{,}3640$; $2{,}7475$; $-1{,}7321$
      uitwerking: |-
        In het tweede en het vierde kwadrant hebben sinus en cosinus een verschillend teken, dus is de tangens negatief. In het derde kwadrant zijn beide negatief, en is de tangens positief.
    - opgave: |-
        Bestaat $\tan 270^\circ$? Leg uit.
      antwoord: |-
        nee
      uitwerking: |-
        $\cos 270^\circ = 0$, en delen door 0 kan niet. De rechte $OP$ is verticaal en snijdt de raaklijn $x = 1$ niet.

    - opgave: |-
        Bereken $\cot 160^\circ$ en $\cot 250^\circ$ op vier decimalen, en $\cot 90^\circ$ exact. Bestaat $\cot 180^\circ$?
      antwoord: |-
        $-2{,}7475$; $0{,}3640$; $0$; nee
      uitwerking: |-
        $\cot 160^\circ = \tfrac{1}{\tan 160^\circ} \approx \tfrac{1}{-0{,}3640}$ en $\cot 250^\circ = \tfrac{1}{\tan 250^\circ} \approx \tfrac{1}{2{,}7475}$. $\cot 90^\circ = \tfrac{\cos 90^\circ}{\sin 90^\circ} = \tfrac01 = 0$. $\sin 180^\circ = 0$, en delen door 0 kan niet: $\cot 180^\circ$ bestaat niet.

- id: h1-teken
  soort: kort
  opgave: |-
    Bepaal het teken zonder rekenmachine.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin 170^\circ$
      antwoord: |-
        $+$
      uitwerking: |-
        Tweede kwadrant: boven de $x$-as.
    - opgave: |-
        $\cos 260^\circ$
      antwoord: |-
        $-$
      uitwerking: |-
        Derde kwadrant: links van de $y$-as.
    - opgave: |-
        $\tan 100^\circ$
      antwoord: |-
        $-$
      uitwerking: |-
        Tweede kwadrant: sinus positief, cosinus negatief.
    - opgave: |-
        $\sin 300^\circ$
      antwoord: |-
        $-$
      uitwerking: |-
        Vierde kwadrant: onder de $x$-as.
    - opgave: |-
        $\cos 330^\circ$
      antwoord: |-
        $+$
      uitwerking: |-
        Vierde kwadrant: rechts van de $y$-as.
    - opgave: |-
        $\tan 215^\circ$
      antwoord: |-
        $+$
      uitwerking: |-
        Derde kwadrant: sinus en cosinus negatief.

- id: h1-grond
  soort: kort
  opgave: |-
    Bereken de twee andere goniometrische getallen, zonder de hoek te berekenen.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin\alpha = 0{,}6$, en $\alpha$ ligt in het tweede kwadrant.
      antwoord: |-
        $\cos\alpha = -0{,}8$, $\tan\alpha = -0{,}75$
      uitwerking: |-
        $\cos^2\alpha = 1 - 0{,}36 = 0{,}64$. In het tweede kwadrant is de cosinus negatief: $\cos\alpha = -0{,}8$. Dan is $\tan\alpha = \tfrac{0{,}6}{-0{,}8} = -0{,}75$.
    - opgave: |-
        $\cos\alpha = 0{,}28$, en $\alpha$ ligt in het vierde kwadrant.
      antwoord: |-
        $\sin\alpha = -0{,}96$, $\tan\alpha = -\tfrac{24}{7} \approx -3{,}4286$
      uitwerking: |-
        $\sin^2\alpha = 1 - 0{,}0784 = 0{,}9216$. In het vierde kwadrant is de sinus negatief: $\sin\alpha = -0{,}96$. Dan is $\tan\alpha = \tfrac{-0{,}96}{0{,}28} = -\tfrac{24}{7}$.

- id: h1-suppl
  soort: kort
  opgave: |-
    Beantwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken exact: $\sin 135^\circ$, $\cos 150^\circ$ en $\tan 135^\circ$.
      antwoord: |-
        $\tfrac{\sqrt2}{2}$; $-\tfrac{\sqrt3}{2}$; $-1$
      uitwerking: |-
        $\sin 135^\circ = \sin 45^\circ$, $\cos 150^\circ = -\cos 30^\circ$ en $\tan 135^\circ = -\tan 45^\circ$.
    - opgave: |-
        Welke scherpe hoek heeft dezelfde sinus als $170^\circ$?
      antwoord: |-
        $10^\circ$
      uitwerking: |-
        $\sin 170^\circ = \sin(180^\circ - 10^\circ) = \sin 10^\circ$.

- id: h1-anti
  soort: kort
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin 210^\circ$
      antwoord: |-
        $-\tfrac12$
      uitwerking: |-
        $\sin(180^\circ + 30^\circ) = -\sin 30^\circ$.
    - opgave: |-
        $\cos 240^\circ$
      antwoord: |-
        $-\tfrac12$
      uitwerking: |-
        $\cos(180^\circ + 60^\circ) = -\cos 60^\circ$.
    - opgave: |-
        $\tan 210^\circ$
      antwoord: |-
        $\tfrac{\sqrt3}{3}$
      uitwerking: |-
        $\tan(180^\circ + 30^\circ) = \tan 30^\circ$.

- id: h1-tegen
  soort: kort
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\cos(-45^\circ)$
      antwoord: |-
        $\tfrac{\sqrt2}{2}$
      uitwerking: |-
        $\cos(-45^\circ) = \cos 45^\circ$.
    - opgave: |-
        $\sin 330^\circ$
      antwoord: |-
        $-\tfrac12$
      uitwerking: |-
        $\sin(360^\circ - 30^\circ) = -\sin 30^\circ$.
    - opgave: |-
        $\tan 315^\circ$
      antwoord: |-
        $-1$
      uitwerking: |-
        $\tan(360^\circ - 45^\circ) = -\tan 45^\circ$.

- id: h1-compl
  soort: kort
  opgave: |-
    Beantwoord zonder rekenmachine.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $\cos 80^\circ$ als een sinus en $\sin 65^\circ$ als een cosinus, telkens van een hoek kleiner dan $45^\circ$.
      antwoord: |-
        $\sin 10^\circ$; $\cos 25^\circ$
      uitwerking: |-
        $\cos 80^\circ = \sin(90^\circ - 80^\circ)$ en $\sin 65^\circ = \cos(90^\circ - 65^\circ)$.
    - opgave: |-
        Toon aan dat $\sin^2 20^\circ + \sin^2 70^\circ = 1$.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        $\sin 70^\circ = \cos 20^\circ$, dus $\sin^2 20^\circ + \sin^2 70^\circ = \sin^2 20^\circ + \cos^2 20^\circ = 1$.

- id: h1-negentig
  soort: kort
  pakketten: [5]
  opgave: |-
    Beantwoord met de hoeken die $90^\circ$ verschillen.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $\cos 100^\circ$ en $\sin 125^\circ$ met een goniometrisch getal van een scherpe hoek.
      antwoord: |-
        $-\sin 10^\circ$; $\cos 35^\circ$
      uitwerking: |-
        $\cos(90^\circ + 10^\circ) = -\sin 10^\circ$ en $\sin(90^\circ + 35^\circ) = \cos 35^\circ$.
    - opgave: |-
        Bereken exact $\sin 120^\circ$ met $120^\circ = 90^\circ + 30^\circ$. Vind je hetzelfde als met supplementaire hoeken?
      antwoord: |-
        $\tfrac{\sqrt3}{2}$, ja
      uitwerking: |-
        $\sin(90^\circ + 30^\circ) = \cos 30^\circ = \tfrac{\sqrt3}{2}$, dezelfde waarde als met supplementaire hoeken.

- id: h1-herleid
  soort: kort
  opgave: |-
    Bereken exact, door te herleiden naar het eerste kwadrant.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\sin 240^\circ$
      antwoord: |-
        $-\tfrac{\sqrt3}{2}$
      uitwerking: |-
        $240^\circ = 180^\circ + 60^\circ$, derde kwadrant.
    - opgave: |-
        $\cos 135^\circ$
      antwoord: |-
        $-\tfrac{\sqrt2}{2}$
      uitwerking: |-
        $135^\circ = 180^\circ - 45^\circ$, tweede kwadrant.
    - opgave: |-
        $\tan 330^\circ$
      antwoord: |-
        $-\tfrac{\sqrt3}{3}$
      uitwerking: |-
        $330^\circ = 360^\circ - 30^\circ$, vierde kwadrant.
    - opgave: |-
        $\sin 315^\circ$
      antwoord: |-
        $-\tfrac{\sqrt2}{2}$
      uitwerking: |-
        $315^\circ = 360^\circ - 45^\circ$, vierde kwadrant.
    - opgave: |-
        $\cos 300^\circ$
      antwoord: |-
        $\tfrac12$
      uitwerking: |-
        $300^\circ = 360^\circ - 60^\circ$, vierde kwadrant: cosinus positief.
    - opgave: |-
        $\tan 150^\circ$
      antwoord: |-
        $-\tfrac{\sqrt3}{3}$
      uitwerking: |-
        $150^\circ = 180^\circ - 30^\circ$, tweede kwadrant.
    - opgave: |-
        $\cos 225^\circ$
      antwoord: |-
        $-\tfrac{\sqrt2}{2}$
      uitwerking: |-
        $225^\circ = 180^\circ + 45^\circ$, derde kwadrant.
    - opgave: |-
        $\sin 180^\circ$
      antwoord: |-
        $0$
      uitwerking: |-
        Het punt $(-1, 0)$.

- id: h1-vereenvoudig
  soort: kort
  opgave: |-
    Vereenvoudig zo ver mogelijk.
  lijst: enumerate
  delen:
    - opgave: |-
        $\cos(180^\circ - \alpha) + \cos(180^\circ + \alpha) + 2\cos(-\alpha)$
      antwoord: |-
        $0$
      uitwerking: |-
        $-\cos\alpha - \cos\alpha + 2\cos\alpha = 0$.
    - opgave: |-
        $\sin(90^\circ - \alpha) \cdot \tan(180^\circ + \alpha)$
      antwoord: |-
        $\sin\alpha$
      uitwerking: |-
        $\cos\alpha \cdot \tan\alpha = \cos\alpha \cdot \dfrac{\sin\alpha}{\cos\alpha} = \sin\alpha$.
    - opgave: |-
        $\sin^2(180^\circ - \alpha) + \sin^2(90^\circ - \alpha)$
      antwoord: |-
        $1$
      uitwerking: |-
        $\sin^2\alpha + \cos^2\alpha = 1$, de grondformule.

- id: h1-hoek
  soort: kort
  opgave: |-
    Bereken alle hoeken $\alpha$ tussen $0^\circ$ en $360^\circ$, afgerond op $0{,}01^\circ$ als ze niet exact zijn.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin\alpha = 0{,}75$
      antwoord: |-
        $48{,}59^\circ$ en $131{,}41^\circ$
      uitwerking: |-
        $\sin^{-1} 0{,}75 \approx 48{,}59^\circ$ en $180^\circ - 48{,}59^\circ = 131{,}41^\circ$.
    - opgave: |-
        $\cos\alpha = 0{,}2$
      antwoord: |-
        $78{,}46^\circ$ en $281{,}54^\circ$
      uitwerking: |-
        $\cos^{-1} 0{,}2 \approx 78{,}46^\circ$ en $360^\circ - 78{,}46^\circ = 281{,}54^\circ$.
    - opgave: |-
        $\tan\alpha = 3$
      antwoord: |-
        $71{,}57^\circ$ en $251{,}57^\circ$
      uitwerking: |-
        $\tan^{-1} 3 \approx 71{,}57^\circ$, en een halve toer verder $251{,}57^\circ$.
    - opgave: |-
        $\sin\alpha = -0{,}5$
      antwoord: |-
        $210^\circ$ en $330^\circ$
      uitwerking: |-
        $\sin 30^\circ = \tfrac12$. Een negatieve sinus: derde en vierde kwadrant, $180^\circ + 30^\circ$ en $360^\circ - 30^\circ$.
    - opgave: |-
        $\cos\alpha = -1$
      antwoord: |-
        $180^\circ$
      uitwerking: |-
        Alleen het punt $(-1, 0)$ heeft $x$-coördinaat $-1$.
    - opgave: |-
        $\sin\alpha = 1{,}5$
      antwoord: |-
        geen
      uitwerking: |-
        Een sinus ligt altijd tussen $-1$ en $1$.

- id: h1-helling
  soort: kort
  opgave: |-
    Beantwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        Neem de rechten ${y = 3x - 1}$, ${y = -0{,}5x + 4}$ en ${y = -x + 2}$. Bereken hun hellingshoek, afgerond op $0{,}01^\circ$ als hij niet exact is.
      antwoord: |-
        $71{,}57^\circ$; $153{,}43^\circ$; $135^\circ$
      uitwerking: |-
        $\tan^{-1} 3 \approx 71{,}57^\circ$. $\tan^{-1}(-0{,}5) \approx -26{,}57^\circ$, plus $180^\circ$ geeft $153{,}43^\circ$. $\tan^{-1}(-1) = -45^\circ$, plus $180^\circ$ geeft $135^\circ$.
    - opgave: |-
        Geef exact de richtingscoëfficiënt van een rechte met hellingshoek $60^\circ$, en van een rechte met hellingshoek $150^\circ$.
      antwoord: |-
        $\sqrt3$; $-\tfrac{\sqrt3}{3}$
      uitwerking: |-
        $\tan 60^\circ = \sqrt3$ en $\tan 150^\circ = -\tan 30^\circ = -\tfrac{\sqrt3}{3}$ (supplementaire hoeken).
    - opgave: |-
        Welke hellingshoek heeft de $x$-as? En de $y$-as?
      antwoord: |-
        $0^\circ$; $90^\circ$
      uitwerking: |-
        De $x$-as is horizontaal, met rico 0 en $\tan 0^\circ = 0$. De $y$-as is verticaal: haar hellingshoek is $90^\circ$, en ze heeft geen rico, net zoals $\tan 90^\circ$ niet bestaat.

- id: h1-driehoek
  soort: kort
  opgave: |-
    Een hoek van een driehoek ligt tussen $0^\circ$ en $180^\circ$. Bereken de mogelijke waarden van de hoek, afgerond op $0{,}01^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        $\cos\alpha = -0{,}7$
      antwoord: |-
        $134{,}43^\circ$
      uitwerking: |-
        Bij de cosinus is er maar één hoek: $\cos^{-1}(-0{,}7) \approx 134{,}43^\circ$.
    - opgave: |-
        $\sin\alpha = 0{,}9$
      antwoord: |-
        $64{,}16^\circ$ of $115{,}84^\circ$
      uitwerking: |-
        $\sin^{-1} 0{,}9 \approx 64{,}16^\circ$, en het supplement $115{,}84^\circ$ heeft dezelfde sinus.
    - opgave: |-
        Een andere hoek van dezelfde driehoek is $120^\circ$, en $\sin\beta = 0{,}3$. Bereken $\beta$.
      antwoord: |-
        $17{,}46^\circ$
      uitwerking: |-
        $\sin^{-1} 0{,}3 \approx 17{,}46^\circ$ of $162{,}54^\circ$. Met de hoek van $120^\circ$ erbij kan alleen $17{,}46^\circ$.

# --- Opdrachten ------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    kwadrant en teken
  opgave: |-
    Geef het kwadrant van de hoek en het teken van zijn sinus, cosinus en tangens. Werk zonder rekenmachine.
  lijst: reeks
  kolommen: 5
  delen:
    - opgave: |-
        $115^\circ$
      antwoord: |-
        II: $+$, $-$, $-$
      uitwerking: |-
        Linksboven.
    - opgave: |-
        $205^\circ$
      antwoord: |-
        III: $-$, $-$, $+$
      uitwerking: |-
        Linksonder.
    - opgave: |-
        $290^\circ$
      antwoord: |-
        IV: $-$, $+$, $-$
      uitwerking: |-
        Rechtsonder.
    - opgave: |-
        $340^\circ$
      antwoord: |-
        IV: $-$, $+$, $-$
      uitwerking: |-
        Rechtsonder.
    - opgave: |-
        $-70^\circ$
      antwoord: |-
        IV: $-$, $+$, $-$
      uitwerking: |-
        $70^\circ$ in wijzerzin: rechtsonder, hetzelfde eindbeen als $290^\circ$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    goniometrische getallen met de rekenmachine
  opgave: |-
    Bereken met de rekenmachine, op vier decimalen.
  lijst: reeks
  kolommen: 5
  delen:
    - opgave: |-
        $\sin 95^\circ$
      antwoord: |-
        $0{,}9962$
      uitwerking: |-
        Tweede kwadrant, dicht bij $90^\circ$: bijna 1.
    - opgave: |-
        $\cos 95^\circ$
      antwoord: |-
        $-0{,}0872$
      uitwerking: |-
        Net links van de $y$-as.
    - opgave: |-
        $\tan 95^\circ$
      antwoord: |-
        $-11{,}4301$
      uitwerking: |-
        Een kleine negatieve cosinus in de noemer.
    - opgave: |-
        $\sin 182^\circ$
      antwoord: |-
        $-0{,}0349$
      uitwerking: |-
        Net onder de $x$-as.
    - opgave: |-
        $\cos 182^\circ$
      antwoord: |-
        $-0{,}9994$
      uitwerking: |-
        Bijna het punt $(-1, 0)$.
    - opgave: |-
        $\tan 265^\circ$
      antwoord: |-
        $11{,}4301$
      uitwerking: |-
        $265^\circ = 180^\circ + 85^\circ$, dus $\tan 265^\circ = \tan 85^\circ$.
    - opgave: |-
        $\cos 359^\circ$
      antwoord: |-
        $0{,}9998$
      uitwerking: |-
        Bijna het punt $(1, 0)$.
    - opgave: |-
        $\sin(-30^\circ)$
      antwoord: |-
        $-0{,}5000$
      uitwerking: |-
        $\sin(-30^\circ) = -\sin 30^\circ = -\tfrac12$.
    - opgave: |-
        $\cot 115^\circ$
      antwoord: |-
        $-0{,}4663$
      uitwerking: |-
        $\tfrac{1}{\tan 115^\circ}$: de rekenmachine heeft geen cotangens.
    - opgave: |-
        $\sin 500^\circ$
      antwoord: |-
        $0{,}6428$
      uitwerking: |-
        $500^\circ - 360^\circ = 140^\circ$: hetzelfde eindbeen, dus $\sin 500^\circ = \sin 140^\circ$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    exacte waarden
  opgave: |-
    Bereken exact, zonder rekenmachine.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\sin 150^\circ$
      antwoord: |-
        $\tfrac12$
      uitwerking: |-
        $\sin(180^\circ - 30^\circ) = \sin 30^\circ$.
    - opgave: |-
        $\cos 225^\circ$
      antwoord: |-
        $-\tfrac{\sqrt2}{2}$
      uitwerking: |-
        $\cos(180^\circ + 45^\circ) = -\cos 45^\circ$.
    - opgave: |-
        $\tan 240^\circ$
      antwoord: |-
        $\sqrt3$
      uitwerking: |-
        $\tan(180^\circ + 60^\circ) = \tan 60^\circ$.
    - opgave: |-
        $\sin 270^\circ$
      antwoord: |-
        $-1$
      uitwerking: |-
        Het punt $(0, -1)$.
    - opgave: |-
        $\cos 180^\circ$
      antwoord: |-
        $-1$
      uitwerking: |-
        Het punt $(-1, 0)$.
    - opgave: |-
        $\tan 135^\circ$
      antwoord: |-
        $-1$
      uitwerking: |-
        $\tan(180^\circ - 45^\circ) = -\tan 45^\circ$.
    - opgave: |-
        $\sin 330^\circ$
      antwoord: |-
        $-\tfrac12$
      uitwerking: |-
        $\sin(360^\circ - 30^\circ) = -\sin 30^\circ$.
    - opgave: |-
        $\cos 120^\circ$
      antwoord: |-
        $-\tfrac12$
      uitwerking: |-
        $\cos(180^\circ - 60^\circ) = -\cos 60^\circ$.
    - opgave: |-
        $\tan 210^\circ$
      antwoord: |-
        $\tfrac{\sqrt3}{3}$
      uitwerking: |-
        $\tan(180^\circ + 30^\circ) = \tan 30^\circ$.
    - opgave: |-
        $\sin(-45^\circ)$
      antwoord: |-
        $-\tfrac{\sqrt2}{2}$
      uitwerking: |-
        $\sin(-45^\circ) = -\sin 45^\circ$.
    - opgave: |-
        $\cos(-150^\circ)$
      antwoord: |-
        $-\tfrac{\sqrt3}{2}$
      uitwerking: |-
        $\cos(-150^\circ) = \cos 150^\circ = -\cos 30^\circ$.
    - opgave: |-
        $\tan 300^\circ$
      antwoord: |-
        $-\sqrt3$
      uitwerking: |-
        $\tan(360^\circ - 60^\circ) = -\tan 60^\circ$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    herleiden naar een scherpe hoek
  opgave: |-
    Schrijf als een goniometrisch getal van een scherpe hoek, met het juiste teken. Voorbeeld: $\cos 170^\circ = -\cos 10^\circ$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin 160^\circ$
      antwoord: |-
        $\sin 20^\circ$
      uitwerking: |-
        Supplementair.
    - opgave: |-
        $\cos 250^\circ$
      antwoord: |-
        $-\cos 70^\circ$
      uitwerking: |-
        $250^\circ = 180^\circ + 70^\circ$.
    - opgave: |-
        $\tan 310^\circ$
      antwoord: |-
        $-\tan 50^\circ$
      uitwerking: |-
        $310^\circ = 360^\circ - 50^\circ$.
    - opgave: |-
        $\cos 100^\circ$
      antwoord: |-
        $-\cos 80^\circ$
      uitwerking: |-
        $100^\circ = 180^\circ - 80^\circ$. (Ook goed: $-\sin 10^\circ$.)
    - opgave: |-
        $\sin 200^\circ$
      antwoord: |-
        $-\sin 20^\circ$
      uitwerking: |-
        $200^\circ = 180^\circ + 20^\circ$.
    - opgave: |-
        $\tan 170^\circ$
      antwoord: |-
        $-\tan 10^\circ$
      uitwerking: |-
        $170^\circ = 180^\circ - 10^\circ$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    coördinaten op de goniometrische cirkel
  opgave: |-
    Geef de exacte coördinaten van het punt van de goniometrische cirkel bij de hoek.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $135^\circ$
      antwoord: |-
        $\bigl(-\tfrac{\sqrt2}{2}, \tfrac{\sqrt2}{2}\bigr)$
      uitwerking: |-
        $(\cos 135^\circ, \sin 135^\circ)$.
    - opgave: |-
        $240^\circ$
      antwoord: |-
        $\bigl(-\tfrac12, -\tfrac{\sqrt3}{2}\bigr)$
      uitwerking: |-
        $(\cos 240^\circ, \sin 240^\circ)$.
    - opgave: |-
        $270^\circ$
      antwoord: |-
        $(0, -1)$
      uitwerking: |-
        Onderaan de cirkel.
    - opgave: |-
        $330^\circ$
      antwoord: |-
        $\bigl(\tfrac{\sqrt3}{2}, -\tfrac12\bigr)$
      uitwerking: |-
        $(\cos 330^\circ, \sin 330^\circ)$.
    - opgave: |-
        $180^\circ$
      antwoord: |-
        $(-1, 0)$
      uitwerking: |-
        Links op de cirkel.
    - opgave: |-
        $-60^\circ$
      antwoord: |-
        $\bigl(\tfrac12, -\tfrac{\sqrt3}{2}\bigr)$
      uitwerking: |-
        $\cos(-60^\circ) = \cos 60^\circ$ en $\sin(-60^\circ) = -\sin 60^\circ$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    grondformule en kwadrant
  opgave: |-
    Bereken de twee andere goniometrische getallen exact, zonder de hoek te berekenen.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin\alpha = -0{,}8$, met $\alpha$ in het derde kwadrant
      antwoord: |-
        $\cos\alpha = -0{,}6$, $\tan\alpha = \tfrac43$
      uitwerking: |-
        $\cos^2\alpha = 1 - 0{,}64 = 0{,}36$, en in het derde kwadrant is de cosinus negatief. $\tan\alpha = \tfrac{-0{,}8}{-0{,}6} = \tfrac43$.
    - opgave: |-
        $\cos\alpha = \tfrac{12}{13}$, met $\alpha$ in het vierde kwadrant
      antwoord: |-
        $\sin\alpha = -\tfrac{5}{13}$, $\tan\alpha = -\tfrac{5}{12}$
      uitwerking: |-
        $\sin^2\alpha = 1 - \tfrac{144}{169} = \tfrac{25}{169}$, en in het vierde kwadrant is de sinus negatief.
    - opgave: |-
        $\sin\alpha = \tfrac13$, met $\alpha$ in het tweede kwadrant
      antwoord: |-
        $\cos\alpha = -\tfrac{2\sqrt2}{3}$, $\tan\alpha = -\tfrac{\sqrt2}{4}$
      uitwerking: |-
        $\cos^2\alpha = 1 - \tfrac19 = \tfrac89$, dus $\cos\alpha = -\tfrac{\sqrt8}{3} = -\tfrac{2\sqrt2}{3}$. Dan is $\tan\alpha = \tfrac13 \cdot \bigl(-\tfrac{3}{2\sqrt2}\bigr) = -\tfrac{1}{2\sqrt2} = -\tfrac{\sqrt2}{4}$.
    - opgave: |-
        $\cos\alpha = -0{,}6$, met $\alpha$ in het tweede kwadrant
      antwoord: |-
        $\sin\alpha = 0{,}8$, $\tan\alpha = -\tfrac43$
      uitwerking: |-
        $\sin^2\alpha = 1 - 0{,}36 = 0{,}64$, en in het tweede kwadrant is de sinus positief.

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    alle hoeken met een gegeven goniometrisch getal
  opgave: |-
    Bereken alle hoeken $\alpha$ tussen $0^\circ$ en $360^\circ$. Rond af op $0{,}01^\circ$ als de hoek niet exact is. Maak telkens een schets.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin\alpha = 0{,}3$
      antwoord: |-
        $17{,}46^\circ$ en $162{,}54^\circ$
      uitwerking: |-
        $\sin^{-1} 0{,}3 \approx 17{,}46^\circ$; het supplement is $162{,}54^\circ$.
    - opgave: |-
        $\cos\alpha = -0{,}75$
      antwoord: |-
        $138{,}59^\circ$ en $221{,}41^\circ$
      uitwerking: |-
        $\cos^{-1}(-0{,}75) \approx 138{,}59^\circ$ en $360^\circ - 138{,}59^\circ = 221{,}41^\circ$.
    - opgave: |-
        $\tan\alpha = 0{,}5$
      antwoord: |-
        $26{,}57^\circ$ en $206{,}57^\circ$
      uitwerking: |-
        $\tan^{-1} 0{,}5 \approx 26{,}57^\circ$, en een halve toer verder.
    - opgave: |-
        $\sin\alpha = -0{,}9$
      antwoord: |-
        $244{,}16^\circ$ en $295{,}84^\circ$
      uitwerking: |-
        De rekenmachine geeft $-64{,}16^\circ$, dus $360^\circ - 64{,}16^\circ = 295{,}84^\circ$. Het supplement van $-64{,}16^\circ$ is $180^\circ + 64{,}16^\circ = 244{,}16^\circ$.
    - opgave: |-
        $\cos\alpha = \tfrac12$
      antwoord: |-
        $60^\circ$ en $300^\circ$
      uitwerking: |-
        $\cos 60^\circ = \tfrac12$, en $360^\circ - 60^\circ = 300^\circ$.
    - opgave: |-
        $\tan\alpha = -1$
      antwoord: |-
        $135^\circ$ en $315^\circ$
      uitwerking: |-
        $\tan 45^\circ = 1$; een negatieve tangens in het tweede en het vierde kwadrant: $180^\circ - 45^\circ$ en $360^\circ - 45^\circ$.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    waar of niet waar
  opgave: |-
    Waar of niet waar? Leg uit zonder rekenmachine.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin 100^\circ = \sin 80^\circ$
      antwoord: |-
        waar
      uitwerking: |-
        $100^\circ$ en $80^\circ$ zijn supplementair.
    - opgave: |-
        $\cos 100^\circ = \cos 80^\circ$
      antwoord: |-
        niet waar
      uitwerking: |-
        $\cos 100^\circ = -\cos 80^\circ$, en $\cos 80^\circ \neq 0$.
    - opgave: |-
        $\tan 200^\circ = \tan 20^\circ$
      antwoord: |-
        waar
      uitwerking: |-
        Antisupplementaire hoeken hebben dezelfde tangens.
    - opgave: |-
        Er is een hoek met $\sin\alpha = 0{,}6$ en $\cos\alpha = 0{,}7$.
      antwoord: |-
        niet waar
      uitwerking: |-
        $0{,}36 + 0{,}49 = 0{,}85 \neq 1$: de grondformule klopt niet.
    - opgave: |-
        De sinus en de cosinus van een hoek kunnen allebei negatief zijn.
      antwoord: |-
        waar
      uitwerking: |-
        In het derde kwadrant, bijvoorbeeld bij $200^\circ$.
    - opgave: |-
        Hoe groter de hoek, hoe groter de sinus.
      antwoord: |-
        niet waar
      uitwerking: |-
        $\sin 150^\circ = \tfrac12 < \sin 90^\circ = 1$. Na $90^\circ$ daalt het punt weer.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    vereenvoudigen met verwante hoeken
  opgave: |-
    Vereenvoudig zo ver mogelijk.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin(180^\circ - \alpha) + \sin(180^\circ + \alpha)$
      antwoord: |-
        $0$
      uitwerking: |-
        $\sin\alpha + (-\sin\alpha) = 0$.
    - opgave: |-
        $\cos(180^\circ - \alpha) + \cos(-\alpha)$
      antwoord: |-
        $0$
      uitwerking: |-
        $-\cos\alpha + \cos\alpha = 0$.
    - opgave: |-
        $\cos(360^\circ - \alpha) - \cos(180^\circ + \alpha)$
      antwoord: |-
        $2\cos\alpha$
      uitwerking: |-
        $\cos\alpha - (-\cos\alpha) = 2\cos\alpha$.
    - opgave: |-
        $\tan(180^\circ + \alpha) \cdot \tan(90^\circ - \alpha)$
      antwoord: |-
        $1$
      uitwerking: |-
        $\tan\alpha \cdot \tfrac{1}{\tan\alpha} = 1$.
    - opgave: |-
        $\sin(90^\circ - \alpha) \cdot \cos(-\alpha) + \cos(90^\circ - \alpha) \cdot \sin(180^\circ - \alpha)$
      antwoord: |-
        $1$
      uitwerking: |-
        $\cos\alpha \cdot \cos\alpha + \sin\alpha \cdot \sin\alpha = \cos^2\alpha + \sin^2\alpha = 1$.

    - opgave: |-
        $\cos^2(-\alpha) \cdot \bigl(1 + \tan^2(180^\circ + \alpha)\bigr)$
      antwoord: |-
        $1$
      uitwerking: |-
        $\cos^2\alpha \cdot (1 + \tan^2\alpha) = \cos^2\alpha + \cos^2\alpha \cdot \dfrac{\sin^2\alpha}{\cos^2\alpha} = \cos^2\alpha + \sin^2\alpha = 1$.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    reuzenrad
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=.06,font=\scriptsize]
        \draw[lijngrijs] (-26,0) -- (26,0);
        \draw[grijs] (0,22) circle (20);
        \draw[grijs] (-8,0) -- (0,22) -- (8,0);
        \draw[grijs,dashed] (0,22) -- (24,22);
        \draw[accent,thick] (0,22) -- ({20*cos(115)},{22+20*sin(115)});
        \fill[accent] ({20*cos(115)},{22+20*sin(115)}) circle (25pt);
        \draw[->,accent] (6,22) arc[start angle=0,end angle=115,radius=6];
        \node[accent] at (7,30) {$\alpha$};
        \node[right] at (2,11) {22 m};
      \end{tikzpicture}
  opgave: |-
    Een reuzenrad heeft een straal van 20~m, en zijn as staat 22~m boven de grond. De plaats van een cabine geven we met de hoek $\alpha$ tussen de horizontale naar rechts en de spaak naar de cabine, in tegenwijzerzin. Rond af op een centimeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe hoog is de cabine bij $\alpha = 115^\circ$?
      antwoord: |-
        $40{,}13$~m
      uitwerking: |-
        $22 + 20 \sin 115^\circ \approx 40{,}13$.
    - opgave: |-
        Hoe hoog is ze bij $\alpha = 230^\circ$, en bij $\alpha = 310^\circ$? Verklaar wat je ziet.
      antwoord: |-
        telkens $6{,}68$~m
      uitwerking: |-
        $22 + 20 \sin 230^\circ \approx 6{,}68$ en $22 + 20 \sin 310^\circ \approx 6{,}68$. De hoeken $230^\circ$ en $310^\circ$ zijn supplementair (op een volle toer na: $230^\circ = 180^\circ + 50^\circ$ en $310^\circ = 360^\circ - 50^\circ$), dus hebben ze dezelfde sinus: de cabines liggen symmetrisch om de verticale door de as.
    - opgave: |-
        Bij welke hoeken is de cabine 32~m hoog?
      antwoord: |-
        $30^\circ$ en $150^\circ$
      uitwerking: |-
        $22 + 20\sin\alpha = 32$ geeft $\sin\alpha = \tfrac12$, dus $\alpha = 30^\circ$ of $\alpha = 150^\circ$.
    - opgave: |-
        Hoe ver ligt de cabine bij $\alpha = 115^\circ$ horizontaal van de as?
      antwoord: |-
        $8{,}45$~m (links)
      uitwerking: |-
        $20 \cos 115^\circ \approx -8{,}45$: 8,45~m links van de as.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    exact rekenen
  opgave: |-
    Bereken exact, zonder rekenmachine.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin^2 120^\circ + \cos^2 120^\circ$
      antwoord: |-
        $1$
      uitwerking: |-
        $\tfrac34 + \tfrac14 = 1$, zoals de grondformule zegt.
    - opgave: |-
        $2 \sin 150^\circ \cos 150^\circ$
      antwoord: |-
        $-\tfrac{\sqrt3}{2}$
      uitwerking: |-
        $2 \cdot \tfrac12 \cdot \bigl(-\tfrac{\sqrt3}{2}\bigr) = -\tfrac{\sqrt3}{2}$.
    - opgave: |-
        $\sin 210^\circ + \cos 300^\circ$
      antwoord: |-
        $0$
      uitwerking: |-
        $-\tfrac12 + \tfrac12 = 0$.
    - opgave: |-
        $\tan 135^\circ \cdot \tan 315^\circ$
      antwoord: |-
        $1$
      uitwerking: |-
        $(-1) \cdot (-1) = 1$.
    - opgave: |-
        $\cos^2 225^\circ - \sin^2 225^\circ$
      antwoord: |-
        $0$
      uitwerking: |-
        $\tfrac12 - \tfrac12 = 0$.
    - opgave: |-
        $\sin 240^\circ \cdot \cos 330^\circ$
      antwoord: |-
        $-\tfrac34$
      uitwerking: |-
        $-\tfrac{\sqrt3}{2} \cdot \tfrac{\sqrt3}{2} = -\tfrac34$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    van punt naar hoek
  opgave: |-
    Gegeven is het punt $P(-0{,}6;\ 0{,}8)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $P$ op de goniometrische cirkel ligt.
      antwoord: |-
        $0{,}36 + 0{,}64 = 1$
      uitwerking: |-
        $\lengte{OP}^2 = (-0{,}6)^2 + 0{,}8^2 = 1$, dus $\lengte{OP} = 1$.
    - opgave: |-
        $P$ hoort bij een hoek $\alpha$ tussen $0^\circ$ en $360^\circ$. Geef $\sin\alpha$, $\cos\alpha$ en $\tan\alpha$, en bereken $\alpha$ op $0{,}01^\circ$.
      antwoord: |-
        $0{,}8$; $-0{,}6$; $-\tfrac43$; $\alpha \approx 126{,}87^\circ$
      uitwerking: |-
        $\cos\alpha = -0{,}6$ en $\sin\alpha = 0{,}8$: tweede kwadrant. $\cos^{-1}(-0{,}6) \approx 126{,}87^\circ$.
    - opgave: |-
        Geef de coördinaten van de punten bij $180^\circ + \alpha$ en bij $-\alpha$, en de hoeken tussen $0^\circ$ en $360^\circ$ die erbij horen.
      antwoord: |-
        $306{,}87^\circ$ en $233{,}13^\circ$
      uitwerking: |-
        Spiegelen om $O$ geeft $(0{,}6;\ {-0{,}8})$, bij $126{,}87^\circ + 180^\circ = 306{,}87^\circ$. Spiegelen om de $x$-as geeft $(-0{,}6;\ {-0{,}8})$, bij $360^\circ - 126{,}87^\circ = 233{,}13^\circ$.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten
  opgave: |-
    Toon met een tegenvoorbeeld aan dat de formule niet voor elke hoek klopt. Gebruik exacte waarden.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin 2\alpha = 2\sin\alpha$
      antwoord: |-
        bijvoorbeeld $\alpha = 30^\circ$
      uitwerking: |-
        $\sin 60^\circ = \tfrac{\sqrt3}{2}$, maar $2\sin 30^\circ = 1$.
    - opgave: |-
        $\sin(\alpha + \beta) = \sin\alpha + \sin\beta$
      antwoord: |-
        bijvoorbeeld $\alpha = \beta = 90^\circ$
      uitwerking: |-
        $\sin 180^\circ = 0$, maar $\sin 90^\circ + \sin 90^\circ = 2$.
    - opgave: |-
        $\cos(180^\circ - \alpha) = \cos 180^\circ - \cos\alpha$
      antwoord: |-
        bijvoorbeeld $\alpha = 60^\circ$
      uitwerking: |-
        $\cos 120^\circ = -\tfrac12$, maar $\cos 180^\circ - \cos 60^\circ = -1 - \tfrac12 = -\tfrac32$. Een cosinus is geen product: je mag de haakjes niet uitwerken.
    - opgave: |-
        Geef voor de formule uit a toch een hoek waarvoor ze wel klopt.
      antwoord: |-
        bijvoorbeeld $\alpha = 0^\circ$ of $\alpha = 180^\circ$
      uitwerking: |-
        $\sin 0^\circ = 0 = 2\sin 0^\circ$, en $\sin 360^\circ = 0 = 2\sin 180^\circ$. Dat een formule voor enkele hoeken klopt, bewijst dus niets.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    de wijzer van een klok
  opgave: |-
    De grote wijzer van een klok is 12~cm lang. Neem de oorsprong in het midden van de klok, de $x$-as naar rechts (naar de 3) en de $y$-as naar boven (naar de 12). Rond af op een millimeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke hoek maakt de wijzer met de positieve $x$-as om 14.00~uur? Over hoeveel graden draait hij per minuut, en in welke zin?
      antwoord: |-
        $90^\circ$; $6^\circ$ per minuut, in wijzerzin
      uitwerking: |-
        Om 14.00~uur wijst hij naar de 12. Een volle toer van $360^\circ$ duurt 60 minuten, dus $6^\circ$ per minuut, en een klok draait in wijzerzin.
    - opgave: |-
        Waar is de punt van de wijzer om 14.10~uur, om 14.25~uur en om 14.50~uur?
      antwoord: |-
        $(10{,}4;\ 6)$, $(6;\ {-10{,}4})$, $(-10{,}4;\ 6)$
      uitwerking: |-
        De hoeken zijn $90^\circ - 60^\circ = 30^\circ$, $90^\circ - 150^\circ = -60^\circ$ en $90^\circ - 300^\circ = -210^\circ$ (hetzelfde eindbeen als $150^\circ$). Dus $(12\cos 30^\circ, 12\sin 30^\circ) \approx (10{,}4;\ 6)$, $(12\cos(-60^\circ), 12\sin(-60^\circ)) \approx (6;\ {-10{,}4})$ en $(12\cos 150^\circ, 12\sin 150^\circ) \approx (-10{,}4;\ 6)$.
    - opgave: |-
        Op welke momenten tussen 14.00 en 15.00~uur is de punt 6~cm lager dan het midden?
      antwoord: |-
        om 14.20 en om 14.40~uur
      uitwerking: |-
        $12\sin\alpha = -6$ geeft $\sin\alpha = -\tfrac12$, dus $\alpha = -30^\circ$ of $\alpha = -150^\circ$ (of $330^\circ$ en $210^\circ$). Van $90^\circ$ naar $-30^\circ$ is $120^\circ$, of 20 minuten; naar $-150^\circ$ is $240^\circ$, of 40 minuten.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    hoeken in een driehoek
  opgave: |-
    Bereken de gevraagde hoeken, afgerond op $0{,}01^\circ$. Denk eraan dat een hoek van een driehoek tussen $0^\circ$ en $180^\circ$ ligt, en dat de hoeken samen $180^\circ$ zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        In driehoek $ABC$ is $\cos\hoek{A} = -0{,}4$. Bereken $\hoek{A}$.
      antwoord: |-
        $113{,}58^\circ$
      uitwerking: |-
        $\cos^{-1}(-0{,}4) \approx 113{,}58^\circ$: de enige mogelijkheid.
    - opgave: |-
        In dezelfde driehoek is $\sin\hoek{B} = 0{,}5$. Bereken $\hoek{B}$ en $\hoek{C}$.
      antwoord: |-
        $\hoek{B} = 30^\circ$, $\hoek{C} \approx 36{,}42^\circ$
      uitwerking: |-
        $\hoek{B} = 30^\circ$ of $150^\circ$, maar $150^\circ$ kan niet naast een stompe hoek $\hoek{A}$. Dan is $\hoek{C} = 180^\circ - 113{,}58^\circ - 30^\circ = 36{,}42^\circ$.
    - opgave: |-
        In driehoek $PQR$ is $\hoek{Q} = 30^\circ$ en $\sin\hoek{P} = 0{,}95$. Welke waarden zijn mogelijk voor $\hoek{P}$ en $\hoek{R}$?
      antwoord: |-
        $\hoek{P} \approx 71{,}81^\circ$ en $\hoek{R} \approx 78{,}19^\circ$, of $\hoek{P} \approx 108{,}19^\circ$ en $\hoek{R} \approx 41{,}81^\circ$
      uitwerking: |-
        $\sin^{-1} 0{,}95 \approx 71{,}81^\circ$, en het supplement is $108{,}19^\circ$. Met $30^\circ$ erbij blijven beide onder $180^\circ$, dus beide kunnen.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    een ontbrekende coördinaat
  opgave: |-
    Het punt $P$ ligt op de goniometrische cirkel. Bereken de ontbrekende coördinaat en de hoek tussen $0^\circ$ en $360^\circ$ waarbij $P$ hoort. Rond af op $0{,}01^\circ$ als het niet exact kan.
  lijst: enumerate
  delen:
    - opgave: |-
        $P(x;\ {-0{,}28})$ in het derde kwadrant
      antwoord: |-
        $x = -0{,}96$; $196{,}26^\circ$
      uitwerking: |-
        $x^2 = 1 - 0{,}0784 = 0{,}9216$, en in het derde kwadrant is $x < 0$. Met $\sin^{-1} 0{,}28 \approx 16{,}26^\circ$ is de hoek $180^\circ + 16{,}26^\circ = 196{,}26^\circ$.
    - opgave: |-
        $P\bigl(\tfrac12, y\bigr)$ in het vierde kwadrant
      antwoord: |-
        $y = -\tfrac{\sqrt3}{2}$; $300^\circ$
      uitwerking: |-
        $y^2 = 1 - \tfrac14 = \tfrac34$, en in het vierde kwadrant is $y < 0$. $\cos\alpha = \tfrac12$ in het vierde kwadrant geeft $360^\circ - 60^\circ = 300^\circ$.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    tangens dicht bij 90 graden
  opgave: |-
    Onderzoek wat er met de tangens gebeurt rond $90^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken op twee decimalen: $\tan 89^\circ$, $\tan 89{,}9^\circ$, $\tan 90{,}1^\circ$ en $\tan 91^\circ$.
      antwoord: |-
        $57{,}29$; $572{,}96$; $-572{,}96$; $-57{,}29$
      uitwerking: |-
        Rekenmachine in graden.
    - opgave: |-
        Verklaar met de raaklijn $x = 1$ waarom de tangens zo groot wordt, en waarom het teken wisselt.
      antwoord: |-
        $OP$ wordt bijna verticaal
      uitwerking: |-
        Net onder $90^\circ$ is $OP$ bijna verticaal en stijgend: ze snijdt de raaklijn $x = 1$ heel hoog. Net boven $90^\circ$ ligt $P$ in het tweede kwadrant; het verlengde van $OP$ snijdt de raaklijn dan heel laag. Bij $90^\circ$ zelf is $OP$ evenwijdig met de raaklijn, en bestaat de tangens niet.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    ruitenwisser
  opgave: |-
    De punt van een ruitenwisser ligt 50~cm van zijn as. De wisser draait heen en weer tussen $10^\circ$ en $170^\circ$, gemeten vanaf de horizontale naar rechts. Neem de oorsprong in de as. Rond af op een millimeter of op $0{,}01^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar ligt de punt in de twee uiterste standen?
      antwoord: |-
        $(49{,}2;\ 8{,}7)$ en $(-49{,}2;\ 8{,}7)$
      uitwerking: |-
        $(50\cos 10^\circ, 50\sin 10^\circ)$ en $(50\cos 170^\circ, 50\sin 170^\circ)$. De hoeken zijn supplementair: dezelfde hoogte, tegengestelde $x$.
    - opgave: |-
        Hoe breed is de strook die de punt bestrijkt, van links naar rechts?
      antwoord: |-
        $98{,}5$~cm
      uitwerking: |-
        $2 \cdot 50 \cos 10^\circ \approx 98{,}5$.
    - opgave: |-
        Bij welke standen is de punt 40~cm boven de as?
      antwoord: |-
        $53{,}13^\circ$ en $126{,}87^\circ$
      uitwerking: |-
        $50\sin\alpha = 40$ geeft $\sin\alpha = 0{,}8$, dus $\alpha \approx 53{,}13^\circ$ of $\alpha \approx 126{,}87^\circ$. Beide liggen tussen $10^\circ$ en $170^\circ$.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijken met een schets
  opgave: |-
    Zet in stijgende volgorde, zonder rekenmachine. Maak een schets van de goniometrische cirkel.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin 20^\circ$, $\sin 100^\circ$, $\sin 170^\circ$, $\sin 260^\circ$
      antwoord: |-
        $\sin 260^\circ < \sin 170^\circ < \sin 20^\circ < \sin 100^\circ$
      uitwerking: |-
        $\sin 260^\circ$ is negatief. Verder is $\sin 170^\circ = \sin 10^\circ$ en $\sin 100^\circ = \sin 80^\circ$; tussen $0^\circ$ en $90^\circ$ stijgt de sinus.
    - opgave: |-
        $\cos 10^\circ$, $\cos 100^\circ$, $\cos 200^\circ$, $\cos 300^\circ$
      antwoord: |-
        $\cos 200^\circ < \cos 100^\circ < \cos 300^\circ < \cos 10^\circ$
      uitwerking: |-
        $\cos 200^\circ = -\cos 20^\circ$ ligt dicht bij $-1$, $\cos 100^\circ = -\cos 80^\circ$ net onder 0, $\cos 300^\circ = \tfrac12$ en $\cos 10^\circ$ bijna 1.

- id: h1-o24
  soort: opdracht
  niveau: 2
  thema: |-
    hellingshoek en richtingscoëfficiënt
  opgave: |-
    Gegeven zijn de rechten $a\colon y = 2x - 1$ en $b\colon y = -x + 5$. Rond af op $0{,}01^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de hellingshoek van elke rechte.
      antwoord: |-
        $63{,}43^\circ$ en $135^\circ$
      uitwerking: |-
        $\tan^{-1} 2 \approx 63{,}43^\circ$. Voor $b$ is $\tan^{-1}(-1) = -45^\circ$, plus $180^\circ$ geeft $135^\circ$.
    - opgave: |-
        Bereken de scherpe hoek tussen de twee rechten. Maak een schets.
      antwoord: |-
        $71{,}57^\circ$
      uitwerking: |-
        In het snijpunt maken de rechten de hoek $135^\circ - 63{,}43^\circ \approx 71{,}57^\circ$, het verschil van de hellingshoeken. Die hoek is scherp; de andere hoek tussen de rechten is $108{,}43^\circ$.
    - opgave: |-
        Een rechte $c$ door $(0, 1)$ heeft hellingshoek $150^\circ$. Geef exact haar vergelijking.
      antwoord: |-
        $y = -\tfrac{\sqrt3}{3}\,x + 1$
      uitwerking: |-
        De rico is $\tan 150^\circ = -\tan 30^\circ = -\tfrac{\sqrt3}{3}$, en de rechte snijdt de $y$-as in 1.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    sinus gelijk aan cosinus
  opgave: |-
    Zoek alle hoeken $\alpha$ tussen $0^\circ$ en $360^\circ$ waarvoor de gelijkheid geldt. Verklaar met de goniometrische cirkel.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin\alpha = \cos\alpha$
      antwoord: |-
        $45^\circ$ en $225^\circ$
      uitwerking: |-
        Het punt $P$ heeft gelijke coördinaten: het ligt op de rechte $y = x$. Die snijdt de cirkel bij $45^\circ$ en bij $180^\circ + 45^\circ = 225^\circ$.
    - opgave: |-
        $\sin\alpha = -\cos\alpha$
      antwoord: |-
        $135^\circ$ en $315^\circ$
      uitwerking: |-
        Het punt ligt op de rechte $y = -x$, bij $135^\circ$ en $315^\circ$.
    - opgave: |-
        $\tan\alpha = 1$. Waarom vind je dezelfde hoeken als in a?
      antwoord: |-
        $45^\circ$ en $225^\circ$
      uitwerking: |-
        $\tan\alpha = 1$ betekent $\tfrac{\sin\alpha}{\cos\alpha} = 1$, of $\sin\alpha = \cos\alpha$ (met $\cos\alpha \neq 0$, wat hier vanzelf klopt).

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    regelmatige achthoek
  opgave: |-
    De hoekpunten van een regelmatige achthoek liggen op de goniometrische cirkel. Eén hoekpunt is $(1, 0)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bij welke hoeken liggen de acht hoekpunten? Geef hun exacte coördinaten.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        De hoekpunten liggen telkens $360^\circ : 8 = 45^\circ$ verder: $(1, 0)$, $\bigl(\tfrac{\sqrt2}{2}, \tfrac{\sqrt2}{2}\bigr)$, $(0, 1)$, $\bigl(-\tfrac{\sqrt2}{2}, \tfrac{\sqrt2}{2}\bigr)$, $(-1, 0)$, $\bigl(-\tfrac{\sqrt2}{2}, -\tfrac{\sqrt2}{2}\bigr)$, $(0, -1)$ en $\bigl(\tfrac{\sqrt2}{2}, -\tfrac{\sqrt2}{2}\bigr)$.
    - opgave: |-
        Bereken exact de lengte van een zijde, en de omtrek op vier decimalen.
      antwoord: |-
        $\sqrt{2 - \sqrt2}$; $6{,}1229$
      uitwerking: |-
        Tussen $(1, 0)$ en $\bigl(\tfrac{\sqrt2}{2}, \tfrac{\sqrt2}{2}\bigr)$: $\bigl(1 - \tfrac{\sqrt2}{2}\bigr)^2 + \tfrac12 = 1 - \sqrt2 + \tfrac12 + \tfrac12 = 2 - \sqrt2$. De zijde is $\sqrt{2 - \sqrt2} \approx 0{,}7654$, de omtrek $8\sqrt{2 - \sqrt2} \approx 6{,}1229$.
    - opgave: |-
        Vergelijk de omtrek met de omtrek van de cirkel. Klopt dat met wat je verwacht?
      antwoord: |-
        iets kleiner dan $2\pi \approx 6{,}2832$
      uitwerking: |-
        De achthoek ligt binnen de cirkel, en elke zijde is korter dan de boog erboven. Met meer hoekpunten komt de omtrek steeds dichter bij $2\pi$.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    drie wieken
  opgave: |-
    De windturbine uit het probleem heeft drie wieken van 50~m, met telkens $120^\circ$ ertussen. De as staat 80~m hoog. Staat de eerste wiek bij de hoek $\alpha$, dan staan de andere bij $\alpha + 120^\circ$ en $\alpha + 240^\circ$. Rond af op een centimeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de hoogte van de drie punten voor $\alpha = 30^\circ$ en voor $\alpha = 50^\circ$.
      antwoord: |-
        $105$, $105$, $30$; $118{,}30$, $88{,}68$, $33{,}02$ (m)
      uitwerking: |-
        $80 + 50\sin\alpha$, $80 + 50\sin(\alpha + 120^\circ)$ en $80 + 50\sin(\alpha + 240^\circ)$. Bij $30^\circ$: $80 + 25$, $80 + 50\sin 150^\circ = 105$ en $80 + 50\sin 270^\circ = 30$.
    - opgave: |-
        Bereken telkens het gemiddelde van de drie hoogtes. Wat valt je op?
      antwoord: |-
        telkens 80~m
      uitwerking: |-
        $\tfrac{105 + 105 + 30}{3} = 80$ en $\tfrac{118{,}30 + 88{,}68 + 33{,}02}{3} = 80$: de hoogte van de as.
    - opgave: |-
        Verklaar dat met de figuur. (Tip: de drie punten vormen een gelijkzijdige driehoek, met de as in het midden.)
      antwoord: |-
        $\sin\alpha + \sin(\alpha + 120^\circ) + \sin(\alpha + 240^\circ) = 0$
      uitwerking: |-
        De drie punten vormen een gelijkzijdige driehoek met middelpunt in de as. Het zwaartepunt van een driehoek heeft als $y$-coördinaat het gemiddelde van de $y$-coördinaten van de hoekpunten, en bij een gelijkzijdige driehoek valt het zwaartepunt samen met het middelpunt. Het gemiddelde is dus altijd de hoogte van de as, en de som van de drie sinussen is 0.

- id: h1-o23
  soort: opdracht
  niveau: 3
  pakketten: [5]
  thema: |-
    identiteiten met verwante hoeken bewijzen
  opgave: |-
    Bewijs voor elke hoek $\alpha$ (waarvoor beide leden bestaan).
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin(180^\circ - \alpha) + \cos(90^\circ + \alpha) = 0$
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        $\sin(180^\circ - \alpha) = \sin\alpha$ en $\cos(90^\circ + \alpha) = -\sin\alpha$. De som is 0.
    - opgave: |-
        $\tan(90^\circ + \alpha) = -\dfrac{1}{\tan\alpha}$
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        $\tan(90^\circ + \alpha) = \dfrac{\sin(90^\circ + \alpha)}{\cos(90^\circ + \alpha)} = \dfrac{\cos\alpha}{-\sin\alpha} = -\dfrac{1}{\tan\alpha}$.
    - opgave: |-
        $\sin(270^\circ - \alpha) = -\cos\alpha$
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        $270^\circ - \alpha = 180^\circ + (90^\circ - \alpha)$, dus $\sin(270^\circ - \alpha) = -\sin(90^\circ - \alpha) = -\cos\alpha$.
    - opgave: |-
        $(\sin\alpha + \cos\alpha)^2 + (\sin\alpha - \cos\alpha)^2 = 2$
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        Werk de kwadraten uit: $\sin^2\alpha + 2\sin\alpha\cos\alpha + \cos^2\alpha + \sin^2\alpha - 2\sin\alpha\cos\alpha + \cos^2\alpha = 2(\sin^2\alpha + \cos^2\alpha) = 2$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    kwadrant en teken
  opgave: |-
    In welk kwadrant ligt de hoek van $255^\circ$? Geef zonder rekenmachine het teken van $\sin 255^\circ$, $\cos 255^\circ$ en $\tan 255^\circ$.
  antwoord: |-
    III; $-$, $-$, $+$
  uitwerking: |-
    $180^\circ < 255^\circ < 270^\circ$: linksonder. Sinus en cosinus zijn negatief, de tangens positief.

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    exacte waarden
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin 330^\circ$
      antwoord: |-
        $-\tfrac12$
      uitwerking: |-
        $\sin(360^\circ - 30^\circ) = -\sin 30^\circ$.
    - opgave: |-
        $\cos 135^\circ$
      antwoord: |-
        $-\tfrac{\sqrt2}{2}$
      uitwerking: |-
        $\cos(180^\circ - 45^\circ) = -\cos 45^\circ$.
    - opgave: |-
        $\tan 240^\circ$
      antwoord: |-
        $\sqrt3$
      uitwerking: |-
        $\tan(180^\circ + 60^\circ) = \tan 60^\circ$.

- id: h1-t3
  soort: test
  niveau: 2
  thema: |-
    grondformule en kwadrant
  opgave: |-
    Van een hoek $\alpha$ in het derde kwadrant is $\sin\alpha = -0{,}28$. Bereken $\cos\alpha$ en $\tan\alpha$ zonder de hoek te berekenen. Geef de tangens op vier decimalen.
  antwoord: |-
    $\cos\alpha = -0{,}96$, $\tan\alpha = \tfrac{7}{24} \approx 0{,}2917$
  uitwerking: |-
    $\cos^2\alpha = 1 - 0{,}0784 = 0{,}9216$; in het derde kwadrant is de cosinus negatief: $\cos\alpha = -0{,}96$. $\tan\alpha = \tfrac{-0{,}28}{-0{,}96} = \tfrac{7}{24}$.

- id: h1-t4
  soort: test
  niveau: 2
  thema: |-
    alle hoeken met een gegeven sinus of cosinus
  opgave: |-
    Bereken alle hoeken $\alpha$ tussen $0^\circ$ en $360^\circ$, afgerond op $0{,}01^\circ$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin\alpha = 0{,}65$
      antwoord: |-
        $40{,}54^\circ$ en $139{,}46^\circ$
      uitwerking: |-
        $\sin^{-1} 0{,}65 \approx 40{,}54^\circ$ en het supplement $139{,}46^\circ$.
    - opgave: |-
        $\cos\alpha = -0{,}65$
      antwoord: |-
        $130{,}54^\circ$ en $229{,}46^\circ$
      uitwerking: |-
        $\cos^{-1}(-0{,}65) \approx 130{,}54^\circ$ en $360^\circ - 130{,}54^\circ = 229{,}46^\circ$.

- id: h1-t5
  soort: test
  niveau: 2
  thema: |-
    vereenvoudigen met verwante hoeken
  opgave: |-
    Vereenvoudig zo ver mogelijk.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin(180^\circ + \alpha) + \sin(-\alpha) + 2\sin(180^\circ - \alpha)$
      antwoord: |-
        $0$
      uitwerking: |-
        $-\sin\alpha - \sin\alpha + 2\sin\alpha = 0$.
    - opgave: |-
        $\cos(180^\circ - \alpha) - \cos(360^\circ - \alpha)$
      antwoord: |-
        $-2\cos\alpha$
      uitwerking: |-
        $-\cos\alpha - \cos\alpha = -2\cos\alpha$.

- id: h1-t6
  soort: test
  niveau: 2
  thema: |-
    punt op een cirkel met straal r
  opgave: |-
    Een stip op een draaiende schijf ligt 15~cm van het middelpunt. Ze vertrekt rechts van het middelpunt, op de horizontale, en draait $205^\circ$ in tegenwijzerzin. Bereken haar coördinaten ten opzichte van het middelpunt, afgerond op een millimeter.
  antwoord: |-
    $(-13{,}6;\ {-6{,}3})$
  uitwerking: |-
    $(15\cos 205^\circ, 15\sin 205^\circ) \approx (-13{,}59;\ {-6{,}34})$: derde kwadrant, links onder het middelpunt.

- id: h1-t7
  soort: test
  niveau: 2
  thema: |-
    hoeken in een driehoek
  opgave: |-
    In driehoek $ABC$ is $\cos\hoek{A} = -0{,}55$ en $\sin\hoek{B} = 0{,}4$. Bereken de drie hoeken, afgerond op $0{,}01^\circ$.
  antwoord: |-
    $\hoek{A} \approx 123{,}37^\circ$, $\hoek{B} \approx 23{,}58^\circ$, $\hoek{C} \approx 33{,}05^\circ$
  uitwerking: |-
    $\hoek{A} = \cos^{-1}(-0{,}55) \approx 123{,}37^\circ$. $\hoek{B} \approx 23{,}58^\circ$ of $156{,}42^\circ$; dat laatste kan niet naast een stompe hoek. $\hoek{C} = 180^\circ - 123{,}37^\circ - 23{,}58^\circ = 33{,}05^\circ$.
