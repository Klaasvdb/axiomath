- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    gelijke en tegengestelde vectoren, veelvoud
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \coordinate (P) at (0,0); \coordinate (Q) at (4,0); \coordinate (R) at (4.8,2.2); \coordinate (S) at (.8,2.2); \coordinate (T) at (2.4,1.1);
        \fill[accent!8] (P) -- (Q) -- (R) -- (S) -- cycle;
        \draw[accent,thick] (P) -- (Q) -- (R) -- (S) -- cycle;
        \draw[lijngrijs] (P) -- (R) (Q) -- (S);
        \fill (T) circle (1.5pt) node[below=2pt] {$T$};
        \node[below left] at (P) {$P$}; \node[below right] at (Q) {$Q$}; \node[above right] at (R) {$R$}; \node[above left] at (S) {$S$};
      \end{tikzpicture}
  opgave: |-
    $PQRS$ is een parallellogram met $T$ het snijpunt van de diagonalen.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke vector met letters uit de figuur is gelijk aan $\vect{PQ}$?
      antwoord: |-
        $\vect{SR}$
      uitwerking: |-
        Overstaande zijde, dezelfde zin.
    - opgave: |-
        Geef twee vectoren die tegengesteld zijn aan $\vect{TR}$.
      antwoord: |-
        $\vect{RT}$ en $\vect{TP}$
      uitwerking: |-
        $T$ is het midden van $[PR]$.
    - opgave: |-
        Vul aan: $\vect{PT} = \ldots\,\vect{PR}$.
      antwoord: |-
        $\tfrac12$
      uitwerking: |-
        Half zo lang, dezelfde zin.

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    som en verschil tekenen
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \ruitjes{0}{0}{5}{2}
        \draw[vector] (0,1) -- (3,0) node[midway,below left,inner sep=1pt] {$\vect{u}$};
        \draw[vectorb] (4,0) -- (5,2) node[midway,left] {$\vect{v}$};
      \end{tikzpicture}
  opgave: |-
    Neem de vectoren over op ruitjespapier en teken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\vect{u} + \vect{v}$
      antwoord: |-
        4 rechts, 1 omhoog
      uitwerking: |-
        $\vect{u}$: 3 rechts, 1 omlaag; $\vect{v}$: 1 rechts, 2 omhoog. Samen 4 rechts, 1 omhoog.
        \figuren{\begin{tikzpicture}[scale=.3]
          \ruitjes{0}{0}{4}{2}
          \draw[vector] (0,1) -- (3,0); \draw[vectorb] (3,0) -- (4,2); \draw[som] (0,1) -- (4,2);
        \end{tikzpicture}}
    - opgave: |-
        $\vect{v} - \vect{u}$
      antwoord: |-
        2 links, 3 omhoog
      uitwerking: |-
        $-\vect{u}$: 3 links, 1 omhoog. Samen met $\vect{v}$: 2 links, 3 omhoog.
        \figuren{\begin{tikzpicture}[scale=.3]
          \ruitjes{0}{0}{2}{3}
          \draw[vectorb] (2,0) -- (3,2); \draw[vector] (3,2) -- (0,3); \draw[som] (2,0) -- (0,3);
        \end{tikzpicture}}

- id: h1-t3
  soort: test
  niveau: 1
  thema: |-
    betrekking van Chasles
  opgave: |-
    Schrijf als één vector.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\vect{KL} + \vect{LM}$
      antwoord: |-
        $\vect{KM}$
      uitwerking: |-
        Chasles.
    - opgave: |-
        $\vect{AC} + \vect{BA}$
      antwoord: |-
        $\vect{BC}$
      uitwerking: |-
        $\vect{BA} + \vect{AC} = \vect{BC}$.
    - opgave: |-
        $\vect{PQ} + \vect{RP} + \vect{QR}$
      antwoord: |-
        $\nulvec$
      uitwerking: |-
        $\vect{PQ} + \vect{QR} + \vect{RP} = \vect{PP}$.

- id: h1-t4
  soort: test
  niveau: 2
  thema: |-
    som en verschil in een parallellogram
  opgave: |-
    $ABCD$ is een parallellogram. Schrijf als één vector met letters van het parallellogram.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\vect{AB} + \vect{AD}$
      antwoord: |-
        $\vect{AC}$
      uitwerking: |-
        Parallellogramregel.
    - opgave: |-
        $\vect{AD} - \vect{AB}$
      antwoord: |-
        $\vect{BD}$
      uitwerking: |-
        Verschil vanuit $A$.
    - opgave: |-
        $\vect{CB} - \vect{CD}$
      antwoord: |-
        $\vect{DB}$
      uitwerking: |-
        Verschil vanuit $C$: van $D$ naar $B$.

- id: h1-t5
  soort: test
  niveau: 2
  thema: |-
    som en veelvoud tekenen
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \ruitjes{0}{0}{6}{2}
        \draw[vector] (0,0) -- (2,2) node[midway,left] {$\vect{u}$};
        \draw[vectorb] (3,2) -- (6,1) node[midway,above right,inner sep=1pt] {$\vect{v}$};
      \end{tikzpicture}
  opgave: |-
    Neem de vectoren over op ruitjespapier en teken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2\vect{u} - \vect{v}$
      antwoord: |-
        1 rechts, 5 omhoog
      uitwerking: |-
        $2\vect{u}$: 4 rechts, 4 omhoog; $-\vect{v}$: 3 links, 1 omhoog. Samen 1 rechts, 5 omhoog.
        \figuren{\begin{tikzpicture}[scale=.3]
          \ruitjes{0}{0}{4}{5}
          \draw[vector] (0,0) -- (4,4); \draw[vectorb] (4,4) -- (1,5); \draw[som] (0,0) -- (1,5);
        \end{tikzpicture}}
    - opgave: |-
        $-\tfrac12\vect{u}$
      antwoord: |-
        1 links, 1 omlaag
      uitwerking: |-
        Half zo lang als $\vect{u}$ (2 rechts, 2 omhoog), met de andere zin.

- id: h1-t6
  soort: test
  niveau: 2
  thema: |-
    vereenvoudigen
  opgave: |-
    Vereenvoudig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3(\vect{u} + 2\vect{v}) - 5\vect{v}$
      antwoord: |-
        $3\vect{u} + \vect{v}$
      uitwerking: |-
        $3\vect{u} + 6\vect{v} - 5\vect{v}$.
    - opgave: |-
        $2\vect{u} - (\vect{u} - 4\vect{v})$
      antwoord: |-
        $\vect{u} + 4\vect{v}$
      uitwerking: |-
        $2\vect{u} - \vect{u} + 4\vect{v}$.

- id: h1-t7
  soort: test
  niveau: 2
  thema: |-
    resultante van twee krachten
  opgave: |-
    Op een kist werken twee krachten van $12$~N en $5$~N. Bepaal de resultante als de krachten
  lijst: enumerate
  delen:
    - opgave: |-
        loodrecht op elkaar staan;
      antwoord: |-
        $13$~N
      uitwerking: |-
        $\sqrt{12^2 + 5^2} = \sqrt{169} = 13$.
    - opgave: |-
        in tegengestelde zin werken.
      antwoord: |-
        $7$~N, in de zin van de kracht van $12$~N
      uitwerking: |-
        $12 - 5 = 7$.
