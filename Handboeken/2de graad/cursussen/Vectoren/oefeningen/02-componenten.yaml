# Oefeningen van hoofdstuk 2 (pakket 4 en 5). Zie Opmaak/oefeningenbank.py voor de velden.
# Afgeronde getallen nagerekend met Python.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        $5 - ({-3})$ en $-2 - 4$
      antwoord: |-
        $8$ en $-6$
      uitwerking: |-
        Een negatief getal aftrekken is het tegengestelde optellen: $5 + 3 = 8$. En $-2 - 4 = -6$.
    - opgave: |-
        de schuine zijde van een rechthoekige driehoek met rechthoekszijden 5 en 12
      antwoord: |-
        $13$
      uitwerking: |-
        $\sqrt{25 + 144} = \sqrt{169} = 13$.
    - opgave: |-
        $10\cos 60^\circ$ en $10\sin 60^\circ$, afgerond op twee decimalen
      antwoord: |-
        $5$ en $8{,}66$
      uitwerking: |-
        $\cos 60^\circ = 0{,}5$ en $\sin 60^\circ \approx 0{,}8660$.
    - opgave: |-
        de scherpe hoek $\alpha$ met $\tan\alpha = 0{,}75$, afgerond op $0{,}01^\circ$
      antwoord: |-
        $36{,}87^\circ$
      uitwerking: |-
        $\alpha = \tan^{-1} 0{,}75 \approx 36{,}87^\circ$.
    - opgave: |-
        de oplossing van het stelsel $2x + y = 5$ en $x - y = 1$
      antwoord: |-
        $x = 2$, $y = 1$
      uitwerking: |-
        Tel de vergelijkingen op: $3x = 6$, dus $x = 2$ en $y = 1$.

- id: h2-verken
  soort: start
  figuur:
    code: |-
      \begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
        \rooster{-3}{1}{6}{-1}{1}{5}
        \draw[vector] (1,1) -- (5,4);
        \draw[vector] (-2,1) -- (2,4);
        \punt[below right]{1}{1}{A} \punt[above]{5}{4}{B}
        \punt[below]{-2}{1}{C} \punt[above]{2}{4}{D}
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken}\quad Bekijk de figuur.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel eenheden gaat $\vect{AB}$ naar rechts en hoeveel omhoog? En $\vect{CD}$?
      antwoord: |-
        allebei 4 naar rechts en 3 omhoog
      uitwerking: |-
        $\vect{AB} = \vect{CD}$: dezelfde verschuiving.
    - opgave: |-
        Lees de coördinaten van $A$, $B$, $C$ en $D$ af.
      antwoord: |-
        $A\vc{1}{1}$, $B\vc{5}{4}$, $C\vc{-2}{1}$, $D\vc{2}{4}$
      uitwerking: |-
        Eerst de $x$-coördinaat, dan de $y$-coördinaat.
    - opgave: |-
        Hoe vind je de getallen 4 en 3 uit de coördinaten van $A$ en $B$? Werkt dat ook voor $C$ en $D$?
      antwoord: |-
        $5 - 1 = 4$ en $4 - 1 = 3$; ja
      uitwerking: |-
        Trek de coördinaten van het beginpunt af van die van het eindpunt: $2 - ({-2}) = 4$ en $4 - 1 = 3$.
    - opgave: |-
        Hoeveel eenheden gaat de pijl van $P\vc{-3}{2}$ naar $Q\vc{1}{-4}$ opzij en omhoog of omlaag? Werk zonder tekening.
      antwoord: |-
        4 naar rechts, 6 omlaag
      uitwerking: |-
        $1 - ({-3}) = 4$ en $-4 - 2 = -6$: 4 naar rechts en 6 omlaag.

- id: h2-aflezen
  soort: kort
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
        \rooster{-4}{1}{5}{-4}{1}{4}
        \draw[vector] (-4,1) -- (-1,3) node[midway,above left,inner sep=1pt] {$\vect{a}$};
        \draw[vectorb] (-1,-1) -- (-3,-3) node[midway,above left,inner sep=1pt] {$\vect{b}$};
        \draw[vectorb] (1,3) -- (5,3) node[midway,above] {$\vect{c}$};
        \draw[vectorb] (3,-4) -- (4,-1) node[midway,right] {$\vect{d}$};
      \end{tikzpicture}
  opgave: |-
    Werk met de figuur.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees de componenten af van $\vect{a}$, $\vect{b}$, $\vect{c}$ en $\vect{d}$.
      antwoord: |-
        $\vect{a} = \vc{3}{2}$, $\vect{b} = \vc{-2}{-2}$, $\vect{c} = \vc{4}{0}$, $\vect{d} = \vc{1}{3}$
      uitwerking: |-
        Tel van het beginpunt naar de punt: naar rechts en omhoog positief, naar links en omlaag negatief.
    - opgave: |-
        Teken $\vect{v} = \vc{2}{-3}$ vanuit $P\vc{-1}{2}$. In welk punt komt de pijl uit?
      antwoord: |-
        $\vc{1}{-1}$
      uitwerking: |-
        $({-1} + 2,\ 2 + ({-3})) = \vc{1}{-1}$.
    - opgave: |-
        Welke vector in de figuur is de plaatsvector van het punt $\vc{-2}{-2}$, als je hem vanuit de oorsprong tekent?
      antwoord: |-
        $\vect{b}$
      uitwerking: |-
        De plaatsvector van een punt heeft als componenten de coördinaten van dat punt.

- id: h2-tussen
  soort: kort
  opgave: |-
    Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        de componenten van $\vect{AB}$ voor $A\vc{2}{5}$ en $B\vc{7}{1}$
      antwoord: |-
        $\vc{5}{-4}$
      uitwerking: |-
        $(7 - 2,\ 1 - 5) = \vc{5}{-4}$.
    - opgave: |-
        de componenten van $\vect{AB}$ voor $A\vc{-3}{-1}$ en $B\vc{2}{4}$
      antwoord: |-
        $\vc{5}{5}$
      uitwerking: |-
        $(2 - ({-3}),\ 4 - ({-1})) = \vc{5}{5}$.
    - opgave: |-
        de componenten van $\vect{PQ}$ voor $P\vc{0}{-4}$ en $Q\vc{-6}{0}$
      antwoord: |-
        $\vc{-6}{4}$
      uitwerking: |-
        $({-6} - 0,\ 0 - ({-4})) = \vc{-6}{4}$.
    - opgave: |-
        het punt $B$ als $A\vc{-1}{3}$ en $\vect{AB} = \vc{4}{-5}$
      antwoord: |-
        $B\vc{3}{-2}$
      uitwerking: |-
        $({-1} + 4,\ 3 + ({-5})) = \vc{3}{-2}$.
    - opgave: |-
        het punt $A$ als $B\vc{2}{0}$ en $\vect{AB} = \vc{-3}{6}$
      antwoord: |-
        $A\vc{5}{-6}$
      uitwerking: |-
        Terug vanuit $B$: $(2 - ({-3}),\ 0 - 6) = \vc{5}{-6}$.
    - opgave: |-
        het punt $D$ zodat $ABCD$ een parallellogram is, met $A\vc{0}{0}$, $B\vc{4}{1}$ en $C\vc{5}{4}$
      antwoord: |-
        $D\vc{1}{3}$
      uitwerking: |-
        $\vect{AB} = \vc{4}{1}$ en $\vect{DC} = \vect{AB}$, dus $D = (5 - 4,\ 4 - 1) = \vc{1}{3}$.

- id: h2-rekenen
  soort: kort
  opgave: |-
    Gegeven zijn $\vect{u} = \vc{3}{-2}$ en $\vect{v} = \vc{-1}{4}$. Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\vect{u} + \vect{v}$
      antwoord: |-
        $\vc{2}{2}$
      uitwerking: |-
        $(3 - 1,\ {-2} + 4)$.
    - opgave: |-
        $\vect{u} - \vect{v}$
      antwoord: |-
        $\vc{4}{-6}$
      uitwerking: |-
        $(3 - ({-1}),\ {-2} - 4)$.
    - opgave: |-
        $4\vect{u}$
      antwoord: |-
        $\vc{12}{-8}$
      uitwerking: |-
        Elke component maal 4.
    - opgave: |-
        $-\vect{v}$
      antwoord: |-
        $\vc{1}{-4}$
      uitwerking: |-
        Elke component van teken veranderen.
    - opgave: |-
        $2\vect{u} + 3\vect{v}$
      antwoord: |-
        $\vc{3}{8}$
      uitwerking: |-
        $\vc{6}{-4} + \vc{-3}{12} = \vc{3}{8}$.
    - opgave: |-
        $\tfrac12\vect{u} - \vect{v}$
      antwoord: |-
        $\vc{2{,}5}{-5}$
      uitwerking: |-
        $\vc{1{,}5}{-1} - \vc{-1}{4} = \vc{2{,}5}{-5}$.
    - opgave: |-
        $\vect{x}$ als $\vect{x} + \vect{u} = \vect{v}$
      antwoord: |-
        $\vc{-4}{6}$
      uitwerking: |-
        $\vect{x} = \vect{v} - \vect{u} = \vc{-4}{6}$.
    - opgave: |-
        $\vect{x}$ als $3\vect{x} - \vect{v} = \vect{u}$
      antwoord: |-
        $\vc{\tfrac23}{\tfrac23}$
      uitwerking: |-
        $3\vect{x} = \vect{u} + \vect{v} = \vc{2}{2}$, dus $\vect{x} = \vc{\tfrac23}{\tfrac23}$.

- id: h2-midden
  soort: kort
  opgave: |-
    Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        het midden van $[AB]$ met $A\vc{2}{7}$ en $B\vc{8}{-1}$
      antwoord: |-
        $\vc{5}{3}$
      uitwerking: |-
        $\bigl(\tfrac{2 + 8}{2},\ \tfrac{7 - 1}{2}\bigr) = \vc{5}{3}$.
    - opgave: |-
        het midden van $[AB]$ met $A\vc{-3}{4}$ en $B\vc{4}{-2}$
      antwoord: |-
        $\vc{0{,}5}{1}$
      uitwerking: |-
        $\bigl(\tfrac{-3 + 4}{2},\ \tfrac{4 - 2}{2}\bigr) = \vc{0{,}5}{1}$.
    - opgave: |-
        het punt $B$ als $A\vc{1}{2}$ en het midden van $[AB]$ het punt $M\vc{4}{-1}$ is
      antwoord: |-
        $B\vc{7}{-4}$
      uitwerking: |-
        $\vect{AM} = \vc{3}{-3}$ en $\vect{MB} = \vect{AM}$, dus $B = (4 + 3,\ {-1} - 3) = \vc{7}{-4}$.
    - opgave: |-
        het snijpunt van de diagonalen van een parallellogram $ABCD$ met $A\vc{0}{0}$ en $C\vc{6}{4}$
      antwoord: |-
        $\vc{3}{2}$
      uitwerking: |-
        De diagonalen snijden elkaar middendoor: het snijpunt is het midden van $[AC]$.

- id: h2-evenwijdig
  soort: kort
  pakketten: [5]
  opgave: |-
    Beantwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        Zijn $\vc{3}{-1}$ en $\vc{-9}{3}$ evenwijdig? En $\vc{2}{5}$ en $\vc{4}{9}$?
      antwoord: |-
        ja; nee
      uitwerking: |-
        $\vc{-9}{3} = -3\,\vc{3}{-1}$. Bij $\vc{2}{5}$ en $\vc{4}{9}$ geeft de eerste component $k = 2$, maar $2 \cdot 5 = 10 \neq 9$.
    - opgave: |-
        Zijn $\vc{0}{3}$ en $\vc{0}{-7}$ evenwijdig?
      antwoord: |-
        ja
      uitwerking: |-
        Allebei verticaal: $\vc{0}{-7} = -\tfrac73\,\vc{0}{3}$.
    - opgave: |-
        Bereken $x$ zodat $\vc{x}{6}$ evenwijdig is met $\vc{2}{3}$.
      antwoord: |-
        $x = 4$
      uitwerking: |-
        De tweede component geeft $k = 6 : 3 = 2$, dus $x = 2 \cdot 2 = 4$.
    - opgave: |-
        Liggen $A\vc{-1}{1}$, $B\vc{1}{2}$ en $C\vc{7}{5}$ op één rechte?
      antwoord: |-
        ja
      uitwerking: |-
        $\vect{AB} = \vc{2}{1}$ en $\vect{AC} = \vc{8}{4} = 4\,\vect{AB}$.

- id: h2-norm
  soort: kort
  opgave: |-
    Bereken de norm, exact en zo nodig afgerond op twee decimalen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\vc{8}{6}$
      antwoord: |-
        $10$
      uitwerking: |-
        $\sqrt{64 + 36} = 10$.
    - opgave: |-
        $\vc{-7}{24}$
      antwoord: |-
        $25$
      uitwerking: |-
        $\sqrt{49 + 576} = \sqrt{625} = 25$.
    - opgave: |-
        $\vc{1}{1}$
      antwoord: |-
        $\sqrt2 \approx 1{,}41$
      uitwerking: |-
        $\sqrt{1 + 1} = \sqrt2$.
    - opgave: |-
        $\vc{-4}{-2}$
      antwoord: |-
        $2\sqrt5 \approx 4{,}47$
      uitwerking: |-
        $\sqrt{16 + 4} = \sqrt{20} = 2\sqrt5$.
    - opgave: |-
        $\vc{0}{-9}$
      antwoord: |-
        $9$
      uitwerking: |-
        $\sqrt{0 + 81} = 9$: een verticale vector.
    - opgave: |-
        $\vc{1{,}5}{2}$
      antwoord: |-
        $2{,}5$
      uitwerking: |-
        $\sqrt{2{,}25 + 4} = \sqrt{6{,}25} = 2{,}5$.

- id: h2-afstand
  soort: kort
  opgave: |-
    Bereken de afstand tussen de punten, exact en zo nodig afgerond op twee decimalen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $A\vc{1}{2}$ en $B\vc{4}{6}$
      antwoord: |-
        $5$
      uitwerking: |-
        $\vect{AB} = \vc{3}{4}$, norm $5$.
    - opgave: |-
        $A\vc{-2}{3}$ en $B\vc{3}{-9}$
      antwoord: |-
        $13$
      uitwerking: |-
        $\vect{AB} = \vc{5}{-12}$, norm $\sqrt{169} = 13$.
    - opgave: |-
        $A\vc{0}{-1}$ en $B\vc{-4}{5}$
      antwoord: |-
        $2\sqrt{13} \approx 7{,}21$
      uitwerking: |-
        $\vect{AB} = \vc{-4}{6}$, norm $\sqrt{52} = 2\sqrt{13}$.

- id: h2-ontbind
  soort: kort
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.45,font=\scriptsize]
        \ruitjes{-1}{-1}{5}{6}
        \draw[lijngrijs] (-1,-.5) -- (5,2.5) node[right,grijs] {$l$};
        \draw[lijngrijs] (0,-1) -- (0,6) node[above,grijs] {$m$};
        \draw[vector] (0,0) -- (2,1) node[midway,below right,inner sep=1pt] {$\vect{u}$};
        \draw[vector] (0,0) -- (0,1) node[midway,left] {$\vect{w}$};
        \draw[som] (0,0) -- (4,5) node[pos=.7,left] {$\vect{v}$};
      \end{tikzpicture}
  opgave: |-
    Ontbind de vector.
  lijst: enumerate
  delen:
    - opgave: |-
        Ontbind $\vect{v}$ uit de figuur volgens de richtingen van $l$ en $m$. Schrijf $\vect{v}$ met $\vect{u}$ en $\vect{w}$.
      antwoord: |-
        $\vc{4}{2}$ langs $l$ en $\vc{0}{3}$ langs $m$; $\vect{v} = 2\vect{u} + 3\vect{w}$
      uitwerking: |-
        Een evenwijdige met $m$ door de kop van $\vect{v}$ snijdt $l$ in $\vc{4}{2}$; een evenwijdige met $l$ snijdt $m$ in $\vc{0}{3}$. Controle: $\vc{4}{2} + \vc{0}{3} = \vc{4}{5}$.
    - opgave: |-
        Schrijf $\vc{1}{7}$ als $a\,\vc{1}{1} + b\,\vc{-1}{2}$.
      antwoord: |-
        $a = 3$, $b = 2$
      uitwerking: |-
        $a - b = 1$ en $a + 2b = 7$. Trek af: $3b = 6$, dus $b = 2$ en $a = 3$. Controle: $\vc{3}{3} + \vc{-2}{4} = \vc{1}{7}$.

- id: h2-assen
  soort: kort
  opgave: |-
    Rond af op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        Een kracht van $80$~N wijst naar rechts boven, onder $25^\circ$ met de horizontale. Bereken de componenten.
      antwoord: |-
        $\vc{72{,}50}{33{,}81}$
      uitwerking: |-
        $80\cos 25^\circ \approx 72{,}50$ en $80\sin 25^\circ \approx 33{,}81$.
    - opgave: |-
        Een snelheid van $12$~m/s wijst naar links boven, onder $60^\circ$ met de horizontale. Bereken de componenten.
      antwoord: |-
        $\vc{-6}{10{,}39}$
      uitwerking: |-
        $12\cos 60^\circ = 6$, naar links dus $-6$; $12\sin 60^\circ \approx 10{,}39$.
    - opgave: |-
        Bereken de norm van $\vc{5}{12}$ en de hoek met de positieve $x$-as.
      antwoord: |-
        $13$; $67{,}38^\circ$
      uitwerking: |-
        $\sqrt{25 + 144} = 13$ en $\tan^{-1}\tfrac{12}{5} \approx 67{,}38^\circ$.
    - opgave: |-
        Bereken de norm van $\vc{-3}{-3}$ en de scherpe hoek met de horizontale.
      antwoord: |-
        $3\sqrt2 \approx 4{,}24$; $45^\circ$
      uitwerking: |-
        $\sqrt{9 + 9} = \sqrt{18} = 3\sqrt2$, en $\tan\alpha = \tfrac33 = 1$, dus $\alpha = 45^\circ$. De vector wijst naar links onder.

- id: h2-kracht
  soort: kort
  opgave: |-
    Rond af op $0{,}01$~N.
  lijst: enumerate
  delen:
    - opgave: |-
        Een touw trekt aan een paal met $300$~N, onder $50^\circ$ met de horizontale. Bereken de horizontale en de verticale component.
      antwoord: |-
        $192{,}84$~N en $229{,}81$~N
      uitwerking: |-
        $300\cos 50^\circ \approx 192{,}84$ en $300\sin 50^\circ \approx 229{,}81$.
    - opgave: |-
        Een kist van $500$~N staat op een helling van $15^\circ$. Bereken de component van het gewicht langs de helling en loodrecht erop.
      antwoord: |-
        $129{,}41$~N en $482{,}96$~N
      uitwerking: |-
        Langs de helling: $500\sin 15^\circ \approx 129{,}41$. Loodrecht: $500\cos 15^\circ \approx 482{,}96$.
    - opgave: |-
        Op een punt werken $50$~N naar rechts en $40$~N onder $45^\circ$ met de eerste (naar rechts boven). Bereken de grootte van de resultante en haar hoek met de eerste kracht.
      antwoord: |-
        $83{,}24$~N; $19{,}86^\circ$
      uitwerking: |-
        $\vect{F}_2 \approx \vc{28{,}28}{28{,}28}$, dus $\vect{F} \approx \vc{78{,}28}{28{,}28}$. Norm $\approx 83{,}24$, hoek $\tan^{-1}\tfrac{28{,}28}{78{,}28} \approx 19{,}86^\circ$.

#========================================================================================
# OPDRACHTEN
#========================================================================================

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    componenten van de vector tussen twee punten
  opgave: |-
    Bereken de componenten van $\vect{AB}$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $A\vc{1}{3}$, $B\vc{6}{5}$
      antwoord: |-
        $\vc{5}{2}$
      uitwerking: |-
        $(6 - 1,\ 5 - 3)$.
    - opgave: |-
        $A\vc{4}{-2}$, $B\vc{-1}{3}$
      antwoord: |-
        $\vc{-5}{5}$
      uitwerking: |-
        $({-1} - 4,\ 3 - ({-2}))$.
    - opgave: |-
        $A\vc{-3}{-5}$, $B\vc{0}{0}$
      antwoord: |-
        $\vc{3}{5}$
      uitwerking: |-
        $(0 - ({-3}),\ 0 - ({-5}))$: de tegengestelde van de plaatsvector van $A$.
    - opgave: |-
        $A\vc{2}{7}$, $B\vc{2}{-1}$
      antwoord: |-
        $\vc{0}{-8}$
      uitwerking: |-
        Een verticale vector.
    - opgave: |-
        $A\vc{-6}{1}$, $B\vc{-2}{-4}$
      antwoord: |-
        $\vc{4}{-5}$
      uitwerking: |-
        $({-2} - ({-6}),\ {-4} - 1)$.
    - opgave: |-
        $A\vc{0{,}5}{2}$, $B\vc{3}{-1{,}5}$
      antwoord: |-
        $\vc{2{,}5}{-3{,}5}$
      uitwerking: |-
        $(3 - 0{,}5,\ {-1{,}5} - 2)$.
    - opgave: |-
        $A\vc{-1}{-1}$, $B\vc{-7}{-9}$
      antwoord: |-
        $\vc{-6}{-8}$
      uitwerking: |-
        $({-7} - ({-1}),\ {-9} - ({-1}))$.
    - opgave: |-
        $A\vc{\tfrac12}{\tfrac13}$, $B\vc{1}{1}$
      antwoord: |-
        $\vc{\tfrac12}{\tfrac23}$
      uitwerking: |-
        $\bigl(1 - \tfrac12,\ 1 - \tfrac13\bigr)$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    rekenen met componenten
  opgave: |-
    Gegeven zijn $\vect{u} = \vc{-2}{5}$, $\vect{v} = \vc{4}{-1}$ en $\vect{w} = \vc{0}{3}$. Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\vect{u} + \vect{v}$
      antwoord: |-
        $\vc{2}{4}$
      uitwerking: |-
        $({-2} + 4,\ 5 - 1)$.
    - opgave: |-
        $\vect{v} - \vect{u}$
      antwoord: |-
        $\vc{6}{-6}$
      uitwerking: |-
        $(4 - ({-2}),\ {-1} - 5)$.
    - opgave: |-
        $-3\vect{w}$
      antwoord: |-
        $\vc{0}{-9}$
      uitwerking: |-
        Elke component maal $-3$.
    - opgave: |-
        $2\vect{u} - \vect{v}$
      antwoord: |-
        $\vc{-8}{11}$
      uitwerking: |-
        $\vc{-4}{10} - \vc{4}{-1}$.
    - opgave: |-
        $\vect{u} + \vect{v} + \vect{w}$
      antwoord: |-
        $\vc{2}{7}$
      uitwerking: |-
        $({-2} + 4 + 0,\ 5 - 1 + 3)$.
    - opgave: |-
        $\tfrac12\vect{v} + \vect{w}$
      antwoord: |-
        $\vc{2}{2{,}5}$
      uitwerking: |-
        $\vc{2}{-0{,}5} + \vc{0}{3}$.
    - opgave: |-
        $3(\vect{u} - \vect{w})$
      antwoord: |-
        $\vc{-6}{6}$
      uitwerking: |-
        $3\,\vc{-2}{2}$.
    - opgave: |-
        $2\vect{u} + 3\vect{v} - 4\vect{w}$
      antwoord: |-
        $\vc{8}{-5}$
      uitwerking: |-
        $\vc{-4}{10} + \vc{12}{-3} - \vc{0}{12} = \vc{8}{-5}$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    norm
  opgave: |-
    Bereken de norm, exact en zo nodig afgerond op twee decimalen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\vc{9}{12}$
      antwoord: |-
        $15$
      uitwerking: |-
        $\sqrt{81 + 144} = \sqrt{225}$.
    - opgave: |-
        $\vc{-8}{15}$
      antwoord: |-
        $17$
      uitwerking: |-
        $\sqrt{64 + 225} = \sqrt{289}$.
    - opgave: |-
        $\vc{2}{-2}$
      antwoord: |-
        $2\sqrt2 \approx 2{,}83$
      uitwerking: |-
        $\sqrt{4 + 4} = \sqrt8 = 2\sqrt2$.
    - opgave: |-
        $\vc{-1}{-3}$
      antwoord: |-
        $\sqrt{10} \approx 3{,}16$
      uitwerking: |-
        $\sqrt{1 + 9} = \sqrt{10}$.
    - opgave: |-
        $\vc{0{,}6}{0{,}8}$
      antwoord: |-
        $1$
      uitwerking: |-
        $\sqrt{0{,}36 + 0{,}64} = \sqrt1$.
    - opgave: |-
        $\vc{-6}{0}$
      antwoord: |-
        $6$
      uitwerking: |-
        Een horizontale vector van 6 lang.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    afstand tussen twee punten
  opgave: |-
    Bereken de afstand, exact en zo nodig afgerond op twee decimalen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $A\vc{3}{-1}$ en $B\vc{-3}{7}$
      antwoord: |-
        $10$
      uitwerking: |-
        $\vect{AB} = \vc{-6}{8}$, norm $\sqrt{100}$.
    - opgave: |-
        $C\vc{-5}{-2}$ en $D\vc{-1}{1}$
      antwoord: |-
        $5$
      uitwerking: |-
        $\vect{CD} = \vc{4}{3}$.
    - opgave: |-
        $E\vc{2}{2}$ en $F\vc{-1}{-4}$
      antwoord: |-
        $3\sqrt5 \approx 6{,}71$
      uitwerking: |-
        $\vect{EF} = \vc{-3}{-6}$, norm $\sqrt{45} = 3\sqrt5$.
    - opgave: |-
        $G\vc{0}{3}$ en $H\vc{7}{3}$
      antwoord: |-
        $7$
      uitwerking: |-
        Op dezelfde hoogte: $\vect{GH} = \vc{7}{0}$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    beginpunt, eindpunt en verschuiven
  opgave: |-
    Bereken de coördinaten.
  lijst: enumerate
  delen:
    - opgave: |-
        het eindpunt $B$ als $A\vc{3}{-2}$ en $\vect{AB} = \vc{-5}{4}$
      antwoord: |-
        $B\vc{-2}{2}$
      uitwerking: |-
        $(3 - 5,\ {-2} + 4)$.
    - opgave: |-
        het beginpunt $A$ als $B\vc{0}{-1}$ en $\vect{AB} = \vc{2}{-6}$
      antwoord: |-
        $A\vc{-2}{5}$
      uitwerking: |-
        $(0 - 2,\ {-1} - ({-6}))$.
    - opgave: |-
        het beeld van $P\vc{-4}{1}$ bij de verschuiving over $\vc{6}{-3}$
      antwoord: |-
        $\vc{2}{-2}$
      uitwerking: |-
        $({-4} + 6,\ 1 - 3)$.
    - opgave: |-
        het beeld van de driehoek met hoekpunten $\vc{0}{0}$, $\vc{2}{1}$ en $\vc{1}{3}$ bij de verschuiving over $\vc{-3}{2}$
      antwoord: |-
        $\vc{-3}{2}$, $\vc{-1}{3}$ en $\vc{-2}{5}$
      uitwerking: |-
        Tel bij elk hoekpunt $\vc{-3}{2}$ op.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    componenten uit norm en hoek
  opgave: |-
    Bereken de componenten van de vector, afgerond op twee decimalen. Maak eerst een schets.
  lijst: enumerate
  delen:
    - opgave: |-
        norm $10$, naar rechts boven, onder $45^\circ$ met de horizontale
      antwoord: |-
        $\vc{7{,}07}{7{,}07}$
      uitwerking: |-
        $10\cos 45^\circ = 10\sin 45^\circ \approx 7{,}07$.
    - opgave: |-
        norm $6$, naar rechts onder, onder $30^\circ$ met de horizontale
      antwoord: |-
        $\vc{5{,}20}{-3}$
      uitwerking: |-
        $6\cos 30^\circ \approx 5{,}20$ en $6\sin 30^\circ = 3$, omlaag dus $-3$.
    - opgave: |-
        norm $25$, naar links boven, onder $70^\circ$ met de horizontale
      antwoord: |-
        $\vc{-8{,}55}{23{,}49}$
      uitwerking: |-
        $25\cos 70^\circ \approx 8{,}55$, naar links dus $-8{,}55$; $25\sin 70^\circ \approx 23{,}49$.
    - opgave: |-
        norm $4$, recht naar beneden
      antwoord: |-
        $\vc{0}{-4}$
      uitwerking: |-
        Geen horizontale component.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    midden van een lijnstuk en spiegelen om een punt
  opgave: |-
    Bereken, exact en zo nodig afgerond op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        het midden van $[AB]$, met $A\vc{-4}{3}$ en $B\vc{2}{-5}$
      antwoord: |-
        $\vc{-1}{-1}$
      uitwerking: |-
        $\bigl(\tfrac{-4 + 2}{2},\ \tfrac{3 - 5}{2}\bigr)$.
    - opgave: |-
        het punt $B$ als $A\vc{3}{1}$ en $M\vc{0}{4}$ het midden van $[AB]$ is
      antwoord: |-
        $B\vc{-3}{7}$
      uitwerking: |-
        $\vect{AM} = \vc{-3}{3}$, en $B = M + \vect{AM} = \vc{-3}{7}$.
    - opgave: |-
        het spiegelbeeld van $P\vc{5}{2}$ om het punt $Q\vc{1}{-1}$ (zodat $Q$ het midden is van $P$ en zijn beeld)
      antwoord: |-
        $\vc{-3}{-4}$
      uitwerking: |-
        $\vect{PQ} = \vc{-4}{-3}$; vanuit $Q$ nog eens: $\vc{1 - 4}{-1 - 3} = \vc{-3}{-4}$.
    - opgave: |-
        de lengte van de zwaartelijn uit $A$ in de driehoek met $A\vc{0}{0}$, $B\vc{6}{0}$ en $C\vc{2}{4}$ (van $A$ naar het midden van $[BC]$)
      antwoord: |-
        $2\sqrt5 \approx 4{,}47$
      uitwerking: |-
        Het midden van $[BC]$ is $N\vc{4}{2}$, en $\lengte{AN} = \sqrt{16 + 4} = \sqrt{20} = 2\sqrt5$.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    parallellogram, ruit en vierkant met componenten
  opgave: |-
    Werk met componenten.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $C$ zodat $ABCD$ een parallellogram is, met $A\vc{-1}{0}$, $B\vc{3}{1}$ en $D\vc{0}{3}$.
      antwoord: |-
        $C\vc{4}{4}$
      uitwerking: |-
        $\vect{BC} = \vect{AD} = \vc{1}{3}$, dus $C = \vc{3 + 1}{1 + 3} = \vc{4}{4}$.
    - opgave: |-
        Toon aan dat $ABCD$ met $A\vc{1}{1}$, $B\vc{4}{2}$, $C\vc{5}{5}$ en $D\vc{2}{4}$ een parallellogram is.
      antwoord: |-
        $\vect{AB} = \vect{DC} = \vc{3}{1}$
      uitwerking: |-
        $\vect{AB} = \vc{3}{1}$ en $\vect{DC} = \vc{3}{1}$: gelijke vectoren, dus een parallellogram.
    - opgave: |-
        Is dat parallellogram een ruit? En een vierkant?
      antwoord: |-
        een ruit, geen vierkant
      uitwerking: |-
        $\lengte{AB} = \sqrt{10}$ en $\lengte{AD} = \norm{\vc{1}{3}} = \sqrt{10}$: alle zijden even lang, dus een ruit. De diagonalen zijn $\lengte{AC} = \sqrt{32}$ en $\lengte{BD} = \sqrt8$: niet even lang, dus geen vierkant.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijkingen met vectoren
  opgave: |-
    Bereken de onbekenden.
  lijst: enumerate
  delen:
    - opgave: |-
        $x$ en $y$ als $\vc{2}{y} + \vc{x}{-3} = \vc{5}{1}$
      antwoord: |-
        $x = 3$, $y = 4$
      uitwerking: |-
        $2 + x = 5$ en $y - 3 = 1$.
    - opgave: |-
        $x$ en $y$ als $3\,\vc{x}{2} - \vc{4}{y} = \vc{5}{0}$
      antwoord: |-
        $x = 3$, $y = 6$
      uitwerking: |-
        $3x - 4 = 5$ en $6 - y = 0$.
    - opgave: |-
        de vector $\vect{x}$ als $2\vect{x} - \vc{1}{-3} = \vc{5}{7}$
      antwoord: |-
        $\vc{3}{2}$
      uitwerking: |-
        $2\vect{x} = \vc{6}{4}$, dus $\vect{x} = \vc{3}{2}$.
    - opgave: |-
        de vector $\vect{x}$ als $\vc{1}{2} - \tfrac13\vect{x} = \vc{-1}{0}$
      antwoord: |-
        $\vc{6}{6}$
      uitwerking: |-
        $\tfrac13\vect{x} = \vc{1}{2} - \vc{-1}{0} = \vc{2}{2}$, dus $\vect{x} = \vc{6}{6}$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    een driehoek onderzoeken met afstanden
  opgave: |-
    Gegeven is de driehoek met hoekpunten $A\vc{1}{1}$, $B\vc{5}{4}$ en $C\vc{2}{8}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de lengtes van de drie zijden.
      antwoord: |-
        $\lengte{AB} = 5$, $\lengte{BC} = 5$, $\lengte{AC} = 5\sqrt2 \approx 7{,}07$
      uitwerking: |-
        $\vect{AB} = \vc{4}{3}$, $\vect{BC} = \vc{-3}{4}$, $\vect{AC} = \vc{1}{7}$, met normen $5$, $5$ en $\sqrt{50} = 5\sqrt2$.
    - opgave: |-
        Is de driehoek gelijkbenig? Is hij rechthoekig?
      antwoord: |-
        ja; ja, met de rechte hoek in $B$
      uitwerking: |-
        $\lengte{AB} = \lengte{BC}$. En $5^2 + 5^2 = 50 = \lengte{AC}^2$: volgens de omgekeerde stelling van Pythagoras is de hoek tegenover $[AC]$ recht.
    - opgave: |-
        Bereken de omtrek en de oppervlakte.
      antwoord: |-
        omtrek $\approx 17{,}07$; oppervlakte $12{,}5$
      uitwerking: |-
        Omtrek $10 + 5\sqrt2 \approx 17{,}07$. De rechthoekszijden zijn $[AB]$ en $[BC]$: oppervlakte $\tfrac{5 \cdot 5}{2} = 12{,}5$.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    verplaatsingen met componenten
  opgave: |-
    Een drone vertrekt in de oorsprong $O$. De $x$-as wijst naar het oosten, de $y$-as naar het noorden, en de eenheid is 1~m. De drone vliegt eerst de verplaatsing $\vc{300}{400}$ en daarna $\vc{-100}{200}$.
  lijst: enumerate
  delen:
    - opgave: |-
        In welk punt komt de drone uit?
      antwoord: |-
        $\vc{200}{600}$
      uitwerking: |-
        De som van de verplaatsingen: $\vc{300 - 100}{400 + 200}$.
    - opgave: |-
        Hoe ver is de drone dan van $O$, afgerond op 1~m?
      antwoord: |-
        $632$~m
      uitwerking: |-
        $\sqrt{200^2 + 600^2} = \sqrt{400\,000} \approx 632{,}5$~m.
    - opgave: |-
        Welke hoek maakt de rechte lijn van $O$ naar de drone met de richting oost, afgerond op $0{,}01^\circ$?
      antwoord: |-
        $71{,}57^\circ$
      uitwerking: |-
        $\tan^{-1}\tfrac{600}{200} = \tan^{-1} 3 \approx 71{,}57^\circ$, naar het noorden toe.
    - opgave: |-
        Met welke ene verplaatsing vliegt de drone recht terug naar $O$?
      antwoord: |-
        $\vc{-200}{-600}$
      uitwerking: |-
        De tegengestelde vector van $\vect{OP}$.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    grafisch ontbinden volgens twee richtingen
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.45,font=\scriptsize]
        \ruitjes{-3}{-1}{6}{5}
        \draw[lijngrijs] (-3,0) -- (6,0) node[right,grijs] {$l$};
        \draw[lijngrijs] (-.5,-1) -- (2.5,5) node[above,grijs] {$m$};
        \draw[vectorb] (0,0) -- (5,4) node[pos=.8,below right,inner sep=1pt] {$\vect{p}$};
        \draw[vectorb] (0,0) -- (-1,2) node[pos=.6,left] {$\vect{q}$};
        \fill (0,0) circle (2.5pt) node[below] {$O$};
      \end{tikzpicture}
  opgave: |-
    Neem de figuur over op ruitjespapier. Ontbind de vector volgens de richtingen van $l$ en $m$, en geef de componenten van de twee delen.
  lijst: enumerate
  delen:
    - opgave: |-
        $\vect{p}$
      antwoord: |-
        $\vc{3}{0}$ langs $l$ en $\vc{2}{4}$ langs $m$
      uitwerking: |-
        Een evenwijdige met $m$ door de kop $\vc{5}{4}$ snijdt $l$ in $\vc{3}{0}$. Controle: $\vc{3}{0} + \vc{2}{4} = \vc{5}{4}$.
    - opgave: |-
        $\vect{q}$
      antwoord: |-
        $\vc{-2}{0}$ langs $l$ en $\vc{1}{2}$ langs $m$
      uitwerking: |-
        Een evenwijdige met $m$ door de kop $\vc{-1}{2}$ snijdt $l$ in $\vc{-2}{0}$. De component langs $l$ wijst hier naar links. Controle: $\vc{-2}{0} + \vc{1}{2} = \vc{-1}{2}$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    ontbinden met een stelsel
  opgave: |-
    Schrijf de vector als $a\,\vect{u} + b\,\vect{w}$, met $\vect{u} = \vc{2}{1}$ en $\vect{w} = \vc{1}{-1}$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\vc{8}{1}$
      antwoord: |-
        $3\vect{u} + 2\vect{w}$
      uitwerking: |-
        $2a + b = 8$ en $a - b = 1$: optellen geeft $3a = 9$, dus $a = 3$, $b = 2$.
    - opgave: |-
        $\vc{-1}{7}$
      antwoord: |-
        $2\vect{u} - 5\vect{w}$
      uitwerking: |-
        $2a + b = -1$ en $a - b = 7$: $3a = 6$, dus $a = 2$, $b = -5$.
    - opgave: |-
        $\vc{0}{3}$
      antwoord: |-
        $\vect{u} - 2\vect{w}$
      uitwerking: |-
        $2a + b = 0$ en $a - b = 3$: $3a = 3$, dus $a = 1$, $b = -2$.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    een kracht ontbinden: vlieger
  opgave: |-
    Het touw van een vlieger trekt met $60$~N aan de hand van Jonas, onder een hoek van $50^\circ$ met de horizontale. Rond af op $0{,}01$~N.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de horizontale en de verticale component van de kracht.
      antwoord: |-
        $38{,}57$~N en $45{,}96$~N
      uitwerking: |-
        $60\cos 50^\circ \approx 38{,}57$ en $60\sin 50^\circ \approx 45{,}96$.
    - opgave: |-
        De wind neemt toe en de vlieger stijgt, tot het touw een hoek van $70^\circ$ maakt, met dezelfde $60$~N. Wat zijn de componenten nu? Wat verandert er voor Jonas?
      antwoord: |-
        $20{,}52$~N en $56{,}38$~N
      uitwerking: |-
        $60\cos 70^\circ \approx 20{,}52$ en $60\sin 70^\circ \approx 56{,}38$. Hij wordt minder naar voor getrokken en meer omhoog.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    een kracht ontbinden: helling
  opgave: |-
    Een auto met een gewicht van $12\,000$~N staat op een helling van $10^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de component van het gewicht langs de helling en loodrecht op de helling, afgerond op 1~N.
      antwoord: |-
        $2084$~N en $11\,818$~N
      uitwerking: |-
        $12\,000\sin 10^\circ \approx 2083{,}8$ en $12\,000\cos 10^\circ \approx 11\,817{,}7$. De handrem moet de eerste kracht opvangen.
    - opgave: |-
        Bij welke hellingshoek is de component langs de helling precies de helft van het gewicht?
      antwoord: |-
        $30^\circ$
      uitwerking: |-
        Dan is $\sin\alpha = 0{,}5$, dus $\alpha = 30^\circ$.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    resultante berekenen met componenten
  opgave: |-
    Op een haak werken twee krachten: $\vect{F}_1$ van $30$~N onder $20^\circ$ met de horizontale, en $\vect{F}_2$ van $50$~N onder $70^\circ$ met de horizontale, allebei naar rechts boven. Rond af op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de componenten van $\vect{F}_1$ en $\vect{F}_2$.
      antwoord: |-
        $\vc{28{,}19}{10{,}26}$ en $\vc{17{,}10}{46{,}98}$
      uitwerking: |-
        $30\cos 20^\circ \approx 28{,}19$, $30\sin 20^\circ \approx 10{,}26$, $50\cos 70^\circ \approx 17{,}10$, $50\sin 70^\circ \approx 46{,}98$.
    - opgave: |-
        Bereken de componenten van de resultante.
      antwoord: |-
        $\vc{45{,}29}{57{,}25}$
      uitwerking: |-
        Tel op, component per component (met de niet-afgeronde waarden).
    - opgave: |-
        Bereken de grootte van de resultante en haar hoek met de horizontale.
      antwoord: |-
        $73{,}00$~N; $51{,}65^\circ$
      uitwerking: |-
        $\sqrt{45{,}29^2 + 57{,}25^2} \approx 73{,}00$ en $\tan^{-1}\tfrac{57{,}25}{45{,}29} \approx 51{,}65^\circ$.

- id: h2-o17
  soort: opdracht
  niveau: 2
  pakketten: [5]
  thema: |-
    evenwijdige vectoren en collineaire punten
  opgave: |-
    Beantwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke paren zijn evenwijdig: $\vc{4}{-6}$ en $\vc{-2}{3}$; $\vc{1}{2}$ en $\vc{2}{1}$; $\vc{5}{0}$ en $\vc{-3}{0}$?
      antwoord: |-
        het eerste en het derde paar
      uitwerking: |-
        $\vc{4}{-6} = -2\,\vc{-2}{3}$ en $\vc{-3}{0} = -\tfrac35\,\vc{5}{0}$. Bij $\vc{1}{2}$ en $\vc{2}{1}$ geeft de eerste component $k = 2$ en de tweede $k = \tfrac12$.
    - opgave: |-
        Bereken $x$ zodat $\vc{3}{x}$ evenwijdig is met $\vc{-6}{4}$.
      antwoord: |-
        $x = -2$
      uitwerking: |-
        $k = 3 : ({-6}) = -\tfrac12$, dus $x = -\tfrac12 \cdot 4 = -2$.
    - opgave: |-
        Liggen $A\vc{-2}{-1}$, $B\vc{1}{1}$ en $C\vc{7}{5}$ op één rechte?
      antwoord: |-
        ja
      uitwerking: |-
        $\vect{AB} = \vc{3}{2}$ en $\vect{AC} = \vc{9}{6} = 3\,\vect{AB}$.
    - opgave: |-
        Liggen $A\vc{0}{1}$, $B\vc{2}{4}$ en $C\vc{5}{8}$ op één rechte?
      antwoord: |-
        nee
      uitwerking: |-
        $\vect{AB} = \vc{2}{3}$ en $\vect{AC} = \vc{5}{7}$. De eerste component geeft $k = 2{,}5$, maar $2{,}5 \cdot 3 = 7{,}5 \neq 7$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten
  opgave: |-
    Wie maakt een fout? Verbeter de fout.
  lijst: enumerate
  delen:
    - opgave: |-
        Ruben schrijft: $\vect{AB} = (x_A - x_B,\ y_A - y_B)$.
      antwoord: |-
        fout
      uitwerking: |-
        Eindpunt min beginpunt: $\vect{AB} = (x_B - x_A,\ y_B - y_A)$. Rubens formule geeft $\vect{BA}$.
    - opgave: |-
        Lotte rekent: $\norm{\vc{-3}{4}} = \sqrt{-9 + 16} = \sqrt7$.
      antwoord: |-
        fout: $5$
      uitwerking: |-
        $({-3})^2 = 9$, dus $\sqrt{9 + 16} = 5$. Zet een negatieve component tussen haakjes.
    - opgave: |-
        Emma zegt: de norm van een som is de som van de normen.
      antwoord: |-
        fout
      uitwerking: |-
        $\vc{3}{0} + \vc{0}{4} = \vc{3}{4}$ heeft norm 5, en niet $3 + 4 = 7$.
    - opgave: |-
        Senne schrijft voor een kracht van $50$~N onder $30^\circ$ met de horizontale: $F_x = 50\sin 30^\circ$ en $F_y = 50\cos 30^\circ$.
      antwoord: |-
        fout: omgewisseld
      uitwerking: |-
        De horizontale component is aanliggend aan de hoek: $F_x = 50\cos 30^\circ$ en $F_y = 50\sin 30^\circ$.
    - opgave: |-
        Mats zegt: het punt $\vc{3}{1}$ en de vector $\vc{3}{1}$ zijn hetzelfde.
      antwoord: |-
        fout
      uitwerking: |-
        Een punt is een plaats, een vector een verschuiving die je overal kunt tekenen. Alleen de plaatsvector van het punt heeft dezelfde getallen.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    snelheden met componenten
  opgave: |-
    Een vliegtuig vliegt ten opzichte van de lucht met de snelheid $\vc{0}{250}$, in km/h (de $y$-as wijst naar het noorden). De wind heeft de snelheid $\vc{40}{-30}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de snelheid ten opzichte van de grond.
      antwoord: |-
        $\vc{40}{220}$
      uitwerking: |-
        De som van de twee snelheden.
    - opgave: |-
        Hoe snel vliegt het vliegtuig ten opzichte van de grond, afgerond op 0,1~km/h?
      antwoord: |-
        $223{,}6$~km/h
      uitwerking: |-
        $\sqrt{40^2 + 220^2} = \sqrt{50\,000} \approx 223{,}6$.
    - opgave: |-
        Hoeveel graden wijkt de koers af van het noorden, afgerond op $0{,}01^\circ$?
      antwoord: |-
        $10{,}30^\circ$, naar het oosten
      uitwerking: |-
        De hoek met de $y$-as: $\tan\alpha = \tfrac{40}{220}$, dus $\alpha \approx 10{,}30^\circ$.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    een vector met een gegeven norm
  opgave: |-
    Gegeven is $\vect{v} = \vc{3}{4}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\norm{\vect{v}}$.
      antwoord: |-
        $5$
      uitwerking: |-
        $\sqrt{9 + 16} = 5$.
    - opgave: |-
        Zoek een vector met dezelfde richting en zin als $\vect{v}$, en norm 1.
      antwoord: |-
        $\vc{0{,}6}{0{,}8}$
      uitwerking: |-
        Deel door de norm: $\tfrac15\,\vect{v} = \vc{0{,}6}{0{,}8}$. Zo'n vector met norm 1 heet een eenheidsvector.
    - opgave: |-
        Zoek een vector met dezelfde richting en zin als $\vect{v}$, en norm 15.
      antwoord: |-
        $\vc{9}{12}$
      uitwerking: |-
        $3\,\vect{v}$, want $3 \cdot 5 = 15$.
    - opgave: |-
        Zoek een vector met dezelfde richting als $\vect{v}$, de andere zin, en norm 2.
      antwoord: |-
        $\vc{-1{,}2}{-1{,}6}$
      uitwerking: |-
        $-\tfrac25\,\vect{v} = \vc{-1{,}2}{-1{,}6}$.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    ontbinden: een lamp aan twee kabels
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.7,font=\scriptsize]
        \fill[black!8] (-2.4,1.3) rectangle (2.4,1.5);
        \draw[grijs] (-2.4,1.3) -- (2.4,1.3);
        \draw[inkt,thick] (-2.25,1.3) -- (0,0) -- (2.25,1.3);
        \fill[accent] (0,0) circle (3pt);
        \draw[som] (0,0) -- (0,-1.2) node[below] {$60$ N};
        \draw[accent!70,thin] (-1.557,.9) arc (-30:0:.8);
        \node[accent] at (-1.25,1.02) {$30^\circ$};
      \end{tikzpicture}
  opgave: |-
    Een lamp met een gewicht van $60$~N hangt stil aan twee kabels, die elk een hoek van $30^\circ$ maken met het plafond.
  lijst: enumerate
  delen:
    - opgave: |-
        De twee kabels trekken samen met $60$~N recht omhoog. Ontbind die kracht van $60$~N omhoog volgens de richtingen van de kabels, met een tekening op schaal. Hoe groot is de kracht in elke kabel?
      antwoord: |-
        $60$~N
      uitwerking: |-
        Het parallellogram is een ruit, die bestaat uit twee gelijkzijdige driehoeken (alle hoeken $60^\circ$). Elke kabelkracht is dus even groot als de diagonaal: $60$~N.
    - opgave: |-
        Controleer met componenten: elke kabelkracht $T$ heeft een verticale component $T\sin 30^\circ$.
      antwoord: |-
        $2T\sin 30^\circ = 60$, dus $T = 60$
      uitwerking: |-
        De horizontale componenten heffen elkaar op. De verticale samen: $2 \cdot T \cdot 0{,}5 = T = 60$.
    - opgave: |-
        Hoe groot wordt de kracht in elke kabel als de kabels maar $10^\circ$ maken met het plafond? Wat leer je daaruit?
      antwoord: |-
        ongeveer $172{,}76$~N
      uitwerking: |-
        $2T\sin 10^\circ = 60$, dus $T = \tfrac{30}{\sin 10^\circ} \approx 172{,}76$~N. Hoe vlakker de kabels, hoe groter de kracht: een kabel helemaal horizontaal spannen lukt nooit.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    ontbinden: wind in de zeilen
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.8,font=\scriptsize]
        \draw[lijngrijs,thick] (-1.6,-.35) -- (1.4,-.35) .. controls (2.1,-.3) and (2.3,0) .. (2.4,0) .. controls (2.3,0) and (2.1,.3) .. (1.4,.35) -- (-1.6,.35) -- cycle;
        \draw[lijngrijs,dashed] (-2,0) -- (3.4,0);
        \draw[accent!60,line width=2pt] (-1.2,-.69) -- (1.2,.69);
        \draw[som] (0,0) -- (-60:1.8) node[below] {$400$ N};
        \draw[hulplijn] (-60:1.8) -- (.9,0);
        \node[grijs,right] at (3.4,0) {vaarrichting};
        \draw[accent!70,thin] (.8,0) arc (0:30:.8); \node[accent,fill=white,inner sep=.5pt] at (1.25,.24) {$30^\circ$};
      \end{tikzpicture}
  opgave: |-
    De wind duwt op het zeil van een zeilboot met $400$~N, loodrecht op het zeil. Het zeil maakt een hoek van $30^\circ$ met de vaarrichting van de boot.
  lijst: enumerate
  delen:
    - opgave: |-
        Ontbind de kracht volgens de vaarrichting en de richting loodrecht erop. Welke hoek maakt de kracht met de loodlijn op de vaarrichting?
      antwoord: |-
        $30^\circ$
      uitwerking: |-
        De kracht staat loodrecht op het zeil, en de loodlijn op de vaarrichting staat loodrecht op de vaarrichting. Twee hoeken met loodrechte benen zijn gelijk: $30^\circ$.
    - opgave: |-
        Bereken de component in de vaarrichting en de component opzij, afgerond op 0,1~N.
      antwoord: |-
        $200$~N vooruit, $346{,}4$~N opzij
      uitwerking: |-
        Vooruit: $400\sin 30^\circ = 200$. Opzij: $400\cos 30^\circ \approx 346{,}4$.
    - opgave: |-
        Waarom heeft een zeilboot een zwaard of een kiel, een plaat onder de boot in de vaarrichting?
      antwoord: |-
        om de kracht opzij op te vangen
      uitwerking: |-
        Het grootste deel van de kracht duwt de boot opzij. De kiel werkt in het water als een wand tegen die zijwaartse beweging, zodat alleen het deel in de vaarrichting de boot vooruit duwt.

- id: h2-o23
  soort: opdracht
  niveau: 3
  pakketten: [5]
  thema: |-
    collineair en afstand met een parameter
  opgave: |-
    Gegeven zijn $A\vc{0}{0}$, $B\vc{4}{2}$ en $C\vc{k}{6}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $k$ zodat $A$, $B$ en $C$ op één rechte liggen.
      antwoord: |-
        $k = 12$
      uitwerking: |-
        $\vect{AC} = \vc{k}{6}$ moet een veelvoud zijn van $\vect{AB} = \vc{4}{2}$. De tweede component geeft de factor 3, dus $k = 12$.
    - opgave: |-
        Bereken $k$ zodat $\lengte{AC} = 10$.
      antwoord: |-
        $k = 8$ of $k = -8$
      uitwerking: |-
        $k^2 + 36 = 100$, dus $k^2 = 64$ en $k = \pm 8$. Er zijn twee punten.

- id: h2-o24
  soort: opdracht
  niveau: 3
  thema: |-
    een vierkant construeren met componenten
  opgave: |-
    Gegeven zijn $A\vc{1}{1}$ en $B\vc{4}{2}$. We zoeken $C$ en $D$ zodat $ABCD$ een vierkant is, in tegenwijzerzin.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\vect{AB}$. Teken $\vect{AB}$ en de vector die je krijgt door $\vect{AB}$ een kwartslag te draaien in tegenwijzerzin. Wat zijn zijn componenten?
      antwoord: |-
        $\vect{AB} = \vc{3}{1}$; gedraaid $\vc{-1}{3}$
      uitwerking: |-
        Na een kwartslag tegenwijzerzin wordt 3 naar rechts: 3 omhoog, en 1 omhoog: 1 naar links. De twee rechthoekige driehoeken met de componenten zijn even groot.
    - opgave: |-
        Bereken $C$ en $D$.
      antwoord: |-
        $C\vc{3}{5}$ en $D\vc{0}{4}$
      uitwerking: |-
        $\vect{BC} = \vect{AD} = \vc{-1}{3}$, dus $C = \vc{4 - 1}{2 + 3}$ en $D = \vc{1 - 1}{1 + 3}$.
    - opgave: |-
        Controleer dat de diagonalen even lang zijn, en bereken de oppervlakte van het vierkant.
      antwoord: |-
        $\lengte{AC} = \lengte{BD} = \sqrt{20}$; oppervlakte $10$
      uitwerking: |-
        $\vect{AC} = \vc{2}{4}$ en $\vect{BD} = \vc{-4}{2}$, allebei met norm $\sqrt{20}$. De zijde is $\sqrt{10}$, dus de oppervlakte is $10$.

#========================================================================================
# TEST JEZELF
#========================================================================================

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    componenten van de vector tussen twee punten
  opgave: |-
    Gegeven zijn $A\vc{-3}{2}$ en $B\vc{1}{-4}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de componenten van $\vect{AB}$.
      antwoord: |-
        $\vc{4}{-6}$
      uitwerking: |-
        $(1 - ({-3}),\ {-4} - 2)$.
    - opgave: |-
        In welk punt komt de vector $\vc{5}{1}$ uit als je hem vanuit $A$ tekent?
      antwoord: |-
        $\vc{2}{3}$
      uitwerking: |-
        $({-3} + 5,\ 2 + 1)$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    rekenen met componenten
  opgave: |-
    Bereken $2\vect{u} - 3\vect{v}$ voor $\vect{u} = \vc{1}{-3}$ en $\vect{v} = \vc{-2}{2}$.
  antwoord: |-
    $\vc{8}{-12}$
  uitwerking: |-
    $\vc{2}{-6} - \vc{-6}{6} = \vc{8}{-12}$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    afstand tussen twee punten
  opgave: |-
    Bereken de afstand tussen $A\vc{-2}{-1}$ en $B\vc{4}{7}$.
  antwoord: |-
    $10$
  uitwerking: |-
    $\vect{AB} = \vc{6}{8}$, norm $\sqrt{100} = 10$.

- id: h2-t4
  soort: test
  niveau: 2
  thema: |-
    midden van een lijnstuk
  opgave: |-
    Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        het midden van $[AB]$ met $A\vc{-1}{5}$ en $B\vc{7}{-3}$
      antwoord: |-
        $\vc{3}{1}$
      uitwerking: |-
        $\bigl(\tfrac{-1 + 7}{2},\ \tfrac{5 - 3}{2}\bigr)$.
    - opgave: |-
        het punt $B$ als $A\vc{2}{2}$ en $M\vc{-1}{4}$ het midden van $[AB]$ is
      antwoord: |-
        $B\vc{-4}{6}$
      uitwerking: |-
        $\vect{AM} = \vc{-3}{2}$, dus $B = \vc{-1 - 3}{4 + 2}$.

- id: h2-t5
  soort: test
  niveau: 2
  thema: |-
    ontbinden met een stelsel
  opgave: |-
    Schrijf $\vc{4}{1}$ als $a\,\vc{1}{1} + b\,\vc{2}{-1}$.
  antwoord: |-
    $a = 2$, $b = 1$
  uitwerking: |-
    $a + 2b = 4$ en $a - b = 1$. Trek af: $3b = 3$, dus $b = 1$ en $a = 2$. Controle: $\vc{2}{2} + \vc{2}{-1} = \vc{4}{1}$.

- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    componenten uit norm en hoek
  opgave: |-
    Een kracht van $40$~N wijst naar rechts boven, onder $35^\circ$ met de horizontale. Bereken de componenten, afgerond op $0{,}01$~N.
  antwoord: |-
    $\vc{32{,}77}{22{,}94}$
  uitwerking: |-
    $40\cos 35^\circ \approx 32{,}77$ en $40\sin 35^\circ \approx 22{,}94$.

- id: h2-t7
  soort: test
  niveau: 2
  thema: |-
    norm en hoek uit componenten
  opgave: |-
    Bereken de norm van $\vc{-5}{12}$ en de scherpe hoek met de horizontale, afgerond op $0{,}01^\circ$.
  antwoord: |-
    $13$; $67{,}38^\circ$
  uitwerking: |-
    $\sqrt{25 + 144} = 13$ en $\tan^{-1}\tfrac{12}{5} \approx 67{,}38^\circ$. De vector wijst naar links boven.

- id: h2-t8
  soort: test
  niveau: 2
  pakketten: [5]
  thema: |-
    collineaire punten
  opgave: |-
    Liggen $A\vc{1}{-1}$, $B\vc{3}{2}$ en $C\vc{7}{8}$ op één rechte?
  antwoord: |-
    ja
  uitwerking: |-
    $\vect{AB} = \vc{2}{3}$ en $\vect{AC} = \vc{6}{9} = 3\,\vect{AB}$.

- id: h2-t8
  soort: test
  niveau: 2
  pakketten: [4]
  thema: |-
    parallellogram met componenten
  opgave: |-
    Bereken $D$ zodat $ABCD$ een parallellogram is, met $A\vc{-2}{1}$, $B\vc{2}{0}$ en $C\vc{3}{4}$.
  antwoord: |-
    $D\vc{-1}{5}$
  uitwerking: |-
    $\vect{AB} = \vc{4}{-1}$ en $\vect{DC} = \vect{AB}$, dus $D = \vc{3 - 4}{4 + 1}$.
