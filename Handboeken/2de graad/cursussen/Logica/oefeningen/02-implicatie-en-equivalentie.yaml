# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.
# pakketten: voldoende en nodig in 2-5 (h2-nodig, h2-o11, h2-t8), drie uitspraken in 2-5 (h2-o18),
# een afleiding zonder waarheidstabel in 5 (h2-o23).

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad De uitspraak $p$ is waar en $q$ is onwaar. Is de uitspraak waar of onwaar?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $p \en \niet q$
      antwoord: |-
        W
      uitwerking: |-
        W en W.
    - opgave: |-
        $\niet p \of q$
      antwoord: |-
        O
      uitwerking: |-
        O of O.
    - opgave: |-
        $\niet(p \of q)$
      antwoord: |-
        O
      uitwerking: |-
        $p \of q$ is W.
    - opgave: |-
        $\niet p \en \niet q$
      antwoord: |-
        O
      uitwerking: |-
        O en W.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Een vader belooft zijn dochter: \textit{Als je morgen je kamer opruimt, dan krijg je een ijsje.} Heeft de vader zijn belofte gebroken, of niet?
  lijst: enumerate
  delen:
    - opgave: |-
        De kamer is opgeruimd en ze krijgt een ijsje.
      antwoord: |-
        niet gebroken
      uitwerking: |-
        Hij doet wat hij beloofde.
    - opgave: |-
        De kamer is opgeruimd en ze krijgt geen ijsje.
      antwoord: |-
        gebroken
      uitwerking: |-
        Het enige geval waarin hij zijn woord niet houdt.
    - opgave: |-
        De kamer is niet opgeruimd en ze krijgt toch een ijsje.
      antwoord: |-
        niet gebroken
      uitwerking: |-
        Hij beloofde niets voor het geval dat de kamer niet opgeruimd is. Een ijsje mag altijd.
    - opgave: |-
        De kamer is niet opgeruimd en ze krijgt geen ijsje.
      antwoord: |-
        niet gebroken
      uitwerking: |-
        Ook hier beloofde hij niets.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h2-impl
  soort: kort
  opgave: |-
    Is de implicatie waar?
  lijst: enumerate
  delen:
    - opgave: |-
        Als $15$ deelbaar is door 5, dan is $15$ deelbaar door 10.
      antwoord: |-
        O
      uitwerking: |-
        W $\dan$ O: de rij WO.
    - opgave: |-
        Als $3 + 3 = 7$, dan is $6$ een priemgetal.
      antwoord: |-
        W
      uitwerking: |-
        O $\dan$ O: het als-deel is onwaar.
    - opgave: |-
        Als een vierkant een rechthoek is, dan heeft een vierkant vier rechte hoeken.
      antwoord: |-
        W
      uitwerking: |-
        W $\dan$ W.
    - opgave: |-
        Als $-4 > 1$, dan is $(-4)^2 > 1^2$.
      antwoord: |-
        W
      uitwerking: |-
        O $\dan$ W: het als-deel is onwaar.

- id: h2-wisk
  soort: kort
  opgave: |-
    Geef een tegenvoorbeeld om te tonen dat de implicatie onwaar is.
  lijst: enumerate
  delen:
    - opgave: |-
        Als een getal oneven is, dan is het een priemgetal.
      antwoord: |-
        bijvoorbeeld 9
      uitwerking: |-
        9 is oneven, maar $9 = 3 \cdot 3$.
    - opgave: |-
        Als $x^2 = 16$, dan is $x = 4$.
      antwoord: |-
        $x = -4$
      uitwerking: |-
        $(-4)^2 = 16$, maar $-4 \neq 4$.
    - opgave: |-
        Als een vierhoek vier rechte hoeken heeft, dan is hij een vierkant.
      antwoord: |-
        een rechthoek die geen vierkant is
      uitwerking: |-
        Een rechthoek van 2 bij 5 cm heeft vier rechte hoeken, maar geen vier gelijke zijden.

- id: h2-omgekeerd
  soort: kort
  opgave: |-
    Geef het omgekeerde van de implicatie. Is de implicatie waar? En het omgekeerde?
  lijst: enumerate
  delen:
    - opgave: |-
        Als een getal deelbaar is door 6, dan is het deelbaar door 3.
      antwoord: |-
        als een getal deelbaar is door 3, dan is het deelbaar door 6; implicatie W, omgekeerde O
      uitwerking: |-
        $6k = 3 \cdot 2k$. Het omgekeerde heeft het tegenvoorbeeld 9.
    - opgave: |-
        Als een driehoek gelijkzijdig is, dan is hij gelijkbenig.
      antwoord: |-
        als een driehoek gelijkbenig is, dan is hij gelijkzijdig; implicatie W, omgekeerde O
      uitwerking: |-
        Een gelijkzijdige driehoek heeft zeker twee gelijke zijden. Een driehoek met zijden 5, 5 en 3 is gelijkbenig maar niet gelijkzijdig.
    - opgave: |-
        Als een getal eindigt op 0, dan is het deelbaar door 10.
      antwoord: |-
        als een getal deelbaar is door 10, dan eindigt het op 0; beide W
      uitwerking: |-
        Beide richtingen kloppen.

- id: h2-contra
  soort: kort
  opgave: |-
    Geef de contrapositie.
  lijst: enumerate
  delen:
    - opgave: |-
        Als ik ziek ben, dan blijf ik thuis.
      antwoord: |-
        Als ik niet thuisblijf, dan ben ik niet ziek.
      uitwerking: |-
        $\niet q \dan \niet p$.
    - opgave: |-
        Als een getal deelbaar is door 9, dan is de som van zijn cijfers deelbaar door 9.
      antwoord: |-
        Als de som van de cijfers van een getal niet deelbaar is door 9, dan is het getal niet deelbaar door 9.
      uitwerking: |-
        Wissel en ontken beide delen.
    - opgave: |-
        Als $x > 3$, dan is $x^2 > 9$.
      antwoord: |-
        Als $x^2 \leqslant 9$, dan is $x \leqslant 3$.
      uitwerking: |-
        De ontkenning van $x^2 > 9$ is $x^2 \leqslant 9$.

- id: h2-nodig
  pakketten: [2, 3, 4, 5]
  soort: kort
  opgave: |-
    Vul aan met \textit{voldoende} of \textit{nodig}.
  lijst: enumerate
  delen:
    - opgave: |-
        Een ticket hebben is \ldots{} om binnen te mogen op het concert, maar je moet ook je identiteitskaart tonen.
      antwoord: |-
        nodig
      uitwerking: |-
        Zonder ticket mag je zeker niet binnen, maar met alleen een ticket nog niet.
    - opgave: |-
        Deelbaar zijn door 10 is \ldots{} om deelbaar te zijn door 5.
      antwoord: |-
        voldoende
      uitwerking: |-
        Als een getal deelbaar is door 10, dan is het deelbaar door 5.
    - opgave: |-
        Een rechte hoek hebben is \ldots{} om een vierkant te zijn.
      antwoord: |-
        nodig
      uitwerking: |-
        Als een vierhoek een vierkant is, dan heeft hij een rechte hoek. Het omgekeerde is onwaar.

- id: h2-equiv
  soort: kort
  opgave: |-
    Is de equivalentie waar? Onderzoek beide implicaties.
  lijst: enumerate
  delen:
    - opgave: |-
        Een getal is even als en slechts als zijn laatste cijfer even is.
      antwoord: |-
        W
      uitwerking: |-
        Beide richtingen kloppen: of een getal even is, hangt alleen af van het laatste cijfer.
    - opgave: |-
        $x^2 = 9$ als en slechts als $x = 3$.
      antwoord: |-
        O
      uitwerking: |-
        $x = 3 \dan x^2 = 9$ is waar, maar $x^2 = 9 \dan x = 3$ heeft het tegenvoorbeeld $x = -3$.
    - opgave: |-
        Een vierhoek is een rechthoek als en slechts als hij vier rechte hoeken heeft.
      antwoord: |-
        W
      uitwerking: |-
        Dat is de definitie van een rechthoek.

- id: h2-taut
  soort: kort
  opgave: |-
    Tautologie, contradictie of geen van beide? Maak een waarheidstabel.
  lijst: enumerate
  delen:
    - opgave: |-
        $p \dan (p \of q)$
      antwoord: |-
        tautologie
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $p \of q$ & $p \dan (p \of q)$ \\ \hline
        W & W & W & \res{W} \\ \hline
        W & O & W & \res{W} \\ \hline
        O & W & W & \res{W} \\ \hline
        O & O & O & \res{W} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $(p \of q) \dan p$
      antwoord: |-
        geen van beide
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $p \of q$ & $(p \of q) \dan p$ \\ \hline
        W & W & W & \res{W} \\ \hline
        W & O & W & \res{W} \\ \hline
        O & W & W & \res{O} \\ \hline
        O & O & O & \res{W} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $p \asa \niet p$
      antwoord: |-
        contradictie
      uitwerking: |-
        $p$ en $\niet p$ hebben nooit dezelfde waarheidswaarde: de kolom is O, O, O, O.

- id: h2-gelijkw
  soort: kort
  opgave: |-
    Toon met een waarheidstabel aan dat de uitspraak een tautologie is. Zeg in woorden wat ze betekent.
  lijst: enumerate
  delen:
    - opgave: |-
        $\niet(p \dan q) \asa (p \en \niet q)$
      antwoord: |-
        tautologie: een implicatie is onwaar als het als-deel waar is en het dan-deel onwaar
      uitwerking: |-
        \begin{waarheidstabel}{5}
        $p$ & $q$ & $\niet(p \dan q)$ & $p \en \niet q$ & $\asa$ \\ \hline
        W & W & O & O & W \\ \hline
        W & O & W & W & W \\ \hline
        O & W & O & O & W \\ \hline
        O & O & O & O & W \\ \hline
        \end{waarheidstabel}
        \par De laatste kolom is overal W.
    - opgave: |-
        $(p \asa q) \asa (q \asa p)$
      antwoord: |-
        tautologie: bij een equivalentie mag je de delen wisselen
      uitwerking: |-
        $p \asa q$ en $q \asa p$ zijn allebei W, O, O, W: hun equivalentie is overal W.

- id: h2-redeneer
  soort: kort
  opgave: |-
    Is de redenering geldig? Schrijf ze in symbolen en controleer met een waarheidstabel.
  lijst: enumerate
  delen:
    - opgave: |-
        Als het vriest, is de vijver bevroren. Het vriest niet. Dus de vijver is niet bevroren.
      antwoord: |-
        niet geldig
      uitwerking: |-
        $\bigl((p \dan q) \en \niet p\bigr) \dan \niet q$ is O in de rij OW: het vriest niet, en de vijver is nog bevroren van gisteren.
    - opgave: |-
        Als het vriest, is de vijver bevroren. De vijver is niet bevroren. Dus het vriest niet.
      antwoord: |-
        geldig
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $(p \dan q) \en \niet q$ & $\bigl((p \dan q) \en \niet q\bigr) \dan \niet p$ \\ \hline
        W & W & O & \res{W} \\ \hline
        W & O & O & \res{W} \\ \hline
        O & W & O & \res{W} \\ \hline
        O & O & W & \res{W} \\ \hline
        \end{waarheidstabel}
        \par Een tautologie: het is de contrapositie.

# --- Opdrachten: niveau 1 --------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    waarheidswaarde van implicaties en equivalenties
  opgave: |-
    Is de uitspraak waar?
  lijst: enumerate
  delen:
    - opgave: |-
        Als $5 > 3$, dan is $5^2 > 3^2$.
      antwoord: |-
        W
      uitwerking: |-
        W $\dan$ W: $25 > 9$.
    - opgave: |-
        Als $4$ een priemgetal is, dan is $4$ oneven.
      antwoord: |-
        W
      uitwerking: |-
        O $\dan$ O.
    - opgave: |-
        Als $10$ even is, dan is $10$ deelbaar door 4.
      antwoord: |-
        O
      uitwerking: |-
        W $\dan$ O.
    - opgave: |-
        Als een kubus 8 hoekpunten heeft, dan heeft hij 12 ribben.
      antwoord: |-
        W
      uitwerking: |-
        W $\dan$ W.
    - opgave: |-
        $\sqrt9 = 3$ als en slechts als $3^2 = 9$.
      antwoord: |-
        W
      uitwerking: |-
        W $\asa$ W.
    - opgave: |-
        $7$ is even als en slechts als $8$ is oneven.
      antwoord: |-
        W
      uitwerking: |-
        O $\asa$ O: dezelfde waarheidswaarde.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    waarheidswaarde bij gegeven waarheidswaarden
  opgave: |-
    De uitspraken $p$ en $r$ zijn waar, de uitspraak $q$ is onwaar. Is de uitspraak waar of onwaar?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $p \dan q$
      antwoord: |-
        O
      uitwerking: |-
        W $\dan$ O.
    - opgave: |-
        $q \dan p$
      antwoord: |-
        W
      uitwerking: |-
        O $\dan$ W.
    - opgave: |-
        $\niet p \dan q$
      antwoord: |-
        W
      uitwerking: |-
        O $\dan$ O.
    - opgave: |-
        $p \asa \niet q$
      antwoord: |-
        W
      uitwerking: |-
        W $\asa$ W.
    - opgave: |-
        $(p \en q) \dan r$
      antwoord: |-
        W
      uitwerking: |-
        Het als-deel is O.
    - opgave: |-
        $p \dan (q \of r)$
      antwoord: |-
        W
      uitwerking: |-
        W $\dan$ W.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    waarheidstabellen met implicatie en equivalentie (drill)
  opgave: |-
    Maak de waarheidstabel.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $q \dan p$
      antwoord: |-
        W, W, O, W
      uitwerking: |-
        \begin{waarheidstabel}{3}
        $p$ & $q$ & $q \dan p$ \\ \hline
        W & W & \res{W} \\ \hline
        W & O & \res{W} \\ \hline
        O & W & \res{O} \\ \hline
        O & O & \res{W} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $\niet p \dan q$
      antwoord: |-
        W, W, W, O
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $\niet p$ & $\niet p \dan q$ \\ \hline
        W & W & O & \res{W} \\ \hline
        W & O & O & \res{W} \\ \hline
        O & W & W & \res{W} \\ \hline
        O & O & W & \res{O} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $p \dan \niet q$
      antwoord: |-
        O, W, W, W
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $\niet q$ & $p \dan \niet q$ \\ \hline
        W & W & O & \res{O} \\ \hline
        W & O & W & \res{W} \\ \hline
        O & W & O & \res{W} \\ \hline
        O & O & W & \res{W} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $(p \dan q) \en p$
      antwoord: |-
        W, O, O, O
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $p \dan q$ & $(p \dan q) \en p$ \\ \hline
        W & W & W & \res{W} \\ \hline
        W & O & O & \res{O} \\ \hline
        O & W & W & \res{O} \\ \hline
        O & O & W & \res{O} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $p \asa \niet q$
      antwoord: |-
        O, W, W, O
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $\niet q$ & $p \asa \niet q$ \\ \hline
        W & W & O & \res{O} \\ \hline
        W & O & W & \res{W} \\ \hline
        O & W & O & \res{W} \\ \hline
        O & O & W & \res{O} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $\niet p \dan \niet q$
      antwoord: |-
        W, W, O, W
      uitwerking: |-
        \begin{waarheidstabel}{5}
        $p$ & $q$ & $\niet p$ & $\niet q$ & $\niet p \dan \niet q$ \\ \hline
        W & W & O & O & \res{W} \\ \hline
        W & O & O & W & \res{W} \\ \hline
        O & W & W & O & \res{O} \\ \hline
        O & O & W & W & \res{W} \\ \hline
        \end{waarheidstabel}
        \par Dezelfde kolom als $q \dan p$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    omgekeerde en contrapositie
  opgave: |-
    Schrijf het omgekeerde en de contrapositie. Welke van de drie uitspraken zijn waar?
  lijst: enumerate
  delen:
    - opgave: |-
        Als een getal eindigt op 5, dan is het deelbaar door 5.
      antwoord: |-
        omgekeerde: als een getal deelbaar is door 5, dan eindigt het op 5 (O); contrapositie: als een getal niet deelbaar is door 5, dan eindigt het niet op 5 (W); de implicatie is W
      uitwerking: |-
        Het omgekeerde heeft het tegenvoorbeeld 10. De contrapositie is gelijkwaardig met de implicatie.
    - opgave: |-
        Als een vierhoek een rechthoek is, dan zijn zijn diagonalen even lang.
      antwoord: |-
        omgekeerde: als de diagonalen van een vierhoek even lang zijn, dan is hij een rechthoek (O); contrapositie: als de diagonalen niet even lang zijn, dan is de vierhoek geen rechthoek (W); de implicatie is W
      uitwerking: |-
        Een gelijkbenig trapezium heeft even lange diagonalen en is geen rechthoek.
    - opgave: |-
        Als $x = 3$, dan is $2x + 1 = 7$.
      antwoord: |-
        omgekeerde: als $2x + 1 = 7$, dan is $x = 3$ (W); contrapositie: als $2x + 1 \neq 7$, dan is $x \neq 3$ (W); de implicatie is W
      uitwerking: |-
        $2x + 1 = 7$ heeft alleen de oplossing $x = 3$: alle drie zijn waar.
    - opgave: |-
        Als ik de loterij win, dan koop ik een nieuwe fiets.
      antwoord: |-
        omgekeerde: als ik een nieuwe fiets koop, dan heb ik de loterij gewonnen; contrapositie: als ik geen nieuwe fiets koop, dan heb ik de loterij niet gewonnen
      uitwerking: |-
        Of de implicatie waar is, weet alleen de spreker. Is ze waar, dan ook de contrapositie, maar niet zeker het omgekeerde: je kunt ook een fiets kopen met je spaargeld.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    tegenvoorbeelden
  opgave: |-
    Toon met een tegenvoorbeeld aan dat de implicatie onwaar is.
  lijst: enumerate
  delen:
    - opgave: |-
        Als $n$ een priemgetal is, dan is $n$ oneven.
      antwoord: |-
        $n = 2$
      uitwerking: |-
        2 is een priemgetal en even.
    - opgave: |-
        Als $x^2 = 25$, dan is $x = 5$.
      antwoord: |-
        $x = -5$
      uitwerking: |-
        $(-5)^2 = 25$.
    - opgave: |-
        Als een vierhoek twee paar evenwijdige zijden heeft, dan is hij een rechthoek.
      antwoord: |-
        een parallellogram zonder rechte hoeken
      uitwerking: |-
        Bijvoorbeeld een parallellogram met hoeken van $60^\circ$ en $120^\circ$.
    - opgave: |-
        Als $a > b$, dan is $a^2 > b^2$.
      antwoord: |-
        bijvoorbeeld $a = 1$ en $b = -3$
      uitwerking: |-
        $1 > -3$, maar $1^2 = 1 < 9 = (-3)^2$.
    - opgave: |-
        Als een getal deelbaar is door 2 en door 4, dan is het deelbaar door 8.
      antwoord: |-
        bijvoorbeeld 4 of 12
      uitwerking: |-
        12 is deelbaar door 2 en door 4, maar $12 : 8 = 1,5$.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    van symbolen naar woorden
  opgave: |-
    Neem $p$:~\textit{Ik ben ziek} en $q$:~\textit{Ik blijf thuis}. Schrijf in woorden.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $p \dan q$
      antwoord: |-
        Als ik ziek ben, dan blijf ik thuis.
      uitwerking: |-
        De implicatie.
    - opgave: |-
        $q \dan p$
      antwoord: |-
        Als ik thuisblijf, dan ben ik ziek.
      uitwerking: |-
        Het omgekeerde.
    - opgave: |-
        $\niet q \dan \niet p$
      antwoord: |-
        Als ik niet thuisblijf, dan ben ik niet ziek.
      uitwerking: |-
        De contrapositie.
    - opgave: |-
        $p \asa q$
      antwoord: |-
        Ik ben ziek als en slechts als ik thuisblijf.
      uitwerking: |-
        Ook: ik blijf thuis als ik ziek ben, en alleen dan.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    equivalenties met getallen en figuren
  opgave: |-
    Is de equivalentie waar? Geef bij een onware equivalentie een tegenvoorbeeld voor de richting die niet klopt.
  lijst: enumerate
  delen:
    - opgave: |-
        Een getal is deelbaar door 6 als en slechts als het deelbaar is door 2 en door 3.
      antwoord: |-
        W
      uitwerking: |-
        Beide richtingen kloppen.
    - opgave: |-
        Een getal is deelbaar door 10 als en slechts als het deelbaar is door 5.
      antwoord: |-
        O; 15 is deelbaar door 5 maar niet door 10
      uitwerking: |-
        Deelbaar door 10 $\dan$ deelbaar door 5 is waar; het omgekeerde niet.
    - opgave: |-
        Een driehoek is gelijkbenig als en slechts als hij twee gelijke hoeken heeft.
      antwoord: |-
        W
      uitwerking: |-
        De hoeken tegenover de twee gelijke zijden zijn gelijk, en omgekeerd.
    - opgave: |-
        $x^2 > 0$ als en slechts als $x > 0$.
      antwoord: |-
        O; $x = -2$
      uitwerking: |-
        $(-2)^2 = 4 > 0$, maar $-2 < 0$. De richting $x > 0 \dan x^2 > 0$ is wel waar.

# --- Opdrachten: niveau 2 --------------------------------------------------------------

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    tautologie en contradictie
  opgave: |-
    Tautologie, contradictie of geen van beide? Maak een waarheidstabel.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $p \dan p$
      antwoord: |-
        tautologie
      uitwerking: |-
        W $\dan$ W en O $\dan$ O zijn allebei W.
    - opgave: |-
        $(p \en \niet p) \dan q$
      antwoord: |-
        tautologie
      uitwerking: |-
        Het als-deel is een contradictie, dus altijd O: de implicatie is altijd W.
    - opgave: |-
        $p \dan (q \dan p)$
      antwoord: |-
        tautologie
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $q \dan p$ & $p \dan (q \dan p)$ \\ \hline
        W & W & W & \res{W} \\ \hline
        W & O & W & \res{W} \\ \hline
        O & W & O & \res{W} \\ \hline
        O & O & W & \res{W} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $\niet\bigl(p \dan (p \of q)\bigr)$
      antwoord: |-
        contradictie
      uitwerking: |-
        $p \dan (p \of q)$ is een tautologie (korte oefening): de negatie is overal O.
    - opgave: |-
        $(p \dan q) \of (q \dan p)$
      antwoord: |-
        tautologie
      uitwerking: |-
        \begin{waarheidstabel}{5}
        $p$ & $q$ & $p \dan q$ & $q \dan p$ & $(p \dan q) \of (q \dan p)$ \\ \hline
        W & W & W & W & \res{W} \\ \hline
        W & O & O & W & \res{W} \\ \hline
        O & W & W & O & \res{W} \\ \hline
        O & O & W & W & \res{W} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $(p \dan q) \dan p$
      antwoord: |-
        geen van beide
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $p \dan q$ & $(p \dan q) \dan p$ \\ \hline
        W & W & W & \res{W} \\ \hline
        W & O & O & \res{W} \\ \hline
        O & W & W & \res{O} \\ \hline
        O & O & W & \res{O} \\ \hline
        \end{waarheidstabel}

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    kaarten omdraaien in een context
  figuur:
    code: |-
      \begin{tikzpicture}[font=\scriptsize]
        \foreach \x/\t in {0/bier,1.1/cola,2.2/15 jaar,3.3/17 jaar}{%
          \draw[grijs,rounded corners=2pt] (\x,0) rectangle (\x+.95,1.25);
          \node at (\x+.475,.62) {\t};}
      \end{tikzpicture}
  opgave: |-
    In een jeugdhuis geldt de regel: \textit{Als je bier drinkt, dan ben je minstens 16 jaar.} Op elke kaart staat aan de ene kant wat iemand drinkt en aan de andere kant zijn leeftijd. Welke kaarten moet je omdraaien om te controleren of de regel nageleefd wordt? Verklaar met de rij WO en de contrapositie.
  antwoord: |-
    bier en 15 jaar
  uitwerking: |-
    Neem $p$:~\textit{drinkt bier} en $q$:~\textit{is minstens 16}. De kaart \textit{bier} ($p$ waar) kan de rij WO zijn. De kaart \textit{15 jaar} ($q$ onwaar) ook: volgens de contrapositie mag wie geen 16 is, geen bier drinken. Bij \textit{cola} is het als-deel onwaar, bij \textit{17 jaar} het dan-deel waar: daar is de regel sowieso nageleefd. Dit is hetzelfde probleem als de kaarten aan het begin van het hoofdstuk, maar de meeste mensen vinden het hier veel makkelijker.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    alleen als, als en slechts als, zonder
  opgave: |-
    Neem $p$:~\textit{Je mag mee} en $q$:~\textit{Je hebt een ticket}. Schrijf in symbolen. Welke uitspraken zijn gelijkwaardig?
  lijst: enumerate
  delen:
    - opgave: |-
        Je mag alleen mee als je een ticket hebt.
      antwoord: |-
        $p \dan q$
      uitwerking: |-
        \textit{Alleen als} wijst het dan-deel aan: wie meemag, heeft zeker een ticket.
    - opgave: |-
        Als je een ticket hebt, mag je mee.
      antwoord: |-
        $q \dan p$
      uitwerking: |-
        Het ticket is hier het als-deel.
    - opgave: |-
        Zonder ticket mag je niet mee.
      antwoord: |-
        $\niet q \dan \niet p$
      uitwerking: |-
        De contrapositie van $p \dan q$.
    - opgave: |-
        Je mag mee als en slechts als je een ticket hebt.
      antwoord: |-
        $p \asa q$; a en c zijn gelijkwaardig
      uitwerking: |-
        a en c zijn gelijkwaardig (contrapositie). b is het omgekeerde van a. d zegt a en b samen.

- id: h2-o11
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    voldoende en nodige voorwaarde
  opgave: |-
    Vul aan met \textit{voldoende}, \textit{nodig} of \textit{nodig en voldoende}.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = 2$ is een \ldots{} voorwaarde voor $x^2 = 4$.
      antwoord: |-
        voldoende
      uitwerking: |-
        $x = 2 \dan x^2 = 4$ is waar; het omgekeerde niet ($x = -2$).
    - opgave: |-
        Een rijbewijs hebben is een \ldots{} voorwaarde om met de auto op de openbare weg te mogen rijden.
      antwoord: |-
        nodig
      uitwerking: |-
        Wie mag rijden, heeft een rijbewijs. Maar de auto moet ook verzekerd zijn: het is niet voldoende.
    - opgave: |-
        Even zijn en deelbaar zijn door 3 is een \ldots{} voorwaarde om deelbaar te zijn door 6.
      antwoord: |-
        nodig en voldoende
      uitwerking: |-
        Dat is een equivalentie.
    - opgave: |-
        Vier gelijke zijden hebben is een \ldots{} voorwaarde voor een vierhoek om een vierkant te zijn.
      antwoord: |-
        nodig
      uitwerking: |-
        Elk vierkant heeft vier gelijke zijden, maar een ruit ook.
    - opgave: |-
        Een even getal als laatste cijfer hebben is een \ldots{} voorwaarde om deelbaar te zijn door 4.
      antwoord: |-
        nodig
      uitwerking: |-
        Elk veelvoud van 4 is even. Maar 14 eindigt op 4 en is niet deelbaar door 4.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    gelijkwaardige uitspraken met de implicatie
  opgave: |-
    Zijn de twee uitspraken gelijkwaardig? Controleer met een waarheidstabel.
  lijst: enumerate
  delen:
    - opgave: |-
        $p \dan q$ \ en \ $q \dan p$
      antwoord: |-
        nee
      uitwerking: |-
        W, O, W, W tegenover W, W, O, W.
    - opgave: |-
        $\niet(p \dan q)$ \ en \ $p \en \niet q$
      antwoord: |-
        ja
      uitwerking: |-
        Allebei O, W, O, O.
    - opgave: |-
        $p \dan q$ \ en \ $\niet p \dan \niet q$
      antwoord: |-
        nee
      uitwerking: |-
        W, O, W, W tegenover W, W, O, W: $\niet p \dan \niet q$ is gelijkwaardig met het omgekeerde.
    - opgave: |-
        $p \dan \niet q$ \ en \ $q \dan \niet p$
      antwoord: |-
        ja
      uitwerking: |-
        Allebei O, W, W, W. Het zijn elkaars contrapositie.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    geldige en ongeldige redeneringen
  opgave: |-
    Is de redenering geldig? Leg uit, of geef een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        Als het onweert, gaat de match niet door. Het onweert. Dus de match gaat niet door.
      antwoord: |-
        geldig
      uitwerking: |-
        De vorm $\bigl((p \dan q) \en p\bigr) \dan q$ is een tautologie.
    - opgave: |-
        Als ik studeer, slaag ik. Ik ben geslaagd. Dus ik heb gestudeerd.
      antwoord: |-
        niet geldig
      uitwerking: |-
        De vorm $\bigl((p \dan q) \en q\bigr) \dan p$. Tegenvoorbeeld: ik slaag zonder te studeren (rij OW).
    - opgave: |-
        Als een getal deelbaar is door 6, dan is het even. 35 is niet even. Dus 35 is niet deelbaar door 6.
      antwoord: |-
        geldig
      uitwerking: |-
        De vorm $\bigl((p \dan q) \en \niet q\bigr) \dan \niet p$ is een tautologie: de contrapositie.
    - opgave: |-
        Als het sneeuwt, is het koud. Het sneeuwt niet. Dus het is niet koud.
      antwoord: |-
        niet geldig
      uitwerking: |-
        De vorm $\bigl((p \dan q) \en \niet p\bigr) \dan \niet q$. Tegenvoorbeeld: een koude, droge dag (rij OW).

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    een implicatie ontkennen
  opgave: |-
    De ontkenning van $p \dan q$ is gelijkwaardig met $p \en \niet q$ (zie de korte oefening over tautologieën). Ontken de uitspraak zonder de woorden \textit{het is niet waar dat}.
  lijst: enumerate
  delen:
    - opgave: |-
        Als het regent, neem ik de bus.
      antwoord: |-
        Het regent en ik neem de bus niet.
      uitwerking: |-
        $p \en \niet q$.
    - opgave: |-
        Als je wint, krijg je een medaille.
      antwoord: |-
        Je wint en je krijgt geen medaille.
      uitwerking: |-
        Pas op: \textit{als je wint, krijg je geen medaille} is niet de ontkenning.
    - opgave: |-
        Als een getal deelbaar is door 4, dan is het even.
      antwoord: |-
        Er is een getal dat deelbaar is door 4 en oneven is.
      uitwerking: |-
        Met een letter: de ontkenning zegt dat er een tegenvoorbeeld is. Die is hier onwaar.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    of herschrijven als implicatie
  opgave: |-
    De implicatie $p \dan q$ is gelijkwaardig met $\niet p \of q$. Schrijf de uitspraak als een implicatie.
  lijst: enumerate
  delen:
    - opgave: |-
        Je bent niet ingeschreven of je krijgt een e-mail.
      antwoord: |-
        Als je ingeschreven bent, dan krijg je een e-mail.
      uitwerking: |-
        $\niet p \of q$ met $p$:~\textit{je bent ingeschreven}.
    - opgave: |-
        Je draagt een helm of je mag niet op de go-kartbaan.
      antwoord: |-
        Als je op de go-kartbaan mag, dan draag je een helm.
      uitwerking: |-
        $q \of \niet p$ met $p$:~\textit{je mag op de baan} en $q$:~\textit{je draagt een helm}. Ook goed: \textit{als je geen helm draagt, mag je niet op de baan}.
    - opgave: |-
        $n$ is oneven of $n^2$ is even.
      antwoord: |-
        Als $n$ even is, dan is $n^2$ even.
      uitwerking: |-
        \textit{$n$ is oneven} is $\niet p$ met $p$:~\textit{$n$ is even}.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    implicaties met figuren, omgekeerde
  opgave: |-
    Is de implicatie waar? Geef anders een tegenvoorbeeld. Onderzoek ook het omgekeerde.
  lijst: enumerate
  delen:
    - opgave: |-
        Als een vierhoek een vierkant is, dan is hij een ruit.
      antwoord: |-
        W; het omgekeerde is O
      uitwerking: |-
        Een vierkant heeft vier gelijke zijden. Een ruit met een hoek van $60^\circ$ is geen vierkant.
    - opgave: |-
        Als een driehoek twee gelijke hoeken heeft, dan is hij gelijkbenig.
      antwoord: |-
        W; het omgekeerde is ook W
      uitwerking: |-
        De twee implicaties samen zijn een equivalentie (zie opdracht over equivalenties met figuren).
    - opgave: |-
        Als de diagonalen van een vierhoek even lang zijn, dan is hij een rechthoek.
      antwoord: |-
        O (gelijkbenig trapezium); het omgekeerde is W
      uitwerking: |-
        Een gelijkbenig trapezium heeft even lange diagonalen. Een rechthoek heeft wel altijd even lange diagonalen.
    - opgave: |-
        Als een driehoek een stompe hoek heeft, dan zijn de andere twee hoeken scherp.
      antwoord: |-
        W; het omgekeerde is O
      uitwerking: |-
        De andere twee hoeken zijn samen minder dan $90^\circ$. Omgekeerd: een gelijkzijdige driehoek heeft twee scherpe hoeken en geen stompe hoek.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    raadsel met eerlijken en leugenaars
  opgave: |-
    Op het eiland uit hoofdstuk 1 wonen eerlijken, die altijd de waarheid spreken, en leugenaars, die altijd liegen. Mo zegt: \textit{Als ik eerlijk ben, dan is Noor ook eerlijk.} Neem $m$:~\textit{Mo is eerlijk} en $n$:~\textit{Noor is eerlijk}. Wie is eerlijk en wie liegt?
  antwoord: |-
    Mo en Noor zijn allebei eerlijk.
  uitwerking: |-
    Mo zegt $m \dan n$: W, O, W, W. Een rij kan als die waarde gelijk is aan $m$. WW: W, en Mo is eerlijk: kan. WO: O, maar Mo is eerlijk: kan niet. OW en OO: W, maar Mo liegt: kan niet.

- id: h2-o18
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 3
  thema: |-
    redeneren in een ketting, drie uitspraken
  opgave: |-
    \textit{Als het regent, blijf ik binnen. Als ik binnen blijf, ga ik gamen. Dus als het regent, ga ik gamen.}
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf de redenering in symbolen.
      antwoord: |-
        $\bigl((p \dan q) \en (q \dan r)\bigr) \dan (p \dan r)$
      uitwerking: |-
        Met $p$:~\textit{het regent}, $q$:~\textit{ik blijf binnen}, $r$:~\textit{ik ga gamen}.
    - opgave: |-
        Toon met een waarheidstabel aan dat de redenering geldig is.
      antwoord: |-
        de laatste kolom is overal W
      uitwerking: |-
        \begin{waarheidstabel}{7}
        $p$ & $q$ & $r$ & $p \dan q$ & $q \dan r$ & $p \dan r$ & geheel \\ \hline
        W & W & W & W & W & W & \res{W} \\ \hline
        W & W & O & W & O & O & \res{W} \\ \hline
        W & O & W & O & W & W & \res{W} \\ \hline
        W & O & O & O & W & O & \res{W} \\ \hline
        O & W & W & W & W & W & \res{W} \\ \hline
        O & W & O & W & O & W & \res{W} \\ \hline
        O & O & W & W & W & W & \res{W} \\ \hline
        O & O & O & W & W & W & \res{W} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        Gebruik dezelfde redenering met getallen: als een getal deelbaar is door 8, dan is het deelbaar door 4. Wat volgt er nog als je weet dat elk getal dat deelbaar is door 4 even is?
      antwoord: |-
        als een getal deelbaar is door 8, dan is het even
      uitwerking: |-
        $p$:~\textit{deelbaar door 8}, $q$:~\textit{deelbaar door 4}, $r$:~\textit{even}.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    redeneren met waarheidswaarden
  opgave: |-
    Wat weet je over de waarheidswaarden van $p$ en $q$?
  lijst: enumerate
  delen:
    - opgave: |-
        $p \dan q$ is onwaar.
      antwoord: |-
        $p$ is waar en $q$ is onwaar.
      uitwerking: |-
        Een implicatie is alleen onwaar in de rij WO.
    - opgave: |-
        $p \dan q$ is waar en $p$ is waar.
      antwoord: |-
        $q$ is waar.
      uitwerking: |-
        In de rijen met $p$ waar is alleen WW mogelijk.
    - opgave: |-
        $p \dan q$ is waar en $q$ is onwaar.
      antwoord: |-
        $p$ is onwaar.
      uitwerking: |-
        In de rijen met $q$ onwaar is alleen OO mogelijk.
    - opgave: |-
        $p \asa q$ is waar en $p$ is onwaar.
      antwoord: |-
        $q$ is onwaar.
      uitwerking: |-
        Dezelfde waarheidswaarde.
    - opgave: |-
        $p \dan q$ is waar en $q$ is waar.
      antwoord: |-
        Over $p$ weet je niets.
      uitwerking: |-
        De rijen WW en OW zijn allebei mogelijk.

- id: h2-o21
  soort: opdracht
  niveau: 2
  thema: |-
    kaarten omdraaien met klinkers en getallen
  figuur:
    code: |-
      \begin{tikzpicture}[font=\small]
        \foreach \x/\t in {0/A,1/K,2/4,3/7}{%
          \draw[grijs,rounded corners=2pt] (\x,0) rectangle (\x+.8,1.1);
          \node at (\x+.4,.55) {\t};}
      \end{tikzpicture}
  opgave: |-
    Op elke kaart staat aan de ene kant een letter en aan de andere kant een getal. De regel is: \textit{Als er aan de ene kant een klinker staat, dan staat er aan de andere kant een even getal.} Welke kaarten moet je omdraaien om de regel te controleren?
  antwoord: |-
    A en 7
  uitwerking: |-
    A: het als-deel is waar, het dan-deel moet gecontroleerd worden. 7: het dan-deel is onwaar; volgens de contrapositie moet er een medeklinker achter staan. K: het als-deel is onwaar. 4: het dan-deel is waar. De regel zegt niets over wat achter een even getal staat.

# --- Opdrachten: niveau 3 --------------------------------------------------------------

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    equivalentie zonder pijlen schrijven
  opgave: |-
    Je weet: $p \asa q$ is gelijkwaardig met $(p \dan q) \en (q \dan p)$, en $p \dan q$ is gelijkwaardig met $\niet p \of q$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $p \asa q$ met alleen de tekens $\niet$, $\en$ en $\of$.
      antwoord: |-
        $(\niet p \of q) \en (\niet q \of p)$
      uitwerking: |-
        Vervang elke implicatie door de gelijkwaardige disjunctie.
    - opgave: |-
        Controleer je antwoord met een waarheidstabel.
      antwoord: |-
        de laatste kolom is W, O, O, W
      uitwerking: |-
        \begin{waarheidstabel}{5}
        $p$ & $q$ & $\niet p \of q$ & $\niet q \of p$ & $(\niet p \of q) \en (\niet q \of p)$ \\ \hline
        W & W & W & W & \res{W} \\ \hline
        W & O & O & W & \res{O} \\ \hline
        O & W & W & O & \res{O} \\ \hline
        O & O & W & W & \res{W} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        Zoek nog een uitspraak met alleen $\niet$, $\en$ en $\of$ die gelijkwaardig is met $p \asa q$.
      antwoord: |-
        bijvoorbeeld $(p \en q) \of (\niet p \en \niet q)$
      uitwerking: |-
        Een equivalentie is waar als beide waar zijn of beide onwaar.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    een uitspraak die niemand kan doen
  opgave: |-
    Op het eiland uit hoofdstuk 1 zegt iemand: \textit{Ik ben een leugenaar.}
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat geen enkele eilandbewoner dat kan zeggen.
      antwoord: |-
        een eerlijke zou liegen, een leugenaar zou de waarheid spreken
      uitwerking: |-
        Neem $p$:~\textit{de spreker is eerlijk}. Hij zegt $\niet p$. Een rij kan als $\niet p$ dezelfde waarde heeft als $p$, dus als $p \asa \niet p$ waar is. Maar dat is een contradictie: geen enkele rij kan.
    - opgave: |-
        Iemand zegt: \textit{Ik ben eerlijk.} Wat weet je over die persoon?
      antwoord: |-
        niets
      uitwerking: |-
        Nu moet $p \asa p$ waar zijn, en dat is een tautologie: beide rijen kunnen. Een eerlijke kan dat zeggen, en een leugenaar ook.
    - opgave: |-
        Bedenk zelf een zin die een eilandbewoner kan zeggen en waaruit je meteen weet dat hij eerlijk is.
      antwoord: |-
        bijvoorbeeld: \textit{2 is een even getal.}
      uitwerking: |-
        Zoek een uitspraak die waar is en die een leugenaar dus niet kan zeggen, zoals \textit{2 is even}. Wie dat zegt, spreekt de waarheid en is dus eerlijk. Elke ware uitspraak werkt.

- id: h2-o23
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    contrapositie zonder waarheidstabel
  opgave: |-
    Je weet: $p \dan q$ is gelijkwaardig met $\niet p \of q$, $\niet(\niet p)$ is gelijkwaardig met $p$, en bij \textit{of} mag je de delen wisselen. Toon daarmee, zonder waarheidstabel, aan dat $\niet q \dan \niet p$ gelijkwaardig is met $p \dan q$.
  antwoord: |-
    $\niet q \dan \niet p$, \ $\niet\niet q \of \niet p$, \ $q \of \niet p$, \ $\niet p \of q$, \ $p \dan q$
  uitwerking: |-
    $\niet q \dan \niet p$ is gelijkwaardig met $\niet(\niet q) \of \niet p$ (de regel voor de implicatie, met $\niet q$ als als-deel), dus met $q \of \niet p$ (dubbele ontkenning), dus met $\niet p \of q$ (wisselen), en dat is $p \dan q$. Zo bewijs je een gelijkwaardigheid met regels die al vastliggen, net zoals je in de algebra een uitdrukking stap voor stap omvormt.

