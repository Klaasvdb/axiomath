- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    Schrijf het omgekeerde en de contrapositie van \textit{als een getal deelbaar is door 9, dan is het deelbaar door 3}. Welke van de drie uitspraken zijn waar?
  antwoord: |-
    omgekeerde: als een getal deelbaar is door 3, dan is het deelbaar door 9 (O); contrapositie: als een getal niet deelbaar is door 3, dan is het niet deelbaar door 9 (W); de implicatie is W
  uitwerking: |-
    $9k = 3 \cdot 3k$. Het omgekeerde heeft het tegenvoorbeeld 6. De contrapositie is gelijkwaardig met de implicatie.

- id: h2-t4
