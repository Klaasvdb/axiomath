    \begin{waarheidstabel}{6}
    $p$ & $q$ & $r$ & $\niet q$ & $\niet q \en r$ & $p \of (\niet q \en r)$ \\ \hline
    W & W & W & O & O & \res{W} \\ \hline
    W & W & O & O & O & \res{W} \\ \hline
    W & O & W & W & W & \res{W} \\ \hline
    W & O & O & W & O & \res{W} \\ \hline
    O & W & W & O & O & \res{O} \\ \hline
