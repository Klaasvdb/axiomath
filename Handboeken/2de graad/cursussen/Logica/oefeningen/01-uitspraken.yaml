- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Is de zin een uitspraak? Geef bij een uitspraak de waarheidswaarde.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $5 \cdot 6 = 35$
      antwoord: |-
        uitspraak, O
      uitwerking: |-
        $5 \cdot 6 = 30$.
    - opgave: |-
        Schrijf je naam op je blad.
      antwoord: |-
        geen uitspraak
      uitwerking: |-
        Een opdracht.
    - opgave: |-
        Een rechthoek heeft twee diagonalen.
      antwoord: |-
        uitspraak, W
      uitwerking: |-
        $AC$ en $BD$.
    - opgave: |-
        $3x > 6$
      antwoord: |-
        geen uitspraak (open zin)
      uitwerking: |-
        Waar voor $x > 2$, anders onwaar.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Ontken de uitspraak, zonder de woorden \textit{het is niet waar dat}.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        Het venster is open.
      antwoord: |-
        Het venster is niet open (dicht).
      uitwerking: |-
        Een venster is open of dicht.
    - opgave: |-
        $14$ is deelbaar door $4$.
      antwoord: |-
        $14$ is niet deelbaar door $4$.
      uitwerking: |-
        $14 : 4 = 3,5$.
    - opgave: |-
        $-2 > -3$
      antwoord: |-
        $-2 \leqslant -3$
      uitwerking: |-
        Niet groter dan is kleiner dan of gelijk aan.

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    De uitspraak $p$ is onwaar en de uitspraak $q$ is waar. Is de samengestelde uitspraak waar of onwaar?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $p \en q$
      antwoord: |-
        O
      uitwerking: |-
        O en W.
    - opgave: |-
        $p \of q$
      antwoord: |-
        W
      uitwerking: |-
        O of W.
    - opgave: |-
        $\niet p \en q$
      antwoord: |-
        W
      uitwerking: |-
        W en W.
    - opgave: |-
        $p \of \niet q$
      antwoord: |-
        O
      uitwerking: |-
        O of O.

- id: h1-t4
  soort: test
  niveau: 1
  opgave: |-
    Maak de waarheidstabel van $\niet(p \of \niet q)$.
  antwoord: |-
    O, O, W, O
  uitwerking: |-
    \begin{waarheidstabel}{5}
    $p$ & $q$ & $\niet q$ & $p \of \niet q$ & $\niet(p \of \niet q)$ \\ \hline
    W & W & O & W & \res{O} \\ \hline
    W & O & W & W & \res{O} \\ \hline
    O & W & O & O & \res{W} \\ \hline
    O & O & W & W & \res{O} \\ \hline
    \end{waarheidstabel}

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    Neem $p$:~\textit{Ik heb een gsm} en $q$:~\textit{Ik heb een tablet}. Schrijf in symbolen.
  lijst: enumerate
  delen:
    - opgave: |-
        Ik heb een gsm, maar geen tablet.
      antwoord: |-
        $p \en \niet q$
      uitwerking: |-
        \textit{Maar} is \textit{en}.
    - opgave: |-
        Ik heb noch een gsm, noch een tablet.
      antwoord: |-
        $\niet p \en \niet q$
      uitwerking: |-
        Twee negaties met \textit{en}.
    - opgave: |-
        Het is niet waar dat ik een gsm en een tablet heb.
      antwoord: |-
        $\niet(p \en q)$
      uitwerking: |-
        De negatie staat voor de hele conjunctie.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Ontken met de wetten van De Morgan.
  lijst: enumerate
  delen:
    - opgave: |-
        Het is koud en het sneeuwt.
      antwoord: |-
        Het is niet koud of het sneeuwt niet.
      uitwerking: |-
        Een conjunctie wordt een disjunctie.
    - opgave: |-
        $x \leqslant 0 \ \of \ x \geqslant 10$
      antwoord: |-
        $x > 0 \ \en \ x < 10$
      uitwerking: |-
        Een disjunctie wordt een conjunctie.

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Ontken de uitspraak. Is de uitspraak waar, of de ontkenning?
  lijst: enumerate
  delen:
    - opgave: |-
        Alle rechthoeken zijn vierkanten.
      antwoord: |-
        Er is een rechthoek die geen vierkant is; de ontkenning is waar.
      uitwerking: |-
        Een rechthoek van 2 bij 4 cm.
    - opgave: |-
        Er is een driehoek met drie stompe hoeken.
      antwoord: |-
        Geen enkele driehoek heeft drie stompe hoeken; de ontkenning is waar.
      uitwerking: |-
        Drie stompe hoeken samen zijn meer dan $270^\circ$, maar de hoekensom is $180^\circ$.

- id: h1-t8
  pakketten: [1]
  soort: test
  niveau: 2
  opgave: |-
    Op het eiland uit het probleem zegt Kato: \textit{Lars en ik zijn niet allebei eerlijk.} Wie is eerlijk en wie liegt? Neem $k$:~\textit{Kato is eerlijk} en $l$:~\textit{Lars is eerlijk}, en gebruik een waarheidstabel.
  antwoord: |-
    Kato is eerlijk, Lars liegt.
  uitwerking: |-
    Kato zegt $\niet(k \en l)$: O, W, W, W. Een rij kan als die waarde gelijk is aan $k$. WW: Kato eerlijk maar zegt O, kan niet. WO: Kato eerlijk en zegt W, dat kan. OW en OO: Kato liegt maar zegt W, kan niet. Alleen WO blijft over.

- id: h1-t8
  pakketten: [2, 3, 4, 5]
