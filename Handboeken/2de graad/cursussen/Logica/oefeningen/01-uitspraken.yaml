# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.
# pakketten: drie uitspraken in 2-5 (h1-drie, h1-o15, h1-o16, h1-o20, h1-t8); pakket 1 heeft een eigen
# variant met hetzelfde id voor h1-o15, h1-o20 en h1-t8; h1-o22 alleen in pakket 5.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Klopt het of klopt het niet?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $7$ is een priemgetal.
      antwoord: |-
        klopt
      uitwerking: |-
        7 heeft alleen 1 en 7 als delers.
    - opgave: |-
        Elke rechthoek is een vierkant.
      antwoord: |-
        klopt niet
      uitwerking: |-
        Een rechthoek van 2 bij 5 heeft geen vier gelijke zijden.
    - opgave: |-
        $-3 > -2$
      antwoord: |-
        klopt niet
      uitwerking: |-
        $-3$ ligt links van $-2$ op de getallenas.
    - opgave: |-
        Elk vierkant is een rechthoek.
      antwoord: |-
        klopt
      uitwerking: |-
        Een vierkant heeft vier rechte hoeken.
    - opgave: |-
        Een driehoek kan twee rechte hoeken hebben.
      antwoord: |-
        klopt niet
      uitwerking: |-
        De hoekensom is $180^\circ$: na twee rechte hoeken blijft er $0^\circ$ over.
    - opgave: |-
        $0,5 = \tfrac12$
      antwoord: |-
        klopt
      uitwerking: |-
        $1 : 2 = 0,5$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Op de affiche van een jeugdbeweging staat: \textit{Je mag mee op kamp als je minstens 12 jaar bent of als je lid bent.} Op het menu van een restaurant staat: \textit{Bij het dagmenu krijg je soep of dessert.}
  lijst: enumerate
  delen:
    - opgave: |-
        Jonas is 13 en geen lid. Mag hij mee? En Lien, die 10 is en lid?
      antwoord: |-
        ja; ja
      uitwerking: |-
        Jonas voldoet aan de eerste voorwaarde, Lien aan de tweede.
    - opgave: |-
        Sara is 12 en lid. Mag ze mee? En mag je bij het dagmenu soep en dessert nemen?
      antwoord: |-
        ja; meestal niet
      uitwerking: |-
        Sara voldoet aan beide voorwaarden: ze mag zeker mee. Bij het menu bedoelt men meestal één van de twee.
    - opgave: |-
        Wat is het verschil tussen de twee keren dat het woord \textit{of} gebruikt wordt?
      antwoord: |-
        bij het kamp mag allebei, bij het menu niet
      uitwerking: |-
        Bij het kamp betekent \textit{of}: het ene, het andere of allebei. Bij het menu: precies één van de twee.
    - opgave: |-
        Wie mag volgens de affiche niet mee op kamp?
      antwoord: |-
        wie jonger is dan 12 en geen lid is
      uitwerking: |-
        Alleen wie aan geen enkele voorwaarde voldoet.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h1-uitspraak
  soort: kort
  opgave: |-
    Is de zin een uitspraak? Geef bij een uitspraak de waarheidswaarde.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3 + 4 = 8$
      antwoord: |-
        uitspraak, O
      uitwerking: |-
        $3 + 4 = 7$.
    - opgave: |-
        Hoeveel is $3 + 4$?
      antwoord: |-
        geen uitspraak
      uitwerking: |-
        Een vraag.
    - opgave: |-
        Een kubus heeft zes zijvlakken.
      antwoord: |-
        uitspraak, W
      uitwerking: |-
        Boven, onder, voor, achter, links en rechts.
    - opgave: |-
        Voetbal is saai.
      antwoord: |-
        geen uitspraak
      uitwerking: |-
        Een mening.

- id: h1-openzin
  soort: kort
  opgave: |-
    Voor welke natuurlijke getallen $n$ van 1 tot en met 10 is de open zin waar?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2n + 1 = 9$
      antwoord: |-
        $n = 4$
      uitwerking: |-
        $2 \cdot 4 + 1 = 9$; elk ander getal geeft een andere uitkomst.
    - opgave: |-
        $n$ is een deler van 12
      antwoord: |-
        $1, 2, 3, 4, 6$
      uitwerking: |-
        $12 = 1 \cdot 12 = 2 \cdot 6 = 3 \cdot 4$; 12 zelf valt buiten 1 tot 10.
    - opgave: |-
        $n^2 < 20$
      antwoord: |-
        $1, 2, 3, 4$
      uitwerking: |-
        $4^2 = 16 < 20$, maar $5^2 = 25$.

- id: h1-negatie
  soort: kort
  opgave: |-
    Ontken de uitspraak zonder de woorden \textit{het is niet waar dat}. Is de uitspraak waar, of de ontkenning?
  lijst: enumerate
  delen:
    - opgave: |-
        $8$ is een priemgetal.
      antwoord: |-
        8 is geen priemgetal; de ontkenning is waar
      uitwerking: |-
        $8 = 2 \cdot 4$.
    - opgave: |-
        $-5$ is groter dan $-7$.
      antwoord: |-
        $-5 \leqslant -7$; de uitspraak is waar
      uitwerking: |-
        Niet groter dan is kleiner dan of gelijk aan. $-5$ ligt rechts van $-7$.
    - opgave: |-
        De driehoek met zijden 3, 4 en 5 cm is gelijkbenig.
      antwoord: |-
        de driehoek is niet gelijkbenig; de ontkenning is waar
      uitwerking: |-
        Geen twee zijden zijn even lang.

- id: h1-en
  soort: kort
  opgave: |-
    Is de uitspraak waar?
  lijst: enumerate
  delen:
    - opgave: |-
        $9$ is oneven en $9$ is een kwadraat.
      antwoord: |-
        W
      uitwerking: |-
        W en W: $9 = 3^2$.
    - opgave: |-
        $15$ is deelbaar door 3 en door 4.
      antwoord: |-
        O
      uitwerking: |-
        Deelbaar door 3 is W, door 4 is O.
    - opgave: |-
        Een gelijkzijdige driehoek heeft drie gelijke zijden, maar geen rechte hoek.
      antwoord: |-
        W
      uitwerking: |-
        \textit{Maar} is \textit{en}. Beide delen zijn waar: elke hoek is $60^\circ$.

- id: h1-of
  soort: kort
  opgave: |-
    Is de uitspraak waar?
  lijst: enumerate
  delen:
    - opgave: |-
        $7$ is even of $7$ is een priemgetal.
      antwoord: |-
        W
      uitwerking: |-
        De rij OW.
    - opgave: |-
        $10$ is deelbaar door 2 of door 5.
      antwoord: |-
        W
      uitwerking: |-
        Allebei waar: de rij WW.
    - opgave: |-
        Een driehoek heeft vier hoeken of een vierkant heeft drie zijden.
      antwoord: |-
        O
      uitwerking: |-
        Beide delen zijn onwaar.

- id: h1-tabel
  soort: kort
  opgave: |-
    Maak de waarheidstabel.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\niet p \of q$
      antwoord: |-
        W, O, W, W
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $\niet p$ & $\niet p \of q$ \\ \hline
        W & W & O & \res{W} \\ \hline
        W & O & O & \res{O} \\ \hline
        O & W & W & \res{W} \\ \hline
        O & O & W & \res{W} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $\niet p \en \niet q$
      antwoord: |-
        O, O, O, W
      uitwerking: |-
        \begin{waarheidstabel}{5}
        $p$ & $q$ & $\niet p$ & $\niet q$ & $\niet p \en \niet q$ \\ \hline
        W & W & O & O & \res{O} \\ \hline
        W & O & O & W & \res{O} \\ \hline
        O & W & W & O & \res{O} \\ \hline
        O & O & W & W & \res{W} \\ \hline
        \end{waarheidstabel}

- id: h1-haakjes
  soort: kort
  opgave: |-
    Neem $p$:~\textit{Ik ga naar de film} en $q$:~\textit{Ik ga zwemmen}. Schrijf in woorden en maak de waarheidstabel.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\niet p \of q$
      antwoord: |-
        ik ga niet naar de film of ik ga zwemmen; W, O, W, W
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $\niet p$ & $\niet p \of q$ \\ \hline
        W & W & O & \res{W} \\ \hline
        W & O & O & \res{O} \\ \hline
        O & W & W & \res{W} \\ \hline
        O & O & W & \res{W} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $\niet(p \of q)$
      antwoord: |-
        het is niet waar dat ik naar de film ga of ga zwemmen; O, O, O, W
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $p \of q$ & $\niet(p \of q)$ \\ \hline
        W & W & W & \res{O} \\ \hline
        W & O & W & \res{O} \\ \hline
        O & W & W & \res{O} \\ \hline
        O & O & O & \res{W} \\ \hline
        \end{waarheidstabel}

- id: h1-vertaal
  soort: kort
  opgave: |-
    Neem $p$:~\textit{Het regent} en $q$:~\textit{Ik neem de fiets}. Schrijf in symbolen.
  lijst: enumerate
  delen:
    - opgave: |-
        Het regent niet en ik neem de fiets.
      antwoord: |-
        $\niet p \en q$
      uitwerking: |-
        Een negatie van $p$, verbonden met \textit{en}.
    - opgave: |-
        Het regent, maar ik neem toch de fiets.
      antwoord: |-
        $p \en q$
      uitwerking: |-
        \textit{Maar} is \textit{en}.
    - opgave: |-
        Het is niet waar dat het regent en ik de fiets neem.
      antwoord: |-
        $\niet(p \en q)$
      uitwerking: |-
        De negatie staat voor de hele conjunctie.

- id: h1-drie
  pakketten: [2, 3, 4, 5]
  soort: kort
  opgave: |-
    Maak de waarheidstabel van $p \en (q \of r)$. In hoeveel rijen is de uitspraak waar?
  antwoord: |-
    W, W, W, O, O, O, O, O: in drie rijen
  uitwerking: |-
    \begin{waarheidstabel}{5}
    $p$ & $q$ & $r$ & $q \of r$ & $p \en (q \of r)$ \\ \hline
    W & W & W & W & \res{W} \\ \hline
    W & W & O & W & \res{W} \\ \hline
    W & O & W & W & \res{W} \\ \hline
    W & O & O & O & \res{O} \\ \hline
    O & W & W & W & \res{O} \\ \hline
    O & W & O & W & \res{O} \\ \hline
    O & O & W & W & \res{O} \\ \hline
    O & O & O & O & \res{O} \\ \hline
    \end{waarheidstabel}

- id: h1-gelijkw
  soort: kort
  opgave: |-
    Zijn de twee uitspraken gelijkwaardig? Controleer met een waarheidstabel.
  lijst: enumerate
  delen:
    - opgave: |-
        $\niet(p \en \niet q)$ \ en \ $\niet p \of q$
      antwoord: |-
        ja
      uitwerking: |-
        \begin{waarheidstabel}{5}
        $p$ & $q$ & $\niet q$ & $p \en \niet q$ & $\niet(p \en \niet q)$ \\ \hline
        W & W & O & O & \res{W} \\ \hline
        W & O & W & W & \res{O} \\ \hline
        O & W & O & O & \res{W} \\ \hline
        O & O & W & O & \res{W} \\ \hline
        \end{waarheidstabel}
        \par De kolom van $\niet p \of q$ is ook W, O, W, W.
    - opgave: |-
        $\niet p \en q$ \ en \ $\niet(p \en q)$
      antwoord: |-
        nee
      uitwerking: |-
        $\niet p \en q$: O, O, W, O; \ $\niet(p \en q)$: O, W, W, W. Ze verschillen in de rijen WO en OO.

- id: h1-morgan
  soort: kort
  opgave: |-
    Ontken met de wetten van De Morgan.
  lijst: enumerate
  delen:
    - opgave: |-
        Ik heb een hond en een kat.
      antwoord: |-
        Ik heb geen hond of geen kat.
      uitwerking: |-
        De ontkenning van een conjunctie is een disjunctie.
    - opgave: |-
        Het getal is even of deelbaar door 3.
      antwoord: |-
        Het getal is oneven en niet deelbaar door 3.
      uitwerking: |-
        De ontkenning van een disjunctie is een conjunctie.
    - opgave: |-
        $x \geqslant 1 \ \en \ x \leqslant 4$
      antwoord: |-
        $x < 1 \ \of \ x > 4$
      uitwerking: |-
        Niet groter dan of gelijk aan 1 is kleiner dan 1.

- id: h1-alle
  soort: kort
  opgave: |-
    Ontken de uitspraak. Is de uitspraak waar, of de ontkenning?
  lijst: enumerate
  delen:
    - opgave: |-
        Alle vierhoeken hebben vier gelijke zijden.
      antwoord: |-
        Er is een vierhoek die geen vier gelijke zijden heeft; de ontkenning is waar.
      uitwerking: |-
        Een rechthoek van 2 bij 3 cm.
    - opgave: |-
        Er is een natuurlijk getal dat groter is dan zijn kwadraat.
      antwoord: |-
        Geen enkel natuurlijk getal is groter dan zijn kwadraat; de ontkenning is waar.
      uitwerking: |-
        $0^2 = 0$, $1^2 = 1$, en voor $n \geqslant 2$ is $n^2 = n \cdot n > n$.
    - opgave: |-
        Alle veelvouden van 6 zijn even.
      antwoord: |-
        Er is een veelvoud van 6 dat oneven is; de uitspraak is waar.
      uitwerking: |-
        $6k = 2 \cdot 3k$ is altijd even.

# --- Opdrachten: niveau 1 --------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    uitspraak of niet, waarheidswaarde
  opgave: |-
    Is de zin een uitspraak? Geef bij een uitspraak de waarheidswaarde.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2^5 = 32$
      antwoord: |-
        uitspraak, W
      uitwerking: |-
        $2 \cdot 2 \cdot 2 \cdot 2 \cdot 2 = 32$.
    - opgave: |-
        Los op: $3x = 12$.
      antwoord: |-
        geen uitspraak
      uitwerking: |-
        Een opdracht.
    - opgave: |-
        Een ruit heeft vier gelijke zijden.
      antwoord: |-
        uitspraak, W
      uitwerking: |-
        Zo is een ruit gedefinieerd.
    - opgave: |-
        $\sqrt{9} = -3$
      antwoord: |-
        uitspraak, O
      uitwerking: |-
        $\sqrt9 = 3$: een vierkantswortel is nooit negatief.
    - opgave: |-
        Rood is de mooiste kleur.
      antwoord: |-
        geen uitspraak
      uitwerking: |-
        Een mening.
    - opgave: |-
        $x - 2 = 5$
      antwoord: |-
        geen uitspraak (open zin)
      uitwerking: |-
        Waar voor $x = 7$, anders onwaar.
    - opgave: |-
        Een week heeft acht dagen.
      antwoord: |-
        uitspraak, O
      uitwerking: |-
        Een week heeft zeven dagen.
    - opgave: |-
        Is 51 een priemgetal?
      antwoord: |-
        geen uitspraak
      uitwerking: |-
        Een vraag. (De uitspraak \textit{51 is een priemgetal} is onwaar: $51 = 3 \cdot 17$.)

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    negatie
  opgave: |-
    Ontken de uitspraak, zonder de woorden \textit{het is niet waar dat}.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Het licht is aan.
      antwoord: |-
        Het licht is niet aan (uit).
      uitwerking: |-
        Een lamp is aan of uit: hier kan het ook met \textit{uit}.
    - opgave: |-
        $6$ is een deler van $20$.
      antwoord: |-
        $6$ is geen deler van $20$.
      uitwerking: |-
        $20 : 6$ is geen natuurlijk getal.
    - opgave: |-
        $-1 < 0$
      antwoord: |-
        $-1 \geqslant 0$
      uitwerking: |-
        Niet kleiner dan is groter dan of gelijk aan.
    - opgave: |-
        $x = 3$
      antwoord: |-
        $x \neq 3$
      uitwerking: |-
        Niet gelijk aan.
    - opgave: |-
        Ik heb een broer.
      antwoord: |-
        Ik heb geen broer.
      uitwerking: |-
        \textit{Ik heb een zus} is geen ontkenning.
    - opgave: |-
        De hoek is scherp.
      antwoord: |-
        De hoek is niet scherp.
      uitwerking: |-
        Niet \textit{de hoek is stomp}: hij kan ook recht of gestrekt zijn.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    waarheidswaarde van en en of
  opgave: |-
    Is de uitspraak waar?
  lijst: enumerate
  delen:
    - opgave: |-
        $9$ is een kwadraat en $9$ is even.
      antwoord: |-
        O
      uitwerking: |-
        W en O.
    - opgave: |-
        Een kubus heeft 6 zijvlakken of 8 ribben.
      antwoord: |-
        W
      uitwerking: |-
        Een kubus heeft 6 zijvlakken (W) en 12 ribben (O). Eén deel is waar.
    - opgave: |-
        $\sqrt{16} = 4$ en $4^2 = 16$.
      antwoord: |-
        W
      uitwerking: |-
        Beide delen zijn waar.
    - opgave: |-
        $2$ is een priemgetal of $2$ is oneven.
      antwoord: |-
        W
      uitwerking: |-
        W of O.
    - opgave: |-
        Elk vierkant is een ruit en elke ruit is een vierkant.
      antwoord: |-
        O
      uitwerking: |-
        Het eerste deel is waar, het tweede niet.
    - opgave: |-
        $-2 < -5$ of $0 > 1$.
      antwoord: |-
        O
      uitwerking: |-
        Beide delen zijn onwaar.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    waarheidswaarde van een samengestelde uitspraak
  opgave: |-
    De uitspraak $p$ is waar en de uitspraak $q$ is onwaar. Is de samengestelde uitspraak waar of onwaar?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\niet p \en q$
      antwoord: |-
        O
      uitwerking: |-
        O en O.
    - opgave: |-
        $p \of \niet q$
      antwoord: |-
        W
      uitwerking: |-
        W of W.
    - opgave: |-
        $\niet(p \en q)$
      antwoord: |-
        W
      uitwerking: |-
        $p \en q$ is O.
    - opgave: |-
        $\niet p \of q$
      antwoord: |-
        O
      uitwerking: |-
        O of O.
    - opgave: |-
        $\niet(\niet p)$
      antwoord: |-
        W
      uitwerking: |-
        Dubbele ontkenning: gelijk aan $p$.
    - opgave: |-
        $\niet(p \of q)$
      antwoord: |-
        O
      uitwerking: |-
        $p \of q$ is W.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    waarheidstabellen (drill)
  opgave: |-
    Maak de waarheidstabel.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\niet p \en q$
      antwoord: |-
        O, O, W, O
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $\niet p$ & $\niet p \en q$ \\ \hline
        W & W & O & \res{O} \\ \hline
        W & O & O & \res{O} \\ \hline
        O & W & W & \res{W} \\ \hline
        O & O & W & \res{O} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $p \of \niet q$
      antwoord: |-
        W, W, O, W
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $\niet q$ & $p \of \niet q$ \\ \hline
        W & W & O & \res{W} \\ \hline
        W & O & W & \res{W} \\ \hline
        O & W & O & \res{O} \\ \hline
        O & O & W & \res{W} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $(p \of q) \en \niet p$
      antwoord: |-
        O, O, W, O
      uitwerking: |-
        \begin{waarheidstabel}{5}
        $p$ & $q$ & $p \of q$ & $\niet p$ & $(p \of q) \en \niet p$ \\ \hline
        W & W & W & O & \res{O} \\ \hline
        W & O & W & O & \res{O} \\ \hline
        O & W & W & W & \res{W} \\ \hline
        O & O & O & W & \res{O} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $\niet(p \en \niet q)$
      antwoord: |-
        W, O, W, W
      uitwerking: |-
        \begin{waarheidstabel}{5}
        $p$ & $q$ & $\niet q$ & $p \en \niet q$ & $\niet(p \en \niet q)$ \\ \hline
        W & W & O & O & \res{W} \\ \hline
        W & O & W & W & \res{O} \\ \hline
        O & W & O & O & \res{W} \\ \hline
        O & O & W & O & \res{W} \\ \hline
        \end{waarheidstabel}
    - opgave: |-
        $(p \en q) \of (\niet p \en \niet q)$
      antwoord: |-
        W, O, O, W
      uitwerking: |-
        \begin{waarheidstabel}{5}
        $p$ & $q$ & $p \en q$ & $\niet p \en \niet q$ & $(p \en q) \of (\niet p \en \niet q)$ \\ \hline
        W & W & W & O & \res{W} \\ \hline
        W & O & O & O & \res{O} \\ \hline
        O & W & O & O & \res{O} \\ \hline
        O & O & O & W & \res{W} \\ \hline
        \end{waarheidstabel}
        \par Waar als $p$ en $q$ dezelfde waarheidswaarde hebben.
    - opgave: |-
        $p \of (p \en q)$
      antwoord: |-
        W, W, O, O
      uitwerking: |-
        \begin{waarheidstabel}{4}
        $p$ & $q$ & $p \en q$ & $p \of (p \en q)$ \\ \hline
        W & W & W & \res{W} \\ \hline
        W & O & O & \res{W} \\ \hline
        O & W & O & \res{O} \\ \hline
        O & O & O & \res{O} \\ \hline
        \end{waarheidstabel}
        \par Dezelfde kolom als $p$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    van woorden naar symbolen
  opgave: |-
    Neem $p$:~\textit{Het is zonnig} en $q$:~\textit{Ik ga zwemmen}. Schrijf in symbolen.
  lijst: enumerate
  delen:
    - opgave: |-
        Het is zonnig en ik ga niet zwemmen.
      antwoord: |-
        $p \en \niet q$
      uitwerking: |-
        Een conjunctie met een negatie van $q$.
    - opgave: |-
        Het is niet zonnig of ik ga zwemmen.
      antwoord: |-
        $\niet p \of q$
      uitwerking: |-
        De negatie hoort alleen bij \textit{zonnig}.
    - opgave: |-
        Het is niet zonnig, maar toch ga ik zwemmen.
      antwoord: |-
        $\niet p \en q$
      uitwerking: |-
        \textit{Maar} is \textit{en}.
    - opgave: |-
        Het is niet waar dat ik ga zwemmen of dat het zonnig is.
      antwoord: |-
        $\niet(q \of p)$
      uitwerking: |-
        De negatie staat voor de hele disjunctie. Ook goed: $\niet(p \of q)$.
    - opgave: |-
        Het is noch zonnig, noch ga ik zwemmen.
      antwoord: |-
        $\niet p \en \niet q$
      uitwerking: |-
        Noch \ldots{} noch: twee negaties met \textit{en}.
    - opgave: |-
        Het is niet waar dat het niet zonnig is.
      antwoord: |-
        $\niet(\niet p)$, dus $p$
      uitwerking: |-
        Een dubbele ontkenning: gelijkwaardig met \textit{het is zonnig}.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    van symbolen naar woorden
  opgave: |-
    Neem $p$:~\textit{Lena speelt piano} en $q$:~\textit{Lena zingt}. Schrijf in woorden.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\niet p \en q$
      antwoord: |-
        Lena speelt geen piano, maar ze zingt.
      uitwerking: |-
        Ook goed: \textit{Lena speelt geen piano en Lena zingt}.
    - opgave: |-
        $p \of \niet q$
      antwoord: |-
        Lena speelt piano of ze zingt niet.
      uitwerking: |-
        De negatie hoort alleen bij \textit{zingt}.
    - opgave: |-
        $\niet(p \of q)$
      antwoord: |-
        Het is niet waar dat Lena piano speelt of zingt.
      uitwerking: |-
        Gelijkwaardig: \textit{Lena speelt geen piano en zingt niet}.
    - opgave: |-
        $\niet(p \en q)$
      antwoord: |-
        Het is niet waar dat Lena piano speelt en zingt.
      uitwerking: |-
        Gelijkwaardig: \textit{Lena speelt geen piano of ze zingt niet}.

- id: h1-o8
  soort: opdracht
  niveau: 1
  thema: |-
    open zinnen met en, of, niet
  opgave: |-
    Voor welke natuurlijke getallen $n$ van 1 tot en met 12 is de open zin waar?
  lijst: enumerate
  delen:
    - opgave: |-
        $n$ is even en $n > 7$
      antwoord: |-
        $8, 10, 12$
      uitwerking: |-
        De even getallen zijn 2, 4, 6, 8, 10, 12; daarvan zijn 8, 10 en 12 groter dan 7.
    - opgave: |-
        $n$ is een priemgetal of $n$ is even
      antwoord: |-
        $2, 3, 4, 5, 6, 7, 8, 10, 11, 12$
      uitwerking: |-
        Alleen 1 en 9 zijn geen priemgetal en ook niet even.
    - opgave: |-
        $n$ is niet deelbaar door 3
      antwoord: |-
        $1, 2, 4, 5, 7, 8, 10, 11$
      uitwerking: |-
        Alle getallen behalve 3, 6, 9 en 12.
    - opgave: |-
        $n < 4$ of $n > 10$
      antwoord: |-
        $1, 2, 3, 11, 12$
      uitwerking: |-
        Een getal kan niet tegelijk kleiner dan 4 en groter dan 10 zijn.
    - opgave: |-
        $n$ is oneven en $n$ is een kwadraat
      antwoord: |-
        $1, 9$
      uitwerking: |-
        De kwadraten tot 12 zijn 1, 4 en 9.

# --- Opdrachten: niveau 2 --------------------------------------------------------------

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    inclusieve of exclusieve of in gewone taal
  opgave: |-
    Betekent \textit{of} in de zin \textit{het ene, het andere of allebei}, of \textit{precies één van de twee}? Of maakt het niet uit, omdat allebei toch niet kan?
  lijst: enumerate
  delen:
    - opgave: |-
        Wil je ijs of taart als dessert?
      antwoord: |-
        meestal precies één
      uitwerking: |-
        De gastheer verwacht één keuze.
    - opgave: |-
        Om binnen te mogen, heb je een ticket of een uitnodiging nodig.
      antwoord: |-
        allebei mag
      uitwerking: |-
        Wie beide heeft, mag zeker binnen.
    - opgave: |-
        Kinderen jonger dan 12 of ouder dan 65 betalen minder.
      antwoord: |-
        maakt niet uit
      uitwerking: |-
        Niemand is tegelijk jonger dan 12 en ouder dan 65.
    - opgave: |-
        Bij onweer sta je best niet onder een hoge boom of midden in een open veld.
      antwoord: |-
        allebei (de of zit binnen een negatie)
      uitwerking: |-
        Je moet beide vermijden: de zin betekent $\niet p \en \niet q$, en dat is $\niet(p \of q)$ met de inclusieve of.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    gelijkwaardige uitspraken
  opgave: |-
    Zijn de twee uitspraken gelijkwaardig? Controleer met een waarheidstabel.
  lijst: enumerate
  delen:
    - opgave: |-
        $\niet(p \en q)$ \ en \ $\niet p \en \niet q$
      antwoord: |-
        nee
      uitwerking: |-
        $\niet(p \en q)$: O, W, W, W; \ $\niet p \en \niet q$: O, O, O, W. Ze verschillen in de rijen WO en OW.
    - opgave: |-
        $p \of (p \en q)$ \ en \ $p$
      antwoord: |-
        ja
      uitwerking: |-
        $p \of (p \en q)$: W, W, O, O. Dat is de kolom van $p$.
    - opgave: |-
        $\niet(\niet p \of q)$ \ en \ $p \en \niet q$
      antwoord: |-
        ja
      uitwerking: |-
        \begin{waarheidstabel}{5}
        $p$ & $q$ & $\niet p \of q$ & $\niet(\niet p \of q)$ & $p \en \niet q$ \\ \hline
        W & W & W & O & \res{O} \\ \hline
        W & O & O & W & \res{W} \\ \hline
        O & W & W & O & \res{O} \\ \hline
        O & O & W & O & \res{O} \\ \hline
        \end{waarheidstabel}
        \par De laatste twee kolommen zijn gelijk. Het volgt ook uit De Morgan: $\niet(\niet p \of q)$ is $\niet\niet p \en \niet q$.
    - opgave: |-
        $p \of q$ \ en \ $(p \en \niet q) \of (\niet p \en q)$
      antwoord: |-
        nee
      uitwerking: |-
        $p \of q$: W, W, W, O; \ $(p \en \niet q) \of (\niet p \en q)$: O, W, W, O. Ze verschillen in de rij WW: de tweede is de exclusieve of.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    ontkennen met De Morgan
  opgave: |-
    Ontken de uitspraak met de wetten van De Morgan, zonder de woorden \textit{het is niet waar dat}.
  lijst: enumerate
  delen:
    - opgave: |-
        Ik ben moe en ik heb honger.
      antwoord: |-
        Ik ben niet moe of ik heb geen honger.
      uitwerking: |-
        $\niet(p \en q)$ is $\niet p \of \niet q$.
    - opgave: |-
        Hij speelt voetbal of tennis.
      antwoord: |-
        Hij speelt geen voetbal en geen tennis.
      uitwerking: |-
        $\niet(p \of q)$ is $\niet p \en \niet q$.
    - opgave: |-
        De driehoek is gelijkbenig en rechthoekig.
      antwoord: |-
        De driehoek is niet gelijkbenig of niet rechthoekig.
      uitwerking: |-
        Een conjunctie wordt een disjunctie.
    - opgave: |-
        Ik drink noch koffie, noch thee.
      antwoord: |-
        Ik drink koffie of thee.
      uitwerking: |-
        $\niet(\niet p \en \niet q)$ is $\niet\niet p \of \niet\niet q$, dus $p \of q$.
    - opgave: |-
        $x < -2 \ \of \ x > 3$
      antwoord: |-
        $x \geqslant -2 \ \en \ x \leqslant 3$
      uitwerking: |-
        Een disjunctie wordt een conjunctie: $x$ ligt tussen $-2$ en $3$ (of erop).
    - opgave: |-
        Het getal is een priemgetal en het is niet oneven.
      antwoord: |-
        Het getal is geen priemgetal of het is oneven.
      uitwerking: |-
        $\niet(p \en \niet q)$ is $\niet p \of q$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    ontkennen met alle en er is
  opgave: |-
    Ontken de uitspraak. Is de uitspraak waar, of de ontkenning?
  lijst: enumerate
  delen:
    - opgave: |-
        Alle zoogdieren leven op het land.
      antwoord: |-
        Er is een zoogdier dat niet op het land leeft; de ontkenning is waar.
      uitwerking: |-
        Een walvis of een dolfijn.
    - opgave: |-
        Er is een even priemgetal.
      antwoord: |-
        Geen enkel priemgetal is even; de uitspraak is waar.
      uitwerking: |-
        2 is een even priemgetal.
    - opgave: |-
        Elke driehoek heeft minstens één scherpe hoek.
      antwoord: |-
        Er is een driehoek zonder scherpe hoek; de uitspraak is waar.
      uitwerking: |-
        Zijn twee hoeken $\geqslant 90^\circ$, dan is de hoekensom al minstens $180^\circ$ zonder de derde hoek. Een driehoek heeft dus zelfs minstens twee scherpe hoeken.
    - opgave: |-
        Er is een getal waarvoor $x + 1 = x$.
      antwoord: |-
        Voor geen enkel getal is $x + 1 = x$ (voor alle $x$ is $x + 1 \neq x$); de ontkenning is waar.
      uitwerking: |-
        Trek $x$ af van beide leden: $1 = 0$, en dat klopt nooit.
    - opgave: |-
        Geen enkel kwadraat is negatief.
      antwoord: |-
        Er is een kwadraat dat negatief is; de uitspraak is waar.
      uitwerking: |-
        \textit{Geen enkel} is de ontkenning van \textit{er is}: ontken je het, dan krijg je weer \textit{er is}.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    schakeling: trappenhuis
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.55,font=\scriptsize]
        \draw[grijs,thick] (.8,1) -- (0,1) -- (0,.35) (0,-.05) -- (0,-.8) -- (2.6,-.8) (3.4,-.8) -- (6,-.8) -- (6,1) -- (5.2,1);
        \draw[thick] (-.3,.35) -- (.3,.35) (-.15,-.05) -- (.15,-.05);
        \draw[grijs,thick] (1.8,1.6) -- (4.2,1.6) (1.8,.4) -- (4.2,.4);
        \fill (.8,1) circle (1.6pt) (5.2,1) circle (1.6pt) (1.8,1.6) circle (1.4pt) (1.8,.4) circle (1.4pt) (4.2,1.6) circle (1.4pt) (4.2,.4) circle (1.4pt);
        \draw[accent,very thick] (.8,1) -- (1.8,1.6) (5.2,1) -- (4.2,.4);
        \node[above] at (.9,1.35) {$p$};
        \node[above] at (5.1,1.35) {$q$};
        \draw[thick] (3,-.8) circle (.4);
        \draw (2.72,-1.08) -- (3.28,-.52) (2.72,-.52) -- (3.28,-1.08);
      \end{tikzpicture}
  opgave: |-
    In een trappenhuis kun je de lamp beneden en boven bedienen. De lamp brandt als de twee schakelaars in dezelfde stand staan: allebei omhoog of allebei omlaag. Neem $p$:~\textit{de schakelaar beneden staat omhoog} en $q$:~\textit{de schakelaar boven staat omhoog}.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf in symbolen wanneer de lamp brandt.
      antwoord: |-
        $(p \en q) \of (\niet p \en \niet q)$
      uitwerking: |-
        Allebei omhoog, of allebei niet omhoog.
    - opgave: |-
        Maak de waarheidstabel. In welke rij zit de schakeling uit de figuur?
      antwoord: |-
        W, O, O, W; de rij WO (lamp uit)
      uitwerking: |-
        \begin{waarheidstabel}{5}
        $p$ & $q$ & $p \en q$ & $\niet p \en \niet q$ & lamp \\ \hline
        W & W & W & O & \res{W} \\ \hline
        W & O & O & O & \res{O} \\ \hline
        O & W & O & O & \res{O} \\ \hline
        O & O & O & W & \res{W} \\ \hline
        \end{waarheidstabel}
        \par In de figuur staat $p$ omhoog en $q$ omlaag: de rij WO. De stroom kan niet rond, de lamp is uit.
    - opgave: |-
        Vanuit de stand in de figuur zet je beneden de schakelaar omlaag. Daarna zet je boven de schakelaar omhoog. Wat doet de lamp telkens? Verklaar met de tabel.
      antwoord: |-
        eerst aan (rij OO), dan weer uit (rij OW)
      uitwerking: |-
        Van WO naar OO: de lamp gaat aan. Van OO naar OW: de lamp gaat uit. Elke keer dat je één schakelaar omzet, verandert de lamp van stand.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    raadsel met eerlijken en leugenaars
  opgave: |-
    Op het eiland uit het probleem ontmoet je Carl en Dirk. Carl zegt: \textit{Ik ben een leugenaar of Dirk is eerlijk.} Neem $p$:~\textit{Carl is eerlijk} en $q$:~\textit{Dirk is eerlijk}.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf wat Carl zegt in symbolen.
      antwoord: |-
        $\niet p \of q$
      uitwerking: |-
        \textit{Ik ben een leugenaar} is $\niet p$.
    - opgave: |-
        Wie is eerlijk en wie liegt? Gebruik een waarheidstabel.
      antwoord: |-
        Carl en Dirk zijn allebei eerlijk.
      uitwerking: |-
        $\niet p \of q$ is W, O, W, W. Een rij kan als die waarde gelijk is aan $p$: WW (W en W) kan; WO (O, maar Carl eerlijk) niet; OW (W, maar Carl liegt) niet; OO (W, maar Carl liegt) niet. Alleen WW blijft over.

- id: h1-o15
  pakketten: [1]
  soort: opdracht
  niveau: 2
  thema: |-
    voorwaarden in een context
  opgave: |-
    Een webwinkel verzendt gratis als je voor meer dan 50 euro bestelt of als je een klantenkaart hebt. Neem $p$:~\textit{je bestelt voor meer dan 50 euro} en $q$:~\textit{je hebt een klantenkaart}.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf in symbolen wanneer je gratis verzending krijgt, en wanneer niet.
      antwoord: |-
        $p \of q$; niet: $\niet p \en \niet q$
      uitwerking: |-
        De ontkenning van $p \of q$ is met De Morgan $\niet p \en \niet q$.
    - opgave: |-
        Wie krijgt gratis verzending? Ella bestelt voor 30 euro en heeft een klantenkaart. Finn bestelt voor 80 euro zonder klantenkaart. Gust bestelt voor 45 euro zonder klantenkaart. Hanna bestelt voor 60 euro met klantenkaart.
      antwoord: |-
        Ella, Finn en Hanna
      uitwerking: |-
        Ella: OW, Finn: WO, Hanna: WW geven W. Gust: OO geeft O.

- id: h1-o15
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    voorwaarden in een context, drie uitspraken
  opgave: |-
    Een webwinkel verzendt gratis als je voor meer dan 50 euro bestelt of als je een klantenkaart hebt, maar nooit voor een groot meubel. Neem $p$:~\textit{je bestelt voor meer dan 50 euro}, $q$:~\textit{je hebt een klantenkaart} en $r$:~\textit{je bestelt een groot meubel}.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf in symbolen wanneer je gratis verzending krijgt.
      antwoord: |-
        $(p \of q) \en \niet r$
      uitwerking: |-
        \textit{Maar nooit} is \textit{en niet}.
    - opgave: |-
        Wie krijgt gratis verzending? Ella koopt een kast (een groot meubel) van 300 euro en heeft een klantenkaart. Finn bestelt voor 80 euro boeken, zonder klantenkaart. Gust bestelt voor 45 euro kleren, zonder klantenkaart. Hanna bestelt voor 20 euro met klantenkaart.
      antwoord: |-
        Finn en Hanna
      uitwerking: |-
        Ella: WWW geeft O (meubel). Finn: WOO geeft W. Gust: OOO geeft O. Hanna: OWO geeft W.

- id: h1-o16
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    waarheidstabel met drie uitspraken, gelijkwaardig
  opgave: |-
    Maak één waarheidstabel voor $p \en (q \of r)$ en $(p \en q) \of (p \en r)$. Wat stel je vast? Op welke rekenregel lijkt dat?
  antwoord: |-
    gelijkwaardig; de distributiviteit $a(b + c) = ab + ac$
  uitwerking: |-
    \begin{waarheidstabel}{8}
    $p$ & $q$ & $r$ & $q \of r$ & $p \en (q \of r)$ & $p \en q$ & $p \en r$ & $(p \en q) \of (p \en r)$ \\ \hline
    W & W & W & W & W & W & W & \res{W} \\ \hline
    W & W & O & W & W & W & O & \res{W} \\ \hline
    W & O & W & W & W & O & W & \res{W} \\ \hline
    W & O & O & O & O & O & O & \res{O} \\ \hline
    O & W & W & W & O & O & O & \res{O} \\ \hline
    O & W & O & W & O & O & O & \res{O} \\ \hline
    O & O & W & W & O & O & O & \res{O} \\ \hline
    O & O & O & O & O & O & O & \res{O} \\ \hline
    \end{waarheidstabel}
    \par De kolommen van de twee uitspraken zijn gelijk. Zoals vermenigvuldigen verdeelt over optellen, verdeelt \textit{en} over \textit{of}.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    aantal rijen van een waarheidstabel
  opgave: |-
    Hoeveel rijen heeft een waarheidstabel met
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        3 uitspraken?
      antwoord: |-
        8
      uitwerking: |-
        $2 \cdot 2 \cdot 2 = 2^3$.
    - opgave: |-
        4 uitspraken?
      antwoord: |-
        16
      uitwerking: |-
        Elke nieuwe uitspraak verdubbelt het aantal rijen: $2^4$.
    - opgave: |-
        10 uitspraken?
      antwoord: |-
        1024
      uitwerking: |-
        $2^{10} = 1024$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    samengestelde uitspraken over een figuur
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.75,font=\scriptsize]
        \coordinate (A) at (0,0); \coordinate (B) at (2,0); \coordinate (C) at (3,1.732); \coordinate (D) at (1,1.732);
        \fill[accent!12] (A) -- (B) -- (C) -- (D) -- cycle;
        \draw[accent,thick] (A) -- (B) -- (C) -- (D) -- cycle;
        \draw[grijs,dashed] (A) -- (C) (B) -- (D);
        \node[below left] at (A) {$A$}; \node[below right] at (B) {$B$};
        \node[above right] at (C) {$C$}; \node[above left] at (D) {$D$};
        \node at (.55,.2) {$60^\circ$};
        \foreach \P/\Q in {A/B,B/C,C/D,D/A}{\draw[accent] ($(\P)!.5!(\Q)!.12cm!90:(\Q)$) -- ($(\P)!.5!(\Q)!-.12cm!90:(\Q)$);}
      \end{tikzpicture}
  opgave: |-
    De vierhoek $ABCD$ heeft vier gelijke zijden en een hoek van $60^\circ$. Neem $p$:~\textit{$ABCD$ is een ruit}, $q$:~\textit{$ABCD$ heeft een rechte hoek} en $s$:~\textit{de diagonalen van $ABCD$ staan loodrecht op elkaar}. Is de uitspraak waar?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $p \en q$
      antwoord: |-
        O
      uitwerking: |-
        $p$ is W, $q$ is O.
    - opgave: |-
        $p \of q$
      antwoord: |-
        W
      uitwerking: |-
        $p$ is W.
    - opgave: |-
        $\niet q \en s$
      antwoord: |-
        W
      uitwerking: |-
        De diagonalen van een ruit staan loodrecht op elkaar: $s$ is W, en $\niet q$ is W.
    - opgave: |-
        $\niet(p \en s)$
      antwoord: |-
        O
      uitwerking: |-
        $p \en s$ is W.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    redeneren met waarheidswaarden
  opgave: |-
    Wat weet je over de waarheidswaarden van $p$ en $q$?
  lijst: enumerate
  delen:
    - opgave: |-
        $p \of q$ is onwaar.
      antwoord: |-
        $p$ en $q$ zijn allebei onwaar.
      uitwerking: |-
        Een disjunctie is alleen onwaar in de rij OO.
    - opgave: |-
        $p \en \niet q$ is waar.
      antwoord: |-
        $p$ is waar en $q$ is onwaar.
      uitwerking: |-
        Een conjunctie is alleen waar als beide delen waar zijn: $p$ en $\niet q$ zijn W.
    - opgave: |-
        $\niet(p \en q)$ is waar, en $p$ is waar.
      antwoord: |-
        $q$ is onwaar.
      uitwerking: |-
        $p \en q$ is O. Omdat $p$ W is, moet $q$ O zijn.
    - opgave: |-
        $p \of q$ is waar, en $\niet q$ is waar.
      antwoord: |-
        $p$ is waar en $q$ is onwaar.
      uitwerking: |-
        $q$ is O, dus moet $p$ W zijn om de disjunctie waar te maken.

# --- Opdrachten: niveau 3 --------------------------------------------------------------

- id: h1-o20
  pakketten: [1]
  soort: opdracht
  niveau: 3
  thema: |-
    raadsel met eerlijken en leugenaars
  opgave: |-
    Op het eiland uit het probleem ontmoet je Hanne en Ilias. Hanne zegt: \textit{Ik ben eerlijk en Ilias is een leugenaar.} Ilias zegt: \textit{Hanne is eerlijk.} Wie is eerlijk en wie liegt? Neem $h$:~\textit{Hanne is eerlijk} en $i$:~\textit{Ilias is eerlijk}, en gebruik een waarheidstabel.
  antwoord: |-
    Hanne en Ilias liegen allebei.
  uitwerking: |-
    Hanne zegt $h \en \niet i$, Ilias zegt $h$. Een rij kan als wat Hanne zegt dezelfde waarde heeft als $h$, en wat Ilias zegt dezelfde waarde als $i$.
    \par\begin{waarheidstabel}{4}
    $h$ & $i$ & $h \en \niet i$ & Ilias zegt $h$ \\ \hline
    W & W & O & W \\ \hline
    W & O & W & W \\ \hline
    O & W & O & O \\ \hline
    O & O & O & O \\ \hline
    \end{waarheidstabel}
    \par WW: Hanne eerlijk maar zegt O: kan niet. WO: Ilias liegt maar zegt W: kan niet. OW: Ilias eerlijk maar zegt O: kan niet. OO: Hanne zegt O en liegt, Ilias zegt O en liegt: dat kan. Ze liegen dus allebei.

- id: h1-o20
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 3
  thema: |-
    raadsel met drie bewoners
  opgave: |-
    Op het eiland uit het probleem ontmoet je Ella, Fien en Gust. Ella zegt: \textit{Fien is een leugenaar.} Fien zegt: \textit{Gust en ik zijn allebei eerlijk.} Gust zegt: \textit{Ella is eerlijk.} Wie is eerlijk en wie liegt? Neem $e$, $f$ en $g$ voor \textit{Ella}, \textit{Fien} en \textit{Gust is eerlijk}, en gebruik een waarheidstabel met acht rijen.
  antwoord: |-
    Ella en Gust zijn eerlijk, Fien liegt.
  uitwerking: |-
    Ella zegt $\niet f$, Fien zegt $f \en g$, Gust zegt $e$. Een rij kan als de kolom van wat iemand zegt gelijk is aan de kolom van die persoon.
    \par\begin{waarheidstabel}{6}
    $e$ & $f$ & $g$ & $\niet f$ & $f \en g$ & Gust zegt $e$ \\ \hline
    W & W & W & O & W & W \\ \hline
    W & W & O & O & O & W \\ \hline
    W & O & W & W & O & W \\ \hline
    W & O & O & W & O & W \\ \hline
    O & W & W & O & W & O \\ \hline
    O & W & O & O & O & O \\ \hline
    O & O & W & W & O & O \\ \hline
    O & O & O & W & O & O \\ \hline
    \end{waarheidstabel}
    \par Ella: $\niet f$ moet gelijk zijn aan $e$, dus $e$ en $f$ verschillen: alleen de rijen WOW, WOO, OWW en OWO blijven. Gust: $g$ moet gelijk zijn aan $e$: alleen WOW en OWO. Fien: in WOW is $f \en g$ O en Fien liegt: dat kan. In OWO is $f \en g$ O maar Fien is eerlijk: dat kan niet. Alleen WOW klopt.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    een uitspraak bij een gegeven waarheidstabel zoeken
  opgave: |-
    Zoek een uitspraak met $p$, $q$ en de tekens $\niet$, $\en$, $\of$ die deze laatste kolom heeft (in de volgorde WW, WO, OW, OO).
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        O, O, O, W
      antwoord: |-
        $\niet p \en \niet q$
      uitwerking: |-
        Alleen waar als $p$ en $q$ allebei onwaar zijn. Ook goed: $\niet(p \of q)$.
    - opgave: |-
        W, W, O, W
      antwoord: |-
        $p \of \niet q$
      uitwerking: |-
        Alleen onwaar in de rij OW, dus als $p$ onwaar en $q$ waar is: de ontkenning van $\niet p \en q$, en dat is $p \of \niet q$.
    - opgave: |-
        O, W, W, O
      antwoord: |-
        $(p \en \niet q) \of (\niet p \en q)$
      uitwerking: |-
        Waar in de rij WO ($p \en \niet q$) en in de rij OW ($\niet p \en q$): verbind die met \textit{of}. Dat is de exclusieve of: precies één van beide is waar.

- id: h1-o22
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    alle waarheidstabellen met twee uitspraken
  opgave: |-
    De laatste kolom van een waarheidstabel met $p$ en $q$ bestaat uit vier keer W of O.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel verschillende laatste kolommen zijn er mogelijk?
      antwoord: |-
        16
      uitwerking: |-
        Elke rij heeft twee mogelijkheden: $2 \cdot 2 \cdot 2 \cdot 2 = 16$.
    - opgave: |-
        Leg uit hoe je bij elke kolom een uitspraak vindt met alleen $\niet$, $\en$ en $\of$. Doe het voor de kolom W, O, W, O en de kolom O, W, W, W.
      antwoord: |-
        W, O, W, O: $q$ \ (of $(p \en q) \of (\niet p \en q)$); \ O, W, W, W: $\niet(p \en q)$
      uitwerking: |-
        Maak voor elke rij met W een conjunctie die alleen in die rij waar is: $p \en q$ voor WW, $p \en \niet q$ voor WO, $\niet p \en q$ voor OW, $\niet p \en \niet q$ voor OO. Verbind die conjuncties met \textit{of}. Is de kolom overal O, neem dan $p \en \niet p$. Voor W, O, W, O krijg je $(p \en q) \of (\niet p \en q)$, en dat is gewoon $q$. Voor O, W, W, W kan het korter: de kolom is alleen O in de rij WW, dus $\niet(p \en q)$.

