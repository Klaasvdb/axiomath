# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.
# pakketten: de bewijsopdrachten h2-o22 en h2-o23 alleen in 5.
# Eulersporen en kortste paden zijn nagerekend met een Python-script (brute force: alle sporen en paden).
# Woorden volgens de wenk bij LPD K3 (KOV): wandeling, spoor, circuit, pad, cykel; eulerspoor, eulercircuit.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bekijk de graaf.
  figuur:
    code: |-
      \begin{tikzpicture}
        \knopen{A/0/0, B/1.4/1, C/1.4/-1, D/2.8/0, E/4.2/0}
        \bogen{A/B, A/C, B/C, B/D, C/D, D/E}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de graad van elke knoop.
      antwoord: |-
        $A$ 2, $B$ 3, $C$ 3, $D$ 3, $E$ 1
      uitwerking: |-
        $B$ is verbonden met $A$, $C$ en $D$; $D$ met $B$, $C$ en $E$.
    - opgave: |-
        Hoeveel knopen hebben een oneven graad?
      antwoord: |-
        $4$
      uitwerking: |-
        $B$, $C$, $D$ en $E$: een even aantal, zoals altijd.
    - opgave: |-
        Hoeveel bogen heeft de graaf?
      antwoord: |-
        $6$
      uitwerking: |-
        De som van de graden is $12 = 2 \cdot 6$.
    - opgave: |-
        Kun je langs bogen van $A$ naar $E$ gaan via $C$? Geef zo'n route.
      antwoord: |-
        ja: $A, C, D, E$
      uitwerking: |-
        $AC$, $CD$ en $DE$ zijn bogen.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Probeer elke figuur in één haal te tekenen: zonder je potlood op te heffen en zonder een lijn twee keer te trekken.
    \figuren{\begin{tikzpicture}[scale=.8]
      \foreach \n/\x/\y in {p/0/0, q/2/0, r/2/2, s/0/2, t/1/3}{\coordinate (\n) at (\x,\y);}
      \draw[boog] (p) -- (q) -- (r) -- (s) -- (p) -- (r) (q) -- (s) (s) -- (t) -- (r);
      \foreach \n in {p,q,r,s,t}{\node[punt] at (\n) {};}
      \node[grijs,font=\footnotesize] at (1,-.6) {figuur 1};
    \end{tikzpicture}\qquad\qquad
    \begin{tikzpicture}[scale=.8]
      \foreach \n/\x/\y in {p/0/0, q/2/0, r/2/2, s/0/2}{\coordinate (\n) at (\x,\y);}
      \draw[boog] (p) -- (q) -- (r) -- (s) -- (p) -- (r) (q) -- (s);
      \foreach \n in {p,q,r,s}{\node[punt] at (\n) {};}
      \node[grijs,font=\footnotesize] at (1,-.6) {figuur 2};
    \end{tikzpicture}\qquad\qquad
    \begin{tikzpicture}[scale=.8]
      \foreach \n/\x/\y in {a/0/0, b/0/2, m/1.5/1, c/3/0, d/3/2}{\coordinate (\n) at (\x,\y);}
      \draw[boog] (a) -- (b) -- (m) -- (a) (m) -- (c) -- (d) -- (m);
      \foreach \n in {a,b,m,c,d}{\node[punt] at (\n) {};}
      \node[grijs,font=\footnotesize] at (1.5,-.6) {figuur 3};
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Bij welke figuren lukt het?
      antwoord: |-
        figuur 1 en figuur 3
      uitwerking: |-
        Figuur 2 lukt niet, hoe je ook begint.
    - opgave: |-
        Schrijf bij elke stip het aantal lijnen dat er samenkomt.
      antwoord: |-
        1: $3, 3, 4, 4, 2$; 2: $3, 3, 3, 3$; 3: $2, 2, 4, 2, 2$
      uitwerking: |-
        Figuur 1: de onderste hoeken 3, de bovenste hoeken van het vierkant 4, de top 2. Figuur 2: elke hoek 3. Figuur 3: het midden 4, de andere stippen 2.
    - opgave: |-
        Waar begon en eindigde je, als het lukte?
      antwoord: |-
        1: in de twee onderste hoeken; 3: overal, terug in het begin
      uitwerking: |-
        Figuur 1 lukt alleen als je in een onderste hoek begint; je eindigt dan in de andere. Figuur 3 lukt vanuit elke stip, en je komt terug waar je begon.
    - opgave: |-
        Zie je een verband tussen je antwoorden op b en c?
      antwoord: |-
        begin en einde: de stippen met een oneven aantal lijnen
      uitwerking: |-
        Je begint en eindigt in de stippen waar een oneven aantal lijnen samenkomt. Zijn er geen zulke stippen, dan kom je terug in het begin. Zijn er vier, zoals in figuur 2, dan lukt het niet.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h2-wandeling
  soort: kort
  opgave: |-
    Welke naam past het best bij de rij knopen: wandeling, spoor, circuit, pad of cykel? Of is het geen wandeling?
  figuur:
    code: |-
      \begin{tikzpicture}
        \knopen{P/0/0, Q/1.5/1, R/3/0, S/1.5/-1, T/4.4/0}
        \bogen{P/Q, Q/R, R/S, S/P, Q/S, R/T}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        $P, Q, R, S, P$
      antwoord: |-
        cykel
      uitwerking: |-
        $PQ$, $QR$, $RS$, $SP$: terug in $P$, en verder komt geen knoop twee keer voor.
    - opgave: |-
        $P, Q, S, P, Q$
      antwoord: |-
        wandeling
      uitwerking: |-
        De boog $PQ$ wordt twee keer gebruikt: geen spoor.
    - opgave: |-
        $Q, R, T$
      antwoord: |-
        pad
      uitwerking: |-
        $QR$ en $RT$, met drie verschillende knopen.
    - opgave: |-
        $Q, R, S, Q, P$
      antwoord: |-
        spoor
      uitwerking: |-
        $QR$, $RS$, $SQ$, $QP$ zijn verschillende bogen, maar $Q$ komt twee keer voor: geen pad.
    - opgave: |-
        $P, R, T$
      antwoord: |-
        geen wandeling
      uitwerking: |-
        Er is geen boog $PR$.
    - opgave: |-
        Bestaat er een circuit dat door $T$ gaat?
      antwoord: |-
        nee
      uitwerking: |-
        $T$ ligt maar aan één boog. Een circuit dat in $T$ aankomt, moet er langs een andere boog weer vertrekken.

- id: h2-samenhang
  soort: kort
  opgave: |-
    Is de graaf samenhangend? Zo niet: hoeveel bogen moet je minstens toevoegen?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.8]
          \knopen{A/0/0, B/1.2/0, C/0/1.2, D/1.2/1.2}
          \bogen{A/B, A/C, C/D}
        \end{tikzpicture}
      antwoord: |-
        ja
      uitwerking: |-
        $B, A, C, D$ is een wandeling langs alle knopen.
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.8]
          \knopen{A/0/0, B/1.2/0, C/0/1.2, D/1.2/1.2, E/2.4/.6}
          \bogen{A/B, C/D}
        \end{tikzpicture}
      antwoord: |-
        nee; 2
      uitwerking: |-
        Drie stukken: $A, B$ en $C, D$ en $E$. Met twee bogen, bijvoorbeeld $BD$ en $DE$, hangt alles samen.
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.8]
          \knopen{A/0/0, B/1.2/0, C/0/1.2, D/1.2/1.2, E/2.4/0, F/2.4/1.2}
          \bogen{A/D, B/C, E/F, B/E}
        \end{tikzpicture}
      antwoord: |-
        nee; 1
      uitwerking: |-
        Twee stukken: $A, D$ en $B, C, E, F$. Snijdende bogen $AD$ en $BC$ hebben geen knoop gemeen. Eén boog, bijvoorbeeld $AB$, volstaat.

- id: h2-model
  soort: kort
  opgave: |-
    In een stad ligt een eiland $E$ in de rivier, tussen de noordoever $N$ en de zuidoever $Z$. Er zijn vier bruggen.
    \figuren{\begin{tikzpicture}[font=\footnotesize]
      \fill[hd1!16] (0,-.7) rectangle (5,.7);
      \fill[white] (3.2,0) ellipse (.9 and .32);
      \draw[lijngrijs] (0,.7) -- (5,.7) (0,-.7) -- (5,-.7) (3.2,0) ellipse (.9 and .32);
      \foreach \x in {2.9,3.5}{\fill[black!60] (\x-.06,.26) rectangle (\x+.06,.74);}
      \fill[black!60] (3.14,-.74) rectangle (3.26,-.28);
      \fill[black!60] (.94,-.74) rectangle (1.06,.74);
      \node at (3.2,0) {$E$}; \node at (2.5,1) {$N$}; \node at (2.5,-1) {$Z$};
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Stel de stadsdelen en de bruggen voor met een graaf.
      antwoord: |-
        zie de figuur
      uitwerking: |-
        Twee bogen $NE$, één boog $ZE$ en één boog $NZ$.
        \figuren{\begin{tikzpicture}
          \knopen{N/0/1.2, E/1.6/0, Z/0/-1.2}
          \draw[boog] (N) to[bend left=18] (E); \draw[boog] (N) to[bend right=18] (E);
          \bogen{Z/E, N/Z}
        \end{tikzpicture}}
    - opgave: |-
        Bepaal de graad van elke knoop.
      antwoord: |-
        $\gr{N} = 3$, $\gr{E} = 3$, $\gr{Z} = 2$
      uitwerking: |-
        $N$ ligt aan de twee bruggen naar het eiland en aan de lange brug naar $Z$.
    - opgave: |-
        Kun je een wandeling maken die elke brug precies één keer oversteekt? Waar begin en eindig je?
      antwoord: |-
        ja, van $N$ naar $E$ (of omgekeerd)
      uitwerking: |-
        Twee oneven graden: een eulerspoor van $N$ naar $E$, bijvoorbeeld $N, E, N, Z, E$ (over de ene brug naar $E$, de andere terug, dan de lange brug en de brug van $Z$ naar $E$).

- id: h2-kring
  soort: kort
  opgave: |-
    Toon aan dat de graaf een eulercircuit heeft, en zoek er een.
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.9]
        \knopen{A/0/0, B/3/0, C/1.5/2.6, D/1.5/.45, E/2.05/1.35, F/.95/1.35}
        \bogen{A/B, B/C, C/A, D/E, E/F, F/D, D/A, D/B, E/B, E/C, F/C, F/A}
      \end{tikzpicture}
  antwoord: |-
    bijvoorbeeld $A, B, C, A, D, B, E, C, F, D, E, F, A$
  uitwerking: |-
    De graaf is samenhangend en elke knoop heeft graad 4: er is een eulercircuit. Een eerste circuit: $A, B, C, A$. Vanuit $A$ met vrije bogen: $A, D, E, F, A$; ingelast: $A, B, C, A, D, E, F, A$. Nog vrij: $DB$, $BE$, $EC$, $CF$, $FD$. Vanuit $D$: $D, B, E, C, F, D$; ingelast op de plaats van $D$: $A, B, C, A, D, B, E, C, F, D, E, F, A$, met alle 12 bogen.

- id: h2-pad
  soort: kort
  opgave: |-
    Waar moet een eulerspoor beginnen? Zoek er een.
  figuur:
    code: |-
      \begin{tikzpicture}
        \knopen{A/0/0, B/1.6/0, C/3.2/0, D/.8/1.3, E/2.4/1.3}
        \bogen{A/B, B/C, A/D, B/D, B/E, C/E, D/E}
      \end{tikzpicture}
  antwoord: |-
    in $D$ of $E$; bijvoorbeeld $D, A, B, C, E, B, D, E$
  uitwerking: |-
    $\gr{D} = \gr{E} = 3$, de andere graden zijn even ($A$ 2, $B$ 4, $C$ 2). Het eulerspoor loopt van $D$ naar $E$ of omgekeerd: $D, A, B, C, E, B, D, E$ gebruikt alle 7 bogen.

- id: h2-beslis
  soort: kort
  opgave: |-
    Heeft de graaf een eulercircuit, een eulerspoor dat niet sluit, of geen van beide?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.7]
          \foreach \n/\x/\y in {a/0/0, b/1.6/0, c/1.6/1.6, d/0/1.6}{\coordinate (\n) at (\x,\y);}
          \draw[boog] (a) -- (b) -- (c) -- (d) -- (a) -- (c) (b) -- (d);
          \foreach \n in {a,b,c,d}{\node[punt] at (\n) {};}
        \end{tikzpicture}
      antwoord: |-
        geen van beide
      uitwerking: |-
        Vier knopen met graad 3.
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.7]
          \foreach \n/\x/\y in {a/0/0, b/1.6/0, c/1.6/1.6, d/0/1.6}{\coordinate (\n) at (\x,\y);}
          \draw[boog] (a) -- (b) -- (c) -- (d) -- (a) -- (c);
          \foreach \n in {a,b,c,d}{\node[punt] at (\n) {};}
        \end{tikzpicture}
      antwoord: |-
        eulerspoor
      uitwerking: |-
        Twee knopen met graad 3 (aan de diagonaal): het spoor loopt van de ene naar de andere.
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.7]
          \foreach \n/\x/\y in {a/0/0, b/0/1.6, m/1.1/.8, c/2.2/0, d/2.2/1.6}{\coordinate (\n) at (\x,\y);}
          \draw[boog] (a) -- (b) -- (m) -- (a) (m) -- (c) -- (d) -- (m);
          \foreach \n in {a,b,m,c,d}{\node[punt] at (\n) {};}
        \end{tikzpicture}
      antwoord: |-
        eulercircuit
      uitwerking: |-
        Alle graden zijn even (4 in het midden, 2 elders).
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.7]
          \foreach \i in {0,...,4}{\coordinate (v\i) at ({90+72*\i}:.9);}
          \foreach \i in {0,...,4}{\foreach \j in {0,...,4}{\ifnum\i<\j \draw[boog] (v\i) -- (v\j);\fi}}
          \foreach \i in {0,...,4}{\node[punt] at (v\i) {};}
        \end{tikzpicture}
      antwoord: |-
        eulercircuit
      uitwerking: |-
        Elke knoop is verbonden met de vier andere: alle graden zijn 4.

- id: h2-dijkstra
  soort: kort
  opgave: |-
    Zoek met het algoritme van Dijkstra de kortste route van $S$ naar $T$. Hoe lang is ze?
  figuur:
    code: |-
      \begin{tikzpicture}
        \knopen{S/0/0, P/1.6/1, Q/1.6/-1, R/3.2/0.4, T/4.6/-1}
        \gbogen{S/P/3, S/Q/7, P/Q/2, P/R/6, Q/R/3, Q/T/9, R/T/2}
      \end{tikzpicture}
  antwoord: |-
    $S, P, Q, R, T$; lengte $10$
  uitwerking: |-
    Definitief na elkaar: $S$ 0; $P$ 3; $Q$ 5 (via $P$, beter dan 7); $R$ 8 (via $Q$: $5 + 3$, beter dan $3 + 6 = 9$); $T$ 10 (via $R$: $8 + 2$, beter dan $5 + 9 = 14$). Achterstevoren: $T \leftarrow R \leftarrow Q \leftarrow P \leftarrow S$.

- id: h2-dijkstra2
  soort: kort
  opgave: |-
    Zoek met het algoritme van Dijkstra de afstand van $K$ tot elke andere knoop, en de kortste route van $K$ naar $P$.
  figuur:
    code: |-
      \begin{tikzpicture}
        \knopen{K/0/0, L/1.5/1, M/1.5/-1, N/3/0, O/4.5/-1, P/4.5/1}
        \gbogen{K/L/2, K/M/6, L/M/3, L/N/8, M/N/4, M/O/9, N/O/3, N/P/7, O/P/2}
      \end{tikzpicture}
  antwoord: |-
    $L$ 2, $M$ 5, $N$ 9, $O$ 12, $P$ 14; route $K, L, M, N, O, P$
  uitwerking: |-
    $K$ 0; $L$ 2; $M$ 5 (via $L$, beter dan 6); $N$ 9 (via $M$, beter dan $2 + 8 = 10$); $O$ 12 (via $N$, beter dan $5 + 9 = 14$); $P$ 14 (via $O$, beter dan $9 + 7 = 16$).

# --- Opdrachten ------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    wandeling, spoor, circuit, pad of cykel
  opgave: |-
    Welke naam past het best bij de rij knopen: wandeling, spoor, circuit, pad of cykel? Of is het geen wandeling?
  figuur:
    code: |-
      \begin{tikzpicture}
        \knopen{A/0/1, B/1.3/1.8, C/1.3/.2, D/2.7/1.8, E/2.7/.2, F/4/1}
        \bogen{A/B, A/C, B/C, B/D, C/D, C/E, D/E, D/F, E/F}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        $A, B, D, C, A$
      antwoord: |-
        cykel
      uitwerking: |-
        $AB$, $BD$, $DC$, $CA$: terug in $A$, en verder geen knoop twee keer.
    - opgave: |-
        $B, C, D, B, C$
      antwoord: |-
        wandeling
      uitwerking: |-
        $BC$ wordt twee keer gebruikt: geen spoor.
    - opgave: |-
        $A, B, D, F, E$
      antwoord: |-
        pad
      uitwerking: |-
        Vijf verschillende knopen, verbonden door vier bogen.
    - opgave: |-
        $A, D, E$
      antwoord: |-
        geen wandeling
      uitwerking: |-
        Er is geen boog $AD$.
    - opgave: |-
        $F, E, C, D, E$
      antwoord: |-
        spoor
      uitwerking: |-
        $FE$, $EC$, $CD$, $DE$ zijn vier verschillende bogen, maar $E$ komt twee keer voor: geen pad.
    - opgave: |-
        $A, B, C, D, E, C, A$
      antwoord: |-
        circuit
      uitwerking: |-
        $AB$, $BC$, $CD$, $DE$, $EC$, $CA$ zijn verschillend, en de rij eindigt in $A$. Maar $C$ komt twee keer voor: geen cykel.
    - opgave: |-
        $C, B, A, C, D, F, E, D, C$
      antwoord: |-
        wandeling
      uitwerking: |-
        De boog $CD$ wordt twee keer gebruikt: eerst van $C$ naar $D$, op het einde van $D$ naar $C$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    eulercircuit, eulerspoor of geen van beide
  opgave: |-
    Heeft de graaf een eulercircuit, een eulerspoor dat niet sluit, of geen van beide? Leg uit.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.75]
          \foreach \n/\x/\y in {a/.4/1.4, b/1.6/1.4, c/0/0, d/1/0, e/2/0}{\coordinate (\n) at (\x,\y);}
          \draw[boog] (a) -- (c) (a) -- (d) (a) -- (e) (b) -- (c) (b) -- (d) (b) -- (e);
          \foreach \n in {a,b,c,d,e}{\node[punt] at (\n) {};}
        \end{tikzpicture}
      antwoord: |-
        eulerspoor
      uitwerking: |-
        De twee bovenste knopen hebben graad 3, de drie onderste graad 2: een eulerspoor van de ene bovenste knoop naar de andere.
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.75]
          \foreach \n/\x/\y in {1/0/0, 2/1.4/0, 3/1.4/1.4, 4/0/1.4, 5/.6/.5, 6/2/.5, 7/2/1.9, 8/.6/1.9}{\coordinate (k\n) at (\x,\y);}
          \foreach \a/\b in {1/2, 2/3, 3/4, 4/1, 5/6, 6/7, 7/8, 8/5, 1/5, 2/6, 3/7, 4/8}{\draw[boog] (k\a) -- (k\b);}
          \foreach \n in {1,...,8}{\node[punt] at (k\n) {};}
        \end{tikzpicture}
      antwoord: |-
        geen van beide
      uitwerking: |-
        De kubus heeft 8 knopen met graad 3: meer dan twee oneven graden.
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.75]
          \foreach \n/\x/\y in {a/0/0, b/1/0, c/.5/.85, d/1.2/1.2, e/2.2/1.2, f/1.7/2.05}{\coordinate (\n) at (\x,\y);}
          \draw[boog] (a) -- (b) -- (c) -- (a) (d) -- (e) -- (f) -- (d);
          \foreach \n in {a,b,c,d,e,f}{\node[punt] at (\n) {};}
        \end{tikzpicture}
      antwoord: |-
        geen van beide
      uitwerking: |-
        Alle graden zijn even, maar de graaf is niet samenhangend: van de ene driehoek kom je nooit op de andere.
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.75]
          \foreach \n/\x/\y in {a/0/0, b/1/0, c/1/1, d/0/1, e/.5/-.6, f/1.6/.5, g/.5/1.6, h/-.6/.5}{\coordinate (\n) at (\x,\y);}
          \draw[boog] (a) -- (b) -- (c) -- (d) -- (a) (a) -- (e) -- (b) (b) -- (f) -- (c) (c) -- (g) -- (d) (d) -- (h) -- (a);
          \foreach \n in {a,b,c,d,e,f,g,h}{\node[punt] at (\n) {};}
        \end{tikzpicture}
      antwoord: |-
        eulercircuit
      uitwerking: |-
        De hoeken van het vierkant hebben graad 4, de toppen van de driehoeken graad 2, en de graaf is samenhangend.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    een eulercircuit zoeken
  opgave: |-
    Toon aan dat de graaf een eulercircuit heeft, en zoek er een.
  figuur:
    code: |-
      \begin{tikzpicture}
        \foreach \n/\a in {A/90, B/30, C/-30, D/-90, E/-150, F/150}{\node[knoop] (\n) at (\a:1.2) {$\n$};}
        \bogen{A/B, B/C, C/D, D/E, E/F, F/A, A/C, C/E, E/A}
      \end{tikzpicture}
  antwoord: |-
    bijvoorbeeld $A, B, C, D, E, F, A, C, E, A$
  uitwerking: |-
    Samenhangend; $A$, $C$ en $E$ hebben graad 4, $B$, $D$ en $F$ graad 2. Eerst de zeshoek $A, B, C, D, E, F, A$, dan vanuit $A$ het circuit $A, C, E, A$ erachter: alle 9 bogen.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    een eulerspoor zoeken
  opgave: |-
    Waar moet je beginnen om deze figuur in één haal te tekenen? Geef zo'n eulerspoor.
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.9]
        \knopen{A/0/0, B/2/0, C/1/1.5, D/3/1.5, E/2/3}
        \bogen{A/B, A/C, B/C, B/D, C/D, C/E, D/E}
      \end{tikzpicture}
  antwoord: |-
    in $B$ of $D$; bijvoorbeeld $B, A, C, B, D, C, E, D$
  uitwerking: |-
    $\gr{B} = \gr{D} = 3$, $\gr{C} = 4$, $\gr{A} = \gr{E} = 2$. Begin in $B$ en eindig in $D$ (of omgekeerd): $B, A, C, B, D, C, E, D$ gebruikt alle 7 bogen.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    algoritme van Dijkstra
  opgave: |-
    Zoek met het algoritme van Dijkstra de afstand van $A$ tot elke andere knoop. Wat is de kortste route van $A$ naar $E$?
  figuur:
    code: |-
      \begin{tikzpicture}
        \knopen{A/0/0, B/1.8/1.1, C/1.8/-1.1, D/3.6/1.1, E/3.6/-1.1}
        \gbogen{A/B/6, A/C/2, C/B/3, B/D/1, C/D/7, C/E/8, D/E/2}
      \end{tikzpicture}
  antwoord: |-
    $B$ 5, $C$ 2, $D$ 6, $E$ 8; route $A, C, B, D, E$
  uitwerking: |-
    $A$ 0; $C$ 2; $B$ 5 (via $C$, beter dan 6); $D$ 6 (via $B$, beter dan $2 + 7 = 9$); $E$ 8 (via $D$: $6 + 2$; via $C$ zou het $10$ zijn). De rechtstreekse boog $AB$ wordt niet gebruikt.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    in één haal: cijfers op een display
  opgave: |-
    Een digitale klok toont cijfers met zeven streepjes tussen zes punten, zoals de 8 hiernaast. Je wilt een cijfer in één haal tekenen, zonder een streepje twee keer te trekken.
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.75]
        \foreach \n/\x/\y in {TL/0/2, TR/1.2/2, ML/0/1, MR/1.2/1, BL/0/0, BR/1.2/0}{\node[punt] (\n) at (\x,\y) {};}
        \draw[accent,line width=2.5pt] (TL) -- (TR) -- (MR) -- (BR) -- (BL) -- (ML) -- (TL) (ML) -- (MR);
        \foreach \n in {TL,TR,ML,MR,BL,BR}{\node[punt,fill=black] at (\n) {};}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Welke van de cijfers 0 tot 9 kun je in één haal tekenen?
      antwoord: |-
        alle behalve 3 en 4
      uitwerking: |-
        Maak van elk cijfer een graaf met de punten als knopen. Bij 3 en 4 hebben vier punten een oneven graad (bij 3: de twee linkse punten bovenaan en onderaan, en de twee middelste punten; bij 4: de twee bovenste punten, het middelste rechts en het onderste rechts). Bij 0 zijn alle graden even (een cykel). Bij 1, 2, 5, 6, 7, 8 en 9 zijn er precies twee oneven graden.
    - opgave: |-
        Waar begin je bij de 8?
      antwoord: |-
        in een van de twee middelste punten
      uitwerking: |-
        De twee middelste punten hebben graad 3, de vier hoeken graad 2. Je begint in het ene middelste punt en eindigt in het andere.
    - opgave: |-
        Bij welk cijfer kom je terug waar je begon?
      antwoord: |-
        bij 0
      uitwerking: |-
        Alleen bij 0 zijn alle graden even.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    een situatie als graaf: deuren in een museum
  opgave: |-
    Het grondplan toont een museum met vier zalen. De deuren zijn getekend als dikke streepjes in de muren. Drie deuren leiden naar buiten.
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.8,font=\footnotesize]
        \draw[thick] (0,0) rectangle (4,3) (2,0) -- (2,3) (0,1.5) -- (4,1.5);
        \foreach \a/\b in {{(1,3)}/h, {(3,3)}/h, {(1,1.5)}/h, {(3,1.5)}/h}{\fill[accent] \a ++(-.25,-.07) rectangle ++(.5,.14);}
        \foreach \a in {{(4,.75)}, {(2,2.25)}, {(2,.45)}, {(2,1.05)}}{\fill[accent] \a ++(-.07,-.2) rectangle ++(.14,.4);}
        \node at (1,2.25) {1}; \node at (3,2.25) {2}; \node at (1,.75) {3}; \node at (3,.75) {4};
        \node[grijs] at (4.7,2.25) {buiten};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Stel het museum voor met een graaf. Tip: ook buiten is een knoop.
      antwoord: |-
        zie de figuur
      uitwerking: |-
        Knopen 1, 2, 3, 4 en $O$ (buiten). Deuren: $O1$, $O2$, $O4$, $12$, $13$, $24$ en twee keer $34$.
        \figuren{\begin{tikzpicture}
          \node[knoop] (1) at (0,1.4) {1}; \node[knoop] (2) at (1.6,1.4) {2}; \node[knoop] (3) at (0,0) {3}; \node[knoop] (4) at (1.6,0) {4}; \node[knoop] (O) at (3.2,.7) {$O$};
          \bogen{1/2, 1/3, 2/4, O/2, O/4}
          \draw[boog] (O) to[bend right=50] (1);
          \draw[boog] (3) to[bend left=20] (4); \draw[boog] (3) to[bend right=20] (4);
        \end{tikzpicture}}
    - opgave: |-
        Kan een bezoeker een wandeling maken waarbij hij elke deur precies één keer doorgaat?
      antwoord: |-
        nee
      uitwerking: |-
        $\gr{O} = 3$, $\gr{1} = 3$, $\gr{2} = 3$, $\gr{3} = 3$, $\gr{4} = 4$: vier oneven graden.
    - opgave: |-
        Het museum sluit één deur. Welke deur, zodat een bezoeker van buiten kan vertrekken en elke open deur precies één keer doorgaat?
      antwoord: |-
        de deur tussen 1 en 2, of die tussen 1 en 3
      uitwerking: |-
        Na het sluiten moeten er precies twee oneven graden zijn, en een daarvan moet $O$ zijn. Sluit je de deur $12$, dan blijven $O$ en 3 oneven: de bezoeker eindigt in zaal 3. Sluit je $13$, dan eindigt hij in zaal 2. Een deur naar buiten sluiten maakt $O$ even, en de deuren $24$ en $34$ laten vier oneven graden over.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    dominostenen in een ring
  opgave: |-
    Een dominospel tot dubbel-vier heeft een steen voor elk paar ogen van 0 tot 4, ook de dubbele: $0|0$, $0|1$, \ldots, $4|4$. Dat zijn 15 stenen. Je legt stenen aan elkaar als de helften die elkaar raken, hetzelfde aantal ogen hebben. Maak een graaf: de knopen zijn de aantallen ogen 0 tot 4, elke steen is een boog, en een dubbele steen is een lus.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de graad van elke knoop?
      antwoord: |-
        $6$
      uitwerking: |-
        Elk aantal ogen komt voor op een steen met elk van de vier andere aantallen (4 bogen) en op de dubbele steen (een lus, telt voor 2).
    - opgave: |-
        Kun je alle 15 stenen in één gesloten ring leggen?
      antwoord: |-
        ja
      uitwerking: |-
        Een gesloten ring is een eulercircuit. De graaf is samenhangend en alle graden zijn even.
    - opgave: |-
        Een spel tot dubbel-vijf heeft 21 stenen, met de ogen 0 tot 5. Kun je die allemaal in één rij leggen?
      antwoord: |-
        nee
      uitwerking: |-
        Nu heeft elke knoop graad $5 + 2 = 7$: zes oneven graden, dus zelfs geen eulerspoor.
    - opgave: |-
        Hoeveel stenen moet je uit het spel tot dubbel-vijf minstens weglaten om de rest in één rij te leggen?
      antwoord: |-
        $2$
      uitwerking: |-
        Laat je een steen $a|b$ met $a \neq b$ weg, dan worden de graden van $a$ en $b$ even. Met twee stenen zonder gemeenschappelijk getal, zoals $0|1$ en $2|3$, blijven er twee oneven graden over (4 en 5): een rij van 4 naar 5. Met één steen blijven er vier oneven graden.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    de bruggen van Königsberg aanpassen
  opgave: |-
    Neem de graaf van de bruggen van Königsberg uit voorbeeld~\ref{vb:h2-konigsberg}.
  lijst: enumerate
  delen:
    - opgave: |-
        De stad bouwt één extra brug, zodat er een wandeling bestaat over elke brug precies één keer. Tussen welke stadsdelen kan die brug liggen? Waar begint en eindigt de wandeling dan?
      antwoord: |-
        tussen eender welke twee stadsdelen; in de twee andere
      uitwerking: |-
        Alle vier de graden zijn oneven. Een brug tussen twee stadsdelen maakt die twee graden even. Dan blijven de andere twee oneven: daar begint en eindigt de wandeling. Bijvoorbeeld een brug $BC$: van $A$ naar $D$.
    - opgave: |-
        Hoeveel bruggen moet de stad minstens bijbouwen voor een rondwandeling over elke brug? Waar?
      antwoord: |-
        $2$, bijvoorbeeld $BC$ en $AD$
      uitwerking: |-
        Elke nieuwe brug maakt hoogstens twee graden even, en er zijn vier oneven graden. Met $BC$ en $AD$ zijn alle graden even: $A$ 6, $B$ 4, $C$ 4, $D$ 4.
    - opgave: |-
        In plaats van een brug te bouwen, breekt de stad er één af. Welke bruggen komen in aanmerking?
      antwoord: |-
        elk van de zeven
      uitwerking: |-
        Elke brug verbindt twee stadsdelen met een oneven graad. Breek je er een af, dan worden die twee even, en de graaf blijft samenhangend. Er blijft een eulerspoor tussen de andere twee stadsdelen.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    algoritme van Dijkstra met de route
  opgave: |-
    De graaf toont een wegennet met de afstanden in km.
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.85]
        \knopen{A/0/0, B/1.5/1.2, C/1.5/-1.2, D/3.2/0, E/4.8/-1.2, F/4.8/1.2, G/6.3/0}
        \gbogen{A/B/3, A/C/5, B/C/1, B/D/6, C/D/3, C/E/7, D/E/2, D/F/4, E/G/5, F/G/1, E/F/3}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek met het algoritme van Dijkstra de kortste route van $A$ naar $G$. Noteer bij elke stap waarlangs je komt.
      antwoord: |-
        $A, B, C, D, F, G$: $12$ km
      uitwerking: |-
        Definitief na elkaar: $A$ 0; $B$ 3; $C$ 4 (via $B$, beter dan 5); $D$ 7 (via $C$, beter dan $3 + 6 = 9$); $E$ 9 (via $D$, beter dan $4 + 7 = 11$); $F$ 11 (via $D$; via $E$ zou het 12 zijn); $G$ 12 (via $F$; via $E$ zou het 14 zijn). Achterstevoren: $G \leftarrow F \leftarrow D \leftarrow C \leftarrow B \leftarrow A$.
    - opgave: |-
        Bereken nu de afstand van $G$ tot elke andere knoop. Welke knoop ligt het verst van $G$?
      antwoord: |-
        $F$ 1, $E$ 4, $D$ 5, $C$ 8, $B$ 9, $A$ 12; $A$
      uitwerking: |-
        Vanuit $G$: $F$ 1; $E$ 4 (via $F$, beter dan 5); $D$ 5 (via $F$); $C$ 8 (via $D$; via $E$ zou het 11 zijn); $B$ 9 (via $C$; via $D$ zou het 11 zijn); $A$ 12 (via $B$; via $C$ zou het 13 zijn). De afstand van $G$ tot $A$ is dezelfde als die van $A$ tot $G$.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    kortste pad in een gerichte gewogen graaf
  opgave: |-
    In een wijk met eenrichtingsstraten toont de gerichte graaf de rijtijden in minuten. Het algoritme van Dijkstra werkt ook hier, als je alleen de pijlen volgt.
  figuur:
    code: |-
      \begin{tikzpicture}
        \knopen{S/0/0, A/1.8/1.2, B/1.8/-1.2, C/3.9/-1.2, T/3.9/1.2}
        \gpijlen{S/A/2, S/B/5, B/C/2, C/T/1, A/T/9}
        \draw[pijl] (A) -- node[gewicht,pos=.28] {$6$} (C);
        \draw[pijl] (B) -- node[gewicht,pos=.28] {$6$} (T);
        \draw[pijl] (A) to[bend left=20] node[gewicht] {$1$} (B);
        \draw[pijl] (B) to[bend left=20] node[gewicht] {$2$} (A);
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek de snelste route van $S$ naar $T$.
      antwoord: |-
        $S, A, B, C, T$: $6$ minuten
      uitwerking: |-
        $S$ 0; $A$ 2; $B$ 3 (via $A$, beter dan 5); $C$ 5 (via $B$, beter dan $2 + 6 = 8$); $T$ 6 (via $C$; via $B$ zou het 9 zijn, via $A$ 11).
    - opgave: |-
        Kun je van $T$ terug naar $S$ rijden?
      antwoord: |-
        nee
      uitwerking: |-
        Uit $T$ vertrekt geen enkele pijl, en naar $S$ komt er ook geen aan.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    bogen toevoegen voor een eulercircuit
  opgave: |-
    Hoeveel bogen moet je minstens toevoegen opdat de graaf een eulercircuit heeft? Meervoudige bogen mogen.
  lijst: enumerate
  delen:
    - opgave: |-
        De volledige graaf met 4 knopen.
      antwoord: |-
        $2$
      uitwerking: |-
        Vier knopen met graad 3. Elke nieuwe boog maakt hoogstens twee graden even: twee bogen, bijvoorbeeld tussen $A$ en $B$ en tussen $C$ en $D$.
    - opgave: |-
        De graaf van de hoekpunten en ribben van een kubus.
      antwoord: |-
        $4$
      uitwerking: |-
        Acht knopen met graad 3, dus minstens $8 : 2 = 4$ bogen. Vier bogen tussen de hoekpunten twee aan twee volstaan.
    - opgave: |-
        Een samenhangende graaf met 10 knopen met een oneven graad.
      antwoord: |-
        $5$
      uitwerking: |-
        Verdeel de oneven knopen in 5 paren, en verbind elk paar met een boog.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    telkens de kortste boog nemen werkt niet
  opgave: |-
    Sam wil van $A$ naar $D$. Hij neemt in elke knoop de kortste boog naar een knoop waar hij nog niet was.
  figuur:
    code: |-
      \begin{tikzpicture}
        \knopen{A/0/0, B/1.6/1, C/1.6/-1, E/3.2/1.6, D/3.6/-.2}
        \gbogen{A/B/2, A/C/3, B/D/7, C/D/3, B/E/1, E/D/8}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Welke route volgt Sam, en hoe lang is ze?
      antwoord: |-
        $A, B, E, D$: $11$
      uitwerking: |-
        In $A$ is $AB$ (2) de kortste boog, in $B$ is $BE$ (1) de kortste, en in $E$ blijft alleen $ED$ (8) over: $2 + 1 + 8 = 11$.
    - opgave: |-
        Zoek de kortste route met het algoritme van Dijkstra.
      antwoord: |-
        $A, C, D$: $6$
      uitwerking: |-
        $A$ 0; $B$ 2; $C$ 3; $E$ 3 (via $B$); $D$ 6 (via $C$; via $B$ zou het 9 zijn, via $E$ 11).
    - opgave: |-
        Leg in een zin uit waarom de methode van Sam misloopt.
      antwoord: |-
        hij kijkt maar één stap vooruit
      uitwerking: |-
        Sam kiest wat nu het goedkoopst is, zonder te kijken wat dat verderop kost. Dijkstra vergelijkt de volledige afstanden vanaf $A$.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    van tabel naar gewogen graaf, Dijkstra
  opgave: |-
    De tabel toont de wegen tussen zes dorpen, met hun lengte in km. Andere wegen zijn er niet.
    \begin{center}\renewcommand{\arraystretch}{1.2}\begin{tabular}{|c|c|c|c|c|c|c|c|c|}
    \hline
    $PQ$ & $PR$ & $QR$ & $QS$ & $RS$ & $RT$ & $ST$ & $SU$ & $TU$ \\ \hline
    7 & 3 & 2 & 4 & 9 & 6 & 1 & 5 & 8 \\ \hline
    \end{tabular}\end{center}
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de gewogen graaf.
      antwoord: |-
        zie de figuur
      uitwerking: |-
        \figuren{\begin{tikzpicture}
          \knopen{P/0/0, Q/1.6/1.1, R/1.6/-1.1, S/3.4/1.1, T/3.4/-1.1, U/5/0}
          \gbogen{P/Q/7, P/R/3, Q/R/2, Q/S/4, R/S/9, R/T/6, S/T/1, S/U/5, T/U/8}
        \end{tikzpicture}}
    - opgave: |-
        Zoek de kortste route van $P$ naar $U$ met het algoritme van Dijkstra.
      antwoord: |-
        $P, R, Q, S, U$: $14$ km
      uitwerking: |-
        $P$ 0; $R$ 3; $Q$ 5 (via $R$, beter dan 7); $S$ 9 (via $Q$, beter dan $3 + 9 = 12$); $T$ 9 (via $R$; via $S$ zou het 10 zijn); $U$ 14 (via $S$; via $T$ zou het 17 zijn).
    - opgave: |-
        Hoe ver ligt $T$ van $P$?
      antwoord: |-
        $9$ km
      uitwerking: |-
        Dat staat al in de tabel van het algoritme: $P, R, T$.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    juist of fout
  opgave: |-
    Juist of fout? Verklaar, of geef een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        Een graaf met een eulercircuit heeft ook een eulerspoor.
      antwoord: |-
        juist
      uitwerking: |-
        Een eulercircuit is een eulerspoor dat toevallig in zijn begin eindigt.
    - opgave: |-
        Als alle knopen een even graad hebben, heeft de graaf een eulercircuit.
      antwoord: |-
        fout
      uitwerking: |-
        De graaf moet ook samenhangend zijn. Tegenvoorbeeld: twee losse driehoeken.
    - opgave: |-
        Er bestaat een graaf met precies één knoop met een oneven graad, die een eulerspoor heeft.
      antwoord: |-
        fout
      uitwerking: |-
        Een graaf met precies één oneven graad bestaat niet: het aantal oneven graden is altijd even.
    - opgave: |-
        In een eulercircuit komt elke knoop precies één keer voor.
      antwoord: |-
        fout
      uitwerking: |-
        Elke boog komt precies één keer voor, niet elke knoop: een eulercircuit is meestal geen cykel. In het eulercircuit $A, B, C, E, B, D, E, F, D, A$ komen $B$, $D$ en $E$ elk twee keer voor.
    - opgave: |-
        Het kortste pad van $A$ naar een andere knoop begint altijd met de kortste boog vanuit $A$.
      antwoord: |-
        fout
      uitwerking: |-
        In de graaf waarin Sam van $A$ naar $D$ wil, is $AB$ (2) de kortste boog vanuit $A$, maar de kortste route naar $D$ is $A, C, D$ en begint met $AC$ (3).

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    zelf een graaf ontwerpen
  opgave: |-
    Teken een samenhangende enkelvoudige graaf die aan de voorwaarden voldoet.
  lijst: enumerate
  delen:
    - opgave: |-
        5 knopen, 7 bogen, en een eulercircuit.
      antwoord: |-
        bijvoorbeeld de figuur
      uitwerking: |-
        Alle graden moeten even zijn, met som $14$: bijvoorbeeld $4, 4, 2, 2, 2$. Een vierhoek $ABCD$ met de diagonaal $AC$, en een vijfde knoop $E$ verbonden met $A$ en $C$.
        \figuren{\begin{tikzpicture}[scale=.8]
          \knopen{A/0/0, B/1.5/-1, C/3/0, D/1.5/1, E/1.5/2.2}
          \bogen{A/B, B/C, C/D, D/A, A/C, A/E, E/C}
        \end{tikzpicture}}
    - opgave: |-
        5 knopen, 6 bogen, een eulerspoor, maar geen eulercircuit.
      antwoord: |-
        bijvoorbeeld een vijfhoek met één diagonaal
      uitwerking: |-
        Er moeten precies twee oneven graden zijn. Een vijfhoek heeft 5 bogen met graad 2 overal; een diagonaal maakt twee graden 3.
        \figuren{\begin{tikzpicture}[scale=.8]
          \foreach \n/\i in {A/0, B/1, C/2, D/3, E/4}{\node[knoop] (\n) at ({90-72*\i}:1) {$\n$};}
          \bogen{A/B, B/C, C/D, D/E, E/A, A/C}
        \end{tikzpicture}}

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    eulercircuit in een gewogen graaf
  opgave: |-
    Een parkwachter vertrekt aan de ingang $A$ en wil elk wandelpad van het park precies één keer aflopen. De lengtes staan in hm.
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.9]
        \knopen{A/0/0, B/2/0, C/4/0, D/1/1.6, E/3/1.6, F/2/3.2}
        \gbogen{A/B/3, B/C/4, A/D/2, B/D/5, B/E/3, C/E/2, D/E/4, D/F/3, E/F/3}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Kan hij daarbij terugkomen aan de ingang?
      antwoord: |-
        ja
      uitwerking: |-
        Samenhangend, en alle graden zijn even ($A$, $C$, $F$: 2; $B$, $D$, $E$: 4).
    - opgave: |-
        Geef zo'n route.
      antwoord: |-
        bijvoorbeeld $A, B, C, E, B, D, E, F, D, A$
      uitwerking: |-
        Zoals bij het inlassen van circuits: de circuits $A, B, D, A$ en $B, C, E, B$ en $D, E, F, D$ aan elkaar.
    - opgave: |-
        Hoe lang is zijn tocht? Hangt dat af van de route die hij kiest?
      antwoord: |-
        $29$ hm; nee
      uitwerking: |-
        Een eulercircuit gebruikt elk wandelpad precies één keer, dus de lengte is de som van alle gewichten: $3 + 4 + 2 + 5 + 3 + 2 + 4 + 3 + 3 = 29$, welk eulercircuit hij ook kiest.

- id: h2-o18
  soort: opdracht
  niveau: 3
  thema: |-
    het probleem van de postbode
  opgave: |-
    Een postbode vertrekt aan het postkantoor $A$, moet door elke straat minstens één keer, en komt terug in $A$. De lengtes staan in hm.
  figuur:
    code: |-
      \begin{tikzpicture}
        \knopen{A/0/0, B/2.4/0, C/2.4/1.8, D/0/1.8}
        \gbogen{A/B/4, B/C/3, C/D/4, D/A/3, A/C/8}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Kan hij elke straat precies één keer doorlopen en terugkomen in $A$?
      antwoord: |-
        nee
      uitwerking: |-
        $A$ en $C$ hebben graad 3.
    - opgave: |-
        Welke straten moet hij twee keer doorlopen voor de kortste tocht? Hoe lang is die tocht?
      antwoord: |-
        $AB$ en $BC$ (of $AD$ en $DC$); $29$ hm
      uitwerking: |-
        Loopt hij een straat twee keer, dan is dat alsof die straat er een tweede keer ligt. Hij moet de oneven graden van $A$ en $C$ even maken: daarvoor dubbelt hij een route van $A$ naar $C$, het liefst de kortste. Dat is $A, B, C$ of $A, D, C$ (7 hm), korter dan $AC$ (8 hm). De tocht is de som van alle straten plus die route: $22 + 7 = 29$ hm. Bijvoorbeeld $A, B, C, B, A, C, D, A$, die $AB$ en $BC$ twee keer doorloopt: $4 + 3 + 3 + 4 + 8 + 4 + 3 = 29$.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    kleuren: een examenrooster
  opgave: |-
    Een school plant examens voor wiskunde ($W$), Frans ($F$), Nederlands ($N$), Engels ($E$), geschiedenis ($G$) en biologie ($B$). Twee examens die een leerling allebei aflegt, mogen niet op dezelfde dag. Die paren zijn: $W$ en $F$, $W$ en $N$, $W$ en $E$, $F$ en $N$, $N$ en $G$, $E$ en $G$, $F$ en $B$, $B$ en $G$. Teken een graaf met een boog tussen twee examens die niet op dezelfde dag mogen.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom zijn twee dagen zeker te weinig?
      antwoord: |-
        $W$, $F$ en $N$ zijn drie buren van elkaar
      uitwerking: |-
        $W$, $F$ en $N$ zijn twee aan twee verbonden: ze moeten op drie verschillende dagen.
    - opgave: |-
        Maak een rooster met zo weinig mogelijk dagen.
      antwoord: |-
        3 dagen, bijvoorbeeld $W, G$ / $F, E$ / $N, B$
      uitwerking: |-
        Geef elke dag een kleur, en geef buren nooit dezelfde kleur. Dag 1: $W$ en $G$ (geen boog $WG$). Dag 2: $F$ en $E$. Dag 3: $N$ en $B$. Geen enkele boog verbindt twee examens van dezelfde dag.
        \figuren{\begin{tikzpicture}
          \knopen{W/0/0, F/1.5/1, N/1.5/-1, E/0/-2, G/3/-2, B/3/1}
          \bogen{W/F, W/N, W/E, F/N, N/G, E/G, F/B, B/G}
        \end{tikzpicture}}

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    elke straat in twee richtingen
  opgave: |-
    Een vuilniswagen haalt in een wijk het afval op. Hij moet door elke straat twee keer: één keer voor elke kant van de straat. Toon aan dat hij dat altijd kan doen in één rondrit, zonder een straat meer dan twee keer te rijden, als je van elk kruispunt naar elk ander kunt rijden.
  antwoord: |-
    zie de uitwerking
  uitwerking: |-
    Teken elke straat twee keer, als twee bogen. Dan verdubbelt de graad van elk kruispunt, en elke graad is even. De graaf is samenhangend, dus er is een eulercircuit: een rondrit die elke boog precies één keer gebruikt, dus elke straat precies twee keer.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    afspreken in het midden
  opgave: |-
    Twee vrienden wonen in $A$ en $F$ van de graaf in voorbeeld~\ref{vb:h2-dijkstra}. Ze willen afspreken in een van de zes plaatsen, zodat wie het langst onderweg is, zo kort mogelijk onderweg is. Welke plaats kiezen ze?
  antwoord: |-
    $D$ (hoogstens 8 minuten)
  uitwerking: |-
    Vanuit $A$ geeft het algoritme: $B$ 3, $C$ 2, $D$ 8, $E$ 10, $F$ 13. Vanuit $F$: $E$ 3, $D$ 5, $B$ 10, $C$ 11, $A$ 13. De langste reistijd per plaats: $A$ 13, $B$ 10, $C$ 11, $D$ 8, $E$ 10, $F$ 13. Ze spreken af in $D$.

- id: h2-o24
  soort: opdracht
  niveau: 1
  thema: |-
    beslissen met alleen de graden
  opgave: |-
    Een samenhangende graaf heeft deze graden. Heeft hij een eulercircuit, een eulerspoor dat niet sluit, of geen van beide?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2, 2, 4, 4, 2$
      antwoord: |-
        eulercircuit
      uitwerking: |-
        Alle graden zijn even.
    - opgave: |-
        $3, 3, 2, 2$
      antwoord: |-
        eulerspoor
      uitwerking: |-
        Twee oneven graden.
    - opgave: |-
        $3, 3, 3, 1$
      antwoord: |-
        geen van beide
      uitwerking: |-
        Vier oneven graden.
    - opgave: |-
        $1, 1$
      antwoord: |-
        eulerspoor
      uitwerking: |-
        Twee knopen met één boog ertussen: het spoor is die boog.
    - opgave: |-
        $4, 4, 4, 4, 4$
      antwoord: |-
        eulercircuit
      uitwerking: |-
        Alle graden zijn even (bijvoorbeeld de volledige graaf met 5 knopen).
    - opgave: |-
        $5, 3, 2, 2, 2$
      antwoord: |-
        eulerspoor
      uitwerking: |-
        Twee oneven graden: van de knoop met graad 5 naar die met graad 3.

- id: h2-o22
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: het aantal halen
  opgave: |-
    Een samenhangende graaf heeft $2k$ knopen met een oneven graad, met $k \geqslant 1$. Bewijs dat je hem in $k$ halen kunt tekenen, en niet in minder. Een haal is een spoor, en elke boog wordt in precies één haal getekend.
  antwoord: |-
    zie de uitwerking
  uitwerking: |-
    Niet minder: in een knoop met een oneven graad kan niet elke haal die er langs komt evenveel bogen aankomen als vertrekken, dus in elke oneven knoop begint of eindigt een haal. Een haal heeft maar twee uiteinden, dus voor $2k$ oneven knopen zijn er minstens $k$ halen. Wel $k$: verdeel de oneven knopen in $k$ paren en voeg tussen elk paar een extra boog toe. Nu zijn alle graden even, en is er een eulercircuit. Schrap de $k$ extra bogen uit het circuit: het valt uiteen in $k$ sporen, die samen alle echte bogen precies één keer gebruiken. Zo heeft de volledige graaf met 4 knopen twee halen nodig.

- id: h2-o23
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: waarom het algoritme van Dijkstra werkt
  opgave: |-
    Alle gewichten zijn positief. In een stap van het algoritme heeft knoop $X$ de kleinste voorlopige afstand $d$ van alle knopen die nog niet definitief zijn. Leg uit waarom geen enkele route van het vertrekpunt naar $X$ korter is dan $d$.
  antwoord: |-
    zie de uitwerking
  uitwerking: |-
    Neem een route van het vertrekpunt naar $X$. Ze begint bij definitieve knopen en eindigt in $X$, dat nog niet definitief is. Neem de eerste knoop $Y$ op de route die nog niet definitief is. Het stuk tot $Y$ loopt over definitieve knopen en dan één boog naar $Y$, dus is het minstens de voorlopige afstand van $Y$, en die is minstens $d$, want $d$ is de kleinste. Het stuk van $Y$ tot $X$ heeft positieve gewichten, dus de hele route is minstens $d$. Met negatieve gewichten loopt dat mis.

