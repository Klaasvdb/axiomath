- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Welke naam past het best bij de rij knopen: wandeling, spoor, circuit, pad of cykel? Of is het geen wandeling?
  figuur:
    code: |-
      \begin{tikzpicture}
        \knopen{A/0/0, B/0/1.6, C/1.6/1.6, D/1.6/0, E/3/.8}
        \bogen{A/B, B/C, C/D, D/A, A/C, C/E, D/E}
      \end{tikzpicture}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $A, B, C, A$
      antwoord: |-
        cykel
      uitwerking: |-
        Drie verschillende bogen, terug in $A$, en verder geen knoop twee keer.
    - opgave: |-
        $A, C, E, D, C$
      antwoord: |-
        spoor
      uitwerking: |-
        $AC$, $CE$, $ED$, $DC$ zijn verschillend, maar $C$ komt twee keer voor.
    - opgave: |-
        $B, D$
      antwoord: |-
        geen wandeling
      uitwerking: |-
        Er is geen boog $BD$.
    - opgave: |-
        $A, C, D, A, C$
      antwoord: |-
        wandeling
      uitwerking: |-
        $AC$ wordt twee keer gebruikt.
    - opgave: |-
        $B, C, E, D$
      antwoord: |-
        pad
      uitwerking: |-
        Vier verschillende knopen, verbonden door bogen.
    - opgave: |-
        $A, C, E, D, C, B, A$
      antwoord: |-
        circuit
      uitwerking: |-
        Zes verschillende bogen en terug in $A$, maar $C$ komt twee keer voor.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Is de graaf samenhangend? Zo niet: hoeveel bogen moet je minstens toevoegen?
  figuur:
    code: |-
