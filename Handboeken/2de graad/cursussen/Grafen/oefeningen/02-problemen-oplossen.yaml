        \knopen{A/0/0, B/1.2/.8, C/1.2/-.6, D/2.8/.8, E/4/.8, F/3.4/-.4, G/5/-.4}
        \bogen{A/B, B/C, D/E, E/F, F/D}
      \end{tikzpicture}
  antwoord: |-
    nee; 2
  uitwerking: |-
