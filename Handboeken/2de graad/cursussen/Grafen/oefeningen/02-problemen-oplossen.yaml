- id: h2-t3
  soort: test
  niveau: 2
  opgave: |-
    In een rivier liggen twee eilanden $X$ en $Y$, tussen de noordoever $N$ en de zuidoever $Z$.
    \figuren{\begin{tikzpicture}[font=\footnotesize]
      \fill[hd1!16] (0,-.8) rectangle (6,.8);
      \fill[white] (1.6,0) ellipse (.9 and .35); \fill[white] (4.4,0) ellipse (.9 and .35);
      \draw[lijngrijs] (0,.8) -- (6,.8) (0,-.8) -- (6,-.8) (1.6,0) ellipse (.9 and .35) (4.4,0) ellipse (.9 and .35);
      \fill[black!60] (1.54,.3) rectangle (1.66,.84); \fill[black!60] (1.54,-.84) rectangle (1.66,-.3);
      \fill[black!60] (2.45,-.06) rectangle (3.55,.06);
      \fill[black!60] (4.34,.3) rectangle (4.46,.84);
      \fill[black!60] (3.94,-.84) rectangle (4.06,-.28); \fill[black!60] (4.74,-.84) rectangle (4.86,-.28);
      \node at (1.6,0) {$X$}; \node at (4.4,0) {$Y$}; \node at (3,1.1) {$N$}; \node at (3,-1.1) {$Z$};
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Stel de stadsdelen en de bruggen voor met een graaf.
      antwoord: |-
        zie de figuur
      uitwerking: |-
        Bogen $NX$, $ZX$, $XY$, $NY$ en twee keer $ZY$.
        \figuren{\begin{tikzpicture}
          \knopen{N/1.4/1.3, X/0/0, Y/2.8/0, Z/1.4/-1.3}
          \bogen{N/X, Z/X, X/Y, N/Y}
          \draw[boog] (Z) to[bend left=15] (Y); \draw[boog] (Z) to[bend right=15] (Y);
        \end{tikzpicture}}
    - opgave: |-
        Kun je een wandeling maken die elke brug precies één keer oversteekt? Zo ja, waar begin en eindig je?
      antwoord: |-
        ja, van $X$ naar $Z$ (of omgekeerd)
      uitwerking: |-
        $\gr{N} = 2$, $\gr{X} = 3$, $\gr{Y} = 4$, $\gr{Z} = 3$: twee oneven graden. Bijvoorbeeld $X, N, Y, Z, Y, X, Z$.

- id: h2-t4
  soort: test
  niveau: 1
  opgave: |-
    Heeft de graaf een eulercircuit, een eulerspoor dat niet sluit, of geen van beide?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.7]
          \foreach \n/\x/\y in {h/.8/.8, a/0/0, b/1.6/0, c/1.6/1.6, d/0/1.6}{\coordinate (\n) at (\x,\y);}
          \draw[boog] (a) -- (b) -- (c) -- (d) -- (a) (h) -- (a) (h) -- (b) (h) -- (c) (h) -- (d);
          \foreach \n in {h,a,b,c,d}{\node[punt] at (\n) {};}
        \end{tikzpicture}
      antwoord: |-
        geen van beide
      uitwerking: |-
        De vier hoeken hebben graad 3.
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.7]
          \foreach \i in {0,...,5}{\coordinate (v\i) at ({60*\i}:.9);}
          \draw[boog] (v0) -- (v1) -- (v2) -- (v3) -- (v4) -- (v5) -- (v0);
          \foreach \i in {0,...,5}{\node[punt] at (v\i) {};}
        \end{tikzpicture}
      antwoord: |-
        eulercircuit
      uitwerking: |-
        Alle graden zijn 2.
    - opgave: |-
        \begin{tikzpicture}[baseline=0,scale=.7]
          \foreach \n/\x/\y in {a/0/0, b/1.4/0, c/.7/1.2, d/.7/2.3}{\coordinate (\n) at (\x,\y);}
          \draw[boog] (a) -- (b) -- (c) -- (a) (c) -- (d);
          \foreach \n in {a,b,c,d}{\node[punt] at (\n) {};}
        \end{tikzpicture}
      antwoord: |-
        eulerspoor
      uitwerking: |-
        De bovenste knoop heeft graad 1, de top van de driehoek graad 3: het spoor loopt van de ene naar de andere.

- id: h2-t5
  soort: test
  niveau: 1
  opgave: |-
    Toon aan dat de graaf een eulercircuit heeft, en zoek er een.
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.9]
        \knopen{A/0/0, B/1.5/0, C/1.5/1.5, D/0/1.5, E/3/1.5, F/3/3, G/1.5/3}
        \bogen{A/B, B/C, C/D, D/A, C/E, E/F, F/G, G/C}
      \end{tikzpicture}
  antwoord: |-
    bijvoorbeeld $A, B, C, E, F, G, C, D, A$
  uitwerking: |-
    Samenhangend; $C$ heeft graad 4, de andere knopen graad 2. Eerste circuit $A, B, C, D, A$, en op de plaats van $C$ het circuit $C, E, F, G, C$ inlassen.

- id: h2-t6
  soort: test
  niveau: 1
  opgave: |-
    Waar moet een eulerspoor beginnen? Zoek er een.
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.9]
        \knopen{A/0/0, B/2/0, C/2/2, D/0/2, E/1/3}
        \bogen{A/B, B/C, C/D, D/A, D/E, E/C, A/C}
      \end{tikzpicture}
  antwoord: |-
    in $A$ of $D$; bijvoorbeeld $A, B, C, D, A, C, E, D$
  uitwerking: |-
    $\gr{A} = \gr{D} = 3$, $\gr{C} = 4$, $\gr{B} = \gr{E} = 2$: een eulerspoor van $A$ naar $D$, zoals $A, B, C, D, A, C, E, D$.

- id: h2-t7
  soort: test
  niveau: 1
  opgave: |-
    Zoek met het algoritme van Dijkstra de kortste route van $A$ naar $F$. Hoe lang is ze?
  figuur:
    code: |-
      \begin{tikzpicture}
        \knopen{A/0/0, B/1.6/1.1, C/1.6/-1.1, D/3.2/0, E/4.6/-1.1, F/4.8/1.1}
        \gbogen{A/B/2, A/C/1, C/B/4, B/D/6, C/D/3, C/E/9, D/E/4, D/F/7, E/F/2}
      \end{tikzpicture}
  antwoord: |-
    $A, C, D, E, F$; lengte $10$
  uitwerking: |-
    $A$ 0; $C$ 1; $B$ 2; $D$ 4 (via $C$, beter dan $2 + 6 = 8$); $E$ 8 (via $D$, beter dan $1 + 9 = 10$); $F$ 10 (via $E$, beter dan $4 + 7 = 11$).
