# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of zet om.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        3,5~m in cm
      antwoord: |-
        350~cm
      uitwerking: |-
        $3{,}5 \cdot 100 = 350$.
    - opgave: |-
        $125\,000$~cm in km
      antwoord: |-
        1,25~km
      uitwerking: |-
        $125\,000~\text{cm} = 1250~\text{m} = 1{,}25~\text{km}$.
    - opgave: |-
        2,4~m$^2$ in cm$^2$
      antwoord: |-
        $24\,000$~cm$^2$
      uitwerking: |-
        $1~\text{m}^2 = 100 \cdot 100~\text{cm}^2 = 10\,000~\text{cm}^2$, dus $2{,}4 \cdot 10\,000 = 24\,000$.
    - opgave: |-
        de oppervlakte van een rechthoek van 6~cm bij 4,5~cm
      antwoord: |-
        27~cm$^2$
      uitwerking: |-
        $6 \cdot 4{,}5 = 27$.
    - opgave: |-
        het volume van een kubus met ribbe 3~cm
      antwoord: |-
        27~cm$^3$
      uitwerking: |-
        $3^3 = 27$.
    - opgave: |-
        $x$ als $\dfrac35 = \dfrac{x}{20}$
      antwoord: |-
        $x = 12$
      uitwerking: |-
        $20$ is $4 \cdot 5$, dus $x = 4 \cdot 3 = 12$.

- id: h1-verken
  soort: start
  figuur:
    opties: |-
      2.2cm
    code: |-
      \begin{tikzpicture}[scale=.5]
        \ruitjes{-.5}{-.5}{3.5}{3.5}
        \filldraw[fill=accent!30,draw=accent,thick] (0,0) -- (2,0) -- (2,1) -- (1,1) -- (1,2) -- (0,2) -- cycle;
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken}\quad De figuur hiernaast bestaat uit drie hokjes.
  lijst: enumerate
  delen:
    - opgave: |-
        Neem de figuur over op ruitjespapier en teken ernaast een vergroting: elke lengte twee keer zo lang.
      antwoord: |-
        een L-vorm van 4 bij 4 hokjes
      uitwerking: |-
        Elke zijde van 1 hokje wordt 2 hokjes, elke zijde van 2 hokjes wordt 4 hokjes.
        \figuren{\begin{tikzpicture}[scale=.3]
          \ruitjes{-.5}{-.5}{4.5}{4.5}
          \filldraw[fill=accent!30,draw=accent,thick] (0,0) -- (4,0) -- (4,2) -- (2,2) -- (2,4) -- (0,4) -- cycle;
        \end{tikzpicture}}
    - opgave: |-
        Hoeveel keer zo lang is de omtrek van de vergroting?
      antwoord: |-
        2 keer
      uitwerking: |-
        De omtrek gaat van 8 naar 16 hokjeszijden.
    - opgave: |-
        Hoeveel hokjes beslaat de vergroting? Hoeveel keer zo groot is de oppervlakte?
      antwoord: |-
        12 hokjes, 4 keer
      uitwerking: |-
        Elk hokje van de figuur wordt een vierkant van 2 bij 2 hokjes: $3 \cdot 4 = 12$.
    - opgave: |-
        Wat denk je dat er met de oppervlakte gebeurt als je de figuur drie keer zo groot tekent? Controleer.
      antwoord: |-
        9 keer zo groot: 27 hokjes
      uitwerking: |-
        Elk hokje wordt een vierkant van 3 bij 3 hokjes, dus $3 \cdot 9 = 27$ hokjes.

- id: h1-schaal
  soort: kort
  opgave: |-
    Bereken de ontbrekende lengte.
  lijst: enumerate
  delen:
    - opgave: |-
        Op een kaart met schaal $\schaal{1}{50\,000}$ meet je 3,2~cm. Hoe ver is dat echt?
      antwoord: |-
        1,6~km
      uitwerking: |-
        $3{,}2 \cdot 50\,000 = 160\,000~\text{cm} = 1600~\text{m} = 1{,}6~\text{km}$.
    - opgave: |-
        Een muur van 5,7~m wordt getekend op schaal $\schaal{1}{100}$. Hoe lang is hij op het plan?
      antwoord: |-
        5,7~cm
      uitwerking: |-
        $570~\text{cm} : 100 = 5{,}7~\text{cm}$.
    - opgave: |-
        Twee steden liggen 120~km uit elkaar. Hoe ver liggen ze uit elkaar op een kaart met schaal $\schaal{1}{200\,000}$?
      antwoord: |-
        60~cm
      uitwerking: |-
        $120~\text{km} = 12\,000\,000~\text{cm}$, en $12\,000\,000 : 200\,000 = 60~\text{cm}$.
    - opgave: |-
        Een modeltrein heeft schaal $\schaal{1}{87}$. Een wagon is 18~cm lang. Hoe lang is de echte wagon?
      antwoord: |-
        15,66~m
      uitwerking: |-
        $18 \cdot 87 = 1566~\text{cm} = 15{,}66~\text{m}$.

- id: h1-bepaal
  soort: kort
  opgave: |-
    Bepaal de schaal.
  lijst: enumerate
  delen:
    - opgave: |-
        Op een kaart is een afstand van 4~km getekend als 16~cm.
      antwoord: |-
        $\schaal{1}{25\,000}$
      uitwerking: |-
        $4~\text{km} = 400\,000~\text{cm}$, en $400\,000 : 16 = 25\,000$.
    - opgave: |-
        Een souvenir van de Eiffeltoren is 22~cm hoog. De echte toren is 330~m hoog.
      antwoord: |-
        $\schaal{1}{1500}$
      uitwerking: |-
        $330~\text{m} = 33\,000~\text{cm}$, en $33\,000 : 22 = 1500$.
    - opgave: |-
        Een vlo van 1,5~mm is in een boek getekend als 4,5~cm.
      antwoord: |-
        $\schaal{30}{1}$
      uitwerking: |-
        $4{,}5~\text{cm} = 45~\text{mm}$, en $45 : 1{,}5 = 30$: een vergroting.

- id: h1-maatstok
  soort: kort
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[font=\scriptsize]
        \fill[accent!6] (-.2,-.6) rectangle (3.4,3.8);
        \draw[accent!45,line width=2.5pt] plot[smooth] coordinates {(-.2,2.6) (1,2.2) (2.2,2.7) (3.4,2.3)};
        \fill (.4,.2) circle (1.5pt) node[right=2pt] {$A$};
        \fill (2.8,3.4) circle (1.5pt) node[left=2pt] {$B$};
        \maatstok{0}{-.45}{2.5}{5}{1 km}
      \end{tikzpicture}
  opgave: |-
    Op de kaart hiernaast hoort de maatstok van 2,5~cm bij 1~km.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de schaal van de kaart.
      antwoord: |-
        $\schaal{1}{40\,000}$
      uitwerking: |-
        $1~\text{km} = 100\,000~\text{cm}$, en $100\,000 : 2{,}5 = 40\,000$.
    - opgave: |-
        Meet de afstand van $A$ tot $B$, en bereken de werkelijke afstand.
      antwoord: |-
        4~cm, dus 1,6~km
      uitwerking: |-
        $4 \cdot 40\,000 = 160\,000~\text{cm} = 1{,}6~\text{km}$.
    - opgave: |-
        Je kopieert de kaart op 200~\%. Hoe lang is de maatstok dan, en wat is de nieuwe schaal?
      antwoord: |-
        5~cm, $\schaal{1}{20\,000}$
      uitwerking: |-
        Alles op de kaart wordt twee keer zo lang: 5~cm voor 1~km, dus $100\,000 : 5 = 20\,000$.

- id: h1-construeer
  soort: kort
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.42,font=\scriptsize]
        \ruitjes{-1}{-1}{7}{7}
        \filldraw[fill=accent!30,draw=accent,thick] (2,0) -- (4,2) -- (0,4) -- cycle;
        \punt[below left]{0}{0}{O}
        \node[below] at (2,0) {$P$}; \node[right] at (4,2) {$Q$}; \node[left] at (0,4) {$R$};
      \end{tikzpicture}
  opgave: |-
    Neem de figuur over op ruitjespapier. Teken het beeld van driehoek $PQR$ bij de homothetie met centrum $O$ en de gegeven factor. Geef de hoekpunten van het beeld met coördinaten, met $O$ als oorsprong.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        factor $\tfrac12$
      antwoord: |-
        $(1, 0)$, $(2, 1)$, $(0, 2)$
      uitwerking: |-
        Neem telkens de helft: $P(2, 0) \to P'(1, 0)$, $Q(4, 2) \to Q'(2, 1)$, $R(0, 4) \to R'(0, 2)$.
    - opgave: |-
        factor 1,5
      antwoord: |-
        $(3, 0)$, $(6, 3)$, $(0, 6)$
      uitwerking: |-
        Vermenigvuldig met 1,5: $P'(3, 0)$, $Q'(6, 3)$, $R'(0, 6)$.

- id: h1-blijft
  soort: kort
  opgave: |-
    Beantwoord de vragen.
  lijst: enumerate
  delen:
    - opgave: |-
        Een vierhoek met omtrek 18~cm wordt vergroot met factor 3. Hoe groot is de omtrek van het beeld?
      antwoord: |-
        54~cm
      uitwerking: |-
        Elke zijde wordt 3 keer zo lang, dus ook de omtrek: $3 \cdot 18 = 54$.
    - opgave: |-
        Bij een homothetie wordt een lijnstuk van 5~cm afgebeeld op een lijnstuk van 2~cm. Wat is de factor?
      antwoord: |-
        0,4
      uitwerking: |-
        $k = \tfrac25 = 0{,}4$: een verkleining.
    - opgave: |-
        Een hoek van $35^\circ$ wordt vergroot met factor 4. Hoe groot is het beeld van die hoek?
      antwoord: |-
        $35^\circ$
      uitwerking: |-
        Een homothetie behoudt hoeken.
    - opgave: |-
        Een homothetie beeldt driehoek $ABC$ af op driehoek $A'B'C'$, met $\lengte{AB} = 6$, $\lengte{A'B'} = 9$ en $\lengte{B'C'} = 12$. Hoe lang is $[BC]$?
      antwoord: |-
        8
      uitwerking: |-
        $k = \tfrac96 = 1{,}5$, dus $\lengte{BC} = 12 : 1{,}5 = 8$.

- id: h1-negatief
  pakketten: [4, 5]
  soort: kort
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.36,font=\scriptsize]
        \ruitjes{-5}{-5}{5}{5}
        \filldraw[fill=accent!30,draw=accent,thick] (2,0) -- (4,2) -- (2,4) -- cycle;
        \punt[below left]{0}{0}{O}
        \node[below] at (2,0) {$A$}; \node[right] at (4,2) {$B$}; \node[above] at (2,4) {$C$};
      \end{tikzpicture}
  opgave: |-
    Neem de figuur over op ruitjespapier. Teken het beeld van driehoek $ABC$ bij de homothetie met centrum $O$ en de gegeven factor.
  lijst: enumerate
  delen:
    - opgave: |-
        factor $-1$
      antwoord: |-
        $(-2, 0)$, $(-4, -2)$, $(-2, -4)$
      uitwerking: |-
        Even ver, aan de overkant van $O$: de puntspiegeling om $O$.
    - opgave: |-
        factor $-\tfrac12$
      antwoord: |-
        $(-1, 0)$, $(-2, -1)$, $(-1, -2)$
      uitwerking: |-
        De helft van de afstand, aan de overkant van $O$.
    - opgave: |-
        Hoe lang is $[A'B']$ in vergelijking met $[AB]$, in beide gevallen?
      antwoord: |-
        even lang; half zo lang
      uitwerking: |-
        Lengtes worden $\abs{k}$ keer zo groot: $\abs{-1} = 1$ en $\Abs{-\tfrac12} = \tfrac12$.

- id: h1-gelijkvormig
  soort: kort
  opgave: |-
    Zijn de twee figuren gelijkvormig? Geef de factor als ze dat zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        een rechthoek van 3 bij 5 en een rechthoek van 7,5 bij 12,5
      antwoord: |-
        ja, $k = 2{,}5$
      uitwerking: |-
        $\tfrac{7{,}5}{3} = 2{,}5$ en $\tfrac{12{,}5}{5} = 2{,}5$, en alle hoeken zijn recht.
    - opgave: |-
        een rechthoek van 2 bij 3 en een rechthoek van 3 bij 4
      antwoord: |-
        nee
      uitwerking: |-
        $\tfrac32 = 1{,}5$, maar $\tfrac43 \approx 1{,}33$.
    - opgave: |-
        een cirkel met straal 2 en een cirkel met straal 7
      antwoord: |-
        ja, $k = 3{,}5$
      uitwerking: |-
        Een homothetie vanuit het middelpunt met factor $\tfrac72$ beeldt de kleine cirkel af op een cirkel met straal 7. Twee cirkels zijn altijd gelijkvormig.
    - opgave: |-
        een ruit met zijde 3 en hoeken van $60^\circ$ en $120^\circ$, en een ruit met zijde 5 en dezelfde hoeken
      antwoord: |-
        ja, $k = \tfrac53$
      uitwerking: |-
        De hoeken zijn gelijk, en alle zijden hebben dezelfde verhouding $\tfrac53$.

- id: h1-opp
  soort: kort
  opgave: |-
    Beantwoord de vragen.
  lijst: enumerate
  delen:
    - opgave: |-
        Een figuur met een oppervlakte van 12~cm$^2$ wordt vergroot met factor 3. Hoe groot is de oppervlakte van het beeld?
      antwoord: |-
        108~cm$^2$
      uitwerking: |-
        $3^2 \cdot 12 = 9 \cdot 12 = 108$.
    - opgave: |-
        Een figuur met een oppervlakte van 40~cm$^2$ wordt verkleind met factor $\tfrac12$. Hoe groot is de oppervlakte van het beeld?
      antwoord: |-
        10~cm$^2$
      uitwerking: |-
        $\bigl(\tfrac12\bigr)^2 \cdot 40 = \tfrac14 \cdot 40 = 10$.
    - opgave: |-
        Op een kaart met schaal $\schaal{1}{10\,000}$ heeft een meer een oppervlakte van 3,5~cm$^2$. Hoe groot is het meer echt, in m$^2$?
      antwoord: |-
        $35\,000$~m$^2$
      uitwerking: |-
        $k^2 = 10\,000^2 = 100\,000\,000$, dus $3{,}5 \cdot 100\,000\,000 = 350\,000\,000~\text{cm}^2 = 35\,000~\text{m}^2$.
    - opgave: |-
        Na een vergroting is de oppervlakte van een figuur 25 keer zo groot. Met welke factor werd ze vergroot?
      antwoord: |-
        5
      uitwerking: |-
        $k^2 = 25$, dus $k = \sqrt{25} = 5$.

- id: h1-vol
  soort: kort
  opgave: |-
    Beantwoord de vragen.
  lijst: enumerate
  delen:
    - opgave: |-
        Een lichaam met een volume van 20~cm$^3$ wordt vergroot met factor 2. Hoe groot is het volume van het beeld?
      antwoord: |-
        160~cm$^3$
      uitwerking: |-
        $2^3 \cdot 20 = 8 \cdot 20 = 160$.
    - opgave: |-
        Een model van een vrachtschip op schaal $\schaal{1}{100}$ heeft een volume van 2~dm$^3$. Hoe groot is het volume van het echte schip, in m$^3$?
      antwoord: |-
        2000~m$^3$
      uitwerking: |-
        $100^3 = 1\,000\,000$, dus $2\,000\,000~\text{dm}^3 = 2000~\text{m}^3$ (want $1~\text{m}^3 = 1000~\text{dm}^3$).
    - opgave: |-
        Een massief beeldje van 10~cm hoog weegt 300~g. Hoeveel weegt een gelijkvormig beeldje van 5~cm hoog uit hetzelfde materiaal?
      antwoord: |-
        37,5~g
      uitwerking: |-
        $k = \tfrac12$, dus de massa wordt $\bigl(\tfrac12\bigr)^3 = \tfrac18$ keer zo groot: $300 : 8 = 37{,}5$.
    - opgave: |-
        In een grote doos past 64 keer zoveel als in een kleine gelijkvormige doos. Hoeveel keer zo lang zijn de ribben van de grote doos?
      antwoord: |-
        4 keer
      uitwerking: |-
        $k^3 = 64$, dus $k = 4$, want $4^3 = 64$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    rekenen met een schaal
  opgave: |-
    Bereken de werkelijke lengte of de lengte op de tekening.
  lijst: enumerate
  delen:
    - opgave: |-
        kaart $\schaal{1}{25\,000}$: 12~cm op de kaart
      antwoord: |-
        3~km
      uitwerking: |-
        $12 \cdot 25\,000 = 300\,000~\text{cm} = 3~\text{km}$.
    - opgave: |-
        kaart $\schaal{1}{1\,000\,000}$: 8,5~cm op de kaart
      antwoord: |-
        85~km
      uitwerking: |-
        $8{,}5 \cdot 1\,000\,000 = 8\,500\,000~\text{cm} = 85~\text{km}$.
    - opgave: |-
        plan $\schaal{1}{50}$: een deur van 0,9~m breed
      antwoord: |-
        1,8~cm
      uitwerking: |-
        $90 : 50 = 1{,}8~\text{cm}$.
    - opgave: |-
        kaart $\schaal{1}{20\,000}$: een weg van 2,6~km
      antwoord: |-
        13~cm
      uitwerking: |-
        $260\,000 : 20\,000 = 13~\text{cm}$.
    - opgave: |-
        plan $\schaal{1}{200}$: 3,4~cm op het plan
      antwoord: |-
        6,8~m
      uitwerking: |-
        $3{,}4 \cdot 200 = 680~\text{cm} = 6{,}8~\text{m}$.
    - opgave: |-
        foto door een microscoop, $\schaal{400}{1}$: een cel van 0,02~mm
      antwoord: |-
        8~mm
      uitwerking: |-
        Een vergroting: $0{,}02 \cdot 400 = 8~\text{mm}$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    gelijkvormige figuren herkennen
  opgave: |-
    Zijn twee zulke figuren altijd gelijkvormig? Leg uit.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        twee gelijkzijdige driehoeken
      antwoord: |-
        ja
      uitwerking: |-
        Alle hoeken zijn $60^\circ$, en de drie zijden hebben dezelfde verhouding.
    - opgave: |-
        twee rechthoeken
      antwoord: |-
        nee
      uitwerking: |-
        De hoeken zijn gelijk, maar de zijden niet altijd in dezelfde verhouding: 1 bij 1 en 1 bij 3.
    - opgave: |-
        twee vierkanten
      antwoord: |-
        ja
      uitwerking: |-
        Alle hoeken zijn recht en alle zijden hebben dezelfde verhouding.
    - opgave: |-
        twee ruiten
      antwoord: |-
        nee
      uitwerking: |-
        De zijden hebben dezelfde verhouding, maar de hoeken kunnen verschillen.
    - opgave: |-
        twee kubussen
      antwoord: |-
        ja
      uitwerking: |-
        Alle ribben worden met dezelfde factor vermenigvuldigd, en alle hoeken zijn recht.
    - opgave: |-
        twee gelijkbenige driehoeken
      antwoord: |-
        nee
      uitwerking: |-
        De tophoek kan verschillen, bijvoorbeeld $30^\circ$ en $100^\circ$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    factoren k, k² en k³
  opgave: |-
    Een figuur wordt vergroot of verkleind met factor $k$. Met welke factor worden een oppervlakte en een volume vermenigvuldigd?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $k = 2$
      antwoord: |-
        4 en 8
      uitwerking: |-
        $2^2 = 4$, $2^3 = 8$.
    - opgave: |-
        $k = 5$
      antwoord: |-
        25 en 125
      uitwerking: |-
        $5^2 = 25$, $5^3 = 125$.
    - opgave: |-
        $k = 10$
      antwoord: |-
        100 en 1000
      uitwerking: |-
        $10^2 = 100$, $10^3 = 1000$.
    - opgave: |-
        $k = \tfrac12$
      antwoord: |-
        $\tfrac14$ en $\tfrac18$
      uitwerking: |-
        $\bigl(\tfrac12\bigr)^2 = \tfrac14$, $\bigl(\tfrac12\bigr)^3 = \tfrac18$.
    - opgave: |-
        $k = 0{,}1$
      antwoord: |-
        0,01 en 0,001
      uitwerking: |-
        $0{,}1^2 = 0{,}01$, $0{,}1^3 = 0{,}001$.
    - opgave: |-
        $k = 1{,}5$
      antwoord: |-
        2,25 en 3,375
      uitwerking: |-
        $1{,}5^2 = 2{,}25$, $1{,}5^3 = 3{,}375$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    homothetie tekenen, centrum binnen de figuur
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.36,font=\scriptsize]
        \ruitjes{-5}{-3}{7}{6}
        \filldraw[fill=accent!30,draw=accent,thick] (-2, -1) -- (2, -1) -- (1,2) -- (-1,1) -- cycle;
        \punt[below]{0}{0}{O}
        \node[below left] at (-2, -1) {$A$}; \node[below right] at (2, -1) {$B$}; \node[above] at (1,2) {$C$}; \node[left] at (-1,1) {$D$};
      \end{tikzpicture}
  opgave: |-
    Neem de figuur over op ruitjespapier. Teken het beeld van de vierhoek $ABCD$ bij de gegeven homothetie.
  lijst: enumerate
  delen:
    - opgave: |-
        centrum $O$, factor 2
      antwoord: |-
        $(-4, -2)$, $(4, -2)$, $(2,4)$, $(-2,2)$
      uitwerking: |-
        Het centrum ligt binnen de figuur, dus het beeld ligt rondom het origineel. Elk hoekpunt komt twee keer zo ver van $O$.
    - opgave: |-
        centrum $A$, factor 2
      antwoord: |-
        $A$, $(6, -1)$, $(4,5)$, $(0,3)$
      uitwerking: |-
        $A$ blijft op zijn plaats. Vanuit $A$ is $B$ 4 naar rechts, dus $B'$ 8 naar rechts: $(6, -1)$. $C$ ligt 3 rechts en 3 hoger dan $A$, dus $C'$ 6 rechts en 6 hoger: $(4,5)$. Zo ook $D'(0,3)$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    plattegrond op schaal
  opgave: |-
    Hieronder staat de plattegrond van een appartement op ware grootte, op schaal $\schaal{1}{100}$.
    \figuren{\begin{tikzpicture}[font=\scriptsize]
      \fill[accent!8] (0,0) rectangle (9,6);
      \draw[accent,very thick] (0,0) rectangle (9,6);
      \draw[accent,thick] (5,0) -- (5,6) (5,3.5) -- (9,3.5);
      \node at (2.5,3) {woonkamer};
      \node at (7,4.75) {keuken};
      \node at (7,1.75) {slaapkamer};
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Meet op het plan. Hoe lang en hoe breed zijn het appartement en elke kamer in werkelijkheid?
      antwoord: |-
        appartement 9~m bij 6~m; woonkamer 5 bij 6, keuken 4 bij 2,5, slaapkamer 4 bij 3,5 (in m)
      uitwerking: |-
        Bij schaal $\schaal{1}{100}$ is 1~cm op het plan 1~m in werkelijkheid. Het plan is 9~cm bij 6~cm.
    - opgave: |-
        Bereken de oppervlakte van de woonkamer in werkelijkheid. Doe het op twee manieren: met de werkelijke afmetingen, en met de oppervlakte op het plan.
      antwoord: |-
        30~m$^2$
      uitwerking: |-
        $5 \cdot 6 = 30~\text{m}^2$. Op het plan: $30~\text{cm}^2 \cdot 100^2 = 300\,000~\text{cm}^2 = 30~\text{m}^2$.
    - opgave: |-
        In de slaapkamer komt een bed van 1,6~m bij 2~m. Hoe groot teken je het op het plan?
      antwoord: |-
        1,6~cm bij 2~cm
      uitwerking: |-
        $160 : 100 = 1{,}6$ en $200 : 100 = 2$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    omtrek en oppervlakte bij vergroten
  opgave: |-
    Een driehoek heeft een omtrek van 18~cm en een oppervlakte van 12~cm$^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hij wordt vergroot met factor 2,5. Bereken de omtrek en de oppervlakte van het beeld.
      antwoord: |-
        45~cm en 75~cm$^2$
      uitwerking: |-
        Omtrek: $2{,}5 \cdot 18 = 45$. Oppervlakte: $2{,}5^2 \cdot 12 = 6{,}25 \cdot 12 = 75$.
    - opgave: |-
        Hij wordt verkleind met factor $\tfrac13$. Bereken de omtrek en de oppervlakte van het beeld.
      antwoord: |-
        6~cm en $\tfrac43$~cm$^2$
      uitwerking: |-
        Omtrek: $18 : 3 = 6$. Oppervlakte: $12 : 9 = \tfrac43 \approx 1{,}33$.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    de schaal bepalen
  opgave: |-
    Bepaal de schaal.
  lijst: enumerate
  delen:
    - opgave: |-
        Op een kaart is 1~km getekend als 5~cm.
      antwoord: |-
        $\schaal{1}{20\,000}$
      uitwerking: |-
        $100\,000 : 5 = 20\,000$.
    - opgave: |-
        Een huis van 12~m breed is op het plan 24~cm breed.
      antwoord: |-
        $\schaal{1}{50}$
      uitwerking: |-
        $1200 : 24 = 50$.
    - opgave: |-
        Een mug van 6~mm staat op een poster als een mug van 1,2~m.
      antwoord: |-
        $\schaal{200}{1}$
      uitwerking: |-
        $1{,}2~\text{m} = 1200~\text{mm}$, en $1200 : 6 = 200$: een vergroting.
    - opgave: |-
        Een standbeeld van 4,5~m hoog heeft een miniatuur van 15~cm.
      antwoord: |-
        $\schaal{1}{30}$
      uitwerking: |-
        $450 : 15 = 30$.

- id: h1-o8
  soort: opdracht
  niveau: 1
  thema: |-
    oppervlakte en volume van bollen
  opgave: |-
    Een tennisbal heeft een diameter van 6,7~cm, een basketbal 24~cm. Twee bollen zijn altijd gelijkvormig.
  lijst: enumerate
  delen:
    - opgave: |-
        Met welke factor moet je de tennisbal vergroten om de basketbal te krijgen? Rond af op 0,01.
      antwoord: |-
        $k \approx 3{,}58$
      uitwerking: |-
        $k = \tfrac{24}{6{,}7} \approx 3{,}58$.
    - opgave: |-
        Hoeveel keer zoveel lucht zit er in de basketbal?
      antwoord: |-
        ongeveer 46 keer
      uitwerking: |-
        Een volume: $k^3 = \bigl(\tfrac{24}{6{,}7}\bigr)^3 \approx 46{,}0$. Reken met de niet-afgeronde $k$.
    - opgave: |-
        Hoeveel keer zoveel materiaal is er nodig voor het oppervlak?
      antwoord: |-
        ongeveer 12,8 keer
      uitwerking: |-
        Een oppervlakte: $k^2 = \bigl(\tfrac{24}{6{,}7}\bigr)^2 \approx 12{,}8$.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    route op een kaart
  opgave: |-
    Op een kaart met schaal $\schaal{1}{50\,000}$ bestaat een wandelroute uit drie rechte stukken van 2,3~cm, 4,1~cm en 1,6~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de route in werkelijkheid?
      antwoord: |-
        4~km
      uitwerking: |-
        $2{,}3 + 4{,}1 + 1{,}6 = 8~\text{cm}$, en $8 \cdot 50\,000 = 400\,000~\text{cm} = 4~\text{km}$.
    - opgave: |-
        Je wandelt 4~km per uur. Hoe lang duurt de wandeling?
      antwoord: |-
        1 uur
      uitwerking: |-
        $4 : 4 = 1$.
    - opgave: |-
        Hoe lang is dezelfde route op een kaart met schaal $\schaal{1}{25\,000}$?
      antwoord: |-
        16~cm
      uitwerking: |-
        $400\,000 : 25\,000 = 16$. Die kaart toont alles twee keer zo groot.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    centrum en factor van een homothetie zoeken
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[scale=.4,font=\scriptsize]
        \ruitjes{-1}{-1}{9}{7}
        \filldraw[fill=accent!30,draw=accent,thick] (2,1) -- (4,1) -- (2,3) -- cycle;
        \filldraw[fill=accent!12,draw=accent,thick] (4,2) -- (8,2) -- (4,6) -- cycle;
        \node[below] at (2,1) {$A$}; \node[below] at (4,1) {$B$}; \node[left] at (2,3) {$C$};
        \node[left] at (4,2) {$A'$}; \node[below] at (8,2) {$B'$}; \node[left] at (4,6) {$C'$};
      \end{tikzpicture}
  opgave: |-
    Driehoek $A'B'C'$ is het beeld van driehoek $ABC$ bij een homothetie.
  lijst: enumerate
  delen:
    - opgave: |-
        Neem de figuur over en zoek het centrum. Tip: het centrum ligt op de rechte $AA'$.
      antwoord: |-
        het roosterpunt linksonder, 2 links en 1 onder $A$
      uitwerking: |-
        Het centrum, $A$ en $A'$ liggen op één rechte, en zo ook voor $B$ en $C$. De rechten $AA'$, $BB'$ en $CC'$ snijden elkaar in het punt dat 2 hokjes links en 1 hokje onder $A$ ligt.
    - opgave: |-
        Bepaal de factor.
      antwoord: |-
        2
      uitwerking: |-
        $\lengte{A'B'} = 4$ en $\lengte{AB} = 2$, dus $k = 2$.
    - opgave: |-
        Is er ook een homothetie die $A'B'C'$ afbeeldt op $ABC$? Welke?
      antwoord: |-
        ja: hetzelfde centrum, factor $\tfrac12$
      uitwerking: |-
        Elk punt gaat terug naar de helft van zijn afstand tot het centrum.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    foto's vergroten
  opgave: |-
    Een foto is 10~cm bij 15~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Je laat er een poster van maken van 20~cm bij 30~cm. Hoeveel keer zoveel papier is er nodig?
      antwoord: |-
        4 keer
      uitwerking: |-
        $k = 2$, en een oppervlakte wordt $k^2 = 4$ keer zo groot. Controle: $600 : 150 = 4$.
    - opgave: |-
        Is een foto van 13~cm bij 18~cm een vergroting van de foto van 10 bij 15? Leg uit.
      antwoord: |-
        nee
      uitwerking: |-
        $\tfrac{13}{10} = 1{,}3$ maar $\tfrac{18}{15} = 1{,}2$: de verhoudingen verschillen. Een stuk van de foto valt weg, of hij wordt uitgerekt.
    - opgave: |-
        Hoe lang moet een vergroting zijn die 13~cm breed is?
      antwoord: |-
        19,5~cm
      uitwerking: |-
        $k = 1{,}3$, dus $15 \cdot 1{,}3 = 19{,}5$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    verf en hout bij een model
  opgave: |-
    Een schrijnwerker maakt een model van een tuinhuis op schaal $\schaal{1}{20}$. Voor de buitenmuren van het model heeft hij 0,15~liter verf nodig.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel verf is er nodig voor de buitenmuren van het echte tuinhuis, met een even dikke laag?
      antwoord: |-
        60~liter
      uitwerking: |-
        De verf hangt af van de oppervlakte: $k^2 = 20^2 = 400$, en $0{,}15 \cdot 400 = 60$.
    - opgave: |-
        Het model is volledig gelijkvormig, ook de dikte van de planken. Hoeveel keer zoveel hout zit er in het echte tuinhuis?
      antwoord: |-
        8000 keer
      uitwerking: |-
        Een volume: $k^3 = 20^3 = 8000$.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    gelijkvormige dozen
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.13,font=\scriptsize]
        \balk{0}{0}{10}{4}{6}
        \balk{14}{0}{25}{10}{15}
      \end{tikzpicture}
  opgave: |-
    Een kartonnen doos is 10~cm lang, 6~cm breed en 4~cm hoog. Een gelijkvormige doos is 25~cm lang.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de factor en de breedte en hoogte van de grote doos.
      antwoord: |-
        $k = 2{,}5$; 15~cm en 10~cm
      uitwerking: |-
        $k = \tfrac{25}{10} = 2{,}5$, dus $6 \cdot 2{,}5 = 15$ en $4 \cdot 2{,}5 = 10$.
    - opgave: |-
        Bereken het volume van beide dozen. Controleer met $k^3$.
      antwoord: |-
        240~cm$^3$ en 3750~cm$^3$
      uitwerking: |-
        $10 \cdot 6 \cdot 4 = 240$ en $25 \cdot 15 \cdot 10 = 3750$. Controle: $2{,}5^3 \cdot 240 = 15{,}625 \cdot 240 = 3750$.
    - opgave: |-
        Hoeveel karton is er nodig voor elke doos (zonder overlap)? Controleer met $k^2$.
      antwoord: |-
        248~cm$^2$ en 1550~cm$^2$
      uitwerking: |-
        $2(60 + 40 + 24) = 248$ en $2(375 + 250 + 150) = 1550$. Controle: $6{,}25 \cdot 248 = 1550$.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    prijs en volume
  opgave: |-
    Een bakker verkoopt ronde taarten in twee maten, met dezelfde vorm. De kleine heeft een diameter van 18~cm en kost 15~euro. De grote heeft een diameter van 27~cm en kost 40~euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel keer zoveel taart krijg je bij de grote?
      antwoord: |-
        3,375 keer
      uitwerking: |-
        $k = \tfrac{27}{18} = 1{,}5$, en de hoeveelheid is een volume: $1{,}5^3 = 3{,}375$.
    - opgave: |-
        Welke taart is het voordeligst? Leg uit.
      antwoord: |-
        de grote
      uitwerking: |-
        Evenveel taart als de grote kost in kleine taarten $3{,}375 \cdot 15 \approx 50{,}63$ euro, meer dan 40 euro.
    - opgave: |-
        Op de bovenkant ligt een laagje glazuur. Hoeveel keer zoveel glazuur ligt er op de grote?
      antwoord: |-
        2,25 keer
      uitwerking: |-
        Een oppervlakte: $1{,}5^2 = 2{,}25$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    de aarde op een wereldbol
  opgave: |-
    Een wereldbol heeft een diameter van 30~cm. De aarde heeft een diameter van $12\,742$~km.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de schaal van de wereldbol, afgerond op een veelvoud van $100\,000$.
      antwoord: |-
        ongeveer $\schaal{1}{42\,500\,000}$
      uitwerking: |-
        $12\,742~\text{km} = 1\,274\,200\,000~\text{cm}$, en $1\,274\,200\,000 : 30 \approx 42\,473\,333$.
    - opgave: |-
        Brussel en Rome liggen ongeveer 1170~km uit elkaar. Hoe ver is dat op de wereldbol?
      antwoord: |-
        ongeveer 2,8~cm
      uitwerking: |-
        $117\,000\,000 : 42\,473\,333 \approx 2{,}75~\text{cm}$.
    - opgave: |-
        België heeft een oppervlakte van ongeveer $30\,700$~km$^2$. Hoe groot is België op de wereldbol? Een bol is niet vlak, maar voor zo'n klein stuk mag je dat vergeten.
      antwoord: |-
        ongeveer 0,17~cm$^2$
      uitwerking: |-
        $1~\text{km}^2 = 10^{10}~\text{cm}^2$, dus $30\,700~\text{km}^2 = 3{,}07 \cdot 10^{14}~\text{cm}^2$. Deel door $k^2 = 42\,473\,333^2 \approx 1{,}80 \cdot 10^{15}$: ongeveer $0{,}17~\text{cm}^2$, minder dan een vierkantje van 5~mm bij 5~mm.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte op twee kaarten
  opgave: |-
    Een bos heeft op een kaart met schaal $\schaal{1}{50\,000}$ een oppervlakte van 2~cm$^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe groot is het bos op een kaart met schaal $\schaal{1}{25\,000}$?
      antwoord: |-
        8~cm$^2$
      uitwerking: |-
        Op die kaart is elke lengte 2 keer zo lang, dus elke oppervlakte $2^2 = 4$ keer zo groot.
    - opgave: |-
        Hoe groot is het bos in werkelijkheid, in hectare? ($1~\text{ha} = 10\,000~\text{m}^2$)
      antwoord: |-
        50~ha
      uitwerking: |-
        $2 \cdot 50\,000^2 = 5\,000\,000\,000~\text{cm}^2 = 500\,000~\text{m}^2 = 50~\text{ha}$.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    van oppervlakte naar lengte
  opgave: |-
    Beantwoord de vragen.
  lijst: enumerate
  delen:
    - opgave: |-
        Na een vergroting is een oppervlakte 2,25 keer zo groot. Met welke factor werd vergroot?
      antwoord: |-
        1,5
      uitwerking: |-
        $k = \sqrt{2{,}25} = 1{,}5$.
    - opgave: |-
        Een kopieermachine verkleint van A3 naar A4 met 71~\%. Waarom precies dat getal?
      antwoord: |-
        $k = \sqrt{0{,}5} \approx 0{,}71$
      uitwerking: |-
        Een A4 heeft de halve oppervlakte van een A3, dus $k^2 = \tfrac12$ en $k = \sqrt{0{,}5} \approx 0{,}707$.
    - opgave: |-
        Een poster van 50~cm bij 70~cm wordt verkleind tot een gelijkvormige poster met een oppervlakte van 875~cm$^2$. Hoe groot is de kleine poster?
      antwoord: |-
        25~cm bij 35~cm
      uitwerking: |-
        De grote poster heeft een oppervlakte van $3500~\text{cm}^2$. Dan is $k^2 = \tfrac{875}{3500} = \tfrac14$, dus $k = \tfrac12$.

- id: h1-o18
  pakketten: [4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    homothetie met een negatieve factor
  figuur:
    opties: |-
      3.8cm
    code: |-
      \begin{tikzpicture}[scale=.33,font=\scriptsize]
        \ruitjes{-7}{-5}{4}{3}
        \filldraw[fill=accent!30,draw=accent,thick] (1,1) -- (3,1) -- (1,2) -- cycle;
        \punt[below]{0}{0}{O}
        \node[below] at (1,1) {$A$}; \node[below] at (3,1) {$B$}; \node[above] at (1,2) {$C$};
      \end{tikzpicture}
  opgave: |-
    Neem de figuur over op ruitjespapier.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken het beeld van driehoek $ABC$ bij de homothetie met centrum $O$ en factor $-2$.
      antwoord: |-
        $(-2, -2)$, $(-6, -2)$, $(-2, -4)$
      uitwerking: |-
        Twee keer zo ver van $O$, aan de overkant: $A(1, 1) \to A'(-2, -2)$, $B(3, 1) \to B'(-6, -2)$, $C(1, 2) \to C'(-2, -4)$.
    - opgave: |-
        Hoeveel keer zo groot is de oppervlakte van het beeld?
      antwoord: |-
        4 keer
      uitwerking: |-
        Lengtes worden $\abs{-2} = 2$ keer zo groot, oppervlaktes $2^2 = 4$ keer. Controle: 1 en 4 hokjes.
    - opgave: |-
        Welke homothetie beeldt $A'B'C'$ terug af op $ABC$?
      antwoord: |-
        centrum $O$, factor $-\tfrac12$
      uitwerking: |-
        Terug naar de overkant, op de helft van de afstand.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    van volume naar lengte
  opgave: |-
    Een kleine fles van 0,33~liter is 12~cm hoog. Een grote fles met dezelfde vorm bevat 1,5~liter.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe hoog is de grote fles? Gebruik de derdemachtswortel op je rekenmachine, en rond af op 0,1~cm.
      antwoord: |-
        ongeveer 19,9~cm
      uitwerking: |-
        $k^3 = \tfrac{1{,}5}{0{,}33} \approx 4{,}545$, dus $k = \sqrt[3]{4{,}545} \approx 1{,}657$ en $12 \cdot 1{,}657 \approx 19{,}9$.
    - opgave: |-
        Een derde fles met dezelfde vorm is 24~cm hoog. Hoeveel bevat ze?
      antwoord: |-
        2,64~liter
      uitwerking: |-
        $k = 2$ ten opzichte van de kleine fles, dus $2^3 \cdot 0{,}33 = 2{,}64$.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    waarom reuzen niet bestaan
  opgave: |-
    Een mier kan ongeveer 50 keer haar eigen gewicht dragen. De kracht van een spier hangt af van de oppervlakte van haar doorsnede, het gewicht van het volume. Stel dat een mier gelijkvormig 1000 keer zo groot zou worden.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel keer zo groot wordt haar gewicht? En haar spierkracht?
      antwoord: |-
        $10^9$ keer en $10^6$ keer
      uitwerking: |-
        Gewicht: $k^3 = 1000^3 = 10^9$. Kracht: $k^2 = 1000^2 = 10^6$.
    - opgave: |-
        Hoeveel keer haar eigen gewicht kan de reuzenmier nog dragen? Kan ze op haar poten staan?
      antwoord: |-
        0,05 keer: nee
      uitwerking: |-
        De kracht groeit 1000 keer minder dan het gewicht: $50 : 1000 = 0{,}05$. Ze kan maar een twintigste van haar eigen gewicht dragen, dus niet eens zichzelf.
    - opgave: |-
        Verklaar met deze redenering waarom een olifant in verhouding veel dikkere poten heeft dan een hert.
      antwoord: |-
        het gewicht groeit sneller dan de doorsnede
      uitwerking: |-
        Bij een groter dier groeit het gewicht met $k^3$, maar de doorsnede van de poten bij dezelfde vorm maar met $k^2$. Om het gewicht te dragen moeten de poten dus dikker zijn dan bij een gelijkvormige vergroting.

- id: h1-o21
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 3
  thema: |-
    het A-formaat
  opgave: |-
    Een blad A4 is 21~cm bij 29,7~cm. Vouw je het dubbel, door de lange zijde te halveren, dan krijg je een blad A5.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe groot is een A5? Toon aan dat A5 gelijkvormig is met A4, op de afronding na.
      antwoord: |-
        14,85~cm bij 21~cm
      uitwerking: |-
        $\tfrac{21}{14{,}85} \approx 1{,}414$ en $\tfrac{29{,}7}{21} \approx 1{,}414$.
    - opgave: |-
        Een rechthoek heeft een korte zijde $b$ en een lange zijde $l$. Als je hem halveert zoals hierboven, is de helft gelijkvormig met het geheel. Toon aan dat $l = \sqrt2 \cdot b$.
      antwoord: |-
        $l^2 = 2b^2$
      uitwerking: |-
        De helft is $\tfrac l2$ bij $b$, met $b$ als lange zijde. Gelijkvormig: $\dfrac{l}{b} = \dfrac{b}{l/2} = \dfrac{2b}{l}$, dus $l^2 = 2b^2$ en $l = \sqrt2 \cdot b$.
    - opgave: |-
        Een blad A0 heeft een oppervlakte van precies 1~m$^2$ en heeft dezelfde vorm. Hoeveel bladen A4 haal je uit een A0? Bereken de afmetingen van een A0 tot op een millimeter.
      antwoord: |-
        16 bladen; 84,1~cm bij 118,9~cm
      uitwerking: |-
        A0, A1, A2, A3, A4: vier keer halveren geeft $2^4 = 16$ bladen. Uit $b \cdot \sqrt2\, b = 1$ volgt $b^2 = \tfrac{1}{\sqrt2} \approx 0{,}7071$, dus $b \approx 0{,}841~\text{m}$ en $l = \sqrt2\, b \approx 1{,}189~\text{m}$.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    misleidende tekeningen
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \filldraw[fill=accent!25,draw=accent,thick] (0,0) rectangle (.8,1.2) (.25,1.2) rectangle (.55,1.6);
        \filldraw[fill=accent!25,draw=accent,thick] (1.6,0) rectangle (3.2,2.4) (2.1,2.4) rectangle (2.7,3.2);
        \node[below] at (.4,0) {2020}; \node[below] at (2.4,0) {2025};
      \end{tikzpicture}
  opgave: |-
    Een bedrijf verkocht in 2025 twee keer zoveel flessen fruitsap als in 2020. In de krant staan twee gelijkvormige flessen: de tweede is twee keer zo hoog als de eerste.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel keer zo groot lijkt de tweede fles op papier? Waarom is de tekening misleidend?
      antwoord: |-
        4 keer zo groot
      uitwerking: |-
        De oppervlakte op papier wordt $2^2 = 4$ keer zo groot. Het oog vergelijkt de oppervlakte, en ziet dus een verviervoudiging in plaats van een verdubbeling.
    - opgave: |-
        Hoeveel keer zo hoog had de tweede fles moeten zijn, als de oppervlakte op papier de verkoop moet voorstellen?
      antwoord: |-
        $\sqrt2 \approx 1{,}41$ keer
      uitwerking: |-
        $k^2 = 2$, dus $k = \sqrt2$.
    - opgave: |-
        En als je de flessen ziet als echte flessen, met een volume?
      antwoord: |-
        $\sqrt[3]{2} \approx 1{,}26$ keer
      uitwerking: |-
        $k^3 = 2$, dus $k = \sqrt[3]{2} \approx 1{,}26$.

- id: h1-o23
  soort: opdracht
  niveau: 3
  thema: |-
    twee schalen na elkaar
  opgave: |-
    Een architect maakt een maquette van een gebouw op schaal $\schaal{1}{50}$. Hij fotografeert de maquette, en op de foto is ze 4 keer zo klein als in het echt.
  lijst: enumerate
  delen:
    - opgave: |-
        Op welke schaal toont de foto het echte gebouw?
      antwoord: |-
        $\schaal{1}{200}$
      uitwerking: |-
        Eerst 50 keer kleiner, dan nog 4 keer kleiner: $50 \cdot 4 = 200$ keer kleiner.
    - opgave: |-
        Een raam is op de foto 6~mm breed. Hoe breed is het echte raam?
      antwoord: |-
        1,2~m
      uitwerking: |-
        $6 \cdot 200 = 1200~\text{mm} = 1{,}2~\text{m}$.
    - opgave: |-
        De voorgevel heeft op de foto een oppervlakte van 15~cm$^2$. Hoe groot is de echte voorgevel?
      antwoord: |-
        60~m$^2$
      uitwerking: |-
        $15 \cdot 200^2 = 15 \cdot 40\,000 = 600\,000~\text{cm}^2 = 60~\text{m}^2$.

- id: h1-o24
  soort: opdracht
  niveau: 3
  thema: |-
    een kubus van dobbelstenen
  opgave: |-
    Met 1000 dobbelstenen bouw je een grote, volle kubus. Een dobbelsteen is een kubusje met ribbe 1,6~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel dobbelstenen liggen er langs een ribbe, en hoe lang is de ribbe van de grote kubus?
      antwoord: |-
        10; 16~cm
      uitwerking: |-
        $10^3 = 1000$, dus 10 langs elke ribbe, en $10 \cdot 1{,}6 = 16~\text{cm}$.
    - opgave: |-
        Hoeveel keer zoveel papier heb je nodig om de grote kubus in te pakken als voor één dobbelsteen?
      antwoord: |-
        100 keer
      uitwerking: |-
        $k = 10$, dus $k^2 = 100$.
    - opgave: |-
        Hoeveel dobbelstenen zie je niet, omdat ze helemaal binnenin liggen?
      antwoord: |-
        512
      uitwerking: |-
        Haal de buitenste laag weg: dan blijft een kubus van $8 \cdot 8 \cdot 8 = 512$ dobbelstenen over. Aan de buitenkant liggen er dus $1000 - 512 = 488$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    rekenen met een schaal
  opgave: |-
    Op een kaart met schaal $\schaal{1}{50\,000}$ liggen twee dorpen 9,2~cm uit elkaar. Hoe ver liggen ze echt uit elkaar?
  antwoord: |-
    4,6~km
  uitwerking: |-
    $9{,}2 \cdot 50\,000 = 460\,000~\text{cm} = 4{,}6~\text{km}$.

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    de schaal bepalen
  opgave: |-
    Een vliegtuig is 36~m lang. Een model ervan is 24~cm lang. Bepaal de schaal van het model.
  antwoord: |-
    $\schaal{1}{150}$
  uitwerking: |-
    $3600 : 24 = 150$.

- id: h1-t3
  soort: test
  niveau: 1
  thema: |-
    homothetie tekenen
  figuur:
    opties: |-
      2.8cm
    code: |-
      \begin{tikzpicture}[scale=.36,font=\scriptsize]
        \ruitjes{-1}{-1}{7}{7}
        \filldraw[fill=accent!30,draw=accent,thick] (1,0) -- (2,1) -- (0,2) -- cycle;
        \punt[below left]{0}{0}{O}
        \node[below] at (1,0) {$A$}; \node[right] at (2,1) {$B$}; \node[left] at (0,2) {$C$};
      \end{tikzpicture}
  opgave: |-
    Neem de figuur over op ruitjespapier.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken het beeld van driehoek $ABC$ bij de homothetie met centrum $O$ en factor 3.
      antwoord: |-
        $(3, 0)$, $(6, 3)$, $(0, 6)$
      uitwerking: |-
        Elk punt komt 3 keer zo ver van $O$: $A'(3, 0)$, $B'(6, 3)$, $C'(0, 6)$.
    - opgave: |-
        Hoeveel keer zo lang is $[A'B']$ als $[AB]$? Hoe liggen ze ten opzichte van elkaar?
      antwoord: |-
        3 keer; evenwijdig
      uitwerking: |-
        Lengtes worden $k = 3$ keer zo lang, en het beeld van een rechte is een evenwijdige rechte.

- id: h1-t4
  soort: test
  niveau: 1
  thema: |-
    gelijkvormige figuren
  opgave: |-
    Is een rechthoek van 5 bij 8 gelijkvormig met de gegeven rechthoek? Geef de factor als dat zo is.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        7,5 bij 12
      antwoord: |-
        ja, $k = 1{,}5$
      uitwerking: |-
        $\tfrac{7{,}5}{5} = 1{,}5$ en $\tfrac{12}{8} = 1{,}5$.
    - opgave: |-
        10 bij 15
      antwoord: |-
        nee
      uitwerking: |-
        $\tfrac{10}{5} = 2$, maar $\tfrac{15}{8} = 1{,}875$.

- id: h1-t5
  soort: test
  niveau: 2
  thema: |-
    oppervlakte op een plan
  opgave: |-
    Een tuin heeft op een plan met schaal $\schaal{1}{200}$ een oppervlakte van 40~cm$^2$. Hoe groot is de tuin echt, in m$^2$?
  antwoord: |-
    160~m$^2$
  uitwerking: |-
    $40 \cdot 200^2 = 40 \cdot 40\,000 = 1\,600\,000~\text{cm}^2 = 160~\text{m}^2$.

- id: h1-t6
  soort: test
  niveau: 2
  thema: |-
    volume en massa
  opgave: |-
    Een kunstenaar maakt eerst een massief bronzen model van een beeld op schaal $\schaal{1}{10}$. Het model weegt 1,2~kg. Hoeveel weegt het echte, massieve bronzen beeld?
  antwoord: |-
    1200~kg
  uitwerking: |-
    $k = 10$, dus de massa wordt $10^3 = 1000$ keer zo groot: $1{,}2 \cdot 1000 = 1200~\text{kg}$.

- id: h1-t7
  soort: test
  niveau: 2
  thema: |-
    van volume naar lengte
  opgave: |-
    Twee bekers zijn gelijkvormig. De kleine bevat 0,2~liter en is 9~cm hoog. De grote bevat 1,6~liter. Hoe hoog is de grote beker?
  antwoord: |-
    18~cm
  uitwerking: |-
    $k^3 = \tfrac{1{,}6}{0{,}2} = 8$, dus $k = 2$ en de hoogte is $2 \cdot 9 = 18~\text{cm}$.
