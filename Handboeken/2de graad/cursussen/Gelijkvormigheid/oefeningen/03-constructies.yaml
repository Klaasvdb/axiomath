# Oefeningen van hoofdstuk 3 (alleen in pakket 4 en 5, via handboek.tex). Zie Opmaak/oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $23 : 7$, afgerond op $0{,}01$
      antwoord: |-
        $3{,}29$
      uitwerking: |-
        $23 : 7 = 3{,}2857\ldots \approx 3{,}29$.
    - opgave: |-
        $x$ als $\dfrac35 = \dfrac{x}{8}$
      antwoord: |-
        $x = 4{,}8$
      uitwerking: |-
        $x = 8 \cdot \tfrac35 = 4{,}8$.
    - opgave: |-
        $x > 0$ als $\dfrac{4}{x} = \dfrac{x}{9}$
      antwoord: |-
        $x = 6$
      uitwerking: |-
        Kruiselings: $x^2 = 36$, en $x > 0$, dus $x = 6$.
    - opgave: |-
        $\sqrt{20}$, afgerond op $0{,}01$
      antwoord: |-
        $4{,}47$
      uitwerking: |-
        $\sqrt{20} = 4{,}4721\ldots \approx 4{,}47$.
    - opgave: |-
        $\lengte{AE}$ als $D$ op $[AB]$ en $E$ op $[AC]$ liggen, met $DE \parallel BC$, $\lengte{AD} = 2$, $\lengte{AB} = 6$ en $\lengte{AC} = 9$
      antwoord: |-
        $\lengte{AE} = 3$
      uitwerking: |-
        $\drieh{ADE} \gv \drieh{ABC}$ met $k = \tfrac26 = \tfrac13$, dus $\lengte{AE} = \tfrac13 \cdot 9 = 3$.
    - opgave: |-
        het beeld van het punt $(4, 2)$ bij de homothetie met centrum $(0, 0)$ en factor $\tfrac32$
      antwoord: |-
        $(6, 3)$
      uitwerking: |-
        Vanuit het centrum: 4 naar rechts en 2 omhoog wordt $\tfrac32 \cdot 4 = 6$ naar rechts en $\tfrac32 \cdot 2 = 3$ omhoog.

- id: h3-verken
  soort: start
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.62,font=\scriptsize]
        \foreach \y in {0,.5,...,2.5} \draw[lijngrijs] (0,\y) -- (5,\y);
        \draw[accent,thick] (1,0) -- (3.6,2.5);
        \foreach \k in {1,...,4} \fill[accent] ({1+2.6*\k/5},{2.5*\k/5}) circle (1.3pt);
        \fill (1,0) circle (1.5pt) node[below] {$A$}; \fill (3.6,2.5) circle (1.5pt) node[above] {$B$};
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken}\quad Op een blad van je schrift staan evenwijdige lijnen op gelijke afstand. Kies twee lijnen met vier lijnen ertussen. Teken een lijnstuk $[AB]$ schuin van de ene lijn naar de andere, zoals in de figuur.
  lijst: enumerate
  delen:
    - opgave: |-
        De lijnen ertussen snijden $[AB]$ in stukken. Meet $[AB]$ en de stukken. Wat valt je op?
      antwoord: |-
        vijf gelijke stukken, elk $\tfrac15$ van $\lengte{AB}$
      uitwerking: |-
        Er zijn vijf tussenruimtes, en de stukken zijn (op meetfouten na) even lang: elk een vijfde van $[AB]$.
    - opgave: |-
        Teken tussen dezelfde twee lijnen een tweede lijnstuk, dat schuiner loopt. Geldt het daar ook?
      antwoord: |-
        ja
      uitwerking: |-
        Ook het tweede lijnstuk wordt in vijf gelijke stukken verdeeld. Alleen de lengte van de stukken verandert.
    - opgave: |-
        Hoe kun je met de lijnen van je schrift een lijnstuk van 7~cm in vijf gelijke delen verdelen, zonder te rekenen?
      antwoord: |-
        Leg het lijnstuk zo dat $A$ op een lijn ligt en $B$ vijf lijnen hoger.
      uitwerking: |-
        Leg het lijnstuk schuin, met $A$ op een lijn en $B$ op de vijfde lijn erboven. Dat kan, omdat vijf tussenruimtes minder dan 7~cm zijn. De lijnen ertussen verdelen het in vijf stukken van $7 : 5 = 1{,}4$~cm.

# --- Korte oefeningen bij de leerstof ---------------------------------------------------

- id: h3-basis
  soort: kort
  opgave: |-
    Construeer met passer en liniaal.
  lijst: enumerate
  delen:
    - opgave: |-
        een rechthoek met zijden van 5~cm en 3~cm (meet daarna de diagonaal)
      antwoord: |-
        de diagonaal is ongeveer 5,8~cm
      uitwerking: |-
        Teken $[AB]$ van 5~cm, construeer de loodlijnen in $A$ en in $B$, en zet er met de passer 3~cm op af. Verbind de twee punten. Meten geeft ongeveer 5,8~cm. (Met de stelling van Pythagoras: $\sqrt{5^2 + 3^2} = \sqrt{34} \approx 5{,}83$~cm.)
    - opgave: |-
        een driehoek $ABC$ met $\lengte{AB} = 6$~cm, $\lengte{AC} = 4$~cm en $\hoek{A} = 45^\circ$ (tip: de bissectrice van een rechte hoek; meet daarna $\lengte{BC}$)
      antwoord: |-
        $\lengte{BC} \approx 4{,}2$~cm
      uitwerking: |-
        Construeer de loodlijn in $A$ op $AB$, en daarna de bissectrice van die rechte hoek: dat geeft een hoek van $45^\circ$. Zet op de bissectrice $\lengte{AC} = 4$~cm af en verbind $C$ met $B$. Meten geeft $\lengte{BC} \approx 4{,}25$~cm.
    - opgave: |-
        het punt dat even ver ligt van de drie hoekpunten van een driehoek met zijden van 5~cm, 6~cm en 7~cm (meet daarna die afstand)
      antwoord: |-
        ongeveer 3,6~cm van elk hoekpunt
      uitwerking: |-
        Teken de driehoek met de passer. Het punt ligt op de middelloodlijn van elke zijde: construeer er twee, en neem hun snijpunt. Het is het middelpunt van de omgeschreven cirkel, en ligt ongeveer 3,57~cm van elk hoekpunt. De derde middelloodlijn is een controle: ze gaat door hetzelfde punt.

- id: h3-verdeel
  soort: kort
  opgave: |-
    Verdeel met passer en liniaal, en controleer door te meten.
  lijst: enumerate
  delen:
    - opgave: |-
        een lijnstuk van 9~cm in zeven gelijke delen
      antwoord: |-
        elk deel ongeveer 1,29~cm
      uitwerking: |-
        Zet op een hulphalfrechte uit $A$ zeven gelijke stukken af, verbind $P_7$ met $B$ en trek de evenwijdigen door $P_1$ tot $P_6$. Controle: $9 : 7 \approx 1{,}29$~cm.
    - opgave: |-
        een lijnstuk van 5~cm in drie gelijke delen
      antwoord: |-
        elk deel ongeveer 1,67~cm
      uitwerking: |-
        Drie gelijke stukken op de hulphalfrechte, verbind $P_3$ met $B$, evenwijdigen door $P_1$ en $P_2$. Controle: $5 : 3 \approx 1{,}67$~cm.

- id: h3-verhouding
  soort: kort
  opgave: |-
    Construeer op een lijnstuk $[AB]$ het punt $P$. Bereken daarna $\lengte{AP}$ en $\lengte{PB}$, en meet na.
  lijst: enumerate
  delen:
    - opgave: |-
        $\lengte{AB} = 10$~cm en $\lengte{AP} : \lengte{PB} = 2 : 5$
      antwoord: |-
        $\lengte{AP} \approx 2{,}86$~cm, $\lengte{PB} \approx 7{,}14$~cm
      uitwerking: |-
        Zeven gelijke stukken op de hulphalfrechte, verbind $P_7$ met $B$, en trek de evenwijdige door $P_2$. $\lengte{AP} = \tfrac27 \cdot 10 \approx 2{,}86$~cm en $\lengte{PB} = \tfrac57 \cdot 10 \approx 7{,}14$~cm.
    - opgave: |-
        $\lengte{AB} = 6$~cm en $\lengte{AP} : \lengte{PB} = 5 : 2$
      antwoord: |-
        $\lengte{AP} \approx 4{,}29$~cm, $\lengte{PB} \approx 1{,}71$~cm
      uitwerking: |-
        Zeven gelijke stukken, evenwijdige door $P_5$. $\lengte{AP} = \tfrac57 \cdot 6 \approx 4{,}29$~cm en $\lengte{PB} = \tfrac27 \cdot 6 \approx 1{,}71$~cm.

- id: h3-vierde
  soort: kort
  opgave: |-
    Construeer de vierde evenredige $x$ van $a$, $b$ en $c$, en controleer met een berekening.
  lijst: enumerate
  delen:
    - opgave: |-
        $a = 2$~cm, $b = 5$~cm en $c = 3$~cm
      antwoord: |-
        $x = 7{,}5$~cm
      uitwerking: |-
        $\lengte{OA} = 2$ en $\lengte{OB} = 5$ op het ene been, $\lengte{OC} = 3$ op het andere, evenwijdige door $B$ met $AC$. Controle: $x = \tfrac{5 \cdot 3}{2} = 7{,}5$~cm.
    - opgave: |-
        $a = 6$~cm, $b = 4$~cm en $c = 4{,}5$~cm
      antwoord: |-
        $x = 3$~cm
      uitwerking: |-
        Nu ligt $B$ dichter bij $O$ dan $A$, dus wordt $x$ kleiner dan $c$. Controle: $x = \tfrac{4 \cdot 4{,}5}{6} = 3$~cm.

- id: h3-wortel
  soort: kort
  opgave: |-
    Construeer een lijnstuk met de gegeven lengte, en controleer met je rekenmachine.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sqrt3$~cm
      antwoord: |-
        ongeveer 1,73~cm
      uitwerking: |-
        De middelevenredige van 1~cm en 3~cm: halve cirkel met middellijn 4~cm, loodlijn in het punt op 1~cm van het uiteinde. $\sqrt3 \approx 1{,}73$~cm.
    - opgave: |-
        de zijde van een vierkant met dezelfde oppervlakte als een rechthoek van 3~cm bij 5~cm
      antwoord: |-
        $\sqrt{15} \approx 3{,}87$~cm
      uitwerking: |-
        De middelevenredige van 3~cm en 5~cm: halve cirkel met middellijn 8~cm, loodlijn in het punt op 3~cm van het uiteinde. $\sqrt{15} \approx 3{,}87$~cm.

- id: h3-vergroot
  soort: kort
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.42,font=\scriptsize]
        \ruitjes{-3.5}{-3.5}{4.5}{3.5}
        \filldraw[fill=accent!30,draw=accent,thick] (-2,-1) -- (2,-2) -- (3,1) -- (-1,2) -- cycle;
        \punt[below]{0}{0}{O}
        \node[left] at (-2,-1) {$A$}; \node[below] at (2,-2) {$B$}; \node[right] at (3,1) {$C$}; \node[above] at (-1,2) {$D$};
      \end{tikzpicture}
  opgave: |-
    Neem de vierhoek en het punt $O$ over op ruitjespapier.
  lijst: enumerate
  delen:
    - opgave: |-
        Vergroot $ABCD$ vanuit $O$ met factor 2, met alleen passer en liniaal. Op welke roosterpunten liggen de beelden?
      antwoord: |-
        $A'$ 4 links en 2 onder $O$, $B'$ 4 rechts en 4 onder, $C'$ 6 rechts en 2 boven, $D'$ 2 links en 4 boven
      uitwerking: |-
        Zet met de passer $\lengte{OA}$ nog eens af voorbij $A$, en zo ook voor $B$, $C$ en $D$. Het rooster is een controle: elk beeld ligt twee keer zo ver van $O$, in dezelfde richting.
    - opgave: |-
        Vergroot $ABCD$ vanuit $O$ met factor $\tfrac32$, met een hulphalfrechte en evenwijdigen.
      antwoord: |-
        $A'$ 3 links en $1{,}5$ onder $O$, $B'$ 3 rechts en 3 onder, $C'$ $4{,}5$ rechts en $1{,}5$ boven, $D'$ $1{,}5$ links en 3 boven
      uitwerking: |-
        Drie gelijke stukken op een hulphalfrechte uit $O$, verbind $P_2$ met $A$, en trek de evenwijdige door $P_3$: zo vind je $A'$. Trek door $A'$ de evenwijdige met $AB$ tot op $[OB$, en ga zo rond. Controle: $D'A'$ is evenwijdig met $DA$.

- id: h3-probleem
  soort: kort
  opgave: |-
    Teken een driehoek $ABC$ met $\lengte{BC} = 6$~cm, waarbij $A$ 4~cm boven het midden van $[BC]$ ligt. Construeer het vierkant met een zijde op $[BC]$ en de andere hoekpunten op $[AB]$ en $[AC]$. Hoe lang is de zijde?
  antwoord: |-
    2,4~cm
  uitwerking: |-
    Teken een klein vierkant met een zijde op $BC$ en een hoekpunt op $[AB]$, trek de halfrechte uit $B$ door het vierde hoekpunt, en bouw het vierkant vanuit het snijpunt met $[AC]$. Controle met gelijkvormige driehoeken: boven het vierkant ligt een kleine driehoek met basis $z$ en hoogte $4 - z$, dus $\tfrac{z}{6} = \tfrac{4 - z}{4}$, dus $4z = 24 - 6z$ en $z = 2{,}4$~cm.

# --- Opdrachten -------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    verdelen in een verhouding (rekenen)
  opgave: |-
    Het punt $P$ verdeelt een lijnstuk $[AB]$ van 12~cm in de gegeven verhouding $\lengte{AP} : \lengte{PB}$. Bereken $\lengte{AP}$ en $\lengte{PB}$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $1 : 2$
      antwoord: |-
        4 en 8
      uitwerking: |-
        3 delen van $12 : 3 = 4$~cm: $\lengte{AP} = 4$, $\lengte{PB} = 8$.
    - opgave: |-
        $1 : 1$
      antwoord: |-
        6 en 6
      uitwerking: |-
        $P$ is het midden van $[AB]$.
    - opgave: |-
        $3 : 5$
      antwoord: |-
        4,5 en 7,5
      uitwerking: |-
        8 delen van $1{,}5$~cm: $\lengte{AP} = 4{,}5$, $\lengte{PB} = 7{,}5$.
    - opgave: |-
        $5 : 1$
      antwoord: |-
        10 en 2
      uitwerking: |-
        6 delen van 2~cm: $\lengte{AP} = 10$, $\lengte{PB} = 2$.
    - opgave: |-
        $2 : 7$
      antwoord: |-
        2,67 en 9,33
      uitwerking: |-
        9 delen van $\tfrac{12}{9} = \tfrac43$~cm: $\lengte{AP} = \tfrac83 \approx 2{,}67$, $\lengte{PB} = \tfrac{28}{3} \approx 9{,}33$.
    - opgave: |-
        $7 : 5$
      antwoord: |-
        7 en 5
      uitwerking: |-
        12 delen van 1~cm: $\lengte{AP} = 7$, $\lengte{PB} = 5$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    basisconstructies in een driehoek
  opgave: |-
    Teken met de passer een driehoek $ABC$ met $\lengte{AB} = 7$~cm, $\lengte{BC} = 5$~cm en $\lengte{AC} = 6$~cm. Construeer daarin met passer en liniaal:
  lijst: enumerate
  delen:
    - opgave: |-
        de middelloodlijn van $[AB]$
      antwoord: |-
        ze snijdt $[AB]$ op 3,5~cm van $A$
      uitwerking: |-
        Bogen rond $A$ en $B$ met dezelfde opening (groter dan 3,5~cm), boven en onder $[AB]$. De rechte door de snijpunten snijdt $[AB]$ in het midden.
    - opgave: |-
        de hoogtelijn uit $C$
      antwoord: |-
        de hoogte is ongeveer 4,2~cm
      uitwerking: |-
        De loodlijn uit $C$ op $AB$: een boog rond $C$ snijdt $AB$ in twee punten, en bogen rond die punten geven een tweede punt van de loodlijn. Meten geeft ongeveer 4,2~cm.
    - opgave: |-
        de bissectrice van $\hoek{A}$
      antwoord: |-
        ze snijdt $[BC]$ ongeveer 2,7~cm van $B$
      uitwerking: |-
        Een boog rond $A$ snijdt $[AB]$ en $[AC]$, en bogen rond die twee punten met eenzelfde opening snijden elkaar op de bissectrice. Ze snijdt $[BC]$ ongeveer 2,7~cm van $B$.
    - opgave: |-
        de evenwijdige met $AB$ door $C$
      antwoord: |-
        ze ligt ongeveer 4,2~cm boven $AB$
      uitwerking: |-
        Kies een punt $D$ op $AB$, teken de boog rond $D$ door $C$, die $AB$ snijdt in $E$. Bogen rond $C$ en $E$ met dezelfde opening geven het vierde hoekpunt van een ruit. De afstand tot $AB$ is de hoogte uit $C$, ongeveer 4,2~cm.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    vierde evenredige (rekenen)
  opgave: |-
    Bereken de vierde evenredige $x$ van $a$, $b$ en $c$, met $a : b = c : x$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $a = 2$, $b = 3$, $c = 4$
      antwoord: |-
        6
      uitwerking: |-
        $x = \tfrac{3 \cdot 4}{2} = 6$.
    - opgave: |-
        $a = 5$, $b = 4$, $c = 3$
      antwoord: |-
        2,4
      uitwerking: |-
        $x = \tfrac{4 \cdot 3}{5} = 2{,}4$.
    - opgave: |-
        $a = 3$, $b = 7$, $c = 2$
      antwoord: |-
        $\tfrac{14}{3} \approx 4{,}67$
      uitwerking: |-
        $x = \tfrac{7 \cdot 2}{3} = \tfrac{14}{3} \approx 4{,}67$.
    - opgave: |-
        $a = 6$, $b = 6$, $c = 5$
      antwoord: |-
        5
      uitwerking: |-
        $a = b$, dus de factor is 1: $x = c = 5$.
    - opgave: |-
        $a = 4$, $b = 10$, $c = 6$
      antwoord: |-
        15
      uitwerking: |-
        $x = \tfrac{10 \cdot 6}{4} = 15$.
    - opgave: |-
        $a = 8$, $b = 2$, $c = 5$
      antwoord: |-
        1,25
      uitwerking: |-
        $x = \tfrac{2 \cdot 5}{8} = 1{,}25$.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    verdelen in gelijke delen
  opgave: |-
    Teken een lijnstuk en verdeel het met passer en liniaal in gelijke delen. Meet daarna een deel.
  lijst: enumerate
  delen:
    - opgave: |-
        een lijnstuk van 8~cm in drie delen
      antwoord: |-
        ongeveer 2,67~cm
      uitwerking: |-
        Drie gelijke stukken op een hulphalfrechte uit $A$, verbind $P_3$ met $B$, evenwijdigen door $P_1$ en $P_2$. Controle: $8 : 3 \approx 2{,}67$~cm.
    - opgave: |-
        een lijnstuk van 10~cm in zeven delen
      antwoord: |-
        ongeveer 1,43~cm
      uitwerking: |-
        Zeven gelijke stukken op de hulphalfrechte, verbind $P_7$ met $B$, evenwijdigen door $P_1$ tot $P_6$. Controle: $10 : 7 \approx 1{,}43$~cm.
    - opgave: |-
        een lijnstuk van 5~cm in zes delen
      antwoord: |-
        ongeveer 0,83~cm
      uitwerking: |-
        Zes gelijke stukken op de hulphalfrechte. Kies ze niet te klein, bijvoorbeeld 1,5~cm: dan worden de snijpunten nauwkeuriger. Controle: $5 : 6 \approx 0{,}83$~cm.
    - opgave: |-
        een lijnstuk van 9~cm in vier delen. Kan het hier ook zonder hulphalfrechte?
      antwoord: |-
        2,25~cm; ja, met twee keer de middelloodlijn
      uitwerking: |-
        Met een hulphalfrechte en vier gelijke stukken gaat het zoals altijd. Maar $4 = 2 \cdot 2$: de middelloodlijn van $[AB]$ geeft het midden, en de middelloodlijnen van de twee helften geven de andere deelpunten. Elk deel is $9 : 4 = 2{,}25$~cm.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    vergroten en verkleinen met de passer
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.36,font=\scriptsize]
        \ruitjes{-.5}{-.5}{9.5}{6.5}
        \filldraw[fill=accent!30,draw=accent,thick] (2,1) -- (4,1) -- (3,3) -- cycle;
        \punt[below left]{0}{0}{O}
        \node[below] at (2,1) {$A$}; \node[below right] at (4,1) {$B$}; \node[above] at (3,3) {$C$};
      \end{tikzpicture}
  opgave: |-
    Neem de driehoek en het punt $O$ over op ruitjespapier.
  lijst: enumerate
  delen:
    - opgave: |-
        Vergroot $ABC$ vanuit $O$ met factor 2, met alleen passer en liniaal: zet met de passer $\lengte{OA}$ nog eens af voorbij $A$, en zo verder. Controleer op het rooster.
      antwoord: |-
        $A'$ 4 rechts en 2 boven $O$, $B'$ 8 rechts en 2 boven, $C'$ 6 rechts en 6 boven
      uitwerking: |-
        Trek de halfrechten $[OA$, $[OB$ en $[OC$, en zet op elke halfrechte vanuit het hoekpunt nog eens dezelfde lengte af. Het rooster bevestigt het: elk hokje rechts en omhoog wordt verdubbeld.
    - opgave: |-
        Verklein $ABC$ vanuit $O$ met factor $\tfrac12$. Welke basisconstructie gebruik je?
      antwoord: |-
        de middelloodlijn; $A'$ 1 rechts en $0{,}5$ boven $O$, $B'$ 2 rechts en $0{,}5$ boven, $C'$ $1{,}5$ rechts en $1{,}5$ boven
      uitwerking: |-
        Het beeld van $A$ is het midden van $[OA]$: construeer de middelloodlijn van $[OA]$. Zo ook voor $[OB]$ en $[OC]$.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    middelevenredige (rekenen)
  opgave: |-
    Bereken de middelevenredige $x$ van $a$ en $b$, met $a : x = x : b$. Rond af op $0{,}01$ als dat nodig is.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $a = 4$, $b = 9$
      antwoord: |-
        6
      uitwerking: |-
        $x^2 = 36$, dus $x = 6$.
    - opgave: |-
        $a = 2$, $b = 8$
      antwoord: |-
        4
      uitwerking: |-
        $x^2 = 16$, dus $x = 4$.
    - opgave: |-
        $a = 3$, $b = 27$
      antwoord: |-
        9
      uitwerking: |-
        $x^2 = 81$, dus $x = 9$.
    - opgave: |-
        $a = 1$, $b = 7$
      antwoord: |-
        2,65
      uitwerking: |-
        $x = \sqrt7 \approx 2{,}65$.
    - opgave: |-
        $a = 2$, $b = 3$
      antwoord: |-
        2,45
      uitwerking: |-
        $x = \sqrt6 \approx 2{,}45$.
    - opgave: |-
        $a = 0{,}5$, $b = 8$
      antwoord: |-
        2
      uitwerking: |-
        $x^2 = 4$, dus $x = 2$.

- id: h3-o7
  soort: opdracht
  niveau: 1
  thema: |-
    een constructie lezen
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[scale=.55,font=\scriptsize]
        \coordinate (A) at (0,0); \coordinate (B) at (7.5,0);
        \foreach \k in {1,...,5} \coordinate (P\k) at (30:{1.3*\k});
        \coordinate (Q) at (3,0);
        \draw[hulp] (A) -- (30:7.4);
        \draw[hulp] ($(P5)!-.1!(B)$) -- ($(B)!-.12!(P5)$);
        \draw[hulp] ($(P2)!-.2!(Q)$) -- ($(Q)!-.2!(P2)$);
        \draw[gegeven] (A) -- (B);
        \foreach \k in {1,...,5} {\fill (P\k) circle (1.3pt); \node[above left] at (P\k) {$P_{\k}$};}
        \fill (A) circle (1.5pt) node[below left] {$A$}; \fill (B) circle (1.5pt) node[below right] {$B$};
        \fill[accent] (Q) circle (1.7pt) node[below] {$Q$};
      \end{tikzpicture}
  opgave: |-
    In de figuur liggen de punten $P_1$ tot $P_5$ op gelijke afstanden, en is $P_2Q \parallel P_5B$.
  lijst: enumerate
  delen:
    - opgave: |-
        In welke verhouding verdeelt $Q$ het lijnstuk $[AB]$?
      antwoord: |-
        $\lengte{AQ} : \lengte{QB} = 2 : 3$
      uitwerking: |-
        Volgens de stelling over evenwijdigen op twee halfrechten is $\lengte{AQ} : \lengte{AB} = \lengte{AP_2} : \lengte{AP_5} = 2 : 5$. Dus $\lengte{AQ} : \lengte{QB} = 2 : 3$.
    - opgave: |-
        $\lengte{AB} = 7{,}5$~cm. Bereken $\lengte{AQ}$ en $\lengte{QB}$.
      antwoord: |-
        3~cm en 4,5~cm
      uitwerking: |-
        $\lengte{AQ} = \tfrac25 \cdot 7{,}5 = 3$~cm en $\lengte{QB} = 7{,}5 - 3 = 4{,}5$~cm.
    - opgave: |-
        Welke evenwijdige trek je voor het punt $R$ op $[AB]$ met $\lengte{AR} : \lengte{RB} = 4 : 1$? Hoe ver ligt $R$ van $A$?
      antwoord: |-
        de evenwijdige met $P_5B$ door $P_4$; 6~cm
      uitwerking: |-
        $4 + 1 = 5$ delen, en je neemt er 4: de evenwijdige door $P_4$. $\lengte{AR} = \tfrac45 \cdot 7{,}5 = 6$~cm.

- id: h3-o8
  soort: opdracht
  niveau: 1
  thema: |-
    vierkantswortels construeren
  opgave: |-
    Construeer met passer en liniaal een lijnstuk met de gegeven lengte in centimeter. Controleer met je rekenmachine.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sqrt2$
      antwoord: |-
        1,41~cm
      uitwerking: |-
        De middelevenredige van 1 en 2: halve cirkel met middellijn 3~cm, loodlijn op 1~cm van het uiteinde. $\sqrt2 \approx 1{,}41$~cm.
    - opgave: |-
        $\sqrt6$
      antwoord: |-
        2,45~cm
      uitwerking: |-
        De middelevenredige van 2 en 3 (middellijn 5~cm) of van 1 en 6 (middellijn 7~cm). $\sqrt6 \approx 2{,}45$~cm.
    - opgave: |-
        $\sqrt{10}$
      antwoord: |-
        3,16~cm
      uitwerking: |-
        De middelevenredige van 2 en 5 (middellijn 7~cm) of van 1 en 10 (middellijn 11~cm). $\sqrt{10} \approx 3{,}16$~cm.

- id: h3-o9
  soort: opdracht
  niveau: 1
  thema: |-
    vierde evenredige construeren
  opgave: |-
    Teken lijnstukken $a = 3$~cm, $b = 5$~cm en $c = 4$~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Construeer $x$ met $a : b = c : x$. Meet $x$, en vergelijk met de berekening.
      antwoord: |-
        $x = \tfrac{20}{3} \approx 6{,}67$~cm
      uitwerking: |-
        $\lengte{OA} = 3$ en $\lengte{OB} = 5$ op het ene been, $\lengte{OC} = 4$ op het andere, evenwijdige door $B$ met $AC$. Berekend: $x = \tfrac{5 \cdot 4}{3} \approx 6{,}67$~cm.
    - opgave: |-
        Construeer $y$ met $b : a = c : y$.
      antwoord: |-
        $y = 2{,}4$~cm
      uitwerking: |-
        Nu $\lengte{OA} = 5$ en $\lengte{OB} = 3$ op het ene been, $\lengte{OC} = 4$ op het andere. Berekend: $y = \tfrac{3 \cdot 4}{5} = 2{,}4$~cm.
    - opgave: |-
        Bereken $x \cdot y$. Leg uit waarom dat zo uitkomt.
      antwoord: |-
        $x \cdot y = 16 = c^2$
      uitwerking: |-
        $x \cdot y = \tfrac{bc}{a} \cdot \tfrac{ac}{b} = c^2 = 16$. De factoren $\tfrac{b}{a}$ en $\tfrac{a}{b}$ heffen elkaar op.

- id: h3-o10
  soort: opdracht
  niveau: 1
  thema: |-
    verkleinen vanuit een hoekpunt
  opgave: |-
    Teken een driehoek $ABC$ met $\lengte{AB} = 6$~cm, $\lengte{BC} = 5$~cm en $\lengte{AC} = 4$~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Verklein de driehoek vanuit $A$ met factor $\tfrac34$, met passer en liniaal. Waar liggen $B'$ en $C'$?
      antwoord: |-
        $B'$ op $[AB]$ met $\lengte{AB'} = 4{,}5$~cm, $C'$ op $[AC]$ met $\lengte{AC'} = 3$~cm
      uitwerking: |-
        Zet op een hulphalfrechte uit $A$ vier gelijke stukken af, verbind $P_4$ met $B$, en trek de evenwijdige door $P_3$: die snijdt $[AB]$ in $B'$. Trek door $B'$ de evenwijdige met $BC$: die snijdt $[AC]$ in $C'$.
    - opgave: |-
        Hoe lang is $[B'C']$? Waarom is $B'C' \parallel BC$?
      antwoord: |-
        3,75~cm; een homothetie beeldt een rechte af op een evenwijdige rechte
      uitwerking: |-
        $\lengte{B'C'} = \tfrac34 \cdot 5 = 3{,}75$~cm. Het beeld van een rechte is evenwijdig met die rechte (hoofdstuk 1). Je ziet hier ook de evenwijdige met een zijde uit hoofdstuk 2.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    waarom de verdeling werkt
  opgave: |-
    Lotte verdeelt een lijnstuk $[AB]$ in drie gelijke delen met een hulphalfrechte uit $A$.
  lijst: enumerate
  delen:
    - opgave: |-
        Haar passer schuift uit: het tweede stuk op de hulphalfrechte is iets langer dan de andere twee. Zijn de drie delen van $[AB]$ dan nog gelijk?
      antwoord: |-
        nee, het middelste deel is te lang
      uitwerking: |-
        De delen van $[AB]$ staan in dezelfde verhouding als de stukken op de hulphalfrechte. Is het tweede stuk daar langer, dan is ook het middelste deel van $[AB]$ langer.
    - opgave: |-
        Moeten de stukken op de hulphalfrechte even lang zijn als de delen van $[AB]$?
      antwoord: |-
        nee
      uitwerking: |-
        Alleen de verhouding telt. De stukken mogen langer of korter zijn dan de delen van $[AB]$, als ze maar onderling gelijk zijn.
    - opgave: |-
        Waarom is een hulphalfrechte die bijna op $[AB]$ ligt, geen goed idee?
      antwoord: |-
        de evenwijdigen snijden $[AB]$ dan onder een heel kleine hoek
      uitwerking: |-
        Dan lopen de evenwijdigen bijna langs $[AB]$, en een klein foutje in hun richting verschuift het snijpunt veel. Een hoek van ongeveer $30^\circ$ tot $60^\circ$ geeft scherpe snijpunten.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    verdelen in een verhouding (context)
  opgave: |-
    Drie zussen erven een strook grond van 45~m breed. Ze verdelen de breedte in de verhouding $3 : 4 : 6$. Op een plan op schaal $\schaal{1}{500}$ is de strook 9~cm breed.
  lijst: enumerate
  delen:
    - opgave: |-
        Construeer de twee grenzen op het plan.
      antwoord: |-
        13 gelijke stukken; evenwijdigen door het 3de en het 7de punt
      uitwerking: |-
        $3 + 4 + 6 = 13$. Zet op een hulphalfrechte uit het ene uiteinde 13 gelijke stukken af, verbind $P_{13}$ met het andere uiteinde, en trek de evenwijdigen door $P_3$ en $P_7$.
    - opgave: |-
        Hoe breed is elk stuk in werkelijkheid? Rond af op 1~cm.
      antwoord: |-
        10,38~m, 13,85~m en 20,77~m
      uitwerking: |-
        $\tfrac{3}{13} \cdot 45 \approx 10{,}38$~m, $\tfrac{4}{13} \cdot 45 \approx 13{,}85$~m en $\tfrac{6}{13} \cdot 45 \approx 20{,}77$~m. Samen 45~m.
    - opgave: |-
        Waarom is construeren hier beter dan rekenen en afmeten?
      antwoord: |-
        de stukken op het plan zijn geen mooie getallen
      uitwerking: |-
        Op het plan zijn de stukken $\tfrac{27}{13} \approx 2{,}08$~cm, $\tfrac{36}{13} \approx 2{,}77$~cm en $\tfrac{54}{13} \approx 4{,}15$~cm. Dat kun je niet precies afmeten, en de fouten tellen op. De constructie is exact.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    vergroten met een centrum binnen de figuur
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.36,font=\scriptsize]
        \ruitjes{-3.5}{-3.5}{3.5}{3.5}
        \filldraw[fill=accent!30,draw=accent,thick] (-2,-1) -- (2,-2) -- (2,2) -- (-2,2) -- cycle;
        \punt[below]{0}{0}{O}
        \node[left] at (-2,-1) {$A$}; \node[below right] at (2,-2) {$B$}; \node[above right] at (2,2) {$C$}; \node[above left] at (-2,2) {$D$};
      \end{tikzpicture}
  opgave: |-
    Neem de vierhoek en het punt $O$ over op ruitjespapier.
  lijst: enumerate
  delen:
    - opgave: |-
        Vergroot $ABCD$ vanuit $O$ met factor $\tfrac32$. Construeer eerst $A'$ met een hulphalfrechte, en de andere beelden met evenwijdigen.
      antwoord: |-
        $A'$ ligt 3 links en $1{,}5$ onder $O$
      uitwerking: |-
        Drie gelijke stukken op een hulphalfrechte uit $O$, verbind $P_2$ met $A$, evenwijdige door $P_3$: die snijdt $[OA$ in $A'$. Trek door $A'$ de evenwijdige met $AB$ tot op $[OB$: dat is $B'$, enzovoort.
    - opgave: |-
        Op welke roosterpunten liggen $B'$, $C'$ en $D'$? Controleer je constructie.
      antwoord: |-
        $B'$ 3 rechts en 3 onder $O$, $C'$ 3 rechts en 3 boven, $D'$ 3 links en 3 boven
      uitwerking: |-
        Elk hokje vanuit $O$ wordt $1{,}5$ hokje: $B$ (2 rechts, 2 onder) gaat naar 3 rechts en 3 onder, enzovoort.
    - opgave: |-
        Hoeveel keer zo groot is de oppervlakte van het beeld?
      antwoord: |-
        $2{,}25$ keer
      uitwerking: |-
        Oppervlaktes worden vermenigvuldigd met $k^2 = \left(\tfrac32\right)^2 = \tfrac94 = 2{,}25$. Ter controle: $ABCD$ heeft 14 hokjes, het beeld $31{,}5$.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    vermenigvuldigen en delen met de vierde evenredige
  opgave: |-
    Met een lijnstuk van 1~cm, de eenheid, kun je met passer en liniaal ook vermenigvuldigen en delen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de vierde evenredige van 1, $b$ en $c$ gelijk is aan $b \cdot c$.
      antwoord: |-
        $1 : b = c : x$ geeft $x = b \cdot c$
      uitwerking: |-
        Uit $\tfrac1b = \tfrac{c}{x}$ volgt kruiselings $x = b \cdot c$.
    - opgave: |-
        Construeer een lijnstuk met lengte $2{,}5 \cdot 1{,}8$~cm. Meet en controleer.
      antwoord: |-
        4,5~cm
      uitwerking: |-
        $\lengte{OA} = 1$ en $\lengte{OB} = 2{,}5$ op het ene been, $\lengte{OC} = 1{,}8$ op het andere, evenwijdige door $B$ met $AC$. Controle: $2{,}5 \cdot 1{,}8 = 4{,}5$~cm.
    - opgave: |-
        Van welke drie lengtes is $\tfrac73$~cm de vierde evenredige? Construeer dat lijnstuk.
      antwoord: |-
        bijvoorbeeld van 3, 7 en 1; ongeveer 2,33~cm
      uitwerking: |-
        $3 : 7 = 1 : x$ geeft $x = \tfrac73 \approx 2{,}33$~cm. Ook $3 : 1 = 7 : x$ kan.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    een maatstok construeren
  opgave: |-
    Op een wandelkaart met schaal $\schaal{1}{30\,000}$ wil je een maatstok van 1~km, verdeeld in stukken van 200~m.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de maatstok op de kaart? Kun je die lengte precies afmeten?
      antwoord: |-
        $3{,}33\ldots$~cm; nee
      uitwerking: |-
        $1~\text{km} = 100\,000$~cm, en $100\,000 : 30\,000 = \tfrac{10}{3} = 3{,}33\ldots$~cm. Dat is geen lengte die je kunt afmeten.
    - opgave: |-
        Construeer de maatstok. Tip: 10~cm op de kaart is 3~km.
      antwoord: |-
        een derde van een lijnstuk van 10~cm
      uitwerking: |-
        Teken een lijnstuk van 10~cm (3~km in werkelijkheid) en verdeel het in drie gelijke delen. Een deel is de maatstok van 1~km.
    - opgave: |-
        Verdeel de maatstok in stukken van 200~m. Hoe lang is zo'n stuk op de kaart?
      antwoord: |-
        vijf stukken van ongeveer 0,67~cm
      uitwerking: |-
        Verdeel de maatstok in vijf gelijke delen. Elk deel is $\tfrac{10}{3} : 5 = \tfrac23 \approx 0{,}67$~cm. Je kunt ook meteen $[0, 10]$ in 15 delen verdelen.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    vierkant met dezelfde oppervlakte
  opgave: |-
    Construeer een vierkant met dezelfde oppervlakte als de gegeven figuur. Bereken de zijde en meet na.
  lijst: enumerate
  delen:
    - opgave: |-
        een rechthoek van 6~cm bij 2~cm
      antwoord: |-
        $\sqrt{12} \approx 3{,}46$~cm
      uitwerking: |-
        De middelevenredige van 6 en 2: halve cirkel met middellijn 8~cm, loodlijn op 2~cm van het uiteinde. $\sqrt{12} \approx 3{,}46$~cm.
    - opgave: |-
        een driehoek met basis 5~cm en hoogte 4~cm (tip: welke rechthoek heeft dezelfde oppervlakte?)
      antwoord: |-
        $\sqrt{10} \approx 3{,}16$~cm
      uitwerking: |-
        De driehoek heeft een oppervlakte van $\tfrac{5 \cdot 4}{2} = 10$~cm$^2$, net als een rechthoek van 5~cm bij 2~cm. De middelevenredige van 5 en 2 is $\sqrt{10} \approx 3{,}16$~cm.
    - opgave: |-
        een parallellogram met basis 4,5~cm en hoogte 2~cm
      antwoord: |-
        3~cm
      uitwerking: |-
        De oppervlakte is $4{,}5 \cdot 2 = 9$~cm$^2$. De middelevenredige van 4,5 en 2 is $\sqrt9 = 3$~cm, en dat kun je nameten.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    homothetie met een negatieve factor
  opgave: |-
    Teken een driehoek $ABC$ en een punt $O$ buiten de driehoek. Construeer met passer en liniaal het beeld van $ABC$ bij de homothetie met centrum $O$ en factor:
  lijst: enumerate
  delen:
    - opgave: |-
        $-2$
      antwoord: |-
        $A'$ op de halfrechte tegenover $[OA$, met $\lengte{OA'} = 2\,\lengte{OA}$, enzovoort
      uitwerking: |-
        Verleng $[AO]$ voorbij $O$ en zet met de passer twee keer $\lengte{OA}$ af. Zo ook voor $B$ en $C$. Het beeld staat op zijn kop.
    - opgave: |-
        $-\tfrac12$
      antwoord: |-
        $A'$ op de halfrechte tegenover $[OA$, met $\lengte{OA'} = \tfrac12\,\lengte{OA}$
      uitwerking: |-
        Construeer het midden $M$ van $[OA]$ met de middelloodlijn, en zet $\lengte{OM}$ af aan de overkant van $O$. Zo ook voor $B$ en $C$.
    - opgave: |-
        $-\tfrac32$ (tip: trek een hulprechte door $O$, en zet aan de ene kant twee gelijke stukken af en aan de andere kant drie)
      antwoord: |-
        $A'$ aan de overkant van $O$, met $\lengte{OA'} = \tfrac32\,\lengte{OA}$
      uitwerking: |-
        Op de hulprechte: $P_2$ aan de ene kant, $Q_3$ aan de andere kant, met $\lengte{OP_2} : \lengte{OQ_3} = 2 : 3$. Verbind $P_2$ met $A$ en trek door $Q_3$ de evenwijdige: ze snijdt $AO$ aan de overkant van $O$ in $A'$. Dat is een zandloper: $\lengte{OA} : \lengte{OA'} = 2 : 3$. Vind $B'$ en $C'$ met evenwijdigen door $A'$.

- id: h3-o18
  soort: opdracht
  niveau: 2
  thema: |-
    een notenbalk
  opgave: |-
    Een notenbalk heeft vijf evenwijdige lijnen op gelijke afstand.
  lijst: enumerate
  delen:
    - opgave: |-
        Construeer een notenbalk met 1,9~cm tussen de bovenste en de onderste lijn. Hoe ver liggen twee lijnen naast elkaar uit elkaar?
      antwoord: |-
        0,475~cm
      uitwerking: |-
        Teken de onderste lijn en een loodlijn erop, en zet 1,9~cm af. Verdeel dat lijnstuk in vier gelijke delen, en trek door de deelpunten de evenwijdigen met de onderste lijn. De afstand is $1{,}9 : 4 = 0{,}475$~cm.
    - opgave: |-
        Het kan ook zonder hulphalfrechte. Hoe?
      antwoord: |-
        twee keer halveren met de middelloodlijn
      uitwerking: |-
        Vier delen is twee keer halveren: de middelloodlijn van het lijnstuk van 1,9~cm geeft het midden, en de middelloodlijnen van de helften geven de andere deelpunten.
    - opgave: |-
        Een tabulatuur voor gitaar heeft zes lijnen op gelijke afstand. Kan het daar ook zonder hulphalfrechte?
      antwoord: |-
        nee
      uitwerking: |-
        Zes lijnen geven vijf tussenruimtes. Door te halveren krijg je alleen 2, 4, 8, \ldots\ delen, en nooit 5. Je hebt dus een hulphalfrechte nodig.

- id: h3-o19
  soort: opdracht
  niveau: 2
  thema: |-
    vergroten met factor 5/3
  opgave: |-
    Teken een driehoek $ABC$ met $\lengte{AB} = 3$~cm, $\lengte{BC} = 4$~cm en $\lengte{AC} = 4{,}5$~cm, en een punt $O$ buiten de driehoek.
  lijst: enumerate
  delen:
    - opgave: |-
        Vergroot de driehoek vanuit $O$ met factor $\tfrac53$, met passer en liniaal.
      antwoord: |-
        $A'$ op $[OA$ met $\lengte{OA'} = \tfrac53\,\lengte{OA}$, de rest met evenwijdigen
      uitwerking: |-
        Zet op een hulphalfrechte uit $O$ vijf gelijke stukken af. Verbind $P_3$ met $A$, en trek door $P_5$ de evenwijdige: ze snijdt $[OA$ in $A'$. Trek door $A'$ de evenwijdigen met $AB$ en $AC$ tot op $[OB$ en $[OC$.
    - opgave: |-
        Bereken de zijden van het beeld, en meet na.
      antwoord: |-
        5~cm, 6,67~cm en 7,5~cm
      uitwerking: |-
        $\tfrac53 \cdot 3 = 5$~cm, $\tfrac53 \cdot 4 = \tfrac{20}{3} \approx 6{,}67$~cm en $\tfrac53 \cdot 4{,}5 = 7{,}5$~cm.

- id: h3-o20
  soort: opdracht
  niveau: 2
  thema: |-
    een raam in een puntgevel
  opgave: |-
    Een puntgevel is een gelijkbenige driehoek met een basis van 8~m en een hoogte van 3~m. De architect wil er een vierkant raam in, zo groot mogelijk: de onderkant op de zoldervloer, die op de basis ligt, en de bovenste hoeken tegen de dakranden.
  lijst: enumerate
  delen:
    - opgave: |-
        Construeer de gevel en het raam op schaal $\schaal{1}{100}$.
      antwoord: |-
        een driehoek met basis 8~cm en hoogte 3~cm, en een vierkant van ongeveer 2,2~cm
      uitwerking: |-
        Teken de driehoek: basis 8~cm, de top 3~cm boven het midden. Teken een klein vierkant met een zijde op de basis en een hoekpunt op de linkse dakrand. Trek vanuit de linkse benedenhoek de halfrechte door het vierde hoekpunt, en bouw het vierkant vanuit het snijpunt met de rechtse dakrand.
    - opgave: |-
        Bereken de zijde van het raam met gelijkvormige driehoeken. Rond af op 1~cm.
      antwoord: |-
        2,18~m
      uitwerking: |-
        Boven het raam ligt een kleine driehoek, gelijkvormig met de gevel, met basis $z$ en hoogte $3 - z$. Dus $\tfrac{z}{8} = \tfrac{3 - z}{3}$, of $3z = 24 - 8z$, en $z = \tfrac{24}{11} \approx 2{,}18$~m.

- id: h3-o21
  soort: opdracht
  niveau: 3
  thema: |-
    de vierde en de derde evenredige
  opgave: |-
    Bij de constructie van de vierde evenredige zet je $a$ en $b$ af op het ene been van een hoek, en $c$ op het andere.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het ook werkt als je $\lengte{OA} = a$ en $\lengte{OC} = c$ op het ene been zet, en $\lengte{OB} = b$ op het andere, en door $C$ de evenwijdige met $AB$ trekt.
      antwoord: |-
        $\tfrac{a}{c} = \tfrac{b}{x}$ geeft ook $x = \tfrac{bc}{a}$
      uitwerking: |-
        Noem $X$ het snijpunt van de evenwijdige met het tweede been. De evenwijdigen $AB$ en $CX$ snijden beide benen, dus $\tfrac{\lengte{OA}}{\lengte{OC}} = \tfrac{\lengte{OB}}{\lengte{OX}}$, of $\tfrac{a}{c} = \tfrac{b}{x}$. Kruiselings: $a\,x = b\,c$, dus $x = \tfrac{bc}{a}$, net als bij de gewone constructie.
    - opgave: |-
        De derde evenredige van $a$ en $b$ is het lijnstuk $x$ met $a : b = b : x$. Hoe construeer je ze? Bereken ze voor $a = 4$~cm en $b = 6$~cm.
      antwoord: |-
        de vierde evenredige van $a$, $b$ en $b$; 9~cm
      uitwerking: |-
        Het is de vierde evenredige van $a$, $b$ en $b$: zet $a$ en $b$ af op het ene been, en $b$ op het andere. Dan is $x = \tfrac{b^2}{a} = \tfrac{36}{4} = 9$~cm.

- id: h3-o22
  soort: opdracht
  niveau: 3
  thema: |-
    een rechthoek in een driehoek
  opgave: |-
    Teken een driehoek $ABC$ met $\lengte{BC} = 8$~cm, waarbij $A$ 3~cm boven het midden van $[BC]$ ligt. Je zoekt een rechthoek met de lange zijde op $[BC]$, twee keer zo lang als de korte, en de twee andere hoekpunten op $[AB]$ en $[AC]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Construeer de rechthoek. Tip: begin met een kleine rechthoek met de juiste vorm.
      antwoord: |-
        een rechthoek van ongeveer 3,43~cm bij 1,71~cm
      uitwerking: |-
        Kies een punt $S$ op $[AB]$ en construeer de loodlijn uit $S$ op $BC$, met voetpunt $P$. Zet $\lengte{PS}$ twee keer af op $BC$ vanuit $P$, weg van $B$: dat geeft $Q$. Bouw de rechthoek $PQRS$. Trek de halfrechte $[BR$; ze snijdt $[AC]$ in $R'$. Bouw vanuit $R'$ de grote rechthoek met evenwijdigen en een loodlijn.
    - opgave: |-
        Bereken de afmetingen van de rechthoek.
      antwoord: |-
        $\tfrac{24}{7} \approx 3{,}43$~cm bij $\tfrac{12}{7} \approx 1{,}71$~cm
      uitwerking: |-
        Noem de korte zijde $t$. Boven de rechthoek ligt een driehoek die gelijkvormig is met $ABC$, met basis $2t$ en hoogte $3 - t$. Dus $\tfrac{2t}{8} = \tfrac{3 - t}{3}$, of $6t = 24 - 8t$, en $t = \tfrac{12}{7} \approx 1{,}71$~cm. De lange zijde is $\tfrac{24}{7} \approx 3{,}43$~cm.

- id: h3-o23
  soort: opdracht
  niveau: 3
  thema: |-
    een driehoek met een gegeven omtrek
  opgave: |-
    Je construeert een gelijkbenige rechthoekige driehoek met een omtrek van 12~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Construeer eerst een willekeurige gelijkbenige rechthoekige driehoek $ABC$, rechthoekig in $A$.
      antwoord: |-
        loodlijn in $A$, twee keer dezelfde lengte afzetten
      uitwerking: |-
        Teken $[AB]$, construeer de loodlijn in $A$, en zet met de passer $\lengte{AC} = \lengte{AB}$ af.
    - opgave: |-
        Zet de drie zijden met de passer na elkaar af op een rechte, zodat je de omtrek $p$ als lijnstuk krijgt. Gebruik de vierde evenredige om de driehoek met de factor $\tfrac{12}{p}$ te vergroten.
      antwoord: |-
        de vierde evenredige van $p$, 12~cm en $\lengte{AB}$ is de nieuwe rechthoekszijde
      uitwerking: |-
        De nieuwe rechthoekszijde $x$ voldoet aan $p : 12 = \lengte{AB} : x$: dat is de vierde evenredige van $p$, 12~cm en $\lengte{AB}$. Zet $x$ af op $[AB$ en $[AC$ vanuit $A$, en verbind. Of vergroot vanuit $A$ met evenwijdigen.
    - opgave: |-
        Bereken de zijden van de driehoek. Rond af op 0,01~cm.
      antwoord: |-
        $3{,}51$~cm, $3{,}51$~cm en $4{,}97$~cm
      uitwerking: |-
        Met rechthoekszijden $x$ is de schuine zijde $x\sqrt2$, en $2x + x\sqrt2 = 12$. Dus $x = \tfrac{12}{2 + \sqrt2} \approx 3{,}51$~cm en $x\sqrt2 \approx 4{,}97$~cm.

- id: h3-o24
  soort: opdracht
  niveau: 3
  thema: |-
    een cirkel die aan twee benen raakt
  opgave: |-
    Gegeven: een hoek met hoekpunt $O$ en een punt $P$ binnen de hoek. Je zoekt een cirkel die raakt aan beide benen en door $P$ gaat. Een cirkel raakt aan een rechte als de afstand van het middelpunt tot de rechte gelijk is aan de straal.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar liggen de middelpunten van alle cirkels die aan beide benen raken?
      antwoord: |-
        op de bissectrice van de hoek
      uitwerking: |-
        Het middelpunt ligt even ver van beide benen. Die punten liggen op de bissectrice.
    - opgave: |-
        Construeer zo'n cirkel, met een middelpunt $M$ naar keuze. Hoe vind je de straal?
      antwoord: |-
        de afstand van $M$ tot een been, met een loodlijn
      uitwerking: |-
        Kies $M$ op de bissectrice en construeer de loodlijn uit $M$ op een been. Van $M$ tot het voetpunt is de straal.
    - opgave: |-
        Vergroot of verklein die cirkel vanuit $O$ zodat hij door $P$ gaat. Hoe?
      antwoord: |-
        $[OP$ snijdt de cirkel in $Q$; de evenwijdige met $QM$ door $P$ geeft het nieuwe middelpunt
      uitwerking: |-
        Een homothetie met centrum $O$ beeldt de benen op zichzelf af, dus het beeld van de cirkel raakt nog altijd aan beide benen. De halfrechte $[OP$ snijdt de cirkel in een punt $Q$. De homothetie die $Q$ op $P$ afbeeldt, beeldt $M$ af op het snijpunt $M'$ van de bissectrice met de evenwijdige door $P$ met $QM$. De cirkel met middelpunt $M'$ door $P$ is een oplossing.
        \figuren{\begin{tikzpicture}[scale=1,font=\scriptsize]
          \coordinate (O) at (0,0); \coordinate (M) at (20:1.6); \coordinate (P) at (3.6,1.9);
          \draw[gegeven] (6.2,0) -- (O) -- (40:6.4);
          \draw[hulp] (O) -- (20:6.6);
          \draw[hulp] (M) circle ({1.6*sin(20)});
          \draw[hulp] (O) -- ($(O)!1.12!(P)$);
          \coordinate (Q) at ($(O)!0.51273!(P)$);
          \coordinate (M2) at ($(O)!{1/0.51273}!(M)$);
          \draw[hulp] (Q) -- (M);
          \draw[accent,dashed] (P) -- (M2);
          \draw[accent,thick] (M2) circle ({1.6*sin(20)/0.51273});
          \fill (O) circle (1.5pt) node[left] {$O$}; \fill (M) circle (1.3pt) node[below] {$M$};
          \fill (Q) circle (1.3pt) node[above left] {$Q$}; \fill (P) circle (1.5pt) node[above left] {$P$};
          \fill[accent] (M2) circle (1.5pt) node[below] {$M'$};
        \end{tikzpicture}}
    - opgave: |-
        Hoeveel oplossingen zijn er?
      antwoord: |-
        twee
      uitwerking: |-
        De halfrechte $[OP$ snijdt de kleine cirkel in twee punten. Elk snijpunt geeft een homothetie, en dus een cirkel door $P$: een kleine en een grote.

# --- Test jezelf ------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    basisconstructies
  opgave: |-
    Construeer met passer en liniaal een rechthoek met zijden van 6~cm en 2,5~cm. Meet de diagonaal.
  antwoord: |-
    6,5~cm
  uitwerking: |-
    Teken $[AB]$ van 6~cm, construeer de loodlijnen in $A$ en $B$, en zet er 2,5~cm op af. Meten geeft 6,5~cm. (Met de stelling van Pythagoras: $\sqrt{6^2 + 2{,}5^2} = \sqrt{42{,}25} = 6{,}5$~cm.)

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    verdelen in gelijke delen
  opgave: |-
    Verdeel een lijnstuk van 11~cm met passer en liniaal in zes gelijke delen. Hoe lang is elk deel?
  antwoord: |-
    ongeveer 1,83~cm
  uitwerking: |-
    Zes gelijke stukken op een hulphalfrechte uit $A$, verbind $P_6$ met $B$, en trek de evenwijdigen door $P_1$ tot $P_5$. Controle: $11 : 6 \approx 1{,}83$~cm.

- id: h3-t3
  soort: test
  niveau: 1
  thema: |-
    verdelen in een verhouding
  opgave: |-
    Construeer op een lijnstuk $[AB]$ van 9~cm het punt $P$ met $\lengte{AP} : \lengte{PB} = 4 : 3$. Bereken $\lengte{AP}$.
  antwoord: |-
    $\lengte{AP} = \tfrac{36}{7} \approx 5{,}14$~cm
  uitwerking: |-
    Zeven gelijke stukken op een hulphalfrechte, verbind $P_7$ met $B$, en trek de evenwijdige door $P_4$. $\lengte{AP} = \tfrac47 \cdot 9 \approx 5{,}14$~cm.

- id: h3-t4
  soort: test
  niveau: 1
  thema: |-
    vierde evenredige
  opgave: |-
    Construeer de vierde evenredige van $a = 5$~cm, $b = 3$~cm en $c = 4$~cm.
  antwoord: |-
    2,4~cm
  uitwerking: |-
    $\lengte{OA} = 5$ en $\lengte{OB} = 3$ op het ene been, $\lengte{OC} = 4$ op het andere, en de evenwijdige door $B$ met $AC$. Controle: $x = \tfrac{3 \cdot 4}{5} = 2{,}4$~cm.

- id: h3-t5
  soort: test
  niveau: 2
  thema: |-
    vierkantswortel construeren
  opgave: |-
    Construeer een lijnstuk met lengte $\sqrt7$~cm.
  antwoord: |-
    ongeveer 2,65~cm
  uitwerking: |-
    De middelevenredige van 1~cm en 7~cm: halve cirkel met middellijn 8~cm, en de loodlijn in het punt op 1~cm van het uiteinde. Controle: $\sqrt7 \approx 2{,}65$~cm.

- id: h3-t6
  soort: test
  niveau: 2
  thema: |-
    vergroten met passer en liniaal
  opgave: |-
    Teken een driehoek $ABC$ en een punt $O$ buiten de driehoek. Vergroot de driehoek vanuit $O$ met factor $\tfrac43$, met passer en liniaal.
  antwoord: |-
    $A'$ op $[OA$ met $\lengte{OA'} = \tfrac43\,\lengte{OA}$, de rest met evenwijdigen
  uitwerking: |-
    Vier gelijke stukken op een hulphalfrechte uit $O$. Verbind $P_3$ met $A$, trek door $P_4$ de evenwijdige: die snijdt $[OA$ in $A'$. Trek door $A'$ de evenwijdigen met $AB$ en $AC$ tot op $[OB$ en $[OC$. Controle: $B'C' \parallel BC$, en elke zijde is $\tfrac43$ keer zo lang.

- id: h3-t7
  soort: test
  niveau: 2
  thema: |-
    een probleem oplossen met een homothetie
  opgave: |-
    Teken een driehoek $ABC$ met $\lengte{BC} = 6$~cm, waarbij $A$ 3~cm boven het midden van $[BC]$ ligt. Construeer het vierkant met een zijde op $[BC]$ en de andere hoekpunten op $[AB]$ en $[AC]$. Hoe lang is de zijde?
  antwoord: |-
    2~cm
  uitwerking: |-
    Klein vierkant met een zijde op $BC$ en een hoekpunt op $[AB]$, halfrechte uit $B$ door het vierde hoekpunt, en het vierkant vanuit het snijpunt met $[AC]$. Controle: $\tfrac{z}{6} = \tfrac{3 - z}{3}$, dus $3z = 18 - 6z$ en $z = 2$~cm.
