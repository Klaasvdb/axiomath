# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de derde hoek van een driehoek met hoeken van $48^\circ$ en $77^\circ$
      antwoord: |-
        $55^\circ$
      uitwerking: |-
        $180^\circ - 48^\circ - 77^\circ = 55^\circ$.
    - opgave: |-
        $x$ als $\dfrac{x}{6} = \dfrac{10}{4}$
      antwoord: |-
        $x = 15$
      uitwerking: |-
        $x = 6 \cdot \tfrac{10}{4} = 15$.
    - opgave: |-
        $x$ als $\dfrac{5}{x} = \dfrac{2}{7}$
      antwoord: |-
        $x = 17{,}5$
      uitwerking: |-
        Kruiselings: $2x = 35$, dus $x = 17{,}5$.
    - opgave: |-
        de andere drie hoeken als twee rechten elkaar snijden onder een hoek van $38^\circ$
      antwoord: |-
        $142^\circ$, $38^\circ$, $142^\circ$
      uitwerking: |-
        Overstaande hoeken zijn gelijk, nevenhoeken samen $180^\circ$.
    - opgave: |-
        de factor van een homothetie die een lijnstuk van 4~cm afbeeldt op een lijnstuk van 10~cm
      antwoord: |-
        2,5
      uitwerking: |-
        $\tfrac{10}{4} = 2{,}5$.
    - opgave: |-
        de basishoeken van een gelijkbenige driehoek met een tophoek van $40^\circ$
      antwoord: |-
        $70^\circ$ en $70^\circ$
      uitwerking: |-
        $(180^\circ - 40^\circ) : 2 = 70^\circ$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Teken een driehoek $ABC$ met $\lengte{AB} = 5$~cm, $\hoek{A} = 40^\circ$ en $\hoek{B} = 60^\circ$. Teken ook een driehoek $DEF$ met $\lengte{DE} = 8$~cm, $\hoek{D} = 40^\circ$ en $\hoek{E} = 60^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe groot zijn $\hoek{C}$ en $\hoek{F}$?
      antwoord: |-
        $80^\circ$
      uitwerking: |-
        $180^\circ - 40^\circ - 60^\circ = 80^\circ$, in beide driehoeken.
    - opgave: |-
        Meet de andere zijden van beide driehoeken, tot op een millimeter.
      antwoord: |-
        $\lengte{AC} \approx 4{,}4$, $\lengte{BC} \approx 3{,}3$, $\lengte{DF} \approx 7{,}0$, $\lengte{EF} \approx 5{,}2$ (cm)
      uitwerking: |-
        Een kleine meetfout is normaal.
    - opgave: |-
        Bereken $\dfrac{\lengte{DE}}{\lengte{AB}}$, $\dfrac{\lengte{DF}}{\lengte{AC}}$ en $\dfrac{\lengte{EF}}{\lengte{BC}}$. Wat valt je op?
      antwoord: |-
        telkens ongeveer 1,6
      uitwerking: |-
        De drie verhoudingen zijn gelijk (op meetfouten na): $DEF$ is een vergroting van $ABC$ met factor $\tfrac85 = 1{,}6$. Twee gelijke hoeken waren genoeg.

- id: h2-def
  soort: kort
  opgave: |-
    Bereken de ontbrekende zijden.
  lijst: enumerate
  delen:
    - opgave: |-
        $\drieh{ABC} \gv \drieh{DEF}$ met $\lengte{AB} = 6$, $\lengte{BC} = 9$, $\lengte{AC} = 12$ en $\lengte{DE} = 4$. Bereken $\lengte{EF}$ en $\lengte{DF}$.
      antwoord: |-
        $\lengte{EF} = 6$, $\lengte{DF} = 8$
      uitwerking: |-
        $k = \tfrac46 = \tfrac23$, dus $\lengte{EF} = \tfrac23 \cdot 9 = 6$ en $\lengte{DF} = \tfrac23 \cdot 12 = 8$.
    - opgave: |-
        $\drieh{KLM} \gv \drieh{RST}$ met $\lengte{KL} = 5$, $\lengte{RS} = 7{,}5$ en $\lengte{ST} = 9$. Bereken $\lengte{LM}$.
      antwoord: |-
        $\lengte{LM} = 6$
      uitwerking: |-
        $k = \tfrac{7{,}5}{5} = 1{,}5$ van $KLM$ naar $RST$, en $[LM]$ hoort bij $[ST]$: $9 : 1{,}5 = 6$.

- id: h2-hh
  soort: kort
  opgave: |-
    Zijn de driehoeken gelijkvormig? Schrijf de gelijkvormigheid dan in de juiste volgorde.
  lijst: enumerate
  delen:
    - opgave: |-
        $\drieh{ABC}$ met $\hoek{A} = 40^\circ$, $\hoek{B} = 75^\circ$ en $\drieh{PQR}$ met $\hoek{P} = 75^\circ$, $\hoek{R} = 65^\circ$
      antwoord: |-
        ja: $\drieh{ABC} \gv \drieh{QPR}$
      uitwerking: |-
        $\hoek{C} = 65^\circ$ en $\hoek{Q} = 40^\circ$. Dus $A$ bij $Q$, $B$ bij $P$ en $C$ bij $R$.
    - opgave: |-
        $\drieh{ABC}$ met $\hoek{A} = 30^\circ$, $\hoek{B} = 100^\circ$ en $\drieh{DEF}$ met $\hoek{D} = 30^\circ$, $\hoek{E} = 60^\circ$
      antwoord: |-
        nee
      uitwerking: |-
        De hoeken zijn $30^\circ$, $100^\circ$, $50^\circ$ tegenover $30^\circ$, $60^\circ$, $90^\circ$: maar één paar gelijke hoeken.
    - opgave: |-
        twee rechthoekige driehoeken, de ene met een scherpe hoek van $25^\circ$, de andere met een scherpe hoek van $65^\circ$
      antwoord: |-
        ja
      uitwerking: |-
        De andere scherpe hoek van de eerste is $90^\circ - 25^\circ = 65^\circ$. Beide hebben een rechte hoek en een hoek van $65^\circ$.

- id: h2-zzz
  soort: kort
  opgave: |-
    Zijn driehoeken met deze zijden gelijkvormig? Geef de factor als dat zo is.
  lijst: enumerate
  delen:
    - opgave: |-
        5, 8, 10 en 7,5; 12; 15
      antwoord: |-
        ja, $k = 1{,}5$
      uitwerking: |-
        $\tfrac{7{,}5}{5} = \tfrac{12}{8} = \tfrac{15}{10} = 1{,}5$.
    - opgave: |-
        6, 7, 9 en 9, 10, 13,5
      antwoord: |-
        nee
      uitwerking: |-
        $\tfrac96 = 1{,}5$ en $\tfrac{13{,}5}{9} = 1{,}5$, maar $\tfrac{10}{7} \approx 1{,}43$.
    - opgave: |-
        12, 16, 20 en 4, 5, 3
      antwoord: |-
        ja, $k = \tfrac14$
      uitwerking: |-
        Rangschik: 3, 4, 5. Dan $\tfrac{3}{12} = \tfrac{4}{16} = \tfrac{5}{20} = \tfrac14$.

- id: h2-zhz
  soort: kort
  opgave: |-
    Zijn de driehoeken gelijkvormig volgens het kenmerk ZHZ? Leg uit.
  lijst: enumerate
  delen:
    - opgave: |-
        $\lengte{AB} = 3$, $\lengte{AC} = 5$, $\hoek{A} = 70^\circ$ en $\lengte{DE} = 6$, $\lengte{DF} = 10$, $\hoek{D} = 70^\circ$
      antwoord: |-
        ja: $\drieh{ABC} \gv \drieh{DEF}$, $k = 2$
      uitwerking: |-
        $\tfrac63 = \tfrac{10}{5} = 2$, en de gelijke hoek ligt telkens tussen de twee zijden.
    - opgave: |-
        $\lengte{AB} = 4$, $\lengte{BC} = 6$, $\hoek{B} = 50^\circ$ en $\lengte{PQ} = 6$, $\lengte{QR} = 9$, $\hoek{Q} = 50^\circ$
      antwoord: |-
        ja: $\drieh{ABC} \gv \drieh{PQR}$, $k = 1{,}5$
      uitwerking: |-
        $\tfrac64 = \tfrac96 = 1{,}5$. De hoek $\hoek{B}$ ligt tussen $[AB]$ en $[BC]$, en $\hoek{Q}$ tussen $[PQ]$ en $[QR]$.
    - opgave: |-
        $\lengte{KL} = 4$, $\lengte{KM} = 5$, $\hoek{L} = 60^\circ$ en $\lengte{XY} = 8$, $\lengte{XZ} = 10$, $\hoek{Y} = 60^\circ$
      antwoord: |-
        het kenmerk zegt niets
      uitwerking: |-
        De verhoudingen zijn gelijk, maar de hoek van $60^\circ$ ligt niet tussen de twee zijden. Je kunt dus niet besluiten dat ze gelijkvormig zijn.

- id: h2-ev
  soort: kort
  opgave: |-
    In driehoek $ABC$ ligt $D$ op $[AB]$ en $E$ op $[AC]$, met $DE \parallel BC$.
  lijst: enumerate
  delen:
    - opgave: |-
        $\lengte{AD} = 2$, $\lengte{AB} = 5$ en $\lengte{BC} = 8$. Bereken $\lengte{DE}$.
      antwoord: |-
        3,2
      uitwerking: |-
        $k = \tfrac25$ van groot naar klein, dus $\lengte{DE} = \tfrac25 \cdot 8 = 3{,}2$.
    - opgave: |-
        $\lengte{AE} = 6$, $\lengte{EC} = 3$ en $\lengte{DE} = 10$. Bereken $\lengte{BC}$.
      antwoord: |-
        15
      uitwerking: |-
        $\lengte{AC} = 9$, dus $k = \tfrac96 = 1{,}5$ van klein naar groot, en $\lengte{BC} = 1{,}5 \cdot 10 = 15$.
    - opgave: |-
        $\lengte{AD} = 4$, $\lengte{DB} = 6$ en $\lengte{AC} = 15$. Bereken $\lengte{AE}$.
      antwoord: |-
        6
      uitwerking: |-
        $\lengte{AB} = 10$, dus $k = \tfrac{4}{10} = 0{,}4$ en $\lengte{AE} = 0{,}4 \cdot 15 = 6$.

- id: h2-zand
  soort: kort
  opgave: |-
    De lijnstukken $[AC]$ en $[BD]$ snijden elkaar in $S$, en $AB \parallel CD$. Verder is $\lengte{SA} = 4$, $\lengte{SB} = 3$, $\lengte{SC} = 10$ en $\lengte{CD} = 12$. Bereken $\lengte{SD}$ en $\lengte{AB}$.
  antwoord: |-
    $\lengte{SD} = 7{,}5$, $\lengte{AB} = 4{,}8$
  uitwerking: |-
    $\drieh{SAB} \gv \drieh{SCD}$ (overstaande hoeken en Z-hoeken), met $k = \tfrac{10}{4} = 2{,}5$. Dus $\lengte{SD} = 2{,}5 \cdot 3 = 7{,}5$ en $\lengte{AB} = 12 : 2{,}5 = 4{,}8$.

- id: h2-afstand
  soort: kort
  opgave: |-
    Bereken de hoogte.
  lijst: enumerate
  delen:
    - opgave: |-
        Tom ziet de bovenrand van een gebouw in een spiegeltje op de grond. Het spiegeltje ligt 2~m van Tom en 10~m van het gebouw. De ogen van Tom zijn 1,5~m boven de grond.
      antwoord: |-
        7,5~m
      uitwerking: |-
        Twee rechthoekige driehoeken met gelijke hoeken in de spiegel: $\tfrac{h}{1{,}5} = \tfrac{10}{2}$, dus $h = 7{,}5$.
    - opgave: |-
        Een stok van 1~m werpt een schaduw van 0,8~m. Op hetzelfde moment werpt een toren een schaduw van 20~m.
      antwoord: |-
        25~m
      uitwerking: |-
        De zonnestralen zijn evenwijdig, dus de driehoeken hebben dezelfde hoeken: $\tfrac{h}{1} = \tfrac{20}{0{,}8}$, dus $h = 25$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    zijden van gelijkvormige driehoeken
  opgave: |-
    Bereken de ontbrekende zijden.
  lijst: enumerate
  delen:
    - opgave: |-
        $\drieh{ABC} \gv \drieh{DEF}$ met $\lengte{AB} = 5$, $\lengte{BC} = 7$, $\lengte{AC} = 8$ en $\lengte{DE} = 7{,}5$.
      antwoord: |-
        $\lengte{EF} = 10{,}5$, $\lengte{DF} = 12$
      uitwerking: |-
        $k = \tfrac{7{,}5}{5} = 1{,}5$, dus $\lengte{EF} = 1{,}5 \cdot 7 = 10{,}5$ en $\lengte{DF} = 1{,}5 \cdot 8 = 12$.
    - opgave: |-
        $\drieh{ABC} \gv \drieh{DEF}$ met $\lengte{AB} = 12$, $\lengte{AC} = 9$, $\lengte{DE} = 8$ en $\lengte{EF} = 10$.
      antwoord: |-
        $\lengte{BC} = 15$, $\lengte{DF} = 6$
      uitwerking: |-
        $k = \tfrac{8}{12} = \tfrac23$. Dan $\lengte{DF} = \tfrac23 \cdot 9 = 6$ en $\lengte{BC} = 10 : \tfrac23 = 15$.
    - opgave: |-
        $\drieh{ABC} \gv \drieh{DEF}$ met $\lengte{BC} = 4{,}2$, $\lengte{EF} = 2{,}8$, $\lengte{AB} = 6$ en $\lengte{DF} = 3$.
      antwoord: |-
        $\lengte{DE} = 4$, $\lengte{AC} = 4{,}5$
      uitwerking: |-
        $k = \tfrac{2{,}8}{4{,}2} = \tfrac23$. Dan $\lengte{DE} = \tfrac23 \cdot 6 = 4$ en $\lengte{AC} = 3 : \tfrac23 = 4{,}5$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    kenmerk HH
  opgave: |-
    Zijn de driehoeken gelijkvormig? Schrijf de gelijkvormigheid dan in de juiste volgorde.
  lijst: enumerate
  delen:
    - opgave: |-
        $\hoek{A} = 45^\circ$, $\hoek{B} = 75^\circ$ en $\hoek{P} = 75^\circ$, $\hoek{Q} = 60^\circ$
      antwoord: |-
        ja: $\drieh{ABC} \gv \drieh{RPQ}$
      uitwerking: |-
        $\hoek{C} = 60^\circ$ en $\hoek{R} = 45^\circ$. Dus $A$ bij $R$, $B$ bij $P$, $C$ bij $Q$.
    - opgave: |-
        $\hoek{A} = 50^\circ$, $\hoek{B} = 60^\circ$ en $\hoek{D} = 50^\circ$, $\hoek{E} = 80^\circ$
      antwoord: |-
        nee
      uitwerking: |-
        $50^\circ$, $60^\circ$, $70^\circ$ tegenover $50^\circ$, $80^\circ$, $50^\circ$.
    - opgave: |-
        $\hoek{A} = 90^\circ$, $\hoek{B} = 33^\circ$ en $\hoek{K} = 57^\circ$, $\hoek{L} = 90^\circ$
      antwoord: |-
        ja: $\drieh{ABC} \gv \drieh{LMK}$
      uitwerking: |-
        $\hoek{C} = 57^\circ$ en $\hoek{M} = 33^\circ$. Dus $A$ bij $L$, $B$ bij $M$, $C$ bij $K$.
    - opgave: |-
        een gelijkbenige driehoek $ABC$ met tophoek $\hoek{A} = 40^\circ$, en een driehoek $DEF$ met $\hoek{D} = 70^\circ$ en $\hoek{E} = 40^\circ$
      antwoord: |-
        ja: $\drieh{ABC} \gv \drieh{EDF}$
      uitwerking: |-
        $\hoek{B} = \hoek{C} = 70^\circ$ en $\hoek{F} = 70^\circ$. Dus $A$ bij $E$; $B$ en $C$ bij $D$ en $F$ (de volgorde $EFD$ mag ook, want $ABC$ is gelijkbenig).

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    kenmerk ZZZ
  opgave: |-
    Zijn driehoeken met deze zijden gelijkvormig? Geef de factor als dat zo is.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        3, 4, 5 en 6, 8, 10
      antwoord: |-
        ja, 2
      uitwerking: |-
        Telkens het dubbel.
    - opgave: |-
        2, 3, 4 en 3; 4,5; 6
      antwoord: |-
        ja, 1,5
      uitwerking: |-
        $\tfrac32 = \tfrac{4{,}5}{3} = \tfrac64 = 1{,}5$.
    - opgave: |-
        5, 6, 7 en 10, 12, 15
      antwoord: |-
        nee
      uitwerking: |-
        $\tfrac{10}{5} = \tfrac{12}{6} = 2$, maar $\tfrac{15}{7} \neq 2$.
    - opgave: |-
        6, 8, 9 en 7,2; 4,8; 6,4
      antwoord: |-
        ja, 0,8
      uitwerking: |-
        Rangschik: 4,8; 6,4; 7,2. Dan $\tfrac{4{,}8}{6} = \tfrac{6{,}4}{8} = \tfrac{7{,}2}{9} = 0{,}8$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    evenwijdige met een zijde
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.62,font=\scriptsize]
        \coordinate (A) at (1.5,3.5); \coordinate (B) at (0,0); \coordinate (C) at (5,0);
        \coordinate (D) at ($(A)!.4!(B)$); \coordinate (E) at ($(A)!.4!(C)$);
        \filldraw[fill=accent!10,draw=accent,thick] (A) -- (B) -- (C) -- cycle;
        \draw[accent,thick] (D) -- (E);
        \node[above] at (A) {$A$}; \node[below] at (B) {$B$}; \node[below] at (C) {$C$};
        \node[left] at (D) {$D$}; \node[right] at (E) {$E$};
      \end{tikzpicture}
  opgave: |-
    In de figuur is $DE \parallel BC$, met $\lengte{AD} = 2$, $\lengte{DB} = 3$, $\lengte{AE} = 2{,}4$ en $\lengte{BC} = 7{,}5$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom zijn de driehoeken $ADE$ en $ABC$ gelijkvormig?
      antwoord: |-
        kenmerk HH
      uitwerking: |-
        $\hoek{A}$ is gemeenschappelijk, en $\hoek{ADE} = \hoek{B}$ zijn F-hoeken bij $DE \parallel BC$.
    - opgave: |-
        Bereken $\lengte{EC}$.
      antwoord: |-
        3,6
      uitwerking: |-
        $k = \tfrac{\lengte{AB}}{\lengte{AD}} = \tfrac52 = 2{,}5$, dus $\lengte{AC} = 2{,}5 \cdot 2{,}4 = 6$ en $\lengte{EC} = 6 - 2{,}4 = 3{,}6$.
    - opgave: |-
        Bereken $\lengte{DE}$.
      antwoord: |-
        3
      uitwerking: |-
        $\lengte{DE} = 7{,}5 : 2{,}5 = 3$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    overeenkomstige hoekpunten uit een figuur
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.2,font=\scriptsize]
        \coordinate (A) at (0,0); \coordinate (B) at (6,0); \coordinate (C) at (1.75,6.778);
        \filldraw[fill=accent!30,draw=accent,thick] (A) -- (B) -- (C) -- cycle;
        \hoekboog{B}{A}{C}{2.5mm} \hoekboog{C}{B}{A}{2mm}\hoekboog{C}{B}{A}{2.6mm}
        \node[below] at (A) {$A$}; \node[below] at (B) {$B$}; \node[above] at (C) {$C$};
        \coordinate (R) at (17,0); \coordinate (P) at (8,0); \coordinate (Q) at (14.375,10.167);
        \filldraw[fill=accent!12,draw=accent,thick] (R) -- (P) -- (Q) -- cycle;
        \hoekboog{Q}{R}{P}{2.5mm} \hoekboog{R}{P}{Q}{2mm}\hoekboog{R}{P}{Q}{2.6mm}
        \node[below] at (R) {$R$}; \node[below] at (P) {$P$}; \node[above] at (Q) {$Q$};
      \end{tikzpicture}
  opgave: |-
    Gelijke hoeken hebben in de figuur hetzelfde aantal boogjes. Verder is $\lengte{AB} = 6$, $\lengte{BC} = 8$, $\lengte{AC} = 7$ en $\lengte{RP} = 9$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf de gelijkvormigheid met de hoekpunten in de juiste volgorde.
      antwoord: |-
        $\drieh{ABC} \gv \drieh{RPQ}$
      uitwerking: |-
        Eén boogje: $A$ bij $R$. Twee boogjes: $B$ bij $P$. Dus $C$ bij $Q$.
    - opgave: |-
        Bereken $\lengte{PQ}$ en $\lengte{QR}$.
      antwoord: |-
        $\lengte{PQ} = 12$, $\lengte{QR} = 10{,}5$
      uitwerking: |-
        $[RP]$ hoort bij $[AB]$: $k = \tfrac96 = 1{,}5$. Dan $\lengte{PQ} = 1{,}5 \cdot 8 = 12$ en $\lengte{QR} = 1{,}5 \cdot 7 = 10{,}5$.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    kenmerk ZHZ
  opgave: |-
    Kun je met het kenmerk ZHZ besluiten dat de driehoeken gelijkvormig zijn?
  lijst: enumerate
  delen:
    - opgave: |-
        $\lengte{AB} = 4$, $\lengte{AC} = 6$, $\hoek{A} = 50^\circ$ en $\lengte{DE} = 6$, $\lengte{DF} = 9$, $\hoek{D} = 50^\circ$
      antwoord: |-
        ja, $k = 1{,}5$
      uitwerking: |-
        $\tfrac64 = \tfrac96 = 1{,}5$ en de ingesloten hoeken zijn gelijk.
    - opgave: |-
        $\lengte{AB} = 5$, $\lengte{BC} = 8$, $\hoek{B} = 70^\circ$ en $\lengte{PQ} = 10$, $\lengte{QR} = 16$, $\hoek{P} = 70^\circ$
      antwoord: |-
        nee
      uitwerking: |-
        De verhoudingen zijn gelijk, maar $\hoek{P}$ ligt niet tussen $[PQ]$ en $[QR]$: dat is $\hoek{Q}$.
    - opgave: |-
        $\lengte{KL} = 3$, $\lengte{KM} = 4$, $\hoek{K} = 90^\circ$ en $\lengte{XY} = 4{,}5$, $\lengte{XZ} = 6$, $\hoek{X} = 90^\circ$
      antwoord: |-
        ja, $k = 1{,}5$
      uitwerking: |-
        $\tfrac{4{,}5}{3} = \tfrac64 = 1{,}5$, en de rechte hoek ligt tussen beide rechthoekszijden.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    hoogte met een schaduw
  opgave: |-
    Een stok van 1,2~m hoog werpt een schaduw van 1,5~m. Op hetzelfde moment werpt een vlaggenmast een schaduw van 10~m.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom zijn de driehoeken van de stok en de mast met hun schaduw gelijkvormig?
      antwoord: |-
        kenmerk HH
      uitwerking: |-
        Beide staan loodrecht op de grond, en de zonnestralen zijn evenwijdig, dus ze maken dezelfde hoek met de grond.
    - opgave: |-
        Hoe hoog is de vlaggenmast?
      antwoord: |-
        8~m
      uitwerking: |-
        $\tfrac{h}{1{,}2} = \tfrac{10}{1{,}5}$, dus $h = 8$.
    - opgave: |-
        Later op de dag is de schaduw van de stok 1,8~m lang. Hoe lang is de schaduw van de mast dan?
      antwoord: |-
        12~m
      uitwerking: |-
        De schaduw is nu $\tfrac{1{,}8}{1{,}2} = 1{,}5$ keer de hoogte: $1{,}5 \cdot 8 = 12$.

- id: h2-o8
  soort: opdracht
  niveau: 1
  thema: |-
    zandloper
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[scale=.55,font=\scriptsize]
        \coordinate (S) at (0,0); \coordinate (A) at (-1,1.5); \coordinate (B) at (1.4,1.5);
        \coordinate (C) at (1.5, -2.25); \coordinate (D) at (-2.1, -2.25);
        \filldraw[fill=accent!30,draw=accent,thick] (S) -- (A) -- (B) -- cycle;
        \filldraw[fill=accent!12,draw=accent,thick] (S) -- (C) -- (D) -- cycle;
        \node[above] at (A) {$A$}; \node[above] at (B) {$B$}; \node[below] at (C) {$C$}; \node[below] at (D) {$D$};
        \node[right=2pt] at (S) {$S$};
      \end{tikzpicture}
  opgave: |-
    In de figuur is $AB \parallel CD$, met $\lengte{SA} = 4$, $\lengte{SB} = 5$, $\lengte{SC} = 6$ en $\lengte{CD} = 7{,}5$. Bereken $\lengte{SD}$ en $\lengte{AB}$.
  antwoord: |-
    $\lengte{SD} = 7{,}5$, $\lengte{AB} = 5$
  uitwerking: |-
    $\drieh{SAB} \gv \drieh{SCD}$ (overstaande hoeken en Z-hoeken), met $k = \tfrac64 = 1{,}5$. Dus $\lengte{SD} = 1{,}5 \cdot 5 = 7{,}5$ en $\lengte{AB} = 7{,}5 : 1{,}5 = 5$.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    de breedte van een kanaal
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[scale=1,font=\scriptsize]
        \fill[accent!12] (-.4,.12) rectangle (4,1.88);
        \draw[lijngrijs] (-.4,0) -- (4,0) (-.4,2) -- (4,2);
        \coordinate (A) at (0,0); \coordinate (T) at (0,2); \coordinate (B) at (3,0);
        \coordinate (C) at (3.6,0); \coordinate (D) at (3.6,-.4);
        \draw[accent,thick] (T) -- (D);
        \draw[grijs,thick] (A) -- (T) (C) -- (D);
        \rechtehoek{T}{A}{B} \rechtehoek{B}{C}{D}
        \fill (A) circle (1.4pt) node[below left] {$A$}; \fill (T) circle (1.4pt) node[above] {$T$};
        \fill (B) circle (1.4pt) node[above] {$B$}; \fill (C) circle (1.4pt) node[above right] {$C$};
        \fill (D) circle (1.4pt) node[below] {$D$};
      \end{tikzpicture}
  opgave: |-
    Lies wil weten hoe breed een kanaal is. Ze staat in $A$, recht tegenover een boom $T$ aan de overkant. Ze stapt 30~m langs de oever naar $B$ en zet daar een stok. Ze stapt nog 6~m verder naar $C$, en wandelt dan loodrecht weg van het kanaal tot ze in $D$ de stok en de boom op één lijn ziet. Dan is $\lengte{CD} = 4$~m.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de driehoeken $BAT$ en $BCD$ gelijkvormig zijn.
      antwoord: |-
        kenmerk HH
      uitwerking: |-
        $\hoek{A} = \hoek{C} = 90^\circ$, en de hoeken in $B$ zijn overstaande hoeken.
    - opgave: |-
        Hoe breed is het kanaal?
      antwoord: |-
        20~m
      uitwerking: |-
        $\tfrac{\lengte{AT}}{\lengte{CD}} = \tfrac{\lengte{BA}}{\lengte{BC}} = \tfrac{30}{6} = 5$, dus $\lengte{AT} = 5 \cdot 4 = 20$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    een helling
  opgave: |-
    Een helling voor rolstoelen overbrugt een hoogte van 0,5~m over een horizontale afstand van 6~m.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe hoog is de helling op 2,4~m van het begin, horizontaal gemeten?
      antwoord: |-
        0,2~m
      uitwerking: |-
        Gelijkvormige rechthoekige driehoeken met de hoek van de helling gemeenschappelijk: $\tfrac{h}{0{,}5} = \tfrac{2{,}4}{6}$, dus $h = 0{,}2$.
    - opgave: |-
        Op welke horizontale afstand van het begin is de helling 30~cm hoog?
      antwoord: |-
        3,6~m
      uitwerking: |-
        $\tfrac{x}{6} = \tfrac{0{,}3}{0{,}5}$, dus $x = 3{,}6$.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    evenwijdige met een zijde, met een vergelijking
  opgave: |-
    In driehoek $ABC$ ligt $D$ op $[AB]$ en $E$ op $[AC]$, met $DE \parallel BC$. Verder is $\lengte{DB} = 4$, $\lengte{DE} = 6$ en $\lengte{BC} = 9$. Bereken $\lengte{AD}$.
  antwoord: |-
    8
  uitwerking: |-
    Noem $\lengte{AD} = x$, dan is $\lengte{AB} = x + 4$. Uit $\drieh{ADE} \gv \drieh{ABC}$ volgt $\tfrac{x}{x + 4} = \tfrac69$, dus $9x = 6x + 24$ en $x = 8$. Controle: $\tfrac{8}{12} = \tfrac23 = \tfrac69$.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    hoogte en oppervlakte bij gelijkvormige driehoeken
  opgave: |-
    $\drieh{ABC} \gv \drieh{DEF}$ met factor $k = 2{,}5$.
  lijst: enumerate
  delen:
    - opgave: |-
        De hoogte uit $C$ in $\drieh{ABC}$ is 4. Hoe lang is de hoogte uit $F$ in $\drieh{DEF}$? Leg uit.
      antwoord: |-
        10
      uitwerking: |-
        $\drieh{DEF}$ is een vergroting van $\drieh{ABC}$ (eventueel verschoven of gedraaid), en daarbij wordt elk lijnstuk $k$ keer zo lang, ook een hoogte: $2{,}5 \cdot 4 = 10$.
    - opgave: |-
        $\drieh{ABC}$ heeft een oppervlakte van 14. Hoe groot is de oppervlakte van $\drieh{DEF}$?
      antwoord: |-
        87,5
      uitwerking: |-
        $k^2 \cdot 14 = 6{,}25 \cdot 14 = 87{,}5$.
    - opgave: |-
        Hoeveel keer zo groot is de omtrek van $\drieh{DEF}$ als die van $\drieh{ABC}$?
      antwoord: |-
        2,5 keer
      uitwerking: |-
        Elke zijde wordt $k = 2{,}5$ keer zo lang, dus ook de omtrek.

- id: h2-o13
  pakketten: [4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    hoogtelijn in een rechthoekige driehoek
  opgave: |-
    Driehoek $ABC$ is rechthoekig in $A$, en $[AD]$ is de hoogtelijn op $[BC]$, met $\lengte{BD} = 2$ en $\lengte{DC} = 8$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\lengte{AD}$.
      antwoord: |-
        4
      uitwerking: |-
        $\drieh{DBA} \gv \drieh{DAC}$, dus $\lengte{AD}^2 = \lengte{BD} \cdot \lengte{DC} = 16$ en $\lengte{AD} = 4$.
    - opgave: |-
        Toon aan dat $\drieh{ABC} \gv \drieh{DBA}$, en bereken daarmee $\lengte{AB}$ tot op 0,01.
      antwoord: |-
        $\lengte{AB} = \sqrt{20} \approx 4{,}47$
      uitwerking: |-
        Beide hebben een rechte hoek ($\hoek{A}$ en $\hoek{D}$) en de hoek $\hoek{B}$ gemeenschappelijk: HH. Dus $\tfrac{\lengte{AB}}{\lengte{DB}} = \tfrac{\lengte{BC}}{\lengte{BA}}$, of $\lengte{AB}^2 = \lengte{BD} \cdot \lengte{BC} = 2 \cdot 10 = 20$.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    weerkaatsing op een biljarttafel
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[scale=.28,font=\scriptsize]
        \fill[accent!10] (-1,0) rectangle (13,7);
        \draw[grijs,line width=2pt] (-1,0) -- (13,0);
        \coordinate (P) at (0,3); \coordinate (Q) at (12,6); \coordinate (X) at (4,0);
        \draw[accent,thick,->] (P) -- (X); \draw[accent,thick,->] (X) -- (Q);
        \draw[lijngrijs,dashed] (P) -- (0,0) (Q) -- (12,0);
        \fill[white,draw=inkt] (P) circle (.4); \fill[inkt] (Q) circle (.4);
        \node[left=2pt] at (P) {$P$}; \node[right=2pt] at (Q) {$Q$}; \node[below] at (X) {$X$};
        \node[below] at (0,0) {$P'$}; \node[below] at (12,0) {$Q'$};
      \end{tikzpicture}
  opgave: |-
    Een witte bal $P$ ligt 30~cm van de boord van een biljarttafel, een rode bal $Q$ ligt 60~cm van die boord. Langs de boord gemeten liggen ze 120~cm uit elkaar ($\lengte{P'Q'} = 120$). Een bal kaatst op de boord terug onder dezelfde hoek als waaronder hij aankomt. Waar moet de witte bal de boord raken om de rode bal te treffen? Bereken $\lengte{P'X}$.
  antwoord: |-
    40~cm
  uitwerking: |-
    $\drieh{XP'P} \gv \drieh{XQ'Q}$ (rechte hoeken en gelijke hoeken in $X$). Noem $\lengte{P'X} = x$, dan $\tfrac{x}{120 - x} = \tfrac{30}{60}$, dus $2x = 120 - x$ en $x = 40$.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    schaduw van een lantaarnpaal
  opgave: |-
    Ilias is 1,80~m groot en staat 4~m van een lantaarnpaal van 6~m hoog. Hoe lang is zijn schaduw? Maak eerst een figuur, en rond af op 1~cm.
  antwoord: |-
    ongeveer 1,71~m
  uitwerking: |-
    Noem de schaduw $s$. De lamp, de voet van de paal en het einde van de schaduw vormen een grote driehoek; Ilias en zijn schaduw een kleine, gelijkvormig (HH: rechte hoek en gemeenschappelijke hoek). Dus $\tfrac{s}{s + 4} = \tfrac{1{,}8}{6}$, of $6s = 1{,}8s + 7{,}2$, zodat $s = \tfrac{7{,}2}{4{,}2} \approx 1{,}71$.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    afstand schatten met de duim
  opgave: |-
    Je strekt je arm en houdt je duim omhoog. Je duim is 2~cm breed en staat 60~cm van je oog. Een auto van 1,8~m breed wordt precies bedekt door je duim. Hoe ver staat de auto? Leg uit waarom je mag rekenen met een verhouding.
  antwoord: |-
    54~m
  uitwerking: |-
    Het oog, de randen van de duim en de randen van de auto vormen twee gelijkvormige driehoeken met een gemeenschappelijke tophoek in het oog (de duim staat evenwijdig met de auto). $\tfrac{d}{60} = \tfrac{180}{2} = 90$, dus $d = 5400~\text{cm} = 54~\text{m}$.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    diagonalen van een trapezium
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.28,font=\scriptsize]
        \coordinate (A) at (0,0); \coordinate (B) at (12,0); \coordinate (C) at (8,6); \coordinate (D) at (4,6);
        \coordinate (S) at (6,4.5);
        \filldraw[fill=accent!10,draw=accent,thick] (A) -- (B) -- (C) -- (D) -- cycle;
        \draw[accent] (A) -- (C) (B) -- (D);
        \node[below] at (A) {$A$}; \node[below] at (B) {$B$}; \node[above] at (C) {$C$}; \node[above] at (D) {$D$};
        \node[below] at (S) {$S$};
      \end{tikzpicture}
  opgave: |-
    In het trapezium $ABCD$ is $AB \parallel CD$, met $\lengte{AB} = 12$ en $\lengte{CD} = 4$. De diagonalen snijden elkaar in $S$, en $\lengte{AC} = \lengte{BD} = 10$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke twee driehoeken in de figuur zijn gelijkvormig? Met welk kenmerk?
      antwoord: |-
        $\drieh{SAB} \gv \drieh{SCD}$, HH
      uitwerking: |-
        Overstaande hoeken in $S$, en $\hoek{SAB} = \hoek{SCD}$ zijn Z-hoeken: een zandloper.
    - opgave: |-
        Bereken $\lengte{AS}$, $\lengte{SC}$ en $\lengte{BS}$.
      antwoord: |-
        $\lengte{AS} = 7{,}5$, $\lengte{SC} = 2{,}5$, $\lengte{BS} = 7{,}5$
      uitwerking: |-
        $k = \tfrac{12}{4} = 3$, dus $\lengte{AS} = 3\,\lengte{SC}$. Samen 10, dus $\lengte{SC} = 2{,}5$ en $\lengte{AS} = 7{,}5$. Net zo is $\lengte{BS} = 7{,}5$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    twee hoogtelijnen
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.27,font=\scriptsize]
        \coordinate (B) at (0,0); \coordinate (C) at (12,0); \coordinate (A) at (6,8);
        \coordinate (D) at (6,0); \coordinate (E) at (7.68,5.76);
        \filldraw[fill=accent!10,draw=accent,thick] (A) -- (B) -- (C) -- cycle;
        \draw[accent] (A) -- (D) (B) -- (E);
        \rechtehoek{A}{D}{C} \rechtehoek{C}{E}{B}
        \node[above] at (A) {$A$}; \node[below] at (B) {$B$}; \node[below] at (C) {$C$};
        \node[below] at (D) {$D$}; \node[right] at (E) {$E$};
      \end{tikzpicture}
  opgave: |-
    In driehoek $ABC$ zijn $[AD]$ en $[BE]$ hoogtelijnen. Verder is $\lengte{AC} = 10$, $\lengte{AD} = 8$ en $\lengte{BC} = 12$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\drieh{ADC} \gv \drieh{BEC}$.
      antwoord: |-
        kenmerk HH
      uitwerking: |-
        $\hoek{D} = \hoek{E} = 90^\circ$, en $\hoek{C}$ is gemeenschappelijk.
    - opgave: |-
        Bereken $\lengte{BE}$.
      antwoord: |-
        9,6
      uitwerking: |-
        $\tfrac{\lengte{BE}}{\lengte{AD}} = \tfrac{\lengte{BC}}{\lengte{AC}}$, dus $\lengte{BE} = 8 \cdot \tfrac{12}{10} = 9{,}6$.
    - opgave: |-
        Controleer je antwoord met de oppervlakte van $\drieh{ABC}$, berekend op twee manieren.
      antwoord: |-
        beide 48
      uitwerking: |-
        $\tfrac12 \cdot 12 \cdot 8 = 48$ en $\tfrac12 \cdot 10 \cdot 9{,}6 = 48$.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    het juiste kenmerk kiezen
  opgave: |-
    Welk kenmerk gebruik je om aan te tonen dat de driehoeken gelijkvormig zijn?
  lijst: enumerate
  delen:
    - opgave: |-
        Je kent van beide driehoeken de drie zijden, en ze hebben dezelfde verhouding.
      antwoord: |-
        ZZZ
      uitwerking: |-
        Drie zijden in dezelfde verhouding.
    - opgave: |-
        Beide driehoeken zijn rechthoekig, en ze hebben nog een gelijke hoek.
      antwoord: |-
        HH
      uitwerking: |-
        De rechte hoek en de andere gelijke hoek.
    - opgave: |-
        Twee gelijkbenige driehoeken hebben dezelfde tophoek.
      antwoord: |-
        HH (of ZHZ)
      uitwerking: |-
        De basishoeken zijn dan ook gelijk: HH. Met ZHZ kan het ook: de benen hebben dezelfde verhouding en de tophoek ligt ertussen.
    - opgave: |-
        Een rechte evenwijdig met een zijde snijdt een kleine driehoek af.
      antwoord: |-
        HH
      uitwerking: |-
        Een gemeenschappelijke hoek en F-hoeken.
    - opgave: |-
        De ene driehoek heeft hoeken van $50^\circ$ en $60^\circ$, de andere hoeken van $60^\circ$ en $70^\circ$.
      antwoord: |-
        HH
      uitwerking: |-
        De derde hoeken zijn $70^\circ$ en $50^\circ$: beide driehoeken hebben hoeken van $50^\circ$, $60^\circ$ en $70^\circ$.
    - opgave: |-
        Twee zijden hebben dezelfde verhouding, en een hoek die niet tussen die zijden ligt, is gelijk.
      antwoord: |-
        geen enkel kenmerk
      uitwerking: |-
        Bij ZHZ moet de gelijke hoek tussen de twee zijden liggen. Zo kun je niet besluiten dat de driehoeken gelijkvormig zijn.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    verhouding van de stukken bij een evenwijdige
  opgave: |-
    In driehoek $ABC$ ligt $D$ op $[AB]$ en $E$ op $[AC]$, met $DE \parallel BC$. Je weet dat $\dfrac{\lengte{AD}}{\lengte{AB}} = \dfrac{\lengte{AE}}{\lengte{AC}}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Controleer met $\lengte{AD} = 4$, $\lengte{DB} = 6$, $\lengte{AE} = 4{,}8$ en $\lengte{EC} = 7{,}2$ dat ook $\dfrac{\lengte{AD}}{\lengte{DB}} = \dfrac{\lengte{AE}}{\lengte{EC}}$.
      antwoord: |-
        beide $\tfrac23$
      uitwerking: |-
        $\tfrac46 = \tfrac23$ en $\tfrac{4{,}8}{7{,}2} = \tfrac23$.
    - opgave: |-
        Toon aan dat $\dfrac{\lengte{AD}}{\lengte{DB}} = \dfrac{\lengte{AE}}{\lengte{EC}}$ altijd geldt. Tip: neem het omgekeerde van beide breuken, en schrijf $\lengte{AB} = \lengte{AD} + \lengte{DB}$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        Uit $\tfrac{\lengte{AB}}{\lengte{AD}} = \tfrac{\lengte{AC}}{\lengte{AE}}$ volgt $\tfrac{\lengte{AD} + \lengte{DB}}{\lengte{AD}} = \tfrac{\lengte{AE} + \lengte{EC}}{\lengte{AE}}$, of $1 + \tfrac{\lengte{DB}}{\lengte{AD}} = 1 + \tfrac{\lengte{EC}}{\lengte{AE}}$. Dus $\tfrac{\lengte{DB}}{\lengte{AD}} = \tfrac{\lengte{EC}}{\lengte{AE}}$, en het omgekeerde van beide is de gevraagde gelijkheid.
    - opgave: |-
        Waarom is $\dfrac{\lengte{DE}}{\lengte{BC}}$ toch niet gelijk aan $\dfrac{\lengte{AD}}{\lengte{DB}}$? Geef een voorbeeld.
      antwoord: |-
        $[DE]$ hoort bij de hele zijde $[BC]$
      uitwerking: |-
        In het voorbeeld van a is $\tfrac{\lengte{DE}}{\lengte{BC}} = \tfrac{\lengte{AD}}{\lengte{AB}} = \tfrac{4}{10} = 0{,}4$, maar $\tfrac{\lengte{AD}}{\lengte{DB}} = \tfrac23$. Er is geen driehoek met $[DB]$ als zijde die gelijkvormig is met $\drieh{ADE}$.

- id: h2-o21
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    zwaartelijnen in gelijkvormige driehoeken (bewijs)
  opgave: |-
    $\drieh{ABC} \gv \drieh{DEF}$ met factor $k$. Het punt $M$ is het midden van $[BC]$, en $N$ is het midden van $[EF]$. Toon aan dat de zwaartelijn $[DN]$ precies $k$ keer zo lang is als de zwaartelijn $[AM]$.
  antwoord: |-
    zie uitwerking
  uitwerking: |-
    $\lengte{EN} = \tfrac12 \lengte{EF} = \tfrac12 k\,\lengte{BC} = k\,\lengte{BM}$ en $\lengte{DE} = k\,\lengte{AB}$. Verder is $\hoek{E} = \hoek{B}$, en die hoek ligt tussen de twee zijden. Volgens ZHZ is $\drieh{ABM} \gv \drieh{DEN}$ met factor $k$, dus $\lengte{DN} = k\,\lengte{AM}$.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    een vierkant in een driehoek
  figuur:
    opties: |-
      2.8cm
    code: |-
      \begin{tikzpicture}[scale=.6,font=\scriptsize]
        \coordinate (C) at (0,0); \coordinate (A) at (4,0); \coordinate (B) at (0,3);
        \filldraw[fill=accent!10,draw=accent,thick] (C) -- (A) -- (B) -- cycle;
        \filldraw[fill=accent!35,draw=accent,thick] (0,0) rectangle (1.714,1.714);
        \node[below left] at (C) {$C$}; \node[below] at (A) {$A$}; \node[left] at (B) {$B$};
        \node[below] at (2,0) {4}; \node[left] at (0,2.4) {3};
      \end{tikzpicture}
  opgave: |-
    In een rechthoekige driehoek met rechthoekszijden $\lengte{CA} = 4$ en $\lengte{CB} = 3$ teken je een vierkant: een hoekpunt in $C$, twee zijden langs de rechthoekszijden en het vierde hoekpunt op de schuine zijde. Hoe lang is de zijde van het vierkant? Tip: boven het vierkant ligt een kleine driehoek.
  antwoord: |-
    $\tfrac{12}{7} \approx 1{,}71$
  uitwerking: |-
    Noem de zijde $s$. De kleine driehoek boven het vierkant heeft rechthoekszijden $3 - s$ (verticaal) en $s$ (horizontaal), en is gelijkvormig met $\drieh{CAB}$ (een rechte hoek en de hoek in $B$ gemeenschappelijk). Dus $\tfrac{3 - s}{s} = \tfrac34$, of $12 - 4s = 3s$, zodat $s = \tfrac{12}{7}$.

- id: h2-o23
  soort: opdracht
  niveau: 2
  thema: |-
    de grootte van de maan
  opgave: |-
    Je houdt een muntstuk met een diameter van 2,3~cm voor je oog, zo ver dat het de volle maan precies bedekt: 2,54~m van je oog. De maan staat ongeveer $384\,000$~km van de aarde. Schat de diameter van de maan, afgerond op 10~km.
  antwoord: |-
    ongeveer 3480~km
  uitwerking: |-
    Twee gelijkvormige driehoeken met de tophoek in je oog: $\tfrac{D}{384\,000} = \tfrac{2{,}3}{254}$, dus $D \approx 3477~\text{km}$. (De echte diameter is ongeveer 3475~km.)

- id: h2-o24
  soort: opdracht
  niveau: 3
  thema: |-
    gekruiste draden
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.3,font=\scriptsize]
        \draw[lijngrijs] (-1,0) -- (11,0);
        \draw[grijs,line width=1.5pt] (0,0) -- (0,4) (10,0) -- (10,6);
        \draw[accent,thick] (0,4) -- (10,0) (10,6) -- (0,0);
        \draw[accent,dashed] (4,2.4) -- (4,0);
        \fill (4,2.4) circle (5pt);
        \node[left] at (0,2) {4}; \node[right] at (10,3) {6}; \node[right] at (4,1.2) {$h$};
        \node[below] at (5,0) {10};
      \end{tikzpicture}
  opgave: |-
    Twee palen van 4~m en 6~m hoog staan 10~m uit elkaar. Je spant een draad van de top van elke paal naar de voet van de andere paal.
  lijst: enumerate
  delen:
    - opgave: |-
        Op welke hoogte $h$ kruisen de draden? Tip: noem de horizontale afstand van de kleine paal tot het kruispunt $x$, en zoek twee paren gelijkvormige driehoeken.
      antwoord: |-
        2,4~m
      uitwerking: |-
        Met de draad naar de voet van de kleine paal: $\tfrac{h}{6} = \tfrac{x}{10}$. Met de andere draad: $\tfrac{h}{4} = \tfrac{10 - x}{10}$. Tel op: $\tfrac{h}{6} + \tfrac{h}{4} = 1$, dus $\tfrac{5h}{12} = 1$ en $h = 2{,}4$.
    - opgave: |-
        Hoe hoog is het kruispunt als de palen 20~m uit elkaar staan? Wat valt je op?
      antwoord: |-
        ook 2,4~m
      uitwerking: |-
        Dezelfde redenering geeft $\tfrac{h}{6} + \tfrac{h}{4} = 1$: de afstand valt weg. De hoogte hangt alleen af van de hoogtes van de palen.

- id: h2-o25
  soort: opdracht
  niveau: 1
  thema: |-
    verhoudingen oplossen
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{x}{4} = \dfrac96$
      antwoord: |-
        6
      uitwerking: |-
        $x = 4 \cdot \tfrac96 = 6$.
    - opgave: |-
        $\dfrac{3}{x} = \dfrac58$
      antwoord: |-
        4,8
      uitwerking: |-
        Kruiselings: $5x = 24$, dus $x = 4{,}8$.
    - opgave: |-
        $\dfrac{12}{15} = \dfrac{x}{10}$
      antwoord: |-
        8
      uitwerking: |-
        $x = 10 \cdot \tfrac{12}{15} = 8$.
    - opgave: |-
        $\dfrac{7}{x} = \dfrac23$
      antwoord: |-
        10,5
      uitwerking: |-
        $2x = 21$, dus $x = 10{,}5$.
    - opgave: |-
        $\dfrac{2{,}5}{x} = \dfrac56$
      antwoord: |-
        3
      uitwerking: |-
        $5x = 15$, dus $x = 3$.
    - opgave: |-
        $\dfrac{x}{1{,}2} = \dfrac53$
      antwoord: |-
        2
      uitwerking: |-
        $x = 1{,}2 \cdot \tfrac53 = 2$.
    - opgave: |-
        $\dfrac{8}{x} = 0{,}4$
      antwoord: |-
        20
      uitwerking: |-
        $0{,}4x = 8$, dus $x = 20$.
    - opgave: |-
        $\dfrac{x + 2}{6} = \dfrac43$
      antwoord: |-
        6
      uitwerking: |-
        $x + 2 = 8$, dus $x = 6$.
    - opgave: |-
        $\dfrac{9}{x} = \dfrac{6}{x - 2}$
      antwoord: |-
        6
      uitwerking: |-
        Kruiselings: $9(x - 2) = 6x$, dus $3x = 18$ en $x = 6$.

- id: h2-o26
  soort: opdracht
  niveau: 1
  thema: |-
    evenwijdige met een zijde (drill)
  opgave: |-
    In driehoek $ABC$ ligt $D$ op $[AB]$ en $E$ op $[AC]$, met $DE \parallel BC$. Bereken de gevraagde lengte.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\lengte{AD} = 3$, $\lengte{AB} = 9$, $\lengte{DE} = 4$; $\lengte{BC}$?
      antwoord: |-
        12
      uitwerking: |-
        $k = \tfrac93 = 3$, dus $\lengte{BC} = 3 \cdot 4 = 12$.
    - opgave: |-
        $\lengte{AD} = 5$, $\lengte{DB} = 5$, $\lengte{BC} = 14$; $\lengte{DE}$?
      antwoord: |-
        7
      uitwerking: |-
        $D$ is het midden van $[AB]$: $k = \tfrac12$, dus $\lengte{DE} = 7$.
    - opgave: |-
        $\lengte{AE} = 2$, $\lengte{AC} = 8$, $\lengte{AB} = 10$; $\lengte{AD}$?
      antwoord: |-
        2,5
      uitwerking: |-
        $k = \tfrac28 = \tfrac14$, dus $\lengte{AD} = \tfrac14 \cdot 10 = 2{,}5$.
    - opgave: |-
        $\lengte{DE} = 6$, $\lengte{BC} = 15$, $\lengte{AB} = 20$; $\lengte{AD}$?
      antwoord: |-
        8
      uitwerking: |-
        $k = \tfrac{6}{15} = 0{,}4$, dus $\lengte{AD} = 0{,}4 \cdot 20 = 8$.
    - opgave: |-
        $\lengte{AD} = 4$, $\lengte{DB} = 2$, $\lengte{AE} = 5$; $\lengte{EC}$?
      antwoord: |-
        2,5
      uitwerking: |-
        $k = \tfrac64 = 1{,}5$, dus $\lengte{AC} = 7{,}5$ en $\lengte{EC} = 7{,}5 - 5 = 2{,}5$.
    - opgave: |-
        $\lengte{AE} = 3{,}6$, $\lengte{EC} = 2{,}4$, $\lengte{DE} = 4{,}5$; $\lengte{BC}$?
      antwoord: |-
        7,5
      uitwerking: |-
        $\lengte{AC} = 6$, $k = \tfrac{6}{3{,}6} = \tfrac53$, dus $\lengte{BC} = \tfrac53 \cdot 4{,}5 = 7{,}5$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    zijden van gelijkvormige driehoeken
  opgave: |-
    $\drieh{PQR} \gv \drieh{XYZ}$ met $\lengte{PQ} = 8$, $\lengte{QR} = 6$, $\lengte{PR} = 10$ en $\lengte{XY} = 12$. Bereken $\lengte{YZ}$ en $\lengte{XZ}$.
  antwoord: |-
    $\lengte{YZ} = 9$, $\lengte{XZ} = 15$
  uitwerking: |-
    $k = \tfrac{12}{8} = 1{,}5$, dus $\lengte{YZ} = 1{,}5 \cdot 6 = 9$ en $\lengte{XZ} = 1{,}5 \cdot 10 = 15$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    kenmerk HH
  opgave: |-
    In driehoek $ABC$ is $\hoek{A} = 55^\circ$ en $\hoek{B} = 45^\circ$. In driehoek $KLM$ is $\hoek{K} = 80^\circ$ en $\hoek{L} = 55^\circ$. Zijn de driehoeken gelijkvormig? Schrijf de gelijkvormigheid dan in de juiste volgorde.
  antwoord: |-
    ja: $\drieh{ABC} \gv \drieh{LMK}$
  uitwerking: |-
    $\hoek{C} = 80^\circ$ en $\hoek{M} = 45^\circ$. Dus $A$ bij $L$, $B$ bij $M$ en $C$ bij $K$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    kenmerk ZZZ
  opgave: |-
    Zijn een driehoek met zijden 6, 9 en 12 en een driehoek met zijden 16, 8 en 12 gelijkvormig? Geef de factor als dat zo is.
  antwoord: |-
    ja, $k = \tfrac43$
  uitwerking: |-
    Rangschik: 8, 12, 16. Dan $\tfrac86 = \tfrac{12}{9} = \tfrac{16}{12} = \tfrac43$.

- id: h2-t4
  soort: test
  niveau: 1
  thema: |-
    kenmerk ZHZ
  opgave: |-
    In driehoek $ABC$ is $\lengte{AB} = 5$, $\lengte{AC} = 8$ en $\hoek{A} = 65^\circ$. In driehoek $DEF$ is $\lengte{DE} = 7{,}5$, $\lengte{DF} = 12$ en $\hoek{D} = 65^\circ$. Zijn de driehoeken gelijkvormig? Met welk kenmerk?
  antwoord: |-
    ja, ZHZ, $k = 1{,}5$
  uitwerking: |-
    $\tfrac{7{,}5}{5} = \tfrac{12}{8} = 1{,}5$, en de gelijke hoek ligt tussen de twee zijden.

- id: h2-t5
  soort: test
  niveau: 2
  thema: |-
    evenwijdige met een zijde
  opgave: |-
    In driehoek $ABC$ ligt $D$ op $[AB]$ en $E$ op $[AC]$, met $DE \parallel BC$. Verder is $\lengte{AD} = 6$, $\lengte{DB} = 4$ en $\lengte{DE} = 9$. Bereken $\lengte{BC}$.
  antwoord: |-
    15
  uitwerking: |-
    $\drieh{ADE} \gv \drieh{ABC}$ (HH). $\lengte{AB} = 10$, dus $k = \tfrac{10}{6}$ en $\lengte{BC} = \tfrac{10}{6} \cdot 9 = 15$.

- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    zandloper
  opgave: |-
    De lijnstukken $[AC]$ en $[BD]$ snijden elkaar in $S$, met $AB \parallel CD$, $\lengte{SA} = 2$, $\lengte{SC} = 5$ en $\lengte{AB} = 3$. Bereken $\lengte{CD}$, en zeg waarom de driehoeken gelijkvormig zijn.
  antwoord: |-
    7,5
  uitwerking: |-
    Overstaande hoeken in $S$ en Z-hoeken in $A$ en $C$: $\drieh{SAB} \gv \drieh{SCD}$ met $k = 2{,}5$. Dus $\lengte{CD} = 2{,}5 \cdot 3 = 7{,}5$.

- id: h2-t7
  soort: test
  niveau: 2
  thema: |-
    hoogte met een schaduw
  opgave: |-
    Een stok van 2~m werpt een schaduw van 1,6~m. Op hetzelfde moment werpt een boom een schaduw van 12~m. Hoe hoog is de boom?
  antwoord: |-
    15~m
  uitwerking: |-
    Evenwijdige zonnestralen: $\tfrac{h}{2} = \tfrac{12}{1{,}6}$, dus $h = 15$.
