# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: enumerate
  delen:
    - opgave: |-
        Een punt $P$ ligt op de middelloodlijn van $[AB]$. Wat weet je over $\lengte{PA}$ en $\lengte{PB}$?
      antwoord: |-
        $\lengte{PA} = \lengte{PB}$
      uitwerking: |-
        De middelloodlijn bestaat uit alle punten die even ver van $A$ als van $B$ liggen.
    - opgave: |-
        Hoe meet je de afstand van een punt tot een rechte?
      antwoord: |-
        loodrecht
      uitwerking: |-
        Het is de lengte van de loodlijn uit het punt op de rechte: de kortste verbinding.
    - opgave: |-
        Een rechthoekige driehoek heeft schuine zijde 10 en een rechthoekszijde 6. Bereken de andere rechthoekszijde.
      antwoord: |-
        8
      uitwerking: |-
        $\sqrt{100 - 36} = \sqrt{64} = 8$.
    - opgave: |-
        Noem drie congruentiekenmerken van driehoeken.
      antwoord: |-
        ZZZ, ZHZ, HZH
      uitwerking: |-
        Bijvoorbeeld ZZZ (drie zijden), ZHZ (twee zijden en de hoek ertussen) en HZH (een zijde en de twee aanliggende hoeken).
    - opgave: |-
        Los op: $(x - 2)^2 + 4^2 = x^2$.
      antwoord: |-
        $x = 5$
      uitwerking: |-
        $x^2 - 4x + 4 + 16 = x^2$, dus $-4x + 20 = 0$ en $x = 5$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Teken een cirkel met middelpunt $M$ en straal 4~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken twee koorden $[AB]$ en $[CD]$ die niet evenwijdig zijn, en construeer hun middelloodlijnen met de passer. Wat valt je op?
      antwoord: |-
        beide gaan door $M$
      uitwerking: |-
        De middelloodlijnen gaan door het middelpunt, en snijden elkaar daar.
    - opgave: |-
        Kies een punt $R$ op de cirkel. Teken de rechte door $R$ die loodrecht staat op $MR$. Hoeveel punten heeft die rechte met de cirkel gemeen?
      antwoord: |-
        één: $R$
      uitwerking: |-
        De rechte raakt de cirkel in $R$: alle andere punten liggen buiten de cirkel.

- id: h2-ml
  soort: kort
  opgave: |-
    Trek een cirkel met een glas of een rol plakband, zodat je het middelpunt niet kent.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek het middelpunt met twee koorden en hun middelloodlijnen. Controleer met de passer.
      antwoord: |-
        het snijpunt van de middelloodlijnen
      uitwerking: |-
        Het middelpunt ligt op de middelloodlijn van elke koorde, dus op het snijpunt van de twee.
    - opgave: |-
        Waarom mogen de twee koorden niet evenwijdig zijn?
      antwoord: |-
        dan vallen de middelloodlijnen samen
      uitwerking: |-
        Twee evenwijdige koorden hebben middelloodlijnen die allebei door $M$ gaan en loodrecht op dezelfde richting staan: dat is één en dezelfde rechte. Ze hebben dan geen snijpunt dat het middelpunt aanwijst.

- id: h2-drie
  soort: kort
  opgave: |-
    De cirkel door drie punten.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken een driehoek met zijden van 6~cm, 5~cm en 4~cm, en construeer de omgeschreven cirkel. Meet de straal.
      antwoord: |-
        ongeveer 3,0~cm
      uitwerking: |-
        Het middelpunt is het snijpunt van de middelloodlijnen; de straal is ongeveer 3,02~cm. De driehoek is scherphoekig, dus het middelpunt ligt binnen de driehoek.
    - opgave: |-
        Waar ligt het middelpunt van de omgeschreven cirkel van een rechthoekige driehoek met rechthoekszijden 5 en 12? Hoe groot is de straal?
      antwoord: |-
        in het midden van de schuine zijde; 6,5
      uitwerking: |-
        De schuine zijde $\sqrt{25 + 144} = 13$ is een middellijn, dus $r = 6{,}5$.
    - opgave: |-
        Gaat er een cirkel door de punten $(1, 1)$, $(3, 3)$ en $(5, 5)$?
      antwoord: |-
        nee
      uitwerking: |-
        De drie punten liggen op een rechte. De middelloodlijnen van $[AB]$ en $[BC]$ zijn dan evenwijdig en snijden elkaar niet.

- id: h2-afstand
  soort: kort
  opgave: |-
    Bereken. De straal is $r$, de koorde $k$ en de afstand van het middelpunt tot de koorde $d$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $d$ als $r = 17$ en $k = 30$
      antwoord: |-
        $d = 8$
      uitwerking: |-
        $d^2 = 289 - 225 = 64$.
    - opgave: |-
        $k$ als $r = 7{,}5$ en $d = 4{,}5$
      antwoord: |-
        $k = 12$
      uitwerking: |-
        $\left(\tfrac{k}{2}\right)^2 = 56{,}25 - 20{,}25 = 36$, dus $\tfrac{k}{2} = 6$.
    - opgave: |-
        $r$ als $k = 10$ en $d = 12$
      antwoord: |-
        $r = 13$
      uitwerking: |-
        $r^2 = 144 + 25 = 169$.

- id: h2-gelijk
  soort: kort
  opgave: |-
    Bereken of leg uit.
  lijst: enumerate
  delen:
    - opgave: |-
        In een cirkel met straal 6~cm zijn de koorden $[AB]$ en $[CD]$ allebei 6~cm lang. Bereken $\hoek{AMB}$ en $\hoek{CMD}$.
      antwoord: |-
        $60^\circ$ en $60^\circ$
      uitwerking: |-
        $\drieh{AMB}$ is gelijkzijdig, dus $\hoek{AMB} = 60^\circ$, en gelijke koorden hebben gelijke middelpuntshoeken.
    - opgave: |-
        De middelpuntshoeken op twee koorden van dezelfde cirkel zijn $72^\circ$. Wat weet je over de koorden?
      antwoord: |-
        ze zijn even lang
      uitwerking: |-
        Gelijke middelpuntshoeken horen bij gelijke koorden (ZHZ).
    - opgave: |-
        In een cirkel met straal 5 liggen twee koorden op afstand 4 van het middelpunt. Bereken hun lengte.
      antwoord: |-
        beide 6
      uitwerking: |-
        $\tfrac{k}{2} = \sqrt{25 - 16} = 3$, dus $k = 6$ voor beide koorden.

- id: h2-ligging
  soort: kort
  opgave: |-
    Een cirkel heeft straal 4. Hoe ligt een rechte op deze afstand van het middelpunt? Bereken bij een snijlijn ook de lengte van de koorde, op 0,01 na.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $d = 2{,}5$
      antwoord: |-
        snijlijn, koorde $\approx 6{,}24$
      uitwerking: |-
        $2{,}5 < 4$. De koorde is $2\sqrt{16 - 6{,}25} = 2\sqrt{9{,}75} \approx 6{,}24$.
    - opgave: |-
        $d = 4$
      antwoord: |-
        raaklijn
      uitwerking: |-
        $d = r$.
    - opgave: |-
        $d = 6$
      antwoord: |-
        buiten de cirkel
      uitwerking: |-
        $d > r$.

- id: h2-raak
  soort: kort
  opgave: |-
    De rechte $PR$ raakt de cirkel met middelpunt $M$ in $R$.
  lijst: enumerate
  delen:
    - opgave: |-
        De straal is 8 en $\lengte{PM} = 17$. Bereken $\lengte{PR}$.
      antwoord: |-
        15
      uitwerking: |-
        $\hoek{MRP} = 90^\circ$, dus $\lengte{PR} = \sqrt{289 - 64} = \sqrt{225} = 15$.
    - opgave: |-
        De straal is 15 en $\lengte{PR} = 20$. Bereken $\lengte{PM}$.
      antwoord: |-
        25
      uitwerking: |-
        $\lengte{PM} = \sqrt{225 + 400} = \sqrt{625} = 25$.
    - opgave: |-
        Teken een cirkel met straal 3~cm, kies een punt $R$ op de cirkel en teken de raaklijn in $R$. Hoe ga je te werk?
      antwoord: |-
        de loodlijn op $MR$ door $R$
      uitwerking: |-
        Trek de straal $[MR]$ en teken met de geodriehoek de loodlijn op $MR$ door $R$.

- id: h2-stukken
  soort: kort
  opgave: |-
    Uit een punt $P$ raken twee raaklijnen een cirkel met middelpunt $M$ in $R$ en $S$.
  lijst: enumerate
  delen:
    - opgave: |-
        $\lengte{PR} = 7$. Hoe lang is $[PS]$?
      antwoord: |-
        7
      uitwerking: |-
        De raaklijnstukken zijn even lang.
    - opgave: |-
        $\hoek{RPS} = 70^\circ$. Bereken $\hoek{RMS}$ en $\hoek{PRS}$.
      antwoord: |-
        $110^\circ$ en $55^\circ$
      uitwerking: |-
        $\hoek{RMS} = 360^\circ - 2 \cdot 90^\circ - 70^\circ = 110^\circ$, en in de gelijkbenige driehoek $PRS$ is $\hoek{PRS} = (180^\circ - 70^\circ) : 2 = 55^\circ$.
    - opgave: |-
        $\hoek{RMS} = 90^\circ$. Wat voor vierhoek is $PRMS$?
      antwoord: |-
        een vierkant
      uitwerking: |-
        Alle hoeken zijn recht ($\hoek{RPS} = 90^\circ$), en $\lengte{MR} = \lengte{MS}$: een rechthoek met twee gelijke aanliggende zijden, dus een vierkant.

- id: h2-rk
  pakketten: [5]
  soort: kort
  opgave: |-
    $t$ is de raaklijn in $A$ aan een cirkel met middelpunt $M$, en $[AB]$ is een koorde. Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        de hoek tussen $t$ en $[AB]$, als $\hoek{AMB} = 70^\circ$
      antwoord: |-
        $35^\circ$
      uitwerking: |-
        De helft van de middelpuntshoek.
    - opgave: |-
        $\hoek{AMB}$, als de hoek tussen $t$ en $[AB]$ gelijk is aan $62^\circ$
      antwoord: |-
        $124^\circ$
      uitwerking: |-
        Het dubbel: $2 \cdot 62^\circ = 124^\circ$.

#========================================================================================
# Opdrachten

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    afstand van het middelpunt tot een koorde
  opgave: |-
    Bereken de afstand van het middelpunt tot een koorde met lengte $k$, in een cirkel met straal $r$. Rond af op 0,01 waar nodig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $r = 5$, $k = 8$
      antwoord: |-
        3
    - opgave: |-
        $r = 10$, $k = 12$
      antwoord: |-
        8
    - opgave: |-
        $r = 6{,}5$, $k = 12$
      antwoord: |-
        2,5
    - opgave: |-
        $r = 7$, $k = 10$
      antwoord: |-
        $2\sqrt6 \approx 4{,}90$
    - opgave: |-
        $r = 4$, $k = 8$
      antwoord: |-
        0
    - opgave: |-
        $r = 9$, $k = 4$
      antwoord: |-
        $\sqrt{77} \approx 8{,}77$
  uitwerking: |-
    Telkens $d = \sqrt{r^2 - \left(\tfrac{k}{2}\right)^2}$. Bij d: $\sqrt{49 - 25} = \sqrt{24} = 2\sqrt6$. Bij e is de koorde een middellijn.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    lengte van een koorde
  opgave: |-
    Bereken de lengte van een koorde op afstand $d$ van het middelpunt, in een cirkel met straal $r$. Rond af op 0,01 waar nodig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $r = 5$, $d = 4$
      antwoord: |-
        6
    - opgave: |-
        $r = 13$, $d = 12$
      antwoord: |-
        10
    - opgave: |-
        $r = 8$, $d = 3$
      antwoord: |-
        $2\sqrt{55} \approx 14{,}83$
    - opgave: |-
        $r = 10$, $d = 0$
      antwoord: |-
        20
    - opgave: |-
        $r = 2{,}5$, $d = 1{,}5$
      antwoord: |-
        4
    - opgave: |-
        $r = 6$, $d = 5$
      antwoord: |-
        $2\sqrt{11} \approx 6{,}63$
  uitwerking: |-
    Telkens $k = 2\sqrt{r^2 - d^2}$. Bij c: $2\sqrt{64 - 9} = 2\sqrt{55}$. Bij d is de koorde een middellijn.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    onderlinge ligging van een rechte en een cirkel
  opgave: |-
    Een cirkel heeft straal $r$ en de rechte ligt op afstand $d$ van het middelpunt. Is de rechte een snijlijn, een raaklijn of een rechte buiten de cirkel?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $r = 6$, $d = 4$
      antwoord: |-
        snijlijn
    - opgave: |-
        $r = 6$, $d = 8{,}5$
      antwoord: |-
        buiten
    - opgave: |-
        $r = 6$, $d = 6$
      antwoord: |-
        raaklijn
    - opgave: |-
        $r = 6$, $d = 0$
      antwoord: |-
        snijlijn door $M$
    - opgave: |-
        $r = 2{,}5$, $d = 2{,}4$
      antwoord: |-
        snijlijn
    - opgave: |-
        $r = 3$, $d = \sqrt{10}$
      antwoord: |-
        buiten
  uitwerking: |-
    Vergelijk $d$ met $r$. Bij f is $\sqrt{10} > \sqrt9 = 3$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    lengte van een raaklijnstuk
  opgave: |-
    De rechte $PR$ raakt een cirkel met middelpunt $M$ en straal $r$ in $R$. Bereken het gevraagde. Rond af op 0,01 waar nodig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\lengte{PR}$ als $\lengte{PM} = 10$, $r = 6$
      antwoord: |-
        8
    - opgave: |-
        $\lengte{PR}$ als $\lengte{PM} = 25$, $r = 7$
      antwoord: |-
        24
    - opgave: |-
        $\lengte{PR}$ als $\lengte{PM} = 9$, $r = 4$
      antwoord: |-
        $\sqrt{65} \approx 8{,}06$
    - opgave: |-
        $\lengte{PM}$ als $\lengte{PR} = 12$, $r = 5$
      antwoord: |-
        13
    - opgave: |-
        $r$ als $\lengte{PR} = 15$, $\lengte{PM} = 17$
      antwoord: |-
        8
    - opgave: |-
        $\lengte{PR}$ als $\lengte{PM} = 2r$
      antwoord: |-
        $r\sqrt3$
  uitwerking: |-
    $\hoek{MRP} = 90^\circ$, dus $\lengte{PM}^2 = r^2 + \lengte{PR}^2$. Bij f: $\lengte{PR}^2 = 4r^2 - r^2 = 3r^2$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    begrippen
  opgave: |-
    Waar of niet waar? Geef een reden of een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        De middelloodlijn van elke koorde gaat door het middelpunt.
      antwoord: |-
        waar
      uitwerking: |-
        Het middelpunt ligt even ver van beide eindpunten.
    - opgave: |-
        Een raaklijn heeft twee punten met de cirkel gemeen.
      antwoord: |-
        niet waar
      uitwerking: |-
        Een raaklijn heeft precies één punt met de cirkel gemeen, het raakpunt.
    - opgave: |-
        Door een punt binnen een cirkel gaat een raaklijn aan de cirkel.
      antwoord: |-
        niet waar
      uitwerking: |-
        Elke rechte door een punt binnen de cirkel is een snijlijn.
    - opgave: |-
        Een koorde die dichter bij het middelpunt ligt, is langer.
      antwoord: |-
        waar
      uitwerking: |-
        $k = 2\sqrt{r^2 - d^2}$ wordt groter als $d$ kleiner wordt.
    - opgave: |-
        Door drie punten gaat altijd een cirkel.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet als de drie punten op een rechte liggen.
    - opgave: |-
        Twee raaklijnen in de eindpunten van een middellijn zijn evenwijdig.
      antwoord: |-
        waar
      uitwerking: |-
        Beide staan loodrecht op de middellijn.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    constructies
  opgave: |-
    Construeer met passer en geodriehoek.
  lijst: enumerate
  delen:
    - opgave: |-
        de cirkel door de hoekpunten van een driehoek met zijden 7~cm, 6~cm en 5~cm
      antwoord: |-
        middelpunt: snijpunt van de middelloodlijnen; $r \approx 3{,}57$~cm
      uitwerking: |-
        Construeer twee middelloodlijnen; hun snijpunt is het middelpunt. De straal is ongeveer 3,57~cm.
    - opgave: |-
        de raaklijnen uit een punt $P$ op 5~cm van het middelpunt van een cirkel met straal 3~cm. Meet de raaklijnstukken en controleer met Pythagoras.
      antwoord: |-
        4~cm
      uitwerking: |-
        Teken de cirkel met middellijn $[MP]$; die snijdt de cirkel in de raakpunten. $\sqrt{25 - 9} = 4$~cm.
    - opgave: |-
        een cirkel met straal 2~cm die een gegeven rechte $a$ raakt in een gegeven punt $R$ van $a$. Hoeveel zijn er?
      antwoord: |-
        twee
      uitwerking: |-
        Het middelpunt ligt op de loodlijn op $a$ in $R$, op 2~cm van $R$: aan elke kant van $a$ één.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    hoeken bij twee raaklijnen
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=1,font=\scriptsize]
        \def\straal{1}
        \cirkel
        \coordinate (M) at (0,0); \coordinate (P) at (1.887,0);
        \coordinate (R) at (58:1); \coordinate (S) at (-58:1);
        \draw[fel!70!black,thick] ($(P)!1.3!(R)$) -- (P) -- ($(P)!1.3!(S)$);
        \draw[grijs] (R) -- (M) -- (S) (R) -- (S) (M) -- (P);
        \fill (R) circle (1.4pt) node[above] {$R$}; \fill (S) circle (1.4pt) node[below] {$S$};
        \fill (P) circle (1.4pt) node[right] {$P$};
        \punt[left]{0}{0}{M}
      \end{tikzpicture}
  opgave: |-
    De rechten $PR$ en $PS$ raken de cirkel met middelpunt $M$ in $R$ en $S$, en $\hoek{RPS} = 64^\circ$. Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\hoek{MRP}$
      antwoord: |-
        $90^\circ$
      uitwerking: |-
        Raaklijn en straal.
    - opgave: |-
        $\hoek{RMS}$
      antwoord: |-
        $116^\circ$
      uitwerking: |-
        $360^\circ - 90^\circ - 90^\circ - 64^\circ = 116^\circ$.
    - opgave: |-
        $\hoek{PRS}$
      antwoord: |-
        $58^\circ$
      uitwerking: |-
        $\drieh{PRS}$ is gelijkbenig: $(180^\circ - 64^\circ) : 2 = 58^\circ$.
    - opgave: |-
        $\hoek{MRS}$
      antwoord: |-
        $32^\circ$
      uitwerking: |-
        $90^\circ - 58^\circ = 32^\circ$. Of: $\drieh{RMS}$ is gelijkbenig, $(180^\circ - 116^\circ) : 2 = 32^\circ$.
    - opgave: |-
        $\hoek{RMP}$
      antwoord: |-
        $58^\circ$
      uitwerking: |-
        $PM$ is de symmetrieas van de vlieger: $116^\circ : 2 = 58^\circ$.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    twee evenwijdige koorden
  opgave: |-
    In een cirkel met straal 10~cm liggen twee evenwijdige koorden van 12~cm en 16~cm. Hoe ver liggen ze van elkaar? Er zijn twee mogelijkheden: maak voor elk een tekening.
  antwoord: |-
    14~cm of 2~cm
  uitwerking: |-
    De koorde van 12~cm ligt op $\sqrt{100 - 36} = 8$~cm van $M$, die van 16~cm op $\sqrt{100 - 64} = 6$~cm. Aan verschillende kanten van $M$: $8 + 6 = 14$~cm. Aan dezelfde kant: $8 - 6 = 2$~cm.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    een boogbrug
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[scale=.1,font=\scriptsize]
        \fill[accent!10] (-24,-3) rectangle (24,0);
        \draw[grijs] (-24,0) -- (24,0);
        \draw[accent,very thick] (-20,0) arc[start angle=133.6,end angle=46.4,radius=29];
        \draw[grijs,<->] (-20,-1.5) -- (20,-1.5) node[midway,below] {40 m};
        \draw[grijs,<->] (0,0) -- (0,8) node[midway,right] {8 m};
      \end{tikzpicture}
  opgave: |-
    De boog van een brug is een stuk van een cirkel. De brug overspant 40~m, en het hoogste punt van de boog ligt 8~m boven de oevers.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de straal van de cirkel.
      antwoord: |-
        29~m
      uitwerking: |-
        De overspanning is een koorde van 40~m. Het middelpunt ligt op haar middelloodlijn, op $r - 8$ onder het midden. Pythagoras: $(r - 8)^2 + 20^2 = r^2$, dus $-16r + 64 + 400 = 0$ en $r = 29$~m.
    - opgave: |-
        Hoe hoog is de boog op 10~m van het midden? Rond af op 0,01~m.
      antwoord: |-
        $\approx 6{,}22$~m
      uitwerking: |-
        Het middelpunt ligt 21~m onder de oevers. Op 10~m van het midden ligt de boog op $\sqrt{29^2 - 10^2} = \sqrt{741} \approx 27{,}22$~m boven het middelpunt, dus $\sqrt{741} - 21 \approx 6{,}22$~m hoog.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    water in een buis
  opgave: |-
    Een ronde buis heeft een binnendiameter van 60~cm. Het wateroppervlak in de buis is 48~cm breed. Hoe diep is het water? Er zijn twee mogelijkheden.
  antwoord: |-
    12~cm of 48~cm
  uitwerking: |-
    Het wateroppervlak is een koorde van 48~cm in een cirkel met straal 30~cm. Ze ligt op $\sqrt{900 - 576} = 18$~cm van het middelpunt. Ligt ze onder het middelpunt, dan is het water $30 - 18 = 12$~cm diep; ligt ze erboven, dan $30 + 18 = 48$~cm.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    hoe ver is de horizon
  opgave: |-
    De aarde is (bijna) een bol met een straal van 6371~km. Je kijkt langs een raaklijn naar de horizon: de kijklijn raakt de aarde in het punt $R$ op de horizon. Rond af op 0,01~km.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe ver is de horizon voor de piloot van een vliegtuig op 10~km hoogte?
      antwoord: |-
        $\approx 357{,}10$~km
      uitwerking: |-
        In de rechthoekige driehoek met het middelpunt van de aarde, het vliegtuig en $R$: $\sqrt{6381^2 - 6371^2} = \sqrt{127\,520} \approx 357{,}10$~km.
    - opgave: |-
        Hoe ver is de horizon vanaf een vuurtoren van 50~m hoog?
      antwoord: |-
        $\approx 25{,}24$~km
      uitwerking: |-
        Reken in km: $\sqrt{6371{,}05^2 - 6371^2} \approx 25{,}24$~km.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    gelijke koorden
  opgave: |-
    In een cirkel met middelpunt $M$ en straal 10~cm teken je allerlei koorden van 12~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe ver ligt elke koorde van $M$?
      antwoord: |-
        8~cm
      uitwerking: |-
        $\sqrt{100 - 36} = 8$~cm, voor elke koorde van 12~cm.
    - opgave: |-
        Waar liggen de middens van al die koorden?
      antwoord: |-
        op een cirkel met middelpunt $M$ en straal 8~cm
      uitwerking: |-
        Het midden van een koorde is het voetpunt van de loodlijn uit $M$, dus ligt het op 8~cm van $M$.
    - opgave: |-
        Hoe groot is de middelpuntshoek op zo'n koorde? Rond af op $0{,}01^\circ$.
      antwoord: |-
        $\approx 73{,}74^\circ$
      uitwerking: |-
        In de rechthoekige driehoek met de halve koorde is $\sin\tfrac{\alpha}{2} = \tfrac{6}{10}$, dus $\tfrac{\alpha}{2} \approx 36{,}87^\circ$ en $\alpha \approx 73{,}74^\circ$. Voor elke koorde van 12~cm hetzelfde.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    de ingeschreven cirkel van een driehoek
  opgave: |-
    Een cirkel raakt de drie zijden van een driehoek $ABC$ met $\lengte{AB} = 7$, $\lengte{BC} = 8$ en $\lengte{CA} = 9$. Hoe ver liggen de raakpunten van de hoekpunten? Tip: noem de raaklijnstukken uit $A$, $B$ en $C$ telkens $x$, $y$ en $z$.
  antwoord: |-
    $x = 4$, $y = 3$, $z = 5$
  uitwerking: |-
    Uit elk hoekpunt zijn de twee raaklijnstukken even lang. Dus $x + y = 7$, $y + z = 8$ en $x + z = 9$. Optellen: $2(x + y + z) = 24$, dus $x + y + z = 12$. Dan is $z = 12 - 7 = 5$, $x = 12 - 8 = 4$ en $y = 12 - 9 = 3$.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    cirkel door drie punten in een assenstelsel
  opgave: |-
    In een assenstelsel is $A(0, 0)$, $B(8, 0)$ en $C(0, 6)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking van de middelloodlijn van $[AB]$ en van $[AC]$.
      antwoord: |-
        $x = 4$ en $y = 3$
      uitwerking: |-
        $[AB]$ ligt op de $x$-as, met midden $(4, 0)$: de middelloodlijn is verticaal. $[AC]$ ligt op de $y$-as, met midden $(0, 3)$.
    - opgave: |-
        Bereken het middelpunt en de straal van de cirkel door $A$, $B$ en $C$.
      antwoord: |-
        $M(4, 3)$, $r = 5$
      uitwerking: |-
        Het snijpunt is $(4, 3)$, en $r = \lengte{MA} = \sqrt{16 + 9} = 5$.
    - opgave: |-
        Waarom ligt $M$ op $[BC]$?
      antwoord: |-
        de hoek in $A$ is recht
      uitwerking: |-
        De driehoek is rechthoekig in $A$, dus $[BC]$ is een middellijn (hoek in een halve cirkel). Inderdaad is $(4, 3)$ het midden van $[BC]$.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijn en middellijn
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.9,font=\scriptsize]
        \cirkel
        \cpunt{A}{180}{A} \cpunt{B}{0}{B} \cpunt{C}{110}{C}
        \draw[fel!70!black,thick] (-1.6,-1.4) -- (-1.6,2.1) node[left] {$t$};
        \draw[accent,thick] (A) -- (B) -- (C) -- cycle;
        \draw[grijs] (0,0) -- (C);
        \punt[below]{0}{0}{M}
      \end{tikzpicture}
  opgave: |-
    $[AB]$ is een middellijn van een cirkel met middelpunt $M$, en $t$ is de raaklijn in $A$. Het punt $C$ ligt op de cirkel, met $\hoek{ABC} = 35^\circ$. Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\hoek{ACB}$
      antwoord: |-
        $90^\circ$
      uitwerking: |-
        Hoek in een halve cirkel.
    - opgave: |-
        $\hoek{BAC}$
      antwoord: |-
        $55^\circ$
      uitwerking: |-
        $90^\circ - 35^\circ = 55^\circ$.
    - opgave: |-
        de hoek tussen $t$ en $[AC]$
      antwoord: |-
        $35^\circ$
      uitwerking: |-
        $t \perp AB$, dus $90^\circ - 55^\circ = 35^\circ$.
    - opgave: |-
        $\hoek{AMC}$
      antwoord: |-
        $70^\circ$
      uitwerking: |-
        De middelpuntshoek op de boog $\boog{AC}$: $2 \cdot 35^\circ$.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    de vlieger van twee raaklijnen
  opgave: |-
    Uit een punt $P$ op 10~cm van het middelpunt $M$ raken twee raaklijnen een cirkel met straal 6~cm in $R$ en $S$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\lengte{PR}$.
      antwoord: |-
        8~cm
      uitwerking: |-
        $\sqrt{100 - 36} = 8$~cm.
    - opgave: |-
        Bereken de oppervlakte van de vierhoek $PRMS$.
      antwoord: |-
        48~cm$^2$
      uitwerking: |-
        Twee rechthoekige driehoeken met rechthoekszijden 6 en 8: $2 \cdot \tfrac{6 \cdot 8}{2} = 48$~cm$^2$.
    - opgave: |-
        Bereken $\lengte{RS}$. Tip: $RS \perp PM$; bereken de oppervlakte van $\drieh{MRP}$ op twee manieren.
      antwoord: |-
        9,6~cm
      uitwerking: |-
        Noem $h$ de afstand van $R$ tot $PM$. Dan is $\tfrac12 \cdot 6 \cdot 8 = \tfrac12 \cdot 10 \cdot h$, dus $h = 4{,}8$. Omdat $PM$ de symmetrieas is, is $\lengte{RS} = 2h = 9{,}6$~cm.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    de ingeschreven cirkel van een rechthoekige driehoek
  opgave: |-
    Een cirkel met straal $r$ raakt de drie zijden van een rechthoekige driehoek met zijden 6, 8 en 10. Bereken $r$. Tip: de raaklijnstukken uit het hoekpunt met de rechte hoek vormen met twee stralen een vierkant.
  antwoord: |-
    $r = 2$
  uitwerking: |-
    De raaklijnstukken uit de rechte hoek zijn $r$. Dan zijn de raaklijnstukken uit de andere hoekpunten $6 - r$ en $8 - r$, en die vormen samen de schuine zijde: $(6 - r) + (8 - r) = 10$, dus $r = 2$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    vierkanten rond en in een cirkel
  opgave: |-
    Een cirkel raakt de vier zijden van een vierkant met zijde 10~cm. In de cirkel teken je een tweede vierkant, met zijn hoekpunten op de cirkel.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe groot is de straal van de cirkel?
      antwoord: |-
        5~cm
      uitwerking: |-
        De stralen naar twee overstaande raakpunten staan loodrecht op twee evenwijdige zijden, en vormen samen een lijnstuk van 10~cm.
    - opgave: |-
        Hoe lang is de zijde van het kleine vierkant? Rond af op 0,01~cm.
      antwoord: |-
        $5\sqrt2 \approx 7{,}07$~cm
      uitwerking: |-
        De diagonaal van het kleine vierkant is een middellijn van 10~cm (hoek in een halve cirkel). Dus $z^2 + z^2 = 100$ en $z = 5\sqrt2 \approx 7{,}07$~cm.
    - opgave: |-
        Hoeveel keer zo groot is de oppervlakte van het grote vierkant?
      antwoord: |-
        twee keer
      uitwerking: |-
        $100 : 50 = 2$.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    een riem over twee wielen
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[scale=.22,font=\scriptsize]
        \coordinate (M) at (0,0); \coordinate (N) at (15,0);
        \draw[accent,thick] (M) circle (5); \draw[accent,thick] (N) circle (2);
        \coordinate (R) at (78.46:5); \coordinate (S) at ($(N)+(78.46:2)$);
        \draw[fel!70!black,thick] (R) -- (S);
        \draw[grijs] (M) -- (R) (N) -- (S) (M) -- (N);
        \fill (M) circle (6pt) node[below] {$M$}; \fill (N) circle (6pt) node[below] {$N$};
        \fill (R) circle (6pt) node[above] {$R$}; \fill (S) circle (6pt) node[above] {$S$};
      \end{tikzpicture}
  opgave: |-
    Een riem loopt over twee wielen met straal 5~cm en 2~cm. De middelpunten $M$ en $N$ liggen 15~cm uit elkaar. Het rechte stuk $[RS]$ van de riem raakt beide wielen. Bereken $\lengte{RS}$, op 0,01~cm. Tip: $MR$ en $NS$ staan allebei loodrecht op $RS$. Trek door $N$ een evenwijdige met $RS$.
  antwoord: |-
    $6\sqrt6 \approx 14{,}70$~cm
  uitwerking: |-
    $MR \parallel NS$, want beide staan loodrecht op $RS$. De evenwijdige met $RS$ door $N$ snijdt $[MR]$ in $T$, met $\lengte{MT} = 5 - 2 = 3$ en $\lengte{TN} = \lengte{RS}$. In de rechthoekige driehoek $MTN$: $\lengte{RS} = \sqrt{15^2 - 3^2} = \sqrt{216} = 6\sqrt6 \approx 14{,}70$~cm.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: gelijke koorden liggen even ver van het middelpunt
  opgave: |-
    Bewijs dat twee even lange koorden van een cirkel even ver van het middelpunt liggen. Bewijs ook het omgekeerde: twee koorden die even ver van het middelpunt liggen, zijn even lang.
  antwoord: |-
    zie uitwerking
  uitwerking: |-
    De loodlijn uit $M$ valt in het midden van een koorde, zodat $d^2 = r^2 - \left(\tfrac{k}{2}\right)^2$. Hebben twee koorden dezelfde lengte $k$, dan geeft dat dezelfde $d$. Omgekeerd: $\left(\tfrac{k}{2}\right)^2 = r^2 - d^2$, dus dezelfde $d$ geeft dezelfde $k$.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: de symmetrieas van twee raaklijnen
  opgave: |-
    Uit een punt $P$ raken twee raaklijnen een cirkel met middelpunt $M$ in $R$ en $S$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat de driehoeken $MRP$ en $MSP$ congruent zijn.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        $\lengte{MR} = \lengte{MS}$ (stralen), $\lengte{PR} = \lengte{PS}$ (raaklijnstukken) en $[MP]$ is gemeenschappelijk: ZZZ.
    - opgave: |-
        Leid af dat $PM$ de bissectrice is van $\hoek{RPS}$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        Uit de congruentie volgt $\hoek{RPM} = \hoek{SPM}$.
    - opgave: |-
        Bewijs dat $PM$ loodrecht staat op $RS$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        $P$ en $M$ liggen allebei even ver van $R$ als van $S$, dus liggen ze op de middelloodlijn van $[RS]$. Dan is $PM$ die middelloodlijn, en staat ze loodrecht op $RS$.

- id: h2-o22
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: een vierhoek met een ingeschreven cirkel
  opgave: |-
    Een cirkel raakt de vier zijden van een vierhoek $ABCD$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat $\lengte{AB} + \lengte{CD} = \lengte{BC} + \lengte{DA}$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        Noem de raaklijnstukken uit $A$, $B$, $C$ en $D$ telkens $a$, $b$, $c$ en $d$. Dan is $\lengte{AB} + \lengte{CD} = (a + b) + (c + d)$ en $\lengte{BC} + \lengte{DA} = (b + c) + (d + a)$: dezelfde som.
    - opgave: |-
        Bereken $\lengte{DA}$ als $\lengte{AB} = 7$, $\lengte{BC} = 9$ en $\lengte{CD} = 6$.
      antwoord: |-
        4
      uitwerking: |-
        $7 + 6 = 9 + \lengte{DA}$, dus $\lengte{DA} = 4$.
    - opgave: |-
        Heeft een rechthoek van 4 bij 6 een ingeschreven cirkel?
      antwoord: |-
        nee
      uitwerking: |-
        $4 + 4 \neq 6 + 6$: de voorwaarde uit a is niet voldaan.

- id: h2-o23
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    hoek tussen raaklijn en koorde
  opgave: |-
    De raaklijnen in de punten $A$ en $B$ van een cirkel met middelpunt $M$ snijden elkaar in $P$, met $\hoek{AMB} = 110^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\hoek{PAB}$ met de hoek tussen een raaklijn en een koorde.
      antwoord: |-
        $55^\circ$
      uitwerking: |-
        $\tfrac12 \cdot 110^\circ = 55^\circ$.
    - opgave: |-
        Bereken $\hoek{APB}$, op twee manieren.
      antwoord: |-
        $70^\circ$
      uitwerking: |-
        Met de gelijkbenige driehoek $PAB$: $180^\circ - 2 \cdot 55^\circ = 70^\circ$. Met de vierhoek $PAMB$: $360^\circ - 90^\circ - 90^\circ - 110^\circ = 70^\circ$.
    - opgave: |-
        Het punt $C$ ligt op de grote boog $\boog{AB}$. Bereken $\hoek{ACB}$ en vergelijk met a.
      antwoord: |-
        $55^\circ$
      uitwerking: |-
        Omtrekshoekstelling: $\tfrac12 \cdot 110^\circ = 55^\circ$, even groot als de hoek tussen de raaklijn en de koorde.

- id: h2-o24
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: twee concentrische cirkels
  opgave: |-
    Twee cirkels hebben hetzelfde middelpunt $M$, met stralen $R$ en $r$ ($R > r$). Een koorde $[AB]$ van de grote cirkel raakt de kleine cirkel in $T$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat $T$ het midden is van $[AB]$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        $MT \perp AB$ (raaklijn en straal van de kleine cirkel). Dus is $[MT]$ de loodlijn uit het middelpunt van de grote cirkel op de koorde, en die valt in het midden van de koorde.
    - opgave: |-
        Bereken $\lengte{AB}$ als $R = 13$ en $r = 5$.
      antwoord: |-
        24
      uitwerking: |-
        $\lengte{AT} = \sqrt{169 - 25} = 12$, dus $\lengte{AB} = 24$.
    - opgave: |-
        Toon aan dat alle koorden van de grote cirkel die de kleine raken, even lang zijn.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        Ze liggen allemaal op afstand $r$ van $M$, dus is hun lengte telkens $2\sqrt{R^2 - r^2}$.

- id: h2-o25
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs uit het ongerijmde: drie punten op een rechte
  opgave: |-
    Bewijs uit het ongerijmde dat er geen cirkel gaat door drie verschillende punten $A$, $B$ en $C$ die op een rechte liggen.
  antwoord: |-
    zie uitwerking
  uitwerking: |-
    Stel dat er een cirkel met middelpunt $M$ door $A$, $B$ en $C$ gaat. Dan ligt $M$ op de middelloodlijn van $[AB]$ en op die van $[BC]$. Beide staan loodrecht op dezelfde rechte $AB$, dus zijn ze evenwijdig. Ze vallen niet samen, want ze gaan door de middens van $[AB]$ en $[BC]$, en die zijn verschillend. Twee evenwijdige rechten die niet samenvallen, hebben geen snijpunt: strijdig met het bestaan van $M$.

#========================================================================================
# Test jezelf

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Een cirkel heeft straal 17~cm. Hoe ver ligt een koorde van 16~cm van het middelpunt?
  antwoord: |-
    15~cm
  uitwerking: |-
    $d = \sqrt{17^2 - 8^2} = \sqrt{225} = 15$~cm.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    In een cirkel met straal 6,5~cm ligt een koorde op 2,5~cm van het middelpunt. Hoe lang is de koorde?
  antwoord: |-
    12~cm
  uitwerking: |-
    $\tfrac{k}{2} = \sqrt{42{,}25 - 6{,}25} = \sqrt{36} = 6$, dus $k = 12$~cm.

- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    Een cirkel heeft straal 4. Hoe ligt een rechte op afstand 3,9, op afstand 4 en op afstand 4,1 van het middelpunt?
  antwoord: |-
    snijlijn, raaklijn, buiten de cirkel
  uitwerking: |-
    $3{,}9 < 4$: snijlijn. $4 = r$: raaklijn. $4{,}1 > 4$: rechte buiten de cirkel.

- id: h2-t4
  soort: test
  niveau: 1
  opgave: |-
    De rechte $PR$ raakt een cirkel met middelpunt $M$ en straal 10 in $R$, en $\lengte{PM} = 26$. Bereken $\lengte{PR}$.
  antwoord: |-
    24
  uitwerking: |-
    $\hoek{MRP} = 90^\circ$, dus $\lengte{PR} = \sqrt{676 - 100} = \sqrt{576} = 24$.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Uit een punt $P$ raken twee raaklijnen een cirkel met middelpunt $M$ in $R$ en $S$, met $\hoek{RMS} = 140^\circ$. Bereken $\hoek{RPS}$ en $\hoek{PRS}$.
  antwoord: |-
    $40^\circ$ en $70^\circ$
  uitwerking: |-
    $\hoek{RPS} = 360^\circ - 2 \cdot 90^\circ - 140^\circ = 40^\circ$. De raaklijnstukken zijn even lang, dus $\hoek{PRS} = (180^\circ - 40^\circ) : 2 = 70^\circ$.

- id: h2-t6
  soort: test
  niveau: 1
  opgave: |-
    Een rechthoekige driehoek heeft rechthoekszijden 10 en 24. Waar ligt het middelpunt van de cirkel door de drie hoekpunten, en hoe groot is de straal?
  antwoord: |-
    in het midden van de schuine zijde; 13
  uitwerking: |-
    De schuine zijde $\sqrt{100 + 576} = 26$ is een middellijn (hoek in een halve cirkel), dus het middelpunt is haar midden en $r = 13$.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    De boog van een stenen brug is een stuk van een cirkel. De brug overspant 24~m, en het hoogste punt van de boog ligt 6~m boven de oevers. Bereken de straal van de cirkel.
  antwoord: |-
    15~m
  uitwerking: |-
    Het middelpunt ligt op de middelloodlijn van de overspanning, op $r - 6$ onder het midden: $(r - 6)^2 + 12^2 = r^2$, dus $-12r + 36 + 144 = 0$ en $r = 15$~m.
