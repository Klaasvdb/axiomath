  opgave: |-
    Een omtrekshoek en een middelpuntshoek staan op dezelfde boog. Bereken de middelpuntshoek als de omtrekshoek gegeven is.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $20^\circ$
      antwoord: |-
        $40^\circ$
    - opgave: |-
        $45^\circ$
      antwoord: |-
        $90^\circ$
    - opgave: |-
        $73^\circ$
      antwoord: |-
        $146^\circ$
    - opgave: |-
        $90^\circ$
      antwoord: |-
        $180^\circ$
    - opgave: |-
        $110^\circ$
      antwoord: |-
        $220^\circ$
    - opgave: |-
        $17{,}5^\circ$
      antwoord: |-
        $35^\circ$
  uitwerking: |-
    Telkens het dubbel. Bij d staat de omtrekshoek op een halve cirkel. Bij e is de middelpuntshoek inspringend.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    middelpuntshoeken: veelhoeken en klok
  opgave: |-
    Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        de middelpuntshoek op een zijde van een regelmatige tienhoek
      antwoord: |-
        $36^\circ$
      uitwerking: |-
        $360^\circ : 10 = 36^\circ$.
    - opgave: |-
        het aantal zijden van een regelmatige veelhoek met een middelpuntshoek van $24^\circ$
      antwoord: |-
        15
      uitwerking: |-
        $360^\circ : 24^\circ = 15$.
    - opgave: |-
        de hoek tussen de wijzers van een klok om 5 uur
      antwoord: |-
        $150^\circ$
      uitwerking: |-
        $5 \cdot 30^\circ = 150^\circ$.
    - opgave: |-
        de hoek die de grote wijzer beschrijft in 35 minuten
      antwoord: |-
        $210^\circ$
      uitwerking: |-
        Per minuut $360^\circ : 60 = 6^\circ$, dus $35 \cdot 6^\circ = 210^\circ$.
    - opgave: |-
        de hoek tussen twee spaken naast elkaar in een wiel met 36 spaken op gelijke afstand
      antwoord: |-
        $10^\circ$
      uitwerking: |-
        $360^\circ : 36 = 10^\circ$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    hoeken aflezen in een figuur
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.95,font=\scriptsize]
        \cirkel
        \cpunt{A}{200}{A} \cpunt{B}{340}{B} \cpunt{C}{90}{C} \cpunt{D}{260}{D}
        \coordinate (M) at (0,0);
        \draw[accent,thick] (A) -- (C) -- (B) -- cycle (A) -- (D) -- (B);
        \draw[grijs] (A) -- (M) -- (B) (M) -- (C);
        \punt[above left]{0}{0}{M}
      \end{tikzpicture}
  opgave: |-
    $M$ is het middelpunt van de cirkel. Verder is $\hoek{ACB} = 70^\circ$ en $\hoek{BMC} = 110^\circ$. Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\hoek{AMB}$
      antwoord: |-
        $140^\circ$
      uitwerking: |-
        $2 \cdot 70^\circ$, op dezelfde boog $\boog{AB}$.
    - opgave: |-
        $\hoek{MAB}$
      antwoord: |-
        $20^\circ$
      uitwerking: |-
        $\drieh{AMB}$ is gelijkbenig: $(180^\circ - 140^\circ) : 2 = 20^\circ$.
    - opgave: |-
        $\hoek{ADB}$
      antwoord: |-
        $110^\circ$
      uitwerking: |-
        $\hoek{ADB}$ staat op de grote boog $\boog{AB}$: $\tfrac12(360^\circ - 140^\circ) = 110^\circ$.
    - opgave: |-
        $\hoek{BAC}$
      antwoord: |-
        $55^\circ$
      uitwerking: |-
        Op dezelfde boog $\boog{BC}$ als de middelpuntshoek van $110^\circ$.
    - opgave: |-
        $\hoek{ABC}$
      antwoord: |-
        $55^\circ$
      uitwerking: |-
        $180^\circ - 70^\circ - 55^\circ = 55^\circ$. De driehoek $ABC$ is dus gelijkbenig.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    hoeken van een koordenvierhoek
  opgave: |-
    $ABCD$ is een koordenvierhoek. Bereken de ontbrekende hoeken.
  lijst: enumerate
  delen:
    - opgave: |-
        $\hoek{A} = 88^\circ$ en $\hoek{B} = 72^\circ$
      antwoord: |-
        $\hoek{C} = 92^\circ$, $\hoek{D} = 108^\circ$
    - opgave: |-
        $\hoek{A} = 121^\circ$ en $\hoek{D} = 95^\circ$
      antwoord: |-
        $\hoek{B} = 85^\circ$, $\hoek{C} = 59^\circ$
    - opgave: |-
        $\hoek{B} = 90^\circ$ en $\hoek{C} = 55^\circ$
      antwoord: |-
        $\hoek{A} = 125^\circ$, $\hoek{D} = 90^\circ$
    - opgave: |-
        $\hoek{C}$ is twee keer zo groot als $\hoek{A}$, en $\hoek{B} = 3 \cdot \hoek{D}$
      antwoord: |-
        $\hoek{A} = 60^\circ$, $\hoek{C} = 120^\circ$, $\hoek{B} = 135^\circ$, $\hoek{D} = 45^\circ$
      uitwerking: |-
        $\hoek{A} + 2\hoek{A} = 180^\circ$ geeft $\hoek{A} = 60^\circ$. En $3\hoek{D} + \hoek{D} = 180^\circ$ geeft $\hoek{D} = 45^\circ$.
  uitwerking: |-
    Telkens: overstaande hoeken samen $180^\circ$. Controle: de vier hoeken samen $360^\circ$.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    hoek in een halve cirkel en Pythagoras
  opgave: |-
    Bereken. Rond af op 0,01 waar nodig.
  lijst: enumerate
  delen:
    - opgave: |-
        $\lengte{BC}$, als driehoek $ABC$ zijn hoekpunten heeft op een cirkel met middellijn $[AB]$, $\lengte{AB} = 26$ en $\lengte{AC} = 10$
      antwoord: |-
        24
      uitwerking: |-
        $\hoek{C} = 90^\circ$, dus $\lengte{BC}^2 = 676 - 100 = 576$ en $\lengte{BC} = 24$.
    - opgave: |-
        de straal van de cirkel door de hoekpunten van een rechthoekige driehoek met rechthoekszijden 7 en 24
      antwoord: |-
        12,5
      uitwerking: |-
        De schuine zijde $\sqrt{49 + 576} = 25$ is een middellijn.
    - opgave: |-
        de straal van de cirkel door de hoekpunten van een rechthoek van 6 bij 8
      antwoord: |-
        5
      uitwerking: |-
        Elke hoek is recht, dus de diagonaal is een middellijn: $\sqrt{36 + 64} = 10$, en $r = 5$.
    - opgave: |-
        de andere rechthoekszijde en de hoeken van een rechthoekige driehoek in een cirkel met straal 5, als één rechthoekszijde 5 is
      antwoord: |-
        $5\sqrt3 \approx 8{,}66$; $30^\circ$, $60^\circ$ en $90^\circ$
      uitwerking: |-
        De schuine zijde is een middellijn: 10. De andere rechthoekszijde is $\sqrt{100 - 25} = \sqrt{75} = 5\sqrt3 \approx 8{,}66$. De hoek tegenover de zijde 5 heeft $\sin\alpha = \tfrac{5}{10} = \tfrac12$, dus $\alpha = 30^\circ$, en de andere scherpe hoek is $60^\circ$.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    lengte van een boog in een context
  opgave: |-
    Bereken op 0,01 na.
  lijst: enumerate
  delen:
    - opgave: |-
        Een fietswiel heeft een diameter van 70~cm. Hoe ver rijdt de fiets als het wiel een kwartslag draait?
      antwoord: |-
        $17{,}5\pi \approx 54{,}98$~cm
      uitwerking: |-
        Een vierde van de omtrek: $\tfrac14 \cdot \pi \cdot 70 = 17{,}5\pi \approx 54{,}98$~cm.
    - opgave: |-
        Een bocht van een atletiekpiste is een halve cirkel met straal 36,5~m. Hoe lang is de bocht?
      antwoord: |-
        $36{,}5\pi \approx 114{,}67$~m
      uitwerking: |-
        De helft van de omtrek: $\tfrac12 \cdot 2\pi \cdot 36{,}5 = 36{,}5\pi \approx 114{,}67$~m.
    - opgave: |-
        Een slinger van 80~cm zwaait heen over een hoek van $50^\circ$. Hoe lang is de boog die het gewicht beschrijft?
      antwoord: |-
        $\approx 69{,}81$~cm
      uitwerking: |-
        $\tfrac{50}{360} \cdot 2\pi \cdot 80 = \tfrac{200\pi}{9} \approx 69{,}81$~cm.
    - opgave: |-
        De punt van een grote wijzer van 8~cm legt 10~cm af. Hoeveel minuten zijn er verstreken?
      antwoord: |-
        ongeveer 11,94 minuten
      uitwerking: |-
        De omtrek is $16\pi \approx 50{,}27$~cm, en die legt de punt af in 60 minuten. Dus $\tfrac{10}{16\pi} \cdot 60 \approx 11{,}94$ minuten. De middelpuntshoek is $\tfrac{10}{16\pi} \cdot 360^\circ \approx 71{,}62^\circ$.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    omtrekshoeken op dezelfde boog bij snijdende koorden
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.95,font=\scriptsize]
        \cirkel
        \cpunt{A}{200}{A} \cpunt{B}{324}{B} \cpunt{C}{54}{C} \cpunt{D}{120}{D}
        \draw[accent,thick] (A) -- (B) -- (C) -- (D) -- cycle (A) -- (C) (B) -- (D);
        \coordinate (S) at (intersection of A--C and B--D);
        \fill (S) circle (1.2pt) node[below=1pt] {$S$};
      \end{tikzpicture}
  opgave: |-
    De koorden $[AC]$ en $[BD]$ snijden elkaar in $S$. Verder is $\hoek{DAC} = 33^\circ$, $\hoek{BAC} = 45^\circ$ en $\hoek{ASB} = 95^\circ$. Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\hoek{DBC}$
      antwoord: |-
        $33^\circ$
      uitwerking: |-
        Op dezelfde boog $\boog{CD}$ als $\hoek{DAC}$.
    - opgave: |-
        $\hoek{BDC}$
      antwoord: |-
        $45^\circ$
      uitwerking: |-
        Op dezelfde boog $\boog{BC}$ als $\hoek{BAC}$.
    - opgave: |-
        $\hoek{ABD}$
      antwoord: |-
        $40^\circ$
      uitwerking: |-
        In $\drieh{ABS}$: $180^\circ - 45^\circ - 95^\circ = 40^\circ$.
    - opgave: |-
        $\hoek{ACD}$
      antwoord: |-
        $40^\circ$
      uitwerking: |-
        Op dezelfde boog $\boog{AD}$ als $\hoek{ABD}$.
    - opgave: |-
        $\hoek{ACB}$
      antwoord: |-
        $62^\circ$
      uitwerking: |-
        In $\drieh{BCS}$ is $\hoek{BSC} = 180^\circ - 95^\circ = 85^\circ$ en $\hoek{SBC} = 33^\circ$, dus $\hoek{ACB} = 180^\circ - 85^\circ - 33^\circ = 62^\circ$.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    een balk uit een ronde stam
  opgave: |-
    Een zagerij zaagt balken met een rechthoekige doorsnede uit ronde boomstammen. De hoekpunten van de rechthoek liggen dan op de cirkel van de stam. Rond af op 0,01~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom is de diagonaal van de rechthoek een middellijn van de cirkel?
      antwoord: |-
        de hoeken van de rechthoek zijn recht
      uitwerking: |-
        Elke hoek van de rechthoek is een omtrekshoek van $90^\circ$. Die staat op een middelpuntshoek van $180^\circ$, dus de diagonaal ertegenover is een middellijn.
    - opgave: |-
        Hoe dik moet een stam minstens zijn voor een balk van 12~cm bij 16~cm?
      antwoord: |-
        20~cm
      uitwerking: |-
        De diameter is de diagonaal: $\sqrt{144 + 256} = 20$~cm.
    - opgave: |-
        Uit een stam met een diameter van 30~cm zaag je een balk van 18~cm breed. Hoe hoog kan die balk zijn?
      antwoord: |-
        24~cm
      uitwerking: |-
        $\sqrt{30^2 - 18^2} = \sqrt{576} = 24$~cm.
    - opgave: |-
        Uit een stam met een diameter van 30~cm zaag je een balk met een vierkante doorsnede. Hoe groot kan de zijde zijn?
      antwoord: |-
        $15\sqrt2 \approx 21{,}21$~cm
      uitwerking: |-
        $z^2 + z^2 = 900$, dus $z^2 = 450$ en $z = 15\sqrt2 \approx 21{,}21$~cm.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    de schiethoek bij voetbal
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.32,font=\scriptsize]
        \fill[accent!8] (-5.5,-8) rectangle (5.5,0);
        \draw[grijs] (-5.5,0) -- (5.5,0);
        \draw[grijs,very thick] (-1.83,0) coordinate (A) -- (1.83,0) coordinate (B);
        \draw[accent,dashed] (A) arc[start angle=118,end angle=422,radius=3.898];
        \coordinate (P) at (-3.663,-4.775); \coordinate (Q) at (2.986,-5.948); \coordinate (R) at (.5,-3);
        \draw[grijs] (A) -- (P) -- (B) (A) -- (Q) -- (B);
        \fill (P) circle (5pt) node[below left] {$P$};
        \fill (Q) circle (5pt) node[below right] {$Q$};
        \fill (R) circle (5pt) node[below] {$R$};
        \node[above] at (0,0) {doel};
      \end{tikzpicture}
  opgave: |-
    Hoe groter de hoek waaronder een speler het doel ziet, hoe groter zijn kans om te scoren. De spelers $P$ en $Q$ staan op een cirkel door de twee doelpalen. Speler $P$ ziet het doel onder een hoek van $28^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        Onder welke hoek ziet speler $Q$ het doel? Waarom?
      antwoord: |-
        $28^\circ$
      uitwerking: |-
        Beide hoeken zijn omtrekshoeken op dezelfde boog, tussen de doelpalen.
    - opgave: |-
        Speler $R$ staat binnen de cirkel. Ziet hij het doel onder een grotere of een kleinere hoek? Ga na met een tekening.
      antwoord: |-
        onder een grotere hoek
      uitwerking: |-
        Binnen de cirkel is de hoek groter, buiten kleiner. Teken bijvoorbeeld de rechte van een doelpaal door $R$ tot ze de cirkel snijdt, en vergelijk met de omtrekshoek daar.
    - opgave: |-
        Hoe groot is de middelpuntshoek van de cirkel op de boog tussen de doelpalen?
      antwoord: |-
        $56^\circ$
      uitwerking: |-
        $2 \cdot 28^\circ = 56^\circ$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    middelpunt buiten de driehoek
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.95,font=\scriptsize]
        \cirkel
        \cpunt{A}{200}{A} \cpunt{B}{276}{B} \cpunt{C}{336}{C}
        \coordinate (M) at (0,0);
        \draw[accent,thick] (A) -- (B) -- (C) -- cycle;
        \draw[grijs] (A) -- (M) -- (B) (M) -- (C);
        \punt[above]{0}{0}{M}
      \end{tikzpicture}
  opgave: |-
    De driehoek $ABC$ heeft zijn hoekpunten op een cirkel met middelpunt $M$, met $\hoek{ACB} = 38^\circ$ en $\hoek{ABC} = 112^\circ$. Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        $\hoek{BAC}$
      antwoord: |-
        $30^\circ$
      uitwerking: |-
        $180^\circ - 38^\circ - 112^\circ = 30^\circ$.
    - opgave: |-
        $\hoek{AMB}$
      antwoord: |-
        $76^\circ$
      uitwerking: |-
        $2 \cdot 38^\circ$: beide staan op de boog $\boog{AB}$ waar $C$ niet op ligt.
    - opgave: |-
        $\hoek{BMC}$. Wat voor driehoek is $BMC$?
      antwoord: |-
        $60^\circ$; gelijkzijdig
      uitwerking: |-
        $\hoek{BMC} = 2 \cdot 30^\circ = 60^\circ$. De driehoek is gelijkbenig met een tophoek van $60^\circ$, dus ook de basishoeken zijn $60^\circ$: gelijkzijdig.
    - opgave: |-
        $\hoek{AMC}$, op twee manieren
      antwoord: |-
        $136^\circ$
      uitwerking: |-
        Als som: $76^\circ + 60^\circ = 136^\circ$. Met de stompe omtrekshoek $\hoek{ABC}$: die staat op de grote boog $\boog{AC}$, met middelpuntshoek $2 \cdot 112^\circ = 224^\circ$, en $360^\circ - 224^\circ = 136^\circ$.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    hoeken in een regelmatige zeshoek
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.85,font=\scriptsize]
        \cirkel
        \foreach \h/\n in {210/A,270/B,330/C,30/D,90/E,150/F} {\cpunt{\n}{\h}{\n}}
        \draw[accent,thick] (A) -- (B) -- (C) -- (D) -- (E) -- (F) -- cycle;
        \draw[grijs] (A) -- (C) -- (E) -- cycle (A) -- (D);
      \end{tikzpicture}
  opgave: |-
    $ABCDEF$ is een regelmatige zeshoek met zijn hoekpunten op een cirkel. Bereken zonder te meten.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\hoek{ACD}$
      antwoord: |-
        $90^\circ$
      uitwerking: |-
        $[AD]$ is een middellijn: de middelpuntshoek op $\boog{AD}$ is $3 \cdot 60^\circ = 180^\circ$.
    - opgave: |-
        $\hoek{CAD}$
      antwoord: |-
        $30^\circ$
      uitwerking: |-
        Op de boog $\boog{CD}$ met middelpuntshoek $60^\circ$.
    - opgave: |-
        $\hoek{ACE}$
      antwoord: |-
        $60^\circ$
      uitwerking: |-
        Op de boog $\boog{AFE}$ met middelpuntshoek $120^\circ$. De driehoek $ACE$ is gelijkzijdig.
    - opgave: |-
        $\hoek{ABC}$
      antwoord: |-
        $120^\circ$
      uitwerking: |-
        Op de boog $\boog{CDEFA}$ met middelpuntshoek $4 \cdot 60^\circ = 240^\circ$.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    buitenhoek van een koordenvierhoek
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.85,font=\scriptsize]
        \cirkel
        \cpunt{A}{210}{A} \cpunt{B}{300}{B} \cpunt{C}{20}{C} \cpunt{D}{110}{D}
        \draw[accent,thick] (A) -- (B) -- (C) -- (D) -- cycle;
        \draw[grijs] (C) -- ($(C)!-.6!(B)$) coordinate (E);
        \node[above] at (E) {$E$};
        \hoekboog{E}{C}{D}{3mm}
        \hoekboog{B}{A}{D}{4mm}
      \end{tikzpicture}
  opgave: |-
    $ABCD$ is een koordenvierhoek. Het punt $E$ ligt op het verlengde van $[BC]$, voorbij $C$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\hoek{DCE} = \hoek{A}$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        $\hoek{DCE} = 180^\circ - \hoek{BCD}$ (gestrekte hoek) en $\hoek{A} = 180^\circ - \hoek{BCD}$ (koordenvierhoek). Dus $\hoek{DCE} = \hoek{A}$.
    - opgave: |-
        Bereken $\hoek{DCE}$ als $\hoek{A} = 78^\circ$.
      antwoord: |-
        $78^\circ$
      uitwerking: |-
        Volgens a is $\hoek{DCE} = \hoek{A} = 78^\circ$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    vanwaar zie je een lijnstuk onder een gegeven hoek
  opgave: |-
    Een gevel is 8~m breed. Bereken telkens waar het middelpunt $M$ van de cirkel ligt en hoe groot de straal is, en hoe ver je van de gevel staat als je er recht voor staat. Rond af op 0,01~m.
  lijst: enumerate
  delen:
    - opgave: |-
        Je wilt de gevel zien onder een hoek van $30^\circ$.
      antwoord: |-
        $M$ ligt $4\sqrt3 \approx 6{,}93$~m voor de gevel, $r = 8$~m; afstand $8 + 4\sqrt3 \approx 14{,}93$~m
      uitwerking: |-
        De middelpuntshoek is $60^\circ$, dus $\drieh{AMB}$ is gelijkzijdig en $r = 8$~m. De afstand van $M$ tot de gevel is de hoogte van die driehoek: $\sqrt{64 - 16} = 4\sqrt3 \approx 6{,}93$~m. Recht voor het midden sta je op $4\sqrt3 + 8 \approx 14{,}93$~m.
    - opgave: |-
        Je wilt de gevel zien onder een hoek van $120^\circ$.
      antwoord: |-
        $M$ ligt $\tfrac{4\sqrt3}{3} \approx 2{,}31$~m achter de gevel, $r = \tfrac{8\sqrt3}{3} \approx 4{,}62$~m; afstand $\approx 2{,}31$~m
      uitwerking: |-
        Een stompe omtrekshoek van $120^\circ$ staat op een middelpuntshoek van $240^\circ$. Je staat dus op de kleine boog, en $M$ ligt aan de andere kant van de gevel, met $\hoek{AMB} = 120^\circ$. In $\drieh{AMN}$ (met $N$ het midden van de gevel) is $\lengte{AN} = 4$ en $\hoek{MAN} = 30^\circ$: $\lengte{MN} = 4 \tan 30^\circ = \tfrac{4\sqrt3}{3} \approx 2{,}31$~m en $r = 2\,\lengte{MN} = \tfrac{8\sqrt3}{3} \approx 4{,}62$~m. Recht voor het midden sta je op $r - \lengte{MN} \approx 2{,}31$~m.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    construeren met de hoek in een halve cirkel
  opgave: |-
    Teken met passer en geodriehoek.
  lijst: enumerate
  delen:
    - opgave: |-
        Een rechthoekige driehoek $ABC$ met schuine zijde $\lengte{AB} = 7$~cm en $\lengte{AC} = 4$~cm, zonder een rechte hoek te meten. Leg uit hoe je te werk gaat.
      antwoord: |-
        $C$ is een snijpunt van de cirkel met middellijn $[AB]$ en de cirkel met middelpunt $A$ en straal 4~cm
      uitwerking: |-
        Teken $[AB]$ en het midden $M$, en de cirkel met middelpunt $M$ door $A$ en $B$. Snijd die met een cirkel met middelpunt $A$ en straal 4~cm. Het snijpunt $C$ geeft $\hoek{ACB} = 90^\circ$ (hoek in een halve cirkel).
    - opgave: |-
        Alle punten $P$ waarvoor $\hoek{APB} = 90^\circ$, als $\lengte{AB} = 5$~cm.
      antwoord: |-
        de cirkel met middellijn $[AB]$, zonder $A$ en $B$
      uitwerking: |-
        Elk punt van die cirkel (behalve $A$ en $B$) geeft een rechte hoek. Binnen de cirkel is de hoek groter, buiten kleiner.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    hoeken in een sterveelhoek
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.85,font=\scriptsize]
        \cirkel
        \foreach \h/\n in {90/A,162/B,234/C,306/D,18/E} {\cpunt{\n}{\h}{\n}}
        \draw[grijs] (A) -- (B) -- (C) -- (D) -- (E) -- cycle;
        \draw[accent,thick] (A) -- (C) -- (E) -- (B) -- (D) -- cycle;
      \end{tikzpicture}
  opgave: |-
    De vijf punten $A$, $B$, $C$, $D$ en $E$ verdelen een cirkel in vijf gelijke bogen. Verbind je elk punt met de twee punten die er niet naast liggen, dan krijg je een ster. Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        de middelpuntshoek op elke boog
      antwoord: |-
        $72^\circ$
      uitwerking: |-
        $360^\circ : 5 = 72^\circ$.
    - opgave: |-
        de hoek in een punt van de ster, zoals $\hoek{CAD}$
      antwoord: |-
        $36^\circ$
      uitwerking: |-
        $\hoek{CAD}$ staat op de boog $\boog{CD}$: $\tfrac12 \cdot 72^\circ = 36^\circ$.
    - opgave: |-
        de hoek $\hoek{BAE}$ van de regelmatige vijfhoek
      antwoord: |-
        $108^\circ$
      uitwerking: |-
        $\hoek{BAE}$ staat op de boog $\boog{BCDE}$ van drie gelijke stukken: $\tfrac12 \cdot 216^\circ = 108^\circ$.
    - opgave: |-
        de som van de vijf hoeken in de punten van de ster
      antwoord: |-
        $180^\circ$
      uitwerking: |-
        $5 \cdot 36^\circ = 180^\circ$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    hoeken bij een middellijn
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.95,font=\scriptsize]
        \cirkel
        \cpunt{A}{180}{A} \cpunt{B}{0}{B} \cpunt{C}{130}{C} \cpunt{D}{250}{D}
        \draw[accent,thick] (A) -- (B) (A) -- (C) -- (B) (A) -- (D) -- (C) (D) -- (B);
        \punt[above right]{0}{0}{M}
      \end{tikzpicture}
  opgave: |-
    $[AB]$ is een middellijn van een cirkel met middelpunt $M$. De punten $C$ en $D$ liggen op de cirkel, aan verschillende kanten van $[AB]$, met $\hoek{CAB} = 25^\circ$ en $\hoek{ABD} = 35^\circ$. Bereken.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\hoek{ABC}$
      antwoord: |-
        $65^\circ$
      uitwerking: |-
        $\hoek{ACB} = 90^\circ$, dus $\hoek{ABC} = 90^\circ - 25^\circ = 65^\circ$.
    - opgave: |-
        $\hoek{ADC}$
      antwoord: |-
        $65^\circ$
      uitwerking: |-
        Op dezelfde boog $\boog{AC}$ als $\hoek{ABC}$.
    - opgave: |-
        $\hoek{BDC}$
      antwoord: |-
        $25^\circ$
      uitwerking: |-
        Op dezelfde boog $\boog{BC}$ als $\hoek{BAC}$.
    - opgave: |-
        $\hoek{CBD}$
      antwoord: |-
        $100^\circ$
      uitwerking: |-
        $65^\circ + 35^\circ = 100^\circ$. Controle met de koordenvierhoek $ADBC$: $\hoek{CAD} = 25^\circ + 55^\circ = 80^\circ$, en $80^\circ + 100^\circ = 180^\circ$.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    welke vierhoeken zijn een koordenvierhoek
  opgave: |-
    Is de vierhoek altijd, soms of nooit een koordenvierhoek? Leg uit.
  lijst: enumerate
  delen:
    - opgave: |-
        een ruit
      antwoord: |-
        soms: alleen een vierkant
      uitwerking: |-
        Een ruit is een parallellogram, en dat is alleen een koordenvierhoek als het een rechthoek is. Een ruit die een rechthoek is, is een vierkant.
    - opgave: |-
        een gelijkbenig trapezium
      antwoord: |-
        altijd
      uitwerking: |-
        Met $AB \parallel CD$ en $\hoek{A} = \hoek{B}$ is $\hoek{A} + \hoek{D} = 180^\circ$, dus ook $\hoek{B} + \hoek{D} = 180^\circ$. Dat het echt een koordenvierhoek is, zie je zo: de symmetrieas is de middelloodlijn van beide evenwijdige zijden, en haar snijpunt met de middelloodlijn van $[AD]$ ligt even ver van de vier hoekpunten.
    - opgave: |-
        een trapezium met twee rechte hoeken, dat geen rechthoek is
      antwoord: |-
        nooit
      uitwerking: |-
        De hoeken zijn $90^\circ$, $90^\circ$, $\alpha$ en $180^\circ - \alpha$, met de twee rechte hoeken naast elkaar. Dan is de som van twee overstaande hoeken $90^\circ + \alpha$, en die is alleen $180^\circ$ als $\alpha = 90^\circ$: een rechthoek.
    - opgave: |-
        een vlieger
      antwoord: |-
        soms: als de twee gelijke hoeken recht zijn
      uitwerking: |-
        De twee hoeken naast de symmetrieas zijn gelijk en overstaand. Ze zijn samen $180^\circ$ als ze allebei $90^\circ$ zijn.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    hoek tussen twee koorden die elkaar binnen de cirkel snijden
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.95,font=\scriptsize]
        \cirkel
        \cpunt{A}{190}{A} \cpunt{B}{290}{B} \cpunt{C}{20}{C} \cpunt{D}{80}{D}
        \draw[accent,thick] (A) -- (C) (B) -- (D);
        \draw[grijs] (A) -- (B);
        \coordinate (S) at (intersection of A--C and B--D);
        \fill (S) circle (1.2pt) node[above left=-1pt] {$S$};
        \hoekboog{A}{S}{B}{2.5mm}
      \end{tikzpicture}
  opgave: |-
    De koorden $[AC]$ en $[BD]$ snijden elkaar in $S$, binnen de cirkel met middelpunt $M$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\hoek{ASB} = \tfrac12(\hoek{AMB} + \hoek{CMD})$, met de middelpuntshoeken op $\boog{AB}$ en $\boog{CD}$. Tip: kijk naar de hoeken van $\drieh{ABS}$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        In $\drieh{ABS}$ is $\hoek{ASB} = 180^\circ - \hoek{BAC} - \hoek{ABD} = 180^\circ - \tfrac12\hoek{BMC} - \tfrac12\hoek{AMD}$. De vier middelpuntshoeken op $\boog{AB}$, $\boog{BC}$, $\boog{CD}$ en $\boog{DA}$ zijn samen $360^\circ$, dus $180^\circ = \tfrac12(\hoek{AMB} + \hoek{BMC} + \hoek{CMD} + \hoek{DMA})$. Invullen geeft $\hoek{ASB} = \tfrac12(\hoek{AMB} + \hoek{CMD})$.
    - opgave: |-
        Bereken $\hoek{ASB}$ als $\hoek{AMB} = 100^\circ$ en $\hoek{CMD} = 60^\circ$.
      antwoord: |-
        $80^\circ$
      uitwerking: |-
        $\tfrac12(100^\circ + 60^\circ) = 80^\circ$.
    - opgave: |-
        Wat zegt de formule als $S$ het middelpunt is?
      antwoord: |-
        $\hoek{ASB} = \hoek{AMB}$
      uitwerking: |-
        Dan zijn $\hoek{AMB}$ en $\hoek{CMD}$ overstaande hoeken, dus gelijk, en de formule geeft $\hoek{ASB} = \hoek{AMB}$, zoals het hoort.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    hoek tussen twee rechten die elkaar buiten de cirkel snijden
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[scale=.62,font=\scriptsize]
        \cirkel
        \cpunt{A}{135}{A} \cpunt{B}{-135}{B} \cpunt{C}{-20}{C} \cpunt{D}{20}{D}
        \coordinate (P) at (intersection of A--D and B--C);
        \draw[accent,thick] (A) -- (P) -- (B);
        \draw[grijs] (A) -- (C);
        \fill (P) circle (1.4pt) node[right] {$P$};
      \end{tikzpicture}
  opgave: |-
    Twee rechten door een punt $P$ buiten de cirkel snijden de cirkel in $A$ en $D$, en in $B$ en $C$, zoals in de figuur.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\hoek{APB} = \tfrac12(\hoek{AMB} - \hoek{DMC})$, met de middelpuntshoeken op de bogen $\boog{AB}$ en $\boog{DC}$ die binnen de hoek in $P$ liggen. Tip: $\hoek{ACB}$ is een hoek naast een hoek van $\drieh{ACP}$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        In $\drieh{ACP}$ is $\hoek{ACP} = 180^\circ - \hoek{ACB}$, dus $\hoek{APC} = 180^\circ - \hoek{CAP} - \hoek{ACP} = \hoek{ACB} - \hoek{CAD}$. Met de omtrekshoekstelling: $\hoek{ACB} = \tfrac12\hoek{AMB}$ en $\hoek{CAD} = \tfrac12\hoek{DMC}$.
    - opgave: |-
        Bereken $\hoek{APB}$ als $\hoek{AMB} = 110^\circ$ en $\hoek{DMC} = 30^\circ$.
      antwoord: |-
        $40^\circ$
      uitwerking: |-
        $\tfrac12(110^\circ - 30^\circ) = 40^\circ$.
    - opgave: |-
        Vergelijk met opdracht \ref{oef:h1-o20}. Waarom is de hoek nu kleiner dan de omtrekshoek op $\boog{AB}$?
      antwoord: |-
        er gaat iets af in plaats van bij
      uitwerking: |-
        Binnen de cirkel komt de helft van de overstaande boog erbij, buiten gaat ze eraf. Een punt buiten de cirkel ziet $[AB]$ dus onder een kleinere hoek dan een punt op de cirkel.

- id: h1-o22
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: binnen de cirkel is de hoek groter
  opgave: |-
    De punten $A$, $B$ en $C$ liggen op een cirkel. Het punt $P$ ligt binnen de cirkel, aan dezelfde kant van $AB$ als $C$. Bewijs dat $\hoek{APB} > \hoek{ACB}$. Tip: verleng $[AP]$ tot het de cirkel snijdt in $Q$, en kijk naar de driehoek $PQB$.
  antwoord: |-
    zie uitwerking
  uitwerking: |-
    $\hoek{AQB} = \hoek{ACB}$, want ze staan op dezelfde boog. De hoek $\hoek{APB}$ ligt naast $\hoek{BPQ}$ van $\drieh{PQB}$, dus $\hoek{APB} = 180^\circ - \hoek{BPQ} = \hoek{PQB} + \hoek{PBQ}$. Omdat $\hoek{PBQ} > 0^\circ$, is $\hoek{APB} > \hoek{PQB} = \hoek{ACB}$. Zo is het probleem van de fotograaf volledig: binnen de cirkel is de hoek groter dan $60^\circ$. Op dezelfde manier toon je aan dat hij buiten de cirkel kleiner is.

- id: h1-o23
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: de bissectrice van een omtrekshoek
  opgave: |-
    De punten $A$, $B$ en $C$ liggen op een cirkel. De bissectrice van $\hoek{ACB}$ snijdt de cirkel nog in $D$. Bewijs dat $D$ het midden is van de boog $\boog{AB}$ waar $C$ niet op ligt, dus dat $\lengte{DA} = \lengte{DB}$.
  antwoord: |-
    zie uitwerking
  uitwerking: |-
    $\hoek{ACD} = \hoek{DCB}$, en dat zijn omtrekshoeken op $\boog{AD}$ en $\boog{DB}$. Dus zijn de middelpuntshoeken $\hoek{AMD}$ en $\hoek{DMB}$ gelijk. De driehoeken $AMD$ en $DMB$ hebben dan twee gelijke zijden (stralen) met een gelijke hoek ertussen, en zijn congruent (ZHZ). Dus $\lengte{DA} = \lengte{DB}$.

- id: h1-o24
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: de zwaartelijn op de schuine zijde
  opgave: |-
    Driehoek $ABC$ is rechthoekig in $C$, en $M$ is het midden van $[AB]$. Bewijs dat $\lengte{MC} = \tfrac12\,\lengte{AB}$: de zwaartelijn op de schuine zijde is half zo lang als de schuine zijde. Bereken daarna $\lengte{MC}$ als de rechthoekszijden 8 en 15 zijn.
  antwoord: |-
    $\lengte{MC} = 8{,}5$
  uitwerking: |-
    Omdat $\hoek{ACB} = 90^\circ$, ligt $C$ op de cirkel met middellijn $[AB]$ (omgekeerde stelling). Die cirkel heeft middelpunt $M$, dus $\lengte{MC}$ is een straal: $\lengte{MC} = \lengte{MA} = \tfrac12\,\lengte{AB}$. Met rechthoekszijden 8 en 15 is $\lengte{AB} = \sqrt{64 + 225} = 17$, dus $\lengte{MC} = 8{,}5$.

- id: h1-o25
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: twee snijdende koorden
  opgave: |-
    De koorden $[AC]$ en $[BD]$ snijden elkaar in $S$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat $\drieh{SAB} \gv \drieh{SDC}$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        $\hoek{BAC} = \hoek{BDC}$ (omtrekshoeken op $\boog{BC}$) en $\hoek{ASB} = \hoek{DSC}$ (overstaande hoeken). Kenmerk HH.
    - opgave: |-
        Leid af dat $\lengte{SA} \cdot \lengte{SC} = \lengte{SB} \cdot \lengte{SD}$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        Uit a: $\tfrac{\lengte{SA}}{\lengte{SD}} = \tfrac{\lengte{SB}}{\lengte{SC}}$, en kruiselings vermenigvuldigen geeft $\lengte{SA} \cdot \lengte{SC} = \lengte{SB} \cdot \lengte{SD}$.
    - opgave: |-
        Bereken $\lengte{SD}$ als $\lengte{SA} = 4$, $\lengte{SC} = 6$ en $\lengte{SB} = 3$.
      antwoord: |-
        8
      uitwerking: |-
        $3 \cdot \lengte{SD} = 24$, dus $\lengte{SD} = 8$.

#========================================================================================
# Test jezelf

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Een regelmatige achthoek heeft zijn hoekpunten op een cirkel met middelpunt $M$. Bereken de middelpuntshoek op een zijde $[AB]$ en de hoeken van de driehoek $AMB$.
  antwoord: |-
    $45^\circ$; $45^\circ$, $67{,}5^\circ$ en $67{,}5^\circ$
  uitwerking: |-
    $\hoek{AMB} = 360^\circ : 8 = 45^\circ$. De driehoek $AMB$ is gelijkbenig: $(180^\circ - 45^\circ) : 2 = 67{,}5^\circ$.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Hoe lang is de boog bij een middelpuntshoek van $140^\circ$ in een cirkel met straal 9~cm? Rond af op 0,01~cm.
  antwoord: |-
    $7\pi \approx 21{,}99$~cm
  uitwerking: |-
    $\tfrac{140}{360} \cdot 2\pi \cdot 9 = 7\pi \approx 21{,}99$~cm.

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Op een cirkel met middelpunt $M$ is $\hoek{AMB} = 118^\circ$. Het punt $C$ ligt op de grote boog $\boog{AB}$, het punt $D$ op de kleine boog. Bereken $\hoek{ACB}$, $\hoek{ADB}$ en $\hoek{MAB}$.
  antwoord: |-
    $59^\circ$, $121^\circ$ en $31^\circ$
  uitwerking: |-
    $\hoek{ACB} = \tfrac12 \cdot 118^\circ = 59^\circ$. $\hoek{ADB}$ staat op de grote boog: $\tfrac12(360^\circ - 118^\circ) = 121^\circ$. In de gelijkbenige driehoek $AMB$: $\hoek{MAB} = (180^\circ - 118^\circ) : 2 = 31^\circ$.

- id: h1-t4
  soort: test
  niveau: 2
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.85,font=\scriptsize]
        \cirkel
        \cpunt{A}{200}{A} \cpunt{B}{300}{B} \cpunt{C}{12}{C} \cpunt{D}{96}{D}
        \draw[accent,thick] (A) -- (B) -- (C) -- (D) -- cycle (A) -- (C) (B) -- (D);
        \coordinate (S) at (intersection of A--C and B--D);
        \fill (S) circle (1.2pt) node[below=1pt] {$S$};
      \end{tikzpicture}
  opgave: |-
    De koorden $[AC]$ en $[BD]$ snijden elkaar in $S$, met $\hoek{BDC} = 36^\circ$ en $\hoek{ACD} = 52^\circ$. Bereken $\hoek{BAC}$, $\hoek{ABD}$ en $\hoek{ASB}$.
  antwoord: |-
    $36^\circ$, $52^\circ$ en $92^\circ$
  uitwerking: |-
    $\hoek{BAC} = \hoek{BDC} = 36^\circ$ (op $\boog{BC}$), $\hoek{ABD} = \hoek{ACD} = 52^\circ$ (op $\boog{AD}$), en $\hoek{ASB} = 180^\circ - 36^\circ - 52^\circ = 92^\circ$.

- id: h1-t5
  soort: test
  niveau: 1
  opgave: |-
    Driehoek $ABC$ heeft zijn hoekpunten op een cirkel met middellijn $[AB]$, met $\lengte{AB} = 17$ en $\lengte{AC} = 8$. Bereken $\hoek{ACB}$ en $\lengte{BC}$.
  antwoord: |-
    $90^\circ$ en 15
  uitwerking: |-
    Hoek in een halve cirkel: $\hoek{ACB} = 90^\circ$. Pythagoras: $\lengte{BC} = \sqrt{289 - 64} = \sqrt{225} = 15$.

- id: h1-t6
  soort: test
  niveau: 1
  opgave: |-
    $ABCD$ is een koordenvierhoek met $\hoek{A} = 2 \cdot \hoek{C}$ en $\hoek{B} = 85^\circ$. Bereken de andere hoeken.
  antwoord: |-
    $\hoek{A} = 120^\circ$, $\hoek{C} = 60^\circ$, $\hoek{D} = 95^\circ$
  uitwerking: |-
    $2\hoek{C} + \hoek{C} = 180^\circ$, dus $\hoek{C} = 60^\circ$ en $\hoek{A} = 120^\circ$. $\hoek{D} = 180^\circ - 85^\circ = 95^\circ$.

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Een fotograaf wil een gevel van 9~m breed precies op de foto, met een lens met een beeldhoek van $60^\circ$. Hoe ver van de gevel staat hij, als hij recht voor het midden staat? Rond af op 0,01~m.
  antwoord: |-
    $\tfrac{9\sqrt3}{2} \approx 7{,}79$~m
  uitwerking: |-
    Recht voor het midden is de driehoek die de fotograaf met de uiteinden van de gevel vormt gelijkbenig met een tophoek van $60^\circ$, dus gelijkzijdig met zijde 9~m. De afstand is de hoogte: $\sqrt{81 - 20{,}25} = \tfrac{9\sqrt3}{2} \approx 7{,}79$~m.
