# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        de basishoeken van een gelijkbenige driehoek met een tophoek van $50^\circ$
      antwoord: |-
        $65^\circ$ en $65^\circ$
      uitwerking: |-
        $(180^\circ - 50^\circ) : 2 = 65^\circ$.
    - opgave: |-
        de tophoek van een gelijkbenige driehoek met basishoeken van $35^\circ$
      antwoord: |-
        $110^\circ$
      uitwerking: |-
        $180^\circ - 2 \cdot 35^\circ = 110^\circ$.
    - opgave: |-
        de hoek tussen de wijzers van een klok om 4 uur
      antwoord: |-
        $120^\circ$
      uitwerking: |-
        Tussen twee uren ligt $360^\circ : 12 = 30^\circ$, dus $4 \cdot 30^\circ = 120^\circ$.
    - opgave: |-
        de hoek naast $\hoek{C}$ (op het verlengde van $[AC]$) in een driehoek met $\hoek{A} = 40^\circ$ en $\hoek{B} = 75^\circ$
      antwoord: |-
        $115^\circ$
      uitwerking: |-
        $\hoek{C} = 180^\circ - 40^\circ - 75^\circ = 65^\circ$, en de hoek ernaast is $180^\circ - 65^\circ = 115^\circ$. Dat is ook $40^\circ + 75^\circ$.
    - opgave: |-
        de schuine zijde van een rechthoekige driehoek met rechthoekszijden 5 en 12
      antwoord: |-
        13
      uitwerking: |-
        $\sqrt{25 + 144} = \sqrt{169} = 13$.
    - opgave: |-
        de hoogte van een gelijkzijdige driehoek met zijde 6, exact en op 0,01 na
      antwoord: |-
        $3\sqrt3 \approx 5{,}20$
      uitwerking: |-
        De hoogte valt in het midden van de basis: $h^2 = 6^2 - 3^2 = 27$, dus $h = \sqrt{27} = 3\sqrt3 \approx 5{,}20$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Teken een cirkel met middelpunt $M$ en straal 4~cm. Kies twee punten $A$ en $B$ op de cirkel zodat $\hoek{AMB} = 100^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        Kies drie punten $C$, $D$ en $E$ op de grote boog $\boog{AB}$, ver uit elkaar. Meet $\hoek{ACB}$, $\hoek{ADB}$ en $\hoek{AEB}$. Wat valt je op?
      antwoord: |-
        telkens ongeveer $50^\circ$
      uitwerking: |-
        De drie hoeken zijn gelijk (op meetfouten na), en de helft van $\hoek{AMB} = 100^\circ$.
    - opgave: |-
        Kies een punt $F$ op de kleine boog $\boog{AB}$ en meet $\hoek{AFB}$. Wat valt je op?
      antwoord: |-
        ongeveer $130^\circ$
      uitwerking: |-
        $130^\circ = 180^\circ - 50^\circ$. Het is ook de helft van $360^\circ - 100^\circ = 260^\circ$.

- id: h1-koorde
  soort: kort
  opgave: |-
    Waar of niet waar? Verbeter wat niet klopt.
  lijst: enumerate
  delen:
    - opgave: |-
        Een middellijn is een koorde.
      antwoord: |-
        waar
      uitwerking: |-
        Beide eindpunten liggen op de cirkel.
    - opgave: |-
        Elke koorde gaat door het middelpunt.
      antwoord: |-
        niet waar
      uitwerking: |-
        Alleen een middellijn gaat door het middelpunt.
    - opgave: |-
        Een koorde kan langer zijn dan een middellijn.
      antwoord: |-
        niet waar
      uitwerking: |-
        De middellijn is de langste koorde.
    - opgave: |-
        Een straal is een koorde.
      antwoord: |-
        niet waar
      uitwerking: |-
        Een eindpunt van een straal is het middelpunt, en dat ligt niet op de cirkel.
    - opgave: |-
        Twee punten van een cirkel verdelen de cirkel in twee bogen.
      antwoord: |-
        waar
      uitwerking: |-
        Een kleine en een grote boog, of twee halve cirkels als de punten op een middellijn liggen.

- id: h1-mph
  soort: kort
  opgave: |-
    Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        de middelpuntshoek op een zijde van een regelmatige achthoek
      antwoord: |-
        $45^\circ$
      uitwerking: |-
        $360^\circ : 8 = 45^\circ$.
    - opgave: |-
        het aantal zijden van een regelmatige veelhoek met een middelpuntshoek van $40^\circ$ op elke zijde
      antwoord: |-
        9
      uitwerking: |-
        $360^\circ : 40^\circ = 9$.
    - opgave: |-
        de basishoeken van de driehoek $AMB$, als $[AB]$ een zijde is van een regelmatige vijfhoek met middelpunt $M$
      antwoord: |-
        $54^\circ$
      uitwerking: |-
        $\hoek{AMB} = 360^\circ : 5 = 72^\circ$, en $\drieh{AMB}$ is gelijkbenig: $(180^\circ - 72^\circ) : 2 = 54^\circ$.
    - opgave: |-
        de middelpuntshoek op de grote boog $\boog{AB}$, als die op de kleine boog $105^\circ$ is
      antwoord: |-
        $255^\circ$
      uitwerking: |-
        $360^\circ - 105^\circ = 255^\circ$.

- id: h1-boog
  soort: kort
  opgave: |-
    Bereken op 0,01 na.
  lijst: enumerate
  delen:
    - opgave: |-
        de lengte van de boog bij een middelpuntshoek van $36^\circ$ in een cirkel met straal 10~cm
      antwoord: |-
        $2\pi \approx 6{,}28$~cm
      uitwerking: |-
        $\tfrac{36}{360} \cdot 2\pi \cdot 10 = 2\pi \approx 6{,}28$~cm.
    - opgave: |-
        de lengte van de boog bij een middelpuntshoek van $270^\circ$ in een cirkel met straal 4~cm
      antwoord: |-
        $6\pi \approx 18{,}85$~cm
      uitwerking: |-
        $\tfrac{270}{360} \cdot 2\pi \cdot 4 = 6\pi \approx 18{,}85$~cm.
    - opgave: |-
        de middelpuntshoek bij een boog die even lang is als de straal
      antwoord: |-
        $\approx 57{,}30^\circ$
      uitwerking: |-
        $\tfrac{\alpha}{360^\circ} \cdot 2\pi r = r$, dus $\alpha = \tfrac{360^\circ}{2\pi} \approx 57{,}30^\circ$. Dat hangt niet af van de straal.

- id: h1-omtrek
  soort: kort
  opgave: |-
    Op een cirkel met middelpunt $M$ liggen de punten $A$, $B$ en $C$. Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        $\hoek{ACB}$, als $\hoek{AMB} = 98^\circ$ en $C$ op de grote boog $\boog{AB}$ ligt
      antwoord: |-
        $49^\circ$
      uitwerking: |-
        $\tfrac12 \cdot 98^\circ = 49^\circ$.
    - opgave: |-
        $\hoek{AMB}$ en $\hoek{MAB}$, als $\hoek{ACB} = 34^\circ$ en $C$ op de grote boog ligt
      antwoord: |-
        $68^\circ$ en $56^\circ$
      uitwerking: |-
        $\hoek{AMB} = 2 \cdot 34^\circ = 68^\circ$, en in de gelijkbenige driehoek $AMB$ is $\hoek{MAB} = (180^\circ - 68^\circ) : 2 = 56^\circ$.
    - opgave: |-
        $\hoek{ACB}$, als $\hoek{AMB} = 160^\circ$ en $C$ op de kleine boog ligt
      antwoord: |-
        $100^\circ$
      uitwerking: |-
        $\hoek{ACB}$ staat op de grote boog, met middelpuntshoek $360^\circ - 160^\circ = 200^\circ$. Dus $\hoek{ACB} = 100^\circ$.
    - opgave: |-
        $\hoek{AMB}$, als $\hoek{ACB} = 125^\circ$. Op welke boog ligt $C$?
      antwoord: |-
        $110^\circ$; $C$ ligt op de kleine boog
      uitwerking: |-
        Een stompe omtrekshoek staat op de grote boog, met middelpuntshoek $2 \cdot 125^\circ = 250^\circ$. Dus ligt $C$ op de kleine boog, en $\hoek{AMB} = 360^\circ - 250^\circ = 110^\circ$.

- id: h1-zelfde
  soort: kort
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.85,font=\scriptsize]
        \cirkel
        \cpunt{A}{210}{A} \cpunt{B}{320}{B} \cpunt{C}{40}{C} \cpunt{D}{90}{D}
        \draw[accent,thick] (A) -- (B) -- (C) -- (D) -- cycle (A) -- (C) (B) -- (D);
      \end{tikzpicture}
  opgave: |-
    De punten $A$, $B$, $C$ en $D$ liggen op een cirkel. Verder is $\hoek{BAC} = 40^\circ$, $\hoek{CBD} = 25^\circ$ en $\hoek{ADB} = 55^\circ$. Bereken.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\hoek{BDC}$
      antwoord: |-
        $40^\circ$
      uitwerking: |-
        Op dezelfde boog $\boog{BC}$ als $\hoek{BAC}$.
    - opgave: |-
        $\hoek{CAD}$
      antwoord: |-
        $25^\circ$
      uitwerking: |-
        Op dezelfde boog $\boog{CD}$ als $\hoek{CBD}$.
    - opgave: |-
        $\hoek{ACB}$
      antwoord: |-
        $55^\circ$
      uitwerking: |-
        Op dezelfde boog $\boog{AB}$ als $\hoek{ADB}$.
    - opgave: |-
        $\hoek{ABD}$
      antwoord: |-
        $60^\circ$
      uitwerking: |-
        In $\drieh{ABD}$ is $\hoek{BAD} = 40^\circ + 25^\circ = 65^\circ$, dus $\hoek{ABD} = 180^\circ - 65^\circ - 55^\circ = 60^\circ$.

- id: h1-kijk
  soort: kort
  opgave: |-
    Een bewakingscamera met een kijkhoek van $90^\circ$ moet een poort van 8~m breed precies in beeld hebben, van de ene paal tot de andere. Waar kan de camera staan, voor de poort en op de grond gezien? Hoe ver van de poort staat hij hoogstens?
  antwoord: |-
    op de halve cirkel met de poort als middellijn; hoogstens 4~m
  uitwerking: |-
    Een omtrekshoek van $90^\circ$ staat op een halve cirkel. De camera staat dus op de halve cirkel voor de poort, met de poort als middellijn en straal 4~m. Het verste punt ligt recht voor het midden van de poort, op 4~m.

- id: h1-thales
  soort: kort
  opgave: |-
    Bereken. Rond af op 0,01 waar nodig.
  lijst: enumerate
  delen:
    - opgave: |-
        $\lengte{AC}$, als driehoek $ABC$ zijn hoekpunten heeft op een cirkel met middellijn $[AB]$, $\lengte{AB} = 13$ en $\lengte{BC} = 5$
      antwoord: |-
        12
      uitwerking: |-
        $\hoek{C} = 90^\circ$, dus $\lengte{AC}^2 = 169 - 25 = 144$ en $\lengte{AC} = 12$.
    - opgave: |-
        de straal van de cirkel door de hoekpunten van een rechthoekige driehoek met rechthoekszijden 9 en 12
      antwoord: |-
        7,5
      uitwerking: |-
        De schuine zijde is $\sqrt{81 + 144} = 15$. De rechte hoek staat op een halve cirkel, dus de schuine zijde is een middellijn: $r = 7{,}5$.
    - opgave: |-
        $\hoek{ABC}$, als $[AB]$ een middellijn is, $C$ op de cirkel ligt en $\hoek{CAB} = 34^\circ$
      antwoord: |-
        $56^\circ$
      uitwerking: |-
        $\hoek{ACB} = 90^\circ$, dus $\hoek{ABC} = 90^\circ - 34^\circ = 56^\circ$.

- id: h1-omgekeerd
  pakketten: [5]
  soort: kort
  opgave: |-
    In een assenstelsel is $A(0, 0)$ en $B(10, 0)$. Welke punten liggen op de cirkel met middellijn $[AB]$? Gebruik de omgekeerde stelling en die van Pythagoras.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $C(1, 3)$
      antwoord: |-
        ja
      uitwerking: |-
        $\lengte{AC}^2 + \lengte{BC}^2 = 10 + 90 = 100 = \lengte{AB}^2$: de hoek in $C$ is recht.
    - opgave: |-
        $D(6, 4)$
      antwoord: |-
        nee
      uitwerking: |-
        $\lengte{AD}^2 + \lengte{BD}^2 = 52 + 32 = 84 \neq 100$: de hoek in $D$ is niet recht.
    - opgave: |-
        $E(8, {-4})$
      antwoord: |-
        ja
      uitwerking: |-
        $\lengte{AE}^2 + \lengte{BE}^2 = 80 + 20 = 100$: de hoek in $E$ is recht.

- id: h1-kvh
  soort: kort
  opgave: |-
    $ABCD$ is een vierhoek.
  lijst: enumerate
  delen:
    - opgave: |-
        $ABCD$ is een koordenvierhoek met $\hoek{A} = 64^\circ$ en $\hoek{B} = 97^\circ$. Bereken $\hoek{C}$ en $\hoek{D}$.
      antwoord: |-
        $\hoek{C} = 116^\circ$, $\hoek{D} = 83^\circ$
      uitwerking: |-
        $180^\circ - 64^\circ = 116^\circ$ en $180^\circ - 97^\circ = 83^\circ$.
    - opgave: |-
        Kan $ABCD$ een koordenvierhoek zijn met $\hoek{A} = 70^\circ$, $\hoek{B} = 100^\circ$, $\hoek{C} = 120^\circ$ en $\hoek{D} = 70^\circ$?
      antwoord: |-
        nee
      uitwerking: |-
        $\hoek{A} + \hoek{C} = 190^\circ \neq 180^\circ$.
    - opgave: |-
        $ABCD$ is een koordenvierhoek en een trapezium met $AB \parallel CD$ en $\hoek{A} = 65^\circ$. Bereken de andere hoeken. Wat voor trapezium is het?
      antwoord: |-
        $\hoek{B} = 65^\circ$, $\hoek{C} = \hoek{D} = 115^\circ$; gelijkbenig
      uitwerking: |-
        $\hoek{D} = 180^\circ - 65^\circ = 115^\circ$ (hoeken aan dezelfde kant van een snijlijn van twee evenwijdige rechten), $\hoek{C} = 180^\circ - 65^\circ = 115^\circ$ (koordenvierhoek) en $\hoek{B} = 180^\circ - 115^\circ = 65^\circ$. De hoeken aan de basis zijn gelijk: een gelijkbenig trapezium.

