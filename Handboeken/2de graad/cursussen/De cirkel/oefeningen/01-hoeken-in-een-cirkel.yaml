# Opdrachten

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    omtrekshoek uit middelpuntshoek
  opgave: |-
    Een omtrekshoek en een middelpuntshoek staan op dezelfde boog. Bereken de omtrekshoek als de middelpuntshoek gegeven is.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $84^\circ$
      antwoord: |-
        $42^\circ$
    - opgave: |-
        $150^\circ$
      antwoord: |-
        $75^\circ$
    - opgave: |-
        $36^\circ$
      antwoord: |-
        $18^\circ$
    - opgave: |-
        $90^\circ$
      antwoord: |-
        $45^\circ$
    - opgave: |-
        $127^\circ$
      antwoord: |-
        $63{,}5^\circ$
    - opgave: |-
        $200^\circ$
      antwoord: |-
        $100^\circ$
  uitwerking: |-
    Telkens de helft. Bij f is de middelpuntshoek inspringend, en de omtrekshoek stomp.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    begrippen
  opgave: |-
    Waar of niet waar? Geef een reden of een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        Een omtrekshoek is altijd kleiner dan $90^\circ$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Een omtrekshoek op de grote boog van een cirkel is stomp, zoals $110^\circ$ op een middelpuntshoek van $220^\circ$.
    - opgave: |-
        Een middelpuntshoek is twee keer zo groot als elke omtrekshoek.
      antwoord: |-
        niet waar
      uitwerking: |-
        Alleen als ze op dezelfde boog staan.
    - opgave: |-
        Twee omtrekshoeken op dezelfde boog zijn even groot.
      antwoord: |-
        waar
      uitwerking: |-
        Beide zijn de helft van dezelfde middelpuntshoek.
    - opgave: |-
        Een omtrekshoek kan $180^\circ$ zijn.
      antwoord: |-
        niet waar
      uitwerking: |-
        Dan zou de middelpuntshoek $360^\circ$ zijn, en is er geen boog. Een omtrekshoek ligt tussen $0^\circ$ en $180^\circ$.
    - opgave: |-
        Elke rechthoek is een koordenvierhoek.
      antwoord: |-
        waar
      uitwerking: |-
        De overstaande hoeken zijn $90^\circ + 90^\circ = 180^\circ$, en het snijpunt van de diagonalen ligt even ver van de hoekpunten.
    - opgave: |-
        In een koordenvierhoek zijn de overstaande hoeken gelijk.
      antwoord: |-
        niet waar
      uitwerking: |-
        Ze zijn samen $180^\circ$. Ze zijn alleen gelijk als ze allebei recht zijn.

