# Oefeningen van hoofdstuk 2 (De correlatiecoëfficiënt). Zie Opmaak/oefeningenbank.py voor de velden.
# Alle gegevens zijn verzonnen. Elke r en elke regressielijn is nagerekend met Python (numpy.corrcoef, kleinste kwadraten).
# pakketten: de formule van r (h2-formule, h2-o19) alleen in 5.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Reken uit of beantwoord.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        het gemiddelde van $4$, $7$, $9$ en $12$
      antwoord: |-
        $8$
      uitwerking: |-
        $\tfrac{32}{4} = 8$.
    - opgave: |-
        $(7 - 8) \cdot (15 - 20)$
      antwoord: |-
        $5$
      uitwerking: |-
        $(-1) \cdot (-5) = 5$.
    - opgave: |-
        $(12 - 8) \cdot (18 - 20)$
      antwoord: |-
        $-8$
      uitwerking: |-
        $4 \cdot (-2) = -8$.
    - opgave: |-
        het teken van $a \cdot b$ als $a < 0$ en $b < 0$
      antwoord: |-
        positief
      uitwerking: |-
        Min maal min is plus.
    - opgave: |-
        $\abs{-0,7}$ en $\abs{0,45}$
      antwoord: |-
        $0,7$ en $0,45$
      uitwerking: |-
        De absolute waarde laat het teken weg.
    - opgave: |-
        positief of negatief verband: trainingsuren en looptijd
      antwoord: |-
        negatief
      uitwerking: |-
        Wie meer traint, loopt meestal sneller, dus in minder tijd: negatief.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Bekijk de vier spreidingsdiagrammen.

    \vspace{1mm}
    \figuren{\begin{tikzpicture}[x=.27cm,y=.27cm,font=\scriptsize]
      \diagram[][]{0}{2}{10}{0}{2}{10}
      \punten{(1.7,2.6) (2.1,2.8) (2.8,3.3) (3.3,4.3) (3.7,3.8) (4.7,4.3) (5.5,5.6) (5.7,6) (6.6,5.8) (7.7,6.9) (8.3,6.4) (9.1,8.1)}
      \node[below,font=\small\bfseries] at (5,-.6) {A};
    \end{tikzpicture}\hfill
    \begin{tikzpicture}[x=.27cm,y=.27cm,font=\scriptsize]
      \diagram[][]{0}{2}{10}{0}{2}{10}
      \punten{(1.7,6.5) (2.3,5.8) (2.8,2.9) (2.9,6.8) (2.9,7.6) (3.7,5.6) (5.3,4.2) (6,5.6) (6.1,3.8) (7.5,5.2) (8.6,1.8) (8.6,4.2)}
      \node[below,font=\small\bfseries] at (5,-.6) {B};
    \end{tikzpicture}\hfill
    \begin{tikzpicture}[x=.27cm,y=.27cm,font=\scriptsize]
      \diagram[][]{0}{2}{10}{0}{2}{10}
      \punten{(1.9,5) (2.6,2.4) (2.8,3.4) (2.9,3.5) (3.8,3.6) (4,7.4) (5.4,6.2) (5.5,5.6) (5.5,6) (6.1,7.6) (7.5,5.6) (8.5,3.7)}
      \node[below,font=\small\bfseries] at (5,-.6) {C};
    \end{tikzpicture}\hfill
    \begin{tikzpicture}[x=.27cm,y=.27cm,font=\scriptsize]
      \diagram[][]{0}{2}{10}{0}{2}{10}
      \punten{(1,7.6) (2.6,5.3) (2.6,7) (3.6,6.2) (4.7,5.4) (5.4,5.9) (5.8,5.6) (6.3,5) (6.4,3.4) (6.6,3.3) (8.9,2.5) (9.1,2.8)}
      \node[below,font=\small\bfseries] at (5,-.6) {D};
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Welke verbanden zijn positief, welke negatief?
      antwoord: |-
        A en C positief, B en D negatief
      uitwerking: |-
        A en C stijgen: positief. B en D dalen: negatief.
    - opgave: |-
        Rangschik de vier verbanden van het sterkste naar het zwakste.
      antwoord: |-
        A, D, B, C
      uitwerking: |-
        A ligt het dichtst bij een rechte, dan D, dan B, en C het minst. (ICT geeft $r = 0,97$; $-0,90$; $-0,60$ en $0,35$.)
    - opgave: |-
        Was het gemakkelijk om B en C te vergelijken? Waarom zou een getal voor de sterkte handig zijn?
      antwoord: |-
        nee; een getal is objectief
      uitwerking: |-
        Niet echt: de ene wolk daalt en de andere stijgt, en beide liggen vrij ver van een rechte. Met een getal kan iedereen de sterkte op dezelfde manier vergelijken, zonder te discussiëren.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h2-kwadrant
  soort: kort
  opgave: |-
    In elk spreidingsdiagram tonen de streepjeslijnen het gemiddelde punt. Is $r$ positief of negatief? Ligt $r$ dicht bij $0$ of dicht bij $\pm 1$?

    \vspace{1mm}
    \figuren{\begin{tikzpicture}[x=.3cm,y=.3cm,font=\scriptsize]
      \diagram[][]{0}{2}{10}{0}{2}{10}
      \gemlijnen{4.44}{4.99}{0}{10}{0}{10}
      \punten{(0.9,3.5) (1.7,3.4) (2.3,4.8) (2.5,3.3) (2.8,4.1) (3.1,3.9) (5,5.9) (5.6,6.8) (5.8,3.5) (7.1,5.9) (7.8,8.2) (8.7,6.6)}
      \node[below,font=\small\bfseries] at (5,-.6) {A};
    \end{tikzpicture}\qquad\qquad
    \begin{tikzpicture}[x=.3cm,y=.3cm,font=\scriptsize]
      \diagram[][]{0}{2}{10}{0}{2}{10}
      \gemlijnen{4.64}{5}{0}{10}{0}{10}
      \punten{(1.2,5.9) (1.5,6.2) (1.8,6.2) (2,7) (4.7,7.1) (4.7,2.2) (5.5,4.3) (5.6,4) (6.5,2.9) (6.7,3.1) (6.9,4.9) (8.6,6.2)}
      \node[below,font=\small\bfseries] at (5,-.6) {B};
    \end{tikzpicture}}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        A
      antwoord: |-
        positief, vrij dicht bij 1
      uitwerking: |-
        A: elf van de twaalf punten liggen rechtsboven of linksonder, dus $r > 0$. De punten liggen vrij dicht bij een stijgende rechte: $r$ is vrij groot. (ICT: $r = 0,79$.)
    - opgave: |-
        B
      antwoord: |-
        negatief, dichter bij 0
      uitwerking: |-
        B: tien van de twaalf punten liggen linksboven of rechtsonder, dus $r < 0$. Maar de wolk is breed en de punten liggen ver van een rechte: $r$ ligt dichter bij 0. (ICT: $r = -0,45$.)

- id: h2-sterkte
  soort: kort
  opgave: |-
    Beschrijf het verband: positief of negatief, en sterk, matig of zwak.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $r = 0,85$
      antwoord: |-
        sterk positief
      uitwerking: |-
        $r > 0$ en $0,85 \geqslant 0,8$: sterk positief.
    - opgave: |-
        $r = -0,35$
      antwoord: |-
        zwak negatief
      uitwerking: |-
        $r < 0$ en $0,35 < 0,5$: zwak negatief.
    - opgave: |-
        $r = -0,92$
      antwoord: |-
        sterk negatief
      uitwerking: |-
        $r < 0$ en $0,92 \geqslant 0,8$: sterk negatief.
    - opgave: |-
        $r = 0,61$
      antwoord: |-
        matig positief
      uitwerking: |-
        $0,5 \leqslant 0,61 < 0,8$: matig positief.
    - opgave: |-
        $r = 0,08$
      antwoord: |-
        (bijna) geen lineair verband
      uitwerking: |-
        $r$ ligt heel dicht bij 0: (bijna) geen lineair verband.
    - opgave: |-
        $r = -0,55$
      antwoord: |-
        matig negatief
      uitwerking: |-
        $0,5 \leqslant 0,55 < 0,8$: matig negatief.

