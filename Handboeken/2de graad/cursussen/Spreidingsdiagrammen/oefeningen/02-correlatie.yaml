- id: h2-ict
  soort: kort
  opgave: |-
    Negen leerlingen noteren hun gemiddelde schermtijd per dag $s$ (in uur) en hun gemiddelde slaap per nacht $\ell$ (in uur).

    \vspace{1mm}
    {\centering\waardetabel[$s$ (uur)][$\ell$ (uur)]{9}{1 & 1,5 & 2 & 2,5 & 3 & 3,5 & 4 & 5 & 6}{9,0 & 8,5 & 8,8 & 8,0 & 7,5 & 8,2 & 7,0 & 7,2 & 6,5}\par}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken met ICT de correlatiecoëfficiënt en beschrijf het verband.
      antwoord: |-
        $r = -0,92$, sterk negatief
      uitwerking: |-
        ICT geeft $r \approx -0,92$: een sterk negatief verband. Meer schermtijd gaat samen met minder slaap.
    - opgave: |-
        Bereken ook de regressielijn. Wat betekent de rico?
      antwoord: |-
        $\ell = -0,48s + 9,38$
      uitwerking: |-
        $\ell \approx -0,48s + 9,38$. Per uur schermtijd meer slapen deze leerlingen gemiddeld ongeveer een half uur (0,48 uur, bijna 29 minuten) minder.

- id: h2-formule
  pakketten: [5]
  soort: kort
  opgave: |-
    Bereken met de formule de correlatiecoëfficiënt van de punten $(1, 5)$, $(2, 4)$, $(3, 4)$, $(4, 2)$ en $(5, 1)$. Controleer met ICT.
  antwoord: |-
    $r \approx -0,96$
  uitwerking: |-
    Het gemiddelde punt is $(3;\ 3,2)$. De afwijkingen $x - \xbar$ zijn $-2, -1, 0, 1, 2$ en de afwijkingen $y - \ybar$ zijn $1,8;\ 0,8;\ 0,8;\ -1,2;\ -2,2$. De som van de producten is $-3,6 - 0,8 + 0 - 1,2 - 4,4 = -10$. Verder is $\sum (x - \xbar)^2 = 4 + 1 + 0 + 1 + 4 = 10$ en $\sum (y - \ybar)^2 = 3,24 + 0,64 + 0,64 + 1,44 + 4,84 = 10,8$. Dus $r = \tfrac{-10}{\sqrt{10 \cdot 10,8}} = \tfrac{-10}{\sqrt{108}} \approx -0,96$. ICT geeft hetzelfde.

- id: h2-krom
  soort: kort
  opgave: |-
    Een wagen rijdt telkens tien kilometer aan een vaste snelheid $v$ (in km/h). Men meet het verbruik $b$ (in liter per 100 km).

    \vspace{1mm}
    {\centering\waardetabel[$v$ (km/h)][$b$ (l/100 km)]{6}{30 & 50 & 70 & 90 & 110 & 130}{7,8 & 5,9 & 5,2 & 5,4 & 6,4 & 8,0}\par}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken met ICT de correlatiecoëfficiënt.
      antwoord: |-
        $r = 0,12$
      uitwerking: |-
        ICT geeft $r \approx 0,12$.
    - opgave: |-
        Teken het spreidingsdiagram. Is er een verband tussen snelheid en verbruik?
      antwoord: |-
        ja, maar niet lineair
      uitwerking: |-
        Ja: het verbruik daalt eerst en stijgt daarna, met het kleinste verbruik rond 70 à 90 km/h. Het verband is duidelijk, maar niet lineair, en daarom is $r$ bijna 0.
        \figuren{\begin{tikzpicture}[x=.05cm,y=.5cm]
          \diagram[$v$ (km/h)][$b$]{20}{10}{140}{4}{1}{9}
          \xas{20,60,100,140}\yas{4,6,8}
          \punten{(30,7.8) (50,5.9) (70,5.2) (90,5.4) (110,6.4) (130,8)}
        \end{tikzpicture}}

- id: h2-uitschieter
  soort: kort
  opgave: |-
    Acht jongeren noteren hun zakgeld per week $z$ (in euro) en het aantal boeken $b$ dat ze vorig jaar lazen.

    \vspace{1mm}
    {\centering\waardetabel[$z$ (euro)][$b$]{8}{5 & 6 & 7 & 8 & 9 & 10 & 11 & 19}{5 & 3 & 6 & 4 & 5 & 3 & 6 & 14}\par}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken met ICT $r$ voor de acht jongeren.
      antwoord: |-
        $r = 0,86$
      uitwerking: |-
        $r \approx 0,86$: een sterk positief verband?
    - opgave: |-
        Bereken $r$ zonder de jongere met 19 euro zakgeld.
      antwoord: |-
        $r = 0,12$
      uitwerking: |-
        Zonder het punt $(19, 14)$: $r \approx 0,12$, bijna geen verband.
    - opgave: |-
        Wat besluit je?
      antwoord: |-
        één uitschieter maakt het verband
      uitwerking: |-
        Het ``sterke verband'' komt volledig van één jongere. Bij de andere zeven is er geen verband tussen zakgeld en lezen. Een uitschieter kan een verband dus ook doen ontstaan, niet alleen verzwakken.

- id: h2-oorzaak
  soort: kort
  opgave: |-
    Elke uitspraak beschrijft een correlatie. Bewijst ze een oorzakelijk verband? Zoek een andere verklaring: een verborgen variabele, een omgekeerde richting of toeval.
  lijst: enumerate
  delen:
    - opgave: |-
        In maanden waarin meer zonnecrème verkocht wordt, worden ook meer barbecues verkocht.
      antwoord: |-
        verborgen variabele: het weer
      uitwerking: |-
        Zonnecrème doet geen barbecues kopen. Het warme, zonnige weer (de zomer) doet beide stijgen: een verborgen variabele.
    - opgave: |-
        Steden met meer politieagenten hebben meer misdrijven.
      antwoord: |-
        verborgen variabele: de grootte; ook omgekeerd
      uitwerking: |-
        Grote steden hebben meer inwoners, dus meer misdrijven en meer agenten (verborgen variabele). Bovendien zet een stad met veel misdrijven extra agenten in (omgekeerde richting).
    - opgave: |-
        Mensen die vaak in de fitness komen, zijn gezonder.
      antwoord: |-
        ook omgekeerd en verborgen variabele
      uitwerking: |-
        Sporten is gezond, maar ook omgekeerd: wie ziek is, gaat niet naar de fitness. En wie op zijn gezondheid let, sport meer \textit{en} eet gezonder (verborgen variabele).
    - opgave: |-
        Op de vijf dagen dat Tom zijn geluksbroek droeg, won zijn ploeg vier keer.
      antwoord: |-
        toeval
      uitwerking: |-
        Vijf matchen zijn veel te weinig gegevens: toeval.

