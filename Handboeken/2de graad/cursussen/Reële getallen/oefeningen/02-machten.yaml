# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.
# pakketten: een zwaardere drillbundel in 2-5, letters in de exponent alleen in 5.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken zonder rekenmachine.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2^5$
      antwoord: |-
        $32$
      uitwerking: |-
        $2 \cdot 2 \cdot 2 \cdot 2 \cdot 2 = 32$.
    - opgave: |-
        $(-3)^2$
      antwoord: |-
        $9$
      uitwerking: |-
        $(-3)(-3) = 9$.
    - opgave: |-
        $-3^2$
      antwoord: |-
        $-9$
      uitwerking: |-
        Eerst de macht: $-(3 \cdot 3) = -9$.
    - opgave: |-
        $10^6$
      antwoord: |-
        $1\,000\,000$
      uitwerking: |-
        Een 1 met zes nullen.
    - opgave: |-
        $0,1^2$
      antwoord: |-
        $0,01$
      uitwerking: |-
        $0,1 \cdot 0,1 = 0,01$.
    - opgave: |-
        $\bigl(\tfrac12\bigr)^3$
      antwoord: |-
        $\tfrac18$
      uitwerking: |-
        $\tfrac12 \cdot \tfrac12 \cdot \tfrac12 = \tfrac18$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad We bekijken de machten van 2.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $2^5$, $2^4$, $2^3$, $2^2$ en $2^1$.
      antwoord: |-
        $32, 16, 8, 4, 2$
      uitwerking: |-
        Telkens een factor 2 minder.
    - opgave: |-
        Wat gebeurt er met de uitkomst telkens als de exponent met 1 daalt?
      antwoord: |-
        ze wordt gedeeld door 2
      uitwerking: |-
        Er valt een factor 2 weg: je deelt door 2.
    - opgave: |-
        Zet het patroon voort. Welke getallen passen bij $2^0$, $2^{-1}$, $2^{-2}$ en $2^{-3}$?
      antwoord: |-
        $1, \tfrac12, \tfrac14, \tfrac18$
      uitwerking: |-
        Blijf delen door 2: $2 : 2 = 1$, $1 : 2 = \tfrac12$, enzovoort.
    - opgave: |-
        Is $2^{-3}$ een negatief getal?
      antwoord: |-
        nee
      uitwerking: |-
        Volgens het patroon is $2^{-3} = \tfrac18$: positief, maar kleiner dan 1.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h2-negatief
  soort: kort
  opgave: |-
    Bereken zonder rekenmachine.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3^{-2}$
      antwoord: |-
        $\tfrac19$
      uitwerking: |-
        $\tfrac{1}{3^2} = \tfrac19$.
    - opgave: |-
        $5^{-1}$
      antwoord: |-
        $\tfrac15$
      uitwerking: |-
        $\tfrac{1}{5^1} = \tfrac15$.
    - opgave: |-
        $(-2)^{-3}$
      antwoord: |-
        $-\tfrac18$
      uitwerking: |-
        $\tfrac{1}{(-2)^3} = \tfrac{1}{-8}$: het grondtal is negatief en de exponent oneven.
    - opgave: |-
        $\bigl(\tfrac34\bigr)^{-2}$
      antwoord: |-
        $\tfrac{16}{9}$
      uitwerking: |-
        Keer om: $\bigl(\tfrac43\bigr)^2 = \tfrac{16}{9}$.
    - opgave: |-
        $10^{-5}$
      antwoord: |-
        $0,000\,01$
      uitwerking: |-
        De 1 staat op de vijfde plaats na de komma.
    - opgave: |-
        $(-7)^0$
      antwoord: |-
        $1$
      uitwerking: |-
        Elke macht met exponent 0 is 1 (grondtal niet 0).

- id: h2-product
  soort: kort
  opgave: |-
    Schrijf als één macht.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $5^3 \cdot 5^{-5}$
      antwoord: |-
        $5^{-2}$
      uitwerking: |-
        $3 + (-5) = -2$.
    - opgave: |-
        $a^{-1} \cdot a^{-6} \cdot a^4$
      antwoord: |-
        $a^{-3}$
      uitwerking: |-
        $-1 - 6 + 4 = -3$.
    - opgave: |-
        $x^8 \cdot x^{-8}$
      antwoord: |-
        $x^0 = 1$
      uitwerking: |-
        $8 + (-8) = 0$.

- id: h2-quotient
  soort: kort
  opgave: |-
    Schrijf als één macht.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{2^9}{2^{11}}$
      antwoord: |-
        $2^{-2}$
      uitwerking: |-
        $9 - 11 = -2$.
    - opgave: |-
        $\dfrac{y^{-3}}{y^4}$
      antwoord: |-
        $y^{-7}$
      uitwerking: |-
        $-3 - 4 = -7$.
    - opgave: |-
        $\dfrac{b^{-5}}{b^{-8}}$
      antwoord: |-
        $b^3$
      uitwerking: |-
        $-5 - (-8) = 3$.

- id: h2-machtmacht
  soort: kort
  opgave: |-
    Schrijf als één macht.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(5^{-2})^{-3}$
      antwoord: |-
        $5^6$
      uitwerking: |-
        $(-2) \cdot (-3) = 6$.
    - opgave: |-
        $(a^4)^{-1}$
      antwoord: |-
        $a^{-4}$
      uitwerking: |-
        $4 \cdot (-1) = -4$.
    - opgave: |-
        $\bigl((x^{-1})^2\bigr)^3$
      antwoord: |-
        $x^{-6}$
      uitwerking: |-
        $(-1) \cdot 2 \cdot 3 = -6$.

- id: h2-machtprodquot
  soort: kort
  opgave: |-
    Werk de haakjes weg.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $(2x)^5$
      antwoord: |-
        $32x^5$
      uitwerking: |-
        $2^5 x^5$.
    - opgave: |-
        $(-3a^2b)^2$
      antwoord: |-
        $9a^4b^2$
      uitwerking: |-
        $(-3)^2 (a^2)^2 b^2$.
    - opgave: |-
        $\Bigl(\dfrac{a^3}{2}\Bigr)^4$
      antwoord: |-
        $\dfrac{a^{12}}{16}$
      uitwerking: |-
        $\dfrac{(a^3)^4}{2^4}$.
    - opgave: |-
        $\Bigl(\dfrac{x}{y^2}\Bigr)^{-1}$
      antwoord: |-
        $\dfrac{y^2}{x}$
      uitwerking: |-
        Een negatieve exponent keert de breuk om.

- id: h2-combineren
  soort: kort
  opgave: |-
    Vereenvoudig en schrijf zonder negatieve exponenten.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(2x^{-2})^3 \cdot x^7$
      antwoord: |-
        $8x$
      uitwerking: |-
        $8x^{-6} \cdot x^7 = 8x^1$.
    - opgave: |-
        $\dfrac{6a^4b^{-1}}{3a^{-2}b^2}$
      antwoord: |-
        $\dfrac{2a^6}{b^3}$
      uitwerking: |-
        $\tfrac63 \cdot a^{4-(-2)} \cdot b^{-1-2} = 2a^6b^{-3}$.

- id: h2-wet
  soort: kort
  opgave: |-
    Schrijf in wetenschappelijke notatie.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $52\,000\,000$
      antwoord: |-
        $5,2 \cdot 10^7$
      uitwerking: |-
        De komma schuift 7 plaatsen naar links.
    - opgave: |-
        $0,000\,309$
      antwoord: |-
        $3,09 \cdot 10^{-4}$
      uitwerking: |-
        De komma schuift 4 plaatsen naar rechts.
    - opgave: |-
        $860\,000$
      antwoord: |-
        $8,6 \cdot 10^5$
      uitwerking: |-
        5 plaatsen naar links.
    - opgave: |-
        $0,07$
      antwoord: |-
        $7 \cdot 10^{-2}$
      uitwerking: |-
        2 plaatsen naar rechts.

- id: h2-rekenwet
  soort: kort
  opgave: |-
    Bereken zonder rekenmachine. Geef de uitkomst in wetenschappelijke notatie.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(2 \cdot 10^5) \cdot (4,5 \cdot 10^{-2})$
      antwoord: |-
        $9 \cdot 10^3$
      uitwerking: |-
        $2 \cdot 4,5 = 9$ en $5 - 2 = 3$.
    - opgave: |-
        $(7 \cdot 10^6) \cdot (3 \cdot 10^4)$
      antwoord: |-
        $2,1 \cdot 10^{11}$
      uitwerking: |-
        $21 \cdot 10^{10} = 2,1 \cdot 10^{11}$.
    - opgave: |-
        $\dfrac{8 \cdot 10^{-3}}{2 \cdot 10^{-9}}$
      antwoord: |-
        $4 \cdot 10^6$
      uitwerking: |-
        $\tfrac82 = 4$ en $-3 - (-9) = 6$.
    - opgave: |-
        $\dfrac{1,2 \cdot 10^8}{4 \cdot 10^3}$
      antwoord: |-
        $3 \cdot 10^4$
      uitwerking: |-
        $0,3 \cdot 10^5 = 3 \cdot 10^4$.

- id: h2-orde
  soort: kort
  opgave: |-
    Grootteordes.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de grootteorde van $4\,870\,000$ en van $0,000\,31$.
      antwoord: |-
        $10^6$ en $10^{-4}$
      uitwerking: |-
        $4,87 \cdot 10^6$ en $3,1 \cdot 10^{-4}$.
    - opgave: |-
        Wat is de grootteorde van het aantal minuten in een week?
      antwoord: |-
        $10^4$
      uitwerking: |-
        $7 \cdot 24 \cdot 60 = 10\,080 = 1,008 \cdot 10^4$.

- id: h2-afronden
  soort: kort
  opgave: |-
    Rond af zoals gevraagd.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2,718\,281\,8$ op 3 cijfers na de komma
      antwoord: |-
        $2,718$
      uitwerking: |-
        Het eerste cijfer dat wegvalt, is 2.
    - opgave: |-
        $0,000\,628\,3$ op 2 beduidende cijfers
      antwoord: |-
        $0,000\,63$
      uitwerking: |-
        De beduidende cijfers beginnen bij 6; het cijfer na 62 is 8, dus 63.
    - opgave: |-
        $5,555 \cdot 10^6$ op 2 beduidende cijfers
      antwoord: |-
        $5,6 \cdot 10^6$
      uitwerking: |-
        Het cijfer na $5,5$ is 5: naar boven.
    - opgave: |-
        $149\,597\,871$ op 3 beduidende cijfers
      antwoord: |-
        $1,50 \cdot 10^8$
      uitwerking: |-
        $1,495\,978\,71 \cdot 10^8$: het cijfer na $1,49$ is 5, dus $1,50$. De 0 is een beduidend cijfer.

# --- Opdrachten -------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    machten met een negatieve exponent of exponent nul
  opgave: |-
    Bereken zonder rekenmachine.
  lijst: reeks
  kolommen: 5
  delen:
    - opgave: |-
        $2^{-1}$
      antwoord: |-
        $\tfrac12$
    - opgave: |-
        $5^0$
      antwoord: |-
        $1$
    - opgave: |-
        $10^{-3}$
      antwoord: |-
        $0,001$
    - opgave: |-
        $(-3)^{-2}$
      antwoord: |-
        $\tfrac19$
    - opgave: |-
        $4^{-3}$
      antwoord: |-
        $\tfrac{1}{64}$
    - opgave: |-
        $\bigl(\tfrac12\bigr)^{-3}$
      antwoord: |-
        $8$
    - opgave: |-
        $-2^{-2}$
      antwoord: |-
        $-\tfrac14$
    - opgave: |-
        $(-1)^{-7}$
      antwoord: |-
        $-1$
    - opgave: |-
        $\bigl(\tfrac25\bigr)^{-1}$
      antwoord: |-
        $\tfrac52$
    - opgave: |-
        $0,1^{-2}$
      antwoord: |-
        $100$
  uitwerking: |-
    $(-3)^{-2} = \tfrac{1}{9}$, want de exponent is even. $-2^{-2} = -\tfrac{1}{2^2}$: het minteken staat buiten de macht. $(-1)^{-7} = \tfrac{1}{(-1)^7} = -1$. $0,1^{-2} = \bigl(\tfrac{1}{10}\bigr)^{-2} = 10^2 = 100$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    rekenregels: één macht
  opgave: |-
    Schrijf als één macht.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3^4 \cdot 3^{-6}$
      antwoord: |-
        $3^{-2}$
    - opgave: |-
        $\dfrac{7^5}{7^8}$
      antwoord: |-
        $7^{-3}$
    - opgave: |-
        $(2^{-3})^4$
      antwoord: |-
        $2^{-12}$
    - opgave: |-
        $a^5 \cdot a^{-5}$
      antwoord: |-
        $a^0 = 1$
    - opgave: |-
        $(y^4)^{-2}$
      antwoord: |-
        $y^{-8}$
    - opgave: |-
        $\dfrac{b^{12}}{b^{-3}}$
      antwoord: |-
        $b^{15}$
    - opgave: |-
        $x^{-2} \cdot x^{-3}$
      antwoord: |-
        $x^{-5}$
    - opgave: |-
        $5^3 \cdot 5^{-1} \cdot 5^{-4}$
      antwoord: |-
        $5^{-2}$
    - opgave: |-
        $(10^{-2})^{-3}$
      antwoord: |-
        $10^6$
  uitwerking: |-
    Bij een product tel je de exponenten op, bij een quotiënt trek je ze af, bij een macht van een macht vermenigvuldig je ze. Bijvoorbeeld $\tfrac{b^{12}}{b^{-3}} = b^{12-(-3)} = b^{15}$ en $(10^{-2})^{-3} = 10^{(-2)(-3)} = 10^6$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    machten van 10
  opgave: |-
    Schrijf als een macht van 10.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $1000$
      antwoord: |-
        $10^3$
    - opgave: |-
        $0,01$
      antwoord: |-
        $10^{-2}$
    - opgave: |-
        $1$
      antwoord: |-
        $10^0$
    - opgave: |-
        $0,000\,001$
      antwoord: |-
        $10^{-6}$
    - opgave: |-
        $\dfrac{1}{10\,000}$
      antwoord: |-
        $10^{-4}$
    - opgave: |-
        een miljard
      antwoord: |-
        $10^9$
  uitwerking: |-
    Tel de nullen: $0,000\,001$ heeft de 1 op de zesde plaats na de komma, dus $10^{-6}$. Een miljard is $1\,000\,000\,000$: negen nullen.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    wetenschappelijke notatie
  opgave: |-
    Schrijf in wetenschappelijke notatie.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $45\,000$
      antwoord: |-
        $4,5 \cdot 10^4$
    - opgave: |-
        $0,0032$
      antwoord: |-
        $3,2 \cdot 10^{-3}$
    - opgave: |-
        $7\,200\,000\,000$
      antwoord: |-
        $7,2 \cdot 10^9$
    - opgave: |-
        $0,000\,000\,81$
      antwoord: |-
        $8,1 \cdot 10^{-7}$
    - opgave: |-
        $6,5$
      antwoord: |-
        $6,5 \cdot 10^0$
    - opgave: |-
        $123,4$
      antwoord: |-
        $1,234 \cdot 10^2$
    - opgave: |-
        $-0,05$
      antwoord: |-
        $-5 \cdot 10^{-2}$
    - opgave: |-
        $300 \cdot 10^4$
      antwoord: |-
        $3 \cdot 10^6$
  uitwerking: |-
    Verschuif de komma tot er één cijfer verschillend van 0 voor staat. Bij $6,5$ staat er al één cijfer voor de komma: $10^0 = 1$. Bij $300 \cdot 10^4$: $300 = 3 \cdot 10^2$, dus $3 \cdot 10^{2+4}$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    van wetenschappelijke notatie naar decimaal getal
  opgave: |-
    Schrijf als gewoon decimaal getal.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3,2 \cdot 10^4$
      antwoord: |-
        $32\,000$
    - opgave: |-
        $5 \cdot 10^{-3}$
      antwoord: |-
        $0,005$
    - opgave: |-
        $1,07 \cdot 10^6$
      antwoord: |-
        $1\,070\,000$
    - opgave: |-
        $9,9 \cdot 10^{-1}$
      antwoord: |-
        $0,99$
    - opgave: |-
        $4 \cdot 10^0$
      antwoord: |-
        $4$
    - opgave: |-
        $2,005 \cdot 10^{-5}$
      antwoord: |-
        $0,000\,020\,05$
  uitwerking: |-
    De exponent zegt hoeveel plaatsen de komma schuift: naar rechts bij een positieve exponent, naar links bij een negatieve.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    afronden
  opgave: |-
    Rond af zoals gevraagd.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3,141\,59$ op 2 cijfers na de komma
      antwoord: |-
        $3,14$
      uitwerking: |-
        Het eerste cijfer dat wegvalt, is 1.
    - opgave: |-
        $0,0456$ op 1 beduidend cijfer
      antwoord: |-
        $0,05$
      uitwerking: |-
        Het eerste beduidende cijfer is 4; daarna komt 5, dus naar boven.
    - opgave: |-
        $27\,849$ op 3 beduidende cijfers
      antwoord: |-
        $27\,800 = 2,78 \cdot 10^4$
      uitwerking: |-
        Na 278 komt 4: naar beneden.
    - opgave: |-
        $0,999\,51$ op 3 cijfers na de komma
      antwoord: |-
        $1,000$
      uitwerking: |-
        Na $0,999$ komt 5: de laatste 9 wordt 10, en dat schuift door tot $1,000$.
    - opgave: |-
        $6,0349 \cdot 10^{-4}$ op 3 beduidende cijfers
      antwoord: |-
        $6,03 \cdot 10^{-4}$
      uitwerking: |-
        Na $6,03$ komt 4: naar beneden.
    - opgave: |-
        $2,995 \cdot 10^7$ op 3 beduidende cijfers
      antwoord: |-
        $3,00 \cdot 10^7$
      uitwerking: |-
        Na $2,99$ komt 5: naar boven, en dat schuift door.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    rekenregels: juist of fout
  opgave: |-
    Juist of fout? Verbeter wat fout is.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2^{-3} = -8$
      antwoord: |-
        fout: $\tfrac18$
    - opgave: |-
        $3^2 \cdot 3^4 = 9^6$
      antwoord: |-
        fout: $3^6$
    - opgave: |-
        $(a^3)^2 = a^5$
      antwoord: |-
        fout: $a^6$
    - opgave: |-
        $2^{-1} + 2^{-1} = 1$
      antwoord: |-
        juist
    - opgave: |-
        $(2a)^3 = 2a^3$
      antwoord: |-
        fout: $8a^3$
    - opgave: |-
        $(-1)^{100} = 1$
      antwoord: |-
        juist
  uitwerking: |-
    Bij $3^2 \cdot 3^4$ blijft het grondtal 3: tel alleen de exponenten op. $2^{-1} + 2^{-1} = \tfrac12 + \tfrac12 = 1$. Bij $(2a)^3$ krijgt ook de 2 de exponent. $(-1)^{100} = 1$, want de exponent is even.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    rekenregels combineren (drill)
  opgave: |-
    Vereenvoudig en schrijf zonder negatieve exponenten.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(2a^3)^2 \cdot a^{-4}$
      antwoord: |-
        $4a^2$
      uitwerking: |-
        $4a^6 \cdot a^{-4} = 4a^2$.
    - opgave: |-
        $(x^{-2}y)^3$
      antwoord: |-
        $\dfrac{y^3}{x^6}$
      uitwerking: |-
        $x^{-6}y^3$.
    - opgave: |-
        $\dfrac{6a^5}{2a^7}$
      antwoord: |-
        $\dfrac{3}{a^2}$
      uitwerking: |-
        $3a^{5-7} = 3a^{-2}$.
    - opgave: |-
        $(3x^2y^{-1})^{-2}$
      antwoord: |-
        $\dfrac{y^2}{9x^4}$
      uitwerking: |-
        $3^{-2}x^{-4}y^{2}$.
    - opgave: |-
        $(a^2b^{-3})^2 \cdot (ab)^3$
      antwoord: |-
        $\dfrac{a^7}{b^3}$
      uitwerking: |-
        $a^4b^{-6} \cdot a^3b^3 = a^7b^{-3}$.
    - opgave: |-
        $(-2x^{-1})^3 \cdot x^5$
      antwoord: |-
        $-8x^2$
      uitwerking: |-
        $-8x^{-3} \cdot x^5 = -8x^2$.
    - opgave: |-
        $\dfrac{4p^{-2}q^3}{8p^{-5}q}$
      antwoord: |-
        $\dfrac{p^3q^2}{2}$
      uitwerking: |-
        $\tfrac48 \cdot p^{-2-(-5)} \cdot q^{3-1} = \tfrac12 p^3q^2$.
    - opgave: |-
        $\dfrac{(a^{-1}b^2)^{-3}}{a^2b^{-1}}$
      antwoord: |-
        $\dfrac{a}{b^5}$
      uitwerking: |-
        $\dfrac{a^3b^{-6}}{a^2b^{-1}} = a^{3-2}b^{-6-(-1)} = ab^{-5}$.

- id: h2-o9
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    rekenregels combineren (zwaardere drill)
  opgave: |-
    Vereenvoudig en schrijf zonder negatieve exponenten.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\Bigl(\dfrac{(2a^{-2}b)^3}{4a^{-3}b^2}\Bigr)^2$
      antwoord: |-
        $\dfrac{4b^2}{a^6}$
      uitwerking: |-
        Binnen de haakjes: $\dfrac{8a^{-6}b^3}{4a^{-3}b^2} = 2a^{-3}b$. In het kwadraat: $4a^{-6}b^2$.
    - opgave: |-
        $(x^3y^{-2})^{-1} \cdot (x^{-1}y)^{-2}$
      antwoord: |-
        $\dfrac1x$
      uitwerking: |-
        $x^{-3}y^{2} \cdot x^{2}y^{-2} = x^{-1}y^0$.
    - opgave: |-
        $(-3a^2)^3 \cdot (9a^{-1})^{-1}$
      antwoord: |-
        $-3a^7$
      uitwerking: |-
        $-27a^6 \cdot 9^{-1}a = -3a^7$.
    - opgave: |-
        $(2^{-1}a^{-2})^{-3}$
      antwoord: |-
        $8a^6$
      uitwerking: |-
        $2^{3}a^{6}$.
    - opgave: |-
        $\dfrac{(5x^{-2}y^3)^2}{25x^{-3}y^4}$
      antwoord: |-
        $\dfrac{y^2}{x}$
      uitwerking: |-
        $\dfrac{25x^{-4}y^6}{25x^{-3}y^4} = x^{-1}y^2$.
    - opgave: |-
        $\Bigl(\dfrac{2a^{-1}}{b^2}\Bigr)^{-3}$
      antwoord: |-
        $\dfrac{a^3b^6}{8}$
      uitwerking: |-
        Keer om: $\Bigl(\dfrac{b^2}{2a^{-1}}\Bigr)^3 = \dfrac{b^6}{8a^{-3}} = \dfrac{a^3b^6}{8}$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    rekenregels om uit te rekenen
  opgave: |-
    Bereken zonder rekenmachine. Gebruik de rekenregels.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2^{10} \cdot 2^{-8}$
      antwoord: |-
        $4$
      uitwerking: |-
        $2^2 = 4$.
    - opgave: |-
        $(2^{-3} \cdot 2^5)^{-1}$
      antwoord: |-
        $\tfrac14$
      uitwerking: |-
        $(2^2)^{-1} = 2^{-2}$.
    - opgave: |-
        $2^5 \cdot 5^5$
      antwoord: |-
        $100\,000$
      uitwerking: |-
        Macht van een product, omgekeerd: $(2 \cdot 5)^5 = 10^5$.
    - opgave: |-
        $\dfrac{12^3}{4^3}$
      antwoord: |-
        $27$
      uitwerking: |-
        Macht van een quotiënt, omgekeerd: $\bigl(\tfrac{12}{4}\bigr)^3 = 3^3$.
    - opgave: |-
        $0,5^{-3}$
      antwoord: |-
        $8$
      uitwerking: |-
        $\bigl(\tfrac12\bigr)^{-3} = 2^3$.
    - opgave: |-
        $2^{-4} \cdot 4^2$
      antwoord: |-
        $1$
      uitwerking: |-
        $4^2 = (2^2)^2 = 2^4$, dus $2^{-4} \cdot 2^4 = 2^0$.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    rekenen in wetenschappelijke notatie
  opgave: |-
    Bereken zonder rekenmachine. Geef de uitkomst in wetenschappelijke notatie.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(3 \cdot 10^4) \cdot (2 \cdot 10^{-7})$
      antwoord: |-
        $6 \cdot 10^{-3}$
      uitwerking: |-
        $6 \cdot 10^{4-7}$.
    - opgave: |-
        $\dfrac{8 \cdot 10^9}{4 \cdot 10^{-2}}$
      antwoord: |-
        $2 \cdot 10^{11}$
      uitwerking: |-
        $2 \cdot 10^{9-(-2)}$.
    - opgave: |-
        $(5 \cdot 10^3)^2$
      antwoord: |-
        $2,5 \cdot 10^7$
      uitwerking: |-
        $25 \cdot 10^6 = 2,5 \cdot 10^7$.
    - opgave: |-
        $(2,5 \cdot 10^{-4}) \cdot (4 \cdot 10^6)$
      antwoord: |-
        $1 \cdot 10^3$
      uitwerking: |-
        $10 \cdot 10^2 = 10^3$.
    - opgave: |-
        $\dfrac{6 \cdot 10^5}{3 \cdot 10^8}$
      antwoord: |-
        $2 \cdot 10^{-3}$
      uitwerking: |-
        $2 \cdot 10^{5-8}$.
    - opgave: |-
        $\dfrac{9 \cdot 10^{-3}}{3 \cdot 10^{-5}}$
      antwoord: |-
        $3 \cdot 10^2$
      uitwerking: |-
        $3 \cdot 10^{-3-(-5)}$.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    wetenschappelijke notatie in een context: licht
  opgave: |-
    Licht legt $3 \cdot 10^8$ meter per seconde af. De zon staat ongeveer $1,5 \cdot 10^{11}$ m van de aarde.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel seconden doet het licht van de zon erover om de aarde te bereiken?
      antwoord: |-
        $500$ s
      uitwerking: |-
        $\dfrac{1,5 \cdot 10^{11}}{3 \cdot 10^8} = 0,5 \cdot 10^3 = 500$.
    - opgave: |-
        Hoeveel minuten en seconden is dat?
      antwoord: |-
        8 min 20 s
      uitwerking: |-
        $500 = 8 \cdot 60 + 20$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    wetenschappelijke notatie in een context: bacteriën
  opgave: |-
    Een bacterie is ongeveer $2 \cdot 10^{-6}$ m lang.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel bacteriën passen er achter elkaar op een lijn van 1 mm?
      antwoord: |-
        $500$
      uitwerking: |-
        $1 \text{ mm} = 10^{-3}$ m, en $\dfrac{10^{-3}}{2 \cdot 10^{-6}} = 0,5 \cdot 10^3 = 500$.
    - opgave: |-
        En op een lijn van 1 m?
      antwoord: |-
        $5 \cdot 10^5$
      uitwerking: |-
        $\dfrac{1}{2 \cdot 10^{-6}} = 0,5 \cdot 10^6 = 5 \cdot 10^5$, duizend keer zoveel.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    wetenschappelijke notatie in een context: aarde en maan
  opgave: |-
    De aarde heeft een massa van ongeveer $5,97 \cdot 10^{24}$ kg, de maan $7,35 \cdot 10^{22}$ kg.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel keer is de aarde zwaarder dan de maan? Rond af op een geheel getal.
      antwoord: |-
        $81$
      uitwerking: |-
        $\dfrac{5,97 \cdot 10^{24}}{7,35 \cdot 10^{22}} \approx 0,812 \cdot 10^2 = 81,2$.
    - opgave: |-
        Hoeveel grootteordes verschillen de twee massa's?
      antwoord: |-
        $2$
      uitwerking: |-
        $10^{24}$ tegenover $10^{22}$.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    grootteorde
  opgave: |-
    Geef de grootteorde.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $4500$
      antwoord: |-
        $10^3$
      uitwerking: |-
        $4,5 \cdot 10^3$.
    - opgave: |-
        $0,083$
      antwoord: |-
        $10^{-2}$
      uitwerking: |-
        $8,3 \cdot 10^{-2}$.
    - opgave: |-
        $7,9 \cdot 10^{-12}$
      antwoord: |-
        $10^{-12}$
      uitwerking: |-
        Staat al in wetenschappelijke notatie.
    - opgave: |-
        $999$
      antwoord: |-
        $10^2$
      uitwerking: |-
        $9,99 \cdot 10^2$: al ligt het dicht bij $10^3$, de grootteorde is $10^2$.
    - opgave: |-
        de leeftijd van het heelal: ongeveer $13\,800\,000\,000$ jaar
      antwoord: |-
        $10^{10}$ jaar
      uitwerking: |-
        $1,38 \cdot 10^{10}$.
    - opgave: |-
        de breedte van een atoom: ongeveer $0,000\,000\,000\,1$ m
      antwoord: |-
        $10^{-10}$ m
      uitwerking: |-
        De 1 staat op de tiende plaats na de komma.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    schatten met grootteordes
  opgave: |-
    Een hart klopt ongeveer 70 keer per minuut. Wat is de grootteorde van het aantal hartslagen in een leven van 80 jaar? Reken met 365 dagen per jaar.
  antwoord: |-
    $10^9$
  uitwerking: |-
    $70 \cdot 60 \cdot 24 \cdot 365 \cdot 80 = 2\,943\,360\,000 \approx 2,9 \cdot 10^9$: enkele miljarden.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    de rekenmachine en wetenschappelijke notatie
  opgave: |-
    Gebruik je rekenmachine.
  lijst: enumerate
  delen:
    - opgave: |-
        Een rekenmachine toont \texttt{4.2E-5}. Schrijf dat getal in wetenschappelijke notatie en als decimaal getal.
      antwoord: |-
        $4,2 \cdot 10^{-5} = 0,000\,042$
      uitwerking: |-
        De E staat voor de exponent van 10.
    - opgave: |-
        Bereken $(1,2 \cdot 10^{-3})^3$. Geef de uitkomst in wetenschappelijke notatie, en controleer ze met de rekenregels.
      antwoord: |-
        $1,728 \cdot 10^{-9}$
      uitwerking: |-
        $1,2^3 = 1,728$ en $(10^{-3})^3 = 10^{-9}$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten met machten
  opgave: |-
    Lotte maakte drie fouten. Leg telkens uit wat er fout is, en verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        $(2x^3)^2 = 2x^6$
      antwoord: |-
        $4x^6$
      uitwerking: |-
        Ook de factor 2 moet in het kwadraat: $2^2(x^3)^2$.
    - opgave: |-
        $3^{-2} = -9$
      antwoord: |-
        $\tfrac19$
      uitwerking: |-
        Een negatieve exponent geeft het omgekeerde, geen negatief getal.
    - opgave: |-
        $x^2 \cdot x^3 = x^6$
      antwoord: |-
        $x^5$
      uitwerking: |-
        Bij een product tel je de exponenten op. Vermenigvuldigen doe je bij $(x^2)^3$.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    machten vergelijken
  opgave: |-
    Welk getal is het grootste? Beslis zonder rekenmachine en leg uit.
  lijst: enumerate
  delen:
    - opgave: |-
        $2^{-3}$ of $3^{-2}$
      antwoord: |-
        $2^{-3}$
      uitwerking: |-
        $2^{-3} = \tfrac18$ en $3^{-2} = \tfrac19$, en $\tfrac18 > \tfrac19$.
    - opgave: |-
        $10^{-5}$ of $10^{-4}$
      antwoord: |-
        $10^{-4}$
      uitwerking: |-
        $0,0001 > 0,000\,01$. Een negatieve exponent die dichter bij 0 ligt, geeft een groter getal.
    - opgave: |-
        $2^{30}$ of $10^9$
      antwoord: |-
        $2^{30}$
      uitwerking: |-
        $2^{30} = (2^{10})^3 = 1024^3$, en dat is groter dan $1000^3 = 10^9$.

- id: h2-o20
  soort: opdracht
  niveau: 2
  thema: |-
    niet tussendoor afronden
  opgave: |-
    Een rechthoekige plaat is $3,456$ m lang en $2,245$ m breed.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de oppervlakte, en rond pas op het einde af op 2 cijfers na de komma.
      antwoord: |-
        $7,76$~m$^2$
      uitwerking: |-
        $3,456 \cdot 2,245 = 7,758\,72 \approx 7,76$.
    - opgave: |-
        Tim rondt eerst de lengte en de breedte af op 2 cijfers na de komma, en rekent dan. Wat vindt hij? Wat leer je daaruit?
      antwoord: |-
        $7,79$~m$^2$
      uitwerking: |-
        $3,46 \cdot 2,25 = 7,785 \approx 7,79$. Het laatste cijfer verschilt: rond pas af op het einde.

- id: h2-o21
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    letters in de exponent
  opgave: |-
    Vereenvoudig. Daarbij is $n$ een natuurlijk getal.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{a^{n+2} \cdot a^{n-1}}{a^{2n}}$
      antwoord: |-
        $a$
      uitwerking: |-
        $(n + 2) + (n - 1) - 2n = 1$.
    - opgave: |-
        $\dfrac{(x^{2n})^3}{x^n}$
      antwoord: |-
        $x^{5n}$
      uitwerking: |-
        $6n - n = 5n$.
    - opgave: |-
        $2^{n+1} + 2^{n+1}$
      antwoord: |-
        $2^{n+2}$
      uitwerking: |-
        Twee keer hetzelfde: $2 \cdot 2^{n+1} = 2^1 \cdot 2^{n+1} = 2^{n+2}$.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    een som van negatieve machten van 2
  opgave: |-
    Een vierkant met oppervlakte 1 wordt telkens gehalveerd, zoals in de figuur.
  figuur:
    code: |-
      \begin{tikzpicture}[scale=2.2]
        \fill[accent!40] (0,0) rectangle (.5,1);
        \fill[accent!28] (.5,0) rectangle (1,.5);
        \fill[accent!18] (.5,.5) rectangle (.75,1);
        \fill[accent!10] (.75,.5) rectangle (1,.75);
        \draw[accent] (0,0) rectangle (1,1) (.5,0) -- (.5,1) (.5,.5) -- (1,.5) (.75,.5) -- (.75,1) (.75,.75) -- (1,.75);
        \node[font=\scriptsize] at (.25,.5) {$2^{-1}$};
        \node[font=\scriptsize] at (.75,.25) {$2^{-2}$};
        \node[font=\tiny] at (.625,.75) {$2^{-3}$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $2^{-1} + 2^{-2}$, \ $2^{-1} + 2^{-2} + 2^{-3}$ en $2^{-1} + 2^{-2} + 2^{-3} + 2^{-4}$.
      antwoord: |-
        $\tfrac34$, $\tfrac78$, $\tfrac{15}{16}$
      uitwerking: |-
        $\tfrac12 + \tfrac14 = \tfrac34$; daarbij $\tfrac18$ geeft $\tfrac78$; daarbij $\tfrac1{16}$ geeft $\tfrac{15}{16}$.
    - opgave: |-
        Hoeveel scheelt de som van de eerste tien termen nog met 1? Schrijf als macht van 2.
      antwoord: |-
        $2^{-10}$
      uitwerking: |-
        Telkens blijft er een stuk over dat even groot is als het laatste stuk: na tien termen is dat $2^{-10} = \tfrac{1}{1024}$.
    - opgave: |-
        Wordt de som ooit groter dan 1? Leg uit met de figuur.
      antwoord: |-
        nee
      uitwerking: |-
        Alle stukken liggen in het vierkant met oppervlakte 1, en er blijft altijd een stukje leeg. De som komt wel zo dicht bij 1 als je wilt.

- id: h2-o23
  soort: opdracht
  niveau: 3
  thema: |-
    rekenregels slim gebruiken
  opgave: |-
    Hoeveel cijfers heeft het getal $4^{10} \cdot 5^{18}$? Reken zonder rekenmachine.
  antwoord: |-
    $19$
  uitwerking: |-
    $4^{10} = (2^2)^{10} = 2^{20} = 2^2 \cdot 2^{18}$. Dus $4^{10} \cdot 5^{18} = 2^2 \cdot (2 \cdot 5)^{18} = 4 \cdot 10^{18}$: een 4 met achttien nullen, samen 19 cijfers.

- id: h2-o24
  soort: opdracht
  niveau: 3
  thema: |-
    machten van 2 in een context: papier vouwen
  opgave: |-
    Een vel papier is $0,1$ mm dik. Vouw je het dubbel, dan wordt het twee keer zo dik. Stel dat je het zo vaak kunt vouwen als je wilt.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe dik is het na 10 keer vouwen?
      antwoord: |-
        $102,4$ mm
      uitwerking: |-
        $0,1 \cdot 2^{10} = 0,1 \cdot 1024 = 102,4$ mm, ongeveer 10 cm.
    - opgave: |-
        Hoe vaak moet je vouwen om hoger te komen dan de Mount Everest ($8849$ m)?
      antwoord: |-
        27 keer
      uitwerking: |-
        $8849 \text{ m} = 8,849 \cdot 10^6$ mm. Na 26 keer is het $0,1 \cdot 2^{26} \approx 6,7 \cdot 10^6$ mm, na 27 keer $0,1 \cdot 2^{27} \approx 1,34 \cdot 10^7$ mm, dus meer dan 13 km.

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Bereken zonder rekenmachine.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $4^{-2}$
      antwoord: |-
        $\tfrac{1}{16}$
      uitwerking: |-
        $\tfrac{1}{4^2}$.
    - opgave: |-
        $\bigl(\tfrac23\bigr)^{-3}$
      antwoord: |-
        $\tfrac{27}{8}$
      uitwerking: |-
        $\bigl(\tfrac32\bigr)^3$.
    - opgave: |-
        $(-5)^0$
      antwoord: |-
        $1$
      uitwerking: |-
        Exponent 0.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Schrijf als één macht.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^7 \cdot x^{-3}$
      antwoord: |-
        $x^4$
      uitwerking: |-
        $7 + (-3) = 4$.
    - opgave: |-
        $\dfrac{a^{-2}}{a^4}$
      antwoord: |-
        $a^{-6}$
      uitwerking: |-
        $-2 - 4 = -6$.
    - opgave: |-
        $(b^{-3})^{-2}$
      antwoord: |-
        $b^6$
      uitwerking: |-
        $(-3)(-2) = 6$.

- id: h2-t3
  soort: test
  niveau: 2
  opgave: |-
    Vereenvoudig $(3a^{-2}b)^2 \cdot a^5$ en schrijf zonder negatieve exponenten.
  antwoord: |-
    $9ab^2$
  uitwerking: |-
    $9a^{-4}b^2 \cdot a^5 = 9a^1b^2$.

- id: h2-t4
  soort: test
  niveau: 1
  opgave: |-
    Schrijf in wetenschappelijke notatie.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $0,000\,064$
      antwoord: |-
        $6,4 \cdot 10^{-5}$
      uitwerking: |-
        De komma schuift 5 plaatsen naar rechts.
    - opgave: |-
        $5\,300\,000$
      antwoord: |-
        $5,3 \cdot 10^6$
      uitwerking: |-
        De komma schuift 6 plaatsen naar links.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Bereken $(4 \cdot 10^{-3}) \cdot (6 \cdot 10^8)$ zonder rekenmachine. Geef de uitkomst in wetenschappelijke notatie.
  antwoord: |-
    $2,4 \cdot 10^6$
  uitwerking: |-
    $24 \cdot 10^5 = 2,4 \cdot 10^6$.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Afronden en grootteorde.
  lijst: enumerate
  delen:
    - opgave: |-
        Rond $0,072\,049$ af op drie beduidende cijfers.
      antwoord: |-
        $0,0720$
      uitwerking: |-
        De beduidende cijfers beginnen bij 7: $0,072\,0|49$, en na de 0 komt 4. De laatste 0 schrijf je wel, want ze is beduidend.
    - opgave: |-
        Wat is de grootteorde van $0,000\,72$?
      antwoord: |-
        $10^{-4}$
      uitwerking: |-
        $7,2 \cdot 10^{-4}$.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Een hoofdhaar groeit ongeveer $0,35$ mm per dag. Hoeveel meter is dat per seconde? Geef de uitkomst in wetenschappelijke notatie, afgerond op drie beduidende cijfers.
  antwoord: |-
    $4,05 \cdot 10^{-9}$ m/s
  uitwerking: |-
    $0,35 \text{ mm} = 3,5 \cdot 10^{-4}$ m en een dag duurt $24 \cdot 3600 = 86\,400 = 8,64 \cdot 10^4$ s. $\dfrac{3,5 \cdot 10^{-4}}{8,64 \cdot 10^4} \approx 0,405 \cdot 10^{-8} = 4,05 \cdot 10^{-9}$.
