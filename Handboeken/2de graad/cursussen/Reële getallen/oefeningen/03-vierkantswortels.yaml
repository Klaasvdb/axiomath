# Oefeningen van hoofdstuk 3. Zie Opmaak/oefeningenbank.py voor de velden.
# pakketten: sqrt(a^2) = |a| in 4-5, noemer wortelvrij en merkwaardige producten in 2-5, de toegevoegde in 5.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken uit het hoofd.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $12^2$
      antwoord: |-
        $144$
      uitwerking: |-
        $12 \cdot 12 = 144$.
    - opgave: |-
        $0,4^2$
      antwoord: |-
        $0,16$
      uitwerking: |-
        $4 \cdot 4 = 16$, met twee cijfers na de komma.
    - opgave: |-
        $\bigl(\tfrac35\bigr)^2$
      antwoord: |-
        $\tfrac{9}{25}$
      uitwerking: |-
        Teller en noemer in het kwadraat.
    - opgave: |-
        $(-6)^2$
      antwoord: |-
        $36$
      uitwerking: |-
        Twee negatieve factoren.
    - opgave: |-
        $1,1^2$
      antwoord: |-
        $1,21$
      uitwerking: |-
        $11 \cdot 11 = 121$.
    - opgave: |-
        Welke zijn kwadraten van een natuurlijk getal: 50, 64, 81, 90?
      antwoord: |-
        64 en 81
      uitwerking: |-
        $64 = 8^2$ en $81 = 9^2$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Een vierkant heeft een oppervlakte van $20$~cm$^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Tussen welke twee natuurlijke getallen ligt de lengte van de zijde?
      antwoord: |-
        tussen 4 en 5
      uitwerking: |-
        $4^2 = 16 < 20 < 25 = 5^2$.
    - opgave: |-
        Zoek de zijde op één cijfer na de komma, door met de rekenmachine te kwadrateren.
      antwoord: |-
        tussen $4,4$ en $4,5$
      uitwerking: |-
        $4,4^2 = 19,36 < 20 < 20,25 = 4,5^2$.
    - opgave: |-
        Wat geeft de wortelknop van je rekenmachine voor 20? Kwadrateer die uitkomst. Wat stel je vast?
      antwoord: |-
        $4,472135955$; ongeveer 20
      uitwerking: |-
        Het kwadraat is 20 of bijna 20: de rekenmachine toont een benadering van een irrationaal getal.
    - opgave: |-
        Is er nog een ander getal waarvan het kwadraat 20 is?
      antwoord: |-
        ja, $-4,472\ldots$
      uitwerking: |-
        Het tegengestelde heeft hetzelfde kwadraat. Als lengte komt het niet in aanmerking.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h3-def
  soort: kort
  opgave: |-
    Bereken zonder rekenmachine, als het bestaat.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\sqrt{0,49}$
      antwoord: |-
        $0,7$
      uitwerking: |-
        $0,7^2 = 0,49$.
    - opgave: |-
        $\sqrt{\tfrac{16}{25}}$
      antwoord: |-
        $\tfrac45$
      uitwerking: |-
        $\bigl(\tfrac45\bigr)^2 = \tfrac{16}{25}$.
    - opgave: |-
        $-\sqrt{100}$
      antwoord: |-
        $-10$
      uitwerking: |-
        Eerst $\sqrt{100} = 10$.
    - opgave: |-
        $\sqrt{-1}$
      antwoord: |-
        bestaat niet
      uitwerking: |-
        Geen kwadraat is negatief.

- id: h3-vgl
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 = 81$
      antwoord: |-
        $x = \pm 9$
      uitwerking: |-
        Twee oplossingen: $9$ en $-9$.
    - opgave: |-
        $x^2 + 4 = 0$
      antwoord: |-
        geen oplossingen
      uitwerking: |-
        $x^2 = -4$ is onmogelijk.
    - opgave: |-
        $3x^2 = 21$
      antwoord: |-
        $x = \pm\sqrt7$
      uitwerking: |-
        $x^2 = 7$. Ongeveer $\pm 2,65$.

- id: h3-abs
  pakketten: [4, 5]
  soort: kort
  opgave: |-
    Vereenvoudig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sqrt{(-8)^2}$
      antwoord: |-
        $8$
      uitwerking: |-
        $\abs{-8} = 8$.
    - opgave: |-
        $\sqrt{(\sqrt2 - 1)^2}$
      antwoord: |-
        $\sqrt2 - 1$
      uitwerking: |-
        $\sqrt2 - 1 > 0$, dus de absolute waarde verandert niets.
    - opgave: |-
        $\sqrt{(3 - \sqrt{10})^2}$
      antwoord: |-
        $\sqrt{10} - 3$
      uitwerking: |-
        $\sqrt{10} > 3$, dus $3 - \sqrt{10} < 0$.

- id: h3-product
  soort: kort
  opgave: |-
    Bereken zonder rekenmachine.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sqrt2 \cdot \sqrt{50}$
      antwoord: |-
        $10$
      uitwerking: |-
        $\sqrt{100} = 10$.
    - opgave: |-
        $\sqrt5 \cdot \sqrt{45}$
      antwoord: |-
        $15$
      uitwerking: |-
        $\sqrt{225} = 15$.
    - opgave: |-
        $\sqrt{0,1} \cdot \sqrt{10}$
      antwoord: |-
        $1$
      uitwerking: |-
        $\sqrt{1} = 1$.

- id: h3-quotient
  soort: kort
  opgave: |-
    Bereken zonder rekenmachine.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{\sqrt{75}}{\sqrt3}$
      antwoord: |-
        $5$
      uitwerking: |-
        $\sqrt{25} = 5$.
    - opgave: |-
