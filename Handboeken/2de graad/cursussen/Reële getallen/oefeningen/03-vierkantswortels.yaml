- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    vierkantswortel in een context: tegel
  opgave: |-
    Een vierkante tegel heeft een oppervlakte van $1250$~cm$^2$. Hoe lang is de zijde? Geef de exacte waarde, vereenvoudigd, en een benadering tot op 1 mm.
  antwoord: |-
    $25\sqrt2$ cm $\approx 35,4$ cm
  uitwerking: |-
    $\sqrt{1250} = \sqrt{625 \cdot 2} = 25\sqrt2 \approx 35,36$ cm, dus $35,4$ cm.

