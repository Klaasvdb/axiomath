- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    de vergelijking $x^2 = a$
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 = 64$
      antwoord: |-
        $x = \pm 8$
      uitwerking: |-
        $8^2 = (-8)^2 = 64$.
    - opgave: |-
        $x^2 = 0,16$
      antwoord: |-
        $x = \pm 0,4$
      uitwerking: |-
        $0,4^2 = 0,16$.
    - opgave: |-
        $x^2 = -9$
      antwoord: |-
        geen oplossingen
      uitwerking: |-
        Een kwadraat is nooit negatief.
    - opgave: |-
        $x^2 = 7$
      antwoord: |-
        $x = \pm\sqrt7$
      uitwerking: |-
        Ongeveer $\pm 2,65$.
    - opgave: |-
        $3x^2 = 48$
      antwoord: |-
        $x = \pm 4$
      uitwerking: |-
        $x^2 = 16$.
    - opgave: |-
        $x^2 - 5 = 0$
      antwoord: |-
        $x = \pm\sqrt5$
      uitwerking: |-
        $x^2 = 5$.

