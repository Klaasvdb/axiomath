        $3\sqrt{10}$
      uitwerking: |-
        $\sqrt{90} = \sqrt{9 \cdot 10}$.
    - opgave: |-
        $\bigl(2\sqrt5\bigr)^2$
      antwoord: |-
        $20$
      uitwerking: |-
        $4 \cdot 5$.
    - opgave: |-
        $\sqrt3\,\bigl(2 + \sqrt3\bigr)$
      antwoord: |-
        $2\sqrt3 + 3$
      uitwerking: |-
        Distributiviteit.
    - opgave: |-
        $\sqrt2\,\bigl(\sqrt8 - \sqrt2\bigr)$
      antwoord: |-
        $2$
      uitwerking: |-
        $\sqrt{16} - 2 = 4 - 2$.
    - opgave: |-
        $\bigl(\sqrt2\bigr)^3$
      antwoord: |-
        $2\sqrt2$
      uitwerking: |-
        $\bigl(\sqrt2\bigr)^2 \cdot \sqrt2$.
    - opgave: |-
        $-3\sqrt7 \cdot 2\sqrt7$
      antwoord: |-
        $-42$
      uitwerking: |-
        $-6 \cdot 7$.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijkingen van de vorm $x^2 = a$
  opgave: |-
    Los op. Geef de oplossingen exact en vereenvoudigd.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2x^2 = 36$
      antwoord: |-
        $x = \pm 3\sqrt2$
      uitwerking: |-
        $x^2 = 18$, en $\sqrt{18} = 3\sqrt2$.
    - opgave: |-
        $\dfrac{x^2}{3} = 4$
      antwoord: |-
        $x = \pm 2\sqrt3$
      uitwerking: |-
        $x^2 = 12$, en $\sqrt{12} = 2\sqrt3$.
    - opgave: |-
        $5x^2 + 1 = 21$
      antwoord: |-
        $x = \pm 2$
      uitwerking: |-
        $5x^2 = 20$, $x^2 = 4$.
    - opgave: |-
        $4x^2 + 9 = 0$
      antwoord: |-
        geen oplossingen
      uitwerking: |-
        $x^2 = -\tfrac94 < 0$.

- id: h3-o12
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    de noemer wortelvrij maken
  opgave: |-
    Maak de noemer wortelvrij en vereenvoudig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{1}{\sqrt2}$
      antwoord: |-
        $\dfrac{\sqrt2}{2}$
      uitwerking: |-
        Maal $\sqrt2$.
    - opgave: |-
        $\dfrac{12}{\sqrt3}$
      antwoord: |-
        $4\sqrt3$
      uitwerking: |-
        $\dfrac{12\sqrt3}{3}$.
    - opgave: |-
        $\dfrac{14}{\sqrt7}$
      antwoord: |-
        $2\sqrt7$
      uitwerking: |-
        $\dfrac{14\sqrt7}{7}$.
    - opgave: |-
        $\dfrac{5}{\sqrt{10}}$
      antwoord: |-
        $\dfrac{\sqrt{10}}{2}$
      uitwerking: |-
        $\dfrac{5\sqrt{10}}{10}$.
    - opgave: |-
        $\dfrac{\sqrt5}{\sqrt2}$
      antwoord: |-
        $\dfrac{\sqrt{10}}{2}$
      uitwerking: |-
        $\dfrac{\sqrt5 \cdot \sqrt2}{2}$.
    - opgave: |-
        $\dfrac{4}{3\sqrt2}$
      antwoord: |-
        $\dfrac{2\sqrt2}{3}$
      uitwerking: |-
        $\dfrac{4\sqrt2}{3 \cdot 2}$: vermenigvuldig alleen met $\sqrt2$.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    wortels vergelijken
  opgave: |-
    Rangschik van klein naar groot, zonder rekenmachine: \ $3\sqrt5$, \ $4\sqrt3$, \ $2\sqrt{11}$, \ $5\sqrt2$.
  antwoord: |-
    $2\sqrt{11} < 3\sqrt5 < 4\sqrt3 < 5\sqrt2$
  uitwerking: |-
    Breng onder het wortelteken: $\sqrt{45}$, $\sqrt{48}$, $\sqrt{44}$ en $\sqrt{50}$.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    gemengd rekenen met wortels (drill)
  opgave: |-
    Bereken en vereenvoudig zo ver mogelijk.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sqrt3 \cdot \sqrt6 + \sqrt2$
      antwoord: |-
        $4\sqrt2$
      uitwerking: |-
        $\sqrt{18} + \sqrt2 = 3\sqrt2 + \sqrt2$.
    - opgave: |-
        $\bigl(\sqrt{12} + \sqrt3\bigr) \cdot \sqrt3$
      antwoord: |-
        $9$
      uitwerking: |-
        $\sqrt{36} + 3 = 6 + 3$.
    - opgave: |-
        $\sqrt{20} \cdot \sqrt5 - \sqrt9$
      antwoord: |-
        $7$
      uitwerking: |-
        $\sqrt{100} - 3$.
    - opgave: |-
        $\bigl(3\sqrt2\bigr)^2 - \bigl(2\sqrt3\bigr)^2$
      antwoord: |-
        $6$
      uitwerking: |-
        $18 - 12$.
    - opgave: |-
        $\dfrac{\sqrt8 \cdot \sqrt6}{\sqrt3}$
      antwoord: |-
        $4$
      uitwerking: |-
        $\sqrt{\tfrac{48}{3}} = \sqrt{16}$.
    - opgave: |-
        $\dfrac{2\sqrt{27}}{\sqrt3}$
      antwoord: |-
        $6$
      uitwerking: |-
        $2\sqrt9$.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    zijde en diagonaal van een vierkant
  opgave: |-
    Een vierkant heeft een oppervlakte van $50$~cm$^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de zijde? Vereenvoudig.
      antwoord: |-
        $5\sqrt2$ cm
      uitwerking: |-
        $\sqrt{50} = 5\sqrt2 \approx 7,07$ cm.
    - opgave: |-
        Het vierkant op de diagonaal is twee keer zo groot (hoofdstuk 1). Hoe lang is de diagonaal?
      antwoord: |-
        $10$ cm
      uitwerking: |-
        Het vierkant op de diagonaal heeft oppervlakte 100, dus de diagonaal is $\sqrt{100} = 10$ cm. Ook: $\sqrt2 \cdot 5\sqrt2 = 10$.

- id: h3-o16
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    merkwaardige producten met wortels
  opgave: |-
    Werk uit met een merkwaardig product en vereenvoudig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\bigl(1 + \sqrt2\bigr)^2$
      antwoord: |-
        $3 + 2\sqrt2$
      uitwerking: |-
        $1 + 2\sqrt2 + 2$.
    - opgave: |-
        $\bigl(\sqrt3 - 1\bigr)^2$
      antwoord: |-
        $4 - 2\sqrt3$
      uitwerking: |-
        $3 - 2\sqrt3 + 1$.
    - opgave: |-
        $\bigl(\sqrt5 + 2\bigr)\bigl(\sqrt5 - 2\bigr)$
      antwoord: |-
        $1$
      uitwerking: |-
        $5 - 4$.
    - opgave: |-
        $\bigl(2\sqrt3 + \sqrt2\bigr)\bigl(2\sqrt3 - \sqrt2\bigr)$
      antwoord: |-
        $10$
      uitwerking: |-
        $12 - 2$.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten met wortels
  opgave: |-
    Jonas maakte vier fouten. Leg telkens uit wat er fout is, en verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sqrt{16 + 9} = 7$
      antwoord: |-
        $5$
      uitwerking: |-
        Er is geen regel voor de wortel van een som: $\sqrt{25} = 5$.
    - opgave: |-
        $\sqrt8 + \sqrt2 = \sqrt{10}$
      antwoord: |-
        $3\sqrt2$
      uitwerking: |-
        Wortels tel je niet op door de getallen eronder op te tellen. Vereenvoudig: $2\sqrt2 + \sqrt2 = 3\sqrt2$.
    - opgave: |-
        $2\sqrt3 \cdot 3\sqrt3 = 6\sqrt3$
      antwoord: |-
        $18$
      uitwerking: |-
        Ook de wortels worden vermenigvuldigd: $6 \cdot \sqrt3 \cdot \sqrt3 = 6 \cdot 3$.
    - opgave: |-
        $\sqrt{-9} = -3$
      antwoord: |-
        bestaat niet
      uitwerking: |-
        $(-3)^2 = 9$. Geen reëel getal heeft $-9$ als kwadraat.

- id: h3-o18
  soort: opdracht
  niveau: 2
  thema: |-
    vierkantswortel in een context: omheining
  opgave: |-
    Een vierkant weiland heeft een oppervlakte van $2$ ha ($20\,000$~m$^2$). Hoeveel meter omheining is er nodig? Geef de exacte waarde, vereenvoudigd, en een benadering tot op 1 m.
  antwoord: |-
    $400\sqrt2$ m $\approx 566$ m
  uitwerking: |-
    De zijde is $\sqrt{20\,000} = \sqrt{10\,000 \cdot 2} = 100\sqrt2$ m. De omtrek is $4 \cdot 100\sqrt2 = 400\sqrt2 \approx 565,7$ m.

- id: h3-o19
  pakketten: [4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    de vierkantswortel van een kwadraat
  opgave: |-
    Vereenvoudig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sqrt{(-7)^2}$
      antwoord: |-
        $7$
      uitwerking: |-
        $\abs{-7}$.
    - opgave: |-
        $\sqrt{(3 - \pi)^2}$
      antwoord: |-
        $\pi - 3$
      uitwerking: |-
        $3 - \pi < 0$.
    - opgave: |-
        $\sqrt{x^2}$, als $x < 0$
      antwoord: |-
        $-x$
      uitwerking: |-
        $\abs{x} = -x$ voor $x < 0$; dat is positief.

- id: h3-o20
  soort: opdracht
  niveau: 2
  thema: |-
    een gelijkheid met wortels aantonen
  opgave: |-
    Toon zonder rekenmachine aan dat $\sqrt8 + \sqrt2 = \sqrt{18}$.
  antwoord: |-
    beide zijn $3\sqrt2$
  uitwerking: |-
    $\sqrt8 + \sqrt2 = 2\sqrt2 + \sqrt2 = 3\sqrt2$ en $\sqrt{18} = 3\sqrt2$.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    $x^2 = a$ in een context: vijver
  opgave: |-
    Een cirkelvormige vijver heeft een oppervlakte van $20$~m$^2$. Bereken de straal, tot op 1 cm. Gebruik de formule voor de oppervlakte van een cirkel, $\pi r^2$.
  antwoord: |-
    $2,52$ m
  uitwerking: |-
    $\pi r^2 = 20$, dus $r^2 = \tfrac{20}{\pi} \approx 6,366$ en $r = \sqrt{\tfrac{20}{\pi}} \approx 2,52$ m. De negatieve oplossing valt weg: een straal is positief.

- id: h3-o22
  soort: opdracht
  niveau: 3
  thema: |-
    zijde en oppervlakte van een vierkant
  opgave: |-
    Een vierkant heeft zijde 5.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de zijde van een vierkant dat drie keer zo groot is? Vereenvoudig.
      antwoord: |-
        $5\sqrt3$
      uitwerking: |-
        Oppervlakte $75$, zijde $\sqrt{75} = 5\sqrt3$.
    - opgave: |-
        Hoeveel keer zo groot moet de oppervlakte worden om de zijde te verdubbelen?
      antwoord: |-
        4 keer
      uitwerking: |-
        Zijde 10 geeft oppervlakte 100: vier keer 25.
    - opgave: |-
        Het vierkant wordt $n$ keer zo groot. Voor welke $n$ is de nieuwe zijde een natuurlijk getal?
      antwoord: |-
        als $n$ een kwadraat is
      uitwerking: |-
        De nieuwe zijde is $\sqrt{25n} = 5\sqrt n$. Die is natuurlijk als $\sqrt n$ natuurlijk is, dus voor $n = 1, 4, 9, 16, \ldots$
        (Breuken zoals $n = \tfrac{4}{25}$ geven ook een natuurlijk getal, maar dan wordt het vierkant kleiner.)

- id: h3-o23
  soort: opdracht
  niveau: 3
  thema: |-
    wortels vergelijken door te kwadrateren
  opgave: |-
    Is $\sqrt2 + \sqrt3$ groter dan, kleiner dan of gelijk aan $\sqrt5$? Beslis zonder rekenmachine. Kwadrateer beide getallen.
  antwoord: |-
    groter
  uitwerking: |-
    $\bigl(\sqrt2 + \sqrt3\bigr)^2 = 2 + 2\sqrt6 + 3 = 5 + 2\sqrt6$, en dat is groter dan $\bigl(\sqrt5\bigr)^2 = 5$. Beide getallen zijn positief, dus het getal met het grootste kwadraat is het grootste: $\sqrt2 + \sqrt3 > \sqrt5$. Zonder merkwaardig product: $\sqrt2 + \sqrt3 > 1 + 1{,}7 = 2{,}7$, en $\sqrt5 < 2{,}3$.

- id: h3-o24
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 3
  thema: |-
    een wortel in een wortel
  opgave: |-
    Toon aan dat $\sqrt{2 + \sqrt3} = \dfrac{\sqrt6 + \sqrt2}{2}$. Kwadrateer het rechterlid.
  antwoord: |-
    het kwadraat van het rechterlid is $2 + \sqrt3$
  uitwerking: |-
    $\Bigl(\dfrac{\sqrt6 + \sqrt2}{2}\Bigr)^2 = \dfrac{6 + 2\sqrt{12} + 2}{4} = \dfrac{8 + 4\sqrt3}{4} = 2 + \sqrt3$. Het rechterlid is positief en heeft $2 + \sqrt3$ als kwadraat, dus het is $\sqrt{2 + \sqrt3}$.

- id: h3-o25
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    de noemer wortelvrij maken met de toegevoegde
  opgave: |-
    Maak de noemer wortelvrij en vereenvoudig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{1}{\sqrt2 + 1}$
      antwoord: |-
        $\sqrt2 - 1$
      uitwerking: |-
        Maal $\sqrt2 - 1$: de noemer wordt $2 - 1 = 1$.
    - opgave: |-
        $\dfrac{4}{3 - \sqrt5}$
      antwoord: |-
        $3 + \sqrt5$
      uitwerking: |-
        Maal $3 + \sqrt5$: $\dfrac{4(3 + \sqrt5)}{9 - 5}$.
    - opgave: |-
        $\dfrac{\sqrt3 + 1}{\sqrt3 - 1}$
      antwoord: |-
        $2 + \sqrt3$
      uitwerking: |-
        Maal $\sqrt3 + 1$: $\dfrac{(\sqrt3 + 1)^2}{3 - 1} = \dfrac{4 + 2\sqrt3}{2}$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Bereken zonder rekenmachine, als het bestaat.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\sqrt{0,64}$
      antwoord: |-
        $0,8$
      uitwerking: |-
        $0,8^2 = 0,64$.
    - opgave: |-
        $\sqrt{\tfrac{49}{100}}$
      antwoord: |-
        $\tfrac{7}{10}$
      uitwerking: |-
        $\bigl(\tfrac{7}{10}\bigr)^2 = \tfrac{49}{100}$.
    - opgave: |-
        $-\sqrt{121}$
      antwoord: |-
        $-11$
      uitwerking: |-
        $\sqrt{121} = 11$.
    - opgave: |-
        $\sqrt{-4}$
      antwoord: |-
        bestaat niet
      uitwerking: |-
        Geen kwadraat is negatief.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 = 20$
      antwoord: |-
        $x = \pm 2\sqrt5$
      uitwerking: |-
        $x = \pm\sqrt{20} = \pm 2\sqrt5$.
    - opgave: |-
        $x^2 + 4 = 0$
      antwoord: |-
        geen oplossingen
      uitwerking: |-
        $x^2 = -4$.

- id: h3-t3
  soort: test
  niveau: 1
  opgave: |-
    Vereenvoudig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sqrt{63}$
      antwoord: |-
        $3\sqrt7$
      uitwerking: |-
        $\sqrt{9 \cdot 7}$.
    - opgave: |-
        $\sqrt{180}$
      antwoord: |-
        $6\sqrt5$
      uitwerking: |-
        $\sqrt{36 \cdot 5}$.

- id: h3-t4
  soort: test
  niveau: 2
  opgave: |-
    Vereenvoudig $\sqrt{75} - \sqrt{12} + \sqrt{27}$.
  antwoord: |-
    $6\sqrt3$
  uitwerking: |-
    $5\sqrt3 - 2\sqrt3 + 3\sqrt3 = 6\sqrt3$.

- id: h3-t5
  soort: test
  niveau: 2
  opgave: |-
    Werk uit en vereenvoudig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2\sqrt6 \cdot 3\sqrt2$
      antwoord: |-
        $12\sqrt3$
      uitwerking: |-
        $6\sqrt{12} = 6 \cdot 2\sqrt3$.
    - opgave: |-
        $\sqrt5\,\bigl(\sqrt5 - 2\bigr)$
      antwoord: |-
        $5 - 2\sqrt5$
      uitwerking: |-
        Distributiviteit.

- id: h3-t6
  pakketten: [1]
  soort: test
  niveau: 2
  opgave: |-
    Rangschik van klein naar groot, zonder rekenmachine: \ $2\sqrt7$, \ $3\sqrt3$, \ $5$.
  antwoord: |-
    $5 < 3\sqrt3 < 2\sqrt7$
  uitwerking: |-
    Onder het wortelteken: $\sqrt{28}$, $\sqrt{27}$ en $5 = \sqrt{25}$.

- id: h3-t6
  pakketten: [2, 3, 4, 5]
  soort: test
  niveau: 2
  opgave: |-
    Maak de noemer wortelvrij.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{12}{\sqrt6}$
      antwoord: |-
        $2\sqrt6$
      uitwerking: |-
        $\dfrac{12\sqrt6}{6}$.
    - opgave: |-
        $\dfrac{\sqrt5}{\sqrt2}$
      antwoord: |-
        $\dfrac{\sqrt{10}}{2}$
      uitwerking: |-
        $\dfrac{\sqrt5 \cdot \sqrt2}{2}$.

- id: h3-t7
  soort: test
  niveau: 2
  opgave: |-
    Een vierkante foto heeft een oppervlakte van $72$~cm$^2$. Hoe lang is de zijde? Geef de exacte waarde, vereenvoudigd, en een benadering tot op 1 mm.
  antwoord: |-
    $6\sqrt2$ cm $\approx 8,5$ cm
  uitwerking: |-
    $\sqrt{72} = \sqrt{36 \cdot 2} = 6\sqrt2 \approx 8,49$ cm, dus $8,5$ cm.
