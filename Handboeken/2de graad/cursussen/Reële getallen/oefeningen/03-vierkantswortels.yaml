  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\sqrt{30}$
      antwoord: |-
        $5$ en $6$
      uitwerking: |-
        $25 < 30 < 36$.
    - opgave: |-
        $\sqrt{90}$
      antwoord: |-
        $9$ en $10$
      uitwerking: |-
        $81 < 90 < 100$.
    - opgave: |-
        $\sqrt{150}$
      antwoord: |-
        $12$ en $13$
      uitwerking: |-
        $144 < 150 < 169$.
    - opgave: |-
        $-\sqrt{10}$
      antwoord: |-
        $-4$ en $-3$
      uitwerking: |-
        $3 < \sqrt{10} < 4$, dus $-4 < -\sqrt{10} < -3$.

