  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\sqrt{12}$
      antwoord: |-
        $2\sqrt3$
      uitwerking: |-
        $\sqrt{4 \cdot 3}$.
    - opgave: |-
        $\sqrt{50}$
      antwoord: |-
        $5\sqrt2$
      uitwerking: |-
        $\sqrt{25 \cdot 2}$.
    - opgave: |-
        $\sqrt{48}$
      antwoord: |-
        $4\sqrt3$
      uitwerking: |-
        $\sqrt{16 \cdot 3}$.
    - opgave: |-
        $\sqrt{180}$
      antwoord: |-
        $6\sqrt5$
      uitwerking: |-
        $\sqrt{36 \cdot 5}$.

- id: h3-som
  soort: kort
  opgave: |-
    Vereenvoudig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $4\sqrt7 - \sqrt7$
      antwoord: |-
        $3\sqrt7$
      uitwerking: |-
        $4 - 1 = 3$.
    - opgave: |-
        $\sqrt{12} + \sqrt{75}$
      antwoord: |-
        $7\sqrt3$
      uitwerking: |-
        $2\sqrt3 + 5\sqrt3$.
    - opgave: |-
        $\sqrt{20} - \sqrt{45} + \sqrt3$
      antwoord: |-
        $-\sqrt5 + \sqrt3$
      uitwerking: |-
        $2\sqrt5 - 3\sqrt5 + \sqrt3$: $\sqrt3$ is niet gelijksoortig.

- id: h3-maal
  soort: kort
  opgave: |-
    Werk uit en vereenvoudig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3\sqrt2 \cdot 4\sqrt2$
      antwoord: |-
        $24$
      uitwerking: |-
        $12 \cdot 2 = 24$.
    - opgave: |-
        $\sqrt6 \cdot 2\sqrt{10}$
      antwoord: |-
        $4\sqrt{15}$
      uitwerking: |-
        $2\sqrt{60} = 2 \cdot 2\sqrt{15}$.
    - opgave: |-
        $\sqrt3\,\bigl(\sqrt3 - 5\bigr)$
      antwoord: |-
        $3 - 5\sqrt3$
      uitwerking: |-
        $\sqrt3 \cdot \sqrt3 - 5\sqrt3$.

- id: h3-noemer
  pakketten: [2, 3, 4, 5]
  soort: kort
  opgave: |-
    Maak de noemer wortelvrij.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{10}{\sqrt5}$
      antwoord: |-
        $2\sqrt5$
      uitwerking: |-
        $\dfrac{10\sqrt5}{5}$.
    - opgave: |-
        $\dfrac{3}{\sqrt6}$
      antwoord: |-
        $\dfrac{\sqrt6}{2}$
      uitwerking: |-
        $\dfrac{3\sqrt6}{6}$.
    - opgave: |-
        $\dfrac{\sqrt2}{\sqrt3}$
      antwoord: |-
        $\dfrac{\sqrt6}{3}$
      uitwerking: |-
        $\dfrac{\sqrt2 \cdot \sqrt3}{3}$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    de vierkantswortel berekenen
  opgave: |-
    Bereken zonder rekenmachine, als het bestaat.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\sqrt{81}$
      antwoord: |-
        $9$
    - opgave: |-
        $\sqrt{0,25}$
      antwoord: |-
        $0,5$
    - opgave: |-
        $\sqrt{\tfrac{9}{64}}$
      antwoord: |-
        $\tfrac38$
    - opgave: |-
        $\sqrt{1,44}$
      antwoord: |-
        $1,2$
    - opgave: |-
        $\sqrt0$
      antwoord: |-
        $0$
    - opgave: |-
        $-\sqrt{49}$
      antwoord: |-
        $-7$
    - opgave: |-
        $\sqrt{10^6}$
      antwoord: |-
        $1000$
    - opgave: |-
        $\sqrt{0,0001}$
      antwoord: |-
        $0,01$
    - opgave: |-
        $\sqrt{4 \cdot 25}$
      antwoord: |-
        $10$
    - opgave: |-
        $\sqrt{-36}$
      antwoord: |-
        bestaat niet
    - opgave: |-
        $\sqrt{\tfrac{1}{100}}$
      antwoord: |-
        $\tfrac{1}{10}$
    - opgave: |-
        $\bigl(\sqrt7\bigr)^2$
      antwoord: |-
        $7$
  uitwerking: |-
    Zoek telkens een getal dat niet negatief is en het goede kwadraat heeft: $1,2^2 = 1,44$, $1000^2 = 10^6$, $0,01^2 = 0,0001$. $\sqrt{-36}$ bestaat niet, want geen kwadraat is negatief. $\bigl(\sqrt7\bigr)^2 = 7$ volgens de definitie.

