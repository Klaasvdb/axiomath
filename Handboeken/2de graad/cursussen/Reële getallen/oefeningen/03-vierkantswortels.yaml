      antwoord: |-
        $7$
      uitwerking: |-
        $\sqrt{49} = 7$.
    - opgave: |-
        $\sqrt{\dfrac{9}{64}}$
      antwoord: |-
        $\dfrac38$
      uitwerking: |-
        $\dfrac{\sqrt9}{\sqrt{64}}$.

- id: h3-somfout
  soort: kort
  opgave: |-
    Juist of fout? Controleer met een berekening.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sqrt{36 + 64} = 6 + 8$
      antwoord: |-
        fout
      uitwerking: |-
        $\sqrt{100} = 10$, maar $6 + 8 = 14$.
    - opgave: |-
        $\sqrt{36 \cdot 64} = 6 \cdot 8$
      antwoord: |-
        juist
      uitwerking: |-
        $\sqrt{2304} = 48 = 6 \cdot 8$.
    - opgave: |-
        $\sqrt{25 - 9} = 5 - 3$
      antwoord: |-
        fout
      uitwerking: |-
        $\sqrt{16} = 4$, maar $5 - 3 = 2$.

- id: h3-vereenv
  soort: kort
  opgave: |-
