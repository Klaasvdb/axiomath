  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sqrt{25} = \pm 5$
      antwoord: |-
        fout: $5$
      uitwerking: |-
        Een vierkantswortel is nooit negatief. De vergelijking $x^2 = 25$ heeft wel twee oplossingen.
    - opgave: |-
        $\sqrt{16 + 9} = 4 + 3$
      antwoord: |-
        fout: $5$
      uitwerking: |-
        $\sqrt{25} = 5$; geen regel voor een som.
