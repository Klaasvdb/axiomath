# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.
# pakketten: gemengd repeterende getallen alleen in 2-5, bewijzen uit het ongerijmde alleen in 5.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Uit het hoofd.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Schrijf $\tfrac34$ als decimaal getal.
      antwoord: |-
        $0,75$
      uitwerking: |-
        $\tfrac34 = \tfrac{75}{100} = 0,75$.
    - opgave: |-
        Schrijf $0,4$ als onvereenvoudigbare breuk.
      antwoord: |-
        $\tfrac25$
      uitwerking: |-
        $0,4 = \tfrac{4}{10} = \tfrac25$.
    - opgave: |-
        Vereenvoudig $\tfrac{18}{24}$.
      antwoord: |-
        $\tfrac34$
      uitwerking: |-
        Deel teller en noemer door 6.
    - opgave: |-
        Welk getal is groter: $-5$ of $-8$?
      antwoord: |-
        $-5$
      uitwerking: |-
        $-5$ ligt rechts van $-8$ op de getallenas.
    - opgave: |-
        Ontbind 60 in priemfactoren.
      antwoord: |-
        $2 \cdot 2 \cdot 3 \cdot 5$
      uitwerking: |-
        $60 = 2 \cdot 30 = 2 \cdot 2 \cdot 15 = 2 \cdot 2 \cdot 3 \cdot 5$.
    - opgave: |-
        Bereken $1,4 \cdot 1,4$.
      antwoord: |-
        $1,96$
      uitwerking: |-
        $14 \cdot 14 = 196$, en er komen twee cijfers na de komma.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad We schrijven $\tfrac17$ als decimaal getal.
  lijst: enumerate
  delen:
    - opgave: |-
        Deel 1 door 7 op papier, tot je acht cijfers na de komma hebt. Noteer bij elke stap de rest.
      antwoord: |-
        $0,14285714$; resten $3, 2, 6, 4, 5, 1, 3, 2$
      uitwerking: |-
        $10 = 1 \cdot 7 + 3$, $30 = 4 \cdot 7 + 2$, $20 = 2 \cdot 7 + 6$, $60 = 8 \cdot 7 + 4$, $40 = 5 \cdot 7 + 5$, $50 = 7 \cdot 7 + 1$, en dan begint het opnieuw met $10$.
    - opgave: |-
        Welke resten kunnen er voorkomen bij een deling door 7?
      antwoord: |-
        $0, 1, 2, 3, 4, 5, 6$
      uitwerking: |-
        Een rest is altijd kleiner dan de deler 7.
    - opgave: |-
        Wat gebeurt er met de cijfers zodra een rest terugkomt?
      antwoord: |-
        ze herhalen zich
      uitwerking: |-
        Vanaf dezelfde rest doe je precies dezelfde stappen opnieuw, dus komen dezelfde cijfers terug: $\tfrac17 = 0,142857\,142857\ldots$
    - opgave: |-
        Wat toont je rekenmachine voor $1 : 7$? Zie je daar ook dat de cijfers terugkomen?
      antwoord: |-
        $0,1428571429$; nauwelijks
      uitwerking: |-
        De rekenmachine toont ongeveer tien cijfers en rondt het laatste af. Je ziet net één keer het blok 142857, en het begin van een tweede.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h1-deling
  soort: kort
  opgave: |-
    Schrijf als decimaal getal. Zet een streep boven de periode.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\tfrac38$
      antwoord: |-
        $0,375$
      uitwerking: |-
        De deling stopt: $3 : 8 = 0,375$.
    - opgave: |-
        $\tfrac{5}{11}$
      antwoord: |-
        $0,\overline{45}$
      uitwerking: |-
        $50 = 4 \cdot 11 + 6$, $60 = 5 \cdot 11 + 5$: rest 5 komt terug.
    - opgave: |-
        $\tfrac76$
      antwoord: |-
        $1,1\overline{6}$
      uitwerking: |-
        $7 : 6 = 1$ rest 1; $10 = 1 \cdot 6 + 4$; $40 = 6 \cdot 6 + 4$: rest 4 komt terug.
    - opgave: |-
        $\tfrac{5}{37}$
      antwoord: |-
        $0,\overline{135}$
      uitwerking: |-
        $50 = 1 \cdot 37 + 13$, $130 = 3 \cdot 37 + 19$, $190 = 5 \cdot 37 + 5$: rest 5 komt terug.

- id: h1-begrensd
  soort: kort
  opgave: |-
    Is de decimale vorm begrensd of repeterend? Beslis zonder te delen, en controleer daarna met de rekenmachine.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\tfrac{3}{20}$
      antwoord: |-
        begrensd
      uitwerking: |-
        $20 = 2 \cdot 2 \cdot 5$. Inderdaad: $0,15$.
    - opgave: |-
        $\tfrac{4}{15}$
      antwoord: |-
        repeterend
      uitwerking: |-
        $15 = 3 \cdot 5$, met de factor 3: $0,2\overline{6}$.
    - opgave: |-
        $\tfrac{7}{16}$
      antwoord: |-
        begrensd
      uitwerking: |-
        $16 = 2 \cdot 2 \cdot 2 \cdot 2$: $0,4375$.
    - opgave: |-
        $\tfrac{15}{24}$
      antwoord: |-
        begrensd
      uitwerking: |-
        Vereenvoudig eerst: $\tfrac{15}{24} = \tfrac58$, en $8 = 2 \cdot 2 \cdot 2$: $0,625$.

- id: h1-zuiver
  soort: kort
  opgave: |-
    Schrijf als onvereenvoudigbare breuk.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $0,\overline{5}$
      antwoord: |-
        $\tfrac59$
      uitwerking: |-
        $10x - x = 5$, dus $9x = 5$ en $x = \tfrac59$.
    - opgave: |-
        $0,\overline{18}$
      antwoord: |-
        $\tfrac{2}{11}$
      uitwerking: |-
        $100x - x = 18$, dus $x = \tfrac{18}{99} = \tfrac{2}{11}$.
    - opgave: |-
        $2,\overline{6}$
      antwoord: |-
        $\tfrac83$
      uitwerking: |-
        $10x - x = 26,\overline{6} - 2,\overline{6} = 24$, dus $x = \tfrac{24}{9} = \tfrac83$.

- id: h1-gemengdbreuk
  pakketten: [2, 3, 4, 5]
  soort: kort
  opgave: |-
    Schrijf als onvereenvoudigbare breuk.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $0,8\overline{3}$
      antwoord: |-
        $\tfrac56$
      uitwerking: |-
        $100x = 83,\overline{3}$ en $10x = 8,\overline{3}$, dus $90x = 75$ en $x = \tfrac{75}{90} = \tfrac56$.
    - opgave: |-
        $0,1\overline{36}$
      antwoord: |-
        $\tfrac{3}{22}$
      uitwerking: |-
        $1000x = 136,\overline{36}$ en $10x = 1,\overline{36}$, dus $990x = 135$ en $x = \tfrac{135}{990} = \tfrac{3}{22}$.

- id: h1-soort
  soort: kort
  opgave: |-
    Is het getal rationaal of irrationaal?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sqrt{49}$
      antwoord: |-
        rationaal
      uitwerking: |-
        $\sqrt{49} = 7$.
    - opgave: |-
        $\sqrt{50}$
      antwoord: |-
        irrationaal
      uitwerking: |-
        50 is geen kwadraat van een natuurlijk getal ($7^2 = 49$, $8^2 = 64$).
    - opgave: |-
        $0,\overline{142857}$
      antwoord: |-
        rationaal
      uitwerking: |-
        Repeterend, dus een breuk (het is $\tfrac17$).
    - opgave: |-
        $0,123456789101112\ldots$ (alle natuurlijke getallen na elkaar)
      antwoord: |-
        irrationaal
      uitwerking: |-
        Er komt geen blok steeds terug: de getallen worden steeds langer.

- id: h1-as
  soort: kort
  opgave: |-
    Neem een getallenas met als eenheid 2 cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken met de passer de punten $\sqrt2$ en $-\sqrt2$.
      antwoord: |-
        zie de figuur
      uitwerking: |-
        Teken het vierkant van 0 tot 1 en draai de diagonaal naar rechts en naar links.
        \figuren{\begin{tikzpicture}[x=1cm,y=1cm]
          \getallenas{-2}{2}
          \draw[accent,thick] (0,0) rectangle (1,1);
          \draw[accent,very thick] (0,0) -- (1,1);
          \draw[grijs,dashed] (1.4142,0) arc[start angle=0,end angle=180,radius=1.4142];
          \aspunt[below=6pt]{1.4142}{\sqrt2}
          \aspunt[below=6pt]{-1.4142}{-\sqrt2}
        \end{tikzpicture}}
    - opgave: |-
        Teken een vierkant met zijde 2, van 0 tot 2. Welke oppervlakte heeft het vierkant op zijn diagonaal? Welk punt vind je als je die diagonaal naar de getallenas draait? Tussen welke twee gehele getallen ligt het?
      antwoord: |-
        oppervlakte 8, het punt $\sqrt8$, tussen 2 en 3
      uitwerking: |-
        Het vierkant op de diagonaal bestaat uit vier halve vierkanten van oppervlakte 4: samen 8. De diagonaal $d$ heeft dus $d^2 = 8$, en $d = \sqrt8 \approx 2,83$, want $2^2 = 4 < 8 < 9 = 3^2$.

- id: h1-orde
  soort: kort
  opgave: |-
    Vul in met $<$, $>$ of $=$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sqrt3 \ \ldots \ 1,\overline{73}$
      antwoord: |-
        $<$
      uitwerking: |-
        $\sqrt3 = 1,7320\ldots$ en $1,\overline{73} = 1,7373\ldots$: het derde cijfer na de komma beslist.
    - opgave: |-
        $-0,5 \ \ldots \ {-0,49}$
      antwoord: |-
        $<$
      uitwerking: |-
        $-0,5$ ligt verder van 0, dus meer naar links.
    - opgave: |-
        $\tfrac38 \ \ldots \ 0,375$
      antwoord: |-
        $=$
      uitwerking: |-
        $3 : 8 = 0,375$.
    - opgave: |-
        $-\pi \ \ldots \ {-3,14}$
      antwoord: |-
        $<$
      uitwerking: |-
        $\pi = 3,1415\ldots > 3,14$, dus $-\pi$ ligt verder links.

- id: h1-tussen
  soort: kort
  opgave: |-
    Zoek een rationaal en een irrationaal getal tussen de twee getallen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $0,5$ en $0,51$
      antwoord: |-
        bv. $0,505$ en $0,5050050005\ldots$
      uitwerking: |-
        $0,505$ is het midden. Een irrationaal getal: plak achter $0,50$ een staart zonder periode, zoals $0,5050050005\ldots$
    - opgave: |-
        $2,2$ en $2,3$
      antwoord: |-
        bv. $2,25$ en $\sqrt5$
      uitwerking: |-
        $\sqrt5 = 2,236\ldots$, want $2,2^2 = 4,84 < 5 < 5,29 = 2,3^2$.

- id: h1-abs
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\abs{-8} + \abs{3}$
      antwoord: |-
        $11$
      uitwerking: |-
        $8 + 3 = 11$.
    - opgave: |-
        $\abs{3 - 10}$
      antwoord: |-
        $7$
      uitwerking: |-
        $\abs{-7} = 7$.
    - opgave: |-
        $-\abs{-1,5} + \Abs{\tfrac12}$
      antwoord: |-
        $-1$
      uitwerking: |-
        $-1,5 + 0,5 = -1$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    breuk naar decimaal getal
  opgave: |-
    Schrijf als decimaal getal. Zet een streep boven de periode.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\tfrac78$
      antwoord: |-
        $0,875$
    - opgave: |-
        $\tfrac56$
      antwoord: |-
        $0,8\overline{3}$
    - opgave: |-
        $\tfrac{8}{11}$
      antwoord: |-
        $0,\overline{72}$
    - opgave: |-
        $\tfrac{13}{20}$
      antwoord: |-
        $0,65$
    - opgave: |-
        $\tfrac29$
      antwoord: |-
        $0,\overline{2}$
    - opgave: |-
        $\tfrac{17}{12}$
      antwoord: |-
        $1,41\overline{6}$
    - opgave: |-
        $-\tfrac94$
      antwoord: |-
        $-2,25$
    - opgave: |-
        $\tfrac{1}{27}$
      antwoord: |-
        $0,\overline{037}$
    - opgave: |-
        $\tfrac{11}{7}$
      antwoord: |-
        $1,\overline{571428}$
  uitwerking: |-
    Deel telkens de teller door de noemer. Bij $\tfrac{1}{27}$: $100 = 3 \cdot 27 + 19$, $190 = 7 \cdot 27 + 1$, en rest 1 is de start: $0,037\,037\ldots$ Bij $\tfrac{11}{7}$: $1$ rest $4$, en dan de cijfers van $\tfrac47 = 0,\overline{571428}$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    rationaal of irrationaal
  opgave: |-
    Is het getal rationaal of irrationaal?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\tfrac34$
      antwoord: |-
        rationaal
      uitwerking: |-
        Een breuk.
    - opgave: |-
        $\sqrt{16}$
      antwoord: |-
        rationaal
      uitwerking: |-
        $\sqrt{16} = 4$.
    - opgave: |-
        $\sqrt7$
      antwoord: |-
        irrationaal
      uitwerking: |-
        7 is geen kwadraat van een natuurlijk getal.
    - opgave: |-
        $0,\overline{25}$
      antwoord: |-
        rationaal
      uitwerking: |-
        Repeterend (het is $\tfrac{25}{99}$).
    - opgave: |-
        $\pi$
      antwoord: |-
        irrationaal
      uitwerking: |-
        $\pi$ is irrationaal (dat bewijzen we hier niet).
    - opgave: |-
        $-12$
      antwoord: |-
        rationaal
      uitwerking: |-
        $-12 = \tfrac{-12}{1}$.
    - opgave: |-
        $0,1010010001\ldots$
      antwoord: |-
        irrationaal
      uitwerking: |-
        Telkens een nul meer: geen periode.
    - opgave: |-
        $3,1416$
      antwoord: |-
        rationaal
      uitwerking: |-
        Begrensd: $\tfrac{31\,416}{10\,000}$. Het is een benadering van $\pi$, niet $\pi$ zelf.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    decimaal getal naar breuk
  opgave: |-
    Schrijf als onvereenvoudigbare breuk.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $0,35$
      antwoord: |-
        $\tfrac{7}{20}$
      uitwerking: |-
        $\tfrac{35}{100} = \tfrac{7}{20}$.
    - opgave: |-
        $0,\overline{7}$
      antwoord: |-
        $\tfrac79$
      uitwerking: |-
        $10x - x = 7$, dus $x = \tfrac79$.
    - opgave: |-
        $0,\overline{45}$
      antwoord: |-
        $\tfrac{5}{11}$
      uitwerking: |-
        $100x - x = 45$, dus $x = \tfrac{45}{99} = \tfrac{5}{11}$.
    - opgave: |-
        $1,\overline{3}$
      antwoord: |-
        $\tfrac43$
      uitwerking: |-
        $10x - x = 13,\overline{3} - 1,\overline{3} = 12$, dus $x = \tfrac{12}{9} = \tfrac43$.
    - opgave: |-
        $2,125$
      antwoord: |-
        $\tfrac{17}{8}$
      uitwerking: |-
        $\tfrac{2125}{1000} = \tfrac{17}{8}$ (deel door 125).
    - opgave: |-
        $0,\overline{123}$
      antwoord: |-
        $\tfrac{41}{333}$
      uitwerking: |-
        $1000x - x = 123$, dus $x = \tfrac{123}{999} = \tfrac{41}{333}$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    ordenen
  opgave: |-
    Vul in met $<$, $>$ of $=$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $-3,2 \ \ldots \ {-3,12}$
      antwoord: |-
        $<$
      uitwerking: |-
        $3,2 > 3,12$, dus $-3,2$ ligt verder links.
    - opgave: |-
        $0,\overline{6} \ \ldots \ 0,67$
      antwoord: |-
        $<$
      uitwerking: |-
        $0,666\ldots < 0,670$.
    - opgave: |-
        $\tfrac57 \ \ldots \ 0,71$
      antwoord: |-
        $>$
      uitwerking: |-
        $\tfrac57 = 0,714\ldots$
    - opgave: |-
        $\sqrt2 \ \ldots \ 1,41$
      antwoord: |-
        $>$
      uitwerking: |-
        $\sqrt2 = 1,4142\ldots$
    - opgave: |-
        $-\tfrac13 \ \ldots \ {-0,3}$
      antwoord: |-
        $<$
      uitwerking: |-
        $-\tfrac13 = -0,333\ldots$ ligt verder van 0.
    - opgave: |-
        $\pi \ \ldots \ 3,14$
      antwoord: |-
        $>$
      uitwerking: |-
        $\pi = 3,1415\ldots$
    - opgave: |-
        $0,\overline{9} \ \ldots \ 1$
      antwoord: |-
        $=$
      uitwerking: |-
        $10x - x = 9$, dus $x = 1$.
    - opgave: |-
        $-\sqrt2 \ \ldots \ {-1,4}$
      antwoord: |-
        $<$
      uitwerking: |-
        $\sqrt2 > 1,4$, dus $-\sqrt2$ ligt verder links.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    getallenverzamelingen
  opgave: |-
    Tot welke verzamelingen behoort het getal: $\N$, $\Z$, $\Q$, $\R$?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $7$
      antwoord: |-
        $\N, \Z, \Q, \R$
      uitwerking: |-
        Een natuurlijk getal zit in alle vier.
    - opgave: |-
        $-4$
      antwoord: |-
        $\Z, \Q, \R$
      uitwerking: |-
        Negatief, dus niet in $\N$.
    - opgave: |-
        $\tfrac25$
      antwoord: |-
        $\Q, \R$
      uitwerking: |-
        Een breuk die geen geheel getal is.
    - opgave: |-
        $\sqrt{25}$
      antwoord: |-
        $\N, \Z, \Q, \R$
      uitwerking: |-
        $\sqrt{25} = 5$.
    - opgave: |-
        $-\sqrt3$
      antwoord: |-
        $\R$
      uitwerking: |-
        Irrationaal.
    - opgave: |-
        $0,\overline{1}$
      antwoord: |-
        $\Q, \R$
      uitwerking: |-
        Repeterend: $\tfrac19$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    absolute waarde
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\abs{-7}$
      antwoord: |-
        $7$
    - opgave: |-
        $\abs{3,5 - 8}$
      antwoord: |-
        $4,5$
    - opgave: |-
        $-\abs{-2}$
      antwoord: |-
        $-2$
    - opgave: |-
        $\abs{-3} + \abs{5}$
      antwoord: |-
        $8$
    - opgave: |-
        $\abs{-3 + 5}$
      antwoord: |-
        $2$
    - opgave: |-
        $\abs{2 - 9} - \abs{9 - 2}$
      antwoord: |-
        $0$
  uitwerking: |-
    Bereken eerst wat tussen de strepen staat: $\abs{3,5 - 8} = \abs{-4,5} = 4,5$; $-\abs{-2} = -2$, want het minteken staat buiten de strepen; $\abs{-3} + \abs{5} = 3 + 5$, maar $\abs{-3 + 5} = \abs{2} = 2$; en $\abs{2 - 9} = \abs{9 - 2} = 7$.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    getallenas aflezen
  opgave: |-
    Welk getal hoort bij het punt? Schrijf het als breuk en als decimaal getal.
  figuur:
    code: |-
      \begin{tikzpicture}[x=1.5cm,font=\scriptsize]
        \draw[->,grijs] (-2.3,0) -- (2.4,0);
        \foreach \t in {-2,-1.75,...,2}{\draw[grijs] (\t,-.06) -- (\t,.06);}
        \foreach \t in {-2,-1,0,1,2}{\draw[grijs] (\t,-.12) -- (\t,.12); \node[below=3pt] at (\t,-.08) {$\t$};}
        \fill[accent] (-1.75,0) circle (2pt) node[above=2pt,text=black] {$A$};
        \fill[accent] (-.5,0) circle (2pt) node[above=2pt,text=black] {$B$};
        \fill[accent] (.25,0) circle (2pt) node[above=2pt,text=black] {$C$};
        \fill[accent] (1.25,0) circle (2pt) node[above=2pt,text=black] {$D$};
      \end{tikzpicture}
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $A$
      antwoord: |-
        $-\tfrac74 = -1,75$
    - opgave: |-
        $B$
      antwoord: |-
        $-\tfrac12 = -0,5$
    - opgave: |-
        $C$
      antwoord: |-
        $\tfrac14 = 0,25$
    - opgave: |-
        $D$
      antwoord: |-
        $\tfrac54 = 1,25$
  uitwerking: |-
    Tussen twee gehele getallen staan vier stukjes, dus elk streepje is $\tfrac14 = 0,25$. $A$ ligt drie streepjes links van $-1$, dus $-1 - \tfrac34 = -\tfrac74$.

- id: h1-o8
  soort: opdracht
  niveau: 1
  thema: |-
    getallen op de getallenas
  opgave: |-
    Teken een getallenas met als eenheid 3 cm, van $-2$ tot $2$, en zet deze getallen erop.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $-1,5$
      antwoord: |-
        zie de figuur
    - opgave: |-
        $\tfrac23$
      antwoord: |-
        zie de figuur
    - opgave: |-
        $-0,\overline{3}$
      antwoord: |-
        zie de figuur
    - opgave: |-
        $1,\overline{6}$
      antwoord: |-
        zie de figuur
  uitwerking: |-
    $-0,\overline{3} = -\tfrac13$ en $1,\overline{6} = \tfrac53$: verdeel elke eenheid in drie stukken van 1 cm.
    \figuren{\begin{tikzpicture}[x=1.5cm,font=\scriptsize]
      \getallenas{-2}{2}
      \aspunt{-1.5}{-1,5}
      \aspunt{.6667}{\tfrac23}
      \aspunt{-.3333}{-0,\overline{3}}
      \aspunt{1.6667}{1,\overline{6}}
    \end{tikzpicture}}

- id: h1-o9
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    gemengd repeterend naar breuk
  opgave: |-
    Schrijf als onvereenvoudigbare breuk.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $0,1\overline{3}$
      antwoord: |-
        $\tfrac{2}{15}$
      uitwerking: |-
        $100x - 10x = 13,\overline{3} - 1,\overline{3} = 12$, dus $x = \tfrac{12}{90} = \tfrac{2}{15}$.
    - opgave: |-
        $0,2\overline{45}$
      antwoord: |-
        $\tfrac{27}{110}$
      uitwerking: |-
        $1000x - 10x = 245,\overline{45} - 2,\overline{45} = 243$, dus $x = \tfrac{243}{990} = \tfrac{27}{110}$.
    - opgave: |-
        $1,0\overline{6}$
      antwoord: |-
        $\tfrac{16}{15}$
      uitwerking: |-
        $100x - 10x = 106,\overline{6} - 10,\overline{6} = 96$, dus $x = \tfrac{96}{90} = \tfrac{16}{15}$.
    - opgave: |-
        $0,58\overline{3}$
      antwoord: |-
        $\tfrac{7}{12}$
      uitwerking: |-
        $1000x - 100x = 583,\overline{3} - 58,\overline{3} = 525$, dus $x = \tfrac{525}{900} = \tfrac{7}{12}$.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    begrensd of repeterend
  opgave: |-
    Is de decimale vorm begrensd of repeterend? Beslis zonder te delen, en leg uit.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\tfrac{7}{40}$
      antwoord: |-
        begrensd
      uitwerking: |-
        $40 = 2^3 \cdot 5$.
    - opgave: |-
        $\tfrac{5}{12}$
      antwoord: |-
        repeterend
      uitwerking: |-
        $12 = 2^2 \cdot 3$, met de factor 3.
    - opgave: |-
        $\tfrac{9}{75}$
      antwoord: |-
        begrensd
      uitwerking: |-
        $\tfrac{9}{75} = \tfrac{3}{25}$ en $25 = 5 \cdot 5$.
    - opgave: |-
        $\tfrac{11}{56}$
      antwoord: |-
        repeterend
      uitwerking: |-
        $56 = 2^3 \cdot 7$, met de factor 7.
    - opgave: |-
        $\tfrac{21}{35}$
      antwoord: |-
        begrensd
      uitwerking: |-
        $\tfrac{21}{35} = \tfrac35$.
    - opgave: |-
        $\tfrac{3}{625}$
      antwoord: |-
        begrensd
      uitwerking: |-
        $625 = 5^4$. Het is $0,0048$.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    rangschikken
  opgave: |-
    Rangschik van klein naar groot.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sqrt3$, \ $1,7$, \ $1,\overline{7}$, \ $\tfrac74$, \ $1,73$
      antwoord: |-
        $1,7 < 1,73 < \sqrt3 < \tfrac74 < 1,\overline{7}$
      uitwerking: |-
        $\sqrt3 = 1,7320\ldots$, $\tfrac74 = 1,75$ en $1,\overline{7} = 1,777\ldots$
    - opgave: |-
        $-0,4$, \ $-\tfrac49$, \ $-0,44$, \ $-0,45$
      antwoord: |-
        $-0,45 < -\tfrac49 < -0,44 < -0,4$
      uitwerking: |-
        $-\tfrac49 = -0,444\ldots$ Hoe verder van 0, hoe kleiner: $0,45 > 0,444\ldots > 0,44 > 0,4$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    een getal ertussen
  opgave: |-
    Zoek telkens een getal dat ertussen ligt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2,71$ en $2,72$
      antwoord: |-
        bv. $2,715$
      uitwerking: |-
        Het midden: $\tfrac{2,71 + 2,72}{2} = 2,715$.
    - opgave: |-
        $\tfrac13$ en $\tfrac12$
      antwoord: |-
        bv. $\tfrac{5}{12}$
      uitwerking: |-
        $\tfrac13 = \tfrac{4}{12}$ en $\tfrac12 = \tfrac{6}{12}$. Of het decimale getal $0,4$.
    - opgave: |-
        $-0,1$ en $-0,09$
      antwoord: |-
        bv. $-0,095$
      uitwerking: |-
        $-0,1 = -0,100 < -0,095 < -0,090$.
    - opgave: |-
        $\sqrt2$ en $1,415$
      antwoord: |-
        bv. $1,4145$
      uitwerking: |-
        $\sqrt2 = 1,41421\ldots < 1,4145 < 1,415$.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    een vierkantswortel insluiten
  opgave: |-
    Sluit het getal in tussen twee getallen met één cijfer na de komma, en daarna tussen twee getallen met twee cijfers na de komma. Gebruik de rekenmachine alleen om te kwadrateren, niet de wortelknop.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sqrt3$
      antwoord: |-
        $1,7 < \sqrt3 < 1,8$ en $1,73 < \sqrt3 < 1,74$
      uitwerking: |-
        $1,7^2 = 2,89 < 3 < 3,24 = 1,8^2$, en $1,73^2 = 2,9929 < 3 < 3,0276 = 1,74^2$.
    - opgave: |-
        $\sqrt{10}$
      antwoord: |-
        $3,1 < \sqrt{10} < 3,2$ en $3,16 < \sqrt{10} < 3,17$
      uitwerking: |-
        $3,1^2 = 9,61 < 10 < 10,24 = 3,2^2$, en $3,16^2 = 9,9856 < 10 < 10,0489 = 3,17^2$.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    soorten getallen: juist of fout
  opgave: |-
    Juist of fout? Geef bij een foute uitspraak een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        Elk geheel getal is rationaal.
      antwoord: |-
        juist
      uitwerking: |-
        $a = \tfrac a1$.
    - opgave: |-
        Elk getal met een eindig aantal cijfers na de komma is rationaal.
      antwoord: |-
        juist
      uitwerking: |-
        Het is een breuk met als noemer een macht van 10.
    - opgave: |-
        $\sqrt9$ is irrationaal.
      antwoord: |-
        fout
      uitwerking: |-
        $\sqrt9 = 3$.
    - opgave: |-
        De som van twee irrationale getallen is altijd irrationaal.
      antwoord: |-
        fout
      uitwerking: |-
        $\sqrt2 + (-\sqrt2) = 0$, en 0 is rationaal.
    - opgave: |-
        Tussen $0,9$ en $1$ liggen geen andere getallen.
      antwoord: |-
        fout
      uitwerking: |-
        Bijvoorbeeld $0,95$. (Pas op: tussen $0,\overline{9}$ en 1 ligt wel niets, want ze zijn gelijk.)

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    de periode van een breuk
  opgave: |-
    Je weet dat $\tfrac17 = 0,\overline{142857}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is het 50ste cijfer na de komma van $\tfrac17$?
      antwoord: |-
        $4$
      uitwerking: |-
        De periode heeft 6 cijfers en $50 = 8 \cdot 6 + 2$. Het 50ste cijfer is dus het tweede van de periode: 4.
    - opgave: |-
        Schrijf $\tfrac27$ en $\tfrac37$ als decimaal getal. Wat valt je op?
      antwoord: |-
        $0,\overline{285714}$ en $0,\overline{428571}$
      uitwerking: |-
        Dezelfde zes cijfers in dezelfde volgorde, alleen begint de periode op een andere plaats.
    - opgave: |-
        Wat is het 100ste cijfer na de komma van $\tfrac37$?
      antwoord: |-
        $5$
      uitwerking: |-
        $100 = 16 \cdot 6 + 4$: het vierde cijfer van $428571$, dat is 5.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    afstand op de getallenas
  opgave: |-
    Bereken de afstand tussen de twee getallen op de getallenas.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $-2,5$ en $1,75$
      antwoord: |-
        $4,25$
      uitwerking: |-
        $\abs{1,75 - (-2,5)} = \abs{4,25} = 4,25$.
    - opgave: |-
        $-7$ en $-3$
      antwoord: |-
        $4$
      uitwerking: |-
        $\abs{-3 - (-7)} = \abs{4} = 4$.
    - opgave: |-
        $-\tfrac12$ en $\tfrac13$
      antwoord: |-
        $\tfrac56$
      uitwerking: |-
        $\Abs{\tfrac13 - \bigl(-\tfrac12\bigr)} = \tfrac26 + \tfrac36 = \tfrac56$.
    - opgave: |-
        $\sqrt2$ en $-\sqrt2$
      antwoord: |-
        $2\sqrt2 \approx 2,83$
      uitwerking: |-
        Beide liggen op afstand $\sqrt2$ van 0, aan weerszijden: samen $2\sqrt2$.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    absolute waarde in een context
  opgave: |-
    Gebruik de absolute waarde.
  lijst: enumerate
  delen:
    - opgave: |-
        Op een winterochtend is het $-7,5\,^\circ$C, 's middags $3,2\,^\circ$C. Hoeveel graden is de temperatuur gestegen?
      antwoord: |-
        $10,7\,^\circ$C
      uitwerking: |-
        $\abs{3,2 - (-7,5)} = 10,7$.
    - opgave: |-
        Een duiker zwemt $12,4$ m onder het wateroppervlak, recht onder een meeuw die $8,7$ m boven het water vliegt. Hoe ver zijn ze van elkaar?
      antwoord: |-
        $21,1$ m
      uitwerking: |-
        Op een verticale getallenas met 0 aan het oppervlak: $\abs{8,7 - (-12,4)} = 21,1$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    de rekenmachine en irrationale getallen
  opgave: |-
    Denk na over wat een rekenmachine toont.
  lijst: enumerate
  delen:
    - opgave: |-
        Een rekenmachine toont $0,2857142857$. Welke breuk met een noemer kleiner dan 10 kan dat zijn?
      antwoord: |-
        $\tfrac27$
      uitwerking: |-
        $2 : 7 = 0,\overline{285714}$, en de rekenmachine toont tien cijfers.
    - opgave: |-
        Toon met de rekenmachine $\tfrac{1}{17}$. Zie je de periode? Leg uit.
      antwoord: |-
        nee, ze is 16 cijfers lang
      uitwerking: |-
        $\tfrac{1}{17} = 0,\overline{0588235294117647}$: de periode is langer dan het scherm.
    - opgave: |-
        Kun je met de rekenmachine aantonen dat $\sqrt5$ irrationaal is?
      antwoord: |-
        nee
      uitwerking: |-
        Het scherm toont maar een paar cijfers. Daaruit kun je niet afleiden dat er nooit een periode komt: daarvoor is een redenering nodig.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    $0,\overline{9} = 1$
  opgave: |-
    Is $0,\overline{9}$ echt gelijk aan 1?
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $0,\overline{9}$ als breuk met de werkwijze van het hoofdstuk.
      antwoord: |-
        $1$
      uitwerking: |-
        $10x - x = 9,\overline{9} - 0,\overline{9} = 9$, dus $9x = 9$ en $x = 1$.
    - opgave: |-
        Schrijf $\tfrac13$ en $\tfrac23$ als decimaal getal en tel ze op, als breuk en als decimaal getal. Wat besluit je?
      antwoord: |-
        $0,\overline{3} + 0,\overline{6} = 0,\overline{9}$ en $\tfrac13 + \tfrac23 = 1$
      uitwerking: |-
        Beide sommen moeten gelijk zijn, dus $0,\overline{9} = 1$.
    - opgave: |-
        Schrijf $2,4\overline{9}$ zonder periode.
      antwoord: |-
        $2,5$
      uitwerking: |-
        $0,0\overline{9}$ is een tiende van $0,\overline{9} = 1$, dus $2,4\overline{9} = 2,4 + 0,1 = 2,5$.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    $\sqrt5$ en $\sqrt{10}$ met de passer
  opgave: |-
    In de figuur staat een vierkant van $3$ bij $3$, en daarin een schuin vierkant.
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.6]
        \draw[black!20] (0,0) grid (3,3);
        \fill[accent!15] (1,0) -- (3,1) -- (2,3) -- (0,2) -- cycle;
        \draw[accent,thick] (1,0) -- (3,1) -- (2,3) -- (0,2) -- cycle;
        \draw[grijs] (0,0) rectangle (3,3);
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het schuine vierkant oppervlakte 5 heeft. Hoe lang is zijn zijde dus?
      antwoord: |-
        $9 - 4 = 5$; zijde $\sqrt5$
      uitwerking: |-
        Het grote vierkant heeft oppervlakte 9. Daarvan gaan vier rechthoekige driehoeken af, elk de helft van een rechthoek van $2$ bij $1$: $4 \cdot 1 = 4$. Er blijft $5$, dus de zijde $z$ heeft $z^2 = 5$ en $z = \sqrt5$.
    - opgave: |-
        De zijde van het schuine vierkant is de diagonaal van een rechthoek van $2$ bij $1$. Hoe teken je zo het punt $\sqrt5$ op een getallenas?
      antwoord: |-
        rechthoek van 0 tot 2, hoogte 1; diagonaal met de passer naar de as
      uitwerking: |-
        Teken op de as een rechthoek met hoekpunten $0$ en $2$ en hoogte 1. Zet de passer in 0 en draai de diagonaal van 0 naar het hoekpunt $(2, 1)$ naar de as.
        \figuren{\begin{tikzpicture}[x=1cm,y=1cm]
          \getallenas{0}{3}
          \draw[accent,thick] (0,0) rectangle (2,1);
          \draw[accent,very thick] (0,0) -- (2,1);
          \draw[grijs,dashed] (2,1) arc[start angle=26.565,end angle=0,radius=2.2361];
          \aspunt{2.2361}{\sqrt5}
        \end{tikzpicture}}
    - opgave: |-
        Teken op dezelfde manier het punt $\sqrt{10}$. Welke rechthoek gebruik je?
      antwoord: |-
        een rechthoek van $3$ bij $1$
      uitwerking: |-
        In een vierkant van $4$ bij $4$ teken je een schuin vierkant met hoekpunten op $1$ en $3$ van elke hoek: $16 - 4 \cdot \tfrac{3 \cdot 1}{2} = 10$. Zijn zijde is de diagonaal van een rechthoek van $3$ bij $1$.

- id: h1-o21
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs uit het ongerijmde: $\sqrt3$
  opgave: |-
    Bewijs uit het ongerijmde dat $\sqrt3$ irrationaal is. Volg het bewijs voor $\sqrt2$. Gebruik: is $p$ geen veelvoud van 3, dan is $p = 3k + 1$ of $p = 3k + 2$, en dan is ook $p^2$ geen veelvoud van 3.
  antwoord: |-
    zie de uitwerking
  uitwerking: |-
    Stel $\sqrt3 = \tfrac pq$, onvereenvoudigbaar. Dan is $p^2 = 3q^2$, dus $p^2$ is een veelvoud van 3. Dan is ook $p$ een veelvoud van 3: anders is $p^2 = 9k^2 + 6k + 1$ of $p^2 = 9k^2 + 12k + 4$, en dat is geen veelvoud van 3. Neem $p = 3k$: $9k^2 = 3q^2$, dus $q^2 = 3k^2$. Zo is ook $q$ een veelvoud van 3, en is de breuk niet onvereenvoudigbaar. Tegenspraak.

- id: h1-o22
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs uit het ongerijmde: $1 + \sqrt2$
  opgave: |-
    Bewijs uit het ongerijmde dat $1 + \sqrt2$ irrationaal is. Je mag gebruiken dat $\sqrt2$ irrationaal is.
  antwoord: |-
    zie de uitwerking
  uitwerking: |-
    Stel dat $1 + \sqrt2 = r$ met $r$ rationaal. Dan is $\sqrt2 = r - 1$. Het verschil van twee breuken is een breuk, dus $\sqrt2$ zou rationaal zijn. Tegenspraak.

- id: h1-o23
  soort: opdracht
  niveau: 3
  thema: |-
    de lengte van de periode
  opgave: |-
    We bekijken breuken met noemer 13.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit waarom de periode van een breuk met noemer 13 hoogstens 12 cijfers lang is.
      antwoord: |-
        er zijn hoogstens 12 resten verschillend van 0
      uitwerking: |-
        Bij een deling door 13 is de rest $0, 1, \ldots, 12$. Is de rest 0, dan stopt de deling. Anders zijn er maar 12 mogelijke resten, dus na hoogstens 12 stappen komt er een terug.
    - opgave: |-
        Schrijf $\tfrac{1}{13}$ en $\tfrac{2}{13}$ als decimaal getal. Hoe lang is de periode?
      antwoord: |-
        $0,\overline{076923}$ en $0,\overline{153846}$: 6 cijfers
      uitwerking: |-
        Met de rekenmachine of door te delen. De periode is korter dan het maximum 12.
    - opgave: |-
        Welke breuken $\tfrac{a}{13}$, met $a$ van 1 tot 12, hebben dezelfde zes cijfers als $\tfrac{1}{13}$ in hun periode?
      antwoord: |-
        $\tfrac{1}{13}, \tfrac{3}{13}, \tfrac{4}{13}, \tfrac{9}{13}, \tfrac{10}{13}, \tfrac{12}{13}$
      uitwerking: |-
        Bij $\tfrac{1}{13}$ zijn de resten $10, 9, 12, 3, 4, 1$. Een breuk waarvan de teller een van die resten is, start midden in dezelfde kring: $\tfrac{10}{13} = 0,\overline{769230}$, enzovoort. De andere zes hebben de cijfers $153846$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Schrijf als decimaal getal.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\tfrac{5}{16}$
      antwoord: |-
        $0,3125$
      uitwerking: |-
        De deling stopt: $16 = 2^4$.
    - opgave: |-
        $\tfrac{7}{15}$
      antwoord: |-
        $0,4\overline{6}$
      uitwerking: |-
        $70 = 4 \cdot 15 + 10$, $100 = 6 \cdot 15 + 10$: rest 10 komt terug.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Schrijf $0,\overline{54}$ als onvereenvoudigbare breuk.
  antwoord: |-
    $\tfrac{6}{11}$
  uitwerking: |-
    $100x - x = 54$, dus $x = \tfrac{54}{99} = \tfrac{6}{11}$.

- id: h1-t3
  pakketten: [1]
  soort: test
  niveau: 2
  opgave: |-
    Is de decimale vorm van $\tfrac{9}{24}$ begrensd of repeterend? En die van $\tfrac{7}{30}$? Beslis zonder te delen.
  antwoord: |-
    begrensd; repeterend
  uitwerking: |-
    $\tfrac{9}{24} = \tfrac38$ en $8 = 2^3$: begrensd ($0,375$). $30 = 2 \cdot 3 \cdot 5$ heeft de factor 3, en $\tfrac{7}{30}$ is onvereenvoudigbaar: repeterend ($0,2\overline{3}$).

- id: h1-t3
  pakketten: [2, 3, 4, 5]
  soort: test
  niveau: 2
  opgave: |-
    Schrijf $0,3\overline{8}$ als onvereenvoudigbare breuk.
  antwoord: |-
    $\tfrac{7}{18}$
  uitwerking: |-
    $100x - 10x = 38,\overline{8} - 3,\overline{8} = 35$, dus $x = \tfrac{35}{90} = \tfrac{7}{18}$.

- id: h1-t4
  soort: test
  niveau: 1
  opgave: |-
    Is het getal rationaal of irrationaal?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\sqrt{36}$
      antwoord: |-
        rationaal
      uitwerking: |-
        $\sqrt{36} = 6$.
    - opgave: |-
        $\sqrt{12}$
      antwoord: |-
        irrationaal
      uitwerking: |-
        12 is geen kwadraat van een natuurlijk getal.
    - opgave: |-
        $1,\overline{2}$
      antwoord: |-
        rationaal
      uitwerking: |-
        Repeterend ($\tfrac{11}{9}$).
    - opgave: |-
        $2\pi$
      antwoord: |-
        irrationaal
      uitwerking: |-
        Was $2\pi$ een breuk, dan ook de helft ervan, $\pi$.

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    Rangschik van klein naar groot: \ $-1,3$, \ $-1,\overline{3}$, \ $-1,33$, \ $-\sqrt2$.
  antwoord: |-
    $-\sqrt2 < -1,\overline{3} < -1,33 < -1,3$
  uitwerking: |-
    $\sqrt2 = 1,414\ldots$ en $1,\overline{3} = 1,333\ldots$ Hoe verder van 0, hoe kleiner.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Zoek een rationaal en een irrationaal getal tussen $3,14$ en $3,15$.
  antwoord: |-
    bv. $3,145$ en $\pi$
  uitwerking: |-
    $3,145$ is het midden, en $\pi = 3,14159\ldots$ ligt er ook tussen.

