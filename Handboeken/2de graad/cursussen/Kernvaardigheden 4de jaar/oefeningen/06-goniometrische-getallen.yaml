- id: h6-o7
  soort: opdracht
  niveau: 2
  thema: |-
    de grondformule
  opgave: |-
    Bereken de andere goniometrische getallen exact. Gebruik de grondformule.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin\alpha = \tfrac{3}{5}$ en $\alpha$ ligt in het tweede kwadrant.
      antwoord: |-
        $\cos\alpha = - \tfrac{4}{5}$, $\tan\alpha = - \tfrac{3}{4}$
    - opgave: |-
        $\cos\alpha = \tfrac{5}{13}$ en $\alpha$ ligt in het vierde kwadrant.
      antwoord: |-
        $\sin\alpha = - \tfrac{12}{13}$, $\tan\alpha = - \tfrac{12}{5}$
    - opgave: |-
        $\sin\alpha = - \tfrac{4}{5}$ en $\alpha$ ligt in het derde kwadrant.
      antwoord: |-
        $\cos\alpha = - \tfrac{3}{5}$, $\tan\alpha = \tfrac{4}{3}$
    - opgave: |-
        $\cos\alpha = - \tfrac{1}{2}$ en $\alpha$ ligt in het tweede kwadrant.
      antwoord: |-
        $\sin\alpha = \dfrac{\sqrt3}{2}$, $\tan\alpha = - \sqrt3$
    - opgave: |-
        $\sin\alpha = \tfrac{1}{3}$ en $\alpha$ ligt in het eerste kwadrant.
      antwoord: |-
        $\cos\alpha = \dfrac{2 \sqrt2}{3}$, $\tan\alpha = \dfrac{\sqrt2}{4}$
    - opgave: |-
        $\cos\alpha = - \tfrac{2}{3}$ en $\alpha$ ligt in het derde kwadrant.
      antwoord: |-
        $\sin\alpha = - \dfrac{\sqrt5}{3}$, $\tan\alpha = \dfrac{\sqrt5}{2}$

