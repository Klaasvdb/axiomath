- id: h6-o9
  soort: opdracht
  niveau: 2
  thema: |-
    goniometrische getallen in een context
  opgave: |-
    Los op. Maak een schets met een rechthoekige driehoek.
  lijst: enumerate
  delen:
    - opgave: |-
        Een ladder van $6$~m staat tegen een muur en maakt een hoek van $72^\circ$ met de grond. Hoe hoog reikt de ladder? Rond af op een centimeter.
      antwoord: |-
        $5{,}71$~m
      uitwerking: |-
        $6\sin 72^\circ \approx 5{,}71$.
    - opgave: |-
        Een weg stijgt $8\,\%$: per $100$~m horizontaal $8$~m omhoog. Hoe groot is de hellingshoek? Rond af op $0{,}1^\circ$.
      antwoord: |-
        $4{,}6^\circ$
      uitwerking: |-
        $\tan\alpha = 0{,}08$, dus $\alpha \approx 4{,}6^\circ$.
    - opgave: |-
        Je staat $40$~m van een toren en ziet de top onder een hoek van $32^\circ$. Je ogen zijn $1{,}60$~m boven de grond. Hoe hoog is de toren? Rond af op $0{,}1$~m.
      antwoord: |-
        $26{,}6$~m
      uitwerking: |-
        $40\tan 32^\circ + 1{,}6 \approx 26{,}6$.
    - opgave: |-
        Een paal van $1{,}80$~m werpt een schaduw van $2{,}40$~m. Onder welke hoek vallen de zonnestralen in? Rond af op $0{,}1^\circ$.
      antwoord: |-
        $36{,}9^\circ$
      uitwerking: |-
        $\tan\alpha = \tfrac{1{,}8}{2{,}4} = 0{,}75$.
    - opgave: |-
        Een vliegtuig moet $250$~m hoger komen en stijgt onder een hoek van $4^\circ$. Hoeveel meter legt het af langs zijn baan? Rond af op een meter.
      antwoord: |-
        $3584$~m
      uitwerking: |-
        $\dfrac{250}{\sin 4^\circ} \approx 3584$.

- id: h6-o10
  soort: opdracht
  niveau: 3
  thema: |-
    goniometrische identiteiten
  opgave: |-
    Toon aan of vereenvoudig.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: $(\sin\alpha + \cos\alpha)^2 = 1 + 2\sin\alpha\cos\alpha$.
      antwoord: |-
        werk uit en gebruik de grondformule
      uitwerking: |-
        $\sin^2\alpha + 2\sin\alpha\cos\alpha + \cos^2\alpha = 1 + 2\sin\alpha\cos\alpha$.
    - opgave: |-
        Vereenvoudig $\sin(180^\circ - \alpha) + \sin(180^\circ + \alpha)$.
      antwoord: |-
        $0$
      uitwerking: |-
        $\sin\alpha + (-\sin\alpha)$.
    - opgave: |-
        Toon aan: $\tan\alpha + \dfrac{1}{\tan\alpha} = \dfrac{1}{\sin\alpha\cos\alpha}$.
      antwoord: |-
        op gelijke noemer, dan de grondformule
      uitwerking: |-
        $\dfrac{\sin\alpha}{\cos\alpha} + \dfrac{\cos\alpha}{\sin\alpha} = \dfrac{\sin^2\alpha + \cos^2\alpha}{\sin\alpha\cos\alpha}$.
    - opgave: |-
        Vereenvoudig $\cos(90^\circ - \alpha)\cdot\sin\alpha + \sin(90^\circ - \alpha)\cdot\cos\alpha$.
      antwoord: |-
        $1$
      uitwerking: |-
        $\sin\alpha \cdot \sin\alpha + \cos\alpha \cdot \cos\alpha = 1$.
    - opgave: |-
        In een gelijkzijdige driehoek met zijde $2$ teken je een hoogte. Leid daaruit $\sin 60^\circ$, $\cos 60^\circ$ en $\tan 30^\circ$ af.
      antwoord: |-
        $\tfrac{\sqrt3}{2}$, $\tfrac12$, $\tfrac{\sqrt3}{3}$
      uitwerking: |-
        De hoogte deelt de basis in twee stukken van $1$ en is $\sqrt{4 - 1} = \sqrt3$.

