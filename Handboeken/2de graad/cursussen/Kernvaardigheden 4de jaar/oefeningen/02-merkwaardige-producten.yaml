- id: h2-o5
  soort: opdracht
  niveau: 2
  thema: |-
    merkwaardige producten herkennen
  opgave: |-
    Vul de puntjes aan, zodat de gelijkheid klopt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x + \ldots)^2 = x^2 + 10x + \ldots$
      antwoord: |-
        $(x + 5)^2 = x^2 + 10x + 25$
    - opgave: |-
        $(\ldots - 3)^2 = 4a^2 - \ldots + 9$
      antwoord: |-
        $(2a - 3)^2 = 4a^2 - 12a + 9$
    - opgave: |-
        $(x - \ldots)^2 = x^2 - \ldots + 49$
      antwoord: |-
        $(x - 7)^2 = x^2 - 14x + 49$
    - opgave: |-
        $(\ldots + \ldots)(\ldots - \ldots) = 25x^2 - 16$
      antwoord: |-
        $(5x + 4)(5x - 4)$
    - opgave: |-
        $x^2 + 8x + \ldots = (\ldots)^2$
      antwoord: |-
        $x^2 + 8x + 16 = (x + 4)^2$
    - opgave: |-
        $9a^2 - \ldots + 1 = (\ldots)^2$
      antwoord: |-
        $9a^2 - 6a + 1 = (3a - 1)^2$
    - opgave: |-
        $(\ldots + 2y)^2 = \ldots + 12xy + \ldots$
      antwoord: |-
        $(3x + 2y)^2 = 9x^2 + 12xy + 4y^2$
    - opgave: |-
        $x^4 - \ldots = (x^2 - 6)(\ldots)$
      antwoord: |-
        $x^4 - 36 = (x^2 - 6)(x^2 + 6)$
    - opgave: |-
        $\ldots - 20x + 4 = (\ldots)^2$
      antwoord: |-
        $25x^2 - 20x + 4 = (5x - 2)^2$
    - opgave: |-
        $(x + \ldots)^2 = x^2 + x + \ldots$
      antwoord: |-
        $\bigl(x + \tfrac12\bigr)^2 = x^2 + x + \tfrac14$

