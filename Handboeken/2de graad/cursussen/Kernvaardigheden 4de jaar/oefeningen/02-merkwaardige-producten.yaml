- id: h2-o9
  soort: opdracht
  niveau: 1
  thema: |-
    klassieke fouten bij merkwaardige producten
  opgave: |-
    Waar of fout? Verbeter wat fout is.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x + 3)^2 = x^2 + 9$
      antwoord: |-
        fout, $x^2 + 6x + 9$
    - opgave: |-
        $(x - 4)^2 = x^2 - 8x + 16$
      antwoord: |-
        waar
    - opgave: |-
        $(2a)^2 = 2a^2$
      antwoord: |-
        fout, $4a^2$
    - opgave: |-
        $(a - b)^2 = (b - a)^2$
      antwoord: |-
        waar
    - opgave: |-
        $(x + 5)(x - 5) = x^2 - 10x - 25$
      antwoord: |-
        fout, $x^2 - 25$
    - opgave: |-
        $-(x - 2)^2 = -x^2 - 4x - 4$
      antwoord: |-
        fout, $-x^2 + 4x - 4$
    - opgave: |-
        $(3x - 1)^2 = 9x^2 - 6x + 1$
      antwoord: |-
        waar
    - opgave: |-
        $(x - 1)(1 + x) = x^2 - 1$
      antwoord: |-
        waar
    - opgave: |-
        $(x - y)^2 = x^2 - y^2$
      antwoord: |-
        fout, $x^2 - 2xy + y^2$
    - opgave: |-
        $(-x - 3)^2 = -(x + 3)^2$
      antwoord: |-
        fout, $(x + 3)^2$
    - opgave: |-
        $2(x + 1)^2 = (2x + 2)^2$
      antwoord: |-
        fout, $2x^2 + 4x + 2$
    - opgave: |-
        $(x^2 + 1)(x^2 - 1) = x^4 - 1$
      antwoord: |-
        waar

- id: h2-o10
  soort: opdracht
  niveau: 3
  thema: |-
    merkwaardige producten: denkopgaven
  opgave: |-
    Los op.
  lijst: enumerate
  delen:
    - opgave: |-
        Werk $(A + B)^3$ uit als $(A + B)^2 \cdot (A + B)$. Werk daarmee $(x + 2)^3$ uit.
      antwoord: |-
        $A^3 + 3A^2B + 3AB^2 + B^3$; $x^3 + 6x^2 + 12x + 8$
    - opgave: |-
        Werk $(a + b + c)^2$ uit. Hoeveel dubbele producten zijn er?
      antwoord: |-
        $a^2 + b^2 + c^2 + 2ab + 2ac + 2bc$; drie
      uitwerking: |-
        $\bigl((a + b) + c\bigr)^2 = (a + b)^2 + 2(a + b)c + c^2$.
    - opgave: |-
        Bereken $2026^2 - 2025^2$ zonder rekenmachine.
      antwoord: |-
        $4051$
      uitwerking: |-
        $(A - B)(A + B) = 1 \cdot 4051$.
    - opgave: |-
        Toon aan: het product van twee opeenvolgende oneven getallen, plus $1$, is een kwadraat. Noem de getallen $2n - 1$ en $2n + 1$.
      antwoord: |-
        $(2n - 1)(2n + 1) + 1 = (2n)^2$
    - opgave: |-
        Toon aan dat $(n - 1)\,n\,(n + 1)(n + 2) + 1 = (n^2 + n - 1)^2$. Tip: $(n - 1)(n + 2)$ en $n(n + 1)$.
      antwoord: |-
        $(m - 2)m + 1 = (m - 1)^2$ met $m = n^2 + n$

