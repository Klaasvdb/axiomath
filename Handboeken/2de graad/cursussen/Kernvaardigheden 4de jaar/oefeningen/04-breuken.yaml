    Vereenvoudig. Ontbind eerst teller en noemer in factoren.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\dfrac{x^2 - 9}{x + 3}$
      antwoord: |-
        $x - 3$
    - opgave: |-
        $\dfrac{x^2 - 4x}{x^2 - 16}$
      antwoord: |-
        $\dfrac{x}{x + 4}$
    - opgave: |-
        $\dfrac{5x + 10}{x^2 - 4}$
      antwoord: |-
        $\dfrac{5}{x - 2}$
    - opgave: |-
        $\dfrac{x^2 + 6x + 9}{x^2 - 9}$
      antwoord: |-
        $\dfrac{x + 3}{x - 3}$
    - opgave: |-
        $\dfrac{2x - 6}{3x - 9}$
      antwoord: |-
        $\dfrac{2}{3}$
    - opgave: |-
        $\dfrac{x^2 - x - 6}{x^2 - 9}$
      antwoord: |-
        $\dfrac{x + 2}{x + 3}$
    - opgave: |-
        $\dfrac{a^2 - 2a}{a^2 - 4a + 4}$
      antwoord: |-
        $\dfrac{a}{a - 2}$
    - opgave: |-
        $\dfrac{x^3 - x}{x^2 + x}$
      antwoord: |-
        $x - 1$
    - opgave: |-
        $\dfrac{4x^2 - 1}{2x^2 + x}$
      antwoord: |-
        $\dfrac{2 x - 1}{x}$
    - opgave: |-
        $\dfrac{x^2 + 5x + 6}{x^2 + 4x + 4}$
      antwoord: |-
        $\dfrac{x + 3}{x + 2}$
    - opgave: |-
        $\dfrac{3 - x}{x^2 - 9}$
      antwoord: |-
        $-\dfrac{1}{x + 3}$
    - opgave: |-
        $\dfrac{x^2 - 25}{5 - x}$
      antwoord: |-
        $- x - 5$
    - opgave: |-
        $\dfrac{x^2 + 2x - 15}{x^2 - 7x + 12}$
      antwoord: |-
        $\dfrac{x + 5}{x - 4}$
    - opgave: |-
        $\dfrac{6x^2 - 3x}{4x^2 - 1}$
      antwoord: |-
        $\dfrac{3 x}{2 x + 1}$
    - opgave: |-
        $\dfrac{x^4 - 1}{x^2 + 1}$
      antwoord: |-
        $(x - 1) (x + 1)$
    - opgave: |-
        $\dfrac{2x^2 - 8}{x^2 + 4x + 4}$
      antwoord: |-
        $\dfrac{2 (x - 2)}{x + 2}$
    - opgave: |-
        $\dfrac{x^2 - 10x + 25}{2x - 10}$
      antwoord: |-
        $\dfrac{x - 5}{2}$
    - opgave: |-
        $\dfrac{ax + ay}{x^2 - y^2}$
      antwoord: |-
        $\dfrac{a}{x - y}$
    - opgave: |-
        $\dfrac{x^3 - 4x^2 + 4x}{x^3 - 4x}$
      antwoord: |-
        $\dfrac{x - 2}{x + 2}$
    - opgave: |-
        $\dfrac{2x^2 + 5x - 3}{x^2 + 3x}$
      antwoord: |-
        $\dfrac{2 x - 1}{x}$

- id: h4-o4
  soort: opdracht
  niveau: 1
  thema: |-
    bestaansvoorwaarden van een breuk
  opgave: |-
    Voor welke waarden van $x$ bestaat de uitdrukking niet? Geef de bestaansvoorwaarden.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{3}{x - 2}$
      antwoord: |-
        $x \neq 2$
    - opgave: |-
        $\dfrac{x + 1}{x^2 - 9}$
      antwoord: |-
        $x \neq -3$ en $x \neq 3$
    - opgave: |-
        $\dfrac{2x}{x^2 + 4}$
      antwoord: |-
        geen voorwaarden
    - opgave: |-
        $\dfrac{1}{x^2 - 5x}$
      antwoord: |-
        $x \neq 0$ en $x \neq 5$
    - opgave: |-
        $\dfrac{x}{x^2 - 6x + 9}$
      antwoord: |-
        $x \neq 3$
    - opgave: |-
        $\dfrac{5}{2x + 3}$
      antwoord: |-
        $x \neq - \tfrac{3}{2}$
    - opgave: |-
        $\dfrac{x - 1}{x^2 + x - 12}$
      antwoord: |-
        $x \neq -4$ en $x \neq 3$
    - opgave: |-
        $\dfrac{1}{x} + \dfrac{2}{x + 1}$
      antwoord: |-
        $x \neq -1$ en $x \neq 0$
    - opgave: |-
        $\dfrac{4}{x^3 - x}$
      antwoord: |-
        $x \neq -1$ en $x \neq 0$ en $x \neq 1$
    - opgave: |-
        $\dfrac{x}{3x^2 - 12}$
      antwoord: |-
        $x \neq -2$ en $x \neq 2$
    - opgave: |-
        $\dfrac{7}{x^2 - 2}$
      antwoord: |-
        $x \neq - \sqrt2$ en $x \neq \sqrt2$
    - opgave: |-
        $\dfrac{1}{x - 1} - \dfrac{1}{x^2 - 4}$
      antwoord: |-
        $x \neq -2$ en $x \neq 1$ en $x \neq 2$

- id: h4-o5
  soort: opdracht
  niveau: 2
  thema: |-
    breuken optellen en aftrekken
  opgave: |-
    Werk uit en vereenvoudig. Zet eerst op gelijke noemer.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{2}{x} + \dfrac{3}{x^2}$
      antwoord: |-
        $\dfrac{2 x + 3}{x^2}$
    - opgave: |-
        $\dfrac{1}{x - 1} + \dfrac{1}{x + 1}$
      antwoord: |-
        $\dfrac{2 x}{(x - 1) (x + 1)}$
    - opgave: |-
        $\dfrac{2}{x - 1} - \dfrac{3}{x + 1}$
      antwoord: |-
        $\dfrac{5 - x}{(x - 1) (x + 1)}$
    - opgave: |-
        $\dfrac{x}{x - 2} - \dfrac{2}{x - 2}$
      antwoord: |-
        $1$
    - opgave: |-
        $\dfrac{a}{3} + \dfrac{a}{6}$
      antwoord: |-
        $\dfrac{a}{2}$
    - opgave: |-
        $\dfrac{x + 1}{4} - \dfrac{x - 1}{6}$
      antwoord: |-
        $\dfrac{x + 5}{12}$
    - opgave: |-
        $\dfrac{3}{2x} - \dfrac{1}{3x}$
      antwoord: |-
        $\dfrac{7}{6 x}$
    - opgave: |-
        $1 + \dfrac{1}{x}$
      antwoord: |-
        $\dfrac{x + 1}{x}$
    - opgave: |-
        $x - \dfrac{1}{x}$
      antwoord: |-
        $\dfrac{(x - 1) (x + 1)}{x}$
    - opgave: |-
        $\dfrac{1}{x} - \dfrac{1}{x + 1}$
      antwoord: |-
        $\dfrac{1}{x (x + 1)}$
    - opgave: |-
        $\dfrac{4}{x^2 - 4} + \dfrac{1}{x + 2}$
      antwoord: |-
        $\dfrac{1}{x - 2}$
    - opgave: |-
        $\dfrac{x}{x + 3} + \dfrac{3}{x - 3}$
      antwoord: |-
        $\dfrac{x^2 + 9}{(x - 3) (x + 3)}$
    - opgave: |-
        $\dfrac{2}{a} - \dfrac{a - 2}{a^2}$
      antwoord: |-
        $\dfrac{a + 2}{a^2}$
    - opgave: |-
        $\dfrac{5}{x - 3} - \dfrac{5}{x + 3}$
      antwoord: |-
        $\dfrac{30}{(x - 3) (x + 3)}$
    - opgave: |-
        $\dfrac{x + 2}{x} - \dfrac{x}{x + 2}$
      antwoord: |-
        $\dfrac{4 (x + 1)}{x (x + 2)}$
    - opgave: |-
        $\dfrac{1}{x^2 - x} + \dfrac{1}{x}$
      antwoord: |-
        $\dfrac{1}{x - 1}$
    - opgave: |-
        $\dfrac{3}{x - 1} + \dfrac{2}{1 - x}$
      antwoord: |-
        $\dfrac{1}{x - 1}$
    - opgave: |-
        $\dfrac{x}{x^2 - 1} - \dfrac{1}{x^2 - 1}$
      antwoord: |-
        $\dfrac{1}{x + 1}$
    - opgave: |-
        $2 - \dfrac{x - 1}{x + 1}$
      antwoord: |-
        $\dfrac{x + 3}{x + 1}$
    - opgave: |-
        $\dfrac{1}{2x + 2} + \dfrac{1}{x^2 - 1}$
      antwoord: |-
        $\dfrac{1}{2 (x - 1)}$

- id: h4-o6
  soort: opdracht
  niveau: 2
  thema: |-
    breuken vermenigvuldigen en delen
  opgave: |-
    Werk uit en vereenvoudig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{x^2 - 4}{x} \cdot \dfrac{x^2}{x + 2}$
      antwoord: |-
        $x (x - 2)$
    - opgave: |-
        $\dfrac{x + 3}{x - 1} \cdot \dfrac{x^2 - 1}{x^2 + 3x}$
      antwoord: |-
        $\dfrac{x + 1}{x}$
    - opgave: |-
        $\dfrac{x^2 - 9}{4x} : \dfrac{x - 3}{2x^2}$
      antwoord: |-
        $\dfrac{x (x + 3)}{2}$
    - opgave: |-
        $\dfrac{a^2 - a}{a + 2} : \dfrac{a - 1}{a^2 - 4}$
      antwoord: |-
        $a (a - 2)$
    - opgave: |-
        $\dfrac{2x + 4}{x^2} \cdot \dfrac{3x}{x + 2}$
      antwoord: |-
        $\dfrac{6}{x}$
    - opgave: |-
        $\dfrac{x^2 - 2x + 1}{x^2 - 1} \cdot \dfrac{x + 1}{x}$
      antwoord: |-
        $\dfrac{x - 1}{x}$
    - opgave: |-
        $\dfrac{x}{x - 5} : \dfrac{x^2}{x^2 - 25}$
      antwoord: |-
        $\dfrac{x + 5}{x}$
    - opgave: |-
        $\dfrac{x^2 + 4x + 4}{x^2 - 4} : \dfrac{x + 2}{x - 2}$
      antwoord: |-
        $1$
    - opgave: |-
        $\dfrac{6}{x^2 - 9} \cdot \dfrac{x - 3}{2}$
      antwoord: |-
        $\dfrac{3}{x + 3}$
    - opgave: |-
        $\dfrac{x^2 + x}{x - 1} \cdot \dfrac{x^2 - 1}{x^2 + 2x + 1}$
      antwoord: |-
        $x$
    - opgave: |-
        $\dfrac{4x^2 - 1}{x^3} : \dfrac{2x - 1}{x^2}$
      antwoord: |-
        $\dfrac{2 x + 1}{x}$
    - opgave: |-
        $\dfrac{x - 1}{x + 1} : (x - 1)$
      antwoord: |-
        $\dfrac{1}{x + 1}$
    - opgave: |-
        $\dfrac{a^2 - b^2}{ab} \cdot \dfrac{a}{a + b}$
      antwoord: |-
        $\dfrac{a - b}{b}$
    - opgave: |-
        $(x^2 - 1) \cdot \dfrac{3}{x + 1}$
      antwoord: |-
        $3 (x - 1)$
    - opgave: |-
        $\dfrac{x^2 - 3x}{x^2 - 6x + 9} : \dfrac{x}{x - 3}$
      antwoord: |-
        $1$
    - opgave: |-
        $\dfrac{x^2 - x - 2}{x^2 + x} \cdot \dfrac{x}{x - 2}$
      antwoord: |-
        $1$

- id: h4-o7
  soort: opdracht
  niveau: 2
  thema: |-
    rekenen met breuken: gemengd
  opgave: |-
    Vereenvoudig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\Bigl(1 - \dfrac{1}{x}\Bigr) \cdot \dfrac{x}{x - 1}$
      antwoord: |-
        $1$
    - opgave: |-
        $\Bigl(\dfrac{1}{x} + \dfrac{1}{2}\Bigr) : \dfrac{x + 2}{4}$
      antwoord: |-
        $\dfrac{2}{x}$
    - opgave: |-
        $\dfrac{x}{x - 1} - \dfrac{1}{x - 1} \cdot \dfrac{x - 1}{x}$
      antwoord: |-
        $\dfrac{x^2 - x + 1}{x (x - 1)}$
    - opgave: |-
        $\Bigl(x + \dfrac{1}{x}\Bigr)^2 - \Bigl(x - \dfrac{1}{x}\Bigr)^2$
      antwoord: |-
        $4$
    - opgave: |-
        $\dfrac{2}{x + 1} + \dfrac{x - 3}{x^2 - 1}$
      antwoord: |-
        $\dfrac{3 x - 5}{(x - 1) (x + 1)}$
    - opgave: |-
        $\Bigl(\dfrac{x}{2} - \dfrac{2}{x}\Bigr) \cdot \dfrac{2x}{x + 2}$
      antwoord: |-
        $x - 2$
    - opgave: |-
        $\dfrac{1}{x - 2} - \dfrac{4}{x^2 - 4}$
      antwoord: |-
        $\dfrac{1}{x + 2}$
    - opgave: |-
        $\Bigl(1 + \dfrac{2}{x}\Bigr) : \Bigl(1 - \dfrac{4}{x^2}\Bigr)$
      antwoord: |-
        $\dfrac{x}{x - 2}$
    - opgave: |-
        $\dfrac{3}{x} - \dfrac{2}{x + 1} - \dfrac{1}{x^2 + x}$
      antwoord: |-
        $\dfrac{x + 2}{x (x + 1)}$
    - opgave: |-
        $\dfrac{x^2}{x - 3} - \dfrac{9}{x - 3}$
      antwoord: |-
        $x + 3$

- id: h4-o8
