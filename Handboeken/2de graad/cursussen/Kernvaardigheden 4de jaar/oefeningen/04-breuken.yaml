# Oefeningen van hoofdstuk 4 (breuken: getallen en lettervormen). Zie Opmaak/oefeningenbank.py.
# Drillbundels: de antwoorden zijn berekend en nagerekend met SymPy. Alleen in pakket 5.


- id: h4-o1
