        $\tfrac{1}{3}$
    - opgave: |-
        $3 \cdot \tfrac{5}{6} - \tfrac{1}{2}$
      antwoord: |-
        $2$
    - opgave: |-
        $\tfrac{11}{12} - \tfrac{2}{3} \cdot \tfrac{3}{8}$
      antwoord: |-
        $\tfrac{2}{3}$
    - opgave: |-
        $\bigl(\tfrac35 - \tfrac12\bigr) \cdot 20$
      antwoord: |-
        $2$
    - opgave: |-
