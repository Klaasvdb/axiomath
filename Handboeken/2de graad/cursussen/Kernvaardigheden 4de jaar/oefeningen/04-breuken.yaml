  niveau: 1
  thema: |-
    breuken met eentermen
  opgave: |-
    Vereenvoudig.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\dfrac{6x^2}{9x^5}$
      antwoord: |-
        $\dfrac{2}{3 x^3}$
    - opgave: |-
        $\dfrac{12a^3b}{8ab^4}$
      antwoord: |-
        $\dfrac{3 a^2}{2 b^3}$
    - opgave: |-
        $\dfrac{-15x^4}{5x}$
      antwoord: |-
        $- 3 x^3$
    - opgave: |-
        $\dfrac{2x}{3} \cdot \dfrac{9}{4x^2}$
      antwoord: |-
        $\dfrac{3}{2 x}$
    - opgave: |-
        $\dfrac{a^2}{b} : \dfrac{a}{b^3}$
      antwoord: |-
        $a b^2$
    - opgave: |-
        $\dfrac{4x^3y}{6xy^2} \cdot \dfrac{3y}{x}$
      antwoord: |-
        $2 x$
    - opgave: |-
        $\dfrac{10a}{3b^2} : \dfrac{5a^2}{6b}$
      antwoord: |-
        $\dfrac{4}{a b}$
    - opgave: |-
        $\dfrac{x^2}{2} \cdot \dfrac{4}{x^3}$
      antwoord: |-
        $\dfrac{2}{x}$
    - opgave: |-
        $\dfrac{7ab^2}{14a^2b}$
      antwoord: |-
        $\dfrac{b}{2 a}$
    - opgave: |-
        $\dfrac{x}{y} : \dfrac{x^2}{y^2}$
      antwoord: |-
        $\dfrac{y}{x}$
    - opgave: |-
        $\dfrac{(2x)^3}{4x^2}$
      antwoord: |-
        $2 x$
    - opgave: |-
        $\dfrac{3x^2}{5y} \cdot \dfrac{10y^2}{9x}$
      antwoord: |-
        $\dfrac{2 x y}{3}$
    - opgave: |-
        $\dfrac{-6a^2b^3}{-9a^4b}$
      antwoord: |-
        $\dfrac{2 b^2}{3 a^2}$
    - opgave: |-
        $\dfrac{8}{x^2} : \dfrac{2}{x}$
      antwoord: |-
        $\dfrac{4}{x}$
    - opgave: |-
        $\dfrac{x^5y^2}{x^2y^5}$
      antwoord: |-
        $\dfrac{x^3}{y^3}$
    - opgave: |-
        $\dfrac{1}{a} \cdot \dfrac{a^2}{b} \cdot \dfrac{b^2}{a}$
      antwoord: |-
        $b$

- id: h4-o3
  soort: opdracht
