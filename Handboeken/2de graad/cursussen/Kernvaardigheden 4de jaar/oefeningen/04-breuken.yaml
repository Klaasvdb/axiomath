    - opgave: |-
        $\dfrac{2 - \tfrac{2}{x + 1}}{\tfrac{x}{x + 1}}$
      antwoord: |-
        $2$

- id: h4-o9
  soort: opdracht
  niveau: 1
  thema: |-
    klassieke fouten bij breuken
  opgave: |-
    Waar of fout? Verbeter wat fout is.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x + 3}{3} = x$
      antwoord: |-
        fout, $\dfrac{x}{3} + 1$
    - opgave: |-
        $\dfrac{2x}{2y} = \dfrac{x}{y}$
      antwoord: |-
        waar
    - opgave: |-
        $\dfrac{1}{a} + \dfrac{1}{b} = \dfrac{2}{a + b}$
      antwoord: |-
        fout, $\dfrac{a + b}{ab}$
    - opgave: |-
        $\dfrac{x^2 - 4}{x - 2} = x + 2$ voor $x \neq 2$
      antwoord: |-
        waar
    - opgave: |-
        $\dfrac{x^2 + 1}{x + 1} = x + 1$
      antwoord: |-
        fout, niet te vereenvoudigen
    - opgave: |-
        $\dfrac{a}{b} : \dfrac{c}{d} = \dfrac{ad}{bc}$
      antwoord: |-
        waar
    - opgave: |-
        $-\dfrac{x - 1}{2} = \dfrac{-x - 1}{2}$
      antwoord: |-
        fout, $\dfrac{-x + 1}{2}$
    - opgave: |-
        $\dfrac{3}{x} + \dfrac{2}{x} = \dfrac{5}{2x}$
      antwoord: |-
        fout, $\dfrac{5}{x}$
    - opgave: |-
        $\dfrac{x - 5}{5 - x} = -1$ voor $x \neq 5$
      antwoord: |-
        waar
    - opgave: |-
        $\dfrac{2 + x}{2 + y} = \dfrac{x}{y}$
      antwoord: |-
        fout, niet te vereenvoudigen

- id: h4-o10
  soort: opdracht
  niveau: 3
  thema: |-
    breuken: denkopgaven
  opgave: |-
    Los op.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{1}{n} - \dfrac{1}{n + 1} = \dfrac{1}{n(n + 1)}$.
      antwoord: |-
        gelijke noemer $n(n + 1)$
      uitwerking: |-
        $\dfrac{(n + 1) - n}{n(n + 1)} = \dfrac{1}{n(n + 1)}$.
    - opgave: |-
        Bereken met a: $\dfrac{1}{1 \cdot 2} + \dfrac{1}{2 \cdot 3} + \dfrac{1}{3 \cdot 4} + \cdots + \dfrac{1}{99 \cdot 100}$.
      antwoord: |-
        $\tfrac{99}{100}$
      uitwerking: |-
        $\bigl(1 - \tfrac12\bigr) + \bigl(\tfrac12 - \tfrac13\bigr) + \cdots + \bigl(\tfrac{1}{99} - \tfrac{1}{100}\bigr) = 1 - \tfrac{1}{100}$.
    - opgave: |-
        Schrijf $\dfrac{x + 3}{x + 1}$ als $1 + \dfrac{a}{x + 1}$. Wat is $a$?
      antwoord: |-
        $a = 2$
      uitwerking: |-
        $x + 3 = (x + 1) + 2$.
    - opgave: |-
        Een fietser rijdt heen met $20$~km/h en terug met $30$~km/h. Toon met breuken aan dat de gemiddelde snelheid $24$~km/h is, en niet $25$. Noem de afstand $d$.
      antwoord: |-
        $24$~km/h
      uitwerking: |-
        Tijd: $\dfrac{d}{20} + \dfrac{d}{30} = \dfrac{5d}{60} = \dfrac{d}{12}$. Snelheid: $\dfrac{2d}{d/12} = 24$.

