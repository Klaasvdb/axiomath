      antwoord: |-
        $\tfrac{1}{15}$
    - opgave: |-
        $\tfrac{3}{4} : 6$
      antwoord: |-
        $\tfrac{1}{8}$
    - opgave: |-
        $5 : \tfrac{10}{3}$
      antwoord: |-
        $\tfrac{3}{2}$
    - opgave: |-
        $\tfrac{14}{15} \cdot \tfrac{25}{21}$
      antwoord: |-
        $\tfrac{10}{9}$
    - opgave: |-
        $\tfrac32 \cdot \tfrac49$
      antwoord: |-
        $\tfrac{2}{3}$
    - opgave: |-
        $\tfrac12 - \tfrac13 + \tfrac14$
      antwoord: |-
        $\tfrac{5}{12}$
    - opgave: |-
        $\bigl(\tfrac23\bigr)^2 - \tfrac19$
      antwoord: |-
        $\tfrac{1}{3}$
    - opgave: |-
        $\tfrac{7}{8} - \tfrac58 : \tfrac52$
      antwoord: |-
        $\tfrac{5}{8}$
    - opgave: |-
        $-\tfrac34 \cdot \bigl(-\tfrac{8}{9}\bigr)$
      antwoord: |-
        $\tfrac{2}{3}$
