      antwoord: |-
        $\dfrac{10}{9}$
    - opgave: |-
        $\dfrac{1 - \tfrac1x}{1 + \tfrac1x}$
      antwoord: |-
        $\dfrac{x - 1}{x + 1}$
    - opgave: |-
        $\dfrac{\tfrac{1}{x} - \tfrac{1}{3}}{x - 3}$
      antwoord: |-
        $-\dfrac{1}{3 x}$
    - opgave: |-
        $\dfrac{x - \tfrac{4}{x}}{x + 2}$
      antwoord: |-
        $\dfrac{x - 2}{x}$
    - opgave: |-
