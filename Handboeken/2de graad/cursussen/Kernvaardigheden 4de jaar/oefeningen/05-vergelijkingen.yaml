# Oefeningen van hoofdstuk 5 (vergelijkingen en formules). Zie Opmaak/oefeningenbank.py.
# Drillbundels: de antwoorden zijn berekend en nagerekend met SymPy. Alleen in pakket 5.


- id: h5-o1
  soort: opdracht
  niveau: 1
  thema: |-
    eerstegraadsvergelijkingen met haakjes
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3x - 7 = 11$
      antwoord: |-
        $6$
    - opgave: |-
        $5 - 2x = 13$
      antwoord: |-
        $-4$
    - opgave: |-
        $4x + 3 = x - 9$
      antwoord: |-
        $-4$
    - opgave: |-
        $2(x - 3) = 5x + 6$
      antwoord: |-
        $-4$
    - opgave: |-
        $7 - 3(x + 1) = 2x$
      antwoord: |-
        $\tfrac{4}{5}$
    - opgave: |-
        $6x - (2x - 5) = 17$
      antwoord: |-
        $3$
    - opgave: |-
        $3(2x - 1) - 2(x + 4) = 1$
      antwoord: |-
        $3$
    - opgave: |-
        $x - 4(1 - x) = 3(x + 2)$
      antwoord: |-
        $5$
    - opgave: |-
        $5(x + 2) = 5x + 10$
      antwoord: |-
        elk getal
    - opgave: |-
        $2(3x - 1) = 6x + 1$
      antwoord: |-
        geen oplossing
    - opgave: |-
        $-x + 8 = 3x$
      antwoord: |-
        $2$
    - opgave: |-
        $0{,}5x - 2 = 1{,}5$
      antwoord: |-
        $7$
    - opgave: |-
        $12 - 4x = -2(x - 3)$
      antwoord: |-
        $3$
    - opgave: |-
        $4(x - 2) - 3(x - 5) = 0$
      antwoord: |-
        $-7$
    - opgave: |-
        $(x + 2)^2 = x^2 + 16$
      antwoord: |-
        $3$
    - opgave: |-
        $(x - 3)(x + 3) = x^2 - 3x$
      antwoord: |-
        $3$
    - opgave: |-
        $9x - 2(4x + 1) = 7$
      antwoord: |-
        $9$
    - opgave: |-
        $1{,}2x + 0{,}3 = 0{,}8x - 0{,}9$
      antwoord: |-
        $-3$
    - opgave: |-
        $x(x + 5) = x^2 - 15$
      antwoord: |-
        $-3$
    - opgave: |-
        $2x - 3(x - 4) = 4 - (x - 8)$
      antwoord: |-
        elk getal

- id: h5-o2
