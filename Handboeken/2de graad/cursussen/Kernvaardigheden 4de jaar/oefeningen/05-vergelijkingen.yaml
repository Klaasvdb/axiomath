- id: h5-o8
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijkingen met breuken
  opgave: |-
    Los op. Geef eerst de bestaansvoorwaarden, en controleer of de oplossingen eraan voldoen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{6}{x} = 2$
      antwoord: |-
        $3$
    - opgave: |-
        $\dfrac{3}{x - 2} = x$
      antwoord: |-
        $-1$ of $3$
    - opgave: |-
        $\dfrac{x + 1}{x - 1} = 3$
      antwoord: |-
        $2$
    - opgave: |-
        $\dfrac{x^2}{x - 3} = \dfrac{9}{x - 3}$
      antwoord: |-
        $-3$
    - opgave: |-
        $\dfrac{2}{x} + \dfrac{1}{x + 1} = 1$
      antwoord: |-
        $1 \pm \sqrt3$
    - opgave: |-
        $x + \dfrac{4}{x} = 5$
      antwoord: |-
        $1$ of $4$
    - opgave: |-
        $\dfrac{x}{x + 2} = \dfrac{2}{x + 2} + 1$
      antwoord: |-
        geen oplossing
    - opgave: |-
        $\dfrac{1}{x - 1} + \dfrac{1}{x + 1} = \dfrac{2}{x^2 - 1}$
      antwoord: |-
        geen oplossing
    - opgave: |-
        $\dfrac{x - 2}{x} = \dfrac{x}{x + 4}$
      antwoord: |-
        $4$
    - opgave: |-
        $\dfrac{5}{x + 3} = \dfrac{2}{x}$
      antwoord: |-
        $2$
    - opgave: |-
        $\dfrac{x}{x - 4} - \dfrac{4}{x} = \dfrac{16}{x^2 - 4x}$
      antwoord: |-
        geen oplossing
    - opgave: |-
        $1 - \dfrac{2}{x} = \dfrac{15}{x^2}$
      antwoord: |-
        $-3$ of $5$

- id: h5-o9
  soort: opdracht
  niveau: 2
  thema: |-
    formules omvormen
  opgave: |-
    Vorm de formule om naar de gevraagde letter.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $v = v_0 + at$, naar $t$
      antwoord: |-
        $t = \dfrac{v - v_0}{a}$
    - opgave: |-
        $A = \pi r^2$, naar $r$ ($r > 0$)
      antwoord: |-
        $r = \sqrt{\dfrac{A}{\pi}}$
    - opgave: |-
        $y = 3x - 6$, naar $x$
      antwoord: |-
        $x = \dfrac{y + 6}{3}$
    - opgave: |-
        $P = 2(l + b)$, naar $b$
      antwoord: |-
        $b = \dfrac{P}{2} - l$
    - opgave: |-
        $F = \tfrac95C + 32$, naar $C$
      antwoord: |-
        $C = \tfrac59(F - 32)$
    - opgave: |-
        $E = \tfrac12mv^2$, naar $v$ ($v > 0$)
      antwoord: |-
        $v = \sqrt{\dfrac{2E}{m}}$
    - opgave: |-
        $\dfrac{1}{f} = \dfrac{1}{a} + \dfrac{1}{b}$, naar $f$
      antwoord: |-
        $f = \dfrac{ab}{a + b}$
    - opgave: |-
        $ax + by = c$, naar $y$
      antwoord: |-
        $y = \dfrac{c - ax}{b}$
    - opgave: |-
        $V = \tfrac13\pi r^2h$, naar $h$
      antwoord: |-
        $h = \dfrac{3V}{\pi r^2}$
    - opgave: |-
        $c^2 = a^2 + b^2$, naar $a$ ($a > 0$)
      antwoord: |-
        $a = \sqrt{c^2 - b^2}$
    - opgave: |-
        $y = \dfrac{2}{x - 1}$, naar $x$
      antwoord: |-
        $x = \dfrac{2}{y} + 1$
    - opgave: |-
        $K = k(1 + i)^2$, naar $i$ ($i > 0$)
      antwoord: |-
        $i = \sqrt{\dfrac{K}{k}} - 1$

- id: h5-o10
  soort: opdracht
  niveau: 1
  thema: |-
    klassieke fouten bij vergelijkingen
  opgave: |-
    Waar zit de fout? Verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 = 3x$, dus $x = 3$.
      antwoord: |-
        ook $x = 0$
      uitwerking: |-
        Je mag niet delen door $x$: misschien is $x = 0$. Herleid op nul: $x(x - 3) = 0$.
    - opgave: |-
        $x^2 = 25$, dus $x = 5$.
      antwoord: |-
        ook $x = -5$
    - opgave: |-
        $(x - 2)(x + 1) = 4$, dus $x - 2 = 4$ of $x + 1 = 4$.
      antwoord: |-
        $x = -2$ of $x = 3$
      uitwerking: |-
        De product-nulregel werkt alleen met $0$ in het rechterlid: $x^2 - x - 6 = 0$.
    - opgave: |-
        $-3x < 6$, dus $x < -2$.
      antwoord: |-
        $x > -2$
      uitwerking: |-
        Delen door $-3$ keert het teken om.
    - opgave: |-
        $\dfrac{x}{x - 1} = \dfrac{1}{x - 1}$, dus $x = 1$.
      antwoord: |-
        geen oplossing
      uitwerking: |-
        $x = 1$ voldoet niet aan de bestaansvoorwaarde $x \neq 1$.
    - opgave: |-
        $2x^2 - 8x = 0$, dus $x^2 - 8x = 0$.
      antwoord: |-
        $x = 0$ of $x = 4$
      uitwerking: |-
        Deel álle termen door $2$: $x^2 - 4x = 0$.

- id: h5-o11
  soort: opdracht
  niveau: 3
  thema: |-
    vergelijkingen van hogere graad
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^4 - 5x^2 + 4 = 0$
      antwoord: |-
        $-2$ of $-1$ of $1$ of $2$
    - opgave: |-
        $x^4 - 3x^2 - 4 = 0$
      antwoord: |-
        $-2$ of $2$
    - opgave: |-
        $x^3 - 3x^2 - x + 3 = 0$
      antwoord: |-
        $-1$ of $1$ of $3$
    - opgave: |-
        $(x^2 - 2x)^2 - 2(x^2 - 2x) - 3 = 0$
      antwoord: |-
        $-1$ of $1$ of $3$
    - opgave: |-
        $\dfrac{x}{x - 1} + \dfrac{x - 1}{x} = \dfrac{5}{2}$
      antwoord: |-
        $-1$ of $2$
    - opgave: |-
        $x^4 - 13x^2 + 36 = 0$
      antwoord: |-
        $-3$ of $-2$ of $2$ of $3$

- id: h5-o12
  soort: opdracht
  niveau: 3
  thema: |-
    vergelijkingen met een parameter of een context
  opgave: |-
    Los op.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke waarden van $k$ heeft $x^2 + kx + 9 = 0$ precies één oplossing?
      antwoord: |-
        $k = -6$ of $k = 6$
      uitwerking: |-
        $D = k^2 - 36 = 0$.
    - opgave: |-
        Voor welke waarden van $m$ heeft $x^2 - 4x + m = 0$ twee oplossingen?
      antwoord: |-
        $m < 4$
      uitwerking: |-
        $D = 16 - 4m > 0$.
    - opgave: |-
        Een rechthoek is $3$~cm langer dan breed en heeft een oppervlakte van $40$~cm$^2$. Hoe breed is hij?
      antwoord: |-
        $5$~cm
      uitwerking: |-
        $x(x + 3) = 40$, dus $x^2 + 3x - 40 = (x - 5)(x + 8) = 0$. Alleen $x = 5$ is positief.
    - opgave: |-
        De som van een getal en zijn omgekeerde is $\tfrac{10}{3}$. Welk getal?
      antwoord: |-
        $3$ of $\tfrac13$
      uitwerking: |-
        $x + \dfrac1x = \dfrac{10}{3}$, dus $3x^2 - 10x + 3 = 0$.

