        $\dfrac{x}{2} + \dfrac{x}{3} = 5$
      antwoord: |-
        $6$
    - opgave: |-
        $\dfrac{x - 1}{4} = \dfrac{x + 2}{6}$
      antwoord: |-
        $7$
    - opgave: |-
        $\dfrac{2x}{5} - 1 = \dfrac{x}{2}$
      antwoord: |-
        $-10$
    - opgave: |-
        $\dfrac{x + 3}{2} - \dfrac{x - 1}{3} = 2$
      antwoord: |-
        $1$
    - opgave: |-
        $\dfrac{3x - 1}{4} = x - 2$
      antwoord: |-
        $7$
    - opgave: |-
        $\dfrac{x}{6} - \dfrac{x}{4} = 1$
      antwoord: |-
        $-12$
    - opgave: |-
        $\tfrac23x + 1 = \tfrac12x - 2$
      antwoord: |-
        $-18$
    - opgave: |-
        $\dfrac{x - 1}{2} - \dfrac{2x + 1}{3} = 1$
      antwoord: |-
        $-11$
    - opgave: |-
        $\dfrac{5 - x}{3} = \dfrac{x}{2} + 5$
      antwoord: |-
        $-4$
    - opgave: |-
        $x - \dfrac{x - 2}{5} = 6$
      antwoord: |-
        $7$
    - opgave: |-
        $\dfrac{x + 1}{3} + \dfrac{x - 2}{4} = \dfrac{x}{2}$
      antwoord: |-
        $2$
    - opgave: |-
        $\tfrac34(x - 4) = \tfrac12x$
      antwoord: |-
        $12$
    - opgave: |-
        $\dfrac{2x - 3}{6} - \dfrac{x}{9} = \dfrac{1}{2}$
      antwoord: |-
        $\tfrac{9}{2}$
    - opgave: |-
        $\dfrac{x}{2} - \dfrac{x}{5} = \dfrac{x}{10} + 4$
      antwoord: |-
        $20$
    - opgave: |-
        $\dfrac{4 - x}{8} = \dfrac{x + 4}{12}$
      antwoord: |-
        $\tfrac{4}{5}$

- id: h5-o3
  soort: opdracht
  niveau: 1
  thema: |-
    eerstegraadsongelijkheden
  opgave: |-
    Los de ongelijkheid op. Let op: deel je door een negatief getal, dan keert het teken om.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2x + 5 < 11$
      antwoord: |-
        $x < 3$
    - opgave: |-
        $3 - 2x \leqslant 7$
      antwoord: |-
        $x \geqslant -2$
    - opgave: |-
        $5x + 1 > 2x - 8$
      antwoord: |-
        $x > -3$
    - opgave: |-
        $-4x \geqslant 12$
      antwoord: |-
        $x \leqslant -3$
    - opgave: |-
        $\dfrac{x}{2} - 1 < \dfrac{x}{3}$
      antwoord: |-
        $x < 6$
    - opgave: |-
        $3(x - 2) \leqslant 5x + 4$
      antwoord: |-
        $x \geqslant -5$
    - opgave: |-
        $7 - x > 2x + 1$
      antwoord: |-
        $x < 2$
    - opgave: |-
        $-\dfrac{x}{3} < 2$
      antwoord: |-
        $x > -6$
    - opgave: |-
        $2(x + 1) - 3x \geqslant 4$
      antwoord: |-
        $x \leqslant -2$
    - opgave: |-
        $\dfrac{x + 1}{2} > \dfrac{x - 1}{3}$
      antwoord: |-
        $x > -5$
    - opgave: |-
        $0{,}2x - 1 \leqslant 0{,}5x + 2$
      antwoord: |-
        $x \geqslant -10$
    - opgave: |-
        $4 - 3(x + 2) < -x$
      antwoord: |-
        $x > -1$
    - opgave: |-
        $x - \dfrac{2x - 1}{4} \geqslant 1$
      antwoord: |-
        $x \geqslant \tfrac{3}{2}$
    - opgave: |-
        $-2(3 - x) > 4x + 2$
      antwoord: |-
        $x < -4$
    - opgave: |-
        $5x - 3 \leqslant 5(x - 1)$
      antwoord: |-
        geen oplossing
    - opgave: |-
        $6 - x \geqslant 2(3 - x) + x$
      antwoord: |-
        elk getal

