- id: h7-o3
  soort: opdracht
  niveau: 2
  thema: |-
    stelsels met haakjes, breuken en kommagetallen
  opgave: |-
    Los op. Werk eerst de haakjes en de noemers weg.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{2(x + 1) - y &= 6}{x + 3(y - 2) &= 3}$
      antwoord: |-
        $(3, 2)$
    - opgave: |-
        $\stelsel{\tfrac{x}{2} + \tfrac{y}{3} &= 4}{x - y &= 3}$
      antwoord: |-
        $(6, 3)$
    - opgave: |-
        $\stelsel{\tfrac{x + 1}{2} + y &= 7}{x - \tfrac{y}{4} &= 4}$
      antwoord: |-
        $(5, 4)$
    - opgave: |-
        $\stelsel{3(x - y) + 2x &= -1}{4(x + 1) - 2(y - 3) &= 10}$
      antwoord: |-
        $(1, 2)$
    - opgave: |-
        $\stelsel{\tfrac{x}{3} - \tfrac{y}{2} &= 1}{\tfrac{x}{4} + \tfrac{y}{6} &= 4}$
      antwoord: |-
        $(12, 6)$
    - opgave: |-
        $\stelsel{0{,}5x + 0{,}2y &= 4}{0{,}3x - 0{,}4y &= -2{,}8}$
      antwoord: |-
        $(4, 10)$
    - opgave: |-
        $\stelsel{(x + 2)(y - 1) - xy &= -1}{2x + 3y &= 12}$
      antwoord: |-
        $(3, 2)$
    - opgave: |-
        $\stelsel{\tfrac{2x - y}{3} &= 2}{\tfrac{x + y}{2} - 1 &= 2}$
      antwoord: |-
        $(4, 2)$
    - opgave: |-
        $\stelsel{x - 2(3 - y) &= -1}{5x - (x - y) &= -1}$
      antwoord: |-
        $(-1, 3)$
    - opgave: |-
        $\stelsel{\tfrac{x}{5} + y &= -2}{x - \tfrac{y}{2} &= 12}$
      antwoord: |-
        $(10, -4)$
    - opgave: |-
        $\stelsel{1{,}2x - 0{,}5y &= 5}{0{,}4x + y &= 4}$
      antwoord: |-
        $(5, 2)$
    - opgave: |-
        $\stelsel{\tfrac{3x + 1}{4} - \tfrac{y}{2} &= \tfrac{5}{2}}{x + y &= -2}$
      antwoord: |-
        $(1, -3)$

- id: h7-o4
  soort: opdracht
  niveau: 2
  thema: |-
    strijdige en onbepaalde stelsels
  opgave: |-
    Los op. Let op: sommige stelsels hebben geen of oneindig veel oplossingen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\stelsel{x + y &= 2}{2x + 2y &= 5}$
      antwoord: |-
        $V = \emptyset$ (strijdig)
    - opgave: |-
        $\stelsel{x - 2y &= 3}{-2x + 4y &= -6}$
      antwoord: |-
        onbepaald: oneindig veel oplossingen
    - opgave: |-
        $\stelsel{x + 2y &= 3}{3x - y &= 2}$
      antwoord: |-
        $(1, 1)$
    - opgave: |-
        $\stelsel{3x - y &= 4}{y &= 3x + 1}$
      antwoord: |-
        $V = \emptyset$ (strijdig)
    - opgave: |-
        $\stelsel{4x + 6y &= 10}{2x + 3y &= 5}$
      antwoord: |-
        onbepaald: oneindig veel oplossingen
    - opgave: |-
        $\stelsel{2x - 3y &= 1}{4x + y &= 9}$
      antwoord: |-
        $(2, 1)$
    - opgave: |-
        $\stelsel{y &= 2x - 1}{6x - 3y &= 3}$
      antwoord: |-
        onbepaald: oneindig veel oplossingen
    - opgave: |-
        $\stelsel{\tfrac{x}{2} + y &= 1}{x + 2y &= 4}$
      antwoord: |-
        $V = \emptyset$ (strijdig)
    - opgave: |-
        $\stelsel{5x + y &= -3}{x - y &= 3}$
      antwoord: |-
        $(0, -3)$
    - opgave: |-
        $\stelsel{x - y &= 0}{2y &= 2x}$
      antwoord: |-
        onbepaald: oneindig veel oplossingen

- id: h7-o5
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstukken met stelsels
  opgave: |-
    Stel een stelsel op en los op.
  lijst: enumerate
  delen:
    - opgave: |-
        Twee getallen hebben als som $47$ en als verschil $13$. Welke getallen?
      antwoord: |-
        $30$ en $17$
      uitwerking: |-
        $x + y = 47$, $x - y = 13$.
    - opgave: |-
        Drie koffies en twee taartjes kosten $13{,}50$ euro, twee koffies en drie taartjes $15$ euro. Wat kost een koffie, wat een taartje?
      antwoord: |-
        koffie $2{,}10$ euro, taartje $3{,}60$ euro
      uitwerking: |-
        $3k + 2t = 13{,}5$ en $2k + 3t = 15$: combinatie geeft $5k = 10{,}5$.
    - opgave: |-
        Op een feest zijn er $60$ gasten. Er zijn $12$ volwassenen meer dan kinderen. Hoeveel kinderen zijn er?
      antwoord: |-
        $24$
      uitwerking: |-
        $v + k = 60$, $v = k + 12$, dus $2k + 12 = 60$.
    - opgave: |-
        Een rechthoek heeft een omtrek van $46$~cm. De lengte is $2$~cm meer dan het dubbele van de breedte. Bepaal lengte en breedte.
      antwoord: |-
        $16$~cm en $7$~cm
      uitwerking: |-
        $2l + 2b = 46$, $l = 2b + 2$, dus $6b + 4 = 46$.
    - opgave: |-
        Een fietser rijdt $3$~uur, deels aan $20$~km/h en deels aan $15$~km/h, samen $52{,}5$~km. Hoe lang rijdt hij aan $20$~km/h?
      antwoord: |-
        $1{,}5$~uur
      uitwerking: |-
        $a + b = 3$, $20a + 15b = 52{,}5$, dus $5a = 7{,}5$.

- id: h7-o6
  soort: opdracht
  niveau: 3
  thema: |-
    stelsels met drie onbekenden
  opgave: |-
    Los op. Werk een onbekende weg, zodat je een stelsel met twee onbekenden overhoudt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelseldrie{x + y + z &= 6}{x - y + z &= 2}{2x + y - z &= 1}$
      antwoord: |-
        $(1, 2, 3)$
    - opgave: |-
        $\stelseldrie{x + 2y - z &= -1}{2x - y + z &= 6}{x + y + 2z &= 3}$
      antwoord: |-
        $(2, -1, 1)$
    - opgave: |-
        $\stelseldrie{x + y &= 5}{y + z &= 4}{x + z &= 7}$
      antwoord: |-
        $(4, 1, 3)$
    - opgave: |-
        $\stelseldrie{3x - y + 2z &= -4}{x + y - z &= 6}{2x + 3y + z &= 9}$
      antwoord: |-
        $(1, 3, -2)$
    - opgave: |-
        $\stelseldrie{x - y - z &= 2}{2x + y + 3z &= 17}{x + 4y - 2z &= 5}$
      antwoord: |-
        $(5, 1, 2)$
    - opgave: |-
        $\stelseldrie{2x + y + z &= 1}{x - 3y + 2z &= -8}{3x + 2y - z &= 5}$
      antwoord: |-
        $(0, 2, -1)$

- id: h7-o7
  soort: opdracht
  niveau: 3
  thema: |-
    stelsels: denkopgaven
  opgave: |-
    Los op.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke waarde van $a$ heeft $\stelsel{2x + ay &= 4}{x + 3y &= 2}$ oneindig veel oplossingen?
      antwoord: |-
        $a = 6$
      uitwerking: |-
        De eerste vergelijking moet het dubbele van de tweede zijn: $a = 6$ (en dan ook $4 = 2 \cdot 2$).
    - opgave: |-
        Voor welke waarde van $a$ is $\stelsel{ax - y &= 1}{4x - 2y &= 5}$ strijdig?
      antwoord: |-
        $a = 2$
      uitwerking: |-
        Evenwijdige rechten: $\tfrac{a}{4} = \tfrac{-1}{-2}$, dus $a = 2$; dan is $2x - y = 1$ en $2x - y = 2{,}5$.
    - opgave: |-
        Los op met $u = \tfrac1x$ en $v = \tfrac1y$: $\stelsel{\tfrac{2}{x} + \tfrac{3}{y} &= 7}{\tfrac{1}{x} - \tfrac{1}{y} &= 1}$.
      antwoord: |-
        $(\tfrac12, 1)$
      uitwerking: |-
        $2u + 3v = 7$, $u - v = 1$: $u = 2$, $v = 1$, dus $x = \tfrac12$, $y = 1$.
    - opgave: |-
        De rechte $y = ax + b$ gaat door $(1, 5)$ en $(3, 11)$. Bepaal $a$ en $b$.
      antwoord: |-
        $a = 3$, $b = 2$
      uitwerking: |-
        $a + b = 5$ en $3a + b = 11$: aftrekken geeft $2a = 6$.

