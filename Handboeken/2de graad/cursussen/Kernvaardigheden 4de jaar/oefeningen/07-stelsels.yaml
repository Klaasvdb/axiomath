- id: h7-t4
  soort: test
  niveau: 2
  opgave: |-
    Een kaartje voor een volwassene kost $8$ euro meer dan voor een kind. Twee volwassenen en drie kinderen betalen samen $61$ euro. Wat kost elk kaartje?
  antwoord: |-
    volwassene $17$ euro, kind $9$ euro
  uitwerking: |-
    $v = k + 8$ en $2v + 3k = 61$, dus $5k + 16 = 61$.
