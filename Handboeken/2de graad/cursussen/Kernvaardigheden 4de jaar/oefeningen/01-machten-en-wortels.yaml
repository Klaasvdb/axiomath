- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    rekenregels voor machten met letters
  opgave: |-
    Vereenvoudig en schrijf zonder negatieve exponenten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^3 \cdot x^{-5}$
      antwoord: |-
        $\dfrac{1}{x^2}$
    - opgave: |-
        $(a^{-2})^{-3}$
      antwoord: |-
        $a^6$
    - opgave: |-
        $(-2x^2)^3$
      antwoord: |-
        $- 8 x^6$
    - opgave: |-
        $\dfrac{12a^7}{4a^3}$
      antwoord: |-
        $3 a^4$
    - opgave: |-
        $\dfrac{x^2y^{-3}}{x^{-1}y^2}$
      antwoord: |-
        $\dfrac{x^3}{y^5}$
    - opgave: |-
        $(ab^2)^3 \cdot a^{-4}$
      antwoord: |-
        $\dfrac{b^6}{a}$
    - opgave: |-
        $\Bigl(\dfrac{2x}{y^2}\Bigr)^{3}$
      antwoord: |-
        $\dfrac{8 x^3}{y^6}$
    - opgave: |-
        $(3a^{-1})^{-2}$
      antwoord: |-
        $\dfrac{a^2}{9}$
    - opgave: |-
        $\dfrac{(x^3)^2 \cdot x}{x^4}$
      antwoord: |-
        $x^3$
    - opgave: |-
        $\dfrac{(-x)^4}{-x^4}$
      antwoord: |-
        $-1$
    - opgave: |-
        $\Bigl(\dfrac{a^2}{b}\Bigr)^{-2}$
      antwoord: |-
        $\dfrac{b^2}{a^4}$
    - opgave: |-
        $x^5 \cdot x^{-2} \cdot x^{-3}$
      antwoord: |-
        $1$
    - opgave: |-
        $(2a^3)^2 \cdot 3a^{-4}$
      antwoord: |-
        $12 a^2$
    - opgave: |-
        $\dfrac{15x^4y}{-5x^6y^3}$
      antwoord: |-
        $- \dfrac{3}{x^2 y^2}$
    - opgave: |-
        $(x^{-1}y^2)^{-3}$
      antwoord: |-
        $\dfrac{x^3}{y^6}$
    - opgave: |-
        $\dfrac{a^{-3}}{a^{-7}}$
      antwoord: |-
        $a^4$
    - opgave: |-
        $(-a^2b)^3 \cdot (ab^{-1})^2$
      antwoord: |-
        $- a^8 b$
    - opgave: |-
        $\Bigl(\dfrac{3x^2}{y}\Bigr)^{2} \cdot \dfrac{y^3}{9x}$
      antwoord: |-
        $x^3 y$
    - opgave: |-
        $\dfrac{4a^{-2}b^3}{(2ab)^{2}}$
      antwoord: |-
        $\dfrac{b}{a^4}$
    - opgave: |-
        $(x^2)^{-1} \cdot (x^{-1})^{-4}$
      antwoord: |-
        $x^2$
    - opgave: |-
        $\dfrac{(a^2b^{-1})^{-1}}{a^{-3}b}$
      antwoord: |-
        $a$
    - opgave: |-
        $\Bigl(\dfrac{x^{-2}}{2y}\Bigr)^{-3}$
      antwoord: |-
        $8 x^6 y^3$
    - opgave: |-
        $\dfrac{6x^{-3}y^4}{(2xy)^2}$
      antwoord: |-
        $\dfrac{3 y^2}{2 x^5}$
    - opgave: |-
        $\bigl(-\tfrac12a^3b^{-2}\bigr)^2 \cdot 8ab^5$
      antwoord: |-
        $2 a^7 b$

