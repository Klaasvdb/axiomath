        $\dfrac{2^{n+3}}{2^{n}}$
      antwoord: |-
        $8$
    - opgave: |-
        $\dfrac{9^{n}}{3^{2n-1}}$
      antwoord: |-
        $3$
    - opgave: |-
        $\dfrac{x^{-1} + x^{-2}}{x^{-2}}$
      antwoord: |-
        $x + 1$
      uitwerking: |-
        Teller en noemer maal $x^2$. Je mag hier niet per grondtal aftrekken: de teller is een som.
    - opgave: |-
        $\dfrac{4^{n} \cdot 2^{n}}{8^{n-1}}$
      antwoord: |-
        $8$
    - opgave: |-
        $\dfrac{a^{-1}}{a^{-1} + 1}$
      antwoord: |-
        $\dfrac{1}{a + 1}$
