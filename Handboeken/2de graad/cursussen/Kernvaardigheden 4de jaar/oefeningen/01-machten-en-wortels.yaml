      antwoord: |-
        $\dfrac{(x + y)^2}{x y}$
    - opgave: |-
        $\dfrac{3^{n+2} - 3^{n}}{3^{n}}$
      antwoord: |-
        $8$
    - opgave: |-
        $\dfrac{(x^2y^{-1})^3 \cdot (xy)^{-2}}{x^{-1}y^{-4}}$
      antwoord: |-
        $\dfrac{x^5}{y}$
    - opgave: |-
        $\dfrac{25^{n} \cdot 5}{5^{2n+3}}$
      antwoord: |-
        $\tfrac{1}{25}$

- id: h1-o9
  soort: opdracht
  niveau: 1
  thema: |-
    klassieke fouten bij machten en wortels
  opgave: |-
    Waar of fout? Verbeter wat fout is.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2^3 \cdot 2^4 = 4^7$
      antwoord: |-
        fout, $2^7$
    - opgave: |-
        $3^{-2} = -9$
      antwoord: |-
        fout, $\tfrac19$
    - opgave: |-
        $(a + b)^2 = a^2 + b^2$
      antwoord: |-
        fout, $a^2 + 2ab + b^2$
    - opgave: |-
        $\sqrt{16 + 9} = 4 + 3$
      antwoord: |-
        fout, $5$
    - opgave: |-
        $(2a)^3 = 8a^3$
      antwoord: |-
        waar
    - opgave: |-
        $\sqrt{x^2} = x$ voor elke $x$
      antwoord: |-
        fout, $\abs{x}$
    - opgave: |-
        $\dfrac{\sqrt{12}}{\sqrt3} = 2$
      antwoord: |-
        waar
    - opgave: |-
        $(-1)^{-1} = 1$
      antwoord: |-
        fout, $-1$
    - opgave: |-
        $-4^2 = 16$
      antwoord: |-
        fout, $-16$
    - opgave: |-
        $2^{-1} + 3^{-1} = 5^{-1}$
      antwoord: |-
        fout, $\tfrac56$
    - opgave: |-
        $\sqrt{2} + \sqrt{3} = \sqrt{5}$
      antwoord: |-
        fout, niet te vereenvoudigen
    - opgave: |-
        $(x^3)^2 = x^5$
      antwoord: |-
        fout, $x^6$
    - opgave: |-
        $3x^{-1} = \dfrac{1}{3x}$
      antwoord: |-
        fout, $\dfrac{3}{x}$
    - opgave: |-
        $\sqrt{4a^2} = 2\abs{a}$
      antwoord: |-
        waar

- id: h1-o10
  soort: opdracht
  niveau: 3
  thema: |-
    machten en wortels: denkopgaven
  opgave: |-
    Los op zonder rekenmachine.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is groter: $2^{30}$ of $3^{20}$? Schrijf beide als een macht met exponent $10$.
      antwoord: |-
        $3^{20}$
      uitwerking: |-
        $2^{30} = 8^{10}$ en $3^{20} = 9^{10}$.
    - opgave: |-
        Toon aan dat $\sqrt{7 + 4\sqrt3} = 2 + \sqrt3$.
      antwoord: |-
        $(2 + \sqrt3)^2 = 7 + 4\sqrt3$
      uitwerking: |-
        $(2 + \sqrt3)^2 = 4 + 4\sqrt3 + 3$, en $2 + \sqrt3 > 0$.
    - opgave: |-
        Vereenvoudig $\sqrt{x^2 - 6x + 9}$. Wat wordt het voor $x = 1$?
      antwoord: |-
        $\abs{x - 3}$; $2$
      uitwerking: |-
        $x^2 - 6x + 9 = (x - 3)^2$ en $\sqrt{A^2} = \abs{A}$.
    - opgave: |-
        Hoeveel cijfers heeft $4^{5} \cdot 5^{12}$?
      antwoord: |-
        $12$
      uitwerking: |-
        $2^{10} \cdot 5^{12} = 25 \cdot 10^{10}$.
    - opgave: |-
        Bereken $\dfrac{1}{\sqrt1 + \sqrt2} + \dfrac{1}{\sqrt2 + \sqrt3} + \cdots + \dfrac{1}{\sqrt8 + \sqrt9}$. Maak eerst elke noemer wortelvrij.
      antwoord: |-
        $2$
      uitwerking: |-
        $\dfrac{1}{\sqrt k + \sqrt{k + 1}} = \sqrt{k + 1} - \sqrt k$: alles valt weg behalve $\sqrt9 - \sqrt1$.

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Vereenvoudig en schrijf zonder negatieve exponenten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(2x^{-1})^3 \cdot x^5$
      antwoord: |-
        $8 x^2$
    - opgave: |-
        $\dfrac{a^3b^{-2}}{a^{-1}b}$
      antwoord: |-
        $\dfrac{a^4}{b^3}$
    - opgave: |-
        $\bigl(\tfrac{3}{4}\bigr)^{-2}$
      antwoord: |-
        $\tfrac{16}{9}$

