- id: h3-o6
  soort: opdracht
  niveau: 2
  thema: |-
    ontbinden met het schema van Horner
  opgave: |-
    Ontbind in factoren. Zoek een nulwaarde bij de delers van de constante term en deel met het schema van Horner.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^3 - 7x + 6$
      antwoord: |-
        $(x - 2) (x - 1) (x + 3)$
    - opgave: |-
        $x^3 - 6x^2 + 11x - 6$
      antwoord: |-
        $(x - 3) (x - 2) (x - 1)$
    - opgave: |-
        $x^3 + 2x^2 - 5x - 6$
      antwoord: |-
        $(x - 2) (x + 1) (x + 3)$
    - opgave: |-
        $x^3 - 3x - 2$
      antwoord: |-
        $(x - 2) (x + 1)^2$
    - opgave: |-
        $x^3 + 4x^2 + x - 6$
      antwoord: |-
        $(x - 1) (x + 2) (x + 3)$
    - opgave: |-
        $x^3 - 13x + 12$
      antwoord: |-
        $(x - 3) (x - 1) (x + 4)$
    - opgave: |-
        $2x^3 - 3x^2 - 3x + 2$
      antwoord: |-
        $(x - 2) (x + 1) (2 x - 1)$
    - opgave: |-
        $x^3 + x^2 - 8x - 12$
      antwoord: |-
        $(x - 3) (x + 2)^2$
    - opgave: |-
        $x^3 - 2x^2 - x + 2$
      antwoord: |-
        $(x - 2) (x - 1) (x + 1)$
    - opgave: |-
        $x^4 - 5x^2 + 4$
      antwoord: |-
        $(x - 2) (x - 1) (x + 1) (x + 2)$
    - opgave: |-
        $x^4 - 2x^3 - 3x^2 + 4x + 4$
      antwoord: |-
        $(x - 2)^2 (x + 1)^2$
    - opgave: |-
        $x^3 - 1$
      antwoord: |-
        $(x - 1) (x^2 + x + 1)$
    - opgave: |-
        $x^3 + 27$
      antwoord: |-
        $(x + 3) (x^2 - 3 x + 9)$
    - opgave: |-
        $x^3 - x^2 - 4x + 4$
      antwoord: |-
        $(x - 2) (x - 1) (x + 2)$

