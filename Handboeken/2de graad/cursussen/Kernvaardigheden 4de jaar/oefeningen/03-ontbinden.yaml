# Oefeningen van hoofdstuk 3 (ontbinden in factoren). Zie Opmaak/oefeningenbank.py.
# Drillbundels: de antwoorden zijn berekend en nagerekend met SymPy. Alleen in pakket 5.


- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    de gemeenschappelijke factor afzonderen
  opgave: |-
    Ontbind in factoren: breng de gemeenschappelijke factor buiten haakjes.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $6x + 9$
      antwoord: |-
        $3(2 x + 3)$
    - opgave: |-
        $x^2 - 7x$
      antwoord: |-
        $x (x - 7)$
    - opgave: |-
        $4a^2 + 10a$
      antwoord: |-
        $2a (2 a + 5)$
    - opgave: |-
        $5x^3 - 15x^2$
      antwoord: |-
        $5x^2 (x - 3)$
    - opgave: |-
        $12ab - 8a$
      antwoord: |-
        $4a (3 b - 2)$
    - opgave: |-
        $x^4 + x^3$
      antwoord: |-
        $x^3 (x + 1)$
    - opgave: |-
        $-3x^2 + 6x$
      antwoord: |-
        $3x(2 - x)$
    - opgave: |-
        $14a^2b - 21ab^2$
      antwoord: |-
        $7a b (2 a - 3 b)$
    - opgave: |-
        $2x^3 - 4x^2 + 6x$
      antwoord: |-
        $2x (x^2 - 2 x + 3)$
    - opgave: |-
        $9y^5 - 3y^2$
      antwoord: |-
        $3y^2 (3 y^3 - 1)$
    - opgave: |-
        $ax + ay - az$
      antwoord: |-
        $a (x + y - z)$
    - opgave: |-
        $x^2y + xy^2$
      antwoord: |-
        $x y (x + y)$
    - opgave: |-
        $8a^3 - 12a^2 + 4a$
      antwoord: |-
        $4a (a - 1) (2 a - 1)$
    - opgave: |-
        $-5x - 10$
      antwoord: |-
        $-5(x + 2)$
    - opgave: |-
        $16x^4 - 24x^2$
      antwoord: |-
        $8x^2 (2 x^2 - 3)$
    - opgave: |-
        $a^2b^3 - a^3b^2$
      antwoord: |-
        $a^2 b^2(b - a)$
    - opgave: |-
        $3x(x - 1) + 5(x - 1)$
      antwoord: |-
        $(x - 1) (3 x + 5)$
    - opgave: |-
        $x(a + 2) - 4(a + 2)$
      antwoord: |-
        $(a + 2) (x - 4)$
    - opgave: |-
        $2x^2(x + 3) - 6x(x + 3)$
      antwoord: |-
        $2x (x - 3) (x + 3)$
    - opgave: |-
        $(x - 5)^2 + 3(x - 5)$
      antwoord: |-
        $(x - 5) (x - 2)$

