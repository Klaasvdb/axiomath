- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    ontbinden met irrationale oplossingen
  opgave: |-
    Ontbind in factoren. De discriminant is geen kwadraat: de oplossingen bevatten een wortel.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 - 2x - 2$
      antwoord: |-
        $\bigl(x - 1 - \sqrt3\bigr)\bigl(x - 1 + \sqrt3\bigr)$
    - opgave: |-
        $x^2 + 4x + 1$
      antwoord: |-
        $\bigl(x + 2 - \sqrt3\bigr)\bigl(x + 2 + \sqrt3\bigr)$
    - opgave: |-
        $x^2 - 5$
      antwoord: |-
        $\bigl(x - \sqrt5\bigr)\bigl(x + \sqrt5\bigr)$
    - opgave: |-
        $x^2 - 6x + 7$
      antwoord: |-
        $\bigl(x - 3 - \sqrt2\bigr)\bigl(x - 3 + \sqrt2\bigr)$
    - opgave: |-
        $x^2 + 2x - 4$
      antwoord: |-
        $\bigl(x + 1 - \sqrt5\bigr)\bigl(x + 1 + \sqrt5\bigr)$
    - opgave: |-
        $2x^2 - 6$
      antwoord: |-
        $2\bigl(x - \sqrt3\bigr)\bigl(x + \sqrt3\bigr)$
    - opgave: |-
        $x^2 - x - 1$
      antwoord: |-
        $\bigl(x - \tfrac{1 + \sqrt5}{2}\bigr)\bigl(x - \tfrac{1 - \sqrt5}{2}\bigr)$
    - opgave: |-
        $x^2 + 10x + 18$
      antwoord: |-
        $\bigl(x + 5 - \sqrt7\bigr)\bigl(x + 5 + \sqrt7\bigr)$

- id: h3-o9
  soort: opdracht
  niveau: 1
  thema: |-
    volledig ontbonden of niet
  opgave: |-
    Is de veelterm volledig ontbonden? Zo nee, ontbind verder.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 - 4 = (x - 2)(x + 2)$
      antwoord: |-
        ja
    - opgave: |-
        $2x^2 - 8 = 2(x^2 - 4)$
      antwoord: |-
        nee, $2(x - 2)(x + 2)$
    - opgave: |-
        $x^3 - x = x(x^2 - 1)$
      antwoord: |-
        nee, $x(x - 1)(x + 1)$
    - opgave: |-
        $x^2 + 4 = (x + 2)^2$
      antwoord: |-
        fout, $x^2 + 4$ ontbindt niet
    - opgave: |-
        $x^4 - 1 = (x^2 - 1)(x^2 + 1)$
      antwoord: |-
        nee, $(x - 1)(x + 1)(x^2 + 1)$
    - opgave: |-
        $x^2 + x + 1$
      antwoord: |-
        ja, $D < 0$
    - opgave: |-
        $3x^2 + 6x = 3(x^2 + 2x)$
      antwoord: |-
        nee, $3x(x + 2)$
    - opgave: |-
        $x^2 - 6x + 9 = (x - 3)^2$
      antwoord: |-
        ja
    - opgave: |-
        $4x^2 - 1 = (2x - 1)^2$
      antwoord: |-
        fout, $(2x - 1)(2x + 1)$
    - opgave: |-
        $x^2 - 5x + 6 = x(x - 5) + 6$
      antwoord: |-
        nee, $(x - 2)(x - 3)$

- id: h3-o10
  soort: opdracht
  niveau: 3
  thema: |-
    ontbinden: denkopgaven
  opgave: |-
    Ontbind volledig in factoren.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^6 - 1$
      antwoord: |-
        $(x - 1)(x + 1)(x^2 + x + 1)(x^2 - x + 1)$
      uitwerking: |-
        $(x^3 - 1)(x^3 + 1)$, en elk deel met Horner ($1$ en $-1$ zijn nulwaarden).
    - opgave: |-
        $a^2 - b^2 - 2b - 1$
      antwoord: |-
        $(a - b - 1)(a + b + 1)$
      uitwerking: |-
        $a^2 - (b + 1)^2$: een verschil van kwadraten.
    - opgave: |-
        $x^4 + 4$ \quad (tip: $x^4 + 4 = (x^2 + 2)^2 - 4x^2$)
      antwoord: |-
        $(x^2 - 2x + 2)(x^2 + 2x + 2)$
      uitwerking: |-
        $(x^2 + 2)^2 - (2x)^2 = (x^2 + 2 - 2x)(x^2 + 2 + 2x)$. Beide factoren hebben $D < 0$.
    - opgave: |-
        $x^3 - 3x^2 + 3x - 1$
      antwoord: |-
        $(x - 1)^3$
      uitwerking: |-
        $1$ is een nulwaarde; Horner geeft $x^2 - 2x + 1 = (x - 1)^2$.
    - opgave: |-
        $(x^2 + x)^2 - 8(x^2 + x) + 12$ \quad (tip: stel $y = x^2 + x$)
      antwoord: |-
        $(x - 1)(x + 2)(x - 2)(x + 3)$
      uitwerking: |-
        $y^2 - 8y + 12 = (y - 2)(y - 6)$, dus $(x^2 + x - 2)(x^2 + x - 6) = (x - 1)(x + 2)(x - 2)(x + 3)$.

