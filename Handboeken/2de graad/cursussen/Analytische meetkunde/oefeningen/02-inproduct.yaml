- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    loodrechte vectoren
  opgave: |-
    Bepaal $k$ zodat $\vc{3}{k}$ loodrecht staat op $\vc{-2}{6}$.
  antwoord: |-
    $k = 1$
  uitwerking: |-
    $-6 + 6k = 0$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    de hoek tussen twee vectoren
  opgave: |-
    Bereken de hoek tussen $\vc{2}{1}$ en $\vc{-3}{1}$.
  antwoord: |-
    $135^\circ$
  uitwerking: |-
    $\cos\theta = \tfrac{-6 + 1}{\sqrt5\,\sqrt{10}} = -\tfrac{5}{\sqrt{50}} = -\tfrac{\sqrt2}{2}$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    een loodrechte rechte met de rico
  opgave: |-
    Geef een vergelijking van de rechte door $P\vc{4}{-1}$ die loodrecht staat op $y = 2x - 3$.
  antwoord: |-
    $y = -\tfrac12 x + 1$
  uitwerking: |-
    $m = -\tfrac12$ en $-1 = -2 + q$.

- id: h2-t4
  soort: test
  niveau: 2
  thema: |-
    de middelloodlijn
  opgave: |-
    Geef een vergelijking van de middelloodlijn van $[AB]$, met $A\vc{-3}{2}$ en $B\vc{1}{6}$.
  antwoord: |-
    $x + y = 3$
  uitwerking: |-
    $M\vc{-1}{4}$ en $\vect{AB} = \vc{4}{4} = 4\,\vc{1}{1}$: $(x + 1) + (y - 4) = 0$.

- id: h2-t5
  soort: test
  niveau: 2
  thema: |-
    het voetpunt van de loodlijn
  opgave: |-
    Bereken het voetpunt van de loodlijn uit $P\vc{6}{5}$ op $l\colon 2x + y = 7$.
  antwoord: |-
    $\vc{2}{3}$
  uitwerking: |-
    $x = 6 + 2r$, $y = 5 + r$. Invullen: $17 + 5r = 7$, dus $r = -2$. Controle: $4 + 3 = 7$.

- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    de afstand van een punt tot een rechte
  opgave: |-
    Bereken de afstand van $P\vc{-2}{3}$ tot $4x - 3y = 3$.
  antwoord: |-
    $4$
  uitwerking: |-
    $\tfrac{\abs{-8 - 9 - 3}}{5} = \tfrac{20}{5}$.

- id: h2-t7
  soort: test
  niveau: 2
  thema: |-
    de hoek tussen twee rechten
  opgave: |-
    Bereken de hoek tussen $l\colon x = 2 + r,\ y = 3r$ en $m\colon x - y = 5$, afgerond op $0{,}01^\circ$.
  antwoord: |-
    $26{,}57^\circ$
  uitwerking: |-
    $\vc{1}{3}$ en $\vc{1}{1}$: $\cos\varphi = \tfrac{4}{\sqrt{10}\,\sqrt2} \approx 0{,}8944$.

- id: h2-t8
  soort: test
  niveau: 2
  thema: |-
    een rechthoekige driehoek herkennen
  opgave: |-
    Toon aan dat de driehoek met $A\vc{1}{2}$, $B\vc{4}{3}$ en $C\vc{3}{6}$ rechthoekig is. In welk hoekpunt ligt de rechte hoek? Bereken de oppervlakte.
  antwoord: |-
    rechthoekig in $B$; oppervlakte $5$
  uitwerking: |-
    $\vect{BA} \cdot \vect{BC} = \vc{-3}{-1} \cdot \vc{-1}{3} = 3 - 3 = 0$. De rechthoekszijden hebben lengte $\sqrt{10}$, dus de oppervlakte is $\tfrac12 \cdot \sqrt{10} \cdot \sqrt{10} = 5$.

- id: h2-t9
  soort: test
  niveau: 2
  thema: |-
    de bissectrices van twee rechten
  opgave: |-
    Geef vergelijkingen van de bissectrices van $l\colon x - 2y = 1$ en $m\colon 2x - y = 5$.
  antwoord: |-
    $x + y = 4$ en $x - y = 2$
  uitwerking: |-
    Beide normen zijn $\sqrt5$: $x - 2y - 1 = \pm(2x - y - 5)$. Met $+$: $-x - y = -4$, met $-$: $3x - 3y = 6$. Controle met het snijpunt $\vc{3}{1}$: $3 + 1 = 4$ en $3 - 1 = 2$.
