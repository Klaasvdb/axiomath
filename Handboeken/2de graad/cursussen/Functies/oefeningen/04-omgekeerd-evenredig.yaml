- id: h4-o3
  soort: opdracht
  niveau: 1
  thema: |-
    tabel aanvullen bij omgekeerd evenredige grootheden
  opgave: |-
    De grootheden $x$ en $y$ zijn omgekeerd evenredig. Vul de tabel aan.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        \waardetabel[$x$][$y$]{5}{1 & 2 & 3 & \vak & 12}{18 & \vak & \vak & 3 & \vak}
      antwoord: |-
        $9$, $6$, $6$, $1,5$
      uitwerking: |-
        $c = 1 \cdot 18 = 18$: $y = \tfrac{18}{2} = 9$, $y = \tfrac{18}{3} = 6$, $x = \tfrac{18}{3} = 6$, $y = \tfrac{18}{12} = 1,5$.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{-4 & -1 & \vak & 8}{2 & \vak & -2 & \vak}
      antwoord: |-
        $8$, $4$, $-1$
      uitwerking: |-
        $c = (-4) \cdot 2 = -8$: $y = \tfrac{-8}{-1} = 8$, $x = \tfrac{-8}{-2} = 4$, $y = \tfrac{-8}{8} = -1$.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{0,2 & 0,5 & \vak & 4}{15 & \vak & 1,5 & \vak}
      antwoord: |-
        $6$, $2$, $0,75$
      uitwerking: |-
        $c = 0,2 \cdot 15 = 3$: $y = \tfrac{3}{0,5} = 6$, $x = \tfrac{3}{1,5} = 2$, $y = \tfrac34 = 0,75$.

