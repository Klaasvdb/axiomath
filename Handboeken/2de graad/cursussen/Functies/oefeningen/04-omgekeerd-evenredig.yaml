# Oefeningen van hoofdstuk 4 (de functie c/x). Zie Opmaak/oefeningenbank.py voor de velden.
# Dit hoofdstuk staat in pakket 2-5. pakketten: alleen in 5 de symmetrieassen (h4-o23) en de verschoven hyperbolen (h4-o24, h4-o27).

- id: h4-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken zonder rekenmachine.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $720 : 24$
      antwoord: |-
        $30$
      uitwerking: |-
        $24 \cdot 30 = 720$.
    - opgave: |-
        $720 : 36$
      antwoord: |-
        $20$
      uitwerking: |-
        $36 \cdot 20 = 720$.
    - opgave: |-
        $720 : 48$
      antwoord: |-
        $15$
      uitwerking: |-
        $48 \cdot 15 = 720$.
    - opgave: |-
        $5 \cdot 2,4$
      antwoord: |-
        $12$
      uitwerking: |-
        $5 \cdot 2 + 5 \cdot 0,4 = 10 + 2$.
    - opgave: |-
        $6 : 0,5$
      antwoord: |-
        $12$
      uitwerking: |-
        Delen door $\tfrac12$ is vermenigvuldigen met $2$.
    - opgave: |-
        $1 : 0,25$
      antwoord: |-
        $4$
      uitwerking: |-
        Delen door $\tfrac14$ is vermenigvuldigen met $4$.

- id: h4-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Een rechthoek heeft een oppervlakte van $12$ cm$^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek vijf mogelijke paren lengte en breedte.
      antwoord: |-
        bv. $12$ en $1$, $6$ en $2$, $4$ en $3$, $3$ en $4$, $8$ en $1,5$
      uitwerking: |-
        Het product van lengte en breedte moet $12$ zijn: bijvoorbeeld $12 \cdot 1$, $6 \cdot 2$, $4 \cdot 3$, $3 \cdot 4$ en $8 \cdot 1,5$.
    - opgave: |-
        Wat gebeurt er met de breedte als je de lengte verdubbelt?
      antwoord: |-
        ze halveert
      uitwerking: |-
        Van lengte $3$ naar $6$ gaat de breedte van $4$ naar $2$: het product moet $12$ blijven.
    - opgave: |-
        Zet de punten (lengte, breedte) in een assenstelsel. Liggen ze op een rechte?
      antwoord: |-
        nee, op een dalende kromme
      uitwerking: |-
        Nee: de punten liggen op een kromme die eerst snel en dan steeds trager daalt.
        \figuren{\begin{tikzpicture}[x=.3cm,y=.3cm]
          \rooster[$l$][$b$]{0}{1}{12}{0}{1}{12}
          \kromme{1}{12}{12/\x}
          \foreach \a in {1,1.5,2,3,4,6,8,12}{\punt{\a}{12/\a}}
        \end{tikzpicture}}
    - opgave: |-
        Kan de lengte $0$ cm zijn?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: dan is de oppervlakte $0 \cdot b = 0$ en geen $12$, welke breedte je ook kiest.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h4-herkennen
  soort: kort
  opgave: |-
    Zijn $x$ en $y$ recht evenredig, omgekeerd evenredig of geen van beide? Geef het voorschrift als het kan.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{1 & 2 & 4 & 5}{20 & 10 & 5 & 4}
      antwoord: |-
        omgekeerd evenredig, $y = \tfrac{20}{x}$
      uitwerking: |-
        De producten zijn $1 \cdot 20 = 2 \cdot 10 = 4 \cdot 5 = 5 \cdot 4 = 20$: omgekeerd evenredig, $y = \tfrac{20}{x}$.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{3 & 6 & 9 & 12}{2 & 4 & 6 & 8}
      antwoord: |-
        recht evenredig, $y = \tfrac23 x$
      uitwerking: |-
        De quotiënten $\tfrac yx$ zijn overal $\tfrac23$: recht evenredig, $y = \tfrac23 x$.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{1 & 2 & 4 & 8}{8 & 6 & 4 & 2}
      antwoord: |-
        geen van beide
      uitwerking: |-
        De producten $8$, $12$, $16$ en $16$ zijn niet gelijk, de quotiënten ook niet. Dat $y$ daalt, volstaat niet.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{0,5 & 1 & 2 & 2,5}{4 & 2 & 1 & 0,8}
      antwoord: |-
        omgekeerd evenredig, $y = \tfrac2x$
      uitwerking: |-
        $0,5 \cdot 4 = 1 \cdot 2 = 2 \cdot 1 = 2,5 \cdot 0,8 = 2$: omgekeerd evenredig, $y = \tfrac2x$.

- id: h4-ontbrekend
  soort: kort
  opgave: |-
    Los op. Ga telkens uit van omgekeerd evenredige grootheden.
  lijst: enumerate
  delen:
    - opgave: |-
        Met $5$ even sterke kranen loopt een zwembad vol in $12$ uur. Hoelang duurt het met $3$ kranen?
      antwoord: |-
        $20$ uur
      uitwerking: |-
        $c = 5 \cdot 12 = 60$, dus met $3$ kranen $\tfrac{60}{3} = 20$ uur.
    - opgave: |-
        Een doos koekjes wordt verdeeld: $8$ kinderen krijgen elk $6$ koekjes. Hoeveel krijgt elk kind als er $12$ kinderen zijn?
      antwoord: |-
        $4$ koekjes
      uitwerking: |-
        Er zijn $8 \cdot 6 = 48$ koekjes, dus elk kind krijgt $\tfrac{48}{12} = 4$ koekjes.
    - opgave: |-
        Vul de tabel aan. \quad \waardetabel[$x$][$y$]{4}{2 & 5 & \vak & 0,5}{10 & \vak & 8 & \vak}
      antwoord: |-
        $c = 20$: $4$, $2,5$ en $40$
      uitwerking: |-
        $c = 2 \cdot 10 = 20$. Dan is $y = \tfrac{20}{5} = 4$, $x = \tfrac{20}{8} = 2,5$ en $y = \tfrac{20}{0,5} = 40$.

- id: h4-tekenen
  soort: kort
  opgave: |-
    Maak een tabel en teken de grafiek.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac{8}{x}$
      antwoord: |-
        takken in het 1ste en 3de kwadrant, door $(2, 4)$ en $(-2, -4)$
      uitwerking: |-
        Met de delers van $8$: $(1, 8)$, $(2, 4)$, $(4, 2)$, $(8, 1)$ en de punten met tegengestelde coördinaten. Takken in het 1ste en het 3de kwadrant.
        \figuren{\begin{tikzpicture}[x=.24cm,y=.24cm]
          \roosterleeg{-8}{1}{8}{-8}{1}{8}\xgetallen{-8,-4,4,8}\ygetallen{-8,-4,4,8}
          \kromme{1}{8.4}{8/\x}\kromme{-8.4}{-1}{8/\x}
          \foreach \a in {1,2,4,8}{\punt{\a}{8/\a}\punt{-\a}{-8/\a}}
        \end{tikzpicture}}
    - opgave: |-
        $g(x) = -\dfrac{2}{x}$
      antwoord: |-
        takken in het 2de en 4de kwadrant, door $(1, -2)$ en $(-1, 2)$
      uitwerking: |-
        $(1, -2)$, $(2, -1)$, $(4; -0,5)$ en de punten met tegengestelde coördinaten. Takken in het 2de en het 4de kwadrant.
        \figuren{\begin{tikzpicture}[x=.36cm,y=.36cm]
          \roosterleeg{-5}{1}{5}{-5}{1}{5}\xgetallen{-4,-2,2,4}\ygetallen{-4,-2,2,4}
          \kromme{.4}{5.2}{-2/\x}\kromme{-5.2}{-.4}{-2/\x}
          \foreach \a in {1,2,4}{\punt{\a}{-2/\a}\punt{-\a}{2/\a}}
        \end{tikzpicture}}

- id: h4-symmetrie
  soort: kort
  opgave: |-
    Het punt ligt op de grafiek van $y = \tfrac{10}{x}$. Geef het punt dat er symmetrisch mee ligt ten opzichte van de oorsprong, en controleer dat het ook op de grafiek ligt.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(2, 5)$
      antwoord: |-
        $(-2, -5)$
      uitwerking: |-
        $\tfrac{10}{-2} = -5$.
    - opgave: |-
        $(-4\,;\,-2,5)$
      antwoord: |-
        $(4\,;\,2,5)$
      uitwerking: |-
        $\tfrac{10}{4} = 2,5$.
    - opgave: |-
        $(0,5\,;\,20)$
      antwoord: |-
        $(-0,5\,;\,-20)$
      uitwerking: |-
        $\tfrac{10}{-0,5} = -20$.

- id: h4-voorschrift
  soort: kort
  opgave: |-
    Een hyperbool met voorschrift $y = \tfrac cx$ gaat door het gegeven punt. Geef het voorschrift.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $(2, 7)$
      antwoord: |-
        $y = \tfrac{14}{x}$
      uitwerking: |-
        $c = 2 \cdot 7 = 14$.
    - opgave: |-
        $(-5, 3)$
      antwoord: |-
        $y = -\tfrac{15}{x}$
      uitwerking: |-
        $c = (-5) \cdot 3 = -15$.
    - opgave: |-
        $(-4\,;\,-0,5)$
      antwoord: |-
        $y = \tfrac{2}{x}$
      uitwerking: |-
        $c = (-4) \cdot (-0,5) = 2$.
    - opgave: |-
        $(0,5\,;\,6)$
      antwoord: |-
        $y = \tfrac{3}{x}$
      uitwerking: |-
        $c = 0,5 \cdot 6 = 3$.

- id: h4-kenmerken
  soort: kort
  opgave: |-
    Geef het domein, het bereik, de nulwaarden, het tekenschema, en waar de functie stijgt of daalt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac{3}{x}$
      antwoord: |-
        $\R_0$, $\R_0$, geen; $-$ voor $0$, $+$ na $0$; dalend op $\ivoo{\minf}{0}$ en op $\ivoo{0}{\pinf}$
      uitwerking: |-
        $c = 3 > 0$. $\dom f = \ber f = \R_0$, geen nulwaarden, dalend op $\ivoo{\minf}{0}$ en dalend op $\ivoo{0}{\pinf}$.
        \figuren{\tekenschema{3}{ & 0 & }{- & | & +}}
    - opgave: |-
        $g(x) = -\dfrac{10}{x}$
      antwoord: |-
        $\R_0$, $\R_0$, geen; $+$ voor $0$, $-$ na $0$; stijgend op $\ivoo{\minf}{0}$ en op $\ivoo{0}{\pinf}$
      uitwerking: |-
        $c = -10 < 0$. $\dom g = \ber g = \R_0$, geen nulwaarden, stijgend op $\ivoo{\minf}{0}$ en stijgend op $\ivoo{0}{\pinf}$.
        \figuren{\tekenschema[g(x)]{3}{ & 0 & }{+ & | & -}}

- id: h4-verloopsnel
  soort: kort
  opgave: |-
    Heeft de functie op het gegeven interval een toenemende of een afnemende stijging of daling? Controleer met drie functiewaarden.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac4x$ op $\ivoo{0}{\pinf}$
      antwoord: |-
        afnemende daling
      uitwerking: |-
        $f(1) = 4$, $f(2) = 2$, $f(3) = \tfrac43$: de stappen omlaag zijn $2$ en $\tfrac23$, steeds kleiner.
    - opgave: |-
        $f(x) = \dfrac4x$ op $\ivoo{\minf}{0}$
      antwoord: |-
        toenemende daling
      uitwerking: |-
        $f(-3) = -\tfrac43$, $f(-2) = -2$, $f(-1) = -4$: de stappen omlaag zijn $\tfrac23$ en $2$, steeds groter.
    - opgave: |-
        $g(x) = -\dfrac2x$ op $\ivoo{0}{\pinf}$
      antwoord: |-
        afnemende stijging
      uitwerking: |-
        $g(1) = -2$, $g(2) = -1$, $g(3) = -\tfrac23$: de stappen omhoog zijn $1$ en $\tfrac13$, steeds kleiner.
    - opgave: |-
        $g(x) = -\dfrac2x$ op $\ivoo{\minf}{0}$
      antwoord: |-
        toenemende stijging
      uitwerking: |-
        $g(-3) = \tfrac23$, $g(-2) = 1$, $g(-1) = 2$: de stappen omhoog zijn $\tfrac13$ en $1$, steeds groter.

- id: h4-vergelijking
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{15}{x} = 5$
      antwoord: |-
        $x = 3$
      uitwerking: |-
        $15 = 5x$, dus $x = 3$.
    - opgave: |-
        $\dfrac{8}{x} = -2$
      antwoord: |-
        $x = -4$
      uitwerking: |-
        $8 = -2x$, dus $x = -4$.
    - opgave: |-
        $-\dfrac{20}{x} = 4$
      antwoord: |-
        $x = -5$
      uitwerking: |-
        $-20 = 4x$, dus $x = -5$.
    - opgave: |-
        $\dfrac{9}{x} = 6$
      antwoord: |-
        $x = 1,5$
      uitwerking: |-
        $9 = 6x$, dus $x = \tfrac96 = 1,5$.
    - opgave: |-
        $\dfrac{2}{x} = 0,5$
      antwoord: |-
        $x = 4$
      uitwerking: |-
        $2 = 0,5x$, dus $x = 4$.
    - opgave: |-
        $\dfrac{6}{x} = 0$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        Dan zou $6 = 0 \cdot x = 0$: onmogelijk. De functiewaarde $0$ komt niet voor.

- id: h4-ongelijkheid
  soort: kort
  opgave: |-
    De figuur toont de grafiek van $f(x) = \tfrac4x$ en de rechten $y = 1$ en $y = -2$. Los grafisch op.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.27cm,y=.27cm]
        \roosterleeg{-6}{1}{6}{-6}{1}{6}\xgetallen{-4,-2,2,4}\ygetallen{-4,-2,2,4}
        \kromme{.7}{6.3}{4/\x}\kromme{-6.3}{-.7}{4/\x}
        \draw[hulplijn] (-6,1) -- (6,1);\draw[hulplijn] (-6,-2) -- (6,-2);
        \punt{4}{1}\punt{-2}{-2}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        $\dfrac4x > 1$
      antwoord: |-
        $\ivoo{0}{4}$
      uitwerking: |-
        Snijpunt $(4, 1)$. Alleen de rechtertak ligt boven de rechte, tussen $0$ en $4$: $V = \ivoo{0}{4}$.
    - opgave: |-
        $\dfrac4x \leqslant -2$
      antwoord: |-
        $\ivgo{-2}{0}$
      uitwerking: |-
        Snijpunt $(-2, -2)$. De linkertak ligt op of onder de rechte vanaf $-2$ tot aan $0$: $V = \ivgo{-2}{0}$.
    - opgave: |-
        $\dfrac4x < 1$
      antwoord: |-
        $\ivoo{\minf}{0} \cup \ivoo{4}{\pinf}$
      uitwerking: |-
        De hele linkertak ligt onder de rechte, en de rechtertak rechts van $4$: $V = \ivoo{\minf}{0} \cup \ivoo{4}{\pinf}$.

# --- Opdrachten ------------------------------------------------------------------------

- id: h4-o1
  soort: opdracht
  niveau: 1
  thema: |-
    recht of omgekeerd evenredig in een tabel
  opgave: |-
    Zijn $x$ en $y$ recht evenredig, omgekeerd evenredig of geen van beide? Geef het voorschrift als het kan.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{1 & 3 & 4 & 12}{24 & 8 & 6 & 2}
      antwoord: |-
        omgekeerd evenredig, $y = \tfrac{24}{x}$
      uitwerking: |-
        Alle producten zijn $24$.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{2 & 4 & 5 & 10}{5 & 10 & 12,5 & 25}
      antwoord: |-
        recht evenredig, $y = 2,5x$
      uitwerking: |-
        Alle quotiënten $\tfrac yx$ zijn $2,5$.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{1 & 2 & 3 & 4}{60 & 30 & 20 & 12}
      antwoord: |-
        geen van beide
      uitwerking: |-
        De eerste drie producten zijn $60$, maar $4 \cdot 12 = 48$. Kijk altijd alle kolommen na.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{-2 & -1 & 1 & 4}{3 & 6 & -6 & -1,5}
      antwoord: |-
        omgekeerd evenredig, $y = -\tfrac{6}{x}$
      uitwerking: |-
        Alle producten zijn $-6$.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{1 & 2 & 3 & 4}{10 & 7 & 4 & 1}
      antwoord: |-
        geen van beide
      uitwerking: |-
        De producten $10$, $14$, $12$, $4$ verschillen. Het is een eerstegraadsfunctie: $y = -3x + 13$.

