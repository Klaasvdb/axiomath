  soort: opdracht
  niveau: 1
  thema: |-
    functiewaarden van c/x
  opgave: |-
    Gegeven is $f(x) = \dfrac{24}{x}$. Bereken.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $f(3)$
      antwoord: |-
        $8$
    - opgave: |-
        $f(-6)$
      antwoord: |-
        $-4$
    - opgave: |-
        $f(0,5)$
      antwoord: |-
        $48$
    - opgave: |-
        $f(48)$
      antwoord: |-
        $0,5$
    - opgave: |-
        $f(-0,2)$
      antwoord: |-
        $-120$
    - opgave: |-
        $f(100)$
      antwoord: |-
        $0,24$
    - opgave: |-
        $f(-24)$
      antwoord: |-
        $-1$
    - opgave: |-
        $f(0)$
      antwoord: |-
