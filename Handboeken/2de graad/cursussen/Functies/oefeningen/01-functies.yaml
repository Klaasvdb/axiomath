# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.
# pakketten: letters als argument (h1-o23) en een functie in stukken (h1-o25) alleen in 5.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
        \rooster{-4}{1}{4}{-3}{1}{4}
        \punt{3}{2}\node[above right,inner sep=1pt] at (3,2) {$A$};
        \punt{-2}{3}\node[above right,inner sep=1pt] at (-2,3) {$B$};
        \punt{-3}{-2}\node[below left,inner sep=1pt] at (-3,-2) {$C$};
        \punt{0}{-2}\node[right,inner sep=2pt] at (0,-2) {$D$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Lees de coördinaten van de punten $A$, $B$, $C$ en $D$ af.
      antwoord: |-
        $A(3, 2)$, $B(-2, 3)$, $C(-3, -2)$, $D(0, -2)$
      uitwerking: |-
        Eerst de $x$-coördinaat (horizontaal), dan de $y$-coördinaat (verticaal): $A(3, 2)$, $B(-2, 3)$, $C(-3, -2)$ en $D(0, -2)$.
    - opgave: |-
        Bereken $3a - 5$ voor $a = 4$ en voor $a = -2$.
      antwoord: |-
        $7$ en $-11$
      uitwerking: |-
        $3 \cdot 4 - 5 = 7$ en $3 \cdot (-2) - 5 = -6 - 5 = -11$.
    - opgave: |-
        Bereken $2t^2$ voor $t = 3$ en voor $t = -1$.
      antwoord: |-
        $18$ en $2$
      uitwerking: |-
        Eerst de macht: $2 \cdot 9 = 18$ en $2 \cdot (-1)^2 = 2 \cdot 1 = 2$.
    - opgave: |-
        Een liter melk kost $1,20$ euro. Hoeveel kosten 5 liter? Is de prijs recht evenredig met het aantal liter?
      antwoord: |-
        $6$ euro; ja
      uitwerking: |-
        $5 \cdot 1,20 = 6$ euro. Ja: twee keer zoveel liter kost twee keer zoveel, en 0 liter kost niets.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Bij elke leerling van je klas hoort zijn of haar lengte, in cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Kan één leerling twee verschillende lengtes hebben?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: op een bepaald moment heeft elke leerling precies één lengte.
    - opgave: |-
        Kunnen twee leerlingen dezelfde lengte hebben?
      antwoord: |-
        ja
      uitwerking: |-
        Ja, bijvoorbeeld twee leerlingen van 165 cm.
    - opgave: |-
        Je weet alleen dat een leerling 165 cm groot is. Weet je dan zeker over welke leerling het gaat?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: er kunnen meerdere leerlingen van 165 cm zijn, of geen enkele.
    - opgave: |-
        In welke richting krijg je altijd hoogstens één antwoord: van leerling naar lengte, of van lengte naar leerling?
      antwoord: |-
        van leerling naar lengte
      uitwerking: |-
        Van leerling naar lengte: bij een leerling hoort één lengte. Bij een lengte kunnen meerdere leerlingen horen.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h1-veranderlijken
  soort: kort
  opgave: |-
    Welke grootheid is de onafhankelijke veranderlijke, en welke de afhankelijke?
  lijst: enumerate
  delen:
    - opgave: |-
        Het aantal liter benzine dat je tankt, en het bedrag dat je betaalt.
      antwoord: |-
        onafhankelijk: het aantal liter
      uitwerking: |-
        Je kiest hoeveel liter je tankt; het bedrag volgt daaruit. Het aantal liter is onafhankelijk, het bedrag afhankelijk.
    - opgave: |-
        De temperatuur van een kop thee, en de tijd sinds je ze hebt ingeschonken.
      antwoord: |-
        onafhankelijk: de tijd
      uitwerking: |-
        De temperatuur hangt af van de tijd: de tijd is onafhankelijk, de temperatuur afhankelijk.
    - opgave: |-
        De oppervlakte van een vierkant, en de lengte van zijn zijde.
      antwoord: |-
        onafhankelijk: de zijde
      uitwerking: |-
        Kies de zijde, dan ligt de oppervlakte vast: de zijde is onafhankelijk, de oppervlakte afhankelijk.
    - opgave: |-
        De tijd die je nodig hebt om 10 km te fietsen, en je snelheid.
      antwoord: |-
        onafhankelijk: de snelheid
      uitwerking: |-
        Hoe sneller je fietst, hoe korter het duurt: de snelheid is onafhankelijk, de tijd afhankelijk.

- id: h1-grafiek
  soort: kort
  opgave: |-
    De grafiek toont de temperatuur $T$ (in $^\circ$C) in een serre tussen 6 uur en 18 uur.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.27cm,y=.075cm]
        \roosterleeg[$t$ (h)][$T$]{0}{2}{18}{0}{5}{35}
        \xgetallen{6,10,14,18}\ygetallen{10,20,30}\oorsprong
        \doorpunten{(6,10) (8,14) (10,20) (12,26) (14,30) (16,26) (18,18)}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe warm is het om 8 uur?
      antwoord: |-
        $14\ ^\circ$C
      uitwerking: |-
        Boven $t = 8$ ligt de grafiek op hoogte 14.
    - opgave: |-
        Wanneer is het $26\ ^\circ$C?
      antwoord: |-
        om 12 uur en om 16 uur
      uitwerking: |-
        De horizontale rechte op hoogte 26 snijdt de grafiek twee keer: bij $t = 12$ en bij $t = 16$.
    - opgave: |-
        Wanneer is het het warmst, en hoe warm is het dan?
      antwoord: |-
        om 14 uur, $30\ ^\circ$C
      uitwerking: |-
        Het hoogste punt van de grafiek is $(14, 30)$.
    - opgave: |-
        Hoeveel graden stijgt de temperatuur tussen 6 uur en 10 uur?
      antwoord: |-
        $10\ ^\circ$C
      uitwerking: |-
        Van $10\ ^\circ$C naar $20\ ^\circ$C: een stijging van $10\ ^\circ$C.

- id: h1-formule
  soort: kort
  opgave: |-
    Een vuistregel zegt dat een auto op een droge weg een remweg van ongeveer $d = \bigl(\tfrac{v}{10}\bigr)^2$ meter heeft bij een snelheid van $v$ km/h.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de remweg bij 50 km/h en bij 120 km/h.
      antwoord: |-
        $25$ m en $144$ m
      uitwerking: |-
        $\bigl(\tfrac{50}{10}\bigr)^2 = 5^2 = 25$ m en $\bigl(\tfrac{120}{10}\bigr)^2 = 12^2 = 144$ m.
    - opgave: |-
        Maak een tabel voor $v = 0$, 30, 60, 90 en 120.
      antwoord: |-
        $0,\ 9,\ 36,\ 81,\ 144$
      uitwerking: |-
        \waardetabel[$v$][$d$]{5}{0 & 30 & 60 & 90 & 120}{0 & 9 & 36 & 81 & 144}
    - opgave: |-
        Wordt de remweg twee keer zo lang als je twee keer zo snel rijdt?
      antwoord: |-
        nee, vier keer zo lang
      uitwerking: |-
        Nee: bij 60 km/h is de remweg 36 m, bij 120 km/h 144 m. Dat is vier keer zo lang, want $2^2 = 4$.

- id: h1-functieofniet
  soort: kort
  opgave: |-
    Is $y$ een functie van $x$? Leg uit.
  lijst: enumerate
  delen:
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{1 & 2 & 3 & 4}{5 & 5 & 5 & 5}
      antwoord: |-
        ja
      uitwerking: |-
        Ja: bij elke $x$ hoort één $y$. Dat het telkens dezelfde $y$ is, mag.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{0 & 1 & 1 & 2}{3 & 4 & -4 & 5}
      antwoord: |-
        nee
      uitwerking: |-
        Nee: bij $x = 1$ horen twee waarden, 4 en $-4$.
    - opgave: |-
        $x$ is een leerling, $y$ is zijn of haar leeftijd in jaren.
      antwoord: |-
        ja
      uitwerking: |-
        Ja: elke leerling heeft één leeftijd.
    - opgave: |-
        $x$ is een leeftijd in jaren, $y$ is een leerling van die leeftijd.
      antwoord: |-
        nee
      uitwerking: |-
        Nee: bij 15 jaar kunnen meerdere leerlingen horen.

- id: h1-functiewaarde
  soort: kort
  opgave: |-
    Gegeven: $f(x) = 4x - 1$ en $g(x) = x^2 + 3x$. Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(3)$
      antwoord: |-
        $11$
      uitwerking: |-
        $4 \cdot 3 - 1 = 11$.
    - opgave: |-
        $f(-2)$
      antwoord: |-
        $-9$
      uitwerking: |-
        $4 \cdot (-2) - 1 = -9$.
    - opgave: |-
        $f(0)$
      antwoord: |-
        $-1$
      uitwerking: |-
        $4 \cdot 0 - 1 = -1$.
    - opgave: |-
        $g(2)$
      antwoord: |-
        $10$
      uitwerking: |-
        $4 + 6 = 10$.
    - opgave: |-
        $g(-1)$
      antwoord: |-
        $-2$
      uitwerking: |-
        $(-1)^2 + 3 \cdot (-1) = 1 - 3 = -2$.
    - opgave: |-
        $g(-4)$
      antwoord: |-
        $4$
      uitwerking: |-
        $(-4)^2 + 3 \cdot (-4) = 16 - 12 = 4$.

- id: h1-verticaal
  soort: kort
  opgave: |-
    Welke krommen zijn de grafiek van een functie?

    \figuren{\begin{tikzpicture}[x=.36cm,y=.36cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \kromme{-2.2}{2.2}{(\x)^2/2-2}
      \node[font=\footnotesize] at (0,-3.9) {a};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.36cm,y=.36cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \draw[accent,thick] (2.5,0) arc (0:180:2.5);
      \node[font=\footnotesize] at (0,-3.9) {b};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.36cm,y=.36cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \draw[accent,thick] (0,0) ellipse (2.6 and 1.6);
      \node[font=\footnotesize] at (0,-3.9) {c};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.36cm,y=.36cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \draw[accent,thick] plot[domain=-2.1:2.1,samples=50,smooth] ({(\x)^3-3*(\x)},\x);
      \node[font=\footnotesize] at (0,-3.9) {d};
    \end{tikzpicture}}
  antwoord: |-
    a en b
  uitwerking: |-
    a en b zijn functies: elke verticale rechte snijdt ze hoogstens één keer (bij b alleen van $-2,5$ tot $2,5$). Bij c en d snijdt een verticale rechte zoals $x = 1$ de kromme meer dan één keer.

- id: h1-aflezen
  soort: kort
  opgave: |-
    Hiernaast staat de grafiek van een functie $g$. Lees af.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm]
        \rooster{-4}{1}{4}{-2}{1}{4}
        \doorpunten{(-4,1) (-3,3) (-2,4) (-1,3) (0,1) (1,-1) (2,-2) (3,-1) (4,1)}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        $g(-3)$, \ $g(0)$ en $g(1)$
      antwoord: |-
        $3$, $1$ en $-1$
      uitwerking: |-
        Boven $x = -3$ ligt de grafiek op hoogte 3, bij $x = 0$ op hoogte 1, bij $x = 1$ op hoogte $-1$.
    - opgave: |-
        De waarden van $x$ waarvoor $g(x) = 3$.
      antwoord: |-
        $x = -3$ of $x = -1$
      uitwerking: |-
        De horizontale rechte op hoogte 3 snijdt de grafiek bij $x = -3$ en bij $x = -1$.
    - opgave: |-
        De waarden van $x$ waarvoor $g(x) = 1$.
      antwoord: |-
        $x = -4$, $x = 0$ of $x = 4$
      uitwerking: |-
        Op hoogte 1 liggen drie punten van de grafiek: bij $x = -4$, $0$ en $4$.

- id: h1-tekenen
  soort: kort
  opgave: |-
    Maak een tabel en teken de grafiek.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = x^2 - 3$, voor $x$ van $-3$ tot 3
      antwoord: |-
        $6,\ 1,\ {-2},\ {-3},\ {-2},\ 1,\ 6$
      uitwerking: |-
        \waardetabel{7}{-3 & -2 & -1 & 0 & 1 & 2 & 3}{6 & 1 & -2 & -3 & -2 & 1 & 6}
        \figuren{\begin{tikzpicture}[x=.45cm,y=.3cm]
          \rooster{-4}{1}{4}{-4}{1}{7}
          \kromme{-3.2}{3.2}{(\x)^2-3}
          \foreach \t in {-3,...,3}{\punt{\t}{\t*\t-3}}
        \end{tikzpicture}}
    - opgave: |-
        $g(x) = -x^2 + 2x$, voor $x$ van $-1$ tot 3
      antwoord: |-
        $-3,\ 0,\ 1,\ 0,\ {-3}$
      uitwerking: |-
        \waardetabel[$x$][$g(x)$]{5}{-1 & 0 & 1 & 2 & 3}{-3 & 0 & 1 & 0 & -3}
        \figuren{\begin{tikzpicture}[x=.45cm,y=.45cm]
          \rooster{-2}{1}{4}{-4}{1}{2}
          \kromme{-1.2}{3.2}{-(\x)^2+2*(\x)}
          \foreach \t in {-1,...,3}{\punt{\t}{-\t*\t+2*\t}}
        \end{tikzpicture}}

- id: h1-voorschrift
  soort: kort
  opgave: |-
    Stel een voorschrift op.
  lijst: enumerate
  delen:
    - opgave: |-
        Een zwembad vraagt 4 euro per beurt. Druk de prijs $p$ uit in functie van het aantal beurten $n$.
      antwoord: |-
        $p(n) = 4n$
      uitwerking: |-
        Per beurt 4 euro: $p(n) = 4n$.
    - opgave: |-
        Een fietsverhuur rekent 5 euro huur en $2,50$ euro per uur. Druk de prijs $p$ uit in functie van het aantal uur $t$.
      antwoord: |-
        $p(t) = 2,5\,t + 5$
      uitwerking: |-
        Bijvoorbeeld 2 uur: $2,5 \cdot 2 + 5 = 10$ euro. Met $t$: $p(t) = 2,5\,t + 5$.
    - opgave: |-
        Een tank met 60 liter water loopt leeg, 3 liter per minuut. Druk de hoeveelheid water $W$ uit in functie van de tijd $t$ in minuten.
      antwoord: |-
        $W(t) = 60 - 3t$
      uitwerking: |-
        Na $t$ minuten is er $3t$ liter weggelopen: $W(t) = 60 - 3t$.
    - opgave: |-
        Een vierkant heeft een zijde van $z$ cm. Druk de omtrek $O$ en de oppervlakte $A$ uit in functie van $z$.
      antwoord: |-
        $O(z) = 4z$, $A(z) = z^2$
      uitwerking: |-
        Vier gelijke zijden: $O(z) = 4z$. Zijde maal zijde: $A(z) = z^2$.
    - opgave: |-
        Bij welke van deze vier verbanden bestaat de grafiek uit losse punten?
      antwoord: |-
        bij het zwembad
      uitwerking: |-
        Bij het zwembad: het aantal beurten is een natuurlijk getal. De tijd en de lengte van een zijde kunnen elke waarde aannemen.

- id: h1-verhaal
  soort: kort
  opgave: |-
    Tibo fietst naar de sporthal. De grafiek toont zijn afstand $d$ tot thuis (in km) in functie van de tijd $t$ (in minuten).
  figuur:
    code: |-
      \begin{tikzpicture}[x=.2cm,y=.38cm]
        \roosterleeg[$t$][$d$]{0}{4}{28}{0}{1}{7}
        \xgetallen{8,16,24}\ygetallen{2,4,6}\oorsprong
        \gebroken{(0,0) (12,3) (16,3) (24,6)}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe ver woont Tibo van de sporthal, en hoe lang duurt de rit?
      antwoord: |-
        6 km, 24 minuten
      uitwerking: |-
        De grafiek eindigt in $(24, 6)$: 6 km in 24 minuten.
    - opgave: |-
        Wat gebeurt er tussen de 12de en de 16de minuut?
      antwoord: |-
        Tibo staat stil
      uitwerking: |-
        De afstand blijft 3 km: Tibo staat stil, bijvoorbeeld aan een overweg.
    - opgave: |-
        Op welk stuk fietst hij het snelst? Hoe zie je dat?
      antwoord: |-
        op het laatste stuk
      uitwerking: |-
        Op het laatste stuk: 3 km in 8 minuten, tegenover 3 km in 12 minuten op het eerste stuk. Dat stuk van de grafiek is steiler.

# --- Opdrachten ------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    functiewaarden berekenen
  opgave: |-
    Gegeven: $f(x) = -2x + 7$, \ $g(x) = x^2 - 4x$ en $h(x) = \dfrac{x + 3}{2}$. Bereken.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $f(0)$
      antwoord: |-
        $7$
      uitwerking: |-
        $-2 \cdot 0 + 7 = 7$.
    - opgave: |-
        $f(5)$
      antwoord: |-
        $-3$
      uitwerking: |-
        $-10 + 7 = -3$.
    - opgave: |-
        $f(-4)$
      antwoord: |-
        $15$
      uitwerking: |-
        $-2 \cdot (-4) + 7 = 8 + 7 = 15$.
    - opgave: |-
        $f\bigl(\tfrac12\bigr)$
      antwoord: |-
        $6$
      uitwerking: |-
        $-1 + 7 = 6$.
    - opgave: |-
        $g(1)$
      antwoord: |-
        $-3$
      uitwerking: |-
        $1 - 4 = -3$.
    - opgave: |-
        $g(-2)$
      antwoord: |-
        $12$
      uitwerking: |-
        $(-2)^2 - 4 \cdot (-2) = 4 + 8 = 12$.
    - opgave: |-
        $g(4)$
      antwoord: |-
        $0$
      uitwerking: |-
        $16 - 16 = 0$.
    - opgave: |-
        $g\bigl(\tfrac12\bigr)$
      antwoord: |-
        $-\tfrac74$
      uitwerking: |-
        $\tfrac14 - 2 = -\tfrac74 = -1,75$.
    - opgave: |-
        $h(1)$
      antwoord: |-
        $2$
      uitwerking: |-
        $\tfrac{1 + 3}{2} = 2$.
    - opgave: |-
        $h(-5)$
      antwoord: |-
        $-1$
      uitwerking: |-
        $\tfrac{-5 + 3}{2} = \tfrac{-2}{2} = -1$.
    - opgave: |-
        $h(0)$
      antwoord: |-
        $\tfrac32$
      uitwerking: |-
        $\tfrac{0 + 3}{2} = \tfrac32 = 1,5$.
    - opgave: |-
        $h(-3)$
      antwoord: |-
        $0$
      uitwerking: |-
        $\tfrac{-3 + 3}{2} = 0$.

