- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    functiewaarden aflezen op een grafiek
  opgave: |-
    Hiernaast staat de grafiek van een functie $f$, een gebroken lijn.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm]
        \rooster{-5}{1}{5}{-3}{1}{4}
        \gebroken{(-5,1) (-3,3) (-1,3) (1,-1) (3,-2) (5,2)}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af: $f(-3)$, $f(0)$, $f(3)$ en $f(4)$.
      antwoord: |-
        $3$, $1$, $-2$, $0$
      uitwerking: |-
        $f(-3) = 3$ en $f(3) = -2$ zijn knikpunten. Tussen $(-1, 3)$ en $(1, -1)$ daalt de lijn 2 per stap, dus $f(0) = 1$. Tussen $(3, -2)$ en $(5, 2)$ stijgt ze 2 per stap, dus $f(4) = 0$.
    - opgave: |-
        Voor welke waarden van $x$ is $f(x) = 2$?
      antwoord: |-
        $x = -4$, $x = -\tfrac12$ of $x = 5$
      uitwerking: |-
        De horizontale rechte op hoogte 2 snijdt de grafiek drie keer: bij $x = -4$ (halverwege tussen $-5$ en $-3$), bij $x = -\tfrac12$ en bij $x = 5$.
    - opgave: |-
        Voor welke waarden van $x$ is $f(x) = -1$?
      antwoord: |-
        $x = 1$ of $x = 3,5$
      uitwerking: |-
        Bij $x = 1$ (een knikpunt) en bij $x = 3,5$, halverwege tussen 3 en 4.
    - opgave: |-
        Voor welke waarden van $x$ is $f(x) = 3$? Wat is er bijzonder?
      antwoord: |-
        alle $x$ van $-3$ tot $-1$
      uitwerking: |-
        Alle $x$ van $-3$ tot en met $-1$: daar is de grafiek horizontaal. Bij één functiewaarde hoort hier een heel stuk van de $x$-as.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    verwoording, voorschrift en functiewaarden
  opgave: |-
    Een loodgieter rekent 40 euro voorrijkosten en 50 euro per uur werk.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke grootheid is de onafhankelijke veranderlijke, en welke de afhankelijke?
      antwoord: |-
        onafhankelijk: de werktijd; afhankelijk: de prijs
      uitwerking: |-
        De prijs hangt af van de werktijd: de tijd $t$ (in uur) is onafhankelijk, de prijs $p$ (in euro) afhankelijk.
    - opgave: |-
        Stel een voorschrift op voor de prijs.
      antwoord: |-
        $p(t) = 50t + 40$
      uitwerking: |-
        $50$ euro per uur plus 40 euro: $p(t) = 50t + 40$.
    - opgave: |-
        Bereken de prijs voor $2,5$ uur werk.
      antwoord: |-
        $165$ euro
      uitwerking: |-
        $p(2,5) = 50 \cdot 2,5 + 40 = 125 + 40 = 165$ euro.
    - opgave: |-
        Een factuur bedraagt 215 euro. Hoe lang heeft de loodgieter gewerkt?
      antwoord: |-
        $3,5$ uur
      uitwerking: |-
        Zonder de voorrijkosten is dat $215 - 40 = 175$ euro, en $175 : 50 = 3,5$ uur.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    grafiek van een functie herkennen
  opgave: |-
    Welke krommen zijn de grafiek van een functie? Leg uit.

    \figuren{\begin{tikzpicture}[x=.3cm,y=.3cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \rechte{-3}{3}{-0.6}{0.5}
      \node[font=\footnotesize] at (0,-4.2) {a};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.3cm,y=.3cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \draw[accent,thick] (1.5,-3) -- (1.5,3);
      \node[font=\footnotesize] at (0,-4.2) {b};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.3cm,y=.3cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \gebroken{(-3,3) (0,-1) (3,3)}
      \node[font=\footnotesize] at (0,-4.2) {c};
    \end{tikzpicture}\par\vspace{1mm}
    \begin{tikzpicture}[x=.3cm,y=.3cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \draw[accent,thick] (0,0) circle (2);
      \node[font=\footnotesize] at (0,-4.2) {d};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.3cm,y=.3cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \draw[accent,thick] (-3,-2) -- (-1,-2) (-1,0) -- (1,0) (1,2) -- (3,2);
      \punt{-1}{-2}\openpunt{-1}{0}\punt{1}{0}\openpunt{1}{2}
      \node[font=\footnotesize] at (0,-4.2) {e};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.3cm,y=.3cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \draw[accent,thick] (-3,-2) -- (-1,-2) (-1,0) -- (1,0) (1,2) -- (3,2);
      \punt{-1}{-2}\punt{-1}{0}\punt{1}{0}\punt{1}{2}
      \node[font=\footnotesize] at (0,-4.2) {f};
    \end{tikzpicture}}
  antwoord: |-
    a, c en e
  uitwerking: |-
    a, c en e zijn functies: elke verticale rechte snijdt ze hoogstens één keer. Bij e hoort bij $x = -1$ en $x = 1$ telkens alleen het volle bolletje. Geen functie: b (de rechte $x = 1,5$ bevat oneindig veel punten met dezelfde $x$), d (de rechte $x = 0$ snijdt de cirkel twee keer) en f (bij $x = -1$ horen $y = -2$ en $y = 0$).

- id: h1-o8
  soort: opdracht
  niveau: 1
  thema: |-
    van voorschrift naar tabel en grafiek
  opgave: |-
    Maak een tabel met gehele waarden van $x$ en teken de grafiek.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = 2x - 3$, voor $x$ van $-1$ tot 3
      antwoord: |-
        $-5,\ {-3},\ {-1},\ 1,\ 3$; een rechte
      uitwerking: |-
        \waardetabel{5}{-1 & 0 & 1 & 2 & 3}{-5 & -3 & -1 & 1 & 3}
        \figuren{\begin{tikzpicture}[x=.4cm,y=.3cm]
          \rooster{-2}{1}{4}{-6}{1}{4}
          \rechte{-1.2}{3.2}{2}{-3}
          \foreach \t in {-1,...,3}{\punt{\t}{2*\t-3}}
        \end{tikzpicture}}
    - opgave: |-
        $g(x) = x^2 - 4$, voor $x$ van $-3$ tot 3
      antwoord: |-
        $5,\ 0,\ {-3},\ {-4},\ {-3},\ 0,\ 5$
      uitwerking: |-
        \waardetabel[$x$][$g(x)$]{7}{-3 & -2 & -1 & 0 & 1 & 2 & 3}{5 & 0 & -3 & -4 & -3 & 0 & 5}
        \figuren{\begin{tikzpicture}[x=.4cm,y=.3cm]
          \rooster{-4}{1}{4}{-5}{1}{6}
          \kromme{-3.2}{3.2}{(\x)^2-4}
          \foreach \t in {-3,...,3}{\punt{\t}{\t*\t-4}}
        \end{tikzpicture}}
    - opgave: |-
        $h(x) = -\tfrac12 x^2 + 2$, voor $x$ van $-2$ tot 2
      antwoord: |-
        $0,\ 1,5,\ 2,\ 1,5,\ 0$
      uitwerking: |-
        \waardetabel[$x$][$h(x)$]{5}{-2 & -1 & 0 & 1 & 2}{0 & 1,5 & 2 & 1,5 & 0}
        \figuren{\begin{tikzpicture}[x=.6cm,y=.6cm]
          \rooster{-3}{1}{3}{-1}{1}{3}
          \kromme{-2.3}{2.3}{-(\x)^2/2+2}
          \foreach \t in {-2,...,2}{\punt{\t}{-\t*\t/2+2}}
        \end{tikzpicture}}

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    een grafiek in woorden
  opgave: |-
    De grafiek toont hoeveel water $W$ (in liter) er in het bad van Sam zit, in functie van de tijd $t$ (in minuten).
  figuur:
    code: |-
      \begin{tikzpicture}[x=.14cm,y=.018cm]
        \roosterleeg[$t$][$W$]{0}{5}{40}{0}{25}{175}
        \xgetallen{10,20,30,40}\ygetallen{50,100,150}\oorsprong
        \gebroken{(0,0) (8,120) (10,120) (11,150) (30,150) (31,120) (39,0)}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel liter loopt er per minuut in het bad terwijl de kraan openstaat?
      antwoord: |-
        $15$ liter per minuut
      uitwerking: |-
        In 8 minuten 120 liter: $120 : 8 = 15$ liter per minuut.
    - opgave: |-
        Wat gebeurt er tussen de 8ste en de 10de minuut, en wat tussen de 10de en de 11de?
      antwoord: |-
        kraan dicht; Sam stapt in bad
      uitwerking: |-
        Van 8 tot 10 minuten blijft het water op 120 liter: de kraan is dicht. Daarna stijgt het peil plots met 30 liter zonder kraan: Sam stapt in het bad.
    - opgave: |-
        Hoe lang ligt Sam in bad?
      antwoord: |-
        $19$ minuten
      uitwerking: |-
        Van de 11de tot de 30ste minuut: 19 minuten.
    - opgave: |-
        Wat gebeurt er op het einde? Hoeveel liter per minuut loopt er weg?
      antwoord: |-
        Sam stapt uit en het bad loopt leeg, $15$ liter per minuut
      uitwerking: |-
        In de 31ste minuut stapt Sam uit (het peil zakt met 30 liter). Daarna loopt het bad leeg: 120 liter in 8 minuten, dus 15 liter per minuut.

- id: h1-o9
  soort: opdracht
  niveau: 1
  thema: |-
    tabel en voorschrift koppelen
  opgave: |-
    Welk voorschrift hoort bij welke tabel? Eén voorschrift blijft over.

    \vspace{1mm}
    \begin{tabular}{@{}l@{\hspace{8mm}}l@{}}
    A \ \waardetabel[$x$][$y$]{4}{0 & 1 & 2 & 3}{1 & 3 & 5 & 7} & B \ \waardetabel[$x$][$y$]{4}{0 & 1 & 2 & 3}{0 & 1 & 4 & 9} \\[8mm]
    C \ \waardetabel[$x$][$y$]{4}{0 & 1 & 2 & 3}{3 & 2 & 1 & 0} & D \ \waardetabel[$x$][$y$]{4}{0 & 1 & 2 & 3}{0 & 2 & 8 & 18}
    \end{tabular}

    \vspace{2mm}
    $y = x^2$ \qquad $y = x + 2$ \qquad $y = 2x^2$ \qquad $y = 2x + 1$ \qquad $y = 3 - x$
  antwoord: |-
    A: $y = 2x + 1$; B: $y = x^2$; C: $y = 3 - x$; D: $y = 2x^2$; $y = x + 2$ blijft over
  uitwerking: |-
    Vul telkens een paar waarden van $x$ in. A: $2 \cdot 3 + 1 = 7$, dus $y = 2x + 1$. B: de kwadraten, $y = x^2$. C: $3 - x$ daalt van 3 naar 0. D: het dubbele van de kwadraten, $y = 2x^2$. Het voorschrift $y = x + 2$ geeft bij $x = 0$ de waarde 2, en die staat in geen enkele tabel.

- id: h1-o5
  soort: opdracht
  niveau: 2
  thema: |-
    context: tabel, grafiek en voorschrift
  opgave: |-
    Iemand gooit een bal recht omhoog. Na $t$ seconden is de bal $h(t) = 20t - 5t^2$ meter hoog.
  lijst: enumerate
  delen:
    - opgave: |-
        Maak een tabel voor $t = 0$, 1, 2, 3 en 4.
      antwoord: |-
        $0,\ 15,\ 20,\ 15,\ 0$
      uitwerking: |-
        \waardetabel[$t$][$h(t)$]{5}{0 & 1 & 2 & 3 & 4}{0 & 15 & 20 & 15 & 0}
    - opgave: |-
        Teken de grafiek.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        \figuren{\begin{tikzpicture}[x=.9cm,y=.12cm]
          \roosterleeg[$t$ (s)][$h$ (m)]{0}{0.5}{4.5}{0}{5}{25}
          \xgetallen{1,2,3,4}\ygetallen{5,10,15,20}\oorsprong
          \kromme{0}{4}{20*\x-5*(\x)^2}
          \foreach \t in {0,...,4}{\punt{\t}{20*\t-5*\t*\t}}
        \end{tikzpicture}}
    - opgave: |-
        Wanneer is de bal het hoogst? Hoe hoog is hij dan?
      antwoord: |-
        na 2 s, $20$ m
      uitwerking: |-
        Het hoogste punt is $(2, 20)$: na 2 seconden is de bal 20 m hoog.
    - opgave: |-
        Wanneer valt de bal terug op de grond?
      antwoord: |-
        na 4 s
      uitwerking: |-
        $h(4) = 80 - 80 = 0$: na 4 seconden.
    - opgave: |-
        Bereken $h(5)$. Wat betekent die uitkomst?
      antwoord: |-
        $-25$; niets, het voorschrift geldt alleen van 0 tot 4 s
      uitwerking: |-
        $h(5) = 100 - 125 = -25$. Een hoogte van $-25$ m kan niet: na 4 seconden ligt de bal op de grond. Het voorschrift beschrijft de worp alleen van $t = 0$ tot $t = 4$.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    losse punten of een doorlopende lijn
  opgave: |-
    Bestaat de grafiek uit losse punten of uit een doorlopende lijn?
  lijst: enumerate
  delen:
    - opgave: |-
        De prijs van $n$ cinematickets van 9 euro per stuk.
      antwoord: |-
        losse punten
      uitwerking: |-
        Losse punten: je koopt een natuurlijk aantal tickets.
    - opgave: |-
        De temperatuur in functie van het tijdstip.
      antwoord: |-
        doorlopend
      uitwerking: |-
        Doorlopend: op elk tijdstip is er een temperatuur.
    - opgave: |-
        Het aantal leerlingen in de klas, per schooldag van een week.
      antwoord: |-
        losse punten
      uitwerking: |-
        Losse punten: er zijn vijf schooldagen, en een aantal leerlingen is een natuurlijk getal.
    - opgave: |-
        De prijs van $x$ kg appels, aan $2,40$ euro per kg.
      antwoord: |-
        doorlopend
      uitwerking: |-
        Doorlopend: je kunt $1,3$ kg of $0,85$ kg appels kopen.
    - opgave: |-
        Teken de grafiek van de prijs van de cinematickets, voor 0 tot 5 tickets.
      antwoord: |-
        de punten $(0, 0)$, $(1, 9)$, \ldots, $(5, 45)$
      uitwerking: |-
        \figuren{\begin{tikzpicture}[x=.6cm,y=.06cm]
          \roosterleeg[$n$][$p$]{0}{1}{5}{0}{5}{50}
          \xgetallen{1,2,3,4,5}\ygetallen{10,20,30,40}\oorsprong
          \foreach \n in {0,...,5}{\punt{\n}{9*\n}}
        \end{tikzpicture}}

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    verhaal en grafiek koppelen
  opgave: |-
    Drie leerlingen fietsen naar school. Elke grafiek toont de afstand tot thuis in functie van de tijd.

    \figuren{\begin{tikzpicture}[x=.35cm,y=.35cm]
      \roosterleeg[$t$][$d$]{0}{1}{6}{0}{1}{4}
      \rechte{0}{6}{0.6}{0}
      \node[font=\footnotesize] at (3,-1) {A};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.35cm,y=.35cm]
      \roosterleeg[$t$][$d$]{0}{1}{6}{0}{1}{4}
      \gebroken{(0,0) (1.5,1.2) (2.5,0) (6,3.6)}
      \node[font=\footnotesize] at (3,-1) {B};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.35cm,y=.35cm]
      \roosterleeg[$t$][$d$]{0}{1}{6}{0}{1}{4}
      \kromme{0}{6}{3.6-0.1*(6-\x)^2}
      \node[font=\footnotesize] at (3,-1) {C};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.35cm,y=.35cm]
      \roosterleeg[$t$][$d$]{0}{1}{6}{0}{1}{4}
      \kromme{0}{6}{0.1*(\x)^2}
      \node[font=\footnotesize] at (3,-1) {D};
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Amir fietst aan een vaste snelheid naar school.
      antwoord: |-
        A
      uitwerking: |-
        A: een rechte, de afstand groeit elke minuut evenveel.
    - opgave: |-
        Bo vertrekt, keert terug omdat ze haar boek vergeten is, en vertrekt opnieuw.
      antwoord: |-
        B
      uitwerking: |-
        B: de afstand stijgt, daalt tot 0 (thuis) en stijgt dan opnieuw.
    - opgave: |-
        Cas fietst eerst snel, en daarna steeds trager omdat hij moe wordt.
      antwoord: |-
        C
      uitwerking: |-
        C: eerst steil, daarna steeds minder steil.
    - opgave: |-
        Schrijf een verhaal bij de grafiek die overblijft.
      antwoord: |-
        D: eerst traag, dan steeds sneller
      uitwerking: |-
        D wordt steeds steiler: de fietser vertrekt traag en gaat steeds sneller, bijvoorbeeld omdat hij merkt dat hij te laat is.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift opstellen: oppervlakte van een rechthoek
  opgave: |-
    Een rechthoek heeft een omtrek van 24 cm. Zijn breedte is $x$ cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Druk de lengte uit in functie van $x$.
      antwoord: |-
        $12 - x$
      uitwerking: |-
        Breedte plus lengte is de helft van de omtrek, 12 cm: de lengte is $12 - x$.
    - opgave: |-
        Stel een voorschrift op voor de oppervlakte $A(x)$.
      antwoord: |-
        $A(x) = x(12 - x)$
      uitwerking: |-
        Breedte maal lengte: $A(x) = x(12 - x)$.
    - opgave: |-
        Maak een tabel voor $x = 0$, 2, 4, 6, 8, 10 en 12, en teken de grafiek.
      antwoord: |-
        $0,\ 20,\ 32,\ 36,\ 32,\ 20,\ 0$
      uitwerking: |-
        \waardetabel[$x$][$A(x)$]{7}{0 & 2 & 4 & 6 & 8 & 10 & 12}{0 & 20 & 32 & 36 & 32 & 20 & 0}
        \figuren{\begin{tikzpicture}[x=.4cm,y=.07cm]
          \roosterleeg[$x$][$A$]{0}{1}{12}{0}{5}{40}
          \xgetallen{2,4,6,8,10,12}\ygetallen{10,20,30,40}\oorsprong
          \kromme{0}{12}{\x*(12-\x)}
          \foreach \t in {0,2,...,12}{\punt{\t}{\t*(12-\t)}}
        \end{tikzpicture}}
    - opgave: |-
        Welke breedte geeft de grootste oppervlakte? Welke vorm heeft de rechthoek dan?
      antwoord: |-
        $x = 6$, een vierkant van $36$ cm$^2$
      uitwerking: |-
        Het hoogste punt is $(6, 36)$: een breedte van 6 cm en een lengte van $12 - 6 = 6$ cm. Het is een vierkant met een oppervlakte van $36$ cm$^2$.
    - opgave: |-
        Voor welke waarden van $x$ heeft het voorschrift zin?
      antwoord: |-
        $0 < x < 12$
      uitwerking: |-
        De breedte en de lengte moeten positief zijn: $x > 0$ en $12 - x > 0$. Dus $x$ ligt tussen 0 en 12.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    functie of niet: verwoording
  opgave: |-
    Is het tweede een functie van het eerste? Geef een tegenvoorbeeld als het geen functie is.
  lijst: enumerate
  delen:
    - opgave: |-
        Een persoon, en zijn of haar geboortedatum.
      antwoord: |-
        ja
      uitwerking: |-
        Ja: iedereen heeft één geboortedatum.
    - opgave: |-
        Een getal, en zijn kwadraat.
      antwoord: |-
        ja
      uitwerking: |-
        Ja: elk getal heeft één kwadraat.
    - opgave: |-
        Een getal, en een getal waarvan het het kwadraat is.
      antwoord: |-
        nee
      uitwerking: |-
        Nee: 9 is het kwadraat van 3 en van $-3$. Bij 9 horen dus twee getallen.
    - opgave: |-
        Een tijdstip, en de temperatuur in Brussel op dat tijdstip.
      antwoord: |-
        ja
      uitwerking: |-
        Ja: op één tijdstip is er één temperatuur.
    - opgave: |-
        Een temperatuur, en het tijdstip waarop het in Brussel zo warm was.
      antwoord: |-
        nee
      uitwerking: |-
        Nee: het kan op veel tijdstippen $12\ ^\circ$C geweest zijn.
    - opgave: |-
        Een natuurlijk getal, en een deler van dat getal.
      antwoord: |-
        nee
      uitwerking: |-
        Nee: 6 heeft de delers 1, 2, 3 en 6.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    context met twee stukken
  opgave: |-
    Een gsm-abonnement kost 10 euro per maand, met 2 GB mobiele data inbegrepen. Voor elke GB daarboven betaal je 3 euro extra, en voor een deel van een GB een even groot deel van 3 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat betaal je bij een verbruik van 1 GB, 2 GB, 4 GB en $5,5$ GB?
      antwoord: |-
        $10$, $10$, $16$ en $20,50$ euro
      uitwerking: |-
        Tot 2 GB betaal je 10 euro. Bij 4 GB: $10 + 2 \cdot 3 = 16$ euro. Bij $5,5$ GB: $10 + 3,5 \cdot 3 = 20,50$ euro.
    - opgave: |-
        Teken de grafiek van de prijs in functie van het verbruik, van 0 tot 6 GB.
      antwoord: |-
        horizontaal tot 2 GB, daarna stijgend
      uitwerking: |-
        \figuren{\begin{tikzpicture}[x=.7cm,y=.12cm]
          \roosterleeg[$x$ (GB)][$K$]{0}{1}{6}{0}{2}{24}
          \xgetallen{1,2,3,4,5,6}\ygetallen{4,8,12,16,20,24}\oorsprong
          \gebroken{(0,10) (2,10) (6,22)}
        \end{tikzpicture}}
    - opgave: |-
        Stel een voorschrift op voor de prijs $K(x)$ bij een verbruik van meer dan 2 GB.
      antwoord: |-
        $K(x) = 3x + 4$
      uitwerking: |-
        $K(x) = 10 + 3(x - 2) = 10 + 3x - 6 = 3x + 4$.
    - opgave: |-
        Een rekening bedraagt 22 euro. Hoeveel data werd er verbruikt?
      antwoord: |-
        $6$ GB
      uitwerking: |-
        $3x + 4 = 22$, dus $3x = 18$ en $x = 6$ GB.
    - opgave: |-
        Is het verbruik een functie van de prijs?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: bij een prijs van 10 euro hoort elk verbruik van 0 tot 2 GB.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    een grafiek in een context lezen
  opgave: |-
    De grafiek toont de temperatuur $T$ (in $^\circ$C) op een lentedag, in functie van het uur $t$.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.25cm,y=.25cm]
        \roosterleeg[$t$ (h)][$T$]{0}{3}{24}{0}{1}{12}
        \xgetallen{6,12,18,24}\ygetallen{2,4,6,8,10,12}\oorsprong
        \doorpunten{(0,4) (3,2) (6,1) (9,2) (12,8) (15,11) (18,8) (21,5) (24,3)}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe warm is het om 12 uur?
      antwoord: |-
        $8\ ^\circ$C
      uitwerking: |-
        Het punt $(12, 8)$ ligt op de grafiek.
    - opgave: |-
        Wanneer is het het koudst, en wanneer het warmst? Hoeveel graden scheelt dat?
      antwoord: |-
        koudst om 6 uur ($1\ ^\circ$C), warmst om 15 uur ($11\ ^\circ$C); $10\ ^\circ$C
      uitwerking: |-
        Het laagste punt is $(6, 1)$, het hoogste $(15, 11)$. Het verschil is $11 - 1 = 10\ ^\circ$C.
    - opgave: |-
        Wanneer is het $8\ ^\circ$C?
      antwoord: |-
        om 12 uur en om 18 uur
      uitwerking: |-
        De horizontale rechte op hoogte 8 snijdt de grafiek bij $t = 12$ en $t = 18$.
    - opgave: |-
        Hoeveel uur is het warmer dan $8\ ^\circ$C?
      antwoord: |-
        6 uur
      uitwerking: |-
        De grafiek ligt boven de hoogte 8 van 12 uur tot 18 uur: 6 uur lang.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    vazen vullen: vorm van een grafiek
  opgave: |-
    Drie vazen worden gevuld met water, elke seconde evenveel. De grafieken tonen de hoogte $h$ van het water in functie van de tijd $t$.

    \figuren{\begin{tikzpicture}[scale=.5]
      \draw[accent,thick] (0,3) -- (0,0) -- (2,0) -- (2,3);
      \node[font=\footnotesize] at (1,-.6) {A};
    \end{tikzpicture}\qquad\qquad
    \begin{tikzpicture}[scale=.5]
      \draw[accent,thick] (.7,3) -- (0,0) -- (2.6,0) -- (1.9,3);
      \node[font=\footnotesize] at (1.3,-.6) {B};
    \end{tikzpicture}\qquad\qquad
    \begin{tikzpicture}[scale=.5]
      \draw[accent,thick] (0,3) -- (.7,0) -- (1.9,0) -- (2.6,3);
      \node[font=\footnotesize] at (1.3,-.6) {C};
    \end{tikzpicture}\par\vspace{2mm}
    \begin{tikzpicture}[x=.38cm,y=.38cm]
      \roosterleeg[$t$][$h$]{0}{1}{5}{0}{1}{4}
      \kromme{0}{5}{4-0.16*(5-\x)^2}
      \node[font=\footnotesize] at (2.5,-1) {1};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.38cm,y=.38cm]
      \roosterleeg[$t$][$h$]{0}{1}{5}{0}{1}{4}
      \rechte{0}{5}{0.8}{0}
      \node[font=\footnotesize] at (2.5,-1) {2};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.38cm,y=.38cm]
      \roosterleeg[$t$][$h$]{0}{1}{5}{0}{1}{4}
      \kromme{0}{5}{0.16*(\x)^2}
      \node[font=\footnotesize] at (2.5,-1) {3};
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Welke grafiek hoort bij welke vaas?
      antwoord: |-
        A: 2; B: 3; C: 1
      uitwerking: |-
        A is overal even breed: het water stijgt gelijkmatig (2). B is onderaan breed: het water stijgt eerst traag en dan steeds sneller (3). C is onderaan smal: eerst snel, dan steeds trager (1).
    - opgave: |-
        Waarom is de grafiek bij vaas A een rechte?
      antwoord: |-
        de vaas is overal even breed
      uitwerking: |-
        Elke seconde komt er evenveel water bij, en omdat de vaas overal even breed is, stijgt het water elke seconde evenveel.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    x zoeken bij een functiewaarde
  opgave: |-
    Gegeven: $f(x) = 3x - 1$ en $g(x) = x^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $x$ is $f(x) = 11$? En $f(x) = 0$?
      antwoord: |-
        $x = 4$; $x = \tfrac13$
      uitwerking: |-
        $3x - 1 = 11$ geeft $3x = 12$, dus $x = 4$. $3x - 1 = 0$ geeft $3x = 1$, dus $x = \tfrac13$.
    - opgave: |-
        Voor welke $x$ is $g(x) = 9$?
      antwoord: |-
        $x = 3$ of $x = -3$
      uitwerking: |-
        $3^2 = 9$ en $(-3)^2 = 9$: twee waarden.
    - opgave: |-
        Voor welke $x$ is $g(x) = -4$?
      antwoord: |-
        voor geen enkele $x$
      uitwerking: |-
        Een kwadraat is nooit negatief: er is geen $x$ met $x^2 = -4$.
    - opgave: |-
        Bij $g$ vind je soms twee waarden van $x$. Waarom is $g$ toch een functie?
      antwoord: |-
        bij elke $x$ hoort één kwadraat
      uitwerking: |-
        Een functie vraagt hoogstens één $y$ bij elke $x$, en dat klopt: elk getal heeft één kwadraat. Dat twee waarden van $x$ dezelfde functiewaarde hebben, mag.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    een functie met sprongen
  opgave: |-
    Een pakje versturen kost 7 euro tot en met 2 kg, 9 euro voor meer dan 2 kg tot en met 5 kg, en 14 euro voor meer dan 5 kg tot en met 10 kg. Zwaardere pakjes worden niet aanvaard.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat kost een pakje van 2 kg? Van $2,1$ kg? Van 7 kg?
      antwoord: |-
        $7$, $9$ en $14$ euro
      uitwerking: |-
        2 kg valt nog in het eerste tarief (7 euro), $2,1$ kg in het tweede (9 euro), 7 kg in het derde (14 euro).
    - opgave: |-
        Teken de grafiek van de prijs in functie van het gewicht. Gebruik volle en open bolletjes.
      antwoord: |-
        drie horizontale stukken
      uitwerking: |-
        \figuren{\begin{tikzpicture}[x=.5cm,y=.2cm]
          \roosterleeg[$x$ (kg)][prijs]{0}{1}{10}{0}{2}{16}
          \xgetallen{2,4,6,8,10}\ygetallen{4,8,12,16}\oorsprong
          \draw[accent,thick] (0,7) -- (2,7) (2,9) -- (5,9) (5,14) -- (10,14);
          \openpunt{0}{7}\punt{2}{7}\openpunt{2}{9}\punt{5}{9}\openpunt{5}{14}\punt{10}{14}
        \end{tikzpicture}}
    - opgave: |-
        Is de prijs een functie van het gewicht? Is het gewicht een functie van de prijs?
      antwoord: |-
        ja; nee
      uitwerking: |-
        Bij elk gewicht hoort één prijs: de prijs is een functie van het gewicht. Bij 9 euro horen alle gewichten van meer dan 2 kg tot en met 5 kg: het gewicht is geen functie van de prijs.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    context: voorschrift en afronden
  opgave: |-
    Een bakker heeft voor één brood $0,6$ kg bloem nodig.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel een voorschrift op voor de hoeveelheid bloem $b$ (in kg) voor $n$ broden.
      antwoord: |-
        $b(n) = 0,6\,n$
      uitwerking: |-
        Per brood $0,6$ kg: $b(n) = 0,6\,n$.
    - opgave: |-
        Hoeveel bloem heeft hij nodig voor 35 broden?
      antwoord: |-
        $21$ kg
      uitwerking: |-
        $0,6 \cdot 35 = 21$ kg.
    - opgave: |-
        Hij heeft nog een zak van 25 kg. Hoeveel broden kan hij daarmee bakken?
      antwoord: |-
        $41$
      uitwerking: |-
        $25 : 0,6 \approx 41,7$. Voor het 42ste brood is er te weinig bloem: hij kan 41 broden bakken. Hier rond je dus af naar beneden.
    - opgave: |-
        Bestaat de grafiek van $b$ uit losse punten of uit een doorlopende lijn?
      antwoord: |-
        losse punten
      uitwerking: |-
        Losse punten: het aantal broden is een natuurlijk getal.

- id: h1-o20
  soort: opdracht
  niveau: 2
  thema: |-
    twee grafieken aflezen
  opgave: |-
    Hiernaast staan de grafieken van $f(x) = x^2 - 2$ (volle lijn) en $g(x) = x$ (stippellijn).
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm]
        \rooster{-3}{1}{3}{-3}{1}{4}
        \kromme{-2.45}{2.45}{(\x)^2-2}
        \rechte[tweede]{-3}{3.5}{1}{0}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af: $f(2)$, $g(2)$, $f(0)$ en $g(0)$.
      antwoord: |-
        $2$, $2$, $-2$, $0$
      uitwerking: |-
        Bij $x = 2$ liggen beide grafieken op hoogte 2. Bij $x = 0$ ligt $f$ op $-2$ en $g$ op 0.
    - opgave: |-
        Voor welke waarden van $x$ is $f(x) = g(x)$?
      antwoord: |-
        $x = -1$ of $x = 2$
      uitwerking: |-
        Daar snijden de grafieken elkaar: in $(-1, -1)$ en in $(2, 2)$.
    - opgave: |-
        Controleer je antwoord met de voorschriften.
      antwoord: |-
        $f(-1) = -1 = g(-1)$ en $f(2) = 2 = g(2)$
      uitwerking: |-
        $f(-1) = 1 - 2 = -1$ en $g(-1) = -1$. $f(2) = 4 - 2 = 2$ en $g(2) = 2$.
    - opgave: |-
        Voor welke waarden van $x$ ligt de grafiek van $f$ onder die van $g$?
      antwoord: |-
        voor $x$ tussen $-1$ en $2$
      uitwerking: |-
        Tussen de twee snijpunten, dus voor $x$ tussen $-1$ en 2, ligt de parabool onder de rechte.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    zelf verbanden bedenken
  opgave: |-
    Bedenk telkens een verband uit het dagelijks leven tussen twee grootheden $x$ en $y$.
  lijst: enumerate
  delen:
    - opgave: |-
        $y$ is een functie van $x$, maar $x$ is geen functie van $y$.
      antwoord: |-
        bijvoorbeeld $x$: dag van het jaar, $y$: maximumtemperatuur
      uitwerking: |-
        Bijvoorbeeld $x$ een dag van het jaar en $y$ de maximumtemperatuur die dag: elke dag heeft één maximumtemperatuur, maar het kan op verschillende dagen $20\ ^\circ$C geweest zijn.
    - opgave: |-
        $y$ is een functie van $x$, en $x$ is ook een functie van $y$.
      antwoord: |-
        bijvoorbeeld $x$: liter benzine, $y$: prijs
      uitwerking: |-
        Bijvoorbeeld $x$ het aantal liter benzine en $y$ de prijs: bij elke hoeveelheid hoort één prijs, en uit de prijs kun je de hoeveelheid terugrekenen.
    - opgave: |-
        Geen van beide is een functie van de andere.
      antwoord: |-
        bijvoorbeeld $x$: leerling, $y$: een vak dat hij volgt
      uitwerking: |-
        Bijvoorbeeld $x$ een leerling en $y$ een vak dat de leerling volgt: een leerling volgt meerdere vakken, en een vak wordt door meerdere leerlingen gevolgd.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    een grafiek met gegeven eigenschappen
  opgave: |-
    Teken in je schrift de grafiek van een functie $f$ op het interval van $-3$ tot 4 met deze eigenschappen.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(-2) = 1$, \ $f(0) = 2$ en $f(3) = 0$, en $f(x) = 1$ voor precies drie waarden van $x$.
      antwoord: |-
        bijvoorbeeld de grafiek in de uitwerking
      uitwerking: |-
        Een mogelijke grafiek, een gebroken lijn door $(-3, 0)$, $(-2, 1)$, $(0, 2)$, $(1, 1)$, $(2, 2)$ en $(3, 0)$: de hoogte 1 wordt bereikt bij $x = -2$, $x = 1$ en $x = 2,5$. Er zijn veel andere goede antwoorden.
        \figuren{\begin{tikzpicture}[x=.45cm,y=.45cm]
          \rooster{-3}{1}{4}{-2}{1}{3}
          \gebroken{(-3,0) (-2,1) (0,2) (1,1) (2,2) (3,0) (4,-1)}
          \draw[hulplijn] (-3,1) -- (4,1);
          \punt{-2}{1}\punt{1}{1}\punt{2.5}{1}
        \end{tikzpicture}}
    - opgave: |-
        Kan een functie $g$ bestaan met $g(1) = 2$ en $g(1) = 3$? Leg uit.
      antwoord: |-
        nee
      uitwerking: |-
        Nee: dan zouden bij $x = 1$ twee waarden horen. De punten $(1, 2)$ en $(1, 3)$ liggen op dezelfde verticale rechte.

- id: h1-o23
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    functiewaarden met letters
  opgave: |-
    Gegeven: $f(x) = x^2 - 3x + 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken en vereenvoudig $f(a)$, $f(2a)$, $f(-a)$ en $f(a + 1)$.
      antwoord: |-
        $a^2 - 3a + 1$, \ $4a^2 - 6a + 1$, \ $a^2 + 3a + 1$, \ $a^2 - a - 1$
      uitwerking: |-
        $f(a) = a^2 - 3a + 1$. $f(2a) = (2a)^2 - 3 \cdot 2a + 1 = 4a^2 - 6a + 1$. $f(-a) = (-a)^2 - 3(-a) + 1 = a^2 + 3a + 1$. $f(a + 1) = (a + 1)^2 - 3(a + 1) + 1 = a^2 + 2a + 1 - 3a - 3 + 1 = a^2 - a - 1$.
    - opgave: |-
        Is $f(a + 1) = f(a) + f(1)$?
      antwoord: |-
        nee
      uitwerking: |-
        $f(1) = 1 - 3 + 1 = -1$, dus $f(a) + f(1) = a^2 - 3a$. Dat is niet gelijk aan $a^2 - a - 1$ (neem bijvoorbeeld $a = 0$: $-1 \neq 0$). Je mag $f(a + 1)$ dus niet zomaar splitsen.

- id: h1-o24
  soort: opdracht
  niveau: 3
  thema: |-
    de volgorde van bewerkingen in een voorschrift
  opgave: |-
    Een functie $f$ verdubbelt een getal en telt er dan 3 bij op. Een functie $g$ telt eerst 3 op en verdubbelt dan.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf de voorschriften van $f$ en $g$, en bereken $f(5)$ en $g(5)$.
      antwoord: |-
        $f(x) = 2x + 3$, $g(x) = 2(x + 3)$; $13$ en $16$
      uitwerking: |-
        $f(x) = 2x + 3$ en $g(x) = 2(x + 3) = 2x + 6$. $f(5) = 13$ en $g(5) = 16$.
    - opgave: |-
        Bestaat er een $x$ met $f(x) = g(x)$? Leg uit.
      antwoord: |-
        nee
      uitwerking: |-
        Nee: $g(x) = 2x + 6$ is altijd 3 groter dan $f(x) = 2x + 3$.
    - opgave: |-
        Teken beide grafieken in één assenstelsel. Wat zie je?
      antwoord: |-
        twee evenwijdige rechten
      uitwerking: |-
        Twee evenwijdige rechten, die van $g$ ligt 3 hoger.
        \figuren{\begin{tikzpicture}[x=.4cm,y=.25cm]
          \rooster{-4}{1}{2}{-5}{1}{9}
          \rechte{-4}{2}{2}{3}
          \rechte[tweede]{-4}{1.5}{2}{6}
          \node[right,font=\scriptsize] at (2,7) {$f$};
          \node[left,font=\scriptsize] at (1.5,9) {$g$};
        \end{tikzpicture}}
    - opgave: |-
        Bedenk twee bewerkingen waarbij de volgorde niet uitmaakt.
      antwoord: |-
        bijvoorbeeld 3 optellen en 5 optellen
      uitwerking: |-
        Bijvoorbeeld 3 optellen en 5 optellen: $(x + 3) + 5 = (x + 5) + 3$. Of verdubbelen en verdrievoudigen: $3(2x) = 2(3x)$.

- id: h1-o25
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    een functie in stukken
  opgave: |-
    Een functie kan voor verschillende stukken van de $x$-as een ander voorschrift hebben. Bekijk
    \[f(x) = \begin{cases} x + 3 & \text{als } x \leqslant -1 \\ x^2 - 1 & \text{als } -1 < x \leqslant 2 \\ 5 & \text{als } x > 2 \end{cases}\]
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $f(-3)$, $f(-1)$, $f(0)$, $f(2)$ en $f(4)$.
      antwoord: |-
        $0$, $2$, $-1$, $3$, $5$
      uitwerking: |-
        $f(-3) = -3 + 3 = 0$ en $f(-1) = -1 + 3 = 2$ (eerste stuk). $f(0) = 0 - 1 = -1$ en $f(2) = 4 - 1 = 3$ (tweede stuk). $f(4) = 5$ (derde stuk).
    - opgave: |-
        Teken de grafiek voor $x$ van $-4$ tot 4, met volle en open bolletjes.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        \figuren{\begin{tikzpicture}[x=.45cm,y=.4cm]
          \rooster{-4}{1}{4}{-2}{1}{6}
          \rechte{-4}{-1}{1}{3}
          \kromme{-1}{2}{(\x)^2-1}
          \draw[accent,thick] (2,5) -- (4,5);
          \punt{-1}{2}\openpunt{-1}{0}\punt{2}{3}\openpunt{2}{5}
        \end{tikzpicture}}
    - opgave: |-
        Voor welke waarden van $x$ is $f(x) = 0$?
      antwoord: |-
        $x = -3$ of $x = 1$
      uitwerking: |-
        Eerste stuk: $x + 3 = 0$ geeft $x = -3$, en dat is $\leqslant -1$. Tweede stuk: $x^2 - 1 = 0$ geeft $x = 1$ of $x = -1$, maar $-1$ hoort niet bij dat stuk. Derde stuk: 5 is nooit 0.
    - opgave: |-
        Is er een $x$ met $f(x) = 4$?
      antwoord: |-
        nee
      uitwerking: |-
        Eerste stuk: $x + 3 = 4$ geeft $x = 1$, maar dat is niet $\leqslant -1$. Tweede stuk: $x^2 = 5$ geeft $x \approx 2,24$ of $x \approx -2,24$, en geen van beide ligt in $\ivog{-1}{2}$. Derde stuk: altijd 5. Er is dus geen $x$ met $f(x) = 4$: in de grafiek slaat de functie die waarde over bij de sprong in $x = 2$.

# --- Test jezelf -----------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    onafhankelijke en afhankelijke veranderlijke
  opgave: |-
    Welke grootheid is de onafhankelijke veranderlijke, en welke de afhankelijke?
  lijst: enumerate
  delen:
    - opgave: |-
        Het aantal gereden kilometer, en de hoeveelheid benzine in de tank.
      antwoord: |-
        onafhankelijk: het aantal km
      uitwerking: |-
        De benzine in de tank hangt af van hoe ver je gereden hebt: de afstand is onafhankelijk, de benzine afhankelijk.
    - opgave: |-
        De lengte van de schaduw van een boom, en het tijdstip van de dag.
      antwoord: |-
        onafhankelijk: het tijdstip
      uitwerking: |-
        De schaduw verandert in de loop van de dag: het tijdstip is onafhankelijk, de lengte van de schaduw afhankelijk.

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    functie of niet
  opgave: |-
    Is $y$ een functie van $x$? Leg uit.
  lijst: enumerate
  delen:
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{2 & 3 & 2 & 5}{1 & 4 & 6 & 7}
      antwoord: |-
        nee
      uitwerking: |-
        Nee: bij $x = 2$ horen 1 en 6.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{-1 & 0 & 1 & 2}{3 & 3 & 3 & 3}
      antwoord: |-
        ja
      uitwerking: |-
        Ja: elke $x$ komt één keer voor.
    - opgave: |-
        $x$ is een getal en $y$ is het dubbele van dat getal.
      antwoord: |-
        ja
      uitwerking: |-
        Ja: elk getal heeft één dubbel, $y = 2x$.

- id: h1-t3
  soort: test
  niveau: 1
  thema: |-
    functiewaarden berekenen
  opgave: |-
    Gegeven: $f(x) = x^2 - 5x + 2$. Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(0)$
      antwoord: |-
        $2$
      uitwerking: |-
        $0 - 0 + 2 = 2$.
    - opgave: |-
        $f(3)$
      antwoord: |-
        $-4$
      uitwerking: |-
        $9 - 15 + 2 = -4$.
    - opgave: |-
        $f(-2)$
      antwoord: |-
        $16$
      uitwerking: |-
        $(-2)^2 - 5 \cdot (-2) + 2 = 4 + 10 + 2 = 16$.

- id: h1-t4
  soort: test
  niveau: 1
  thema: |-
    grafiek van een functie herkennen
  opgave: |-
    Welke krommen zijn de grafiek van een functie?

    \figuren{\begin{tikzpicture}[x=.33cm,y=.33cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \doorpunten{(-3,2) (-1.5,-1) (0,1) (1.5,-1.5) (3,2)}
      \node[font=\footnotesize] at (0,-4) {a};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.33cm,y=.33cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \draw[accent,thick] plot[domain=-1.8:1.8,samples=40,smooth] ({2-(\x)^2},\x);
      \node[font=\footnotesize] at (0,-4) {b};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.33cm,y=.33cm]
      \roosterleeg{-3}{1}{3}{-3}{1}{3}
      \draw[accent,thick] (-3,-1) -- (0,-1) (0,2) -- (3,2);
      \openpunt{0}{-1}\punt{0}{2}
      \node[font=\footnotesize] at (0,-4) {c};
    \end{tikzpicture}}
  antwoord: |-
    a en c
  uitwerking: |-
    a: elke verticale rechte snijdt de kromme één keer, dus een functie. b: de rechte $x = 1$ snijdt de kromme twee keer, dus geen functie. c: bij $x = 0$ hoort alleen het volle bolletje, dus een functie.

- id: h1-t5
  soort: test
  niveau: 1
  thema: |-
    functiewaarden aflezen
  opgave: |-
    Hiernaast staat de grafiek van een functie $f$.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm]
        \rooster{-4}{1}{4}{-3}{1}{3}
        \doorpunten{(-4,-2) (-3,0) (-2,1) (-1,0) (0,-1) (1,-2) (2,-1) (3,1) (3.6,2.6)}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af: $f(-2)$ en $f(1)$.
      antwoord: |-
        $1$ en $-2$
      uitwerking: |-
        Boven $x = -2$ ligt de grafiek op hoogte 1, onder $x = 1$ op hoogte $-2$.
    - opgave: |-
        Voor welke waarden van $x$ is $f(x) = 0$?
      antwoord: |-
        $x = -3$, $x = -1$ of ongeveer $x = 2,5$
      uitwerking: |-
        De grafiek snijdt de $x$-as bij $x = -3$, bij $x = -1$ en tussen 2 en 3, ongeveer bij $x = 2,5$.
    - opgave: |-
        Voor welke waarden van $x$ is $f(x) = -1$?
      antwoord: |-
        $x = 0$ of $x = 2$, en ongeveer $x = -3,5$
      uitwerking: |-
        Op hoogte $-1$ liggen de punten $(0, -1)$ en $(2, -1)$, en een punt tussen $x = -4$ en $x = -3$, ongeveer bij $x = -3,5$.

- id: h1-t6
  soort: test
  niveau: 1
  thema: |-
    van voorschrift naar tabel en grafiek
  opgave: |-
    Maak een tabel voor $x$ van $-1$ tot 3 en teken de grafiek van $f(x) = x^2 - 2x$.
  antwoord: |-
    $3,\ 0,\ {-1},\ 0,\ 3$
  uitwerking: |-
    \waardetabel{5}{-1 & 0 & 1 & 2 & 3}{3 & 0 & -1 & 0 & 3}
    \figuren{\begin{tikzpicture}[x=.5cm,y=.5cm]
      \rooster{-2}{1}{4}{-2}{1}{4}
      \kromme{-1.2}{3.2}{(\x)^2-2*(\x)}
      \foreach \t in {-1,...,3}{\punt{\t}{\t*\t-2*\t}}
    \end{tikzpicture}}

- id: h1-t7
  soort: test
  niveau: 2
  thema: |-
    voorschrift opstellen in een context
  opgave: |-
    Een drukkerij rekent 15 euro opstartkosten en $0,40$ euro per affiche.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel een voorschrift op voor de prijs $p$ van $n$ affiches.
      antwoord: |-
        $p(n) = 0,4\,n + 15$
      uitwerking: |-
        Per affiche $0,40$ euro plus 15 euro: $p(n) = 0,4\,n + 15$.
    - opgave: |-
        Wat kosten 100 affiches?
      antwoord: |-
        $55$ euro
      uitwerking: |-
        $p(100) = 40 + 15 = 55$ euro.
    - opgave: |-
        Bestaat de grafiek uit losse punten of uit een doorlopende lijn?
      antwoord: |-
        losse punten
      uitwerking: |-
        Losse punten: het aantal affiches is een natuurlijk getal.
