# Oefeningen van hoofdstuk 2 (Eerstegraadsfuncties). Zie Opmaak/oefeningenbank.py voor de velden.
# pakketten: de bewijsopdracht h2-o24 alleen in 5.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Reken uit of los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3 \cdot (-2) + 5$
      antwoord: |-
        $-1$
      uitwerking: |-
        $-6 + 5 = -1$.
    - opgave: |-
        $\tfrac{-6}{-8}$
      antwoord: |-
        $\tfrac34$
      uitwerking: |-
        Deel teller en noemer door $-2$.
    - opgave: |-
        $f(-2)$ als $f(x) = 4x - 1$
      antwoord: |-
        $-9$
      uitwerking: |-
        $4 \cdot (-2) - 1 = -8 - 1 = -9$.
    - opgave: |-
        $2x + 3 = 11$
      antwoord: |-
        $x = 4$
      uitwerking: |-
        $2x = 8$, dus $x = 4$.
    - opgave: |-
        $-3x + 7 = 1$
      antwoord: |-
        $x = 2$
      uitwerking: |-
        $-3x = -6$, dus $x = 2$.
    - opgave: |-
        $5 = -\tfrac12 \cdot 4 + q$
      antwoord: |-
        $q = 7$
      uitwerking: |-
        $5 = -2 + q$, dus $q = 5 + 2 = 7$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Een kaars is 20 cm lang. Elk uur dat ze brandt, wordt ze 2 cm korter.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de kaars na 0, 1, 2, 3 en 4 uur? Zet de waarden in een tabel.
      antwoord: |-
        $20, 18, 16, 14, 12$ cm
      uitwerking: |-
        \waardetabel[$t$ (h)][$L$ (cm)]{5}{0 & 1 & 2 & 3 & 4}{20 & 18 & 16 & 14 & 12}
    - opgave: |-
        Wat gebeurt er in de tabel telkens als $t$ met 1 toeneemt?
      antwoord: |-
        $L$ neemt telkens met 2 af
      uitwerking: |-
        Elk uur komt er 2 cm af: $L$ daalt telkens met 2.
    - opgave: |-
        Teken de punten van je tabel in een assenstelsel. Wat merk je?
      antwoord: |-
        ze liggen op een rechte
      uitwerking: |-
        De punten liggen op een dalende rechte.
        \figuren{\begin{tikzpicture}[x=.5cm,y=.13cm]
          \roosterleeg[$t$][$L$]{0}{1}{10}{0}{2}{20}
          \xgetallen{2,4,6,8,10}\ygetallen{4,8,12,16,20}\oorsprong
          \rechte[densely dotted]{0}{10}{-2}{20}
          \foreach \t in {0,...,4}{\punt{\t}{20-2*\t}}
        \end{tikzpicture}}
    - opgave: |-
        Schrijf een formule voor de lengte $L$ na $t$ uur.
      antwoord: |-
        $L = 20 - 2t$
      uitwerking: |-
        Na $t$ uur is er $2t$ cm af: $L = 20 - 2t$.
    - opgave: |-
        Na hoeveel uur is de kaars helemaal opgebrand?
      antwoord: |-
        na 10 uur
      uitwerking: |-
        $20 - 2t = 0$ geeft $t = 10$.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h2-evenredig
  soort: kort
  opgave: |-
    Zijn $x$ en $y$ recht evenredig? Zo ja, geef het voorschrift.
  lijst: enumerate
  delen:
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{2 & 3 & 5 & 8}{7 & 10,5 & 17,5 & 28}
      antwoord: |-
        ja, $y = 3,5x$
      uitwerking: |-
        $\tfrac72 = \tfrac{10,5}{3} = \tfrac{17,5}{5} = \tfrac{28}{8} = 3,5$: recht evenredig, $y = 3,5x$.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{1 & 2 & 4 & 5}{4 & 7 & 13 & 16}
      antwoord: |-
        nee
      uitwerking: |-
        $\tfrac41 = 4$ maar $\tfrac72 = 3,5$: niet recht evenredig.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{0,5 & 1 & 2 & 4}{0,2 & 0,4 & 0,8 & 1,6}
      antwoord: |-
        ja, $y = 0,4x$
      uitwerking: |-
        Het quotiënt is telkens $0,4$: $y = 0,4x$.

- id: h2-rico
  soort: kort
  opgave: |-
    Bereken de rico van de rechte door $A$ en $B$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $A(1, 2)$ en $B(4, 8)$
      antwoord: |-
        $2$
      uitwerking: |-
        $m = \tfrac{8 - 2}{4 - 1} = \tfrac63 = 2$.
    - opgave: |-
        $A(-2, 3)$ en $B(2, 1)$
      antwoord: |-
        $-\tfrac12$
      uitwerking: |-
        $m = \tfrac{1 - 3}{2 - (-2)} = \tfrac{-2}{4} = -\tfrac12$.
    - opgave: |-
        $A(0, -5)$ en $B(6, -1)$
      antwoord: |-
        $\tfrac23$
      uitwerking: |-
        $m = \tfrac{-1 - (-5)}{6 - 0} = \tfrac46 = \tfrac23$.
    - opgave: |-
        $A(-3, -4)$ en $B(-1, -4)$
      antwoord: |-
        $0$
      uitwerking: |-
        $m = \tfrac{-4 - (-4)}{-1 - (-3)} = \tfrac02 = 0$: een horizontale rechte.

- id: h2-rico-grafiek
  soort: kort
  opgave: |-
    Lees de rico af van de rechten $a$, $b$ en $c$.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
        \rooster{-4}{1}{4}{-3}{1}{4}
        \rechte{-1}{2.5}{2}{-1}
        \rechte{-4}{4}{-1/3}{2}
        \rechte{-4}{4}{3/4}{1}
        \node[right] at (2.5,4) {$a$};
        \node[above] at (-3.4,3.1) {$b$};
        \node[right] at (4,4) {$c$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        rechte $a$
      antwoord: |-
        $2$
      uitwerking: |-
        Van $(0, -1)$ naar $(1, 1)$: 1 opzij, 2 omhoog, $m = 2$.
    - opgave: |-
        rechte $b$
      antwoord: |-
        $-\tfrac13$
      uitwerking: |-
        Van $(0, 2)$ naar $(3, 1)$: 3 opzij, 1 omlaag, $m = -\tfrac13$.
    - opgave: |-
        rechte $c$
      antwoord: |-
        $\tfrac34$
      uitwerking: |-
        Van $(-4, -2)$ naar $(0, 1)$: 4 opzij, 3 omhoog, $m = \tfrac34$.

- id: h2-tekenen
  soort: kort
  opgave: |-
    Teken de grafieken in één assenstelsel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = 3x - 2$
      antwoord: |-
        door $(0, -2)$ en $(1, 1)$
      uitwerking: |-
        Begin in $(0, -2)$, 1 opzij en 3 omhoog: $(1, 1)$.
    - opgave: |-
        $g(x) = -\tfrac12 x + 3$
      antwoord: |-
        door $(0, 3)$ en $(2, 2)$
      uitwerking: |-
        Begin in $(0, 3)$, 2 opzij en 1 omlaag: $(2, 2)$.
    - opgave: |-
        $h(x) = -x$
      antwoord: |-
        door $(0, 0)$ en $(1, -1)$
      uitwerking: |-
        Door de oorsprong, 1 opzij en 1 omlaag.
        \figuren{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-4}{1}{5}{-4}{1}{5}
          \rechte{-0.6}{2.3}{3}{-2}
          \rechte{-4}{5}{-1/2}{3}
          \rechte{-4}{4}{-1}{0}
          \node[right] at (2.3,4.9) {$f$};
          \node[above] at (4.5,0.75) {$g$};
          \node[right] at (4,-4) {$h$};
        \end{tikzpicture}}

- id: h2-tabel
  soort: kort
  opgave: |-
    Hoort de tabel bij een eerstegraadsfunctie? Zo ja, geef het voorschrift.
  lijst: enumerate
  delen:
    - opgave: |-
        \waardetabel{4}{0 & 1 & 2 & 3}{-4 & -1 & 2 & 5}
      antwoord: |-
        ja, $f(x) = 3x - 4$
      uitwerking: |-
        Telkens 3 omhoog bij een stap 1: $m = 3$, en $q = f(0) = -4$.
    - opgave: |-
        \waardetabel{4}{-1 & 0 & 1 & 2}{2 & 1 & 2 & 5}
      antwoord: |-
        nee
      uitwerking: |-
        De stappen in $y$ zijn $-1$, $1$ en $3$: niet gelijk.
    - opgave: |-
        \waardetabel{4}{-4 & -2 & 0 & 2}{5 & 4 & 3 & 2}
      antwoord: |-
        ja, $f(x) = -\tfrac12 x + 3$
      uitwerking: |-
        Telkens 1 omlaag bij een stap 2: $m = -\tfrac12$, en $q = f(0) = 3$.

- id: h2-vgrafiek
  soort: kort
  opgave: |-
    Geef het voorschrift van de rechten $a$ en $b$.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
        \rooster{-2}{1}{5}{-3}{1}{5}
        \rechte{-1.5}{5}{2/3}{-2}
        \rechte{-0.33}{2.33}{-3}{4}
        \node[right] at (5,1.33) {$a$};
        \node[right] at (2.33,-3) {$b$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        rechte $a$
      antwoord: |-
        $y = \tfrac23 x - 2$
      uitwerking: |-
        $q = -2$; van $(0, -2)$ naar $(3, 0)$: 3 opzij, 2 omhoog, $m = \tfrac23$.
    - opgave: |-
        rechte $b$
      antwoord: |-
        $y = -3x + 4$
      uitwerking: |-
        $q = 4$; van $(0, 4)$ naar $(1, 1)$: 1 opzij, 3 omlaag, $m = -3$.

- id: h2-tweepunten
  soort: kort
  opgave: |-
    Geef het voorschrift van de rechte door $A$ en $B$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $A(1, 5)$, $B(3, 9)$
      antwoord: |-
        $y = 2x + 3$
      uitwerking: |-
        $m = \tfrac{9 - 5}{3 - 1} = 2$; $5 = 2 \cdot 1 + q$, dus $q = 3$.
    - opgave: |-
        $A(-2, 4)$, $B(2, 2)$
      antwoord: |-
        $y = -\tfrac12 x + 3$
      uitwerking: |-
        $m = \tfrac{2 - 4}{2 - (-2)} = -\tfrac12$; $4 = -\tfrac12 \cdot (-2) + q = 1 + q$, dus $q = 3$.
    - opgave: |-
        $A(3, -1)$, $B(6, 1)$
      antwoord: |-
        $y = \tfrac23 x - 3$
      uitwerking: |-
        $m = \tfrac{1 - (-1)}{6 - 3} = \tfrac23$; $-1 = \tfrac23 \cdot 3 + q = 2 + q$, dus $q = -3$.

- id: h2-puntrico
  soort: kort
  opgave: |-
    Geef het voorschrift van de rechte door $P$ met rico $m$, in de vorm $y = mx + q$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $P(2, 1)$, $m = 3$
      antwoord: |-
        $y = 3x - 5$
      uitwerking: |-
        $y - 1 = 3(x - 2) = 3x - 6$, dus $y = 3x - 5$.
    - opgave: |-
        $P(-4, 2)$, $m = \tfrac12$
      antwoord: |-
        $y = \tfrac12 x + 4$
      uitwerking: |-
        $y - 2 = \tfrac12(x + 4) = \tfrac12 x + 2$, dus $y = \tfrac12 x + 4$.
    - opgave: |-
        $P(5, -3)$, $m = -2$
      antwoord: |-
        $y = -2x + 7$
      uitwerking: |-
        $y + 3 = -2(x - 5) = -2x + 10$, dus $y = -2x + 7$.

- id: h2-context
  soort: kort
  opgave: |-
    Een deelstep huren kost 1 euro om hem te ontgrendelen, en daarna 0,25 euro per minuut.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef het voorschrift van de prijs $k$ (in euro) in functie van de rijtijd $t$ (in minuten).
      antwoord: |-
        $k(t) = 0,25t + 1$
      uitwerking: |-
        De prijs per minuut is de rico, de ontgrendeling de beginwaarde: $k(t) = 0,25t + 1$.
    - opgave: |-
        Wat betekenen de rico en het getal $q$ in deze situatie?
      antwoord: |-
        $m$: 0,25 euro per minuut; $q$: 1 euro vast
      uitwerking: |-
        Elke minuut kost 0,25 euro extra; ook voor 0 minuten betaal je 1 euro.
    - opgave: |-
        Wat kost een rit van 18 minuten?
      antwoord: |-
        5,50 euro
      uitwerking: |-
        $k(18) = 0,25 \cdot 18 + 1 = 4,5 + 1 = 5,5$.
    - opgave: |-
        Hoe lang kun je rijden voor 6 euro?
      antwoord: |-
        20 minuten
      uitwerking: |-
        $0,25t + 1 = 6$ geeft $0,25t = 5$, dus $t = 20$.

- id: h2-evenwijdig
  soort: kort
  opgave: |-
    Geef het voorschrift van de rechte door $P$ die evenwijdig is met de rechte $r$.
  lijst: enumerate
  delen:
    - opgave: |-
        $r$: $y = 3x - 1$ en $P(1, 5)$
      antwoord: |-
        $y = 3x + 2$
      uitwerking: |-
        $m = 3$; $5 = 3 + q$, dus $q = 2$.
    - opgave: |-
        $r$: $y = -\tfrac12 x + 4$ en $P(4, 0)$
      antwoord: |-
        $y = -\tfrac12 x + 2$
      uitwerking: |-
        $m = -\tfrac12$; $0 = -2 + q$, dus $q = 2$.
    - opgave: |-
        $r$: $y = \tfrac23 x$ en $P(-3, 1)$
      antwoord: |-
        $y = \tfrac23 x + 3$
      uitwerking: |-
        $m = \tfrac23$; $1 = -2 + q$, dus $q = 3$.

# --- Opdrachten (niveau 1, dan 2, dan 3; de onderwerpen door elkaar) --------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    rico en snijpunt met de y-as aflezen uit het voorschrift
  opgave: |-
    Geef de rico en het snijpunt met de $y$-as. Stijgt de grafiek, daalt ze, of is ze horizontaal?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = 4x - 7$
      antwoord: |-
        $m = 4$, $(0, -7)$, stijgt
      uitwerking: |-
        $m = 4 > 0$ en $q = -7$.
    - opgave: |-
        $f(x) = -x + 2$
      antwoord: |-
        $m = -1$, $(0, 2)$, daalt
      uitwerking: |-
        $-x = -1 \cdot x$, dus $m = -1$.
    - opgave: |-
        $f(x) = 3 - \tfrac52 x$
      antwoord: |-
        $m = -\tfrac52$, $(0, 3)$, daalt
      uitwerking: |-
        $f(x) = -\tfrac52 x + 3$.
    - opgave: |-
        $f(x) = \tfrac x4$
      antwoord: |-
        $m = \tfrac14$, $(0, 0)$, stijgt
      uitwerking: |-
        $\tfrac x4 = \tfrac14 x$: een rechte evenredigheid.
    - opgave: |-
        $f(x) = -6$
      antwoord: |-
        $m = 0$, $(0, -6)$, horizontaal
      uitwerking: |-
        Een constante functie.
    - opgave: |-
        $f(x) = 2(x - 3)$
      antwoord: |-
        $m = 2$, $(0, -6)$, stijgt
      uitwerking: |-
        Haakjes uitwerken: $f(x) = 2x - 6$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    rico door twee punten
  opgave: |-
    Bereken de rico van de rechte door de twee punten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(2, 1)$ en $(5, 7)$
      antwoord: |-
        $2$
      uitwerking: |-
        $\tfrac{7 - 1}{5 - 2} = \tfrac63 = 2$.
    - opgave: |-
        $(-1, 3)$ en $(3, -5)$
      antwoord: |-
        $-2$
      uitwerking: |-
        $\tfrac{-5 - 3}{3 - (-1)} = \tfrac{-8}{4} = -2$.
    - opgave: |-
        $(0, 0)$ en $(8, 2)$
      antwoord: |-
        $\tfrac14$
      uitwerking: |-
        $\tfrac{2 - 0}{8 - 0} = \tfrac28 = \tfrac14$.
    - opgave: |-
        $(-4, -1)$ en $(2, 3)$
      antwoord: |-
        $\tfrac23$
      uitwerking: |-
        $\tfrac{3 - (-1)}{2 - (-4)} = \tfrac46 = \tfrac23$.
    - opgave: |-
        $(1, 6)$ en $(7, 6)$
      antwoord: |-
        $0$
      uitwerking: |-
        $\tfrac{6 - 6}{7 - 1} = 0$: horizontaal.
    - opgave: |-
        $(-3, 2)$ en $(-1, -3)$
      antwoord: |-
        $-\tfrac52$
      uitwerking: |-
        $\tfrac{-3 - 2}{-1 - (-3)} = \tfrac{-5}{2} = -\tfrac52$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    voorschrift aflezen uit een grafiek
  opgave: |-
    Geef het voorschrift van de rechten $a$, $b$, $c$ en $d$.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
        \rooster{-4}{1}{4}{-4}{1}{4}
        \rechte{-2.5}{1.5}{2}{1}
        \rechte{-2.67}{4}{3/4}{-2}
        \rechte{-1}{4}{-1}{3}
        \rechte{-4}{4}{0}{-3}
        \node[right] at (1.5,4) {$a$};
        \node[above] at (4,1) {$b$};
        \node[left] at (-1,4) {$c$};
        \node[above] at (-3.5,-3) {$d$};
      \end{tikzpicture}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        rechte $a$
      antwoord: |-
        $y = 2x + 1$
      uitwerking: |-
        $q = 1$; van $(0, 1)$ naar $(1, 3)$: $m = 2$.
    - opgave: |-
        rechte $b$
      antwoord: |-
        $y = \tfrac34 x - 2$
      uitwerking: |-
        $q = -2$; van $(0, -2)$ naar $(4, 1)$: $m = \tfrac34$.
    - opgave: |-
        rechte $c$
      antwoord: |-
        $y = -x + 3$
      uitwerking: |-
        $q = 3$; van $(0, 3)$ naar $(3, 0)$: $m = -1$.
    - opgave: |-
        rechte $d$
      antwoord: |-
        $y = -3$
      uitwerking: |-
        Horizontaal: $m = 0$ en $q = -3$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    rechte evenredigheid herkennen in een tabel
  opgave: |-
    Zijn $x$ en $y$ recht evenredig? Zo ja, geef het voorschrift.
  lijst: enumerate
  delen:
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{1 & 2 & 3 & 6}{2,5 & 5 & 7,5 & 15}
      antwoord: |-
        ja, $y = 2,5x$
      uitwerking: |-
        Het quotiënt is telkens $2,5$.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{2 & 4 & 6 & 8}{3 & 5 & 7 & 9}
      antwoord: |-
        nee
      uitwerking: |-
        $\tfrac32 = 1,5$ maar $\tfrac54 = 1,25$. (Het is wel een eerstegraadsfunctie: $y = x + 1$.)
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{3 & 6 & 9 & 12}{-1 & -2 & -3 & -4}
      antwoord: |-
        ja, $y = -\tfrac13 x$
      uitwerking: |-
        Het quotiënt is telkens $-\tfrac13$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    grafiek tekenen met q en een trapje
  opgave: |-
    Teken de grafieken in één assenstelsel.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $f(x) = 2x - 3$
      antwoord: |-
        door $(0, -3)$ en $(1, -1)$
      uitwerking: |-
        Begin in $(0, -3)$, 1 opzij en 2 omhoog.
    - opgave: |-
        $g(x) = -\tfrac13 x + 2$
      antwoord: |-
        door $(0, 2)$ en $(3, 1)$
      uitwerking: |-
        Begin in $(0, 2)$, 3 opzij en 1 omlaag.
    - opgave: |-
        $h(x) = \tfrac32 x$
      antwoord: |-
        door $(0, 0)$ en $(2, 3)$
      uitwerking: |-
        Door de oorsprong, 2 opzij en 3 omhoog.
    - opgave: |-
        $k(x) = -2$
      antwoord: |-
        horizontaal door $(0, -2)$
      uitwerking: |-
        Een horizontale rechte.
        \figuren{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-4}{1}{4}{-5}{1}{5}
          \rechte{-1}{4}{2}{-3}
          \rechte{-4}{4}{-1/3}{2}
          \rechte{-3}{3.33}{3/2}{0}
          \rechte{-4}{4}{0}{-2}
          \node[right] at (4,5) {$f$};
          \node[above] at (-3.5,3.2) {$g$};
          \node[left] at (3.33,5) {$h$};
          \node[above] at (4,-2) {$k$};
        \end{tikzpicture}}

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    ligt een punt op de grafiek
  opgave: |-
    Gegeven is $f(x) = -2x + 5$.
  lijst: enumerate
  delen:
    - opgave: |-
        Ligt het punt $(3, -1)$ op de grafiek van $f$?
      antwoord: |-
        ja
      uitwerking: |-
        $f(3) = -6 + 5 = -1$: ja.
    - opgave: |-
        Ligt het punt $(-1, 3)$ op de grafiek van $f$?
      antwoord: |-
        nee
      uitwerking: |-
        $f(-1) = 2 + 5 = 7 \neq 3$: nee.
    - opgave: |-
        Bepaal $b$ zodat het punt $(4, b)$ op de grafiek ligt.
      antwoord: |-
        $b = -3$
      uitwerking: |-
        $b = f(4) = -8 + 5 = -3$.
    - opgave: |-
        Bepaal $a$ zodat het punt $(a, 0)$ op de grafiek ligt. Waar snijdt de grafiek dus de $x$-as?
      antwoord: |-
        $a = \tfrac52$; in $(\tfrac52, 0)$
      uitwerking: |-
        $-2a + 5 = 0$ geeft $-2a = -5$, dus $a = \tfrac52$. De grafiek snijdt de $x$-as in $(\tfrac52, 0)$.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    tabel van een eerstegraadsfunctie aanvullen
  opgave: |-
    Elke tabel hoort bij een eerstegraadsfunctie. Vul de tabel aan en geef het voorschrift.
  lijst: enumerate
  delen:
    - opgave: |-
        \waardetabel{5}{0 & 1 & 2 & 3 & 4}{1 & 4 & \vak & \vak & \vak}
      antwoord: |-
        $7, 10, 13$; $f(x) = 3x + 1$
      uitwerking: |-
        Bij een stap 1 telkens 3 omhoog: $7, 10, 13$. $m = 3$ en $q = f(0) = 1$.
    - opgave: |-
        \waardetabel{5}{-2 & 0 & 2 & 4 & 6}{8 & \vak & 2 & \vak & \vak}
      antwoord: |-
        $5, -1, -4$; $f(x) = -\tfrac32 x + 5$
      uitwerking: |-
        Van $x = -2$ naar $x = 2$ (twee stappen van 2) daalt $y$ met 6: per stap 3 omlaag. Dus $f(0) = 5$, $f(4) = -1$, $f(6) = -4$, met $m = \tfrac{-3}{2}$ en $q = 5$.
    - opgave: |-
        \waardetabel{5}{1 & 2 & 3 & 4 & 5}{\vak & 0,5 & 2 & \vak & \vak}
      antwoord: |-
        $-1; 3,5; 5$; $f(x) = 1,5x - 2,5$
      uitwerking: |-
        Bij een stap 1 telkens $1,5$ omhoog: $f(1) = -1$, $f(4) = 3,5$, $f(5) = 5$. $m = 1,5$ en $q = f(0) = -1 - 1,5 = -2,5$.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift door twee punten
  opgave: |-
    Geef het voorschrift van de rechte door $A$ en $B$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $A(0, 4)$ en $B(2, 10)$
      antwoord: |-
        $y = 3x + 4$
      uitwerking: |-
        $m = \tfrac{10 - 4}{2 - 0} = 3$ en $A$ ligt op de $y$-as: $q = 4$.
    - opgave: |-
        $A(1, -1)$ en $B(5, 7)$
      antwoord: |-
        $y = 2x - 3$
      uitwerking: |-
        $m = \tfrac{8}{4} = 2$; $-1 = 2 + q$, dus $q = -3$.
    - opgave: |-
        $A(-3, 5)$ en $B(3, 1)$
      antwoord: |-
        $y = -\tfrac23 x + 3$
      uitwerking: |-
        $m = \tfrac{1 - 5}{3 - (-3)} = -\tfrac46 = -\tfrac23$; $5 = -\tfrac23 \cdot (-3) + q = 2 + q$, dus $q = 3$.
    - opgave: |-
        $A(-2, -6)$ en $B(4, -3)$
      antwoord: |-
        $y = \tfrac12 x - 5$
      uitwerking: |-
        $m = \tfrac{-3 - (-6)}{4 - (-2)} = \tfrac36 = \tfrac12$; $-6 = -1 + q$, dus $q = -5$.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    eerstegraadsfunctie in een context: taxi
  opgave: |-
    De grafiek toont de prijs $k$ (in euro) van een taxirit van $x$ km.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.24cm,y=.1cm]
        \roosterleeg[$x$ (km)][$k$ (euro)]{0}{2}{20}{0}{4}{36}
        \xgetallen{4,8,12,16,20}\ygetallen{8,16,24,32}\oorsprong
        \rechte{0}{20}{1.5}{4}
        \punt{0}{4}\punt{10}{19}
        \aflezen{10}{19}
        \node[right,font=\scriptsize] at (0,19) {$19$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel betaal je bij het instappen?
      antwoord: |-
        4 euro
      uitwerking: |-
        Bij $x = 0$ is $k = 4$.
    - opgave: |-
        Bereken de rico. Wat betekent die?
      antwoord: |-
        $1,5$: 1,50 euro per km
      uitwerking: |-
        Van $(0, 4)$ naar $(10, 19)$: $m = \tfrac{15}{10} = 1,5$. Elke kilometer kost 1,50 euro.
    - opgave: |-
        Geef het voorschrift van $k$.
      antwoord: |-
        $k(x) = 1,5x + 4$
      uitwerking: |-
        $m = 1,5$ en $q = 4$.
    - opgave: |-
        Wat kost een rit van 23 km?
      antwoord: |-
        38,50 euro
      uitwerking: |-
        $k(23) = 34,5 + 4 = 38,5$.
    - opgave: |-
        Iemand betaalt 31 euro. Hoe ver heeft hij gereden?
      antwoord: |-
        18 km
      uitwerking: |-
        $1,5x + 4 = 31$ geeft $1,5x = 27$, dus $x = 18$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift en grafiek koppelen
  opgave: |-
    Welke grafiek hoort bij welk voorschrift? Leg telkens uit hoe je het ziet.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
        \rooster{-4}{1}{4}{-4}{1}{5}
        \rechte{-4}{4}{1/2}{1}
        \rechte{-0.5}{4}{2}{-3}
        \rechte{-2}{2.5}{-2}{1}
        \rechte{-2.5}{2}{2}{1}
        \node[above] at (-3.4,-0.7) {I};
        \node[right] at (4,5) {II};
        \node[right] at (2.5,-4) {III};
        \node[left] at (2,5) {IV};
      \end{tikzpicture}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f_1(x) = 2x + 1$
      antwoord: |-
        IV
      uitwerking: |-
        Stijgend met $m = 2$ door $(0, 1)$: IV.
    - opgave: |-
        $f_2(x) = -2x + 1$
      antwoord: |-
        III
      uitwerking: |-
        De enige dalende rechte: III.
    - opgave: |-
        $f_3(x) = \tfrac12 x + 1$
      antwoord: |-
        I
      uitwerking: |-
        Door $(0, 1)$, maar minder steil dan IV: I.
    - opgave: |-
        $f_4(x) = 2x - 3$
      antwoord: |-
        II
      uitwerking: |-
        Even steil als IV (evenwijdig), maar door $(0, -3)$: II.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift door twee punten in een context: temperatuur en hoogte
  opgave: |-
    Op een bergweg is het op 1200 m hoogte $9\,^\circ$C, en op 2000 m hoogte $4,2\,^\circ$C. Neem aan dat de temperatuur $T$ (in $^\circ$C) een eerstegraadsfunctie is van de hoogte $h$ (in m).
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de rico. Hoeveel daalt de temperatuur per 100 m die je stijgt?
      antwoord: |-
        $-0,006$; $0,6\,^\circ$C per 100 m
      uitwerking: |-
        $m = \tfrac{4,2 - 9}{2000 - 1200} = \tfrac{-4,8}{800} = -0,006$. Per 100 m: $100 \cdot 0,006 = 0,6\,^\circ$C kouder.
    - opgave: |-
        Geef het voorschrift van $T$.
      antwoord: |-
        $T(h) = -0,006h + 16,2$
      uitwerking: |-
        $9 = -0,006 \cdot 1200 + q = -7,2 + q$, dus $q = 16,2$.
    - opgave: |-
        Hoe warm is het op 3000 m?
      antwoord: |-
        $-1,8\,^\circ$C
      uitwerking: |-
        $T(3000) = -18 + 16,2 = -1,8$.
    - opgave: |-
        Vanaf welke hoogte vriest het?
      antwoord: |-
        vanaf 2700 m
      uitwerking: |-
        $-0,006h + 16,2 = 0$ geeft $h = \tfrac{16,2}{0,006} = 2700$.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift uit een tabel, ook met ongelijke stappen
  opgave: |-
    Hoort de tabel bij een eerstegraadsfunctie? Zo ja, geef het voorschrift. Let op: de stappen in $x$ zijn niet altijd gelijk.
  lijst: enumerate
  delen:
    - opgave: |-
        \waardetabel{4}{1 & 3 & 5 & 7}{2 & 8 & 14 & 20}
      antwoord: |-
        ja, $f(x) = 3x - 1$
      uitwerking: |-
        Bij een stap 2 telkens 6 omhoog: $m = 3$. $2 = 3 + q$, dus $q = -1$.
    - opgave: |-
        \waardetabel{4}{-3 & -1 & 2 & 4}{7 & 5 & 2 & 0}
      antwoord: |-
        ja, $f(x) = -x + 4$
      uitwerking: |-
        $\tfrac{5 - 7}{2} = -1$, $\tfrac{2 - 5}{3} = -1$ en $\tfrac{0 - 2}{2} = -1$: overal $m = -1$. $7 = 3 + q$, dus $q = 4$.
    - opgave: |-
        \waardetabel{4}{0 & 2 & 4 & 6}{1 & 2 & 4 & 8}
      antwoord: |-
        nee
      uitwerking: |-
        Bij gelijke stappen in $x$ zijn de stappen in $y$ eerst 1, dan 2, dan 4.
    - opgave: |-
        \waardetabel{4}{-2 & 2 & 6 & 10}{-5 & -2 & 1 & 4}
      antwoord: |-
        ja, $f(x) = \tfrac34 x - \tfrac72$
      uitwerking: |-
        Bij een stap 4 telkens 3 omhoog: $m = \tfrac34$. $-5 = \tfrac34 \cdot (-2) + q = -1,5 + q$, dus $q = -3,5 = -\tfrac72$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift met een punt en de rico
  opgave: |-
    Geef het voorschrift in de vorm $y = mx + q$. Gebruik $y - y_1 = m(x - x_1)$.
  lijst: enumerate
  delen:
    - opgave: |-
        door $(3, 4)$ met rico 2
      antwoord: |-
        $y = 2x - 2$
      uitwerking: |-
        $y - 4 = 2(x - 3) = 2x - 6$, dus $y = 2x - 2$.
    - opgave: |-
        door $(-2, 1)$ met rico $-3$
      antwoord: |-
        $y = -3x - 5$
      uitwerking: |-
        $y - 1 = -3(x + 2) = -3x - 6$, dus $y = -3x - 5$.
    - opgave: |-
        door $(6, -1)$ met rico $\tfrac23$
      antwoord: |-
        $y = \tfrac23 x - 5$
      uitwerking: |-
        $y + 1 = \tfrac23(x - 6) = \tfrac23 x - 4$, dus $y = \tfrac23 x - 5$.
    - opgave: |-
        door $(-4, -3)$, evenwijdig met $y = -\tfrac14 x + 7$
      antwoord: |-
        $y = -\tfrac14 x - 4$
      uitwerking: |-
        $m = -\tfrac14$; $y + 3 = -\tfrac14(x + 4) = -\tfrac14 x - 1$, dus $y = -\tfrac14 x - 4$.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    dalende eerstegraadsfunctie in een context: regenton
  opgave: |-
    Een regenton bevat 120 liter water. Je opent de kraan, en er stroomt elke minuut 7,5 liter uit.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef het voorschrift van het volume $V$ (in liter) na $t$ minuten.
      antwoord: |-
        $V(t) = -7,5t + 120$
      uitwerking: |-
        Beginwaarde 120, en elke minuut $7,5$ liter minder: $V(t) = -7,5t + 120$.
    - opgave: |-
        Waarom is de rico negatief?
      antwoord: |-
        het volume daalt
      uitwerking: |-
        Het volume neemt af: elke minuut komt er $-7,5$ liter bij.
    - opgave: |-
        Hoeveel water zit er na 6 minuten nog in de ton?
      antwoord: |-
        75 liter
      uitwerking: |-
        $V(6) = -45 + 120 = 75$.
    - opgave: |-
        Na hoeveel minuten is de ton leeg?
      antwoord: |-
        na 16 minuten
      uitwerking: |-
        $-7,5t + 120 = 0$ geeft $t = \tfrac{120}{7,5} = 16$.
    - opgave: |-
        Teken de grafiek van $V$ zolang er water in de ton zit.
      antwoord: |-
        van $(0, 120)$ tot $(16, 0)$
      uitwerking: |-
        Een dalend lijnstuk van $(0, 120)$ naar $(16, 0)$.
        \figuren{\begin{tikzpicture}[x=.3cm,y=.025cm]
          \roosterleeg[$t$ (min)][$V$ (l)]{0}{2}{18}{0}{20}{140}
          \xgetallen{4,8,12,16}\ygetallen{40,80,120}\oorsprong
          \rechte{0}{16}{-7.5}{120}
          \punt{0}{120}\punt{16}{0}\punt{6}{75}
          \aflezen{6}{75}
        \end{tikzpicture}}

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten bij de rico
  opgave: |-
    Ilias en Sara berekenen de rico van de rechte door $A(1, 2)$ en $B(4, 11)$.\par
    \smallskip Ilias: $m = \dfrac{4 - 1}{11 - 2} = \dfrac13$ \qquad\qquad Sara: $m = \dfrac{11 - 2}{1 - 4} = -3$
  lijst: enumerate
  delen:
    - opgave: |-
        Wat ging er bij Ilias mis? En bij Sara?
      antwoord: |-
        Ilias: teller en noemer verwisseld; Sara: volgorde niet gelijk gehouden
      uitwerking: |-
        Ilias deelt de verandering van $x$ door die van $y$: omgekeerd. Sara begint in de teller met $B$ en in de noemer met $A$.
    - opgave: |-
        Wat is de juiste rico?
      antwoord: |-
        $3$
      uitwerking: |-
        $m = \tfrac{11 - 2}{4 - 1} = \tfrac93 = 3$.
    - opgave: |-
        Hoe zie je zonder te rekenen dat Sara's antwoord niet kan kloppen?
      antwoord: |-
        $B$ ligt rechts van en hoger dan $A$: de rico is positief
      uitwerking: |-
        Van $A$ naar $B$ ga je naar rechts en omhoog: de rechte stijgt, dus de rico is positief.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    evenwijdige rechten
  opgave: |-
    Evenwijdige rechten.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef het voorschrift van de rechte door $(-1, 2)$ die evenwijdig is met $y = 4x - 3$.
      antwoord: |-
        $y = 4x + 6$
      uitwerking: |-
        $m = 4$; $2 = -4 + q$, dus $q = 6$.
    - opgave: |-
        Geef het voorschrift van de rechte door $(5, 0)$ die evenwijdig is met $y = -\tfrac25 x + 1$.
      antwoord: |-
        $y = -\tfrac25 x + 2$
      uitwerking: |-
        $m = -\tfrac25$; $0 = -2 + q$, dus $q = 2$.
    - opgave: |-
        Welke van deze rechten zijn evenwijdig?\par $r_1$: $y = 2x + 1$ \qquad $r_2$: $y = 1 + 0,5x$ \qquad $r_3$: $y = \tfrac{4x - 3}{2}$ \qquad $r_4$: $y = 3 + 2x$
      antwoord: |-
        $r_1$, $r_3$ en $r_4$
      uitwerking: |-
        $r_3$: $y = 2x - 1,5$. De rico's zijn $2$, $0,5$, $2$ en $2$: $r_1$, $r_3$ en $r_4$ zijn evenwijdig.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift uit de snijpunten met de assen
  opgave: |-
    Geef het voorschrift van de rechte, en teken ze.
  lijst: enumerate
  delen:
    - opgave: |-
        De rechte snijdt de $x$-as in $(4, 0)$ en de $y$-as in $(0, 3)$.
      antwoord: |-
        $y = -\tfrac34 x + 3$
      uitwerking: |-
        $q = 3$ en $m = \tfrac{0 - 3}{4 - 0} = -\tfrac34$.
    - opgave: |-
        De rechte snijdt de $x$-as in $(-2, 0)$ en de $y$-as in $(0, 5)$.
      antwoord: |-
        $y = \tfrac52 x + 5$
      uitwerking: |-
        $q = 5$ en $m = \tfrac{5 - 0}{0 - (-2)} = \tfrac52$.
        \figuren{\begin{tikzpicture}[x=.4cm,y=.4cm,font=\scriptsize]
          \rooster{-3}{1}{5}{-1}{1}{6}
          \rechte{-1.33}{5}{-3/4}{3}
          \rechte{-2.4}{0.4}{5/2}{5}
          \punt{4}{0}\punt{0}{3}\punt{-2}{0}\punt{0}{5}
          \node[above] at (4.5,-0.4) {a};
          \node[left] at (0.4,6) {b};
        \end{tikzpicture}}

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    rico als hellingspercentage
  opgave: |-
    Op een verkeersbord staat dat de weg 12\,\% stijgt: op 100 m horizontaal stijgt de weg 12 m.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de rico van de weg?
      antwoord: |-
        $0,12$
      uitwerking: |-
        $m = \tfrac{12}{100} = 0,12$.
    - opgave: |-
        Hoeveel meter stijg je over een horizontale afstand van 2,5 km?
      antwoord: |-
        300 m
      uitwerking: |-
        $0,12 \cdot 2500 = 300$.
    - opgave: |-
        Een oprit stijgt 1 m per 6 m (horizontaal gemeten). Hoeveel procent is dat?
      antwoord: |-
        ongeveer 16,7\,\%
      uitwerking: |-
        $\tfrac16 \approx 0,167$: ongeveer 16,7 m per 100 m.
    - opgave: |-
        Stel dat een oprit voor rolstoelen hoogstens 5\,\% mag stijgen. Hoe ver voor een podium van 50 cm moet die oprit dan minstens beginnen?
      antwoord: |-
        10 m
      uitwerking: |-
        $0,05 \cdot x = 0,5$ geeft $x = 10$ m.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    verticale rechte en constante functie
  opgave: |-
    Verticale en horizontale rechten.
  lijst: enumerate
  delen:
    - opgave: |-
        Probeer de rico te berekenen van de rechte door $(2, 1)$ en $(2, 5)$. Wat loopt er mis?
      antwoord: |-
        je deelt door 0
      uitwerking: |-
        $\tfrac{5 - 1}{2 - 2} = \tfrac40$: delen door 0 kan niet. De rechte is verticaal en heeft geen rico.
    - opgave: |-
        Is die verticale rechte de grafiek van een functie? Leg uit.
      antwoord: |-
        nee
      uitwerking: |-
        Bij $x = 2$ horen oneindig veel $y$-waarden, terwijl een functie bij elke $x$ hoogstens één $y$ heeft.
    - opgave: |-
        Geef het voorschrift van de horizontale rechte door $(2, 1)$. Wat is haar rico?
      antwoord: |-
        $y = 1$; rico 0
      uitwerking: |-
        Alle punten hebben $y = 1$: de constante functie $f(x) = 1$, met $m = 0$.

- id: h2-o20
  soort: opdracht
  niveau: 2
  thema: |-
    twee eerstegraadsmodellen vergelijken
  opgave: |-
    Een fiets huren kost bij Velo $k(t) = 3t + 5$ euro, en bij Rent $r(t) = 4,5t + 2$ euro, met $t$ het aantal uur.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat betekenen de getallen 3 en 5 bij Velo?
      antwoord: |-
        3 euro per uur, 5 euro vast
      uitwerking: |-
        De rico 3 is de prijs per uur, $q = 5$ is wat je altijd betaalt.
    - opgave: |-
        Welke verhuurder heeft de hoogste vaste kost? Bij welke wordt het per uur het snelst duurder?
      antwoord: |-
        Velo; Rent
      uitwerking: |-
        Vaste kost: $5 > 2$, dus Velo. Per uur: $4,5 > 3$, dus Rent.
    - opgave: |-
        Bereken de prijs voor 1 uur en voor 4 uur bij beide.
      antwoord: |-
        Velo 8 en 17 euro; Rent 6,50 en 20 euro
      uitwerking: |-
        $k(1) = 8$, $k(4) = 17$, $r(1) = 6,5$, $r(4) = 20$.
    - opgave: |-
        Teken beide grafieken voor $0 \leqslant t \leqslant 5$ in één assenstelsel. Lees af na hoeveel uur ze evenveel kosten.
      antwoord: |-
        na 2 uur (11 euro)
      uitwerking: |-
        De rechten snijden elkaar in $(2, 11)$: na 2 uur betaal je bij beide 11 euro. Controle: $k(2) = 6 + 5 = 11$ en $r(2) = 9 + 2 = 11$.
        \figuren{\begin{tikzpicture}[x=.8cm,y=.14cm,font=\scriptsize]
          \roosterleeg[$t$ (h)][euro]{0}{1}{5}{0}{5}{25}
          \xgetallen{1,2,3,4,5}\ygetallen{5,10,15,20,25}\oorsprong
          \rechte{0}{5}{3}{5}
          \rechte[tweede]{0}{5}{4.5}{2}
          \punt{2}{11}\aflezen{2}{11}
          \node[right] at (5,20) {Velo};
          \node[right] at (5,24.5) {Rent};
        \end{tikzpicture}}

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    liggen drie punten op één rechte
  opgave: |-
    Drie punten op één rechte.
  lijst: enumerate
  delen:
    - opgave: |-
        Liggen $A(-1, -4)$, $B(2, 2)$ en $C(5, 8)$ op één rechte? Leg uit.
      antwoord: |-
        ja
      uitwerking: |-
        De rico van $AB$ is $\tfrac63 = 2$, die van $BC$ is $\tfrac63 = 2$. Dezelfde rico en een gemeenschappelijk punt $B$: één rechte.
    - opgave: |-
        Liggen $D(1, 1)$, $E(4, 3)$ en $F(10, 7,5)$ op één rechte?
      antwoord: |-
        nee
      uitwerking: |-
        Rico $DE$: $\tfrac23$; rico $EF$: $\tfrac{4,5}{6} = \tfrac34$. Verschillend, dus niet op één rechte.
    - opgave: |-
        Bepaal $k$ zodat het punt $(k, 20)$ op de rechte door $A$ en $B$ ligt.
      antwoord: |-
        $k = 11$
      uitwerking: |-
        De rechte $AB$: $m = 2$ en $2 = 4 + q$, dus $y = 2x - 2$. Uit $2k - 2 = 20$ volgt $k = 11$.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    gebroken lijn: de rico als snelheid
  opgave: |-
    De grafiek toont de hoogte $h$ (in m) van een wandelaar in functie van de tijd $t$ (in uur).
  figuur:
    code: |-
      \begin{tikzpicture}[x=1.05cm,y=.0029cm,font=\scriptsize]
        \roosterleeg[$t$ (h)][$h$ (m)]{0}{0.5}{4.5}{0}{200}{1200}
        \xgetallen{1,2,3,4}\ygetallen{200,400,600,800,1000,1200}\oorsprong
        \gebroken{(0,400) (2,1000) (2.5,1000) (4,400)}
        \punt{0}{400}\punt{2}{1000}\punt{2.5}{1000}\punt{4}{400}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de rico van elk van de drie stukken. Wat betekent de rico hier?
      antwoord: |-
        $300$, $0$, $-400$ (meter per uur)
      uitwerking: |-
        $\tfrac{1000 - 400}{2} = 300$, $\tfrac{0}{0,5} = 0$ en $\tfrac{400 - 1000}{4 - 2,5} = \tfrac{-600}{1,5} = -400$. De rico is hoeveel meter de wandelaar per uur stijgt (of daalt).
    - opgave: |-
        Op welk stuk veranderde de hoogte het snelst?
      antwoord: |-
        bij de afdaling
      uitwerking: |-
        $\abs{-400} > 300$: bij de afdaling, 400 m per uur.
    - opgave: |-
        Geef het voorschrift van het eerste stuk, voor $0 \leqslant t \leqslant 2$.
      antwoord: |-
        $h(t) = 300t + 400$
      uitwerking: |-
        $m = 300$ en $q = 400$.
    - opgave: |-
        Geef het voorschrift van het laatste stuk, voor $2,5 \leqslant t \leqslant 4$.
      antwoord: |-
        $h(t) = -400t + 2000$
      uitwerking: |-
        $m = -400$ en $1000 = -400 \cdot 2,5 + q = -1000 + q$, dus $q = 2000$. Controle: $h(4) = -1600 + 2000 = 400$.

- id: h2-o23
  soort: opdracht
  niveau: 3
  thema: |-
    parameters in een eerstegraadsfunctie
  opgave: |-
    Zoek het ontbrekende getal.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welk getal $p$ heeft de rechte door $(1, p)$ en $(4, 10)$ rico 2?
      antwoord: |-
        $p = 4$
      uitwerking: |-
        $\tfrac{10 - p}{3} = 2$ geeft $10 - p = 6$, dus $p = 4$.
    - opgave: |-
        De rechte $y = mx + 2$ gaat door $(4, -6)$. Bereken $m$.
      antwoord: |-
        $m = -2$
      uitwerking: |-
        $-6 = 4m + 2$ geeft $4m = -8$, dus $m = -2$.
    - opgave: |-
        Voor welke getallen $a$ is de grafiek van $f(x) = (3 - a)x + 1$ dalend?
      antwoord: |-
        voor $a > 3$
      uitwerking: |-
        Dalend als de rico negatief is: $3 - a < 0$, dus $a > 3$.

- id: h2-o24
  soort: opdracht
  niveau: 3
  pakketten: [5]
  thema: |-
    bewijs: de vergelijking met de snijpunten met de assen
  opgave: |-
    Een rechte snijdt de $x$-as in $(a, 0)$ en de $y$-as in $(0, b)$, met $a \neq 0$ en $b \neq 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het voorschrift $y = -\dfrac ba\,x + b$ is.
      antwoord: |-
        $m = -\tfrac ba$, $q = b$
      uitwerking: |-
        $(0, b)$ ligt op de $y$-as, dus $q = b$. De rico is $m = \tfrac{b - 0}{0 - a} = -\tfrac ba$.
    - opgave: |-
        Toon aan dat je dat voorschrift kunt schrijven als $\dfrac xa + \dfrac yb = 1$.
      antwoord: |-
        deel door $b$ en breng de term met $x$ over
      uitwerking: |-
        Deel $y = -\tfrac ba x + b$ door $b$: $\tfrac yb = -\tfrac xa + 1$. Breng $-\tfrac xa$ naar het linkerlid: $\tfrac xa + \tfrac yb = 1$.
    - opgave: |-
        Gebruik dit om meteen het voorschrift te geven van de rechte door $(6, 0)$ en $(0, -2)$.
      antwoord: |-
        $y = \tfrac13 x - 2$
      uitwerking: |-
        $\tfrac x6 + \tfrac{y}{-2} = 1$, dus $-\tfrac y2 = 1 - \tfrac x6$ en $y = \tfrac13 x - 2$.

