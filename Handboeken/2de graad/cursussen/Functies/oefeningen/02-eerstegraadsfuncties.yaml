- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    rico door twee punten
  opgave: |-
    Bereken de rico van de rechte door de twee punten.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(-2, 1)$ en $(4, 4)$
      antwoord: |-
        $\tfrac12$
      uitwerking: |-
        $\tfrac{4 - 1}{4 - (-2)} = \tfrac36 = \tfrac12$.
    - opgave: |-
        $(1, 5)$ en $(3, -3)$
      antwoord: |-
        $-4$
      uitwerking: |-
        $\tfrac{-3 - 5}{3 - 1} = \tfrac{-8}{2} = -4$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    grafiek tekenen
  opgave: |-
    Teken de grafiek van $f(x) = -\tfrac34 x + 2$.
  antwoord: |-
    door $(0, 2)$ en $(4, -1)$
  uitwerking: |-
    Begin in $(0, 2)$, en ga 4 opzij en 3 omlaag: $(4, -1)$.
    \figuren{\begin{tikzpicture}[x=.42cm,y=.42cm]
      \rooster{-3}{1}{5}{-2}{1}{4}
      \rechte{-2.67}{5}{-3/4}{2}
      \trapje{0}{2}{4}{-3}{$4$}{$-3$}
      \punt{0}{2}\punt{4}{-1}
    \end{tikzpicture}}

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    voorschrift aflezen uit een grafiek
  opgave: |-
    Geef het voorschrift van de rechte in de figuur.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm]
        \rooster{-2}{1}{5}{-3}{1}{5}
        \rechte{-0.67}{4.67}{3/2}{-2}
      \end{tikzpicture}
  antwoord: |-
    $y = \tfrac32 x - 2$
  uitwerking: |-
    $q = -2$; van $(0, -2)$ naar $(2, 1)$: 2 opzij en 3 omhoog, dus $m = \tfrac32$.

- id: h2-t4
  soort: test
  niveau: 2
  thema: |-
    voorschrift door twee punten
  opgave: |-
    Geef het voorschrift van de rechte door $A(-2, 7)$ en $B(4, -2)$.
  antwoord: |-
    $y = -\tfrac32 x + 4$
  uitwerking: |-
    $m = \tfrac{-2 - 7}{4 - (-2)} = \tfrac{-9}{6} = -\tfrac32$. $7 = -\tfrac32 \cdot (-2) + q = 3 + q$, dus $q = 4$. Controle met $B$: $-6 + 4 = -2$.

- id: h2-t5
  soort: test
  niveau: 1
  thema: |-
    rechte evenredigheid herkennen
  opgave: |-
    Zijn $x$ en $y$ recht evenredig? Zo ja, geef het voorschrift.
  lijst: enumerate
  delen:
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{4 & 6 & 10 & 15}{6 & 9 & 15 & 22,5}
      antwoord: |-
        ja, $y = 1,5x$
      uitwerking: |-
        Het quotiënt is telkens $1,5$.
    - opgave: |-
        \waardetabel[$x$][$y$]{4}{1 & 2 & 3 & 4}{5 & 8 & 11 & 14}
      antwoord: |-
        nee
      uitwerking: |-
        $\tfrac51 = 5$ maar $\tfrac82 = 4$: niet recht evenredig (wel $y = 3x + 2$).

- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    eerstegraadsfunctie in een context
  opgave: |-
    Een fitnessclub vraagt 25 euro inschrijvingsgeld en daarna 30 euro per maand.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef het voorschrift van wat je in totaal betaalt na $t$ maanden.
      antwoord: |-
        $k(t) = 30t + 25$
      uitwerking: |-
        Rico 30 (euro per maand), beginwaarde 25.
    - opgave: |-
        Wat betekenen $m$ en $q$ in deze situatie?
      antwoord: |-
        $m$: 30 euro per maand; $q$: 25 euro inschrijving
      uitwerking: |-
        Elke maand komt er 30 euro bij; de 25 euro betaal je één keer.
    - opgave: |-
        Hoeveel betaal je in het eerste jaar?
      antwoord: |-
        385 euro
      uitwerking: |-
        $k(12) = 360 + 25 = 385$.
    - opgave: |-
        Na hoeveel maanden heb je in totaal 445 euro betaald?
      antwoord: |-
        na 14 maanden
      uitwerking: |-
        $30t + 25 = 445$ geeft $30t = 420$, dus $t = 14$.

- id: h2-t7
  soort: test
  niveau: 2
  thema: |-
    evenwijdige rechte door een punt
  opgave: |-
    Geef het voorschrift van de rechte door $P(2, -3)$ die evenwijdig is met $y = 5x + 1$.
  antwoord: |-
    $y = 5x - 13$
  uitwerking: |-
    $m = 5$; $-3 = 10 + q$, dus $q = -13$.
