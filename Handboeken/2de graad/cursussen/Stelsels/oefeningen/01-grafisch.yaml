# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.
# De antwoorden zijn nagerekend met SymPy.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Dit ken je uit Eerstegraadsvergelijkingen en Functies.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Los op: $3x + 4 = 19$
      antwoord: |-
        $x = 5$
      uitwerking: |-
        $3x = 15$, dus $x = 5$.
    - opgave: |-
        Los op: $8 - 2y = 14$
      antwoord: |-
        $y = -3$
      uitwerking: |-
        $-2y = 6$, dus $y = -3$.
    - opgave: |-
        Schrijf als $y = mx + q$: \ $y - 3x = 1$
      antwoord: |-
        $y = 3x + 1$
      uitwerking: |-
        Breng $-3x$ naar het rechterlid: $y = 3x + 1$.
    - opgave: |-
        Geef $m$ en $q$ van $y = -2x + 8$.
      antwoord: |-
        $m = -2$, $q = 8$
      uitwerking: |-
        De rico is $-2$, de rechte snijdt de $y$-as in $(0, 8)$.
    - opgave: |-
        Ligt $(2, 1)$ op de rechte $y = 3x - 5$?
      antwoord: |-
        ja
      uitwerking: |-
        $3 \cdot 2 - 5 = 1$: ja.
    - opgave: |-
        Bereken $y$ als $x = -4$: \ $y = \tfrac12 x + 3$
      antwoord: |-
        $y = 1$
      uitwerking: |-
        $\tfrac12 \cdot (-4) + 3 = -2 + 3 = 1$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Op een balans in evenwicht liggen links twee zakjes en een bol, rechts acht blokjes. Een blokje weegt 1~kg. Alle zakjes wegen evenveel, en alle bollen ook.
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.42]
        \balansxy{2}{1}{0}{0}{0}{8}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Een zakje weegt 1~kg. Hoeveel weegt een bol?
      antwoord: |-
        6~kg
      uitwerking: |-
        Twee zakjes wegen 2~kg, dus de bol weegt $8 - 2 = 6$~kg.
    - opgave: |-
        Een zakje weegt 2,5~kg. Hoeveel weegt een bol?
      antwoord: |-
        3~kg
      uitwerking: |-
        Twee zakjes wegen 5~kg, dus de bol weegt 3~kg.
    - opgave: |-
        Zoek nog drie andere mogelijkheden voor het gewicht van een zakje en een bol.
      antwoord: |-
        bv. 2 en 4, 3 en 2, 3,5 en 1
      uitwerking: |-
        Bijvoorbeeld een zakje van 2~kg en een bol van 4~kg, 3~kg en 2~kg, of 3,5~kg en 1~kg. Steeds weegt het zakje twee keer mee.
    - opgave: |-
        Zet elke mogelijkheid als een punt in een assenstelsel: het gewicht van een zakje op de $x$-as, dat van een bol op de $y$-as. Wat merk je?
      antwoord: |-
        de punten liggen op een rechte
      uitwerking: |-
        Alle punten liggen op één rechte, die daalt: weegt een zakje meer, dan weegt de bol minder.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-1}{1}{5}{-1}{1}{9}
          \rechteabc{-0.5}{4.5}{2}{1}{8}
          \punt{1}{6}
          \punt{2.5}{3}
          \punt{2}{4}
          \punt{3}{2}
          \punt{3.5}{1}
        \end{tikzpicture}}
    - opgave: |-
        Kun je met deze ene balans zeggen hoeveel een zakje weegt?
      antwoord: |-
        neen
      uitwerking: |-
        Neen: er zijn oneindig veel mogelijkheden.

- id: h1-koppel
  soort: kort
  opgave: |-
    Is het koppel een oplossing van $5x - 2y = 8$?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $(2, 1)$
      antwoord: |-
        ja
      uitwerking: |-
        $10 - 2 = 8$: ja.
    - opgave: |-
        $(1, 2)$
      antwoord: |-
        neen
      uitwerking: |-
        $5 - 4 = 1$: neen.
    - opgave: |-
        $(0, -4)$
      antwoord: |-
        ja
      uitwerking: |-
        $0 + 8 = 8$: ja.
    - opgave: |-
        $(-2, 9)$
      antwoord: |-
        neen
      uitwerking: |-
        $-10 - 18 = -28$: neen.

- id: h1-aanvullen
  soort: kort
  opgave: |-
    Zoek de oplossing van $2x + 5y = 20$ met
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x = 0$
      antwoord: |-
        $(0, 4)$
      uitwerking: |-
        $5y = 20$, $y = 4$.
    - opgave: |-
        $y = 0$
      antwoord: |-
        $(10, 0)$
      uitwerking: |-
        $2x = 20$, $x = 10$.
    - opgave: |-
        $x = 5$
      antwoord: |-
        $(5, 2)$
      uitwerking: |-
        $10 + 5y = 20$, $y = 2$.
    - opgave: |-
        $y = -2$
      antwoord: |-
        $(15, -2)$
      uitwerking: |-
        $2x - 10 = 20$, $x = 15$.
    - opgave: |-
        $x = -5$
      antwoord: |-
        $(-5, 6)$
      uitwerking: |-
        $-10 + 5y = 20$, $y = 6$.
    - opgave: |-
        $y = 1$
      antwoord: |-
        $(7{,}5;\ 1)$
      uitwerking: |-
        $2x + 5 = 20$, $x = 7{,}5$.

- id: h1-tekenen
  soort: kort
  opgave: |-
    Teken de rechte.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x + y = 5$
      antwoord: |-
        door $(0, 5)$ en $(5, 0)$
      uitwerking: |-
        Snijpunten met de assen: $(0, 5)$ en $(5, 0)$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-2}{1}{6}{-2}{1}{6}
          \rechteabc{-1}{6}{1}{1}{5}
          \punt{0}{5}
          \punt{5}{0}
        \end{tikzpicture}}
    - opgave: |-
        $3x - 2y = 6$
      antwoord: |-
        door $(0, -3)$ en $(2, 0)$
      uitwerking: |-
        Met $x = 0$: $-2y = 6$, $y = -3$. Met $y = 0$: $x = 2$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-2}{1}{5}{-4}{1}{4}
          \rechteabc{-0.6667}{4.6667}{3}{-2}{6}
          \punt{0}{-3}
          \punt{2}{0}
          \punt{4}{3}
        \end{tikzpicture}}
    - opgave: |-
        $2x + 5y = -10$
      antwoord: |-
        door $(0, -2)$ en $(-5, 0)$
      uitwerking: |-
        Met $x = 0$: $y = -2$. Met $y = 0$: $x = -5$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-6}{1}{3}{-4}{1}{2}
          \rechteabc{-6}{3}{2}{5}{-10}
          \punt{0}{-2}
          \punt{-5}{0}
        \end{tikzpicture}}

- id: h1-verticaal
  soort: kort
  opgave: |-
    Teken de vier rechten in één assenstelsel.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $x = -3$
      antwoord: |-
        verticaal door $(-3, 0)$
    - opgave: |-
        $2y = 6$
      antwoord: |-
        horizontaal: $y = 3$
    - opgave: |-
        $4x - 8 = 0$
      antwoord: |-
        verticaal: $x = 2$
    - opgave: |-
        $y + 1 = 0$
      antwoord: |-
        horizontaal: $y = -1$
  uitwerking: |-
    De rechten zijn $x = -3$ en $x = 2$ (verticaal), en $y = 3$ en $y = -1$ (horizontaal). Ze vormen samen een rechthoek van 5 bij 4.
    \figuren{\begin{tikzpicture}[x=0.35cm,y=0.35cm,font=\scriptsize]
      \rooster{-4}{1}{4}{-3}{1}{4}
      \verticaal{-3}{-3}{4}
      \rechteabc{-4}{4}{0}{1}{3}
      \verticaal{2}{-3}{4}
      \rechteabc{-4}{4}{0}{1}{-1}
    \end{tikzpicture}}

- id: h1-nagaan
  soort: kort
  opgave: |-
    Is het koppel een oplossing van het stelsel $\stelsel{3x - y &= 5}{x + 2y &= 4}$?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $(2, 1)$
      antwoord: |-
        ja
      uitwerking: |-
        $6 - 1 = 5$ en $2 + 2 = 4$: ja.
    - opgave: |-
        $(1, -2)$
      antwoord: |-
        neen
      uitwerking: |-
        $3 + 2 = 5$, maar $1 - 4 = -3$: neen.
    - opgave: |-
        $(4, 0)$
      antwoord: |-
        neen
      uitwerking: |-
        $12 \neq 5$: neen, ook al klopt $4 + 0 = 4$.
    - opgave: |-
        $(0, 2)$
      antwoord: |-
        neen
      uitwerking: |-
        $-2 \neq 5$: neen.

- id: h1-grafisch
  soort: kort
  opgave: |-
    Los grafisch op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\stelsel{x + y &= 6}{x - y &= 2}$
      antwoord: |-
        $V = \{(4, 2)\}$
      uitwerking: |-
        De rechten gaan door $(0, 6)$ en $(6, 0)$, en door $(0, -2)$ en $(2, 0)$. Controle: $4 + 2 = 6$ en $4 - 2 = 2$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-1}{1}{7}{-3}{1}{7}
          \rechteabc{-1}{7}{1}{1}{6}
          \rechteabc[tweede]{-1}{7}{1}{-1}{2}
          \punt{4}{2}
        \end{tikzpicture}}
    - opgave: |-
        $\stelsel{y &= -2x + 1}{y &= x - 5}$
      antwoord: |-
        $V = \{(2, -3)\}$
      uitwerking: |-
        Teken met $q$ en een trapje. Controle: $-4 + 1 = -3$ en $2 - 5 = -3$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-2}{1}{5}{-6}{1}{3}
          \rechteabc{-1}{3.5}{2}{1}{1}
          \rechteabc[tweede]{-1}{5}{-1}{1}{-5}
          \punt{2}{-3}
        \end{tikzpicture}}
    - opgave: |-
        $\stelsel{2x + 3y &= 12}{x - 3y &= -3}$
      antwoord: |-
        $V = \{(3, 2)\}$
      uitwerking: |-
        De rechten gaan door $(0, 4)$ en $(6, 0)$, en door $(0, 1)$ en $(-3, 0)$. Controle: $6 + 6 = 12$ en $3 - 6 = -3$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-4}{1}{7}{-1}{1}{5}
          \rechteabc{-1.5}{7}{2}{3}{12}
          \rechteabc[tweede]{-4}{7}{1}{-3}{-3}
          \punt{3}{2}
        \end{tikzpicture}}

- id: h1-benadering
  soort: kort
  opgave: |-
    Los grafisch op: $\stelsel{y &= -x + 3}{y &= 3x - 2}$. Lees het snijpunt af op één decimaal, en controleer je aflezing door ze in te vullen.
  antwoord: |-
    ongeveer $(1{,}2;\ 1{,}8)$
  uitwerking: |-
    Het snijpunt ligt tussen de roosterpunten, ongeveer in $(1{,}2;\ 1{,}8)$. Controle: $-1{,}2 + 3 = 1{,}8$, maar $3 \cdot 1{,}2 - 2 = 1{,}6$. De aflezing is een benadering. (De exacte oplossing is $(1{,}25;\ 1{,}75)$, zie hoofdstuk 2.)
    \figuren{\begin{tikzpicture}[x=0.5cm,y=0.5cm,font=\scriptsize]
      \rooster{-1}{1}{4}{-2}{1}{4}
      \rechteabc{-1}{4}{1}{1}{3}
      \rechteabc[tweede]{0}{2}{-3}{1}{-2}
      \punt{1.25}{1.75}
    \end{tikzpicture}}

- id: h1-onbepaald
  soort: kort
  opgave: |-
    Los grafisch op en noteer $V$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{x - y &= 3}{2x - 2y &= 2}$
      antwoord: |-
        $V = \emptyset$ (strijdig)
      uitwerking: |-
        $y = x - 3$ en $y = x - 1$: dezelfde rico, een andere $q$. De rechten zijn evenwijdig.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-2}{1}{5}{-4}{1}{3}
          \rechteabc{-1}{5}{1}{-1}{3}
          \rechteabc[tweede]{-2}{4}{2}{-2}{2}
        \end{tikzpicture}}
    - opgave: |-
        $\stelsel{x + 2y &= 2}{3x + 6y &= 6}$
      antwoord: |-
        $V = \{(x, y) \mid x + 2y = 2\}$ (onbepaald)
      uitwerking: |-
        Twee keer $y = -\tfrac12 x + 1$: de rechten vallen samen. Oplossingen zijn bijvoorbeeld $(0, 1)$, $(2, 0)$ en $(4, -1)$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-2}{1}{5}{-2}{1}{3}
          \rechteabc[line width=2.4pt,opacity=.35]{-2}{5}{1}{2}{2}
          \rechteabc[tweede]{-2}{5}{3}{6}{6}
          \punt{0}{1}
          \punt{2}{0}
          \punt{4}{-1}
        \end{tikzpicture}}

- id: h1-aantal
  soort: kort
  opgave: |-
    Hoeveel oplossingen heeft het stelsel? Teken niet.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{y &= -x + 4}{y &= x + 4}$
      antwoord: |-
        één
      uitwerking: |-
        De rico's $-1$ en $1$ verschillen.
    - opgave: |-
        $\stelsel{3x + y &= 2}{6x + 2y &= 5}$
      antwoord: |-
        geen
      uitwerking: |-
        $y = -3x + 2$ en $y = -3x + \tfrac52$: dezelfde rico, een andere $q$.
    - opgave: |-
        $\stelsel{x - 4y &= 8}{-2x + 8y &= -16}$
      antwoord: |-
        oneindig veel
      uitwerking: |-
        Twee keer $y = \tfrac14 x - 2$.
    - opgave: |-
        $\stelsel{2x + 3y &= 6}{3x + 2y &= 6}$
      antwoord: |-
        één
      uitwerking: |-
        De rico's $-\tfrac23$ en $-\tfrac32$ verschillen.

- id: h1-parameter
  pakketten: [5]
  soort: kort
  opgave: |-
    Bespreek het aantal oplossingen in functie van $k$.
  lijst: enumerate
  delen:
    - opgave: |-
        $\stelsel{kx - y &= 2}{4x - y &= 5}$
      antwoord: |-
        $k = 4$: strijdig; $k \neq 4$: één oplossing
      uitwerking: |-
        $y = kx - 2$ en $y = 4x - 5$. Dezelfde rico als $k = 4$, en dan is $q$ verschillend ($-2$ en $-5$): strijdig. Voor $k \neq 4$ precies één oplossing.
    - opgave: |-
        $\stelsel{x + 2y &= 3}{kx + 6y &= 9}$
      antwoord: |-
        $k = 3$: onbepaald; $k \neq 3$: één oplossing
      uitwerking: |-
        $y = -\tfrac12 x + \tfrac32$ en $y = -\tfrac{k}{6} x + \tfrac32$. Dezelfde rico als $\tfrac{k}{6} = \tfrac12$, dus $k = 3$, en dan is ook $q$ gelijk: onbepaald. Voor $k \neq 3$ precies één oplossing.

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    oplossing van een stelsel nagaan
  opgave: |-
    Gegeven het stelsel $\stelsel{2x + y &= 7}{x - 3y &= 7}$. Is het koppel een oplossing van de eerste vergelijking, van de tweede vergelijking, van het stelsel?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $(4, -1)$
      antwoord: |-
        beide; ja
      uitwerking: |-
        $8 - 1 = 7$ en $4 + 3 = 7$: een oplossing van het stelsel.
    - opgave: |-
        $(3, 1)$
      antwoord: |-
        alleen de eerste
      uitwerking: |-
        $6 + 1 = 7$, maar $3 - 3 = 0$.
    - opgave: |-
        $(1, -2)$
      antwoord: |-
        alleen de tweede
      uitwerking: |-
        $2 - 2 = 0$, maar $1 + 6 = 7$.
    - opgave: |-
        $(-1, 4)$
      antwoord: |-
        geen van beide
      uitwerking: |-
        $-2 + 4 = 2$ en $-1 - 12 = -13$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    rechte tekenen bij een vergelijking
  opgave: |-
    Teken de rechte. Gebruik telkens een nieuw assenstelsel.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $x + y = 3$
      antwoord: |-
        door $(0, 3)$ en $(3, 0)$
      uitwerking: |-
        Snijpunten met de assen: $(0, 3)$ en $(3, 0)$.
        \figuren{\begin{tikzpicture}[x=0.28cm,y=0.28cm,font=\scriptsize]
          \rooster{-2}{1}{4}{-2}{1}{4}
          \rechteabc{-1}{4}{1}{1}{3}
          \punt{0}{3}
          \punt{3}{0}
        \end{tikzpicture}}
    - opgave: |-
        $2x - y = 4$
      antwoord: |-
        door $(0, -4)$ en $(2, 0)$
      uitwerking: |-
        Met $x = 0$: $y = -4$. Met $y = 0$: $x = 2$.
        \figuren{\begin{tikzpicture}[x=0.28cm,y=0.28cm,font=\scriptsize]
          \rooster{-2}{1}{4}{-5}{1}{3}
          \rechteabc{-0.5}{3.5}{2}{-1}{4}
          \punt{0}{-4}
          \punt{2}{0}
        \end{tikzpicture}}
    - opgave: |-
        $3x + 4y = 12$
      antwoord: |-
        door $(0, 3)$ en $(4, 0)$
      uitwerking: |-
        Met $x = 0$: $y = 3$. Met $y = 0$: $x = 4$.
        \figuren{\begin{tikzpicture}[x=0.28cm,y=0.28cm,font=\scriptsize]
          \rooster{-2}{1}{5}{-2}{1}{4}
          \rechteabc{-1.3333}{5}{3}{4}{12}
          \punt{0}{3}
          \punt{4}{0}
        \end{tikzpicture}}
    - opgave: |-
        $5x - 2y = 10$
      antwoord: |-
        door $(0, -5)$ en $(2, 0)$
      uitwerking: |-
        Met $x = 0$: $y = -5$. Met $y = 0$: $x = 2$.
        \figuren{\begin{tikzpicture}[x=0.28cm,y=0.28cm,font=\scriptsize]
          \rooster{-2}{1}{4}{-6}{1}{3}
          \rechteabc{-0.4}{3.2}{5}{-2}{10}
          \punt{0}{-5}
          \punt{2}{0}
        \end{tikzpicture}}
    - opgave: |-
        $x - 3y = 0$
      antwoord: |-
        door $(0, 0)$ en $(3, 1)$
      uitwerking: |-
        Beide snijpunten zijn $(0, 0)$. Met $x = 3$: $y = 1$.
        \figuren{\begin{tikzpicture}[x=0.28cm,y=0.28cm,font=\scriptsize]
          \rooster{-4}{1}{4}{-2}{1}{2}
          \rechteabc{-4}{4}{1}{-3}{0}
          \punt{0}{0}
          \punt{3}{1}
        \end{tikzpicture}}
    - opgave: |-
        $-3x + 2y = 4$
      antwoord: |-
        door $(0, 2)$ en $(2, 5)$
      uitwerking: |-
        $y = \tfrac32 x + 2$: begin in $(0, 2)$, ga 2 opzij en 3 omhoog.
        \figuren{\begin{tikzpicture}[x=0.28cm,y=0.28cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-2}{1}{6}
          \rechteabc{-2.6667}{2.6667}{-3}{2}{4}
          \punt{0}{2}
          \punt{2}{5}
        \end{tikzpicture}}
    - opgave: |-
        $x = -2$
      antwoord: |-
        verticaal door $(-2, 0)$
      uitwerking: |-
        Alle punten met $x = -2$.
        \figuren{\begin{tikzpicture}[x=0.28cm,y=0.28cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-3}{1}{3}
          \verticaal{-2}{-3}{3}
        \end{tikzpicture}}
    - opgave: |-
        $4y = 8$
      antwoord: |-
        horizontaal: $y = 2$
      uitwerking: |-
        $y = 2$: alle punten met $y = 2$.
        \figuren{\begin{tikzpicture}[x=0.28cm,y=0.28cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-1}{1}{3}
          \rechteabc{-3}{3}{0}{4}{8}
        \end{tikzpicture}}

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    aantal oplossingen met de rico
  opgave: |-
    Hoeveel oplossingen heeft het stelsel? Teken niet. Zeg ook of het stelsel strijdig of onbepaald is.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\stelsel{y &= 3x - 1}{y &= 3x + 4}$
      antwoord: |-
        geen, strijdig
      uitwerking: |-
        Dezelfde rico 3, een andere $q$.
    - opgave: |-
        $\stelsel{y &= 2x + 1}{y &= -2x + 1}$
      antwoord: |-
        één
      uitwerking: |-
        De rico's 2 en $-2$ verschillen.
    - opgave: |-
        $\stelsel{x + y &= 3}{2x + 2y &= 6}$
      antwoord: |-
        oneindig veel, onbepaald
      uitwerking: |-
        Twee keer $y = -x + 3$.
    - opgave: |-
        $\stelsel{2x - 3y &= 6}{4x - 6y &= 6}$
      antwoord: |-
        geen, strijdig
      uitwerking: |-
        $y = \tfrac23 x - 2$ en $y = \tfrac23 x - 1$.
    - opgave: |-
        $\stelsel{x - 2y &= 4}{2x - y &= 4}$
      antwoord: |-
        één
      uitwerking: |-
        De rico's $\tfrac12$ en 2 verschillen.
    - opgave: |-
        $\stelsel{6x + 4y &= 2}{-3x - 2y &= -1}$
      antwoord: |-
        oneindig veel, onbepaald
      uitwerking: |-
        Twee keer $y = -\tfrac32 x + \tfrac12$.
    - opgave: |-
        $\stelsel{x &= 3}{x &= -1}$
      antwoord: |-
        geen, strijdig
      uitwerking: |-
        Twee evenwijdige verticale rechten.
    - opgave: |-
        $\stelsel{y &= 4}{x &= -2}$
      antwoord: |-
        één
      uitwerking: |-
        Een horizontale en een verticale rechte snijden elkaar in $(-2, 4)$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    oplossingen van een vergelijking zoeken
  opgave: |-
    Zoek de oplossing van $3x - 2y = 12$ met
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x = 0$
      antwoord: |-
        $(0, -6)$
      uitwerking: |-
        $-2y = 12$, $y = -6$.
    - opgave: |-
        $y = 0$
      antwoord: |-
        $(4, 0)$
      uitwerking: |-
        $3x = 12$, $x = 4$.
    - opgave: |-
        $x = 2$
      antwoord: |-
        $(2, -3)$
      uitwerking: |-
        $6 - 2y = 12$, $-2y = 6$, $y = -3$.
    - opgave: |-
        $x = -2$
      antwoord: |-
        $(-2, -9)$
      uitwerking: |-
        $-6 - 2y = 12$, $-2y = 18$, $y = -9$.
    - opgave: |-
        $y = 3$
      antwoord: |-
        $(6, 3)$
      uitwerking: |-
        $3x - 6 = 12$, $3x = 18$, $x = 6$.
    - opgave: |-
        $y = -1{,}5$
      antwoord: |-
        $(3;\ -1{,}5)$
      uitwerking: |-
        $3x + 3 = 12$, $x = 3$. Alle zes punten liggen op de rechte:
        \figuren{\begin{tikzpicture}[x=0.28cm,y=0.28cm,font=\scriptsize]
          \rooster{-3}{1}{7}{-10}{1}{4}
          \rechteabc{-2.6667}{6.6667}{3}{-2}{12}
          \punt{0}{-6}
          \punt{4}{0}
          \punt{2}{-3}
          \punt{-2}{-9}
          \punt{6}{3}
          \punt{3}{-1.5}
        \end{tikzpicture}}
  slot: |-
    Teken daarna de rechte $3x - 2y = 12$ en zet de zes punten erop.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    stelsel grafisch oplossen
  opgave: |-
    Los grafisch op en controleer.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{x + y &= 4}{x - y &= 2}$
      antwoord: |-
        $V = \{(3, 1)\}$
      uitwerking: |-
        Door $(0, 4)$ en $(4, 0)$; door $(0, -2)$ en $(2, 0)$. Controle: $3 + 1 = 4$, $3 - 1 = 2$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-1}{1}{5}{-3}{1}{5}
          \rechteabc{-1}{5}{1}{1}{4}
          \rechteabc[tweede]{-1}{5}{1}{-1}{2}
          \punt{3}{1}
        \end{tikzpicture}}
    - opgave: |-
        $\stelsel{2x + y &= 1}{x - y &= 5}$
      antwoord: |-
        $V = \{(2, -3)\}$
      uitwerking: |-
        Door $(0, 1)$ en $(1, -1)$; door $(0, -5)$ en $(5, 0)$. Controle: $4 - 3 = 1$, $2 + 3 = 5$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-2}{1}{6}{-6}{1}{3}
          \rechteabc{-1}{3.5}{2}{1}{1}
          \rechteabc[tweede]{-1}{6}{1}{-1}{5}
          \punt{2}{-3}
        \end{tikzpicture}}
    - opgave: |-
        $\stelsel{y &= 2x + 3}{x + 2y &= -4}$
      antwoord: |-
        $V = \{(-2, -1)\}$
      uitwerking: |-
        $q = 3$ en rico 2; door $(0, -2)$ en $(-4, 0)$. Controle: $-4 + 3 = -1$, $-2 - 2 = -4$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-5}{1}{2}{-4}{1}{4}
          \rechteabc{-3.5}{0.5}{-2}{1}{3}
          \rechteabc[tweede]{-5}{2}{1}{2}{-4}
          \punt{-2}{-1}
        \end{tikzpicture}}
    - opgave: |-
        $\stelsel{3x - 2y &= 6}{y &= -x + 2}$
      antwoord: |-
        $V = \{(2, 0)\}$
      uitwerking: |-
        Door $(0, -3)$ en $(2, 0)$; $q = 2$ en rico $-1$. Controle: $6 - 0 = 6$, $-2 + 2 = 0$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-2}{1}{4}{-4}{1}{4}
          \rechteabc{-0.6667}{4}{3}{-2}{6}
          \rechteabc[tweede]{-2}{4}{1}{1}{2}
          \punt{2}{0}
        \end{tikzpicture}}

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijking bij een rechte kiezen
  opgave: |-
    Welke rechte in de figuur hoort bij welke vergelijking?
  figuur:
    code: |-
      \begin{tikzpicture}[x=0.42cm,y=0.42cm,font=\scriptsize]
        \rooster{-4}{1}{5}{-4}{1}{5}
        \rechteabc{-0.5}{4}{2}{1}{4}
        \rechteabc{-4}{5}{1}{-2}{4}
        \rechteabc{-4}{2}{1}{1}{-2}
        \rechteabc{-2.3333}{0.6667}{3}{-1}{-3}
        \node[right] at (5,0.5) {$b$}; \node[above left] at (-0.5,5) {$a$}; \node[above] at (-4,2) {$c$}; \node[above right] at (0.67,5) {$d$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        $x + y = -2$
      antwoord: |-
        $c$
      uitwerking: |-
        Door $(0, -2)$ en $(-2, 0)$: rechte $c$.
    - opgave: |-
        $3x - y = -3$
      antwoord: |-
        $d$
      uitwerking: |-
        Door $(0, 3)$ en $(-1, 0)$: rechte $d$.
    - opgave: |-
        $2x + y = 4$
      antwoord: |-
        $a$
      uitwerking: |-
        Door $(0, 4)$ en $(2, 0)$: rechte $a$.
    - opgave: |-
        $x - 2y = 4$
      antwoord: |-
        $b$
      uitwerking: |-
        Door $(0, -2)$ en $(4, 0)$: rechte $b$.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    snijpunten met de assen
  opgave: |-
    Bereken de snijpunten van de rechte met de assen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $5x + 2y = 10$
      antwoord: |-
        $(0, 5)$ en $(2, 0)$
      uitwerking: |-
        $x = 0$: $2y = 10$. $y = 0$: $5x = 10$.
    - opgave: |-
        $3x - y = 9$
      antwoord: |-
        $(0, -9)$ en $(3, 0)$
      uitwerking: |-
        $x = 0$: $-y = 9$. $y = 0$: $3x = 9$.
    - opgave: |-
        $-4x + 3y = 24$
      antwoord: |-
        $(0, 8)$ en $(-6, 0)$
      uitwerking: |-
        $x = 0$: $3y = 24$. $y = 0$: $-4x = 24$.
    - opgave: |-
        $x + 4y = 6$
      antwoord: |-
        $(0;\ 1{,}5)$ en $(6, 0)$
      uitwerking: |-
        $x = 0$: $4y = 6$, $y = 1{,}5$. $y = 0$: $x = 6$.
    - opgave: |-
        $2x - 5y = -15$
      antwoord: |-
        $(0, 3)$ en $(-7{,}5;\ 0)$
      uitwerking: |-
        $x = 0$: $-5y = -15$. $y = 0$: $2x = -15$.
    - opgave: |-
        $7x + 3y = 0$
      antwoord: |-
        twee keer $(0, 0)$
      uitwerking: |-
        Beide snijpunten zijn de oorsprong. Voor een tweede punt kies je een ander getal, bv. $x = 3$ geeft $(3, -7)$.

- id: h1-o8
  soort: opdracht
  niveau: 1
  thema: |-
    oplossing aflezen in een figuur
  opgave: |-
    De figuur toont de rechten $a$: $x - y = -1$, \ $b$: $x + y = 5$ \ en \ $c$: $x - 2y = 2$. Geef de oplossing van het stelsel, en controleer ze door in te vullen.
  figuur:
    code: |-
      \begin{tikzpicture}[x=0.34cm,y=0.34cm,font=\scriptsize]
        \rooster{-5}{1}{6}{-4}{1}{6}
        \rechteabc{-5}{5}{1}{-1}{-1}
        \rechteabc{-1}{6}{1}{1}{5}
        \rechteabc{-5}{6}{1}{-2}{2}
        \node[left] at (-5,-4) {$a$}; \node[right] at (6,-1) {$b$}; \node[right] at (6,2) {$c$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        het stelsel van $a$ en $b$
      antwoord: |-
        $V = \{(2, 3)\}$
      uitwerking: |-
        Snijpunt $(2, 3)$. Controle: $2 - 3 = -1$ en $2 + 3 = 5$.
    - opgave: |-
        het stelsel van $a$ en $c$
      antwoord: |-
        $V = \{(-4, -3)\}$
      uitwerking: |-
        Snijpunt $(-4, -3)$. Controle: $-4 + 3 = -1$ en $-4 + 6 = 2$.
    - opgave: |-
        het stelsel van $b$ en $c$
      antwoord: |-
        $V = \{(4, 1)\}$
      uitwerking: |-
        Snijpunt $(4, 1)$. Controle: $4 + 1 = 5$ en $4 - 2 = 2$.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    stelsel opstellen bij twee rechten
  opgave: |-
    Bekijk de rechten $p$ en $r$ in de figuur.
  figuur:
    code: |-
      \begin{tikzpicture}[x=0.4cm,y=0.4cm,font=\scriptsize]
        \rooster{-2}{1}{6}{-3}{1}{5}
        \rechteabc{-1.3333}{4}{3}{-2}{2}
        \rechteabc{-2}{6}{1}{2}{6}
        \node[right] at (3.3,4) {$p$}; \node[above] at (5.5,.25) {$r$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking van de rechte $p$.
      antwoord: |-
        $y = \tfrac32 x - 1$
      uitwerking: |-
        $q = -1$; van $(0, -1)$ naar $(2, 2)$: 2 opzij, 3 omhoog. Dus $y = \tfrac32 x - 1$, of $3x - 2y = 2$.
    - opgave: |-
        Geef een vergelijking van de rechte $r$.
      antwoord: |-
        $y = -\tfrac12 x + 3$
      uitwerking: |-
        $q = 3$; van $(0, 3)$ naar $(2, 2)$: 2 opzij, 1 omlaag. Dus $y = -\tfrac12 x + 3$, of $x + 2y = 6$.
    - opgave: |-
        Schrijf het stelsel waarvan het snijpunt de oplossing is, en geef de oplossing. Controleer.
      antwoord: |-
        $V = \{(2, 2)\}$
      uitwerking: |-
        $\stelsel{3x - 2y &= 2}{x + 2y &= 6}$ met snijpunt $(2, 2)$. Controle: $6 - 4 = 2$ en $2 + 4 = 6$.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    balansen, stelsel opstellen
  opgave: |-
    Elk paar balansen is in evenwicht. Een zakje weegt $x$~kg, een bol $y$~kg en een blokje 1~kg. Schrijf bij elk paar een stelsel, los het grafisch op en zeg hoeveel een zakje en een bol wegen.
  lijst: enumerate
  delen:
    - opgave: |-
        \figuren{\begin{tikzpicture}[scale=.36]\balansxy{1}{1}{0}{0}{0}{5}\begin{scope}[xshift=11.5cm]\balansxy{3}{1}{0}{0}{0}{9}\end{scope}\end{tikzpicture}}
      antwoord: |-
        zakje 2~kg, bol 3~kg
      uitwerking: |-
        $\stelsel{x + y &= 5}{3x + y &= 9}$. De rechten gaan door $(0, 5)$ en $(5, 0)$, en door $(0, 9)$ en $(3, 0)$. Snijpunt $(2, 3)$. Controle: $2 + 3 = 5$ en $6 + 3 = 9$.
        \figuren{\begin{tikzpicture}[x=0.28cm,y=0.28cm,font=\scriptsize]
          \rooster{-1}{1}{6}{-1}{1}{9}
          \rechteabc{-1}{6}{1}{1}{5}
          \rechteabc[tweede]{0}{3.3333}{3}{1}{9}
          \punt{2}{3}
        \end{tikzpicture}}
    - opgave: |-
        \figuren{\begin{tikzpicture}[scale=.36]\balansxy{2}{0}{0}{0}{1}{2}\begin{scope}[xshift=11.5cm]\balansxy{1}{1}{0}{0}{0}{7}\end{scope}\end{tikzpicture}}
      antwoord: |-
        zakje 3~kg, bol 4~kg
      uitwerking: |-
        $\stelsel{2x &= y + 2}{x + y &= 7}$, dus $y = 2x - 2$ en $y = -x + 7$. Snijpunt $(3, 4)$. Controle: $6 = 4 + 2$ en $3 + 4 = 7$.
        \figuren{\begin{tikzpicture}[x=0.28cm,y=0.28cm,font=\scriptsize]
          \rooster{-1}{1}{8}{-2}{1}{8}
          \rechteabc{0}{5}{2}{-1}{2}
          \rechteabc[tweede]{-1}{8}{1}{1}{7}
          \punt{3}{4}
        \end{tikzpicture}}

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    strijdig en onbepaald stelsel
  opgave: |-
    Los grafisch op en noteer $V$. Geef bij een onbepaald stelsel ook drie oplossingen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{x - y &= 2}{3x - 3y &= 6}$
      antwoord: |-
        onbepaald, $V = \{(x, y) \mid x - y = 2\}$; bv. $(2, 0)$, $(0, -2)$, $(4, 2)$
      uitwerking: |-
        Twee keer $y = x - 2$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-2}{1}{5}{-3}{1}{3}
          \rechteabc[line width=2.4pt,opacity=.35]{-1}{5}{1}{-1}{2}
          \rechteabc[tweede]{-1}{5}{3}{-3}{6}
          \punt{2}{0}
          \punt{0}{-2}
          \punt{4}{2}
        \end{tikzpicture}}
    - opgave: |-
        $\stelsel{2x + y &= 3}{4x + 2y &= 2}$
      antwoord: |-
        strijdig, $V = \emptyset$
      uitwerking: |-
        $y = -2x + 3$ en $y = -2x + 1$: evenwijdig.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-2}{1}{3}{-3}{1}{5}
          \rechteabc{-1}{3}{2}{1}{3}
          \rechteabc[tweede]{-2}{2}{4}{2}{2}
        \end{tikzpicture}}
    - opgave: |-
        $\stelsel{x + 3y &= 3}{-2x - 6y &= -6}$
      antwoord: |-
        onbepaald, $V = \{(x, y) \mid x + 3y = 3\}$; bv. $(0, 1)$, $(3, 0)$, $(-3, 2)$
      uitwerking: |-
        Twee keer $y = -\tfrac13 x + 1$.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-4}{1}{5}{-2}{1}{3}
          \rechteabc[line width=2.4pt,opacity=.35]{-4}{5}{1}{3}{3}
          \rechteabc[tweede]{-4}{5}{-2}{-6}{-6}
          \punt{0}{1}
          \punt{3}{0}
          \punt{-3}{2}
        \end{tikzpicture}}
    - opgave: |-
        $\stelsel{3x - y &= 0}{6x - 2y &= 5}$
      antwoord: |-
        strijdig, $V = \emptyset$
      uitwerking: |-
        $y = 3x$ en $y = 3x - \tfrac52$: evenwijdig.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-2}{1}{3}{-4}{1}{4}
          \rechteabc{-1.3333}{1.3333}{3}{-1}{0}
          \rechteabc[tweede]{-0.5}{2.1667}{6}{-2}{5}
        \end{tikzpicture}}

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    ontmoeting, grafisch in een context
  opgave: |-
    Lien en Omar wonen 18~km van elkaar, in de dorpen A en B. Om 10 uur vertrekken ze tegelijk naar elkaar toe. Lien wandelt 4~km per uur, Omar 5~km per uur. Noem $t$ de tijd in uur na 10 uur, en $d$ de afstand tot dorp A in km.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf voor elk van beiden $d$ in functie van $t$.
      antwoord: |-
        Lien: $d = 4t$; Omar: $d = 18 - 5t$
      uitwerking: |-
        Lien vertrekt in A: $d = 4t$. Omar vertrekt 18~km van A en komt elk uur 5~km dichter: $d = 18 - 5t$.
    - opgave: |-
        Teken beide grafieken in één assenstelsel, voor $t$ van 0 tot 4.
      antwoord: |-
        zie figuur
      uitwerking: |-
        \figuren{\begin{tikzpicture}[x=.9cm,y=.17cm,font=\scriptsize]
          \roosterleeg[$t$ (h)][$d$ (km)]{0}{1}{4}{0}{2}{18}
          \xgetallen{1,2,3,4}\ygetallen{2,4,...,18}\oorsprong
          \rechte{0}{4}{4}{0}
          \rechte[tweede]{0}{3.6}{-5}{18}
          \aflezen{2}{8}\punt{2}{8}
          \node[accent,right] at (4,15) {Lien}; \node[inkt,right] at (3.3,2.5) {Omar};
        \end{tikzpicture}}
    - opgave: |-
        Lees af wanneer en waar ze elkaar ontmoeten, en controleer met de voorschriften.
      antwoord: |-
        om 12 uur, 8~km van A
      uitwerking: |-
        Het snijpunt is $(2, 8)$. Controle: $4 \cdot 2 = 8$ en $18 - 5 \cdot 2 = 8$. Ze ontmoeten elkaar om 12 uur, 8~km van A (en 10~km van B).

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    aantal oplossingen, coëfficiënt kiezen
  opgave: |-
    Welk getal moet je in het vakje zetten?
  lijst: enumerate
  delen:
    - opgave: |-
        $\stelsel{2x - 3y &= 5}{4x - 6y &= \vak}$ \ is onbepaald.
      antwoord: |-
        $10$
      uitwerking: |-
        De tweede vergelijking moet het dubbel van de eerste zijn: $4x - 6y = 10$.
    - opgave: |-
        $\stelsel{2x - 3y &= 5}{4x - 6y &= \vak}$ \ is strijdig.
      antwoord: |-
        elk getal behalve $10$
      uitwerking: |-
        Dezelfde rico $\tfrac23$; met een ander getal dan 10 is $q$ verschillend.
    - opgave: |-
        $\stelsel{x + 2y &= 4}{3x + \vak\, y &= 1}$ \ is strijdig.
      antwoord: |-
        $6$
      uitwerking: |-
        Met 6 is de rico $-\tfrac12$, zoals bij de eerste; $q$ is dan $\tfrac16$ en niet 2.
    - opgave: |-
        $\stelsel{x + 2y &= 4}{3x + \vak\, y &= 1}$ \ heeft precies één oplossing.
      antwoord: |-
        elk getal behalve $6$
      uitwerking: |-
        Met een ander getal dan 6 verschillen de rico's. (Met 0 is de tweede rechte verticaal, ook dan is er één snijpunt.)

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    grafisch oplossen is een benadering
  opgave: |-
    Los grafisch op. Lees het snijpunt af op één decimaal, en controleer je aflezing door ze in te vullen.
  lijst: enumerate
  delen:
    - opgave: |-
        $\stelsel{y &= x + 1}{3x + 2y &= 6}$
      antwoord: |-
        $(0{,}8;\ 1{,}8)$, de controle klopt
      uitwerking: |-
        Het snijpunt ligt in $(0{,}8;\ 1{,}8)$. Controle: $0{,}8 + 1 = 1{,}8$ en $2{,}4 + 3{,}6 = 6$. Hier klopt de aflezing precies.
        \figuren{\begin{tikzpicture}[x=0.5cm,y=0.5cm,font=\scriptsize]
          \rooster{-1}{1}{3}{-1}{1}{4}
          \rechteabc{-1}{3}{-1}{1}{1}
          \rechteabc[tweede]{-0.6667}{2.6667}{3}{2}{6}
          \punt{0.8}{1.8}
        \end{tikzpicture}}
    - opgave: |-
        $\stelsel{x + y &= 4}{y &= 3x - 1}$
      antwoord: |-
        ongeveer $(1{,}2;\ 2{,}8)$, de controle klopt niet precies
      uitwerking: |-
        Ongeveer $(1{,}2;\ 2{,}8)$ of $(1{,}3;\ 2{,}7)$. Controle met $(1{,}2;\ 2{,}8)$: $1{,}2 + 2{,}8 = 4$, maar $3{,}6 - 1 = 2{,}6$. De exacte oplossing is $(1{,}25;\ 2{,}75)$: die heeft twee decimalen.
        \figuren{\begin{tikzpicture}[x=0.5cm,y=0.5cm,font=\scriptsize]
          \rooster{-1}{1}{4}{-1}{1}{4}
          \rechteabc{0}{4}{1}{1}{4}
          \rechteabc[tweede]{0}{1.6667}{-3}{1}{-1}
          \punt{1.25}{2.75}
        \end{tikzpicture}}
    - opgave: |-
        Waarom kun je bij een grafische oplossing nooit zeker zijn dat ze exact is, tenzij je controleert?
      antwoord: |-
        tekenen is nooit helemaal nauwkeurig
      uitwerking: |-
        Een tekening heeft een beperkte nauwkeurigheid: een snijpunt in $(1{,}25;\ 2{,}75)$ of in $(1{,}26;\ 2{,}74)$ zie je niet verschillen. Alleen door in te vullen weet je of een afgelezen koppel exact klopt.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    stelsel maken met een gegeven aantal oplossingen
  opgave: |-
    Schrijf een tweede vergelijking bij $x + y = 6$, zodat het stelsel
  lijst: enumerate
  delen:
    - opgave: |-
        als enige oplossing $(4, 2)$ heeft;
      antwoord: |-
        bv. $x - y = 2$
      uitwerking: |-
        Elke vergelijking waaraan $(4, 2)$ voldoet en met een andere rico, bv. $x - y = 2$ of $y = \tfrac12 x$. Controle: $4 - 2 = 2$.
    - opgave: |-
        strijdig is;
      antwoord: |-
        bv. $x + y = 1$
      uitwerking: |-
        Dezelfde rico, een andere $q$: bv. $x + y = 1$ of $2x + 2y = 5$.
    - opgave: |-
        onbepaald is.
      antwoord: |-
        bv. $2x + 2y = 12$
      uitwerking: |-
        Een veelvoud van de eerste vergelijking: bv. $2x + 2y = 12$ of $y = -x + 6$.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    hoekpunten van een driehoek
  opgave: |-
    De rechten $a$: $y = x + 1$, \ $b$: $x + 3y = 11$ \ en \ $c$: $x - 3y = -1$ \ vormen een driehoek. Teken de rechten, lees de hoekpunten af en controleer ze.
  antwoord: |-
    $(2, 3)$, $(-1, 0)$ en $(5, 2)$
  uitwerking: |-
    Snijpunt van $a$ en $b$: $(2, 3)$, want $3 = 2 + 1$ en $2 + 9 = 11$. Van $a$ en $c$: $(-1, 0)$, want $0 = -1 + 1$ en $-1 - 0 = -1$. Van $b$ en $c$: $(5, 2)$, want $5 + 6 = 11$ en $5 - 6 = -1$.
    \figuren{\begin{tikzpicture}[x=0.4cm,y=0.4cm,font=\scriptsize]
      \rooster{-2}{1}{7}{-1}{1}{5}
      \rechteabc{-2}{4}{-1}{1}{1}
      \rechteabc{-2}{7}{1}{3}{11}
      \rechteabc{-2}{7}{1}{-3}{-1}
      \punt{2}{3}
      \punt{-1}{0}
      \punt{5}{2}
      \fill[accent,opacity=.15] (2,3) -- (-1,0) -- (5,2) -- cycle;
    \end{tikzpicture}}

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    strijdig en onbepaald in een context
  opgave: |-
    Twee fietsers rijden op dezelfde weg in dezelfde richting, allebei 20~km per uur. Noem $t$ de tijd in uur en $d$ de afstand tot het vertrekpunt van Bo, in km.
  lijst: enumerate
  delen:
    - opgave: |-
        Bo vertrekt in $d = 0$, Ruben op hetzelfde ogenblik 3~km verder. Schrijf voor elk $d$ in functie van $t$, en zeg zonder te tekenen of Bo Ruben inhaalt.
      antwoord: |-
        $d = 20t$ en $d = 20t + 3$; neen
      uitwerking: |-
        Bo: $d = 20t$, Ruben: $d = 20t + 3$. Dezelfde rico: de rechten zijn evenwijdig, het stelsel is strijdig. Bo haalt Ruben nooit in: de afstand tussen hen blijft 3~km.
    - opgave: |-
        Wat betekent het als het stelsel van de twee fietsers onbepaald is?
      antwoord: |-
        ze rijden naast elkaar
      uitwerking: |-
        De rechten vallen samen: op elk ogenblik zijn ze op dezelfde plaats. Ze vertrekken samen en rijden even snel, dus naast elkaar.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    onbekende coëfficiënten
  opgave: |-
    Het koppel $(2, -1)$ is een oplossing van het stelsel $\stelsel{ax + y &= 5}{x + by &= 4}$. Bereken $a$ en $b$.
  antwoord: |-
    $a = 3$, $b = -2$
  uitwerking: |-
    Vul $(2, -1)$ in. Eerste vergelijking: $2a - 1 = 5$, dus $a = 3$. Tweede vergelijking: $2 - b = 4$, dus $b = -2$. Het stelsel is $3x + y = 5$ en $x - 2y = 4$, met als oplossing $(2, -1)$.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    drie rechten door één punt
  opgave: |-
    Gaan de drie rechten door één punt? Los het stelsel van de eerste twee grafisch op, en controleer of het snijpunt op de derde rechte ligt.
  lijst: enumerate
  delen:
    - opgave: |-
        $x + y = 5$, \ $2x - y = 1$ \ en \ $3x + 2y = 12$
      antwoord: |-
        ja, door $(2, 3)$
      uitwerking: |-
        De eerste twee snijden elkaar in $(2, 3)$. Op de derde: $6 + 6 = 12$. Ja.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-1}{1}{5}{-1}{1}{6}
          \rechteabc{-1}{5}{1}{1}{5}
          \rechteabc[tweede]{0}{3.5}{2}{-1}{1}
          \rechteabc[hulplijn]{0}{4.6667}{3}{2}{12}
          \punt{2}{3}
        \end{tikzpicture}}
    - opgave: |-
        $x - y = 1$, \ $x + 2y = 7$ \ en \ $2x + y = 9$
      antwoord: |-
        neen
      uitwerking: |-
        De eerste twee snijden elkaar in $(3, 2)$. Op de derde: $6 + 2 = 8 \neq 9$. Neen: de drie rechten vormen een kleine driehoek.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-1}{1}{6}{-1}{1}{5}
          \rechteabc{0}{6}{1}{-1}{1}
          \rechteabc[tweede]{-1}{6}{1}{2}{7}
          \rechteabc[hulplijn]{2}{5}{2}{1}{9}
          \punt{3}{2}
        \end{tikzpicture}}

- id: h1-o20
  soort: opdracht
  niveau: 2
  thema: |-
    oplossingen met natuurlijke getallen
  opgave: |-
    Een klas koopt voor precies 30 euro balpennen van 3 euro en schriften van 5 euro. Noem $x$ het aantal balpennen en $y$ het aantal schriften.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf een vergelijking.
      antwoord: |-
        $3x + 5y = 30$
      uitwerking: |-
        De balpennen kosten $3x$ euro, de schriften $5y$ euro: $3x + 5y = 30$.
    - opgave: |-
        Zoek alle mogelijkheden.
      antwoord: |-
        $(0, 6)$, $(5, 3)$, $(10, 0)$
      uitwerking: |-
        $x$ en $y$ zijn natuurlijke getallen. Probeer $y = 0, 1, \ldots, 6$: alleen bij $y = 0$, $3$ en $6$ is $30 - 5y$ deelbaar door 3. Dus 10 balpennen, of 5 balpennen en 3 schriften, of 6 schriften.
    - opgave: |-
        Teken de rechte $3x + 5y = 30$. Waar liggen de mogelijkheden uit b?
      antwoord: |-
        op kruispunten van het rooster
      uitwerking: |-
        De mogelijkheden zijn de punten van de rechte met gehele, niet-negatieve coördinaten: de kruispunten van het rooster op de rechte.
        \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
          \rooster{-1}{1}{11}{-1}{1}{7}
          \rechteabc{-1}{11}{3}{5}{30}
          \punt{0}{6}
          \punt{5}{3}
          \punt{10}{0}
        \end{tikzpicture}}

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    redeneren: nooit precies twee oplossingen
  opgave: |-
    Jasper beweert dat zijn stelsel van twee eerstegraadsvergelijkingen precies twee oplossingen heeft: $(1, 2)$ en $(3, 5)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit waarom dat niet kan. Wat weet je wel over zijn stelsel?
      antwoord: |-
        het stelsel is onbepaald
      uitwerking: |-
        Beide rechten gaan door $(1, 2)$ en door $(3, 5)$. Door twee verschillende punten gaat maar één rechte, dus de twee rechten vallen samen. Het stelsel is onbepaald: er zijn oneindig veel oplossingen, niet twee.
    - opgave: |-
        Geef nog een derde oplossing van zijn stelsel.
      antwoord: |-
        bv. $(5, 8)$
      uitwerking: |-
        De rechte door $(1, 2)$ en $(3, 5)$ heeft rico $\tfrac{5 - 2}{3 - 1} = \tfrac32$. Nog een trapje van 2 opzij en 3 omhoog vanaf $(3, 5)$ geeft $(5, 8)$. (Een vergelijking is $3x - 2y = -1$.)

- id: h1-o22
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 3
  thema: |-
    getal kiezen voor een gegeven ligging van de oplossing
  opgave: |-
    Gegeven het stelsel $\stelsel{x + 2y &= c}{3x - y &= 4}$. Kies het getal $c$ zo, dat de oplossing van het stelsel
  lijst: enumerate
  delen:
    - opgave: |-
        op de $y$-as ligt;
      antwoord: |-
        $c = -8$
      uitwerking: |-
        Op de $y$-as is $x = 0$. Uit de tweede vergelijking: $-y = 4$, $y = -4$. Het punt $(0, -4)$ moet op de eerste rechte liggen: $c = 0 - 8 = -8$.
    - opgave: |-
        op de $x$-as ligt;
      antwoord: |-
        $c = \tfrac43$
      uitwerking: |-
        Op de $x$-as is $y = 0$: $3x = 4$, $x = \tfrac43$. Dan is $c = \tfrac43 + 0 = \tfrac43$.
    - opgave: |-
        twee gelijke coördinaten heeft.
      antwoord: |-
        $c = 6$
      uitwerking: |-
        Met $y = x$: $3x - x = 4$, dus $x = 2$ en het punt is $(2, 2)$. Dan is $c = 2 + 4 = 6$.

- id: h1-o23
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    stelsel met een parameter bespreken
  opgave: |-
    Bespreek het aantal oplossingen in functie van de parameter.
  lijst: enumerate
  delen:
    - opgave: |-
        $\stelsel{x + ky &= 4}{2x + 6y &= 8}$
      antwoord: |-
        $k = 3$: onbepaald; $k \neq 3$: één oplossing
      uitwerking: |-
        De tweede rechte: $y = -\tfrac13 x + \tfrac43$. Voor $k \neq 0$ is de eerste $y = -\tfrac1k x + \tfrac4k$. Dezelfde rico als $k = 3$, en dan is ook $q = \tfrac43$: onbepaald. Voor $k = 0$ is de eerste rechte $x = 4$, verticaal: één snijpunt, $(4, 0)$. Dus voor elke $k \neq 3$ precies één oplossing.
    - opgave: |-
        $\stelsel{ax - 2y &= 5}{3x + y &= 1}$
      antwoord: |-
        $a = -6$: strijdig; $a \neq -6$: één oplossing
      uitwerking: |-
        $y = \tfrac{a}{2} x - \tfrac52$ en $y = -3x + 1$. Dezelfde rico als $\tfrac a2 = -3$, dus $a = -6$; dan is $q$ verschillend: strijdig. Anders precies één oplossing.
    - opgave: |-
        $\stelsel{2x + y &= c}{4x + 2y &= 6}$
      antwoord: |-
        $c = 3$: onbepaald; $c \neq 3$: strijdig
      uitwerking: |-
        $y = -2x + c$ en $y = -2x + 3$: altijd dezelfde rico. Voor $c = 3$ vallen de rechten samen (onbepaald), anders zijn ze evenwijdig (strijdig). Precies één oplossing kan hier nooit.

- id: h1-o24
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: evenwijdig als ab' - a'b = 0
  opgave: |-
    Neem twee rechten met vergelijkingen $ax + by = c$ en $a'x + b'y = c'$, met $b \neq 0$ en $b' \neq 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: de twee rechten hebben dezelfde rico als en slechts als $ab' - a'b = 0$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        Maak $y$ vrij: $y = -\tfrac{a}{b} x + \tfrac{c}{b}$ en $y = -\tfrac{a'}{b'} x + \tfrac{c'}{b'}$. Dezelfde rico betekent $\tfrac{a}{b} = \tfrac{a'}{b'}$. Vermenigvuldig beide leden met $bb' \neq 0$: dat is gelijkwaardig met $ab' = a'b$, dus met $ab' - a'b = 0$.
    - opgave: |-
        Wat weet je dus over het aantal oplossingen van het stelsel als $ab' - a'b \neq 0$?
      antwoord: |-
        precies één
      uitwerking: |-
        Dan verschillen de rico's, dus de rechten snijden elkaar: precies één oplossing.
    - opgave: |-
        Controleer met het stelsel $3x - 4y = 8$ en $4x - 3y = 6$.
      antwoord: |-
        $ab' - a'b = 7 \neq 0$: één oplossing
      uitwerking: |-
        $a = 3$, $b = -4$, $a' = 4$, $b' = -3$: $ab' - a'b = 3 \cdot (-3) - 4 \cdot (-4) = -9 + 16 = 7 \neq 0$. Precies één oplossing, zoals de rico's $\tfrac34$ en $\tfrac43$ al toonden.

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Welke van de koppels $(3, -2)$ en $(5, 0)$ is een oplossing van het stelsel $\stelsel{2x + 3y &= 0}{x - y &= 5}$?
  antwoord: |-
    $(3, -2)$
  uitwerking: |-
    $(3, -2)$: $6 - 6 = 0$ en $3 + 2 = 5$, een oplossing. $(5, 0)$: $10 \neq 0$, geen oplossing, ook al klopt $5 - 0 = 5$.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Teken de rechte met vergelijking $3x + 2y = 6$.
  antwoord: |-
    door $(0, 3)$ en $(2, 0)$
  uitwerking: |-
    Met $x = 0$: $y = 3$. Met $y = 0$: $x = 2$. Controle: $(4, -3)$ ligt erop, want $12 - 6 = 6$.
    \figuren{\begin{tikzpicture}[x=0.32cm,y=0.32cm,font=\scriptsize]
      \rooster{-2}{1}{5}{-4}{1}{4}
      \rechteabc{-0.6667}{4.6667}{3}{2}{6}
      \punt{0}{3}
      \punt{2}{0}
      \punt{4}{-3}
    \end{tikzpicture}}

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Los grafisch op en controleer: $\stelsel{x + 2y &= 5}{3x - y &= 1}$
  antwoord: |-
    $V = \{(1, 2)\}$
  uitwerking: |-
    De eerste rechte gaat door $(5, 0)$ en $(1, 2)$, de tweede door $(0, -1)$ en $(1, 2)$. Controle: $1 + 4 = 5$ en $3 - 2 = 1$.
    \figuren{\begin{tikzpicture}[x=0.32cm,y=0.32cm,font=\scriptsize]
      \rooster{-2}{1}{6}{-2}{1}{4}
      \rechteabc{-2}{6}{1}{2}{5}
      \rechteabc[tweede]{-0.3333}{1.6667}{3}{-1}{1}
      \punt{1}{2}
    \end{tikzpicture}}

- id: h1-t4
  soort: test
  niveau: 1
  opgave: |-
    Hoeveel oplossingen heeft het stelsel? Teken niet.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\stelsel{y &= 4x - 2}{y &= -4x - 2}$
      antwoord: |-
        één
      uitwerking: |-
        De rico's 4 en $-4$ verschillen.
    - opgave: |-
        $\stelsel{2x - y &= 3}{-6x + 3y &= -9}$
      antwoord: |-
        oneindig veel
      uitwerking: |-
        Twee keer $y = 2x - 3$: onbepaald.
    - opgave: |-
        $\stelsel{x + 5y &= 2}{2x + 10y &= 3}$
      antwoord: |-
        geen
      uitwerking: |-
        $y = -\tfrac15 x + \tfrac25$ en $y = -\tfrac15 x + \tfrac{3}{10}$: strijdig.

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    Los grafisch op en noteer $V$: $\stelsel{x - 2y &= -2}{-x + 2y &= 4}$
  antwoord: |-
    $V = \emptyset$
  uitwerking: |-
    $y = \tfrac12 x + 1$ en $y = \tfrac12 x + 2$: dezelfde rico, een andere $q$. De rechten zijn evenwijdig, het stelsel is strijdig.
    \figuren{\begin{tikzpicture}[x=0.32cm,y=0.32cm,font=\scriptsize]
      \rooster{-4}{1}{4}{-2}{1}{4}
      \rechteabc{-4}{4}{1}{-2}{-2}
      \rechteabc[tweede]{-4}{4}{-1}{2}{4}
    \end{tikzpicture}}

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Toon aan dat het stelsel $\stelsel{3x + y &= 2}{6x + 2y &= 4}$ onbepaald is. Noteer $V$ en geef drie oplossingen.
  antwoord: |-
    $V = \{(x, y) \mid 3x + y = 2\}$; bv. $(0, 2)$, $(1, -1)$, $(2, -4)$
  uitwerking: |-
    Uit beide vergelijkingen volgt $y = -3x + 2$: dezelfde rechte. Oplossingen zijn bijvoorbeeld $(0, 2)$, $(1, -1)$ en $(2, -4)$.

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Beide balansen zijn in evenwicht. Een zakje weegt $x$~kg, een bol $y$~kg en een blokje 1~kg. Schrijf een stelsel en los het grafisch op. Hoeveel weegt een zakje, en hoeveel een bol?

    \figuren{\begin{tikzpicture}[scale=.36]\balansxy{1}{2}{0}{0}{0}{8}\begin{scope}[xshift=11.5cm]\balansxy{2}{0}{0}{0}{1}{1}\end{scope}\end{tikzpicture}}
  antwoord: |-
    zakje 2~kg, bol 3~kg
  uitwerking: |-
    $\stelsel{x + 2y &= 8}{2x &= y + 1}$, dus $y = -\tfrac12 x + 4$ en $y = 2x - 1$. Snijpunt $(2, 3)$. Controle: $2 + 6 = 8$ en $4 = 3 + 1$.
    \figuren{\begin{tikzpicture}[x=0.3cm,y=0.3cm,font=\scriptsize]
      \rooster{-1}{1}{8}{-2}{1}{5}
      \rechteabc{-1}{8}{1}{2}{8}
      \rechteabc[tweede]{-0.5}{3}{2}{-1}{1}
      \punt{2}{3}
    \end{tikzpicture}}

- id: h1-t8
  pakketten: [5]
  soort: test
  niveau: 2
  opgave: |-
    Bespreek het aantal oplossingen in functie van $k$: $\stelsel{kx + 2y &= 6}{3x + y &= 2}$
  antwoord: |-
    $k = 6$: strijdig; $k \neq 6$: één oplossing
  uitwerking: |-
    $y = -\tfrac{k}{2} x + 3$ en $y = -3x + 2$. Dezelfde rico als $\tfrac k2 = 3$, dus $k = 6$; dan is $q$ verschillend (3 en 2): strijdig. Voor $k \neq 6$ precies één oplossing.
