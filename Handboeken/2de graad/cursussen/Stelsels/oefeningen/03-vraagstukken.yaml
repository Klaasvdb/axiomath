# Oefeningen van hoofdstuk 3 (Vraagstukken). Zie Opmaak/oefeningenbank.py voor de velden.
# Alle uitkomsten zijn nagerekend met SymPy.

# --- Start ------------------------------------------------------------------------------

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Schrijf in wiskundetaal, met de getallen $x$ en $y$.
  lijst: enumerate
  delen:
    - opgave: |-
        De som van $x$ en $y$ is 20.
      antwoord: |-
        $x + y = 20$
      uitwerking: |-
        $x + y = 20$.
    - opgave: |-
        $x$ is 4 meer dan $y$.
      antwoord: |-
        $x = y + 4$
      uitwerking: |-
        $x = y + 4$, of ook $x - y = 4$.
    - opgave: |-
        Drie schriften van $x$ euro en twee pennen van $y$ euro kosten samen 11 euro.
      antwoord: |-
        $3x + 2y = 11$
      uitwerking: |-
        De schriften kosten $3x$ euro, de pennen $2y$ euro: $3x + 2y = 11$.
    - opgave: |-
        Het dubbel van $x$ is 5 minder dan $y$.
      antwoord: |-
        $2x = y - 5$
      uitwerking: |-
        $2x = y - 5$. Let op: niet $2x - 5 = y$.
    - opgave: |-
        Los op: $\stelsel{x + y &= 10}{x - y &= 4}$
      antwoord: |-
        $V = \{(7, 3)\}$
      uitwerking: |-
        Tel op: $2x = 14$, dus $x = 7$ en $y = 3$.
    - opgave: |-
        Los op: $\stelsel{y &= 2x}{x + y &= 12}$
      antwoord: |-
        $V = \{(4, 8)\}$
      uitwerking: |-
        Substitueer: $x + 2x = 12$, dus $x = 4$ en $y = 8$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Op een schoolfeest kost een ticket 6 euro voor een leerling en 9 euro voor een volwassene. Er werden 120 tickets verkocht, en de kassa telde 870 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel dat er 60 leerlingen een ticket kochten. Hoeveel volwassenen waren er dan, en hoeveel geld zou er in de kassa zitten?
      antwoord: |-
        60 volwassenen, 900 euro
      uitwerking: |-
        $120 - 60 = 60$ volwassenen, en $60 \cdot 6 + 60 \cdot 9 = 360 + 540 = 900$ euro. Dat is te veel.
    - opgave: |-
        Probeer met 80 leerlingen. Waren er meer of minder leerlingen dan 80?
      antwoord: |-
        840 euro; minder dan 80
      uitwerking: |-
        $80 \cdot 6 + 40 \cdot 9 = 480 + 360 = 840$ euro. Dat is te weinig: met minder leerlingen en meer volwassenen komt er meer geld binnen. Er waren dus minder dan 80 leerlingen.
    - opgave: |-
        Zoek door te proberen hoeveel leerlingen en hoeveel volwassenen er waren.
      antwoord: |-
        70 leerlingen, 50 volwassenen
      uitwerking: |-
        $70 \cdot 6 + 50 \cdot 9 = 420 + 450 = 870$ euro.
    - opgave: |-
        Noem het aantal leerlingen $x$ en het aantal volwassenen $y$. Schrijf twee vergelijkingen die de tekst uitdrukken.
      antwoord: |-
        $x + y = 120$ en $6x + 9y = 870$
      uitwerking: |-
        Samen 120 tickets: $x + y = 120$. De opbrengst: $6x + 9y = 870$.

# --- Korte oefeningen -------------------------------------------------------------------

- id: h3-opstellen
  soort: kort
  opgave: |-
    Kies twee onbekenden en zeg wat ze betekenen. Stel een stelsel op dat bij de tekst past. Je hoeft het niet op te lossen.
  lijst: enumerate
  delen:
    - opgave: |-
        Op een parking staan 85 auto's en motoren, samen met 280 wielen.
      antwoord: |-
        $x + y = 85$ en $4x + 2y = 280$
      uitwerking: |-
        $x$ = het aantal auto's, $y$ = het aantal motoren. $x + y = 85$ en $4x + 2y = 280$. (Oplossing: 55 auto's en 30 motoren.)
    - opgave: |-
        Een concertzaal verkocht 400 tickets: staanplaatsen van 25 euro en zitplaatsen van 40 euro. Samen brachten ze 11\,500 euro op.
      antwoord: |-
        $x + y = 400$ en $25x + 40y = 11\,500$
      uitwerking: |-
        $x$ = het aantal staanplaatsen, $y$ = het aantal zitplaatsen. $x + y = 400$ en $25x + 40y = 11\,500$. (Oplossing: 300 staanplaatsen en 100 zitplaatsen.)
    - opgave: |-
        Een broek kost 15 euro meer dan een T-shirt. Twee T-shirts kosten evenveel als een broek.
      antwoord: |-
        $x = y + 15$ en $2y = x$
      uitwerking: |-
        $x$ = de prijs van een broek, $y$ = die van een T-shirt (in euro). $x = y + 15$ en $2y = x$. (Oplossing: de broek kost 30 euro, het T-shirt 15 euro.)

- id: h3-getallen
  soort: kort
  opgave: |-
    Stel een stelsel op en los het op.
  lijst: enumerate
  delen:
    - opgave: |-
        De som van twee getallen is 31, en hun verschil is 7. Welke getallen zijn het?
      antwoord: |-
        19 en 12
      uitwerking: |-
        $x + y = 31$ en $x - y = 7$. Tel op: $2x = 38$, dus $x = 19$ en $y = 12$. Controle: $19 - 12 = 7$.
    - opgave: |-
        Een getal is 5 meer dan het dubbel van een ander getal. Samen zijn ze 38. Welke getallen zijn het?
      antwoord: |-
        27 en 11
      uitwerking: |-
        $x = 2y + 5$ en $x + y = 38$. Substitueer: $3y + 5 = 38$, dus $y = 11$ en $x = 27$. Controle: $2 \cdot 11 + 5 = 27$ en $27 + 11 = 38$.

- id: h3-prijzen
  soort: kort
  opgave: |-
    Stel een stelsel op en los het op.
  lijst: enumerate
  delen:
    - opgave: |-
        Vier schriften en drie balpennen kosten 9,60 euro. Twee schriften en vijf balpennen kosten 7,60 euro. Wat kost een schrift, en wat kost een balpen?
      antwoord: |-
        schrift 1,80 euro, balpen 0,80 euro
      uitwerking: |-
        $4x + 3y = 9{,}60$ en $2x + 5y = 7{,}60$. Vermenigvuldig de tweede met 2: $4x + 10y = 15{,}20$. Trek de eerste ervan af: $7y = 5{,}60$, dus $y = 0{,}80$. Dan $4x = 9{,}60 - 2{,}40 = 7{,}20$ en $x = 1{,}80$. Controle: $3{,}60 + 4 = 7{,}60$.
    - opgave: |-
        Een bioscoop vraagt 11 euro voor een volwassene en 7 euro voor een kind. Voor een voorstelling werden 85 tickets verkocht, voor 795 euro. Hoeveel kinderen zaten er in de zaal?
      antwoord: |-
        35 kinderen
      uitwerking: |-
        $x$ volwassenen en $y$ kinderen: $x + y = 85$ en $11x + 7y = 795$. Met $x = 85 - y$: $935 - 4y = 795$, dus $y = 35$ en $x = 50$. Controle: $550 + 245 = 795$.

- id: h3-mengsel
  soort: kort
  opgave: |-
    Een snoepwinkel mengt winegums van 12 euro per kg met dropjes van 16 euro per kg. Ze wil 10~kg mengsel dat 13,60 euro per kg kost. Hoeveel kg van elke soort heeft ze nodig?
  antwoord: |-
    6~kg winegums en 4~kg dropjes
  uitwerking: |-
    $x$~kg winegums en $y$~kg dropjes. $x + y = 10$ en $12x + 16y = 136$, want $10 \cdot 13{,}60 = 136$. Met $x = 10 - y$: $120 + 4y = 136$, dus $y = 4$ en $x = 6$. Controle: $72 + 64 = 136$. Er is meer van de goedkope soort, want 13,60 ligt dichter bij 12 dan bij 16.

- id: h3-procent
  soort: kort
  opgave: |-
    Een fruitsap bevat 20\,\% fruit, een ander 50\,\% fruit. Hoeveel liter van elk meng je voor 6 liter sap met 30\,\% fruit?
  antwoord: |-
    4 liter met 20\,\% en 2 liter met 50\,\%
  uitwerking: |-
    $x + y = 6$ en $0{,}2x + 0{,}5y = 1{,}8$, want 30\,\% van 6 liter is $1{,}8$ liter fruit. Maal 10: $2x + 5y = 18$. Met $x = 6 - y$: $12 + 3y = 18$, dus $y = 2$ en $x = 4$. Controle: $0{,}8 + 1 = 1{,}8$.

- id: h3-beweging
  soort: kort
  opgave: |-
    Stel een stelsel op en los het op.
  lijst: enumerate
  delen:
    - opgave: |-
        Een motorboot vaart 36~km stroomopwaarts in 3 uur, en dezelfde 36~km terug in 2 uur. Hoe snel vaart de boot in stilstaand water, en hoe snel stroomt de rivier?
      antwoord: |-
        boot 15~km/h, stroom 3~km/h
      uitwerking: |-
        $3(v - w) = 36$ en $2(v + w) = 36$, dus $v - w = 12$ en $v + w = 18$. Tel op: $2v = 30$, $v = 15$ en $w = 3$.
    - opgave: |-
        Twee wandelaars staan 21~km van elkaar. Ze vertrekken tegelijk en wandelen naar elkaar toe. Na 3 uur ontmoeten ze elkaar. De ene wandelt 1~km/h sneller dan de andere. Hoe snel wandelt elk?
      antwoord: |-
        4~km/h en 3~km/h
      uitwerking: |-
        $3x + 3y = 21$ en $x = y + 1$. Dus $x + y = 7$, en $2y + 1 = 7$ geeft $y = 3$ en $x = 4$. Controle: $12 + 9 = 21$~km.

- id: h3-meetkunde
  soort: kort
  opgave: |-
    Stel een stelsel op en los het op.
  lijst: enumerate
  delen:
    - opgave: |-
        In een gelijkbenige driehoek is de tophoek $30^\circ$ groter dan elke basishoek. Hoe groot zijn de hoeken?
      antwoord: |-
        basishoeken $50^\circ$, tophoek $80^\circ$
      uitwerking: |-
        $x$ = een basishoek, $y$ = de tophoek. $2x + y = 180$ en $y = x + 30$. Substitueer: $3x + 30 = 180$, $x = 50$ en $y = 80$. Controle: $50 + 50 + 80 = 180$.
    - opgave: |-
        Een rechthoek heeft een omtrek van 30~cm. De lengte is het dubbel van de breedte. Hoe lang en hoe breed is de rechthoek?
      antwoord: |-
        10~cm lang, 5~cm breed
      uitwerking: |-
        $2(x + y) = 30$ en $x = 2y$. Dus $x + y = 15$, $3y = 15$, $y = 5$ en $x = 10$.

- id: h3-tarief
  soort: kort
  opgave: |-
    Taxi A rekent 4 euro instap en 1,80 euro per km. Taxi B rekent 2,50 euro instap en 2,10 euro per km.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf voor elke taxi de prijs $y$ (in euro) voor een rit van $x$~km.
      antwoord: |-
        A: $y = 1{,}8x + 4$; B: $y = 2{,}1x + 2{,}5$
      uitwerking: |-
        A: $y = 1{,}8x + 4$. B: $y = 2{,}1x + 2{,}5$.
    - opgave: |-
        Bij welke afstand betaal je bij beide evenveel? Hoeveel?
      antwoord: |-
        5~km, 13 euro
      uitwerking: |-
        $1{,}8x + 4 = 2{,}1x + 2{,}5$ geeft $1{,}5 = 0{,}3x$, dus $x = 5$ en $y = 13$.
    - opgave: |-
        Welke taxi neem je voor een rit van 8~km? En wanneer is de andere goedkoper?
      antwoord: |-
        taxi A; B is goedkoper voor minder dan 5~km
      uitwerking: |-
        Voor 8~km betaal je bij A $4 + 14{,}40 = 18{,}40$ euro en bij B $2{,}50 + 16{,}80 = 19{,}30$ euro: neem A. Na het snijpunt is A goedkoper, want A heeft de kleinste prijs per km. Voor ritten korter dan 5~km is B goedkoper.

# --- Opdrachten, niveau 1 ---------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    getallen
  opgave: |-
    Stel een stelsel op en zoek de twee getallen.
  lijst: enumerate
  delen:
    - opgave: |-
        De som van twee getallen is 54, en hun verschil is 12.
      antwoord: |-
        33 en 21
      uitwerking: |-
        $x + y = 54$ en $x - y = 12$. Tel op: $2x = 66$, $x = 33$ en $y = 21$.
    - opgave: |-
        Een getal is het drievoud van een ander getal. Samen zijn ze 68.
      antwoord: |-
        51 en 17
      uitwerking: |-
        $x = 3y$ en $x + y = 68$. Substitueer: $4y = 68$, $y = 17$ en $x = 51$.
    - opgave: |-
        Het verschil van twee getallen is 9. Het dubbel van het kleinste getal is 5 meer dan het grootste.
      antwoord: |-
        23 en 14
      uitwerking: |-
        $x - y = 9$ en $2y = x + 5$. Met $x = y + 9$: $2y = y + 14$, dus $y = 14$ en $x = 23$. Controle: $28 = 23 + 5$.
    - opgave: |-
        De som van twee getallen is 10. Het eerste getal plus het dubbel van het tweede is 3.
      antwoord: |-
        17 en $-7$
      uitwerking: |-
        $x + y = 10$ en $x + 2y = 3$. Trek de eerste af van de tweede: $y = -7$, en $x = 17$. Controle: $17 - 14 = 3$.
    - opgave: |-
        Het verschil van twee getallen is 4. Het drievoud van het grootste is gelijk aan het viervoud van het kleinste.
      antwoord: |-
        16 en 12
      uitwerking: |-
        $x - y = 4$ en $3x = 4y$. Met $x = y + 4$: $3y + 12 = 4y$, dus $y = 12$ en $x = 16$. Controle: $48 = 48$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    prijzen en aantallen
  opgave: |-
    In een frituur kosten 2 grote porties friet en 3 potjes saus samen 10,20 euro. Een grote portie friet en 2 potjes saus kosten samen 5,60 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat kost een grote portie friet, en wat kost een potje saus?
      antwoord: |-
        friet 3,60 euro, saus 1 euro
      uitwerking: |-
        $2x + 3y = 10{,}20$ en $x + 2y = 5{,}60$. Vermenigvuldig de tweede met 2: $2x + 4y = 11{,}20$. Trek de eerste ervan af: $y = 1$. Dan $x = 5{,}60 - 2 = 3{,}60$.
    - opgave: |-
        Hoeveel betaal je voor 3 grote porties friet en 3 potjes saus?
      antwoord: |-
        13,80 euro
      uitwerking: |-
        $3 \cdot 3{,}60 + 3 \cdot 1 = 10{,}80 + 3 = 13{,}80$ euro.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    vraagstuk en stelsel koppelen
  opgave: |-
    Bij elke tekst hoort een van de stelsels A, B en C. Zeg wat $x$ en $y$ betekenen, kies het juiste stelsel en los het op.

    \figuren{A: $\stelsel{x + y &= 24}{x - y &= 4}$ \qquad B: $\stelsel{x + y &= 24}{x + 2y &= 40}$ \qquad C: $\stelsel{2x + 2y &= 24}{x - y &= 4}$}
  lijst: enumerate
  delen:
    - opgave: |-
        In een klas van 24 leerlingen zijn er 4 meisjes meer dan jongens.
      antwoord: |-
        A; 14 meisjes en 10 jongens
      uitwerking: |-
        $x$ = het aantal meisjes, $y$ = het aantal jongens: stelsel A. Tel op: $2x = 28$, $x = 14$ en $y = 10$.
    - opgave: |-
        In een spaarpot zitten 24 munten van 1 euro en van 2 euro, samen 40 euro.
      antwoord: |-
        B; 8 munten van 1 euro en 16 van 2 euro
      uitwerking: |-
        $x$ = het aantal munten van 1 euro, $y$ = het aantal van 2 euro: stelsel B. Trek de eerste vergelijking af van de tweede: $y = 16$, en $x = 8$. Controle: $8 + 32 = 40$.
    - opgave: |-
        Een rechthoek met een omtrek van 24~cm is 4~cm langer dan breed.
      antwoord: |-
        C; 8~cm lang en 4~cm breed
      uitwerking: |-
        $x$ = de lengte, $y$ = de breedte (in cm): stelsel C. Deel de eerste door 2: $x + y = 12$. Tel op: $2x = 16$, $x = 8$ en $y = 4$.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    mengsel
  opgave: |-
    Een winkel mengt cashewnoten van 18 euro per kg met pinda's van 6 euro per kg.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel kg van elke soort is er nodig voor 5~kg mengsel van 10,80 euro per kg?
      antwoord: |-
        2~kg cashewnoten en 3~kg pinda's
      uitwerking: |-
        $x + y = 5$ en $18x + 6y = 54$, want $5 \cdot 10{,}80 = 54$. Met $y = 5 - x$: $12x + 30 = 54$, dus $x = 2$ en $y = 3$.
    - opgave: |-
        Een bediende vergist zich en mengt 3~kg cashewnoten met 2~kg pinda's. Wat kost een kg van dat mengsel?
      antwoord: |-
        13,20 euro
      uitwerking: |-
        $3 \cdot 18 + 2 \cdot 6 = 66$ euro voor 5~kg, dus $66 : 5 = 13{,}20$ euro per kg.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    twee tarieven
  opgave: |-
    Drukkerij A rekent 40 euro om de machine klaar te zetten, en daarna 0,50 euro per affiche. Drukkerij B rekent alleen 1,30 euro per affiche.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf voor elke drukkerij de prijs $y$ (in euro) voor $x$ affiches.
      antwoord: |-
        A: $y = 0{,}5x + 40$; B: $y = 1{,}3x$
      uitwerking: |-
        A: $y = 0{,}5x + 40$. B: $y = 1{,}3x$.
    - opgave: |-
        Voor hoeveel affiches betaal je bij beide evenveel?
      antwoord: |-
        50 affiches (65 euro)
      uitwerking: |-
        $0{,}5x + 40 = 1{,}3x$ geeft $40 = 0{,}8x$, dus $x = 50$ en $y = 65$.
    - opgave: |-
        Een jeugdhuis wil 80 affiches. Welke drukkerij is het goedkoopst, en hoeveel bespaart het jeugdhuis?
      antwoord: |-
        A, 24 euro goedkoper
      uitwerking: |-
        A: $40 + 40 = 80$ euro. B: $1{,}3 \cdot 80 = 104$ euro. A is 24 euro goedkoper. Dat klopt: na 50 affiches is A goedkoper.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    meetkunde: omtrek en hoeken
  opgave: |-
    Stel een stelsel op en los het op.
  lijst: enumerate
  delen:
    - opgave: |-
        Een rechthoek heeft een omtrek van 46~cm. Hij is 5~cm langer dan breed. Hoe lang en hoe breed is hij?
      antwoord: |-
        14~cm lang, 9~cm breed
      uitwerking: |-
        $2(x + y) = 46$ en $x = y + 5$. Dus $x + y = 23$, $2y + 5 = 23$, $y = 9$ en $x = 14$.
    - opgave: |-
        In een gelijkbenige driehoek is elke basishoek $18^\circ$ groter dan de tophoek. Hoe groot zijn de hoeken?
      antwoord: |-
        basishoeken $66^\circ$, tophoek $48^\circ$
      uitwerking: |-
        $x$ = een basishoek, $y$ = de tophoek. $2x + y = 180$ en $x = y + 18$. Substitueer: $2y + 36 + y = 180$, $y = 48$ en $x = 66$. Controle: $66 + 66 + 48 = 180$.
    - opgave: |-
        Twee hoeken zijn samen $90^\circ$ en verschillen $24^\circ$. Hoe groot zijn ze?
      antwoord: |-
        $57^\circ$ en $33^\circ$
      uitwerking: |-
        $x + y = 90$ en $x - y = 24$. Tel op: $2x = 114$, $x = 57$ en $y = 33$.
    - opgave: |-
        Een rechthoek is drie keer zo lang als breed. Maak je de lengte 4~cm korter en de breedte 4~cm langer, dan krijg je een vierkant. Hoe lang en hoe breed is de rechthoek?
      antwoord: |-
        12~cm lang, 4~cm breed
      uitwerking: |-
        $x = 3y$ en $x - 4 = y + 4$. Substitueer: $3y - 4 = y + 4$, $2y = 8$, $y = 4$ en $x = 12$. Het vierkant heeft zijde 8~cm.

- id: h3-o7
  soort: opdracht
  niveau: 1
  thema: |-
    beweging: met en tegen de wind
  opgave: |-
    Een vliegtuig vliegt 1800~km met de wind mee in 2 uur. Terug, tegen de wind in, doet het er $2{,}5$ uur over.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe snel vliegt het vliegtuig bij windstil weer, en hoe hard waait de wind?
      antwoord: |-
        810~km/h, wind 90~km/h
      uitwerking: |-
        $2(v + w) = 1800$ en $2{,}5(v - w) = 1800$, dus $v + w = 900$ en $v - w = 720$. Tel op: $2v = 1620$, $v = 810$ en $w = 90$.
    - opgave: |-
        Hoe lang zou dezelfde vlucht duren bij windstil weer? Rond af op een minuut.
      antwoord: |-
        ongeveer 2 uur en 13 minuten
      uitwerking: |-
        $1800 : 810 \approx 2{,}222$ uur, en $0{,}222 \cdot 60 \approx 13$ minuten.

- id: h3-o8
  soort: opdracht
  niveau: 1
  thema: |-
    prijzen en aantallen
  opgave: |-
    Een museum vraagt 12 euro voor een volwassene en 5 euro voor een kind. Op een zondag kwamen er 240 bezoekers, en de kassa telde 2250 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel volwassenen en hoeveel kinderen bezochten het museum?
      antwoord: |-
        150 volwassenen, 90 kinderen
      uitwerking: |-
        $x + y = 240$ en $12x + 5y = 2250$. Met $y = 240 - x$: $7x + 1200 = 2250$, dus $x = 150$ en $y = 90$.
    - opgave: |-
        Welk percentage van de opbrengst kwam van de kinderen?
      antwoord: |-
        20\,\%
      uitwerking: |-
        De kinderen betaalden $90 \cdot 5 = 450$ euro, en $\tfrac{450}{2250} = 0{,}2$, dus 20\,\%.

- id: h3-o9
  soort: opdracht
  niveau: 1
  thema: |-
    aantallen
  opgave: |-
    Stel een stelsel op en los het op.
  lijst: enumerate
  delen:
    - opgave: |-
        Een quiz heeft 20 vragen. Een juist antwoord levert 3 punten op, een fout antwoord kost 1 punt. Lars beantwoordde alle vragen en haalde 36 punten. Hoeveel vragen had hij juist?
      antwoord: |-
        14
      uitwerking: |-
        $x$ juist en $y$ fout: $x + y = 20$ en $3x - y = 36$. Tel op: $4x = 56$, $x = 14$ en $y = 6$. Controle: $42 - 6 = 36$.
    - opgave: |-
        Een hotel heeft 45 kamers: eenpersoonskamers en tweepersoonskamers. Als alle kamers vol zijn, logeren er 78 gasten. Hoeveel tweepersoonskamers zijn er?
      antwoord: |-
        33
      uitwerking: |-
        $x + y = 45$ en $x + 2y = 78$. Trek de eerste af van de tweede: $y = 33$, en $x = 12$.

# --- Opdrachten, niveau 2 ---------------------------------------------------------------

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    leeftijden
  opgave: |-
    Stel een stelsel op en los het op.
  lijst: enumerate
  delen:
    - opgave: |-
        Een vader is nu drie keer zo oud als zijn zoon. Binnen 12 jaar is hij nog maar twee keer zo oud. Hoe oud zijn ze nu?
      antwoord: |-
        vader 36, zoon 12
      uitwerking: |-
        $x$ = de leeftijd van de vader, $y$ = die van de zoon. $x = 3y$ en $x + 12 = 2(y + 12)$. Substitueer: $3y + 12 = 2y + 24$, $y = 12$ en $x = 36$. Controle: binnen 12 jaar 48 en 24.
    - opgave: |-
        Lina is 4 jaar ouder dan haar broer. Vijf jaar geleden was ze dubbel zo oud als hij. Hoe oud zijn ze nu?
      antwoord: |-
        Lina 13, haar broer 9
      uitwerking: |-
        $x = y + 4$ en $x - 5 = 2(y - 5)$. Substitueer: $y - 1 = 2y - 10$, $y = 9$ en $x = 13$. Controle: vijf jaar geleden 8 en 4.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    procenten
  prent:
    naam: fiets
  opgave: |-
    Vorig jaar kostten een fiets en een helm samen 600 euro. Dit jaar is de fiets 10\,\% duurder en de helm 20\,\% goedkoper. Samen kosten ze nu 630 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat kostten de fiets en de helm vorig jaar?
      antwoord: |-
        fiets 500 euro, helm 100 euro
      uitwerking: |-
        $x + y = 600$ en $1{,}1x + 0{,}8y = 630$. Met $y = 600 - x$: $1{,}1x + 480 - 0{,}8x = 630$, dus $0{,}3x = 150$, $x = 500$ en $y = 100$.
    - opgave: |-
        Wat kosten ze dit jaar elk?
      antwoord: |-
        fiets 550 euro, helm 80 euro
      uitwerking: |-
        $1{,}1 \cdot 500 = 550$ en $0{,}8 \cdot 100 = 80$. Controle: $550 + 80 = 630$.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    beweging: naar elkaar toe
  opgave: |-
    Twee dorpen liggen 45~km van elkaar. Een fietser en een wandelaar vertrekken tegelijk, elk in een ander dorp, en gaan naar elkaar toe. Na 2 uur en 30 minuten ontmoeten ze elkaar. De fietser rijdt drie keer zo snel als de wandelaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe snel gaat elk?
      antwoord: |-
        wandelaar 4,5~km/h, fietser 13,5~km/h
      uitwerking: |-
        2 uur en 30 minuten is $2{,}5$ uur. $2{,}5x + 2{,}5y = 45$ en $x = 3y$, met $x$ de snelheid van de fietser. Dus $x + y = 18$, $4y = 18$, $y = 4{,}5$ en $x = 13{,}5$.
    - opgave: |-
        Hoe ver van het dorp van de wandelaar ontmoeten ze elkaar?
      antwoord: |-
        11,25~km
      uitwerking: |-
        De wandelaar legt $4{,}5 \cdot 2{,}5 = 11{,}25$~km af. (De fietser $33{,}75$~km, samen 45~km.)

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    twee tarieven, grafiek aflezen
  opgave: |-
    Een fitnesscentrum heeft twee formules per maand. Bij formule A betaal je een vast bedrag, zo vaak je wilt. Bij formule B betaal je een kleiner vast bedrag en een prijs per bezoek. De grafiek toont de maandprijs $y$ (in euro) voor $x$ bezoeken.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.07cm,font=\scriptsize]
        \roosterleeg[$x$][$y$]{0}{1}{10}{0}{5}{50}
        \xgetallen{2,4,6,8,10}\ygetallen{10,20,30,40,50}\oorsprong
        \rechte{0}{10}{0}{30}
        \rechte[tweede]{0}{10}{3}{12}
        \node[accent,above] at (1.2,30) {A};
        \node[inkt,right] at (10,42) {B};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Lees het snijpunt af. Wat betekent het?
      antwoord: |-
        $(6, 30)$: bij 6 bezoeken kosten beide 30 euro
      uitwerking: |-
        De rechten snijden elkaar in $(6, 30)$: wie 6 keer per maand komt, betaalt bij beide formules 30 euro.
    - opgave: |-
        Lees af wat formule B kost bij 4 bezoeken. Welke formule kies je dan?
      antwoord: |-
        24 euro; formule B
      uitwerking: |-
        Bij 4 bezoeken kost B 24 euro, minder dan de 30 euro van A.
    - opgave: |-
        Vanaf hoeveel bezoeken per maand is formule A voordeliger?
      antwoord: |-
        meer dan 6 bezoeken
      uitwerking: |-
        Rechts van het snijpunt ligt de rechte van A onder die van B: bij meer dan 6 bezoeken is A voordeliger.
    - opgave: |-
        Schrijf het voorschrift van beide rechten, en controleer het snijpunt met een berekening.
      antwoord: |-
        A: $y = 30$; B: $y = 3x + 12$
      uitwerking: |-
        A: $y = 30$. B gaat door $(0, 12)$ en stijgt 3 per bezoek: $y = 3x + 12$. Dan $3x + 12 = 30$ geeft $x = 6$. Het snijpunt is $(6, 30)$.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    procenten: mengsel
  opgave: |-
    Een apotheker heeft alcohol van 40\,\% en alcohol van 70\,\%.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel ml van elk mengt hij voor 300~ml alcohol van 60\,\%?
      antwoord: |-
        100~ml van 40\,\% en 200~ml van 70\,\%
      uitwerking: |-
        $x + y = 300$ en $0{,}4x + 0{,}7y = 180$, want 60\,\% van 300~ml is 180~ml zuivere alcohol. Met $x = 300 - y$: $120 + 0{,}3y = 180$, dus $y = 200$ en $x = 100$.
    - opgave: |-
        Hoeveel ml water moet hij bij die 300~ml doen om alcohol van 40\,\% te krijgen?
      antwoord: |-
        150~ml
      uitwerking: |-
        De 180~ml zuivere alcohol moet 40\,\% worden van het geheel: $0{,}4(300 + w) = 180$, dus $300 + w = 450$ en $w = 150$~ml.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    prijzen en aantallen
  prent:
    naam: koffie
  opgave: |-
    In een koffiebar kosten 4 cappuccino's en 2 thee 15,80 euro. Een andere tafel betaalt 17,10 euro voor 3 cappuccino's en 5 thee.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat kost een cappuccino, en wat kost een thee?
      antwoord: |-
        cappuccino 3,20 euro, thee 1,50 euro
      uitwerking: |-
        $4x + 2y = 15{,}80$ en $3x + 5y = 17{,}10$. Vermenigvuldig de eerste met 5 en de tweede met 2: $20x + 10y = 79$ en $6x + 10y = 34{,}20$. Trek af: $14x = 44{,}80$, $x = 3{,}20$. Dan $2y = 15{,}80 - 12{,}80 = 3$ en $y = 1{,}50$.
    - opgave: |-
        Wat betaal je voor 2 cappuccino's en 4 thee?
      antwoord: |-
        12,40 euro
      uitwerking: |-
        $2 \cdot 3{,}20 + 4 \cdot 1{,}50 = 6{,}40 + 6 = 12{,}40$ euro.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    strijdig en onbepaald in een context
  opgave: |-
    Op de markt kosten alle appels evenveel per kg, en ook alle peren.
  lijst: enumerate
  delen:
    - opgave: |-
        Ella betaalt 10,50 euro voor 2~kg appels en 3~kg peren. Tom betaalt 21 euro voor 4~kg appels en 6~kg peren. Kun je daaruit de prijs per kg berekenen? Leg uit.
      antwoord: |-
        neen: het stelsel is onbepaald
      uitwerking: |-
        $2x + 3y = 10{,}50$ en $4x + 6y = 21$. De tweede vergelijking is de eerste maal 2: Tom kocht precies het dubbel van Ella. Het stelsel is onbepaald, de rechten vallen samen. Er zijn oneindig veel mogelijke prijzen.
    - opgave: |-
        Noor betaalt 10,50 euro voor 2~kg appels en 3~kg peren. Wout zegt dat hij 20 euro betaalde voor 4~kg appels en 6~kg peren. Wat is er aan de hand?
      antwoord: |-
        het stelsel is strijdig: een van beiden vergist zich
      uitwerking: |-
        $2x + 3y = 10{,}50$ en $4x + 6y = 20$. Maal 2 geeft de eerste $4x + 6y = 21$, en dat kan niet tegelijk 20 zijn. Het stelsel is strijdig, de rechten zijn evenwijdig: een van beiden vergist zich.
    - opgave: |-
        Je weet nog dat 1~kg peren 0,50 euro meer kost dan 1~kg appels. Bereken nu de prijzen met de gegevens van Ella.
      antwoord: |-
        appels 1,80 euro per kg, peren 2,30 euro per kg
      uitwerking: |-
        $2x + 3y = 10{,}50$ en $y = x + 0{,}50$. Substitueer: $5x + 1{,}50 = 10{,}50$, $x = 1{,}80$ en $y = 2{,}30$. Controle: $3{,}60 + 6{,}90 = 10{,}50$.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    procenten: rente
  opgave: |-
    Anouk zet 5000 euro op twee spaarrekeningen. De ene geeft 2\,\% rente per jaar, de andere 3\,\%. Na een jaar krijgt ze samen 130 euro rente.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel zette ze op elke rekening?
      antwoord: |-
        2000 euro aan 2\,\% en 3000 euro aan 3\,\%
      uitwerking: |-
        $x + y = 5000$ en $0{,}02x + 0{,}03y = 130$. Maal 100: $2x + 3y = 13\,000$. Met $x = 5000 - y$: $10\,000 + y = 13\,000$, dus $y = 3000$ en $x = 2000$.
    - opgave: |-
        Hoeveel rente had ze gekregen als ze de bedragen omgekeerd had verdeeld?
      antwoord: |-
        120 euro
      uitwerking: |-
        $0{,}02 \cdot 3000 + 0{,}03 \cdot 2000 = 60 + 60 = 120$ euro.

- id: h3-o18
  soort: opdracht
  niveau: 2
  thema: |-
    grafiek en stelsel
  opgave: |-
    Een vat A bevat 80 liter water en loopt leeg met 4 liter per minuut. Tegelijk wordt vat B, met 20 liter, gevuld met 6 liter per minuut. De grafiek toont de hoeveelheid water $y$ (in liter) na $t$ minuten.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.035cm,font=\scriptsize]
        \roosterleeg[$t$][$y$]{0}{1}{10}{0}{10}{90}
        \xgetallen{2,4,6,8,10}\ygetallen{20,40,60,80}\oorsprong
        \rechte{0}{10}{-4}{80}
        \rechte[tweede]{0}{10}{6}{20}
        \node[accent,right] at (10,40) {A};
        \node[inkt,above left] at (10,80) {B};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af na hoeveel minuten er evenveel water in beide vaten zit.
      antwoord: |-
        na 6 minuten
      uitwerking: |-
        De rechten snijden elkaar bij $t = 6$, op ongeveer 56 liter.
    - opgave: |-
        Schrijf het stelsel dat bij de twee vaten hoort.
      antwoord: |-
        $y = 80 - 4t$ en $y = 20 + 6t$
      uitwerking: |-
        Vat A: $y = 80 - 4t$. Vat B: $y = 20 + 6t$.
    - opgave: |-
        Bereken het snijpunt. Klopt je aflezing?
      antwoord: |-
        $(6, 56)$
      uitwerking: |-
        $80 - 4t = 20 + 6t$ geeft $60 = 10t$, dus $t = 6$ en $y = 80 - 24 = 56$. Na 6 minuten zit er in elk vat 56 liter.

- id: h3-o19
  soort: opdracht
  niveau: 2
  thema: |-
    munten, een antwoord dat niet kan
  opgave: |-
    In een spaarpot zitten 38 munten: munten van 20 cent en munten van 50 cent.
  lijst: enumerate
  delen:
    - opgave: |-
        Samen zijn de munten 13 euro waard. Hoeveel munten van elke soort zijn er?
      antwoord: |-
        20 munten van 20 cent, 18 van 50 cent
      uitwerking: |-
        $x + y = 38$ en $0{,}2x + 0{,}5y = 13$. Maal 10: $2x + 5y = 130$. Met $x = 38 - y$: $76 + 3y = 130$, $y = 18$ en $x = 20$. Controle: $4 + 9 = 13$ euro.
    - opgave: |-
        Kunnen 38 van zulke munten samen 20 euro waard zijn? Los op en leg uit.
      antwoord: |-
        neen
      uitwerking: |-
        $2x + 5y = 200$ en $x = 38 - y$ geven $76 + 3y = 200$, dus $y = \tfrac{124}{3}$, geen geheel getal, en $x = 38 - y < 0$. Dat kan niet. Zelfs 38 munten van 50 cent zijn maar 19 euro waard.

- id: h3-o20
  soort: opdracht
  niveau: 2
  thema: |-
    twee tarieven, grafiek tekenen
  opgave: |-
    Een bestelwagen huren kost bij verhuurder A 50 euro per dag en 0,20 euro per km. Bij verhuurder B kost hij 30 euro per dag en 0,30 euro per km. Je huurt de bestelwagen voor één dag.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken in één assenstelsel de prijs $y$ (in euro) in functie van het aantal km $x$, van 0 tot 400~km.
      antwoord: |-
        twee rechten door $(0, 50)$ en $(0, 30)$
      uitwerking: |-
        A: $y = 0{,}2x + 50$, door $(0, 50)$ en $(400, 130)$. B: $y = 0{,}3x + 30$, door $(0, 30)$ en $(400, 150)$.
        \figuren{\begin{tikzpicture}[x=.022cm,y=.022cm,font=\scriptsize]
          \roosterleeg[$x$][$y$]{0}{50}{400}{0}{20}{160}
          \xgetallen{100,200,300,400}\ygetallen{40,80,120,160}\oorsprong
          \rechte{0}{400}{0.2}{50}
          \rechte[tweede]{0}{400}{0.3}{30}
          \node[accent,right] at (400,130) {A};
          \node[inkt,right] at (400,150) {B};
          \punt{200}{90}\aflezen{200}{90}
        \end{tikzpicture}}
    - opgave: |-
        Lees het snijpunt af, en controleer het met een berekening.
      antwoord: |-
        $(200, 90)$
      uitwerking: |-
        $0{,}2x + 50 = 0{,}3x + 30$ geeft $20 = 0{,}1x$, dus $x = 200$ en $y = 90$.
    - opgave: |-
        Wanneer is verhuurder B goedkoper?
      antwoord: |-
        als je minder dan 200~km rijdt
      uitwerking: |-
        Links van het snijpunt ligt de rechte van B onder die van A: voor minder dan 200~km is B goedkoper.
    - opgave: |-
        Je wilt 300~km rijden. Hoeveel bespaar je met de goedkoopste verhuurder?
      antwoord: |-
        10 euro, bij A
      uitwerking: |-
        A: $60 + 50 = 110$ euro. B: $90 + 30 = 120$ euro. Bij A bespaar je 10 euro.

# --- Opdrachten, niveau 3 ---------------------------------------------------------------

- id: h3-o21
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 3
  thema: |-
    de cijfers van een getal
  opgave: |-
    Een getal van twee cijfers met tientallencijfer $a$ en eenhedencijfer $b$ is gelijk aan $10a + b$. Zo is $47 = 10 \cdot 4 + 7$.
  lijst: enumerate
  delen:
    - opgave: |-
        De som van de cijfers van een getal is 11. Verwissel je de twee cijfers, dan wordt het getal 27 groter. Welk getal is het?
      antwoord: |-
        47
      uitwerking: |-
        $a + b = 11$ en $10b + a = 10a + b + 27$. De tweede wordt $9b - 9a = 27$, dus $b - a = 3$. Tel op met de eerste: $2b = 14$, $b = 7$ en $a = 4$. Controle: $74 - 47 = 27$.
    - opgave: |-
        Bestaat er een getal van twee cijfers met cijfersom 11 dat 36 groter wordt als je de cijfers verwisselt? Leg uit.
      antwoord: |-
        neen
      uitwerking: |-
        Nu is $b - a = 4$ en $a + b = 11$, dus $2b = 15$ en $b = 7{,}5$. Een cijfer is een geheel getal: zo'n getal bestaat niet.

- id: h3-o22
  soort: opdracht
  niveau: 3
  thema: |-
    beweging: inhalen
  opgave: |-
    Om 9 uur vertrekt een fietser aan 15~km/h. Om 10 uur vertrekt een bromfietser op dezelfde plaats en volgt dezelfde weg aan 40~km/h. Noem $t$ het aantal uren dat de fietser al onderweg is, en $d$ de afgelegde afstand in km.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit waarom de bromfietser na $t$ uur een afstand $40(t - 1)$ heeft afgelegd.
      antwoord: |-
        hij vertrekt een uur later
      uitwerking: |-
        Als de fietser $t$ uur onderweg is, rijdt de bromfietser pas $t - 1$ uur, aan 40~km/h.
    - opgave: |-
        Hoe laat haalt de bromfietser de fietser in, en hoe ver van het vertrekpunt?
      antwoord: |-
        om 10.36 uur, op 24~km
      uitwerking: |-
        Bij het inhalen zijn de afstanden gelijk: $d = 15t$ en $d = 40(t - 1)$. Dus $15t = 40t - 40$, $t = 1{,}6$ uur en $d = 24$~km. $0{,}6$ uur is 36 minuten: om 10.36 uur.
    - opgave: |-
        Hoe laat heeft de bromfietser 10~km voorsprong?
      antwoord: |-
        om 11 uur
      uitwerking: |-
        $40(t - 1) - 15t = 10$ geeft $25t = 50$, dus $t = 2$: om 11 uur. De fietser is dan op 30~km, de bromfietser op 40~km.

- id: h3-o23
  pakketten: [4, 5]
  soort: opdracht
  niveau: 3
  thema: |-
    drie onbekenden
  opgave: |-
    Een vraagstuk kan ook drie onbekenden hebben. Dan heb je drie vergelijkingen nodig. Stel een stelsel op en los het op.
  lijst: enumerate
  delen:
    - opgave: |-
        In een sportwinkel kosten een bal en een paar sokken samen 31 euro, een paar sokken en een pet samen 23 euro, en een bal en een pet samen 38 euro. Wat kost elk? Tip: tel de drie vergelijkingen op.
      antwoord: |-
        bal 23 euro, sokken 8 euro, pet 15 euro
      uitwerking: |-
        $\stelseldrie{x + y &= 31}{y + z &= 23}{x + z &= 38}$ Tel op: $2x + 2y + 2z = 92$, dus $x + y + z = 46$. Trek elke vergelijking daarvan af: $z = 46 - 31 = 15$, $x = 46 - 23 = 23$ en $y = 46 - 38 = 8$.
    - opgave: |-
        In een driehoek is de ene hoek het dubbel van de kleinste hoek, en de derde hoek is $20^\circ$ groter dan de kleinste. Hoe groot zijn de hoeken?
      antwoord: |-
        $40^\circ$, $60^\circ$ en $80^\circ$
      uitwerking: |-
        $\stelseldrie{x + y + z &= 180}{z &= 2x}{y &= x + 20}$ Substitueer in de eerste: $x + (x + 20) + 2x = 180$, $4x = 160$, $x = 40$, $y = 60$ en $z = 80$.

- id: h3-o24
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    kranen, onbekenden als deel per minuut
  opgave: |-
    Twee kranen vullen samen een vat in 12 minuten. Op een dag staan ze eerst 4 minuten samen open. Daarna gaat kraan B dicht, en kraan A heeft nog 20 minuten nodig om het vat te vullen. Noem $a$ het deel van het vat dat kraan A in één minuut vult, en $b$ het deel voor kraan B.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit waarom $12a + 12b = 1$, en stel een tweede vergelijking op.
      antwoord: |-
        $24a + 4b = 1$
      uitwerking: |-
        In 12 minuten vullen ze samen het hele vat, en het hele vat is 1. Op de tweede dag loopt A $4 + 20 = 24$ minuten en B 4 minuten: $24a + 4b = 1$.
    - opgave: |-
        Hoe lang doet elke kraan er alleen over om het vat te vullen?
      antwoord: |-
        A 30 minuten, B 20 minuten
      uitwerking: |-
        Uit de eerste: $a + b = \tfrac{1}{12}$, dus $4a + 4b = \tfrac13$. Trek dat af van de tweede: $20a = \tfrac23$, $a = \tfrac{1}{30}$. Dan $b = \tfrac{1}{12} - \tfrac{1}{30} = \tfrac{1}{20}$. Kraan A vult elke minuut een dertigste: 30 minuten. Kraan B: 20 minuten.

- id: h3-o25
  soort: opdracht
  niveau: 3
  thema: |-
    zelf een vraagstuk bedenken
  opgave: |-
    Bedenk bij elk stelsel een vraagstuk, en los het op. Zeg wat $x$ en $y$ betekenen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{x + y &= 30}{2x + 4y &= 100}$
      antwoord: |-
        $V = \{(10, 20)\}$, bv. 10 kippen en 20 konijnen
      uitwerking: |-
        Bijvoorbeeld: op een boerderij lopen 30 kippen en konijnen rond, met samen 100 poten. Hoeveel kippen? Met $x = 30 - y$: $60 + 2y = 100$, $y = 20$ en $x = 10$: 10 kippen en 20 konijnen.
    - opgave: |-
        $\stelsel{x &= y + 5}{2x + 2y &= 50}$
      antwoord: |-
        $V = \{(15, 10)\}$, bv. een rechthoek van 15 bij 10
      uitwerking: |-
        Bijvoorbeeld: een rechthoek is 5~cm langer dan breed, en zijn omtrek is 50~cm. Substitueer: $4y + 10 = 50$, $y = 10$ en $x = 15$.

- id: h3-o26
  soort: opdracht
  niveau: 3
  thema: |-
    gegevens die niet kunnen kloppen
  opgave: |-
    Een klas van 25 leerlingen verkoopt koeken voor een goed doel. Sommige leerlingen verkochten een doos van 3 euro, de andere een doos van 5 euro. Elke leerling verkocht precies één doos. De klas zegt dat ze samen 100 euro ophaalden.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon met een stelsel aan dat dat niet kan kloppen.
      antwoord: |-
        de oplossing is $(12{,}5;\ 12{,}5)$, geen gehele getallen
      uitwerking: |-
        $x + y = 25$ en $3x + 5y = 100$. Met $x = 25 - y$: $75 + 2y = 100$, $y = 12{,}5$ en $x = 12{,}5$. Een half aantal leerlingen kan niet: de gegevens kloppen niet.
    - opgave: |-
        Bij welke opbrengst tussen 100 en 110 euro zou het wel kunnen? Hoeveel dozen van elke soort zijn er dan verkocht?
      antwoord: |-
        bij 105 euro: 10 dozen van 3 euro en 15 van 5 euro (ook 101, 103, 107 en 109 euro kunnen)
      uitwerking: |-
        Met opbrengst $p$: $75 + 2y = p$, dus $y = \tfrac{p - 75}{2}$. Dat is een geheel getal als $p$ oneven is: 101, 103, 105, 107 of 109 euro. Bij 105 euro is $y = 15$ en $x = 10$. Controle: $30 + 75 = 105$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    De som van twee getallen is 75, en hun verschil is 19. Welke getallen zijn het?
  antwoord: |-
    47 en 28
  uitwerking: |-
    $x + y = 75$ en $x - y = 19$. Tel op: $2x = 94$, $x = 47$ en $y = 28$.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Twee pizza's en drie drankjes kosten 31 euro. Een pizza en vier drankjes kosten 23 euro. Wat kost een pizza, en wat kost een drankje?
  antwoord: |-
    pizza 11 euro, drankje 3 euro
  uitwerking: |-
    $2x + 3y = 31$ en $x + 4y = 23$. Met $x = 23 - 4y$: $46 - 8y + 3y = 31$, dus $5y = 15$, $y = 3$ en $x = 11$.

- id: h3-t3
  soort: test
  niveau: 2
  opgave: |-
    Een theewinkel mengt thee van 10 euro per kg met thee van 18 euro per kg tot 8~kg mengsel van 13 euro per kg. Hoeveel kg van elke soort gaat erin?
  antwoord: |-
    5~kg van 10 euro, 3~kg van 18 euro
  uitwerking: |-
    $x + y = 8$ en $10x + 18y = 104$, want $8 \cdot 13 = 104$. Met $x = 8 - y$: $80 + 8y = 104$, $y = 3$ en $x = 5$.

- id: h3-t4
  soort: test
  niveau: 2
  opgave: |-
    Een boot vaart 30~km stroomafwaarts in 2 uur, en dezelfde 30~km terug in 3 uur. Hoe snel vaart de boot in stilstaand water, en hoe snel stroomt de rivier?
  antwoord: |-
    boot 12,5~km/h, stroom 2,5~km/h
  uitwerking: |-
    $2(v + w) = 30$ en $3(v - w) = 30$, dus $v + w = 15$ en $v - w = 10$. Tel op: $2v = 25$, $v = 12{,}5$ en $w = 2{,}5$.

- id: h3-t5
  soort: test
  niveau: 2
  opgave: |-
    Een rechthoek heeft een omtrek van 40~cm. De lengte is 4~cm minder dan het drievoud van de breedte. Hoe lang en hoe breed is de rechthoek?
  antwoord: |-
    14~cm lang, 6~cm breed
  uitwerking: |-
    $2(x + y) = 40$ en $x = 3y - 4$. Dus $x + y = 20$, $4y - 4 = 20$, $y = 6$ en $x = 14$.

- id: h3-t6
  soort: test
  niveau: 2
  opgave: |-
    Bij een fietsdeelsysteem kies je tussen twee formules. Zonder abonnement betaal je 1 euro per rit. Met een abonnement betaal je 12 euro per jaar en 0,40 euro per rit. Vanaf hoeveel ritten per jaar is het abonnement voordeliger?
  antwoord: |-
    vanaf meer dan 20 ritten
  uitwerking: |-
    $y = x$ en $y = 12 + 0{,}4x$. Gelijk als $x = 12 + 0{,}4x$, dus $0{,}6x = 12$ en $x = 20$. Het abonnement heeft de kleinste prijs per rit: bij meer dan 20 ritten is het voordeliger. Controle met 30 ritten: 30 euro tegenover 24 euro.

- id: h3-t7
  soort: test
  niveau: 2
  opgave: |-
    Een klas telt 28 leerlingen. Een kwart van de jongens en de helft van de meisjes speelt een muziekinstrument, samen 10 leerlingen. Hoeveel jongens en hoeveel meisjes zitten er in de klas?
  antwoord: |-
    16 jongens, 12 meisjes
  uitwerking: |-
    $x + y = 28$ en $0{,}25x + 0{,}5y = 10$. Maal 4: $x + 2y = 40$. Trek de eerste af: $y = 12$, en $x = 16$. Controle: $4 + 6 = 10$.
