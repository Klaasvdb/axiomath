# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.
# Een stelsel staat als \stelsel{2x + y &{}= 8}{x - y &{}= 1}; een oplossing als $(2, 3)$.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Dit ken je al. Los op, werk uit of maak de gevraagde onbekende vrij.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3x - 7 = 2x + 5$
      antwoord: |-
        $x = 12$
      uitwerking: |-
        $3x - 2x = 5 + 7$, dus $x = 12$.
    - opgave: |-
        $2(x - 3) + x = 9$
      antwoord: |-
        $x = 5$
      uitwerking: |-
        $2x - 6 + x = 9$, $3x = 15$, $x = 5$.
    - opgave: |-
        $\tfrac{x}{2} + 1 = 4$
      antwoord: |-
        $x = 6$
      uitwerking: |-
        $\tfrac x2 = 3$, dus $x = 6$.
    - opgave: |-
        werk uit: $5 - 2(3x - 1)$
      antwoord: |-
        $7 - 6x$
      uitwerking: |-
        $5 - 6x + 2 = 7 - 6x$.
    - opgave: |-
        maak $y$ vrij: $4x + y = 10$
      antwoord: |-
        $y = 10 - 4x$
      uitwerking: |-
        Breng $4x$ naar het rechterlid: $y = 10 - 4x$.
    - opgave: |-
        maak $x$ vrij: $x - 3y = 2$
      antwoord: |-
        $x = 2 + 3y$
      uitwerking: |-
        Breng $-3y$ naar het rechterlid: $x = 2 + 3y$.
    - opgave: |-
        werk uit: $(3x + 2y) + (5x - 2y)$
      antwoord: |-
        $8x$
      uitwerking: |-
        $3x + 5x + 2y - 2y = 8x$.
    - opgave: |-
        werk uit: $-3(2x - y)$
      antwoord: |-
        $-6x + 3y$
      uitwerking: |-
        $-3 \cdot 2x - 3 \cdot (-y) = -6x + 3y$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad De figuur toont de rechten $y = 2x - 1$ en $y = -x + 6$.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
        \rooster{-1}{1}{5}{-1}{1}{7}
        \rechte{0}{4}{2}{-1}
        \rechte[tweede]{-1}{5}{-1}{6}
        \node[accent,right] at (4,7) {$y = 2x - 1$};
        \node[inkt,right] at (5,1) {$y = -x + 6$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Lees het snijpunt zo nauwkeurig mogelijk af.
      antwoord: |-
        ongeveer $(2{,}3;\ 3{,}7)$
      uitwerking: |-
        Het snijpunt ligt iets rechts van $x = 2$ en iets onder $y = 4$: ongeveer $(2{,}3;\ 3{,}7)$.
    - opgave: |-
        Vul je afgelezen punt in beide vergelijkingen in. Is het echt een oplossing?
      antwoord: |-
        neen, het klopt maar ongeveer
      uitwerking: |-
        Met $(2{,}3;\ 3{,}7)$: $2 \cdot 2{,}3 - 1 = 3{,}6$ en $-2{,}3 + 6 = 3{,}7$. De eerste vergelijking klopt niet precies: een afgelezen punt is een benadering.
    - opgave: |-
        In het snijpunt hebben beide rechten dezelfde $y$. Welke vergelijking met alleen $x$ moet dan kloppen?
      antwoord: |-
        $2x - 1 = -x + 6$
      uitwerking: |-
        Beide uitdrukkingen voor $y$ zijn gelijk: $2x - 1 = -x + 6$.
    - opgave: |-
        Los die vergelijking op en bereken daarna $y$. Wat is het snijpunt exact?
      antwoord: |-
        $\bigl(\tfrac73, \tfrac{11}{3}\bigr)$
      uitwerking: |-
        $3x = 7$, dus $x = \tfrac73 \approx 2{,}33$, en $y = 2 \cdot \tfrac73 - 1 = \tfrac{11}{3} \approx 3{,}67$.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h2-gelijkstellen
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{y &{}= 2x + 3}{y &{}= -x + 9}$
      antwoord: |-
        $(2, 7)$
      uitwerking: |-
        $2x + 3 = -x + 9$, $3x = 6$, $x = 2$ en $y = 7$.
    - opgave: |-
        $\stelsel{y &{}= 4x - 5}{y &{}= x + 1}$
      antwoord: |-
        $(2, 3)$
      uitwerking: |-
        $4x - 5 = x + 1$, $3x = 6$, $x = 2$ en $y = 3$.
    - opgave: |-
        $\stelsel{y &{}= -3x + 1}{y &{}= 2x - 9}$
      antwoord: |-
        $(2, -5)$
      uitwerking: |-
        $-3x + 1 = 2x - 9$, $10 = 5x$, $x = 2$ en $y = -5$.
    - opgave: |-
        $\stelsel{y &{}= \tfrac12 x + 4}{y &{}= 2x - 2}$
      antwoord: |-
        $(4, 6)$
      uitwerking: |-
        $\tfrac12 x + 4 = 2x - 2$. Maal 2: $x + 8 = 4x - 4$, $12 = 3x$, $x = 4$ en $y = 6$.

- id: h2-vrijmaken
  soort: kort
  opgave: |-
    Welke onbekende maak je het makkelijkst vrij? Druk ze uit in de andere onbekende.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{2x + y &{}= 7}{3x - 4y &{}= 5}$
      antwoord: |-
        $y = 7 - 2x$
      uitwerking: |-
        In de eerste vergelijking heeft $y$ coëfficiënt 1: $y = 7 - 2x$.
    - opgave: |-
        $\stelsel{3x - 5y &{}= 1}{x + 2y &{}= 4}$
      antwoord: |-
        $x = 4 - 2y$
      uitwerking: |-
        In de tweede vergelijking heeft $x$ coëfficiënt 1: $x = 4 - 2y$.
    - opgave: |-
        $\stelsel{4x - y &{}= 3}{2x + 3y &{}= 5}$
      antwoord: |-
        $y = 4x - 3$
      uitwerking: |-
        $y$ heeft coëfficiënt $-1$: $-y = 3 - 4x$, dus $y = 4x - 3$.
    - opgave: |-
        $\stelsel{-x + 6y &{}= 2}{5x + 2y &{}= 7}$
      antwoord: |-
        $x = 6y - 2$
      uitwerking: |-
        $x$ heeft coëfficiënt $-1$: $-x = 2 - 6y$, dus $x = 6y - 2$.

- id: h2-substitutie
  soort: kort
  opgave: |-
    Los op met substitutie.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{y &{}= 3x - 1}{2x + y &{}= 9}$
      antwoord: |-
        $(2, 5)$
      uitwerking: |-
        $2x + (3x - 1) = 9$, $5x = 10$, $x = 2$ en $y = 5$.
    - opgave: |-
        $\stelsel{x + 2y &{}= 8}{3x - y &{}= 3}$
      antwoord: |-
        $(2, 3)$
      uitwerking: |-
        $x = 8 - 2y$, dus $3(8 - 2y) - y = 3$, $24 - 7y = 3$, $y = 3$ en $x = 2$.
    - opgave: |-
        $\stelsel{2x + 3y &{}= -1}{x - y &{}= 2}$
      antwoord: |-
        $(1, -1)$
      uitwerking: |-
        $x = 2 + y$, dus $2(2 + y) + 3y = -1$, $5y = -5$, $y = -1$ en $x = 1$.
    - opgave: |-
        $\stelsel{5x - 2y &{}= 17}{4x + y &{}= 11}$
      antwoord: |-
        $(3, -1)$
      uitwerking: |-
        $y = 11 - 4x$, dus $5x - 2(11 - 4x) = 17$, $13x - 22 = 17$, $x = 3$ en $y = -1$.

- id: h2-optellen
  soort: kort
  opgave: |-
    Los op door de vergelijkingen op te tellen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{x + y &{}= 9}{x - y &{}= 3}$
      antwoord: |-
        $(6, 3)$
      uitwerking: |-
        Optellen: $2x = 12$, $x = 6$, en $6 + y = 9$ geeft $y = 3$.
    - opgave: |-
        $\stelsel{2x + 3y &{}= 7}{4x - 3y &{}= 5}$
      antwoord: |-
        $(2, 1)$
      uitwerking: |-
        Optellen: $6x = 12$, $x = 2$, en $4 + 3y = 7$ geeft $y = 1$.
    - opgave: |-
        $\stelsel{-3x + 2y &{}= 1}{3x + 5y &{}= 20}$
      antwoord: |-
        $\bigl(\tfrac53, 3\bigr)$
      uitwerking: |-
        Optellen: $7y = 21$, $y = 3$, en $3x + 15 = 20$ geeft $x = \tfrac53$.
    - opgave: |-
        $\stelsel{5x - 4y &{}= 2}{-5x + y &{}= 7}$
      antwoord: |-
        $(-2, -3)$
      uitwerking: |-
        Optellen: $-3y = 9$, $y = -3$, en $5x + 12 = 2$ geeft $x = -2$.

- id: h2-combinatie
  soort: kort
  opgave: |-
    Los op met combinatie.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{x + 3y &{}= 5}{2x - y &{}= 3}$
      antwoord: |-
        $(2, 1)$
      uitwerking: |-
        De tweede maal 3: $6x - 3y = 9$. Optellen: $7x = 14$, $x = 2$, en $2 + 3y = 5$ geeft $y = 1$.
    - opgave: |-
        $\stelsel{3x + 2y &{}= 4}{5x + 4y &{}= 6}$
      antwoord: |-
        $(2, -1)$
      uitwerking: |-
        De eerste maal $-2$: $-6x - 4y = -8$. Optellen: $-x = -2$, $x = 2$, en $6 + 2y = 4$ geeft $y = -1$.
    - opgave: |-
        $\stelsel{4x - 3y &{}= 6}{3x + 2y &{}= 13}$
      antwoord: |-
        $(3, 2)$
      uitwerking: |-
        Maal 2 en maal 3: $8x - 6y = 12$ en $9x + 6y = 39$. Optellen: $17x = 51$, $x = 3$, en $12 - 3y = 6$ geeft $y = 2$.
    - opgave: |-
        $\stelsel{2x + 5y &{}= -4}{3x - 2y &{}= 13}$
      antwoord: |-
        $(3, -2)$
      uitwerking: |-
        Maal 2 en maal 5: $4x + 10y = -8$ en $15x - 10y = 65$. Optellen: $19x = 57$, $x = 3$, en $6 + 5y = -4$ geeft $y = -2$.

- id: h2-methode
  soort: kort
  opgave: |-
    Los op met de methode die jij het handigst vindt. Zeg waarom je die kiest.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{y &{}= 5 - 2x}{3x - 2y &{}= 11}$
      antwoord: |-
        $(3, -1)$
      uitwerking: |-
        Substitutie, want $y$ staat al vrij: $3x - 2(5 - 2x) = 11$, $7x = 21$, $x = 3$ en $y = -1$.
    - opgave: |-
        $\stelsel{6x + 5y &{}= 3}{2x - 5y &{}= 9}$
      antwoord: |-
        $\bigl(\tfrac32, -\tfrac65\bigr)$
      uitwerking: |-
        Combinatie, want $+5y$ en $-5y$ zijn tegengesteld: $8x = 12$, $x = \tfrac32$, en $9 + 5y = 3$ geeft $y = -\tfrac65$.
    - opgave: |-
        $\stelsel{7x - 3y &{}= 1}{2x - y &{}= 0}$
      antwoord: |-
        $(1, 2)$
      uitwerking: |-
        Substitutie: uit de tweede vergelijking $y = 2x$. Dan $7x - 6x = 1$, $x = 1$ en $y = 2$.
    - opgave: |-
        $\stelsel{3x + 4y &{}= 10}{2x + 3y &{}= 7}$
      antwoord: |-
        $(2, 1)$
      uitwerking: |-
        Combinatie, want geen coëfficiënt is 1: maal 3 en maal $-4$ geeft $9x + 12y = 30$ en $-8x - 12y = -28$. Optellen: $x = 2$, en $6 + 4y = 10$ geeft $y = 1$.

- id: h2-aantal
  soort: kort
  opgave: |-
    Los op. Is het stelsel strijdig, onbepaald, of heeft het precies één oplossing?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{x - 2y &{}= 5}{-2x + 4y &{}= 3}$
      antwoord: |-
        strijdig, $V = \emptyset$
      uitwerking: |-
        De eerste maal 2: $2x - 4y = 10$. Optellen: $0 = 13$, vals. $V = \emptyset$.
    - opgave: |-
        $\stelsel{3x + y &{}= 4}{6x + 2y &{}= 8}$
      antwoord: |-
        onbepaald, $V = \{(x, y) \mid 3x + y = 4\}$
      uitwerking: |-
        De eerste maal $-2$: $-6x - 2y = -8$. Optellen: $0 = 0$. Alle punten van de rechte $3x + y = 4$.
    - opgave: |-
        $\stelsel{2x + y &{}= 3}{4x + 2y &{}= 7}$
      antwoord: |-
        strijdig, $V = \emptyset$
      uitwerking: |-
        De eerste maal $-2$: $-4x - 2y = -6$. Optellen: $0 = 1$, vals.
    - opgave: |-
        $\stelsel{x + y &{}= 2}{2x - y &{}= 7}$
      antwoord: |-
        $(3, -1)$
      uitwerking: |-
        Optellen: $3x = 9$, $x = 3$, en $y = 2 - 3 = -1$. Precies één oplossing.

- id: h2-herleiden
  soort: kort
  opgave: |-
    Herleid eerst, en los dan op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{2(x - 1) + y &{}= 5}{x - (y - 3) &{}= 5}$
      antwoord: |-
        $(3, 1)$
      uitwerking: |-
        Herleid: $2x + y = 7$ en $x - y = 2$. Optellen: $3x = 9$, $x = 3$ en $y = 1$.
    - opgave: |-
        $\stelsel{\dfrac x2 + \dfrac y4 &{}= 2}{\rule{0pt}{3.6ex}\dfrac x3 - \dfrac y2 &{}= 0}$
      antwoord: |-
        $(3, 2)$
      uitwerking: |-
        Maal 4 en maal 6: $2x + y = 8$ en $2x - 3y = 0$. Aftrekken: $4y = 8$, $y = 2$ en $x = 3$.
    - opgave: |-
        $\stelsel{0{,}2x + 0{,}5y &{}= 2}{x - y &{}= 3}$
      antwoord: |-
        $(5, 2)$
      uitwerking: |-
        Maal 10: $2x + 5y = 20$. Met $x = 3 + y$: $6 + 2y + 5y = 20$, $y = 2$ en $x = 5$.
    - opgave: |-
        $\stelsel{3(x + y) - 2(x - y) &{}= 7}{x + 2y &{}= 4}$
      antwoord: |-
        $(2, 1)$
      uitwerking: |-
        Herleid: $x + 5y = 7$. Aftrekken van $x + 2y = 4$: $3y = 3$, $y = 1$ en $x = 2$.

- id: h2-cramer
  pakketten: [5]
  soort: kort
  opgave: |-
    Los op met de regel van Cramer. Wat besluit je als $D = 0$?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\stelsel{2x + 3y &{}= 8}{x - y &{}= -1}$
      antwoord: |-
        $(1, 2)$
      uitwerking: |-
        $D = -2 - 3 = -5$, $x = \tfrac{-8 + 3}{-5} = 1$, $y = \tfrac{-2 - 8}{-5} = 2$.
    - opgave: |-
        $\stelsel{5x - 2y &{}= 1}{3x + 4y &{}= 37}$
      antwoord: |-
        $(3, 7)$
      uitwerking: |-
        $D = 20 + 6 = 26$, $x = \tfrac{4 + 74}{26} = 3$, $y = \tfrac{185 - 3}{26} = 7$.
    - opgave: |-
        $\stelsel{4x + 6y &{}= 3}{6x + 9y &{}= 5}$
      antwoord: |-
        $D = 0$; strijdig
      uitwerking: |-
        $D = 36 - 36 = 0$: geen of oneindig veel oplossingen. Maal 3 en maal $-2$: $12x + 18y = 9$ en $-12x - 18y = -10$, optellen geeft $0 = -1$. Strijdig.

# --- Opdrachten, niveau 1 --------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    substitutie
  opgave: |-
    Los op met substitutie.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\stelsel{y &{}= 2x - 3}{x + y &{}= 9}$
      antwoord: |-
        $(4, 5)$
      uitwerking: |-
        $x + 2x - 3 = 9$, $3x = 12$, $x = 4$, $y = 5$.
    - opgave: |-
        $\stelsel{x &{}= 3y + 1}{2x - 5y &{}= 4}$
      antwoord: |-
        $(7, 2)$
      uitwerking: |-
        $2(3y + 1) - 5y = 4$, $y + 2 = 4$, $y = 2$, $x = 7$.
    - opgave: |-
        $\stelsel{4x + y &{}= 2}{3x - 2y &{}= 7}$
      antwoord: |-
        $(1, -2)$
      uitwerking: |-
        $y = 2 - 4x$, $3x - 2(2 - 4x) = 7$, $11x = 11$, $x = 1$, $y = -2$.
    - opgave: |-
        $\stelsel{x - 5y &{}= 0}{2x + 3y &{}= 13}$
      antwoord: |-
        $(5, 1)$
      uitwerking: |-
        $x = 5y$, $10y + 3y = 13$, $y = 1$, $x = 5$.
    - opgave: |-
        $\stelsel{-x + 2y &{}= 4}{3x + y &{}= 9}$
      antwoord: |-
        $(2, 3)$
      uitwerking: |-
        $x = 2y - 4$, $3(2y - 4) + y = 9$, $7y = 21$, $y = 3$, $x = 2$.
    - opgave: |-
        $\stelsel{6x - y &{}= -1}{5x + 2y &{}= 19}$
      antwoord: |-
        $(1, 7)$
      uitwerking: |-
        $y = 6x + 1$, $5x + 2(6x + 1) = 19$, $17x = 17$, $x = 1$, $y = 7$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    balansen, stelsel opstellen
  opgave: |-
    Elk paar balansen is in evenwicht. Een blokje weegt 1~kg, alle zakjes ($x$) wegen evenveel, en alle bollen ($y$) ook. Schrijf bij elk paar een stelsel en bereken het gewicht van een zakje en een bol.
  lijst: enumerate
  delen:
    - opgave: |-
        $\vcenter{\hbox{\begin{tikzpicture}[scale=.42]
          \balansxy{3}{1}{0}{0}{0}{11}
        \end{tikzpicture}}}$\qquad
        $\vcenter{\hbox{\begin{tikzpicture}[scale=.42]
          \balansxy{1}{2}{0}{0}{0}{7}
        \end{tikzpicture}}}$
      antwoord: |-
        zakje 3~kg, bol 2~kg
      uitwerking: |-
        $\stelsel{3x + y &{}= 11}{x + 2y &{}= 7}$. De eerste maal $-2$: $-6x - 2y = -22$. Optellen: $-5x = -15$, $x = 3$, en $y = 11 - 9 = 2$.
    - opgave: |-
        $\vcenter{\hbox{\begin{tikzpicture}[scale=.42]
          \balansxy{2}{2}{0}{0}{0}{10}
        \end{tikzpicture}}}$\qquad
        $\vcenter{\hbox{\begin{tikzpicture}[scale=.42]
          \balansxy{3}{0}{0}{0}{1}{3}
        \end{tikzpicture}}}$
      antwoord: |-
        zakje 2~kg, bol 3~kg
      uitwerking: |-
        $\stelsel{2x + 2y &{}= 10}{3x &{}= y + 3}$, of herleid $x + y = 5$ en $3x - y = 3$. Optellen: $4x = 8$, $x = 2$, en $y = 3$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    combinatie
  opgave: |-
    Los op met combinatie.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\stelsel{3x + y &{}= 7}{2x - y &{}= 3}$
      antwoord: |-
        $(2, 1)$
      uitwerking: |-
        Optellen: $5x = 10$, $x = 2$, $y = 1$.
    - opgave: |-
        $\stelsel{x + 4y &{}= 9}{x - 2y &{}= -3}$
      antwoord: |-
        $(1, 2)$
      uitwerking: |-
        De tweede maal $-1$ en optellen: $6y = 12$, $y = 2$, $x = 1$.
    - opgave: |-
        $\stelsel{2x + 3y &{}= 12}{5x - 3y &{}= 9}$
      antwoord: |-
        $(3, 2)$
      uitwerking: |-
        Optellen: $7x = 21$, $x = 3$, $3y = 6$, $y = 2$.
    - opgave: |-
        $\stelsel{3x - 2y &{}= 1}{4x + 6y &{}= 23}$
      antwoord: |-
        $\bigl(2, \tfrac52\bigr)$
      uitwerking: |-
        De eerste maal 3: $9x - 6y = 3$. Optellen: $13x = 26$, $x = 2$, en $6 - 2y = 1$ geeft $y = \tfrac52$.
    - opgave: |-
        $\stelsel{5x + 2y &{}= 4}{7x + 3y &{}= 5}$
      antwoord: |-
        $(2, -3)$
      uitwerking: |-
        Maal 3 en maal $-2$: $15x + 6y = 12$ en $-14x - 6y = -10$. Optellen: $x = 2$, $y = -3$.
    - opgave: |-
        $\stelsel{4x - 5y &{}= 7}{3x - 4y &{}= 5}$
      antwoord: |-
        $(3, 1)$
      uitwerking: |-
        Maal 3 en maal $-4$: $12x - 15y = 21$ en $-12x + 16y = -20$. Optellen: $y = 1$, $x = 3$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    coëfficiënten tegengesteld maken
  opgave: |-
    Je wilt de gevraagde onbekende elimineren. Met welke getallen vermenigvuldig je de vergelijkingen? Schrijf de nieuwe vergelijkingen op (je hoeft niet verder op te lossen).
  lijst: enumerate
  delen:
    - opgave: |-
        $\stelsel{2x + 3y &{}= 1}{5x - y &{}= 4}$, elimineer $y$
      antwoord: |-
        de tweede maal 3
      uitwerking: |-
        De tweede maal 3: $15x - 3y = 12$. Samen met $2x + 3y = 1$ zijn de coëfficiënten van $y$ tegengesteld.
    - opgave: |-
        $\stelsel{3x + 4y &{}= 2}{2x + 5y &{}= 1}$, elimineer $x$
      antwoord: |-
        maal 2 en maal $-3$
      uitwerking: |-
        $6x + 8y = 4$ en $-6x - 15y = -3$. (Maal $-2$ en maal 3 kan ook.)
    - opgave: |-
        $\stelsel{6x - 5y &{}= 7}{4x + 3y &{}= 2}$, elimineer $x$
      antwoord: |-
        maal 2 en maal $-3$
      uitwerking: |-
        Het kgv van 6 en 4 is 12: $12x - 10y = 14$ en $-12x - 9y = -6$.
    - opgave: |-
        $\stelsel{7x + 2y &{}= 3}{3x - 3y &{}= 1}$, elimineer $y$
      antwoord: |-
        maal 3 en maal 2
      uitwerking: |-
        Het kgv van 2 en 3 is 6: $21x + 6y = 9$ en $6x - 6y = 2$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    snijpunt van twee rechten berekenen
  opgave: |-
    Bereken het snijpunt van de twee rechten.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = 3x - 2$ \ en \ $y = -x + 6$
      antwoord: |-
        $(2, 4)$
      uitwerking: |-
        $3x - 2 = -x + 6$, $4x = 8$, $x = 2$, $y = 4$.
    - opgave: |-
        $y = \tfrac12 x + 1$ \ en \ $x + y = 7$
      antwoord: |-
        $(4, 3)$
      uitwerking: |-
        $x + \tfrac12 x + 1 = 7$, $\tfrac32 x = 6$, $x = 4$, $y = 3$.
    - opgave: |-
        $2x - y = 5$ \ en \ $x + 3y = -1$
      antwoord: |-
        $(2, -1)$
      uitwerking: |-
        $y = 2x - 5$, $x + 3(2x - 5) = -1$, $7x = 14$, $x = 2$, $y = -1$.
    - opgave: |-
        $x = 4$ \ en \ $3x - 2y = 2$
      antwoord: |-
        $(4, 5)$
      uitwerking: |-
        $12 - 2y = 2$, $y = 5$. Op de verticale rechte $x = 4$ is $x$ al gekend.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    beide methodes vergelijken
  opgave: |-
    Los op met substitutie, en daarna nog eens met combinatie. Welke methode vond je het snelst?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{x + y &{}= 8}{3x - y &{}= 4}$
      antwoord: |-
        $(3, 5)$
      uitwerking: |-
        Substitutie: $y = 8 - x$, $3x - 8 + x = 4$, $x = 3$, $y = 5$. Combinatie: optellen geeft $4x = 12$ meteen. Combinatie is hier sneller.
    - opgave: |-
        $\stelsel{2x - y &{}= 4}{3x + 2y &{}= 13}$
      antwoord: |-
        $(3, 2)$
      uitwerking: |-
        Substitutie: $y = 2x - 4$, $3x + 4x - 8 = 13$, $x = 3$, $y = 2$. Combinatie: de eerste maal 2, optellen: $7x = 21$. Even snel.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    stelsels oplossen, methode naar keuze
  opgave: |-
    Los op met de methode die jij het handigst vindt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{y &{}= -2x + 7}{y &{}= x - 2}$
      antwoord: |-
        $(3, 1)$
      uitwerking: |-
        $-2x + 7 = x - 2$, $9 = 3x$, $x = 3$, $y = 1$.
    - opgave: |-
        $\stelsel{2x + y &{}= 1}{3x - y &{}= 9}$
      antwoord: |-
        $(2, -3)$
      uitwerking: |-
        Optellen: $5x = 10$, $x = 2$, $y = 1 - 4 = -3$.
    - opgave: |-
        $\stelsel{x + y &{}= 10}{3x + 5y &{}= 38}$
      antwoord: |-
        $(6, 4)$
      uitwerking: |-
        $x = 10 - y$, $30 - 3y + 5y = 38$, $y = 4$, $x = 6$.
    - opgave: |-
        $\stelsel{5x + 3y &{}= 7}{2x + 3y &{}= 1}$
      antwoord: |-
        $(2, -1)$
      uitwerking: |-
        Aftrekken: $3x = 6$, $x = 2$, en $4 + 3y = 1$ geeft $y = -1$.
    - opgave: |-
        $\stelsel{x - 3y &{}= 4}{2x + y &{}= 1}$
      antwoord: |-
        $(1, -1)$
      uitwerking: |-
        $x = 4 + 3y$, $8 + 6y + y = 1$, $y = -1$, $x = 1$.
    - opgave: |-
        $\stelsel{3x - 4y &{}= 0}{5x - 6y &{}= 2}$
      antwoord: |-
        $(4, 3)$
      uitwerking: |-
        Maal 3 en maal $-2$: $9x - 12y = 0$ en $-10x + 12y = -4$. Optellen: $-x = -4$, $x = 4$, $y = 3$.
    - opgave: |-
        $\stelsel{y &{}= 4x}{6x - y &{}= 5}$
      antwoord: |-
        $\bigl(\tfrac52, 10\bigr)$
      uitwerking: |-
        $6x - 4x = 5$, $x = \tfrac52$, $y = 10$.
    - opgave: |-
        $\stelsel{7x + 2y &{}= 3}{3x + 5y &{}= -7}$
      antwoord: |-
        $(1, -2)$
      uitwerking: |-
        Maal 5 en maal $-2$: $35x + 10y = 15$ en $-6x - 10y = 14$. Optellen: $29x = 29$, $x = 1$, $y = -2$.

# --- Opdrachten, niveau 2 --------------------------------------------------------------

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    strijdig, onbepaald of één oplossing
  opgave: |-
    Los op. Noteer $V$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\stelsel{4x - 6y &{}= 2}{6x - 9y &{}= 3}$
      antwoord: |-
        onbepaald
      uitwerking: |-
        Maal 3 en maal $-2$: $12x - 18y = 6$ en $-12x + 18y = -6$, optellen geeft $0 = 0$. $V = \{(x, y) \mid 2x - 3y = 1\}$.
    - opgave: |-
        $\stelsel{x + 2y &{}= 3}{3x + 6y &{}= 6}$
      antwoord: |-
        $V = \emptyset$
      uitwerking: |-
        De eerste maal $-3$: $-3x - 6y = -9$. Optellen: $0 = -3$, strijdig.
    - opgave: |-
        $\stelsel{2x - y &{}= 4}{x + 3y &{}= 9}$
      antwoord: |-
        $(3, 2)$
      uitwerking: |-
        $y = 2x - 4$, $x + 6x - 12 = 9$, $x = 3$, $y = 2$.
    - opgave: |-
        $\stelsel{y &{}= 3x + 1}{6x - 2y &{}= 4}$
      antwoord: |-
        $V = \emptyset$
      uitwerking: |-
        $6x - 2(3x + 1) = 4$ geeft $-2 = 4$, of $0 = 6$: strijdig.
    - opgave: |-
        $\stelsel{-x + 4y &{}= 2}{3x - 12y &{}= -6}$
      antwoord: |-
        onbepaald
      uitwerking: |-
        De eerste maal 3, optellen: $0 = 0$. $V = \{(x, y) \mid -x + 4y = 2\}$.
    - opgave: |-
        $\stelsel{5x + 2y &{}= 3}{10x + 4y &{}= 3}$
      antwoord: |-
        $V = \emptyset$
      uitwerking: |-
        De eerste maal $-2$, optellen: $0 = -3$, strijdig.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    fouten zoeken
  opgave: |-
    Zoek de fout en los correct op.
  lijst: enumerate
  delen:
    - opgave: |-
        Lien lost $\stelsel{3x + y &{}= 5}{2x - 3y &{}= 7}$ op. Ze schrijft $y = 5 - 3x$ en daarna $2x - 3 \cdot 5 - 3x = 7$.
      antwoord: |-
        haakjes vergeten; $(2, -1)$
      uitwerking: |-
        De uitdrukking $5 - 3x$ moet tussen haakjes: $2x - 3(5 - 3x) = 7$, dus $2x - 15 + 9x = 7$, $11x = 22$, $x = 2$ en $y = -1$.
    - opgave: |-
        Noah lost $\stelsel{2x + 3y &{}= 8}{4x - y &{}= 2}$ op. Hij vermenigvuldigt de eerste vergelijking met 2 en schrijft $4x + 6y = 8$.
      antwoord: |-
        rechterlid niet vermenigvuldigd; $(1, 2)$
      uitwerking: |-
        Ook het rechterlid gaat maal 2: $4x + 6y = 16$. Aftrekken van $4x - y = 2$: $7y = 14$, $y = 2$ en $x = 1$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    eerst herleiden: haakjes
  opgave: |-
    Herleid en los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{3(x + 1) - 2y &{}= 11}{2x + (y - 4) &{}= 6}$
      antwoord: |-
        $(4, 2)$
      uitwerking: |-
        Herleid: $3x - 2y = 8$ en $2x + y = 10$. Met $y = 10 - 2x$: $3x - 20 + 4x = 8$, $x = 4$, $y = 2$.
    - opgave: |-
        $\stelsel{2(x - y) + 3 &{}= x}{4x - 3(y + 1) &{}= -5}$
      antwoord: |-
        $(1, 2)$
      uitwerking: |-
        Herleid: $x - 2y = -3$ en $4x - 3y = -2$. Met $x = 2y - 3$: $8y - 12 - 3y = -2$, $y = 2$, $x = 1$.
    - opgave: |-
        $\stelsel{5x - 2(x + y) &{}= 4}{3(x - 1) &{}= y + 2}$
      antwoord: |-
        $(2, 1)$
      uitwerking: |-
        Herleid: $3x - 2y = 4$ en $3x - y = 5$. Aftrekken: $-y = -1$, $y = 1$, $x = 2$.
    - opgave: |-
        $\stelsel{2(3x - y) &{}= x + 11}{x - 4(y - 1) &{}= -1}$
      antwoord: |-
        $(3, 2)$
      uitwerking: |-
        Herleid: $5x - 2y = 11$ en $x - 4y = -5$. Met $x = 4y - 5$: $20y - 25 - 2y = 11$, $y = 2$, $x = 3$.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    grafisch en algebraïsch vergelijken
  opgave: |-
    De figuur toont de rechten $a$: $y = -\tfrac12 x + 4$ en $b$: $y = 2x - 2$.
  figuur:
    code: |-
      \begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
        \rooster{-1}{1}{6}{-2}{1}{5}
        \rechte{-1}{6}{-1/2}{4}
        \rechte[tweede]{0}{3.5}{2}{-2}
        \node[accent,right] at (6,1) {$a$};
        \node[inkt,right] at (3.5,5) {$b$};
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Lees het snijpunt af, zo goed als je kunt.
      antwoord: |-
        ongeveer $(2{,}5;\ 3)$
      uitwerking: |-
        Het snijpunt ligt tussen $x = 2$ en $x = 3$, net onder $y = 3$: ongeveer $(2{,}5;\ 3)$.
    - opgave: |-
        Bereken het snijpunt exact.
      antwoord: |-
        $(2{,}4;\ 2{,}8)$
      uitwerking: |-
        $-\tfrac12 x + 4 = 2x - 2$, maal 2: $-x + 8 = 4x - 4$, $5x = 12$, $x = 2{,}4$ en $y = 2 \cdot 2{,}4 - 2 = 2{,}8$.
    - opgave: |-
        Hoeveel scheelde je aflezing in $x$ en in $y$?
      antwoord: |-
        bijvoorbeeld $0{,}1$ en $0{,}2$
      uitwerking: |-
        Met de aflezing $(2{,}5;\ 3)$: $0{,}1$ te veel in $x$ en $0{,}2$ te veel in $y$. Een aflezing is een benadering.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    eerst herleiden: breuken en kommagetallen
  opgave: |-
    Herleid en los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{\dfrac x2 - \dfrac y3 &{}= 1}{x + y &{}= 7}$
      antwoord: |-
        $(4, 3)$
      uitwerking: |-
        Maal 6: $3x - 2y = 6$. Met $y = 7 - x$: $3x - 14 + 2x = 6$, $x = 4$, $y = 3$.
    - opgave: |-
        $\stelsel{\dfrac x4 + \dfrac y2 &{}= 3}{\rule{0pt}{3.6ex}\dfrac x2 - \dfrac y3 &{}= 2}$
      antwoord: |-
        $(6, 3)$
      uitwerking: |-
        Maal 4 en maal 6: $x + 2y = 12$ en $3x - 2y = 12$. Optellen: $4x = 24$, $x = 6$, $y = 3$.
    - opgave: |-
        $\stelsel{0{,}5x + 0{,}2y &{}= 1{,}9}{0{,}3x - 0{,}1y &{}= 0{,}7}$
      antwoord: |-
        $(3, 2)$
      uitwerking: |-
        Maal 10: $5x + 2y = 19$ en $3x - y = 7$. De tweede maal 2, optellen: $11x = 33$, $x = 3$, $y = 2$.
    - opgave: |-
        $\stelsel{1{,}2x - y &{}= 0{,}4}{x + 0{,}5y &{}= 3}$
      antwoord: |-
        $(2, 2)$
      uitwerking: |-
        $y = 1{,}2x - 0{,}4$, dus $x + 0{,}6x - 0{,}2 = 3$, $1{,}6x = 3{,}2$, $x = 2$, $y = 2$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift van een rechte met een stelsel
  opgave: |-
    De rechte $y = mx + q$ gaat door de twee punten. Vul de coördinaten in, zodat je een stelsel in $m$ en $q$ krijgt. Los het op en geef het voorschrift.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(1, 5)$ en $(3, 9)$
      antwoord: |-
        $y = 2x + 3$
      uitwerking: |-
        $\stelsel{m + q &{}= 5}{3m + q &{}= 9}$. Aftrekken: $2m = 4$, $m = 2$, $q = 3$.
    - opgave: |-
        $(-2, 7)$ en $(4, -2)$
      antwoord: |-
        $y = -\tfrac32 x + 4$
      uitwerking: |-
        $\stelsel{-2m + q &{}= 7}{4m + q &{}= -2}$. Aftrekken: $6m = -9$, $m = -\tfrac32$, $q = 7 - 3 = 4$.
    - opgave: |-
        $(2, 1)$ en $(6, 3)$
      antwoord: |-
        $y = \tfrac12 x$
      uitwerking: |-
        $\stelsel{2m + q &{}= 1}{6m + q &{}= 3}$. Aftrekken: $4m = 2$, $m = \tfrac12$, $q = 0$.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    0 = 0 en 0 = 6 begrijpen
  opgave: |-
    Leg uit wat er fout is aan de redenering, en geef de juiste $V$.
  lijst: enumerate
  delen:
    - opgave: |-
        Sara lost $\stelsel{2x - y &{}= 3}{-4x + 2y &{}= -6}$ op en vindt $0 = 0$. Ze besluit dat $V = \{(0, 0)\}$.
      antwoord: |-
        $V = \{(x, y) \mid 2x - y = 3\}$
      uitwerking: |-
        $0 = 0$ is een ware uitspraak voor elk koppel: het stelsel is onbepaald, de rechten vallen samen. $(0, 0)$ is zelfs geen oplossing, want $0 - 0 \neq 3$. $V = \{(x, y) \mid 2x - y = 3\}$.
    - opgave: |-
        Tim lost $\stelsel{y &{}= 3x - 2}{6x - 2y &{}= 10}$ op en vindt $0 = 6$. Hij schrijft: ``dus $x = 0$, en dan $y = -2$.''
      antwoord: |-
        $V = \emptyset$
      uitwerking: |-
        Na substitutie: $6x - 6x + 4 = 10$, of $0 = 6$. Die uitspraak is vals voor elke $x$: er is geen oplossing. $(0, -2)$ voldoet niet aan de tweede vergelijking ($0 + 4 \neq 10$). $V = \emptyset$, de rechten zijn evenwijdig.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    stelsels oplossen, methode naar keuze
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\stelsel{y &{}= 0{,}5x + 2}{y &{}= -x + 8}$
      antwoord: |-
        $(4, 4)$
      uitwerking: |-
        $0{,}5x + 2 = -x + 8$, $1{,}5x = 6$, $x = 4$, $y = 4$.
    - opgave: |-
        $\stelsel{3x + 2y &{}= 0}{x - y &{}= 5}$
      antwoord: |-
        $(2, -3)$
      uitwerking: |-
        $x = 5 + y$, $15 + 3y + 2y = 0$, $y = -3$, $x = 2$.
    - opgave: |-
        $\stelsel{-2x + 5y &{}= 1}{3x - 4y &{}= 2}$
      antwoord: |-
        $(2, 1)$
      uitwerking: |-
        Maal 3 en maal 2: $-6x + 15y = 3$ en $6x - 8y = 4$. Optellen: $7y = 7$, $y = 1$, $x = 2$.
    - opgave: |-
        $\stelsel{x &{}= 2y}{3x - 4y &{}= 5}$
      antwoord: |-
        $\bigl(5, \tfrac52\bigr)$
      uitwerking: |-
        $6y - 4y = 5$, $y = \tfrac52$, $x = 5$.
    - opgave: |-
        $\stelsel{8x - 3y &{}= 1}{4x + 9y &{}= 11}$
      antwoord: |-
        $\bigl(\tfrac12, 1\bigr)$
      uitwerking: |-
        De tweede maal $-2$: $-8x - 18y = -22$. Optellen: $-21y = -21$, $y = 1$, en $8x = 4$ geeft $x = \tfrac12$.
    - opgave: |-
        $\stelsel{2x + 7y &{}= -3}{3x + 5y &{}= 1}$
      antwoord: |-
        $(2, -1)$
      uitwerking: |-
        Maal 3 en maal $-2$: $6x + 21y = -9$ en $-6x - 10y = -2$. Optellen: $11y = -11$, $y = -1$, $x = 2$.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    context: twee vaten
  opgave: |-
    Vat A bevat 120 liter water en loopt leeg met 6 liter per minuut. Tegelijk wordt vat B, met al 30 liter, gevuld met 4 liter per minuut. Na $t$ minuten zit er $v$ liter in een vat.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf voor elk vat $v$ in functie van $t$. Welk stelsel krijg je?
      antwoord: |-
        $v = 120 - 6t$ en $v = 30 + 4t$
      uitwerking: |-
        $\stelsel{v &{}= 120 - 6t}{v &{}= 30 + 4t}$
    - opgave: |-
        Na hoeveel minuten zit er in beide vaten evenveel water? Hoeveel is dat?
      antwoord: |-
        na 9 minuten, 66 liter
      uitwerking: |-
        $120 - 6t = 30 + 4t$, $90 = 10t$, $t = 9$. Dan $v = 120 - 54 = 66$. Controle: $30 + 36 = 66$.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    zelf een stelsel opstellen
  opgave: |-
    Schrijf zelf een stelsel op dat aan de voorwaarde voldoet. Er zijn veel goede antwoorden.
  lijst: enumerate
  delen:
    - opgave: |-
        Het stelsel heeft $(2, -1)$ als oplossing, en je lost het makkelijk op met substitutie.
      antwoord: |-
        bijvoorbeeld $y = x - 3$ en $x + y = 1$
      uitwerking: |-
        Bijvoorbeeld $\stelsel{y &{}= x - 3}{x + y &{}= 1}$: controleer dat $(2, -1)$ aan beide voldoet.
    - opgave: |-
        Het stelsel heeft $(2, -1)$ als oplossing, en je lost het makkelijk op door op te tellen.
      antwoord: |-
        bijvoorbeeld $x + y = 1$ en $x - y = 3$
      uitwerking: |-
        Bijvoorbeeld $\stelsel{x + y &{}= 1}{x - y &{}= 3}$: de coëfficiënten van $y$ zijn tegengesteld.
    - opgave: |-
        Het stelsel bevat de vergelijking $x + 3y = -1$ en is strijdig.
      antwoord: |-
        bijvoorbeeld $2x + 6y = 5$
      uitwerking: |-
        De tweede vergelijking moet een veelvoud zijn van het linkerlid, met een ander rechterlid: bijvoorbeeld $2x + 6y = 5$ (want $-2 \neq 5$). Optellen na maal $-2$ geeft $0 = 7$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    drie rechten door één punt
  opgave: |-
    Gaan de drie rechten door één punt? Bereken het snijpunt van de eerste twee, en kijk of het op de derde ligt.
  lijst: enumerate
  delen:
    - opgave: |-
        $y = x + 1$, \ $y = -2x + 7$ \ en \ $x + 2y = 8$
      antwoord: |-
        ja, door $(2, 3)$
      uitwerking: |-
        $x + 1 = -2x + 7$, $x = 2$, $y = 3$. En $2 + 2 \cdot 3 = 8$: ja.
    - opgave: |-
        $2x - y = 1$, \ $x + y = 5$ \ en \ $3x - 2y = 4$
      antwoord: |-
        neen
      uitwerking: |-
        Optellen van de eerste twee: $3x = 6$, $x = 2$, $y = 3$. Maar $6 - 6 = 0 \neq 4$: neen.

- id: h2-o19
  pakketten: [2, 3, 4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    breuken met een som in de teller
  opgave: |-
    Herleid en los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{\dfrac{x + 1}{3} + \dfrac y2 &{}= 3}{\rule{0pt}{3.6ex}\dfrac{x - 1}{4} - \dfrac{y - 1}{2} &{}= \dfrac12}$
      antwoord: |-
        $(5, 2)$
      uitwerking: |-
        Maal 6: $2(x + 1) + 3y = 18$, dus $2x + 3y = 16$. Maal 4: $(x - 1) - 2(y - 1) = 2$, dus $x - 2y = 1$. Met $x = 1 + 2y$: $2 + 7y = 16$, $y = 2$, $x = 5$.
    - opgave: |-
        $\stelsel{\dfrac{2x - y}{3} &{}= \dfrac{x + 1}{2}}{\rule{0pt}{3.6ex}\dfrac x5 + \dfrac y2 &{}= \dfrac32}$
      antwoord: |-
        $(5, 1)$
      uitwerking: |-
        Maal 6: $2(2x - y) = 3(x + 1)$, dus $x - 2y = 3$. Maal 10: $2x + 5y = 15$. Met $x = 3 + 2y$: $6 + 9y = 15$, $y = 1$, $x = 5$.

- id: h2-o20
  pakketten: [5]
  soort: opdracht
  niveau: 2
  thema: |-
    regel van Cramer
  opgave: |-
    Los op met de regel van Cramer.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{3x - y &{}= 5}{2x + 3y &{}= 18}$
      antwoord: |-
        $(3, 4)$
      uitwerking: |-
        $D = 9 + 2 = 11$, $x = \tfrac{15 + 18}{11} = 3$, $y = \tfrac{54 - 10}{11} = 4$.
    - opgave: |-
        $\stelsel{4x + 3y &{}= 1}{6x - 5y &{}= 11}$
      antwoord: |-
        $(1, -1)$
      uitwerking: |-
        $D = -20 - 18 = -38$, $x = \tfrac{-5 - 33}{-38} = 1$, $y = \tfrac{44 - 6}{-38} = -1$.
    - opgave: |-
        $\stelsel{\tfrac12 x + 2y &{}= 3}{3x - 4y &{}= 2}$
      antwoord: |-
        $(2, 1)$
      uitwerking: |-
        $D = -2 - 6 = -8$, $x = \tfrac{-12 - 4}{-8} = 2$, $y = \tfrac{1 - 9}{-8} = 1$.
    - opgave: |-
        $\stelsel{2x - 3y &{}= 1}{-4x + 6y &{}= 5}$
      antwoord: |-
        $D = 0$; strijdig
      uitwerking: |-
        $D = 12 - 12 = 0$. De eerste maal 2 en optellen: $0 = 7$. Strijdig: evenwijdige rechten.

# --- Opdrachten, niveau 3 --------------------------------------------------------------

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    coëfficiënten bepalen
  opgave: |-
    Bepaal de getallen $a$ en $b$ zodat $(2, 1)$ een oplossing is van het stelsel $\stelsel{ax + by &{}= 8}{bx - ay &{}= 1}$
  antwoord: |-
    $a = 3$, $b = 2$
  uitwerking: |-
    Vul $x = 2$ en $y = 1$ in: $2a + b = 8$ en $2b - a = 1$. Dat is een stelsel in $a$ en $b$. Met $b = 8 - 2a$: $16 - 4a - a = 1$, $a = 3$ en $b = 2$. Controle: $6 + 2 = 8$ en $4 - 3 = 1$.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    stelsel met letters
  opgave: |-
    Gegeven het stelsel $\stelsel{x + y &{}= s}{x - y &{}= d}$, met $s$ en $d$ vaste getallen.
  lijst: enumerate
  delen:
    - opgave: |-
        Los het stelsel op: druk $x$ en $y$ uit in $s$ en $d$.
      antwoord: |-
        $x = \tfrac{s + d}{2}$, $y = \tfrac{s - d}{2}$
      uitwerking: |-
        Optellen: $2x = s + d$, dus $x = \tfrac{s + d}{2}$. Aftrekken: $2y = s - d$, dus $y = \tfrac{s - d}{2}$. Er is altijd precies één oplossing.
    - opgave: |-
        Twee getallen hebben som 50 en verschil 14. Welke getallen zijn het? Gebruik je formules.
      antwoord: |-
        32 en 18
      uitwerking: |-
        $s = 50$ en $d = 14$: $x = \tfrac{64}{2} = 32$ en $y = \tfrac{36}{2} = 18$.

- id: h2-o23
  soort: opdracht
  niveau: 3
  thema: |-
    drie rechten door één punt, met een onbekend getal
  opgave: |-
    Bepaal het getal $k$ zodat de rechten $2x + y = 7$, $x - y = 2$ en $kx + y = 5$ door één punt gaan.
  antwoord: |-
    $k = \tfrac43$
  uitwerking: |-
    Het snijpunt van de eerste twee: optellen geeft $3x = 9$, $x = 3$ en $y = 1$. Dat punt moet op de derde rechte liggen: $3k + 1 = 5$, dus $k = \tfrac43$.

- id: h2-o24
  pakketten: [4, 5]
  soort: opdracht
  niveau: 3
  thema: |-
    stelsel met een parameter
  opgave: |-
    Los op en bespreek voor elke waarde van de parameter $m$.
  lijst: enumerate
  delen:
    - opgave: |-
        $\stelsel{mx + 2y &{}= 4}{3x + y &{}= 2}$
      antwoord: |-
        $m \neq 6$: $V = \{(0, 2)\}$; $m = 6$: onbepaald
      uitwerking: |-
        De tweede maal $-2$: $-6x - 2y = -4$. Optellen: $(m - 6)\,x = 0$. Voor $m \neq 6$ is $x = 0$ en $y = 2$. Voor $m = 6$ staat er $0 = 0$: de eerste vergelijking is dan het dubbel van de tweede, en het stelsel is onbepaald.
    - opgave: |-
        $\stelsel{x + my &{}= 1}{mx + 4y &{}= 2}$
      antwoord: |-
        $m \neq \pm 2$: $\bigl(\tfrac{2}{m + 2}, \tfrac{1}{m + 2}\bigr)$; $m = 2$: onbepaald; $m = -2$: strijdig
      uitwerking: |-
        De eerste maal $-m$: $-mx - m^2y = -m$. Optellen: $(4 - m^2)\,y = 2 - m$. Nu is $4 - m^2 = (2 - m)(2 + m)$. Voor $m \neq 2$ en $m \neq -2$: $y = \tfrac{2 - m}{(2 - m)(2 + m)} = \tfrac{1}{m + 2}$ en $x = 1 - \tfrac{m}{m + 2} = \tfrac{2}{m + 2}$. Voor $m = 2$: $0 = 0$, onbepaald. Voor $m = -2$: $0 = 4$, strijdig.

- id: h2-o25
  pakketten: [4, 5]
  soort: opdracht
  niveau: 3
  thema: |-
    drie vergelijkingen, drie onbekenden
  opgave: |-
    Een stelsel kan ook drie onbekenden en drie vergelijkingen hebben. Elimineer eerst $z$ uit twee paren vergelijkingen: dan hou je een stelsel in $x$ en $y$ over. Los op:
    \[ \stelseldrie{x + y + z &{}= 6}{2x - y + z &{}= 3}{x + 2y - z &{}= 2} \]
  antwoord: |-
    $x = 1$, $y = 2$, $z = 3$
  uitwerking: |-
    De eerste plus de derde: $2x + 3y = 8$. De tweede plus de derde: $3x + y = 5$. Met $y = 5 - 3x$: $2x + 15 - 9x = 8$, $x = 1$ en $y = 2$. Uit de eerste: $z = 6 - 1 - 2 = 3$. Controle: $2 - 2 + 3 = 3$ en $1 + 4 - 3 = 2$.

- id: h2-o26
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    stelsel in 1/x en 1/y
  opgave: |-
    Het stelsel $\stelsel{\dfrac2x + \dfrac3y &{}= 2}{\rule{0pt}{3.6ex}\dfrac4x - \dfrac3y &{}= 1}$ is geen stelsel van eerstegraadsvergelijkingen. Stel $u = \tfrac1x$ en $v = \tfrac1y$. Los het stelsel in $u$ en $v$ op, en bereken daarna $x$ en $y$.
  antwoord: |-
    $x = 2$, $y = 3$
  uitwerking: |-
    Het stelsel wordt $2u + 3v = 2$ en $4u - 3v = 1$. Optellen: $6u = 3$, $u = \tfrac12$, en $3v = 2 - 1 = 1$, $v = \tfrac13$. Dus $x = \tfrac1u = 2$ en $y = \tfrac1v = 3$. Controle: $1 + 1 = 2$ en $2 - 1 = 1$.

# --- Test jezelf -----------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Los op met substitutie: $\stelsel{y &{}= 2x + 1}{3x + y &{}= 11}$
  antwoord: |-
    $(2, 5)$
  uitwerking: |-
    $3x + 2x + 1 = 11$, $5x = 10$, $x = 2$ en $y = 5$.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Los op met combinatie: $\stelsel{4x + 3y &{}= 1}{2x - 5y &{}= 7}$
  antwoord: |-
    $(1, -1)$
  uitwerking: |-
    De tweede maal $-2$: $-4x + 10y = -14$. Optellen: $13y = -13$, $y = -1$, en $4x - 3 = 1$ geeft $x = 1$.

- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    Bereken exact het snijpunt van de rechten $y = -x + 4$ en $y = 3x - 2$.
  antwoord: |-
    $\bigl(\tfrac32, \tfrac52\bigr)$
  uitwerking: |-
    $-x + 4 = 3x - 2$, $6 = 4x$, $x = \tfrac32$ en $y = -\tfrac32 + 4 = \tfrac52$.

- id: h2-t4
  soort: test
  niveau: 2
  opgave: |-
    Los op en noteer $V$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\stelsel{6x - 4y &{}= 2}{-3x + 2y &{}= 5}$
      antwoord: |-
        $V = \emptyset$
      uitwerking: |-
        De tweede maal 2, optellen: $0 = 12$. Strijdig.
    - opgave: |-
        $\stelsel{x + 3y &{}= 2}{2x + 6y &{}= 4}$
      antwoord: |-
        $V = \{(x, y) \mid x + 3y = 2\}$
      uitwerking: |-
        De eerste maal $-2$, optellen: $0 = 0$. Onbepaald.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Los op: $\stelsel{\dfrac x3 + \dfrac y2 &{}= 4}{x - y &{}= 2}$
  antwoord: |-
    $(6, 4)$
  uitwerking: |-
    Maal 6: $2x + 3y = 24$. Met $x = 2 + y$: $4 + 5y = 24$, $y = 4$ en $x = 6$.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Los op: $\stelsel{3(x - 2) + y &{}= 4}{2x - (y + 1) &{}= 9}$
  antwoord: |-
    $(4, -2)$
  uitwerking: |-
    Herleid: $3x + y = 10$ en $2x - y = 10$. Optellen: $5x = 20$, $x = 4$, $y = -2$.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Een vliegtuig daalt vanaf 9000~m met 300~m per minuut. Een ander vliegtuig stijgt tegelijk vanaf 1200~m met 450~m per minuut. Na hoeveel minuten vliegen ze even hoog, en op welke hoogte?
  antwoord: |-
    na $10{,}4$ minuten, op 5880~m
  uitwerking: |-
    $\stelsel{h &{}= 9000 - 300t}{h &{}= 1200 + 450t}$. Gelijkstellen: $7800 = 750t$, $t = 10{,}4$ minuten (10 minuten en 24 seconden). Dan $h = 9000 - 3120 = 5880$~m. Controle: $1200 + 4680 = 5880$.

- id: h2-t8
  pakketten: [5]
  soort: test
  niveau: 2
  opgave: |-
    Los op met de regel van Cramer: $\stelsel{2x + 5y &{}= 1}{3x - 4y &{}= 13}$
  antwoord: |-
    $(3, -1)$
  uitwerking: |-
    $D = -8 - 15 = -23$, $x = \tfrac{-4 - 65}{-23} = 3$, $y = \tfrac{26 - 3}{-23} = -1$.
