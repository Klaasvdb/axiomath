- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    een zijde berekenen
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=.6,font=\scriptsize]
        \coordinate (A) at (0,0); \coordinate (C) at (4.4,0); \coordinate (B) at (4.4,2.8);
        \filldraw[fill=accent!15,draw=accent,thick] (A) -- (C) -- (B) -- cycle;
        \rechtehoek{A}{C}{B}
        \node[below left] at (A) {$A$}; \node[below right] at (C) {$C$}; \node[above right] at (B) {$B$};
      \end{tikzpicture}
  opgave: |-
    Driehoek $ABC$ is rechthoekig in $C$. Bereken de gevraagde zijde, afgerond op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        $\lengte{AB} = 10$, $\hoek{A} = 30^\circ$; bereken $\lengte{BC}$.
      antwoord: |-
        $5$
      uitwerking: |-
        $\lengte{BC} = 10 \sin 30^\circ = 5$.
    - opgave: |-
        $\lengte{AC} = 6$, $\hoek{A} = 50^\circ$; bereken $\lengte{BC}$.
      antwoord: |-
        $7{,}15$
      uitwerking: |-
        $\lengte{BC} = 6 \tan 50^\circ \approx 7{,}15$.
    - opgave: |-
        $\lengte{BC} = 4$, $\hoek{A} = 20^\circ$; bereken $\lengte{AB}$.
      antwoord: |-
        $11{,}70$
      uitwerking: |-
        $\sin 20^\circ = \tfrac{4}{\lengte{AB}}$, dus $\lengte{AB} = \tfrac{4}{\sin 20^\circ} \approx 11{,}70$.
    - opgave: |-
        $\lengte{AC} = 7{,}5$, $\hoek{B} = 62^\circ$; bereken $\lengte{AB}$.
      antwoord: |-
        $8{,}49$
      uitwerking: |-
        Ten opzichte van $\hoek{B}$ is $[AC]$ de overstaande zijde: $\lengte{AB} = \tfrac{7{,}5}{\sin 62^\circ} \approx 8{,}49$.
    - opgave: |-
        $\lengte{AB} = 12$, $\hoek{B} = 35^\circ$; bereken $\lengte{BC}$.
      antwoord: |-
        $9{,}83$
      uitwerking: |-
        Ten opzichte van $\hoek{B}$ is $[BC]$ de aanliggende zijde: $\lengte{BC} = 12 \cos 35^\circ \approx 9{,}83$.
    - opgave: |-
        $\lengte{BC} = 3{,}2$, $\hoek{B} = 71^\circ$; bereken $\lengte{AC}$.
      antwoord: |-
        $9{,}29$
      uitwerking: |-
        Ten opzichte van $\hoek{B}$: overstaand $[AC]$, aanliggend $[BC]$. Dus $\lengte{AC} = 3{,}2 \tan 71^\circ \approx 9{,}29$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    een hoek berekenen
  opgave: |-
    Driehoek $ABC$ is rechthoekig in $C$ (zoals in de figuur bij opdracht \ref{oef:h2-o4}). Bereken de gevraagde hoek, afgerond op $0{,}01^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        $\lengte{BC} = 3$, $\lengte{AC} = 4$; bereken $\hoek{A}$.
      antwoord: |-
        $36{,}87^\circ$
      uitwerking: |-
        $\tan\hoek{A} = \tfrac34$.
    - opgave: |-
        $\lengte{AB} = 13$, $\lengte{BC} = 5$; bereken $\hoek{A}$.
      antwoord: |-
        $22{,}62^\circ$
      uitwerking: |-
        $\sin\hoek{A} = \tfrac{5}{13}$.
    - opgave: |-
        $\lengte{AC} = 2$, $\lengte{AB} = 7$; bereken $\hoek{A}$.
      antwoord: |-
        $73{,}40^\circ$
      uitwerking: |-
        $\cos\hoek{A} = \tfrac27$.
    - opgave: |-
        $\lengte{BC} = 9$, $\lengte{AC} = 4$; bereken $\hoek{B}$.
      antwoord: |-
        $23{,}96^\circ$
      uitwerking: |-
        Ten opzichte van $\hoek{B}$ is $[AC]$ overstaand en $[BC]$ aanliggend: $\tan\hoek{B} = \tfrac49$.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    grondformule en tangens als quotiënt
  opgave: |-
    Bereken de twee andere goniometrische getallen van de scherpe hoek $\alpha$, zonder de hoek te berekenen. Geef exacte waarden, of benaderingen op vier decimalen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin\alpha = 0{,}6$
      antwoord: |-
        $\cos\alpha = 0{,}8$, $\tan\alpha = 0{,}75$
      uitwerking: |-
        $\cos^2\alpha = 1 - 0{,}36 = 0{,}64$; $\tan\alpha = \tfrac{0{,}6}{0{,}8}$.
    - opgave: |-
        $\cos\alpha = 0{,}28$
      antwoord: |-
        $\sin\alpha = 0{,}96$, $\tan\alpha = \tfrac{24}{7} \approx 3{,}4286$
      uitwerking: |-
        $\sin^2\alpha = 1 - 0{,}0784 = 0{,}9216$; $\tan\alpha = \tfrac{0{,}96}{0{,}28} = \tfrac{24}{7}$.
    - opgave: |-
        $\sin\alpha = \tfrac{8}{17}$
      antwoord: |-
        $\cos\alpha = \tfrac{15}{17}$, $\tan\alpha = \tfrac{8}{15}$
      uitwerking: |-
        $\cos^2\alpha = 1 - \tfrac{64}{289} = \tfrac{225}{289}$.
    - opgave: |-
        $\cos\alpha = 0{,}5$
      antwoord: |-
        $\sin\alpha \approx 0{,}8660$, $\tan\alpha \approx 1{,}7321$
      uitwerking: |-
        $\sin\alpha = \sqrt{0{,}75}$ en $\tan\alpha = \tfrac{\sqrt{0{,}75}}{0{,}5}$. (Exact: $\tfrac{\sqrt3}{2}$ en $\sqrt3$.)

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    een rechthoekige driehoek oplossen
  opgave: |-
    Los de driehoek op. Rond zijden af op twee decimalen en hoeken op $0{,}01^\circ$. Maak eerst een schets.
  lijst: enumerate
  delen:
    - opgave: |-
        Driehoek $PQR$ is rechthoekig in $Q$, met $\lengte{PQ} = 8$ en $\hoek{P} = 34^\circ$.
      antwoord: |-
        $\hoek{R} = 56^\circ$, $\lengte{QR} \approx 5{,}40$, $\lengte{PR} \approx 9{,}65$
      uitwerking: |-
        $\hoek{R} = 90^\circ - 34^\circ$. $\lengte{QR} = 8 \tan 34^\circ \approx 5{,}40$ en $\lengte{PR} = \tfrac{8}{\cos 34^\circ} \approx 9{,}65$.
    - opgave: |-
        Driehoek $KLM$ is rechthoekig in $L$, met $\lengte{KL} = 6$ en $\lengte{LM} = 11$.
      antwoord: |-
        $\lengte{KM} \approx 12{,}53$, $\hoek{K} \approx 61{,}39^\circ$, $\hoek{M} \approx 28{,}61^\circ$
      uitwerking: |-
        $\lengte{KM} = \sqrt{36 + 121} = \sqrt{157} \approx 12{,}53$. $\tan\hoek{K} = \tfrac{11}{6}$, dus $\hoek{K} \approx 61{,}39^\circ$, en $\hoek{M} = 90^\circ - \hoek{K} \approx 28{,}61^\circ$.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    ladder
  opgave: |-
    Een ladder van 7~m staat veilig als hij een hoek van $75^\circ$ maakt met de grond. Rond af op een centimeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe hoog komt de ladder dan tegen de muur?
      antwoord: |-
        $6{,}76$~m
      uitwerking: |-
        $7 \sin 75^\circ \approx 6{,}76$.
    - opgave: |-
        Hoe ver staat de voet van de muur?
      antwoord: |-
        $1{,}81$~m
      uitwerking: |-
        $7 \cos 75^\circ \approx 1{,}81$.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    vlieger
  figuur:
    opties: |-
      2.8cm
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \draw[lijngrijs] (-.5,0) -- (5,0);
        \coordinate (H) at (0,.5); \coordinate (V) at (3.6,4.5); \coordinate (G) at (3.6,.5);
        \draw[grijs] (0,0) -- (H);
        \draw[accent,thick] (H) -- (V);
        \draw[grijs,dashed] (H) -- (G) -- (V);
        \filldraw[fill=accent!30,draw=accent] (3.6,4.5) -- (3.9,4.9) -- (3.6,5.5) -- (3.3,4.9) -- cycle;
        \hoeklabel{G}{H}{V}{6mm}{48^\circ}
        \node[above left] at (1.8,2.5) {60 m};
      \end{tikzpicture}
  opgave: |-
    Elif laat een vlieger op. Het touw is 60~m lang, staat strak en maakt een hoek van $48^\circ$ met de horizontale. Ze houdt het touw 1~m boven de grond vast. Hoe hoog vliegt de vlieger, afgerond op een decimeter?
  antwoord: |-
    $45{,}6$~m
  uitwerking: |-
    Boven de hand: $60 \sin 48^\circ \approx 44{,}59$~m. Plus 1~m: ongeveer $45{,}6$~m.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    dieptehoek
  opgave: |-
    Je staat op een brug, 28~m boven het water. Een boot vaart recht op de brug af. Rond af op een centimeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Je ziet de boot onder een dieptehoek van $18^\circ$. Hoe ver ligt de boot horizontaal van de brug?
      antwoord: |-
        $86{,}18$~m
      uitwerking: |-
        $\tfrac{28}{\tan 18^\circ} \approx 86{,}18$.
    - opgave: |-
        Even later is de dieptehoek $35^\circ$. Hoeveel meter heeft de boot intussen afgelegd?
      antwoord: |-
        $46{,}19$~m
      uitwerking: |-
        Nu nog $\tfrac{28}{\tan 35^\circ} \approx 39{,}99$~m. De boot legde $86{,}18 - 39{,}99 = 46{,}19$~m af.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    hellingen
  opgave: |-
    Beantwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        Een verkeersbord meldt een helling van 15~\%. Welke hoek is dat, afgerond op $0{,}01^\circ$?
      antwoord: |-
        $8{,}53^\circ$
      uitwerking: |-
        $\tan^{-1} 0{,}15 \approx 8{,}53^\circ$.
    - opgave: |-
        Een helling voor een rolstoel mag hoogstens 5~\% zijn. Hoeveel meter horizontaal heb je minstens nodig om 0,4~m te stijgen?
      antwoord: |-
        $8$~m
      uitwerking: |-
        $\tfrac{0{,}4}{x} = 0{,}05$, dus $x = 8$.
    - opgave: |-
        Een weg maakt een hoek van $3^\circ$ met de horizontale. Wat is het hellingspercentage, afgerond op twee decimalen?
      antwoord: |-
        $5{,}24$~\%
      uitwerking: |-
        $\tan 3^\circ \approx 0{,}0524$.
    - opgave: |-
        Is een helling van 100~\% verticaal? Leg uit.
      antwoord: |-
        nee, $45^\circ$
      uitwerking: |-
        100~\% betekent $\tan\alpha = 1$: je stijgt even veel als je horizontaal opschuift. Dat is een hoek van $45^\circ$. Een verticale wand heeft geen hellingspercentage.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    schaduw
  opgave: |-
    De zon staat op een bepaald moment $28^\circ$ boven de horizon.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is dan de schaduw van een toren van 50~m, afgerond op een centimeter?
      antwoord: |-
        $94{,}04$~m
      uitwerking: |-
        $\tan 28^\circ = \tfrac{50}{s}$, dus $s = \tfrac{50}{\tan 28^\circ} \approx 94{,}04$.
    - opgave: |-
        Een uur later werpt een paal van 1,8~m een schaduw van 2,5~m. Hoe hoog staat de zon nu, afgerond op $0{,}01^\circ$?
      antwoord: |-
        $35{,}75^\circ$
      uitwerking: |-
        $\tan\alpha = \tfrac{1{,}8}{2{,}5} = 0{,}72$, dus $\alpha \approx 35{,}75^\circ$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    gelijkbenige driehoek
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[scale=.25,font=\scriptsize]
        \coordinate (A) at (-4.23,0); \coordinate (B) at (4.23,0); \coordinate (T) at (0,9.06); \coordinate (M) at (0,0);
        \filldraw[fill=accent!12,draw=accent,thick] (A) -- (B) -- (T) -- cycle;
        \draw[accent,dashed] (T) -- (M);
        \rechtehoek{B}{M}{T}
        \hoeklabel{A}{T}{B}{8mm}{50^\circ}
        \node[left] at (-2.2,4.6) {10}; \node[right] at (2.2,4.6) {10};
      \end{tikzpicture}
  opgave: |-
    Een gelijkbenige driehoek heeft benen van 10~cm en een tophoek van $50^\circ$. Bereken, afgerond op twee decimalen:
  lijst: enumerate
  delen:
    - opgave: |-
        de hoogte uit de top
      antwoord: |-
        $9{,}06$~cm
      uitwerking: |-
        De hoogte deelt de tophoek middendoor: $h = 10 \cos 25^\circ \approx 9{,}06$.
    - opgave: |-
        de basis
      antwoord: |-
        $8{,}45$~cm
      uitwerking: |-
        De halve basis is $10 \sin 25^\circ \approx 4{,}23$, dus de basis is $20 \sin 25^\circ \approx 8{,}45$.
    - opgave: |-
        de oppervlakte
      antwoord: |-
        $38{,}30$~cm$^2$
      uitwerking: |-
        $\tfrac12 \cdot 20 \sin 25^\circ \cdot 10 \cos 25^\circ = 100 \sin 25^\circ \cos 25^\circ \approx 38{,}30$. Wie met de afgeronde 8,45 en 9,06 rekent, vindt 38,28: reken dus met de niet-afgeronde waarden.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    rechthoek
  opgave: |-
    Een rechthoek is 15~cm lang. De diagonaal maakt een hoek van $32^\circ$ met de lange zijde. Bereken de breedte en de diagonaal, afgerond op twee decimalen.
  antwoord: |-
    breedte $9{,}37$~cm, diagonaal $17{,}69$~cm
  uitwerking: |-
    In de rechthoekige driehoek onder de diagonaal is de lange zijde aanliggend: breedte $15 \tan 32^\circ \approx 9{,}37$ en diagonaal $\tfrac{15}{\cos 32^\circ} \approx 17{,}69$.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    trap
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=.3,font=\scriptsize]
        \draw[accent,thick] (0,0) -- (2.6,0) -- (2.6,1.8) -- (5.2,1.8) -- (5.2,3.6) -- (7.8,3.6) -- (7.8,5.4);
        \draw[grijs,dashed] (0,0) -- (7.8,5.4);
        \node[below] at (1.3,0) {26}; \node[right] at (2.6,.9) {18};
      \end{tikzpicture}
  opgave: |-
    Elke trede van een trap is 18~cm hoog en 26~cm diep.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke hoek maakt de trap met de vloer, afgerond op $0{,}01^\circ$?
      antwoord: |-
        $34{,}70^\circ$
      uitwerking: |-
        $\tan\alpha = \tfrac{18}{26}$, dus $\alpha \approx 34{,}70^\circ$.
    - opgave: |-
        De trap heeft 15 treden en overbrugt 2,70~m. Hoe lang is een leuning die evenwijdig met de trap van onder tot boven loopt, afgerond op een millimeter?
      antwoord: |-
        $474{,}3$~cm
      uitwerking: |-
        De leuning is de schuine zijde bij een hoogte van 270~cm: $\tfrac{270}{\sin\alpha} \approx 474{,}3$~cm. Controle met Pythagoras: horizontaal $15 \cdot 26 = 390$~cm, en $\sqrt{270^2 + 390^2} \approx 474{,}3$.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    vliegtuig
  opgave: |-
    Een vliegtuig stijgt op onder een constante hoek van $12^\circ$ met de horizontale.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe hoog is het, als het 5~km langs zijn baan heeft afgelegd? Rond af op een meter.
      antwoord: |-
        $1040$~m
      uitwerking: |-
        De baan is de schuine zijde: $5000 \sin 12^\circ \approx 1039{,}6$, dus ongeveer 1040~m.
    - opgave: |-
        Hoe ver is het horizontaal van het startpunt op het moment dat het 3~km hoog is? Rond af op $0{,}1$~km.
      antwoord: |-
        $14{,}1$~km
      uitwerking: |-
        $\tan 12^\circ = \tfrac{3000}{x}$, dus $x = \tfrac{3000}{\tan 12^\circ} \approx 14\,114$~m, ongeveer 14,1~km.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    breedte van een rivier
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.55,font=\scriptsize]
        \fill[accent!10] (-.5,0) rectangle (3.4,3.2);
        \draw[lijngrijs] (-.5,0) -- (3.4,0) (-.5,3.2) -- (3.4,3.2);
        \coordinate (A) at (0,0); \coordinate (B) at (0,3.2); \coordinate (C) at (2,0);
        \draw[accent,thick] (A) -- (B) -- (C) -- cycle;
        \rechtehoek{C}{A}{B}
        \hoeklabel{B}{C}{A}{5mm}{58^\circ}
        \fill (A) circle (2pt) node[below] {$A$}; \fill (B) circle (2pt) node[above] {$B$}; \fill (C) circle (2pt) node[below] {$C$};
        \node[below] at (1,0) {40 m};
      \end{tikzpicture}
  opgave: |-
    Rik wil de breedte van een rivier kennen. Hij staat in $A$, recht tegenover een boom $B$ op de andere oever. Hij wandelt 40~m langs de oever naar $C$, en meet daar de hoek tussen de oever en de kijklijn naar de boom: $58^\circ$. Hoe breed is de rivier, afgerond op een centimeter?
  antwoord: |-
    $64{,}01$~m
  uitwerking: |-
    Driehoek $ABC$ is rechthoekig in $A$. Ten opzichte van $\hoek{C}$ is $[AB]$ overstaand en $[AC]$ aanliggend: $\lengte{AB} = 40 \tan 58^\circ \approx 64{,}01$~m.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    fouten zoeken
  opgave: |-
    Wat is er fout? Verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Lien typt $\sin 30$ op haar rekenmachine en krijgt $-0{,}988$.
      antwoord: |-
        rekenmachine niet in graden
      uitwerking: |-
        Een sinus van een scherpe hoek is positief. Haar rekenmachine staat in een andere eenheid (radialen). In graden is $\sin 30^\circ = 0{,}5$.
    - opgave: |-
        Tom schrijft: $\tan^{-1} 0{,}75 = \dfrac{1}{0{,}75} \approx 1{,}33$.
      antwoord: |-
        $\tan^{-1} 0{,}75 \approx 36{,}87^\circ$
      uitwerking: |-
        $\tan^{-1} 0{,}75$ is de hoek waarvan de tangens 0,75 is, geen omgekeerde.
    - opgave: |-
        Sara zoekt in driehoek $ABC$, rechthoekig in $C$, met $\lengte{AB} = 10$ en $\hoek{A} = 40^\circ$, de zijde $\lengte{BC}$. Ze schrijft $\lengte{BC} = 10 \cos 40^\circ$.
      antwoord: |-
        $\lengte{BC} = 10 \sin 40^\circ \approx 6{,}43$
      uitwerking: |-
        $[BC]$ ligt tegenover $\hoek{A}$: het is de overstaande zijde, dus de sinus. $10 \cos 40^\circ$ is $\lengte{AC}$.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    eigenschappen zonder rekenmachine
  opgave: |-
    Waar of niet waar? Leg uit zonder rekenmachine.
  lijst: enumerate
  delen:
    - opgave: |-
        Er bestaat een scherpe hoek $\alpha$ met $\sin\alpha = 1{,}2$.
      antwoord: |-
        niet waar
      uitwerking: |-
        De overstaande zijde is korter dan de schuine zijde, dus $\sin\alpha < 1$.
    - opgave: |-
        Er bestaat een scherpe hoek $\alpha$ met $\tan\alpha = 5$.
      antwoord: |-
        waar
      uitwerking: |-
        Neem een rechthoekige driehoek met rechthoekszijden 5 en 1.
    - opgave: |-
        $\cos 20^\circ > \cos 40^\circ$
      antwoord: |-
        waar
      uitwerking: |-
        Neem een schuine zijde van 1. Bij een grotere hoek ligt de schuine zijde steiler, en is de aanliggende zijde korter.
    - opgave: |-
        Als $\sin\alpha = \cos\alpha$, dan is $\alpha = 45^\circ$.
      antwoord: |-
        waar
      uitwerking: |-
        Dan zijn de overstaande en de aanliggende zijde even lang: de driehoek is gelijkbenig, en de scherpe hoeken zijn $45^\circ$.

- id: h2-o20
  soort: opdracht
  niveau: 2
  pakketten: [4, 5]
  thema: |-
    exacte waarden
  opgave: |-
    Bereken exact, zonder rekenmachine.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin^2 45^\circ + \cos 60^\circ$
      antwoord: |-
        $1$
      uitwerking: |-
        $\bigl(\tfrac{\sqrt2}{2}\bigr)^2 + \tfrac12 = \tfrac24 + \tfrac12 = 1$.
    - opgave: |-
        $\tan 60^\circ \cdot \sin 60^\circ$
      antwoord: |-
        $\tfrac32$
      uitwerking: |-
        $\sqrt3 \cdot \tfrac{\sqrt3}{2} = \tfrac32$.
    - opgave: |-
        de rechthoekszijden van een rechthoekige driehoek met schuine zijde 12 en een hoek van $30^\circ$
      antwoord: |-
        $6$ en $6\sqrt3$
      uitwerking: |-
        $12 \sin 30^\circ = 6$ en $12 \cos 30^\circ = 6\sqrt3$.
    - opgave: |-
        de scherpe hoeken van een rechthoekige driehoek met rechthoekszijden 5 en $5\sqrt3$
      antwoord: |-
        $30^\circ$ en $60^\circ$
      uitwerking: |-
        Voor de hoek tegenover 5: $\tan\alpha = \tfrac{5}{5\sqrt3} = \tfrac{1}{\sqrt3} = \tfrac{\sqrt3}{3}$, dus $\alpha = 30^\circ$; de andere hoek is $60^\circ$.

- id: h2-o21
  soort: opdracht
  niveau: 2
  pakketten: [4, 5]
  thema: |-
    complementaire hoeken
  opgave: |-
    Zonder rekenmachine.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\cos^2 35^\circ + \cos^2 55^\circ$.
      antwoord: |-
        $1$
      uitwerking: |-
        $\cos 55^\circ = \sin 35^\circ$, dus de som is $\cos^2 35^\circ + \sin^2 35^\circ = 1$.
    - opgave: |-
        Vereenvoudig $\dfrac{\sin(90^\circ - \alpha)}{\cos\alpha}$.
      antwoord: |-
        $1$
      uitwerking: |-
        $\sin(90^\circ - \alpha) = \cos\alpha$.
    - opgave: |-
        Toon aan dat $\tan\alpha \cdot \tan(90^\circ - \alpha) = 1$.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        $\tan(90^\circ - \alpha) = \tfrac{\sin(90^\circ - \alpha)}{\cos(90^\circ - \alpha)} = \tfrac{\cos\alpha}{\sin\alpha}$, dus het product is $\tfrac{\sin\alpha}{\cos\alpha} \cdot \tfrac{\cos\alpha}{\sin\alpha} = 1$.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    hoogte met twee metingen
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[scale=.034,font=\scriptsize]
        \coordinate (A) at (0,0); \coordinate (B) at (50,0); \coordinate (V) at (118.3,0); \coordinate (T) at (118.3,68.3);
        \draw[lijngrijs] (-5,0) -- (125,0);
        \draw[grijs,thick] (V) -- (T);
        \draw[accent,thick] (A) -- (T) (B) -- (T);
        \rechtehoek{A}{V}{T}
        \hoeklabel{V}{A}{T}{8mm}{30^\circ}
        \hoeklabel{V}{B}{T}{6mm}{45^\circ}
        \fill (A) circle (1.6pt) node[below] {$A$}; \fill (B) circle (1.6pt) node[below] {$B$};
        \node[below] at (25,0) {50 m}; \node[right] at (T) {$T$}; \node[right] at (118.3,34) {$h$};
      \end{tikzpicture}
  opgave: |-
    Vanuit $A$ zie je de top $T$ van een toren onder een hoogtehoek van $30^\circ$. Je stapt 50~m recht naar de toren toe, naar $B$. Nu is de hoogtehoek $45^\circ$. Je kunt niet tot aan de toren, dus de afstand $x$ van $B$ tot de voet ken je niet. Verwaarloos de ooghoogte.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit waarom $h = x$.
      antwoord: |-
        $\tan 45^\circ = 1$
      uitwerking: |-
        In $B$ is $\tan 45^\circ = \tfrac{h}{x} = 1$, dus $h = x$: de driehoek is gelijkbenig.
    - opgave: |-
        Toon aan dat $\tan 30^\circ = \dfrac{h}{h + 50}$, en bereken $h$, afgerond op een centimeter.
      antwoord: |-
        $68{,}30$~m
      uitwerking: |-
        Vanuit $A$ is de aanliggende zijde $x + 50 = h + 50$. Dus $h = (h + 50)\tan 30^\circ$, of $h(1 - \tan 30^\circ) = 50 \tan 30^\circ$, zodat $h = \tfrac{50 \tan 30^\circ}{1 - \tan 30^\circ} \approx 68{,}30$~m.

- id: h2-o23
  soort: opdracht
  niveau: 3
  thema: |-
    hoek in een kubus
  opgave: |-
    Een kubus heeft ribben van 1. Welke hoek maakt een ruimtediagonaal met het grondvlak, afgerond op $0{,}01^\circ$? Tip: de ruimtediagonaal, de diagonaal van het grondvlak en een opstaande ribbe vormen een rechthoekige driehoek.
  antwoord: |-
    $35{,}26^\circ$
  uitwerking: |-
    De diagonaal van het grondvlak is $\sqrt2$, de opstaande ribbe 1. Ten opzichte van de gezochte hoek is de ribbe overstaand en de diagonaal van het grondvlak aanliggend: $\tan\alpha = \tfrac{1}{\sqrt2}$, dus $\alpha \approx 35{,}26^\circ$. Het antwoord hangt niet af van de grootte van de kubus.

- id: h2-o24
  soort: opdracht
  niveau: 3
  thema: |-
    regelmatige vijfhoek
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[scale=.9,font=\scriptsize]
        \coordinate (M) at (0,0);
        \filldraw[fill=accent!10,draw=accent,thick] (90:1.2) -- (162:1.2) -- (234:1.2) -- (306:1.2) -- (18:1.2) -- cycle;
        \coordinate (P) at (234:1.2); \coordinate (Q) at (306:1.2); \coordinate (N) at (0,-.971);
        \filldraw[fill=accent!35,draw=accent] (M) -- (N) -- (Q) -- cycle;
        \rechtehoek{M}{N}{Q}
        \fill (M) circle (1.4pt) node[above] {$M$};
        \node[below] at (N) {$N$};
      \end{tikzpicture}
  opgave: |-
    Een regelmatige vijfhoek heeft zijden van 4~cm. Het middelpunt $M$ ligt even ver van alle hoekpunten. Verbind je $M$ met de hoekpunten, dan krijg je vijf gelijke gelijkbenige driehoeken.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe groot is de tophoek in $M$ van zo'n driehoek? En de hoek in $M$ van de rechthoekige driehoek in de figuur ($N$ is het midden van een zijde)?
      antwoord: |-
        $72^\circ$ en $36^\circ$
      uitwerking: |-
        $360^\circ : 5 = 72^\circ$. De hoogtelijn $[MN]$ deelt die hoek middendoor: $36^\circ$.
    - opgave: |-
        Bereken $\lengte{MN}$ en de oppervlakte van de vijfhoek, afgerond op twee decimalen.
      antwoord: |-
        $\lengte{MN} \approx 2{,}75$~cm, oppervlakte $\approx 27{,}53$~cm$^2$
      uitwerking: |-
        De halve zijde is 2 en ligt tegenover de hoek van $36^\circ$: $\lengte{MN} = \tfrac{2}{\tan 36^\circ} \approx 2{,}75$. Oppervlakte: $5 \cdot \tfrac{4 \cdot \lengte{MN}}{2} = 10\,\lengte{MN} \approx 27{,}53$.

- id: h2-o25
  soort: opdracht
  niveau: 3
  thema: |-
    hoe ver zie je?
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \coordinate (M) at (0,0); \coordinate (R) at (1.603,2.618); \coordinate (T) at (0,3.6);
        \draw[accent!60] (-2.4,1.92) arc[start angle=141,end angle=39,radius=3.07];
        \draw[grijs,dashed] (M) -- (T) (M) -- (R);
        \draw[accent,thick] (T) -- (R);
        \draw[grijs,thick] (0,3.07) -- (T);
        \rechtehoek{M}{R}{T}
        \fill (M) circle (2pt) node[below] {$M$}; \fill (T) circle (2pt) node[above] {$T$}; \fill (R) circle (2pt) node[right] {$H$};
        \node[left] at (0,1.5) {$R$}; \node[below right] at (.8,1.31) {$R$};
      \end{tikzpicture}
  opgave: |-
    Je staat bovenop een toren aan zee, met je ogen 100~m boven het water ($T$). Hoe ver ligt de horizon $H$? Neem voor de straal van de aarde $R = 6371$~km. De kijklijn naar de horizon raakt aan het aardoppervlak, en staat daar dus loodrecht op de straal $[MH]$. De figuur is sterk overdreven.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\lengte{TH}$ met de stelling van Pythagoras, afgerond op $0{,}1$~km. Werk in meter.
      antwoord: |-
        $35{,}7$~km
      uitwerking: |-
        $\lengte{TH}^2 = (R + 100)^2 - R^2$ met $R = 6\,371\,000$~m, dus $\lengte{TH}^2 = 200R + 10\,000 = 1\,274\,210\,000$ en $\lengte{TH} \approx 35\,696$~m, ongeveer 35,7~km.
    - opgave: |-
        Onder welke dieptehoek zie je de horizon? Tip: die hoek is even groot als $\hoek{M}$. Rond af op $0{,}01^\circ$.
      antwoord: |-
        $0{,}32^\circ$
      uitwerking: |-
        In driehoek $MHT$ is $\cos\hoek{M} = \tfrac{R}{R + 100} = \tfrac{6\,371\,000}{6\,371\,100}$, dus $\hoek{M} \approx 0{,}32^\circ$. De horizontale in $T$ staat loodrecht op $[MT]$ en de kijklijn loodrecht op $[MH]$, daarom is de dieptehoek even groot als $\hoek{M}$. De horizon ligt dus nauwelijks onder de horizontale.

- id: h2-o26
  soort: opdracht
  niveau: 3
  pakketten: [5]
  thema: |-
    identiteiten bewijzen
  opgave: |-
    Bewijs voor elke scherpe hoek $\alpha$.
  lijst: enumerate
  delen:
    - opgave: |-
        $(\sin\alpha + \cos\alpha)^2 = 1 + 2\sin\alpha\cos\alpha$
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        $(\sin\alpha + \cos\alpha)^2 = \sin^2\alpha + 2\sin\alpha\cos\alpha + \cos^2\alpha = 1 + 2\sin\alpha\cos\alpha$, met de grondformule.
    - opgave: |-
        $1 + \tan^2\alpha = \dfrac{1}{\cos^2\alpha}$
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        $1 + \tan^2\alpha = 1 + \tfrac{\sin^2\alpha}{\cos^2\alpha} = \tfrac{\cos^2\alpha + \sin^2\alpha}{\cos^2\alpha} = \tfrac{1}{\cos^2\alpha}$.
    - opgave: |-
        $\sin\alpha \cdot \tan\alpha + \cos\alpha = \dfrac{1}{\cos\alpha}$
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        $\sin\alpha \cdot \tfrac{\sin\alpha}{\cos\alpha} + \cos\alpha = \tfrac{\sin^2\alpha + \cos^2\alpha}{\cos\alpha} = \tfrac{1}{\cos\alpha}$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    sinus, cosinus en tangens uit de zijden
  opgave: |-
    Een rechthoekige driehoek heeft zijden 9, 40 en 41. Bereken $\sin\alpha$, $\cos\alpha$ en $\tan\alpha$ voor de hoek $\alpha$ tegenover de zijde van 9, exact en afgerond op vier decimalen.
  antwoord: |-
    $\tfrac{9}{41} \approx 0{,}2195$, $\tfrac{40}{41} \approx 0{,}9756$, $\tfrac{9}{40} = 0{,}225$
  uitwerking: |-
    De schuine zijde is 41, de overstaande 9 en de aanliggende 40.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    een zijde berekenen
  opgave: |-
    Driehoek $ABC$ is rechthoekig in $C$, met $\lengte{AB} = 20$ en $\hoek{A} = 27^\circ$. Bereken $\lengte{AC}$, afgerond op twee decimalen.
  antwoord: |-
    $17{,}82$
  uitwerking: |-
    $[AC]$ is aanliggend, $[AB]$ schuin: $\lengte{AC} = 20 \cos 27^\circ \approx 17{,}82$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    een hoek berekenen
  opgave: |-
    Driehoek $ABC$ is rechthoekig in $C$, met $\lengte{BC} = 6$ en $\lengte{AC} = 7$. Bereken $\hoek{A}$, afgerond op $0{,}01^\circ$.
  antwoord: |-
    $40{,}60^\circ$
  uitwerking: |-
    $\tan\hoek{A} = \tfrac67$, dus $\hoek{A} \approx 40{,}60^\circ$.

- id: h2-t4
  soort: test
  niveau: 2
  thema: |-
    grondformule
  opgave: |-
    Van een scherpe hoek $\alpha$ is $\sin\alpha = 0{,}1$. Bereken $\cos\alpha$ en $\tan\alpha$ zonder de hoek te berekenen, afgerond op vier decimalen.
  antwoord: |-
    $\cos\alpha \approx 0{,}9950$, $\tan\alpha \approx 0{,}1005$
  uitwerking: |-
    $\cos^2\alpha = 1 - 0{,}01 = 0{,}99$, dus $\cos\alpha = \sqrt{0{,}99} \approx 0{,}9950$ en $\tan\alpha = \tfrac{0{,}1}{\sqrt{0{,}99}} \approx 0{,}1005$.

- id: h2-t5
  soort: test
  niveau: 2
  thema: |-
    hoogtehoek
  opgave: |-
    Je staat 50~m van een toren en ziet de top onder een hoogtehoek van $24^\circ$. Je ogen zijn 1,7~m boven de grond. Hoe hoog is de toren, afgerond op een centimeter?
  antwoord: |-
    $23{,}96$~m
  uitwerking: |-
    $50 \tan 24^\circ \approx 22{,}26$~m boven de ogen, plus 1,7~m: $23{,}96$~m.

- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    helling
  opgave: |-
    Een weg heeft een helling van 9~\%.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke hoek maakt de weg met de horizontale, afgerond op $0{,}01^\circ$?
      antwoord: |-
        $5{,}14^\circ$
      uitwerking: |-
        $\tan^{-1} 0{,}09 \approx 5{,}14^\circ$.
    - opgave: |-
        Hoeveel meter stijg je over een horizontale afstand van 800~m?
      antwoord: |-
        $72$~m
      uitwerking: |-
        $0{,}09 \cdot 800 = 72$.

- id: h2-t7
  soort: test
  niveau: 2
  thema: |-
    een rechthoekige driehoek oplossen
  opgave: |-
    Driehoek $DEF$ is rechthoekig in $E$, met $\lengte{DF} = 13$ en $\lengte{EF} = 5$. Los de driehoek op. Rond hoeken af op $0{,}01^\circ$.
  antwoord: |-
    $\lengte{DE} = 12$, $\hoek{D} \approx 22{,}62^\circ$, $\hoek{F} \approx 67{,}38^\circ$
  uitwerking: |-
    $\lengte{DE} = \sqrt{169 - 25} = 12$. Ten opzichte van $\hoek{D}$ is $[EF]$ overstaand: $\sin\hoek{D} = \tfrac{5}{13}$, dus $\hoek{D} \approx 22{,}62^\circ$, en $\hoek{F} = 90^\circ - \hoek{D} \approx 67{,}38^\circ$.
