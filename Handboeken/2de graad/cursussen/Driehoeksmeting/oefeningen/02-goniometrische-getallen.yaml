# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de schuine zijde van een rechthoekige driehoek met rechthoekszijden 6 en 8
      antwoord: |-
        $10$
      uitwerking: |-
        $\sqrt{36 + 64} = \sqrt{100} = 10$.
    - opgave: |-
        de andere scherpe hoek van een rechthoekige driehoek met een hoek van $34^\circ$
      antwoord: |-
        $56^\circ$
      uitwerking: |-
        $90^\circ - 34^\circ = 56^\circ$.
    - opgave: |-
        $x$ als $\dfrac{x}{7} = 0{,}4$
      antwoord: |-
        $x = 2{,}8$
      uitwerking: |-
        $x = 7 \cdot 0{,}4 = 2{,}8$.
    - opgave: |-
        $x$ als $\dfrac{12}{x} = 0{,}8$
      antwoord: |-
        $x = 15$
      uitwerking: |-
        $0{,}8x = 12$, dus $x = 12 : 0{,}8 = 15$.
    - opgave: |-
        $\dfrac{3{,}5}{5}$ als decimaal getal
      antwoord: |-
        $0{,}7$
      uitwerking: |-
        $3{,}5 : 5 = 0{,}7$.
    - opgave: |-
        $0{,}70207$ afgerond op twee decimalen
      antwoord: |-
        $0{,}70$
      uitwerking: |-
        Het derde cijfer na de komma is 2, dus naar beneden afronden.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Teken drie rechthoekige driehoeken $ABC$, telkens rechthoekig in $C$ en met $\hoek{A} = 35^\circ$. Neem $\lengte{AC} = 4$~cm, 6~cm en 10~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Meet telkens $\lengte{BC}$ en $\lengte{AB}$, tot op een millimeter.
      antwoord: |-
        $\lengte{BC} \approx 2{,}8$; $4{,}2$; $7{,}0$ en $\lengte{AB} \approx 4{,}9$; $7{,}3$; $12{,}2$ (cm)
      uitwerking: |-
        Een kleine meetfout is normaal.
    - opgave: |-
        Bereken telkens $\dfrac{\lengte{BC}}{\lengte{AC}}$. Wat valt je op?
      antwoord: |-
        telkens ongeveer 0,70
      uitwerking: |-
        $\tfrac{2{,}8}{4} = \tfrac{4{,}2}{6} = \tfrac{7{,}0}{10} = 0{,}70$: de verhouding is in de drie driehoeken dezelfde.
    - opgave: |-
        Bereken ook telkens $\dfrac{\lengte{BC}}{\lengte{AB}}$. Geldt hetzelfde?
      antwoord: |-
        ja, telkens ongeveer 0,57
      uitwerking: |-
        $\tfrac{2{,}8}{4{,}9} \approx \tfrac{4{,}2}{7{,}3} \approx \tfrac{7{,}0}{12{,}2} \approx 0{,}57$. Ook die verhouding hangt niet af van de grootte van de driehoek.

- id: h2-namen
  soort: kort
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=.55,font=\scriptsize]
        \coordinate (R) at (0,0); \coordinate (P) at (0,3); \coordinate (Q) at (4.4,0);
        \filldraw[fill=accent!15,draw=accent,thick] (P) -- (Q) -- (R) -- cycle;
        \rechtehoek{Q}{R}{P}
        \node[below left] at (R) {$R$}; \node[above] at (P) {$P$}; \node[below right] at (Q) {$Q$};
      \end{tikzpicture}
  opgave: |-
    Driehoek $PQR$ is rechthoekig in $R$. Welke zijde is
  lijst: enumerate
  delen:
    - opgave: |-
        de schuine zijde?
      antwoord: |-
        $[PQ]$
      uitwerking: |-
        Ze ligt tegenover de rechte hoek in $R$.
    - opgave: |-
        de overstaande en de aanliggende rechthoekszijde van $\hoek{P}$?
      antwoord: |-
        overstaand $[QR]$, aanliggend $[PR]$
      uitwerking: |-
        $[QR]$ ligt tegenover $P$, en $[PR]$ is een been van $\hoek{P}$.
    - opgave: |-
        de overstaande en de aanliggende rechthoekszijde van $\hoek{Q}$?
      antwoord: |-
        overstaand $[PR]$, aanliggend $[QR]$
      uitwerking: |-
        Juist omgekeerd als bij $\hoek{P}$.

- id: h2-tan
  soort: kort
  opgave: |-
    Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        In een rechthoekige driehoek met rechthoekszijden 5 en 12: de tangens van beide scherpe hoeken, afgerond op vier decimalen.
      antwoord: |-
        $\tfrac{5}{12} \approx 0{,}4167$ en $\tfrac{12}{5} = 2{,}4$
      uitwerking: |-
        Voor de hoek tegenover de zijde van 5 is 5 overstaand en 12 aanliggend; voor de andere hoek is het omgekeerd.
    - opgave: |-
        Met de rekenmachine, afgerond op vier decimalen: $\tan 20^\circ$, $\tan 55^\circ$ en $\tan 85^\circ$.
      antwoord: |-
        $0{,}3640$; $1{,}4281$; $11{,}4301$
      uitwerking: |-
        Rekenmachine in graden. Bij $85^\circ$ is de overstaande zijde ruim elf keer zo lang als de aanliggende.

- id: h2-sincos
  soort: kort
  opgave: |-
    Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        In een rechthoekige driehoek met zijden 7, 24 en 25: $\sin\alpha$, $\cos\alpha$ en $\tan\alpha$ voor de hoek $\alpha$ tegenover de zijde van 7.
      antwoord: |-
        $\tfrac{7}{25} = 0{,}28$, $\tfrac{24}{25} = 0{,}96$, $\tfrac{7}{24} \approx 0{,}2917$
      uitwerking: |-
        De schuine zijde is 25, de overstaande 7 en de aanliggende 24.
    - opgave: |-
        In een rechthoekige driehoek met rechthoekszijden 6 en 8: $\sin\beta$ en $\cos\beta$ voor de hoek $\beta$ tegenover de zijde van 8.
      antwoord: |-
        $\sin\beta = 0{,}8$, $\cos\beta = 0{,}6$
      uitwerking: |-
        De schuine zijde is $\sqrt{36 + 64} = 10$. Dus $\sin\beta = \tfrac{8}{10}$ en $\cos\beta = \tfrac{6}{10}$.
    - opgave: |-
        Met de rekenmachine, afgerond op vier decimalen: $\sin 42^\circ$ en $\cos 42^\circ$.
      antwoord: |-
        $0{,}6691$ en $0{,}7431$
      uitwerking: |-
        Rekenmachine in graden. Beide liggen tussen 0 en 1.

- id: h2-zijde
  soort: kort
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=.6,font=\scriptsize]
        \coordinate (A) at (0,0); \coordinate (C) at (4.4,0); \coordinate (B) at (4.4,2.8);
        \filldraw[fill=accent!15,draw=accent,thick] (A) -- (C) -- (B) -- cycle;
        \rechtehoek{A}{C}{B}
        \hoekboog{C}{A}{B}{6mm}
        \node[below left] at (A) {$A$}; \node[below right] at (C) {$C$}; \node[above right] at (B) {$B$};
      \end{tikzpicture}
  opgave: |-
    Driehoek $ABC$ is rechthoekig in $C$. Bereken de gevraagde zijde, afgerond op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        $\lengte{AB} = 12$ en $\hoek{A} = 35^\circ$. Bereken $\lengte{BC}$.
      antwoord: |-
        $6{,}88$
      uitwerking: |-
        Overstaand en schuin: $\sin 35^\circ = \tfrac{\lengte{BC}}{12}$, dus $\lengte{BC} = 12 \sin 35^\circ \approx 6{,}88$.
    - opgave: |-
        $\lengte{AC} = 9$ en $\hoek{A} = 28^\circ$. Bereken $\lengte{BC}$.
      antwoord: |-
        $4{,}79$
      uitwerking: |-
        Overstaand en aanliggend: $\lengte{BC} = 9 \tan 28^\circ \approx 4{,}79$.
    - opgave: |-
        $\lengte{AC} = 6$ en $\hoek{A} = 50^\circ$. Bereken $\lengte{AB}$.
      antwoord: |-
        $9{,}33$
      uitwerking: |-
        Aanliggend en schuin: $\cos 50^\circ = \tfrac{6}{\lengte{AB}}$, dus $\lengte{AB} = \tfrac{6}{\cos 50^\circ} \approx 9{,}33$.

- id: h2-hoek
  soort: kort
  opgave: |-
    Bereken de scherpe hoek $\alpha$, afgerond op $0{,}01^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        $\tan\alpha = 1{,}2$
      antwoord: |-
        $50{,}19^\circ$
      uitwerking: |-
        $\alpha = \tan^{-1} 1{,}2 \approx 50{,}19^\circ$.
    - opgave: |-
        $\sin\alpha = 0{,}35$
      antwoord: |-
        $20{,}49^\circ$
      uitwerking: |-
        $\alpha = \sin^{-1} 0{,}35 \approx 20{,}49^\circ$.
    - opgave: |-
        $\alpha$ ligt in een rechthoekige driehoek tegenover de rechthoekszijde van 5; de andere rechthoekszijde is 8.
      antwoord: |-
        $32{,}01^\circ$
      uitwerking: |-
        $\tan\alpha = \tfrac58$, dus $\alpha \approx 32{,}01^\circ$.
    - opgave: |-
        In een rechthoekige driehoek is de schuine zijde 10 en de aanliggende rechthoekszijde van $\alpha$ is 7.
      antwoord: |-
        $45{,}57^\circ$
      uitwerking: |-
        $\cos\alpha = \tfrac{7}{10}$, dus $\alpha = \cos^{-1} 0{,}7 \approx 45{,}57^\circ$.

- id: h2-oplossen
  soort: kort
  opgave: |-
    Driehoek $PQR$ is rechthoekig in $Q$, met $\lengte{PR} = 15$ en $\hoek{P} = 40^\circ$. Los de driehoek op, afgerond op twee decimalen.
  antwoord: |-
    $\hoek{R} = 50^\circ$, $\lengte{QR} \approx 9{,}64$, $\lengte{PQ} \approx 11{,}49$
  uitwerking: |-
    $\hoek{R} = 90^\circ - 40^\circ = 50^\circ$. $[PR]$ is de schuine zijde, $[QR]$ ligt tegenover $P$: $\lengte{QR} = 15 \sin 40^\circ \approx 9{,}64$ en $\lengte{PQ} = 15 \cos 40^\circ \approx 11{,}49$. Controle: $9{,}64^2 + 11{,}49^2 \approx 225 = 15^2$.

- id: h2-grond
  soort: kort
  opgave: |-
    Bereken zonder de hoek te berekenen, exact of afgerond op vier decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin\alpha$ als $\cos\alpha = 0{,}6$
      antwoord: |-
        $0{,}8$
      uitwerking: |-
        $\sin^2\alpha = 1 - 0{,}36 = 0{,}64$, dus $\sin\alpha = 0{,}8$.
    - opgave: |-
        $\cos\alpha$ als $\sin\alpha = 0{,}5$
      antwoord: |-
        $\sqrt{0{,}75} \approx 0{,}8660$
      uitwerking: |-
        $\cos^2\alpha = 1 - 0{,}25 = 0{,}75$, dus $\cos\alpha = \sqrt{0{,}75} \approx 0{,}8660$.
    - opgave: |-
        $\cos\alpha$ als $\sin\alpha = \tfrac{12}{13}$
      antwoord: |-
        $\tfrac{5}{13}$
      uitwerking: |-
        $\cos^2\alpha = 1 - \tfrac{144}{169} = \tfrac{25}{169}$, dus $\cos\alpha = \tfrac{5}{13}$.

- id: h2-quot
  soort: kort
  opgave: |-
    Bereken $\tan\alpha$ zonder de hoek te berekenen.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin\alpha = 0{,}6$ en $\cos\alpha = 0{,}8$
      antwoord: |-
        $0{,}75$
      uitwerking: |-
        $\tfrac{0{,}6}{0{,}8} = 0{,}75$.
    - opgave: |-
        $\sin\alpha = \tfrac{5}{13}$
      antwoord: |-
        $\tfrac{5}{12}$
      uitwerking: |-
        $\cos^2\alpha = 1 - \tfrac{25}{169} = \tfrac{144}{169}$, dus $\cos\alpha = \tfrac{12}{13}$ en $\tan\alpha = \tfrac{5}{13} : \tfrac{12}{13} = \tfrac{5}{12}$.
    - opgave: |-
        Controleer met de rekenmachine dat $\dfrac{\sin 40^\circ}{\cos 40^\circ} = \tan 40^\circ$.
      antwoord: |-
        beide $\approx 0{,}8391$
      uitwerking: |-
        $\sin 40^\circ \approx 0{,}6428$ en $\cos 40^\circ \approx 0{,}7660$; het quotiënt en $\tan 40^\circ$ zijn allebei ongeveer 0,8391.

- id: h2-compl
  soort: kort
  pakketten: [4, 5]
  opgave: |-
    Bereken zonder rekenmachine.
  lijst: enumerate
  delen:
    - opgave: |-
        $\cos 25^\circ$, als je weet dat $\sin 65^\circ \approx 0{,}9063$
      antwoord: |-
        $\approx 0{,}9063$
      uitwerking: |-
        $\cos 25^\circ = \sin(90^\circ - 25^\circ) = \sin 65^\circ$.
    - opgave: |-
        $\dfrac{\sin 10^\circ}{\cos 80^\circ}$
      antwoord: |-
        $1$
      uitwerking: |-
        $\cos 80^\circ = \sin 10^\circ$, dus teller en noemer zijn gelijk.
    - opgave: |-
        $\sin^2 20^\circ + \sin^2 70^\circ$
      antwoord: |-
        $1$
      uitwerking: |-
        $\sin 70^\circ = \cos 20^\circ$, dus de som is $\sin^2 20^\circ + \cos^2 20^\circ = 1$ (grondformule).

- id: h2-bijz
  soort: kort
  pakketten: [4, 5]
  opgave: |-
    Bereken exact, zonder rekenmachine.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin 30^\circ + \cos 60^\circ$
      antwoord: |-
        $1$
      uitwerking: |-
        $\tfrac12 + \tfrac12 = 1$.
    - opgave: |-
        $\tan 60^\circ \cdot \tan 30^\circ$
      antwoord: |-
        $1$
      uitwerking: |-
        $\sqrt3 \cdot \tfrac{\sqrt3}{3} = \tfrac33 = 1$.
    - opgave: |-
        de rechthoekszijden van een rechthoekige driehoek met schuine zijde 8 en een hoek van $60^\circ$
      antwoord: |-
        $4\sqrt3$ en $4$
      uitwerking: |-
        Overstaand: $8 \sin 60^\circ = 8 \cdot \tfrac{\sqrt3}{2} = 4\sqrt3$. Aanliggend: $8 \cos 60^\circ = 4$.

- id: h2-hoogte
  soort: kort
  opgave: |-
    Rond af op een centimeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Je staat 35~m van een gebouw en ziet de dakrand onder een hoogtehoek van $40^\circ$. Je ogen zijn 1,5~m boven de grond. Hoe hoog is het gebouw?
      antwoord: |-
        $30{,}87$~m
      uitwerking: |-
        Boven de ogen: $35 \tan 40^\circ \approx 29{,}37$. Plus de ooghoogte: $30{,}87$~m.
    - opgave: |-
        Vanaf een klif van 60~m hoog zie je een boot onder een dieptehoek van $15^\circ$. Hoe ver ligt de boot van de voet van de klif?
      antwoord: |-
        $223{,}92$~m
      uitwerking: |-
        In de boot is de hoek met het water ook $15^\circ$: $\tan 15^\circ = \tfrac{60}{d}$, dus $d = \tfrac{60}{\tan 15^\circ} \approx 223{,}92$.

- id: h2-helling
  soort: kort
  opgave: |-
    Bereken, afgerond op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        de hoek van een weg met een helling van 6~\%
      antwoord: |-
        $3{,}43^\circ$
      uitwerking: |-
        $\alpha = \tan^{-1} 0{,}06 \approx 3{,}43^\circ$.
    - opgave: |-
        het hellingspercentage van een weg die een hoek van $4^\circ$ maakt met de horizontale
      antwoord: |-
        $6{,}99$~\%
      uitwerking: |-
        $\tan 4^\circ \approx 0{,}0699$, dus ongeveer $6{,}99$~\%.
    - opgave: |-
        het hoogteverschil als je 1,5~km langs een weg met een helling van 6~\% rijdt
      antwoord: |-
        $89{,}84$~m
      uitwerking: |-
        De hoek is $\alpha = \tan^{-1} 0{,}06$. De 1500~m langs de weg is de schuine zijde: $h = 1500 \sin\alpha \approx 89{,}84$~m. (Met $0{,}06 \cdot 1500 = 90$ reken je alsof 1500~m de horizontale afstand is.)

# --- Opdrachten -------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    sinus, cosinus en tangens uit de zijden
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=.6,font=\scriptsize]
        \coordinate (A) at (0,0); \coordinate (C) at (4.4,0); \coordinate (B) at (4.4,2.8);
        \filldraw[fill=accent!15,draw=accent,thick] (A) -- (C) -- (B) -- cycle;
        \rechtehoek{A}{C}{B}
        \hoeklabel{C}{A}{B}{7mm}{\alpha}
        \node[below left] at (A) {$A$}; \node[below right] at (C) {$C$}; \node[above right] at (B) {$B$};
      \end{tikzpicture}
  opgave: |-
    Driehoek $ABC$ is rechthoekig in $C$, en $\alpha = \hoek{A}$. Bereken $\sin\alpha$, $\cos\alpha$ en $\tan\alpha$, exact.
  lijst: enumerate
  delen:
    - opgave: |-
        $\lengte{BC} = 5$ en $\lengte{AC} = 12$
      antwoord: |-
        $\tfrac{5}{13}$, $\tfrac{12}{13}$, $\tfrac{5}{12}$
      uitwerking: |-
        $\lengte{AB} = \sqrt{25 + 144} = 13$.
    - opgave: |-
        $\lengte{BC} = 8$ en $\lengte{AB} = 10$
      antwoord: |-
        $0{,}8$; $0{,}6$; $\tfrac43$
      uitwerking: |-
        $\lengte{AC} = \sqrt{100 - 64} = 6$.
    - opgave: |-
        $\lengte{AC} = 1$ en $\lengte{AB} = 2$
      antwoord: |-
        $\tfrac{\sqrt3}{2}$, $\tfrac12$, $\sqrt3$
      uitwerking: |-
        $\lengte{BC} = \sqrt{4 - 1} = \sqrt3$.
    - opgave: |-
        $\lengte{BC} = \lengte{AC} = 2$
      antwoord: |-
        $\tfrac{\sqrt2}{2}$, $\tfrac{\sqrt2}{2}$, $1$
      uitwerking: |-
        $\lengte{AB} = \sqrt{8} = 2\sqrt2$, dus $\sin\alpha = \cos\alpha = \tfrac{2}{2\sqrt2} = \tfrac{1}{\sqrt2} = \tfrac{\sqrt2}{2}$.

