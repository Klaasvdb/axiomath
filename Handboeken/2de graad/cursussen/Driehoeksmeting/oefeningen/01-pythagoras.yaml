# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $13^2$
      antwoord: |-
        $169$
      uitwerking: |-
        $13 \cdot 13 = 169$.
    - opgave: |-
        $0{,}6^2$
      antwoord: |-
        $0{,}36$
      uitwerking: |-
        $0{,}6 \cdot 0{,}6 = 0{,}36$, niet $1{,}2$ en niet $3{,}6$.
    - opgave: |-
        $\sqrt{196}$
      antwoord: |-
        $14$
      uitwerking: |-
        $14^2 = 196$ en $14 \geqslant 0$.
    - opgave: |-
        $\sqrt{50}$, zo eenvoudig mogelijk
      antwoord: |-
        $5\sqrt2$
      uitwerking: |-
        $\sqrt{50} = \sqrt{25 \cdot 2} = 5\sqrt2$.
    - opgave: |-
        $\sqrt{30}$, afgerond op twee decimalen
      antwoord: |-
        $5{,}48$
      uitwerking: |-
        $\sqrt{30} = 5{,}4772\ldots \approx 5{,}48$.
    - opgave: |-
        $x$ als $x^2 = 81$ en $x > 0$
      antwoord: |-
        $9$
      uitwerking: |-
        $x = \sqrt{81} = 9$.
    - opgave: |-
        de oppervlakte van een driehoek met basis 9~cm en hoogte 4~cm
      antwoord: |-
        $18$~cm$^2$
      uitwerking: |-
        $\tfrac{9 \cdot 4}{2} = 18$.
    - opgave: |-
        de derde hoek van een rechthoekige driehoek met een hoek van $35^\circ$
      antwoord: |-
        $55^\circ$
      uitwerking: |-
        $180^\circ - 90^\circ - 35^\circ = 55^\circ$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Teken drie rechthoekige driehoeken. Hun rechthoekszijden (de zijden van de rechte hoek) zijn 3~cm en 4~cm, 6~cm en 8~cm, en 5~cm en 12~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Meet telkens de derde zijde.
      antwoord: |-
        5~cm, 10~cm en 13~cm
      uitwerking: |-
        Een kleine meetfout is normaal.
    - opgave: |-
        Noem de korte zijden $a$ en $b$ en de lange zijde $c$. Bereken telkens $a^2 + b^2$ en $c^2$. Wat valt je op?
      antwoord: |-
        telkens $a^2 + b^2 = c^2$
      uitwerking: |-
        $9 + 16 = 25 = 5^2$, $36 + 64 = 100 = 10^2$ en $25 + 144 = 169 = 13^2$.
    - opgave: |-
        Teken nu een driehoek met zijden van 3~cm en 4~cm en daartussen een hoek van $120^\circ$. Meet de derde zijde. Geldt wat je vond nog?
      antwoord: |-
        ongeveer 6,1~cm; nee
      uitwerking: |-
        $6{,}1^2 \approx 37$, veel meer dan $9 + 16 = 25$. Het verband geldt alleen in een rechthoekige driehoek.

- id: h1-rooster
  soort: kort
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[scale=.3,font=\scriptsize]
        \ruitjes{-1}{-3}{4}{4}
        \draw[grijs,dashed] (0,0) rectangle (4,4);
        \filldraw[fill=accent!12,draw=accent] (0,0) rectangle (3,-3);
        \filldraw[fill=accent!12,draw=accent] (0,0) rectangle (-1,1);
        \filldraw[fill=accent!25,draw=accent] (0,1) -- (3,0) -- (4,3) -- (1,4) -- cycle;
        \filldraw[fill=accent!55,draw=accent,thick] (0,0) -- (3,0) -- (0,1) -- cycle;
      \end{tikzpicture}
  opgave: |-
    Een rechthoekige driehoek op een rooster heeft korte zijden van een aantal hokjes. Bereken de oppervlakte van het schuine vierkant op de lange zijde met een recht vierkant eromheen, en vergelijk met de twee andere vierkanten.
  lijst: enumerate
  delen:
    - opgave: |-
        korte zijden van 1 en 3 hokjes (zie de figuur)
      antwoord: |-
        $10 = 1 + 9$
      uitwerking: |-
        Het rechte vierkant is 4 bij 4, dus 16. De vier driehoeken zijn elk $\tfrac{1 \cdot 3}{2} = 1{,}5$. Het schuine vierkant: $16 - 4 \cdot 1{,}5 = 10$, en $1^2 + 3^2 = 10$.
    - opgave: |-
        korte zijden van 2 en 4 hokjes
      antwoord: |-
        $20 = 4 + 16$
      uitwerking: |-
        Het rechte vierkant is 6 bij 6, dus 36. De vier driehoeken zijn elk $\tfrac{2 \cdot 4}{2} = 4$. Het schuine vierkant: $36 - 16 = 20$, en $2^2 + 4^2 = 20$.

- id: h1-schuin
  soort: kort
  opgave: |-
    Bereken de schuine zijde van een rechthoekige driehoek met deze rechthoekszijden. Geef de exacte waarde, en als die geen natuurlijk getal is ook een benadering op twee decimalen.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        9 en 40
      antwoord: |-
        $41$
      uitwerking: |-
        $c^2 = 81 + 1600 = 1681$, dus $c = 41$.
    - opgave: |-
        6 en 6
      antwoord: |-
        $6\sqrt2 \approx 8{,}49$
      uitwerking: |-
        $c^2 = 36 + 36 = 72$, dus $c = \sqrt{72} = 6\sqrt2 \approx 8{,}49$.
    - opgave: |-
        2,4 en 1
      antwoord: |-
        $2{,}6$
      uitwerking: |-
        $c^2 = 5{,}76 + 1 = 6{,}76$, dus $c = 2{,}6$.
    - opgave: |-
        3 en 5
      antwoord: |-
        $\sqrt{34} \approx 5{,}83$
      uitwerking: |-
        $c^2 = 9 + 25 = 34$, dus $c = \sqrt{34} \approx 5{,}83$.

- id: h1-rhz
  soort: kort
  opgave: |-
    Bereken de ontbrekende zijde, exact en zo nodig afgerond op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        Een rechthoekige driehoek heeft een schuine zijde van 25 en een rechthoekszijde van 7.
      antwoord: |-
        $24$
      uitwerking: |-
        $b^2 = 625 - 49 = 576$, dus $b = 24$.
    - opgave: |-
        Driehoek $ABC$ is rechthoekig in $B$, met $\lengte{AC} = 12$ en $\lengte{BC} = 5$. Bereken $\lengte{AB}$.
      antwoord: |-
        $\sqrt{119} \approx 10{,}91$
      uitwerking: |-
        De schuine zijde ligt tegenover $B$: $[AC]$. Dus $\lengte{AB}^2 = 144 - 25 = 119$ en $\lengte{AB} = \sqrt{119} \approx 10{,}91$.
    - opgave: |-
        Driehoek $DEF$ is rechthoekig in $D$, met $\lengte{DE} = 3$ en $\lengte{EF} = 7$. Bereken $\lengte{DF}$.
      antwoord: |-
        $2\sqrt{10} \approx 6{,}32$
      uitwerking: |-
        De schuine zijde ligt tegenover $D$: $[EF]$. Dus $\lengte{DF}^2 = 49 - 9 = 40$ en $\lengte{DF} = \sqrt{40} = 2\sqrt{10} \approx 6{,}32$.

- id: h1-omg
  soort: kort
  opgave: |-
    Is een driehoek met deze zijden rechthoekig?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        8, 15 en 17
      antwoord: |-
        ja
      uitwerking: |-
        $64 + 225 = 289 = 17^2$.
    - opgave: |-
        5, 7 en 9
      antwoord: |-
        nee
      uitwerking: |-
        $25 + 49 = 74$ en $9^2 = 81$. Omdat $81 > 74$, is de grootste hoek stomp.
    - opgave: |-
        2,1; 2,8 en 3,5
      antwoord: |-
        ja
      uitwerking: |-
        $4{,}41 + 7{,}84 = 12{,}25 = 3{,}5^2$.

- id: h1-diag
  soort: kort
  opgave: |-
    Bereken de lengte van de diagonaal, exact en zo nodig afgerond op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        een rechthoek van 8~cm bij 15~cm
      antwoord: |-
        $17$~cm
      uitwerking: |-
        $d^2 = 64 + 225 = 289$, dus $d = 17$.
    - opgave: |-
        een vierkant met zijde 10~cm
      antwoord: |-
        $10\sqrt2 \approx 14{,}14$~cm
      uitwerking: |-
        $d = z\sqrt2 = 10\sqrt2 \approx 14{,}14$.
    - opgave: |-
        een blad papier van het formaat A4, 21~cm bij 29,7~cm
      antwoord: |-
        $\approx 36{,}37$~cm
      uitwerking: |-
        $d^2 = 441 + 882{,}09 = 1323{,}09$, dus $d \approx 36{,}37$.

- id: h1-hoogte
  soort: kort
  opgave: |-
    Bereken, exact en zo nodig afgerond op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        de hoogte en de oppervlakte van een gelijkbenige driehoek met basis 16 en benen van 17
      antwoord: |-
        hoogte 15, oppervlakte 120
      uitwerking: |-
        De halve basis is 8: $h^2 = 289 - 64 = 225$, dus $h = 15$. Oppervlakte: $\tfrac{16 \cdot 15}{2} = 120$.
    - opgave: |-
        de hoogte van een gelijkzijdige driehoek met zijde 10
      antwoord: |-
        $5\sqrt3 \approx 8{,}66$
      uitwerking: |-
        $h^2 = 100 - 25 = 75$, dus $h = \sqrt{75} = 5\sqrt3 \approx 8{,}66$.
    - opgave: |-
        de basis van een gelijkbenige driehoek met hoogte 8 en benen van 10
      antwoord: |-
        $12$
      uitwerking: |-
        De halve basis $x$: $x^2 = 100 - 64 = 36$, dus $x = 6$ en de basis is $12$.

- id: h1-afst
  soort: kort
  opgave: |-
    Bereken de afstand tussen de twee punten, exact en zo nodig afgerond op twee decimalen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $A(2, 3)$ en $B(5, 7)$
      antwoord: |-
        $5$
      uitwerking: |-
        Horizontaal 3, verticaal 4: $\sqrt{9 + 16} = 5$.
    - opgave: |-
        $C({-1}, 2)$ en $D(4, {-10})$
      antwoord: |-
        $13$
      uitwerking: |-
        Horizontaal $4 - ({-1}) = 5$, verticaal $2 - ({-10}) = 12$: $\sqrt{25 + 144} = 13$.
    - opgave: |-
        $E(0, 0)$ en $F(3, 6)$
      antwoord: |-
        $3\sqrt5 \approx 6{,}71$
      uitwerking: |-
        $\sqrt{9 + 36} = \sqrt{45} = 3\sqrt5 \approx 6{,}71$.

- id: h1-balk
  soort: kort
  opgave: |-
    Bereken de ruimtediagonaal, exact en zo nodig afgerond op twee decimalen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        balk van 2 bij 3 bij 6
      antwoord: |-
        $7$
      uitwerking: |-
        $\sqrt{4 + 9 + 36} = \sqrt{49} = 7$.
    - opgave: |-
        balk van 10 bij 6 bij 8
      antwoord: |-
        $10\sqrt2 \approx 14{,}14$
      uitwerking: |-
        $\sqrt{100 + 36 + 64} = \sqrt{200} = 10\sqrt2 \approx 14{,}14$.
    - opgave: |-
        kubus met ribbe 3
      antwoord: |-
        $3\sqrt3 \approx 5{,}20$
      uitwerking: |-
        $\sqrt{9 + 9 + 9} = \sqrt{27} = 3\sqrt3 \approx 5{,}20$.

- id: h1-ruimte
  soort: kort
  opgave: |-
    Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        de afstand van de top tot de rand van een kegel met straal 6~cm en hoogte 8~cm
      antwoord: |-
        $10$~cm
      uitwerking: |-
        $s^2 = 36 + 64 = 100$, dus $s = 10$.
    - opgave: |-
        de hoogte van een zijvlak van een piramide met een vierkant grondvlak van 10~m bij 10~m en een hoogte van 12~m
      antwoord: |-
        $13$~m
      uitwerking: |-
        Van het midden van het grondvlak tot het midden van een ribbe is 5~m. Dus $h^2 = 144 + 25 = 169$ en $h = 13$.
    - opgave: |-
        de hoogte van een piramide met een vierkant grondvlak van 6~m bij 6~m en opstaande ribben van 5~m, exact en afgerond op een centimeter
      antwoord: |-
        $\sqrt7 \approx 2{,}65$~m
      uitwerking: |-
        De diagonaal van het grondvlak is $6\sqrt2$, de helft is $3\sqrt2$. In de driehoek met de hoogte en een opstaande ribbe: $h^2 = 25 - (3\sqrt2)^2 = 25 - 18 = 7$, dus $h = \sqrt7 \approx 2{,}65$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    schuine zijde en rechthoekszijde berekenen
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[scale=.55,font=\scriptsize]
        \coordinate (C) at (0,0); \coordinate (B) at (3.6,0); \coordinate (A) at (0,2.4);
        \filldraw[fill=accent!20,draw=accent,thick] (A) -- (B) -- (C) -- cycle;
        \rechtehoek{B}{C}{A}
        \node[below left] at (C) {$C$}; \node[below right] at (B) {$B$}; \node[above] at (A) {$A$};
        \node[below] at (1.8,0) {$a$}; \node[left] at (0,1.2) {$b$}; \node[above right] at (1.8,1.2) {$c$};
      \end{tikzpicture}
  opgave: |-
    Driehoek $ABC$ is rechthoekig in $C$, met $a = \lengte{BC}$, $b = \lengte{AC}$ en $c = \lengte{AB}$. Bereken de ontbrekende zijde, exact en zo nodig afgerond op twee decimalen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $a = 9$, $b = 12$
      antwoord: |-
        $c = 15$
      uitwerking: |-
        $c^2 = 81 + 144 = 225$, dus $c = 15$.
    - opgave: |-
        $a = 8$, $c = 17$
      antwoord: |-
        $b = 15$
      uitwerking: |-
        $b^2 = 289 - 64 = 225$, dus $b = 15$.
    - opgave: |-
        $a = 2$, $b = 5$
      antwoord: |-
        $c = \sqrt{29} \approx 5{,}39$
      uitwerking: |-
        $c^2 = 4 + 25 = 29$, dus $c = \sqrt{29} \approx 5{,}39$.
    - opgave: |-
        $b = 1{,}5$, $c = 2{,}5$
      antwoord: |-
        $a = 2$
      uitwerking: |-
        $a^2 = 6{,}25 - 2{,}25 = 4$, dus $a = 2$.
    - opgave: |-
        $a = 7$, $b = 7$
      antwoord: |-
        $c = 7\sqrt2 \approx 9{,}90$
      uitwerking: |-
        $c^2 = 49 + 49 = 98 = 49 \cdot 2$, dus $c = 7\sqrt2 \approx 9{,}90$.
    - opgave: |-
        $a = 5$, $c = 10$
      antwoord: |-
        $b = 5\sqrt3 \approx 8{,}66$
      uitwerking: |-
        $b^2 = 100 - 25 = 75 = 25 \cdot 3$, dus $b = 5\sqrt3 \approx 8{,}66$.
    - opgave: |-
        $a = 0{,}7$, $b = 2{,}4$
      antwoord: |-
        $c = 2{,}5$
      uitwerking: |-
        $c^2 = 0{,}49 + 5{,}76 = 6{,}25$, dus $c = 2{,}5$.
    - opgave: |-
        $b = 4$, $c = 9$
      antwoord: |-
        $a = \sqrt{65} \approx 8{,}06$
      uitwerking: |-
        $a^2 = 81 - 16 = 65$, dus $a = \sqrt{65} \approx 8{,}06$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    de schuine zijde herkennen
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.42,font=\scriptsize]
        \coordinate (A) at (0,0); \coordinate (B) at (8,0); \coordinate (C) at (2.4,3.2); \coordinate (D) at (2.4,0);
        \filldraw[fill=accent!25,draw=accent,thick] (A) -- (D) -- (C) -- cycle;
        \filldraw[fill=accent!10,draw=accent,thick] (D) -- (B) -- (C) -- cycle;
        \rechtehoek{A}{C}{B} \rechtehoek{C}{D}{B}
        \node[below] at (A) {$P$}; \node[below] at (B) {$R$}; \node[above] at (C) {$Q$}; \node[below] at (D) {$S$};
      \end{tikzpicture}
  opgave: |-
    Schrijf de stelling van Pythagoras op met de namen van de zijden.
  lijst: enumerate
  delen:
    - opgave: |-
        driehoek $XYZ$, rechthoekig in $X$
      antwoord: |-
        $\lengte{XY}^2 + \lengte{XZ}^2 = \lengte{YZ}^2$
      uitwerking: |-
        De schuine zijde ligt tegenover $X$: $[YZ]$.
    - opgave: |-
        driehoek $KLM$, rechthoekig in $M$
      antwoord: |-
        $\lengte{KM}^2 + \lengte{LM}^2 = \lengte{KL}^2$
      uitwerking: |-
        De schuine zijde ligt tegenover $M$: $[KL]$.
    - opgave: |-
        de drie rechthoekige driehoeken in de figuur: $PQR$ (recht in $Q$), $PSQ$ en $QSR$ (recht in $S$)
      antwoord: |-
        $\lengte{PQ}^2 + \lengte{QR}^2 = \lengte{PR}^2$, $\lengte{PS}^2 + \lengte{SQ}^2 = \lengte{PQ}^2$, $\lengte{QS}^2 + \lengte{SR}^2 = \lengte{QR}^2$
      uitwerking: |-
        In $PQR$ is $[PR]$ de schuine zijde, in $PSQ$ is het $[PQ]$, en in $QSR$ is het $[QR]$. Een zijde kan in de ene driehoek een rechthoekszijde zijn en in de andere de schuine zijde.
    - opgave: |-
        driehoek $EFG$ met $\hoek{E} = 30^\circ$ en $\hoek{G} = 60^\circ$
      antwoord: |-
        $\lengte{EF}^2 + \lengte{FG}^2 = \lengte{EG}^2$
      uitwerking: |-
        $\hoek{F} = 180^\circ - 30^\circ - 60^\circ = 90^\circ$, dus de schuine zijde is $[EG]$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    omgekeerde stelling
  opgave: |-
    Is een driehoek met deze zijden rechthoekig?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        9, 40 en 41
      antwoord: |-
        ja
      uitwerking: |-
        $81 + 1600 = 1681 = 41^2$.
    - opgave: |-
        10, 24 en 25
      antwoord: |-
        nee
      uitwerking: |-
        $100 + 576 = 676 = 26^2$, niet $25^2 = 625$.
    - opgave: |-
        1,5; 2 en 2,5
      antwoord: |-
        ja
      uitwerking: |-
        $2{,}25 + 4 = 6{,}25 = 2{,}5^2$.
    - opgave: |-
        12, 35 en 37
      antwoord: |-
        ja
      uitwerking: |-
        $144 + 1225 = 1369 = 37^2$.
    - opgave: |-
        7, 8 en 11
      antwoord: |-
        nee
      uitwerking: |-
        $49 + 64 = 113$ en $11^2 = 121$.
    - opgave: |-
        0,8; 1,5 en 1,7
      antwoord: |-
        ja
      uitwerking: |-
        $0{,}64 + 2{,}25 = 2{,}89 = 1{,}7^2$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    afstand tussen twee punten
  opgave: |-
    Teken de punten in een assenstelsel en bereken hun afstand, exact en zo nodig afgerond op twee decimalen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $A({-2}, 1)$ en $B(4, 9)$
      antwoord: |-
        $10$
      uitwerking: |-
        Horizontaal 6, verticaal 8: $\sqrt{36 + 64} = 10$.
    - opgave: |-
        $C(0, 0)$ en $D(5, {-12})$
      antwoord: |-
        $13$
      uitwerking: |-
        Horizontaal 5, verticaal 12: $\sqrt{25 + 144} = 13$.
    - opgave: |-
        $E(1, 3)$ en $F(4, 5)$
      antwoord: |-
        $\sqrt{13} \approx 3{,}61$
      uitwerking: |-
        Horizontaal 3, verticaal 2: $\sqrt{9 + 4} = \sqrt{13}$.
    - opgave: |-
        $G({-3}, {-2})$ en $H(3, 1)$
      antwoord: |-
        $3\sqrt5 \approx 6{,}71$
      uitwerking: |-
        Horizontaal 6, verticaal 3: $\sqrt{36 + 9} = \sqrt{45} = 3\sqrt5$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    diagonaal van een rechthoek en een vierkant
  opgave: |-
    Bereken, exact en zo nodig afgerond op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        de diagonaal van een rechthoek van 24~cm bij 10~cm
      antwoord: |-
        $26$~cm
      uitwerking: |-
        $d^2 = 576 + 100 = 676$, dus $d = 26$.
    - opgave: |-
        de diagonaal van een vierkant met zijde 5~cm
      antwoord: |-
        $5\sqrt2 \approx 7{,}07$~cm
      uitwerking: |-
        $d = z\sqrt2 = 5\sqrt2$.
    - opgave: |-
        de diagonaal van een rechthoekig terras van 3,5~m bij 1,2~m
      antwoord: |-
        $3{,}7$~m
      uitwerking: |-
        $d^2 = 12{,}25 + 1{,}44 = 13{,}69$, dus $d = 3{,}7$.
    - opgave: |-
        de zijde van een vierkant met een diagonaal van 10~cm
      antwoord: |-
        $5\sqrt2 \approx 7{,}07$~cm
      uitwerking: |-
        $z^2 + z^2 = 100$, dus $z^2 = 50$ en $z = \sqrt{50} = 5\sqrt2$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    diagonaal van een balk
  opgave: |-
    Bereken de ruimtediagonaal, exact en zo nodig afgerond op twee decimalen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        balk van 1 bij 4 bij 8
      antwoord: |-
        $9$
      uitwerking: |-
        $\sqrt{1 + 16 + 64} = \sqrt{81} = 9$.
    - opgave: |-
        kubus met ribbe 4
      antwoord: |-
        $4\sqrt3 \approx 6{,}93$
      uitwerking: |-
        $\sqrt{3 \cdot 16} = \sqrt{48} = 4\sqrt3$.
    - opgave: |-
        balk van 10 bij 10 bij 5
      antwoord: |-
        $15$
      uitwerking: |-
        $\sqrt{100 + 100 + 25} = \sqrt{225} = 15$.
    - opgave: |-
        balk van 1 bij 2 bij 3
      antwoord: |-
        $\sqrt{14} \approx 3{,}74$
      uitwerking: |-
        $\sqrt{1 + 4 + 9} = \sqrt{14}$.

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    rechthoekszijde in een context
  opgave: |-
    Een ladder staat tegen een verticale muur, op horizontale grond. Rond af op een centimeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Een ladder van 4~m reikt tot 3,8~m hoog. Hoe ver staat de voet van de muur?
      antwoord: |-
        $1{,}25$~m
      uitwerking: |-
        $x^2 = 16 - 14{,}44 = 1{,}56$, dus $x = \sqrt{1{,}56} \approx 1{,}25$.
    - opgave: |-
        Een ladder van 6~m staat met de voet 1,5~m van de muur. Hoe hoog komt hij?
      antwoord: |-
        $5{,}81$~m
      uitwerking: |-
        $h^2 = 36 - 2{,}25 = 33{,}75$, dus $h \approx 5{,}81$.
    - opgave: |-
        Een ladder van 5~m staat met de voet 1,4~m van de muur. De voet schuift weg tot 3~m van de muur. Hoeveel zakt de top?
      antwoord: |-
        $0{,}8$~m
      uitwerking: |-
        Eerst: $\sqrt{25 - 1{,}96} = 4{,}8$. Daarna: $\sqrt{25 - 9} = 4$. De top zakt $4{,}8 - 4 = 0{,}8$~m. De voet schuift 1,6~m, de top zakt maar half zoveel.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    schuine zijde in een context
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \fill[accent!15] (0,0) -- (6,0) -- (6,1) -- cycle;
        \draw[accent,thick] (0,0) -- (6,1);
        \draw[lijngrijs] (-.3,0) -- (6.5,0);
        \draw[grijs] (6,0) -- (6,1);
        \rechtehoekxy{(0,0)}{(6,0)}{(6,1)}
        \node[below] at (3,0) {horizontaal}; \node[right] at (6,.5) {hoogte};
      \end{tikzpicture}
  opgave: |-
    Een helling voor een rolstoel overbrugt een hoogteverschil. Rond af op een centimeter.
  lijst: enumerate
  delen:
    - opgave: |-
        De helling overbrugt 0,5~m hoogte over een horizontale afstand van 6~m. Hoe lang is de helling zelf?
      antwoord: |-
        $6{,}02$~m
      uitwerking: |-
        $l^2 = 36 + 0{,}25 = 36{,}25$, dus $l \approx 6{,}02$. De helling is maar 2~cm langer dan de horizontale afstand.
    - opgave: |-
        Een helling van 4~m lang overbrugt 0,3~m hoogte. Hoeveel ruimte neemt ze horizontaal in?
      antwoord: |-
        $3{,}99$~m
      uitwerking: |-
        $x^2 = 16 - 0{,}09 = 15{,}91$, dus $x \approx 3{,}99$.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    gelijkbenige driehoek
  opgave: |-
    Een gelijkbenige driehoek heeft een basis van 16~cm en een hoogte van 6~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang zijn de benen?
      antwoord: |-
        $10$~cm
      uitwerking: |-
        De halve basis is 8: $b^2 = 64 + 36 = 100$, dus $b = 10$.
    - opgave: |-
        Bereken de omtrek.
      antwoord: |-
        $36$~cm
      uitwerking: |-
        $16 + 10 + 10 = 36$.
    - opgave: |-
        Bereken de oppervlakte.
      antwoord: |-
        $48$~cm$^2$
      uitwerking: |-
        $\tfrac{16 \cdot 6}{2} = 48$.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    ruit
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[scale=.17,font=\scriptsize]
        \filldraw[fill=accent!12,draw=accent,thick] (-12,0) -- (0,5) -- (12,0) -- (0,-5) -- cycle;
        \fill[accent!30] (0,0) -- (12,0) -- (0,5) -- cycle;
        \draw[accent,dashed] (-12,0) -- (12,0) (0,-5) -- (0,5);
        \rechtehoekxy{(12,0)}{(0,0)}{(0,5)}
      \end{tikzpicture}
  opgave: |-
    De diagonalen van een ruit staan loodrecht op elkaar en delen elkaar middendoor.
  lijst: enumerate
  delen:
    - opgave: |-
        De diagonalen zijn 10~cm en 24~cm lang. Bereken de zijde en de omtrek.
      antwoord: |-
        zijde $13$~cm, omtrek $52$~cm
      uitwerking: |-
        De halve diagonalen zijn 5 en 12: $z^2 = 25 + 144 = 169$, dus $z = 13$ en de omtrek is $4 \cdot 13 = 52$.
    - opgave: |-
        Een ruit heeft zijden van 10~cm en een diagonaal van 12~cm. Bereken de andere diagonaal en de oppervlakte.
      antwoord: |-
        $16$~cm en $96$~cm$^2$
      uitwerking: |-
        De halve diagonaal is 6: de andere helft is $\sqrt{100 - 36} = 8$, dus de diagonaal is 16. De oppervlakte is $\tfrac{12 \cdot 16}{2} = 96$.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    gelijkbenig trapezium
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.22,font=\scriptsize]
        \filldraw[fill=accent!12,draw=accent,thick] (0,0) -- (14,0) -- (11,4) -- (3,4) -- cycle;
        \fill[accent!30] (0,0) -- (3,0) -- (3,4) -- cycle;
        \draw[accent,dashed] (3,0) -- (3,4);
        \rechtehoekxy{(0,0)}{(3,0)}{(3,4)}
        \node[below] at (7,0) {14}; \node[above] at (7,4) {8}; \node[left] at (1.4,2.2) {5}; \node[right] at (12.6,2.2) {5};
      \end{tikzpicture}
  opgave: |-
    Een gelijkbenig trapezium heeft evenwijdige zijden van 14~cm en 8~cm, en benen van 5~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de hoogte. Tip: hoeveel steekt de lange zijde aan elke kant uit?
      antwoord: |-
        $4$~cm
      uitwerking: |-
        Aan elke kant steekt $\tfrac{14 - 8}{2} = 3$~cm uit. Dus $h^2 = 25 - 9 = 16$ en $h = 4$.
    - opgave: |-
        Bereken de oppervlakte.
      antwoord: |-
        $44$~cm$^2$
      uitwerking: |-
        $\tfrac{(14 + 8) \cdot 4}{2} = 44$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    diagonaal in een context
  opgave: |-
    Een voetbalveld is 105~m lang en 68~m breed.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de diagonaal, afgerond op een decimeter?
      antwoord: |-
        $125{,}1$~m
      uitwerking: |-
        $d^2 = 11\,025 + 4624 = 15\,649$, dus $d \approx 125{,}1$.
    - opgave: |-
        Een speler loopt van een hoekvlag naar de overstaande hoekvlag. Hoeveel meter wint hij als hij schuin loopt in plaats van langs de lijnen?
      antwoord: |-
        $47{,}9$~m
      uitwerking: |-
        Langs de lijnen: $105 + 68 = 173$. Schuin: $125{,}1$. Verschil: $47{,}9$~m.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    de wortelspiraal
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.62,font=\scriptsize]
        \coordinate (O) at (0,0);
        \filldraw[fill=accent!10,draw=accent] (O) -- (1.000,0.000) -- (1.000,1.000) -- cycle;
        \filldraw[fill=accent!17,draw=accent] (O) -- (1.000,1.000) -- (0.293,1.707) -- cycle;
        \filldraw[fill=accent!24,draw=accent] (O) -- (0.293,1.707) -- (-0.693,1.876) -- cycle;
        \filldraw[fill=accent!31,draw=accent] (O) -- (-0.693,1.876) -- (-1.631,1.530) -- cycle;
        \filldraw[fill=accent!38,draw=accent] (O) -- (-1.631,1.530) -- (-2.315,0.801) -- cycle;
        \filldraw[fill=accent!45,draw=accent] (O) -- (-2.315,0.801) -- (-2.642,-0.145) -- cycle;
        \node[below] at (.5,0) {1}; \node[right] at (1,.5) {1};
        \node[above right] at (.65,1.35) {1};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de wortelspiraal. De eerste driehoek is rechthoekig, met twee rechthoekszijden van 1. Elke volgende driehoek is rechthoekig, met als rechthoekszijden de schuine zijde van de vorige driehoek en een nieuwe zijde van 1.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de schuine zijde van de eerste vier driehoeken.
      antwoord: |-
        $\sqrt2$, $\sqrt3$, $2$, $\sqrt5$
      uitwerking: |-
        $\sqrt{1 + 1} = \sqrt2$, $\sqrt{2 + 1} = \sqrt3$, $\sqrt{3 + 1} = 2$, $\sqrt{4 + 1} = \sqrt5$. Bij elke stap komt er 1 bij het kwadraat.
    - opgave: |-
        De hoeveelste driehoek heeft een schuine zijde van 4?
      antwoord: |-
        de 15de
      uitwerking: |-
        De schuine zijde van driehoek $n$ is $\sqrt{n + 1}$. Dat is 4 als $n + 1 = 16$, dus $n = 15$.
    - opgave: |-
        Je kunt een lengte als $\sqrt5$~cm ook rechtstreeks tekenen, met één rechthoekige driehoek. Welke rechthoekszijden met een geheel aantal centimeter kies je? En voor $\sqrt{10}$~cm? Teken beide lijnstukken.
      antwoord: |-
        1~cm en 2~cm; 1~cm en 3~cm
      uitwerking: |-
        $1^2 + 2^2 = 5$, dus een rechthoekige driehoek met rechthoekszijden van 1~cm en 2~cm heeft een schuine zijde van $\sqrt5$~cm. Zo ook $1^2 + 3^2 = 10$ voor $\sqrt{10}$~cm. Teken de rechte hoek met je geodriehoek.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    driehoek met een hoogtelijn
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.2,font=\scriptsize]
        \coordinate (A) at (0,0); \coordinate (B) at (14,0); \coordinate (C) at (5,12); \coordinate (D) at (5,0);
        \filldraw[fill=accent!12,draw=accent,thick] (A) -- (B) -- (C) -- cycle;
        \draw[accent,dashed] (C) -- (D);
        \rechtehoek{B}{D}{C}
        \node[below] at (A) {$A$}; \node[below] at (B) {$B$}; \node[above] at (C) {$C$}; \node[below] at (D) {$D$};
        \node[below] at (2.5,0) {5}; \node[below] at (9.5,0) {9}; \node[right] at (5,5) {12};
      \end{tikzpicture}
  opgave: |-
    In driehoek $ABC$ is $[CD]$ de hoogtelijn op $[AB]$, met $\lengte{AD} = 5$, $\lengte{DB} = 9$ en $\lengte{CD} = 12$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\lengte{AC}$ en $\lengte{BC}$.
      antwoord: |-
        $13$ en $15$
      uitwerking: |-
        $\lengte{AC}^2 = 25 + 144 = 169$ en $\lengte{BC}^2 = 81 + 144 = 225$.
    - opgave: |-
        Bereken de omtrek van driehoek $ABC$.
      antwoord: |-
        $42$
      uitwerking: |-
        $13 + 15 + 14 = 42$.
    - opgave: |-
        Bereken de oppervlakte van driehoek $ABC$.
      antwoord: |-
        $84$
      uitwerking: |-
        $\tfrac{14 \cdot 12}{2} = 84$.
    - opgave: |-
        Is driehoek $ABC$ rechthoekig?
      antwoord: |-
        nee
      uitwerking: |-
        De langste zijde is 15: $13^2 + 14^2 = 365 \neq 225 = 15^2$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    piramide
  opgave: |-
    Een tent heeft de vorm van een piramide met een vierkant grondvlak van 4~m bij 4~m en een hoogte van 1,5~m. De top staat recht boven het midden van het grondvlak.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de hoogte van een driehoekig zijvlak.
      antwoord: |-
        $2{,}5$~m
      uitwerking: |-
        Van het midden tot het midden van een zijde is 2~m: $\sqrt{2{,}25 + 4} = \sqrt{6{,}25} = 2{,}5$.
    - opgave: |-
        Bereken de lengte van een opstaande ribbe (van een hoekpunt van het grondvlak tot de top), afgerond op een centimeter.
      antwoord: |-
        $3{,}20$~m
      uitwerking: |-
        In een zijvlak: de hoogte 2,5 en een halve ribbe 2. Dus $\sqrt{6{,}25 + 4} = \sqrt{10{,}25} \approx 3{,}20$.
    - opgave: |-
        Hoeveel tentdoek is er nodig voor de vier zijvlakken?
      antwoord: |-
        $20$~m$^2$
      uitwerking: |-
        $4 \cdot \tfrac{4 \cdot 2{,}5}{2} = 20$.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    kegel
  opgave: |-
    Rond af op twee decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        Een ijshoorntje is een kegel met een straal van 2,5~cm. Van de punt tot de rand is het 12~cm. Hoe diep is het hoorntje?
      antwoord: |-
        $11{,}74$~cm
      uitwerking: |-
        $h^2 = 144 - 6{,}25 = 137{,}75$, dus $h \approx 11{,}74$.
    - opgave: |-
        Een kegelvormige tent is 3~m hoog en heeft een straal van 4~m. Hoe lang is een stok van de top tot de rand?
      antwoord: |-
        $5$~m
      uitwerking: |-
        $s^2 = 9 + 16 = 25$, dus $s = 5$.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    diagonalen in een kamer
  opgave: |-
    Een kamer is 5~m lang, 4~m breed en 2,5~m hoog. Rond af op een centimeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de diagonaal van de vloer?
      antwoord: |-
        $6{,}40$~m
      uitwerking: |-
        $\sqrt{25 + 16} = \sqrt{41} \approx 6{,}40$.
    - opgave: |-
        Hoe ver ligt een hoek van de vloer van de overstaande hoek van het plafond?
      antwoord: |-
        $6{,}87$~m
      uitwerking: |-
        $\sqrt{41 + 6{,}25} = \sqrt{47{,}25} \approx 6{,}87$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    omgekeerde stelling in een context
  opgave: |-
    Een tuinier zet een rechthoekig bloembed van 6~m bij 8~m uit met vier paaltjes. Om na te gaan of de hoeken recht zijn, meet ze de diagonaal.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang moet de diagonaal zijn?
      antwoord: |-
        $10$~m
      uitwerking: |-
        $\sqrt{36 + 64} = 10$. Dan is de hoek recht, volgens de omgekeerde stelling.
    - opgave: |-
        Ze meet 9,9~m. Is de hoek tussen de zijden van 6~m en 8~m dan groter of kleiner dan $90^\circ$? Leg uit.
      antwoord: |-
        kleiner
      uitwerking: |-
        $9{,}9^2 = 98{,}01 < 100 = 6^2 + 8^2$. De zijde tegenover de hoek is te kort voor een rechte hoek, dus de hoek is scherp: de twee zijden staan iets naar elkaar toe.

- id: h1-o19
  soort: opdracht
  niveau: 2
  pakketten: [2, 3, 4, 5]
  thema: |-
    Pythagoras met wortels
  opgave: |-
    Bereken de ontbrekende zijde van de rechthoekige driehoek exact, zonder rekenmachine.
  lijst: enumerate
  delen:
    - opgave: |-
        rechthoekszijden $\sqrt2$ en $\sqrt7$
      antwoord: |-
        $3$
      uitwerking: |-
        $c^2 = 2 + 7 = 9$, dus $c = 3$.
    - opgave: |-
        rechthoekszijden $2\sqrt3$ en $2$
      antwoord: |-
        $4$
      uitwerking: |-
        $c^2 = 4 \cdot 3 + 4 = 16$, dus $c = 4$.
    - opgave: |-
        schuine zijde $3\sqrt5$, rechthoekszijde $3$
      antwoord: |-
        $6$
      uitwerking: |-
        $b^2 = 9 \cdot 5 - 9 = 36$, dus $b = 6$.
    - opgave: |-
        schuine zijde $3$, rechthoekszijde $\sqrt5$
      antwoord: |-
        $2$
      uitwerking: |-
        $b^2 = 9 - 5 = 4$, dus $b = 2$.
    - opgave: |-
        rechthoekszijden $\sqrt{10}$ en $\sqrt{10}$
      antwoord: |-
        $2\sqrt5$
      uitwerking: |-
        $c^2 = 10 + 10 = 20$, dus $c = \sqrt{20} = 2\sqrt5$.

- id: h1-o20
  soort: opdracht
  niveau: 2
  thema: |-
    gelijkzijdige driehoek
  opgave: |-
    Een gelijkzijdige driehoek heeft een omtrek van 30~cm. Geef exact en afgerond op twee decimalen:
  lijst: enumerate
  delen:
    - opgave: |-
        de zijde
      antwoord: |-
        $10$~cm
      uitwerking: |-
        $30 : 3 = 10$.
    - opgave: |-
        de hoogte
      antwoord: |-
        $5\sqrt3 \approx 8{,}66$~cm
      uitwerking: |-
        $h^2 = 100 - 25 = 75$, dus $h = 5\sqrt3$.
    - opgave: |-
        de oppervlakte
      antwoord: |-
        $25\sqrt3 \approx 43{,}30$~cm$^2$
      uitwerking: |-
        $\tfrac{10 \cdot 5\sqrt3}{2} = 25\sqrt3$.

- id: h1-o21
  soort: opdracht
  niveau: 2
  thema: |-
    breedte en hoogte van een scherm
  opgave: |-
    De grootte van een tv-scherm geef je met de diagonaal. Een scherm heeft een diagonaal van 140~cm, en breedte en hoogte staan in de verhouding $16 : 9$. Noem de breedte $16x$ en de hoogte $9x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $337x^2 = 140^2$.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        Pythagoras: $(16x)^2 + (9x)^2 = 140^2$, dus $256x^2 + 81x^2 = 337x^2 = 140^2$.
    - opgave: |-
        Bereken de breedte en de hoogte, afgerond op een millimeter.
      antwoord: |-
        $122{,}0$~cm bij $68{,}6$~cm
      uitwerking: |-
        $x = \tfrac{140}{\sqrt{337}} \approx 7{,}6265$. Breedte $16x \approx 122{,}0$, hoogte $9x \approx 68{,}6$.

- id: h1-o22
  soort: opdracht
  niveau: 2
  thema: |-
    van diagonaal naar ribbe
  opgave: |-
    Een kubus heeft een ruimtediagonaal van 12~cm. Bereken exact en afgerond op twee decimalen:
  lijst: enumerate
  delen:
    - opgave: |-
        de ribbe
      antwoord: |-
        $4\sqrt3 \approx 6{,}93$~cm
      uitwerking: |-
        $3z^2 = 144$, dus $z^2 = 48$ en $z = \sqrt{48} = 4\sqrt3$.
    - opgave: |-
        de diagonaal van een zijvlak
      antwoord: |-
        $4\sqrt6 \approx 9{,}80$~cm
      uitwerking: |-
        $z\sqrt2 = 4\sqrt3 \cdot \sqrt2 = 4\sqrt6$. Of: $\sqrt{2 \cdot 48} = \sqrt{96} = 4\sqrt6$.

- id: h1-o23
  soort: opdracht
  niveau: 3
  pakketten: [1, 2, 3, 4]
  thema: |-
    drietallen van Pythagoras
  opgave: |-
    Drie natuurlijke getallen $a$, $b$ en $c$ met $a^2 + b^2 = c^2$ heten een \textit{drietal van Pythagoras}, zoals 3, 4 en 5.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat 30, 40 en 50 ook een drietal is. Waarom is dat geen toeval?
      antwoord: |-
        $900 + 1600 = 2500$
      uitwerking: |-
        Het is de driehoek 3, 4, 5, tien keer vergroot. Alle kwadraten worden 100 keer zo groot, dus de gelijkheid blijft gelden.
    - opgave: |-
        Neem $a = 2n + 1$, $b = 2n^2 + 2n$ en $c = 2n^2 + 2n + 1$. Bereken $a$, $b$ en $c$ voor $n = 1$, $2$ en $3$, en controleer dat het drietallen zijn.
      antwoord: |-
        3, 4, 5; 5, 12, 13; 7, 24, 25
      uitwerking: |-
        $9 + 16 = 25$, $25 + 144 = 169$ en $49 + 576 = 625$.
    - opgave: |-
        Zoek zo een drietal met $c = 41$.
      antwoord: |-
        9, 40, 41
      uitwerking: |-
        $2n^2 + 2n + 1 = 41$ voor $n = 4$: dan $a = 9$ en $b = 40$, en $81 + 1600 = 1681 = 41^2$.

- id: h1-o23
  soort: opdracht
  niveau: 3
  pakketten: [5]
  thema: |-
    drietallen van Pythagoras
  opgave: |-
    Drie natuurlijke getallen $a$, $b$ en $c$ met $a^2 + b^2 = c^2$ heten een \textit{drietal van Pythagoras}, zoals 3, 4 en 5.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs: als $a$, $b$, $c$ een drietal is, dan is $ka$, $kb$, $kc$ dat ook, voor elk natuurlijk getal $k \geqslant 1$.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        $(ka)^2 + (kb)^2 = k^2(a^2 + b^2) = k^2c^2 = (kc)^2$.
    - opgave: |-
        Bewijs dat $a = 2n + 1$, $b = 2n^2 + 2n$ en $c = 2n^2 + 2n + 1$ voor elk natuurlijk getal $n \geqslant 1$ een drietal is.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        Omdat $c = b + 1$, is $c^2 - b^2 = (c - b)(c + b) = 1 \cdot (4n^2 + 4n + 1) = (2n + 1)^2 = a^2$. Dus $a^2 + b^2 = c^2$.
    - opgave: |-
        Zoek zo een drietal met $c = 41$.
      antwoord: |-
        9, 40, 41
      uitwerking: |-
        $2n^2 + 2n + 1 = 41$ voor $n = 4$: dan $a = 9$ en $b = 40$.

- id: h1-o24
  soort: opdracht
  niveau: 3
  thema: |-
    kortste weg over de wanden
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[scale=.4,font=\scriptsize]
        \filldraw[fill=accent!10,draw=accent] (0,0) rectangle (5,4);
        \filldraw[fill=accent!20,draw=accent] (5,0) rectangle (7.5,4);
        \node at (2.5,2) {vloer}; \node[rotate=90] at (6.25,2) {wand};
        \node[below] at (2.5,0) {5}; \node[left] at (0,2) {4}; \node[below] at (6.25,0) {2,5};
        \fill (0,0) circle (3pt) node[below left] {$S$}; \fill (7.5,4) circle (3pt) node[above right] {$V$};
        \draw[accent,thick,dashed] (0,0) -- (7.5,4);
      \end{tikzpicture}
  opgave: |-
    In de kamer van 5~m bij 4~m bij 2,5~m uit opdracht \ref{oef:h1-o17} zit een spin in een hoek van de vloer ($S$). Ze wil naar de overstaande hoek van het plafond, waar een vlieg ($V$) zit. Ze kan niet vliegen en kruipt over de vloer en de wanden.
  lijst: enumerate
  delen:
    - opgave: |-
        Vouw de vloer en een wand open zoals in de figuur. Hoe lang is de rechte weg van $S$ naar $V$ in die figuur?
      antwoord: |-
        $8{,}5$~m
      uitwerking: |-
        Opengevouwen is het een rechthoek van $5 + 2{,}5 = 7{,}5$ bij 4: $\sqrt{56{,}25 + 16} = \sqrt{72{,}25} = 8{,}5$.
    - opgave: |-
        Er zijn nog andere manieren om open te vouwen. Wat is de kortste weg? Vergelijk met de ruimtediagonaal.
      antwoord: |-
        ongeveer $8{,}20$~m
      uitwerking: |-
        De drie mogelijkheden: $\sqrt{(5 + 4)^2 + 2{,}5^2} \approx 9{,}34$, $\sqrt{(5 + 2{,}5)^2 + 4^2} = 8{,}5$ en $\sqrt{(4 + 2{,}5)^2 + 5^2} = \sqrt{67{,}25} \approx 8{,}20$. De kortste weg is ongeveer 8,20~m, langer dan de ruimtediagonaal van 6,87~m, want die gaat door de lucht.

- id: h1-o25
  soort: opdracht
  niveau: 3
  thema: |-
    scherp, recht of stomp
  opgave: |-
    Vergelijk telkens het kwadraat van de langste zijde met de som van de kwadraten van de twee andere zijden. Is de grootste hoek scherp, recht of stomp? Maak een schets om je antwoord uit te leggen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        5, 6 en 7
      antwoord: |-
        scherp
      uitwerking: |-
        $25 + 36 = 61 > 49$: de langste zijde is korter dan bij een rechte hoek, dus de hoek is scherp.
    - opgave: |-
        4, 5 en 7
      antwoord: |-
        stomp
      uitwerking: |-
        $16 + 25 = 41 < 49$: de langste zijde is langer dan bij een rechte hoek. Draai je de twee korte zijden verder open dan $90^\circ$, dan wordt de zijde ertegenover langer.
    - opgave: |-
        8, 15 en 17
      antwoord: |-
        recht
      uitwerking: |-
        $64 + 225 = 289 = 17^2$.

- id: h1-o26
  soort: opdracht
  niveau: 3
  pakketten: [5]
  thema: |-
    bewijzen met Pythagoras
  opgave: |-
    Bewijs.
  lijst: enumerate
  delen:
    - opgave: |-
        In een ruit met zijde $z$ en diagonalen $d_1$ en $d_2$ is $d_1^2 + d_2^2 = 4z^2$.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        De diagonalen staan loodrecht op elkaar en delen elkaar middendoor. In een van de vier rechthoekige driehoeken: $\bigl(\tfrac{d_1}{2}\bigr)^2 + \bigl(\tfrac{d_2}{2}\bigr)^2 = z^2$, dus $\tfrac{d_1^2 + d_2^2}{4} = z^2$ en $d_1^2 + d_2^2 = 4z^2$.
    - opgave: |-
        In een rechthoekige driehoek met rechthoekszijden $a$ en $b$ en schuine zijde $c$ is de hoogte op de schuine zijde gelijk aan $\dfrac{ab}{c}$.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        Bereken de oppervlakte op twee manieren: met $a$ als basis en $b$ als hoogte is ze $\tfrac{ab}{2}$, met $c$ als basis en $h$ als hoogte is ze $\tfrac{ch}{2}$. Dus $ch = ab$ en $h = \tfrac{ab}{c}$.

- id: h1-o27
  soort: opdracht
  niveau: 3
  pakketten: [4, 5]
  thema: |-
    de vergelijking van een cirkel
  opgave: |-
    De cirkel met middelpunt $M(1, 2)$ en straal 5 bestaat uit alle punten die op afstand 5 van $M$ liggen.
  lijst: enumerate
  delen:
    - opgave: |-
        Ga na dat $P(4, 6)$ en $Q({-2}, {-2})$ op de cirkel liggen.
      antwoord: |-
        $\lengte{MP} = \lengte{MQ} = 5$
      uitwerking: |-
        $\lengte{MP} = \sqrt{3^2 + 4^2} = 5$ en $\lengte{MQ} = \sqrt{({-3})^2 + ({-4})^2} = 5$.
    - opgave: |-
        Ligt $R(6, 2)$ op de cirkel, erbinnen of erbuiten? En $S(5, 4)$?
      antwoord: |-
        $R$ op de cirkel, $S$ erbinnen
      uitwerking: |-
        $\lengte{MR} = \sqrt{5^2 + 0^2} = 5$, dus $R$ ligt op de cirkel. $\lengte{MS} = \sqrt{4^2 + 2^2} = \sqrt{20} \approx 4{,}47 < 5$, dus $S$ ligt binnen de cirkel.
    - opgave: |-
        Toon aan: een punt $(x, y)$ ligt op de cirkel als en slechts als $(x - 1)^2 + (y - 2)^2 = 25$. Die gelijkheid heet de \textit{vergelijking} van de cirkel.
      antwoord: |-
        zie de uitwerking
      uitwerking: |-
        Het punt ligt op de cirkel als zijn afstand tot $M$ gelijk is aan 5: $\sqrt{(x - 1)^2 + (y - 2)^2} = 5$. Beide leden zijn positief, dus dat is hetzelfde als $(x - 1)^2 + (y - 2)^2 = 25$ (kwadrateren, of de wortel nemen).
    - opgave: |-
        In welke punten snijdt de cirkel de $x$-as? Geef ze exact en afgerond op twee decimalen.
      antwoord: |-
        $(1 + \sqrt{21}, 0) \approx (5{,}58;\ 0)$ en $(1 - \sqrt{21}, 0) \approx ({-3}{,}58;\ 0)$
      uitwerking: |-
        Op de $x$-as is $y = 0$: $(x - 1)^2 + 4 = 25$, dus $(x - 1)^2 = 21$ en $x - 1 = \sqrt{21}$ of $x - 1 = -\sqrt{21}$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    schuine zijde berekenen
  opgave: |-
    Een rechthoekige driehoek heeft rechthoekszijden van 6 en 9. Bereken de schuine zijde, exact en afgerond op twee decimalen.
  antwoord: |-
    $3\sqrt{13} \approx 10{,}82$
  uitwerking: |-
    $c^2 = 36 + 81 = 117$, dus $c = \sqrt{117} = \sqrt{9 \cdot 13} = 3\sqrt{13} \approx 10{,}82$.

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    rechthoekszijde berekenen
  opgave: |-
    Driehoek $RST$ is rechthoekig in $S$, met $\lengte{RT} = 15$ en $\lengte{ST} = 9$. Bereken $\lengte{RS}$.
  antwoord: |-
    $12$
  uitwerking: |-
    De schuine zijde ligt tegenover $S$: $[RT]$. Dus $\lengte{RS}^2 = 225 - 81 = 144$ en $\lengte{RS} = 12$.

- id: h1-t3
  soort: test
  niveau: 1
  thema: |-
    omgekeerde stelling
  opgave: |-
    Is een driehoek met deze zijden rechthoekig?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        16, 30 en 34
      antwoord: |-
        ja
      uitwerking: |-
        $256 + 900 = 1156 = 34^2$.
    - opgave: |-
        9, 12 en 16
      antwoord: |-
        nee
      uitwerking: |-
        $81 + 144 = 225 = 15^2$, niet $16^2 = 256$.

- id: h1-t4
  soort: test
  niveau: 2
  thema: |-
    hoogte van een gelijkbenige driehoek
  opgave: |-
    Een gelijkbenige driehoek heeft benen van 10~cm en een basis van 12~cm. Bereken de hoogte en de oppervlakte.
  antwoord: |-
    hoogte $8$~cm, oppervlakte $48$~cm$^2$
  uitwerking: |-
    De halve basis is 6: $h^2 = 100 - 36 = 64$, dus $h = 8$. Oppervlakte: $\tfrac{12 \cdot 8}{2} = 48$.

- id: h1-t5
  soort: test
  niveau: 2
  thema: |-
    afstand tussen twee punten
  opgave: |-
    Bereken de afstand tussen $A({-1}, 4)$ en $B(5, {-4})$.
  antwoord: |-
    $10$
  uitwerking: |-
    Horizontaal $5 - ({-1}) = 6$, verticaal $4 - ({-4}) = 8$: $\sqrt{36 + 64} = 10$.

- id: h1-t6
  soort: test
  niveau: 2
  thema: |-
    diagonaal van een balk
  opgave: |-
    Een doos is 6~cm lang, 2~cm breed en 3~cm hoog. Hoe lang is de langste rechte staaf die erin past?
  antwoord: |-
    $7$~cm
  uitwerking: |-
    De ruimtediagonaal: $\sqrt{36 + 4 + 9} = \sqrt{49} = 7$.

- id: h1-t7
  soort: test
  niveau: 2
  thema: |-
    Pythagoras in een context
  opgave: |-
    Een ladder van 3,25~m staat tegen een verticale muur, met de voet 1,25~m van de muur. Hoe hoog komt de ladder?
  antwoord: |-
    $3$~m
  uitwerking: |-
    $h^2 = 3{,}25^2 - 1{,}25^2 = 10{,}5625 - 1{,}5625 = 9$, dus $h = 3$.
