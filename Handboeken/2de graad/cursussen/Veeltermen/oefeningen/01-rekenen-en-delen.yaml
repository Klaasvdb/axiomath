# Oefeningen van hoofdstuk 1 (rekenen met veeltermen en delen). Zie Opmaak/oefeningenbank.py voor de velden.
# Dit handboek staat alleen in pakket 5: geen veld pakketten nodig.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Werk uit.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3x(2x - 5)$
      antwoord: |-
        $6x^2 - 15x$
      uitwerking: |-
        $3x \cdot 2x - 3x \cdot 5$.
    - opgave: |-
        $(x + 4)(x - 1)$
      antwoord: |-
        $x^2 + 3x - 4$
      uitwerking: |-
        $x^2 - x + 4x - 4$.
    - opgave: |-
        $(x + 3)^2$
      antwoord: |-
        $x^2 + 6x + 9$
      uitwerking: |-
        $(A + B)^2 = A^2 + 2AB + B^2$.
    - opgave: |-
        $(2x - 1)(2x + 1)$
      antwoord: |-
        $4x^2 - 1$
      uitwerking: |-
        $(A - B)(A + B) = A^2 - B^2$.
    - opgave: |-
        $-(x^2 - 3x + 2)$
      antwoord: |-
        $-x^2 + 3x - 2$
      uitwerking: |-
        Elk teken verandert.
    - opgave: |-
        $(x - 5)^2$
      antwoord: |-
        $x^2 - 10x + 25$
      uitwerking: |-
        $(A - B)^2 = A^2 - 2AB + B^2$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Delen met rest.
  lijst: enumerate
  delen:
    - opgave: |-
        Vul aan: $247 = 12 \cdot \vak + \vak$. Hoe vaak gaat $12$ in $247$, en hoeveel blijft er over?
      antwoord: |-
        $247 = 12 \cdot 20 + 7$
      uitwerking: |-
        $12 \cdot 20 = 240$, en $247 - 240 = 7$.
    - opgave: |-
        Lisa schrijft $247 = 12 \cdot 19 + 19$. Klopt die som? Waarom is $19$ toch niet de rest?
      antwoord: |-
        de som klopt, maar $19 > 12$
      uitwerking: |-
        $12 \cdot 19 + 19 = 228 + 19 = 247$: de som klopt. Maar $12$ gaat nog een keer in $19$. De rest moet kleiner zijn dan de deler.
    - opgave: |-
        Met welke veelterm moet je $x + 2$ vermenigvuldigen om $x^2 + 5x + 6$ te krijgen?
      antwoord: |-
        $x + 3$
      uitwerking: |-
        $(x + 2)(x + 3) = x^2 + 5x + 6$ (som $5$, product $6$).
    - opgave: |-
        En om $x^2 + 5x + 7$ te krijgen? Wat blijft er over als je $x + 3$ gebruikt?
      antwoord: |-
        $x^2 + 5x + 7 = (x + 2)(x + 3) + 1$
      uitwerking: |-
        Met $x + 3$ krijg je $x^2 + 5x + 6$: er blijft $1$ over. Zoals bij getallen is er een rest.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h1-graad
  soort: kort
  opgave: |-
    Orden de veelterm. Geef de graad, de hoogstegraadscoëfficiënt en de constante term.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $4x - x^3 + 2$
      antwoord: |-
        $-x^3 + 4x + 2$; $3$; $-1$; $2$
      uitwerking: |-
        $-x^3 + 4x + 2$, graad $3$, hoogstegraadscoëfficiënt $-1$, constante term $2$.
    - opgave: |-
        $5 + 2x^2 - 3x^5 + x$
      antwoord: |-
        $-3x^5 + 2x^2 + x + 5$; $5$; $-3$; $5$
      uitwerking: |-
        $-3x^5 + 2x^2 + x + 5$, graad $5$, hoogstegraadscoëfficiënt $-3$, constante term $5$.
    - opgave: |-
        $x^2 - 6x + 2x^3 - x^2$
      antwoord: |-
        $2x^3 - 6x$; $3$; $2$; $0$
      uitwerking: |-
        De termen $x^2$ en $-x^2$ heffen elkaar op: $2x^3 - 6x$. Graad $3$, hoogstegraadscoëfficiënt $2$, constante term $0$.

- id: h1-getalwaarde
  soort: kort
  opgave: |-
    Gegeven is $A(x) = x^3 - 4x^2 + 2x - 1$. Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $A(0)$
      antwoord: |-
        $-1$
      uitwerking: |-
        Alleen de constante term blijft over.
    - opgave: |-
        $A(1)$
      antwoord: |-
        $-2$
      uitwerking: |-
        $1 - 4 + 2 - 1 = -2$.
    - opgave: |-
        $A(-1)$
      antwoord: |-
        $-8$
      uitwerking: |-
        $-1 - 4 - 2 - 1 = -8$.
    - opgave: |-
        $A(3)$
      antwoord: |-
        $-4$
      uitwerking: |-
        $27 - 36 + 6 - 1 = -4$.
    - opgave: |-
        $A(-2)$
      antwoord: |-
        $-29$
      uitwerking: |-
        $-8 - 16 - 4 - 1 = -29$.
    - opgave: |-
        $A\bigl(\tfrac12\bigr)$
      antwoord: |-
        $-\tfrac78$
      uitwerking: |-
        $\tfrac18 - 4 \cdot \tfrac14 + 1 - 1 = \tfrac18 - 1 = -\tfrac78$.

- id: h1-optellen
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(2x^2 - 5x + 1) + (x^2 + 3x - 4)$
      antwoord: |-
        $3x^2 - 2x - 3$
      uitwerking: |-
        $2x^2 + x^2$, $-5x + 3x$, $1 - 4$.
    - opgave: |-
        $(4x^3 - x + 6) - (2x^3 + x^2 - x + 1)$
      antwoord: |-
        $2x^3 - x^2 + 5$
      uitwerking: |-
        $4x^3 - x + 6 - 2x^3 - x^2 + x - 1$: de termen in $x$ heffen elkaar op.
    - opgave: |-
        $(x^2 - 3x) - (x^2 + 2x - 7)$
      antwoord: |-
        $-5x + 7$
      uitwerking: |-
        $x^2 - 3x - x^2 - 2x + 7$: de graad daalt tot $1$.
    - opgave: |-
        $3(x^2 - 2) - 2(x^2 + x - 3)$
      antwoord: |-
        $x^2 - 2x$
      uitwerking: |-
        $3x^2 - 6 - 2x^2 - 2x + 6 = x^2 - 2x$.

- id: h1-product
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x + 3)(x^2 - 2x + 1)$
      antwoord: |-
        $x^3 + x^2 - 5x + 3$
      uitwerking: |-
        $x^3 - 2x^2 + x + 3x^2 - 6x + 3$.
    - opgave: |-
        $(2x - 1)(3x^2 + x - 2)$
      antwoord: |-
        $6x^3 - x^2 - 5x + 2$
      uitwerking: |-
        $6x^3 + 2x^2 - 4x - 3x^2 - x + 2$.
    - opgave: |-
        $(x^2 + 1)(x^2 - x + 2)$
      antwoord: |-
        $x^4 - x^3 + 3x^2 - x + 2$
      uitwerking: |-
        $x^4 - x^3 + 2x^2 + x^2 - x + 2$.
    - opgave: |-
        $x(x - 2)(x + 3)$
      antwoord: |-
        $x^3 + x^2 - 6x$
      uitwerking: |-
        $x(x^2 + x - 6)$.

- id: h1-merkwaardig
  soort: kort
  opgave: |-
    Werk uit met een merkwaardig product.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(x + 6)^2$
      antwoord: |-
        $x^2 + 12x + 36$
      uitwerking: |-
        $2 \cdot x \cdot 6 = 12x$.
    - opgave: |-
        $(2x - 5)^2$
      antwoord: |-
        $4x^2 - 20x + 25$
      uitwerking: |-
        $(2x)^2 - 2 \cdot 2x \cdot 5 + 25$.
    - opgave: |-
        $(3x + 4)(3x - 4)$
      antwoord: |-
        $9x^2 - 16$
      uitwerking: |-
        $(3x)^2 - 4^2$.
    - opgave: |-
        $(x^2 - 3)^2$
      antwoord: |-
        $x^4 - 6x^2 + 9$
      uitwerking: |-
        $A = x^2$, $B = 3$.
    - opgave: |-
        $(x^3 + 2)(x^3 - 2)$
      antwoord: |-
        $x^6 - 4$
      uitwerking: |-
        $(x^3)^2 - 2^2$.
    - opgave: |-
        $\bigl(\tfrac12 x + 2\bigr)^2$
      antwoord: |-
        $\tfrac14 x^2 + 2x + 4$
      uitwerking: |-
        $\tfrac14 x^2 + 2 \cdot \tfrac12 x \cdot 2 + 4$.

- id: h1-staart
  soort: kort
  opgave: |-
    Deel met een staartdeling. Geef het quotiënt en de rest.
  lijst: enumerate
  delen:
    - opgave: |-
        $(x^3 + 4x^2 - 3x + 2) : (x - 1)$
      antwoord: |-
        $Q(x) = x^2 + 5x + 2$, $R = 4$
      uitwerking: |-
        $x^3 : x = x^2$, rest na de eerste stap $5x^2 - 3x + 2$; $5x^2 : x = 5x$, rest $2x + 2$; $2x : x = 2$, rest $4$. Controle: $(x - 1)(x^2 + 5x + 2) + 4 = x^3 + 4x^2 - 3x + 2$.
    - opgave: |-
        $(2x^3 - x^2 + 4) : (x + 1)$
      antwoord: |-
        $Q(x) = 2x^2 - 3x + 3$, $R = 1$
      uitwerking: |-
        Schrijf $2x^3 - x^2 + 0x + 4$. $2x^3 : x = 2x^2$, rest $-3x^2 + 0x + 4$; $-3x^2 : x = -3x$, rest $3x + 4$; $3x : x = 3$, rest $1$.
    - opgave: |-
        $(6x^2 + 7x - 1) : (2x + 3)$
      antwoord: |-
        $Q(x) = 3x - 1$, $R = 2$
      uitwerking: |-
        $6x^2 : 2x = 3x$, en $3x(2x + 3) = 6x^2 + 9x$: rest $-2x - 1$. $-2x : 2x = -1$, en $-1(2x + 3) = -2x - 3$: rest $2$.

- id: h1-staart2
  soort: kort
  opgave: |-
    Deel met een staartdeling. Geef het quotiënt en de rest.
  lijst: enumerate
  delen:
    - opgave: |-
        $(x^4 - 2x^3 + 3x^2 - x + 5) : (x^2 + 2)$
      antwoord: |-
        $Q(x) = x^2 - 2x + 1$, $R(x) = 3x + 3$
      uitwerking: |-
        Schrijf de deler als $x^2 + 0x + 2$. Stappen: $x^2$, dan $-2x$, dan $1$. Controle: $(x^2 + 2)(x^2 - 2x + 1) + 3x + 3 = x^4 - 2x^3 + 3x^2 - 4x + 2 + 3x + 3$.
    - opgave: |-
        $(2x^3 + x^2 - 5x + 1) : (x^2 - x - 1)$
      antwoord: |-
        $Q(x) = 2x + 3$, $R = 4$
      uitwerking: |-
        $2x^3 : x^2 = 2x$, rest $3x^2 - 3x + 1$; $3x^2 : x^2 = 3$, rest $4$. De rest is hier een getal.
    - opgave: |-
        $(x^4 - 1) : (x^2 + x)$
      antwoord: |-
        $Q(x) = x^2 - x + 1$, $R(x) = -x - 1$
      uitwerking: |-
        Schrijf $x^4 + 0x^3 + 0x^2 + 0x - 1$. Stappen: $x^2$ (rest $-x^3 - 1$), $-x$ (rest $x^2 - 1$), $1$ (rest $-x - 1$).

- id: h1-deelbaar
  soort: kort
  opgave: |-
    Ga met een staartdeling na of $A(x)$ deelbaar is door $B(x)$. Schrijf $A(x)$ zo ja als een product.
  lijst: enumerate
  delen:
    - opgave: |-
        $A(x) = x^3 + 2x^2 - 5x - 6$ en $B(x) = x^2 - x - 2$
      antwoord: |-
        ja: $(x^2 - x - 2)(x + 3)$
      uitwerking: |-
        $x^3 : x^2 = x$, rest $3x^2 - 3x - 6$; $3x^2 : x^2 = 3$, rest $0$. Dus $A(x) = (x^2 - x - 2)(x + 3)$.
    - opgave: |-
        $A(x) = 2x^3 - 3x^2 + 4x - 1$ en $B(x) = x^2 + 1$
      antwoord: |-
        nee: rest $2x + 2$
      uitwerking: |-
        Quotiënt $2x - 3$, rest $2x + 2 \neq 0$: niet deelbaar.

- id: h1-horner
  soort: kort
  opgave: |-
    Deel met het schema van Horner. Geef het quotiënt en de rest.
  lijst: enumerate
  delen:
    - opgave: |-
        $(x^3 - 5x^2 + 7x - 3) : (x - 3)$
      antwoord: |-
        $Q(x) = x^2 - 2x + 1$, $R = 0$
      uitwerking: |-
        \horner{3}{3}{1 & -5 & 7 & -3}{ & 3 & -6 & 3}{1 & -2 & 1}{0}
    - opgave: |-
        $(2x^3 + x^2 - 8x + 1) : (x - 2)$
      antwoord: |-
        $Q(x) = 2x^2 + 5x + 2$, $R = 5$
      uitwerking: |-
        \horner{3}{2}{2 & 1 & -8 & 1}{ & 4 & 10 & 4}{2 & 5 & 2}{5}
    - opgave: |-
        $(3x^4 - x^3 + 2x - 4) : (x - 1)$
      antwoord: |-
        $Q(x) = 3x^3 + 2x^2 + 2x + 4$, $R = 0$
      uitwerking: |-
        Vergeet de $0$ van $x^2$ niet. \horner{4}{1}{3 & -1 & 0 & 2 & -4}{ & 3 & 2 & 2 & 4}{3 & 2 & 2 & 4}{0}

- id: h1-horner2
  soort: kort
  opgave: |-
    Deel met het schema van Horner. Geef het quotiënt en de rest.
  lijst: enumerate
  delen:
    - opgave: |-
        $(x^3 + 6x^2 + 5x - 4) : (x + 2)$
      antwoord: |-
        $Q(x) = x^2 + 4x - 3$, $R = 2$
      uitwerking: |-
        \horner{3}{-2}{1 & 6 & 5 & -4}{ & -2 & -8 & 6}{1 & 4 & -3}{2}
    - opgave: |-
        $(2x^4 - 5x^2 + 3) : (x + 1)$
      antwoord: |-
        $Q(x) = 2x^3 - 2x^2 - 3x + 3$, $R = 0$
      uitwerking: |-
        \horner{4}{-1}{2 & 0 & -5 & 0 & 3}{ & -2 & 2 & 3 & -3}{2 & -2 & -3 & 3}{0}
    - opgave: |-
        $(x^3 - 8) : (x + 3)$
      antwoord: |-
        $Q(x) = x^2 - 3x + 9$, $R = -35$
      uitwerking: |-
        \horner{3}{-3}{1 & 0 & 0 & -8}{ & -3 & 9 & -27}{1 & -3 & 9}{-35}

# --- Opdrachten ------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    wat is een veelterm
  opgave: |-
    Is het een veelterm? Zo ja, geef de graad.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $3x^4 - x + 1$
      antwoord: |-
        ja, graad $4$
    - opgave: |-
        $\tfrac{2}{x} + 1$
      antwoord: |-
        nee
    - opgave: |-
        $7$
      antwoord: |-
        ja, graad $0$
    - opgave: |-
        $\sqrt{x} + 3$
      antwoord: |-
        nee
    - opgave: |-
        $\tfrac{x^2}{3} - x$
      antwoord: |-
        ja, graad $2$
    - opgave: |-
        $\sqrt2\,x^3 + x$
      antwoord: |-
        ja, graad $3$
    - opgave: |-
        $x^2 - (x + 1)^2$
      antwoord: |-
        ja, graad $1$
    - opgave: |-
        $0$
      antwoord: |-
        ja, zonder graad
  uitwerking: |-
    \textbf{b.}~$x$ staat in de noemer. \textbf{d.}~$x$ staat onder een wortel. \textbf{e.}~$\tfrac{x^2}{3} = \tfrac13 x^2$: de coëfficiënt mag een breuk zijn. \textbf{f.}~$\sqrt2$ is de coëfficiënt; de wortel staat niet boven $x$. \textbf{g.}~$x^2 - x^2 - 2x - 1 = -2x - 1$. \textbf{h.}~De nulveelterm heeft geen graad.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    getalwaarde
  opgave: |-
    Bereken de getalwaarde.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $A(2)$ voor $A(x) = 3x^2 - 2x + 1$
      antwoord: |-
        $9$
      uitwerking: |-
        $12 - 4 + 1$.
    - opgave: |-
        $B(-1)$ voor $B(x) = x^4 - x^2 + 5$
      antwoord: |-
        $5$
      uitwerking: |-
        $1 - 1 + 5$.
    - opgave: |-
        $C(-3)$ voor $C(x) = -2x^3 + x$
      antwoord: |-
        $51$
      uitwerking: |-
        $-2 \cdot (-27) - 3 = 54 - 3$.
    - opgave: |-
        $D(2)$ voor $D(x) = x^5 - 32$
      antwoord: |-
        $0$
      uitwerking: |-
        $2^5 = 32$.
    - opgave: |-
        $E\bigl(\tfrac12\bigr)$ voor $E(x) = 4x^3 - 2x^2 + 1$
      antwoord: |-
        $1$
      uitwerking: |-
        $4 \cdot \tfrac18 - 2 \cdot \tfrac14 + 1 = \tfrac12 - \tfrac12 + 1$.
    - opgave: |-
        $F(-5)$ voor $F(x) = x^2 + 5x - 1$
      antwoord: |-
        $-1$
      uitwerking: |-
        $25 - 25 - 1$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    vermenigvuldigen
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x - 4)(x + 5)$
      antwoord: |-
        $x^2 + x - 20$
    - opgave: |-
        $(3x + 2)(x^2 - x + 4)$
      antwoord: |-
        $3x^3 - x^2 + 10x + 8$
      uitwerking: |-
        $3x^3 - 3x^2 + 12x + 2x^2 - 2x + 8$.
    - opgave: |-
        $(x^2 - 2x)(x^2 + 2x)$
      antwoord: |-
        $x^4 - 4x^2$
      uitwerking: |-
        Ook als $(A - B)(A + B)$ met $A = x^2$ en $B = 2x$.
    - opgave: |-
        $(2x^2 + x - 1)(x - 3)$
      antwoord: |-
        $2x^3 - 5x^2 - 4x + 3$
      uitwerking: |-
        $2x^3 - 6x^2 + x^2 - 3x - x + 3$.
    - opgave: |-
        $(x + 1)(x + 2)(x + 3)$
      antwoord: |-
        $x^3 + 6x^2 + 11x + 6$
      uitwerking: |-
        $(x^2 + 3x + 2)(x + 3) = x^3 + 3x^2 + 3x^2 + 9x + 2x + 6$.
    - opgave: |-
        $(x^2 + x + 1)(x^2 - x + 1)$
      antwoord: |-
        $x^4 + x^2 + 1$
      uitwerking: |-
        Negen producten; de termen in $x^3$ en in $x$ heffen elkaar op, en $x^2 - x^2 + x^2 = x^2$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    optellen en aftrekken
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(5x^3 - 2x + 7) + (-3x^3 + x^2 + 2x - 1)$
      antwoord: |-
        $2x^3 + x^2 + 6$
    - opgave: |-
        $(x^2 - 4x + 3) - (3x^2 - 4x - 2)$
      antwoord: |-
        $-2x^2 + 5$
    - opgave: |-
        $(2x^4 - x^2) - (x^4 + x^3 - x^2 + 1)$
      antwoord: |-
        $x^4 - x^3 - 1$
    - opgave: |-
        $2(x^3 - x + 1) + 3(x^2 + x - 1)$
      antwoord: |-
        $2x^3 + 3x^2 + x - 1$
    - opgave: |-
        $-(x^2 - 5) + (4x^2 - 3x) - (x + 2)$
      antwoord: |-
        $3x^2 - 4x + 3$
    - opgave: |-
        $4x - \bigl(3x^2 - (x - 2)\bigr)$
      antwoord: |-
        $-3x^2 + 5x - 2$
  uitwerking: |-
    \textbf{b.}~$x^2 - 4x + 3 - 3x^2 + 4x + 2$. \textbf{e.}~$-x^2 + 5 + 4x^2 - 3x - x - 2$. \textbf{f.}~Werk de binnenste haakjes eerst weg: $3x^2 - (x - 2) = 3x^2 - x + 2$, dus $4x - 3x^2 + x - 2$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    het schema van Horner
  opgave: |-
    Deel met het schema van Horner. Geef het quotiënt en de rest.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x^3 + 2x^2 - x + 4) : (x - 1)$
      antwoord: |-
        $x^2 + 3x + 2$, rest $6$
    - opgave: |-
        $(2x^3 - 7x^2 + 4x + 5) : (x - 3)$
      antwoord: |-
        $2x^2 - x + 1$, rest $8$
    - opgave: |-
        $(x^4 - 10x^2 + 9) : (x - 3)$
      antwoord: |-
        $x^3 + 3x^2 - x - 3$, rest $0$
      uitwerking: |-
        \horner{4}{3}{1 & 0 & -10 & 0 & 9}{ & 3 & 9 & -3 & -9}{1 & 3 & -1 & -3}{0}
    - opgave: |-
        $(x^3 + 3x^2 - 4) : (x + 2)$
      antwoord: |-
        $x^2 + x - 2$, rest $0$
      uitwerking: |-
        \horner{3}{-2}{1 & 3 & 0 & -4}{ & -2 & -2 & 4}{1 & 1 & -2}{0}
    - opgave: |-
        $(3x^3 - 2x + 5) : (x + 1)$
      antwoord: |-
        $3x^2 - 3x + 1$, rest $4$
      uitwerking: |-
        \horner{3}{-1}{3 & 0 & -2 & 5}{ & -3 & 3 & -1}{3 & -3 & 1}{4}
    - opgave: |-
        $(x^5 - 1) : (x - 1)$
      antwoord: |-
        $x^4 + x^3 + x^2 + x + 1$, rest $0$
      uitwerking: |-
        Coëfficiënten $1, 0, 0, 0, 0, -1$: onderaan telkens $1$, de rest is $-1 + 1 = 0$.
    - opgave: |-
        $(-x^3 + 4x^2 - x + 2) : (x - 4)$
      antwoord: |-
        $-x^2 - 1$, rest $-2$
      uitwerking: |-
        \horner{3}{4}{-1 & 4 & -1 & 2}{ & -4 & 0 & -4}{-1 & 0 & -1}{-2}
    - opgave: |-
        $(2x^4 + 3x^3 - x - 6) : (x + 2)$
      antwoord: |-
        $2x^3 - x^2 + 2x - 5$, rest $4$
      uitwerking: |-
        \horner{4}{-2}{2 & 3 & 0 & -1 & -6}{ & -4 & 2 & -4 & 10}{2 & -1 & 2 & -5}{4}

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    merkwaardige producten
  opgave: |-
    Werk uit met een merkwaardig product.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(x - 7)^2$
      antwoord: |-
        $x^2 - 14x + 49$
    - opgave: |-
        $(4x + 1)^2$
      antwoord: |-
        $16x^2 + 8x + 1$
    - opgave: |-
        $(5 - 2x)(5 + 2x)$
      antwoord: |-
        $-4x^2 + 25$
    - opgave: |-
        $(x^2 + 4)^2$
      antwoord: |-
        $x^4 + 8x^2 + 16$
    - opgave: |-
        $(3x^2 - x)^2$
      antwoord: |-
        $9x^4 - 6x^3 + x^2$
    - opgave: |-
        $\bigl(x - \tfrac13\bigr)\bigl(x + \tfrac13\bigr)$
      antwoord: |-
        $x^2 - \tfrac19$
  uitwerking: |-
    \textbf{c.}~$5^2 - (2x)^2 = 25 - 4x^2$. \textbf{e.}~$A = 3x^2$, $B = x$: $9x^4 - 2 \cdot 3x^2 \cdot x + x^2$. \textbf{f.}~$x^2 - \bigl(\tfrac13\bigr)^2$.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    de staartdeling
  opgave: |-
    Deel. Gebruik het schema van Horner als dat kan, anders een staartdeling. Geef het quotiënt en de rest.
  lijst: enumerate
  delen:
    - opgave: |-
        $(x^3 - 2x^2 - 5x + 4) : (x - 3)$
      antwoord: |-
        $x^2 + x - 2$, rest $-2$
      uitwerking: |-
        \horner{3}{3}{1 & -2 & -5 & 4}{ & 3 & 3 & -6}{1 & 1 & -2}{-2}
    - opgave: |-
        $(4x^3 - 4x^2 + x + 3) : (2x - 1)$
      antwoord: |-
        $2x^2 - x$, rest $3$
      uitwerking: |-
        Staartdeling: $4x^3 : 2x = 2x^2$, rest $-2x^2 + x + 3$; $-2x^2 : 2x = -x$, rest $3$. Controle: $(2x - 1)(2x^2 - x) + 3 = 4x^3 - 2x^2 - 2x^2 + x + 3$.
    - opgave: |-
        $(6x^3 + 7x^2 - x + 1) : (3x + 2)$
      antwoord: |-
        $2x^2 + x - 1$, rest $3$
      uitwerking: |-
        Staartdeling: $6x^3 : 3x = 2x^2$, rest $3x^2 - x + 1$; $3x^2 : 3x = x$, rest $-3x + 1$; $-3x : 3x = -1$, rest $3$.
    - opgave: |-
        $(x^4 + x^3 - 2x + 1) : (x + 2)$
      antwoord: |-
        $x^3 - x^2 + 2x - 6$, rest $13$
      uitwerking: |-
        \horner{4}{-2}{1 & 1 & 0 & -2 & 1}{ & -2 & 2 & -4 & 12}{1 & -1 & 2 & -6}{13}

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    de graad van een som en een product
  opgave: |-
    Bepaal de graad zonder de haakjes uit te werken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x^3 + 1)(x^2 - 4)$
      antwoord: |-
        $5$
    - opgave: |-
        $(2x - 1)^3$
      antwoord: |-
        $3$
    - opgave: |-
        $(x^2 + x)(x^4 - 1)(x + 2)$
      antwoord: |-
        $7$
    - opgave: |-
        $(x^2 + 3x) + (2x^2 - 1)$
      antwoord: |-
        $2$
    - opgave: |-
        $(x^3 + x) - (x^3 - 5)$
      antwoord: |-
        $1$
    - opgave: |-
        $(x^2 + 1)^2 - x^4$
      antwoord: |-
        $2$
  uitwerking: |-
    \textbf{a.}~$3 + 2$. \textbf{b.}~$1 + 1 + 1$. \textbf{c.}~$2 + 4 + 1$. \textbf{d.}~$x^2 + 2x^2 = 3x^2$ valt niet weg. \textbf{e.}~De termen $x^3$ heffen elkaar op: $x + 5$. \textbf{f.}~$x^4$ valt weg, en de hoogste term die overblijft is $2x^2$.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    staartdeling door een veelterm van graad 2
  opgave: |-
    Deel met een staartdeling. Geef het quotiënt en de rest.
  lijst: enumerate
  delen:
    - opgave: |-
        $(x^3 + 3x^2 - 2x + 5) : (x^2 + x - 1)$
      antwoord: |-
        $x + 2$, rest $-3x + 7$
      uitwerking: |-
        $x^3 : x^2 = x$, rest $2x^2 - x + 5$; $2x^2 : x^2 = 2$, rest $-3x + 7$.
    - opgave: |-
        $(2x^4 - x^3 + 3x - 1) : (x^2 - 2)$
      antwoord: |-
        $2x^2 - x + 4$, rest $x + 7$
      uitwerking: |-
        Schrijf $2x^4 - x^3 + 0x^2 + 3x - 1$ en $x^2 + 0x - 2$. Stappen: $2x^2$ (rest $-x^3 + 4x^2 + 3x - 1$), $-x$ (rest $4x^2 + x - 1$), $4$ (rest $x + 7$).
    - opgave: |-
        $(x^4 + 4) : (x^2 + 2x + 2)$
      antwoord: |-
        $x^2 - 2x + 2$, rest $0$
      uitwerking: |-
        Stappen: $x^2$ (rest $-2x^3 - 2x^2 + 4$), $-2x$ (rest $2x^2 + 4x + 4$), $2$ (rest $0$). Dus $x^4 + 4 = (x^2 + 2x + 2)(x^2 - 2x + 2)$.
    - opgave: |-
        $(3x^3 - 5x^2 + 2) : (x^2 - x)$
      antwoord: |-
        $3x - 2$, rest $-2x + 2$
      uitwerking: |-
        $3x^3 : x^2 = 3x$, rest $-2x^2 + 2$; $-2x^2 : x^2 = -2$, rest $-2x + 2$.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    een fout in het schema van Horner
  opgave: |-
    Jonas deelt $x^3 - 2x^2 + 3$ door $x + 1$ met het schema van Horner. Hij vindt het quotiënt $x^2 - x - 1$ en de rest $2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Controleer zijn uitkomst met deler $\cdot$ quotiënt $+$ rest.
      antwoord: |-
        fout: je krijgt $x^3 - 2x + 1$
      uitwerking: |-
        $(x + 1)(x^2 - x - 1) + 2 = x^3 - x^2 - x + x^2 - x - 1 + 2 = x^3 - 2x + 1$. Dat is niet het deeltal.
    - opgave: |-
        Welke fout maakte Jonas?
      antwoord: |-
        hij zette $1$ in plaats van $-1$ links
      uitwerking: |-
        Zijn uitkomst is die van de deling door $x - 1$. Bij $x + 1 = x - (-1)$ hoort $-1$ links in het schema.
    - opgave: |-
        Deel juist.
      antwoord: |-
        $x^2 - 3x + 3$, rest $0$
      uitwerking: |-
        \horner{3}{-1}{1 & -2 & 0 & 3}{ & -1 & 3 & -3}{1 & -3 & 3}{0}

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    deeltal $=$ deler $\cdot$ quotiënt $+$ rest
  opgave: |-
    Bepaal het deeltal $A(x)$.
  lijst: enumerate
  delen:
    - opgave: |-
        De deler is $x - 3$, het quotiënt $x^2 + 2x - 1$ en de rest $4$.
      antwoord: |-
        $x^3 - x^2 - 7x + 7$
      uitwerking: |-
        $(x - 3)(x^2 + 2x - 1) + 4 = x^3 + 2x^2 - x - 3x^2 - 6x + 3 + 4$.
    - opgave: |-
        De deler is $x^2 + 1$, het quotiënt $2x - 3$ en de rest $x + 4$.
      antwoord: |-
        $2x^3 - 3x^2 + 3x + 1$
      uitwerking: |-
        $(x^2 + 1)(2x - 3) + x + 4 = 2x^3 - 3x^2 + 2x - 3 + x + 4$.
    - opgave: |-
        De deler is $2x + 1$, het quotiënt $x^2 - x$ en de rest $-3$.
      antwoord: |-
        $2x^3 - x^2 - x - 3$
      uitwerking: |-
        $(2x + 1)(x^2 - x) - 3 = 2x^3 - 2x^2 + x^2 - x - 3$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    rekenen met veeltermen
  opgave: |-
    Werk uit en vereenvoudig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x + 2)^2 - (x - 2)^2$
      antwoord: |-
        $8x$
      uitwerking: |-
        $x^2 + 4x + 4 - x^2 + 4x - 4$.
    - opgave: |-
        $(x + 1)(x - 1)(x^2 + 1)$
      antwoord: |-
        $x^4 - 1$
      uitwerking: |-
        $(x^2 - 1)(x^2 + 1)$: twee keer $(A - B)(A + B)$.
    - opgave: |-
        $2x(x - 3) - (x - 1)^2$
      antwoord: |-
        $x^2 - 4x - 1$
      uitwerking: |-
        $2x^2 - 6x - (x^2 - 2x + 1)$.
    - opgave: |-
        $(x^2 - x + 1)(x + 1)$
      antwoord: |-
        $x^3 + 1$
      uitwerking: |-
        $x^3 + x^2 - x^2 - x + x + 1$.
    - opgave: |-
        $(2x + 1)^2 - (2x + 1)(2x - 1)$
      antwoord: |-
        $4x + 2$
      uitwerking: |-
        $4x^2 + 4x + 1 - (4x^2 - 1)$.
    - opgave: |-
        $(x - 3)(x + 3) - (x - 3)^2$
      antwoord: |-
        $6x - 18$
      uitwerking: |-
        $x^2 - 9 - (x^2 - 6x + 9)$.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    deelbaarheid
  opgave: |-
    Is $A(x)$ deelbaar door $B(x)$? Schrijf $A(x)$ zo ja als een product.
  lijst: enumerate
  delen:
    - opgave: |-
        $A(x) = x^3 - 6x^2 + 11x - 6$ en $B(x) = x - 2$
      antwoord: |-
        ja: $(x - 2)(x^2 - 4x + 3)$
      uitwerking: |-
        \horner{3}{2}{1 & -6 & 11 & -6}{ & 2 & -8 & 6}{1 & -4 & 3}{0}
    - opgave: |-
        $A(x) = x^4 - 16$ en $B(x) = x^2 + 4$
      antwoord: |-
        ja: $(x^2 + 4)(x^2 - 4)$
      uitwerking: |-
        Staartdeling, of het merkwaardig product $(x^2)^2 - 4^2$.
    - opgave: |-
        $A(x) = 2x^3 + x^2 + 3$ en $B(x) = x + 1$
      antwoord: |-
        nee: rest $2$
      uitwerking: |-
        \horner{3}{-1}{2 & 1 & 0 & 3}{ & -2 & 1 & -1}{2 & -1 & 1}{2}
    - opgave: |-
        $A(x) = x^3 + x^2 + x + 1$ en $B(x) = x^2 + 1$
      antwoord: |-
        ja: $(x^2 + 1)(x + 1)$
      uitwerking: |-
        $x^3 : x^2 = x$, rest $x^2 + 1$; $x^2 : x^2 = 1$, rest $0$.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    algebrategels
  opgave: |-
    De figuur toont een rechthoek van algebrategels.
  figuur:
    code: |-
      \begin{tikzpicture}
        \tegels[1.2]{3}{1}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf de oppervlakte als een product en als een veelterm.
      antwoord: |-
        $(x + 3)(x + 1) = x^2 + 4x + 3$
      uitwerking: |-
        De zijden zijn $x + 3$ en $x + 1$. Er liggen één vierkant, vier staafjes en drie eenheden.
    - opgave: |-
        Met welke tegels leg je een rechthoek van $x + 2$ op $x + 4$? Hoeveel tegels van elke soort heb je nodig?
      antwoord: |-
        $1$ vierkant, $6$ staafjes, $8$ eenheden
      uitwerking: |-
        $(x + 2)(x + 4) = x^2 + 6x + 8$.
    - opgave: |-
        Lukt het met één vierkant, vier staafjes en vijf eenheden een rechthoek te leggen met een zijde van $x + 1$? Deel $x^2 + 4x + 5$ door $x + 1$ en verklaar.
      antwoord: |-
        nee: quotiënt $x + 3$, rest $2$
      uitwerking: |-
        $x^2 + 4x + 5 = (x + 1)(x + 3) + 2$. Een rechthoek van $x + 1$ op $x + 3$ gebruikt drie eenheden, en er blijven twee eenheden over: dat is de rest.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    de graad van quotiënt en rest
  opgave: |-
    Zeg zonder te delen welke graad het quotiënt heeft, en welke graad de rest hoogstens heeft.
  lijst: enumerate
  delen:
    - opgave: |-
        $(x^5 - 3x^2 + 1) : (x^2 + 1)$
      antwoord: |-
        $3$; hoogstens $1$
      uitwerking: |-
        $\gr Q(x) = 5 - 2 = 3$. De rest heeft een graad kleiner dan $2$.
    - opgave: |-
        Een veelterm van graad $4$ gedeeld door $x + 7$.
      antwoord: |-
        $3$; de rest is een getal
      uitwerking: |-
        $4 - 1 = 3$. De rest heeft graad $0$ of is $0$.
    - opgave: |-
        Een veelterm van graad $6$ gedeeld door een veelterm van graad $3$.
      antwoord: |-
        $3$; hoogstens $2$
      uitwerking: |-
        $6 - 3 = 3$, en de rest heeft een graad kleiner dan $3$.
    - opgave: |-
        $(x^2 + 1) : (x^3 - x)$
      antwoord: |-
        het quotiënt is $0$, de rest is $x^2 + 1$
      uitwerking: |-
        De deler heeft een hogere graad dan het deeltal: $x^2 + 1 = (x^3 - x) \cdot 0 + (x^2 + 1)$, zoals $5 = 12 \cdot 0 + 5$ bij getallen.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    fouten met merkwaardige producten
  opgave: |-
    Sara maakte deze berekeningen. Zoek de fout en verbeter.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x + 5)^2 = x^2 + 25$
      antwoord: |-
        $x^2 + 10x + 25$
      uitwerking: |-
        Het dubbel product $2 \cdot x \cdot 5$ ontbreekt.
    - opgave: |-
        $-(x - 3)^2 = -x^2 - 6x - 9$
      antwoord: |-
        $-x^2 + 6x - 9$
      uitwerking: |-
        Eerst $(x - 3)^2 = x^2 - 6x + 9$, dan alle tekens veranderen.
    - opgave: |-
        $(2x^3)^2 = 2x^6$
      antwoord: |-
        $4x^6$
      uitwerking: |-
        Ook de $2$ wordt gekwadrateerd.
    - opgave: |-
        $(x^2 + 2)(x^2 - 2) = x^2 - 4$
      antwoord: |-
        $x^4 - 4$
      uitwerking: |-
        $(x^2)^2 = x^4$.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: de lengte van een tuin
  opgave: |-
    Een rechthoekige tuin heeft een oppervlakte van $2x^2 + 11x + 12$~m$^2$ en is $x + 4$~m breed.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de tuin?
      antwoord: |-
        $2x + 3$~m
      uitwerking: |-
        \horner{2}{-4}{2 & 11 & 12}{ & -8 & -12}{2 & 3}{0}
        De lengte is $2x + 3$~m.
    - opgave: |-
        Neem $x = 6$. Bereken de breedte, de lengte en de oppervlakte, en controleer de oppervlakte met de veelterm.
      antwoord: |-
        $10$~m, $15$~m, $150$~m$^2$
      uitwerking: |-
        Breedte $10$~m, lengte $15$~m, oppervlakte $150$~m$^2$. Met de veelterm: $2 \cdot 36 + 66 + 12 = 150$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    delen als omgekeerde van vermenigvuldigen
  opgave: |-
    Zoek de ontbrekende veelterm.
  lijst: enumerate
  delen:
    - opgave: |-
        Met welke veelterm moet je $x - 2$ vermenigvuldigen om $x^3 - 3x^2 + 4$ te krijgen?
      antwoord: |-
        $x^2 - x - 2$
      uitwerking: |-
        \horner{3}{2}{1 & -3 & 0 & 4}{ & 2 & -2 & -4}{1 & -1 & -2}{0}
    - opgave: |-
        Met welke veelterm moet je $x^2 + 2x$ vermenigvuldigen om $x^4 + 2x^3 - x^2 - 2x$ te krijgen?
      antwoord: |-
        $x^2 - 1$
      uitwerking: |-
        Staartdeling: $x^4 : x^2 = x^2$, rest $-x^2 - 2x$; $-x^2 : x^2 = -1$, rest $0$.
    - opgave: |-
        Bestaat er een veelterm $Q(x)$ met $(x + 1) \cdot Q(x) = x^2 + 1$?
      antwoord: |-
        nee
      uitwerking: |-
        $x^2 + 1 = (x + 1)(x - 1) + 2$: de rest is $2$, dus $x^2 + 1$ is niet deelbaar door $x + 1$.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: de hoogte van een balk
  opgave: |-
    Een balk heeft een inhoud van $2x^3 + 9x^2 + 7x - 6$~cm$^3$. Het grondvlak is een rechthoek van $x + 2$~cm op $x + 3$~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe hoog is de balk?
      antwoord: |-
        $2x - 1$~cm
      uitwerking: |-
        Het grondvlak is $(x + 2)(x + 3) = x^2 + 5x + 6$. Staartdeling: $2x^3 : x^2 = 2x$, rest $-x^2 - 5x - 6$; $-x^2 : x^2 = -1$, rest $0$. De hoogte is $2x - 1$~cm.
    - opgave: |-
        Voor welke $x$ is de balk $9$~cm hoog? Hoeveel is de inhoud dan?
      antwoord: |-
        $x = 5$, $504$~cm$^3$
      uitwerking: |-
        $2x - 1 = 9$ geeft $x = 5$. De balk is $7$ op $8$ op $9$~cm: $504$~cm$^3$. Met de veelterm: $250 + 225 + 35 - 6 = 504$.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    de derde macht van een som
  opgave: |-
    De derde macht van een som.
  lijst: enumerate
  delen:
    - opgave: |-
        Werk $(x + 1)^3$ uit als $(x + 1)^2 \cdot (x + 1)$.
      antwoord: |-
        $x^3 + 3x^2 + 3x + 1$
      uitwerking: |-
        $(x^2 + 2x + 1)(x + 1) = x^3 + x^2 + 2x^2 + 2x + x + 1$.
    - opgave: |-
        Werk op dezelfde manier $(A + B)^3$ uit.
      antwoord: |-
        $A^3 + 3A^2B + 3AB^2 + B^3$
      uitwerking: |-
        $(A^2 + 2AB + B^2)(A + B) = A^3 + A^2B + 2A^2B + 2AB^2 + AB^2 + B^3$.
    - opgave: |-
        Gebruik je formule om $(2x - 3)^3$ uit te werken.
      antwoord: |-
        $8x^3 - 36x^2 + 54x - 27$
      uitwerking: |-
        $A = 2x$ en $B = -3$: $8x^3 + 3 \cdot 4x^2 \cdot (-3) + 3 \cdot 2x \cdot 9 + (-27)$.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    twee keer het schema van Horner
  opgave: |-
    De bodem van de aquaria uit het probleem van dit hoofdstuk is $(x + 1)(x + 2)$, de inhoud $x^3 + 7x^2 + 14x + 8$.
  lijst: enumerate
  delen:
    - opgave: |-
        Deel de inhoud met het schema van Horner door $x + 1$. Deel het quotiënt daarna door $x + 2$.
      antwoord: |-
        $x^2 + 6x + 8$, daarna $x + 4$; telkens rest $0$
      uitwerking: |-
        \horner{3}{-1}{1 & 7 & 14 & 8}{ & -1 & -6 & -8}{1 & 6 & 8}{0}\qquad
        \horner{2}{-2}{1 & 6 & 8}{ & -2 & -8}{1 & 4}{0}
    - opgave: |-
        Leg uit waarom je zo dezelfde hoogte vindt als met de staartdeling door $x^2 + 3x + 2$.
      antwoord: |-
        de inhoud is $(x + 1)(x + 2)(x + 4)$
      uitwerking: |-
        Uit de eerste deling volgt $x^3 + 7x^2 + 14x + 8 = (x + 1)(x^2 + 6x + 8)$, uit de tweede $x^2 + 6x + 8 = (x + 2)(x + 4)$. Dus is de inhoud $(x + 1)(x + 2)(x + 4)$, en de hoogte $x + 4$.
    - opgave: |-
        Bereken op dezelfde manier $(x^3 + 2x^2 - x - 2) : (x^2 - 1)$. Gebruik $x^2 - 1 = (x - 1)(x + 1)$.
      antwoord: |-
        $x + 2$, rest $0$
      uitwerking: |-
        Delen door $x - 1$ geeft $x^2 + 3x + 2$ met rest $0$, en dat delen door $x + 1$ geeft $x + 2$ met rest $0$.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    delen door $2x - 1$ met het schema van Horner
  opgave: |-
    Je wilt $2x^3 + 3x^2 - x + 1$ delen door $2x - 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Deel met het schema van Horner door $x - \tfrac12$.
      antwoord: |-
        $2x^2 + 4x + 1$, rest $\tfrac32$
      uitwerking: |-
        \horner{3}{\tfrac12}{2 & 3 & -1 & 1}{ & 1 & 2 & \tfrac12}{2 & 4 & 1}{\tfrac32}
    - opgave: |-
        Er geldt $2x - 1 = 2\bigl(x - \tfrac12\bigr)$. Bepaal daarmee het quotiënt en de rest van de deling door $2x - 1$.
      antwoord: |-
        $x^2 + 2x + \tfrac12$, rest $\tfrac32$
      uitwerking: |-
        \[2x^3 + 3x^2 - x + 1 = \Bigl(x - \frac12\Bigr)(2x^2 + 4x + 1) + \frac32 = (2x - 1)\Bigl(x^2 + 2x + \frac12\Bigr) + \frac32.\]
        Het quotiënt wordt gedeeld door $2$, de rest blijft dezelfde.
    - opgave: |-
        Controleer met een staartdeling.
      antwoord: |-
        zelfde uitkomst
      uitwerking: |-
        $2x^3 : 2x = x^2$, rest $4x^2 - x + 1$; $4x^2 : 2x = 2x$, rest $x + 1$; $x : 2x = \tfrac12$, rest $\tfrac32$.

- id: h1-o23
  soort: opdracht
  niveau: 3
  thema: |-
    staartdeling met letters
  opgave: |-
    Bepaal de getallen $p$ en $q$ zo dat $x^3 + 2x^2 + px + q$ deelbaar is door $x^2 + 1$.
  antwoord: |-
    $p = 1$, $q = 2$
  uitwerking: |-
    Een staartdeling met letters: $x^3 : x^2 = x$, rest $2x^2 + (p - 1)x + q$; $2x^2 : x^2 = 2$, rest $(p - 1)x + (q - 2)$. De rest is de nulveelterm als $p - 1 = 0$ en $q - 2 = 0$. Controle: $(x^2 + 1)(x + 2) = x^3 + 2x^2 + x + 2$.

- id: h1-o24
  soort: opdracht
  niveau: 3
  thema: |-
    een patroon bij delen door $x - 1$
  opgave: |-
    Een patroon.
  lijst: enumerate
  delen:
    - opgave: |-
        Werk uit: $(x - 1)(x + 1)$, $(x - 1)(x^2 + x + 1)$ en $(x - 1)(x^3 + x^2 + x + 1)$.
      antwoord: |-
        $x^2 - 1$, $x^3 - 1$, $x^4 - 1$
      uitwerking: |-
        Bij elk product heffen alle termen elkaar op, behalve de hoogste en de laatste: $x^3 + x^2 + x - x^2 - x - 1 = x^3 - 1$.
    - opgave: |-
        Wat zijn het quotiënt en de rest van $(x^6 - 1) : (x - 1)$? Controleer met het schema van Horner.
      antwoord: |-
        $x^5 + x^4 + x^3 + x^2 + x + 1$, rest $0$
      uitwerking: |-
        Het patroon geeft $(x - 1)(x^5 + x^4 + x^3 + x^2 + x + 1) = x^6 - 1$. In het schema staat onderaan telkens $1$, en de rest is $-1 + 1 = 0$.
    - opgave: |-
        Vul $x = 10$ in. Wat leer je over het getal $999\,999$?
      antwoord: |-
        $999\,999 = 9 \cdot 111\,111$
      uitwerking: |-
        $10^6 - 1 = (10 - 1)(10^5 + 10^4 + 10^3 + 10^2 + 10 + 1)$, dus $999\,999 = 9 \cdot 111\,111$.

# --- Test jezelf -----------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Orden $3x - x^4 + 2x^2 - 6$. Geef de graad, de hoogstegraadscoëfficiënt, de constante term en de coëfficiënt van $x^3$.
  antwoord: |-
    $-x^4 + 2x^2 + 3x - 6$; $4$; $-1$; $-6$; $0$
  uitwerking: |-
    Geordend: $-x^4 + 2x^2 + 3x - 6$. Graad $4$, hoogstegraadscoëfficiënt $-1$, constante term $-6$, en de term in $x^3$ ontbreekt: coëfficiënt $0$.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Gegeven is $A(x) = 2x^3 + x^2 - 5$. Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $A(-1)$
      antwoord: |-
        $-6$
      uitwerking: |-
        $-2 + 1 - 5$.
    - opgave: |-
        $A(2)$
      antwoord: |-
        $15$
      uitwerking: |-
        $16 + 4 - 5$.

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x^3 - 4x + 2) - (2x^3 + x^2 - 4x - 3)$
      antwoord: |-
        $-x^3 - x^2 + 5$
      uitwerking: |-
        $x^3 - 4x + 2 - 2x^3 - x^2 + 4x + 3$.
    - opgave: |-
        $(x - 2)(x^2 + 3x - 1)$
      antwoord: |-
        $x^3 + x^2 - 7x + 2$
      uitwerking: |-
        $x^3 + 3x^2 - x - 2x^2 - 6x + 2$.

- id: h1-t4
  soort: test
  niveau: 1
  opgave: |-
    Werk uit met een merkwaardig product.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(2x + 3)^2$
      antwoord: |-
        $4x^2 + 12x + 9$
      uitwerking: |-
        $(2x)^2 + 2 \cdot 2x \cdot 3 + 9$.
    - opgave: |-
        $(x^2 - 4)(x^2 + 4)$
      antwoord: |-
        $x^4 - 16$
      uitwerking: |-
        $(x^2)^2 - 4^2$.

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    Deel $2x^3 + x^2 - 3x + 4$ door $x^2 + x - 1$. Geef het quotiënt en de rest.
  antwoord: |-
    $Q(x) = 2x - 1$, $R = 3$
  uitwerking: |-
    $2x^3 : x^2 = 2x$, rest $-x^2 - x + 4$; $-x^2 : x^2 = -1$, rest $3$. Controle: $(x^2 + x - 1)(2x - 1) + 3 = 2x^3 + 2x^2 - 2x - x^2 - x + 1 + 3$.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Deel $x^4 - 2x^3 + 5x - 3$ door $x + 2$ met het schema van Horner.
  antwoord: |-
    $Q(x) = x^3 - 4x^2 + 8x - 11$, $R = 19$
  uitwerking: |-
    \horner{4}{-2}{1 & -2 & 0 & 5 & -3}{ & -2 & 8 & -16 & 22}{1 & -4 & 8 & -11}{19}

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Is $x^3 - x^2 - 8x + 12$ deelbaar door $x^2 + x - 6$? Schrijf de veelterm zo ja als een product.
  antwoord: |-
    ja: $(x^2 + x - 6)(x - 2)$
  uitwerking: |-
    $x^3 : x^2 = x$, rest $-2x^2 - 2x + 12$; $-2x^2 : x^2 = -2$, rest $0$.

- id: h1-t8
  soort: test
  niveau: 2
  opgave: |-
    Bij de deling van $A(x)$ door $x + 3$ is het quotiënt $x^2 - 2$ en de rest $5$. Bepaal $A(x)$.
  antwoord: |-
    $x^3 + 3x^2 - 2x - 1$
  uitwerking: |-
    $A(x) = (x + 3)(x^2 - 2) + 5 = x^3 - 2x + 3x^2 - 6 + 5$.
