- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    liggingen van rechten en vlakken, waar of niet waar
  opgave: |-
    Waar of niet waar? Geef een tegenvoorbeeld in een kubus $ABCD.EFGH$ bij wat niet waar is.
  lijst: enumerate
  delen:
    - opgave: |-
        Een rechte en een vlak kunnen precies twee punten gemeen hebben.
      antwoord: |-
        niet waar
      uitwerking: |-
        Met twee punten in het vlak ligt de hele rechte erin.
    - opgave: |-
        Twee vlakken kunnen precies één punt gemeen hebben.
      antwoord: |-
        niet waar
      uitwerking: |-
        Hebben twee verschillende vlakken een punt gemeen, dan hebben ze een hele rechte gemeen.
    - opgave: |-
        Een rechte die evenwijdig is met een vlak, is evenwijdig met elke rechte in dat vlak.
      antwoord: |-
        niet waar
      uitwerking: |-
        $EF \parallel ABCD$, maar $EF$ en $BC$ zijn kruisend.
    - opgave: |-
        Een rechte die evenwijdig is met een rechte in een vlak, is evenwijdig met dat vlak.
      antwoord: |-
        waar
      uitwerking: |-
        Dat is het kenmerk van een rechte evenwijdig met een vlak.
    - opgave: |-
        Twee rechten die evenwijdig zijn met hetzelfde vlak, zijn evenwijdig.
      antwoord: |-
        niet waar
      uitwerking: |-
        $EF$ en $FG$ zijn evenwijdig met het grondvlak, maar snijden elkaar in $F$.
    - opgave: |-
        Twee strikt evenwijdige vlakken hebben geen punt gemeen.
      antwoord: |-
        waar
      uitwerking: |-
        Dat is de definitie van strikt evenwijdig.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    rechten en vlakken in het dagelijks leven
  opgave: |-
    Snijdend of evenwijdig? Geef bij twee snijdende vlakken ook de snijlijn.
  lijst: enumerate
  delen:
    - opgave: |-
        het plafond en de vloer van het lokaal
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Ze hebben geen punt gemeen.
    - opgave: |-
        een muur en de vloer
      antwoord: |-
        snijdend, volgens de rand onderaan de muur
      uitwerking: |-
        De muur staat op de vloer: ze hebben een rechte gemeen.
    - opgave: |-
        twee bladzijden van een open boek
      antwoord: |-
        snijdend, volgens de rug van het boek
      uitwerking: |-
        De bladzijden draaien om de rug.
    - opgave: |-
        een rechte tafelpoot en het tafelblad
      antwoord: |-
        snijdend
      uitwerking: |-
        De poot raakt het blad in één punt (als je ze als rechte en vlak ziet).
    - opgave: |-
        een tl-lamp die horizontaal aan het plafond hangt, en de vloer
      antwoord: |-
        evenwijdig
      uitwerking: |-
        De lamp blijft overal even hoog boven de vloer.
    - opgave: |-
        het bovenvlak van twee opeenvolgende treden van een trap
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Allebei horizontaal, op een andere hoogte.

- id: h2-o5
  pakketten: [5]
  soort: opdracht
  niveau: 1
  thema: |-
    doorsneden van een kubus met regel 1
  opgave: |-
    Teken de doorsnede van een kubus $ABCD.EFGH$ met het vlak. Welke figuur is het?
  lijst: enumerate
  delen:
    - opgave: |-
        het vlak $CFH$
      antwoord: |-
        een gelijkzijdige driehoek
      uitwerking: |-
        $[CF]$ in het rechterzijvlak, $[FH]$ in het bovenvlak, $[HC]$ in het achtervlak (stippellijn). Drie diagonalen van zijvlakken: gelijkzijdig.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{4}
          \fill[snede] (C) -- (F) -- (H) -- cycle;
          \draw[accent,thick,dashed] (H) -- (C);
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        het vlak $ACH$
      antwoord: |-
        een gelijkzijdige driehoek
      uitwerking: |-
        $[AC]$ in het grondvlak, $[CH]$ in het achtervlak, $[HA]$ in het linkerzijvlak: alle drie in stippellijn.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{4}
          \fill[snede] (A) -- (C) -- (H) -- cycle;
          \draw[accent,thick,dashed] (A) -- (C) -- (H) -- cycle;
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        het vlak $ACF$
      antwoord: |-
        een gelijkzijdige driehoek
      uitwerking: |-
        $[AC]$ in het grondvlak (stippellijn), $[CF]$ in het rechterzijvlak, $[FA]$ in het voorvlak.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{4}
          \fill[snede] (A) -- (C) -- (F) -- cycle;
          \draw[accent,thick,dashed] (A) -- (C);
          \balknamen
        \end{tikzpicture}}

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    aantonen dat een rechte evenwijdig is met een vlak
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Toon aan dat de rechte evenwijdig is met het vlak.
  lijst: enumerate
  delen:
    - opgave: |-
        $FG$ en het vlak $ABCD$
      antwoord: |-
        $FG \parallel BC$
      uitwerking: |-
        $FG \parallel BC$ (rechterzijvlak) en $BC \subset ABCD$.
    - opgave: |-
        $BG$ en het vlak $ADHE$
      antwoord: |-
        $BG \parallel AH$
      uitwerking: |-
        $ABGH$ is een rechthoek, dus $BG \parallel AH$, en $AH \subset ADHE$.
    - opgave: |-
        $FH$ en het vlak $ABCD$
      antwoord: |-
        $FH \parallel BD$
      uitwerking: |-
        $BDHF$ is een rechthoek, dus $FH \parallel BD$, en $BD \subset ABCD$.
    - opgave: |-
        $PQ$ en het vlak $ABCD$, met $P$ het midden van $[AE]$ en $Q$ het midden van $[BF]$
      antwoord: |-
        $PQ \parallel AB$
      uitwerking: |-
        $ABQP$ is een rechthoek (de onderste helft van het voorvlak), dus $PQ \parallel AB$, en $AB \subset ABCD$.
    - opgave: |-
        $CF$ en het vlak $ADHE$
      antwoord: |-
        $CF \parallel DE$
      uitwerking: |-
        $CDEF$ is een rechthoek, dus $CF \parallel DE$, en $DE \subset ADHE$.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    zijvlakken en een rechte
  opgave: |-
    Hoe ligt elk van de zes zijvlakken van een kubus $ABCD.EFGH$ ten opzichte van de rechte?
  lijst: enumerate
  delen:
    - opgave: |-
        de ribbe $AB$
      antwoord: |-
        $AB$ ligt in $ABCD$ en $ABFE$; strikt evenwijdig met $EFGH$ en $CDHG$; snijdend met $ADHE$ (in $A$) en $BCGF$ (in $B$)
      uitwerking: |-
        Twee zijvlakken bevatten $AB$. Het bovenvlak en het achtervlak bevatten een ribbe evenwijdig met $AB$ ($EF$ en $DC$), maar niet $AB$ zelf. Het linker- en het rechterzijvlak worden doorprikt in $A$ en $B$.
    - opgave: |-
        de diagonaal $AC$
      antwoord: |-
        ligt in $ABCD$; strikt evenwijdig met $EFGH$; snijdend met de vier opstaande zijvlakken
      uitwerking: |-
        $AC \parallel EG \subset EFGH$. $AC$ snijdt $ABFE$ en $ADHE$ in $A$, en $BCGF$ en $CDHG$ in $C$.

