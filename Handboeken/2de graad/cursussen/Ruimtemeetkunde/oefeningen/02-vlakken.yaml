    - opgave: |-
        $ACGE$ en $EFGH$
      antwoord: |-
        snijdend volgens $EG$
      uitwerking: |-
        $E$ en $G$ liggen in beide vlakken.
    - opgave: |-
        $ABGH$ en $EFGH$
      antwoord: |-
