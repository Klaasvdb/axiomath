# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.
# Kubus ABCD.EFGH zoals in hoofdstuk 1. Snijpunten en doorsneden zijn nagerekend met coördinaten (Python),
# met ribbe 4: A(0,0,0), B(4,0,0), C(4,0,4), D(0,0,4), E(0,4,0), F(4,4,0), G(4,4,4), H(0,4,4) (x rechts, y omhoog, z naar achter).

- id: h2-start-1
  soort: start
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    \blokkop{Opwarmer}\quad Uit hoofdstuk~1, in de kubus $ABCD.EFGH$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe liggen de rechten $AB$ en $CG$? En $AE$ en $CG$?
      antwoord: |-
        kruisend; evenwijdig
      uitwerking: |-
        $AB$ en $CG$ liggen niet in één vlak. $AE$ en $CG$ liggen in de rechthoek $ACGE$ en hebben geen punt gemeen.
    - opgave: |-
        Welk vlak bepalen de rechten $AC$ en $EG$?
      antwoord: |-
        $ACGE$
      uitwerking: |-
        Ze zijn strikt evenwijdig en bepalen de rechthoek $ACGE$.
    - opgave: |-
        Twee punten van een rechte liggen in een vlak. Wat weet je over de rechte?
      antwoord: |-
        ze ligt in het vlak
      uitwerking: |-
        Grondeigenschap: dan ligt de hele rechte in het vlak.
    - opgave: |-
        Waarom teken je de ribbe $[BC]$ korter dan $[AB]$, terwijl ze even lang zijn?
      antwoord: |-
        $[BC]$ loopt naar achter
      uitwerking: |-
        In cavalièreperspectief teken je de ribben naar achter half zo lang, onder $45^\circ$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem een blad karton (een stuk van een vlak) en een potlood (een stuk van een rechte), of kijk naar de kubus.
  lijst: enumerate
  delen:
    - opgave: |-
        Kan het potlood, verlengd, precies twee punten gemeen hebben met het karton, ook verlengd? Hoeveel punten kunnen ze wel gemeen hebben?
      antwoord: |-
        nee; geen, één of oneindig veel
      uitwerking: |-
        Liggen twee punten van de rechte in het vlak, dan ligt de hele rechte erin. Dus: geen punt, precies één punt, of alle punten van de rechte.
    - opgave: |-
        Welke zijvlakken van de kubus hebben een punt gemeen met het grondvlak? Wat hebben ze dan allemaal gemeen?
      antwoord: |-
        de vier opstaande zijvlakken; een ribbe
      uitwerking: |-
        $ABFE$, $BCGF$, $CDHG$ en $ADHE$ hebben elk een ribbe gemeen met het grondvlak: $AB$, $BC$, $CD$ en $DA$. Verlengd is dat een rechte.
    - opgave: |-
        Welk zijvlak heeft geen punt gemeen met het grondvlak?
      antwoord: |-
        het bovenvlak $EFGH$
      uitwerking: |-
        Het bovenvlak ligt overal even hoog boven het grondvlak.
    - opgave: |-
        Kunnen twee vlakken precies één punt gemeen hebben, zoals twee snijdende rechten? Probeer het met twee bladen karton.
      antwoord: |-
        nee
      uitwerking: |-
        Raken twee bladen elkaar in een punt en draai je ze, dan komt er telkens een hele rechte bij, zoals de rug van een open boek.

- id: h2-ligging-rv
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Hoe ligt de rechte ten opzichte van het vlak? Geef het snijpunt als ze snijdend zijn.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $AB$ en $EFGH$
      antwoord: |-
        strikt evenwijdig
      uitwerking: |-
        $AB$ ligt onderaan en heeft geen punt in het bovenvlak.
    - opgave: |-
        $AE$ en $EFGH$
      antwoord: |-
        snijdend in $E$
      uitwerking: |-
        $E$ ligt in het bovenvlak, $A$ niet.
    - opgave: |-
        $EG$ en $EFGH$
      antwoord: |-
        $EG$ ligt erin
      uitwerking: |-
        $E$ en $G$ liggen in het bovenvlak.
    - opgave: |-
        $BH$ en $ABCD$
      antwoord: |-
        snijdend in $B$
      uitwerking: |-
        $B$ ligt in het grondvlak, $H$ niet.
    - opgave: |-
        $CG$ en $ADHE$
      antwoord: |-
        strikt evenwijdig
      uitwerking: |-
        $CG$ ligt helemaal rechts achteraan en heeft geen punt in het linkerzijvlak. Ook: $CG \parallel DH$ en $DH \subset ADHE$.
    - opgave: |-
        $DF$ en $ACGE$
      antwoord: |-
        snijdend in het midden van de kubus
      uitwerking: |-
        $D$ en $F$ liggen aan weerskanten van de rechthoek $ACGE$. $DF$ en $BH$ zijn de diagonalen van $BDHF$, en snijden elkaar in het midden van de kubus, dat ook in $ACGE$ ligt.

- id: h2-evw-vlak
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Toon aan dat de rechte evenwijdig is met het vlak.
  lijst: enumerate
  delen:
    - opgave: |-
        $EH$ en het vlak $ABCD$
      antwoord: |-
        $EH \parallel AD$
      uitwerking: |-
        $EH \parallel AD$ (linkerzijvlak) en $AD \subset ABCD$, dus $EH \parallel ABCD$.
    - opgave: |-
        $BE$ en het vlak $CDHG$
      antwoord: |-
        $BE \parallel CH$
      uitwerking: |-
        $BCHE$ is een rechthoek, dus $BE \parallel CH$, en $CH \subset CDHG$.
    - opgave: |-
        $AC$ en het vlak $EFGH$
      antwoord: |-
        $AC \parallel EG$
      uitwerking: |-
        $ACGE$ is een rechthoek, dus $AC \parallel EG$, en $EG \subset EFGH$.
    - opgave: |-
        $PQ$ en het vlak $ABCD$, met $P$ het midden van $[AE]$ en $Q$ het midden van $[CG]$
      antwoord: |-
        $PQ \parallel AC$
      uitwerking: |-
        $AP \parallel CQ$ en $\lengte{AP} = \lengte{CQ}$, dus $ACQP$ is een parallellogram en $PQ \parallel AC$, met $AC \subset ABCD$.

- id: h2-snijpunt
  soort: kort
  opgave: |-
    Een kubus $ABCD.EFGH$ heeft ribben van 4~cm. Teken het snijpunt $S$ van de rechte met het grondvlak $ABCD$, en zeg waar het ligt.
  lijst: enumerate
  delen:
    - opgave: |-
        de rechte $EQ$, met $Q$ het midden van $[BF]$
      antwoord: |-
        op het verlengde van $[AB]$, met $\lengte{BS} = 4$~cm
      uitwerking: |-
        $EQ$ ligt in het voorvlak, dat het grondvlak snijdt volgens $AB$. $EQ$ daalt 2~cm over 4~cm, dus nog 4~cm verder komt ze op hoogte 0: $S$ ligt 4~cm voorbij $B$.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{4}
          \draw[accent,thick] (B) -- (8,0,0);
          \draw[nadruk] (E) -- (8,0,0);
          \pnt[right]{4,2,0}{$Q$} \pnt[below]{8,0,0}{$S$}
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        de rechte $PQ$, met $P$ op $[DH]$ en $\lengte{DP} = 1$~cm, en $Q$ op $[CG]$ en $\lengte{CQ} = 3$~cm
      antwoord: |-
        op het verlengde van $[CD]$, met $\lengte{DS} = 2$~cm
      uitwerking: |-
        $PQ$ ligt in het achtervlak, dat het grondvlak snijdt volgens $CD$. Van $Q$ naar $P$ daalt $PQ$ 2~cm over 4~cm, dus nog 2~cm voorbij $P$ is ze op hoogte 0: $S$ ligt 2~cm voorbij $D$.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{4}
          \draw[accent,thick,dashed] (D) -- (-2,0,4);
          \draw[nadruk,dashed] (-2,0,4) -- (4,3,4);
          \pnt[above left]{0,1,4}{$P$} \pnt[right]{4,3,4}{$Q$} \pnt[below]{-2,0,4}{$S$}
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        de rechte $PQ$, met $P$ het midden van $[AE]$ en $Q$ het midden van $[CG]$
      antwoord: |-
        er is geen snijpunt
      uitwerking: |-
        $PQ$ ligt in het vlak $ACGE$, dat het grondvlak snijdt volgens $AC$. Maar $PQ \parallel AC$: de rechte is evenwijdig met het grondvlak.

- id: h2-ligging-vv
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Hoe liggen de vlakken? Geef de snijlijn als ze snijdend zijn.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $ABFE$ en $CDHG$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Het voorvlak en het achtervlak hebben geen punt gemeen.
    - opgave: |-
        $ABFE$ en $ADHE$
      antwoord: |-
        snijdend volgens $AE$
      uitwerking: |-
        $A$ en $E$ liggen in beide vlakken.
    - opgave: |-
        $BCGF$ en $ACGE$
      antwoord: |-
        snijdend volgens $CG$
      uitwerking: |-
        $C$ en $G$ liggen in beide vlakken.
    - opgave: |-
        $ADHE$ en $BCGF$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Het linkerzijvlak en het rechterzijvlak hebben geen punt gemeen.
    - opgave: |-
        $BDHF$ en $EFGH$
      antwoord: |-
        snijdend volgens $FH$
      uitwerking: |-
        $F$ en $H$ liggen in beide vlakken.
    - opgave: |-
        $ABGH$ en $ABCD$
      antwoord: |-
        snijdend volgens $AB$
      uitwerking: |-
        $A$ en $B$ liggen in beide vlakken.

- id: h2-snijlijn
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Teken de snijlijn van de twee vlakken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $ACGE$ en $BCGF$
      antwoord: |-
        $CG$
      uitwerking: |-
        $C$ en $G$ liggen in beide vlakken.
    - opgave: |-
        $ACH$ en $ACGE$
      antwoord: |-
        $AC$
      uitwerking: |-
        $A$ en $C$ liggen in beide vlakken.
    - opgave: |-
        $BDG$ en $ACGE$
      antwoord: |-
        $GN$, met $N$ het midden van het grondvlak
      uitwerking: |-
        $G$ ligt in beide vlakken. $BD \subset BDG$ en $AC \subset ACGE$ snijden elkaar in het midden $N$ van het grondvlak. De snijlijn is $GN$.
    - opgave: |-
        $ABGH$ en $BDHF$
      antwoord: |-
        $BH$
      uitwerking: |-
        $B$ en $H$ liggen in beide vlakken.

- id: h2-evw-vlakken
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    In de kubus $ABCD.EFGH$:
  lijst: enumerate
  delen:
    - opgave: |-
        $P$, $Q$ en $R$ zijn de middens van $[AE]$, $[BF]$ en $[CG]$. Toon aan dat het vlak $PQR$ evenwijdig is met het grondvlak.
      antwoord: |-
        $PQ \parallel AB$ en $QR \parallel BC$
      uitwerking: |-
        $PQ \parallel AB$ en $QR \parallel BC$ (de rechthoeken $ABQP$ en $BCRQ$), dus $PQ$ en $QR$ zijn evenwijdig met het grondvlak. Ze snijden elkaar in $Q$: kenmerk van evenwijdige vlakken.
    - opgave: |-
        Toon aan dat de vlakken $ACH$ en $BEG$ evenwijdig zijn.
      antwoord: |-
        $AC \parallel EG$ en $AH \parallel BG$
      uitwerking: |-
        $AC \parallel EG$ (rechthoek $ACGE$) en $AH \parallel BG$ (rechthoek $ABGH$). $AC$ en $AH$ snijden elkaar in $A$ en zijn evenwijdig met het vlak $BEG$.
    - opgave: |-
        $P$ is het midden van $[EF]$. Teken de snijlijn van het vlak $ACP$ met het bovenvlak.
      antwoord: |-
        $PQ$, met $Q$ het midden van $[FG]$
      uitwerking: |-
        Het vlak $ACP$ snijdt het grondvlak volgens $AC$. Het bovenvlak is evenwijdig met het grondvlak, dus de snijlijn met het bovenvlak is de evenwijdige met $AC$ door $P$. Die snijdt $[FG]$ in het midden $Q$ (middenparallel in de driehoek $EFG$).

- id: h2-loodrecht-vlak
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Staat de rechte loodrecht op het vlak? Verklaar.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $AB$ en het vlak $BCGF$
      antwoord: |-
        ja
      uitwerking: |-
        $AB \perp BC$ en $AB \perp BF$ (de vierkanten $ABCD$ en $ABFE$), en $BC$ en $BF$ snijden elkaar in $B$.
    - opgave: |-
        $CD$ en het vlak $ADHE$
      antwoord: |-
        ja
      uitwerking: |-
        $CD \perp AD$ en $CD \perp DH$ (de vierkanten $ABCD$ en $CDHG$), en $AD$ en $DH$ snijden elkaar in $D$.
    - opgave: |-
        $FH$ en het vlak $ACGE$
      antwoord: |-
        ja
      uitwerking: |-
        $FH \perp EG$: de diagonalen van het vierkant $EFGH$. $AE$ staat loodrecht op het bovenvlak (zoals op het grondvlak), dus $FH \perp AE$. $EG$ en $AE$ snijden elkaar in $E$.
    - opgave: |-
        $BH$ en het grondvlak $ABCD$
      antwoord: |-
        nee
      uitwerking: |-
        Dan zou $BH$ loodrecht staan op elke rechte van het grondvlak, ook op $BD$. Maar in de rechthoek $BDHF$ snijdt de diagonaal $BH$ de zijde $BD$ niet onder een rechte hoek.

- id: h2-loodrechte-vlakken
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Staan de vlakken loodrecht op elkaar? Zo ja, geef in het ene vlak een rechte die loodrecht staat op het andere.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $BCGF$ en $ABCD$
      antwoord: |-
        ja, $BF \perp ABCD$
      uitwerking: |-
        $BF$ ligt in $BCGF$ en staat loodrecht op het grondvlak, net als $AE$.
    - opgave: |-
        $ADHE$ en $CDHG$
      antwoord: |-
        ja, $AD \perp CDHG$
      uitwerking: |-
        $AD$ ligt in $ADHE$, en $AD \perp DC$ en $AD \perp DH$, twee snijdende rechten van $CDHG$.
    - opgave: |-
        $BDHF$ en $ABCD$
      antwoord: |-
        ja, $BF \perp ABCD$
      uitwerking: |-
        $BF$ ligt ook in het diagonaalvlak $BDHF$.
    - opgave: |-
        $ABFE$ en $CDHG$
      antwoord: |-
        nee, ze zijn evenwijdig
      uitwerking: |-
        Het voorvlak en het achtervlak hebben geen punt gemeen. Loodrechte vlakken zijn snijdend.
    - opgave: |-
        $ACGE$ en $EFGH$
      antwoord: |-
        ja, $AE \perp EFGH$
      uitwerking: |-
        $AE$ ligt in $ACGE$, en $AE \perp EF$ en $AE \perp EH$.
    - opgave: |-
        $ABFE$ en $ADHE$
      antwoord: |-
        ja, $AB \perp ADHE$
      uitwerking: |-
        $AB$ ligt in $ABFE$, en $AB \perp AD$ en $AB \perp AE$. De snijlijn is $AE$.

- id: h2-doorsnede1
  pakketten: [5]
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Teken de doorsnede van de kubus met het vlak. Welke figuur is het?
  lijst: enumerate
  delen:
    - opgave: |-
        het vlak $BEG$
      antwoord: |-
        een gelijkzijdige driehoek $BEG$
      uitwerking: |-
        $[BE]$ in het voorvlak, $[EG]$ in het bovenvlak, $[GB]$ in het rechterzijvlak: drie diagonalen van zijvlakken, dus even lang.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{4}
          \fill[snede] (B) -- (E) -- (G) -- cycle;
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        het vlak door de middens $K$, $L$ en $M$ van $[AB]$, $[BC]$ en $[BF]$
      antwoord: |-
        een gelijkzijdige driehoek $KLM$
      uitwerking: |-
        $[KL]$ in het grondvlak (stippellijn), $[LM]$ in het rechterzijvlak, $[MK]$ in het voorvlak. Het vlak snijdt de hoek $B$ af.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{4}
          \fill[snede] (2,0,0) -- (4,0,2) -- (4,2,0) -- cycle;
          \draw[accent,thick,dashed] (2,0,0) -- (4,0,2);
          \balknamen
        \end{tikzpicture}}

- id: h2-doorsnede2
  pakketten: [5]
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Teken de doorsnede van de kubus met het vlak. Welke figuur is het?
  lijst: enumerate
  delen:
    - opgave: |-
        het vlak door $A$, $B$ en $G$
      antwoord: |-
        de rechthoek $ABGH$
      uitwerking: |-
        $[AB]$ en $[BG]$ met regel 1. In het bovenvlak, evenwijdig met het grondvlak: door $G$ de evenwijdige met $AB$, dat is $GH$. Dan $[HA]$ in het linkerzijvlak.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{4}
          \fill[snede] (A) -- (B) -- (G) -- (H) -- cycle;
          \draw[accent,thick,dashed] (H) -- (A);
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        het vlak door $A$, $H$ en het midden $Q$ van $[BC]$
      antwoord: |-
        het trapezium $AQRH$, met $R$ het midden van $[CG]$
      uitwerking: |-
        $[AH]$ in het linkerzijvlak en $[AQ]$ in het grondvlak. Het rechterzijvlak is evenwijdig met het linkerzijvlak: door $Q$ de evenwijdige met $AH$, die $[CG]$ snijdt in het midden $R$. Dan $[RH]$ in het achtervlak.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{4}
          \fill[snede] (A) -- (4,0,2) -- (4,2,4) -- (H) -- cycle;
          \draw[accent,thick,dashed] (A) -- (4,0,2) (4,2,4) -- (H) -- (A);
          \pnt[right]{4,0,2}{$Q$} \pnt[right]{4,2,4}{$R$}
          \balknamen
        \end{tikzpicture}}

- id: h2-doorsnede3
  pakketten: [5]
  soort: kort
  opgave: |-
    $P$ is het midden van $[AB]$, $Q$ het midden van $[BC]$ en $R$ het midden van $[DH]$. Teken de doorsnede van de kubus met het vlak $PQR$. Tip: verleng $PQ$ tot ze $DA$ en $DC$ snijdt.
  antwoord: |-
    een vijfhoek $PQURV$, met $V$ op $[AE]$ en $U$ op $[CG]$
  uitwerking: |-
    Verleng $PQ$ tot $X$ op $DA$ en $Y$ op $DC$. In het linkerzijvlak snijdt $XR$ de ribbe $[AE]$ in $V$, in het achtervlak snijdt $YR$ de ribbe $[CG]$ in $U$. De doorsnede is de vijfhoek $PQURV$. ($V$ en $U$ liggen op een zesde van de ribbe boven $A$ en $C$.)
    \figuren{\begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
      \draadkubus{4}
      \coordinate (P) at (2,0,0); \coordinate (Q) at (4,0,2); \coordinate (X) at (0,0,-2); \coordinate (Y) at (6,0,4);
      \coordinate (R) at (0,2,4); \coordinate (V) at (0,2/3,0); \coordinate (U) at (4,2/3,4);
      \draw[lijngrijs] (A) -- (X) (C) -- (Y);
      \draw[accent!70,thin] (X) -- (P) (Q) -- (Y) (X) -- (V) (U) -- (Y);
      \fill[snede] (P) -- (Q) -- (U) -- (R) -- (V) -- cycle;
      \draw[accent,thick,dashed] (P) -- (Q) (U) -- (R) -- (V);
      \pnt[below]{P}{$P$} \pnt[below right]{Q}{$Q$} \pnt[below]{X}{$X$} \pnt[below]{Y}{$Y$}
      \pnt[left]{V}{$V$} \pnt[right]{U}{$U$} \pnt[above left]{R}{$R$}
      \balknamen
    \end{tikzpicture}}

