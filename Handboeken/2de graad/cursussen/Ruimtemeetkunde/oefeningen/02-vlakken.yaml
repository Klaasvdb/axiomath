- id: h2-o26
  soort: opdracht
  niveau: 1
  thema: |-
    een rechte loodrecht op een vlak
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Staat de rechte loodrecht op het vlak? Verklaar.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $BF$ en het vlak $ABCD$
      antwoord: |-
        ja
      uitwerking: |-
        $BF \perp AB$ en $BF \perp BC$, en $AB$ en $BC$ snijden elkaar in $B$.
    - opgave: |-
        $EH$ en het vlak $CDHG$
      antwoord: |-
        ja
      uitwerking: |-
        $EH \perp HD$ (het vierkant $ADHE$) en $EH \perp HG$ (het vierkant $EFGH$), twee snijdende rechten van $CDHG$.
    - opgave: |-
        $BC$ en het vlak $ABFE$
      antwoord: |-
        ja
      uitwerking: |-
        $BC \perp AB$ en $BC \perp BF$, twee snijdende rechten van het voorvlak.
    - opgave: |-
        $AC$ en het vlak $BDHF$
      antwoord: |-
        ja
      uitwerking: |-
        $AC \perp BD$ (diagonalen van het vierkant $ABCD$) en $AC \perp BF$, want $BF$ staat loodrecht op het grondvlak. $BD$ en $BF$ snijden elkaar in $B$.
    - opgave: |-
        $CE$ en het vlak $ABCD$
      antwoord: |-
        nee
      uitwerking: |-
        Dan zou $CE$ loodrecht staan op $AC$. Maar in de rechthoek $ACGE$ snijdt de diagonaal $CE$ de zijde $AC$ niet onder een rechte hoek.
    - opgave: |-
        $AE$ en het vlak $BCGF$
      antwoord: |-
        nee, ze zijn evenwijdig
      uitwerking: |-
        $AE \parallel BF$ en $BF$ ligt in $BCGF$: $AE$ is strikt evenwijdig met het vlak en snijdt het niet.

- id: h2-o27
  soort: opdracht
  niveau: 1
  thema: |-
    loodrechte stand in het dagelijks leven
  opgave: |-
    Staan ze loodrecht op elkaar? Denk aan de rechten en de vlakken waarop ze liggen.
  lijst: enumerate
  delen:
    - opgave: |-
        een rechte vlaggenmast en het vlakke plein
      antwoord: |-
        ja
      uitwerking: |-
        De mast staat loodrecht op elke rechte van het plein door zijn voet.
    - opgave: |-
        twee muren van een kamer die samenkomen in een hoek
      antwoord: |-
        ja
      uitwerking: |-
        In een rechthoekige kamer staat de onderrand van de ene muur loodrecht op de andere muur: ze staat loodrecht op de onderrand van de andere muur en op de verticale hoeklijn.
    - opgave: |-
        de vloer en het plafond
      antwoord: |-
        nee, ze zijn evenwijdig
      uitwerking: |-
        Ze hebben geen punt gemeen. Loodrechte vlakken snijden elkaar.
    - opgave: |-
        een deur die half openstaat, en de vloer
      antwoord: |-
        ja
      uitwerking: |-
        De rechte door de scharnieren ligt in de deur en staat loodrecht op de vloer, hoe ver de deur ook openstaat.
    - opgave: |-
        een deur die op een kier staat, en de muur waarin ze hangt
      antwoord: |-
        nee
      uitwerking: |-
        Ze snijden elkaar volgens de rechte door de scharnieren, maar de deur staat bijna in het vlak van de muur. Pas als de deur een kwartslag openstaat, staan ze loodrecht op elkaar.
    - opgave: |-
        een schuin dak en de vloer van de zolder
      antwoord: |-
        nee
      uitwerking: |-
        Het dak helt. Geen enkele rechte in het dak staat loodrecht op de vloer.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    snijpunt van een rechte en een vlak tekenen
  opgave: |-
    Een kubus $ABCD.EFGH$ heeft ribben van 4~cm. Teken het snijpunt $S$ van de rechte $PQ$ met het grondvlak, en zeg waar het ligt.
  lijst: enumerate
  delen:
    - opgave: |-
        $P$ is het midden van $[AE]$ en $Q$ ligt op $[BF]$ met $\lengte{BQ} = 1$~cm.
      antwoord: |-
        op het verlengde van $[AB]$, met $\lengte{BS} = 4$~cm
      uitwerking: |-
        $PQ$ ligt in het voorvlak. Ze daalt 1~cm over 4~cm, dus van $Q$ nog 4~cm verder tot hoogte 0: $S$ ligt op $AB$, 4~cm voorbij $B$.
    - opgave: |-
        $P$ ligt op $[DH]$ met $\lengte{DP} = 1$~cm en $Q$ ligt op $[CG]$ met $\lengte{CQ} = 2$~cm.
      antwoord: |-
        op het verlengde van $[CD]$, met $\lengte{DS} = 4$~cm
      uitwerking: |-
        $PQ$ ligt in het achtervlak. Van $Q$ naar $P$ daalt ze 1~cm over 4~cm, dus van $P$ nog 4~cm verder: $S$ ligt op $CD$, 4~cm voorbij $D$.
    - opgave: |-
        $P$ is het midden van $[BF]$ en $Q = H$.
      antwoord: |-
        op het verlengde van $[DB]$, met $\lengte{BS} = \lengte{BD}$
      uitwerking: |-
        $P$ en $H$ liggen in de rechthoek $BDHF$, die het grondvlak snijdt volgens $BD$. In die rechthoek daalt $HP$ van hoogte 4 naar 2 over de afstand $\lengte{DB}$, dus nog eens $\lengte{DB}$ verder is ze op hoogte 0.
        \figuren{\begin{tikzpicture}[schuin,scale=.35,font=\scriptsize]
          \draadkubus{4}
          \fill[vlakdeel] (B) -- (D) -- (H) -- (F) -- cycle;
          \draw[accent,thick,dashed] (D) -- (B);
          \draw[accent,thick] (B) -- (8,0,-4);
          \draw[nadruk] (H) -- (8,0,-4);
          \pnt[right]{4,2,0}{$P$} \pnt[below]{8,0,-4}{$S$}
          \balknamen
        \end{tikzpicture}}

- id: h2-o10
  pakketten: [5]
  soort: opdracht
  niveau: 2
  thema: |-
    doorsneden van een kubus met regel 2
  opgave: |-
    Teken de doorsnede van een kubus $ABCD.EFGH$ met het vlak. Welke figuur is het?
  lijst: enumerate
  delen:
    - opgave: |-
        het vlak door $E$, $B$ en $C$
      antwoord: |-
        de rechthoek $BCHE$
      uitwerking: |-
        $[EB]$ en $[BC]$ met regel 1. In het bovenvlak: door $E$ de evenwijdige met $BC$, dat is $EH$. Dan $[HC]$ in het achtervlak.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{4}
          \fill[snede] (B) -- (C) -- (H) -- (E) -- cycle;
          \draw[accent,thick,dashed] (H) -- (C);
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        het vlak door $A$, $C$ en het midden $P$ van $[EF]$
      antwoord: |-
        het trapezium $ACQP$, met $Q$ het midden van $[FG]$
      uitwerking: |-
        $[AC]$ in het grondvlak en $[AP]$ in het voorvlak. In het bovenvlak: door $P$ de evenwijdige met $AC$, die $[FG]$ snijdt in het midden $Q$. Dan $[QC]$ in het rechterzijvlak.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{4}
          \fill[snede] (A) -- (C) -- (4,4,2) -- (2,4,0) -- cycle;
          \draw[accent,thick,dashed] (A) -- (C);
          \pnt[above left]{2,4,0}{$P$} \pnt[right]{4,4,2}{$Q$}
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        het vlak door $F$, $H$ en het midden $P$ van $[AB]$
      antwoord: |-
        het trapezium $PRHF$, met $R$ het midden van $[AD]$
      uitwerking: |-
        $[FH]$ in het bovenvlak en $[FP]$ in het voorvlak. In het grondvlak: door $P$ de evenwijdige met $FH$ (of met $BD$), die $[AD]$ snijdt in het midden $R$. Dan $[RH]$ in het linkerzijvlak.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{4}
          \fill[snede] (2,0,0) -- (0,0,2) -- (H) -- (F) -- cycle;
          \draw[accent,thick,dashed] (2,0,0) -- (0,0,2) -- (H);
          \pnt[below]{2,0,0}{$P$} \pnt[left]{0,0,2}{$R$}
          \balknamen
        \end{tikzpicture}}

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    snijlijn van twee vlakken met hulprechten
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Teken de snijlijn van de vlakken. Zoek in elk vlak een rechte, zo dat de twee rechten elkaar snijden.
  lijst: enumerate
  delen:
    - opgave: |-
        $ABGH$ en $CDEF$
      antwoord: |-
        de rechte door de middens van het linker- en het rechterzijvlak
      uitwerking: |-
        $AH \subset ABGH$ en $DE \subset CDEF$ snijden elkaar in het midden $K$ van $ADHE$. $BG$ en $CF$ snijden elkaar in het midden $L$ van $BCGF$. De snijlijn is $KL$.
    - opgave: |-
        $ACH$ en $BDHF$
      antwoord: |-
        $HN$, met $N$ het midden van het grondvlak
      uitwerking: |-
        $H$ ligt in beide vlakken. $AC$ en $BD$ snijden elkaar in het midden $N$ van het grondvlak. De snijlijn is $HN$.
    - opgave: |-
        $ACF$ en $BDE$
      antwoord: |-
        $NK$, met $N$ het midden van het grondvlak en $K$ het midden van het voorvlak
      uitwerking: |-
        $AC \cap BD = \{N\}$, het midden van het grondvlak. $AF \cap BE = \{K\}$, het midden van het voorvlak. Beide punten liggen in beide vlakken.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    evenwijdige vlakken
  opgave: |-
    Zijn de vlakken van de kubus $ABCD.EFGH$ evenwijdig? Toon aan.
  lijst: enumerate
  delen:
    - opgave: |-
        het vlak door de middens $K$, $L$ en $M$ van $[AB]$, $[AD]$ en $[AE]$, en het vlak $BDE$
      antwoord: |-
        ja
      uitwerking: |-
        $KL \parallel BD$ en $LM \parallel DE$ (middenparallellen in de driehoeken $ABD$ en $ADE$). $KL$ en $LM$ snijden elkaar in $L$: kenmerk van evenwijdige vlakken.
    - opgave: |-
        de vlakken $AFH$ en $BDG$
      antwoord: |-
        ja
      uitwerking: |-
        $FH \parallel BD$ (rechthoek $BDHF$) en $AH \parallel BG$ (rechthoek $ABGH$). $FH$ en $AH$ snijden elkaar in $H$ en zijn evenwijdig met $BDG$.
    - opgave: |-
        de vlakken $ACF$ en $DEG$
      antwoord: |-
        ja
      uitwerking: |-
        $AC \parallel EG$ (rechthoek $ACGE$) en $CF \parallel DE$ (rechthoek $CDEF$). $AC$ en $CF$ snijden elkaar in $C$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    rechten en vlakken in een huisje met een zadeldak
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.6,font=\scriptsize]
        \balkpunten{4}{2}{2}
        \coordinate (K) at (0,3,1); \coordinate (L) at (4,3,1);
        \fill[accent!5] (A) -- (B) -- (C) -- (G) -- (L) -- (K) -- (E) -- cycle;
        \draw[verborgen] (D) -- (A) (D) -- (C) (D) -- (H) (E) -- (H) -- (G) (H) -- (K);
        \draw[ribbe] (A) -- (B) -- (F) -- (E) -- cycle (B) -- (C) -- (G) -- (F) (E) -- (K) -- (L) -- (F) (G) -- (L);
        \node[above,inner sep=1.5pt] at (K) {$K$}; \node[above,inner sep=1.5pt] at (L) {$L$};
        \node[below left,inner sep=1.5pt] at (A) {$A$}; \node[below right,inner sep=1.5pt] at (B) {$B$};
        \node[right,inner sep=2pt] at (C) {$C$}; \node[left,inner sep=1.5pt] at (D) {$D$};
        \node[left,inner sep=2pt] at (E) {$E$}; \node[below right,inner sep=1.5pt] at (F) {$F$};
        \node[right,inner sep=2pt] at (G) {$G$}; \node[below right,inner sep=1pt] at (H) {$H$};
      \end{tikzpicture}
  opgave: |-
    Een huisje is een balk $ABCD.EFGH$ met een zadeldak. De nok $[KL]$ ligt recht boven het midden van $[EH]$ en van $[FG]$. Hoe liggen de rechten en vlakken ten opzichte van elkaar?
  lijst: enumerate
  delen:
    - opgave: |-
        de nok $KL$ en het grondvlak $ABCD$
      antwoord: |-
        strikt evenwijdig
      uitwerking: |-
        $KL \parallel AB$ en $AB \subset ABCD$.
    - opgave: |-
        de nok $KL$ en de voorgevel $ABFE$
      antwoord: |-
        strikt evenwijdig
      uitwerking: |-
        $KL \parallel EF$ en $EF \subset ABFE$.
    - opgave: |-
        de rechte $EK$ en het grondvlak $ABCD$
      antwoord: |-
        snijdend, buiten het huisje
      uitwerking: |-
        $EK$ ligt in het vlak van de linkergevel. Ze stijgt naar achter, dus verlengd naar voor en naar onder snijdt ze $DA$ voor het huisje, voorbij $A$.
    - opgave: |-
        het dakvlak $EFLK$ en het grondvlak $ABCD$
      antwoord: |-
        snijdend
      uitwerking: |-
        Het dakvlak bevat $E$ en $F$ en is schuin: het snijdt het grondvlak volgens een rechte evenwijdig met $EF$, voor het huisje.
    - opgave: |-
        het vlak van de rechtergevel $BCGLF$ en het vlak $ADHE$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Het vlak van de rechtergevel is het vlak $BCGF$, en dat is evenwijdig met het linkerzijvlak $ADHE$.
    - opgave: |-
        de twee dakvlakken $EFLK$ en $HGLK$
      antwoord: |-
        snijdend volgens $KL$
      uitwerking: |-
        $K$ en $L$ liggen in beide dakvlakken.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    eigenschappen van evenwijdigheid, waar of niet waar
  opgave: |-
    Waar of niet waar? Geef een tegenvoorbeeld in een kubus $ABCD.EFGH$ bij wat niet waar is.
  lijst: enumerate
  delen:
    - opgave: |-
        Als de rechte $a$ evenwijdig is met het vlak $\alpha$, en $\alpha \parallel \beta$, dan is $a \parallel \beta$.
      antwoord: |-
        waar
      uitwerking: |-
        Zoals $EF$: evenwijdig met het grondvlak, en ook met elk vlak dat evenwijdig is met het grondvlak. Het bewijs laten we weg.
    - opgave: |-
        Als de rechten $a$ en $b$ evenwijdig zijn met hetzelfde vlak, dan is $a \parallel b$.
      antwoord: |-
        niet waar
      uitwerking: |-
        $EF$ en $FG$ zijn evenwijdig met het grondvlak, maar snijden elkaar in $F$.
    - opgave: |-
        Bevat een vlak $\alpha$ twee evenwijdige rechten die allebei evenwijdig zijn met een vlak $\beta$, dan is $\alpha \parallel \beta$.
      antwoord: |-
        niet waar
      uitwerking: |-
        $\alpha = ABGH$ bevat $AB$ en $HG$, die allebei evenwijdig zijn met $\beta = CDEF$ (want $AB \parallel DC$ en $HG \parallel EF$). Toch snijden $ABGH$ en $CDEF$ elkaar. Het kenmerk vraagt twee \textit{snijdende} rechten.
    - opgave: |-
        Als $\alpha \parallel \beta$, dan is elke rechte van $\alpha$ evenwijdig met elke rechte van $\beta$.
      antwoord: |-
        niet waar
      uitwerking: |-
        $AB$ ligt in het grondvlak en $FG$ in het bovenvlak, maar $AB$ en $FG$ zijn kruisend.

- id: h2-o15
  pakketten: [5]
  soort: opdracht
  niveau: 2
  thema: |-
    doorsneden van een piramide
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.5,font=\scriptsize]
        \draadpiramide{4}{4.4}
        \piramidenamen
      \end{tikzpicture}
  opgave: |-
    $T.ABCD$ is een piramide met een vierkant grondvlak, en de top recht boven het midden van het grondvlak. Teken de doorsnede met het vlak. Welke figuur is het?
  lijst: enumerate
  delen:
    - opgave: |-
        het vlak door de middens $P$, $Q$ en $R$ van $[TA]$, $[TB]$ en $[TC]$
      antwoord: |-
        een vierkant $PQRS$, met $S$ het midden van $[TD]$
      uitwerking: |-
        $PQ \parallel AB$ en $QR \parallel BC$ (middenparallellen), dus het vlak is evenwijdig met het grondvlak. In het zijvlak $TCD$ snijdt het $[TD]$ in het midden $S$. De zijden zijn de helft van de zijden van het grondvlak: een vierkant.
        \figuren{\begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
          \draadpiramide{4}{4.4}
          \coordinate (P) at ($(A)!.5!(T)$); \coordinate (Q) at ($(B)!.5!(T)$); \coordinate (R) at ($(C)!.5!(T)$); \coordinate (S) at ($(D)!.5!(T)$);
          \fill[snede] (P) -- (Q) -- (R) -- (S) -- cycle;
          \draw[accent,thick,dashed] (R) -- (S) -- (P);
          \piramidenamen
        \end{tikzpicture}}
    - opgave: |-
        het vlak door $A$, $C$ en het midden $P$ van $[TB]$
      antwoord: |-
        een driehoek $APC$
      uitwerking: |-
        $[AC]$ in het grondvlak, $[AP]$ in het zijvlak $TAB$, $[PC]$ in het zijvlak $TBC$. Regel 1 volstaat.
    - opgave: |-
        het vlak door $T$, het midden $K$ van $[AB]$ en het midden $L$ van $[CD]$
      antwoord: |-
        een gelijkbenige driehoek $TKL$
      uitwerking: |-
        $[KL]$ in het grondvlak, $[TK]$ in $TAB$ en $[TL]$ in $TCD$. Het vlak staat verticaal door de top en het midden van het grondvlak; $\lengte{TK} = \lengte{TL}$.
    - opgave: |-
        het vlak door $B$, $D$ en het midden $R$ van $[TC]$
      antwoord: |-
        een driehoek $BRD$
      uitwerking: |-
        $[BD]$ in het grondvlak (stippellijn), $[BR]$ in het zijvlak $TBC$, $[RD]$ in het zijvlak $TCD$ (stippellijn).

- id: h2-o16
  pakketten: [5]
  soort: opdracht
  niveau: 2
  thema: |-
    doorsneden van een balk
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.5,font=\scriptsize]
        \draadbalk{6}{4}{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Teken de doorsnede van de balk $ABCD.EFGH$ met het vlak. Welke figuur is het?
  lijst: enumerate
  delen:
    - opgave: |-
        het vlak door $B$, $D$ en $F$
      antwoord: |-
        de rechthoek $BDHF$
      uitwerking: |-
        $[BD]$ in het grondvlak en $[BF]$ in het rechterzijvlak. In het bovenvlak: door $F$ de evenwijdige met $BD$, dat is $FH$. Dan $[HD]$, een ribbe.
    - opgave: |-
        het vlak door $A$, $F$ en $G$
      antwoord: |-
        de rechthoek $ADGF$
      uitwerking: |-
        $[AF]$ in het voorvlak, $[FG]$ in het bovenvlak. In het grondvlak, evenwijdig met het bovenvlak: door $A$ de evenwijdige met $FG$, dat is $AD$. Dan $[DG]$ in het achtervlak.
    - opgave: |-
        het vlak door het midden $P$ van $[AE]$, het midden $Q$ van $[BF]$ en $C$
      antwoord: |-
        de rechthoek $PQCD$
      uitwerking: |-
        $[PQ]$ in het voorvlak en $[QC]$ in het rechterzijvlak. Het achtervlak is evenwijdig met het voorvlak: door $C$ de evenwijdige met $PQ$, dat is $CD$. Dan $[DP]$ in het linkerzijvlak.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadbalk{6}{4}{3}
          \fill[snede] (0,2,0) -- (6,2,0) -- (C) -- (D) -- cycle;
          \draw[accent,thick,dashed] (C) -- (D) -- (0,2,0);
          \pnt[left]{0,2,0}{$P$} \pnt[right]{6,2,0}{$Q$}
          \balknamen
        \end{tikzpicture}}

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    snijpunt van een rechte en een vlak met een diagonaalvlak
  opgave: |-
    Een kubus $ABCD.EFGH$ heeft ribben van 4~cm. Teken het snijpunt $S$ van de rechte $PQ$ met het grondvlak. Tip: zoek een diagonaalvlak waarin $PQ$ ligt.
  lijst: enumerate
  delen:
    - opgave: |-
        $P$ ligt op $[AE]$ met $\lengte{AP} = 1$~cm en $Q$ op $[CG]$ met $\lengte{CQ} = 3$~cm.
      antwoord: |-
        op het verlengde van $[CA]$, voorbij $A$, met $\lengte{AS} = \tfrac12 \lengte{AC}$
      uitwerking: |-
        $PQ$ ligt in de rechthoek $ACGE$, die het grondvlak snijdt volgens $AC$. Van $Q$ naar $P$ daalt $PQ$ 2~cm over de afstand $\lengte{AC}$, dus nog 1~cm lager ligt ze een halve $\lengte{AC}$ voorbij $A$.
    - opgave: |-
        $P$ is het midden van $[AE]$ en $Q = G$.
      antwoord: |-
        op het verlengde van $[CA]$, voorbij $A$, met $\lengte{AS} = \lengte{AC}$
      uitwerking: |-
        Weer in de rechthoek $ACGE$. Van $G$ naar $P$ daalt de rechte 2~cm over $\lengte{AC}$, dus nog 2~cm lager ligt ze een hele $\lengte{AC}$ voorbij $A$.

- id: h2-o18
  pakketten: [5]
  soort: opdracht
  niveau: 2
  thema: |-
    doorsnede van een kubus met regel 2
  opgave: |-
    Een kubus $ABCD.EFGH$ heeft ribben van 4~cm. $P$ ligt op $[AE]$ met $\lengte{AP} = 3$~cm, en $Q$ op $[BF]$ met $\lengte{BQ} = 1$~cm. Teken de doorsnede met het vlak $PQC$. Welke figuur is het?
  antwoord: |-
    het trapezium $PQCR$, met $R$ het midden van $[DH]$
  uitwerking: |-
    $[PQ]$ in het voorvlak en $[QC]$ in het rechterzijvlak. Het achtervlak is evenwijdig met het voorvlak: door $C$ de evenwijdige met $PQ$. Die stijgt 2~cm over 4~cm en snijdt $[DH]$ in het midden $R$. Dan $[RP]$ in het linkerzijvlak.
    \figuren{\begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
      \draadkubus{4}
      \fill[snede] (0,3,0) -- (4,1,0) -- (C) -- (0,2,4) -- cycle;
      \draw[accent,thick,dashed] (C) -- (0,2,4) -- (0,3,0);
      \pnt[left]{0,3,0}{$P$} \pnt[right]{4,1,0}{$Q$} \pnt[above left]{0,2,4}{$R$}
      \balknamen
    \end{tikzpicture}}

- id: h2-o28
  soort: opdracht
  niveau: 2
  thema: |-
    loodrechte stand: waar of niet waar
  opgave: |-
    Waar of niet waar? Geef een tegenvoorbeeld in een kubus $ABCD.EFGH$ bij wat niet waar is.
  lijst: enumerate
  delen:
    - opgave: |-
        Een rechte die loodrecht staat op één rechte van een vlak, staat loodrecht op dat vlak.
      antwoord: |-
        niet waar
      uitwerking: |-
        $BG$ staat loodrecht op $AB$, een rechte van het grondvlak, maar niet op het grondvlak: $BG$ staat niet loodrecht op $BC$.
    - opgave: |-
        Twee rechten die loodrecht staan op hetzelfde vlak, zijn evenwijdig.
      antwoord: |-
        waar
      uitwerking: |-
        Bijvoorbeeld de vier opstaande ribben, die loodrecht staan op het grondvlak.
    - opgave: |-
        Twee vlakken die loodrecht staan op hetzelfde vlak, zijn evenwijdig.
      antwoord: |-
        niet waar
      uitwerking: |-
        $ABFE$ en $ADHE$ staan allebei loodrecht op het grondvlak, en ze snijden elkaar volgens $AE$.
    - opgave: |-
        Staat de rechte $a$ loodrecht op het vlak $\alpha$, dan staat elk vlak door $a$ loodrecht op $\alpha$.
      antwoord: |-
        waar
      uitwerking: |-
        Zo'n vlak bevat de rechte $a$, die loodrecht staat op $\alpha$: dat is de definitie. Bijvoorbeeld $ABFE$, $ADHE$ en $ACGE$ door $AE$.
    - opgave: |-
        Twee vlakken die loodrecht staan op dezelfde rechte, zijn evenwijdig.
      antwoord: |-
        waar
      uitwerking: |-
        Bijvoorbeeld het grondvlak en het bovenvlak, die allebei loodrecht staan op $AE$.

- id: h2-o19
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    doorsnede van een kubus met regel 3
  opgave: |-
    $P$ is het midden van $[AB]$ en $Q$ het midden van $[AD]$. Teken de doorsnede van de kubus $ABCD.EFGH$ met het vlak $PQG$. Welke figuur is het?
  antwoord: |-
    een vijfhoek $PUGVQ$, met $U$ op $[BF]$ en $V$ op $[DH]$
  uitwerking: |-
    $[PQ]$ in het grondvlak. Verleng $PQ$ tot $X$ op $CB$ en $Y$ op $CD$. $X$ ligt in het rechterzijvlak, net als $G$: $XG$ snijdt $[BF]$ in $U$. $Y$ ligt in het achtervlak: $YG$ snijdt $[DH]$ in $V$. Teken $[PU]$ in het voorvlak en $[VQ]$ in het linkerzijvlak. ($U$ en $V$ liggen op een derde van de ribbe boven $B$ en $D$.)
    \figuren{\begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
      \draadkubus{4}
      \coordinate (P) at (2,0,0); \coordinate (Q) at (0,0,2); \coordinate (X) at (4,0,-2); \coordinate (Y) at (-2,0,4);
      \coordinate (U) at (4,4/3,0); \coordinate (V) at (0,4/3,4);
      \draw[lijngrijs] (B) -- (X) (D) -- (Y);
      \draw[accent!70,thin] (X) -- (P) (Q) -- (Y) (X) -- (U) (V) -- (Y);
      \fill[snede] (P) -- (U) -- (G) -- (V) -- (Q) -- cycle;
      \draw[accent,thick,dashed] (P) -- (Q) (G) -- (V) -- (Q);
      \pnt[below]{P}{$P$} \pnt[left]{Q}{$Q$} \pnt[below]{X}{$X$} \pnt[left]{Y}{$Y$}
      \pnt[right]{U}{$U$} \pnt[left]{V}{$V$}
      \balknamen
    \end{tikzpicture}}

- id: h2-o20
  pakketten: [1, 2, 3, 4]
  soort: opdracht
  niveau: 3
  thema: |-
    een vlak door een rechte evenwijdig met een vlak
  opgave: |-
    De rechte $EF$ is evenwijdig met het grondvlak $ABCD$.
  lijst: enumerate
  delen:
    - opgave: |-
        Het vlak $EFCD$ gaat door $EF$. Wat is de snijlijn van $EFCD$ met het grondvlak? Hoe ligt die snijlijn ten opzichte van $EF$?
      antwoord: |-
        $CD$; evenwijdig met $EF$
      uitwerking: |-
        $C$ en $D$ liggen in beide vlakken. $CD \parallel AB \parallel EF$.
    - opgave: |-
        Neem een ander vlak door $EF$ dat het grondvlak snijdt. Is de snijlijn weer evenwijdig met $EF$? Leg uit waarom dat altijd zo is.
      antwoord: |-
        ja
      uitwerking: |-
        De snijlijn en $EF$ liggen in hetzelfde vlak. Ze hebben geen punt gemeen, want $EF$ heeft geen punt gemeen met het grondvlak. Twee rechten in één vlak zonder gemeenschappelijk punt zijn evenwijdig.

- id: h2-o20
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: een vlak door een rechte evenwijdig met een vlak
  opgave: |-
    Bewijs: is de rechte $a$ evenwijdig met het vlak $\alpha$, en snijdt een vlak $\beta$ door $a$ het vlak $\alpha$ volgens de rechte $s$, dan is $a \parallel s$. Geef ook een voorbeeld in een kubus.
  antwoord: |-
    $a$ en $s$ liggen in $\beta$ en hebben geen punt gemeen, of vallen samen
  uitwerking: |-
    $a$ en $s$ liggen allebei in $\beta$. Ligt $a$ in $\alpha$, dan ligt $a$ in $\alpha$ en in $\beta$, dus $a = s$. Anders heeft $a$ geen punt gemeen met $\alpha$, dus ook niet met $s \subset \alpha$. Twee rechten in één vlak zonder gemeenschappelijk punt zijn evenwijdig. Voorbeeld: $a = EF$, $\alpha = ABCD$, $\beta = EFCD$, $s = CD$.

- id: h2-o21
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    doorsneden door drie hoekpunten van een kubus
  opgave: |-
    Een vlak gaat door drie hoekpunten van een kubus. Welke figuur kan de doorsnede zijn? Kan het een vierkant zijn? Een rechthoek die geen vierkant is? Een gelijkzijdige driehoek? Een driehoek die niet gelijkzijdig is? Leg uit.
  antwoord: |-
    vierkant, rechthoek of gelijkzijdige driehoek; nooit een andere driehoek
  uitwerking: |-
    Een vlak door drie hoekpunten is een zijvlak (een vierkant), een vlak door twee overstaande ribben zoals $ACGE$ (een rechthoek met zijden een ribbe en een diagonaal van een zijvlak, dus geen vierkant), of een vlak dat een hoek afsnijdt zoals $BDE$ (een gelijkzijdige driehoek met drie diagonalen van zijvlakken). Andere vlakken door drie hoekpunten zijn er niet (zie de opdracht over twintig vlakken in hoofdstuk~1). Een driehoek die niet gelijkzijdig is, kan dus niet.

- id: h2-o22
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    doorsnede van een kubus met regel 3
  opgave: |-
    Een kubus $ABCD.EFGH$ heeft ribben van 4~cm. $P$ ligt op $[AE]$ met $\lengte{AP} = 3$~cm, $Q$ is het midden van $[BC]$ en $R$ het midden van $[CD]$. Teken de doorsnede met het vlak $PQR$. Welke figuur is het?
  antwoord: |-
    een vijfhoek $PUQRV$, met $U$ op $[BF]$ en $V$ op $[DH]$, $\lengte{BU} = \lengte{DV} = 1$~cm
  uitwerking: |-
    $[QR]$ in het grondvlak. Verleng $QR$ tot $X$ op $AB$ en $Y$ op $AD$: $\lengte{BX} = \lengte{DY} = 2$~cm. $X$ ligt in het voorvlak, net als $P$: $XP$ snijdt $[BF]$ in $U$. $Y$ ligt in het linkerzijvlak: $YP$ snijdt $[DH]$ in $V$. Op het voorvlak in ware grootte daalt $XP$ 3~cm over 6~cm, dus $\lengte{BU} = 1$~cm; net zo $\lengte{DV} = 1$~cm. Teken $[UQ]$ en $[RV]$.
    \figuren{\begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
      \draadkubus{4}
      \coordinate (P) at (0,3,0); \coordinate (Q) at (4,0,2); \coordinate (R) at (2,0,4); \coordinate (X) at (6,0,0); \coordinate (Y) at (0,0,6);
      \coordinate (U) at (4,1,0); \coordinate (V) at (0,1,4);
      \draw[lijngrijs] (B) -- (X) (D) -- (Y);
      \draw[accent!70,thin] (X) -- (Q) (R) -- (Y) (X) -- (U) (V) -- (Y);
      \fill[snede] (P) -- (U) -- (Q) -- (R) -- (V) -- cycle;
      \draw[accent,thick,dashed] (Q) -- (R) -- (V) -- (P);
      \pnt[left]{P}{$P$} \pnt[right]{Q}{$Q$} \pnt[below]{R}{$R$} \pnt[below]{X}{$X$} \pnt[left]{Y}{$Y$}
      \pnt[above right]{U}{$U$} \pnt[left]{V}{$V$}
      \balknamen
    \end{tikzpicture}}

- id: h2-o23
  pakketten: [1, 2, 3, 4]
  soort: opdracht
  niveau: 3
  thema: |-
    rechten in evenwijdige vlakken
  opgave: |-
    Leg uit waarom elke rechte in het bovenvlak van een kubus evenwijdig is met het grondvlak. Is ze ook evenwijdig met elke rechte in het grondvlak?
  antwoord: |-
    ze heeft geen punt gemeen met het grondvlak; nee
  uitwerking: |-
    Het bovenvlak en het grondvlak hebben geen punt gemeen, dus een rechte in het bovenvlak ook niet: ze is strikt evenwijdig met het grondvlak. Maar ze is niet evenwijdig met elke rechte van het grondvlak: $EG$ en $BD$ zijn kruisend.

- id: h2-o23
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: rechten in evenwijdige vlakken
  opgave: |-
    Bewijs: is $\alpha \parallel \beta$ en ligt de rechte $a$ in $\alpha$, dan is $a \parallel \beta$. Is $a$ ook evenwijdig met elke rechte van $\beta$?
  antwoord: |-
    $a$ heeft geen punt gemeen met $\beta$, of ligt erin; nee
  uitwerking: |-
    Vallen $\alpha$ en $\beta$ samen, dan ligt $a$ in $\beta$, dus $a \parallel \beta$. Anders hebben $\alpha$ en $\beta$ geen punt gemeen, dus heeft $a \subset \alpha$ geen punt gemeen met $\beta$: $a$ is strikt evenwijdig met $\beta$. Niet met elke rechte van $\beta$: in een kubus ligt $EG$ in het bovenvlak en $BD$ in het grondvlak, en ze zijn kruisend.

- id: h2-o24
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    welke veelhoeken een doorsnede van een kubus kunnen zijn
  opgave: |-
    Zoek telkens een vlak waarvan de doorsnede met een kubus $ABCD.EFGH$ de gevraagde figuur is.
  lijst: enumerate
  delen:
    - opgave: |-
        een gelijkzijdige driehoek
      antwoord: |-
        bijvoorbeeld het vlak $BDE$
      uitwerking: |-
        Drie diagonalen van zijvlakken.
    - opgave: |-
        een trapezium dat geen parallellogram is
      antwoord: |-
        bijvoorbeeld het vlak door $E$, $G$ en het midden van $[AB]$
      uitwerking: |-
        Het trapezium $PQGE$ uit de leerstof: $PQ \parallel EG$, maar $PQ$ is half zo lang.
    - opgave: |-
        een vijfhoek
      antwoord: |-
        bijvoorbeeld het vlak door de middens van $[AB]$ en $[BC]$ en $H$
      uitwerking: |-
        De vijfhoek uit de leerstof.
    - opgave: |-
        een zeshoek
      antwoord: |-
        bijvoorbeeld het vlak door de middens van $[AB]$, $[BC]$ en $[GH]$
      uitwerking: |-
        Elke zijde van de doorsnede verbindt de middens van twee ribben van hetzelfde zijvlak: een regelmatige zeshoek.
    - opgave: |-
        Kan de doorsnede een zevenhoek zijn? Leg uit.
      antwoord: |-
        nee
      uitwerking: |-
        Elke zijde van de doorsnede ligt in een zijvlak, en in elk zijvlak ligt hoogstens één zijde: het snijvlak snijdt een zijvlak volgens één rechte. Een kubus heeft zes zijvlakken, dus de doorsnede heeft hoogstens zes zijden.

- id: h2-o25
  pakketten: [4, 5]
  soort: opdracht
  niveau: 3
  thema: |-
    snijpunt van een rechte en een vlak met een verticaal hulpvlak
  opgave: |-
    Een kubus $ABCD.EFGH$ heeft ribben van 4~cm. $P$ is het midden van $[EH]$ en $Q$ ligt op $[BF]$ met $\lengte{BQ} = 1$~cm. De rechte $PQ$ ligt in geen zijvlak en in geen diagonaalvlak.
  lijst: enumerate
  delen:
    - opgave: |-
        $P'$ is het punt van het grondvlak recht onder $P$. Welk punt is dat? Welk punt van het grondvlak ligt recht onder $Q$?
      antwoord: |-
        het midden van $[AD]$; $B$
      uitwerking: |-
        $P$ ligt boven het midden van $[AD]$, en $Q$ ligt op de verticale ribbe $[BF]$, boven $B$.
    - opgave: |-
        Het verticale vlak door $P$ en $Q$ snijdt het grondvlak volgens $P'B$. Teken het snijpunt $S$ van $PQ$ met het grondvlak.
      antwoord: |-
        op het verlengde van $[P'B]$, voorbij $B$, met $\lengte{BS} = \tfrac13 \lengte{P'B}$
      uitwerking: |-
        $PQ$ en $P'B$ liggen in het verticale vlak $PP'BQ$. Van $P$ naar $Q$ daalt de rechte van hoogte 4 naar 1, dus 3~cm over $\lengte{P'B}$. Nog 1~cm lager ligt ze $\tfrac13 \lengte{P'B}$ voorbij $B$.
        \figuren{\begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
          \draadkubus{4}
          \coordinate (P) at (0,4,2); \coordinate (P') at (0,0,2); \coordinate (Q) at (4,1,0); \coordinate (S) at (16/3,0,-2/3);
          \fill[vlakdeel] (P) -- (P') -- (B) -- (Q) -- cycle;
          \draw[accent,dashed] (P) -- (P') -- (B);
          \draw[accent,thick] (B) -- (S);
          \draw[nadruk] (P) -- (S);
          \pnt[above left]{P}{$P$} \pnt[left]{P'}{$P'$} \pnt[above right]{Q}{$Q$} \pnt[below]{S}{$S$}
          \balknamen
        \end{tikzpicture}}

- id: h2-o29
  soort: opdracht
  niveau: 3
  thema: |-
    aantonen dat twee vlakken niet loodrecht staan
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Staat het vlak $ABGH$ loodrecht op het grondvlak $ABCD$? Stel dat een rechte $l$ in $ABGH$ loodrecht staat op het grondvlak.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit waarom $l$ het grondvlak snijdt in een punt $P$ van $AB$.
      antwoord: |-
        $P$ ligt in beide vlakken, dus op hun snijlijn $AB$
      uitwerking: |-
        $l$ snijdt het grondvlak in een punt $P$. Dat punt ligt op $l$, dus in $ABGH$, en in het grondvlak. De snijlijn van de twee vlakken is $AB$, dus $P$ ligt op $AB$.
    - opgave: |-
        $l$ staat ook loodrecht op $AB$. Met welke rechte door $B$ is $l$ dan evenwijdig?
      antwoord: |-
        met $BG$
      uitwerking: |-
        In de rechthoek $ABGH$ staat $BG$ loodrecht op $AB$. De rechte $l$ ligt in hetzelfde vlak en staat ook loodrecht op $AB$, dus $l \parallel BG$ (of $l = BG$).
    - opgave: |-
        Staat $ABGH$ loodrecht op het grondvlak?
      antwoord: |-
        nee
      uitwerking: |-
        $l$ zou dan ook loodrecht staan op $BC$, en dus ook $BG$, want $l \parallel BG$. Maar $BG$ snijdt $BC$ onder $45^\circ$ in het vierkant $BCGF$. Er is dus geen rechte $l$ in $ABGH$ die loodrecht staat op het grondvlak.

- id: h2-o30
  soort: opdracht
  niveau: 3
  thema: |-
    loodrechte diagonaalvlakken
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Toon aan dat de vlakken $ABGH$ en $CDEF$ loodrecht op elkaar staan. Tip: toon eerst aan dat $AH$ loodrecht staat op het vlak $CDEF$.
  antwoord: |-
    $AH \perp DE$ en $AH \perp CD$, dus $AH \perp CDEF$, en $AH$ ligt in $ABGH$
  uitwerking: |-
    $AH \perp DE$: de diagonalen van het vierkant $ADHE$. $CD \perp AD$ en $CD \perp DH$, dus $CD$ staat loodrecht op het vlak $ADHE$, en ook op $AH$. Zo staat $AH$ loodrecht op de snijdende rechten $DE$ en $CD$ van het vlak $CDEF$, dus $AH \perp CDEF$ (kenmerk). Omdat $AH$ in $ABGH$ ligt, is $ABGH \perp CDEF$.

