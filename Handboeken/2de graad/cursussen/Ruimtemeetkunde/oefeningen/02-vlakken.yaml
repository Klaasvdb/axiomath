# Test jezelf

- id: h2-t1
  soort: test
  niveau: 1
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Hoe ligt de rechte ten opzichte van het vlak? Geef het snijpunt als ze snijdend zijn.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $EH$ en $ABCD$
      antwoord: |-
        strikt evenwijdig
      uitwerking: |-
        $EH \parallel AD \subset ABCD$.
    - opgave: |-
        $AG$ en $EFGH$
      antwoord: |-
        snijdend in $G$
      uitwerking: |-
        $G$ ligt in het bovenvlak, $A$ niet.
    - opgave: |-
        $BD$ en $ABCD$
      antwoord: |-
        ligt erin
      uitwerking: |-
        $B$ en $D$ liggen in het grondvlak.
    - opgave: |-
        $CE$ en $ABFE$
      antwoord: |-
        snijdend in $E$
      uitwerking: |-
        $E$ ligt in het voorvlak, $C$ niet.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Hoe liggen de vlakken van de kubus $ABCD.EFGH$? Geef de snijlijn als ze snijdend zijn.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $ABFE$ en $EFGH$
      antwoord: |-
        snijdend volgens $EF$
      uitwerking: |-
        $E$ en $F$ liggen in beide vlakken.
    - opgave: |-
        $ADHE$ en $BCGF$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Linkerzijvlak en rechterzijvlak.
    - opgave: |-
        $ACGE$ en $ABFE$
      antwoord: |-
        snijdend volgens $AE$
      uitwerking: |-
        $A$ en $E$ liggen in beide vlakken.
    - opgave: |-
        $BDHF$ en $BCGF$
      antwoord: |-
        snijdend volgens $BF$
      uitwerking: |-
        $B$ en $F$ liggen in beide vlakken.

- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    In de kubus $ABCD.EFGH$: toon aan dat de rechte $DE$ evenwijdig is met het vlak $BCGF$.
  antwoord: |-
    $DE \parallel CF$ en $CF \subset BCGF$
  uitwerking: |-
    $DC \parallel EF$ en $\lengte{DC} = \lengte{EF}$, dus $CDEF$ is een rechthoek en $DE \parallel CF$. $CF$ ligt in het rechterzijvlak $BCGF$, dus $DE \parallel BCGF$ (kenmerk).

- id: h2-t4
  soort: test
  niveau: 2
  opgave: |-
    Een kubus $ABCD.EFGH$ heeft ribben van 4~cm. $P$ ligt op $[AE]$ met $\lengte{AP} = 1$~cm, en $Q$ op $[BF]$ met $\lengte{BQ} = 3$~cm. Teken het snijpunt $S$ van $PQ$ met het grondvlak, en zeg waar het ligt.
  antwoord: |-
    op het verlengde van $[BA]$, met $\lengte{AS} = 2$~cm
  uitwerking: |-
    $PQ$ ligt in het voorvlak, dat het grondvlak snijdt volgens $AB$. Van $Q$ naar $P$ daalt $PQ$ 2~cm over 4~cm, dus nog 2~cm voorbij $P$ is ze op hoogte 0: $S$ ligt 2~cm voorbij $A$.
    \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
      \draadkubus{4}
      \draw[accent,thick] (A) -- (-2,0,0);
      \draw[nadruk] (-2,0,0) -- (4,3,0);
      \pnt[above left]{0,1,0}{$P$} \pnt[right]{4,3,0}{$Q$} \pnt[below]{-2,0,0}{$S$}
      \balknamen
    \end{tikzpicture}}

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Teken de snijlijn van de vlakken $ACH$ en $BDE$ van de kubus $ABCD.EFGH$.
  antwoord: |-
    $NK$, met $N$ het midden van het grondvlak en $K$ het midden van het linkerzijvlak
  uitwerking: |-
    $AC \subset ACH$ en $BD \subset BDE$ snijden elkaar in het midden $N$ van het grondvlak. $AH \subset ACH$ en $DE \subset BDE$ snijden elkaar in het midden $K$ van het linkerzijvlak $ADHE$. De snijlijn is $NK$.

- id: h2-t6
  pakketten: [5]
  soort: test
  niveau: 2
  opgave: |-
    $P$ is het midden van $[EF]$. Teken de doorsnede van de kubus $ABCD.EFGH$ met het vlak $BDP$. Welke figuur is het?
  antwoord: |-
    het trapezium $BDQP$, met $Q$ het midden van $[EH]$
  uitwerking: |-
    $[BD]$ in het grondvlak en $[BP]$ in het voorvlak. Het bovenvlak is evenwijdig met het grondvlak: door $P$ de evenwijdige met $BD$, die $[EH]$ snijdt in het midden $Q$. Dan $[QD]$ in het linkerzijvlak.
    \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
      \draadkubus{4}
      \fill[snede] (B) -- (D) -- (0,4,2) -- (2,4,0) -- cycle;
      \draw[accent,thick,dashed] (B) -- (D) -- (0,4,2);
      \pnt[above]{2,4,0}{$P$} \pnt[left]{0,4,2}{$Q$}
      \balknamen
    \end{tikzpicture}}

- id: h2-t8
  soort: test
  niveau: 2
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    In de kubus $ABCD.EFGH$: toon aan dat de diagonaal $EG$ loodrecht staat op het vlak $BDHF$.
  antwoord: |-
    $EG \perp FH$ en $EG \perp BF$
  uitwerking: |-
    $EG \perp FH$: de diagonalen van het vierkant $EFGH$. $BF$ staat loodrecht op het bovenvlak ($BF \perp EF$ en $BF \perp FG$), dus ook op $EG$. $FH$ en $BF$ snijden elkaar in $F$ en liggen in $BDHF$, dus $EG \perp BDHF$.

- id: h2-t9
  soort: test
  niveau: 1
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Staan de vlakken van de kubus $ABCD.EFGH$ loodrecht op elkaar? Verklaar.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $ADHE$ en $ABCD$
      antwoord: |-
        ja
      uitwerking: |-
        $AE$ ligt in $ADHE$ en staat loodrecht op het grondvlak.
    - opgave: |-
        $BCGF$ en $CDHG$
      antwoord: |-
        ja
      uitwerking: |-
        $CD$ ligt in $CDHG$, en $CD \perp BC$ en $CD \perp CG$, dus $CD \perp BCGF$.
    - opgave: |-
        $ABCD$ en $EFGH$
      antwoord: |-
        nee, ze zijn evenwijdig
      uitwerking: |-
        Het grondvlak en het bovenvlak hebben geen punt gemeen. Loodrechte vlakken zijn snijdend.
    - opgave: |-
        $BDHF$ en $EFGH$
      antwoord: |-
        ja
      uitwerking: |-
        $BF$ ligt in $BDHF$, en $BF \perp EF$ en $BF \perp FG$, dus $BF \perp EFGH$.
