- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    ligging van een rechte en een vlak in een kubus
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.5,font=\scriptsize]
        \draadkubus{4}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Hoe ligt de rechte ten opzichte van het vlak: ligt ze erin, is ze strikt evenwijdig, of snijdt ze het vlak? Geef het snijpunt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $EF$ en $ABCD$
      antwoord: |-
        strikt evenwijdig
      uitwerking: |-
        $EF \parallel AB$ en $AB \subset ABCD$; $EF$ ligt er niet in.
    - opgave: |-
        $BF$ en $ABCD$
      antwoord: |-
        snijdend in $B$
      uitwerking: |-
        $B$ ligt in het grondvlak, $F$ niet.
    - opgave: |-
        $AC$ en $ABCD$
      antwoord: |-
        ligt erin
      uitwerking: |-
        $A$ en $C$ liggen in het grondvlak.
    - opgave: |-
        $FH$ en $ABCD$
      antwoord: |-
        strikt evenwijdig
      uitwerking: |-
        $FH \parallel BD$ en $BD \subset ABCD$.
    - opgave: |-
        $BH$ en $ADHE$
      antwoord: |-
        snijdend in $H$
      uitwerking: |-
        $H$ ligt in het linkerzijvlak, $B$ niet.
    - opgave: |-
        $AG$ en $BCGF$
      antwoord: |-
        snijdend in $G$
      uitwerking: |-
        $G$ ligt in het rechterzijvlak, $A$ niet.
    - opgave: |-
        $CE$ en $EFGH$
      antwoord: |-
        snijdend in $E$
      uitwerking: |-
        $E$ ligt in het bovenvlak, $C$ niet.
    - opgave: |-
        $EH$ en $BCGF$
      antwoord: |-
        strikt evenwijdig
      uitwerking: |-
        $EH \parallel FG$ en $FG \subset BCGF$.

