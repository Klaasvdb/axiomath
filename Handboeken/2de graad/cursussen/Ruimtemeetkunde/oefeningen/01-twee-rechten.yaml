# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.
# Kubus ABCD.EFGH: grondvlak ABCD (A vooraan links, B vooraan rechts, C achteraan rechts, D achteraan links),
# E boven A, F boven B, G boven C, H boven D. De liggingen zijn nagerekend met coördinaten (Python).

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Wat je al weet uit het vlak en over ruimtefiguren.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe noem je twee rechten in een vlak die precies één punt gemeen hebben? En twee rechten in een vlak zonder gemeenschappelijk punt?
      antwoord: |-
        snijdend; (strikt) evenwijdig
      uitwerking: |-
        Snijdende rechten hebben één punt gemeen, het snijpunt. Rechten in een vlak zonder gemeenschappelijk punt zijn evenwijdig.
    - opgave: |-
        Hoeveel rechten gaan er door twee verschillende punten $A$ en $B$? Wat is het verschil tussen $AB$ en $[AB]$?
      antwoord: |-
        precies één; $AB$ is de rechte, $[AB]$ het lijnstuk
      uitwerking: |-
        Door twee punten gaat precies één rechte. De rechte $AB$ loopt onbeperkt door, het lijnstuk $[AB]$ stopt in $A$ en in $B$.
    - opgave: |-
        Hoeveel hoekpunten, ribben en zijvlakken heeft een kubus? En een piramide met een vierkant grondvlak?
      antwoord: |-
        kubus: 8, 12 en 6; piramide: 5, 8 en 5
      uitwerking: |-
        Een kubus heeft 4 hoekpunten onderaan en 4 bovenaan, 4 ribben onderaan, 4 bovenaan en 4 opstaande, en 6 vierkante zijvlakken. De piramide heeft de 4 hoekpunten van het grondvlak en de top, de 4 ribben van het grondvlak en 4 opstaande ribben, en het grondvlak met 4 driehoekige zijvlakken.
    - opgave: |-
        In een vlak is de rechte $a$ evenwijdig met $b$, en $b$ evenwijdig met $c$. Hoe liggen $a$ en $c$?
      antwoord: |-
        evenwijdig
      uitwerking: |-
        In een vlak zijn twee rechten die evenwijdig zijn met een derde rechte, ook onderling evenwijdig.
    - opgave: |-
        $ABCD$ is een rechthoek. Welke zijden zijn evenwijdig? Wat weet je over de diagonalen $[AC]$ en $[BD]$?
      antwoord: |-
        $AB \parallel DC$ en $AD \parallel BC$; ze zijn even lang en snijden elkaar in hun midden
      uitwerking: |-
        In een rechthoek zijn de overstaande zijden evenwijdig en even lang. De diagonalen zijn even lang en delen elkaar middendoor.

- id: h1-verken
  soort: start
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.6,font=\scriptsize]
        \draadkubus{3}
        \draw[nadruk] (A) -- (B);
        \balknamen
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken}\quad Bekijk de ribbe $AB$ van de kubus $ABCD.EFGH$. Neem er een echte kubus of een doos bij als dat helpt.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke ribben hebben een punt gemeen met $AB$?
      antwoord: |-
        $AD$, $AE$, $BC$ en $BF$
      uitwerking: |-
        De ribben die in $A$ of in $B$ beginnen: $AD$ en $AE$ in $A$, $BC$ en $BF$ in $B$.
    - opgave: |-
        Welke ribben lopen in dezelfde richting als $AB$?
      antwoord: |-
        $DC$, $EF$ en $HG$
      uitwerking: |-
        De ribben van links naar rechts: $DC$ onderaan achter, $EF$ bovenaan voor en $HG$ bovenaan achter.
    - opgave: |-
        Welke ribben blijven over? Snijden ze $AB$ als je ze verlengt? Lopen ze in dezelfde richting als $AB$?
      antwoord: |-
        $CG$, $DH$, $EH$ en $FG$; nee; nee
      uitwerking: |-
        Van de 11 andere ribben blijven er $11 - 4 - 3 = 4$ over: $CG$, $DH$, $EH$ en $FG$. Ze snijden $AB$ niet, ook niet verlengd, en ze lopen van onder naar boven of van voor naar achter.
    - opgave: |-
        Kun je een groot blad karton zo houden dat het tegen de hele ribbe $AB$ en tegen de hele ribbe $CG$ ligt? En tegen $AB$ en $HG$?
      antwoord: |-
        nee; ja
      uitwerking: |-
        Tegen $AB$ en $HG$ lukt het: het karton loopt schuin door de kubus. Tegen $AB$ en $CG$ lukt het niet: draai je het karton om $AB$, dan raakt het $CG$ hoogstens in één punt.

- id: h1-tekenen
  soort: kort
  opgave: |-
    Teken in cavalièreperspectief.
  lijst: enumerate
  delen:
    - opgave: |-
        een balk $ABCD.EFGH$ met $\lengte{AB} = 6$~cm, $\lengte{AD} = 4$~cm en $\lengte{AE} = 3$~cm
      antwoord: |-
        voorvlak 6~cm bij 3~cm, ribben naar achter 2~cm
      uitwerking: |-
        Het voorvlak $ABFE$ is een rechthoek van 6~cm breed en 3~cm hoog. De ribben naar achter, zoals $[AD]$, zijn 4~cm, dus je tekent ze 2~cm lang, onder $45^\circ$.
        \figuren{\begin{tikzpicture}[schuin,scale=.5,font=\scriptsize]
          \draadbalk{6}{3}{4}
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        een kubus $ABCD.EFGH$ met ribben van 4~cm, met het midden $P$ van $[EF]$, het midden $Q$ van $[CG]$ en het lijnstuk $[PQ]$
      antwoord: |-
        $P$ 2~cm rechts van $E$, $Q$ halverwege $C$ en $G$
      uitwerking: |-
        Het midden van een ribbe is ook in de tekening het midden: $P$ ligt 2~cm rechts van $E$, en $Q$ ligt halverwege $C$ en $G$, 2~cm boven $C$.
        \figuren{\begin{tikzpicture}[schuin,scale=.5,font=\scriptsize]
          \draadkubus{4}
          \draw[nadruk] (2,4,0) -- (4,2,4);
          \pnt[above left]{2,4,0}{$P$} \pnt[right]{4,2,4}{$Q$}
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        een piramide $T.ABCD$ met een vierkant grondvlak $ABCD$ met zijde 4~cm, en de top $T$ 5~cm recht boven het snijpunt $M$ van de diagonalen van het grondvlak
      antwoord: |-
        grondvlak als in een kubus, $T$ 5~cm boven $M$
      uitwerking: |-
        Teken het grondvlak zoals het grondvlak van een kubus: $[AB]$ is 4~cm, $[AD]$ en $[BC]$ zijn 2~cm, onder $45^\circ$. Teken de diagonalen in stippellijn, en $T$ 5~cm recht boven hun snijpunt $M$. De ribben naar $D$ zijn verborgen.
        \figuren{\begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
          \draadpiramide{4}{5}
          \draw[verborgen] (A) -- (C) (B) -- (D) (M) -- (T);
          \pnt[below]{M}{$M$}
          \piramidenamen
        \end{tikzpicture}}

- id: h1-in-vlak
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Ligt de rechte in het vlak? Verklaar.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $EG$ in het vlak $EFGH$
      antwoord: |-
        ja
      uitwerking: |-
        $E$ en $G$ liggen in het bovenvlak.
    - opgave: |-
        $BH$ in het vlak $ABCD$
      antwoord: |-
        nee
      uitwerking: |-
        Alleen $B$ ligt in het grondvlak, $H$ ligt erboven.
    - opgave: |-
        $AF$ in het vlak $ABFE$
      antwoord: |-
        ja
      uitwerking: |-
        $A$ en $F$ liggen in het voorvlak.
    - opgave: |-
        $CE$ in het vlak $BCGF$
      antwoord: |-
        nee
      uitwerking: |-
        Alleen $C$ ligt in het rechterzijvlak, $E$ ligt links.
    - opgave: |-
        $AG$ in het vlak $ACGE$
      antwoord: |-
        ja
      uitwerking: |-
        $A$ en $G$ liggen in de rechthoek $ACGE$.
    - opgave: |-
        $DF$ in het vlak $BDHF$
      antwoord: |-
        ja
      uitwerking: |-
        $D$ en $F$ liggen in de rechthoek $BDHF$.

- id: h1-snijdend
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Snijden de rechten elkaar? Zo ja, waar?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $AD$ en $DH$
      antwoord: |-
        ja, in $D$
      uitwerking: |-
        Twee ribben uit hetzelfde hoekpunt $D$.
    - opgave: |-
        $EG$ en $FH$
      antwoord: |-
        ja, in het midden van $EFGH$
      uitwerking: |-
        De diagonalen van het vierkant $EFGH$ snijden elkaar in het midden.
    - opgave: |-
        $AF$ en $BE$
      antwoord: |-
        ja, in het midden van $ABFE$
      uitwerking: |-
        De diagonalen van het voorvlak snijden elkaar in het midden.
    - opgave: |-
        $AG$ en $CE$
      antwoord: |-
        ja, in het midden van de kubus
      uitwerking: |-
        Ze zijn de diagonalen van de rechthoek $ACGE$, en snijden elkaar in het midden van die rechthoek: het midden van de kubus.
    - opgave: |-
        $AH$ en $DE$
      antwoord: |-
        ja, in het midden van $ADHE$
      uitwerking: |-
        De diagonalen van het linkerzijvlak snijden elkaar in het midden.
    - opgave: |-
        $AB$ en $GH$
      antwoord: |-
        nee
      uitwerking: |-
        Ze lopen in dezelfde richting en hebben geen punt gemeen: ze zijn strikt evenwijdig.

- id: h1-evenwijdig
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    In de kubus $ABCD.EFGH$:
  lijst: enumerate
  delen:
    - opgave: |-
        Noem alle ribben die evenwijdig zijn met $BF$.
      antwoord: |-
        $AE$, $CG$ en $DH$
      uitwerking: |-
        De andere drie ribben van onder naar boven.
    - opgave: |-
        Noem een diagonaal van een zijvlak die evenwijdig is met de diagonaal $AC$.
      antwoord: |-
        $EG$
      uitwerking: |-
        $ACGE$ is een rechthoek, dus $EG \parallel AC$.
    - opgave: |-
        Noem een diagonaal van een zijvlak die evenwijdig is met de diagonaal $AH$.
      antwoord: |-
        $BG$
      uitwerking: |-
        $ABGH$ is een rechthoek, dus $BG \parallel AH$.
    - opgave: |-
        $M$ is het midden van $[EH]$. Door $M$ gaat de evenwijdige $m$ met $AE$. Waar snijdt $m$ de ribbe $[AD]$?
      antwoord: |-
        in het midden van $[AD]$
      uitwerking: |-
        $m$ ligt in het linkerzijvlak $ADHE$ en loopt van onder naar boven, halverwege $AE$ en $DH$. Ze snijdt $[AD]$ in het midden.

- id: h1-transitief
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Toon aan dat de rechten evenwijdig zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        $EF$ en $DC$
      antwoord: |-
        $EF \parallel AB$ en $AB \parallel DC$
      uitwerking: |-
        $EF \parallel AB$ (voorvlak) en $AB \parallel DC$ (grondvlak). Evenwijdig met een derde rechte: $EF \parallel DC$.
    - opgave: |-
        $BD$ en $FH$
      antwoord: |-
        $BDHF$ is een parallellogram
      uitwerking: |-
        $BF \parallel AE$ en $AE \parallel DH$, dus $BF \parallel DH$, en $\lengte{BF} = \lengte{DH}$. Een vierhoek met twee overstaande zijden even lang en evenwijdig is een parallellogram, dus $BD \parallel FH$.
    - opgave: |-
        $CF$ en $DE$
      antwoord: |-
        $CDEF$ is een parallellogram
      uitwerking: |-
        $DC \parallel AB$ en $AB \parallel EF$, dus $DC \parallel EF$, en $\lengte{DC} = \lengte{EF}$. Dus is $CDEF$ een parallellogram, en $DE \parallel CF$.

- id: h1-kruisend
  soort: kort
  opgave: |-
    Waar of niet waar? Verbeter wat niet klopt.
  lijst: enumerate
  delen:
    - opgave: |-
        Twee rechten die geen punt gemeen hebben, zijn evenwijdig.
      antwoord: |-
        niet waar
      uitwerking: |-
        Ze kunnen ook kruisend zijn, zoals $AB$ en $CG$ in een kubus.
    - opgave: |-
        Twee kruisende rechten hebben geen punt gemeen.
      antwoord: |-
        waar
      uitwerking: |-
        Snijdende rechten liggen in één vlak, kruisende niet.
    - opgave: |-
        Twee rechten die in één vlak liggen, kunnen kruisend zijn.
      antwoord: |-
        niet waar
      uitwerking: |-
        Kruisende rechten liggen per definitie niet in één vlak.
    - opgave: |-
        Twee rechten die niet evenwijdig zijn, snijden elkaar.
      antwoord: |-
        niet waar
      uitwerking: |-
        In de ruimte kunnen ze ook kruisend zijn.
    - opgave: |-
        Noem twee ribben van een kubus $ABCD.EFGH$ die kruisend zijn met $AD$.
      antwoord: |-
        bijvoorbeeld $BF$ en $EF$
      uitwerking: |-
        De ribben die kruisend zijn met $AD$: $BF$, $CG$, $EF$ en $HG$.

- id: h1-ligging
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Onderzoek de ligging van de rechten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $AE$ en $CG$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Allebei van onder naar boven; ze liggen in de rechthoek $ACGE$.
    - opgave: |-
        $AE$ en $GH$
      antwoord: |-
        kruisend
      uitwerking: |-
        $GH$ ligt in het bovenvlak, $AE$ prikt erdoor in $E$, en $E$ ligt niet op $GH$. Ze lopen in een andere richting.
    - opgave: |-
        $AC$ en $BD$
      antwoord: |-
        snijdend
      uitwerking: |-
        De diagonalen van het grondvlak snijden elkaar in het midden.
    - opgave: |-
        $AF$ en $CH$
      antwoord: |-
        kruisend
      uitwerking: |-
        $AF$ ligt in het voorvlak, $CH$ in het achtervlak: geen gemeenschappelijk punt. $CH \parallel BE$, en $BE$ snijdt $AF$, dus $CH$ is niet evenwijdig met $AF$.
    - opgave: |-
        $BG$ en $DE$
      antwoord: |-
        kruisend
      uitwerking: |-
        $BG$ ligt in het rechterzijvlak, $DE$ in het linkerzijvlak: geen gemeenschappelijk punt. $DE \parallel CF$, en $CF$ snijdt $BG$, dus $DE$ is niet evenwijdig met $BG$.
    - opgave: |-
        $BH$ en $DF$
      antwoord: |-
        snijdend
      uitwerking: |-
        Ze liggen allebei in de rechthoek $BDHF$, als diagonalen: ze snijden elkaar in het midden van de kubus.

- id: h1-loodrecht
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Staan de rechten loodrecht op elkaar? Zo ja, zijn ze loodrecht snijdend of loodrecht kruisend?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $AB$ en $AE$
      antwoord: |-
        ja, loodrecht snijdend
      uitwerking: |-
        Ze snijden elkaar in $A$, in het vierkant $ABFE$.
    - opgave: |-
        $BF$ en $AC$
      antwoord: |-
        ja, loodrecht kruisend
      uitwerking: |-
        $BF \parallel AE$, en $AE$ snijdt $AC$ loodrecht in de rechthoek $ACGE$.
    - opgave: |-
        $AB$ en $GH$
      antwoord: |-
        nee, evenwijdig
      uitwerking: |-
        Evenwijdige rechten staan niet loodrecht op elkaar.
    - opgave: |-
        $AC$ en $FH$
      antwoord: |-
        ja, loodrecht kruisend
      uitwerking: |-
        $AC \parallel EG$, en $EG$ snijdt $FH$ loodrecht: de diagonalen van het vierkant $EFGH$.
    - opgave: |-
        $AD$ en $BG$
      antwoord: |-
        nee
      uitwerking: |-
        $AD \parallel BC$, en $BC$ snijdt $BG$ onder $45^\circ$: $BG$ is een diagonaal van het vierkant $BCGF$.
    - opgave: |-
        $EH$ en $CG$
      antwoord: |-
        ja, loodrecht kruisend
      uitwerking: |-
        $EH \parallel FG$, en $FG$ snijdt $CG$ loodrecht in het vierkant $BCGF$.

- id: h1-hoek
  pakketten: [5]
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Bereken de hoek tussen de rechten in de kubus $ABCD.EFGH$. Rond af op $0{,}01^\circ$.
  lijst: enumerate
  delen:
    - opgave: |-
        $AB$ en $CH$
      antwoord: |-
        $45^\circ$
      uitwerking: |-
        $AB \parallel DC$, en $DC$ snijdt $CH$ in $C$. $CH$ is een diagonaal van het vierkant $CDHG$, dus $\hoek{DCH} = 45^\circ$.
    - opgave: |-
        $AC$ en $BE$
      antwoord: |-
        $60^\circ$
      uitwerking: |-
        $AC \parallel EG$ (de rechthoek $ACGE$), en $EG$ snijdt $BE$ in $E$. De driehoek $BEG$ is gelijkzijdig, want zijn zijden zijn diagonalen van zijvlakken. Dus $\hoek{BEG} = 60^\circ$.
    - opgave: |-
        $AE$ en $BH$
      antwoord: |-
        $54{,}74^\circ$
      uitwerking: |-
        $AE \parallel BF$, en $BF$ snijdt $BH$ in $B$. De driehoek $BFH$ ligt in de rechthoek $BDHF$, dus hij is rechthoekig in $F$. Neem ribben van 1: $\lengte{FH} = \sqrt2$ (diagonaal van een vierkant). Dan is $\tan \hoek{FBH} = \frac{\lengte{FH}}{\lengte{BF}} = \sqrt2$, dus $\hoek{FBH} \approx 54{,}74^\circ$.

- id: h1-vlak-drie
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Welke andere hoekpunten van de kubus liggen nog in het vlak?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        het vlak $ABG$
      antwoord: |-
        $H$
      uitwerking: |-
        $AB \parallel HG$ en $\lengte{AB} = \lengte{HG}$: het vlak is de rechthoek $ABGH$.
    - opgave: |-
        het vlak $EFC$
      antwoord: |-
        $D$
      uitwerking: |-
        $EF \parallel DC$ en $\lengte{EF} = \lengte{DC}$: het vlak is de rechthoek $EFCD$.
    - opgave: |-
        het vlak $ACH$
      antwoord: |-
        geen
      uitwerking: |-
        Het vlak snijdt drie hoeken van de kubus af en is een driehoek $ACH$. Geen ander hoekpunt ligt erin.
    - opgave: |-
        het vlak $BEG$
      antwoord: |-
        geen
      uitwerking: |-
        Net als $ACH$ is dit een driehoek die een hoek van de kubus afsnijdt (de hoek $F$).

- id: h1-vlak-twee
  soort: kort
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Bepalen de rechten een vlak? Zo ja, noem het vlak met hoekpunten van de kubus.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $AB$ en $CD$
      antwoord: |-
        ja, $ABCD$
      uitwerking: |-
        Strikt evenwijdig: het grondvlak.
    - opgave: |-
        $AE$ en $HG$
      antwoord: |-
        nee
      uitwerking: |-
        Kruisend: $HG$ ligt in het bovenvlak, $AE$ prikt erdoor in $E$, en $E$ ligt niet op $HG$.
    - opgave: |-
        $BF$ en $BD$
      antwoord: |-
        ja, $BDHF$
      uitwerking: |-
        Snijdend in $B$: het vlak door $B$, $F$ en $D$ is de rechthoek $BDHF$.
    - opgave: |-
        $AH$ en $BG$
      antwoord: |-
        ja, $ABGH$
      uitwerking: |-
        Strikt evenwijdig, zoals in het voorbeeld over $AH$ en $BG$: de rechthoek $ABGH$.
    - opgave: |-
        $EG$ en $BD$
      antwoord: |-
        nee
      uitwerking: |-
        Kruisend: ze liggen in het bovenvlak en het grondvlak, en zijn niet evenwijdig.
    - opgave: |-
        $AG$ en $CE$
      antwoord: |-
        ja, $ACGE$
      uitwerking: |-
        Snijdend in het midden van de kubus: het vlak is de rechthoek $ACGE$.

