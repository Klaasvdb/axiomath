- id: h1-t5
  soort: test
  niveau: 1
  opgave: |-
    Welk ander hoekpunt van de kubus $ABCD.EFGH$ ligt nog in het vlak $ADG$? Verklaar.
  antwoord: |-
    $F$
  uitwerking: |-
    $AD \parallel FG$ en $\lengte{AD} = \lengte{FG}$, dus $ADGF$ is een rechthoek: $F$ ligt in het vlak $ADG$.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    In de kubus $ABCD.EFGH$ is $P$ het midden van $[BF]$ en $Q$ het midden van $[DH]$. Toon aan dat de rechten $PQ$ en $BD$ evenwijdig zijn.
  antwoord: |-
    $BDQP$ is een parallellogram
  uitwerking: |-
    $BF \parallel AE$ en $AE \parallel DH$, dus $BP \parallel DQ$, en $\lengte{BP} = \lengte{DQ}$ (halve ribben). Een vierhoek met twee overstaande zijden even lang en evenwijdig is een parallellogram: $BDQP$. Dus $PQ \parallel BD$.

- id: h1-t7
