      uitwerking: |-
        Kruisend: $EH$ ligt in het bovenvlak, $BF$ prikt erdoor in $F$, niet op $EH$.
    - opgave: |-
        $AF$ en $BE$
      antwoord: |-
        ja, $ABFE$
      uitwerking: |-
        Snijdend: het voorvlak.
    - opgave: |-
        $AB$ en $GH$
      antwoord: |-
        ja, $ABGH$
      uitwerking: |-
