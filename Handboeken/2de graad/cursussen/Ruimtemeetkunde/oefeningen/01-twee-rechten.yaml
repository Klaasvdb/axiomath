- id: h1-t8
  pakketten: [5]
  soort: test
  niveau: 2
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Staan de rechten in de kubus $ABCD.EFGH$ loodrecht op elkaar? Zo ja, loodrecht snijdend of loodrecht kruisend? Zo nee, bereken de hoek tussen de rechten (rond af op $0{,}01^\circ$).
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $BC$ en $CD$
      antwoord: |-
        ja, loodrecht snijdend
      uitwerking: |-
        Twee zijden van het vierkant $ABCD$, met snijpunt $C$.
    - opgave: |-
        $AD$ en $CG$
      antwoord: |-
        ja, loodrecht kruisend
      uitwerking: |-
        $CG \parallel DH$, en $DH$ snijdt $AD$ loodrecht in het vierkant $ADHE$.
    - opgave: |-
        $BF$ en $EG$
      antwoord: |-
        ja, loodrecht kruisend
      uitwerking: |-
        $BF \parallel AE$, en $AE$ snijdt $EG$ loodrecht in de rechthoek $ACGE$.
    - opgave: |-
        $AE$ en $DF$
      antwoord: |-
        nee, $54{,}74^\circ$
      uitwerking: |-
        $AE \parallel DH$, en $DH$ snijdt $DF$ in $D$. De driehoek $DHF$ ligt in de rechthoek $BDHF$ en is rechthoekig in $H$. Met ribben van 1 is $\lengte{HF} = \sqrt2$, dus $\tan \hoek{HDF} = \sqrt2$ en $\hoek{HDF} \approx 54{,}74^\circ$.
