# Opdrachten: niveau 1 (o1-o8, o25), niveau 2 (o9-o18, o26, o27), niveau 3 (o19-o24, o28 alleen pakket 5)

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    ligging van twee rechten in een kubus
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.6,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Onderzoek de ligging van de rechten in de kubus $ABCD.EFGH$: snijdend, evenwijdig of kruisend?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $AB$ en $EF$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Overstaande zijden van het voorvlak.
    - opgave: |-
        $AE$ en $BC$
      antwoord: |-
        kruisend
      uitwerking: |-
        $BC$ ligt in het grondvlak, $AE$ prikt erdoor in $A$, niet op $BC$. Andere richting.
    - opgave: |-
        $EH$ en $DH$
      antwoord: |-
        snijdend
      uitwerking: |-
        In het hoekpunt $H$.
    - opgave: |-
        $AD$ en $FG$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Allebei van voor naar achter; ze liggen in de rechthoek $ADGF$.
    - opgave: |-
        $BF$ en $EH$
      antwoord: |-
        kruisend
      uitwerking: |-
        $EH$ ligt in het bovenvlak, $BF$ prikt erdoor in $F$, niet op $EH$. Andere richting.
    - opgave: |-
        $AC$ en $EG$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Overstaande zijden van de rechthoek $ACGE$.
    - opgave: |-
        $CH$ en $DG$
      antwoord: |-
        snijdend
      uitwerking: |-
        Diagonalen van het achtervlak $CDHG$: ze snijden elkaar in het midden ervan.
    - opgave: |-
        $BD$ en $FH$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Overstaande zijden van de rechthoek $BDHF$.
    - opgave: |-
        $DC$ en $BF$
      antwoord: |-
        kruisend
      uitwerking: |-
        $DC$ ligt in het grondvlak, $BF$ prikt erdoor in $B$, niet op $DC$. Andere richting.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    een vlak bepalen, grondeigenschappen
  opgave: |-
    Waar of niet waar? Geef bij wat niet waar is een voorbeeld dat het tegendeel toont.
  lijst: enumerate
  delen:
    - opgave: |-
        Door twee punten gaat precies één vlak.
      antwoord: |-
        niet waar
      uitwerking: |-
        Door twee punten gaan oneindig veel vlakken, zoals de standen van een deur rond de rechte door haar scharnieren.
    - opgave: |-
        Door drie punten gaat altijd precies één vlak.
      antwoord: |-
        niet waar
      uitwerking: |-
        Alleen als de punten niet collineair zijn. Door $A$, $B$ en het midden van $[AB]$ gaan oneindig veel vlakken.
    - opgave: |-
        Een rechte die twee punten gemeen heeft met een vlak, ligt in dat vlak.
      antwoord: |-
        waar
      uitwerking: |-
        Dat is de grondeigenschap \textit{rechte in een vlak} (als de twee punten verschillend zijn).
    - opgave: |-
        Twee snijdende rechten liggen altijd in één vlak.
      antwoord: |-
        waar
      uitwerking: |-
        Ze bepalen precies één vlak.
    - opgave: |-
        Twee rechten die geen punt gemeen hebben, liggen altijd in één vlak.
      antwoord: |-
        niet waar
      uitwerking: |-
        Kruisende rechten, zoals $AB$ en $CG$ in een kubus, hebben geen punt gemeen en liggen niet in één vlak.
    - opgave: |-
        Door een rechte en een punt gaat altijd precies één vlak.
      antwoord: |-
        niet waar
      uitwerking: |-
        Alleen als het punt niet op de rechte ligt. Ligt het punt op de rechte, dan gaan er oneindig veel vlakken door.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    tekenen in cavalièreperspectief
  opgave: |-
    Teken in cavalièreperspectief.
  lijst: enumerate
  delen:
    - opgave: |-
        een kubus $ABCD.EFGH$ met ribben van 5~cm, met de diagonalen $[BH]$ en $[DF]$
      antwoord: |-
        ribben naar achter 2,5~cm
      uitwerking: |-
        Het voorvlak is een vierkant van 5~cm, de ribben naar achter teken je 2,5~cm lang onder $45^\circ$. De diagonalen snijden elkaar in het midden van de kubus.
        \figuren{\begin{tikzpicture}[schuin,scale=.4,font=\scriptsize]
          \draadkubus{5}
          \draw[nadruk] (B) -- (H) (D) -- (F);
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        een balk $ABCD.EFGH$ met $\lengte{AB} = 3$~cm, $\lengte{AD} = 6$~cm en $\lengte{AE} = 2$~cm
      antwoord: |-
        voorvlak 3~cm bij 2~cm, ribben naar achter 3~cm
      uitwerking: |-
        Een lange, platte balk die naar achter loopt: het voorvlak is 3~cm breed en 2~cm hoog, de ribben naar achter teken je 3~cm lang.
        \figuren{\begin{tikzpicture}[schuin,scale=.5,font=\scriptsize]
          \draadbalk{3}{2}{6}
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        een kubus $ABCD.EFGH$ met ribben van 4~cm, en de driehoek $ACH$ in kleur
      antwoord: |-
        $[AC]$ en $[CH]$ in stippellijn
      uitwerking: |-
        $[AC]$ ligt in het grondvlak en $[CH]$ in het achtervlak: die zie je niet, dus stippellijn. $[AH]$ ligt in het linkerzijvlak, dat je ook niet ziet, maar de driehoek zelf loopt door de kubus.
        \figuren{\begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
          \draadkubus{4}
          \fill[vlakdeel] (A) -- (C) -- (H) -- cycle;
          \draw[accent,thick,dashed] (A) -- (C) -- (H) -- cycle;
          \balknamen
        \end{tikzpicture}}

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    ligging van twee rechten in het dagelijks leven
  opgave: |-
    Snijdend, evenwijdig of kruisend? Denk aan de rechten waarop de lijnen liggen.
  lijst: enumerate
  delen:
    - opgave: |-
        twee randen van een tafelblad die samenkomen in een hoek
      antwoord: |-
        snijdend
      uitwerking: |-
        Ze hebben de hoek als gemeenschappelijk punt.
    - opgave: |-
        de twee rails van een recht spoor
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Ze liggen in het vlak van de grond en hebben geen punt gemeen.
    - opgave: |-
        een rechte spoorweg en een rechte autoweg op een brug die er dwars over loopt
      antwoord: |-
        kruisend
      uitwerking: |-
        Ze hebben geen punt gemeen (de brug ligt hoger) en lopen in een andere richting.
    - opgave: |-
        een verticale vlaggenmast en een rechte witte lijn op het voetbalveld die niet door de voet van de mast gaat
      antwoord: |-
        kruisend
      uitwerking: |-
        De lijn ligt in het vlak van het veld, de mast prikt erdoor in zijn voet, en die ligt niet op de lijn.
    - opgave: |-
        twee lijnen op hetzelfde blad van een gelijnd schrift
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Ze liggen in het vlak van het blad en hebben geen punt gemeen.
    - opgave: |-
        de grote en de kleine wijzer van een klok
      antwoord: |-
        snijdend (of samenvallend)
      uitwerking: |-
        Ze draaien allebei om de as in het midden van de klok: dat punt hebben ze gemeen. Om 12 uur vallen ze samen.
    - opgave: |-
        de bovenrand van het bord en de rand van de vloer onder het bord
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Ze liggen in het vlak van de muur en hebben geen punt gemeen.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    ligging van twee rechten in een balk
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.6,font=\scriptsize]
        \draadbalk{4}{2}{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Onderzoek de ligging van de rechten in de balk $ABCD.EFGH$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $AB$ en $HG$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Allebei van links naar rechts; ze liggen in het vlak $ABGH$.
    - opgave: |-
        $AD$ en $GH$
      antwoord: |-
        kruisend
      uitwerking: |-
        $GH$ ligt in het bovenvlak, $AD$ in het grondvlak: geen gemeenschappelijk punt. Andere richting.
    - opgave: |-
        $BF$ en $DH$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Allebei van onder naar boven; ze liggen in het vlak $BDHF$.
    - opgave: |-
        $AH$ en $BG$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        $AB \parallel HG$ en $\lengte{AB} = \lengte{HG}$, dus $ABGH$ is een parallellogram.
    - opgave: |-
        $AC$ en $BD$
      antwoord: |-
        snijdend
      uitwerking: |-
        De diagonalen van het grondvlak snijden elkaar in het midden.
    - opgave: |-
        $CE$ en $DF$
      antwoord: |-
        snijdend
      uitwerking: |-
        Ze liggen in het vlak $CDEF$ (een rechthoek) als diagonalen, en snijden elkaar in het midden van de balk.
    - opgave: |-
        $AE$ en $CD$
      antwoord: |-
        kruisend
      uitwerking: |-
        $CD$ ligt in het grondvlak, $AE$ prikt erdoor in $A$, niet op $CD$. Andere richting.
    - opgave: |-
        $EG$ en $BC$
      antwoord: |-
        kruisend
      uitwerking: |-
        Bovenvlak en grondvlak: geen gemeenschappelijk punt. $EG \parallel AC$ en $AC$ snijdt $BC$, dus $EG$ is niet evenwijdig met $BC$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    coplanaire punten
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Zijn de punten coplanair? Noem het vlak als dat kan.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $A$, $B$, $C$ en $D$
      antwoord: |-
        ja, het grondvlak
      uitwerking: |-
        Ze liggen in het grondvlak.
    - opgave: |-
        $A$, $B$, $C$ en $G$
      antwoord: |-
        nee
      uitwerking: |-
        $A$, $B$ en $C$ bepalen het grondvlak, en $G$ ligt erboven.
    - opgave: |-
        $A$, $B$, $G$ en $H$
      antwoord: |-
        ja, $ABGH$
      uitwerking: |-
        $AB \parallel HG$: de rechthoek $ABGH$.
    - opgave: |-
        $B$, $D$, $E$ en $G$
      antwoord: |-
        nee
      uitwerking: |-
        Het vlak $BDE$ snijdt de hoek $A$ af en bevat geen ander hoekpunt.
    - opgave: |-
        $E$, $F$, $C$ en $D$
      antwoord: |-
        ja, $EFCD$
      uitwerking: |-
        $EF \parallel DC$: de rechthoek $EFCD$.
    - opgave: |-
        $A$, $G$ en het midden $M$ van $[AG]$
      antwoord: |-
        ja, oneindig veel vlakken
      uitwerking: |-
        De drie punten zijn collineair: ze liggen op de rechte $AG$, en door een rechte gaan oneindig veel vlakken.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    ligging van twee rechten in een piramide
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadpiramide{3}{3.4}
        \draw[verborgen] (A) -- (C) (B) -- (D) (M) -- (T);
        \pnt[below]{M}{$M$}
        \piramidenamen
      \end{tikzpicture}
  opgave: |-
    $T.ABCD$ is een piramide met een vierkant grondvlak $ABCD$. De top $T$ ligt recht boven het midden $M$ van het grondvlak. Onderzoek de ligging van de rechten.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $TA$ en $TC$
      antwoord: |-
        snijdend
      uitwerking: |-
        In de top $T$.
    - opgave: |-
        $AB$ en $CD$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Overstaande zijden van het vierkant $ABCD$.
    - opgave: |-
        $TA$ en $BC$
      antwoord: |-
        kruisend
      uitwerking: |-
        $BC$ ligt in het grondvlak, $TA$ prikt erdoor in $A$, niet op $BC$. Andere richting.
    - opgave: |-
        $TB$ en $AD$
      antwoord: |-
        kruisend
      uitwerking: |-
        $AD$ ligt in het grondvlak, $TB$ prikt erdoor in $B$, niet op $AD$.
    - opgave: |-
        $AC$ en $BD$
      antwoord: |-
        snijdend
      uitwerking: |-
        In het midden $M$ van het grondvlak.
    - opgave: |-
        $TM$ en $AB$
      antwoord: |-
        kruisend
      uitwerking: |-
        $AB$ ligt in het grondvlak, $TM$ prikt erdoor in $M$, niet op $AB$.
    - opgave: |-
        $TM$ en $AC$
      antwoord: |-
        snijdend
      uitwerking: |-
        In $M$, want $M$ ligt op $AC$.

- id: h1-o8
  soort: opdracht
  niveau: 1
  thema: |-
    kruisende rechten in een kubus
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Noem alle ribben van de kubus die kruisend zijn met de rechte.
  lijst: enumerate
  delen:
    - opgave: |-
        de ribbe $AB$
      antwoord: |-
        $CG$, $DH$, $EH$ en $FG$
      uitwerking: |-
        Van de 11 andere ribben snijden er 4 de ribbe $AB$ (in $A$ of $B$) en zijn er 3 evenwijdig. De overige 4 zijn kruisend.
    - opgave: |-
        de diagonaal $AC$ van het grondvlak
      antwoord: |-
        $BF$, $DH$, $EF$, $FG$, $GH$ en $EH$
      uitwerking: |-
        $AC$ snijdt de vier ribben van het grondvlak en $AE$ en $CG$. Evenwijdig met $AC$ is geen enkele ribbe. De zes andere ribben zijn kruisend: de vier ribben van het bovenvlak, en $BF$ en $DH$.
    - opgave: |-
        de diagonaal $BH$ van de kubus
      antwoord: |-
        $AE$, $CG$, $AD$, $DC$, $EF$ en $FG$
      uitwerking: |-
        $BH$ snijdt de drie ribben uit $B$ en de drie ribben uit $H$. Geen ribbe is evenwijdig met $BH$. De zes andere ribben zijn kruisend.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    ligging van twee rechten in een huisje met een zadeldak
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.6,font=\scriptsize]
        \balkpunten{4}{2}{2}
        \coordinate (K) at (0,3,1); \coordinate (L) at (4,3,1);
        \fill[accent!5] (A) -- (B) -- (C) -- (G) -- (L) -- (K) -- (E) -- cycle;
        \draw[verborgen] (D) -- (A) (D) -- (C) (D) -- (H) (E) -- (H) -- (G) (H) -- (K);
        \draw[ribbe] (A) -- (B) -- (F) -- (E) -- cycle (B) -- (C) -- (G) -- (F) (E) -- (K) -- (L) -- (F) (G) -- (L);
        \node[above,inner sep=1.5pt] at (K) {$K$}; \node[above,inner sep=1.5pt] at (L) {$L$};
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Een huisje is een balk $ABCD.EFGH$ met een zadeldak. De nok $[KL]$ ligt recht boven het midden van $[EH]$ en van $[FG]$. Onderzoek de ligging van de rechten.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $KL$ en $EF$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        De nok loopt van links naar rechts, net als $EF$. Ze liggen in het dakvlak $EFLK$.
    - opgave: |-
        $KL$ en $BC$
      antwoord: |-
        kruisend
      uitwerking: |-
        $BC$ ligt in het grondvlak, $KL$ hoog erboven: geen gemeenschappelijk punt. Andere richting.
    - opgave: |-
        $EK$ en $FL$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        $KL \parallel EF$ en $\lengte{KL} = \lengte{EF}$, dus $EFLK$ is een parallellogram, en $EK \parallel FL$.
    - opgave: |-
        $EK$ en $HK$
      antwoord: |-
        snijdend
      uitwerking: |-
        In de nok, in $K$.
    - opgave: |-
        $KL$ en $CG$
      antwoord: |-
        kruisend
      uitwerking: |-
        $KL$ ligt in het dakvlak $HGLK$, $CG$ prikt erdoor in $G$, en $G$ ligt niet op $KL$. Andere richting.
    - opgave: |-
        $FL$ en $AD$
      antwoord: |-
        kruisend
      uitwerking: |-
        $FL$ ligt in het vlak van de rechtergevel, $AD$ in het vlak van de linkergevel, en die vlakken hebben geen punt gemeen. Ze zijn niet evenwijdig: $AD$ is horizontaal, $FL$ loopt schuin omhoog.
    - opgave: |-
        $EK$ en $GL$
      antwoord: |-
        kruisend
      uitwerking: |-
        Linkergevel en rechtergevel: geen gemeenschappelijk punt. $FL \parallel EK$, en $FL$ snijdt $GL$ in $L$, dus $GL$ is niet evenwijdig met $EK$.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    hoeveel vlakken bepalen rechten en punten
  opgave: |-
    Hoeveel vlakken bepalen deze punten of rechten samen? Tel de vlakken die door minstens drie van de punten of door minstens twee van de rechten gaan.
  lijst: enumerate
  delen:
    - opgave: |-
        de vier hoekpunten $A$, $B$, $C$ en $T$ van een piramide met een driehoekig grondvlak
      antwoord: |-
        4
      uitwerking: |-
        Elke drie punten bepalen een vlak: $ABC$, $ABT$, $ACT$ en $BCT$. Dat zijn het grondvlak en de drie zijvlakken.
    - opgave: |-
        de ribben $AB$, $AD$ en $AE$ van een kubus
      antwoord: |-
        3
      uitwerking: |-
        Elke twee ervan zijn snijdend in $A$: $ABCD$, $ABFE$ en $ADHE$.
    - opgave: |-
        de ribben $AE$, $BF$ en $CG$ van een kubus
      antwoord: |-
        3
      uitwerking: |-
        Elke twee zijn strikt evenwijdig: $ABFE$, $BCGF$ en $ACGE$.
    - opgave: |-
        de vier opstaande ribben $AE$, $BF$, $CG$ en $DH$ van een kubus
      antwoord: |-
        6
      uitwerking: |-
        Elke twee bepalen een ander vlak: de vier zijvlakken en de twee rechthoeken $ACGE$ en $BDHF$.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    een vlak bepalen met twee rechten in een piramide
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadpiramide{3}{3.4}
        \draw[verborgen] (A) -- (C) (B) -- (D) (M) -- (T);
        \pnt[below]{M}{$M$}
        \piramidenamen
      \end{tikzpicture}
  opgave: |-
    $T.ABCD$ is een piramide met een vierkant grondvlak en de top recht boven het midden $M$ van het grondvlak. Bepalen de rechten een vlak? Zo ja, welk?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $TA$ en $TB$
      antwoord: |-
        ja, $TAB$
      uitwerking: |-
        Snijdend in $T$: het zijvlak $TAB$.
    - opgave: |-
        $AB$ en $CD$
      antwoord: |-
        ja, $ABCD$
      uitwerking: |-
        Strikt evenwijdig: het grondvlak.
    - opgave: |-
        $TA$ en $CD$
      antwoord: |-
        nee
      uitwerking: |-
        Kruisend: $CD$ ligt in het grondvlak, $TA$ prikt erdoor in $A$, niet op $CD$.
    - opgave: |-
        $TA$ en $TC$
      antwoord: |-
        ja, $TAC$
      uitwerking: |-
        Snijdend in $T$: het vlak $TAC$, een driehoek die door $M$ en door het inwendige van de piramide gaat.
    - opgave: |-
        $AC$ en $TM$
      antwoord: |-
        ja, $TAC$
      uitwerking: |-
        Snijdend in $M$: het vlak door $A$, $C$ en $T$, hetzelfde vlak als in de vorige vraag.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    eigenschappen van liggingen, met tegenvoorbeelden
  opgave: |-
    Waar of niet waar? Zoek bij wat niet waar is een tegenvoorbeeld met ribben van een kubus $ABCD.EFGH$.
  lijst: enumerate
  delen:
    - opgave: |-
        Als $a \parallel b$ en $b \parallel c$, dan is $a \parallel c$.
      antwoord: |-
        waar
      uitwerking: |-
        Dat is de eigenschap \textit{evenwijdig met een derde rechte}.
    - opgave: |-
        Als $a$ en $b$ kruisend zijn en $b$ en $c$ kruisend, dan zijn $a$ en $c$ kruisend.
      antwoord: |-
        niet waar
      uitwerking: |-
        $a = AB$, $b = CG$ en $c = AD$: $AB$ en $CG$ zijn kruisend, $CG$ en $AD$ ook, maar $AB$ en $AD$ snijden elkaar in $A$.
    - opgave: |-
        Als $a$ en $b$ snijdend zijn en $b$ en $c$ snijdend, dan zijn $a$ en $c$ snijdend.
      antwoord: |-
        niet waar
      uitwerking: |-
        $a = AB$, $b = BC$ en $c = CG$: $AB$ en $BC$ snijden in $B$, $BC$ en $CG$ in $C$, maar $AB$ en $CG$ zijn kruisend.
    - opgave: |-
        Als $a \parallel b$ en $b$ en $c$ kruisend zijn, dan zijn ook $a$ en $c$ kruisend.
      antwoord: |-
        niet waar
      uitwerking: |-
        $a = AB$, $b = EF$ en $c = BC$: $AB \parallel EF$, $EF$ en $BC$ zijn kruisend, maar $AB$ en $BC$ snijden in $B$.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    ligging van een rechte door de middens van twee ribben
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.6,font=\scriptsize]
        \draadkubus{3}
        \draw[nadruk] (0,1.5,0) -- (3,1.5,3);
        \pnt[left]{0,1.5,0}{$P$} \pnt[right]{3,1.5,3}{$Q$}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    In de kubus $ABCD.EFGH$ is $P$ het midden van $[AE]$ en $Q$ het midden van $[CG]$. Onderzoek de ligging van $PQ$ en de rechte.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $AC$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        $AP \parallel CQ$ en $\lengte{AP} = \lengte{CQ}$, dus $ACQP$ is een parallellogram en $PQ \parallel AC$.
    - opgave: |-
        $EG$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        $PQ \parallel AC$ en $AC \parallel EG$.
    - opgave: |-
        $BD$
      antwoord: |-
        kruisend
      uitwerking: |-
        $PQ$ ligt halverwege tussen grondvlak en bovenvlak en heeft geen punt in het grondvlak, waar $BD$ ligt. $PQ \parallel AC$ en $AC$ snijdt $BD$, dus niet evenwijdig.
    - opgave: |-
        $BH$
      antwoord: |-
        snijdend
      uitwerking: |-
        $PQ$ verbindt de middens van twee overstaande zijden van de rechthoek $ACGE$, dus gaat ze door het midden van die rechthoek: het midden van de kubus. Ook de diagonaal $BH$ gaat door het midden van de kubus. Daar snijden ze elkaar.
    - opgave: |-
        $AE$
      antwoord: |-
        snijdend
      uitwerking: |-
        In $P$.
    - opgave: |-
        $BF$
      antwoord: |-
        kruisend
      uitwerking: |-
        $BF$ ligt in het voorvlak, en $PQ$ heeft daarmee alleen $P$ gemeen, dat niet op $BF$ ligt. $PQ$ loopt schuin naar achter, $BF$ verticaal.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    evenwijdige door een punt
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Welke rechte door het gegeven hoekpunt is evenwijdig met de gegeven rechte? Geef ze met twee hoekpunten van de kubus.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        door $A$, evenwijdig met $BG$
      antwoord: |-
        $AH$
      uitwerking: |-
        $ABGH$ is een rechthoek.
    - opgave: |-
        door $H$, evenwijdig met $BE$
      antwoord: |-
        $HC$
      uitwerking: |-
        $BCHE$ is een rechthoek.
    - opgave: |-
        door $E$, evenwijdig met $AC$
      antwoord: |-
        $EG$
      uitwerking: |-
        $ACGE$ is een rechthoek.
    - opgave: |-
        door $B$, evenwijdig met $DH$
      antwoord: |-
        $BF$
      uitwerking: |-
        Ribben van onder naar boven.
    - opgave: |-
        door $C$, evenwijdig met $DE$
      antwoord: |-
        $CF$
      uitwerking: |-
        $CDEF$ is een rechthoek.
    - opgave: |-
        door $F$, evenwijdig met $DA$
      antwoord: |-
        $FG$
      uitwerking: |-
        Ribben van voor naar achter.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    tekenen en ligging onderzoeken
  opgave: |-
    Teken een kubus $ABCD.EFGH$ met ribben van 4~cm. Teken het midden $M$ van $[AB]$, het midden $N$ van $[GH]$ en de rechte $MN$. Onderzoek de ligging van $MN$ en de rechte.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $AH$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        $AM \parallel HN$ en $\lengte{AM} = \lengte{HN}$, dus $AMNH$ is een parallellogram en $MN \parallel AH$.
        \figuren{\begin{tikzpicture}[schuin,scale=.45,font=\scriptsize]
          \draadkubus{4}
          \draw[nadruk] (2,0,0) -- (2,4,4);
          \draw[accent,dashed] (A) -- (H);
          \pnt[below]{2,0,0}{$M$} \pnt[above]{2,4,4}{$N$}
          \balknamen
        \end{tikzpicture}}
    - opgave: |-
        $BG$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        $MN \parallel AH$ en $AH \parallel BG$.
    - opgave: |-
        $CE$
      antwoord: |-
        snijdend
      uitwerking: |-
        $MC \parallel EN$ en $\lengte{MC} = \lengte{EN}$, dus $MCNE$ is een parallellogram. $MN$ en $CE$ zijn de diagonalen ervan: ze snijden elkaar, in het midden van de kubus.
    - opgave: |-
        $EF$
      antwoord: |-
        kruisend
      uitwerking: |-
        $EF$ ligt in het voorvlak, $MN$ heeft daarmee alleen $M$ gemeen, dat niet op $EF$ ligt. $MN \parallel AH$, en $AH$ is niet evenwijdig met $EF$.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    ligging van twee rechten in een prisma
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.6,font=\scriptsize]
        \coordinate (A) at (0,0,0); \coordinate (B) at (3.4,0,0); \coordinate (C) at (1.7,0,2.6);
        \coordinate (D) at (0,2.4,0); \coordinate (E) at (3.4,2.4,0); \coordinate (F) at (1.7,2.4,2.6);
        \fill[accent!5] (A) -- (B) -- (E) -- (F) -- (D) -- cycle;
        \draw[verborgen] (A) -- (C) -- (B) (C) -- (F);
        \draw[ribbe] (A) -- (B) -- (E) -- (D) -- cycle (D) -- (F) -- (E);
        \node[below left,inner sep=1.5pt] at (A) {$A$}; \node[below right,inner sep=1.5pt] at (B) {$B$};
        \node[right,inner sep=2pt] at (C) {$C$}; \node[left,inner sep=1.5pt] at (D) {$D$};
        \node[right,inner sep=1.5pt] at (E) {$E$}; \node[above,inner sep=1.5pt] at (F) {$F$};
      \end{tikzpicture}
  opgave: |-
    $ABC.DEF$ is een recht prisma met als grondvlak de driehoek $ABC$. De opstaande ribben $[AD]$, $[BE]$ en $[CF]$ staan loodrecht op het grondvlak. Onderzoek de ligging van de rechten.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $AB$ en $DE$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Overstaande zijden van de rechthoek $ABED$.
    - opgave: |-
        $AD$ en $CF$
      antwoord: |-
        evenwijdig
      uitwerking: |-
        Twee opstaande ribben: ze liggen in de rechthoek $ACFD$.
    - opgave: |-
        $AB$ en $CF$
      antwoord: |-
        kruisend
      uitwerking: |-
        $AB$ ligt in het grondvlak, $CF$ prikt erdoor in $C$, niet op $AB$. Andere richting.
    - opgave: |-
        $BC$ en $DF$
      antwoord: |-
        kruisend
      uitwerking: |-
        Grondvlak en bovenvlak: geen gemeenschappelijk punt. $DF \parallel AC$, en $AC$ snijdt $BC$, dus $DF$ is niet evenwijdig met $BC$.
    - opgave: |-
        $AE$ en $BD$
      antwoord: |-
        snijdend
      uitwerking: |-
        Diagonalen van de rechthoek $ABED$: ze snijden elkaar in het midden.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    een vlak bepalen met drie punten, in het dagelijks leven
  opgave: |-
    Een tafel met drie poten wiebelt nooit, ook niet op een ongelijke vloer. Een tafel met vier poten soms wel.
  lijst: enumerate
  delen:
    - opgave: |-
        Verklaar dat met een grondeigenschap.
      antwoord: |-
        door drie punten gaat altijd een vlak, door vier niet altijd
      uitwerking: |-
        De drie uiteinden van de poten liggen niet op één rechte, dus er gaat precies één vlak door: de tafel staat altijd stevig op die drie punten. Bij vier poten hoeven de vier uiteinden niet coplanair te zijn: dan raken maar drie ervan tegelijk de vloer, en wiebelt de tafel tussen twee standen.
    - opgave: |-
        Kan een tafel met drie poten toch wiebelen als de uiteinden van de poten op één rechte liggen? Hoe ziet zo'n tafel eruit?
      antwoord: |-
        ja
      uitwerking: |-
        Door drie collineaire punten gaan oneindig veel vlakken: de tafel kan kantelen rond die rechte, zoals een tafel met drie poten op een rij onder het blad.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    rechten bij een vlak tekenen
  opgave: |-
    Teken een vlak $\alpha$ als een parallellogram, en daarin een rechte $a$. Teken daarna:
  lijst: enumerate
  delen:
    - opgave: |-
        een rechte $b$ die niet in $\alpha$ ligt en $a$ snijdt
      antwoord: |-
        $b$ prikt door $\alpha$ in een punt van $a$
      uitwerking: |-
        Kies een punt $S$ op $a$ en een punt $P$ boven het vlak: $b = SP$.
    - opgave: |-
        een rechte $c$ die kruisend is met $a$
      antwoord: |-
        $c$ prikt door $\alpha$ in een punt buiten $a$
      uitwerking: |-
        Kies een punt $R$ van $\alpha$ dat niet op $a$ ligt, en een punt $Q$ boven het vlak: $c = RQ$. Het stuk van $c$ onder het vlak teken je in stippellijn.
    - opgave: |-
        een rechte $d$ die strikt evenwijdig is met $a$ en niet in $\alpha$ ligt
      antwoord: |-
        $d$ boven $\alpha$, evenwijdig getekend met $a$
      uitwerking: |-
        Teken $d$ boven het vlak, evenwijdig met $a$ in de tekening: evenwijdige rechten blijven evenwijdig in de tekening.
        \figuren{\begin{tikzpicture}[scale=.8,font=\scriptsize]
          \vlakje{0}{0}{4.4}{1.8}{\alpha}
          \draw[accent,thick] (.3,.3) -- (4.3,.9) node[right] {$a$};
          \draw[accent,thick] (.9,1.9) -- (4.9,2.5) node[right] {$d$};
          \draw[grijs,thick] (1.6,.495) -- (1.1,2.2) node[above] {$b$};
          \fill (1.6,.495) circle (1.5pt) node[below] {$S$};
          \draw[grijs,thick] (3.3,1.05) -- (3.8,2.4) node[above] {$c$};
          \draw[grijs,thick,dashed] (3.3,1.05) -- (3.1,.5);
          \fill (3.3,1.05) circle (1.5pt) node[right] {$R$};
        \end{tikzpicture}}

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    rechten die twee aan twee kruisend zijn
  opgave: |-
    Rechten zijn \textit{twee aan twee kruisend} als elke twee ervan kruisend zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek drie ribben van een kubus $ABCD.EFGH$ die twee aan twee kruisend zijn.
      antwoord: |-
        bijvoorbeeld $AB$, $CG$ en $EH$
      uitwerking: |-
        $AB$ en $CG$ zijn kruisend. $EH$ ligt in het bovenvlak, $CG$ prikt erdoor in $G$, niet op $EH$: kruisend. $EH$ en $AB$: $EH$ prikt door het voorvlak in $E$, niet op $AB$, en de richtingen verschillen: kruisend.
    - opgave: |-
        Kun je vier ribben van een kubus vinden die twee aan twee kruisend zijn? Leg uit.
      antwoord: |-
        nee
      uitwerking: |-
        De ribben lopen in maar drie richtingen. Bij vier ribben lopen er dus minstens twee in dezelfde richting, en die zijn evenwijdig, niet kruisend.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    paren ribben van een kubus tellen
  opgave: |-
    Een kubus heeft 12 ribben. Neem telkens twee ribben.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel paren van twee ribben zijn er? Tip: elke ribbe vormt een paar met 11 andere, maar zo tel je elk paar twee keer.
      antwoord: |-
        66
      uitwerking: |-
        $\tfrac{12 \cdot 11}{2} = 66$.
    - opgave: |-
        Hoeveel van die paren zijn snijdend?
      antwoord: |-
        24
      uitwerking: |-
        In elk van de 8 hoekpunten komen 3 ribben samen, en die vormen 3 paren: $8 \cdot 3 = 24$.
    - opgave: |-
        Hoeveel paren zijn evenwijdig?
      antwoord: |-
        18
      uitwerking: |-
        Per richting zijn er 4 ribben, die 6 paren vormen: $3 \cdot 6 = 18$.
    - opgave: |-
        Hoeveel paren zijn kruisend? Controleer met de Verken: hoeveel ribben zijn kruisend met één ribbe?
      antwoord: |-
        24
      uitwerking: |-
        $66 - 24 - 18 = 24$. Controle: elke ribbe is kruisend met 4 andere, en $\tfrac{12 \cdot 4}{2} = 24$.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    een rechte en twee evenwijdige rechten
  opgave: |-
    De rechten $b$ en $c$ zijn strikt evenwijdig. Zoek telkens een voorbeeld met ribben of diagonalen van een kubus, of leg uit waarom het niet kan.
  lijst: enumerate
  delen:
    - opgave: |-
        een rechte $a$ die kruisend is met $b$ en met $c$
      antwoord: |-
        bijvoorbeeld $b = AB$, $c = EF$, $a = CG$
      uitwerking: |-
        $CG$ is kruisend met $AB$, en ook met $EF$: $CG$ heeft geen punt in het voorvlak, waar $EF$ ligt, en de richtingen verschillen.
    - opgave: |-
        een rechte $a$ die $b$ snijdt en kruisend is met $c$
      antwoord: |-
        bijvoorbeeld $b = AB$, $c = HG$, $a = BF$
      uitwerking: |-
        $BF$ snijdt $AB$ in $B$. $HG$ ligt in het bovenvlak, $BF$ prikt erdoor in $F$, niet op $HG$: kruisend.
    - opgave: |-
        een rechte $a$ die $b$ en $c$ allebei snijdt
      antwoord: |-
        bijvoorbeeld $b = AB$, $c = EF$, $a = BE$
      uitwerking: |-
        $BE$ snijdt $AB$ in $B$ en $EF$ in $E$.
    - opgave: |-
        In welk vlak ligt $a$ in de vorige vraag? Is dat altijd zo als $a$ beide rechten in twee verschillende punten snijdt?
      antwoord: |-
        in het vlak van $b$ en $c$; ja
      uitwerking: |-
        $BE$ ligt in het voorvlak, het vlak van $AB$ en $EF$. Altijd: $a$ heeft twee verschillende punten in het vlak van $b$ en $c$, dus ligt ze erin.

- id: h1-o22
  pakketten: [1, 2, 3, 4]
  soort: opdracht
  niveau: 3
  thema: |-
    kruisende rechten en evenwijdigheid
  opgave: |-
    De rechten $a$ en $b$ zijn kruisend. Kan een rechte $c$ evenwijdig zijn met $a$ én met $b$? Leg uit.
  antwoord: |-
    nee
  uitwerking: |-
    Was $c \parallel a$ en $c \parallel b$, dan zou $a \parallel b$ (evenwijdig met een derde rechte). Maar evenwijdige rechten liggen in één vlak, en kruisende niet. Dus kan dat niet.

- id: h1-o22
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs uit het ongerijmde met kruisende rechten
  opgave: |-
    Bewijs uit het ongerijmde: als $a$ en $b$ kruisend zijn, dan bestaat er geen rechte $c$ die evenwijdig is met $a$ én met $b$.
  antwoord: |-
    stel van wel, dan is $a \parallel b$
  uitwerking: |-
    Stel dat er een rechte $c$ is met $c \parallel a$ en $c \parallel b$. Dan is $a \parallel c$ en $c \parallel b$, dus $a \parallel b$ (evenwijdig met een derde rechte). Evenwijdige rechten liggen in één vlak, terwijl kruisende rechten niet in één vlak liggen. Dat is een tegenspraak, dus zo'n rechte $c$ bestaat niet.

- id: h1-o23
  soort: opdracht
  niveau: 3
  thema: |-
    een rechte die twee snijdende rechten snijdt
  opgave: |-
    De rechten $a$ en $b$ snijden elkaar in $S$. Een rechte $c$ snijdt $a$ in $P$ en $b$ in $Q$, met $P \neq Q$. Toon aan dat $c$ in het vlak van $a$ en $b$ ligt. Wat als $P = Q = S$?
  antwoord: |-
    $c$ heeft twee punten in dat vlak; dan hoeft $c$ er niet in te liggen
  uitwerking: |-
    $a$ en $b$ bepalen een vlak $\alpha$. Het punt $P$ ligt op $a$, dus in $\alpha$, en $Q$ ligt op $b$, dus in $\alpha$. De rechte $c$ heeft dus twee verschillende punten in $\alpha$, en ligt erin. Gaat $c$ door $S$ en verder niet door $a$ of $b$, dan kan ze uit het vlak steken, zoals de ribbe $AE$ bij $a = AB$ en $b = AD$.

- id: h1-o24
  soort: opdracht
  niveau: 3
  thema: |-
    vlakken door hoekpunten van een kubus tellen
  opgave: |-
    Hoeveel verschillende vlakken gaan er door minstens drie hoekpunten van een kubus? Tip: tel de zijvlakken, de vlakken door twee overstaande ribben, en de vlakken die een hoek afsnijden, zoals $BDE$.
  antwoord: |-
    20
  uitwerking: |-
    Er zijn 6 zijvlakken. Een vlak door twee evenwijdige ribben die niet in hetzelfde zijvlak liggen, zoals $ACGE$: per richting zijn er 2, dus 6. Een vlak dat een hoek afsnijdt, gaat door de drie hoekpunten naast een hoekpunt, zoals $BDE$ naast $A$: één per hoekpunt, dus 8. Samen $6 + 6 + 8 = 20$. Controle: elk vlak met 4 hoekpunten bevat 4 drietallen, elk afgesneden hoek 1, en $12 \cdot 4 + 8 = 56$ is het aantal drietallen van 8 hoekpunten.

- id: h1-o25
  soort: opdracht
  niveau: 1
  thema: |-
    loodrechte rechten in een kubus
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Noem alle ribben van de kubus $ABCD.EFGH$ die loodrecht staan op de ribbe $AB$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke ervan snijden $AB$?
      antwoord: |-
        $AD$, $AE$, $BC$ en $BF$
      uitwerking: |-
        In $A$ en in $B$ komen telkens twee ribben samen met $AB$, onder een rechte hoek: de zijvlakken zijn vierkanten.
    - opgave: |-
        Welke ervan zijn kruisend met $AB$?
      antwoord: |-
        $CG$, $DH$, $EH$ en $FG$
      uitwerking: |-
        Dat zijn de vier ribben die kruisend zijn met $AB$. Ze staan er allemaal loodrecht op: $CG$ en $DH$ zijn evenwijdig met $BF$, en $EH$ en $FG$ met $BC$.
    - opgave: |-
        Welke ribben staan niet loodrecht op $AB$?
      antwoord: |-
        $DC$, $EF$ en $HG$
      uitwerking: |-
        De drie ribben die evenwijdig zijn met $AB$. Alle acht andere ribben staan loodrecht op $AB$.

- id: h1-o26
  soort: opdracht
  niveau: 2
  thema: |-
    loodrechte rechten: diagonalen van een kubus
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Staan de rechten in de kubus $ABCD.EFGH$ loodrecht op elkaar? Zo ja, zijn ze loodrecht snijdend of loodrecht kruisend? Verklaar.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $AC$ en $BD$
      antwoord: |-
        ja, loodrecht snijdend
      uitwerking: |-
        De diagonalen van het vierkant $ABCD$ snijden elkaar loodrecht.
    - opgave: |-
        $BD$ en $EG$
      antwoord: |-
        ja, loodrecht kruisend
      uitwerking: |-
        $EG \parallel AC$ (de rechthoek $ACGE$), en $AC$ snijdt $BD$ loodrecht.
    - opgave: |-
        $BD$ en $CG$
      antwoord: |-
        ja, loodrecht kruisend
      uitwerking: |-
        $CG \parallel BF$, en $BF$ snijdt $BD$ loodrecht in de rechthoek $BDHF$.
    - opgave: |-
        $BG$ en $DE$
      antwoord: |-
        ja, loodrecht kruisend
      uitwerking: |-
        $BG \parallel AH$ (de rechthoek $ABGH$), en $AH$ snijdt $DE$ loodrecht: de diagonalen van het vierkant $ADHE$.
    - opgave: |-
        $BG$ en $CH$
      antwoord: |-
        nee
      uitwerking: |-
        $BG \parallel AH$, en $AH$ snijdt $CH$ in $H$. De driehoek $ACH$ is gelijkzijdig (drie diagonalen van zijvlakken), dus de hoek is $60^\circ$.
    - opgave: |-
        $BE$ en $CH$
      antwoord: |-
        nee, evenwijdig
      uitwerking: |-
        $BCHE$ is een rechthoek, dus $BE \parallel CH$.

- id: h1-o27
  soort: opdracht
  niveau: 2
  thema: |-
    twee rechten loodrecht op een derde rechte
  figuur:
    opties: |-
      2.4cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadkubus{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    In het vlak zijn twee rechten die loodrecht staan op dezelfde rechte, evenwijdig. In de ruimte niet altijd. Zoek met ribben van de kubus $ABCD.EFGH$ twee rechten $a$ en $b$ die allebei loodrecht staan op $AE$.
  lijst: enumerate
  delen:
    - opgave: |-
        $a$ en $b$ zijn evenwijdig.
      antwoord: |-
        bijvoorbeeld $AB$ en $DC$
      uitwerking: |-
        $AB \perp AE$, en $DC \parallel AB$, dus ook $DC \perp AE$ (loodrecht kruisend). $AB$ en $DC$ zijn evenwijdig. Ook $AB$ en $EF$ kan.
    - opgave: |-
        $a$ en $b$ zijn snijdend.
      antwoord: |-
        bijvoorbeeld $AB$ en $AD$
      uitwerking: |-
        $AB$ en $AD$ snijden $AE$ loodrecht in $A$, en ze snijden elkaar in $A$. Ook $EF$ en $EH$ kan.
    - opgave: |-
        $a$ en $b$ zijn kruisend.
      antwoord: |-
        bijvoorbeeld $AB$ en $FG$
      uitwerking: |-
        $AB \perp AE$, en $FG \parallel EH$ met $EH \perp AE$, dus $FG \perp AE$ (loodrecht kruisend). $AB$ en $FG$ zijn kruisend.
    - opgave: |-
        Wat weet je dus over de ligging van twee rechten die loodrecht staan op dezelfde rechte?
      antwoord: |-
        niets: ze kunnen evenwijdig, snijdend of kruisend zijn
      uitwerking: |-
        Alle drie de liggingen komen voor. De eigenschap uit het vlak geldt in de ruimte niet.

- id: h1-o28
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    de hoek tussen twee rechten in een balk
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[schuin,scale=.55,font=\scriptsize]
        \draadbalk{4}{2}{3}
        \balknamen
      \end{tikzpicture}
  opgave: |-
    Een balk $ABCD.EFGH$ heeft $\lengte{AB} = 4$~cm, $\lengte{AD} = 3$~cm en $\lengte{AE} = 2$~cm. Bereken de hoek tussen de rechten. Rond af op $0{,}01^\circ$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $AB$ en $CH$
      antwoord: |-
        $26{,}57^\circ$
      uitwerking: |-
        $AB \parallel DC$, en $DC$ snijdt $CH$ in $C$. In de rechthoek $CDHG$ is $\tan \hoek{DCH} = \frac{\lengte{DH}}{\lengte{DC}} = \frac24$, dus $\hoek{DCH} \approx 26{,}57^\circ$.
    - opgave: |-
        $AE$ en $BG$
      antwoord: |-
        $56{,}31^\circ$
      uitwerking: |-
        $AE \parallel BF$, en $BF$ snijdt $BG$ in $B$. In de rechthoek $BCGF$ is $\tan \hoek{FBG} = \frac{\lengte{FG}}{\lengte{BF}} = \frac32$, dus $\hoek{FBG} \approx 56{,}31^\circ$.
    - opgave: |-
        $AC$ en $FH$
      antwoord: |-
        $73{,}74^\circ$
      uitwerking: |-
        $AC \parallel EG$ (de rechthoek $ACGE$), en $EG$ snijdt $FH$ in het midden $M$ van het bovenvlak. In de rechthoek $EFGH$ is $\tan \hoek{FEG} = \frac34$, dus $\hoek{FEG} \approx 36{,}87^\circ$. De driehoek $EFM$ is gelijkbenig ($\lengte{ME} = \lengte{MF}$, halve diagonalen), dus $\hoek{EFM} \approx 36{,}87^\circ$ en $\hoek{EMF} \approx 180^\circ - 2 \cdot 36{,}87^\circ = 106{,}26^\circ$. De kleinste hoek tussen $EG$ en $FH$ is $180^\circ - 106{,}26^\circ = 73{,}74^\circ$.

