# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Dit ken je uit de 1ste graad. Los op of werk uit.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x + 7 = 12$
      antwoord: |-
        $x=5$
      uitwerking: |-
        $x=12-7=5$.
    - opgave: |-
        $x - 4 = -9$
      antwoord: |-
        $x=-5$
      uitwerking: |-
        $x=-9+4=-5$.
    - opgave: |-
        $5x = -35$
      antwoord: |-
        $x=-7$
      uitwerking: |-
        $x=\tfrac{-35}{5}=-7$.
    - opgave: |-
        $\tfrac{x}{4} = 6$
      antwoord: |-
        $x=24$
      uitwerking: |-
        $x=6\cdot4=24$.
    - opgave: |-
        $2x + 3 = 11$
      antwoord: |-
        $x=4$
      uitwerking: |-
        $2x=8$, dus $x=4$.
    - opgave: |-
        werk uit: $3(x - 2)$
      antwoord: |-
        $3x-6$
      uitwerking: |-
        $3\cdot x-3\cdot2=3x-6$.
    - opgave: |-
        werk uit: $-(4 - x)$
      antwoord: |-
        $-4+x$
      uitwerking: |-
        Het minteken keert beide tekens om: $-4+x$.
    - opgave: |-
        werk uit: $\tfrac12 + \tfrac13$
      antwoord: |-
        $\tfrac56$
      uitwerking: |-
        $\tfrac36+\tfrac26=\tfrac56$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Op de balans liggen links 3 zakjes en 2 blokjes, rechts 1 zakje en 8 blokjes. Alle zakjes wegen evenveel, een blokje weegt 1~kg. De balans is in evenwicht.
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.5]
        \balans{3}{2}{1}{8}
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Je neemt links en rechts 2 blokjes weg. Blijft de balans in evenwicht? Wat ligt er nog op?
      antwoord: |-
        ja; links 3 zakjes, rechts 1 zakje en 6 blokjes
      uitwerking: |-
        Aan beide kanten verdwijnt evenveel gewicht, dus de balans blijft in evenwicht. Links liggen nog 3 zakjes, rechts 1 zakje en 6 blokjes.
    - opgave: |-
        Neem nu links en rechts één zakje weg. Wat ligt er nog op?
      antwoord: |-
        links 2 zakjes, rechts 6 blokjes
      uitwerking: |-
        Links 2 zakjes, rechts 6 blokjes.
    - opgave: |-
        Hoeveel weegt één zakje?
      antwoord: |-
        3~kg
      uitwerking: |-
        Twee zakjes wegen 6~kg, dus één zakje weegt 3~kg.
    - opgave: |-
        Mag je links 2 blokjes wegnemen en rechts niets? Waarom niet?
      antwoord: |-
        neen
      uitwerking: |-
        Neen: dan wordt de linkerkant lichter en is de balans niet meer in evenwicht.

- id: h1-controle
  soort: kort
  opgave: |-
    Ga na of het getal een oplossing is van de vergelijking.
  lijst: enumerate
  delen:
    - opgave: |-
        $3$ \ voor \ $2x + 5 = 11$
      antwoord: |-
        ja
      uitwerking: |-
        $2\cdot3+5=11$: ja.
    - opgave: |-
        $-1$ \ voor \ $4 - x = 3x + 8$
      antwoord: |-
        ja
      uitwerking: |-
        Linkerlid $4+1=5$, rechterlid $-3+8=5$: ja.
    - opgave: |-
        $6$ \ voor \ $\tfrac{x}{2} + 1 = x - 3$
      antwoord: |-
        neen
      uitwerking: |-
        Linkerlid $3+1=4$, rechterlid $6-3=3$: neen.
    - opgave: |-
        $-2$ \ voor \ $3(x + 1) = x - 1$
      antwoord: |-
        ja
      uitwerking: |-
        Linkerlid $3\cdot(-1)=-3$, rechterlid $-2-1=-3$: ja.

- id: h1-optellen
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x - 8 = 3$
      antwoord: |-
        $11$
      uitwerking: |-
        $x=3+8=11$.
    - opgave: |-
        $6 + x = -2$
      antwoord: |-
        $-8$
      uitwerking: |-
        $x=-2-6=-8$.
    - opgave: |-
        $3x + 4 = 2x + 1$
      antwoord: |-
        $-3$
      uitwerking: |-
        $3x-2x=1-4$, dus $x=-3$.
    - opgave: |-
        $5x - 7 = 4x$
      antwoord: |-
        $7$
      uitwerking: |-
        $5x-4x=7$, dus $x=7$.
    - opgave: |-
        $-2x + 9 = -3x$
      antwoord: |-
        $-9$
      uitwerking: |-
        $-2x+3x=-9$, dus $x=-9$.
    - opgave: |-
        $7 - x = 4 - 2x$
      antwoord: |-
        $-3$
      uitwerking: |-
        $-x+2x=4-7$, dus $x=-3$.

- id: h1-vermenigvuldigen
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $6x = -42$
      antwoord: |-
        $-7$
      uitwerking: |-
        $x=\tfrac{-42}{6}=-7$.
    - opgave: |-
        $-5x = -35$
      antwoord: |-
        $7$
      uitwerking: |-
        $x=\tfrac{-35}{-5}=7$.
    - opgave: |-
        $4x = 10$
      antwoord: |-
        $\tfrac52$
      uitwerking: |-
        $x=\tfrac{10}{4}=\tfrac52$.
    - opgave: |-
        $\tfrac{x}{3} = -4$
      antwoord: |-
        $-12$
      uitwerking: |-
        $x=-4\cdot3=-12$.
    - opgave: |-
        $-x = 8$
      antwoord: |-
        $-8$
      uitwerking: |-
        Deel door $-1$: $x=-8$.
    - opgave: |-
        $\tfrac25 x = -6$
      antwoord: |-
        $-15$
      uitwerking: |-
        $x=-6\cdot\tfrac52=-15$.

- id: h1-herleid
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $5x + 2 = 3x + 12$
      antwoord: |-
        $5$
      uitwerking: |-
        $2x=10$, dus $x=5$.
    - opgave: |-
        $9 - 2x = 4x - 3$
      antwoord: |-
        $2$
      uitwerking: |-
        $12=6x$, dus $x=2$.
    - opgave: |-
        $6x - 1 = 2x - 7$
      antwoord: |-
        $-\tfrac32$
      uitwerking: |-
        $4x=-6$, dus $x=-\tfrac32$.
    - opgave: |-
        $x - 11 = 4 - 4x$
      antwoord: |-
        $3$
      uitwerking: |-
        $5x=15$, dus $x=3$.
    - opgave: |-
        $8 - 3x = -x$
      antwoord: |-
        $4$
      uitwerking: |-
        $8=2x$, dus $x=4$.
    - opgave: |-
        $2x + 13 = 7x - 2$
      antwoord: |-
        $3$
      uitwerking: |-
        $15=5x$, dus $x=3$.

- id: h1-haakjes
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2(x + 3) = 14$
      antwoord: |-
        $4$
      uitwerking: |-
        $2x+6=14$, $2x=8$, $x=4$.
    - opgave: |-
        $3(x - 1) = 2x + 5$
      antwoord: |-
        $8$
      uitwerking: |-
        $3x-3=2x+5$, dus $x=8$.
    - opgave: |-
        $4 - (x + 6) = 3x$
      antwoord: |-
        $-\tfrac12$
      uitwerking: |-
        $4-x-6=3x$, $-2=4x$, $x=-\tfrac12$.
    - opgave: |-
        $5(2x - 1) - 3(x + 2) = 3$
      antwoord: |-
        $2$
      uitwerking: |-
        $10x-5-3x-6=3$, $7x=14$, $x=2$.
    - opgave: |-
        $7 - 3(2 - x) = 2(x + 4)$
      antwoord: |-
        $7$
      uitwerking: |-
        $7-6+3x=2x+8$, $1+3x=2x+8$, $x=7$.
    - opgave: |-
        $-2(x - 5) = x + 1$
      antwoord: |-
        $3$
      uitwerking: |-
        $-2x+10=x+1$, $9=3x$, $x=3$.

- id: h1-breuken
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x}{2} + \dfrac{x}{3} = 10$
      antwoord: |-
        $12$
      uitwerking: |-
        Maal 6: $3x+2x=60$, $x=12$.
    - opgave: |-
        $\dfrac{x - 1}{4} = \dfrac{x + 2}{6}$
      antwoord: |-
        $7$
      uitwerking: |-
        Maal 12: $3(x-1)=2(x+2)$, $3x-3=2x+4$, $x=7$.
    - opgave: |-
        $x - \dfrac{x + 3}{4} = 6$
      antwoord: |-
        $9$
      uitwerking: |-
        Maal 4: $4x-(x+3)=24$, $3x-3=24$, $x=9$.
    - opgave: |-
        $\dfrac{2x + 1}{3} - \dfrac{x - 2}{2} = 1$
      antwoord: |-
        $-2$
      uitwerking: |-
        Maal 6: $2(2x+1)-3(x-2)=6$, $4x+2-3x+6=6$, $x=-2$.
    - opgave: |-
        $\dfrac{3x}{5} - 1 = \dfrac{x}{2}$
      antwoord: |-
        $10$
      uitwerking: |-
        Maal 10: $6x-10=5x$, $x=10$.
    - opgave: |-
        $0{,}2x + 1{,}5 = 0{,}5x - 0{,}3$
      antwoord: |-
        $6$
      uitwerking: |-
        Maal 10: $2x+15=5x-3$, $18=3x$, $x=6$.

- id: h1-aantal
  soort: kort
  opgave: |-
    Los op en geef $V$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3(x + 2) = 3x + 6$
      antwoord: |-
        $V=\R$
      uitwerking: |-
        $3x+6=3x+6$, dus $0x=0$: identiek.
    - opgave: |-
        $2(x - 1) = 2x + 1$
      antwoord: |-
        $V=\emptyset$
      uitwerking: |-
        $2x-2=2x+1$, dus $0x=3$: strijdig.
    - opgave: |-
        $5x - 2 = 3x - 2$
      antwoord: |-
        $V=\{0\}$
      uitwerking: |-
        $2x=0$, dus $x=0$.
    - opgave: |-
        $4 - (x - 3) = 7 - x$
      antwoord: |-
        $V=\R$
      uitwerking: |-
        $4-x+3=7-x$, dus $0x=0$: identiek.
    - opgave: |-
        $\dfrac{x}{2} + \dfrac{x}{3} = \dfrac{5x}{6} + 1$
      antwoord: |-
        $V=\emptyset$
      uitwerking: |-
        Maal 6: $3x+2x=5x+6$, dus $0x=6$: strijdig.
    - opgave: |-
        $6 - 2x = 2(3 + x)$
      antwoord: |-
        $V=\{0\}$
      uitwerking: |-
        $6-2x=6+2x$, $0=4x$, $x=0$.

- id: h1-parameter
  pakketten: [4, 5]
  soort: kort
  opgave: |-
    Los op naar $x$ en bespreek.
  lijst: enumerate
  delen:
    - opgave: |-
        $(m - 1)\,x = 5$
      antwoord: |-
        $m\neq1$: $x=\tfrac{5}{m-1}$; $m=1$: $V=\emptyset$
      uitwerking: |-
        Voor $m\neq1$ deel je door $m-1$. Voor $m=1$ staat er $0x=5$: strijdig.
    - opgave: |-
        $mx - 8 = 4x + 2m - 16$
      antwoord: |-
        $m\neq4$: $x=2$; $m=4$: $V=\R$
      uitwerking: |-
        $(m-4)x=2m-8=2(m-4)$. Voor $m\neq4$ is $x=2$. Voor $m=4$ staat er $0x=0$: identiek.

- id: h1-vertaal
  soort: kort
  opgave: |-
    Schrijf als uitdrukking met $x$.
  lijst: enumerate
  delen:
    - opgave: |-
        het viervoud van een getal $x$, verminderd met 9
      antwoord: |-
        $4x-9$
      uitwerking: |-
        $4x-9$.
    - opgave: |-
        de helft van de som van een getal $x$ en 3
      antwoord: |-
        $\tfrac{x+3}{2}$
      uitwerking: |-
        Eerst de som $x+3$, dan de helft: $\tfrac{x+3}{2}$.
    - opgave: |-
        drie opeenvolgende gehele getallen, als $x$ het kleinste is
      antwoord: |-
        $x$, $x+1$, $x+2$
      uitwerking: |-
        Telkens één meer: $x$, $x+1$ en $x+2$.
    - opgave: |-
        de prijs na 15\,\% korting op een prijs $x$
      antwoord: |-
        $0{,}85x$
      uitwerking: |-
        $x-0{,}15x=0{,}85x$.
    - opgave: |-
        de leeftijd binnen 5 jaar van iemand die nu $x$ jaar is, en zijn leeftijd 5 jaar geleden
      antwoord: |-
        $x+5$ en $x-5$
      uitwerking: |-
        $x+5$ en $x-5$.

- id: h1-vraagstuk
  soort: kort
  opgave: |-
    Stel een vergelijking op en los ze op.
  lijst: enumerate
  delen:
    - opgave: |-
        Lies is 3 jaar ouder dan haar broer. Samen zijn ze 29 jaar. Hoe oud is elk?
      antwoord: |-
        13 en 16 jaar
      uitwerking: |-
        $x$ = leeftijd van de broer: $x+(x+3)=29$, $2x=26$, $x=13$. De broer is 13, Lies 16.
    - opgave: |-
        Na een prijsstijging van 15\,\% kost een fiets 345 euro. Wat kostte hij ervoor?
      antwoord: |-
        300 euro
      uitwerking: |-
        $x$ = de oude prijs: $1{,}15x=345$, dus $x=300$. Controle: $300+45=345$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijkingen herleiden
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $4x - 9 = 15$
      antwoord: |-
        $6$
      uitwerking: |-
        $4x=24$, $x=6$.
    - opgave: |-
        $12 = 3 - x$
      antwoord: |-
        $-9$
      uitwerking: |-
        $x=3-12=-9$.
    - opgave: |-
        $7x + 2 = 4x - 13$
      antwoord: |-
        $-5$
      uitwerking: |-
        $3x=-15$, $x=-5$.
    - opgave: |-
        $6 - 5x = 2x + 20$
      antwoord: |-
        $-2$
      uitwerking: |-
        $-14=7x$, $x=-2$.
    - opgave: |-
        $-3x + 8 = x$
      antwoord: |-
        $2$
      uitwerking: |-
        $8=4x$, $x=2$.
    - opgave: |-
        $9x - 4 = 3x - 1$
      antwoord: |-
        $\tfrac12$
      uitwerking: |-
        $6x=3$, $x=\tfrac12$.
    - opgave: |-
        $2{,}5x = 15$
      antwoord: |-
        $6$
      uitwerking: |-
        $x=\tfrac{15}{2{,}5}=6$.
    - opgave: |-
        $11 - 2x = 3 - 6x$
      antwoord: |-
        $-2$
      uitwerking: |-
        $4x=-8$, $x=-2$.
    - opgave: |-
        $5x - 7 = 8x + 2$
      antwoord: |-
        $-3$
      uitwerking: |-
        $-9=3x$, $x=-3$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    balans, vergelijking opstellen
  opgave: |-
    Elke balans is in evenwicht. Een blokje weegt 1~kg, alle zakjes wegen evenveel. Schrijf bij elke balans een vergelijking en bereken het gewicht van een zakje.

    \figuren{\textbf{a}\ \begin{tikzpicture}[scale=.34]
      \balans{2}{1}{0}{9}
    \end{tikzpicture}\qquad
    \textbf{b}\ \begin{tikzpicture}[scale=.34]
      \balans{3}{1}{2}{3}
    \end{tikzpicture}\qquad
    \textbf{c}\ \begin{tikzpicture}[scale=.34]
      \balans{1}{8}{3}{2}
    \end{tikzpicture}}
  antwoord: |-
    \textbf{a.}~$2x+1=9$, 4~kg \quad \textbf{b.}~$3x+1=2x+3$, 2~kg \quad \textbf{c.}~$x+8=3x+2$, 3~kg
  uitwerking: |-
    \textbf{a.}~$2x+1=9$: $2x=8$, $x=4$.\par
    \textbf{b.}~$3x+1=2x+3$: $x=2$.\par
    \textbf{c.}~$x+8=3x+2$: $6=2x$, $x=3$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijkingen met haakjes
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3(x + 4) = 2x + 7$
      antwoord: |-
        $-5$
      uitwerking: |-
        $3x+12=2x+7$, $x=-5$.
    - opgave: |-
        $5(2 - x) = 3(x - 2)$
      antwoord: |-
        $2$
      uitwerking: |-
        $10-5x=3x-6$, $16=8x$, $x=2$.
    - opgave: |-
        $2(3x - 1) - (x + 3) = 0$
      antwoord: |-
        $1$
      uitwerking: |-
        $6x-2-x-3=0$, $5x=5$, $x=1$.
    - opgave: |-
        $4x - (2x - 9) = 3(x + 1)$
      antwoord: |-
        $6$
      uitwerking: |-
        $2x+9=3x+3$, $x=6$.
    - opgave: |-
        $7 - 2(x + 5) = 3x + 2$
      antwoord: |-
        $-1$
      uitwerking: |-
        $7-2x-10=3x+2$, $-3-2x=3x+2$, $-5=5x$, $x=-1$.
    - opgave: |-
        $-(4 - 3x) + 2(x - 1) = 4$
      antwoord: |-
        $2$
      uitwerking: |-
        $-4+3x+2x-2=4$, $5x=10$, $x=2$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    vraagstuk: een getal zoeken
  opgave: |-
    Zoek het getal. Stel telkens een vergelijking op.
  lijst: enumerate
  delen:
    - opgave: |-
        Een getal vermeerderd met 17 is 4.
      antwoord: |-
        $-13$
      uitwerking: |-
        $x+17=4$, $x=-13$.
    - opgave: |-
        Het vijfvoud van een getal is 12 minder dan het dubbel ervan.
      antwoord: |-
        $-4$
      uitwerking: |-
        $5x=2x-12$, $3x=-12$, $x=-4$.
    - opgave: |-
        De helft van een getal, vermeerderd met 6, is 20.
      antwoord: |-
        $28$
      uitwerking: |-
        $\tfrac x2+6=20$, $\tfrac x2=14$, $x=28$.
    - opgave: |-
        Vermenigvuldig je een getal met 3 en trek je er 8 af, dan krijg je hetzelfde als wanneer je er 10 bij optelt.
      antwoord: |-
        $9$
      uitwerking: |-
        $3x-8=x+10$, $2x=18$, $x=9$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijkingen met breuken
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x}{6} - 2 = 1$
      antwoord: |-
        $18$
      uitwerking: |-
        $\tfrac x6=3$, $x=18$.
    - opgave: |-
        $\dfrac{x}{2} + \dfrac{x}{5} = 14$
      antwoord: |-
        $20$
      uitwerking: |-
        Maal 10: $5x+2x=140$, $x=20$.
    - opgave: |-
        $\dfrac{2x}{3} = \dfrac{x}{4} + 5$
      antwoord: |-
        $12$
      uitwerking: |-
        Maal 12: $8x=3x+60$, $5x=60$, $x=12$.
    - opgave: |-
        $\dfrac{x + 2}{3} = \dfrac{x - 1}{2}$
      antwoord: |-
        $7$
      uitwerking: |-
        Maal 6: $2(x+2)=3(x-1)$, $2x+4=3x-3$, $x=7$.
    - opgave: |-
        $\dfrac{x}{4} - \dfrac{x - 3}{6} = 1$
      antwoord: |-
        $6$
      uitwerking: |-
        Maal 12: $3x-2(x-3)=12$, $x+6=12$, $x=6$.
    - opgave: |-
        $\dfrac{3x - 1}{2} - x = \dfrac{x + 1}{4}$
      antwoord: |-
        $3$
      uitwerking: |-
        Maal 4: $2(3x-1)-4x=x+1$, $2x-2=x+1$, $x=3$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    vraagstuk: hoeken van een driehoek
  opgave: |-
    In een driehoek is de tweede hoek $20^\circ$ groter dan de eerste, en de derde hoek is het dubbel van de eerste. Bereken de drie hoeken.
  antwoord: |-
    $40^\circ$, $60^\circ$, $80^\circ$
  uitwerking: |-
    $x$ = de eerste hoek (in graden). De som van de hoeken is $180^\circ$: $x+(x+20)+2x=180$, $4x=160$, $x=40$. De hoeken zijn $40^\circ$, $60^\circ$ en $80^\circ$. Controle: $40+60+80=180$.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijkingen met kommagetallen
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $0{,}3x + 1{,}2 = 2{,}7$
      antwoord: |-
        $5$
      uitwerking: |-
        Maal 10: $3x+12=27$, $x=5$.
    - opgave: |-
        $1{,}5x - 4 = 0{,}7x + 0{,}8$
      antwoord: |-
        $6$
      uitwerking: |-
        $0{,}8x=4{,}8$, $x=6$.
    - opgave: |-
        $0{,}25x = 3 - 0{,}5x$
      antwoord: |-
        $4$
      uitwerking: |-
        $0{,}75x=3$, $x=4$.
    - opgave: |-
        $2{,}4 - 0{,}6x = 0{,}2(x + 4)$
      antwoord: |-
        $2$
      uitwerking: |-
        $2{,}4-0{,}6x=0{,}2x+0{,}8$, $1{,}6=0{,}8x$, $x=2$.

- id: h1-o8
  soort: opdracht
  niveau: 1
  thema: |-
    geen, één of oneindig veel oplossingen
  opgave: |-
    Los op en geef $V$. Is de vergelijking strijdig, identiek, of heeft ze één oplossing?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $6x - 3 = 3(2x - 1)$
      antwoord: |-
        $V=\R$
      uitwerking: |-
        $6x-3=6x-3$: identiek.
    - opgave: |-
        $4(x + 2) = 4x + 2$
      antwoord: |-
        $V=\emptyset$
      uitwerking: |-
        $4x+8=4x+2$, $0x=-6$: strijdig.
    - opgave: |-
        $7x + 5 = 5 + 2x$
      antwoord: |-
        $V=\{0\}$
      uitwerking: |-
        $5x=0$, $x=0$: één oplossing.
    - opgave: |-
        $2(3 - x) = -2x + 3$
      antwoord: |-
        $V=\emptyset$
      uitwerking: |-
        $6-2x=-2x+3$, $0x=-3$: strijdig.
    - opgave: |-
        $x - (2 - x) = 2(x - 1)$
      antwoord: |-
        $V=\R$
      uitwerking: |-
        $2x-2=2x-2$: identiek.
    - opgave: |-
        $\dfrac{x}{3} + 1 = \dfrac{x + 3}{3}$
      antwoord: |-
        $V=\R$
      uitwerking: |-
        Maal 3: $x+3=x+3$: identiek.

- id: h1-o9
  soort: opdracht
  niveau: 1
  thema: |-
    vraagstuk: lidkaart
  opgave: |-
    Een jaarkaart voor het zwembad kost 30 euro. Met de kaart betaal je 2,50 euro per beurt. Sem gaf dit jaar in totaal 85 euro uit aan zwemmen. Hoe vaak ging hij zwemmen?
  antwoord: |-
    22 keer
  uitwerking: |-
    $x$ = het aantal beurten: $30+2{,}5x=85$, $2{,}5x=55$, $x=22$. Controle: $30+55=85$. Sem ging 22 keer zwemmen.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    fouten zoeken
  opgave: |-
    In elke oplossing zit één fout. Zoek de fout en los correct op.
  lijst: enumerate
  delen:
    - opgave: |-
        $3x - 5 = 7 \ \Rightarrow \ 3x = 2 \ \Rightarrow \ x = \tfrac23$
      antwoord: |-
        $x=4$
      uitwerking: |-
        $-5$ gaat naar rechts als $+5$: $3x=12$, $x=4$.
    - opgave: |-
        $2(x - 3) = 10 \ \Rightarrow \ 2x - 3 = 10 \ \Rightarrow \ x = \tfrac{13}{2}$
      antwoord: |-
        $x=8$
      uitwerking: |-
        Ook $-3$ moet met 2 vermenigvuldigd worden: $2x-6=10$, $x=8$.
    - opgave: |-
        $-4x = 12 \ \Rightarrow \ x = 3$
      antwoord: |-
        $x=-3$
      uitwerking: |-
        Deel door $-4$, ook het minteken: $x=-3$.
    - opgave: |-
        $\tfrac{x}{2} - \tfrac{x - 1}{3} = 1 \ \Rightarrow \ 3x - 2x - 1 = 6 \ \Rightarrow \ x = 7$
      antwoord: |-
        $x=4$
      uitwerking: |-
        $-2(x-1)=-2x+2$: $3x-2x+2=6$, $x=4$. Controle: $2-1=1$.
    - opgave: |-
        $5 - 3(x + 1) = 8 \ \Rightarrow \ 2(x + 1) = 8 \ \Rightarrow \ x = 3$
      antwoord: |-
        $x=-2$
      uitwerking: |-
        Vermenigvuldigen gaat voor aftrekken: $5-3x-3=8$, $-3x=6$, $x=-2$.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: leeftijden
  opgave: |-
    Jonas is 12 jaar, zijn opa 66.
  lijst: enumerate
  delen:
    - opgave: |-
        Binnen hoeveel jaar is opa drie keer zo oud als Jonas?
      antwoord: |-
        15 jaar
      uitwerking: |-
        $66+x=3(12+x)$, $66+x=36+3x$, $30=2x$, $x=15$. Controle: $81=3\cdot27$.
    - opgave: |-
        Hoeveel jaar geleden was opa zeven keer zo oud als Jonas?
      antwoord: |-
        3 jaar
      uitwerking: |-
        $66-x=7(12-x)$, $66-x=84-7x$, $6x=18$, $x=3$. Controle: $63=7\cdot9$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    gemengde vergelijkingen
  opgave: |-
    Los op en geef $V$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3(2x - 1) - 2(x - 4) = 5(x + 1)$
      antwoord: |-
        $V=\{0\}$
      uitwerking: |-
        $6x-3-2x+8=5x+5$, $4x+5=5x+5$, $x=0$.
    - opgave: |-
        $\dfrac{x - 1}{2} - \dfrac{x + 2}{3} = \dfrac{x}{6}$
      antwoord: |-
        $V=\emptyset$
      uitwerking: |-
        Maal 6: $3(x-1)-2(x+2)=x$, $x-7=x$, $0x=7$: strijdig.
    - opgave: |-
        $\dfrac{2(x + 1)}{3} = x - \dfrac{x - 4}{5}$
      antwoord: |-
        $V=\{-1\}$
      uitwerking: |-
        Maal 15: $10(x+1)=15x-3(x-4)$, $10x+10=12x+12$, $-2=2x$, $x=-1$.
    - opgave: |-
        $\dfrac{3x + 1}{4} - \dfrac{x}{2} = \dfrac{x + 1}{4}$
      antwoord: |-
        $V=\R$
      uitwerking: |-
        Maal 4: $3x+1-2x=x+1$, $x+1=x+1$: identiek.
    - opgave: |-
        $0{,}4(x - 5) = 0{,}1x + 1$
      antwoord: |-
        $V=\{10\}$
      uitwerking: |-
        $0{,}4x-2=0{,}1x+1$, $0{,}3x=3$, $x=10$.
    - opgave: |-
        $2 - \dfrac{x - 3}{4} = \dfrac{x}{2}$
      antwoord: |-
        $V=\bigl\{\tfrac{11}{3}\bigr\}$
      uitwerking: |-
        Maal 4: $8-(x-3)=2x$, $11-x=2x$, $x=\tfrac{11}{3}$.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: opeenvolgende getallen
  opgave: |-
    Stel een vergelijking op en los ze op.
  lijst: enumerate
  delen:
    - opgave: |-
        De som van drie opeenvolgende gehele getallen is 162. Welke getallen zijn het?
      antwoord: |-
        53, 54, 55
      uitwerking: |-
        $x+(x+1)+(x+2)=162$, $3x+3=162$, $x=53$.
    - opgave: |-
        De som van vier opeenvolgende oneven getallen is 136. Welke getallen zijn het?
      antwoord: |-
        31, 33, 35, 37
      uitwerking: |-
        Opeenvolgende oneven getallen verschillen 2: $x+(x+2)+(x+4)+(x+6)=136$, $4x+12=136$, $x=31$.
    - opgave: |-
        Kan de som van drie opeenvolgende gehele getallen 100 zijn? Leg uit.
      antwoord: |-
        neen
      uitwerking: |-
        $3x+3=100$ geeft $x=\tfrac{97}{3}$, geen geheel getal. Neen: de som $3x+3=3(x+1)$ is altijd een drievoud, en 100 is geen drievoud.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: procenten
  opgave: |-
    Stel een vergelijking op en los ze op.
  lijst: enumerate
  delen:
    - opgave: |-
        Een smartphone kost na een korting van 15\,\% nog 221 euro. Wat was de prijs voor de korting?
      antwoord: |-
        260 euro
      uitwerking: |-
        $0{,}85x=221$, $x=260$. Controle: 15\,\% van 260 is 39, en $260-39=221$.
    - opgave: |-
        Een winkel verhoogt de prijs van een spelconsole met 10\,\%, en geeft een maand later 10\,\% korting op die nieuwe prijs. De console kost nu 396 euro. Wat was de prijs in het begin?
      antwoord: |-
        400 euro
      uitwerking: |-
        Na de verhoging kost hij $1{,}1x$, na de korting $0{,}9\cdot1{,}1x=0{,}99x$. Dus $0{,}99x=396$ en $x=400$. De prijs is dus niet terug bij het begin.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: twee soorten
  opgave: |-
    Een bakker verkocht vandaag 70 broden: witte broden van 2,40 euro en grijze broden van 2,90 euro. Ze ontving in totaal 185 euro. Hoeveel witte broden verkocht ze?
  antwoord: |-
    36
  uitwerking: |-
    $x$ = het aantal witte broden, dan zijn er $70-x$ grijze. $2{,}4x+2{,}9(70-x)=185$, $2{,}4x+203-2{,}9x=185$, $-0{,}5x=-18$, $x=36$. Controle: $36\cdot2{,}40+34\cdot2{,}90=86{,}40+98{,}60=185$.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: meetkunde
  opgave: |-
    Bereken $x$. De maten zijn in cm.

    \figuren{\textbf{a}\ \begin{tikzpicture}[scale=.17,font=\scriptsize,baseline=0]
      \draw[accent,thick,fill=accent!10] (0,0) rectangle (13,10);
      \node[below] at (6.5,0) {$2x - 1$};
      \node[left] at (0,5) {$x + 3$};
      \node[font=\tiny] at (6.5,5) {omtrek 46};
    \end{tikzpicture}\qquad
    \textbf{b}\ \begin{tikzpicture}[scale=.42,font=\scriptsize,baseline=0]
      \draw[accent,thick,fill=accent!10] (0,0) -- (4,0) -- (2,5.49) -- cycle;
      \node at (2,4.3) {$x$};
      \node[below left] at (.3,0) {$2x - 10$};
      \node[below right] at (3.7,0) {$2x - 10$};
    \end{tikzpicture}\qquad
    \textbf{c}\ \begin{tikzpicture}[scale=.28,font=\scriptsize,baseline=0]
      \draw[accent,thick,fill=accent!10] (0,0) rectangle (4,4);
      \node[below] at (2,0) {$x + 2$};
      \draw[accent,thick,fill=accent!10] (5.5,0) rectangle (11.5,2);
      \node[below] at (8.5,0) {$3x$};
      \node[right] at (11.5,1) {$x$};
    \end{tikzpicture}}
    In \textbf{b} is de driehoek gelijkbenig, met de hoeken in graden. In \textbf{c} hebben het vierkant en de rechthoek dezelfde omtrek.
  antwoord: |-
    \textbf{a.}~$7$ \quad \textbf{b.}~$40$ \quad \textbf{c.}~$2$
  uitwerking: |-
    \textbf{a.}~$2\bigl((2x-1)+(x+3)\bigr)=46$, $2(3x+2)=46$, $3x+2=23$, $x=7$. De rechthoek is 13 bij 10.\par
    \textbf{b.}~De hoekensom: $x+2(2x-10)=180$, $5x-20=180$, $x=40$. De basishoeken zijn $70^\circ$.\par
    \textbf{c.}~$4(x+2)=2(3x+x)$, $4x+8=8x$, $x=2$. Het vierkant heeft zijde 4, de rechthoek is 6 bij 2: beide omtrek 16.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: verdelen
  opgave: |-
    Drie vrienden verdelen de 240 euro die ze met een quiz wonnen. Bram krijgt 30 euro meer dan Ines, en Wout krijgt half zoveel als Bram. Hoeveel krijgt elk?
  antwoord: |-
    Ines 78, Bram 108, Wout 54 euro
  uitwerking: |-
    $x$ = het bedrag van Ines. Bram krijgt $x+30$, Wout $\tfrac{x+30}{2}$. $x+(x+30)+\tfrac{x+30}{2}=240$. Maal 2: $2x+2x+60+x+30=480$, $5x=390$, $x=78$. Controle: $78+108+54=240$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: gemiddelde
  opgave: |-
    Sara heeft na vijf toetsen een gemiddelde van 13,2 op 20.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel moet ze op de zesde toets halen om op een gemiddelde van 14 te komen?
      antwoord: |-
        18
      uitwerking: |-
        Samen had ze $5\cdot13{,}2=66$ punten. $\tfrac{66+x}{6}=14$, $66+x=84$, $x=18$.
    - opgave: |-
        Kan ze met de zesde toets nog op een gemiddelde van 15 komen? Leg uit.
      antwoord: |-
        neen
      uitwerking: |-
        $\tfrac{66+x}{6}=15$ geeft $x=24$, meer dan 20. Dat kan niet.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: kan het antwoord?
  opgave: |-
    Een theater verkoopt tickets voor volwassenen aan 12 euro en voor kinderen aan 7 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor een voorstelling verkocht het 40 tickets, voor 400 euro. Hoeveel kinderen waren er?
      antwoord: |-
        16
      uitwerking: |-
        $x$ = het aantal volwassenen: $12x+7(40-x)=400$, $5x+280=400$, $x=24$. Er waren $40-24=16$ kinderen. Controle: $288+112=400$.
    - opgave: |-
        Kan het theater voor 40 tickets in totaal 302 euro ontvangen?
      antwoord: |-
        neen
      uitwerking: |-
        $5x+280=302$ geeft $x=4{,}4$: geen geheel aantal, dus neen.
    - opgave: |-
        En 500 euro?
      antwoord: |-
        neen
      uitwerking: |-
        $5x+280=500$ geeft $x=44$: meer volwassenen dan tickets, dan zou het aantal kinderen $-4$ zijn. Neen.

- id: h1-o20
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: beweging
  opgave: |-
    Om 9 uur vertrekken twee fietsers in twee dorpen die 63~km van elkaar liggen. Ze rijden naar elkaar toe, de ene met 24~km/h, de andere met 18~km/h.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe laat ontmoeten ze elkaar?
      antwoord: |-
        om 10.30 uur
      uitwerking: |-
        $x$ = de tijd in uur. Samen leggen ze $24x+18x=63$ km af, dus $42x=63$ en $x=1{,}5$. Ze ontmoeten elkaar om 10.30 uur.
    - opgave: |-
        Hoe ver van het dorp van de snelste fietser is dat?
      antwoord: |-
        36~km
      uitwerking: |-
        $24\cdot1{,}5=36$~km. Controle: de andere reed $18\cdot1{,}5=27$~km, en $36+27=63$.

- id: h1-o21
  pakketten: [4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijkingen met een parameter
  opgave: |-
    Los op naar $x$ en bespreek.
  lijst: enumerate
  delen:
    - opgave: |-
        $(m + 2)\,x = m + 2$
      antwoord: |-
        $m\neq-2$: $V=\{1\}$; $m=-2$: $V=\R$
      uitwerking: |-
        Voor $m\neq-2$ deel je door $m+2$: $x=1$. Voor $m=-2$ staat er $0x=0$: identiek.
    - opgave: |-
        $mx - 1 = 3x + 5$
      antwoord: |-
        $m\neq3$: $x=\tfrac{6}{m-3}$; $m=3$: $V=\emptyset$
      uitwerking: |-
        $(m-3)x=6$. Voor $m\neq3$ is $x=\tfrac{6}{m-3}$. Voor $m=3$ staat er $0x=6$: strijdig.
    - opgave: |-
        $m(x - 1) = 4x - 4$
      antwoord: |-
        $m\neq4$: $V=\{1\}$; $m=4$: $V=\R$
      uitwerking: |-
        $mx-m=4x-4$, $(m-4)x=m-4$. Voor $m\neq4$ is $x=1$. Voor $m=4$ staat er $0x=0$: identiek.
    - opgave: |-
        Voor welke waarde van $m$ is 2 een oplossing van $mx + 4 = 3x + m$?
      antwoord: |-
        $m=2$
      uitwerking: |-
        Vul $x=2$ in: $2m+4=6+m$, dus $m=2$. Controle: $2x+4=3x+2$ heeft oplossing $x=2$.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    zelf een vergelijking bedenken
  opgave: |-
    Bedenk een vergelijking met haakjes, waarin $x$ in beide leden staat, en
  lijst: enumerate
  delen:
    - opgave: |-
        die als enige oplossing $-2$ heeft;
      antwoord: |-
        bv. $3(x+4)=x+8$
      uitwerking: |-
        Bijvoorbeeld $3(x+4)=x+8$: $3x+12=x+8$, $2x=-4$, $x=-2$. Er zijn veel goede antwoorden: controleer door $-2$ in te vullen.
    - opgave: |-
        die geen oplossing heeft;
      antwoord: |-
        bv. $2(x+1)=2x+5$
      uitwerking: |-
        Bijvoorbeeld $2(x+1)=2x+5$: na herleiden $0x=3$. De coëfficiënten van $x$ moeten in beide leden gelijk zijn, de getallen niet.
    - opgave: |-
        waarvoor elk getal een oplossing is.
      antwoord: |-
        bv. $2(x+1)=x+(x+2)$
      uitwerking: |-
        Bijvoorbeeld $2(x+1)=x+(x+2)$: beide leden zijn $2x+2$. Beide leden moeten na uitwerken dezelfde uitdrukking zijn.

- id: h1-o23
  soort: opdracht
  niveau: 3
  thema: |-
    vraagstuk: delen van een geheel
  opgave: |-
    Lena leest een boek. De eerste dag leest ze een vierde van het boek, de tweede dag een derde van wat er dan nog overblijft. De derde dag leest ze de laatste 120 bladzijden. Hoeveel bladzijden heeft het boek?
  antwoord: |-
    240
  uitwerking: |-
    $x$ = het aantal bladzijden. Na dag 1 blijft $\tfrac34x$ over. Dag 2 leest ze $\tfrac13\cdot\tfrac34x=\tfrac14x$, en er blijft $\tfrac34x-\tfrac14x=\tfrac12x$ over. Dus $\tfrac12x=120$ en $x=240$. Controle: $60$, dan $\tfrac13\cdot180=60$, dan $120$: samen 240.

- id: h1-o24
  soort: opdracht
  niveau: 3
  thema: |-
    vraagstuk: samen werken
  opgave: |-
    Een bad loopt vol in 12 minuten met alleen de warme kraan, en in 6 minuten met alleen de koude kraan. Hoe lang duurt het met beide kranen samen? Tip: welk deel van het bad vult elke kraan in één minuut?
  antwoord: |-
    4 minuten
  uitwerking: |-
    In één minuut vult de warme kraan $\tfrac{1}{12}$ van het bad, de koude $\tfrac16$. Na $x$ minuten is het bad vol: $\tfrac{x}{12}+\tfrac{x}{6}=1$. Maal 12: $x+2x=12$, $x=4$. Niet $\tfrac{12+6}{2}=9$: samen gaat het sneller dan de snelste kraan alleen.

- id: h1-o25
  soort: opdracht
  niveau: 3
  thema: |-
    vraagstuk: inhalen
  opgave: |-
    Om 8.00 uur vertrekt een vrachtwagen met een snelheid van 80~km/h. Om 8.30 uur vertrekt een auto op dezelfde plaats, in dezelfde richting, met 120~km/h. Hoe laat haalt de auto de vrachtwagen in, en hoe ver van het vertrekpunt?
  antwoord: |-
    om 9.30 uur, op 120~km
  uitwerking: |-
    $x$ = de rijtijd van de vrachtwagen in uur; de auto rijdt $x-0{,}5$ uur. Bij het inhalen hebben ze dezelfde afstand afgelegd: $80x=120(x-0{,}5)$, $80x=120x-60$, $40x=60$, $x=1{,}5$. Om 9.30 uur, op $80\cdot1{,}5=120$~km. Controle: de auto reed 1 uur aan 120~km/h.

- id: h1-o26
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    redeneren over het aantal oplossingen
  opgave: |-
    Neem de vergelijking $ax + b = cx + d$, met $a$, $b$, $c$ en $d$ vaste getallen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat ze precies één oplossing heeft als $a \neq c$, en geef die oplossing.
      antwoord: |-
        $x=\tfrac{d-b}{a-c}$
      uitwerking: |-
        $ax-cx=d-b$, dus $(a-c)x=d-b$. Is $a\neq c$, dan is $a-c\neq0$ en mag je delen: $x=\tfrac{d-b}{a-c}$, precies één oplossing.
    - opgave: |-
        Wat als $a = c$? Onderscheid twee gevallen.
      antwoord: |-
        $b=d$: identiek; $b\neq d$: strijdig
      uitwerking: |-
        Dan staat er $0x=d-b$. Is $b=d$, dan is dat $0x=0$: identiek, $V=\R$. Is $b\neq d$, dan is het strijdig, $V=\emptyset$. In woorden: met evenveel $x$ in beide leden hangt alles af van de getallen.

# --- Test jezelf ------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Los op: $7x - 3 = 4x + 9$.
  antwoord: |-
    $x=4$
  uitwerking: |-
    $3x=12$, $x=4$. Controle: $28-3=25$ en $16+9=25$.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Los op: $2(3x - 1) - (x + 4) = 3x - 2$.
  antwoord: |-
    $x=2$
  uitwerking: |-
    $6x-2-x-4=3x-2$, $5x-6=3x-2$, $2x=4$, $x=2$.

- id: h1-t3
  soort: test
  niveau: 2
  opgave: |-
    Los op: $\dfrac{x + 1}{3} - \dfrac{x - 2}{4} = 2$.
  antwoord: |-
    $x=14$
  uitwerking: |-
    Maal 12: $4(x+1)-3(x-2)=24$, $4x+4-3x+6=24$, $x+10=24$, $x=14$. Controle: $5-3=2$.

- id: h1-t4
  soort: test
  niveau: 1
  opgave: |-
    Los op en geef $V$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3(x - 2) = 3x - 2$
      antwoord: |-
        $V=\emptyset$
      uitwerking: |-
        $3x-6=3x-2$, $0x=4$: strijdig.
    - opgave: |-
        $5 - (x - 1) = 6 - x$
      antwoord: |-
        $V=\R$
      uitwerking: |-
        $6-x=6-x$: identiek.

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    Het drievoud van een getal, vermeerderd met 4, is gelijk aan de helft van het getal, verminderd met 1. Welk getal is dat?
  antwoord: |-
    $-2$
  uitwerking: |-
    $3x+4=\tfrac x2-1$. Maal 2: $6x+8=x-2$, $5x=-10$, $x=-2$. Controle: $-6+4=-2$ en $-1-1=-2$.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Na een prijsverhoging van 8\,\% kost een concertticket 54 euro. Wat kostte het ervoor?
  antwoord: |-
    50 euro
  uitwerking: |-
    $1{,}08x=54$, $x=50$. Controle: 8\,\% van 50 is 4.

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Een rechthoek is 5~cm langer dan breed. De omtrek is 38~cm. Bereken de lengte en de breedte.
  antwoord: |-
    12~cm en 7~cm
  uitwerking: |-
    $x$ = de breedte: $2\bigl(x+(x+5)\bigr)=38$, $4x+10=38$, $x=7$. De lengte is 12~cm. Controle: $2\cdot19=38$.

- id: h1-t8
  pakketten: [4, 5]
  soort: test
  niveau: 2
  opgave: |-
    Los op naar $x$ en bespreek: $(m - 3)\,x = 2m - 6$.
  antwoord: |-
    $m\neq3$: $V=\{2\}$; $m=3$: $V=\R$
  uitwerking: |-
    $2m-6=2(m-3)$. Voor $m\neq3$ deel je door $m-3$: $x=2$. Voor $m=3$ staat er $0x=0$: identiek.
