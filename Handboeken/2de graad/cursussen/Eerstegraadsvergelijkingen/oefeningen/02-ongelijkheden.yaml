# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Vul in met $<$ of $>$, of los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $-3 \ \ldots \ {-5}$
      antwoord: |-
        $>$
      uitwerking: |-
        $-3$ ligt rechts van $-5$ op de getallenas.
    - opgave: |-
        $0{,}7 \ \ldots \ \tfrac23$
      antwoord: |-
        $>$
      uitwerking: |-
        $\tfrac23=0{,}666\ldots<0{,}7$.
    - opgave: |-
        $-\tfrac12 \ \ldots \ {-\tfrac13}$
      antwoord: |-
        $<$
      uitwerking: |-
        $-0{,}5$ ligt links van $-0{,}333\ldots$
    - opgave: |-
        $2{,}05 \ \ldots \ 2{,}5$
      antwoord: |-
        $<$
      uitwerking: |-
        $2{,}05<2{,}50$.
    - opgave: |-
        $4x + 3 = 15$
      antwoord: |-
        $x=3$
      uitwerking: |-
        $4x=12$, $x=3$.
    - opgave: |-
        $5 - 2x = 11$
      antwoord: |-
        $x=-3$
      uitwerking: |-
        $-2x=6$, $x=-3$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem de ongelijkheid $2x + 1 < 7$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke getallen uit $\{-2, 0, 1, 2, 3, 4, 5\}$ maken de ongelijkheid waar?
      antwoord: |-
        $-2$, $0$, $1$, $2$
      uitwerking: |-
        Het linkerlid is $-3$, $1$, $3$, $5$, $7$, $9$, $11$. Alleen de eerste vier zijn kleiner dan 7.
    - opgave: |-
        Is $2{,}9$ ook een oplossing? En $-100$? Beschrijf alle oplossingen in woorden.
      antwoord: |-
        ja, ja; alle getallen kleiner dan 3
      uitwerking: |-
        $2\cdot2{,}9+1=6{,}8<7$ en $-199<7$. De oplossingen zijn alle getallen kleiner dan 3.
    - opgave: |-
        Vermenigvuldig beide leden van de ware uitspraak $2 < 5$ met 3. Klopt het teken $<$ nog?
      antwoord: |-
        ja: $6<15$
      uitwerking: |-
        $6<15$ klopt.
    - opgave: |-
        Vermenigvuldig beide leden van $2 < 5$ nu met $-1$, en daarna met $-3$. Klopt het teken $<$ nog? Wat valt je op?
      antwoord: |-
        neen: $-2>-5$ en $-6>-15$
      uitwerking: |-
        $-2<-5$ klopt niet, want $-2$ ligt rechts van $-5$. Ook $-6<-15$ klopt niet. Met een negatief getal keert het teken om.

- id: h2-controle
  soort: kort
  opgave: |-
    Is het getal een oplossing van de ongelijkheid?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $5$ \ voor \ $3x - 4 > 10$
      antwoord: |-
        ja
      uitwerking: |-
        $11>10$: ja.
    - opgave: |-
        $-2$ \ voor \ $1 - x \leqslant 3$
      antwoord: |-
        ja
      uitwerking: |-
        $3\leqslant3$: ja.
    - opgave: |-
        $-2$ \ voor \ $1 - x < 3$
      antwoord: |-
        neen
      uitwerking: |-
        $3<3$ klopt niet.
    - opgave: |-
        $0$ \ voor \ $2x + 5 \geqslant 4x + 6$
      antwoord: |-
        neen
      uitwerking: |-
        $5\geqslant6$ klopt niet.

- id: h2-interval
  soort: kort
  opgave: |-
    Schrijf als interval en teken op een getallenas.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x > 2$
      antwoord: |-
        $\ivoo{2}{\pinf}$
      uitwerking: |-
        $\ivoo{2}{\pinf}$: bij 2 een haak die wegkijkt.
    - opgave: |-
        $-1 \leqslant x < 4$
      antwoord: |-
        $\ivgo{-1}{4}$
      uitwerking: |-
        $\ivgo{-1}{4}$: $-1$ hoort erbij, 4 niet.
    - opgave: |-
        $x \leqslant 0$
      antwoord: |-
        $\ivog{\minf}{0}$
      uitwerking: |-
        $\ivog{\minf}{0}$.
    - opgave: |-
        $\tfrac12 < x \leqslant 3$
      antwoord: |-
        $\ivog{\tfrac12}{3}$
      uitwerking: |-
        $\ivog{\tfrac12}{3}$.
    - opgave: |-
        $x < -2{,}5$
      antwoord: |-
        $\ivoo{\minf}{-2{,}5}$
      uitwerking: |-
        $\ivoo{\minf}{-2{,}5}$.
    - opgave: |-
        $-3 \leqslant x \leqslant 3$
      antwoord: |-
        $\ivgg{-3}{3}$
      uitwerking: |-
        $\ivgg{-3}{3}$: een gesloten interval.

- id: h2-aflezen
  soort: kort
  opgave: |-
    Welk interval is getekend? Schrijf het ook met een ongelijkheid.
  lijst: enumerate
  delen:
    - opgave: |-
        \raisebox{-3.5mm}{\begin{tikzpicture}[x=.45cm,y=.45cm,baseline=-1mm]
          \getallenas{-4}{4}{-4,-3,-2,-1,0,1,2,3,4}
          \ivdeel{-2}{3}\haakl{-2}\haakr{3}
        \end{tikzpicture}}
      antwoord: |-
        $\ivgg{-2}{3}$, $-2\leqslant x\leqslant3$
      uitwerking: |-
        Beide haken kijken naar het interval: $\ivgg{-2}{3}$, of $-2\leqslant x\leqslant3$.
    - opgave: |-
        \raisebox{-3.5mm}{\begin{tikzpicture}[x=.45cm,y=.45cm,baseline=-1mm]
          \getallenas{-4}{4}{-4,-3,-2,-1,0,1,2,3,4}
          \ivdeel{-4.4}{-1}\haakl{-1}
        \end{tikzpicture}}
      antwoord: |-
        $\ivoo{\minf}{-1}$, $x<-1$
      uitwerking: |-
        De haak bij $-1$ kijkt weg: $\ivoo{\minf}{-1}$, of $x<-1$.
    - opgave: |-
        \raisebox{-3.5mm}{\begin{tikzpicture}[x=.45cm,y=.45cm,baseline=-1mm]
          \getallenas{-4}{4}{-4,-3,-2,-1,0,1,2,3,4}
          \ivdeel{0}{4.4}\haakl{0}
        \end{tikzpicture}}
      antwoord: |-
        $\ivgo{0}{\pinf}$, $x\geqslant0$
      uitwerking: |-
        $\ivgo{0}{\pinf}$, of $x\geqslant0$.

- id: h2-positief
  soort: kort
  opgave: |-
    Los op. Schrijf $V$ als interval.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x + 7 \leqslant 3$
      antwoord: |-
        $\ivog{\minf}{-4}$
      uitwerking: |-
        $x\leqslant-4$.
    - opgave: |-
        $5x > 15$
      antwoord: |-
        $\ivoo{3}{\pinf}$
      uitwerking: |-
        Deel door 5: $x>3$.
    - opgave: |-
        $4x - 1 < 2x + 7$
      antwoord: |-
        $\ivoo{\minf}{4}$
      uitwerking: |-
        $2x<8$, $x<4$.
    - opgave: |-
        $\tfrac{x}{2} \geqslant -3$
      antwoord: |-
        $\ivgo{-6}{\pinf}$
      uitwerking: |-
        Maal 2: $x\geqslant-6$.
    - opgave: |-
        $6x + 2 \leqslant 2x$
      antwoord: |-
        $\ivog{\minf}{-\tfrac12}$
      uitwerking: |-
        $4x\leqslant-2$, $x\leqslant-\tfrac12$.
    - opgave: |-
        $3x - 2 > x + 5$
      antwoord: |-
        $\ivoo{\tfrac72}{\pinf}$
      uitwerking: |-
        $2x>7$, $x>\tfrac72$.

- id: h2-negatief
  soort: kort
  opgave: |-
    Los op. Schrijf $V$ als interval.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $-3x < 12$
      antwoord: |-
        $\ivoo{-4}{\pinf}$
      uitwerking: |-
        Deel door $-3$, het teken keert om: $x>-4$.
    - opgave: |-
        $-x \geqslant 2$
      antwoord: |-
        $\ivog{\minf}{-2}$
      uitwerking: |-
        $x\leqslant-2$.
    - opgave: |-
        $7 - 2x > 1$
      antwoord: |-
        $\ivoo{\minf}{3}$
      uitwerking: |-
        $-2x>-6$, $x<3$.
    - opgave: |-
        $-\tfrac{x}{4} \leqslant 1$
      antwoord: |-
        $\ivgo{-4}{\pinf}$
      uitwerking: |-
        Maal $-4$: $x\geqslant-4$.
    - opgave: |-
        $x + 3 < 4x - 9$
      antwoord: |-
        $\ivoo{4}{\pinf}$
      uitwerking: |-
        $-3x<-12$, $x>4$. Of: $12<3x$, $x>4$.
    - opgave: |-
        $2 - 5x \geqslant 3x + 10$
      antwoord: |-
        $\ivog{\minf}{-1}$
      uitwerking: |-
        $-8x\geqslant8$, $x\leqslant-1$.

- id: h2-herleid
  soort: kort
  opgave: |-
    Los op. Schrijf $V$ als interval.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3(x - 1) \geqslant 5x + 1$
      antwoord: |-
        $\ivog{\minf}{-2}$
      uitwerking: |-
        $3x-3\geqslant5x+1$, $-2x\geqslant4$, $x\leqslant-2$.
    - opgave: |-
        $\dfrac{x}{3} - \dfrac{x}{4} < 1$
      antwoord: |-
        $\ivoo{\minf}{12}$
      uitwerking: |-
        Maal 12: $4x-3x<12$, $x<12$.
    - opgave: |-
        $\dfrac{2x + 1}{5} > \dfrac{x - 1}{2}$
      antwoord: |-
        $\ivoo{\minf}{7}$
      uitwerking: |-
        Maal 10: $2(2x+1)>5(x-1)$, $4x+2>5x-5$, $-x>-7$, $x<7$.
    - opgave: |-
        $4 - (x + 2) \leqslant 2(1 - x)$
      antwoord: |-
        $\ivog{\minf}{0}$
      uitwerking: |-
        $2-x\leqslant2-2x$, $x\leqslant0$.
    - opgave: |-
        $5x - 1 \leqslant 5(x + 1)$
      antwoord: |-
        $V=\R$
      uitwerking: |-
        $5x-1\leqslant5x+5$, $0x\leqslant6$: klopt altijd.
    - opgave: |-
        $1 - \dfrac{x - 3}{2} \geqslant x$
      antwoord: |-
        $\ivog{\minf}{\tfrac53}$
      uitwerking: |-
        Maal 2: $2-(x-3)\geqslant2x$, $5-x\geqslant2x$, $5\geqslant3x$, $x\leqslant\tfrac53$.

- id: h2-dubbel
  pakketten: [4, 5]
  soort: kort
  opgave: |-
    Los op. Schrijf $V$ als interval.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2 < x + 5 \leqslant 9$
      antwoord: |-
        $\ivog{-3}{4}$
      uitwerking: |-
        Trek 5 af: $-3<x\leqslant4$.
    - opgave: |-
        $-6 \leqslant 3x < 9$
      antwoord: |-
        $\ivgo{-2}{3}$
      uitwerking: |-
        Deel door 3: $-2\leqslant x<3$.
    - opgave: |-
        $-1 < 4x + 3 < 11$
      antwoord: |-
        $\ivoo{-1}{2}$
      uitwerking: |-
        $-4<4x<8$, $-1<x<2$.
    - opgave: |-
        $0 \leqslant 6 - 2x \leqslant 10$
      antwoord: |-
        $\ivgg{-2}{3}$
      uitwerking: |-
        $-6\leqslant-2x\leqslant4$, $3\geqslant x\geqslant-2$, dus $-2\leqslant x\leqslant3$.

- id: h2-stelsel
  pakketten: [5]
  soort: kort
  opgave: |-
    Los het stelsel op. Schrijf $V$ als interval.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x - 2 < 3$ en $2x \geqslant -4$
      antwoord: |-
        $\ivgo{-2}{5}$
      uitwerking: |-
        $x<5$ en $x\geqslant-2$: samen $-2\leqslant x<5$.
    - opgave: |-
        $3x + 1 > 7$ en $x + 4 > 9$
      antwoord: |-
        $\ivoo{5}{\pinf}$
      uitwerking: |-
        $x>2$ en $x>5$. Een getal groter dan 5 is ook groter dan 2: $V=\ivoo{5}{\pinf}$.

- id: h2-parameter
  pakketten: [4, 5]
  soort: kort
  opgave: |-
    Los op naar $x$ en bespreek. Schrijf $V$ als interval.
  lijst: enumerate
  delen:
    - opgave: |-
        $2x + a > 4a$
      antwoord: |-
        $V=\ivoo{\tfrac{3a}{2}}{\pinf}$
      uitwerking: |-
        $2x>3a$, en delen door 2 houdt het teken: $x>\tfrac{3a}{2}$. De parameter staat alleen in de grens, dus er is niets te bespreken.
    - opgave: |-
        $ax \geqslant 5$
      antwoord: |-
        $a>0$: $V=\ivgo{\tfrac5a}{\pinf}$; $a<0$: $V=\ivog{\minf}{\tfrac5a}$; $a=0$: $V=\emptyset$
      uitwerking: |-
        Voor $a>0$ blijft het teken: $x\geqslant\tfrac5a$. Voor $a<0$ keert het om: $x\leqslant\tfrac5a$. Voor $a=0$ staat er $0\geqslant5$: dat klopt nooit.
    - opgave: |-
        $ax - 2 \leqslant x + 2a - 4$
      antwoord: |-
        $a>1$: $V=\ivog{\minf}{2}$; $a<1$: $V=\ivgo{2}{\pinf}$; $a=1$: $V=\R$
      uitwerking: |-
        $(a-1)x\leqslant2a-2=2(a-1)$. Voor $a>1$: $x\leqslant2$. Voor $a<1$ keert het teken om: $x\geqslant2$. Voor $a=1$ staat er $0\leqslant0$: dat klopt altijd.

- id: h2-vraagstuk
  soort: kort
  opgave: |-
    Stel een ongelijkheid op, los ze op en antwoord met een zin.
  lijst: enumerate
  delen:
    - opgave: |-
        Een busje heeft 8 plaatsen. Hoeveel busjes moet een club minstens huren om 50 spelers te vervoeren?
      antwoord: |-
        7 busjes
      uitwerking: |-
        $8x\geqslant50$, $x\geqslant6{,}25$. Naar boven afronden: minstens 7 busjes.
    - opgave: |-
        Een fles bevat 1,5 liter. Je schenkt glazen van 0,2 liter uit. Hoeveel volle glazen kun je hoogstens schenken?
      antwoord: |-
        7 glazen
      uitwerking: |-
        $0{,}2x\leqslant1{,}5$, $x\leqslant7{,}5$. Naar beneden afronden: hoogstens 7 volle glazen.

# --- Opdrachten -------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    intervallen noteren en tekenen
  opgave: |-
    Schrijf als interval en teken op een getallenas.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x < 5$
      antwoord: |-
        $\ivoo{\minf}{5}$
      uitwerking: |-
        $\ivoo{\minf}{5}$.
    - opgave: |-
        $x \geqslant -2$
      antwoord: |-
        $\ivgo{-2}{\pinf}$
      uitwerking: |-
        $\ivgo{-2}{\pinf}$.
    - opgave: |-
        $0 < x \leqslant 3$
      antwoord: |-
        $\ivog{0}{3}$
      uitwerking: |-
        $\ivog{0}{3}$.
    - opgave: |-
        $-4 \leqslant x \leqslant -1$
      antwoord: |-
        $\ivgg{-4}{-1}$
      uitwerking: |-
        $\ivgg{-4}{-1}$.
    - opgave: |-
        $x > 1{,}5$
      antwoord: |-
        $\ivoo{1{,}5}{\pinf}$
      uitwerking: |-
        $\ivoo{1{,}5}{\pinf}$.
    - opgave: |-
        $-\tfrac12 < x < 2$
      antwoord: |-
        $\ivoo{-\tfrac12}{2}$
      uitwerking: |-
        $\ivoo{-\tfrac12}{2}$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    intervallen aflezen
  opgave: |-
    Schrijf het getekende interval in de intervalnotatie en met een ongelijkheid.
  lijst: enumerate
  delen:
    - opgave: |-
        \raisebox{-3.5mm}{\begin{tikzpicture}[x=.45cm,y=.45cm,baseline=-1mm]
          \getallenas{-4}{4}{-4,-3,-2,-1,0,1,2,3,4}
          \ivdeel{-4.4}{2}\haakr{2}
        \end{tikzpicture}}
      antwoord: |-
        $\ivog{\minf}{2}$, $x\leqslant2$
      uitwerking: |-
        $\ivog{\minf}{2}$, of $x\leqslant2$.
    - opgave: |-
        \raisebox{-3.5mm}{\begin{tikzpicture}[x=.45cm,y=.45cm,baseline=-1mm]
          \getallenas{-4}{4}{-4,-3,-2,-1,0,1,2,3,4}
          \ivdeel{-1}{3}\haakl{-1}\haakl{3}
        \end{tikzpicture}}
      antwoord: |-
        $\ivgo{-1}{3}$, $-1\leqslant x<3$
      uitwerking: |-
        $\ivgo{-1}{3}$, of $-1\leqslant x<3$.
    - opgave: |-
        \raisebox{-3.5mm}{\begin{tikzpicture}[x=.45cm,y=.45cm,baseline=-1mm]
          \getallenas{-4}{4}{-4,-3,-2,-1,0,1,2,3,4}
          \ivdeel{0}{4.4}\haakr{0}
        \end{tikzpicture}}
      antwoord: |-
        $\ivoo{0}{\pinf}$, $x>0$
      uitwerking: |-
        $\ivoo{0}{\pinf}$, of $x>0$: de positieve getallen.
    - opgave: |-
        \raisebox{-3.5mm}{\begin{tikzpicture}[x=.45cm,y=.45cm,baseline=-1mm]
          \getallenas{-4}{4}{-4,-3,-2,-1,0,1,2,3,4}
          \ivdeel{-3}{1}\haakr{-3}\haakr{1}
        \end{tikzpicture}}
      antwoord: |-
        $\ivog{-3}{1}$, $-3<x\leqslant1$
      uitwerking: |-
        $\ivog{-3}{1}$, of $-3<x\leqslant1$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    ongelijkheden herleiden
  opgave: |-
    Los op. Schrijf $V$ als interval.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x + 5 > 2$
      antwoord: |-
        $\ivoo{-3}{\pinf}$
      uitwerking: |-
        $x>-3$.
    - opgave: |-
        $3x \leqslant 12$
      antwoord: |-
        $\ivog{\minf}{4}$
      uitwerking: |-
        $x\leqslant4$.
    - opgave: |-
        $-4x < 20$
      antwoord: |-
        $\ivoo{-5}{\pinf}$
      uitwerking: |-
        Deel door $-4$: $x>-5$.
    - opgave: |-
        $\tfrac{x}{3} \geqslant -2$
      antwoord: |-
        $\ivgo{-6}{\pinf}$
      uitwerking: |-
        $x\geqslant-6$.
    - opgave: |-
        $2x - 7 < 3$
      antwoord: |-
        $\ivoo{\minf}{5}$
      uitwerking: |-
        $2x<10$, $x<5$.
    - opgave: |-
        $5 - x \geqslant 1$
      antwoord: |-
        $\ivog{\minf}{4}$
      uitwerking: |-
        $-x\geqslant-4$, $x\leqslant4$.
    - opgave: |-
        $6x + 1 > 4x - 5$
      antwoord: |-
        $\ivoo{-3}{\pinf}$
      uitwerking: |-
        $2x>-6$, $x>-3$.
    - opgave: |-
        $-\tfrac{x}{2} \leqslant 4$
      antwoord: |-
        $\ivgo{-8}{\pinf}$
      uitwerking: |-
        Maal $-2$: $x\geqslant-8$.
    - opgave: |-
        $7 - 3x < x + 3$
      antwoord: |-
        $\ivoo{1}{\pinf}$
      uitwerking: |-
        $4<4x$, $x>1$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    intervallen: wat hoort erbij?
  opgave: |-
    Waar of niet waar? Verbeter wat niet klopt.
  lijst: enumerate
  delen:
    - opgave: |-
        Het getal 3 ligt in $\ivog{3}{5}$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: de haak bij 3 kijkt weg, 3 hoort er niet bij.
    - opgave: |-
        Het getal $-2$ ligt in $\ivgo{-2}{0}$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar.
    - opgave: |-
        Het getal $2{,}99$ ligt in $\ivoo{\minf}{3}$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $2{,}99<3$.
    - opgave: |-
        Het interval $\ivoo{1}{2}$ bevat geen enkel getal, want er ligt geen geheel getal tussen 1 en 2.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: het bevat bijvoorbeeld $1{,}5$ en $1{,}01$, en zelfs oneindig veel getallen.
    - opgave: |-
        De getallen die groter zijn dan of gelijk aan 4 vormen $\ivoo{4}{\pinf}$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: dat is $\ivgo{4}{\pinf}$.
    - opgave: |-
        Het interval $\ivog{\minf}{0}$ bevat alle negatieve getallen en 0.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: de haak bij 0 kijkt naar het interval, dus 0 hoort erbij.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    ongelijkheden met haakjes
  opgave: |-
    Los op. Schrijf $V$ als interval en teken het.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3(x - 2) < 2x + 1$
      antwoord: |-
        $\ivoo{\minf}{7}$
      uitwerking: |-
        $3x-6<2x+1$, $x<7$.
    - opgave: |-
        $2(1 - x) \geqslant x + 8$
      antwoord: |-
        $\ivog{\minf}{-2}$
      uitwerking: |-
        $2-2x\geqslant x+8$, $-6\geqslant3x$, $x\leqslant-2$.
    - opgave: |-
        $4x - (x + 5) > 7$
      antwoord: |-
        $\ivoo{4}{\pinf}$
      uitwerking: |-
        $3x-5>7$, $x>4$.
    - opgave: |-
        $-(2x + 3) \leqslant 5$
      antwoord: |-
        $\ivgo{-4}{\pinf}$
      uitwerking: |-
        $-2x-3\leqslant5$, $-2x\leqslant8$, $x\geqslant-4$.
    - opgave: |-
        $5(x + 1) - 3(x - 2) < 1$
      antwoord: |-
        $\ivoo{\minf}{-5}$
      uitwerking: |-
        $2x+11<1$, $x<-5$.
    - opgave: |-
        $6 - 2(3 - x) \geqslant 4x$
      antwoord: |-
        $\ivog{\minf}{0}$
      uitwerking: |-
        $2x\geqslant4x$, $0\geqslant2x$, $x\leqslant0$.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    vraagstuk: hoogstens
  opgave: |-
    Een taxi rekent 4 euro instapkost en 1,80 euro per km. Je hebt 30 euro op zak. Hoe ver kun je hoogstens rijden?
  antwoord: |-
    ongeveer 14,4~km
  uitwerking: |-
    $x$ = de afstand in km: $4+1{,}8x\leqslant30$, $1{,}8x\leqslant26$, $x\leqslant14{,}44\ldots$ Je kunt hoogstens ongeveer 14,4~km rijden (naar beneden afronden).

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    van tekst naar ongelijkheid
  opgave: |-
    Schrijf als ongelijkheid. Kies zelf een letter.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor deze achtbaan moet je minstens 12 jaar zijn.
      antwoord: |-
        $l\geqslant12$
      uitwerking: |-
        $l\geqslant12$, met $l$ de leeftijd in jaar.
    - opgave: |-
        In de lift mogen hoogstens 8 personen.
      antwoord: |-
        $n\leqslant8$
      uitwerking: |-
        $n\leqslant8$.
    - opgave: |-
        Vannacht blijft de temperatuur boven $-3\,^\circ$C.
      antwoord: |-
        $t>-3$
      uitwerking: |-
        $t>-3$, met $t$ in $^\circ$C.
    - opgave: |-
        Een handbagagekoffer mag niet meer dan 10~kg wegen.
      antwoord: |-
        $g\leqslant10$
      uitwerking: |-
        $g\leqslant10$.
    - opgave: |-
        Het tarief voor kinderen geldt voor wie jonger is dan 12 jaar, vanaf 3 jaar.
      antwoord: |-
        $3\leqslant l<12$
      uitwerking: |-
        $3\leqslant l<12$: twee ongelijkheden tegelijk.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    ongelijkheden met breuken
  opgave: |-
    Los op. Schrijf $V$ als interval.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x}{2} - \dfrac{x}{3} > 1$
      antwoord: |-
        $\ivoo{6}{\pinf}$
      uitwerking: |-
        Maal 6: $3x-2x>6$, $x>6$.
    - opgave: |-
        $\dfrac{x + 1}{4} \leqslant \dfrac{x - 2}{3}$
      antwoord: |-
        $\ivgo{11}{\pinf}$
      uitwerking: |-
        Maal 12: $3x+3\leqslant4x-8$, $11\leqslant x$.
    - opgave: |-
        $\dfrac{2x - 1}{3} - x < \dfrac12$
      antwoord: |-
        $\ivoo{-\tfrac52}{\pinf}$
      uitwerking: |-
        Maal 6: $4x-2-6x<3$, $-2x<5$, $x>-\tfrac52$.
    - opgave: |-
        $1 - \dfrac{x - 4}{5} \geqslant \dfrac{x}{2}$
      antwoord: |-
        $\ivog{\minf}{\tfrac{18}{7}}$
      uitwerking: |-
        Maal 10: $10-2(x-4)\geqslant5x$, $18-2x\geqslant5x$, $18\geqslant7x$, $x\leqslant\tfrac{18}{7}$.
    - opgave: |-
        $0{,}3x - 1{,}2 < 0{,}5x + 0{,}4$
      antwoord: |-
        $\ivoo{-8}{\pinf}$
      uitwerking: |-
        $-0{,}2x<1{,}6$, $x>-8$.
    - opgave: |-
        $\dfrac{3 - x}{2} > \dfrac{x}{4} + 3$
      antwoord: |-
        $\ivoo{\minf}{-2}$
      uitwerking: |-
        Maal 4: $6-2x>x+12$, $-6>3x$, $x<-2$.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    fouten zoeken
  opgave: |-
    In elke oplossing zit één fout. Zoek de fout en los correct op.
  lijst: enumerate
  delen:
    - opgave: |-
        $-3x < 9 \ \Rightarrow \ x < -3$
      antwoord: |-
        $x>-3$
      uitwerking: |-
        Delen door $-3$ keert het teken om: $x>-3$.
    - opgave: |-
        $2x - 5 \geqslant 1 \ \Rightarrow \ 2x \geqslant -4 \ \Rightarrow \ x \geqslant -2$
      antwoord: |-
        $x\geqslant3$
      uitwerking: |-
        $-5$ gaat naar rechts als $+5$: $2x\geqslant6$, $x\geqslant3$.
    - opgave: |-
        $x \geqslant 2$, \ dus \ $V = \ivoo{2}{\pinf}$
      antwoord: |-
        $\ivgo{2}{\pinf}$
      uitwerking: |-
        2 hoort erbij: $V=\ivgo{2}{\pinf}$.
    - opgave: |-
        $4 - x > 1 \ \Rightarrow \ -x > -3 \ \Rightarrow \ x > 3$
      antwoord: |-
        $x<3$
      uitwerking: |-
        Delen door $-1$ keert het teken om: $x<3$. Controle met $x=0$: $4>1$ klopt.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    gemengde ongelijkheden
  opgave: |-
    Los op. Schrijf $V$ als interval.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2(x + 3) - 5 > 3x$
      antwoord: |-
        $\ivoo{\minf}{1}$
      uitwerking: |-
        $2x+1>3x$, $1>x$.
    - opgave: |-
        $\dfrac{x}{4} + 1 \geqslant \dfrac{x}{2}$
      antwoord: |-
        $\ivog{\minf}{4}$
      uitwerking: |-
        Maal 4: $x+4\geqslant2x$, $4\geqslant x$.
    - opgave: |-
        $0{,}2(5 - x) < 0{,}4x + 0{,}2$
      antwoord: |-
        $\ivoo{\tfrac43}{\pinf}$
      uitwerking: |-
        $1-0{,}2x<0{,}4x+0{,}2$, $0{,}8<0{,}6x$, $x>\tfrac43$.
    - opgave: |-
        $7x - 2(x + 4) \leqslant 5x - 8$
      antwoord: |-
        $V=\R$
      uitwerking: |-
        $5x-8\leqslant5x-8$, $0x\leqslant0$: klopt altijd.
    - opgave: |-
        $-\dfrac{2x}{3} > 4$
      antwoord: |-
        $\ivoo{\minf}{-6}$
      uitwerking: |-
        Maal 3: $-2x>12$, $x<-6$.
    - opgave: |-
        $x - \dfrac{x + 1}{2} < \dfrac{x - 3}{2}$
      antwoord: |-
        $V=\emptyset$
      uitwerking: |-
        Maal 2: $2x-x-1<x-3$, $x-1<x-3$, $0x<-2$: klopt nooit.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    geen of alle oplossingen
  opgave: |-
    Los op. Let goed op het verschil tussen $<$ en $\leqslant$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $4(x - 1) < 4x$
      antwoord: |-
        $V=\R$
      uitwerking: |-
        $4x-4<4x$, $0x<4$: $0<4$ klopt altijd.
    - opgave: |-
        $2x + 3 \geqslant 2(x + 2)$
      antwoord: |-
        $V=\emptyset$
      uitwerking: |-
        $2x+3\geqslant2x+4$, $0x\geqslant1$: klopt nooit.
    - opgave: |-
        $3(2 - x) > -3x + 6$
      antwoord: |-
        $V=\emptyset$
      uitwerking: |-
        $6-3x>6-3x$, $0>0$ klopt nooit.
    - opgave: |-
        $5x - (x - 1) \leqslant 4x + 1$
      antwoord: |-
        $V=\R$
      uitwerking: |-
        $4x+1\leqslant4x+1$, $0\leqslant0$ klopt altijd.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: minstens
  opgave: |-
    Yara heeft 140 euro gespaard en legt er elke week 15 euro bij. Ze wil een fiets van 400 euro kopen. Na hoeveel weken heeft ze minstens genoeg geld?
  antwoord: |-
    na 18 weken
  uitwerking: |-
    $x$ = het aantal weken: $140+15x\geqslant400$, $15x\geqslant260$, $x\geqslant17{,}3$. Naar boven afronden: na 18 weken. Controle: na 17 weken heeft ze 395 euro, na 18 weken 410 euro.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: geen verlies
  opgave: |-
    Voor een schoolfeest huurt de leerlingenraad een zaal voor 180 euro en een dj voor 250 euro. Een ticket kost 6 euro. Hoeveel tickets moeten ze minstens verkopen om geen verlies te maken?
  antwoord: |-
    72 tickets
  uitwerking: |-
    $x$ = het aantal tickets: $6x\geqslant430$, $x\geqslant71{,}7$. Minstens 72 tickets. Controle: $6\cdot72=432\geqslant430$, $6\cdot71=426<430$.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: twee tarieven vergelijken
  opgave: |-
    Fietsverhuur A rekent 8 euro plus 1,50 euro per uur. Fietsverhuur B rekent 3 euro per uur. Vanaf hoeveel uur is A voordeliger dan B? Geef je antwoord in uren en minuten.
  antwoord: |-
    vanaf meer dan 5 uur 20 minuten
  uitwerking: |-
    $x$ = het aantal uren: $8+1{,}5x<3x$, $8<1{,}5x$, $x>5{,}33\ldots$ Dat is 5 uur en $\tfrac13$ uur, dus 5 uur 20 minuten. Huur je langer dan 5 uur 20 minuten, dan is A voordeliger. Controle met 6 uur: A kost 17 euro, B 18 euro.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: meetkunde
  opgave: |-
    Een rechthoek is 12~cm lang. Zijn omtrek mag hoogstens 40~cm zijn. Welke breedtes zijn mogelijk? Schrijf je antwoord als interval.
  antwoord: |-
    $\ivog{0}{8}$
  uitwerking: |-
    $x$ = de breedte in cm: $2(12+x)\leqslant40$, $12+x\leqslant20$, $x\leqslant8$. Een breedte is ook positief: $0<x\leqslant8$, dus $\ivog{0}{8}$.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: gehele getallen
  opgave: |-
    Zoek alle positieve gehele getallen waarvoor het drievoud, verminderd met 4, kleiner is dan het getal vermeerderd met 7.
  antwoord: |-
    1, 2, 3, 4, 5
  uitwerking: |-
    $3x-4<x+7$, $2x<11$, $x<5{,}5$. De positieve gehele getallen kleiner dan $5{,}5$ zijn 1, 2, 3, 4 en 5.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: hoogstens
  opgave: |-
    Een lege vrachtwagen weegt 7,5 ton. Beladen mag hij hoogstens 18 ton wegen. Hij vervoert pallets van 0,65 ton. Hoeveel pallets mag hij hoogstens laden?
  antwoord: |-
    16 pallets
  uitwerking: |-
    $x$ = het aantal pallets: $7{,}5+0{,}65x\leqslant18$, $0{,}65x\leqslant10{,}5$, $x\leqslant16{,}15\ldots$ Hoogstens 16 pallets. Controle: $7{,}5+16\cdot0{,}65=17{,}9$ ton.

- id: h2-o18
  pakketten: [4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    dubbele ongelijkheden
  opgave: |-
    Los op. Schrijf $V$ als interval en teken het.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $-1 < x - 3 \leqslant 4$
      antwoord: |-
        $\ivog{2}{7}$
      uitwerking: |-
        Tel 3 op: $2<x\leqslant7$.
    - opgave: |-
        $3 \leqslant 2x + 5 < 11$
      antwoord: |-
        $\ivgo{-1}{3}$
      uitwerking: |-
        $-2\leqslant2x<6$, $-1\leqslant x<3$.
    - opgave: |-
        $-4 < 1 - x \leqslant 2$
      antwoord: |-
        $\ivgo{-1}{5}$
      uitwerking: |-
        $-5<-x\leqslant1$, $5>x\geqslant-1$, dus $-1\leqslant x<5$.
    - opgave: |-
        $0 \leqslant \dfrac{x + 2}{3} < 1$
      antwoord: |-
        $\ivgo{-2}{1}$
      uitwerking: |-
        Maal 3: $0\leqslant x+2<3$, $-2\leqslant x<1$.

- id: h2-o19
  pakketten: [4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    vraagstuk: dubbele ongelijkheid
  opgave: |-
    In de Verenigde Staten meet men de temperatuur in graden Fahrenheit. Een temperatuur van $C$ graden Celsius is $F = 1{,}8C + 32$ graden Fahrenheit. Een zwembad moet tussen $77\,^\circ$F en $86\,^\circ$F zijn, de grenzen inbegrepen. Tussen welke temperaturen in graden Celsius ligt dat?
  antwoord: |-
    tussen $25\,^\circ$C en $30\,^\circ$C
  uitwerking: |-
    $77\leqslant1{,}8C+32\leqslant86$, $45\leqslant1{,}8C\leqslant54$, $25\leqslant C\leqslant30$.

- id: h2-o25
  pakketten: [4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    ongelijkheden met een parameter
  opgave: |-
    Los op naar $x$ en bespreek.
  lijst: enumerate
  delen:
    - opgave: |-
        $mx > m$
      antwoord: |-
        $m>0$: $V=\ivoo{1}{\pinf}$; $m<0$: $V=\ivoo{\minf}{1}$; $m=0$: $V=\emptyset$
      uitwerking: |-
        Voor $m>0$ deel je door $m$ en blijft het teken: $x>1$. Voor $m<0$ keert het om: $x<1$. Voor $m=0$ staat er $0>0$: dat klopt nooit.
    - opgave: |-
        $k(x - 3) \leqslant x - 3$
      antwoord: |-
        $k>1$: $V=\ivog{\minf}{3}$; $k<1$: $V=\ivgo{3}{\pinf}$; $k=1$: $V=\R$
      uitwerking: |-
        $kx-3k\leqslant x-3$, $(k-1)x\leqslant3k-3=3(k-1)$. Voor $k>1$: $x\leqslant3$. Voor $k<1$: $x\geqslant3$. Voor $k=1$ staat er $0\leqslant0$: dat klopt altijd.
    - opgave: |-
        Voor welke waarden van $m$ is 4 een oplossing van $mx - 3 \geqslant 2x + m$?
      antwoord: |-
        $m\geqslant\tfrac{11}{3}$
      uitwerking: |-
        Vul $x=4$ in: $4m-3\geqslant8+m$, $3m\geqslant11$, $m\geqslant\tfrac{11}{3}$. Nu is $m$ de onbekende. Controle met $m=4$: $16-3=13\geqslant12$.

- id: h2-o26
  pakketten: [5]
  soort: opdracht
  niveau: 2
  thema: |-
    stelsels van ongelijkheden
  opgave: |-
    Los het stelsel op. Schrijf $V$ als interval en teken het.
  lijst: enumerate
  delen:
    - opgave: |-
        $x + 3 > 1$ en $4x \leqslant 12$
      antwoord: |-
        $\ivog{-2}{3}$
      uitwerking: |-
        $x>-2$ en $x\leqslant3$: samen $-2<x\leqslant3$.
    - opgave: |-
        $2x - 5 \geqslant 1$ en $3 - x > -4$
      antwoord: |-
        $\ivgo{3}{7}$
      uitwerking: |-
        $2x\geqslant6$, $x\geqslant3$. $-x>-7$, het teken keert om: $x<7$. Samen $3\leqslant x<7$.
    - opgave: |-
        $5x + 2 < 2x - 7$ en $x - 1 \geqslant 0$
      antwoord: |-
        $V=\emptyset$
      uitwerking: |-
        $3x<-9$, $x<-3$, en $x\geqslant1$. Geen getal is tegelijk kleiner dan $-3$ en minstens 1: $V=\emptyset$.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    zelf een ongelijkheid bedenken
  opgave: |-
    Bedenk een ongelijkheid met $x$ in beide leden
  lijst: enumerate
  delen:
    - opgave: |-
        met als oplossingsverzameling $\ivoo{\minf}{4}$;
      antwoord: |-
        bv. $3x-1<2x+3$
      uitwerking: |-
        Bijvoorbeeld $3x-1<2x+3$: $x<4$. Controleer je eigen ongelijkheid door ze op te lossen.
    - opgave: |-
        met als oplossingsverzameling $\ivgo{-2}{\pinf}$, waarbij je op het einde door een negatief getal moet delen;
      antwoord: |-
        bv. $x+1\leqslant3x+5$
      uitwerking: |-
        Bijvoorbeeld $x+1\leqslant3x+5$ met de $x$-termen links: $-2x\leqslant4$, $x\geqslant-2$.
    - opgave: |-
        zonder oplossingen.
      antwoord: |-
        bv. $2x+1>2x+3$
      uitwerking: |-
        Bijvoorbeeld $2x+1>2x+3$: $0>2$ klopt nooit. De termen met $x$ moeten in beide leden gelijk zijn.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    vraagstuk: twee tarieven en een budget
  opgave: |-
    Drukkerij Inkt rekent voor flyers 40 euro opstartkosten en 0,12 euro per flyer. Drukkerij Papier rekent 15 euro opstartkosten en 0,20 euro per flyer.
  lijst: enumerate
  delen:
    - opgave: |-
        Vanaf hoeveel flyers is Inkt goedkoper?
      antwoord: |-
        vanaf 313 flyers
      uitwerking: |-
        $40+0{,}12x<15+0{,}2x$, $25<0{,}08x$, $x>312{,}5$. Vanaf 313 flyers.
    - opgave: |-
        Een jeugdclub heeft hoogstens 100 euro. Hoeveel flyers kan ze hoogstens laten drukken, en bij welke drukkerij?
      antwoord: |-
        500 flyers, bij Inkt
      uitwerking: |-
        Inkt: $40+0{,}12x\leqslant100$, $x\leqslant500$. Papier: $15+0{,}2x\leqslant100$, $x\leqslant425$. Bij Inkt hoogstens 500 flyers.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    redeneren met ongelijkheden
  opgave: |-
    Waar of niet waar? Geef een uitleg, of een tegenvoorbeeld met getallen.
  lijst: enumerate
  delen:
    - opgave: |-
        Als $a < b$, dan is $a^2 < b^2$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $-3<1$, maar $9>1$. Het klopt wel als $a$ en $b$ allebei positief zijn.
    - opgave: |-
        Als $a < b$ en $c < d$, dan is $a + c < b + d$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: tel $c$ op bij beide leden van $a<b$, dan is $a+c<b+c$. Tel $b$ op bij beide leden van $c<d$, dan is $b+c<b+d$. Dus $a+c<b+c<b+d$.
    - opgave: |-
        Als $a < b$ en $c < d$, dan is $a - c < b - d$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $1<2$ en $0<5$, maar $1-0=1$ is niet kleiner dan $2-5=-3$.

- id: h2-o23
  soort: opdracht
  niveau: 3
  thema: |-
    vraagstuk: driehoek
  opgave: |-
    Een driehoek heeft zijden van $x$, $x + 2$ en 10~cm. In een driehoek is elke zijde kleiner dan de som van de andere twee.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke waarden van $x$ bestaat de driehoek?
      antwoord: |-
        $x>4$
      uitwerking: |-
        $10<x+(x+2)$ geeft $x>4$. De andere twee voorwaarden, $x+2<x+10$ en $x<x+12$, kloppen altijd. Dus $x>4$.
    - opgave: |-
        Voor welke waarden van $x$ bestaat de driehoek en is zijn omtrek minstens 30~cm?
      antwoord: |-
        $x\geqslant9$
      uitwerking: |-
        $2x+12\geqslant30$ geeft $x\geqslant9$. Samen met $x>4$: $x\geqslant9$, of $\ivgo{9}{\pinf}$.

- id: h2-o24
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    bewijzen met ongelijkheden
  opgave: |-
    Toon aan: als $a < b$, dan ligt het gemiddelde $\tfrac{a + b}{2}$ strikt tussen $a$ en $b$. Gebruik alleen de rekenregels van dit hoofdstuk.
  antwoord: |-
    zie uitwerking
  uitwerking: |-
    Tel $a$ op bij beide leden van $a<b$: $2a<a+b$. Deel door 2, positief: $a<\tfrac{a+b}{2}$. Tel $b$ op bij beide leden van $a<b$: $a+b<2b$, dus $\tfrac{a+b}{2}<b$. Samen: $a<\tfrac{a+b}{2}<b$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Schrijf als interval en teken op een getallenas.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $-1 < x \leqslant 5$
      antwoord: |-
        $\ivog{-1}{5}$
      uitwerking: |-
        $\ivog{-1}{5}$.
    - opgave: |-
        $x \geqslant 3$
      antwoord: |-
        $\ivgo{3}{\pinf}$
      uitwerking: |-
        $\ivgo{3}{\pinf}$.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Los op: $4x - 7 > 2x + 3$.
  antwoord: |-
    $\ivoo{5}{\pinf}$
  uitwerking: |-
    $2x>10$, $x>5$.

- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    Los op: $3 - 5x \geqslant 18$.
  antwoord: |-
    $\ivog{\minf}{-3}$
  uitwerking: |-
    $-5x\geqslant15$, en delen door $-5$ keert het teken om: $x\leqslant-3$.

- id: h2-t4
  soort: test
  niveau: 2
  opgave: |-
    Los op: $\dfrac{x + 2}{3} - \dfrac{x}{2} < 1$.
  antwoord: |-
    $\ivoo{-2}{\pinf}$
  uitwerking: |-
    Maal 6: $2(x+2)-3x<6$, $-x+4<6$, $-x<2$, $x>-2$.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Los op: $2(x - 1) \geqslant 2x + 1$.
  antwoord: |-
    $V=\emptyset$
  uitwerking: |-
    $2x-2\geqslant2x+1$, $0x\geqslant3$: klopt nooit.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Een fotograaf rekent 60 euro voor een fotoshoot en 4,50 euro per afgedrukte foto. Je wilt hoogstens 150 euro uitgeven. Hoeveel foto's kun je hoogstens laten afdrukken?
  antwoord: |-
    20 foto's
  uitwerking: |-
    $60+4{,}5x\leqslant150$, $4{,}5x\leqslant90$, $x\leqslant20$. Hoogstens 20 foto's.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Huurwagen A kost 40 euro plus 0,15 euro per km, huurwagen B 25 euro plus 0,25 euro per km. Vanaf hoeveel km is A goedkoper?
  antwoord: |-
    vanaf meer dan 150~km
  uitwerking: |-
    $40+0{,}15x<25+0{,}25x$, $15<0{,}1x$, $x>150$. Bij meer dan 150~km is A goedkoper.

- id: h2-t8
  pakketten: [4, 5]
  soort: test
  niveau: 2
  opgave: |-
    Los op: $-5 < 3x + 1 \leqslant 10$.
  antwoord: |-
    $\ivog{-2}{3}$
  uitwerking: |-
    $-6<3x\leqslant9$, $-2<x\leqslant3$.

- id: h2-t9
  pakketten: [4, 5]
  soort: test
  niveau: 2
  opgave: |-
    Los op naar $x$ en bespreek: $kx - 4 < 2k - 2x$.
  antwoord: |-
    $k>-2$: $V=\ivoo{\minf}{2}$; $k<-2$: $V=\ivoo{2}{\pinf}$; $k=-2$: $V=\emptyset$
  uitwerking: |-
    $kx+2x<2k+4$, $(k+2)x<2(k+2)$. Voor $k>-2$: $x<2$. Voor $k<-2$ keert het teken om: $x>2$. Voor $k=-2$ staat er $0<0$: dat klopt nooit.
