# Oefeningen van hoofdstuk 3. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Los op of bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $1{,}8C + 32 = 86$
      antwoord: |-
        $C=30$
      uitwerking: |-
        $1{,}8C=54$, $C=30$.
    - opgave: |-
        $2(l + 5) = 36$
      antwoord: |-
        $l=13$
      uitwerking: |-
        $l+5=18$, $l=13$.
    - opgave: |-
        $\tfrac{s}{4} = 15$
      antwoord: |-
        $s=60$
      uitwerking: |-
        $s=15\cdot4=60$.
    - opgave: |-
        $5x - 3 = 2$
      antwoord: |-
        $x=1$
      uitwerking: |-
        $5x=5$, $x=1$.
    - opgave: |-
        $P = 2(l + b)$ \ als \ $l = 8$ en $b = 5$
      antwoord: |-
        $P=26$
      uitwerking: |-
        $P=2\cdot13=26$.
    - opgave: |-
        $v = \tfrac{s}{t}$ \ als \ $s = 150$ en $t = 2$
      antwoord: |-
        $v=75$
      uitwerking: |-
        $v=\tfrac{150}{2}=75$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad De oppervlakte van een rechthoek met lengte $l$ en breedte $b$ is $A = l \cdot b$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de breedte als $A = 24$ en $l = 6$.
      antwoord: |-
        $4$
      uitwerking: |-
        $24=6b$, $b=4$.
    - opgave: |-
        Bereken de breedte als $A = 35$ en $l = 7$, en als $A = 18$ en $l = 4$.
      antwoord: |-
        $5$ en $4{,}5$
      uitwerking: |-
        $b=\tfrac{35}{7}=5$ en $b=\tfrac{18}{4}=4{,}5$.
    - opgave: |-
        Welke bewerking doe je telkens? Schrijf een formule die met $b = \ldots$ begint.
      antwoord: |-
        $b=\tfrac{A}{l}$
      uitwerking: |-
        Je deelt telkens de oppervlakte door de lengte: $b=\tfrac{A}{l}$.

- id: h3-eenvoudig
  soort: kort
  opgave: |-
    Vorm om naar de letter tussen haakjes.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $P = 4z$ \ ($z$)
      antwoord: |-
        $z=\tfrac{P}{4}$
      uitwerking: |-
        Deel door 4.
    - opgave: |-
        $d = 2r$ \ ($r$)
      antwoord: |-
        $r=\tfrac{d}{2}$
      uitwerking: |-
        Deel door 2.
    - opgave: |-
        $m = \rho \cdot V$ \ ($V$)
      antwoord: |-
        $V=\tfrac{m}{\rho}$
      uitwerking: |-
        Deel door $\rho$.
    - opgave: |-
        $p = \tfrac{F}{A}$ \ ($F$)
      antwoord: |-
        $F=p\cdot A$
      uitwerking: |-
        Vermenigvuldig met $A$.
    - opgave: |-
        $a = b + 5$ \ ($b$)
      antwoord: |-
        $b=a-5$
      uitwerking: |-
        Trek 5 af.
    - opgave: |-
        $y = x - c$ \ ($x$)
      antwoord: |-
        $x=y+c$
      uitwerking: |-
        Tel $c$ op.

- id: h3-tweestappen
  soort: kort
  opgave: |-
    Vorm om naar de letter tussen haakjes.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $K = 4 + 1{,}8a$ \ ($a$)
      antwoord: |-
        $a=\tfrac{K-4}{1{,}8}$
      uitwerking: |-
        $K-4=1{,}8a$, dus $a=\tfrac{K-4}{1{,}8}$.
    - opgave: |-
        $P = 2l + 2b$ \ ($l$)
      antwoord: |-
        $l=\tfrac{P-2b}{2}$
      uitwerking: |-
        $P-2b=2l$, dus $l=\tfrac{P-2b}{2}=\tfrac P2-b$.
    - opgave: |-
        $s = 50 + 12t$ \ ($t$)
      antwoord: |-
        $t=\tfrac{s-50}{12}$
      uitwerking: |-
        $s-50=12t$, dus $t=\tfrac{s-50}{12}$.
    - opgave: |-
        $y = 5 - 2x$ \ ($x$)
      antwoord: |-
        $x=\tfrac{5-y}{2}$
      uitwerking: |-
        $2x=5-y$, dus $x=\tfrac{5-y}{2}$.

- id: h3-controle
  soort: kort
  opgave: |-
    Iemand vormde een formule om. Controleer met eenvoudige getallen of het klopt. Verbeter wat fout is.
  lijst: enumerate
  delen:
    - opgave: |-
        $y = 2x + 6 \ \Rightarrow \ x = \tfrac{y}{2} - 6$
      antwoord: |-
        fout: $x=\tfrac{y-6}{2}$
      uitwerking: |-
        Met $x=1$ is $y=8$, maar $\tfrac82-6=-2\neq1$. Juist: $y-6=2x$, dus $x=\tfrac{y-6}{2}=\tfrac y2-3$.
    - opgave: |-
        $A = l \cdot b \ \Rightarrow \ l = \tfrac{b}{A}$
      antwoord: |-
        fout: $l=\tfrac{A}{b}$
      uitwerking: |-
        Met $l=3$ en $b=2$ is $A=6$, maar $\tfrac26\neq3$. Juist: $l=\tfrac{A}{b}$.
    - opgave: |-
        $P = 2(l + b) \ \Rightarrow \ l = \tfrac{P}{2} - b$
      antwoord: |-
        juist
      uitwerking: |-
        Met $l=3$ en $b=2$ is $P=10$, en $\tfrac{10}{2}-2=3$. Juist.

- id: h3-breuk
  soort: kort
  opgave: |-
    Vorm om naar de letter tussen haakjes.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $G = \dfrac{a + b}{2}$ \ ($b$)
      antwoord: |-
        $b=2G-a$
      uitwerking: |-
        $2G=a+b$, dus $b=2G-a$.
    - opgave: |-
        $A = \dfrac{b \cdot h}{2}$ \ ($b$)
      antwoord: |-
        $b=\tfrac{2A}{h}$
      uitwerking: |-
        $2A=bh$, dus $b=\tfrac{2A}{h}$.
    - opgave: |-
        $y = \dfrac{x}{3} - 4$ \ ($x$)
      antwoord: |-
        $x=3(y+4)$
      uitwerking: |-
        $y+4=\tfrac x3$, dus $x=3(y+4)=3y+12$.

- id: h3-noemer
  soort: kort
  opgave: |-
    Vorm om naar de letter tussen haakjes.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $I = \dfrac{U}{R}$ \ ($R$)
      antwoord: |-
        $R=\tfrac{U}{I}$
      uitwerking: |-
        $IR=U$, dus $R=\tfrac{U}{I}$.
    - opgave: |-
        $t = \dfrac{s}{v}$ \ ($v$)
      antwoord: |-
        $v=\tfrac{s}{t}$
      uitwerking: |-
        $tv=s$, dus $v=\tfrac st$.
    - opgave: |-
        $P = \dfrac{W}{t}$ \ ($t$)
      antwoord: |-
        $t=\tfrac{W}{P}$
      uitwerking: |-
        $Pt=W$, dus $t=\tfrac{W}{P}$.

- id: h3-kwadraat
  soort: kort
  opgave: |-
    Vorm om naar de letter tussen haakjes. Alle grootheden zijn positief.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $A = z^2$ \ ($z$)
      antwoord: |-
        $z=\sqrt{A}$
      uitwerking: |-
        De positieve wortel: $z=\sqrt A$.
    - opgave: |-
        $A = 6z^2$ \ ($z$)
      antwoord: |-
        $z=\sqrt{\tfrac{A}{6}}$
      uitwerking: |-
        $\tfrac A6=z^2$, dus $z=\sqrt{\tfrac A6}$. Dit is de oppervlakte van een kubus met ribbe $z$.
    - opgave: |-
        $P = I^2 R$ \ ($I$)
      antwoord: |-
        $I=\sqrt{\tfrac{P}{R}}$
      uitwerking: |-
        $\tfrac PR=I^2$, dus $I=\sqrt{\tfrac PR}$.

- id: h3-twee
  pakketten: [4, 5]
  soort: kort
  opgave: |-
    Vorm om naar de letter tussen haakjes.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $B = p + p \cdot r$ \ ($p$)
      antwoord: |-
        $p=\tfrac{B}{1+r}$
      uitwerking: |-
        $B=p(1+r)$, dus $p=\tfrac{B}{1+r}$. Zo vind je een prijs zonder btw, met $r$ het btw-tarief.
    - opgave: |-
        $y = ax - bx$ \ ($x$), met $a \neq b$
      antwoord: |-
        $x=\tfrac{y}{a-b}$
      uitwerking: |-
        $y=x(a-b)$, dus $x=\tfrac{y}{a-b}$.

- id: h3-gebruik
  soort: kort
  opgave: |-
    Vorm de formule om, vul in en antwoord met een zin.
  lijst: enumerate
  delen:
    - opgave: |-
        Een taxirit kost $K = 4 + 1{,}8a$ euro, met $a$ de afstand in km. Hoe ver reed je voor 31 euro?
      antwoord: |-
        15~km
      uitwerking: |-
        $a=\tfrac{K-4}{1{,}8}=\tfrac{27}{1{,}8}=15$. Je reed 15~km.
    - opgave: |-
        Een kaars is na $t$ uur branden nog $L = 24 - 1{,}5t$~cm lang. Na hoeveel uur is ze nog 6~cm?
      antwoord: |-
        na 12 uur
      uitwerking: |-
        $1{,}5t=24-L$, dus $t=\tfrac{24-L}{1{,}5}=\tfrac{18}{1{,}5}=12$. Na 12 uur.

# --- Opdrachten -------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    eenvoudige formules omvormen
  opgave: |-
    Vorm om naar de letter tussen haakjes.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $A = l \cdot b$ \ ($l$)
      antwoord: |-
        $l=\tfrac{A}{b}$
      uitwerking: |-
        Deel door $b$.
    - opgave: |-
        $U = R \cdot I$ \ ($R$)
      antwoord: |-
        $R=\tfrac{U}{I}$
      uitwerking: |-
        Deel door $I$.
    - opgave: |-
        $s = v \cdot t$ \ ($v$)
      antwoord: |-
        $v=\tfrac{s}{t}$
      uitwerking: |-
        Deel door $t$.
    - opgave: |-
        $y = x + 7$ \ ($x$)
      antwoord: |-
        $x=y-7$
      uitwerking: |-
        Trek 7 af.
    - opgave: |-
        $a = b - c$ \ ($b$)
      antwoord: |-
        $b=a+c$
      uitwerking: |-
        Tel $c$ op.
    - opgave: |-
        $a = b - c$ \ ($c$)
      antwoord: |-
        $c=b-a$
      uitwerking: |-
        $a+c=b$, dus $c=b-a$.
    - opgave: |-
        $K = 12n$ \ ($n$)
      antwoord: |-
        $n=\tfrac{K}{12}$
      uitwerking: |-
        Deel door 12.
    - opgave: |-
        $W = O - K$ \ ($O$)
      antwoord: |-
        $O=W+K$
      uitwerking: |-
        Tel $K$ op: de opbrengst is de winst plus de kosten.
    - opgave: |-
        $F = m \cdot g$ \ ($g$)
      antwoord: |-
        $g=\tfrac{F}{m}$
      uitwerking: |-
        Deel door $m$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    formules in twee stappen
  opgave: |-
    Vorm om naar de letter tussen haakjes.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = 3x - 6$ \ ($x$)
      antwoord: |-
        $x=\tfrac{y+6}{3}$
      uitwerking: |-
        $y+6=3x$, dus $x=\tfrac{y+6}{3}$.
    - opgave: |-
        $P = 2l + 2b$ \ ($b$)
      antwoord: |-
        $b=\tfrac{P-2l}{2}$
      uitwerking: |-
        $P-2l=2b$, dus $b=\tfrac{P-2l}{2}=\tfrac P2-l$.
    - opgave: |-
        $K = 25 + 0{,}3a$ \ ($a$)
      antwoord: |-
        $a=\tfrac{K-25}{0{,}3}$
      uitwerking: |-
        $K-25=0{,}3a$, dus $a=\tfrac{K-25}{0{,}3}$.
    - opgave: |-
        $T = 15 - 6{,}5h$ \ ($h$)
      antwoord: |-
        $h=\tfrac{15-T}{6{,}5}$
      uitwerking: |-
        $6{,}5h=15-T$, dus $h=\tfrac{15-T}{6{,}5}$.
    - opgave: |-
        $y = 4(x + 2)$ \ ($x$)
      antwoord: |-
        $x=\tfrac{y}{4}-2$
      uitwerking: |-
        $\tfrac y4=x+2$, dus $x=\tfrac y4-2$.
    - opgave: |-
        $E = 0{,}25t + 18$ \ ($t$)
      antwoord: |-
        $t=\tfrac{E-18}{0{,}25}$
      uitwerking: |-
        $E-18=0{,}25t$, dus $t=\tfrac{E-18}{0{,}25}=4(E-18)$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    formule omvormen en gebruiken
  opgave: |-
    Een fietsenmaker rekent $K = 15 + 30u$ euro voor een herstelling, met $u$ het aantal uren werk.
  lijst: enumerate
  delen:
    - opgave: |-
        Vorm de formule om naar $u$.
      antwoord: |-
        $u=\tfrac{K-15}{30}$
      uitwerking: |-
        $K-15=30u$, dus $u=\tfrac{K-15}{30}$.
    - opgave: |-
        Hoe lang werkte hij voor een rekening van 60 euro? En van 82,50 euro?
      antwoord: |-
        1,5 uur en 2,25 uur
      uitwerking: |-
        $\tfrac{45}{30}=1{,}5$ uur en $\tfrac{67{,}5}{30}=2{,}25$ uur, of 2 uur en 15 minuten.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    formules met breuken
  opgave: |-
    Vorm om naar de letter tussen haakjes.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $m = \dfrac{a + b}{2}$ \ ($a$)
      antwoord: |-
        $a=2m-b$
      uitwerking: |-
        $2m=a+b$, dus $a=2m-b$.
    - opgave: |-
        $A = \dfrac{b \cdot h}{2}$ \ ($h$)
      antwoord: |-
        $h=\tfrac{2A}{b}$
      uitwerking: |-
        $2A=bh$, dus $h=\tfrac{2A}{b}$.
    - opgave: |-
        $y = \dfrac{x}{4} + 3$ \ ($x$)
      antwoord: |-
        $x=4(y-3)$
      uitwerking: |-
        $y-3=\tfrac x4$, dus $x=4(y-3)$.
    - opgave: |-
        $G = \dfrac{a + b + c}{3}$ \ ($c$)
      antwoord: |-
        $c=3G-a-b$
      uitwerking: |-
        $3G=a+b+c$, dus $c=3G-a-b$.
    - opgave: |-
        $V = \dfrac{G \cdot h}{3}$ \ ($G$)
      antwoord: |-
        $G=\tfrac{3V}{h}$
      uitwerking: |-
        $3V=Gh$, dus $G=\tfrac{3V}{h}$.
    - opgave: |-
        $A = \dfrac{(B + b) \cdot h}{2}$ \ ($B$)
      antwoord: |-
        $B=\tfrac{2A}{h}-b$
      uitwerking: |-
        $\tfrac{2A}{h}=B+b$, dus $B=\tfrac{2A}{h}-b$.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    de letter in de noemer
  opgave: |-
    Vorm om naar de letter tussen haakjes.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $p = \dfrac{F}{A}$ \ ($A$)
      antwoord: |-
        $A=\tfrac{F}{p}$
      uitwerking: |-
        $pA=F$, dus $A=\tfrac Fp$.
    - opgave: |-
        $v = \dfrac{s}{t}$ \ ($t$)
      antwoord: |-
        $t=\tfrac{s}{v}$
      uitwerking: |-
        $vt=s$, dus $t=\tfrac sv$.
    - opgave: |-
        $n = \dfrac{L}{l}$ \ ($l$)
      antwoord: |-
        $l=\tfrac{L}{n}$
      uitwerking: |-
        $nl=L$, dus $l=\tfrac Ln$.
    - opgave: |-
        $h = \dfrac{2A}{b}$ \ ($b$)
      antwoord: |-
        $b=\tfrac{2A}{h}$
      uitwerking: |-
        $hb=2A$, dus $b=\tfrac{2A}{h}$.
    - opgave: |-
        $y = \dfrac{6}{x}$ \ ($x$)
      antwoord: |-
        $x=\tfrac{6}{y}$
      uitwerking: |-
        $xy=6$, dus $x=\tfrac6y$.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    formules met een kwadraat
  opgave: |-
    Vorm om naar de letter tussen haakjes. Alle grootheden zijn positief.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $A = \pi r^2$ \ ($r$)
      antwoord: |-
        $r=\sqrt{\tfrac{A}{\pi}}$
      uitwerking: |-
        $\tfrac A\pi=r^2$, dus $r=\sqrt{\tfrac A\pi}$.
    - opgave: |-
        $E = \tfrac12 m v^2$ \ ($m$)
      antwoord: |-
        $m=\tfrac{2E}{v^2}$
      uitwerking: |-
        $2E=mv^2$, dus $m=\tfrac{2E}{v^2}$.
    - opgave: |-
        $s = 5t^2$ \ ($t$)
      antwoord: |-
        $t=\sqrt{\tfrac{s}{5}}$
      uitwerking: |-
        $\tfrac s5=t^2$, dus $t=\sqrt{\tfrac s5}$.
    - opgave: |-
        $V = z^2 \cdot h$ \ ($z$)
      antwoord: |-
        $z=\sqrt{\tfrac{V}{h}}$
      uitwerking: |-
        $\tfrac Vh=z^2$, dus $z=\sqrt{\tfrac Vh}$.

- id: h3-o7
  soort: opdracht
  niveau: 2
  thema: |-
    fouten zoeken
  opgave: |-
    In elke omvorming zit een fout. Toon met getallen aan dat ze fout is, en verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        $P = 2l + 2b \ \Rightarrow \ l = \tfrac{P}{2} - 2b$
      antwoord: |-
        $l=\tfrac P2-b$
      uitwerking: |-
        Met $l=3$, $b=1$ is $P=8$, maar $4-2=2\neq3$. Ook $2b$ moet door 2 gedeeld worden: $l=\tfrac{P-2b}{2}=\tfrac P2-b$.
    - opgave: |-
        $v = \tfrac{s}{t} \ \Rightarrow \ t = v \cdot s$
      antwoord: |-
        $t=\tfrac sv$
      uitwerking: |-
        Met $s=10$, $t=2$ is $v=5$, maar $5\cdot10=50\neq2$. Juist: $vt=s$, dus $t=\tfrac sv$.
    - opgave: |-
        $F = 1{,}8C + 32 \ \Rightarrow \ C = \tfrac{F}{1{,}8} - 32$
      antwoord: |-
        $C=\tfrac{F-32}{1{,}8}$
      uitwerking: |-
        Met $C=10$ is $F=50$, maar $\tfrac{50}{1{,}8}-32\approx-4{,}2$. Eerst 32 aftrekken, dan delen: $C=\tfrac{F-32}{1{,}8}$.
    - opgave: |-
        $A = \pi r^2 \ \Rightarrow \ r = \tfrac{\sqrt{A}}{\pi}$
      antwoord: |-
        $r=\sqrt{\tfrac A\pi}$
      uitwerking: |-
        Met $r=1$ is $A=\pi$, maar $\tfrac{\sqrt\pi}{\pi}\approx0{,}56\neq1$. De wortel staat over de hele breuk: $r=\sqrt{\tfrac A\pi}$.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    formule omvormen en gebruiken
  opgave: |-
    Een vuistregel voor de Europese schoenmaat is $S = 1{,}5\,l + 2$, met $l$ de lengte van je voet in cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Vorm de formule om naar $l$.
      antwoord: |-
        $l=\tfrac{S-2}{1{,}5}$
      uitwerking: |-
        $S-2=1{,}5l$, dus $l=\tfrac{S-2}{1{,}5}$.
    - opgave: |-
        Hoe lang is een voet bij schoenmaat 41? En bij maat 38?
      antwoord: |-
        26~cm en 24~cm
      uitwerking: |-
        $\tfrac{39}{1{,}5}=26$~cm en $\tfrac{36}{1{,}5}=24$~cm.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    Celsius en Fahrenheit
  opgave: |-
    Gebruik $C = \dfrac{F - 32}{1{,}8}$ om de temperaturen om te zetten naar graden Celsius.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $50\,^\circ$F
      antwoord: |-
        $10\,^\circ$C
      uitwerking: |-
        $\tfrac{18}{1{,}8}=10$.
    - opgave: |-
        $104\,^\circ$F
      antwoord: |-
        $40\,^\circ$C
      uitwerking: |-
        $\tfrac{72}{1{,}8}=40$.
    - opgave: |-
        $14\,^\circ$F
      antwoord: |-
        $-10\,^\circ$C
      uitwerking: |-
        $\tfrac{-18}{1{,}8}=-10$.
    - opgave: |-
        $-4\,^\circ$F
      antwoord: |-
        $-20\,^\circ$C
      uitwerking: |-
        $\tfrac{-36}{1{,}8}=-20$.
    - opgave: |-
        $98{,}6\,^\circ$F
      antwoord: |-
        $37\,^\circ$C
      uitwerking: |-
        $\tfrac{66{,}6}{1{,}8}=37$: de lichaamstemperatuur.
    - opgave: |-
        $212\,^\circ$F
      antwoord: |-
        $100\,^\circ$C
      uitwerking: |-
        $\tfrac{180}{1{,}8}=100$: water kookt.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    fysica: de wet van Ohm
  opgave: |-
    De spanning $U$ (in volt) over een weerstand $R$ (in ohm) waar een stroom $I$ (in ampère) door loopt, is $U = R \cdot I$.
  lijst: enumerate
  delen:
    - opgave: |-
        Vorm om naar $I$ en naar $R$.
      antwoord: |-
        $I=\tfrac UR$, $R=\tfrac UI$
      uitwerking: |-
        Deel door $R$, of door $I$.
    - opgave: |-
        Hoe groot is de stroom bij een spanning van 230~V en een weerstand van 46~ohm?
      antwoord: |-
        5~A
      uitwerking: |-
        $I=\tfrac{230}{46}=5$~A.
    - opgave: |-
        Welke weerstand heeft een lampje waar bij 12~V een stroom van 0,5~A door loopt?
      antwoord: |-
        24~ohm
      uitwerking: |-
        $R=\tfrac{12}{0{,}5}=24$~ohm.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    fysica: dichtheid
  opgave: |-
    De dichtheid van een stof is $\rho = \dfrac{m}{V}$, met $m$ de massa en $V$ het volume. Goud heeft een dichtheid van 19,3~g/cm$^3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Vorm om naar $m$ en naar $V$.
      antwoord: |-
        $m=\rho V$, $V=\tfrac m\rho$
      uitwerking: |-
        Vermenigvuldig met $V$: $m=\rho V$. Deel dan door $\rho$: $V=\tfrac m\rho$.
    - opgave: |-
        Hoe zwaar is een staafje goud van 15~cm$^3$?
      antwoord: |-
        289,5~g
      uitwerking: |-
        $m=19{,}3\cdot15=289{,}5$~g.
    - opgave: |-
        Welk volume heeft 1~kg goud? Rond af op 0,1~cm$^3$.
      antwoord: |-
        51,8~cm$^3$
      uitwerking: |-
        $V=\tfrac{1000}{19{,}3}\approx51{,}8$~cm$^3$: minder dan een luciferdoosje.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    economie: enkelvoudige intrest
  opgave: |-
    Op een kapitaal $k$ dat $n$ jaar op een rekening staat met een intrest $i$ per jaar, krijg je een intrest $I = k \cdot i \cdot n$ (enkelvoudige intrest).
  lijst: enumerate
  delen:
    - opgave: |-
        Vorm om naar $n$. Hoeveel jaar moet 2000 euro tegen 2,5\,\% per jaar op de rekening staan om 150 euro intrest op te brengen?
      antwoord: |-
        $n=\tfrac{I}{ki}$; 3 jaar
      uitwerking: |-
        $n=\tfrac{I}{k\cdot i}=\tfrac{150}{2000\cdot0{,}025}=\tfrac{150}{50}=3$ jaar.
    - opgave: |-
        Vorm om naar $k$. Hoeveel moet je sparen om in 2 jaar 90 euro intrest te krijgen, tegen 1,5\,\% per jaar?
      antwoord: |-
        $k=\tfrac{I}{in}$; 3000 euro
      uitwerking: |-
        $k=\tfrac{I}{i\cdot n}=\tfrac{90}{0{,}015\cdot2}=\tfrac{90}{0{,}03}=3000$ euro.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    economie: winst
  opgave: |-
    Een leerlingenonderneming verkoopt drinkflessen. De winst is $W = (p - k) \cdot q - V$, met $p$ de verkoopprijs, $k$ de aankoopprijs per fles, $q$ het aantal verkochte flessen en $V$ de vaste kosten. Neem $k = 1{,}5$ euro en $V = 1200$ euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Bij een verkoopprijs van 4 euro: hoeveel flessen moeten ze verkopen om quitte te spelen?
      antwoord: |-
        480
      uitwerking: |-
        $q=\tfrac{W+V}{p-k}=\tfrac{0+1200}{2{,}5}=480$.
    - opgave: |-
        En om 800 euro winst te maken?
      antwoord: |-
        800
      uitwerking: |-
        $q=\tfrac{800+1200}{2{,}5}=800$.
    - opgave: |-
        Vorm de formule om naar $p$. Welke prijs moeten ze vragen om met 600 flessen 600 euro winst te maken?
      antwoord: |-
        $p=\tfrac{W+V}{q}+k$; 4,50 euro
      uitwerking: |-
        $W+V=(p-k)q$, $\tfrac{W+V}{q}=p-k$, dus $p=\tfrac{W+V}{q}+k=\tfrac{1800}{600}+1{,}5=4{,}5$ euro.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    meetkunde: hoogte berekenen
  opgave: |-
    Vorm de formule om en bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        Een trapezium heeft een oppervlakte van 45~cm$^2$ en evenwijdige zijden van 11~cm en 7~cm. Hoe hoog is het? Gebruik $A = \tfrac{(B + b) \cdot h}{2}$.
      antwoord: |-
        5~cm
      uitwerking: |-
        $h=\tfrac{2A}{B+b}=\tfrac{90}{18}=5$~cm.
    - opgave: |-
        Een cilindervormige vaas met een straal van 5~cm moet 1 liter (1000~cm$^3$) water kunnen bevatten. Hoe hoog moet ze minstens zijn? Gebruik $V = \pi r^2 h$ en rond af op 0,1~cm.
      antwoord: |-
        12,8~cm
      uitwerking: |-
        $h=\tfrac{V}{\pi r^2}=\tfrac{1000}{25\pi}\approx12{,}73$~cm. Minstens, dus naar boven afronden: 12,8~cm.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    eenheden omzetten
  opgave: |-
    Een snelheid van $v$ meter per seconde is $w = 3{,}6\,v$ kilometer per uur.
  lijst: enumerate
  delen:
    - opgave: |-
        Vorm om naar $v$. Hoeveel m/s is 100~km/h? Rond af op 0,1.
      antwoord: |-
        $v=\tfrac{w}{3{,}6}$; 27,8~m/s
      uitwerking: |-
        $v=\tfrac{w}{3{,}6}=\tfrac{100}{3{,}6}\approx27{,}8$~m/s.
    - opgave: |-
        Een jachtluipaard haalt 30~m/s. Hoeveel km/h is dat?
      antwoord: |-
        108~km/h
      uitwerking: |-
        $w=3{,}6\cdot30=108$~km/h. Hier hoef je niet om te vormen.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    de letter in de noemer, met een extra term
  opgave: |-
    Een bus rijdt een afstand $s$ (in km) met een gemiddelde snelheid $v$ (in km/h), en pauzeert onderweg een kwartier. De reis duurt dan $t = \dfrac{s}{v} + 0{,}25$ uur. Vorm om naar $v$. Welke gemiddelde snelheid is nodig om 180~km af te leggen in 2 uur en 15 minuten?
  antwoord: |-
    $v=\tfrac{s}{t-0{,}25}$; 90~km/h
  uitwerking: |-
    $t-0{,}25=\tfrac sv$, $v(t-0{,}25)=s$, dus $v=\tfrac{s}{t-0{,}25}$. Met $t=2{,}25$: $v=\tfrac{180}{2}=90$~km/h.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    aardrijkskunde: temperatuur en hoogte
  opgave: |-
    In de dampkring daalt de temperatuur ongeveer $6{,}5\,^\circ$C per km hoogte. Is het aan de grond $T_0$ graden, dan is het op een hoogte van $h$~km ongeveer $T = T_0 - 6{,}5h$ graden.
  lijst: enumerate
  delen:
    - opgave: |-
        Vorm om naar $h$. Op welke hoogte is het $-30\,^\circ$C, als het aan de grond $22\,^\circ$C is?
      antwoord: |-
        $h=\tfrac{T_0-T}{6{,}5}$; 8~km
      uitwerking: |-
        $6{,}5h=T_0-T$, dus $h=\tfrac{T_0-T}{6{,}5}=\tfrac{52}{6{,}5}=8$~km.
    - opgave: |-
        Een vliegtuig vliegt op 11~km hoogte. Aan de grond is het $15\,^\circ$C. Hoe koud is het buiten het vliegtuig?
      antwoord: |-
        $-56{,}5\,^\circ$C
      uitwerking: |-
        $T=15-6{,}5\cdot11=-56{,}5\,^\circ$C.

- id: h3-o18
  pakketten: [4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    de letter staat twee keer
  opgave: |-
    Vorm om naar de letter tussen haakjes.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $A = ab + ac$ \ ($a$)
      antwoord: |-
        $a=\tfrac{A}{b+c}$
      uitwerking: |-
        $A=a(b+c)$, dus $a=\tfrac{A}{b+c}$.
    - opgave: |-
        $y = x + ax$ \ ($x$)
      antwoord: |-
        $x=\tfrac{y}{1+a}$
      uitwerking: |-
        $y=x(1+a)$, dus $x=\tfrac{y}{1+a}$.
    - opgave: |-
        $T = at + bt$ \ ($t$)
      antwoord: |-
        $t=\tfrac{T}{a+b}$
      uitwerking: |-
        $T=t(a+b)$, dus $t=\tfrac{T}{a+b}$.
    - opgave: |-
        $3x + y = ax - 2$ \ ($x$), met $a \neq 3$
      antwoord: |-
        $x=\tfrac{y+2}{a-3}$
      uitwerking: |-
        $y+2=ax-3x=x(a-3)$, dus $x=\tfrac{y+2}{a-3}$.

- id: h3-o19
  pakketten: [4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    fysica: eenparig versnelde beweging
  opgave: |-
    Een voorwerp met beginsnelheid $v_0$ en een constante versnelling $a$ heeft na $t$ seconden een snelheid $v = v_0 + a \cdot t$ (in m/s).
  lijst: enumerate
  delen:
    - opgave: |-
        Vorm om naar $a$ en naar $t$.
      antwoord: |-
        $a=\tfrac{v-v_0}{t}$, $t=\tfrac{v-v_0}{a}$
      uitwerking: |-
        $v-v_0=at$. Deel door $t$, of door $a$.
    - opgave: |-
        Een auto trekt op van 0 tot 27~m/s in 9~s. Hoe groot is de versnelling?
      antwoord: |-
        3~m/s$^2$
      uitwerking: |-
        $a=\tfrac{27-0}{9}=3$~m/s$^2$.
    - opgave: |-
        Een auto remt van 20~m/s tot stilstand met een versnelling van $-5$~m/s$^2$. Hoe lang duurt dat?
      antwoord: |-
        4~s
      uitwerking: |-
        $t=\tfrac{0-20}{-5}=4$~s.

- id: h3-o20
  pakketten: [4, 5]
  soort: opdracht
  niveau: 2
  thema: |-
    fysica: bewegingsenergie
  opgave: |-
    Een voorwerp met massa $m$ (in kg) en snelheid $v$ (in m/s) heeft een bewegingsenergie $E = \tfrac12 m v^2$ (in J).
  lijst: enumerate
  delen:
    - opgave: |-
        Een bal van 0,45~kg heeft een bewegingsenergie van 90~J. Hoe snel vliegt hij?
      antwoord: |-
        20~m/s
      uitwerking: |-
        $v=\sqrt{\tfrac{2E}{m}}=\sqrt{\tfrac{180}{0{,}45}}=\sqrt{400}=20$~m/s.
    - opgave: |-
        Hoeveel keer zo groot wordt de bewegingsenergie als de snelheid verdubbelt? Leg uit met de formule.
      antwoord: |-
        4 keer
      uitwerking: |-
        $\tfrac12m(2v)^2=\tfrac12m\cdot4v^2=4\cdot\tfrac12mv^2$: vier keer zo groot. Daarom is de remweg bij 100~km/h veel langer dan bij 50~km/h.

- id: h3-o21
  soort: opdracht
  niveau: 3
  thema: |-
    formules combineren
  opgave: |-
    Een cirkel met straal $r$ heeft omtrek $O = 2\pi r$ en oppervlakte $A = \pi r^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $A = \dfrac{O^2}{4\pi}$. Tip: vorm eerst de formule van de omtrek om naar $r$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        $r=\tfrac{O}{2\pi}$. Vul in: $A=\pi\cdot\tfrac{O^2}{4\pi^2}=\tfrac{O^2}{4\pi}$. Controle met $r=1$: $O=2\pi$, en $\tfrac{4\pi^2}{4\pi}=\pi=A$.
    - opgave: |-
        Met een touw van 10~m span je een cirkel af. Hoe groot is de oppervlakte? Rond af op 0,01~m$^2$.
      antwoord: |-
        7,96~m$^2$
      uitwerking: |-
        $A=\tfrac{100}{4\pi}\approx7{,}96$~m$^2$.

- id: h3-o22
  soort: opdracht
  niveau: 3
  thema: |-
    een formule opstellen en omvormen
  opgave: |-
    Na $n$ toetsen heeft een leerling een gemiddelde $G$. Toon aan dat ze op de volgende toets $s = (n + 1)\,G' - nG$ punten moet halen om op een gemiddelde $G'$ te komen. Tip: hoeveel punten heeft ze na $n$ toetsen in totaal?
  antwoord: |-
    zie uitwerking
  uitwerking: |-
    Na $n$ toetsen heeft ze $nG$ punten. Na de volgende toets is het gemiddelde $G'=\tfrac{nG+s}{n+1}$. Vermenigvuldig met $n+1$: $(n+1)G'=nG+s$, dus $s=(n+1)G'-nG$. Controle: met $n=5$, $G=13{,}2$ en $G'=14$ is $s=84-66=18$.

- id: h3-o23
  soort: opdracht
  niveau: 3
  thema: |-
    Celsius en Fahrenheit
  opgave: |-
    Bij welke temperatuur geven een thermometer in graden Celsius en een in graden Fahrenheit hetzelfde getal aan? Gebruik $F = 1{,}8C + 32$.
  antwoord: |-
    $-40$
  uitwerking: |-
    Stel $F=C$: $C=1{,}8C+32$, $-0{,}8C=32$, $C=-40$. Bij $-40$ graden zijn beide schalen gelijk.

- id: h3-o24
  pakketten: [5]
  soort: opdracht
  niveau: 3
  thema: |-
    fysica: de lenzenformule
  opgave: |-
    Voor een lens met brandpuntsafstand $f$ geldt $\dfrac1f = \dfrac1v + \dfrac1b$, met $v$ de afstand van het voorwerp tot de lens en $b$ de afstand van het beeld tot de lens.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $b = \dfrac{fv}{v - f}$.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        $\tfrac1b=\tfrac1f-\tfrac1v=\tfrac{v-f}{fv}$. Neem van beide leden het omgekeerde: $b=\tfrac{fv}{v-f}$. Of: vermenigvuldig $\tfrac1f=\tfrac1v+\tfrac1b$ met $fvb$: $vb=fb+fv$, dus $b(v-f)=fv$.
    - opgave: |-
        Een lens heeft $f = 5$~cm. Een voorwerp staat op 15~cm. Waar ontstaat het beeld?
      antwoord: |-
        op 7,5~cm
      uitwerking: |-
        $b=\tfrac{5\cdot15}{15-5}=7{,}5$~cm. Controle: $\tfrac1{15}+\tfrac1{7{,}5}=\tfrac{3}{15}=\tfrac15$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Vorm $F = m \cdot a$ om naar $m$.
  antwoord: |-
    $m=\tfrac{F}{a}$
  uitwerking: |-
    Deel beide leden door $a$.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Vorm $y = 4x - 10$ om naar $x$.
  antwoord: |-
    $x=\tfrac{y+10}{4}$
  uitwerking: |-
    $y+10=4x$, dus $x=\tfrac{y+10}{4}$.

- id: h3-t3
  soort: test
  niveau: 1
  opgave: |-
    Het volume van een piramide is $V = \dfrac{G \cdot h}{3}$. Vorm om naar $h$.
  antwoord: |-
    $h=\tfrac{3V}{G}$
  uitwerking: |-
    $3V=Gh$, dus $h=\tfrac{3V}{G}$.

- id: h3-t4
  soort: test
  niveau: 2
  opgave: |-
    Vorm $I = \dfrac{U}{R}$ om naar $R$.
  antwoord: |-
    $R=\tfrac{U}{I}$
  uitwerking: |-
    $IR=U$, dus $R=\tfrac UI$.

- id: h3-t5
  soort: test
  niveau: 2
  opgave: |-
    De oppervlakte van een bol met straal $r$ is $A = 4\pi r^2$. Vorm om naar $r$.
  antwoord: |-
    $r=\sqrt{\tfrac{A}{4\pi}}$
  uitwerking: |-
    $\tfrac{A}{4\pi}=r^2$, en $r>0$: $r=\sqrt{\tfrac{A}{4\pi}}$.

- id: h3-t6
  soort: test
  niveau: 2
  opgave: |-
    Vorm $F = 1{,}8C + 32$ om naar $C$. Hoeveel graden Celsius is $95\,^\circ$F?
  antwoord: |-
    $C=\tfrac{F-32}{1{,}8}$; $35\,^\circ$C
  uitwerking: |-
    $C=\tfrac{F-32}{1{,}8}=\tfrac{63}{1{,}8}=35$.

- id: h3-t7
  soort: test
  niveau: 2
  opgave: |-
    Een loodgieter rekent $K = 45 + 38u$ euro, met $u$ het aantal uren werk. Vorm om naar $u$. Hoe lang werkte hij voor een rekening van 140 euro?
  antwoord: |-
    $u=\tfrac{K-45}{38}$; 2,5 uur
  uitwerking: |-
    $u=\tfrac{K-45}{38}=\tfrac{95}{38}=2{,}5$ uur.

- id: h3-t8
  pakketten: [4, 5]
  soort: test
  niveau: 2
  opgave: |-
    De prijs met 6\,\% btw is $B = p + 0{,}06p$. Vorm om naar $p$. Hoeveel kost een boek zonder btw als het met btw 26,50 euro kost?
  antwoord: |-
    $p=\tfrac{B}{1{,}06}$; 25 euro
  uitwerking: |-
    $B=p(1+0{,}06)=1{,}06p$, dus $p=\tfrac{B}{1{,}06}=\tfrac{26{,}50}{1{,}06}=25$ euro.
