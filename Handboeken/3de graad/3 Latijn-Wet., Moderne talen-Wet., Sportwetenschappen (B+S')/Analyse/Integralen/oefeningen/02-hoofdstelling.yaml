# Oefeningen van hoofdstuk 2. Zie oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken de afgeleide van:
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{x^3}{3} + 5$
      antwoord: |-
        $x^2$
      uitwerking: |-
        $x^2$; de constante valt weg.
    - opgave: |-
        $\ln x$
      antwoord: |-
        $\tfrac1x$
      uitwerking: |-
        $\tfrac1x$.
    - opgave: |-
        $\sin 2x$
      antwoord: |-
        $2\cos 2x$
      uitwerking: |-
        Kettingregel: $2\cos 2x$.
    - opgave: |-
        $\e^{3x}$
      antwoord: |-
        $3\e^{3x}$
      uitwerking: |-
        Kettingregel: $3\e^{3x}$.
    - opgave: |-
        $\sqrt{x}$
      antwoord: |-
        $\tfrac{1}{2\sqrt{x}}$
      uitwerking: |-
        $\tfrac12 x^{-1/2}=\tfrac{1}{2\sqrt{x}}$.
    - opgave: |-
        $\tan x$
      antwoord: |-
        $\tfrac{1}{\cos^2 x}$
      uitwerking: |-
        $\tfrac{1}{\cos^2 x}$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem $f(t) = t + 1$ en noem $A(x)$ de oppervlakte onder de grafiek van $f$ van 0 tot $x$, dus $A(x) = \int_0^x (t + 1)\dt$ met $x \geqslant 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $A(1)$, $A(2)$ en $A(3)$ met de formule voor een trapezium.
      antwoord: |-
        $\tfrac32$; 4; $\tfrac{15}{2}$
      uitwerking: |-
        $A(1)=\dfrac{1+2}{2}\cdot 1=\tfrac32$, $A(2)=\dfrac{1+3}{2}\cdot 2=4$ en $A(3)=\dfrac{1+4}{2}\cdot 3=\tfrac{15}{2}$.
    - opgave: |-
        Stel een voorschrift op voor $A(x)$.
      antwoord: |-
        $\tfrac{x^2}{2}+x$
      uitwerking: |-
        $A(x)=\dfrac{1+(x+1)}{2}\cdot x=\dfrac{x^2}{2}+x$.
    - opgave: |-
        Bereken $A'(x)$. Wat valt op?
      antwoord: |-
        $A'(x)=x+1=f(x)$
      uitwerking: |-
        $A'(x)=x+1$: de afgeleide van de oppervlaktefunctie is de functie zelf.
    - opgave: |-
        Bereken $\int_1^3 (t + 1)\dt$ met een figuur en vergelijk met $A(3) - A(1)$.
      antwoord: |-
        6
      uitwerking: |-
        Trapezium: $\dfrac{2+4}{2}\cdot 2=6$, en $\tfrac{15}{2}-\tfrac32=6$.

- id: h2-afgeleide
  soort: kort
  opgave: |-
    Bereken de afgeleide van:
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_0^x \cos(t^2)\dt$
      antwoord: |-
        $\cos(x^2)$
      uitwerking: |-
        Hoofdstelling.
    - opgave: |-
        $\ig_x^{2} \e^{t^2}\dt$
      antwoord: |-
        $-\e^{x^2}$
      uitwerking: |-
        Eerst de grenzen wisselen, dat geeft een minteken.
    - opgave: |-
        $\ig_0^{3x} \cos(t^2)\dt$
      antwoord: |-
        $3\cos(9x^2)$
      uitwerking: |-
        Kettingregel: $\cos\bigl((3x)^2\bigr)\cdot 3=3\cos(9x^2)$.

- id: h2-prim-verken
  soort: kort
  opgave: |-
    Welke functies hebben dezelfde afgeleide?
  lijst: enumerate
  delen:
    - opgave: |-
        Geef vier verschillende functies met afgeleide $2x$. Schets hun grafieken. Hoe liggen die ten opzichte van elkaar?
      antwoord: |-
        bv.\ $x^2$, $x^2+1$, $x^2-2$, $x^2+\pi$: dezelfde parabool, verticaal verschoven
      uitwerking: |-
        Elke functie $x^2+c$ heeft afgeleide $2x$, want de constante valt weg. De grafieken zijn verticaal verschoven parabolen.
    - opgave: |-
        Welke functies hebben op een interval als afgeleide 0?
      antwoord: |-
        de constante functies
      uitwerking: |-
        Is de afgeleide overal 0, dan is de helling overal 0: de grafiek is een horizontale rechte.
    - opgave: |-
        Stel dat $F$ en $G$ op een interval allebei $f$ als afgeleide hebben. Wat is de afgeleide van $G - F$? Wat besluit je over $G - F$?
      antwoord: |-
        $(G-F)'=0$, dus $G-F$ is constant
      uitwerking: |-
        $(G-F)'=f-f=0$. Volgens vraag b is $G-F$ dan constant: twee functies met dezelfde afgeleide verschillen hoogstens een constante.

- id: h2-hoofd
  soort: kort
  opgave: |-
    Bereken $\ig_1^4 x\dx$ met een primitieve. Controleer met een figuur.
  antwoord: |-
    $\tfrac{15}{2}$
  uitwerking: |-
    $\Bigl[\dfrac{x^2}{2}\Bigr]_1^4=8-\tfrac12=\tfrac{15}{2}$. Het trapezium: $\dfrac{1+4}{2}\cdot 3=\tfrac{15}{2}$.

- id: h2-basis
  soort: kort
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_0^{\pi} \sin x\dx$
      antwoord: |-
        2
      uitwerking: |-
        $\bigl[-\cos x\bigr]_0^{\pi}=1+1=2$.
    - opgave: |-
        $\ig_1^{8} \sqrt[3]{x}\dx$
      antwoord: |-
        $\tfrac{45}{4}$
      uitwerking: |-
        $\Bigl[\tfrac34 x^{4/3}\Bigr]_1^8=\tfrac34(16-1)=\tfrac{45}{4}$.
    - opgave: |-
        $\ig_0^{1/2} \dfrac{1}{\sqrt{1 - x^2}}\dx$
      antwoord: |-
        $\tfrac{\pi}{6}$
      uitwerking: |-
        $\bgsin\tfrac12-\bgsin 0=\tfrac{\pi}{6}$.

- id: h2-lin
  soort: kort
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_1^2 \Bigl(4x^3 - \dfrac{3}{x^2}\Bigr)\dx$
      antwoord: |-
        $\tfrac{27}{2}$
      uitwerking: |-
        $\Bigl[x^4+\dfrac3x\Bigr]_1^2=\bigl(16+\tfrac32\bigr)-(1+3)=\tfrac{27}{2}$.
    - opgave: |-
        $\ig_1^4 \dfrac{x - 2}{\sqrt{x}}\dx$
      antwoord: |-
        $\tfrac23$
      uitwerking: |-
        $\displaystyle\int_1^4(x^{1/2}-2x^{-1/2})\dx=\Bigl[\tfrac23 x^{3/2}-4x^{1/2}\Bigr]_1^4=\bigl(\tfrac{16}{3}-8\bigr)-\bigl(\tfrac23-4\bigr)=\tfrac23$.

- id: h2-asopp
  soort: kort
  opgave: |-
    Bereken de oppervlakte tussen de grafiek van $f(x) = x^3 - x$ en de horizontale as op $[-1, 2]$. Bereken ook $\ig_{-1}^{2} f(x)\dx$.
  antwoord: |-
    Oppervlakte $\tfrac{11}{4}$ en integraal $\tfrac94$
  uitwerking: |-
    Nulpunten $-1$, 0 en 1, met $F(x)=\tfrac{x^4}{4}-\tfrac{x^2}{2}$. Op $[-1,0]$: $0-(-\tfrac14)=\tfrac14$. Op $[0,1]$: $-\tfrac14-0=-\tfrac14$. Op $[1,2]$: $2-(-\tfrac14)=\tfrac94$.\\
    Oppervlakte: $\tfrac14+\tfrac14+\tfrac94=\tfrac{11}{4}$. Integraal: $\tfrac14-\tfrac14+\tfrac94=\tfrac94$.
    \figuren{\begin{tikzpicture}[x=.85cm,y=.5cm,font=\scriptsize]
      \gebied[accent!30]{-1}{0}{(\x)^3-\x}
      \gebied[accent!15]{0}{1}{(\x)^3-\x}
      \gebied[accent!30]{1}{2}{(\x)^3-\x}
      \rooster{-1}{1}{2}{-1}{1}{6}
      \kromme{-1}{2}{(\x)^3-\x}
    \end{tikzpicture}}

- id: h2-tussen
  soort: kort
  opgave: |-
    Bereken de oppervlakte van het gebied ingesloten door de grafieken van $f(x) = 4 - x^2$ en $g(x) = x^2 - 2x$.
  antwoord: |-
    9
  uitwerking: |-
    $4-x^2=x^2-2x$ geeft $x^2-x-2=0$, dus $x=-1$ of $x=2$. In $x=0$ ligt $f$ bovenaan.\\
    $\displaystyle\int_{-1}^{2}(4+2x-2x^2)\dx=\Bigl[4x+x^2-\tfrac23 x^3\Bigr]_{-1}^{2}=\tfrac{20}{3}-\bigl(-\tfrac73\bigr)=9$.
    \figuren{\begin{tikzpicture}[x=.8cm,y=.42cm,font=\scriptsize]
      \gebiedtussen{-1}{2}{4-(\x)^2}{(\x)^2-2*\x}
      \rooster{-2}{1}{3}{-1}{1}{5}
      \kromme{-1.8}{2.5}{4-(\x)^2}
      \kromme{-1.1}{2.9}{(\x)^2-2*\x}
    \end{tikzpicture}}

- id: h2-dp
  soort: opdracht
  niveau: 1
  thema: |-
    drill: primitieven zoeken
  opgave: |-
    Geef een primitieve van:
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^7$
      antwoord: |-
        $\tfrac{x^8}{8}$
    - opgave: |-
        $\dfrac{1}{x^4}$
      antwoord: |-
        $-\tfrac{1}{3x^3}$
    - opgave: |-
        $x^{2/3}$
      antwoord: |-
        $\tfrac35 x^{5/3}$
    - opgave: |-
        $\sqrt{x}$
      antwoord: |-
        $\tfrac23 x^{3/2}$
    - opgave: |-
        $5$
      antwoord: |-
        $5x$
    - opgave: |-
        $3^x$
      antwoord: |-
        $\tfrac{3^x}{\ln 3}$
    - opgave: |-
        $-2\sin x$
      antwoord: |-
        $2\cos x$
    - opgave: |-
        $\dfrac{3}{1 + x^2}$
      antwoord: |-
        $3\bgtan x$
    - opgave: |-
        $\dfrac{2}{x}$
      antwoord: |-
        $2\ln|x|$
    - opgave: |-
        $\e^x + x$
      antwoord: |-
        $\e^x+\tfrac{x^2}{2}$
    - opgave: |-
        $\dfrac{1}{\cos^2 x}$
      antwoord: |-
        $\tan x$
    - opgave: |-
        $4x^3 - 6x$
      antwoord: |-
        $x^4-3x^2$
  uitwerking: |-
    Telkens rechtstreeks uit de tabel, na het herschrijven als macht. Bijvoorbeeld \textbf{b.}~$x^{-4}$ wordt $\tfrac{x^{-3}}{-3}$. Controleer door af te leiden. Elke andere primitieve verschilt een constante.

- id: h2-d1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: veeltermen en machten
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_0^2 (3x^2 + 2x)\dx$
      antwoord: |-
        12
    - opgave: |-
        $\ig_{-1}^{1} (x^2 + 1)\dx$
      antwoord: |-
        $\tfrac83$
    - opgave: |-
        $\ig_1^3 (4x^3 - 1)\dx$
      antwoord: |-
        78
    - opgave: |-
        $\ig_0^4 \sqrt{x}\dx$
      antwoord: |-
        $\tfrac{16}{3}$
    - opgave: |-
        $\ig_1^9 \sqrt{x}\dx$
      antwoord: |-
        $\tfrac{52}{3}$
    - opgave: |-
        $\ig_1^4 \dfrac{1}{\sqrt{x}}\dx$
      antwoord: |-
        2
    - opgave: |-
        $\ig_1^2 \dfrac{1}{x^2}\dx$
      antwoord: |-
        $\tfrac12$
    - opgave: |-
        $\ig_1^2 \dfrac{1}{x^3}\dx$
      antwoord: |-
        $\tfrac38$
    - opgave: |-
        $\ig_1^4 \Bigl(2x + \dfrac{1}{\sqrt{x}}\Bigr)\dx$
      antwoord: |-
        17
    - opgave: |-
        $\ig_{-2}^{2} (x^3 - x + 1)\dx$
      antwoord: |-
        4
    - opgave: |-
        $\ig_1^{\e} \dfrac2x\dx$
      antwoord: |-
        2
    - opgave: |-
        $\ig_0^{\ln 3} \e^x\dx$
      antwoord: |-
        2
  uitwerking: |-
    \textbf{a.}~$\bigl[x^3+x^2\bigr]_0^2=12$. \quad \textbf{b.}~$\bigl[\tfrac{x^3}{3}+x\bigr]_{-1}^{1}=\tfrac83$. \quad \textbf{c.}~$\bigl[x^4-x\bigr]_1^3=78$.\\
    \textbf{d.}~$\bigl[\tfrac23 x^{3/2}\bigr]_0^4=\tfrac{16}{3}$. \quad \textbf{e.}~$\tfrac23(27-1)=\tfrac{52}{3}$. \quad \textbf{f.}~$\bigl[2\sqrt{x}\bigr]_1^4=2$.\\
    \textbf{g.}~$\bigl[-\tfrac1x\bigr]_1^2=\tfrac12$. \quad \textbf{h.}~$\bigl[-\tfrac{1}{2x^2}\bigr]_1^2=\tfrac38$. \quad \textbf{i.}~$\bigl[x^2+2\sqrt{x}\bigr]_1^4=20-3=17$.\\
    \textbf{j.}~$x^3-x$ is oneven en geeft 0; de rechthoek geeft 4. \quad \textbf{k.}~$\bigl[2\ln|x|\bigr]_1^{\e}=2$. \quad \textbf{l.}~$3-1=2$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    primitieve controleren
  opgave: |-
    Controleer met de afgeleide.
  lijst: enumerate
  delen:
    - opgave: |-
        Is $F(x) = x \ln x - x$ een primitieve van $f(x) = \ln x$?
      antwoord: |-
        ja
      uitwerking: |-
        $F'(x)=\ln x+x\cdot\tfrac1x-1=\ln x$.
    - opgave: |-
        Is $F(x) = \sin^2 x$ een primitieve van $f(x) = \sin 2x$? En $G(x) = -\cos^2 x$? Hoe kan dat?
      antwoord: |-
        beide; ze verschillen de constante 1
      uitwerking: |-
        $F'(x)=2\sin x\cos x=\sin 2x$ en $G'(x)=2\cos x\sin x=\sin 2x$. Ze verschillen een constante: $F(x)-G(x)=\sin^2 x+\cos^2 x=1$.

- id: h2-d2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: goniometrisch, exponentieel, cyclometrisch
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_{\pi/6}^{\pi/2} \sin x\dx$
      antwoord: |-
        $\tfrac{\sqrt{3}}{2}$
    - opgave: |-
        $\ig_0^{\pi/3} \cos x\dx$
      antwoord: |-
        $\tfrac{\sqrt{3}}{2}$
    - opgave: |-
        $\ig_0^{\pi/4} \dfrac{1}{\cos^2 x}\dx$
      antwoord: |-
        1
    - opgave: |-
        $\ig_{\pi/4}^{\pi/2} \dfrac{1}{\sin^2 x}\dx$
      antwoord: |-
        1
    - opgave: |-
        $\ig_{1}^{\sqrt{3}} \dfrac{1}{1 + x^2}\dx$
      antwoord: |-
        $\tfrac{\pi}{12}$
    - opgave: |-
        $\ig_0^{\sqrt{3}/2} \dfrac{1}{\sqrt{1 - x^2}}\dx$
      antwoord: |-
        $\tfrac{\pi}{3}$
    - opgave: |-
        $\ig_0^2 2^x\dx$
      antwoord: |-
        $\tfrac{3}{\ln 2}$
    - opgave: |-
        $\ig_{-1}^{1} \e^x\dx$
      antwoord: |-
        $\e-\tfrac{1}{\e}$
    - opgave: |-
        $\ig_{-\e}^{-1} \dfrac1x\dx$
      antwoord: |-
        $-1$
  uitwerking: |-
    \textbf{a.}~$\bigl[-\cos x\bigr]_{\pi/6}^{\pi/2}=\tfrac{\sqrt{3}}{2}$. \quad \textbf{b.}~$\sin\tfrac{\pi}{3}$. \quad \textbf{c.}~$\tan\tfrac{\pi}{4}=1$. \quad \textbf{d.}~$\bigl[-\cot x\bigr]_{\pi/4}^{\pi/2}=1$.\\
    \textbf{e.}~$\tfrac{\pi}{3}-\tfrac{\pi}{4}$. \quad \textbf{f.}~$\bgsin\tfrac{\sqrt{3}}{2}=\tfrac{\pi}{3}$. \quad \textbf{g.}~$\tfrac{4-1}{\ln 2}$. \quad \textbf{h.}~$\e-\e^{-1}$. \quad \textbf{i.}~$\ln 1-\ln\e=-1$.

- id: h2-a1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: oppervlakte met de as en tussen krommen
  opgave: |-
    Bereken de oppervlakte van het gebied ingesloten door:
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = x$ en $y = x^2$
      antwoord: |-
        $\tfrac16$
      uitwerking: |-
        $\displaystyle\int_0^1(x-x^2)\dx=\tfrac16$.
    - opgave: |-
        $y = 6x - x^2$ en de horizontale as
      antwoord: |-
        36
      uitwerking: |-
        $\Bigl[3x^2-\tfrac{x^3}{3}\Bigr]_0^6=36$.
    - opgave: |-
        $y = x^2 - 4$ en de horizontale as
      antwoord: |-
        $\tfrac{32}{3}$
      uitwerking: |-
        De grafiek ligt onder de as op $[-2,2]$: $\displaystyle\int_{-2}^{2}(4-x^2)\dx=\tfrac{32}{3}$.
    - opgave: |-
        $y = x^2$ en $y = 3x$
      antwoord: |-
        $\tfrac92$
      uitwerking: |-
        $\displaystyle\int_0^3(3x-x^2)\dx=\tfrac{27}{2}-9=\tfrac92$.
    - opgave: |-
        $y = 1 - x^4$ en de horizontale as
      antwoord: |-
        $\tfrac85$
      uitwerking: |-
        $\displaystyle\int_{-1}^{1}(1-x^4)\dx=\tfrac85$.
    - opgave: |-
        $y = x^2$ en $y = 2 - x^2$
      antwoord: |-
        $\tfrac83$
      uitwerking: |-
        Snijpunten $\pm 1$: $\displaystyle\int_{-1}^{1}(2-2x^2)\dx=\tfrac83$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    hoofdstelling, deel 1
  opgave: |-
    Bereken de afgeleide van:
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_2^x \sqrt{t^4 + 1}\dt$
      antwoord: |-
        $\sqrt{x^4+1}$
      uitwerking: |-
        Hoofdstelling.
    - opgave: |-
        $\ig_x^3 t^2 \e^t\dt$
      antwoord: |-
        $-x^2\e^x$
      uitwerking: |-
        Grenzen wisselen geeft een minteken.
    - opgave: |-
        $\ig_0^{\sin x} \dfrac{1}{1 + t^3}\dt$
      antwoord: |-
        $\dfrac{\cos x}{1+\sin^3 x}$
      uitwerking: |-
        Kettingregel: $\dfrac{1}{1+\sin^3 x}\cdot\cos x$.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    hoofdstelling, deel 2
  opgave: |-
    $F$ is een primitieve van $f$ met $F(1) = 2$ en $F(5) = 7$. Bereken:
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_1^5 f(x)\dx$
      antwoord: |-
        5
      uitwerking: |-
        $7-2=5$.
    - opgave: |-
        $\ig_5^1 f(x)\dx$
      antwoord: |-
        $-5$
      uitwerking: |-
        Grenzen wisselen: $-5$.
    - opgave: |-
        $\ig_1^5 \bigl(f(x) + 3\bigr)\dx$
      antwoord: |-
        17
      uitwerking: |-
        $5+3\cdot 4=17$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    hoofdstelling niet van toepassing
  opgave: |-
    Tom berekent: $\ig_{-1}^{1} \dfrac{1}{x^2}\dx = \Bigl[-\dfrac1x\Bigr]_{-1}^{1} = -1 - 1 = -2$. Waaraan zie je dat dit niet kan kloppen? Wat is er misgegaan?
  antwoord: |-
    De functie is niet continu op $[-1,1]$.
  uitwerking: |-
    De integrand is overal positief, dus de integraal kan niet negatief zijn. De fout: $\tfrac{1}{x^2}$ bestaat niet in $x=0$, dat binnen het interval ligt. De hoofdstelling vraagt een continue functie op het hele interval.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    product: klassieke fout
  opgave: |-
    Sara berekent: $\ig_0^2 x(x + 1)\dx = \ig_0^2 x\dx \cdot \ig_0^2 (x + 1)\dx = 2 \cdot 4 = 8$. Klopt dat? Bereken de integraal correct.
  antwoord: |-
    Nee; de integraal is $\tfrac{14}{3}$.
  uitwerking: |-
    Nee: er bestaat geen productregel van die vorm. Werk eerst uit: $\displaystyle\int_0^2(x^2+x)\dx=\Bigl[\tfrac{x^3}{3}+\tfrac{x^2}{2}\Bigr]_0^2=\tfrac83+2=\tfrac{14}{3}$.

- id: h2-okies
  soort: opdracht
  niveau: 2
  thema: |-
    grafiek van een primitieve kiezen
  opgave: |-
    Eén figuur toont de grafiek van $f$. Welke van de grafieken A, B of C is de grafiek van een primitieve van $f$? Let op waar $f$ positief en negatief is, en reken niet.

    \figuren{\begin{tikzpicture}[x=.52cm,y=.42cm,font=\scriptsize]
      \rooster{-2}{1}{2}{-2}{1}{3}
      \kromme{-2}{2}{(\x)^2-1}
      \node[above,text=accent] at (-1,3) {$f$};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.52cm,y=.42cm,font=\scriptsize]
      \rooster{-2}{1}{2}{-2}{1}{3}
      \kromme{-2}{2}{(\x)^3/3-\x}
      \node[above,text=accent] at (-1,3) {A};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.52cm,y=.42cm,font=\scriptsize]
      \rooster{-2}{1}{2}{-2}{1}{3}
      \kromme{-1}{1.5}{2*\x}
      \node[above,text=accent] at (-1,3) {B};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.52cm,y=.42cm,font=\scriptsize]
      \rooster{-2}{1}{2}{-2}{1}{3}
      \kromme{-2}{2}{\x-(\x)^3/3}
      \node[above,text=accent] at (-1,3) {C};
    \end{tikzpicture}}
  antwoord: |-
    A
  uitwerking: |-
    $f$ is positief voor $|x|>1$ en negatief voor $|x|<1$. Een primitieve stijgt dus voor $|x|>1$ en daalt voor $|x|<1$. Dat is grafiek A. B is de afgeleide van $f$, en C is het tegengestelde van A.

- id: h2-d3
  soort: opdracht
  niveau: 2
  thema: |-
    drill: eerst uitwerken of splitsen
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_1^2 \dfrac{(x^2 + 1)^2}{x^2}\dx$
      antwoord: |-
        $\tfrac{29}{6}$
      uitwerking: |-
        $x^2+2+x^{-2}$, met primitieve $\tfrac{x^3}{3}+2x-\tfrac1x$: $\tfrac{37}{6}-\tfrac43=\tfrac{29}{6}$.
    - opgave: |-
        $\ig_1^2 \dfrac{(x - 1)^2}{x}\dx$
      antwoord: |-
        $\ln 2-\tfrac12$
      uitwerking: |-
        $x-2+\tfrac1x$: $\bigl[\tfrac{x^2}{2}-2x+\ln|x|\bigr]_1^2=\ln 2-\tfrac12$.
    - opgave: |-
        $\ig_1^4 \dfrac{x^2 + 3x}{\sqrt{x}}\dx$
      antwoord: |-
        $\tfrac{132}{5}$
      uitwerking: |-
        $x^{3/2}+3x^{1/2}$: $\bigl[\tfrac25 x^{5/2}+2x^{3/2}\bigr]_1^4=\bigl(\tfrac{64}{5}+16\bigr)-\bigl(\tfrac25+2\bigr)=\tfrac{132}{5}$.
    - opgave: |-
        $\ig_0^1 (2x + 1)^2\dx$
      antwoord: |-
        $\tfrac{13}{3}$
      uitwerking: |-
        $4x^2+4x+1$: $\tfrac43+2+1=\tfrac{13}{3}$.
    - opgave: |-
        $\ig_0^{\pi/4} (1 + \tan^2 x)\dx$
      antwoord: |-
        1
      uitwerking: |-
        $1+\tan^2 x=\tfrac{1}{\cos^2 x}$: $\tan\tfrac{\pi}{4}=1$.
    - opgave: |-
        $\ig_1^2 \dfrac{x^3 - 1}{x^2}\dx$
      antwoord: |-
        1
      uitwerking: |-
        $x-x^{-2}$: $\bigl[\tfrac{x^2}{2}+\tfrac1x\bigr]_1^2=\tfrac52-\tfrac32=1$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    absolute waarde in de integrand
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_0^3 |x^2 - 1|\dx$
      antwoord: |-
        $\tfrac{22}{3}$
      uitwerking: |-
        $\displaystyle\int_0^1(1-x^2)\dx+\int_1^3(x^2-1)\dx=\tfrac23+\tfrac{20}{3}=\tfrac{22}{3}$.
    - opgave: |-
        $\ig_0^{2\pi} |\sin x|\dx$
      antwoord: |-
        4
      uitwerking: |-
        $2\displaystyle\int_0^{\pi}\sin x\dx=4$.
    - opgave: |-
        $\ig_0^{\pi} |\cos x|\dx$
      antwoord: |-
        2
      uitwerking: |-
        $2\displaystyle\int_0^{\pi/2}\cos x\dx=2$.
    - opgave: |-
        $\ig_{-2}^{2} |x^2 - 1|\dx$
      antwoord: |-
        4
      uitwerking: |-
        De functie is even: $2\Bigl(\tfrac23+\tfrac43\Bigr)=4$.
    - opgave: |-
        $\ig_0^{3} |x - 2|\,x\dx$
      antwoord: |-
        $\tfrac83$
      uitwerking: |-
        $\displaystyle\int_0^2(2x-x^2)\dx+\int_2^3(x^2-2x)\dx=\tfrac43+\tfrac43=\tfrac83$.
    - opgave: |-
        $\ig_{-1}^{1} |x^3|\dx$
      antwoord: |-
        $\tfrac12$
      uitwerking: |-
        $2\displaystyle\int_0^1 x^3\dx=\tfrac12$.
        \figuren{\begin{tikzpicture}[x=.8cm,y=.25cm,font=\scriptsize]
          \gebied{0}{1}{1-(\x)^2}
          \gebied{1}{3}{(\x)^2-1}
          \rooster{0}{1}{3}{0}{2}{8}
          \kromme{0}{1}{1-(\x)^2}
          \kromme{1}{3}{(\x)^2-1}
        \end{tikzpicture}}

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    stuksgewijs gedefinieerd
  opgave: |-
    De functie $f$ is $x^2$ voor $x \leqslant 1$ en $2 - x$ voor $x > 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $f$ continu is. Teken de grafiek op $[0, 3]$.
      uitwerking: |-
        Beide voorschriften geven 1 in $x=1$.
    - opgave: |-
        Bereken $\ig_0^3 f(x)\dx$.
      antwoord: |-
        $\tfrac13$
      uitwerking: |-
        $\displaystyle\int_0^1 x^2\dx+\int_1^3(2-x)\dx=\tfrac13+\Bigl[2x-\tfrac{x^2}{2}\Bigr]_1^3=\tfrac13+\bigl(\tfrac32-\tfrac32\bigr)=\tfrac13$.
    - opgave: |-
        Bereken de oppervlakte tussen de grafiek en de horizontale as op $[0, 3]$.
      antwoord: |-
        $\tfrac43$
      uitwerking: |-
        Op $[1,2]$ telt $\tfrac12$ positief, op $[2,3]$ telt $\tfrac12$ negatief. De oppervlakte is $\tfrac13+\tfrac12+\tfrac12=\tfrac43$.
        \figuren{\begin{tikzpicture}[x=.8cm,y=.65cm,font=\scriptsize]
          \gebied{0}{1}{(\x)^2}
          \fill[accent!30] (1,0) -- (1,1) -- (2,0) -- cycle;
          \fill[accent!15] (2,0) -- (3,-1) -- (3,0) -- cycle;
          \rooster{0}{1}{3}{-1}{1}{1}
          \kromme{0}{1}{(\x)^2}
          \draw[accent,thick] (1,1) -- (3,-1);
        \end{tikzpicture}}

- id: h2-a2
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte: krommen en randen
  opgave: |-
    Bereken de oppervlakte van elk gekleurd gebied.

    \figuren{\begin{tikzpicture}[x=.42cm,y=.6cm,font=\scriptsize]
      \gebiedtussen{.785}{3.927}{sin(\x r)}{cos(\x r)}
      \roosterleeg{0}{1}{5}{-1}{1}{1}
      \kromme{0}{4.6}{sin(\x r)}
      \kromme[dashed]{0}{4.6}{cos(\x r)}
      \node[above left,inner sep=1pt] at (2.2,1) {a.};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.6cm,y=.6cm,font=\scriptsize]
      \gebiedtussen{1}{3}{\x}{1/\x}
      \rooster{0}{1}{3}{0}{1}{3}
      \kromme{.33}{3}{1/\x}
      \kromme{0}{3}{\x}
      \node[above left,inner sep=1pt] at (1.4,3) {b.};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.85cm,y=.6cm,font=\scriptsize]
      \gebiedtussen{0}{1}{(\x)^2}{2*\x-1}
      \rooster{0}{1}{2}{-1}{1}{2}
      \kromme{0}{1.5}{(\x)^2}
      \kromme{0}{1.5}{2*\x-1}
      \node[above right,inner sep=1pt] at (.05,2) {c.};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.55cm,y=.32cm,font=\scriptsize]
      \gebiedtussen{-2}{1}{4-(\x)^2}{\x+2}
      \rooster{-2}{1}{2}{0}{1}{4}
      \kromme{-2}{2}{4-(\x)^2}
      \kromme{-2}{2}{\x+2}
      \node[above left,inner sep=1pt] at (-.5,4) {d.};
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Tussen $y = \sin x$ en $y = \cos x$ op $\bigl[\tfrac{\pi}{4}, \tfrac{5\pi}{4}\bigr]$.
      antwoord: |-
        $2\sqrt{2}$
      uitwerking: |-
        Op dat interval ligt $\sin x$ bovenaan: $\bigl[-\cos x-\sin x\bigr]_{\pi/4}^{5\pi/4}=\sqrt{2}+\sqrt{2}=2\sqrt{2}$.
    - opgave: |-
        Tussen $y = x$, $y = \tfrac1x$ en de verticale rechte $x = 3$. Rond ook af op twee decimalen.
      antwoord: |-
        $4-\ln 3\approx 2{,}90$
      uitwerking: |-
        De krommen snijden in $x=1$: $\Bigl[\tfrac{x^2}{2}-\ln|x|\Bigr]_1^3=4-\ln 3\approx 2{,}90$.
    - opgave: |-
        Tussen de parabool $y = x^2$, de raaklijn in het punt $(1, 1)$ en de verticale as.
      antwoord: |-
        $\tfrac13$
      uitwerking: |-
        De raaklijn is $y=2x-1$: $\displaystyle\int_0^1(x^2-2x+1)\dx=\tfrac13$.
    - opgave: |-
        Tussen $y = 4 - x^2$ en $y = x + 2$.
      antwoord: |-
        $\tfrac92$
      uitwerking: |-
        $4-x^2=x+2$ geeft $x=-2$ of $x=1$: $\displaystyle\int_{-2}^{1}(2-x-x^2)\dx=\tfrac92$.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    verplaatsing en afgelegde weg
  opgave: |-
    Een voorwerp beweegt op een rechte met snelheid $v(t) = 3t^2 - 12t + 9$ (in m/s) op $[0, 4]$. Bereken de verplaatsing en de afgelegde weg.
  antwoord: |-
    Verplaatsing 4 m en afgelegde weg 12 m
  uitwerking: |-
    $v(t)=3(t-1)(t-3)$, met primitieve $F(t)=t^3-6t^2+9t$ en $F(0)=0$, $F(1)=4$, $F(3)=0$, $F(4)=4$.\\
    Verplaatsing: $F(4)-F(0)=4$ m. Afgelegde weg: $4+4+4=12$ m.
    \figuren{\begin{tikzpicture}[x=.85cm,y=.22cm,font=\scriptsize]
      \gebied{0}{1}{3*(\x)^2-12*\x+9}
      \gebied[accent!15]{1}{3}{3*(\x)^2-12*\x+9}
      \gebied{3}{4}{3*(\x)^2-12*\x+9}
      \rooster{0}{1}{4}{-3}{3}{9}
      \kromme{0}{4}{3*(\x)^2-12*\x+9}
    \end{tikzpicture}}

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    marginale kosten
  opgave: |-
    Een fabriek heeft marginale kosten $K'(q) = 0{,}3q^2 - 2q + 10$ (in euro per stuk), met $q$ het aantal stuks.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat betekent $\ig_{0}^{10} K'(q)\,\mathrm{d}q$?
      uitwerking: |-
        De extra kosten om de eerste 10 stuks te maken: $K(10)-K(0)$.
    - opgave: |-
        Bereken die integraal.
      antwoord: |-
        100
      uitwerking: |-
        $\bigl[0{,}1q^3-q^2+10q\bigr]_0^{10}=100-100+100=100$.
    - opgave: |-
        De vaste kosten (bij $q = 0$) zijn \eur 500. Bereken de totale kosten voor 20 stuks.
      antwoord: |-
        \eur 1100
      uitwerking: |-
        $K(20)=500+\bigl(800-400+200\bigr)=1100$.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    integraalfunctie onderzoeken
  opgave: |-
    Gegeven: $g(x) = \ig_0^x (t^2 - 4)\dt$. Bereken $g'(x)$ en bepaal waar $g$ stijgt en daalt. Bereken de lokale extrema van $g$.
  antwoord: |-
    Stijgend voor $x\leqslant -2$ en $x\geqslant 2$; maximum $\tfrac{16}{3}$ en minimum $-\tfrac{16}{3}$
  uitwerking: |-
    $g'(x)=x^2-4$ is positief voor $|x|>2$ en negatief voor $|x|<2$. Dus een lokaal maximum in $x=-2$ en een lokaal minimum in $x=2$.\\
    $g(x)=\tfrac{x^3}{3}-4x$, dus $g(2)=\tfrac83-8=-\tfrac{16}{3}$ en $g(-2)=\tfrac{16}{3}$.
    \figuren{\begin{tikzpicture}[x=.6cm,y=.2cm,font=\scriptsize]
      \rooster{-4}{2}{4}{-6}{2}{6}
      \kromme{-3.6}{3.6}{(\x)^3/3-4*\x}
      \draw[lijngrijs,dashed] (-2,0) -- (-2,5.33) (2,0) -- (2,-5.33);
    \end{tikzpicture}}

- id: h2-o20
  soort: opdracht
  niveau: 2
  thema: |-
    integraalfunctie uit een grafiek
  opgave: |-
    De figuur toont de grafiek van $f$. Gegeven: $G(x) = \ig_0^x f(t)\dt$.

    \begin{tikzpicture}[x=1cm,y=.55cm,font=\scriptsize]
      \assen{-.15}{4.6}{-2.6}{2.8}
      \draw[accent,thick] (0,2) -- (2,2) -- (4,-2);
      \foreach \t in {1,2,3,4} \draw[lijngrijs] (\t,.08) -- (\t,-.08) node[below,text=black] {\t};
      \foreach \t in {-2,2} \draw[lijngrijs] (.06,\t) -- (-.06,\t) node[left,text=black] {$\t$};
    \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $G(1)$, $G(2)$, $G(3)$ en $G(4)$.
      antwoord: |-
        2; 4; 5; 4
      uitwerking: |-
        $G(1)=2$ en $G(2)=4$ (rechthoeken); $G(3)=4+\tfrac12\cdot 1\cdot 2=5$; $G(4)=5-\tfrac12\cdot 1\cdot 2=4$.
    - opgave: |-
        Voor welke $x$ is $G$ maximaal op $[0, 4]$? Hoe zie je dat aan de grafiek van $f$?
      antwoord: |-
        $x=3$
      uitwerking: |-
        $G'(x)=f(x)$, en $f$ gaat in $x=3$ van positief naar negatief.

- id: h2-o21
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte in een context
  prent:
    naam: hangbrug
  opgave: |-
    De kabel van een hangbrug hangt boven het brugdek volgens $y = 5 + \dfrac{x^2}{500}$, met $x$ en $y$ in meter, op $[-100, 100]$. Het brugdek ligt op $y = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe hoog hangt de kabel in het midden en aan de pylonen?
      antwoord: |-
        5 m en 25 m
      uitwerking: |-
        $y(0)=5$ en $y(100)=5+20=25$.
    - opgave: |-
        Bereken de oppervlakte tussen de kabel en het brugdek.
      antwoord: |-
        ongeveer 2333 m²
      uitwerking: |-
        De functie is even: $2\displaystyle\int_0^{100}\Bigl(5+\dfrac{x^2}{500}\Bigr)\dx=2\Bigl[5x+\dfrac{x^3}{1500}\Bigr]_0^{100}=2\Bigl(500+\dfrac{2000}{3}\Bigr)=\dfrac{7000}{3}\approx 2333$ m².

- id: h2-o23
  soort: opdracht
  niveau: 2
  thema: |-
    onbekende grens
  opgave: |-
    Bepaal $a$.
  lijst: enumerate
  delen:
    - opgave: |-
        $\ig_0^a x^2\dx = 9$
      antwoord: |-
        $a=3$
      uitwerking: |-
        $\tfrac{a^3}{3}=9$ geeft $a=3$.
    - opgave: |-
        $\ig_1^a \dfrac1x\dx = 2$ met $a > 1$
      antwoord: |-
        $a=\e^2$
      uitwerking: |-
        $\ln a=2$ geeft $a=\e^2$.
    - opgave: |-
        $\ig_0^a (2x + 1)\dx = 6$ met $a > 0$
      antwoord: |-
        $a=2$
      uitwerking: |-
        $a^2+a-6=0$ geeft $a=2$ of $a=-3$. Enkel $a=2$ kan.

- id: h2-o24
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte in twee delen
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[x=.68cm,y=.13cm,font=\scriptsize]
        \gebied{0}{3.17}{(\x)^2}
        \gebied[accent!15]{3.17}{4}{(\x)^2}
        \rooster{0}{1}{4}{0}{4}{16}
        \kromme{0}{4}{(\x)^2}
        \draw[accent,dashed] (3.17,0) -- (3.17,10.05);
        \node[above left,inner sep=1pt] at (3.17,0) {$a$};
      \end{tikzpicture}
  opgave: |-
    De verticale rechte $x = a$ verdeelt het gebied onder $y = x^2$ op $[0, 4]$ in twee delen met dezelfde oppervlakte. Bepaal $a$ op twee decimalen.
  antwoord: |-
    $a=\sqrt[3]{32}\approx 3{,}17$
  uitwerking: |-
    Het hele gebied heeft oppervlakte $\tfrac{64}{3}$. Uit $\tfrac{a^3}{3}=\tfrac{32}{3}$ volgt $a=\sqrt[3]{32}\approx 3{,}17$. Het is dus niet het midden van het interval.

- id: h2-o25
  soort: opdracht
  niveau: 3
  thema: |-
    parameter: rechte verdeelt een gebied
  figuur:
    opties: |-
      3.8cm
    code: |-
      \begin{tikzpicture}[x=1.45cm,y=1.45cm,font=\scriptsize]
        \gebiedtussen{0}{1.587}{2*\x-(\x)^2}{.413*\x}
        \gebied[accent!15]{1.587}{2}{2*\x-(\x)^2}
        \fill[accent!15] (0,0) -- (1.587,.655) -- (1.587,0) -- cycle;
        \rooster{0}{1}{2}{0}{1}{1}
        \kromme{0}{2}{2*\x-(\x)^2}
        \draw[accent,thick] (0,0) -- (1.9,.785) node[above,text=black] {$y = mx$};
      \end{tikzpicture}
  opgave: |-
    De parabool $y = 2x - x^2$ en de horizontale as sluiten een gebied in. De rechte $y = mx$, met $0 < m < 2$, verdeelt dat gebied in twee delen met dezelfde oppervlakte.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de parabool en de rechte snijden in $x = 2 - m$.
      uitwerking: |-
        $2x-x^2=mx$ geeft $x(2-m-x)=0$.
    - opgave: |-
        Toon aan dat de oppervlakte tussen de parabool en de rechte $\dfrac{(2-m)^3}{6}$ is.
      uitwerking: |-
        Met $p=2-m$: $\displaystyle\int_0^{p}(px-x^2)\dx=\dfrac{p^3}{2}-\dfrac{p^3}{3}=\dfrac{p^3}{6}$.
    - opgave: |-
        Bepaal $m$ op drie decimalen.
      antwoord: |-
        $m=2-\sqrt[3]{4}\approx 0{,}413$
      uitwerking: |-
        Het hele gebied is $\displaystyle\int_0^2(2x-x^2)\dx=\tfrac43$, en dat is de formule bij $m=0$. Uit $\dfrac{(2-m)^3}{6}=\tfrac23$ volgt $(2-m)^3=4$, dus $m=2-\sqrt[3]{4}\approx 0{,}413$.

- id: h2-o26
  soort: opdracht
  niveau: 3
  thema: |-
    functie uit een integraal
  opgave: |-
    Bepaal een continue functie $f$ en de constante $c$ waarvoor $\ig_1^x f(t)\dt = x^3 + 2x + c$ voor elke $x$.
  antwoord: |-
    $f(x)=3x^2+2$ en $c=-3$
  uitwerking: |-
    Afleiden met de hoofdstelling: $f(x)=3x^2+2$. Vul $x=1$ in: links staat 0, rechts $3+c$. Dus $c=-3$.

- id: h2-o27
  soort: opdracht
  niveau: 3
  thema: |-
    twee stellingen vergelijken
  opgave: |-
    De middelwaardestelling voor integralen en de stelling van Lagrange lijken op elkaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf de stelling van Lagrange voor een primitieve $F$ van $f$ op $[a, b]$.
      uitwerking: |-
        Er is een $c\in\,]a,b[$ met $F(b)-F(a)=F'(c)\,(b-a)$.
    - opgave: |-
        Toon aan dat je daaruit, met de hoofdstelling, de middelwaardestelling voor integralen krijgt.
      uitwerking: |-
        $F'(c)=f(c)$ en $F(b)-F(a)=\displaystyle\int_a^b f(x)\dx$ volgens de hoofdstelling. Dus $\displaystyle\int_a^b f(x)\dx=f(c)\,(b-a)$. In het boek gebruiken we de middelwaardestelling wel om de hoofdstelling te bewijzen: dit is dus geen nieuw bewijs ervan, maar toont dat de twee stellingen hetzelfde zeggen.
  antwoord: |-
    Zie de uitgewerkte oplossingen.

- id: h2-o28
  soort: opdracht
  niveau: 3
  thema: |-
    even functie, oneven integraalfunctie
  opgave: |-
    Stel dat $f$ continu en even is, en $G(x) = \ig_0^x f(t)\dt$. Bewijs dat $G$ oneven is: bereken de afgeleide van $h(x) = G(x) + G(-x)$.
  antwoord: |-
    $h'(x)=0$ en $h(0)=0$
  uitwerking: |-
    $h'(x)=f(x)+f(-x)\cdot(-1)=f(x)-f(-x)=0$, omdat $f$ even is. Dus $h$ is constant, en $h(0)=2G(0)=0$. Bijgevolg is $G(-x)=-G(x)$.

- id: h2-o29
  soort: opdracht
  niveau: 3
  thema: |-
    limiet met de hoofdstelling
  opgave: |-
    Bereken $\displaystyle\lim_{x \to 0} \dfrac{1}{x} \ig_0^x \cos(t^2)\dt$ zonder de integraal uit te rekenen.
  antwoord: |-
    1
  uitwerking: |-
    Met $A(x)=\displaystyle\int_0^x\cos(t^2)\dt$ staat er $\displaystyle\lim_{x\to 0}\dfrac{A(x)-A(0)}{x}$. Dat is de afgeleide $A'(0)=\cos 0=1$.

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: |-
      Statistiek
  figuur:
    opties: |-
      3.7cm
    code: |-
      \begin{tikzpicture}[x=2.4cm,y=2.4cm,font=\scriptsize]
        \gebiedtussen{0}{1}{\x}{(\x)^2}
        \draw[black!14,very thin,step=.2] (0,0) grid (1,1);
        \draw[->,grijs] (0,0) -- (1.1,0) node[right,text=black] {$p$};
        \draw[->,grijs] (0,0) -- (0,1.1);
        \kromme{0}{1}{\x}
        \kromme{0}{1}{(\x)^2}
        \node[below] at (1,0) {1};
        \node[left] at (0,1) {1};
        \node[right] at (.62,.35) {$L$};
      \end{tikzpicture}
  opgave: |-
    Een Lorenzcurve $L$ toont welk deel van het inkomen naar de armste $p$ van de bevolking gaat ($0 \leqslant p \leqslant 1$). Bij volledige gelijkheid is $L(p) = p$. De Gini-coëfficiënt is
    \[ G = 2\int_0^1 \bigl(p - L(p)\bigr)\,\mathrm{d}p . \]
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom is $G = 0$ bij volledige gelijkheid? Hoe groot is $G$ bij extreme ongelijkheid (de laatste persoon heeft alles)?
      antwoord: |-
        0 en 1
      uitwerking: |-
        Bij gelijkheid staat er overal 0 in de integraal. Bij extreme ongelijkheid is $L(p)=0$, behalve helemaal op het einde: $G=2\cdot\tfrac12=1$.
    - opgave: |-
        Land A heeft $L(p) = p^2$. Hoeveel verdient de armste helft samen? Bereken $G$.
      antwoord: |-
        25\%; $G=\tfrac13$
      uitwerking: |-
        $L(\tfrac12)=\tfrac14$. $G=2\bigl(\tfrac12-\tfrac13\bigr)=\tfrac13$.
    - opgave: |-
        Land B heeft $L(p) = 0{,}4p + 0{,}6p^3$. Bereken $G$. In welk land zijn de inkomens het meest gelijk verdeeld?
      antwoord: |-
        $G=0{,}3$; land B
      uitwerking: |-
        $\displaystyle\int_0^1 L(p)\,\mathrm{d}p=0{,}2+0{,}15=0{,}35$, dus $G=2(0{,}5-0{,}35)=0{,}3$. Land B heeft de kleinste $G$, dus de meest gelijke verdeling.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Analytische meetkunde
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[x=.8cm,y=.48cm,font=\scriptsize]
        \draw[lijngrijs,dashed] (-2,0) rectangle (2,4);
        \gebied{-2}{2}{4-(\x)^2}
        \draw[accent] (-2,0) -- (0,4) -- (2,0);
        \assen{-2.4}{2.6}{-.2}{4.7}
        \kromme{-2}{2}{4-(\x)^2}
        \node[below] at (-2,0) {$-c$};
        \node[below] at (2,0) {$c$};
      \end{tikzpicture}
  opgave: |-
    Archimedes berekende de oppervlakte van een parabolisch segment al zonder integralen. Neem de parabool $y = c^2 - x^2$ met $c > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de oppervlakte $S$ tussen de parabool en de horizontale as.
      antwoord: |-
        $S=\tfrac{4c^3}{3}$
      uitwerking: |-
        $\displaystyle\int_{-c}^{c}(c^2-x^2)\dx=2\Bigl(c^3-\tfrac{c^3}{3}\Bigr)=\tfrac{4c^3}{3}$.
    - opgave: |-
        Toon aan: $S$ is $\tfrac23$ van de omschreven rechthoek, met de basis op de as en de bovenzijde door de top van de parabool.
      uitwerking: |-
        De rechthoek is $2c\cdot c^2=2c^3$, en $\tfrac23\cdot 2c^3=\tfrac{4c^3}{3}$.
    - opgave: |-
        Toon aan: $S$ is $\tfrac43$ van de driehoek met hoekpunten $(-c, 0)$, $(c, 0)$ en $(0, c^2)$.
      uitwerking: |-
        De driehoek is $\tfrac12\cdot 2c\cdot c^2=c^3$, en $\tfrac43\cdot c^3=S$.

- id: h2-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: discreet
    onderwerp: |-
      Rijen
  figuur:
    opties: |-
      3.8cm
    code: |-
      \begin{tikzpicture}[x=.62cm,y=1.2cm,font=\scriptsize]
        \foreach \k in {1,...,5}{\pgfmathsetmacro{\hh}{1/\k}\draw[accent,fill=accent!22] (\k,0) rectangle (\k+1,\hh);}
        \rooster{0}{1}{6}{0}{1}{1}
        \kromme{.9}{6}{1/\x}
      \end{tikzpicture}
  opgave: |-
    De som $H_n = 1 + \tfrac12 + \tfrac13 + \cdots + \tfrac1n$ heeft geen eenvoudige formule, maar de integraal van $\tfrac1x$ sluit ze goed in. Teken rechthoeken met breedte 1 onder en boven de grafiek van $\tfrac1x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: $\ln(n + 1) \leqslant H_n \leqslant 1 + \ln n$.
      uitwerking: |-
        De rechthoeken op $[k,k+1]$ met hoogte $\tfrac1k$ liggen boven de grafiek, dus $\displaystyle\int_1^{n+1}\tfrac1x\dx\leqslant H_n$. De rechthoeken op $[k-1,k]$ met hoogte $\tfrac1k$ liggen eronder, dus $H_n-1\leqslant\displaystyle\int_1^n\tfrac1x\dx$.
    - opgave: |-
        Tussen welke twee getallen ligt $H_{1000}$?
      antwoord: |-
        $6{,}91$ en $7{,}91$
      uitwerking: |-
        $\ln 1001\approx 6{,}91$ en $1+\ln 1000\approx 7{,}91$.
    - opgave: |-
        Wat betekent deze ongelijkheid voor de limiet van de rij $H_n$?
      antwoord: |-
        $H_n\to+\infty$
      uitwerking: |-
        $\ln(n+1)\to+\infty$, dus ook $H_n$. De som wordt elk getal voorbij, maar heel traag.
    - opgave: |-
        Hoeveel termen zijn zeker genoeg om $H_n > 20$ te krijgen?
      antwoord: |-
        ongeveer $4{,}85\cdot 10^8$
      uitwerking: |-
        Genoeg is $\ln(n+1)>20$, dus $n+1>\e^{20}\approx 4{,}85\cdot 10^8$.

- id: h2-koppel-4
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Een veelterm $a_0 + a_1 x + a_2 x^2 + a_3 x^3$ schrijven we als kolom met de coëfficiënten. Afleiden naar graad hoogstens 2 is een matrix $D$; een primitieve nemen met constante 0 is een matrix $P$:
    \[ D = \begin{pmatrix} 0 & 1 & 0 & 0 \\ 0 & 0 & 2 & 0 \\ 0 & 0 & 0 & 3 \end{pmatrix} \qquad P = \begin{pmatrix} 0 & 0 & 0 \\ 1 & 0 & 0 \\ 0 & \tfrac12 & 0 \\ 0 & 0 & \tfrac13 \end{pmatrix} \]
  lijst: enumerate
  delen:
    - opgave: |-
        Controleer op de veelterm $3 + 2x + 6x^2$ dat $P$ een primitieve geeft.
      antwoord: |-
        $3x+x^2+2x^3$
      uitwerking: |-
        $P\cdot(3,2,6)^T=(0,3,1,2)^T$, dus $3x+x^2+2x^3$. Afleiden geeft de veelterm terug.
    - opgave: |-
        Bereken $DP$ en $PD$.
      antwoord: |-
        $DP=I_3$; $PD$ is de diagonaalmatrix met $0,1,1,1$
      uitwerking: |-
        $DP=I_3$, en $PD$ heeft op de diagonaal $0,\ 1,\ 1,\ 1$ en verder enkel nullen.
    - opgave: |-
        Waarom is $DP$ de eenheidsmatrix en $PD$ niet? Welke regel over primitieven herken je?
      uitwerking: |-
        Eerst integreren en dan afleiden geeft de functie terug. Eerst afleiden en dan integreren verliest de constante $a_0$: dat is de $C$ bij primitieven.

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Bereken de afgeleide van $A(x) = \ig_1^x \sqrt{2 + t^2}\dt$.
  antwoord: |-
    $\sqrt{2+x^2}$
  uitwerking: |-
    Hoofdstelling, deel 1.

- id: h2-t2
  soort: test
  niveau: 2
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_1^2 (3x^2 - 4x)\dx$
      antwoord: |-
        1
      uitwerking: |-
        $\bigl[x^3-2x^2\bigr]_1^2=(8-8)-(1-2)=1$.
    - opgave: |-
        $\ig_0^{\pi/2} (2\cos x - \sin x)\dx$
      antwoord: |-
        1
      uitwerking: |-
        $\bigl[2\sin x+\cos x\bigr]_0^{\pi/2}=2-1=1$.
    - opgave: |-
        $\ig_1^4 \dfrac{x - 1}{x}\dx$
      antwoord: |-
        $3-\ln 4$
      uitwerking: |-
        Splitsen: $\displaystyle\int_1^4\Bigl(1-\dfrac1x\Bigr)\dx=\bigl[x-\ln|x|\bigr]_1^4=(4-\ln 4)-1=3-\ln 4$.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Bereken de oppervlakte tussen de grafiek van $f(x) = x^2 - x - 2$ en de horizontale as op $[0, 3]$.
  antwoord: |-
    $\tfrac{31}{6}$
  uitwerking: |-
    Op $[0,3]$ is er een nulpunt in $x=2$, met $F(x)=\tfrac{x^3}{3}-\tfrac{x^2}{2}-2x$. $F(0)=0$, $F(2)=-\tfrac{10}{3}$ en $F(3)=-\tfrac32$.\\
    De stukken zijn $-\tfrac{10}{3}$ en $\tfrac{11}{6}$, dus $A=\tfrac{10}{3}+\tfrac{11}{6}=\tfrac{31}{6}$.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Bereken de oppervlakte van het gebied ingesloten door $y = x^2 - 2x$ en $y = x$.
  antwoord: |-
    $\tfrac92$
  uitwerking: |-
    $x^2-3x=0$ geeft $x=0$ en $x=3$. De rechte ligt bovenaan: $\displaystyle\int_0^3(3x-x^2)\dx=\tfrac{27}{2}-9=\tfrac92$.

- id: h2-t7
  soort: test
  niveau: 1
  opgave: |-
    Waarom mag je de hoofdstelling niet gebruiken voor $\ig_{-1}^{2} \dfrac1x\dx$?
  antwoord: |-
    $\tfrac1x$ is niet continu op $[-1,2]$.
  uitwerking: |-
    $x=0$ ligt in het interval en daar bestaat de functie niet. De stelling vraagt een continue functie op het hele interval.

- id: h2-t8
  soort: test
  niveau: 2
  opgave: |-
    Gegeven: $g(x) = \ig_0^x (t - 2)\dt$. Waar heeft $g$ een extremum? Is het een maximum of een minimum, en hoe groot is het?
  antwoord: |-
    Minimum $-2$ in $x=2$
  uitwerking: |-
    $g'(x)=x-2$ gaat in $x=2$ van negatief naar positief, dus een minimum. $g(2)=\bigl[\tfrac{t^2}{2}-2t\bigr]_0^2=2-4=-2$.
