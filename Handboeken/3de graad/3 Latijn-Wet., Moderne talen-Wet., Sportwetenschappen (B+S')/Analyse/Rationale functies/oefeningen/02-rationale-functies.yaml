- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    een functie ontwerpen
  opgave: |-
    Geef een rationale functie met verticale asymptoot $x = 2$, horizontale asymptoot $y = -1$ en nulwaarde $3$.
  antwoord: |-
    bijvoorbeeld $\frac{3 - x}{x - 2}$
  uitwerking: |-
    Noemer $x - 2$. Teller van graad 1 met nulwaarde $3$ en hoogstegraadscoëfficiënt $-1$: $-(x - 3) = 3 - x$. Controle: de teller is $1 \neq 0$ in $2$, dus geen perforatie; HA $y = \frac{-1}{1} = -1$. Anders geschreven: $-1 + \frac{1}{x - 2}$.
