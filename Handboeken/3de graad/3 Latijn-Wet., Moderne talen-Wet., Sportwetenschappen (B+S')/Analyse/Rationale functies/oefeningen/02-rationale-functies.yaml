# Oefeningen van hoofdstuk 2. Zie oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Vereenvoudig: $\dfrac{x^2 - 9}{x + 3}$.
      antwoord: |-
        $x - 3$ (voor $x \neq -3$)
      uitwerking: |-
        $\frac{(x - 3)(x + 3)}{x + 3} = x - 3$.
    - opgave: |-
        Bereken $\frac{1}{x}$ voor $x = 0{,}01$ en $x = -0{,}01$.
      antwoord: |-
        $100$; $-100$
      uitwerking: |-
        $100$ en $-100$.
    - opgave: |-
        Bereken $\frac{2x + 1}{x}$ voor $x = 1000$.
      antwoord: |-
        $2{,}001$
      uitwerking: |-
        $\frac{2001}{1000} = 2{,}001$.
    - opgave: |-
        Deel met Horner: $(x^2 + 3x + 5) : (x + 1)$.
      antwoord: |-
        $Q = x + 2$, $R = 3$
      uitwerking: |-
        Onderste rij $1, 2, 3$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken} De gemiddelde kostprijs per stuk is $G(q) = \dfrac{500 + 2q}{q}$ euro, bij $q$ stuks.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $G(10)$, $G(100)$, $G(1000)$ en $G(10\,000)$. Welk getal benaderen ze?
      antwoord: |-
        $52$; $7$; $2{,}5$; $2{,}05$; het getal 2
      uitwerking: |-
        $52$, $7$, $2{,}5$ en $2{,}05$: ze naderen $2$, de kostprijs per stuk zonder vaste kosten.
    - opgave: |-
        Wat gebeurt er met $G(q)$ als $q$ heel klein wordt (bijvoorbeeld $q = 1$ of $q = 0{,}1$)?
      antwoord: |-
        $G$ wordt heel groot
      uitwerking: |-
        $G(1) = 502$, $G(0{,}1) = 5002$: de vaste kosten verdeeld over bijna niets.
    - opgave: |-
        Schrijf $G(q)$ als $2 + \ldots$ Wat zie je?
      antwoord: |-
        $G(q) = 2 + \frac{500}{q}$
      uitwerking: |-
        $G(q) = 2 + \frac{500}{q}$: de grafiek van $\frac{500}{q}$, $2$ naar boven geschoven.

- id: h2-domein
  soort: kort
  opgave: |-
    Bepaal domein, nulwaarden en perforaties.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = \dfrac{x^2 - x}{x^2 - 1}$
      antwoord: |-
        $\R \setminus \{-1, 1\}$; $0$; perforatie $(1, \frac12)$
      uitwerking: |-
        $\frac{x(x - 1)}{(x - 1)(x + 1)} = \frac{x}{x + 1}$ voor $x \neq 1$. Nulwaarde $0$, perforatie in $\bigl(1, \frac12\bigr)$.
    - opgave: |-
        $g(x) = \dfrac{x + 3}{x^2 + 2x - 3}$
      antwoord: |-
        $\R \setminus \{-3, 1\}$; geen; perforatie $(-3, -\frac14)$
      uitwerking: |-
        $\frac{x + 3}{(x + 3)(x - 1)} = \frac{1}{x - 1}$ voor $x \neq -3$. Geen nulwaarden, perforatie in $\bigl(-3, -\frac14\bigr)$.
    - opgave: |-
        $h(x) = \dfrac{x^2 + x - 6}{x^2 - 4x + 4}$
      antwoord: |-
        $\R \setminus \{2\}$; $-3$; geen perforatie
      uitwerking: |-
        $\frac{(x - 2)(x + 3)}{(x - 2)^2} = \frac{x + 3}{x - 2}$ voor $x \neq 2$. Na het schrappen staat $x - 2$ nog in de noemer: in $2$ is er geen perforatie (je kunt geen functiewaarde berekenen). Nulwaarde $-3$.

- id: h2-ha
  soort: kort
  opgave: |-
    Bepaal de verticale en de horizontale asymptoten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{4x - 3}{2x + 1}$
      antwoord: |-
        $x = -\frac12$; $y = 2$
      uitwerking: |-
        Noemer nul voor $x = -\frac12$, en de teller is daar $-5 \neq 0$: VA $x = -\frac12$. Zelfde graad: HA $y = \frac42 = 2$.
    - opgave: |-
        $\dfrac{x^2 - 3x}{2x^2 - 8}$
      antwoord: |-
        $x = -2$, $x = 2$; $y = \frac12$
      uitwerking: |-
        $\frac{x(x - 3)}{2(x - 2)(x + 2)}$: geen gemeenschappelijke factor, VA $x = -2$ en $x = 2$. Zelfde graad: HA $y = \frac12$.
    - opgave: |-
        $\dfrac{(1 - 2x)^2}{x^2 + 3}$
      antwoord: |-
        geen VA; $y = 4$
      uitwerking: |-
        $x^2 + 3 > 0$: geen VA. De teller is $4x^2 - 4x + 1$, dus HA $y = \frac41 = 4$.

- id: h2-sa
  soort: kort
  opgave: |-
    Schrijf $f(x)$ als $Q(x) + \frac{R(x)}{B(x)}$ en geef de schuine asymptoot. Ligt de grafiek voor grote positieve $x$ boven of onder de asymptoot?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{x^2 + 3x + 1}{x + 1}$
      antwoord: |-
        $x + 2 - \frac{1}{x + 1}$; $y = x + 2$; onder
      uitwerking: |-
        Horner met $a = -1$ op $1, 3, 1$: $1, 2, -1$. Voor grote $x$ is $-\frac{1}{x + 1} < 0$: de grafiek ligt onder $y = x + 2$.
    - opgave: |-
        $\dfrac{2x^2 - x}{x - 3}$
      antwoord: |-
        $2x + 5 + \frac{15}{x - 3}$; $y = 2x + 5$; boven
      uitwerking: |-
        Horner met $a = 3$ op $2, -1, 0$: $2, 5, 15$. Voor $x > 3$ is $\frac{15}{x - 3} > 0$: boven.
    - opgave: |-
        $\dfrac{x^3 + 1}{x^2}$
      antwoord: |-
        $x + \frac{1}{x^2}$; $y = x$; boven
      uitwerking: |-
        Splits: $\frac{x^3}{x^2} + \frac{1}{x^2} = x + \frac{1}{x^2}$. Het verschil $\frac{1}{x^2}$ is altijd positief: boven, aan beide kanten.

- id: h2-asymptoten
  soort: kort
  opgave: |-
    Bepaal alle asymptoten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{3x - 1}{x + 2}$
      antwoord: |-
        $x = -2$; $y = 3$
      uitwerking: |-
        VA $x = -2$ (de teller is daar $-7 \neq 0$); zelfde graad: HA $y = \frac31 = 3$.
    - opgave: |-
        $\dfrac{x}{x^2 + 1}$
      antwoord: |-
        $y = 0$
      uitwerking: |-
        Geen VA (noemer nooit nul); graad teller kleiner: HA $y = 0$.
    - opgave: |-
        $\dfrac{x^2 - 3}{x + 1}$
      antwoord: |-
        $x = -1$; $y = x - 1$
      uitwerking: |-
        Horner met $a = -1$: $1, -1, -2$, dus $x - 1 - \frac{2}{x + 1}$. VA $x = -1$, SA $y = x - 1$.

- id: h2-va
  soort: kort
  opgave: |-
    Verticale asymptoot of perforatie? Onderzoek elke nulwaarde van de noemer.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{x^2 - 1}{x^2 + x}$
      antwoord: |-
        VA $x = 0$; perforatie $(-1, 2)$
      uitwerking: |-
        $\frac{(x - 1)(x + 1)}{x(x + 1)} = \frac{x - 1}{x}$ voor $x \neq -1$. In $0$ blijft de noemer nul: VA. In $-1$ is de factor weg: perforatie, met $\frac{-2}{-1} = 2$.
    - opgave: |-
        $\dfrac{x - 2}{x^2 - 4x + 4}$
      antwoord: |-
        VA $x = 2$
      uitwerking: |-
        $\frac{x - 2}{(x - 2)^2} = \frac{1}{x - 2}$: na het schrappen blijft $x - 2$ in de noemer. Geen perforatie, maar een VA.
    - opgave: |-
        $\dfrac{x^2 - 9}{x - 3}$
      antwoord: |-
        perforatie $(3, 6)$
      uitwerking: |-
        $\frac{(x - 3)(x + 3)}{x - 3} = x + 3$ voor $x \neq 3$: een rechte met een gat in $(3, 6)$. Geen asymptoot.

- id: h2-tekentabel
  soort: kort
  opgave: |-
    Stel de tekentabel op. Gaat de grafiek links en rechts van elke verticale asymptoot naar boven of naar onder?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac{x + 3}{x - 1}$
      antwoord: |-
        \tekentabel{cccccc}{x & & -3 & & 1 & }{f(x) & + & 0 & - & | & +} links onder, rechts boven
      uitwerking: |-
        Nulwaarde $-3$, pool $1$, allebei enkelvoudig: het teken wisselt telkens. Rechts positief. Net links van $1$ is $f$ negatief: daar gaat de grafiek naar onder; rechts naar boven. \tekentabel{cccccc}{x & & -3 & & 1 & }{f(x) & + & 0 & - & | & +}
    - opgave: |-
        $f(x) = \dfrac{x}{(x + 2)^2}$
      antwoord: |-
        \tekentabel{cccccc}{x & & -2 & & 0 & }{f(x) & - & | & - & 0 & +} aan beide kanten onder
      uitwerking: |-
        De noemer is een kwadraat en dus nooit negatief: het teken is dat van $x$. Links en rechts van $-2$ is $f$ negatief: aan beide kanten naar onder. \tekentabel{cccccc}{x & & -2 & & 0 & }{f(x) & - & | & - & 0 & +}

- id: h2-schets
  soort: kort
  opgave: |-
    Schets de grafiek van $f(x) = \dfrac{2x}{x - 1}$. Geef asymptoten, nulwaarde en tekentabel.
  antwoord: |-
    $x = 1$; $y = 2$; nulwaarde $0$
  uitwerking: |-
    $f(x) = 2 + \frac{2}{x - 1}$: VA $x = 1$, HA $y = 2$, nulwaarde $0$. \tekentabel{cccccc}{x & & 0 & & 1 & }{f(x) & + & 0 & - & | & +}
    \figuren{\begin{tikzpicture}[x=.45cm,y=.35cm,font=\scriptsize]
      \rooster{-4}{1}{5}{-3}{1}{7}
      \draw[grijs,dashed] (1,-3) -- (1,7.3) (-4,2) -- (5.3,2);
      \kromme{-4}{.6}{2*\x/(\x-1)} \kromme{1.4}{5}{2*\x/(\x-1)}
      \vol{(0,0)}
    \end{tikzpicture}}

- id: h2-homografisch
  soort: kort
  opgave: |-
    Schrijf als $c + \frac{a}{x - p}$. Geef de asymptoten en zeg hoe de grafiek ontstaat uit die van $\frac1x$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{x + 5}{x + 2}$
      antwoord: |-
        $1 + \frac{3}{x + 2}$; $x = -2$, $y = 1$
      uitwerking: |-
        $x + 5 = (x + 2) + 3$, dus $1 + \frac{3}{x + 2}$. Verticaal $\times 3$, $2$ naar links, $1$ naar boven.
    - opgave: |-
        $\dfrac{4x - 3}{x - 1}$
      antwoord: |-
        $4 + \frac{1}{x - 1}$; $x = 1$, $y = 4$
      uitwerking: |-
        $4x - 3 = 4(x - 1) + 1$, dus $4 + \frac{1}{x - 1}$. $1$ naar rechts, $4$ naar boven.
    - opgave: |-
        $\dfrac{2 - x}{x + 1}$
      antwoord: |-
        $-1 + \frac{3}{x + 1}$; $x = -1$, $y = -1$
      uitwerking: |-
        $2 - x = -(x + 1) + 3$, dus $-1 + \frac{3}{x + 1}$. Verticaal $\times 3$, $1$ naar links, $1$ naar onder.

- id: h2-nul
  soort: kort
  opgave: |-
    Bepaal het domein en de nulwaarden.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = \dfrac{x^2 - 9}{x^2 + 2x}$
      antwoord: |-
        $\R \setminus \{-2, 0\}$; $-3$ en $3$
      uitwerking: |-
        $f(x) = \frac{(x - 3)(x + 3)}{x(x + 2)}$. De noemer is nul in $0$ en $-2$. De teller is nul in $\pm 3$, en die liggen allebei in het domein.
    - opgave: |-
        $f(x) = \dfrac{x^2 - 3x + 2}{x^2 - 1}$
      antwoord: |-
        $\R \setminus \{-1, 1\}$; $2$
      uitwerking: |-
        $f(x) = \frac{(x - 1)(x - 2)}{(x - 1)(x + 1)}$. De teller is nul in $1$ en $2$, maar $1$ ligt niet in het domein. Enige nulwaarde: $2$.
    - opgave: |-
        $f(x) = \dfrac{x^2 + 1}{x^2 + 4}$
      antwoord: |-
        $\R$; geen nulwaarden
      uitwerking: |-
        $x^2 + 4 > 0$, dus het domein is $\R$. Ook $x^2 + 1 > 0$: geen nulwaarden.

- id: h2-ha0
  soort: kort
  opgave: |-
    Bepaal de asymptoten. Snijdt de grafiek de horizontale asymptoot? Zo ja, waar?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac{2x - 1}{x^2 + 1}$
      antwoord: |-
        $y = 0$; snijdt in $\bigl(\frac12, 0\bigr)$
      uitwerking: |-
        $x^2 + 1 > 0$: geen verticale asymptoot. Graad $1 <$ graad $2$: horizontale asymptoot $y = 0$. De grafiek snijdt $y = 0$ in de nulwaarde: $2x - 1 = 0 \iff x = \frac12$.
    - opgave: |-
        $f(x) = \dfrac{5}{x^2 - 4}$
      antwoord: |-
        $x = -2$, $x = 2$; $y = 0$; snijdt niet
      uitwerking: |-
        De noemer is nul in $\pm 2$, de teller nooit: verticale asymptoten $x = -2$ en $x = 2$. Graad $0 <$ graad $2$: $y = 0$. De teller is nooit nul, dus de grafiek snijdt $y = 0$ niet.

- id: h2-soort
  soort: kort
  opgave: |-
    Heeft de grafiek voor grote $|x|$ een horizontale, een schuine of geen asymptoot? Geef ze.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x^4 + 1}{x^2 - 1}$
      antwoord: |-
        geen
      uitwerking: |-
        Graad $4 \geqslant 2 + 2$. De deling geeft $x^4 + 1 = (x^2 - 1)(x^2 + 1) + 2$: het quotiënt $x^2 + 1$ heeft graad 2. Geen horizontale of schuine asymptoot; de grafiek gedraagt zich zoals die van $x^2 + 1$.
    - opgave: |-
        $\dfrac{5 - 2x^2}{x^2 + x}$
      antwoord: |-
        horizontaal: $y = -2$
      uitwerking: |-
        Zelfde graad: $y = \frac{-2}{1} = -2$.
    - opgave: |-
        $\dfrac{x^3 - 1}{x^2 + 2}$
      antwoord: |-
        schuin: $y = x$
      uitwerking: |-
        Graad $3 = 2 + 1$. Staartdeling: $x^3 - 1 = x(x^2 + 2) - 2x - 1$. Het quotiënt is $x$: schuine asymptoot $y = x$.
    - opgave: |-
        $\dfrac{x + 4}{x^3 + 1}$
      antwoord: |-
        horizontaal: $y = 0$
      uitwerking: |-
        Graad $1 <$ graad $3$: $y = 0$.

- id: h2-schets2
  soort: kort
  opgave: |-
    Schets de grafiek van $f(x) = \dfrac{x^2 - x - 6}{x^2 - 4}$. Geef het domein, de perforatie, de nulwaarde, de asymptoten en de tekentabel.
  antwoord: |-
    $\R \setminus \{-2, 2\}$; perforatie $\bigl(-2, \frac54\bigr)$; nulwaarde $3$; $x = 2$ en $y = 1$
  uitwerking: |-
    $f(x) = \frac{(x - 3)(x + 2)}{(x - 2)(x + 2)} = \frac{x - 3}{x - 2}$ voor $x \neq -2$. Domein $\R \setminus \{-2, 2\}$. Perforatie in $-2$: $\frac{-5}{-4} = \frac54$. Nulwaarde $3$. Verticale asymptoot $x = 2$, horizontale asymptoot $y = 1$ (zelfde graad). $f(0) = \frac32$. \tekentabel{cccccc}{x & & 2 & & 3 & }{f(x) & + & | & - & 0 & +}
    \figuren{\begin{tikzpicture}[x=.4cm,y=.4cm,font=\scriptsize]
      \rooster{-4}{1}{6}{-3}{1}{5}
      \draw[grijs,dashed] (2,-3) -- (2,5.3) (-4,1) -- (6.3,1);
      \kromme{-4}{1.75}{(\x-3)/(\x-2)} \kromme{2.25}{6}{(\x-3)/(\x-2)}
      \vol{(3,0)} \open{(-2,5/4)}
    \end{tikzpicture}}

- id: h2-ontwerp
  soort: kort
  opgave: |-
    Ontwerp een functie.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een homografische functie met verticale asymptoot $x = 1$ en horizontale asymptoot $y = 2$, waarvan de grafiek door de oorsprong gaat.
      antwoord: |-
        $f(x) = \frac{2x}{x - 1}$
      uitwerking: |-
        $f(x) = 2 + \frac{a}{x - 1}$. Door de oorsprong: $f(0) = 2 - a = 0$, dus $a = 2$ en $f(x) = 2 + \frac{2}{x - 1} = \frac{2x}{x - 1}$.
    - opgave: |-
        Geef een rationale functie met verticale asymptoot $x = 1$ en schuine asymptoot $y = x$.
      antwoord: |-
        bijvoorbeeld $f(x) = \frac{x^2 - x + 1}{x - 1}$
      uitwerking: |-
        Neem $f(x) = x + \frac{a}{x - 1}$ met $a \neq 0$: het verschil met $x$ wordt willekeurig klein, en de noemer is nul in $1$. Met $a = 1$: $f(x) = \frac{x(x - 1) + 1}{x - 1} = \frac{x^2 - x + 1}{x - 1}$. De teller is $1 \neq 0$ in $1$, dus $x = 1$ is echt een verticale asymptoot.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: domein en vereenvoudigen
  opgave: |-
    Bepaal het domein en vereenvoudig.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\dfrac{x^2 + 2x}{x^2 - 4}$
      antwoord: |-
        $\R \setminus \{-2, 2\}$; $\frac{x}{x - 2}$
      uitwerking: |-
        $\frac{x(x + 2)}{(x - 2)(x + 2)} = \frac{x}{x - 2}$ voor $x \neq -2$.
    - opgave: |-
        $\dfrac{x^3 - x}{x^2 + x}$
      antwoord: |-
        $\R \setminus \{-1, 0\}$; $x - 1$
      uitwerking: |-
        $\frac{x(x - 1)(x + 1)}{x(x + 1)} = x - 1$ voor $x \neq 0, -1$: een rechte met twee gaten.
    - opgave: |-
        $\dfrac{x^2 - 6x + 9}{x^2 - 9}$
      antwoord: |-
        $\R \setminus \{-3, 3\}$; $\frac{x - 3}{x + 3}$
      uitwerking: |-
        $\frac{(x - 3)^2}{(x - 3)(x + 3)} = \frac{x - 3}{x + 3}$ voor $x \neq 3$.
    - opgave: |-
        $\dfrac{2x + 4}{x^2 + 4x + 4}$
      antwoord: |-
        $\R \setminus \{-2\}$; $\frac{2}{x + 2}$
      uitwerking: |-
        $\frac{2(x + 2)}{(x + 2)^2} = \frac{2}{x + 2}$.
    - opgave: |-
        $\dfrac{x^2 + 1}{x^4 - 1}$
      antwoord: |-
        $\R \setminus \{-1, 1\}$; $\frac{1}{x^2 - 1}$
      uitwerking: |-
        $x^4 - 1 = (x^2 - 1)(x^2 + 1)$, en $x^2 + 1$ is nooit nul: $\frac{1}{x^2 - 1}$.
    - opgave: |-
        $\dfrac{x^3 - 8}{x^2 - 4}$
      antwoord: |-
        $\R \setminus \{-2, 2\}$; $\frac{x^2 + 2x + 4}{x + 2}$
      uitwerking: |-
        Horner: $x^3 - 8 = (x - 2)(x^2 + 2x + 4)$. Dus $\frac{(x - 2)(x^2 + 2x + 4)}{(x - 2)(x + 2)} = \frac{x^2 + 2x + 4}{x + 2}$ voor $x \neq 2$.
    - opgave: |-
        $\dfrac{x^2 - x - 6}{x^3 - 9x}$
      antwoord: |-
        $\R \setminus \{-3, 0, 3\}$; $\frac{x + 2}{x(x + 3)}$
      uitwerking: |-
        $\frac{(x - 3)(x + 2)}{x(x - 3)(x + 3)} = \frac{x + 2}{x(x + 3)}$ voor $x \neq 3$.
    - opgave: |-
        $\dfrac{x^4 - x^2}{x^3 + x^2}$
      antwoord: |-
        $\R \setminus \{-1, 0\}$; $x - 1$
      uitwerking: |-
        $\frac{x^2(x - 1)(x + 1)}{x^2(x + 1)} = x - 1$ voor $x \neq 0, -1$.

- id: h2-o10
  soort: opdracht
  niveau: 1
  thema: |-
    grafiek kiezen
  opgave: |-
    Welke grafiek hoort bij welk voorschrift? Kijk naar de asymptoten en het teken.

    \figuren{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
      \rooster{-2}{1}{4}{-3}{1}{4}
      \draw[grijs,dashed] (1,-3) -- (1,4.3);
      \kromme{-2}{.75}{-1/(\x-1)} \kromme{1.334}{4}{-1/(\x-1)}
      \node[text=accent] at (1,-4.1) {\textbf{A}};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
      \rooster{-2}{1}{4}{-3}{1}{4}
      \draw[grijs,dashed] (1,-3) -- (1,4.3) (-2,1) -- (4.3,1);
      \kromme{-2}{.75}{\x/(\x-1)} \kromme{1.334}{4}{\x/(\x-1)}
      \node[text=accent] at (1,-4.1) {\textbf{B}};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
      \rooster{-2}{1}{4}{-3}{1}{4}
      \draw[grijs,dashed] (1,-3) -- (1,4.3);
      \kromme{-2}{.667}{1/(\x-1)} \kromme{1.25}{4}{1/(\x-1)}
      \node[text=accent] at (1,-4.1) {\textbf{C}};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
      \rooster{-2}{1}{4}{-3}{1}{4}
      \draw[grijs,dashed] (1,-3) -- (1,4.3);
      \kromme{-2}{.5}{1/(\x-1)^2} \kromme{1.5}{4}{1/(\x-1)^2}
      \node[text=accent] at (1,-4.1) {\textbf{D}};
    \end{tikzpicture}}
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\dfrac{1}{x - 1}$
      antwoord: |-
        C
      uitwerking: |-
        VA $x = 1$, HA $y = 0$; links van $1$ negatief, rechts positief: grafiek C.
    - opgave: |-
        $\dfrac{1}{(x - 1)^2}$
      antwoord: |-
        D
      uitwerking: |-
        Overal positief, want de noemer is een kwadraat: aan beide kanten van $x = 1$ naar boven. Grafiek D.
    - opgave: |-
        $\dfrac{x}{x - 1}$
      antwoord: |-
        B
      uitwerking: |-
        Zelfde graad: HA $y = 1$, en $\frac{x}{x - 1} = 1 + \frac{1}{x - 1}$. Grafiek B, de enige met een HA die niet de $x$-as is.
    - opgave: |-
        $\dfrac{-1}{x - 1}$
      antwoord: |-
        A
      uitwerking: |-
        Het spiegelbeeld van $\frac{1}{x - 1}$ om de $x$-as: links positief, rechts negatief. Grafiek A.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: asymptoten
  opgave: |-
    Bepaal alle asymptoten. Let op perforaties.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\dfrac{5}{x^2 - 9}$
      antwoord: |-
        $x = \pm 3$; $y = 0$
      uitwerking: |-
        Noemer nul in $\pm 3$, teller nooit nul: VA $x = -3$ en $x = 3$. Graad teller kleiner: HA $y = 0$.
    - opgave: |-
        $\dfrac{4x^2}{2x^2 + x - 1}$
      antwoord: |-
        $x = -1$, $x = \frac12$; $y = 2$
      uitwerking: |-
        $2x^2 + x - 1 = (2x - 1)(x + 1)$: VA $x = -1$ en $x = \frac12$. HA $y = \frac42 = 2$.
    - opgave: |-
        $\dfrac{2x^2 + 3x}{x - 2}$
      antwoord: |-
        $x = 2$; $y = 2x + 7$
      uitwerking: |-
        Horner met $a = 2$ op $2, 3, 0$: $2, 7, 14$, dus $2x + 7 + \frac{14}{x - 2}$. VA $x = 2$, SA $y = 2x + 7$.
    - opgave: |-
        $\dfrac{x^2 + 4}{x^2 - 4x}$
      antwoord: |-
        $x = 0$, $x = 4$; $y = 1$
      uitwerking: |-
        $x(x - 4)$, teller nooit nul: VA $x = 0$ en $x = 4$. HA $y = 1$.
    - opgave: |-
        $\dfrac{6 - 3x}{2x + 5}$
      antwoord: |-
        $x = -\frac52$; $y = -\frac32$
      uitwerking: |-
        VA $x = -\frac52$. Zelfde graad, hoogstegraadscoëfficiënten $-3$ en $2$: HA $y = -\frac32$.
    - opgave: |-
        $\dfrac{x^3 - 2}{x^2 + 1}$
      antwoord: |-
        $y = x$
      uitwerking: |-
        Geen VA. Staartdeling: $x^3 - 2 = x(x^2 + 1) - x - 2$, dus SA $y = x$.
    - opgave: |-
        $\dfrac{x - 1}{x^2 - 1}$
      antwoord: |-
        $x = -1$; $y = 0$
      uitwerking: |-
        $\frac{x - 1}{(x - 1)(x + 1)} = \frac{1}{x + 1}$: perforatie in $\bigl(1, \frac12\bigr)$, alleen VA $x = -1$. HA $y = 0$.
    - opgave: |-
        $\dfrac{x^3}{x - 1}$
      antwoord: |-
        $x = 1$
      uitwerking: |-
        VA $x = 1$. De graad van de teller is $2$ meer dan die van de noemer: geen HA of SA.
    - opgave: |-
        $\dfrac{2x^2 - 5x + 1}{x - 2}$
      antwoord: |-
        $x = 2$; $y = 2x - 1$
      uitwerking: |-
        Horner met $a = 2$ op $2, -5, 1$: $2, -1, -1$, dus $2x - 1 - \frac{1}{x - 2}$. VA $x = 2$, SA $y = 2x - 1$.
    - opgave: |-
        $\dfrac{x^2 + x - 2}{x^2 + 2x - 3}$
      antwoord: |-
        $x = -3$; $y = 1$
      uitwerking: |-
        $\frac{(x + 2)(x - 1)}{(x + 3)(x - 1)} = \frac{x + 2}{x + 3}$: perforatie in $\bigl(1, \frac34\bigr)$, VA $x = -3$, HA $y = 1$.
    - opgave: |-
        $\dfrac{3x^2 + 1}{x^2 + x + 1}$
      antwoord: |-
        $y = 3$
      uitwerking: |-
        De discriminant van de noemer is $-3 < 0$: geen VA. HA $y = 3$.
    - opgave: |-
        $\dfrac{x^2 - 4x + 1}{2x}$
      antwoord: |-
        $x = 0$; $y = \frac12 x - 2$
      uitwerking: |-
        Splits: $\frac{x^2}{2x} - \frac{4x}{2x} + \frac{1}{2x} = \frac12 x - 2 + \frac{1}{2x}$. VA $x = 0$, SA $y = \frac12 x - 2$.

- id: h2-o12
  soort: opdracht
  niveau: 1
  thema: |-
    fouten: asymptoten
  opgave: |-
    Waar zit de fout? Verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        `$f(x) = \dfrac{x^2 - 1}{x - 1}$ heeft een verticale asymptoot $x = 1$.'
      antwoord: |-
        perforatie in $(1, 2)$, geen VA
      uitwerking: |-
        $\frac{(x - 1)(x + 1)}{x - 1} = x + 1$ voor $x \neq 1$. Eerst vereenvoudigen: de grafiek is de rechte $y = x + 1$ met een gat in $(1, 2)$.
    - opgave: |-
        `$f(x) = \dfrac{x^3 + 1}{x^2}$ heeft horizontale asymptoot $y = 1$, want de hoogstegraadscoëfficiënten zijn $1$ en $1$.'
      antwoord: |-
        schuine asymptoot $y = x$
      uitwerking: |-
        Die regel geldt alleen als teller en noemer dezelfde graad hebben. Hier is de graad van de teller één meer: $f(x) = x + \frac{1}{x^2}$, met SA $y = x$.
    - opgave: |-
        `$f(x) = \dfrac{4x + 1}{2x - 3}$ heeft horizontale asymptoot $y = -\frac13$.'
      antwoord: |-
        $y = 2$
      uitwerking: |-
        Hier zijn de constante termen gedeeld. Je deelt de coëfficiënten van de hoogste macht: $y = \frac42 = 2$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    homografische functies
  opgave: |-
    Schrijf als $c + \frac{a}{x - p}$. Uit welke basisfunctie ontstaat de grafiek, en hoe? Geef de asymptoten.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\dfrac{2x + 1}{x - 1}$
      antwoord: |-
        $2 + \frac{3}{x - 1}$; $x = 1$ en $y = 2$
      uitwerking: |-
        $2x + 1 = 2(x - 1) + 3$, dus $f(x) = 2 + \frac{3}{x - 1}$: de grafiek van $\frac1x$, verticaal $\times 3$, 1 naar rechts, 2 naar boven. Asymptoten $x = 1$ en $y = 2$.
    - opgave: |-
        $\dfrac{x - 4}{x - 2}$
      antwoord: |-
        $1 - \frac{2}{x - 2}$; $x = 2$ en $y = 1$
      uitwerking: |-
        $x - 4 = (x - 2) - 2$, dus $1 - \frac{2}{x - 2}$: verticaal $\times 2$ en gespiegeld om de $x$-as (want $a = -2 < 0$), 2 naar rechts, 1 naar boven.
    - opgave: |-
        $\dfrac{3x + 7}{x + 2}$
      antwoord: |-
        $3 + \frac{1}{x + 2}$; $x = -2$ en $y = 3$
      uitwerking: |-
        $3x + 7 = 3(x + 2) + 1$, dus $3 + \frac{1}{x + 2}$: 2 naar links, 3 naar boven.
    - opgave: |-
        $\dfrac{6x - 1}{2x + 1}$
      antwoord: |-
        $3 - \frac{2}{x + \frac12}$; $x = -\frac12$ en $y = 3$
      uitwerking: |-
        $6x - 1 = 3(2x + 1) - 4$, dus $3 - \frac{4}{2x + 1} = 3 - \frac{2}{x + \frac12}$ (teller en noemer gedeeld door 2). Verticaal $\times 2$ en gespiegeld om de $x$-as, $\frac12$ naar links, 3 naar boven.

- id: h2-o11
  soort: opdracht
  niveau: 1
  thema: |-
    horizontale asymptoot met getallen
  opgave: |-
    Bereken $f(10)$, $f(100)$ en $f(1000)$ (tot op $0{,}0001$). Welke horizontale asymptoot vermoed je? Controleer met de regel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = \dfrac{3x + 1}{x - 2}$
      antwoord: |-
        $3{,}875$; $3{,}0714$; $3{,}0070$; $y = 3$
      uitwerking: |-
        $\frac{31}{8} = 3{,}875$, $\frac{301}{98} \approx 3{,}0714$, $\frac{3001}{998} \approx 3{,}0070$. Zelfde graad: $y = \frac31 = 3$.
    - opgave: |-
        $f(x) = \dfrac{x^2 + 1}{2x^2}$
      antwoord: |-
        $0{,}505$; $0{,}50005$; $0{,}5000$; $y = \frac12$
      uitwerking: |-
        $\frac{101}{200} = 0{,}505$, $\frac{10\,001}{20\,000} = 0{,}50005$ en $\frac{1\,000\,001}{2\,000\,000} \approx 0{,}5000$. Zelfde graad: $y = \frac12$.
    - opgave: |-
        $f(x) = \dfrac{5x}{x^2 + 1}$
      antwoord: |-
        $0{,}4950$; $0{,}0500$; $0{,}0050$; $y = 0$
      uitwerking: |-
        $\frac{50}{101} \approx 0{,}4950$, $\frac{500}{10\,001} \approx 0{,}0500$, $\frac{5000}{1\,000\,001} \approx 0{,}0050$. Graad teller kleiner: $y = 0$.

- id: h2-o9
  soort: opdracht
  niveau: 1
  thema: |-
    nulwaarden, perforaties en verticale asymptoten
  opgave: |-
    Bepaal domein, nulwaarden, perforaties en verticale asymptoten.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac{x^2 - 4x}{x^2 - 16}$
      antwoord: |-
        $\R \setminus \{\pm 4\}$; $0$; $(4, \frac12)$; $x = -4$
      uitwerking: |-
        $\frac{x(x - 4)}{(x - 4)(x + 4)} = \frac{x}{x + 4}$ voor $x \neq 4$. Nulwaarde $0$, perforatie $\bigl(4, \frac48\bigr) = \bigl(4, \frac12\bigr)$, VA $x = -4$.
    - opgave: |-
        $f(x) = \dfrac{x + 1}{x^3 - x}$
      antwoord: |-
        $\R \setminus \{-1, 0, 1\}$; geen; $(-1, \frac12)$; $x = 0$, $x = 1$
      uitwerking: |-
        $\frac{x + 1}{x(x - 1)(x + 1)} = \frac{1}{x(x - 1)}$ voor $x \neq -1$. Geen nulwaarden. Perforatie in $-1$ met $\frac{1}{(-1)(-2)} = \frac12$. VA $x = 0$ en $x = 1$.
    - opgave: |-
        $f(x) = \dfrac{x^2 + 2x + 1}{x^2 - 1}$
      antwoord: |-
        $\R \setminus \{\pm 1\}$; geen; $(-1, 0)$; $x = 1$
      uitwerking: |-
        $\frac{(x + 1)^2}{(x - 1)(x + 1)} = \frac{x + 1}{x - 1}$ voor $x \neq -1$. De vereenvoudigde functie is nul in $-1$, maar $-1$ hoort niet bij het domein: geen nulwaarde, wel een perforatie in $(-1, 0)$, een gat op de $x$-as. VA $x = 1$.
    - opgave: |-
        $f(x) = \dfrac{x^2 - 5x + 6}{x^2 + 1}$
      antwoord: |-
        $\R$; $2$ en $3$; geen; geen
      uitwerking: |-
        $x^2 + 1$ is nooit nul: domein $\R$, geen perforaties of VA. Teller $(x - 2)(x - 3)$: nulwaarden $2$ en $3$.

- id: h2-o14
  soort: opdracht
  niveau: 1
  thema: |-
    een grafiek lezen
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.35cm,font=\scriptsize]
        \rooster{-5}{1}{4}{-4}{1}{6}
        \draw[grijs,dashed] (-1,-4) -- (-1,6.3) (-5,2) -- (4.3,2);
        \kromme{-5}{-2}{(2*\x-2)/(\x+1)} \kromme{-.33}{4}{(2*\x-2)/(\x+1)}
        \vol{(1,0)} \vol{(0,-2)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van een homografische functie $f$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees het domein, de nulwaarde en de asymptoten af.
      antwoord: |-
        $\R \setminus \{-1\}$; $1$; $x = -1$ en $y = 2$
      uitwerking: |-
        De grafiek bestaat niet op de stippellijn $x = -1$: domein $\R \setminus \{-1\}$, VA $x = -1$. Ze snijdt de $x$-as in $1$. Voor grote $|x|$ nadert ze $y = 2$: HA.
    - opgave: |-
        Stel de tekentabel op.
      antwoord: |-
        \tekentabel{cccccc}{x & & -1 & & 1 & }{f(x) & + & | & - & 0 & +}
      uitwerking: |-
        Links van $-1$ ligt de grafiek boven de $x$-as, tussen $-1$ en $1$ eronder, rechts van $1$ erboven. \tekentabel{cccccc}{x & & -1 & & 1 & }{f(x) & + & | & - & 0 & +}

- id: h2-o4
  soort: opdracht
  niveau: 2
  thema: |-
    volledig schetsen
  opgave: |-
    Schets de grafiek van $f(x) = \dfrac{x^2}{x^2 - 1}$ met de werkwijze. Welke symmetrie heeft ze?
  antwoord: |-
    VA $x = \pm 1$; HA $y = 1$; nulwaarde $0$ (raakt)
  uitwerking: |-
    Domein $\R \setminus \{\pm 1\}$, geen perforaties, nulwaarde $0$ (dubbel: de grafiek raakt de $x$-as), VA $x = -1$ en $x = 1$, HA $y = 1$. $f(-x) = f(x)$: $f$ is even, symmetrisch om de $y$-as. \tekentabel{cccccccc}{x & & -1 & & 0 & & 1 & }{f(x) & + & | & - & 0 & - & | & +}
    \figuren{\begin{tikzpicture}[x=.45cm,y=.35cm,font=\scriptsize]
      \rooster{-4}{1}{4}{-3}{1}{5}
      \draw[grijs,dashed] (-1,-3) -- (-1,5.3) (1,-3) -- (1,5.3) (-4,1) -- (4.3,1);
      \kromme{-4}{-1.12}{(\x)^2/((\x)^2-1)} \kromme{-.86}{.86}{(\x)^2/((\x)^2-1)} \kromme{1.12}{4}{(\x)^2/((\x)^2-1)}
      \vol{(0,0)}
    \end{tikzpicture}}

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    een parameter: perforatie of asymptoot
  opgave: |-
    Neem $f(x) = \dfrac{x^2 + kx - 6}{x - 2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $k$ heeft de grafiek een perforatie in plaats van een verticale asymptoot? Hoe ziet de grafiek er dan uit?
      antwoord: |-
        $k = 1$; de rechte $y = x + 3$ met een gat in $(2, 5)$
      uitwerking: |-
        Een perforatie als de teller ook nul is in $2$: $4 + 2k - 6 = 0$, dus $k = 1$. Dan is $\frac{(x - 2)(x + 3)}{x - 2} = x + 3$ voor $x \neq 2$: een rechte met een gat in $(2, 5)$.
    - opgave: |-
        Geef de schuine asymptoot voor elke andere waarde van $k$.
      antwoord: |-
        $y = x + k + 2$
      uitwerking: |-
        Horner met $a = 2$ op $1, k, -6$: onderste rij $1,\ k + 2,\ 2k - 2$. Dus $f(x) = x + k + 2 + \frac{2k - 2}{x - 2}$: VA $x = 2$ en SA $y = x + k + 2$. Voor $k = 1$ is de rest $0$: dat is de perforatie van vraag a.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    vissen in een vijver
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.07cm,y=.006cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=10,ystep=100] (0,0) grid (60,500);
        \draw[->,grijs] (0,0) -- (64,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,560) node[above,text=black] {$P$};
        \foreach \t in {20,40,60}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {100,300,500}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \draw[grijs,dashed] (0,500) -- (60,500);
        \kromme{0}{60}{500-3000/(\x+10)}
      \end{tikzpicture}
  opgave: |-
    In een vijver worden vissen uitgezet. Na $t$ maanden zijn er $P(t) = \dfrac{500t + 2000}{t + 10}$ vissen.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $P(0)$, $P(10)$ en $P(40)$.
      antwoord: |-
        $200$; $350$; $440$
      uitwerking: |-
        $P(0) = \frac{2000}{10} = 200$, $P(10) = \frac{7000}{20} = 350$, $P(40) = \frac{22\,000}{50} = 440$.
    - opgave: |-
        Geef de horizontale asymptoot. Wat betekent ze?
      antwoord: |-
        $y = 500$
      uitwerking: |-
        Zelfde graad: $y = \frac{500}{1} = 500$. Op lange termijn zijn er ongeveer $500$ vissen: zoveel kan de vijver voeden.
    - opgave: |-
        Schrijf $P(t)$ als $c + \frac{a}{t + 10}$. Leg daarmee uit waarom er nooit $500$ vissen zijn.
      antwoord: |-
        $P(t) = 500 - \frac{3000}{t + 10}$
      uitwerking: |-
        $500t + 2000 = 500(t + 10) - 3000$, dus $P(t) = 500 - \frac{3000}{t + 10}$. Voor $t \geqslant 0$ is $\frac{3000}{t + 10} > 0$, dus $P(t) < 500$: de populatie nadert $500$ maar haalt het nooit.

- id: h2-o5
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift uit asymptoten
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
        \rooster{-3}{1}{5}{-3}{1}{4}
        \draw[grijs,dashed] (1,-3) -- (1,4.3) (-3,-1) -- (5.3,-1);
        \kromme{-3}{.2}{2/(\x-1)-1} \kromme{1.4}{5}{2/(\x-1)-1}
        \vol{(3,0)} \vol{(0,-3)}
      \end{tikzpicture}
  opgave: |-
    De grafiek hiernaast is van de vorm $f(x) = c + \dfrac{a}{x - p}$, met asymptoten $x = 1$ en $y = -1$, en gaat door $(3, 0)$. Geef het voorschrift.
  antwoord: |-
    $f(x) = -1 + \frac{2}{x - 1}$
  uitwerking: |-
    De VA $x = 1$ geeft $p = 1$, de HA $y = -1$ geeft $c = -1$. Het punt $(3, 0)$ invullen: $f(3) = -1 + \frac{a}{2} = 0$, dus $a = 2$. Controle met een ander punt van de grafiek: $f(0) = -1 - 2 = -3$.

- id: h2-o20
  soort: opdracht
  niveau: 2
  thema: |-
    boven of onder de asymptoot
  opgave: |-
    Ligt de grafiek boven of onder haar horizontale of schuine asymptoot? Schrijf eerst als $Q(x) + \frac{R(x)}{B(x)}$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac{2x^2 + 3}{x^2 + 1}$
      antwoord: |-
        altijd boven $y = 2$
      uitwerking: |-
        $2x^2 + 3 = 2(x^2 + 1) + 1$, dus $f(x) = 2 + \frac{1}{x^2 + 1}$. Het verschil met de HA $y = 2$ is $\frac{1}{x^2 + 1} > 0$: overal boven.
    - opgave: |-
        $f(x) = \dfrac{x^2 + 1}{x}$
      antwoord: |-
        boven $y = x$ voor $x > 0$, onder voor $x < 0$
      uitwerking: |-
        $f(x) = x + \frac1x$: SA $y = x$. Het verschil $\frac1x$ is positief voor $x > 0$ (boven) en negatief voor $x < 0$ (onder).
        \figuren{\begin{tikzpicture}[x=.4cm,y=.4cm,font=\scriptsize]
          \rooster{-4}{1}{4}{-4}{1}{4}
          \draw[grijs,dashed] (-4,-4) -- (4,4);
          \kromme{-3.7}{-.27}{\x+1/\x} \kromme{.27}{3.7}{\x+1/\x}
        \end{tikzpicture}}

- id: h2-o21
  soort: opdracht
  niveau: 2
  thema: |-
    fouten: perforatie of asymptoot
  opgave: |-
    Waar zit de fout? Verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        `$f(x) = \dfrac{x - 2}{x^2 - 4}$ heeft verticale asymptoten $x = 2$ en $x = -2$.'
      antwoord: |-
        alleen VA $x = -2$; perforatie $(2, \frac14)$
      uitwerking: |-
        Eerst vereenvoudigen: $\frac{x - 2}{(x - 2)(x + 2)} = \frac{1}{x + 2}$ voor $x \neq 2$. In $2$ is er een perforatie, met $\frac{1}{4}$; alleen $x = -2$ is een VA.
    - opgave: |-
        `$f(x) = \dfrac{x^2 - 1}{(x + 1)^2}$ heeft een perforatie in $-1$, want je kunt $x + 1$ schrappen.'
      antwoord: |-
        VA $x = -1$, geen perforatie
      uitwerking: |-
        $\frac{(x - 1)(x + 1)}{(x + 1)^2} = \frac{x - 1}{x + 1}$: na het schrappen staat $x + 1$ nog in de noemer. Dus is $x = -1$ een VA. Een perforatie is er alleen als de factor helemaal uit de noemer verdwijnt.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    schetsen met de werkwijze
  opgave: |-
    Schets de grafiek met de zeven stappen van de werkwijze.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = \dfrac{x^2 - 2x}{x - 1}$
      antwoord: |-
        nulwaarden $0$, $2$; VA $x = 1$; SA $y = x - 1$
      uitwerking: |-
        Domein $\R \setminus \{1\}$, geen perforaties. Nulwaarden $0$ en $2$. VA $x = 1$. Horner: $f(x) = x - 1 - \frac{1}{x - 1}$, SA $y = x - 1$. $f(0) = 0$. \tekentabel{cccccccc}{x & & 0 & & 1 & & 2 & }{f(x) & - & 0 & + & | & - & 0 & +}
        \figuren{\begin{tikzpicture}[x=.4cm,y=.4cm,font=\scriptsize]
          \rooster{-3}{1}{5}{-4}{1}{4}
          \draw[grijs,dashed] (1,-4) -- (1,4.3) (-3,-4) -- (5,4);
          \kromme{-3}{.76}{\x-1-1/(\x-1)} \kromme{1.24}{5}{\x-1-1/(\x-1)}
          \vol{(0,0)} \vol{(2,0)}
        \end{tikzpicture}}
    - opgave: |-
        $f(x) = \dfrac{x + 1}{x^2 - 2x}$
      antwoord: |-
        nulwaarde $-1$; VA $x = 0$, $x = 2$; HA $y = 0$
      uitwerking: |-
        Domein $\R \setminus \{0, 2\}$, geen perforaties. Nulwaarde $-1$. VA $x = 0$ en $x = 2$. Graad teller kleiner: HA $y = 0$. $f(1) = -2$, $f(3) = \frac43$. \tekentabel{cccccccc}{x & & -1 & & 0 & & 2 & }{f(x) & - & 0 & + & | & - & | & +}
        \figuren{\begin{tikzpicture}[x=.4cm,y=.4cm,font=\scriptsize]
          \rooster{-3}{1}{5}{-3}{1}{3}
          \draw[grijs,dashed] (0,-3) -- (0,3.3) (2,-3) -- (2,3.3);
          \kromme{-3}{-.14}{(\x+1)/((\x)^2-2*\x)} \kromme{.24}{1.43}{(\x+1)/((\x)^2-2*\x)} \kromme{2.47}{5}{(\x+1)/((\x)^2-2*\x)}
          \vol{(-1,0)}
        \end{tikzpicture}}
    - opgave: |-
        $f(x) = \dfrac{x^2 - x - 2}{x^2 - 4}$
      antwoord: |-
        nulwaarde $-1$; perforatie $(2, \frac34)$; VA $x = -2$; HA $y = 1$
      uitwerking: |-
        $\frac{(x - 2)(x + 1)}{(x - 2)(x + 2)} = \frac{x + 1}{x + 2}$ voor $x \neq 2$: perforatie in $\bigl(2, \frac34\bigr)$. Nulwaarde $-1$, VA $x = -2$, HA $y = 1$. $f(0) = \frac12$. \tekentabel{cccccc}{x & & -2 & & -1 & }{f(x) & + & | & - & 0 & +}
        \figuren{\begin{tikzpicture}[x=.4cm,y=.4cm,font=\scriptsize]
          \rooster{-6}{1}{4}{-3}{1}{4}
          \draw[grijs,dashed] (-2,-3) -- (-2,4.3) (-6,1) -- (4.3,1);
          \kromme{-6}{-2.34}{(\x+1)/(\x+2)} \kromme{-1.75}{4}{(\x+1)/(\x+2)}
          \vol{(-1,0)} \open{(2,.75)}
        \end{tikzpicture}}

- id: h2-o22
  soort: opdracht
  niveau: 2
  thema: |-
    coëfficiënten uit asymptoten
  opgave: |-
    Bepaal de onbekende coëfficiënten.
  lijst: enumerate
  delen:
    - opgave: |-
        De grafiek van $f(x) = \dfrac{ax + 1}{x + b}$ heeft asymptoten $x = 2$ en $y = 3$. Bepaal $a$ en $b$.
      antwoord: |-
        $a = 3$, $b = -2$
      uitwerking: |-
        De noemer is nul in $2$: $2 + b = 0$, dus $b = -2$. De HA is het quotiënt van de hoogstegraadscoëfficiënten: $\frac{a}{1} = 3$, dus $a = 3$. Controle: in $2$ is de teller $7 \neq 0$, dus geen perforatie.
    - opgave: |-
        Bepaal $c$ zodat de grafiek van $g(x) = \dfrac{3x + c}{x - 2}$ door $(1, -4)$ gaat. Wat is dan de nulwaarde van $g$?
      antwoord: |-
        $c = 1$; $-\frac13$
      uitwerking: |-
        $g(1) = \frac{3 + c}{-1} = -4$, dus $3 + c = 4$ en $c = 1$. Nulwaarde: $3x + 1 = 0$, dus $x = -\frac13$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    gemiddelde snelheid
  opgave: |-
    Je fietst $20$ km naar je grootouders aan $20$ km/h, en dezelfde weg terug aan $v$ km/h.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat je gemiddelde snelheid over de hele rit $V(v) = \dfrac{40v}{v + 20}$ is.
      antwoord: |-
        $40$ km in $1 + \frac{20}{v}$ uur
      uitwerking: |-
        Heen duurt $\frac{20}{20} = 1$ uur, terug $\frac{20}{v}$ uur. Gemiddeld: $V(v) = \frac{40}{1 + \frac{20}{v}} = \frac{40v}{v + 20}$ (teller en noemer maal $v$).
    - opgave: |-
        Bereken $V(10)$, $V(20)$ en $V(60)$. Is de gemiddelde snelheid het gemiddelde van de twee snelheden?
      antwoord: |-
        $13{,}3$; $20$; $30$ km/h; nee
      uitwerking: |-
        $V(10) = \frac{400}{30} \approx 13{,}3$, $V(20) = \frac{800}{40} = 20$, $V(60) = \frac{2400}{80} = 30$. Niet het gemiddelde: voor $v = 60$ zou dat $40$ zijn. Je rijdt langer aan de lage snelheid, dus die weegt zwaarder.
    - opgave: |-
        Geef de horizontale asymptoot. Wat betekent ze?
      antwoord: |-
        $y = 40$
      uitwerking: |-
        HA $y = \frac{40}{1} = 40$. Hoe snel je ook terugrijdt, gemiddeld haal je nooit $40$ km/h: alleen al heen duurt een uur, en in een uur rijd je hoogstens die $40$ km als terugrijden geen tijd kost.

- id: h2-o6
  soort: opdracht
  niveau: 2
  thema: |-
    snijpunt met de asymptoot
  opgave: |-
    Neem $f(x) = \dfrac{x + 1}{x^2}$. Bepaal de asymptoten en onderzoek of de grafiek de horizontale asymptoot snijdt. Kan dat ook bij een verticale asymptoot?
  antwoord: |-
    ja; $x = 0$, $y = 0$; snijpunt $(-1, 0)$
  uitwerking: |-
    VA $x = 0$, en graad teller kleiner: HA $y = 0$. Los $f(x) = 0$ op: $x + 1 = 0$, dus $x = -1$. De grafiek snijdt de asymptoot in $(-1, 0)$. Dat mag: een horizontale asymptoot zegt alleen iets over het gedrag voor grote $|x|$. Een verticale asymptoot $x = a$ kan de grafiek nooit snijden, want $a$ hoort niet bij het domein.

- id: h2-o23
  soort: opdracht
  niveau: 2
  thema: |-
    een schuine asymptoot aflezen
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.3cm,font=\scriptsize]
        \rooster{-3}{1}{6}{-4}{1}{8}
        \draw[grijs,dashed] (2,-4) -- (2,8.3) (-3,-2) -- (6,7);
        \kromme{-3}{1.7}{\x+1+2/(\x-2)} \kromme{2.44}{6}{\x+1+2/(\x-2)}
        \vol{(0,0)} \vol{(1,0)} \vol{(3,6)} \vol{(4,6)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f(x) = x + b + \dfrac{a}{x - p}$, met haar asymptoten.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees de verticale asymptoot, de schuine asymptoot en de nulwaarden af.
      antwoord: |-
        $x = 2$; $y = x + 1$; $0$ en $1$
      uitwerking: |-
        De verticale stippellijn is $x = 2$. De schuine gaat door $(0, 1)$ en $(1, 2)$: richtingscoëfficiënt $1$, dus $y = x + 1$. De grafiek snijdt de $x$-as in $0$ en $1$.
    - opgave: |-
        Bepaal $a$, $b$ en $p$. Controleer met een ander punt.
      antwoord: |-
        $a = 2$, $b = 1$, $p = 2$
      uitwerking: |-
        De VA geeft $p = 2$, de SA geeft $b = 1$. Uit $f(0) = 0 + 1 + \frac{a}{-2} = 0$ volgt $a = 2$. Controle: $f(3) = 3 + 1 + 2 = 6$ en $f(4) = 4 + 1 + 1 = 6$, zoals op de figuur.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift met twee verticale asymptoten
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
        \rooster{-3}{1}{5}{-4}{1}{4}
        \draw[grijs,dashed] (-1,-4) -- (-1,4.3) (3,-4) -- (3,4.3);
        \kromme{-3}{-1.41}{3*(\x-1)/((\x+1)*(\x-3))}
        \kromme{-.66}{2.66}{3*(\x-1)/((\x+1)*(\x-3))}
        \kromme{3.41}{5}{3*(\x-1)/((\x+1)*(\x-3))}
        \vol{(1,0)} \vol{(0,1)}
      \end{tikzpicture}
  opgave: |-
    De grafiek hiernaast heeft verticale asymptoten $x = -1$ en $x = 3$, horizontale asymptoot $y = 0$, een nulwaarde in $1$, en gaat door $(0, 1)$. Geef een voorschrift van de vorm $f(x) = \frac{a(x - n)}{(x - p)(x - q)}$.
  antwoord: |-
    $f(x) = \dfrac{3(x - 1)}{(x + 1)(x - 3)}$
  uitwerking: |-
    VA in $-1$ en $3$: noemer $(x + 1)(x - 3)$. Nulwaarde $1$: teller $a(x - 1)$. Graad teller kleiner dan graad noemer, dus HA $y = 0$: dat klopt. Uit $f(0) = \frac{-a}{-3} = \frac{a}{3} = 1$ volgt $a = 3$. Controle: $f(2) = \frac{3}{3 \cdot (-1)} = -1$, zoals op de figuur.

- id: h2-o7
  soort: opdracht
  niveau: 3
  thema: |-
    een functie ontwerpen
  opgave: |-
    Geef een rationale functie met verticale asymptoten $x = -1$ en $x = 3$, horizontale asymptoot $y = 2$, en een nulwaarde in $0$.
  antwoord: |-
    bijvoorbeeld $\frac{2x(x - 1)}{(x + 1)(x - 3)}$
  uitwerking: |-
    Noemer $(x + 1)(x - 3)$. Voor HA $y = 2$ moet de teller dezelfde graad hebben, met hoogstegraadscoëfficiënt $2$, en nul zijn in $0$: bijvoorbeeld $2x(x - 1)$. Controle: de teller is niet nul in $-1$ of $3$, dus geen perforaties. Ook $\frac{2x^2}{(x + 1)(x - 3)}$ kan.

- id: h2-o25
  soort: opdracht
  niveau: 3
  thema: |-
    een familie van functies
  opgave: |-
    Neem $f(x) = \dfrac{x^2 + k}{x - 1}$, met $k$ een reëel getal.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $k$ is er een perforatie? Hoe ziet de grafiek er dan uit?
      antwoord: |-
        $k = -1$; $y = x + 1$ met een gat in $(1, 2)$
      uitwerking: |-
        De teller moet nul zijn in $1$: $1 + k = 0$, dus $k = -1$. Dan is $\frac{(x - 1)(x + 1)}{x - 1} = x + 1$ voor $x \neq 1$: een rechte met een gat in $(1, 2)$.
    - opgave: |-
        Toon aan dat de grafiek voor elke andere $k$ dezelfde schuine asymptoot heeft.
      antwoord: |-
        $y = x + 1$
      uitwerking: |-
        Horner met $a = 1$ op $1, 0, k$: onderste rij $1, 1, k + 1$. Dus $f(x) = x + 1 + \frac{k + 1}{x - 1}$: SA $y = x + 1$, los van $k$. Alleen de rest $k + 1$ hangt af van $k$.
    - opgave: |-
        Voor welke $k$ heeft $f$ geen nulwaarden?
      antwoord: |-
        $k > 0$
      uitwerking: |-
        $x^2 + k = 0$ heeft geen oplossing als $k > 0$. Voor $k = 0$ is $0$ een nulwaarde, en voor $k < 0$ zijn $\pm\sqrt{-k}$ nulwaarden, behalve als een ervan $1$ is: dat gebeurt voor $k = -1$, en dan blijft $-1$ over. Geen nulwaarden dus alleen voor $k > 0$.

- id: h2-o24
  soort: opdracht
  niveau: 3
  thema: |-
    redeneren over asymptoten
  opgave: |-
    Kan dat bij een rationale functie? Leg uit.
  lijst: enumerate
  delen:
    - opgave: |-
        Twee verschillende horizontale asymptoten: één voor grote positieve $x$ en één voor grote negatieve $x$.
      antwoord: |-
        nee
      uitwerking: |-
        $f(x) = Q(x) + \frac{R(x)}{B(x)}$ en $\frac{R(x)}{B(x)}$ wordt willekeurig klein, zowel voor grote positieve als voor grote negatieve $x$. Aan beide kanten gedraagt $f$ zich dus zoals hetzelfde quotiënt $Q(x)$.
    - opgave: |-
        Een horizontale én een schuine asymptoot.
      antwoord: |-
        nee
      uitwerking: |-
        Om dezelfde reden: er is één quotiënt $Q(x)$. Is het een getal, dan is er een HA; is het van graad 1, dan een SA. Beide tegelijk kan niet.
    - opgave: |-
        Vier verticale asymptoten, met een noemer van graad 3.
      antwoord: |-
        nee
      uitwerking: |-
        Elke VA komt van een nulwaarde van de noemer, en een veelterm van graad 3 heeft hoogstens drie nulwaarden (factorstelling).

- id: h2-o27
  soort: opdracht
  niveau: 3
  thema: |-
    ontwerpen met een schuine asymptoot
  opgave: |-
    Een rationale functie heeft verticale asymptoot $x = 0$ en schuine asymptoot $y = 2x - 1$, en voor $x > 0$ ligt haar grafiek onder de schuine asymptoot. Geef zo'n functie waarvan de grafiek voor $x < 0$ boven de asymptoot ligt, en een andere waarvan ze er voor $x < 0$ onder ligt.
  antwoord: |-
    bijvoorbeeld $2x - 1 - \frac1x$ en $2x - 1 - \frac{1}{x^2}$
  uitwerking: |-
    Schrijf $f(x) = 2x - 1 + r(x)$, met een breuk $r(x)$ die willekeurig klein wordt voor grote $|x|$ en een noemer die nul is in $0$. Dan is $x = 0$ een VA en $y = 2x - 1$ de SA, en het teken van $r(x)$ zegt of de grafiek boven of onder de asymptoot ligt.\\
    Met $r(x) = -\frac1x$: negatief voor $x > 0$, positief voor $x < 0$. Dus $f(x) = 2x - 1 - \frac1x = \frac{2x^2 - x - 1}{x}$ ligt links boven de asymptoot.\\
    Met $r(x) = -\frac{1}{x^2}$: negatief voor elke $x \neq 0$. Dus $g(x) = 2x - 1 - \frac{1}{x^2} = \frac{2x^3 - x^2 - 1}{x^2}$ ligt aan beide kanten onder de asymptoot.

- id: h2-o26
  soort: opdracht
  niveau: 3
  thema: |-
    symmetrie van een homografische functie
  opgave: |-
    Neem $f(x) = \dfrac{2x + 1}{x - 1}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $f(1 + h) + f(1 - h) = 4$ voor elke $h \neq 0$. Wat betekent dat voor de grafiek?
      antwoord: |-
        puntsymmetrisch om $(1, 2)$
      uitwerking: |-
        $f(x) = 2 + \frac{3}{x - 1}$, dus $f(1 + h) = 2 + \frac3h$ en $f(1 - h) = 2 - \frac3h$. Samen $4$. Het midden van $(1 + h, f(1 + h))$ en $(1 - h, f(1 - h))$ is dus $(1, 2)$: de grafiek is puntsymmetrisch om $(1, 2)$, het snijpunt van de asymptoten.
    - opgave: |-
        Geldt dat voor elke functie $c + \frac{a}{x - p}$?
      antwoord: |-
        ja, om $(p, c)$
      uitwerking: |-
        $f(p + h) + f(p - h) = c + \frac{a}{h} + c - \frac{a}{h} = 2c$. Elke homografische functie is puntsymmetrisch om $(p, c)$, het snijpunt van haar asymptoten. Dat volgt ook uit de transformatie: de grafiek van $\frac1x$ is puntsymmetrisch om $(0, 0)$.

- id: h2-o8
  soort: opdracht
  niveau: 3
  thema: |-
    gemiddelde kost
  opgave: |-
    Een bedrijf heeft $1200$ euro vaste kosten. Elk stuk kost $5$ euro aan materiaal, en door overuren komt daar per stuk $0{,}01q$ euro bij als er $q$ stuks gemaakt worden. De totale kost is dus $K(q) = 1200 + 5q + 0{,}01q^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de gemiddelde kost $G(q) = \frac{K(q)}{q}$ en haar asymptoten.
      antwoord: |-
        $G(q) = \frac{1200}{q} + 5 + 0{,}01q$; $q = 0$ en $y = 0{,}01q + 5$
      uitwerking: |-
        Term per term delen door $q$: $G(q) = 0{,}01q + 5 + \frac{1200}{q}$. De noemer is nul voor $q = 0$: VA $q = 0$. Het verschil met $0{,}01q + 5$ is $\frac{1200}{q}$, dat willekeurig klein wordt: SA $y = 0{,}01q + 5$.
    - opgave: |-
        Bereken $G(100)$, $G(300)$, $G(350)$ en $G(500)$. Wat valt op?
      antwoord: |-
        $18$; $12$; $\approx 11{,}93$; $12{,}4$
      uitwerking: |-
        $G(100) = 1 + 5 + 12 = 18$, $G(300) = 3 + 5 + 4 = 12$, $G(350) = 3{,}5 + 5 + 3{,}43 \approx 11{,}93$ en $G(500) = 5 + 5 + 2{,}4 = 12{,}40$ euro. De gemiddelde kost daalt eerst (de vaste kosten worden verdeeld) en stijgt dan weer (de overuren). Ergens tussen $300$ en $500$ ligt een minimum (bij $q \approx 346$, zie later met afgeleiden).

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 1
  koppel:
    rubriek: analyse
    onderwerp: Algemene functies
  thema: |-
    inverse van een homografische functie
  opgave: |-
    Bepaal de inverse van $f(x) = \dfrac{x + 2}{x - 1}$. Wat merk je op? Wat betekent dat voor de grafiek?
  antwoord: |-
    $\inv{f} = f$; symmetrisch om $y = x$
  uitwerking: |-
    $y(x - 1) = x + 2 \iff x(y - 1) = y + 2 \iff x = \frac{y + 2}{y - 1}$. Dus $\inv{f} = f$: de grafiek is symmetrisch ten opzichte van $y = x$. Ook de asymptoten $x = 1$ en $y = 1$ zijn elkaars spiegelbeeld.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Afgeleiden
  thema: |-
    een asymptoot als limiet
  opgave: |-
    Bereken $f(x) - (x + 2)$ voor $f(x) = \dfrac{x^2 + x - 1}{x - 1}$ en $x = 10$, $100$, $1000$. Wat gebeurt er met het verschil? Hoe schrijf je dat met een limiet?
  antwoord: |-
    $\frac19$; $\frac{1}{99}$; $\frac{1}{999}$; het nadert 0
  uitwerking: |-
    Het verschil is $\frac{1}{x - 1}$: $0{,}111$, $0{,}0101$, $0{,}001$. Het nadert 0: $\lim_{x \to +\infty} \bigl(f(x) - (x + 2)\bigr) = 0$. Dat is de definitie van een schuine asymptoot.

- id: h2-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Integralen
  thema: |-
    splitsen voor een primitieve
  opgave: |-
    Schrijf $f(x) = \dfrac{x^2 + x - 1}{x - 1}$ als $x + 2 + \frac{1}{x - 1}$ en bereken $\int_2^3 f(x)\,\mathrm{d}x$. Een primitieve van $\frac{1}{x - 1}$ is $\ln|x - 1|$.
  antwoord: |-
    $\frac92 + \ln 2 \approx 5{,}19$
  uitwerking: |-
    $\Bigl[\frac{x^2}{2} + 2x + \ln|x - 1|\Bigr]_2^3 = \bigl(4{,}5 + 6 + \ln 2\bigr) - (2 + 4 + 0) = 4{,}5 + \ln 2 \approx 5{,}19$.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    perforatie
  opgave: |-
    Bepaal domein, nulwaarden en perforaties van $f(x) = \dfrac{x^2 - 3x}{x^2 - 9}$.
  antwoord: |-
    $\R \setminus \{-3, 3\}$; $0$; perforatie $(3, \frac12)$
  uitwerking: |-
    $\frac{x(x - 3)}{(x - 3)(x + 3)} = \frac{x}{x + 3}$ voor $x \neq 3$. Nulwaarde $0$, perforatie in $\bigl(3, \frac12\bigr)$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    horizontale asymptoot
  opgave: |-
    Bepaal de asymptoten van $f(x) = \dfrac{3x^2 - 2}{x^2 - 4}$.
  antwoord: |-
    $x = \pm 2$; $y = 3$
  uitwerking: |-
    VA $x = -2$ en $x = 2$ (de teller is daar $10 \neq 0$). HA $y = 3$.

- id: h2-t5
  soort: test
  niveau: 1
  thema: |-
    homografische functie
  opgave: |-
    Schrijf $f(x) = \dfrac{3x - 1}{x + 1}$ als $c + \frac{a}{x - p}$. Geef de asymptoten en zeg hoe de grafiek ontstaat uit die van $\frac1x$.
  antwoord: |-
    $3 - \frac{4}{x + 1}$; $x = -1$ en $y = 3$
  uitwerking: |-
    $3x - 1 = 3(x + 1) - 4$, dus $f(x) = 3 - \frac{4}{x + 1}$. Asymptoten $x = -1$ en $y = 3$. De grafiek van $\frac1x$: verticaal $\times 4$ en gespiegeld om de $x$-as, $1$ naar links, $3$ naar boven.

- id: h2-t3
  soort: test
  niveau: 2
  thema: |-
    schuine asymptoot
  opgave: |-
    Bepaal de asymptoten van $f(x) = \dfrac{x^2 - 2x + 3}{x + 1}$.
  antwoord: |-
    $x = -1$; $y = x - 3$
  uitwerking: |-
    Horner met $a = -1$: $1, -3, 6$, dus $f(x) = x - 3 + \frac{6}{x + 1}$. VA $x = -1$, SA $y = x - 3$.

- id: h2-t4
  soort: test
  niveau: 2
  thema: |-
    schetsen
  opgave: |-
    Schets $f(x) = \dfrac{x + 2}{x^2 - 1}$: domein, nulwaarde, asymptoten en tekentabel.
  antwoord: |-
    \tekentabel{cccccccc}{x & & -2 & & -1 & & 1 & }{f(x) & - & 0 & + & | & - & | & +}
  uitwerking: |-
    Domein $\R \setminus \{\pm 1\}$, nulwaarde $-2$, VA $x = \pm 1$, HA $y = 0$. \tekentabel{cccccccc}{x & & -2 & & -1 & & 1 & }{f(x) & - & 0 & + & | & - & | & +}
