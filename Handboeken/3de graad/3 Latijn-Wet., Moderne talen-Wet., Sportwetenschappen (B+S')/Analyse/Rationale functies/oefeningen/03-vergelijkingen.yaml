# Oefeningen van hoofdstuk 3. Zie oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Zet op één noemer: $\dfrac1x + \dfrac{1}{x + 1}$.
      antwoord: |-
        $\frac{2x + 1}{x(x + 1)}$
      uitwerking: |-
        $\frac{x + 1 + x}{x(x + 1)} = \frac{2x + 1}{x(x + 1)}$.
    - opgave: |-
        Los op: $3x^2 - 7x + 2 = 0$.
      antwoord: |-
        $x = 2$ of $x = \frac13$
      uitwerking: |-
        $D = 49 - 24 = 25$, $x = \frac{7 \pm 5}{6}$.
    - opgave: |-
        Los op: $-3x > 6$.
      antwoord: |-
        $x < -2$
      uitwerking: |-
        Delen door $-3$ keert het teken om.
    - opgave: |-
        Wat is het teken van $\frac{x - 1}{x + 2}$ voor $x = 0$?
      antwoord: |-
        negatief
      uitwerking: |-
        $\frac{-1}{2} < 0$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Een leerling lost $\dfrac{1}{x} < 2$ op door met $x$ te vermenigvuldigen: $1 < 2x$, dus $x > \frac12$.
  lijst: enumerate
  delen:
    - opgave: |-
        Vul $x = -1$ in de oorspronkelijke ongelijkheid in. Klopt ze?
      antwoord: |-
        ja: $-1 < 2$
      uitwerking: |-
        $\frac{1}{-1} = -1 < 2$: klopt, maar $-1$ zit niet in de oplossing van de leerling.
    - opgave: |-
        Waar zit de fout?
      antwoord: |-
        $x$ kan negatief zijn
      uitwerking: |-
        Voor $x < 0$ keert het teken om bij vermenigvuldigen met $x$. De leerling heeft alleen het geval $x > 0$ opgelost.
    - opgave: |-
        Wat is de juiste oplossing? Gebruik de grafiek van $\frac1x$.
      antwoord: |-
        $x < 0$ of $x > \frac12$
      uitwerking: |-
        De grafiek ligt onder $y = 2$ voor alle negatieve $x$ en voor $x > \frac12$.

- id: h3-kgv
  soort: kort
  opgave: |-
    Los op. Vermenigvuldig met het kgv van de noemers.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac1x + \dfrac{1}{x + 2} = \dfrac43$
      antwoord: |-
        $x = 1$ of $x = -\frac32$
      uitwerking: |-
        $x \neq 0$, $x \neq -2$. Maal $3x(x + 2)$: $3(x + 2) + 3x = 4x(x + 2)$, dus $4x^2 + 2x - 6 = 0$ of $2x^2 + x - 3 = 0$. Discriminant $25$: $x = 1$ of $x = -\frac32$. Beide voldoen.
    - opgave: |-
        $\dfrac{x}{x - 1} - \dfrac{2}{x + 1} = 1$
      antwoord: |-
        $x = 3$
      uitwerking: |-
        $x \neq \pm 1$. Maal $(x - 1)(x + 1)$: $x(x + 1) - 2(x - 1) = x^2 - 1$, dus $x^2 - x + 2 = x^2 - 1$ en $x = 3$. Voldoet.
    - opgave: |-
        $\dfrac{4}{x^2 - 1} + \dfrac{1}{x - 1} = 1$
      antwoord: |-
        $x = 3$ of $x = -2$
      uitwerking: |-
        $x \neq \pm 1$. Het kgv is $x^2 - 1 = (x - 1)(x + 1)$: $4 + (x + 1) = x^2 - 1$, dus $x^2 - x - 6 = 0$ en $x = 3$ of $x = -2$. Beide voldoen.

- id: h3-vals
  soort: kort
  opgave: |-
    Los op. Controleer met de bestaansvoorwaarden.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x + \dfrac{6}{x - 3} = \dfrac{2x}{x - 3}$
      antwoord: |-
        $x = 2$
      uitwerking: |-
        $x \neq 3$. Maal $x - 3$: $x(x - 3) + 6 = 2x$, dus $x^2 - 5x + 6 = 0$ en $x = 2$ of $x = 3$. Alleen $x = 2$ voldoet.
    - opgave: |-
        $\dfrac{1}{x - 2} + \dfrac{1}{x + 2} = \dfrac{4}{x^2 - 4}$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        $x \neq \pm 2$. Maal $x^2 - 4$: $(x + 2) + (x - 2) = 4$, dus $x = 2$. Dat voldoet niet: geen oplossing.
    - opgave: |-
        $\dfrac{x^2}{x + 1} = \dfrac{1}{x + 1}$
      antwoord: |-
        $x = 1$
      uitwerking: |-
        $x \neq -1$. Maal $x + 1$: $x^2 = 1$, dus $x = \pm 1$. Alleen $x = 1$ voldoet.

- id: h3-vergelijking
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x + 1}{x - 2} = 3$
      antwoord: |-
        $x = \frac72$
      uitwerking: |-
        $x \neq 2$. Maal $x - 2$: $x + 1 = 3x - 6$, dus $2x = 7$ en $x = \frac72$. Voldoet.
    - opgave: |-
        $\dfrac{2x}{x + 1} = \dfrac{x - 2}{x + 1}$
      antwoord: |-
        $x = -2$
      uitwerking: |-
        $x \neq -1$. Maal $x + 1$: $2x = x - 2$ geeft $x = -2$, en dat voldoet.

- id: h3-ongelijkheid
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x - 3}{x + 1} \leqslant 0$
      antwoord: |-
        $\left]-1, 3\right]$
      uitwerking: |-
        Nulwaarde $3$, pool $-1$: \tekentabel{cccccc}{x & & -1 & & 3 & }{f & + & | & - & 0 & +} Oplossing $\left]-1, 3\right]$: de nulwaarde hoort erbij, de pool niet.
    - opgave: |-
        $\dfrac{1}{x} < 2$
      antwoord: |-
        $\left]-\infty, 0\right[ \cup \left]\frac12, +\infty\right[$
      uitwerking: |-
        $\frac1x - 2 < 0$, dus $\frac{1 - 2x}{x} < 0$: nulwaarde $\frac12$, pool $0$. \tekentabel{cccccc}{x & & 0 & & \frac12 & }{f & - & | & + & 0 & -} Negatief voor $x < 0$ en $x > \frac12$.

- id: h3-tekentabel
  soort: kort
  opgave: |-
    Los op. Ontbind eerst teller en noemer.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{x^2 - 4}{x + 1} < 0$
      antwoord: |-
        $\left]-\infty, -2\right[ \cup \left]-1, 2\right[$
      uitwerking: |-
        $\frac{(x - 2)(x + 2)}{x + 1} < 0$. Nulwaarden $\pm 2$, pool $-1$: \tekentabel{cccccccc}{x & & -2 & & -1 & & 2 & }{f & - & 0 & + & | & - & 0 & +} Oplossing $\left]-\infty, -2\right[ \cup \left]-1, 2\right[$.
    - opgave: |-
        $\dfrac{(x - 1)^2}{x + 3} \geqslant 0$
      antwoord: |-
        $\left]-3, +\infty\right[$
      uitwerking: |-
        De teller is nooit negatief, dus het teken is dat van $x + 3$, behalve in $1$ waar de breuk nul is. \tekentabel{cccccc}{x & & -3 & & 1 & }{f & - & | & + & 0 & +} Oplossing $\left]-3, +\infty\right[$: de nulwaarde $1$ hoort erbij.
    - opgave: |-
        $\dfrac{3}{x + 1} \leqslant x - 1$
      antwoord: |-
        $\left[-2, -1\right[ \cup \left[2, +\infty\right[$
      uitwerking: |-
        $\frac{3 - (x - 1)(x + 1)}{x + 1} \leqslant 0$, dus $\frac{4 - x^2}{x + 1} = \frac{(2 - x)(2 + x)}{x + 1} \leqslant 0$. \tekentabel{cccccccc}{x & & -2 & & -1 & & 2 & }{f & + & 0 & - & | & + & 0 & -} Oplossing $\left[-2, -1\right[ \cup \left[2, +\infty\right[$.

- id: h3-grafisch
  soort: kort
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.35cm,font=\scriptsize]
        \rooster{-3}{1}{5}{-3}{1}{5}
        \draw[grijs,dashed] (1,-3) -- (1,5.3) (-3,1) -- (5.3,1);
        \draw[accent,dashed] (-3,3) -- (5,3);
        \kromme{-3}{.5}{(\x+1)/(\x-1)} \kromme{1.5}{5}{(\x+1)/(\x-1)}
        \vol{(2,3)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f(x) = \dfrac{x + 1}{x - 1}$ en de rechte ${y = 3}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af: voor welke $x$ is $f(x) > 3$? Controleer met een berekening.
      antwoord: |-
        $\left]1, 2\right[$
      uitwerking: |-
        De grafiek ligt boven de rechte tussen de asymptoot $x = 1$ en het snijpunt in $x = 2$. Berekening: $\frac{x + 1 - 3(x - 1)}{x - 1} = \frac{4 - 2x}{x - 1} > 0$, met nulwaarde $2$ en pool $1$: \tekentabel{cccccc}{x & & 1 & & 2 & }{f & - & | & + & 0 & -} Oplossing $\left]1, 2\right[$.
    - opgave: |-
        Lees af: voor welke $x$ is $f(x) \leqslant 0$?
      antwoord: |-
        $\left[-1, 1\right[$
      uitwerking: |-
        De grafiek ligt op of onder de $x$-as van de nulwaarde $-1$ tot de asymptoot $x = 1$: $\left[-1, 1\right[$.

- id: h3-context
  soort: kort
  opgave: |-
    Een lens met brandpuntsafstand $f = 5$ cm vormt een scherp beeld op afstand $b$ van een voorwerp op afstand $v$, met $\frac1v + \frac1b = \frac1f$. Bereken $b$ voor $v = 15$ cm. Voor welke $v$ is het beeld verder dan $10$ cm van de lens?
  antwoord: |-
    $b = 7{,}5$ cm; $5 < v < 10$
  uitwerking: |-
    $\frac1b = \frac15 - \frac{1}{15} = \frac{2}{15}$, dus $b = 7{,}5$ cm. Algemeen $\frac1b = \frac15 - \frac1v = \frac{v - 5}{5v}$, dus $b = \frac{5v}{v - 5}$ (voor $v > 5$). $\frac{5v}{v - 5} > 10 \iff 5v > 10v - 50 \iff v < 10$ (vermenigvuldigen met $v - 5 > 0$). Dus $5 < v < 10$.

- id: h3-werk
  soort: kort
  opgave: |-
    Printer A drukt een stapel cursussen af in $6$ minuten, printer B in $3$ minuten. Per minuut doet A dus $\frac16$ van het werk.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang doen ze er samen over?
      antwoord: |-
        $2$ minuten
      uitwerking: |-
        Samen doen ze in $t$ minuten het hele werk: $\frac{t}{6} + \frac{t}{3} = 1$, of $\frac16 + \frac13 = \frac1t$. Dus $\frac1t = \frac12$ en $t = 2$ minuten.
    - opgave: |-
        Hoe snel moet een derde printer C alleen zijn, opdat de drie samen in $1$ minuut klaar zijn?
      antwoord: |-
        $2$ minuten
      uitwerking: |-
        $\frac16 + \frac13 + \frac1c = 1$ met $c > 0$. Dus $\frac1c = 1 - \frac12 = \frac12$ en $c = 2$ minuten.

- id: h3-dubbel
  soort: kort
  opgave: |-
    Los op. Let op de factoren met een even multipliciteit.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x^2 - 4}{x^2 + 2x + 1} \geqslant 0$
      antwoord: |-
        $\left]-\infty, -2\right] \cup \left[2, +\infty\right[$
      uitwerking: |-
        $\frac{(x - 2)(x + 2)}{(x + 1)^2} \geqslant 0$: nulwaarden $\pm 2$, dubbele pool $-1$ (het teken blijft). \tekentabel{cccccccc}{x & & -2 & & -1 & & 2 & }{f & + & 0 & - & | & - & 0 & +} Oplossing $\left]-\infty, -2\right] \cup \left[2, +\infty\right[$.
    - opgave: |-
        $\dfrac{(x - 1)^2}{x^2 - 4x} < 0$
      antwoord: |-
        $\left]0, 1\right[ \cup \left]1, 4\right[$
      uitwerking: |-
        $\frac{(x - 1)^2}{x(x - 4)} < 0$: dubbele nulwaarde $1$ (het teken blijft), polen $0$ en $4$. \tekentabel{cccccccc}{x & & 0 & & 1 & & 4 & }{f & + & | & - & 0 & - & | & +} In $1$ is de breuk nul, en niet strikt negatief: $1$ hoort er niet bij. Oplossing $\left]0, 1\right[ \cup \left]1, 4\right[$.

- id: h3-tweebreuken
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{2}{x - 1} \leqslant \dfrac{1}{x + 1}$
      antwoord: |-
        $\left]-\infty, -3\right] \cup \left]-1, 1\right[$
      uitwerking: |-
        $\frac{2(x + 1) - (x - 1)}{(x - 1)(x + 1)} \leqslant 0$, dus $\frac{x + 3}{(x - 1)(x + 1)} \leqslant 0$. \tekentabel{cccccccc}{x & & -3 & & -1 & & 1 & }{f & - & 0 & + & | & - & | & +} Oplossing $\left]-\infty, -3\right] \cup \left]-1, 1\right[$.
    - opgave: |-
        $\dfrac{x}{x - 1} > x$
      antwoord: |-
        $\left]-\infty, 0\right[ \cup \left]1, 2\right[$
      uitwerking: |-
        $\frac{x - x(x - 1)}{x - 1} > 0$, dus $\frac{-x(x - 2)}{x - 1} > 0$. Rechts van $2$ is de breuk negatief (zoals $\frac{-x^2}{x}$), en alle nulwaarden en de pool zijn enkelvoudig. \tekentabel{cccccccc}{x & & 0 & & 1 & & 2 & }{f & + & 0 & - & | & + & 0 & -} Oplossing $\left]-\infty, 0\right[ \cup \left]1, 2\right[$. Wie met $x - 1$ vermenigvuldigt, vindt alleen een deel.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: vergelijkingen
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{3}{x - 1} = \dfrac{2}{x + 1}$
      antwoord: |-
        $x = -5$
      uitwerking: |-
        $x \neq \pm 1$. Maal $(x - 1)(x + 1)$: $3(x + 1) = 2(x - 1)$, dus $3x + 3 = 2x - 2$ en $x = -5$. Voldoet.
    - opgave: |-
        $x + \dfrac{4}{x} = 5$
      antwoord: |-
        $x = 1$ of $x = 4$
      uitwerking: |-
        $x \neq 0$. Maal $x$: $x^2 + 4 = 5x$, dus $x^2 - 5x + 4 = (x - 1)(x - 4) = 0$. Beide voldoen.
    - opgave: |-
        $\dfrac{x^2 - 1}{x + 1} = 0$
      antwoord: |-
        $x = 1$
      uitwerking: |-
        $x \neq -1$. Een breuk is nul als de teller nul is: $x^2 - 1 = 0$ geeft $\pm 1$, maar $-1$ voldoet niet.
    - opgave: |-
        $\dfrac{x}{x - 3} = \dfrac{3}{x - 3}$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        $x \neq 3$. Maal $x - 3$: $x = 3$, en dat voldoet niet.
    - opgave: |-
        $\dfrac{2x - 1}{x + 4} = 1$
      antwoord: |-
        $x = 5$
      uitwerking: |-
        $x \neq -4$. $2x - 1 = x + 4$, dus $x = 5$.
    - opgave: |-
        $\dfrac{5}{x + 2} = x - 2$
      antwoord: |-
        $x = 3$ of $x = -3$
      uitwerking: |-
        $x \neq -2$. $5 = (x - 2)(x + 2) = x^2 - 4$, dus $x^2 = 9$ en $x = \pm 3$. Beide voldoen.
    - opgave: |-
        $\dfrac1x + \dfrac{1}{2x} = 3$
      antwoord: |-
        $x = \frac12$
      uitwerking: |-
        $x \neq 0$. Maal $2x$: $2 + 1 = 6x$, dus $x = \frac12$.
    - opgave: |-
        $\dfrac{x + 1}{x - 1} = \dfrac{x - 1}{x + 1}$
      antwoord: |-
        $x = 0$
      uitwerking: |-
        $x \neq \pm 1$. Kruiselings: $(x + 1)^2 = (x - 1)^2$, dus $x^2 + 2x + 1 = x^2 - 2x + 1$ en $4x = 0$: $x = 0$.
    - opgave: |-
        $\dfrac6x - \dfrac{6}{x + 1} = 1$
      antwoord: |-
        $x = 2$ of $x = -3$
      uitwerking: |-
        $x \neq 0, -1$. Maal $x(x + 1)$: $6(x + 1) - 6x = x(x + 1)$, dus $x^2 + x - 6 = 0$ en $x = 2$ of $x = -3$. Beide voldoen.
    - opgave: |-
        $\dfrac{x}{x + 2} + \dfrac{4}{x - 2} = \dfrac{8}{x^2 - 4}$
      antwoord: |-
        $x = 0$
      uitwerking: |-
        $x \neq \pm 2$. Maal $x^2 - 4$: $x(x - 2) + 4(x + 2) = 8$, dus $x^2 + 2x = 0$ en $x = 0$ of $x = -2$. Alleen $x = 0$ voldoet.
    - opgave: |-
        $\dfrac{x^2}{x - 2} = \dfrac{3x - 2}{x - 2}$
      antwoord: |-
        $x = 1$
      uitwerking: |-
        $x \neq 2$. $x^2 = 3x - 2$, dus $x^2 - 3x + 2 = 0$ en $x = 1$ of $x = 2$. Alleen $x = 1$ voldoet.
    - opgave: |-
        $\dfrac{2}{x + 1} + \dfrac{3}{x - 1} = \dfrac{5}{x^2 - 1}$
      antwoord: |-
        $x = \frac45$
      uitwerking: |-
        $x \neq \pm 1$. Maal $x^2 - 1$: $2(x - 1) + 3(x + 1) = 5$, dus $5x + 1 = 5$ en $x = \frac45$.

- id: h3-o9
  soort: opdracht
  niveau: 1
  thema: |-
    bestaansvoorwaarden
  opgave: |-
    Geef de bestaansvoorwaarden. Los nog niet op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{3}{x - 4} + \dfrac1x = 2$
      antwoord: |-
        $x \neq 0$, $x \neq 4$
      uitwerking: |-
        Geen enkele noemer mag nul zijn: $x - 4 \neq 0$ en $x \neq 0$.
    - opgave: |-
        $\dfrac{5}{x^2 - 9} = \dfrac{1}{x + 3}$
      antwoord: |-
        $x \neq 3$, $x \neq -3$
      uitwerking: |-
        $x^2 - 9 = (x - 3)(x + 3) \neq 0$, en $x + 3 \neq 0$.
    - opgave: |-
        $\dfrac{x}{x^2 + 1} = \dfrac12$
      antwoord: |-
        geen
      uitwerking: |-
        $x^2 + 1 > 0$ voor elke $x$: er zijn geen voorwaarden.
    - opgave: |-
        $\dfrac{2}{x^2 - 5x + 6} = x$
      antwoord: |-
        $x \neq 2$, $x \neq 3$
      uitwerking: |-
        $x^2 - 5x + 6 = (x - 2)(x - 3) \neq 0$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: ongelijkheden
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{2x - 4}{x + 3} > 0$
      antwoord: |-
        $x < -3$ of $x > 2$
      uitwerking: |-
        Nulwaarde $2$, pool $-3$: \tekentabel{cccccc}{x & & -3 & & 2 & }{f & + & | & - & 0 & +} Positief voor $x < -3$ en $x > 2$.
    - opgave: |-
        $\dfrac{x^2 - 4}{x} \geqslant 0$
      antwoord: |-
        $[-2, 0[ \cup [2, +\infty[$
      uitwerking: |-
        Nulwaarden $\pm 2$, pool $0$: \tekentabel{cccccccc}{x & & -2 & & 0 & & 2 & }{f & - & 0 & + & | & - & 0 & +} Oplossing $\left[-2, 0\right[ \cup \left[2, +\infty\right[$.
    - opgave: |-
        $\dfrac{x + 5}{2 - x} \geqslant 0$
      antwoord: |-
        $\left[-5, 2\right[$
      uitwerking: |-
        Nulwaarde $-5$, pool $2$. Let op: $2 - x$ is positief voor $x < 2$. \tekentabel{cccccc}{x & & -5 & & 2 & }{f & - & 0 & + & | & -} Oplossing $\left[-5, 2\right[$.
    - opgave: |-
        $\dfrac{1}{x - 3} < 0$
      antwoord: |-
        $x < 3$
      uitwerking: |-
        De teller is positief, dus de breuk is negatief als de noemer negatief is: $x < 3$.
    - opgave: |-
        $\dfrac{x^2}{x - 1} \leqslant 0$
      antwoord: |-
        $\left]-\infty, 1\right[$
      uitwerking: |-
        $x^2 \geqslant 0$, dus de breuk is negatief voor $x < 1$, behalve in $0$ waar ze nul is (en dat mag). Oplossing $\left]-\infty, 1\right[$.
    - opgave: |-
        $\dfrac{x + 2}{x - 1} \leqslant 1$
      antwoord: |-
        $x < 1$
      uitwerking: |-
        $\frac{x + 2 - (x - 1)}{x - 1} = \frac{3}{x - 1} \leqslant 0$. De teller is nooit nul, dus de breuk is negatief voor $x < 1$.
    - opgave: |-
        $\dfrac{3x}{x + 2} > 1$
      antwoord: |-
        $x < -2$ of $x > 1$
      uitwerking: |-
        $\frac{3x - (x + 2)}{x + 2} = \frac{2x - 2}{x + 2} > 0$. Nulwaarde $1$, pool $-2$: \tekentabel{cccccc}{x & & -2 & & 1 & }{f & + & | & - & 0 & +} Oplossing $x < -2$ of $x > 1$.
    - opgave: |-
        $\dfrac{x^2 - 1}{x^2 + 1} < 0$
      antwoord: |-
        $\left]-1, 1\right[$
      uitwerking: |-
        De noemer is altijd positief, dus het teken is dat van $x^2 - 1$: negatief voor $-1 < x < 1$.
    - opgave: |-
        $\dfrac2x \geqslant x - 1$
      antwoord: |-
        $\left]-\infty, -1\right] \cup \left]0, 2\right]$
      uitwerking: |-
        $\frac{2 - x(x - 1)}{x} = \frac{-x^2 + x + 2}{x} = \frac{-(x - 2)(x + 1)}{x} \geqslant 0$. \tekentabel{cccccccc}{x & & -1 & & 0 & & 2 & }{f & + & 0 & - & | & + & 0 & -} Oplossing $\left]-\infty, -1\right] \cup \left]0, 2\right]$.
    - opgave: |-
        $\dfrac{(x - 1)(x + 4)}{(x - 2)^2} \geqslant 0$
      antwoord: |-
        $\left]-\infty, -4\right] \cup \left[1, 2\right[ \cup \left]2, +\infty\right[$
      uitwerking: |-
        De noemer is een kwadraat: positief, behalve in $2$ waar de breuk niet bestaat. Het teken is dat van $(x - 1)(x + 4)$: \tekentabel{cccccccc}{x & & -4 & & 1 & & 2 & }{f & + & 0 & - & 0 & + & | & +} Oplossing $\left]-\infty, -4\right] \cup \left[1, 2\right[ \cup \left]2, +\infty\right[$.

- id: h3-o13
  soort: opdracht
  niveau: 1
  thema: |-
    een formule omvormen
  opgave: |-
    Maak de gevraagde letter vrij. Alle letters stellen positieve getallen voor.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac1v + \dfrac1b = \dfrac1f$, naar $b$
      antwoord: |-
        $b = \frac{fv}{v - f}$
      uitwerking: |-
        $\frac1b = \frac1f - \frac1v = \frac{v - f}{fv}$, dus $b = \frac{fv}{v - f}$ (omkeren mag, want beide leden zijn niet nul).
    - opgave: |-
        $\dfrac1R = \dfrac{1}{R_1} + \dfrac{1}{R_2}$, naar $R$
      antwoord: |-
        $R = \frac{R_1R_2}{R_1 + R_2}$
      uitwerking: |-
        $\frac1R = \frac{R_2 + R_1}{R_1R_2}$, dus $R = \frac{R_1R_2}{R_1 + R_2}$.
    - opgave: |-
        $G = \dfrac{K + 3q}{q}$, naar $q$
      antwoord: |-
        $q = \frac{K}{G - 3}$
      uitwerking: |-
        Maal $q$: $Gq = K + 3q$, dus $Gq - 3q = K$ en $q(G - 3) = K$: $q = \frac{K}{G - 3}$.
    - opgave: |-
        $y = \dfrac{2x + 1}{x - 3}$, naar $x$
      antwoord: |-
        $x = \frac{3y + 1}{y - 2}$
      uitwerking: |-
        $y(x - 3) = 2x + 1$, dus $xy - 2x = 3y + 1$ en $x(y - 2) = 3y + 1$: $x = \frac{3y + 1}{y - 2}$.

- id: h3-o10
  soort: opdracht
  niveau: 1
  thema: |-
    grafisch oplossen
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.38cm,y=.33cm,font=\scriptsize]
        \rooster{-4}{1}{6}{-3}{1}{5}
        \draw[grijs,dashed] (1,-3) -- (1,5.3) (-4,1) -- (6.3,1);
        \draw[accent,dashed] (-4,2) -- (6,2);
        \kromme{-4}{0}{(\x+3)/(\x-1)} \kromme{2}{6}{(\x+3)/(\x-1)}
        \vol{(-3,0)} \vol{(5,2)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f(x) = \dfrac{x + 3}{x - 1}$ en de rechte $y = 2$. Lees af, en controleer met een berekening.
  lijst: enumerate
  delen:
    - opgave: |-
        Los op: $f(x) = 2$.
      antwoord: |-
        $x = 5$
      uitwerking: |-
        Het snijpunt ligt bij $x = 5$. Berekening: $x + 3 = 2(x - 1)$, dus $x = 5$.
    - opgave: |-
        Los op: $f(x) \geqslant 2$.
      antwoord: |-
        $\left]1, 5\right]$
      uitwerking: |-
        De grafiek ligt op of boven de rechte tussen de asymptoot $x = 1$ en het snijpunt: $\left]1, 5\right]$. Links van de asymptoot ligt ze onder de HA $y = 1$, dus zeker onder $y = 2$. Berekening: $\frac{x + 3 - 2(x - 1)}{x - 1} = \frac{5 - x}{x - 1} \geqslant 0$ geeft $\left]1, 5\right]$.
    - opgave: |-
        Los op: $f(x) < 0$.
      antwoord: |-
        $\left]-3, 1\right[$
      uitwerking: |-
        De grafiek ligt onder de $x$-as van de nulwaarde $-3$ tot de asymptoot: $\left]-3, 1\right[$. Met de tekentabel: nulwaarde $-3$, pool $1$, negatief ertussen.

- id: h3-o14
  soort: opdracht
  niveau: 1
  thema: |-
    op één noemer zetten
  opgave: |-
    Schrijf als één breuk, met teller en noemer ontbonden.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\dfrac{1}{x - 1} - \dfrac{1}{x + 1}$
      antwoord: |-
        $\frac{2}{(x - 1)(x + 1)}$
      uitwerking: |-
        $\frac{(x + 1) - (x - 1)}{(x - 1)(x + 1)} = \frac{2}{(x - 1)(x + 1)}$.
    - opgave: |-
        $x - \dfrac4x$
      antwoord: |-
        $\frac{(x - 2)(x + 2)}{x}$
      uitwerking: |-
        $\frac{x^2 - 4}{x} = \frac{(x - 2)(x + 2)}{x}$.
    - opgave: |-
        $\dfrac{2x}{x - 3} - 1$
      antwoord: |-
        $\frac{x + 3}{x - 3}$
      uitwerking: |-
        $\frac{2x - (x - 3)}{x - 3} = \frac{x + 3}{x - 3}$. Let op de haakjes: het minteken staat voor de hele $x - 3$.
    - opgave: |-
        $\dfrac{3}{x^2 - 1} + \dfrac{1}{x + 1}$
      antwoord: |-
        $\frac{x + 2}{(x - 1)(x + 1)}$
      uitwerking: |-
        Het kgv is $x^2 - 1 = (x - 1)(x + 1)$: $\frac{3 + (x - 1)}{(x - 1)(x + 1)} = \frac{x + 2}{(x - 1)(x + 1)}$.

- id: h3-o11
  soort: opdracht
  niveau: 1
  thema: |-
    fouten: vermenigvuldigen en de noemer vergeten
  opgave: |-
    Waar zit de fout? Verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        $\dfrac2x + 1 = \dfrac5x \ \Rightarrow\ 2 + 1 = 5$, dus er is geen oplossing.
      antwoord: |-
        de $1$ moet ook maal $x$; $x = 3$
      uitwerking: |-
        Je vermenigvuldigt elke term met $x$, ook de $1$: $2 + x = 5$, dus $x = 3$. Controle: $\frac23 + 1 = \frac53$.
    - opgave: |-
        $\dfrac{x - 4}{x + 1} \geqslant 0 \ \Rightarrow\ x - 4 \geqslant 0$, dus $x \geqslant 4$.
      antwoord: |-
        $\left]-\infty, -1\right[ \cup \left[4, +\infty\right[$
      uitwerking: |-
        Een breuk is ook positief als teller en noemer allebei negatief zijn. Met een tekentabel: nulwaarde $4$, pool $-1$, positief voor $x < -1$ en $x > 4$. Oplossing $\left]-\infty, -1\right[ \cup \left[4, +\infty\right[$. Bijvoorbeeld $x = -2$: $\frac{-6}{-1} = 6 \geqslant 0$.

- id: h3-o12
  soort: opdracht
  niveau: 1
  thema: |-
    een oplossing controleren
  opgave: |-
    Is het gegeven getal een oplossing? Controleer zonder op te lossen.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = -2$ en $\dfrac{x^2 - 4}{x + 2} = -4$
      antwoord: |-
        nee
      uitwerking: |-
        Voor $x = -2$ is de noemer nul: het linkerlid bestaat niet. Wie eerst vereenvoudigt tot $x - 2 = -4$, vindt wel $x = -2$, maar dat getal voldoet niet aan de bestaansvoorwaarde.
    - opgave: |-
        $x = 3$ en $\dfrac{1}{x - 1} + \dfrac{1}{x + 1} = \dfrac34$
      antwoord: |-
        ja
      uitwerking: |-
        $\frac12 + \frac14 = \frac34$.
    - opgave: |-
        $x = 1$ en $\dfrac{2x}{x + 1} \geqslant 1$
      antwoord: |-
        ja
      uitwerking: |-
        $\frac{2}{2} = 1 \geqslant 1$: klopt, het gelijkheidsteken hoort erbij.

- id: h3-o3
  soort: opdracht
  niveau: 2
  thema: |-
    ongelijkheden met twee leden
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{2}{x - 1} \leqslant \dfrac{1}{x + 1}$
      antwoord: |-
        $\left]-\infty, -3\right] \cup \left]-1, 1\right[$
      uitwerking: |-
        $\frac{2(x + 1) - (x - 1)}{(x - 1)(x + 1)} \leqslant 0$, dus $\frac{x + 3}{(x - 1)(x + 1)} \leqslant 0$. Nulwaarde $-3$, polen $\pm 1$: \tekentabel{cccccccc}{x & & -3 & & -1 & & 1 & }{f & - & 0 & + & | & - & | & +} Oplossing $\left]-\infty, -3\right] \cup \left]-1, 1\right[$.
    - opgave: |-
        $x \geqslant \dfrac{6}{x - 1}$
      antwoord: |-
        $\left[-2, 1\right[ \cup \left[3, +\infty\right[$
      uitwerking: |-
        $\frac{x(x - 1) - 6}{x - 1} = \frac{x^2 - x - 6}{x - 1} = \frac{(x - 3)(x + 2)}{x - 1} \geqslant 0$. \tekentabel{cccccccc}{x & & -2 & & 1 & & 3 & }{f & - & 0 & + & | & - & 0 & +} Oplossing $\left[-2, 1\right[ \cup \left[3, +\infty\right[$.
    - opgave: |-
        $\dfrac{x + 1}{x - 2} \geqslant \dfrac{x - 3}{x + 2}$
      antwoord: |-
        $\left]-2, \frac12\right] \cup \left]2, +\infty\right[$
      uitwerking: |-
        $\frac{(x + 1)(x + 2) - (x - 3)(x - 2)}{(x - 2)(x + 2)} = \frac{(x^2 + 3x + 2) - (x^2 - 5x + 6)}{(x - 2)(x + 2)} = \frac{8x - 4}{(x - 2)(x + 2)} \geqslant 0$. \tekentabel{cccccccc}{x & & -2 & & \frac12 & & 2 & }{f & - & | & + & 0 & - & | & +} Oplossing $\left]-2, \frac12\right] \cup \left]2, +\infty\right[$.
    - opgave: |-
        $\dfrac3x \leqslant x + 2$
      antwoord: |-
        $\left[-3, 0\right[ \cup \left[1, +\infty\right[$
      uitwerking: |-
        $\frac{3 - x(x + 2)}{x} = \frac{-(x^2 + 2x - 3)}{x} = \frac{-(x + 3)(x - 1)}{x} \leqslant 0$. \tekentabel{cccccccc}{x & & -3 & & 0 & & 1 & }{f & + & 0 & - & | & + & 0 & -} Oplossing $\left[-3, 0\right[ \cup \left[1, +\infty\right[$.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    twee pompen
  opgave: |-
    Twee pompen maken samen een vijver leeg in $6$ uur. De grote pomp alleen doet het $5$ uur sneller dan de kleine. Hoe lang doet elke pomp er alleen over?
  antwoord: |-
    grote pomp $10$ uur, kleine $15$ uur
  uitwerking: |-
    Stel dat de grote pomp alleen $x$ uur nodig heeft ($x > 0$), de kleine dan $x + 5$ uur. Per uur doen ze samen $\frac16$ van het werk: $\frac1x + \frac{1}{x + 5} = \frac16$. Maal $6x(x + 5)$: $6(x + 5) + 6x = x(x + 5)$, dus $x^2 - 7x - 30 = 0$ en $x = 10$ of $x = -3$. Alleen $x = 10$ kan: de grote pomp $10$ uur, de kleine $15$ uur. Controle: $\frac{1}{10} + \frac{1}{15} = \frac{3 + 2}{30} = \frac16$.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijking en asymptoot
  opgave: |-
    Neem $f(x) = \dfrac{x + 2}{x - 1}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $x$ is $f(x) = 3$?
      antwoord: |-
        $x = \frac52$
      uitwerking: |-
        $x \neq 1$. $x + 2 = 3x - 3$, dus $x = \frac52$.
    - opgave: |-
        Voor welke $x$ is $f(x) = 1$? Verklaar met de asymptoten.
      antwoord: |-
        voor geen enkele
      uitwerking: |-
        $x + 2 = x - 1$ geeft $2 = -1$: vals, dus geen oplossing. De rechte $y = 1$ is de horizontale asymptoot, en $f(x) = 1 + \frac{3}{x - 1}$ is nooit precies $1$, want $\frac{3}{x - 1} \neq 0$.
    - opgave: |-
        Welke functiewaarden neemt $f$ aan? Los daarvoor $f(x) = c$ op naar $x$.
      antwoord: |-
        alle reële getallen behalve $1$
      uitwerking: |-
        $x + 2 = c(x - 1)$, dus $x(c - 1) = c + 2$. Voor $c \neq 1$ is $x = \frac{c + 2}{c - 1}$, en dat is nooit $1$ (anders $c + 2 = c - 1$). Voor $c = 1$ is er geen oplossing. Het bereik is $\R \setminus \{1\}$.

- id: h3-o19
  soort: opdracht
  niveau: 2
  thema: |-
    fouten: pool en omkeren
  opgave: |-
    Waar zit de fout? Verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        `$\dfrac{x + 2}{x - 1} \leqslant 0$ heeft als oplossing $[-2, 1]$.'
      antwoord: |-
        $\left[-2, 1\right[$
      uitwerking: |-
        In $1$ bestaat de breuk niet: een pool hoort nooit bij de oplossing, ook niet bij $\leqslant$. Oplossing $\left[-2, 1\right[$.
    - opgave: |-
        `$\dfrac{1}{x - 2} > \dfrac{1}{x + 3}$: omkeren geeft $x - 2 < x + 3$, dus $-2 < 3$ en de ongelijkheid geldt voor elke $x$.'
      antwoord: |-
        $x < -3$ of $x > 2$
      uitwerking: |-
        Omkeren mag alleen als beide leden hetzelfde teken hebben. Neem $x = 0$: $-\frac12 > \frac13$ is vals. Met één breuk: $\frac{(x + 3) - (x - 2)}{(x - 2)(x + 3)} = \frac{5}{(x - 2)(x + 3)} > 0$. Dat geldt als de noemer positief is: $x < -3$ of $x > 2$.

- id: h3-o4
  soort: opdracht
  niveau: 2
  thema: |-
    gemiddelde snelheid
  opgave: |-
    Een fietser rijdt $30$ km heen met snelheid $v$ (in km/h), en terug met $5$ km/h minder. De hele rit duurt $5$ uur. Hoe snel reed hij heen?
  antwoord: |-
    $15$ km/h
  uitwerking: |-
    Tijd is afstand gedeeld door snelheid: $\frac{30}{v} + \frac{30}{v - 5} = 5$ met $v > 5$. Maal $v(v - 5)$: $30(v - 5) + 30v = 5v(v - 5)$, dus $5v^2 - 85v + 150 = 0$ of $v^2 - 17v + 30 = 0$, en $v = 15$ of $v = 2$. Alleen $v = 15$ voldoet ($v > 5$). Controle: $2$ uur heen, $3$ uur terug.

- id: h3-o20
  soort: opdracht
  niveau: 2
  thema: |-
    een vergelijking van hogere graad
  opgave: |-
    Los op. Je krijgt een vergelijking van graad 3: zoek een gehele oplossing en gebruik Horner.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x = 1 + \dfrac1x + \dfrac{2}{x^2}$
      antwoord: |-
        $x = 2$
      uitwerking: |-
        $x \neq 0$. Maal $x^2$: $x^3 = x^2 + x + 2$, dus $x^3 - x^2 - x - 2 = 0$. $x = 2$ is een oplossing ($8 - 4 - 2 - 2 = 0$). Horner geeft $x^2 + x + 1$, met discriminant $-3 < 0$. Alleen $x = 2$.
    - opgave: |-
        $x + \dfrac1x + \dfrac{6}{x^2} = 4$
      antwoord: |-
        $x = -1$, $x = 2$ of $x = 3$
      uitwerking: |-
        $x \neq 0$. Maal $x^2$: $x^3 + x + 6 = 4x^2$, dus $x^3 - 4x^2 + x + 6 = 0$. $x = -1$ is een oplossing ($-1 - 4 - 1 + 6 = 0$). Horner geeft $x^2 - 5x + 6 = (x - 2)(x - 3)$. Alle drie voldoen.

- id: h3-o5
  soort: opdracht
  niveau: 2
  thema: |-
    een concentratie
  opgave: |-
    Een bak bevat $10$ liter water met $2$ kg zout. Je voegt $x$ liter water toe met $0{,}5$ kg zout per liter. De concentratie is $C(x) = \dfrac{2 + 0{,}5x}{10 + x}$ kg per liter.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de horizontale asymptoot. Wat betekent ze?
      antwoord: |-
        $y = 0{,}5$
      uitwerking: |-
        Zelfde graad: $y = \frac{0{,}5}{1} = 0{,}5$. Na veel toevoegen nadert de concentratie die van het toegevoegde water.
    - opgave: |-
        Hoeveel liter moet je toevoegen opdat de concentratie minstens $0{,}4$ kg per liter is?
      antwoord: |-
        minstens $20$ liter
      uitwerking: |-
        $\frac{2 + 0{,}5x}{10 + x} \geqslant 0{,}4$ met $x \geqslant 0$. De noemer is positief, dus vermenigvuldigen mag zonder het teken om te keren: $2 + 0{,}5x \geqslant 4 + 0{,}4x$, dus $0{,}1x \geqslant 2$ en $x \geqslant 20$.

- id: h3-o18
  soort: opdracht
  niveau: 2
  thema: |-
    twee grafieken vergelijken
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.38cm,font=\scriptsize]
        \rooster{-3}{1}{5}{-4}{1}{4}
        \draw[grijs,dashed] (1,-4) -- (1,4.3);
        \draw[thick,grijs] (-3,-4) -- (5,4);
        \kromme{-3}{0}{4/(\x-1)} \kromme{2}{5}{4/(\x-1)}
        \node[text=accent,right] at (2.2,3.5) {$f$};
        \node[right] at (4.2,2.6) {$g$};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafieken van $f(x) = \dfrac{4}{x - 1}$ en $g(x) = x - 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de snijpunten van de grafieken.
      antwoord: |-
        $(3, 2)$ en $(-1, -2)$
      uitwerking: |-
        $x \neq 1$. $\frac{4}{x - 1} = x - 1$ geeft $(x - 1)^2 = 4$, dus $x - 1 = \pm 2$: $x = 3$ of $x = -1$. De punten zijn $(3, 2)$ en $(-1, -2)$.
    - opgave: |-
        Voor welke $x$ ligt de grafiek van $f$ op of boven die van $g$? Lees af en controleer met een tekentabel.
      antwoord: |-
        $\left]-\infty, -1\right] \cup \left]1, 3\right]$
      uitwerking: |-
        $\frac{4}{x - 1} - (x - 1) = \frac{4 - (x - 1)^2}{x - 1} = \frac{(3 - x)(x + 1)}{x - 1} \geqslant 0$. \tekentabel{cccccccc}{x & & -1 & & 1 & & 3 & }{f - g & + & 0 & - & | & + & 0 & -} Oplossing $\left]-\infty, -1\right] \cup \left]1, 3\right]$. Dat klopt met de figuur.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    een busreis
  opgave: |-
    Een klas huurt een bus voor $600$ euro, te verdelen over alle leerlingen. Er vallen $5$ leerlingen af, waardoor elke andere leerling $4$ euro meer betaalt. Hoeveel leerlingen gingen er eerst mee?
  antwoord: |-
    $30$ leerlingen
  uitwerking: |-
    Stel dat er eerst $n$ leerlingen waren ($n > 5$). Dan is $\frac{600}{n - 5} - \frac{600}{n} = 4$. Maal $n(n - 5)$: $600n - 600(n - 5) = 4n(n - 5)$, dus $3000 = 4n^2 - 20n$ en $n^2 - 5n - 750 = 0$. Discriminant $25 + 3000 = 3025 = 55^2$: $n = \frac{5 \pm 55}{2}$, dus $n = 30$ of $n = -25$. Eerst $30$ leerlingen. Controle: $20$ euro per leerling, en bij $25$ leerlingen $24$ euro.

- id: h3-o6
  soort: opdracht
  niveau: 2
  thema: |-
    snijpunten
  opgave: |-
    Bepaal de snijpunten van de grafiek van $f(x) = \dfrac{x + 3}{x - 1}$ met de rechte $y = x$.
  antwoord: |-
    $(3, 3)$ en $(-1, -1)$
  uitwerking: |-
    $\frac{x + 3}{x - 1} = x$ met $x \neq 1$: $x + 3 = x^2 - x$, dus $x^2 - 2x - 3 = 0$ en $x = 3$ of $x = -1$. Beide voldoen. De punten liggen op $y = x$, dus $(3, 3)$ en $(-1, -1)$.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    een medicijn
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.3cm,y=.45cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=2,ystep=1] (0,0) grid (12,6);
        \draw[->,grijs] (0,0) -- (12.8,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,6.6) node[above,text=black] {$C$};
        \foreach \t in {2,4,...,12}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {2,4,6}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \kromme{0}{12}{20*\x/((\x)^2+4)}
      \end{tikzpicture}
  opgave: |-
    Na het innemen van een medicijn is de concentratie in het bloed $C(t) = \dfrac{20t}{t^2 + 4}$ mg per liter, $t$ uur na het innemen. Het medicijn werkt als de concentratie minstens $4$ mg per liter is.
  lijst: enumerate
  delen:
    - opgave: |-
        Wanneer is de concentratie precies $4$ mg per liter?
      antwoord: |-
        na $1$ uur en na $4$ uur
      uitwerking: |-
        $t^2 + 4 > 0$, dus geen voorwaarden. $20t = 4(t^2 + 4)$, dus $t^2 - 5t + 4 = 0$ en $t = 1$ of $t = 4$.
    - opgave: |-
        Hoe lang werkt het medicijn?
      antwoord: |-
        $3$ uur
      uitwerking: |-
        $\frac{20t}{t^2 + 4} \geqslant 4$. De noemer is positief, dus: $20t \geqslant 4t^2 + 16$, of $t^2 - 5t + 4 \leqslant 0$, dus $(t - 1)(t - 4) \leqslant 0$ en $1 \leqslant t \leqslant 4$. Het werkt $3$ uur, van $1$ tot $4$ uur na het innemen.
    - opgave: |-
        Geef de horizontale asymptoot. Wat betekent ze?
      antwoord: |-
        $y = 0$
      uitwerking: |-
        Graad teller kleiner: HA $y = 0$. Op lange termijn verdwijnt het medicijn uit het bloed.

- id: h3-o22
  soort: opdracht
  niveau: 3
  thema: |-
    aantal oplossingen met een parameter
  opgave: |-
    Neem de vergelijking $\dfrac{x + k}{x - 1} = x$, met $k$ een reëel getal.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat ze neerkomt op $x^2 - 2x - k = 0$ met $x \neq 1$.
      antwoord: |-
        maal $x - 1$
      uitwerking: |-
        Bestaansvoorwaarde $x \neq 1$. Maal $x - 1$: $x + k = x^2 - x$, dus $x^2 - 2x - k = 0$.
    - opgave: |-
        Voor welke $k$ heeft de vergelijking twee oplossingen? Geen? Kan ze precies één oplossing hebben?
      antwoord: |-
        twee voor $k > -1$; geen voor $k \leqslant -1$; nooit één
      uitwerking: |-
        De discriminant is $4 + 4k$. Voor $k < -1$ is ze negatief: geen oplossingen. Voor $k > -1$ zijn er twee: $x = 1 \pm \sqrt{1 + k}$, en geen van beide is $1$. Voor $k = -1$ is er één oplossing van de tweedegraadsvergelijking, $x = 1$, maar die voldoet niet aan de bestaansvoorwaarde: dan is er geen oplossing. Precies één oplossing komt dus nooit voor.

- id: h3-o7
  soort: opdracht
  niveau: 3
  thema: |-
    fouten zoeken
  opgave: |-
    Elk van deze oplossingen bevat een fout. Zoek ze en verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        $\dfrac{x}{x - 1} \geqslant 2 \Rightarrow x \geqslant 2(x - 1) \Rightarrow x \leqslant 2$.
      antwoord: |-
        $\left]1, 2\right]$
      uitwerking: |-
        Vermenigvuldigen met $x - 1$ mag alleen als $x - 1 > 0$. Met een tekentabel: $\frac{x - 2(x - 1)}{x - 1} = \frac{2 - x}{x - 1} \geqslant 0$ geeft $\left]1, 2\right]$. Bijvoorbeeld $x = 0$ voldoet niet ($0 \geqslant 2$ is vals), maar zat wel in $x \leqslant 2$.
    - opgave: |-
        $\dfrac{x^2 + x}{x} = 0 \Rightarrow x + 1 = 0 \Rightarrow x = -1$, en ook $x = 0$ want dan is de teller nul.
      antwoord: |-
        alleen $x = -1$
      uitwerking: |-
        $x = 0$ is uitgesloten: de noemer is dan nul. Alleen $x = -1$.

- id: h3-o24
  soort: opdracht
  niveau: 3
  thema: |-
    omgekeerde en kwadraat
  opgave: |-
    Voor welke getallen ligt het omgekeerde tussen het getal zelf en zijn kwadraat: ${x < \frac1x < x^2}$?
  lijst: enumerate
  delen:
    - opgave: |-
        Los op: $\dfrac1x > x$.
      antwoord: |-
        $x < -1$ of $0 < x < 1$
      uitwerking: |-
        $\frac{1 - x^2}{x} > 0$, dus $\frac{(1 - x)(1 + x)}{x} > 0$. \tekentabel{cccccccc}{x & & -1 & & 0 & & 1 & }{f & + & 0 & - & | & + & 0 & -} Oplossing $x < -1$ of $0 < x < 1$.
    - opgave: |-
        Los op: $\dfrac1x < x^2$, en beantwoord de vraag.
      antwoord: |-
        $x < 0$ of $x > 1$; samen $x < -1$
      uitwerking: |-
        $\frac{1 - x^3}{x} < 0$, en $1 - x^3 = (1 - x)(1 + x + x^2)$ met $1 + x + x^2 > 0$ (discriminant $-3$). Het teken is dat van $\frac{1 - x}{x}$: negatief voor $x < 0$ en voor $x > 1$. Beide voorwaarden samen: $x < -1$. Controle met $x = -2$: $-2 < -\frac12 < 4$.

- id: h3-o8
  soort: opdracht
  niveau: 3
  thema: |-
    weerstanden
  opgave: |-
    Twee weerstanden $R_1$ en $R_2$ in parallel hebben samen een weerstand $R$ met $\dfrac1R = \dfrac{1}{R_1} + \dfrac{1}{R_2}$. Neem $R_1 = 6$ ohm.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $R = \dfrac{6R_2}{R_2 + 6}$. Wat is de horizontale asymptoot, en wat betekent ze?
      antwoord: |-
        $y = 6$
      uitwerking: |-
        $\frac1R = \frac16 + \frac{1}{R_2} = \frac{R_2 + 6}{6R_2}$, dus $R = \frac{6R_2}{R_2 + 6}$. HA $y = \frac61 = 6$: hoe groot $R_2$ ook is, samen is het altijd minder dan $6$ ohm, want $R = 6 - \frac{36}{R_2 + 6}$.
    - opgave: |-
        Welke $R_2$ geeft samen precies $4$ ohm? En wanneer is het samen minder dan $2$ ohm?
      antwoord: |-
        $12$ ohm; $R_2 < 3$ ohm
      uitwerking: |-
        $\frac{6R_2}{R_2 + 6} = 4 \iff 6R_2 = 4R_2 + 24 \iff R_2 = 12$. $\frac{6R_2}{R_2 + 6} < 2 \iff 6R_2 < 2R_2 + 12 \iff R_2 < 3$ (met $R_2 > 0$, dus de noemer is positief en het teken keert niet om).

- id: h3-o23
  soort: opdracht
  niveau: 3
  thema: |-
    gemiddelde van twee snelheden
  opgave: |-
    Je rijdt een afstand $d$ heen met snelheid $a$ en terug met snelheid $b$ ($a, b > 0$).
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de gemiddelde snelheid over de hele rit $\dfrac{2ab}{a + b}$ is.
      antwoord: |-
        $\frac{2d}{d/a + d/b}$
      uitwerking: |-
        Totale afstand $2d$, totale tijd $\frac da + \frac db = \frac{d(a + b)}{ab}$. Gemiddeld: $\frac{2d}{d(a + b)/(ab)} = \frac{2ab}{a + b}$. De afstand $d$ valt weg.
    - opgave: |-
        Toon aan dat die gemiddelde snelheid nooit groter is dan $\dfrac{a + b}{2}$. Wanneer zijn ze gelijk?
      antwoord: |-
        verschil $\frac{(a - b)^2}{2(a + b)} \geqslant 0$; gelijk als $a = b$
      uitwerking: |-
        $\frac{a + b}{2} - \frac{2ab}{a + b} = \frac{(a + b)^2 - 4ab}{2(a + b)} = \frac{a^2 - 2ab + b^2}{2(a + b)} = \frac{(a - b)^2}{2(a + b)}$. De teller is een kwadraat en de noemer is positief, dus het verschil is nooit negatief. Het is nul als en slechts als $a = b$.

- id: h3-o25
  soort: opdracht
  niveau: 3
  thema: |-
    afstand tussen voorwerp en beeld
  opgave: |-
    Een lens met brandpuntsafstand $5$ cm vormt van een voorwerp op afstand $v$ een beeld op afstand $b$, met $\dfrac1v + \dfrac1b = \dfrac15$ en $v > 5$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de afstand tussen voorwerp en beeld $v + b = \dfrac{v^2}{v - 5}$ is.
      antwoord: |-
        $b = \frac{5v}{v - 5}$
      uitwerking: |-
        $\frac1b = \frac15 - \frac1v = \frac{v - 5}{5v}$, dus $b = \frac{5v}{v - 5}$ en $v + b = \frac{v(v - 5) + 5v}{v - 5} = \frac{v^2}{v - 5}$.
    - opgave: |-
        Toon aan dat voorwerp en beeld altijd minstens $20$ cm uit elkaar liggen. Wanneer precies $20$ cm?
      antwoord: |-
        $\frac{(v - 10)^2}{v - 5} \geqslant 0$; voor $v = 10$
      uitwerking: |-
        $\frac{v^2}{v - 5} - 20 = \frac{v^2 - 20v + 100}{v - 5} = \frac{(v - 10)^2}{v - 5}$. Voor $v > 5$ is de noemer positief en de teller een kwadraat, dus het verschil is nooit negatief: $v + b \geqslant 20$. Gelijkheid als $v = 10$, en dan is ook $b = 10$.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: Kansrekenen
  thema: |-
    een kans met een breuk
  opgave: |-
    Een zak bevat $3$ rode en $x$ blauwe knikkers. Je trekt er twee zonder teruglegging. De kans op twee rode is $\dfrac{3 \cdot 2}{(x + 3)(x + 2)}$. Hoeveel blauwe knikkers zitten er in de zak als die kans $\frac{1}{5}$ is?
  antwoord: |-
    $x = 3$
  uitwerking: |-
    $(x + 3)(x + 2) = 30$, dus $x^2 + 5x - 24 = 0$ en $x = 3$ of $x = -8$. Alleen $x = 3$ kan.

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: discreet
    onderwerp: Rijen
  thema: |-
    een telescopische som
  opgave: |-
    Toon aan dat $\dfrac{1}{n(n + 1)} = \dfrac1n - \dfrac{1}{n + 1}$. Bereken daarmee
    \[\frac{1}{1 \cdot 2} + \frac{1}{2 \cdot 3} + \cdots + \frac{1}{99 \cdot 100}.\]
  antwoord: |-
    $\frac{99}{100}$
  uitwerking: |-
    $\frac1n - \frac{1}{n + 1} = \frac{n + 1 - n}{n(n + 1)}$. In de som vallen alle tussenliggende termen weg: $1 - \frac{1}{100} = \frac{99}{100}$.

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    vergelijking
  opgave: |-
    Los op: $\dfrac{2}{x} - \dfrac{1}{x + 2} = \dfrac12$.
  antwoord: |-
    $x = \pm 2\sqrt2$
  uitwerking: |-
    $x \neq 0, -2$. Maal $2x(x + 2)$: $4(x + 2) - 2x = x(x + 2)$, dus $2x + 8 = x^2 + 2x$ en $x^2 = 8$. Beide oplossingen $\pm 2\sqrt2$ voldoen.

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    valse oplossing
  opgave: |-
    Los op: $\dfrac{x^2 - 2x}{x - 2} = 3$.
  antwoord: |-
    $x = 3$
  uitwerking: |-
    $x \neq 2$; $x^2 - 2x = 3x - 6$, dus $x^2 - 5x + 6 = 0$ en $x = 2$ of $x = 3$. Alleen $x = 3$ voldoet.

- id: h3-t3
  soort: test
  niveau: 2
  thema: |-
    ongelijkheid
  opgave: |-
    Los op: $\dfrac{x + 4}{x - 1} \leqslant 2$.
  antwoord: |-
    $\left]-\infty, 1\right[ \cup \left[6, +\infty\right[$
  uitwerking: |-
    $\frac{x + 4 - 2(x - 1)}{x - 1} = \frac{6 - x}{x - 1} \leqslant 0$. Nulwaarde $6$, pool $1$: \tekentabel{cccccc}{x & & 1 & & 6 & }{f & - & | & + & 0 & -} Oplossing $\left]-\infty, 1\right[ \cup \left[6, +\infty\right[$.

- id: h3-t5
  soort: test
  niveau: 2
  thema: |-
    ongelijkheid met ontbinden
  opgave: |-
    Los op: $\dfrac{x^2 - 2x - 3}{x + 2} \geqslant 0$.
  antwoord: |-
    $\left]-2, -1\right] \cup \left[3, +\infty\right[$
  uitwerking: |-
    $\frac{(x - 3)(x + 1)}{x + 2} \geqslant 0$. Nulwaarden $-1$ en $3$, pool $-2$: \tekentabel{cccccccc}{x & & -2 & & -1 & & 3 & }{f & - & | & + & 0 & - & 0 & +} Oplossing $\left]-2, -1\right] \cup \left[3, +\infty\right[$.

- id: h3-t4
  soort: test
  niveau: 2
  thema: |-
    context
  opgave: |-
    De gemiddelde kost per stuk is $G(q) = 3 + \dfrac{800}{q}$ euro. Vanaf hoeveel stuks is ze lager dan $5$ euro?
  antwoord: |-
    vanaf 401 stuks
  uitwerking: |-
    $3 + \frac{800}{q} < 5$, dus $\frac{800}{q} < 2$. Maal $q > 0$: $800 < 2q$, dus $q > 400$. Vanaf $401$ stuks.

- id: h3-t6
  soort: test
  niveau: 2
  thema: |-
    context met een vergelijking
  opgave: |-
    Twee kranen vullen samen een vat in $4$ minuten. De ene kraan alleen doet er $6$ minuten langer over dan de andere. Hoe lang doet elke kraan er alleen over?
  antwoord: |-
    $6$ en $12$ minuten
  uitwerking: |-
    Stel dat de snelle kraan $x$ minuten nodig heeft ($x > 0$). Dan $\frac1x + \frac{1}{x + 6} = \frac14$. Maal $4x(x + 6)$: $4(x + 6) + 4x = x(x + 6)$, dus $x^2 - 2x - 24 = 0$ en $x = 6$ of $x = -4$. De ene kraan $6$ minuten, de andere $12$. Controle: $\frac16 + \frac{1}{12} = \frac14$.
