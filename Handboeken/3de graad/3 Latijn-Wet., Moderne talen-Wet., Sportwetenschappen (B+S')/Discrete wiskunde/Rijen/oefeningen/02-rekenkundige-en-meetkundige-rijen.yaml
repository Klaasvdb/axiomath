# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.
# Afgeleid van Rijen voor pakket 4: zelfde id's, alleen de Koppel verschilt.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: enumerate
  delen:
  - opgave: |-
      $u_n = 3n - 1$. Bereken $u_5$.
    antwoord: |-
      14
    uitwerking: |-
      $u_5=3\cdot 5-1=14$.
  - opgave: |-
      $u_1 = 2$ en $u_n = u_{n-1} + 5$. Bereken $u_4$.
    antwoord: |-
      17
    uitwerking: |-
      $u_2=7$, $u_3=12$, $u_4=17$.
  - opgave: |-
      Los op: $3n - 7 = 50$.
    antwoord: |-
      $n=19$
    uitwerking: |-
      $3n=57$, dus $n=19$.
  - opgave: |-
      Los op: $a + 2b = 11$ en $a + 8b = 35$.
    antwoord: |-
      $a=3$, $b=4$
    uitwerking: |-
      Aftrekken: $6b=24$, dus $b=4$ en $a=3$.
  - opgave: |-
      Bepaal de rico van de rechte door $(1, 2)$ en $(4, 11)$.
    antwoord: |-
      3
    uitwerking: |-
      $\dfrac{11-2}{4-1}=3$.
  - opgave: |-
      Los op: $2^x = 32$ en $3^x = 50$.
    antwoord: |-
      $x=5$; $x\approx 3{,}56$
    uitwerking: |-
      $2^5=32$, dus $x=5$. $x=\log_3 50=\dfrac{\log 50}{\log 3}\approx 3{,}56$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Eén plastic stoel is 80 cm hoog. Elke stoel die je erbovenop stapelt, maakt de stapel 5 cm hoger.
  lijst: enumerate
  delen:
  - opgave: |-
      Hoe hoog is een stapel van 2, 3 en 4 stoelen?
    antwoord: |-
      85, 90 en 95 cm
    uitwerking: |-
      80 cm is de eerste stoel, dus 85, 90 en 95 cm.
  - opgave: |-
      Hoe hoog is een stapel van 25 stoelen?
    antwoord: |-
      200 cm
    uitwerking: |-
      $80+24\cdot 5=200$ cm: de eerste stoel is geen sprong.
  - opgave: |-
      Hoeveel stoelen mogen er maximaal op een stapel om onder een deur van 2,12~m door te kunnen?
    antwoord: |-
      27
    uitwerking: |-
      $80+(n-1)\cdot 5\leqslant 212$ geeft $n-1\leqslant 26{,}4$, dus maximaal 27 stoelen.

- id: h2-k1
  soort: kort
  opgave: |-
    Bepaal het expliciet voorschrift van $2,\ 9,\ 16,\ \ldots$ en bereken $u_{20}$.
  antwoord: |-
    $u_n=7n-5$; $u_{20}=135$
  uitwerking: |-
    $v=7$, dus $u_n=2+(n-1)\cdot 7=7n-5$ en $u_{20}=7\cdot 20-5=135$.

- id: h2-k2
  soort: kort
  opgave: |-
    Is 88 een term van $4,\ 11,\ 18,\ \ldots$? En 90?
  antwoord: |-
    88 is de 13de term; 90 is geen term.
  uitwerking: |-
    $4+(n-1)\cdot 7=88$ geeft $n-1=12$, dus $n=13$. $4+(n-1)\cdot 7=90$ geeft $n-1=\tfrac{86}{7}$: geen natuurlijk getal.

- id: h2-k3
  soort: kort
  opgave: |-
    $u_3 = 10$ en $u_8 = 35$. Bepaal $u_1$ en $v$.
  antwoord: |-
    $v=5$, $u_1=0$
  uitwerking: |-
    5 sprongen: $5v=25$, dus $v=5$. Twee sprongen terug: $u_1=10-2\cdot 5=0$.

- id: h2-k4
  soort: kort
  opgave: |-
    Bereken de ontbrekende term.
  lijst: enumerate
  delen:
  - opgave: |-
      $u_7$ als $u_6 = 12$ en $u_8 = 20$
    antwoord: |-
      16
    uitwerking: |-
      $\dfrac{12+20}{2}=16$.
  - opgave: |-
      $u_{12}$ als $u_{11} = -3$ en $u_{13} = 5$
    antwoord: |-
      1
    uitwerking: |-
      $\dfrac{-3+5}{2}=1$.

- id: h2-k5
  soort: kort
  opgave: |-
    Een zwembad bevat 120 m\textsuperscript{3} water en wordt bijgevuld met 1,5 m\textsuperscript{3} per uur. Geef een voorschrift. Wanneer zit er 180 m\textsuperscript{3} in?
  antwoord: |-
    $u_n=120+1{,}5\,n$; na 40 uur
  uitwerking: |-
    $u_n=120+1{,}5\,n=180$ geeft $n=40$.

- id: h2-mverken
  soort: kort
  opgave: |-
    \blokkop{Verken}\quad Op dag 1 kent één persoon een gerucht. Elke dag wordt het aantal mensen dat het kent drie keer zo groot.
  lijst: enumerate
  delen:
  - opgave: |-
      Hoeveel mensen kennen het op dag 2, 3 en 4?
    antwoord: |-
      3, 9, 27
    uitwerking: |-
      Telkens maal 3: 3, 9 en 27.
  - opgave: |-
      Hoeveel mensen kennen het op dag 10?
    antwoord: |-
      19\,683
    uitwerking: |-
      Van dag 1 naar dag 10 zijn het 9 sprongen: $3^9=19\,683$.
  - opgave: |-
      Op welke dag kennen voor het eerst meer dan een miljoen mensen het gerucht?
    antwoord: |-
      dag 14
    uitwerking: |-
      $3^{n-1}>1\,000\,000$ geeft $n-1>12{,}58$, dus $n-1=13$ en $n=14$.

- id: h2-k6
  soort: kort
  opgave: |-
    Bepaal het expliciet voorschrift van $5,\ 15,\ 45,\ \ldots$ en bereken $u_6$.
  antwoord: |-
    $u_n=5\cdot 3^{n-1}$; $u_6=1215$
  uitwerking: |-
    $q=3$, dus $u_n=5\cdot 3^{n-1}$ en $u_6=5\cdot 3^5=1215$.

- id: h2-k7
  soort: kort
  opgave: |-
    Is 486 een term van $2,\ 6,\ 18,\ \ldots$? En 500?
  antwoord: |-
    486 is de 6de term; 500 is geen term.
  uitwerking: |-
    $2\cdot 3^{n-1}=486$ geeft $3^{n-1}=243=3^5$, dus $n=6$. $2\cdot 3^{n-1}=500$ geeft $3^{n-1}=250$ en $n-1\approx 5{,}03$: geen natuurlijk getal.

- id: h2-k8
  soort: kort
  opgave: |-
    $u_2 = 10$ en $u_5 = 80$. Bepaal $u_1$ en $q$.
  antwoord: |-
    $q=2$, $u_1=5$
  uitwerking: |-
    3 sprongen: $10\cdot q^3=80$, dus $q^3=8$ en $q=2$. Een sprong terug: $u_1=\tfrac{10}{2}=5$.

- id: h2-k9
  soort: kort
  opgave: |-
    $u_4 = 3$ en $u_6 = 12$. Welke waarden kan $u_5$ hebben?
  antwoord: |-
    6 of $-6$
  uitwerking: |-
    $u_5^{\,2}=3\cdot 12=36$, dus $u_5=6$ of $u_5=-6$.

- id: h2-k10
  soort: kort
  opgave: |-
    Een auto kost \eur 20\,000 en verliest elk jaar 15\% van zijn waarde. Geef een voorschrift. Wat is de waarde na 5 jaar?
  antwoord: |-
    $u_n=20\,000\cdot 0{,}85^{\,n}$; ongeveer \eur 8874
  uitwerking: |-
    $q=1-\tfrac{15}{100}=0{,}85$, dus $u_n=20\,000\cdot 0{,}85^{\,n}$ en $u_5\approx 8874$.

- id: h2-k11
  soort: kort
  opgave: |-
    Je belegt \eur 5000 aan 4\% per jaar. Hoeveel heb je na 6 jaar, met enkelvoudige en met samengestelde intrest?
  antwoord: |-
    Enkelvoudig \eur 6200; samengesteld ongeveer \eur 6326,60
  uitwerking: |-
    Enkelvoudig: $5000\,(1+6\cdot 0{,}04)=6200$. Samengesteld: $5000\cdot 1{,}04^6\approx 6326{,}60$.

- id: h2-soort
  soort: opdracht
  niveau: 1
  thema: |-
    gemengd
  opgave: |-
    Is de rij rekenkundig, meetkundig, beide of geen van beide?
  lijst: reeks
  delen:
  - opgave: |-
      $7,\ 14,\ 21,\ \ldots$
    antwoord: |-
      rekenkundig
    uitwerking: |-
      $v=7$.
  - opgave: |-
      $7,\ 14,\ 28,\ \ldots$
    antwoord: |-
      meetkundig
    uitwerking: |-
      $q=2$.
  - opgave: |-
      $1,\ 1,\ 1,\ \ldots$
    antwoord: |-
      beide
    uitwerking: |-
      $v=0$ en $q=1$.
  - opgave: |-
      $1,\ 2,\ 3,\ 5,\ \ldots$
    antwoord: |-
      geen van beide
    uitwerking: |-
      Verschillen 1, 1, 2 en quotiënten 2, $\tfrac32$, $\tfrac53$: geen van beide.
  - opgave: |-
      $9,\ 3,\ 1,\ \ldots$
    antwoord: |-
      meetkundig
    uitwerking: |-
      $q=\tfrac13$.
  - opgave: |-
      $9,\ 3,\ {-3},\ \ldots$
    antwoord: |-
      rekenkundig
    uitwerking: |-
      $v=-6$.

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    rekenkundig: voorschriften
  opgave: |-
    Bereken de gevraagde term.
  lijst: enumerate
  delen:
  - opgave: |-
      $u_{15}$ als $u_1 = -8$ en $v = 6$
    antwoord: |-
      76
    uitwerking: |-
      $u_{15}=-8+14\cdot 6=76$.
  - opgave: |-
      $u_{21}$ als $u_1 = 40$ en $v = -2{,}5$
    antwoord: |-
      $-10$
    uitwerking: |-
      $u_{21}=40+20\cdot(-2{,}5)=-10$.
  - opgave: |-
      $u_{10}$ als $u_1 = \tfrac13$ en $v = \tfrac23$
    antwoord: |-
      $\tfrac{19}{3}$
    uitwerking: |-
      $u_{10}=\tfrac13+9\cdot\tfrac23=\tfrac{19}{3}$.

- id: h2-isterm
  soort: opdracht
  niveau: 1
  thema: |-
    rekenkundig: term of geen term
  opgave: |-
    Is 370 een term van $6,\ 13,\ 20,\ \ldots$? En 500?
  antwoord: |-
    370 is de 53ste term; 500 is geen term.
  uitwerking: |-
    $6+(n-1)\cdot 7=370$ geeft $n-1=52$, dus $n=53$. $6+(n-1)\cdot 7=500$ geeft $n-1=\tfrac{494}{7}$: geen natuurlijk getal.

- id: h2-mvoorschrift
  soort: opdracht
  niveau: 1
  thema: |-
    meetkundig: voorschriften
  opgave: |-
    Geef een recursief en een expliciet voorschrift.
  lijst: reeks
  delen:
  - opgave: |-
      $4,\ 12,\ 36,\ \ldots$
    antwoord: |-
      $u_n=3u_{n-1}$, $u_1=4$; $u_n=4\cdot 3^{n-1}$
    uitwerking: |-
      $q=3$: $u_n=4\cdot 3^{n-1}$.
  - opgave: |-
      $80,\ 40,\ 20,\ \ldots$
    antwoord: |-
      $u_n=\tfrac12 u_{n-1}$, $u_1=80$; $u_n=80\cdot(\tfrac12)^{n-1}$
    uitwerking: |-
      $q=\tfrac12$: $u_n=80\cdot(\tfrac12)^{n-1}$.
  - opgave: |-
      $-1,\ 2,\ {-4},\ \ldots$
    antwoord: |-
      $u_n=-2u_{n-1}$, $u_1=-1$; $u_n=-(-2)^{n-1}$
    uitwerking: |-
      $q=-2$: $u_n=-1\cdot(-2)^{n-1}=-(-2)^{n-1}$.\\
      Het recursief voorschrift is telkens $u_n=u_{n-1}\cdot q$ met de eerste term erbij.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    gemengd
  opgave: |-
    De eerste twee termen van een rij zijn 2 en 6. Wat is de derde term als de rij rekenkundig is? En als ze meetkundig is?
  antwoord: |-
    10; 18
  uitwerking: |-
    Rekenkundig: $v=4$, dus $6+4=10$. Meetkundig: $q=3$, dus $6\cdot 3=18$.

- id: h2-tweetermen
  soort: opdracht
  niveau: 1
  thema: |-
    rekenkundig: twee termen
  opgave: |-
    Bepaal $u_1$ en $v$.
  lijst: enumerate
  delen:
  - opgave: |-
      $u_2 = 9$ en $u_7 = 34$
    antwoord: |-
      $v=5$, $u_1=4$
    uitwerking: |-
      5 sprongen: $5v=25$, dus $v=5$ en $u_1=9-5=4$.
  - opgave: |-
      $u_5 = -1$ en $u_{12} = -22$
    antwoord: |-
      $v=-3$, $u_1=11$
    uitwerking: |-
      7 sprongen: $7v=-21$, dus $v=-3$ en $u_1=-1-4\cdot(-3)=11$.
  - opgave: |-
      $u_6 = 4$ en $u_{16} = 9$
    antwoord: |-
      $v=\tfrac12$, $u_1=\tfrac32$
    uitwerking: |-
      10 sprongen: $10v=5$, dus $v=\tfrac12$ en $u_1=4-5\cdot\tfrac12=\tfrac32$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    meetkundig: voorschriften
  opgave: |-
    Bereken de gevraagde term.
  lijst: enumerate
  delen:
  - opgave: |-
      $u_8$ als $u_1 = 2$ en $q = 3$
    antwoord: |-
      4374
    uitwerking: |-
      $u_8=2\cdot 3^7=4374$.
  - opgave: |-
      $u_7$ als $u_1 = 64$ en $q = \tfrac12$
    antwoord: |-
      1
    uitwerking: |-
      $u_7=64\cdot(\tfrac12)^6=1$.
  - opgave: |-
      $u_6$ als $u_1 = -1$ en $q = -2$
    antwoord: |-
      32
    uitwerking: |-
      $u_6=-1\cdot(-2)^5=32$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    gemengd
  opgave: |-
    Gegeven: $u_n = n^2 - 1$. Geef de eerste vier termen. Is de rij rekenkundig of meetkundig?
  antwoord: |-
    0, 3, 8, 15; geen van beide
  uitwerking: |-
    $u_1=0$, $u_2=3$, $u_3=8$, $u_4=15$. De verschillen 3, 5, 7 zijn niet constant, en de quotiënten evenmin.

- id: h2-misterm
  soort: opdracht
  niveau: 1
  thema: |-
    meetkundig: term of geen term
  opgave: |-
    Is 1458 een term van $2,\ 6,\ 18,\ \ldots$? En 2000?
  antwoord: |-
    1458 is de 7de term; 2000 is geen term.
  uitwerking: |-
    $2\cdot 3^{n-1}=1458$ geeft $3^{n-1}=729=3^6$, dus $n=7$. $2\cdot 3^{n-1}=2000$ geeft $3^{n-1}=1000$ en $n-1\approx 6{,}29$: geen natuurlijk getal.

- id: h2-voorschrift
  soort: opdracht
  niveau: 1
  thema: |-
    rekenkundig: voorschriften
  opgave: |-
    Geef een recursief en een expliciet voorschrift.
  lijst: reeks
  delen:
  - opgave: |-
      $5,\ 12,\ 19,\ \ldots$
    antwoord: |-
      $u_n=u_{n-1}+7$, $u_1=5$; $u_n=7n-2$
    uitwerking: |-
      $v=7$: $u_n=5+(n-1)\cdot 7=7n-2$.
  - opgave: |-
      $20,\ 17,\ 14,\ \ldots$
    antwoord: |-
      $u_n=u_{n-1}-3$, $u_1=20$; $u_n=23-3n$
    uitwerking: |-
      $v=-3$: $u_n=20+(n-1)\cdot(-3)=23-3n$.
  - opgave: |-
      $\tfrac14,\ \tfrac34,\ \tfrac54,\ \ldots$
    antwoord: |-
      $u_n=u_{n-1}+\tfrac12$, $u_1=\tfrac14$; $u_n=\tfrac12 n-\tfrac14$
    uitwerking: |-
      $v=\tfrac12$: $u_n=\tfrac14+(n-1)\cdot\tfrac12=\tfrac12 n-\tfrac14$.\\
      Het recursief voorschrift is telkens $u_n=u_{n-1}+v$ met de eerste term erbij.

- id: h2-mtwee
  soort: opdracht
  niveau: 1
  thema: |-
    meetkundig: twee termen
  opgave: |-
    Bepaal $u_1$ en $q$.
  lijst: enumerate
  delen:
  - opgave: |-
      $u_2 = 6$ en $u_5 = 162$
    antwoord: |-
      $q=3$, $u_1=2$
    uitwerking: |-
      3 sprongen: $q^3=27$, dus $q=3$ en $u_1=\tfrac63=2$.
  - opgave: |-
      $u_3 = 20$ en $u_6 = 2{,}5$
    antwoord: |-
      $q=\tfrac12$, $u_1=80$
    uitwerking: |-
      3 sprongen: $q^3=\tfrac18$, dus $q=\tfrac12$ en $u_1=20\cdot 2^2=80$.
  - opgave: |-
      $u_2 = -4$ en $u_5 = 32$
    antwoord: |-
      $q=-2$, $u_1=2$
    uitwerking: |-
      3 sprongen: $q^3=-8$, dus $q=-2$ en $u_1=\tfrac{-4}{-2}=2$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    rekenkundig midden
  opgave: |-
    Bepaal $x$ zodat de drie getallen opeenvolgende termen van een rekenkundige rij zijn.
  lijst: reeks
  delen:
  - opgave: |-
      $3,\ x,\ 11$
    antwoord: |-
      7
    uitwerking: |-
      $x=\dfrac{3+11}{2}=7$.
  - opgave: |-
      $-4,\ x,\ 10$
    antwoord: |-
      3
    uitwerking: |-
      $x=\dfrac{-4+10}{2}=3$.
  - opgave: |-
      $x,\ 6,\ 14$
    antwoord: |-
      $-2$
    uitwerking: |-
      $6=\dfrac{x+14}{2}$ geeft $x=-2$.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    rekenkundig: voorschriften
  opgave: |-
    Iemand schrijft: `$u_1 = 5$ en $v = 4$, dus $u_{10} = 5 + 10 \cdot 4 = 45$.' Wat is er fout?
  antwoord: |-
    9 sprongen: $u_{10}=41$.
  uitwerking: |-
    Van $u_1$ naar $u_{10}$ zijn het 9 sprongen, geen 10. Dus $u_{10}=5+9\cdot 4=41$.

- id: h2-intrest
  soort: opdracht
  niveau: 1
  thema: |-
    intrest
  opgave: |-
    Je belegt \eur 3000 aan 2,5\% per jaar. Hoeveel heb je na 8 jaar, met enkelvoudige en met samengestelde intrest?
  antwoord: |-
    Enkelvoudig \eur 3600; samengesteld ongeveer \eur 3655,21
  uitwerking: |-
    Enkelvoudig: $3000\,(1+8\cdot 0{,}025)=3600$. Samengesteld: $3000\cdot 1{,}025^8\approx 3655{,}21$.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    rekenkundig: voorschriften
  opgave: |-
    Bepaal $u_1$ en $v$ uit het voorschrift.
  lijst: reeks
  delen:
  - opgave: |-
      $u_n = 5n - 2$
    antwoord: |-
      $u_1=3$, $v=5$
  - opgave: |-
      $u_n = 7 - 2n$
    antwoord: |-
      $u_1=5$, $v=-2$
  - opgave: |-
      $u_n = \tfrac13 n + 1$
    antwoord: |-
      $u_1=\tfrac43$, $v=\tfrac13$
  uitwerking: |-
    Vul $n=1$ in voor $u_1$; het verschil is de coëfficiënt van $n$.\\
    \textbf{a.}~$u_1=3$, $v=5$.\\
    \textbf{b.}~$u_1=5$, $v=-2$.\\
    \textbf{c.}~$u_1=\tfrac43$, $v=\tfrac13$.

- id: h2-o8
  soort: opdracht
  niveau: 1
  thema: |-
    meetkundig: voorschriften
  opgave: |-
    Is de rij meetkundig? Zo ja, geef $q$.
  lijst: reeks
  delen:
  - opgave: |-
      $2,\ 6,\ 18,\ 54,\ \ldots$
    antwoord: |-
      ja, $q=3$
  - opgave: |-
      $5,\ 10,\ 15,\ 20,\ \ldots$
    antwoord: |-
      nee
  - opgave: |-
      $16,\ {-8},\ 4,\ {-2},\ \ldots$
    antwoord: |-
      ja, $q=-\tfrac12$
  - opgave: |-
      $7,\ 7,\ 7,\ 7,\ \ldots$
    antwoord: |-
      ja, $q=1$
  - opgave: |-
      $1,\ 4,\ 9,\ 16,\ \ldots$
    antwoord: |-
      nee
  - opgave: |-
      $0{,}3;\ 0{,}03;\ 0{,}003;\ \ldots$
    antwoord: |-
      ja, $q=0{,}1$
  uitwerking: |-
    Kijk naar het quotiënt van opeenvolgende termen.\\
    \textbf{a.}~Telkens 3.\\
    \textbf{b.}~Quotiënten $2$ en $\tfrac32$: niet meetkundig (wel rekenkundig).\\
    \textbf{c.}~Telkens $-\tfrac12$.\\
    \textbf{d.}~Telkens 1.\\
    \textbf{e.}~Quotiënten $4$ en $\tfrac94$: niet meetkundig.\\
    \textbf{f.}~Telkens $0{,}1$.

- id: h2-o9
  soort: opdracht
  niveau: 1
  thema: |-
    meetkundig midden
  opgave: |-
    Bepaal $x$ zodat de drie getallen opeenvolgende termen van een meetkundige rij zijn.
  lijst: reeks
  delen:
  - opgave: |-
      $4,\ x,\ 9$
    antwoord: |-
      6 of $-6$
    uitwerking: |-
      $x^2=36$.
  - opgave: |-
      $2,\ x,\ 32$
    antwoord: |-
      8 of $-8$
    uitwerking: |-
      $x^2=64$.
  - opgave: |-
      $x,\ 6,\ 12$
    antwoord: |-
      3
    uitwerking: |-
      $36=12x$, dus $x=3$.

- id: h2-groei
  soort: opdracht
  niveau: 1
  thema: |-
    rekenkundig: lineaire groei
  opgave: |-
    Een bibliotheek rekent \eur 2 boete plus \eur 0,50 per dag dat je te laat bent.
  lijst: enumerate
  delen:
  - opgave: |-
      Geef een voorschrift voor de boete na $n$ dagen.
    antwoord: |-
      $u_n=2+0{,}5\,n$
    uitwerking: |-
      $u_0=2$ en $v=0{,}5$, dus $u_n=2+0{,}5\,n$.
  - opgave: |-
      Hoeveel betaal je na 14 dagen?
    antwoord: |-
      \eur 9
    uitwerking: |-
      $u_{14}=2+7=9$.
  - opgave: |-
      Na hoeveel dagen is de boete \eur 12?
    antwoord: |-
      20 dagen
    uitwerking: |-
      $2+0{,}5\,n=12$ geeft $n=20$.

- id: h2-herken
  soort: opdracht
  niveau: 1
  thema: |-
    rekenkundig: voorschriften
  opgave: |-
    Is de rij rekenkundig? Zo ja, geef $v$.
  lijst: reeks
  delen:
  - opgave: |-
      $4,\ 9,\ 14,\ 19,\ \ldots$
    antwoord: |-
      ja, $v=5$
  - opgave: |-
      $2,\ 4,\ 8,\ 16,\ \ldots$
    antwoord: |-
      nee
  - opgave: |-
      $-3,\ {-3},\ {-3},\ \ldots$
    antwoord: |-
      ja, $v=0$
  - opgave: |-
      $\tfrac12,\ \tfrac13,\ \tfrac16,\ 0,\ \ldots$
    antwoord: |-
      ja, $v=-\tfrac16$
  - opgave: |-
      $1,\ 4,\ 9,\ 16,\ \ldots$
    antwoord: |-
      nee
  - opgave: |-
      $10;\ 7{,}5;\ 5;\ 2{,}5;\ \ldots$
    antwoord: |-
      ja, $v=-2{,}5$
  uitwerking: |-
    Kijk naar het verschil van opeenvolgende termen.\\
    \textbf{a.}~Telkens 5.\\
    \textbf{b.}~Verschillen 2, 4, 8: niet rekenkundig.\\
    \textbf{c.}~Telkens 0.\\
    \textbf{d.}~Telkens $-\tfrac16$.\\
    \textbf{e.}~Verschillen 3, 5, 7: niet rekenkundig.\\
    \textbf{f.}~Telkens $-2{,}5$.

- id: h2-o10
  soort: opdracht
  niveau: 1
  thema: |-
    meetkundig: voorschriften
  opgave: |-
    Iemand schrijft: `$u_1 = 3$ en $q = 2$, dus $u_5 = 6^4 = 1296$.' Wat is er fout?
  antwoord: |-
    Alleen $q$ staat in de macht: $u_5=48$.
  uitwerking: |-
    De macht hoort alleen bij $q$: $u_5=3\cdot 2^4=48$. Je mag $3\cdot 2^4$ niet schrijven als $6^4$.

- id: h2-o11
  soort: opdracht
  niveau: 1
  thema: |-
    rekenkundig: twee termen
  opgave: |-
    $u_1 = 7$ en $u_{12} = -37$. Bepaal $v$ en $u_{20}$.
  antwoord: |-
    $v=-4$; $u_{20}=-69$
  uitwerking: |-
    11 sprongen: $11v=-44$, dus $v=-4$. Dan is $u_{20}=7+19\cdot(-4)=-69$.

- id: h2-o12
  soort: opdracht
  niveau: 1
  thema: |-
    gemengd
  opgave: |-
    $u_1 = 1$ en $u_n = 2u_{n-1} + 1$. Bereken $u_2$, $u_3$ en $u_4$. Is de rij rekenkundig of meetkundig?
  antwoord: |-
    3, 7, 15; geen van beide
  uitwerking: |-
    $u_2=2\cdot 1+1=3$, $u_3=2\cdot 3+1=7$, $u_4=2\cdot 7+1=15$. Verschillen 2, 4, 8 en quotiënten 3, $\tfrac73$, $\tfrac{15}{7}$ zijn niet constant.

- id: h2-o13
  soort: opdracht
  niveau: 1
  thema: |-
    rekenkundig: voorschriften
  opgave: |-
    Gegeven: $u_1 = -4$ en $u_n = u_{n-1} + 3$. Geef het expliciet voorschrift en bereken $u_{50}$.
  antwoord: |-
    $u_n=3n-7$; $u_{50}=143$
  uitwerking: |-
    $u_n=-4+(n-1)\cdot 3=3n-7$, dus $u_{50}=3\cdot 50-7=143$.

- id: h2-o14
  soort: opdracht
  niveau: 1
  thema: |-
    gemengd
  opgave: |-
    Geef een expliciet voorschrift van $\tfrac12,\ \tfrac23,\ \tfrac34,\ \tfrac45,\ \ldots$
  antwoord: |-
    $u_n=\dfrac{n}{n+1}$
  uitwerking: |-
    De teller is het rangnummer, de noemer is één meer: $u_n=\dfrac{n}{n+1}$.

- id: h2-o15
  soort: opdracht
  niveau: 1
  thema: |-
    rekenkundig: lineaire groei
  opgave: |-
    Een taxirit kost \eur 4,50 instapgeld plus \eur 1,80 per kilometer.
  lijst: enumerate
  delen:
  - opgave: |-
      Wat kost een rit van 12 km?
    antwoord: |-
      \eur 26,10
  - opgave: |-
      Hoe lang was een rit van \eur 31,50?
    antwoord: |-
      15 km
  uitwerking: |-
    $u_n=4{,}50+1{,}80\,n$.\\
    \textbf{a.}~$u_{12}=4{,}50+21{,}60=26{,}10$.\\
    \textbf{b.}~$4{,}50+1{,}80\,n=31{,}50$ geeft $n=15$.

- id: h2-o16
  soort: opdracht
  niveau: 1
  thema: |-
    gemengd
  opgave: |-
    Wat is het kleinste natuurlijke getal $n$ waarvoor $5n - 3 > 100$?
  antwoord: |-
    $n=21$
  uitwerking: |-
    $5n>103$, dus $n>20{,}6$ en $n=21$.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundig: voorschriften
  opgave: |-
    Bepaal $u_1$ en $q$ uit het voorschrift.
  lijst: reeks
  delen:
  - opgave: |-
      $u_n = 5 \cdot 4^{\,n-1}$
    antwoord: |-
      $u_1=5$, $q=4$
  - opgave: |-
      $u_n = 3 \cdot 2^{\,n}$
    antwoord: |-
      $u_1=6$, $q=2$
  - opgave: |-
      $u_n = 10 \cdot (\tfrac12)^{n+1}$
    antwoord: |-
      $u_1=\tfrac52$, $q=\tfrac12$
  uitwerking: |-
    Vul $n=1$ in voor $u_1$; het quotiënt is het grondtal.\\
    \textbf{a.}~$u_1=5$, $q=4$.\\
    \textbf{b.}~$u_1=3\cdot 2=6$, $q=2$.\\
    \textbf{c.}~$u_1=10\cdot\tfrac14=\tfrac52$, $q=\tfrac12$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: voorschriften
  opgave: |-
    Een zaal heeft 14 stoelen op de eerste rij. Elke volgende rij telt 2 stoelen meer.
  lijst: enumerate
  delen:
  - opgave: |-
      Hoeveel stoelen staan er op rij 18?
    antwoord: |-
      48
    uitwerking: |-
      $u_{18}=14+17\cdot 2=48$.
  - opgave: |-
      Op welke rij staan 60 stoelen?
    antwoord: |-
      rij 24
    uitwerking: |-
      $14+(n-1)\cdot 2=60$ geeft $n-1=23$, dus $n=24$.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundig: exponentiële groei
  opgave: |-
    Een algenlaag van 40 m\textsuperscript{2} groeit met 25\% per week.
  lijst: enumerate
  delen:
  - opgave: |-
      Geef een voorschrift voor de oppervlakte na $n$ weken.
    antwoord: |-
      $u_n=40\cdot 1{,}25^{\,n}$
    uitwerking: |-
      $q=1{,}25$, dus $u_n=40\cdot 1{,}25^{\,n}$.
  - opgave: |-
      Hoe groot is de laag na 6 weken?
    antwoord: |-
      ongeveer 153 m\textsuperscript{2}
    uitwerking: |-
      $u_6=40\cdot 1{,}25^6\approx 152{,}6$.
  - opgave: |-
      Wanneer is de laag voor het eerst groter dan 500 m\textsuperscript{2}?
    antwoord: |-
      na 12 weken
    uitwerking: |-
      $1{,}25^{\,n}>12{,}5$ geeft $n>11{,}32$, dus na 12 weken.

- id: h2-o20
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: twee termen
  opgave: |-
    Geef het expliciet voorschrift als $u_{10} = -4$ en $u_{20} = -34$.
  antwoord: |-
    $u_n=26-3n$
  uitwerking: |-
    10 sprongen: $10v=-30$, dus $v=-3$. Dan is $u_n=-4+(n-10)\cdot(-3)=26-3n$.

- id: h2-o21
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundig: twee termen
  opgave: |-
    $u_2 = 5$ en $u_4 = 45$. Bepaal $u_1$ en $q$. Let op: er zijn twee oplossingen.
  antwoord: |-
    $q=3$, $u_1=\tfrac53$ of $q=-3$, $u_1=-\tfrac53$
  uitwerking: |-
    2 sprongen: $q^2=9$, dus $q=3$ of $q=-3$. Een sprong terug: $u_1=\tfrac{5}{q}$, dus $\tfrac53$ of $-\tfrac53$.

- id: h2-o22
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: term of geen term
  opgave: |-
    Welke term van $3,\ 7,\ 11,\ \ldots$ is de eerste die groter is dan 200?
  antwoord: |-
    $u_{51}=203$
  uitwerking: |-
    $u_n=4n-1>200$ geeft $n>50{,}25$, dus $n=51$ en $u_{51}=203$.

- id: h2-o23
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundig: term of geen term
  opgave: |-
    Welke term van $3,\ 6,\ 12,\ \ldots$ is de eerste die groter is dan 1000?
  antwoord: |-
    $u_{10}=1536$
  uitwerking: |-
    $3\cdot 2^{n-1}>1000$ geeft $2^{n-1}>333{,}33\ldots$ en $n-1>8{,}38$, dus $n=10$ en $u_{10}=1536$.

- id: h2-o24
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig midden
  opgave: |-
    $x + 2$, $2x + 1$ en $4x - 6$ zijn opeenvolgende termen van een rekenkundige rij. Bepaal $x$ en de drie termen.
  antwoord: |-
    $x=6$; 8, 13, 18
  uitwerking: |-
    $2(2x+1)=(x+2)+(4x-6)$ geeft $4x+2=5x-4$, dus $x=6$. De termen zijn 8, 13 en 18.

- id: h2-o25
  soort: opdracht
  niveau: 2
  thema: |-
    intrest
  opgave: |-
    Hoeveel jaar duurt het voor een kapitaal verdubbelt aan 4\% samengestelde intrest?
  antwoord: |-
    18 jaar
  uitwerking: |-
    $1{,}04^{\,n}=2$ geeft $n\approx 17{,}67$, dus na 18 jaar is het kapitaal zeker verdubbeld.

- id: h2-o26
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: lineaire groei
  opgave: |-
    Je legt vierkanten met lucifers, op één rij.

    \begin{tikzpicture}[x=.42cm,y=.42cm,line width=1.1pt,line cap=round]
      \foreach \s/\k in {0/1,2/2,5/3}{
        \draw (\s,0) rectangle +(\k,1);
        \foreach \i in {1,...,\k}{\ifnum\i<\k\relax\draw (\s+\i,0) -- (\s+\i,1);\fi}}
    \end{tikzpicture}
  lijst: enumerate
  delen:
  - opgave: |-
      Hoeveel lucifers zijn nodig voor 40 vierkanten?
    antwoord: |-
      121
  - opgave: |-
      Hoeveel vierkanten kun je leggen met 200 lucifers?
    antwoord: |-
      66
  uitwerking: |-
    De rij is $4,\ 7,\ 10,\ \ldots$ met $v=3$, dus $u_n=3n+1$.\\
    \textbf{a.}~$u_{40}=121$.\\
    \textbf{b.}~$3n+1\leqslant 200$ geeft $n\leqslant 66{,}33\ldots$, dus 66 vierkanten (199 lucifers).

- id: h2-o27
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundig: voorschriften
  opgave: |-
    Een bal valt van 2 m hoogte en stuit telkens terug tot 60\% van de vorige hoogte.
  lijst: enumerate
  delen:
  - opgave: |-
      Hoe hoog komt de bal na de 4de keer stuiten?
    antwoord: |-
      ongeveer 26 cm
  - opgave: |-
      Na hoeveel keer stuiten komt de bal voor het eerst niet meer boven 5 cm?
    antwoord: |-
      8 keer
  uitwerking: |-
    $u_n=2\cdot 0{,}6^{\,n}$ in m.\\
    \textbf{a.}~$u_4=2\cdot 0{,}1296\approx 0{,}26$.\\
    \textbf{b.}~$2\cdot 0{,}6^{\,n}\leqslant 0{,}05$ geeft $0{,}6^{\,n}\leqslant 0{,}025$ en $n\geqslant 7{,}22$, dus 8 keer.

- id: h2-o28
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: lineaire groei
  opgave: |-
    De punten $(1, 8)$, $(2, 5)$ en $(3, 2)$ liggen op de grafiek van een rij. Geef het voorschrift. Bij welke $n$ komt het eerste punt onder de $n$-as?
  antwoord: |-
    $u_n=11-3n$; bij $n=4$
  uitwerking: |-
    $v=-3$ en $u_1=8$, dus $u_n=11-3n$. $11-3n<0$ geeft $n>3{,}67$, dus $n=4$.

- id: h2-o29
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundig: exponentiële groei
  opgave: |-
    De punten $(1, 3)$, $(2, 6)$ en $(3, 12)$ liggen op de grafiek van een meetkundige rij. Geef het voorschrift. Bij welke $n$ komt de grafiek voor het eerst boven 100?
  antwoord: |-
    $u_n=3\cdot 2^{n-1}$; bij $n=7$
  uitwerking: |-
    $q=2$ en $u_1=3$. $3\cdot 2^{n-1}>100$ geeft $n-1>5{,}06$, dus $n=7$ ($u_6=96$ en $u_7=192$).

- id: h2-o30
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: voorschriften
  opgave: |-
    De onderste sport van een ladder zit 30 cm boven de grond. Elke volgende sport zit 28 cm hoger.
  lijst: enumerate
  delen:
  - opgave: |-
      Hoe hoog zit sport 12?
    antwoord: |-
      338 cm
    uitwerking: |-
      $u_{12}=30+11\cdot 28=338$.
  - opgave: |-
      Welke sport zit op 198 cm?
    antwoord: |-
      sport 7
    uitwerking: |-
      $30+(n-1)\cdot 28=198$ geeft $n-1=6$, dus $n=7$.

- id: h2-o31
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundig: exponentiële groei
  opgave: |-
    Na inname zit er 200 mg van een medicijn in het bloed. Elk uur wordt 20\% afgebroken.
  lijst: enumerate
  delen:
  - opgave: |-
      Hoeveel zit er nog in het bloed na 5 uur?
    antwoord: |-
      ongeveer 65,5 mg
  - opgave: |-
      Na hoeveel uur is dat voor het eerst minder dan 10 mg?
    antwoord: |-
      na 14 uur
  uitwerking: |-
    $u_n=200\cdot 0{,}8^{\,n}$.\\
    \textbf{a.}~$u_5=200\cdot 0{,}32768\approx 65{,}5$.\\
    \textbf{b.}~$0{,}8^{\,n}<0{,}05$ geeft $n>13{,}43$, dus na 14 uur.

- id: h2-o32
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: term of geen term
  opgave: |-
    Hoeveel positieve termen telt de rij $50,\ 47,\ 44,\ \ldots$?
  antwoord: |-
    17
  uitwerking: |-
    $u_n=53-3n>0$ geeft $n<17{,}67$, dus 17 termen. Controle: $u_{17}=2$ en $u_{18}=-1$.

- id: h2-o33
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundig: term of geen term
  opgave: |-
    Welke term van $1000,\ 500,\ 250,\ \ldots$ is de eerste die kleiner is dan 1?
  antwoord: |-
    $u_{11}\approx 0{,}98$
  uitwerking: |-
    $1000\cdot(\tfrac12)^{n-1}<1$ geeft $2^{n-1}>1000$ en $n-1>9{,}97$, dus $n=11$ en $u_{11}=\tfrac{1000}{1024}\approx 0{,}98$.

- id: h2-o34
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundig midden
  opgave: |-
    $x - 2$, $x + 1$ en $x + 7$ zijn opeenvolgende termen van een meetkundige rij. Bepaal $x$ en de drie termen.
  antwoord: |-
    $x=5$; 3, 6, 12
  uitwerking: |-
    $(x+1)^2=(x-2)(x+7)$ geeft $x^2+2x+1=x^2+5x-14$, dus $x=5$. De termen zijn 3, 6 en 12.

- id: h2-o35
  soort: opdracht
  niveau: 2
  thema: |-
    lineaire en exponentiële groei
  opgave: |-
    Een loon van \eur 2000 stijgt elke maand met \eur 50. Een ander loon van \eur 2000 stijgt elke maand met 2\%. Welk loon is het hoogst na 12 maanden? En na 36 maanden?
  antwoord: |-
    Na 12 maanden het eerste; na 36 maanden het tweede.
  uitwerking: |-
    Na 12 maanden: $2000+12\cdot 50=2600$ en $2000\cdot 1{,}02^{12}\approx 2536{,}48$. Na 36 maanden: $2000+36\cdot 50=3800$ en $2000\cdot 1{,}02^{36}\approx 4079{,}77$.

- id: h2-o36
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: lineaire groei
  opgave: |-
    Een tank bevat 45 liter. Per 100 km verbruikt de auto 6 liter. Na hoeveel kilometer zit er nog 9 liter in?
  antwoord: |-
    600 km
  uitwerking: |-
    Met $n$ het aantal keer 100 km is $u_n=45-6n$. $45-6n=9$ geeft $n=6$, dus 600 km.

- id: h2-o37
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundig: twee termen
  opgave: |-
    Voeg tussen 3 en 96 vier getallen in, zodat je een meetkundige rij krijgt.
  antwoord: |-
    6, 12, 24, 48
  uitwerking: |-
    Met vier getallen ertussen zijn het 5 sprongen: $q^5=\tfrac{96}{3}=32$, dus $q=2$.

- id: h2-o38
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: lineaire groei
  opgave: |-
    Op rekening A staat \eur 200, met elke maand \eur 30 erbij. Op B staat \eur 500, met elke maand \eur 10 erbij. Wanneer staat op beide evenveel? Hoeveel is dat?
  antwoord: |-
    Na 15 maanden; \eur 650
  uitwerking: |-
    $200+30n=500+10n$ geeft $n=15$. Dan staat er $200+30\cdot 15=650$ euro op beide.

- id: h2-o39
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: term of geen term
  opgave: |-
    Hoeveel termen telt de rij $15,\ 18,\ 21,\ \ldots,\ 303$?
  antwoord: |-
    97
  uitwerking: |-
    $15+(n-1)\cdot 3=303$ geeft $n-1=96$, dus $n=97$. Let op: 96 is het aantal sprongen, niet het aantal termen.

- id: h2-o40
  soort: opdracht
  niveau: 2
  thema: |-
    intrest
  opgave: |-
    \eur 1000 groeit in 2 jaar met samengestelde intrest aan tot \eur 1210. Wat is de intrestvoet?
  antwoord: |-
    10\%
  uitwerking: |-
    $(1+\tfrac{p}{100})^2=1{,}21$ geeft $1+\tfrac{p}{100}=1{,}1$, dus $p=10$.

- id: h2-o41
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: twee termen
  opgave: |-
    Voeg tussen 4 en 34 vijf getallen in, zodat je een rekenkundige rij krijgt.
  antwoord: |-
    9, 14, 19, 24, 29
  uitwerking: |-
    Met vijf getallen ertussen heeft de rij 7 termen, dus 6 sprongen: $6v=30$ en $v=5$.

- id: h2-o42
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundig: voorschriften
  opgave: |-
    Een blad papier is 0,1 mm dik. Bij elke plooi verdubbelt de dikte.
  lijst: enumerate
  delen:
  - opgave: |-
      Hoe dik is het na 7 plooien?
    antwoord: |-
      12,8 mm
  - opgave: |-
      Hoeveel plooien heb je in theorie nodig om dikker te zijn dan 1 meter?
    antwoord: |-
      14
  uitwerking: |-
    $u_n=0{,}1\cdot 2^{\,n}$ in mm.\\
    \textbf{a.}~$u_7=0{,}1\cdot 128=12{,}8$.\\
    \textbf{b.}~$0{,}1\cdot 2^{\,n}>1000$ geeft $2^{\,n}>10\,000$ en $n>13{,}29$, dus 14 plooien.

- id: h2-o43
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundig: term of geen term
  opgave: |-
    Hoeveel termen telt de rij $5,\ 10,\ 20,\ \ldots,\ 5120$?
  antwoord: |-
    11
  uitwerking: |-
    $5\cdot 2^{n-1}=5120$ geeft $2^{n-1}=1024=2^{10}$, dus $n-1=10$ en $n=11$.

- id: h2-o44
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: term of geen term
  opgave: |-
    Welke term van $2,\ 5,\ 8,\ \ldots$ ligt het dichtst bij 1000?
  antwoord: |-
    $u_{334}=1001$
  uitwerking: |-
    $u_n=3n-1$. Uit $3n-1=1000$ volgt $n=333{,}67$. Vergelijk: $u_{333}=998$ en $u_{334}=1001$, dus $u_{334}$ ligt het dichtst bij.

- id: h2-o45
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: voorschriften
  opgave: |-
    $u_n = -2n + 9$. Bepaal $u_1$ en $v$. Vanaf welke $n$ zijn de termen negatief?
  antwoord: |-
    $u_1=7$, $v=-2$; vanaf $n=5$
  uitwerking: |-
    $u_1=7$ en $v=-2$. $-2n+9<0$ geeft $n>4{,}5$, dus vanaf $n=5$.

- id: h2-o46
  soort: opdracht
  niveau: 2
  thema: |-
    rekenkundig: twee termen
  opgave: |-
    De punten $(2, 5)$ en $(6, 17)$ liggen op de grafiek van een rekenkundige rij. Ligt $(30, 90)$ er ook op?
  antwoord: |-
    Nee, $u_{30}=89$.
  uitwerking: |-
    4 sprongen: $4v=12$, dus $v=3$ en $u_1=2$. Dan is $u_{30}=2+29\cdot 3=89$.

- id: h2-o47
  soort: opdracht
  niveau: 2
  thema: |-
    intrest
  opgave: |-
    Hoeveel moet je nu beleggen aan 3\% samengestelde intrest om over 5 jaar \eur 10\,000 te hebben?
  antwoord: |-
    Ongeveer \eur 8626,09
  uitwerking: |-
    $K_0\cdot 1{,}03^5=10\,000$ geeft $K_0=\dfrac{10\,000}{1{,}03^5}\approx 8626{,}09$.

- id: h2-o48
  soort: opdracht
  niveau: 3
  thema: |-
    meetkundig: exponentiële groei
  opgave: |-
    Een hoeveelheid daalt met 10\% per jaar. Na hoeveel jaar is ze gehalveerd?
  antwoord: |-
    Na ongeveer 6,6 jaar
  uitwerking: |-
    $0{,}9^{\,n}=0{,}5$ geeft $n=\log_{0{,}9} 0{,}5\approx 6{,}6$. Dit hangt niet af van de beginhoeveelheid.

- id: h2-o49
  soort: opdracht
  niveau: 3
  thema: |-
    rekenkundig: term of geen term
  opgave: |-
    Hoeveel getallen van drie cijfers zijn een veelvoud van 7?
  antwoord: |-
    128
  uitwerking: |-
    Het kleinste is $105=7\cdot 15$ en het grootste is $994=7\cdot 142$. De rij $105,\ 112,\ \ldots,\ 994$ telt $142-15+1=128$ termen.

- id: h2-o50
  soort: opdracht
  niveau: 3
  thema: |-
    rekenkundig: twee termen
  opgave: |-
    $u_2 + u_4 = 22$ en $u_6 = 23$. Bepaal $u_1$ en $v$.
  antwoord: |-
    $v=4$, $u_1=3$
  uitwerking: |-
    $2u_1+4v=22$ en $u_1+5v=23$. Uit de eerste volgt $u_1=11-2v$; invullen geeft $11+3v=23$, dus $v=4$ en $u_1=3$.

- id: h2-o51
  soort: opdracht
  niveau: 3
  thema: |-
    meetkundig midden
  opgave: |-
    Drie opeenvolgende termen van een meetkundige rij hebben als product 216 en als som 19. Welke termen zijn het?
  antwoord: |-
    4, 6, 9 (of 9, 6, 4)
  uitwerking: |-
    Noem de termen $\tfrac{a}{q}$, $a$ en $aq$. Het product is $a^3=216$, dus $a=6$. De som geeft $\tfrac6q+6+6q=19$, dus $6q^2-13q+6=0$ en $q=\tfrac32$ of $q=\tfrac23$.

- id: h2-o52
  soort: opdracht
  niveau: 3
  thema: |-
    rekenkundig: voorschriften
  opgave: |-
    Bewijs: als $u_n = pn + q$ met $p$ en $q$ vaste getallen, dan is de rij rekenkundig. Wat is het verschil?
  antwoord: |-
    Het verschil is $p$.
  uitwerking: |-
    $u_{n+1}-u_n=p(n+1)+q-(pn+q)=p$. Dit hangt niet af van $n$, dus de rij is rekenkundig met $v=p$.

- id: h2-o53
  soort: opdracht
  niveau: 3
  thema: |-
    rekenkundig midden
  opgave: |-
    Drie opeenvolgende termen van een rekenkundige rij hebben als som 33 en als product 1155. Welke termen zijn het?
  antwoord: |-
    7, 11, 15 (of 15, 11, 7)
  uitwerking: |-
    Noem de termen $a-v$, $a$ en $a+v$. De som is $3a=33$, dus $a=11$. Het product is $11(121-v^2)=1155$, dus $v^2=16$ en $v=\pm 4$.

- id: h2-o54
  soort: opdracht
  niveau: 3
  thema: |-
    meetkundig: voorschriften
  opgave: |-
    Bewijs: als $u_n = a \cdot b^{\,n}$ met $a$ en $b$ vaste getallen verschillend van 0, dan is de rij meetkundig. Wat is het quotiënt?
  antwoord: |-
    Het quotiënt is $b$.
  uitwerking: |-
    $\dfrac{u_{n+1}}{u_n}=\dfrac{a\cdot b^{\,n+1}}{a\cdot b^{\,n}}=b$. Dit hangt niet af van $n$, dus de rij is meetkundig met $q=b$.

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Exponentiële functies
  opgave: |-
    Gegeven: $f(x) = 5 \cdot 2^{\,x}$.
  lijst: enumerate
  delen:
  - opgave: |-
      Bereken $f(1)$, $f(2)$, $f(3)$ en $f(4)$. Welke soort rij vormen die getallen? Wat is het quotiënt?
    antwoord: |-
      10, 20, 40, 80; meetkundig, $q=2$
    uitwerking: |-
      Elke stap van 1 in $x$ vermenigvuldigt met 2, dus $q=2$.
  - opgave: |-
      Wat is het quotiënt als je alleen $f(1)$, $f(3)$, $f(5)$, \ldots\ neemt?
    antwoord: |-
      $q=4$
    uitwerking: |-
      $\dfrac{f(3)}{f(1)}=2^2=4$.

- id: h2-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: analyse
    onderwerp: |-
      Logaritmen
  opgave: |-
    Gegeven is de meetkundige rij $2,\ 8,\ 32,\ 128,\ \ldots$
  lijst: enumerate
  delen:
  - opgave: |-
      Bereken $\log_2$ van elke term. Welke soort rij krijg je?
    antwoord: |-
      1, 3, 5, 7; rekenkundig, $v=2$
    uitwerking: |-
      $\log_2 2=1$, $\log_2 8=3$, $\log_2 32=5$, $\log_2 128=7$.
  - opgave: |-
      Toon aan: de logaritmen van de termen van een meetkundige rij met positieve termen vormen een rekenkundige rij. Wat is het verschil?
    antwoord: |-
      $v=\log q$
    uitwerking: |-
      $\log u_n=\log\left(u_1 q^{\,n-1}\right)=\log u_1+(n-1)\log q$. Dit is een rekenkundige rij met eerste term $\log u_1$ en verschil $\log q$.

- id: h2-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Gegeven: $A = \begin{pmatrix} 1 & 2 \\ 0 & 1 \end{pmatrix}$.
  lijst: enumerate
  delen:
  - opgave: |-
      Bereken $A^2$ en $A^3$. Welke rij vormen de elementen rechtsboven in $A$, $A^2$, $A^3$?
    antwoord: |-
      Rechtsboven: 2, 4, 6; rekenkundig, $v=2$
    uitwerking: |-
      $A^2=\begin{pmatrix} 1 & 4 \\ 0 & 1 \end{pmatrix}$ en $A^3=\begin{pmatrix} 1 & 6 \\ 0 & 1 \end{pmatrix}$.
  - opgave: |-
      Bepaal $A^{10}$ zonder verder te vermenigvuldigen.
    antwoord: |-
      $A^{10}=\begin{pmatrix} 1 & 20 \\ 0 & 1 \end{pmatrix}$
    uitwerking: |-
      Het element rechtsboven is $u_n=2n$, dus $u_{10}=20$.

- id: h2-koppel-4
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    Gegeven: $u_n = (1 + \mathrm{i})^n$.
  lijst: enumerate
  delen:
  - opgave: |-
      Bereken $u_1$, $u_2$, $u_3$ en $u_4$. Wat is het quotiënt van deze rij?
    antwoord: |-
      $1+\mathrm{i}$, $2\mathrm{i}$, $-2+2\mathrm{i}$, $-4$; $q=1+\mathrm{i}$
    uitwerking: |-
      Telkens vermenigvuldigen met $1+\mathrm{i}$: $(1+\mathrm{i})^2=2\mathrm{i}$, $2\mathrm{i}(1+\mathrm{i})=-2+2\mathrm{i}$, $(2\mathrm{i})^2=-4$.
  - opgave: |-
      Welke rij vormen de moduli van deze termen?
    antwoord: |-
      meetkundig, $q=\sqrt2$
    uitwerking: |-
      De moduli zijn $\sqrt2$, $2$, $2\sqrt2$, $4$: telkens maal $\sqrt2$.

- id: h2-koppel-5
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Vlakke meetkunde
  opgave: |-
    Een vierkant heeft een oppervlakte van 16 cm\textsuperscript{2}. Door de middens van de zijden te verbinden, krijg je een nieuw vierkant, enzovoort.

    \begin{tikzpicture}[scale=.34,line width=.7pt]
      \draw (0,0) -- (4,0) -- (4,4) -- (0,4) -- cycle;
      \draw (2,0) -- (4,2) -- (2,4) -- (0,2) -- cycle;
      \draw (1,1) -- (3,1) -- (3,3) -- (1,3) -- cycle;
    \end{tikzpicture}
  lijst: enumerate
  delen:
  - opgave: |-
      Toon aan dat de oppervlakte telkens halveert.
    uitwerking: |-
      De vier hoekdriehoeken die wegvallen, zijn samen even groot als het nieuwe vierkant. De oppervlakte halveert dus: $q=\tfrac12$.
  - opgave: |-
      Wat is de oppervlakte van het 6de vierkant?
    uitwerking: |-
      $u_6=16\cdot(\tfrac12)^5=\tfrac12$.
  antwoord: |-
    \textbf{b.}~$\tfrac12$ cm\textsuperscript{2}

- id: h2-koppel-6
  soort: koppel
  niveau: 2
  prent:
    naam: dobbelstenen
  koppel:
    rubriek: data
    onderwerp: |-
      Kansrekenen
  opgave: |-
    Je gooit met een dobbelsteen tot je een zes gooit.
  lijst: enumerate
  delen:
  - opgave: |-
      Bereken de kans dat de eerste zes valt bij worp 1, worp 2 en worp 3. Welke soort rij is dat?
    antwoord: |-
      $\tfrac16$, $\tfrac{5}{36}$, $\tfrac{25}{216}$; meetkundig, $q=\tfrac56$
    uitwerking: |-
      Eerst $n-1$ keer geen zes, dan wel een zes: $u_n=\tfrac16\cdot(\tfrac56)^{n-1}$.
  - opgave: |-
      Vanaf welke worp is die kans kleiner dan 1\%?
    antwoord: |-
      vanaf worp 17
    uitwerking: |-
      $\tfrac16\cdot(\tfrac56)^{n-1}<0{,}01$ geeft $(\tfrac56)^{n-1}<0{,}06$ en $n-1>15{,}43$, dus $n=17$.

- id: h2-t1
  soort: test
  opgave: |-
    Is de rij rekenkundig, meetkundig of geen van beide? Geef $v$ of $q$.
  lijst: reeks
  delen:
  - opgave: |-
      $11,\ 8,\ 5,\ 2,\ \ldots$
    antwoord: |-
      rekenkundig, $v=-3$
    uitwerking: |-
      Telkens $-3$.
  - opgave: |-
      $3,\ {-6},\ 12,\ {-24},\ \ldots$
    antwoord: |-
      meetkundig, $q=-2$
    uitwerking: |-
      Telkens maal $-2$.
  - opgave: |-
      $1,\ 2,\ 4,\ 7,\ \ldots$
    antwoord: |-
      geen van beide
    uitwerking: |-
      Verschillen 1, 2, 3 en quotiënten 2, 2, $\tfrac74$: niet constant.

- id: h2-t2
  soort: test
  opgave: |-
    Geef een recursief en een expliciet voorschrift van $4,\ 10,\ 16,\ \ldots$
  antwoord: |-
    $u_n=u_{n-1}+6$, $u_1=4$; $u_n=6n-2$
  uitwerking: |-
    $v=6$, dus $u_n=u_{n-1}+6$ met $u_1=4$, en $u_n=4+(n-1)\cdot 6=6n-2$.

- id: h2-t3
  soort: test
  opgave: |-
    Geef een recursief en een expliciet voorschrift van $2,\ 10,\ 50,\ \ldots$
  antwoord: |-
    $u_n=5u_{n-1}$, $u_1=2$; $u_n=2\cdot 5^{n-1}$
  uitwerking: |-
    $q=5$, dus $u_n=5u_{n-1}$ met $u_1=2$, en $u_n=2\cdot 5^{n-1}$.

- id: h2-t4
  soort: test
  opgave: |-
    Een rekenkundige rij heeft $u_4 = 13$ en $u_{11} = 41$. Bepaal $u_1$ en $v$.
  antwoord: |-
    $v=4$, $u_1=1$
  uitwerking: |-
    7 sprongen: $7v=28$, dus $v=4$. Drie sprongen terug: $u_1=13-3\cdot 4=1$.

- id: h2-t5
  soort: test
  opgave: |-
    Een meetkundige rij heeft $u_2 = 6$ en $u_5 = 48$. Bepaal $u_1$ en $q$.
  antwoord: |-
    $q=2$, $u_1=3$
  uitwerking: |-
    3 sprongen: $q^3=8$, dus $q=2$. Een sprong terug: $u_1=\tfrac62=3$.

- id: h2-t6
  soort: test
  opgave: |-
    Is 100 een term van $4,\ 10,\ 16,\ \ldots$? En 101?
  antwoord: |-
    100 is de 17de term; 101 is geen term.
  uitwerking: |-
    $6n-2=100$ geeft $n=17$. $6n-2=101$ geeft $n=\tfrac{103}{6}$: geen natuurlijk getal.

- id: h2-t7
  soort: test
  opgave: |-
    Is 1024 een term van $2,\ 4,\ 8,\ \ldots$? En 1000?
  antwoord: |-
    1024 is de 10de term; 1000 is geen term.
  uitwerking: |-
    $u_n=2^{\,n}$. $2^{\,n}=1024$ geeft $n=10$. $2^{\,n}=1000$ geeft $n\approx 9{,}97$: geen natuurlijk getal.

- id: h2-t8
  soort: test
  opgave: |-
    Een kaars is 30 cm lang en brandt 1,5 cm per uur op. Geef een voorschrift voor de lengte na $n$ uur. Wanneer is de kaars op?
  antwoord: |-
    $u_n=30-1{,}5\,n$; na 20 uur
  uitwerking: |-
    $u_0=30$ en $v=-1{,}5$, dus $u_n=30-1{,}5\,n$. Uit $u_n=0$ volgt $n=20$.

- id: h2-t9
  soort: test
  opgave: |-
    Je belegt \eur 4000 aan 2\% samengestelde intrest. Hoeveel heb je na 5 jaar?
  antwoord: |-
    Ongeveer \eur 4416,32
  uitwerking: |-
    $K_5=4000\cdot 1{,}02^5\approx 4416{,}32$.
