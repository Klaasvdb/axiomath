- id: h4-t1
  soort: test
  niveau: 1
  thema: |-
    graaf naar verbindingsmatrix
  figuur:
    code: |-
      \begin{tikzpicture}[font=\small]
        \node[knoop] (k) at (0,0) {K};
        \node[knoop] (l) at (2.2,0) {L};
        \node[knoop] (m) at (1.1,-1.8) {M};
        \draw[boog] (k) to[bend left=18] (l);
        \draw[boog] (l) to[bend left=18] (k);
        \draw[boog] (l) -- (m);
        \draw[boog] (m) -- (k);
        \draw[boog] (m) to[lus=270] (m);
      \end{tikzpicture}
  opgave: |-
    Stel de verbindingsmatrix $V$ op van de graaf hiernaast, met de knopen in de volgorde $K$, $L$, $M$.
  antwoord: |-
    $\km{0 & 1 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 1}$
  uitwerking: |-
    Kolom $K$: naar $L$. Kolom $L$: naar $K$ en $M$. Kolom $M$: naar $K$ en de lus. Dus $V = \km{0 & 1 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 1}$.

- id: h4-t2
  soort: test
  niveau: 1
  thema: |-
    wegen van lengte 2
  opgave: |-
    Bereken $V^2$ voor de graaf uit testvraag \ref{oef:h4-t1}. Hoeveel wegen van lengte 2 zijn er van $M$ naar $L$? Welke?
  antwoord: |-
    $\km{1 & 1 & 1 \\ 0 & 1 & 1 \\ 1 & 1 & 1}$; 1: $M$, $K$, $L$
  uitwerking: |-
    $V^2 = \km{1 & 1 & 1 \\ 0 & 1 & 1 \\ 1 & 1 & 1}$. Kolom $M$, rij $L$: 1. Dat is de weg $M \to K \to L$.

- id: h4-t3
  soort: test
  niveau: 1
  thema: |-
    overgangsmatrix opstellen en toestanden berekenen
  opgave: |-
    1000 abonnees lezen hun krant op papier ($P$) of digitaal ($D$). Elk jaar stapt 15~\% van de papieren lezers over naar digitaal, en 5~\% van de digitale lezers naar papier. Nu lezen er 600 op papier. Stel de overgangsmatrix op en bereken het aantal papieren lezers na een en na twee jaar.
  antwoord: |-
    $\km{0{,}85 & 0{,}05 \\ 0{,}15 & 0{,}95}$; 530 en 474
  uitwerking: |-
    $M = \km{0{,}85 & 0{,}05 \\ 0{,}15 & 0{,}95}$. $M \km{600 \\ 400} = \km{510 + 20 \\ 90 + 380} = \km{530 \\ 470}$ en $M \km{530 \\ 470} = \km{450{,}5 + 23{,}5 \\ 79{,}5 + 446{,}5} = \km{474 \\ 526}$.

- id: h4-t4
  soort: test
  niveau: 2
  thema: |-
    evenwicht met twee toestanden
  opgave: |-
    Bereken het evenwicht voor de krant uit testvraag \ref{oef:h4-t3}. Hoeveel van de 1000 abonnees lezen op lange termijn op papier?
  antwoord: |-
    25~\% papier: 250 abonnees
  uitwerking: |-
    $0{,}85x + 0{,}05(1 - x) = x$ geeft $0{,}05 = 0{,}2x$, dus $x = 0{,}25$. Op lange termijn lezen 250 abonnees op papier.

- id: h4-t5
  soort: test
  niveau: 1
  thema: |-
    lesliematrix opstellen en gebruiken
  opgave: |-
    Een fictieve vogelsoort heeft drie leeftijdsklassen van een jaar. Van klasse 1 overleeft 60~\%, van klasse 2 overleeft 50~\%. Een vrouwtje in klasse 2 krijgt gemiddeld 1 vrouwelijk jong per jaar, een vrouwtje in klasse 3 gemiddeld 3. Nu zijn er 50, 30 en 20 vrouwtjes. Stel de lesliematrix op en bereken de toestand na een jaar.
  antwoord: |-
    $\km{0 & 1 & 3 \\ 0{,}6 & 0 & 0 \\ 0 & 0{,}5 & 0}$; $\km{90 \\ 30 \\ 15}$
  uitwerking: |-
    $L = \km{0 & 1 & 3 \\ 0{,}6 & 0 & 0 \\ 0 & 0{,}5 & 0}$ en $L \km{50 \\ 30 \\ 20} = \km{30 + 60 \\ 30 \\ 15} = \km{90 \\ 30 \\ 15}$.

- id: h4-t6
  soort: test
  niveau: 2
  thema: |-
    groei op lange termijn met het rekentoestel
  opgave: |-
    Bereken met je rekentoestel het totale aantal vrouwtjes uit testvraag \ref{oef:h4-t5} na 20 en na 21 jaar. Met hoeveel procent per jaar groeit de populatie op lange termijn?
  antwoord: |-
    2501 en 2926; ongeveer 17~\% per jaar
  uitwerking: |-
    $L^{20} X_0$ heeft totaal ongeveer 2501,3 en $L^{21} X_0$ ongeveer 2925,8. Het quotiënt is $\tfrac{2925{,}8}{2501{,}3} \approx 1{,}17$: de populatie groeit met ongeveer 17~\% per jaar.

- id: h4-t7
  soort: test
  niveau: 2
  thema: |-
    evenwicht met drie toestanden
  opgave: |-
    De 290 leden van een sportclub kiezen elke week één training: zwemmen ($Z$), lopen ($L$) of fietsen ($F$). De overgangsmatrix, in die volgorde, is
    \[ M = \begin{bmatrix} 0{,}7 & 0{,}2 & 0{,}1 \\ 0{,}2 & 0{,}6 & 0{,}3 \\ 0{,}1 & 0{,}2 & 0{,}6 \end{bmatrix} . \]
    Hoeveel leden kiezen op lange termijn elke training?
  antwoord: |-
    100, 110 en 80
  uitwerking: |-
    $10(M - I)X = O$: $\um{ccc|c}{-3 & 2 & 1 & 0 \\ 2 & -4 & 3 & 0 \\ 1 & 2 & -4 & 0}$. Verwissel $R_1$ en $R_3$, en doe $R_2 - 2R_1$ en $R_3 + 3R_1$: de rijen $[0 \ {-8} \ 11 \,|\, 0]$ en $[0 \ 8 \ {-11} \,|\, 0]$. $R_3 + R_2$ geeft een nulrij.\par
    Dus $y = \frac{11}{8}z$ en $x = -2y + 4z = \frac54 z$. Met $\frac{10}{8}z + \frac{11}{8}z + \frac88 z = 1$ is $z = \frac{8}{29}$: $X = \km{\frac{10}{29} \\ \frac{11}{29} \\ \frac{8}{29}}$.\par
    Maal 290: 100 zwemmers, 110 lopers en 80 fietsers.
