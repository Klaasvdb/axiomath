# Oefeningen van hoofdstuk 1. Zie oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Werk uit: $(3 - 2x)(1 + 4x)$.
      antwoord: |-
        $3 + 10x - 8x^2$
      uitwerking: |-
        $3 + 12x - 2x - 8x^2 = 3 + 10x - 8x^2$.
    - opgave: |-
        Werk uit: $(5 + \sqrt2)(5 - \sqrt2)$.
      antwoord: |-
        23
      uitwerking: |-
        Merkwaardig product: $25 - 2 = 23$.
    - opgave: |-
        Schrijf zonder wortel in de noemer: $\dfrac{6}{3 - \sqrt3}$.
      antwoord: |-
        $3 + \sqrt3$
      uitwerking: |-
        Teller en noemer maal $3 + \sqrt3$: $\dfrac{6(3 + \sqrt3)}{9 - 3} = 3 + \sqrt3$.
    - opgave: |-
        Hoe ver ligt het punt $(-3, 4)$ van de oorsprong?
      antwoord: |-
        5
      uitwerking: |-
        Pythagoras: $\sqrt{9 + 16} = 5$.
    - opgave: |-
        Bereken de som van de vectoren $(2, 1)$ en $(-1, 3)$.
      antwoord: |-
        $(1, 4)$
      uitwerking: |-
        Coördinaat per coördinaat: $(2 - 1, 1 + 3) = (1, 4)$.
    - opgave: |-
        Los op in $\R$: $x^2 - 4x + 13 = 0$.
      antwoord: |-
        geen oplossing
      uitwerking: |-
        $D = 16 - 52 = -36 < 0$: geen reële oplossingen.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Stel dat er een getal $i$ bestaat met $i^2 = -1$. Reken ermee zoals met een letter, en vervang telkens $i^2$ door $-1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $i^3$ en $i^4$.
      antwoord: |-
        $-i$ en $1$
      uitwerking: |-
        $i^3 = i^2 \cdot i = -i$ en $i^4 = i^2 \cdot i^2 = (-1)(-1) = 1$.
    - opgave: |-
        Werk uit: $(2 + 3i) + (4 - i)$.
      antwoord: |-
        $6 + 2i$
      uitwerking: |-
        De termen zonder $i$ samen en de termen met $i$ samen: $6 + 2i$.
    - opgave: |-
        Werk uit: $(2 + 3i)(1 - i)$.
      antwoord: |-
        $5 + i$
      uitwerking: |-
        $2 - 2i + 3i - 3i^2 = 2 + i + 3 = 5 + i$.
    - opgave: |-
        Vul $x = 2 + 3i$ in in $x^2 - 4x + 13$. Wat stel je vast? Vergelijk met de laatste opgave van de Opwarmer.
      antwoord: |-
        0: $2 + 3i$ is een oplossing
      uitwerking: |-
        $(2 + 3i)^2 = 4 + 12i + 9i^2 = -5 + 12i$, dus $x^2 - 4x + 13 = -5 + 12i - 8 - 12i + 13 = 0$. De vergelijking die in $\R$ geen oplossing had, heeft er nu wel een.
    - opgave: |-
        Werk uit: $(2 + 3i)(2 - 3i)$. Wat valt je op? Vergelijk met de tweede opgave van de Opwarmer.
      antwoord: |-
        13, een reëel getal
      uitwerking: |-
        Merkwaardig product: $4 - 9i^2 = 4 + 9 = 13$. Er blijft geen $i$ over, zoals de wortel verdween bij $(5 + \sqrt2)(5 - \sqrt2)$.

- id: h1-deel
  soort: kort
  opgave: |-
    Geef telkens het reëel en het imaginair deel.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $-2 + 9i$
      antwoord: |-
        $-2$ en $9$
      uitwerking: |-
        $\Re = -2$, $\Im = 9$.
    - opgave: |-
        $6i$
      antwoord: |-
        $0$ en $6$
      uitwerking: |-
        $6i = 0 + 6i$: $\Re = 0$, $\Im = 6$.
    - opgave: |-
        $\sqrt3$
      antwoord: |-
        $\sqrt3$ en $0$
      uitwerking: |-
        $\sqrt3 = \sqrt3 + 0i$: $\Re = \sqrt3$, $\Im = 0$.
    - opgave: |-
        $\dfrac{4 - i}{2}$
      antwoord: |-
        $2$ en $-\tfrac12$
      uitwerking: |-
        $\tfrac{4 - i}{2} = 2 - \tfrac12 i$: $\Re = 2$, $\Im = -\tfrac12$.

- id: h1-gelijk
  soort: kort
  opgave: |-
    Bepaal de reële getallen $x$ en $y$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3x + (x - y)i = 6 + 5i$
      antwoord: |-
        $x = 2$, $y = -3$
      uitwerking: |-
        Reële delen: $3x = 6$, dus $x = 2$. Imaginaire delen: $x - y = 5$, dus $y = -3$.
    - opgave: |-
        $x^2 + (x - 3)i = 9$
      antwoord: |-
        $x = 3$
      uitwerking: |-
        Het rechterlid is $9 + 0i$. Imaginaire delen: $x - 3 = 0$, dus $x = 3$. Reële delen: $x^2 = 9$, en dat klopt voor $x = 3$. ($x = -3$ voldoet niet aan de eerste voorwaarde.)

- id: h1-vlak
  soort: kort
  figuur:
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.55cm]
        \gauss{-4}{4}{-3}{3}
        \cpunt{3}{1}{$A$}
        \cpunt[above left]{-2}{3}{$B$}
        \cpunt[above left]{-4}{0}{$C$}
        \cpunt[below left]{-1}{-3}{$D$}
        \cpunt[right]{0}{2}{$E$}
      \end{tikzpicture}
  opgave: |-
    Bekijk de figuur.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk complex getal hoort bij elk van de punten $A$ tot $E$?
      antwoord: |-
        $A = 3 + i$, $B = -2 + 3i$, $C = -4$, $D = -1 - 3i$, $E = 2i$
      uitwerking: |-
        Lees telkens het reëel deel af op de horizontale as en het imaginair deel op de verticale as: $A = 3 + i$, $B = -2 + 3i$, $C = -4$, $D = -1 - 3i$ en $E = 2i$.
    - opgave: |-
        Teken de figuur over en stel ook $1 - 2i$, \ $-3 - i$ \ en \ $2,5$ voor.
      antwoord: |-
        zie de uitgewerkte oplossingen
      uitwerking: |-
        Het reëel deel op de horizontale as, het imaginair deel op de verticale as.\par
        \begin{tikzpicture}[x=.5cm,y=.5cm]
          \gauss{-4}{4}{-3}{3}
          \cpunt[right]{1}{-2}{$1 - 2i$}
          \cpunt[below left]{-3}{-1}{$-3 - i$}
          \cpunt[above]{2.5}{0}{$2{,}5$}
        \end{tikzpicture}

- id: h1-som
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(5 + 2i) + (1 - 6i)$
      antwoord: |-
        $6 - 4i$
      uitwerking: |-
        $(5 + 1) + (2 - 6)i = 6 - 4i$.
    - opgave: |-
        $(-3 + i) - (2 - 4i)$
      antwoord: |-
        $-5 + 5i$
      uitwerking: |-
        $(-3 - 2) + (1 + 4)i = -5 + 5i$.
    - opgave: |-
        $4(1 - i) - 2(3 + 2i)$
      antwoord: |-
        $-2 - 8i$
      uitwerking: |-
        $4 - 4i - 6 - 4i = -2 - 8i$.
    - opgave: |-
        $(2i - 7) + (7 + i)$
      antwoord: |-
        $3i$
      uitwerking: |-
        $(-7 + 7) + (2 + 1)i = 3i$: zuiver imaginair.

- id: h1-product
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(2 + 5i)(3 - i)$
      antwoord: |-
        $11 + 13i$
      uitwerking: |-
        $6 - 2i + 15i - 5i^2 = 6 + 13i + 5 = 11 + 13i$.
    - opgave: |-
        $-4i(3 + 2i)$
      antwoord: |-
        $8 - 12i$
      uitwerking: |-
        $-12i - 8i^2 = 8 - 12i$.
    - opgave: |-
        $(1 + i)^2$
      antwoord: |-
        $2i$
      uitwerking: |-
        $1 + 2i + i^2 = 2i$.
    - opgave: |-
        $(3 - 4i)(3 + 4i)$
      antwoord: |-
        $25$
      uitwerking: |-
        $9 - 16i^2 = 9 + 16 = 25$.
    - opgave: |-
        $(2 - i)^3$
      antwoord: |-
        $2 - 11i$
      uitwerking: |-
        $(2 - i)^2 = 4 - 4i + i^2 = 3 - 4i$, dus $(2 - i)^3 = (3 - 4i)(2 - i) = 6 - 3i - 8i + 4i^2 = 2 - 11i$.
    - opgave: |-
        $(1 + i)^4$
      antwoord: |-
        $-4$
      uitwerking: |-
        $(1 + i)^4 = \bigl((1 + i)^2\bigr)^2 = (2i)^2 = 4i^2 = -4$.

- id: h1-machten
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $i^{6}$
      antwoord: |-
        $-1$
      uitwerking: |-
        $6 = 4 + 2$: $i^6 = i^2 = -1$.
    - opgave: |-
        $i^{15}$
      antwoord: |-
        $-i$
      uitwerking: |-
        $15 = 4 \cdot 3 + 3$: $i^{15} = i^3 = -i$.
    - opgave: |-
        $i^{40}$
      antwoord: |-
        $1$
      uitwerking: |-
        $40 = 4 \cdot 10$: $i^{40} = 1$.
    - opgave: |-
        $i^{1001}$
      antwoord: |-
        $i$
      uitwerking: |-
        $1001 = 4 \cdot 250 + 1$: $i^{1001} = i$.
    - opgave: |-
        $i + i^2 + i^3 + i^4$
      antwoord: |-
        $0$
      uitwerking: |-
        $i - 1 - i + 1 = 0$.

- id: h1-toegevoegde
  soort: kort
  opgave: |-
    Gegeven: $z_1 = 2 + 5i$, \ $z_2 = -4i$ \ en \ $z_3 = -7$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de toegevoegde en de modulus van elk getal.
      antwoord: |-
        $\conj{z_1} = 2 - 5i$, $|z_1| = \sqrt{29}$; $\conj{z_2} = 4i$, $|z_2| = 4$; $\conj{z_3} = -7$, $|z_3| = 7$
      uitwerking: |-
        $\conj{z_1} = 2 - 5i$ en $|z_1| = \sqrt{4 + 25} = \sqrt{29}$. \ $\conj{z_2} = 4i$ en $|z_2| = \sqrt{0 + 16} = 4$. \ $\conj{z_3} = -7$ (een reëel getal is zijn eigen toegevoegde) en $|z_3| = \sqrt{49} = 7$.
    - opgave: |-
        Bereken $z_1 \cdot \conj{z_1}$ en controleer dat je $|z_1|^2$ vindt.
      antwoord: |-
        $29$
      uitwerking: |-
        $(2 + 5i)(2 - 5i) = 4 - 25i^2 = 29 = \bigl(\sqrt{29}\bigr)^2$.

- id: h1-deling
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\dfrac{8 - i}{2 + i}$
      antwoord: |-
        $3 - 2i$
      uitwerking: |-
        $\dfrac{(8 - i)(2 - i)}{5} = \dfrac{16 - 8i - 2i + i^2}{5} = \dfrac{15 - 10i}{5} = 3 - 2i$.
    - opgave: |-
        $\dfrac{5}{1 - 2i}$
      antwoord: |-
        $1 + 2i$
      uitwerking: |-
        $\dfrac{5(1 + 2i)}{1 + 4} = 1 + 2i$.
    - opgave: |-
        $\dfrac{1}{2 + 2i}$
      antwoord: |-
        $\tfrac14 - \tfrac14 i$
      uitwerking: |-
        $\dfrac{2 - 2i}{4 + 4} = \dfrac{2 - 2i}{8} = \tfrac14 - \tfrac14 i$.
    - opgave: |-
        $\dfrac{4 + 3i}{4 - 3i}$
      antwoord: |-
        $\tfrac{7}{25} + \tfrac{24}{25} i$
      uitwerking: |-
        $\dfrac{(4 + 3i)^2}{16 + 9} = \dfrac{16 + 24i + 9i^2}{25} = \dfrac{7 + 24i}{25} = \tfrac{7}{25} + \tfrac{24}{25} i$.

- id: h1-vergelijking
  soort: kort
  opgave: |-
    Los op in $\C$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(1 + 2i)z = 5$
      antwoord: |-
        $z = 1 - 2i$
      uitwerking: |-
        $z = \dfrac{5}{1 + 2i} = \dfrac{5(1 - 2i)}{1 + 4} = 1 - 2i$.
    - opgave: |-
        $iz - 3 = 2 + 5i$
      antwoord: |-
        $z = 5 - 5i$
      uitwerking: |-
        $iz = 5 + 5i$, dus $z = \dfrac{5 + 5i}{i} = \dfrac{(5 + 5i)(-i)}{1} = -5i - 5i^2 = 5 - 5i$.
    - opgave: |-
        $2z + i = (1 - i)z$
      antwoord: |-
        $z = -\tfrac12 - \tfrac12 i$
      uitwerking: |-
        $2z - (1 - i)z = -i$, dus $(1 + i)z = -i$ en $z = \dfrac{-i}{1 + i} = \dfrac{-i(1 - i)}{2} = \dfrac{-i + i^2}{2} = -\tfrac12 - \tfrac12 i$.

- id: h1-vectoren
  soort: kort
  opgave: |-
    Gegeven: $z = 1 + 2i$ en $w = 3 - i$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $z + w$, \ $w - z$, \ $-w$, \ $-2z$ \ en \ $z + \tfrac12 w$.
      antwoord: |-
        $4 + i$; \ $2 - 3i$; \ $-3 + i$; \ $-2 - 4i$; \ $\tfrac52 + \tfrac32 i$
      uitwerking: |-
        $z + w = (1 + 3) + (2 - 1)i = 4 + i$. \ $w - z = (3 - 1) + (-1 - 2)i = 2 - 3i$. \ $-w = -3 + i$. \ $-2z = -2 - 4i$. \ $z + \tfrac12 w = 1 + 2i + \tfrac32 - \tfrac12 i = \tfrac52 + \tfrac32 i$.
    - opgave: |-
        Stel $z$, $w$ en de vijf uitkomsten voor in het vlak van Gauss. Waar zie je in de figuur een parallellogram?
      antwoord: |-
        zie de uitgewerkte oplossingen
      uitwerking: |-
        $z + w$ is de vierde hoek van het parallellogram met hoekpunten $0$, $z$ en $w$. De pijl van $z$ naar $w$ is even lang en even gericht als die van $0$ naar $w - z$. $-w$ is het spiegelbeeld van $w$ om de oorsprong, en $-2z$ ligt op de rechte door $0$ en $z$, aan de andere kant, twee keer zo ver.\par
        \begin{tikzpicture}[x=.5cm,y=.5cm]
          \gaussstap{2}{-3}{4}{-4}{3}
          \draw[hulplijn] (1,2) -- (4,1) -- (3,-1);
          \cpunt[above left]{1}{2}{$z$}
          \cpunt[below right]{3}{-1}{$w$}
          \cpunt[right]{4}{1}{$z + w$}
          \cpunt[right]{2}{-3}{$w - z$}
          \cpunt[above]{-3}{1}{$-w$}
          \cpunt[left]{-2}{-4}{$-2z$}
          \cpunt[above right]{2.5}{1.5}{$z + \tfrac12 w$}
        \end{tikzpicture}

- id: h1-maali
  soort: kort
  opgave: |-
    Vermenigvuldig met $i$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $iz$ voor $z = 4$, \ $z = -1 + 3i$ \ en \ $z = 2 - 5i$.
      antwoord: |-
        $4i$; \ $-3 - i$; \ $5 + 2i$
      uitwerking: |-
        $i \cdot 4 = 4i$. \ $i(-1 + 3i) = -i + 3i^2 = -3 - i$. \ $i(2 - 5i) = 2i - 5i^2 = 5 + 2i$.
    - opgave: |-
        Stel de drie getallen en hun product met $i$ voor in het vlak van Gauss. Draait elk punt een kwartslag om de oorsprong?
      antwoord: |-
        ja, telkens een kwartslag tegen de wijzers van de klok in
      uitwerking: |-
        Elk punt draait een kwartslag tegen de wijzers van de klok in, en blijft even ver van de oorsprong.\par
        \begin{tikzpicture}[x=.45cm,y=.45cm]
          \gaussleeg{-3}{5}{-5}{4}
          \draw[hulplijn] (4,0) -- (0,0) -- (0,4);
          \draw[hulplijn] (-1,3) -- (0,0) -- (-3,-1);
          \draw[hulplijn] (2,-5) -- (0,0) -- (5,2);
          \cpunt[below]{4}{0}{$4$}
          \cpunt[right]{0}{4}{$4i$}
          \cpunt[left]{-1}{3}{$-1 + 3i$}
          \cpunt[left]{-3}{-1}{$-3 - i$}
          \cpunt[right]{2}{-5}{$2 - 5i$}
          \cpunt[above]{5}{2}{$5 + 2i$}
        \end{tikzpicture}
    - opgave: |-
        Welk getal $z$ geeft na vermenigvuldiging met $i$ het getal $6 + i$?
      antwoord: |-
        $1 - 6i$
      uitwerking: |-
        Draai terug: $iz = 6 + i$, dus $z = \dfrac{6 + i}{i}$. Zonder delen: zoek $z = a + bi$ met $i(a + bi) = -b + ai = 6 + i$, dus $b = -6$ en $a = 1$. Controle: $i(1 - 6i) = i - 6i^2 = 6 + i$.

- id: h1-conj
  soort: kort
  opgave: |-
    Bepaal de toegevoegde.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $-1 + 4i$
      antwoord: |-
        $-1 - 4i$
      uitwerking: |-
        Het imaginair deel verandert van teken: $-1 - 4i$.
    - opgave: |-
        $5i$
      antwoord: |-
        $-5i$
      uitwerking: |-
        $5i = 0 + 5i$, dus $\conj{5i} = -5i$.
    - opgave: |-
        $-3$
      antwoord: |-
        $-3$
      uitwerking: |-
        Een reëel getal is zijn eigen toegevoegde: imaginair deel 0.
    - opgave: |-
        $z$, als $\conj{z} = 2 - 7i$
      antwoord: |-
        $z = 2 + 7i$
      uitwerking: |-
        Neem nog eens de toegevoegde: $z = \conj{\conj{z}} = 2 + 7i$.

- id: h1-modulus
  soort: kort
  opgave: |-
    Bereken de modulus.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $5 - 12i$
      antwoord: |-
        $13$
      uitwerking: |-
        $\sqrt{25 + 144} = \sqrt{169} = 13$.
    - opgave: |-
        $-7$
      antwoord: |-
        $7$
      uitwerking: |-
        $\sqrt{(-7)^2 + 0^2} = 7$: de absolute waarde.
    - opgave: |-
        $3i$
      antwoord: |-
        $3$
      uitwerking: |-
        $\sqrt{0^2 + 3^2} = 3$.
    - opgave: |-
        $1 + i$
      antwoord: |-
        $\sqrt2$
      uitwerking: |-
        $\sqrt{1 + 1} = \sqrt2$.
    - opgave: |-
        $-2 - 6i$
      antwoord: |-
        $2\sqrt{10}$
      uitwerking: |-
        $\sqrt{4 + 36} = \sqrt{40} = 2\sqrt{10}$.
    - opgave: |-
        $\tfrac12 - \tfrac{\sqrt3}{2} i$
      antwoord: |-
        $1$
      uitwerking: |-
        $\sqrt{\tfrac14 + \tfrac34} = \sqrt1 = 1$: het getal ligt op de cirkel met straal 1.

- id: h1-omgekeerde
  soort: kort
  opgave: |-
    Bereken het omgekeerde, en controleer.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $1 - i$
      antwoord: |-
        $\tfrac12 + \tfrac12 i$
      uitwerking: |-
        $\dfrac{1 + i}{1 + 1} = \tfrac12 + \tfrac12 i$. Controle: $(1 - i)(1 + i) = 2$, en $\tfrac22 = 1$.
    - opgave: |-
        $2 + 3i$
      antwoord: |-
        $\tfrac{2}{13} - \tfrac{3}{13} i$
      uitwerking: |-
        $\dfrac{2 - 3i}{4 + 9} = \tfrac{2}{13} - \tfrac{3}{13} i$. Controle: $(2 + 3i)(2 - 3i) = 13$, en $\tfrac{13}{13} = 1$.
    - opgave: |-
        $-4i$
      antwoord: |-
        $\tfrac14 i$
      uitwerking: |-
        $\dfrac{\conj{-4i}}{16} = \dfrac{4i}{16} = \tfrac14 i$. Controle: $-4i \cdot \tfrac14 i = -i^2 = 1$.
    - opgave: |-
        $\sqrt3 + i$
      antwoord: |-
        $\tfrac{\sqrt3}{4} - \tfrac14 i$
      uitwerking: |-
        $\dfrac{\sqrt3 - i}{3 + 1} = \tfrac{\sqrt3}{4} - \tfrac14 i$. Controle: $(\sqrt3 + i)(\sqrt3 - i) = 4$, en $\tfrac44 = 1$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    de vier bewerkingen
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(4 - 3i) + (-6 + 5i)$
      antwoord: |-
        $-2 + 2i$
      uitwerking: |-
        $(4 - 6) + (-3 + 5)i = -2 + 2i$.
    - opgave: |-
        $(2 + i)(5 - 3i)$
      antwoord: |-
        $13 - i$
      uitwerking: |-
        $10 - 6i + 5i - 3i^2 = 10 - i + 3 = 13 - i$.
    - opgave: |-
        $(1 - 2i) - (4 - 7i)$
      antwoord: |-
        $-3 + 5i$
      uitwerking: |-
        $(1 - 4) + (-2 + 7)i = -3 + 5i$.
    - opgave: |-
        $3i(2 - 5i)$
      antwoord: |-
        $15 + 6i$
      uitwerking: |-
        $6i - 15i^2 = 15 + 6i$.
    - opgave: |-
        $(-2 + 3i)(-2 - 3i)$
      antwoord: |-
        $13$
      uitwerking: |-
        Een getal maal zijn toegevoegde: $(-2)^2 + 3^2 = 13$.
    - opgave: |-
        $\dfrac{5 - i}{1 + i}$
      antwoord: |-
        $2 - 3i$
      uitwerking: |-
        $\dfrac{(5 - i)(1 - i)}{2} = \dfrac{5 - 5i - i + i^2}{2} = \dfrac{4 - 6i}{2} = 2 - 3i$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    reëel en imaginair deel na een bewerking
  opgave: |-
    Geef het reëel en het imaginair deel. Schrijf het getal daarvoor eerst in de vorm $a + bi$.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $(3 - i)^2$
      antwoord: |-
        $8$ en $-6$
      uitwerking: |-
        $9 - 6i + i^2 = 8 - 6i$.
    - opgave: |-
        $i(4 + i)$
      antwoord: |-
        $-1$ en $4$
      uitwerking: |-
        $4i + i^2 = -1 + 4i$.
    - opgave: |-
        $\dfrac{1}{i}$
      antwoord: |-
        $0$ en $-1$
      uitwerking: |-
        $\dfrac{1}{i} = \dfrac{-i}{-i^2} = -i$.
    - opgave: |-
        $\dfrac{2 + i}{2 - i}$
      antwoord: |-
        $\tfrac35$ en $\tfrac45$
      uitwerking: |-
        $\dfrac{(2 + i)^2}{4 + 1} = \dfrac{3 + 4i}{5} = \tfrac35 + \tfrac45 i$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    aflezen, toegevoegde en modulus
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm]
        \gaussstap{2}{-4}{4}{-4}{4}
        \cpunt{2}{3}{$A$}
        \cpunt[above left]{-3}{1}{$B$}
        \cpunt[below left]{-2}{-2}{$C$}
        \cpunt[right]{0}{4}{$D$}
        \cpunt[right]{3}{-4}{$E$}
      \end{tikzpicture}
  opgave: |-
    Lees de complexe getallen $A$ tot $E$ af. Geef van elk getal de toegevoegde en de modulus.
  antwoord: |-
    $A = 2 + 3i$: $2 - 3i$, $\sqrt{13}$; \ $B = -3 + i$: $-3 - i$, $\sqrt{10}$; \ $C = -2 - 2i$: $-2 + 2i$, $2\sqrt2$; \ $D = 4i$: $-4i$, $4$; \ $E = 3 - 4i$: $3 + 4i$, $5$
  uitwerking: |-
    $A = 2 + 3i$, $\conj{A} = 2 - 3i$, $|A| = \sqrt{4 + 9} = \sqrt{13}$.\par
    $B = -3 + i$, $\conj{B} = -3 - i$, $|B| = \sqrt{9 + 1} = \sqrt{10}$.\par
    $C = -2 - 2i$, $\conj{C} = -2 + 2i$, $|C| = \sqrt{4 + 4} = 2\sqrt2$.\par
    $D = 4i$, $\conj{D} = -4i$, $|D| = 4$.\par
    $E = 3 - 4i$, $\conj{E} = 3 + 4i$, $|E| = \sqrt{9 + 16} = 5$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    machten van i
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $i^{10}$
      antwoord: |-
        $-1$
      uitwerking: |-
        $10 = 4 \cdot 2 + 2$: $i^{10} = i^2 = -1$.
    - opgave: |-
        $i^{33}$
      antwoord: |-
        $i$
      uitwerking: |-
        $33 = 4 \cdot 8 + 1$: $i^{33} = i$.
    - opgave: |-
        $(-i)^{100}$
      antwoord: |-
        $1$
      uitwerking: |-
        $(-i)^{100} = (-1)^{100} \cdot i^{100} = 1 \cdot 1 = 1$.
    - opgave: |-
        $i^{7} + i^{8}$
      antwoord: |-
        $1 - i$
      uitwerking: |-
        $i^7 = i^3 = -i$ en $i^8 = 1$: samen $1 - i$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    gelijke complexe getallen
  opgave: |-
    Bepaal de reële getallen $x$ en $y$.
  lijst: enumerate
  delen:
    - opgave: |-
        $x - 3 + 2yi = 5 + 8i$
      antwoord: |-
        $x = 8$, $y = 4$
      uitwerking: |-
        Reële delen: $x - 3 = 5$, dus $x = 8$. Imaginaire delen: $2y = 8$, dus $y = 4$.
    - opgave: |-
        $(x + yi)(1 + i) = 3 + i$
      antwoord: |-
        $x = 2$, $y = -1$
      uitwerking: |-
        $x + yi = \dfrac{3 + i}{1 + i} = \dfrac{(3 + i)(1 - i)}{2} = \dfrac{4 - 2i}{2} = 2 - i$, dus $x = 2$ en $y = -1$.
    - opgave: |-
        $x^2 - 4 + (x + 2)i = 0$
      antwoord: |-
        $x = -2$
      uitwerking: |-
        Het rechterlid is $0 + 0i$. Uit $x + 2 = 0$ volgt $x = -2$, en dan is ook $x^2 - 4 = 0$. De oplossing $x = 2$ van $x^2 = 4$ voldoet niet aan de tweede voorwaarde.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    delen
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\dfrac{3 + 4i}{1 - 2i}$
      antwoord: |-
        $-1 + 2i$
      uitwerking: |-
        $\dfrac{(3 + 4i)(1 + 2i)}{5} = \dfrac{3 + 10i + 8i^2}{5} = \dfrac{-5 + 10i}{5} = -1 + 2i$.
    - opgave: |-
        $\dfrac{10}{3 + i}$
      antwoord: |-
        $3 - i$
      uitwerking: |-
        $\dfrac{10(3 - i)}{9 + 1} = 3 - i$.
    - opgave: |-
        $\dfrac{2 - 5i}{i}$
      antwoord: |-
        $-5 - 2i$
      uitwerking: |-
        $\dfrac{(2 - 5i)(-i)}{i(-i)} = \dfrac{-2i + 5i^2}{1} = -5 - 2i$.
    - opgave: |-
        $\dfrac{1 + i}{1 - i}$
      antwoord: |-
        $i$
      uitwerking: |-
        $\dfrac{(1 + i)^2}{1 + 1} = \dfrac{2i}{2} = i$.

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten
  opgave: |-
    Waar of vals? Verbeter wat vals is.
  lijst: enumerate
  delen:
    - opgave: |-
        Het imaginair deel van $3 - 2i$ is $-2i$.
      antwoord: |-
        vals: $-2$
      uitwerking: |-
        Vals: het imaginair deel is het reële getal $-2$.
    - opgave: |-
        $(a + bi)^2 = a^2 + b^2$ voor alle reële $a$ en $b$.
      antwoord: |-
        vals: $a^2 - b^2 + 2abi$
      uitwerking: |-
        Vals: $(a + bi)^2 = a^2 + 2abi + b^2 i^2 = a^2 - b^2 + 2abi$. Het is $(a + bi)(a - bi)$ dat $a^2 + b^2$ geeft.
    - opgave: |-
        $i^2 + i^3 + i^4 + i^5 = 0$
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $-1 - i + 1 + i = 0$.
    - opgave: |-
        Voor elk complex getal $z$ is $z \cdot \conj{z}$ een strikt positief reëel getal.
      antwoord: |-
        vals voor $z = 0$
      uitwerking: |-
        Vals: $z \cdot \conj{z} = |z|^2$ is reëel en nooit negatief, maar voor $z = 0$ is het 0. Juist is: $z \cdot \conj{z} \geqslant 0$.
    - opgave: |-
        $2i > i$, want $2 > 1$.
      antwoord: |-
        vals: geen ongelijkheden in $\C$
      uitwerking: |-
        Vals: tussen complexe getallen die niet reëel zijn, gebruik je geen ongelijkheidsteken. Je kunt wel de moduli vergelijken: $|2i| = 2 > 1 = |i|$.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    een uitdrukking in z berekenen
  opgave: |-
    Gegeven: $z = 1 - 2i$. Bereken $z^2$, $z^3$ en $z^2 - 2z + 5$. Wat besluit je uit het laatste resultaat?
  antwoord: |-
    $-3 - 4i$; \ $-11 + 2i$; \ $0$: $z$ is een oplossing van $x^2 - 2x + 5 = 0$
  uitwerking: |-
    $z^2 = 1 - 4i + 4i^2 = -3 - 4i$.\par
    $z^3 = z^2 \cdot z = (-3 - 4i)(1 - 2i) = -3 + 6i - 4i + 8i^2 = -11 + 2i$.\par
    $z^2 - 2z + 5 = -3 - 4i - 2 + 4i + 5 = 0$: het getal $1 - 2i$ is een oplossing van de vergelijking $x^2 - 2x + 5 = 0$, die in $\R$ geen oplossingen heeft.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    eerstegraadsvergelijkingen
  opgave: |-
    Los op in $\C$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3z + 2i = z - 4 + 6i$
      antwoord: |-
        $z = -2 + 2i$
      uitwerking: |-
        $2z = -4 + 4i$, dus $z = -2 + 2i$.
    - opgave: |-
        $(1 - i)z = 2 + 4i$
      antwoord: |-
        $z = -1 + 3i$
      uitwerking: |-
        $z = \dfrac{2 + 4i}{1 - i} = \dfrac{(2 + 4i)(1 + i)}{2} = \dfrac{-2 + 6i}{2} = -1 + 3i$.
    - opgave: |-
        $\dfrac{z}{2 + i} = 1 - 3i$
      antwoord: |-
        $z = 5 - 5i$
      uitwerking: |-
        $z = (1 - 3i)(2 + i) = 2 + i - 6i - 3i^2 = 5 - 5i$.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    vermenigvuldigen met i in het vlak
  opgave: |-
    Gegeven: $z = 2 + i$. Bereken $iz$, $i^2 z$ en $i^3 z$, en stel de vier getallen voor in het vlak van Gauss. Wat stel je vast? Wat is $i^4 z$?
  antwoord: |-
    $-1 + 2i$, $-2 - i$, $1 - 2i$: telkens een kwartslag tegen de wijzers van de klok in; $i^4 z = z$
  uitwerking: |-
    $iz = 2i + i^2 = -1 + 2i$, \ $i^2 z = -z = -2 - i$, \ $i^3 z = -iz = 1 - 2i$.
    \naast{\begin{minipage}{7.5cm}Elk punt is het vorige, een kwartslag gedraaid om de oorsprong, tegen de wijzers van de klok in. De vier punten zijn de hoekpunten van een vierkant. Na vier kwartslagen ben je terug: $i^4 z = z$.\end{minipage}}{\begin{tikzpicture}[x=.55cm,y=.55cm]
      \gauss{-3}{3}{-3}{3}
      \draw[hulplijn] (2,1) -- (-1,2) -- (-2,-1) -- (1,-2) -- cycle;
      \cpunt[right]{2}{1}{$z$}
      \cpunt[above]{-1}{2}{$iz$}
      \cpunt[left]{-2}{-1}{$i^2 z$}
      \cpunt[below]{1}{-2}{$i^3 z$}
    \end{tikzpicture}}

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    context: wisselstroom
  opgave: |-
    In de elektrotechniek beschrijft men de weerstand van een onderdeel in een wisselstroomkring met een complex getal, de impedantie $Z$ (in ohm). Twee onderdelen hebben impedantie $Z_1 = 3 + 4i$ en $Z_2 = 3 - 4i$. Staan ze na elkaar (in serie), dan is de totale impedantie $Z = Z_1 + Z_2$. Staan ze naast elkaar (parallel), dan geldt $\dfrac{1}{Z} = \dfrac{1}{Z_1} + \dfrac{1}{Z_2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de totale impedantie als de onderdelen in serie staan.
      antwoord: |-
        $6$ ohm
      uitwerking: |-
        $Z = (3 + 4i) + (3 - 4i) = 6$.
    - opgave: |-
        Bereken de totale impedantie als ze parallel staan.
      antwoord: |-
        $\tfrac{25}{6} \approx 4{,}17$ ohm
      uitwerking: |-
        $\dfrac{1}{Z_1} = \dfrac{3 - 4i}{25}$ en $\dfrac{1}{Z_2} = \dfrac{3 + 4i}{25}$, samen $\dfrac{6}{25}$. Dus $Z = \dfrac{25}{6} \approx 4{,}17$ ohm.
    - opgave: |-
        De grootte van een impedantie is haar modulus. Bereken $|Z_1|$.
      antwoord: |-
        $5$ ohm
      uitwerking: |-
        $|Z_1| = \sqrt{9 + 16} = 5$ ohm.
  slot: |-
    {\footnotesize Ingenieurs schrijven $j$ in plaats van $i$, omdat $i$ bij hen al de stroomsterkte is.}

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    eigenschappen van toegevoegde en modulus
  opgave: |-
    Neem $z = a + bi$ met $a, b \in \R$. Toon aan:
  lijst: enumerate
  delen:
    - opgave: |-
        $z + \conj{z} = 2 \Re z$ \ en \ $z - \conj{z} = 2i \Im z$
      antwoord: |-
        bewijs
      uitwerking: |-
        $z + \conj{z} = (a + bi) + (a - bi) = 2a = 2 \Re z$ en $z - \conj{z} = (a + bi) - (a - bi) = 2bi = 2i \Im z$.
    - opgave: |-
        $\conj{\conj{z}} = z$ \ en \ $|\conj{z}| = |z|$
      antwoord: |-
        bewijs
      uitwerking: |-
        $\conj{z} = a - bi$, dus $\conj{\conj{z}} = a + bi = z$. En $|\conj{z}| = \sqrt{a^2 + (-b)^2} = \sqrt{a^2 + b^2} = |z|$.
    - opgave: |-
        $|iz| = |z|$. Wat betekent dat in het vlak van Gauss?
      antwoord: |-
        bewijs; $iz$ ligt even ver van de oorsprong als $z$
      uitwerking: |-
        $iz = ai + bi^2 = -b + ai$, dus $|iz| = \sqrt{b^2 + a^2} = |z|$. Het punt $iz$ ligt even ver van de oorsprong als $z$: de kwartslag verandert de afstand niet.
    - opgave: |-
        $z$ is reëel als en slechts als $z = \conj{z}$.
      antwoord: |-
        bewijs
      uitwerking: |-
        $z = \conj{z} \iff a + bi = a - bi \iff b = -b \iff b = 0$, en $b = 0$ betekent dat $z$ reëel is.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    parameter: reëel of zuiver imaginair
  opgave: |-
    Voor welk reëel getal $a$ is $(a + 2i)(3 - i)$
  lijst: enumerate
  delen:
    - opgave: |-
        een reëel getal?
      antwoord: |-
        $a = 6$
      uitwerking: |-
        $(a + 2i)(3 - i) = 3a - ai + 6i - 2i^2 = (3a + 2) + (6 - a)i$. Reëel als het imaginair deel 0 is: $6 - a = 0$, dus $a = 6$. Het product is dan $20$.
    - opgave: |-
        een zuiver imaginair getal?
      antwoord: |-
        $a = -\tfrac23$
      uitwerking: |-
        Het reëel deel moet 0 zijn: $3a + 2 = 0$, dus $a = -\tfrac23$. Dan is het imaginair deel $6 + \tfrac23 = \tfrac{20}{3} \neq 0$, dus het product $\tfrac{20}{3}i$ is zuiver imaginair.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    bewerkingen als transformaties
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm]
        \gaussstap{2}{-4}{4}{-3}{3}
        \cpunt{3}{2}{$z$}
      \end{tikzpicture}
  opgave: |-
    Teken de figuur over en stel $\conj{z}$, $-z$, $-\conj{z}$ en $z + (-1 - 4i)$ voor. Welke meetkundige transformatie brengt $z$ telkens naar dat punt? Geldt dat voor elk complex getal $z$?
  antwoord: |-
    spiegeling om de reële as, puntspiegeling om de oorsprong, spiegeling om de imaginaire as, verschuiving over $(-1, -4)$; ja
  uitwerking: |-
    \naast{\begin{minipage}{8.4cm}
    $z = 3 + 2i$, \ $\conj{z} = 3 - 2i$, \ $-z = -3 - 2i$, \ $-\conj{z} = -3 + 2i$ en $z + (-1 - 4i) = 2 - 2i$.\par
    $z \mapsto \conj{z}$ is de spiegeling om de reële as, $z \mapsto -z$ de puntspiegeling om de oorsprong, $z \mapsto -\conj{z}$ de spiegeling om de imaginaire as en $z \mapsto z + (-1 - 4i)$ de verschuiving over de vector $(-1, -4)$. Dat geldt voor elk $z$: met $z = a + bi$ is $\conj{z} = a - bi$, $-z = -a - bi$ en $-\conj{z} = -a + bi$.
    \end{minipage}}{\begin{tikzpicture}[x=.5cm,y=.5cm]
      \gaussstap{2}{-4}{4}{-3}{3}
      \cpunt{3}{2}{$z$}
      \cpunt[right]{3}{-2}{$\conj{z}$}
      \cpunt[below left]{-3}{-2}{$-z$}
      \cpunt[above left]{-3}{2}{$-\conj{z}$}
      \cpunt[below]{2}{-2}{$z - 1 - 4i$}
    \end{tikzpicture}}

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    oplossingen van een vierkantsvergelijking nagaan
  opgave: |-
    Ga na dat $3 - i$ en $3 + i$ allebei oplossingen zijn van $z^2 - 6z + 10 = 0$. Bereken hun som en hun product. Wat valt je op?
  antwoord: |-
    som 6, product 10: dat zijn $-b$ en $c$ uit de vergelijking
  uitwerking: |-
    $(3 - i)^2 - 6(3 - i) + 10 = 8 - 6i - 18 + 6i + 10 = 0$ en $(3 + i)^2 - 6(3 + i) + 10 = 8 + 6i - 18 - 6i + 10 = 0$.\par
    Som: $(3 - i) + (3 + i) = 6$. Product: $(3 - i)(3 + i) = 9 + 1 = 10$. De som is het tegengestelde van de coëfficiënt van $z$, en het product is de constante term, net als bij reële oplossingen.

- id: h1-o16
  soort: opdracht
  niveau: 3
  thema: |-
    vergelijkingen met de toegevoegde
  opgave: |-
    Los op in $\C$. Stel daarvoor $z = a + bi$ met $a, b \in \R$, en gebruik de gelijkheid van complexe getallen.
  lijst: enumerate
  delen:
    - opgave: |-
        $z + 2\conj{z} = 6 - 4i$
      antwoord: |-
        $z = 2 + 4i$
      uitwerking: |-
        $(a + bi) + 2(a - bi) = 3a - bi$. Uit $3a - bi = 6 - 4i$ volgt $3a = 6$ en $-b = -4$, dus $z = 2 + 4i$.
    - opgave: |-
        $iz + 2 = \conj{z}$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        $i(a + bi) + 2 = (2 - b) + ai$ moet gelijk zijn aan $a - bi$. Dat geeft $2 - b = a$ en $a = -b$. Vul het tweede in in het eerste: $2 - b = -b$, dus $2 = 0$. Dat kan niet: er is geen oplossing.

- id: h1-o17
  soort: opdracht
  niveau: 3
  thema: |-
    z kwadraat gelijk aan z streep
  opgave: |-
    Bepaal alle complexe getallen $z$ waarvoor $z^2 = \conj{z}$, en stel ze voor in het vlak van Gauss. Wat merk je op?
  antwoord: |-
    $0$, $1$, $-\tfrac12 + \tfrac{\sqrt3}{2} i$, $-\tfrac12 - \tfrac{\sqrt3}{2} i$; de laatste drie zijn de hoekpunten van een gelijkzijdige driehoek op de cirkel met straal 1
  uitwerking: |-
    Met $z = a + bi$ is $z^2 = a^2 - b^2 + 2abi$ en $\conj{z} = a - bi$. Gelijk stellen: $a^2 - b^2 = a$ en $2ab = -b$.\par
    De tweede vergelijking geeft $b(2a + 1) = 0$, dus $b = 0$ of $a = -\tfrac12$.\par
    Als $b = 0$: $a^2 = a$, dus $a = 0$ of $a = 1$. Dat geeft $z = 0$ en $z = 1$.\par
    Als $a = -\tfrac12$: $\tfrac14 - b^2 = -\tfrac12$, dus $b^2 = \tfrac34$ en $b = \pm\tfrac{\sqrt3}{2}$.\par
    \naast{\begin{minipage}{8.4cm}De oplossingen zijn $0$, $1$ en $-\tfrac12 \pm \tfrac{\sqrt3}{2} i$. Behalve 0 hebben ze allemaal modulus 1: $\tfrac14 + \tfrac34 = 1$. Ze liggen op de cirkel met straal 1 en vormen een gelijkzijdige driehoek. In hoofdstuk 4 zie je waarom.\end{minipage}}{\begin{tikzpicture}[x=1.1cm,y=1.1cm]
      \draw[->,grijs] (-1.4,0) -- (1.5,0) node[right,text=black,font=\scriptsize] {Re};
      \draw[->,grijs] (0,-1.3) -- (0,1.4) node[above,text=black,font=\scriptsize] {Im};
      \draw[hulplijn] (0,0) circle (1);
      \draw[accent!60] (1,0) -- (-.5,.866) -- (-.5,-.866) -- cycle;
      \cpunt[below right]{0}{0}{$0$}
      \cpunt[right]{1}{0}{$1$}
      \cpunt[above left]{-.5}{.866}{}
      \cpunt[below left]{-.5}{-.866}{}
    \end{tikzpicture}}

- id: h1-o18
  soort: opdracht
  niveau: 3
  thema: |-
    modulus van een product
  opgave: |-
    Neem $z = a + bi$ en $w = c + di$. Toon aan dat $|zw| = |z| \cdot |w|$. Controleer met $z = 3 + 4i$ en $w = 1 - i$.
  antwoord: |-
    bewijs; $|zw| = |7 + i| = \sqrt{50} = 5\sqrt2$
  uitwerking: |-
    $zw = (ac - bd) + (ad + bc)i$, dus
    \[ |zw|^2 = (ac - bd)^2 + (ad + bc)^2 = a^2c^2 - 2abcd + b^2d^2 + a^2d^2 + 2abcd + b^2c^2 , \]
    en na het wegvallen van $\pm 2abcd$ is dat
    \[ a^2c^2 + a^2d^2 + b^2c^2 + b^2d^2 = (a^2 + b^2)(c^2 + d^2) = |z|^2 |w|^2 . \]
    Een modulus is nooit negatief, dus $|zw| = |z| \cdot |w|$.\par
    Controle: $(3 + 4i)(1 - i) = 3 - 3i + 4i - 4i^2 = 7 + i$, met $|7 + i| = \sqrt{50} = 5\sqrt2$, en $|3 + 4i| \cdot |1 - i| = 5 \cdot \sqrt2$.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    omgekeerde en toegevoegde
  opgave: |-
    Toon aan: voor een complex getal $z \neq 0$ is $\dfrac{1}{z} = \conj{z}$ als en slechts als $|z| = 1$. Waar liggen die getallen in het vlak van Gauss?
  antwoord: |-
    bewijs; op de cirkel met middelpunt 0 en straal 1
  uitwerking: |-
    $\dfrac{1}{z} = \conj{z} \iff 1 = z \cdot \conj{z} \iff |z|^2 = 1 \iff |z| = 1$, want $z \neq 0$ en een modulus is niet negatief. Die getallen liggen op afstand 1 van de oorsprong: op de cirkel met middelpunt 0 en straal 1.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    som van twee kwadraten
  opgave: |-
    Uit oefening \ref{oef:h1-o18} volgt: is $|z|^2 = a^2 + b^2$ en $|w|^2 = c^2 + d^2$, dan is ook $|zw|^2$ een som van twee kwadraten. Gebruik dat om 65 op twee manieren te schrijven als een som van twee kwadraten van natuurlijke getallen. Begin bij $13 = 3^2 + 2^2$ en $5 = 2^2 + 1^2$, en bereken $(3 + 2i)(2 + i)$ en $(3 + 2i)(2 - i)$.
  antwoord: |-
    $65 = 4^2 + 7^2 = 8^2 + 1^2$
  uitwerking: |-
    $(3 + 2i)(2 + i) = 6 + 3i + 4i + 2i^2 = 4 + 7i$, dus $65 = 13 \cdot 5 = |4 + 7i|^2 = 4^2 + 7^2$.\par
    $(3 + 2i)(2 - i) = 6 - 3i + 4i - 2i^2 = 8 + i$, dus $65 = |8 + i|^2 = 8^2 + 1^2$.

- id: h1-o21
  soort: opdracht
  niveau: 1
  thema: |-
    drill: vermenigvuldigen
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(1 + 3i)(2 - i)$
      antwoord: |-
        $5 + 5i$
      uitwerking: |-
        $2 - i + 6i - 3i^2 = 2 + 5i + 3 = 5 + 5i$.
    - opgave: |-
        $(4 + i)(4 - i)$
      antwoord: |-
        $17$
      uitwerking: |-
        Een getal maal zijn toegevoegde: $4^2 - i^2 = 16 + 1 = 17$.
    - opgave: |-
        $-2i(5 - 3i)$
      antwoord: |-
        $-6 - 10i$
      uitwerking: |-
        $-10i + 6i^2 = -6 - 10i$.
    - opgave: |-
        $(3 + 2i)^2$
      antwoord: |-
        $5 + 12i$
      uitwerking: |-
        $9 + 12i + 4i^2 = 9 + 12i - 4 = 5 + 12i$.
    - opgave: |-
        $(1 - i)^2$
      antwoord: |-
        $-2i$
      uitwerking: |-
        $1 - 2i + i^2 = -2i$.
    - opgave: |-
        $(5 - 2i)(-1 + 4i)$
      antwoord: |-
        $3 + 22i$
      uitwerking: |-
        $-5 + 20i + 2i - 8i^2 = -5 + 22i + 8 = 3 + 22i$.
    - opgave: |-
        $(\sqrt2 + i)(\sqrt2 - i)$
      antwoord: |-
        $3$
      uitwerking: |-
        Merkwaardig product: $\bigl(\sqrt2\bigr)^2 - i^2 = 2 + 1 = 3$.
    - opgave: |-
        $(1 + i)^3$
      antwoord: |-
        $-2 + 2i$
      uitwerking: |-
        $(1 + i)^2 = 1 + 2i + i^2 = 2i$, dus $(1 + i)^3 = 2i(1 + i) = 2i + 2i^2 = -2 + 2i$.
    - opgave: |-
        $(2 - 3i)^2$
      antwoord: |-
        $-5 - 12i$
      uitwerking: |-
        $4 - 12i + 9i^2 = 4 - 12i - 9 = -5 - 12i$.
    - opgave: |-
        $(1 + 2i)^2(1 - 2i)^2$
      antwoord: |-
        $25$
      uitwerking: |-
        Neem eerst het product van de grondtallen: $(1 + 2i)^2(1 - 2i)^2 = \bigl((1 + 2i)(1 - 2i)\bigr)^2 = (1 + 4)^2 = 25$.
    - opgave: |-
        $\bigl(\tfrac12 + \tfrac12 i\bigr)^2$
      antwoord: |-
        $\tfrac12 i$
      uitwerking: |-
        $\tfrac14 + 2 \cdot \tfrac12 \cdot \tfrac12 i + \tfrac14 i^2 = \tfrac14 + \tfrac12 i - \tfrac14 = \tfrac12 i$.
    - opgave: |-
        $(3 - i)^2 + (3 + i)^2$
      antwoord: |-
        $16$
      uitwerking: |-
        $(3 - i)^2 = 9 - 6i + i^2 = 8 - 6i$ en $(3 + i)^2 = 8 + 6i$. Samen $16$: de imaginaire delen vallen weg.

- id: h1-o22
  soort: opdracht
  niveau: 1
  thema: |-
    drill: delen en gemengde bewerkingen
  opgave: |-
    Schrijf in de vorm $a + bi$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{1}{1 + i}$
      antwoord: |-
        $\tfrac12 - \tfrac12 i$
      uitwerking: |-
        Teller en noemer maal $1 - i$: $\dfrac{1 - i}{1 + 1} = \tfrac12 - \tfrac12 i$.
    - opgave: |-
        $\dfrac{2 + 3i}{1 - i}$
      antwoord: |-
        $-\tfrac12 + \tfrac52 i$
      uitwerking: |-
        $\dfrac{(2 + 3i)(1 + i)}{1 + 1} = \dfrac{2 + 2i + 3i + 3i^2}{2} = \dfrac{-1 + 5i}{2} = -\tfrac12 + \tfrac52 i$.
    - opgave: |-
        $\dfrac{13}{2 - 3i}$
      antwoord: |-
        $2 + 3i$
      uitwerking: |-
        $\dfrac{13(2 + 3i)}{4 + 9} = 2 + 3i$.
    - opgave: |-
        $\dfrac{3i}{1 + 2i}$
      antwoord: |-
        $\tfrac65 + \tfrac35 i$
      uitwerking: |-
        $\dfrac{3i(1 - 2i)}{1 + 4} = \dfrac{3i - 6i^2}{5} = \dfrac{6 + 3i}{5} = \tfrac65 + \tfrac35 i$.
    - opgave: |-
        $\dfrac{i^7}{2 + i}$
      antwoord: |-
        $-\tfrac15 - \tfrac25 i$
      uitwerking: |-
        $i^7 = i^3 = -i$, dus $\dfrac{-i}{2 + i} = \dfrac{-i(2 - i)}{4 + 1} = \dfrac{-2i + i^2}{5} = \dfrac{-1 - 2i}{5} = -\tfrac15 - \tfrac25 i$.
    - opgave: |-
        $\dfrac{(1 + i)^2}{1 - i}$
      antwoord: |-
        $-1 + i$
      uitwerking: |-
        $(1 + i)^2 = 2i$, dus $\dfrac{2i}{1 - i} = \dfrac{2i(1 + i)}{1 + 1} = i + i^2 = -1 + i$.
    - opgave: |-
        $\dfrac{4 - 2i}{1 + i} + i$
      antwoord: |-
        $1 - 2i$
      uitwerking: |-
        $\dfrac{(4 - 2i)(1 - i)}{2} = \dfrac{4 - 4i - 2i + 2i^2}{2} = \dfrac{2 - 6i}{2} = 1 - 3i$, en $1 - 3i + i = 1 - 2i$.
    - opgave: |-
        $\dfrac{1}{i^3}$
      antwoord: |-
        $i$
      uitwerking: |-
        $i^3 = -i$, dus $\dfrac{1}{-i} = \dfrac{1 \cdot i}{-i \cdot i} = \dfrac{i}{1} = i$.
    - opgave: |-
        $\dfrac{3 + i}{3 - i} - \dfrac{3 - i}{3 + i}$
      antwoord: |-
        $\tfrac65 i$
      uitwerking: |-
        Op gelijke noemer $(3 - i)(3 + i) = 10$: $\dfrac{(3 + i)^2 - (3 - i)^2}{10} = \dfrac{(8 + 6i) - (8 - 6i)}{10} = \dfrac{12i}{10} = \tfrac65 i$.

- id: h1-o23
  soort: opdracht
  niveau: 1
  thema: |-
    bewerkingen in het vlak herkennen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.55cm]
        \gaussstap{2}{-3}{4}{-3}{4}
        \draw[vector] (0,0) -- (2,1);
        \draw[vector] (0,0) -- (-1,3);
        \node[below right,inner sep=1.5pt,font=\small] at (2,1) {$z$};
        \node[above left,inner sep=1.5pt,font=\small] at (-1,3) {$w$};
        \cpunt[left]{-3}{2}{$A$}
        \cpunt[right]{1}{4}{$B$}
        \cpunt[left]{-1}{2}{$C$}
        \cpunt[above]{4}{2}{$D$}
        \cpunt[left]{-1}{-3}{$E$}
        \cpunt[right]{3}{-2}{$F$}
        \cpunt[below left]{-2}{1}{$G$}
      \end{tikzpicture}
  opgave: |-
    In de figuur zie je de complexe getallen $z$ en $w$, en de punten $A$ tot $G$. Welk punt hoort bij elk getal? Eén punt blijft over: schrijf het als een uitdrukking in $z$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $z + w$
      antwoord: |-
        $B$
      uitwerking: |-
        $z = 2 + i$ en $w = -1 + 3i$, dus $z + w = 1 + 4i$: punt $B$.
    - opgave: |-
        $z - w$
      antwoord: |-
        $F$
      uitwerking: |-
        $z - w = (2 + 1) + (1 - 3)i = 3 - 2i$: punt $F$.
    - opgave: |-
        $w - z$
      antwoord: |-
        $A$
      uitwerking: |-
        $w - z = -(z - w) = -3 + 2i$: punt $A$, het spiegelbeeld van $F$ om de oorsprong.
    - opgave: |-
        $\conj{w}$
      antwoord: |-
        $E$
      uitwerking: |-
        $\conj{w} = -1 - 3i$: punt $E$, het spiegelbeeld van $w$ om de reële as.
    - opgave: |-
        $iz$
      antwoord: |-
        $C$
      uitwerking: |-
        $iz = 2i + i^2 = -1 + 2i$: punt $C$, een kwartslag gedraaid.
    - opgave: |-
        $2z$
      antwoord: |-
        $D$
      uitwerking: |-
        $2z = 4 + 2i$: punt $D$, in dezelfde richting als $z$ en twee keer zo ver.
    - opgave: |-
        het punt dat overblijft
      antwoord: |-
        $G = -\conj{z}$
      uitwerking: |-
        $G = -2 + i$. Dat is het spiegelbeeld van $z = 2 + i$ om de imaginaire as: $G = -\conj{z}$.

- id: h1-o24
  soort: opdracht
  niveau: 1
  thema: |-
    klassieke fouten: product, modulus, toegevoegde
  opgave: |-
    Waar zit de fout? Geef telkens de juiste uitkomst.
  lijst: enumerate
  delen:
    - opgave: |-
        Iemand schrijft: `$(3 + 2i)(3 - 2i) = 9 - 4 = 5$.'
      antwoord: |-
        $(2i)^2 = -4$: de uitkomst is $13$
      uitwerking: |-
        Het merkwaardig product geeft $3^2 - (2i)^2$, en $(2i)^2 = 4i^2 = -4$. Dus $(3 + 2i)(3 - 2i) = 9 - (-4) = 13$. Je kunt ook de formule $z \cdot \conj{z} = a^2 + b^2 = 9 + 4$ gebruiken.
    - opgave: |-
        Iemand schrijft: `$|{-4} + 3i| = \sqrt{-4^2 + 3^2} = \sqrt{-7}$, dus de modulus bestaat niet.'
      antwoord: |-
        $(-4)^2 = 16$: de modulus is $5$
      uitwerking: |-
        In de formule staat het kwadraat van het reëel deel: $(-4)^2 = 16$, en niet $-4^2 = -16$. Dus $|{-4} + 3i| = \sqrt{16 + 9} = 5$. Een modulus bestaat altijd en is nooit negatief.
    - opgave: |-
        Iemand schrijft: `De toegevoegde van $-2 + 5i$ is $2 - 5i$.'
      antwoord: |-
        alleen het imaginair deel verandert van teken: $-2 - 5i$
      uitwerking: |-
        Bij de toegevoegde verandert alleen het teken van het imaginair deel: $\conj{-2 + 5i} = -2 - 5i$. Het getal $2 - 5i$ is het tegengestelde $-(-2 + 5i)$.

- id: h1-o25
  soort: opdracht
  niveau: 2
  thema: |-
    context: een figuurtje in een spel
  opgave: |-
    In een eenvoudig computerspel staat een figuurtje in het vlak van Gauss, in een punt $z$. Drie knoppen verplaatsen het: knop $D$ vervangt $z$ door $iz$, knop $S$ door $\conj{z}$, en knop $V$ door $z + 2 - i$. Het figuurtje start in $1 + 2i$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke meetkundige transformatie hoort bij elke knop?
      antwoord: |-
        $D$: kwartdraai om 0 tegen de wijzers van de klok in; $S$: spiegeling om de reële as; $V$: verschuiving over $(2, -1)$
      uitwerking: |-
        Vermenigvuldigen met $i$ is een kwartslag om de oorsprong, tegen de wijzers van de klok in (hoofdstuk 1, machten van $i$). De toegevoegde is het spiegelbeeld om de reële as. Optellen met $2 - i$ verschuift elk punt over de vector $(2, -1)$.
    - opgave: |-
        Waar staat het figuurtje als je eerst $D$ en dan $V$ indrukt? En als je eerst $V$ en dan $D$ indrukt? Maakt de volgorde uit?
      antwoord: |-
        $0$ en $-1 + 3i$: ja
      uitwerking: |-
        Eerst $D$: $i(1 + 2i) = -2 + i$, dan $V$: $-2 + i + 2 - i = 0$.\par
        Eerst $V$: $1 + 2i + 2 - i = 3 + i$, dan $D$: $i(3 + i) = -1 + 3i$.\par
        \naast{\begin{minipage}{8cm}De eindpunten verschillen, dus de volgorde maakt uit.\end{minipage}}{\begin{tikzpicture}[x=.45cm,y=.45cm]
          \gauss{-2}{3}{-1}{3}
          \draw[hulplijn,->] (1,2) -- (-2,1);
          \draw[hulplijn,->] (-2,1) -- (0,0);
          \draw[hulplijn,->] (1,2) -- (3,1);
          \draw[hulplijn,->] (3,1) -- (-1,3);
          \cpunt[above right]{1}{2}{start}
          \cpunt[below left]{0}{0}{$DV$}
          \cpunt[above left]{-1}{3}{$VD$}
        \end{tikzpicture}}
    - opgave: |-
        Het figuurtje staat in een willekeurig punt $z = a + bi$. Toon aan: eerst $D$ en dan $S$ geeft het tegengestelde van eerst $S$ en dan $D$.
      antwoord: |-
        $-b - ai$ en $b + ai$
      uitwerking: |-
        Eerst $D$: $i(a + bi) = -b + ai$, dan $S$: $-b - ai$.\par
        Eerst $S$: $a - bi$, dan $D$: $i(a - bi) = ai - bi^2 = b + ai$.\par
        En inderdaad is $-b - ai = -(b + ai)$.

- id: h1-o26
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fout: reëel en imaginair deel apart delen
  opgave: |-
    Iemand berekent $\dfrac{6 + 4i}{2 + 2i}$ door het reëel deel en het imaginair deel apart te delen. Hij vindt $\dfrac{6}{2} + \dfrac{4}{2}i$, dus $3 + 2i$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon met een controle aan dat dat fout is, en bereken het juiste quotiënt.
      antwoord: |-
        $(3 + 2i)(2 + 2i) = 2 + 10i$; juist is $\tfrac52 - \tfrac12 i$
      uitwerking: |-
        Controle: $(3 + 2i)(2 + 2i) = 6 + 6i + 4i + 4i^2 = 2 + 10i$, en dat is niet $6 + 4i$.\par
        Juist: $\dfrac{(6 + 4i)(2 - 2i)}{4 + 4} = \dfrac{12 - 12i + 8i - 8i^2}{8} = \dfrac{20 - 4i}{8} = \tfrac52 - \tfrac12 i$.\par
        Controle: $\bigl(\tfrac52 - \tfrac12 i\bigr)(2 + 2i) = 5 + 5i - i - i^2 = 6 + 4i$.
    - opgave: |-
        Wanneer mag je wel het reëel en het imaginair deel apart delen?
      antwoord: |-
        als de noemer reëel is
      uitwerking: |-
        Als de noemer een reëel getal $c$ is: $\dfrac{a + bi}{c} = \dfrac{a}{c} + \dfrac{b}{c}i$. Daarom maak je de noemer eerst reëel met de toegevoegde.

- id: h1-o27
  soort: opdracht
  niveau: 2
  thema: |-
    verzamelingen van punten tekenen
  opgave: |-
    Teken in het vlak van Gauss alle complexe getallen $z$ waarvoor
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\Re z = 2$
      antwoord: |-
        de rechte $x = 2$
      uitwerking: |-
        Alle getallen $2 + bi$: de verticale rechte door $2$.\par
        \begin{tikzpicture}[x=.32cm,y=.32cm]
          \gaussstap{2}{-3}{3}{-3}{3}
          \draw[accent,thick] (2,-3.3) -- (2,3.3);
        \end{tikzpicture}
    - opgave: |-
        $\Im z = -1$
      antwoord: |-
        de rechte $y = -1$
      uitwerking: |-
        Alle getallen $a - i$: de horizontale rechte door $-i$.\par
        \begin{tikzpicture}[x=.32cm,y=.32cm]
          \gaussstap{2}{-3}{3}{-3}{3}
          \draw[accent,thick] (-3.3,-1) -- (3.3,-1);
        \end{tikzpicture}
    - opgave: |-
        $|z| = 3$
      antwoord: |-
        de cirkel met middelpunt 0 en straal 3
      uitwerking: |-
        De punten op afstand 3 van de oorsprong: een cirkel.\par
        \begin{tikzpicture}[x=.32cm,y=.32cm]
          \gaussstap{2}{-3}{3}{-3}{3}
          \draw[accent,thick] (0,0) circle (3);
        \end{tikzpicture}
    - opgave: |-
        $\Re z = \Im z$
      antwoord: |-
        de rechte $y = x$
      uitwerking: |-
        Alle getallen $a + ai$: de rechte door de oorsprong die de hoek tussen de assen halveert.\par
        \begin{tikzpicture}[x=.32cm,y=.32cm]
          \gaussstap{2}{-3}{3}{-3}{3}
          \draw[accent,thick] (-3.2,-3.2) -- (3.2,3.2);
        \end{tikzpicture}
    - opgave: |-
        $|z| \leqslant 2$ \ en \ $\Im z \geqslant 0$
      antwoord: |-
        de bovenste helft van de schijf met straal 2
      uitwerking: |-
        De punten op afstand hoogstens 2 van de oorsprong, op of boven de reële as: een halve schijf, met de rand erbij.\par
        \begin{tikzpicture}[x=.32cm,y=.32cm]
          \gaussstap{2}{-3}{3}{-3}{3}
          \fill[accent!25,fill opacity=.5] (2,0) arc[start angle=0,end angle=180,radius=2] -- cycle;
          \draw[accent,thick] (2,0) arc[start angle=0,end angle=180,radius=2] -- cycle;
        \end{tikzpicture}

- id: h1-o28
  soort: opdracht
  niveau: 3
  thema: |-
    een quotiënt dat zuiver imaginair is
  opgave: |-
    Neem een complex getal $z \neq 1$ met $|z| = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\dfrac{1 + z}{1 - z}$ voor $z = i$ en voor $z = \tfrac35 + \tfrac45 i$. Wat valt je op?
      antwoord: |-
        $i$ en $2i$: zuiver imaginair
      uitwerking: |-
        Voor $z = i$: $\dfrac{1 + i}{1 - i} = \dfrac{(1 + i)^2}{2} = \dfrac{2i}{2} = i$.\par
        Voor $z = \tfrac35 + \tfrac45 i$ (en inderdaad $|z|^2 = \tfrac{9}{25} + \tfrac{16}{25} = 1$): $\dfrac{\tfrac85 + \tfrac45 i}{\tfrac25 - \tfrac45 i} = \dfrac{8 + 4i}{2 - 4i} = \dfrac{(8 + 4i)(2 + 4i)}{4 + 16} = \dfrac{16 + 32i + 8i + 16i^2}{20} = \dfrac{40i}{20} = 2i$.\par
        Beide keren is het quotiënt zuiver imaginair.
    - opgave: |-
        Toon aan dat $\dfrac{1 + z}{1 - z}$ altijd zuiver imaginair is of 0. Wanneer is het 0?
      antwoord: |-
        bewijs; 0 als $z = -1$
      uitwerking: |-
        Stel $z = a + bi$ met $a^2 + b^2 = 1$. Vermenigvuldig teller en noemer met de toegevoegde van de noemer, $\conj{1 - z} = (1 - a) + bi$. De noemer wordt het reële getal $|1 - z|^2 = (1 - a)^2 + b^2$, dat niet 0 is omdat $z \neq 1$. De teller is
        \[ (1 + a + bi)(1 - a + bi) = (1 + a)(1 - a) + (1 + a)bi + (1 - a)bi + b^2 i^2 = 1 - a^2 - b^2 + 2bi = 2bi , \]
        want $a^2 + b^2 = 1$. Dus $\dfrac{1 + z}{1 - z} = \dfrac{2b}{(1 - a)^2 + b^2}\, i$: zuiver imaginair, of 0 als $b = 0$. Met $|z| = 1$ en $z \neq 1$ is dat alleen voor $z = -1$.

