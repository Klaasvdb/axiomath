# KOPPEL
#----------------------------------------------------------------------------------------

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: Matrices
  thema: |-
    complexe getallen als matrices
  opgave: |-
    Bij elk complex getal $z = a + bi$ hoort de matrix $M(z) = \begin{bmatrix} a & -b \\ b & a \end{bmatrix}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $M(2 + i) \cdot M(1 - 3i)$ en $M\bigl((2 + i)(1 - 3i)\bigr)$. Wat stel je vast?
      antwoord: |-
        allebei $\begin{bmatrix} 5 & 5 \\ -5 & 5 \end{bmatrix}$
      uitwerking: |-
        $M(2 + i) \cdot M(1 - 3i) = \begin{bmatrix} 2 & -1 \\ 1 & 2 \end{bmatrix} \begin{bmatrix} 1 & 3 \\ -3 & 1 \end{bmatrix} = \begin{bmatrix} 5 & 5 \\ -5 & 5 \end{bmatrix}$. En $(2 + i)(1 - 3i) = 2 - 6i + i - 3i^2 = 5 - 5i$, met $M(5 - 5i) = \begin{bmatrix} 5 & 5 \\ -5 & 5 \end{bmatrix}$. Het product van de matrices hoort bij het product van de complexe getallen.
    - opgave: |-
        Welke matrix hoort bij $i$? Bereken haar kwadraat. Klopt dat met $i^2 = -1$?
      antwoord: |-
        $\begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$, met kwadraat $-I$
      uitwerking: |-
        $M(i) = \begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$ en $M(i)^2 = \begin{bmatrix} -1 & 0 \\ 0 & -1 \end{bmatrix} = -I = M(-1)$. Dat klopt met $i^2 = -1$.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: Vectoren
  thema: |-
    parallellogram en midden
  opgave: |-
    De punten $A = 1 + i$, $B = 4 + 2i$ en $C = 5 + 5i$ zijn drie hoekpunten van het parallellogram $ABCD$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal het vierde hoekpunt $D$. Gebruik dat $\overrightarrow{AD} = \overrightarrow{BC}$, dus $D - A = C - B$.
      antwoord: |-
        $D = 2 + 4i$
      uitwerking: |-
        $D = A + C - B = (1 + i) + (5 + 5i) - (4 + 2i) = 2 + 4i$.
    - opgave: |-
        Het midden van een lijnstuk $[PQ]$ is $\tfrac12(P + Q)$. Bepaal het snijpunt van de diagonalen, en controleer dat het het midden is van beide diagonalen.
      antwoord: |-
        $3 + 3i$
      uitwerking: |-
        $\tfrac12(A + C) = \tfrac12(6 + 6i) = 3 + 3i$ en $\tfrac12(B + D) = \tfrac12(6 + 6i) = 3 + 3i$. De diagonalen delen elkaar middendoor.

- id: h1-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: meetkunde
    onderwerp: Afstand en cirkel
  thema: |-
    modulus van een verschil als afstand
  opgave: |-
    De modulus $|z - w|$ is de afstand tussen de punten $z$ en $w$ in het vlak van Gauss.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de afstand tussen $2 + 5i$ en $-1 + i$.
      antwoord: |-
        $5$
      uitwerking: |-
        $|(2 + 5i) - (-1 + i)| = |3 + 4i| = 5$.
    - opgave: |-
        Welke punten $z = x + yi$ voldoen aan $|z - (1 + 2i)| = 3$? Schrijf de voorwaarde als een vergelijking in $x$ en $y$.
      antwoord: |-
        de cirkel met middelpunt $(1, 2)$ en straal 3: $(x - 1)^2 + (y - 2)^2 = 9$
      uitwerking: |-
        Het zijn de punten op afstand 3 van $1 + 2i$: de cirkel met middelpunt $(1, 2)$ en straal 3. Met $z - (1 + 2i) = (x - 1) + (y - 2)i$ wordt de voorwaarde $\sqrt{(x - 1)^2 + (y - 2)^2} = 3$, of $(x - 1)^2 + (y - 2)^2 = 9$.
    - opgave: |-
        Welke punten voldoen aan $|z - 2| = |z - 2i|$?
      antwoord: |-
        de rechte $y = x$
      uitwerking: |-
        De punten die even ver liggen van $2$ en van $2i$: de middelloodlijn van het lijnstuk tussen $(2, 0)$ en $(0, 2)$. Algebraïsch: $(x - 2)^2 + y^2 = x^2 + (y - 2)^2$ geeft $-4x = -4y$, dus de rechte $y = x$.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    reëel en imaginair deel, gelijkheid
  opgave: |-
    Geef het imaginair deel van $5 - 2i$. Bepaal de reële getallen $x$ en $y$ zodat $(x + 1) + (2 - y)i = 4 + 5i$.
  antwoord: |-
    $-2$; \ $x = 3$, $y = -3$
  uitwerking: |-
    $\Im(5 - 2i) = -2$. Reële delen: $x + 1 = 4$, dus $x = 3$. Imaginaire delen: $2 - y = 5$, dus $y = -3$.

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    vlak van Gauss
  opgave: |-
    Stel $3 - 2i$, \ $-1 + 2i$, \ $-4$ \ en \ $2i$ voor in het vlak van Gauss.
  antwoord: |-
    zie de uitgewerkte oplossingen
  uitwerking: |-
    Het reëel deel op de horizontale as, het imaginair deel op de verticale as.\par
    \begin{tikzpicture}[x=.5cm,y=.5cm]
      \gauss{-4}{4}{-3}{3}
      \cpunt[right]{3}{-2}{$3 - 2i$}
      \cpunt[above left]{-1}{2}{$-1 + 2i$}
      \cpunt[above]{-4}{0}{$-4$}
      \cpunt[right]{0}{2}{$2i$}
    \end{tikzpicture}

- id: h1-t3
  soort: test
  niveau: 1
  thema: |-
    optellen en aftrekken
  opgave: |-
    Bereken $z - 2w$ voor $z = 1 + 4i$ en $w = 3 - i$.
  antwoord: |-
    $-5 + 6i$
  uitwerking: |-
    $z - 2w = 1 + 4i - 6 + 2i = -5 + 6i$.

- id: h1-t4
  soort: test
  niveau: 1
  thema: |-
    vermenigvuldigen
  opgave: |-
    Bereken $(4 - i)(1 + 2i)$ en $(1 - 3i)^2$.
  antwoord: |-
    $6 + 7i$; \ $-8 - 6i$
  uitwerking: |-
    $(4 - i)(1 + 2i) = 4 + 8i - i - 2i^2 = 6 + 7i$.\par
    $(1 - 3i)^2 = 1 - 6i + 9i^2 = -8 - 6i$.

- id: h1-t5
  soort: test
  niveau: 1
  thema: |-
    machten van i
  opgave: |-
    Bereken $i^{50} + i^{51}$.
  antwoord: |-
    $-1 - i$
  uitwerking: |-
    $50 = 4 \cdot 12 + 2$, dus $i^{50} = -1$, en $51 = 4 \cdot 12 + 3$, dus $i^{51} = -i$. Samen $-1 - i$.

- id: h1-t6
  soort: test
  niveau: 1
  thema: |-
    toegevoegde en modulus
  opgave: |-
    Gegeven: $z = 5 - 12i$. Bepaal $\conj{z}$, $|z|$ en $z \cdot \conj{z}$.
  antwoord: |-
    $5 + 12i$; \ $13$; \ $169$
  uitwerking: |-
    $\conj{z} = 5 + 12i$, \ $|z| = \sqrt{25 + 144} = 13$ en $z \cdot \conj{z} = |z|^2 = 169$.

- id: h1-t7
  soort: test
  niveau: 2
  thema: |-
    delen
  opgave: |-
    Bereken $\dfrac{1 + 7i}{3 + i}$.
  antwoord: |-
    $1 + 2i$
  uitwerking: |-
    $\dfrac{(1 + 7i)(3 - i)}{9 + 1} = \dfrac{3 - i + 21i - 7i^2}{10} = \dfrac{10 + 20i}{10} = 1 + 2i$.

- id: h1-t8
  soort: test
  niveau: 2
  thema: |-
    eerstegraadsvergelijking
  opgave: |-
    Los op in $\C$: $(3 - i)z + 2i = 10 + 2i$.
  antwoord: |-
    $z = 3 + i$
  uitwerking: |-
    $(3 - i)z = 10$, dus $z = \dfrac{10}{3 - i} = \dfrac{10(3 + i)}{9 + 1} = 3 + i$.
