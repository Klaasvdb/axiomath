# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    naar goniometrische vorm
  opgave: |-
    Schrijf $-2 + 2i$ in goniometrische vorm.
  antwoord: |-
    $2\sqrt2\bigl(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\bigr)$
  uitwerking: |-
    $r = \sqrt8 = 2\sqrt2$, tweede kwadrant met $|a| = |b|$: $\theta = \frac{3\pi}{4}$.

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    naar goniometrische vorm, derde kwadrant
  opgave: |-
    Schrijf $-\sqrt3 - i$ in goniometrische vorm, met de hoofdwaarde van het argument.
  antwoord: |-
    $2\bigl(\cos(-\frac{5\pi}{6}) + i\sin(-\frac{5\pi}{6})\bigr)$
  uitwerking: |-
    $r = 2$, $\cos\theta = -\frac{\sqrt3}{2}$ en $\sin\theta = -\frac12$: derde kwadrant, $\theta = -\pi + \frac{\pi}{6} = -\frac{5\pi}{6}$.

- id: h3-t3
  soort: test
  niveau: 1
  thema: |-
    naar cartesische vorm
  opgave: |-
    Schrijf $6\bigl(\cos(-\frac{\pi}{3}) + i\sin(-\frac{\pi}{3})\bigr)$ in cartesische vorm.
  antwoord: |-
    $3 - 3i\sqrt3$
  uitwerking: |-
    $6\bigl(\frac12 - \frac{\sqrt3}{2}i\bigr) = 3 - 3i\sqrt3$.

- id: h3-t4
  soort: test
  niveau: 1
  thema: |-
    product en quotiënt
  opgave: |-
    Gegeven: $z = 2\bigl(\cos\frac{2\pi}{3} + i\sin\frac{2\pi}{3}\bigr)$ en $w = 4\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$. Bereken $zw$ en $\dfrac{z}{w}$ in goniometrische en in cartesische vorm.
  antwoord: |-
    $8\bigl(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\bigr) = -4\sqrt3 + 4i$; \ $\frac12\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = \frac12 i$
  uitwerking: |-
    $zw = 8\bigl(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\bigr) = 8\bigl(-\frac{\sqrt3}{2} + \frac12 i\bigr) = -4\sqrt3 + 4i$.\par
    $\frac{z}{w} = \frac12\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = \frac12 i$.

- id: h3-t5
  soort: test
  niveau: 2
  thema: |-
    draaien
  opgave: |-
    Draai het punt $\sqrt3 + i$ over $\frac{\pi}{3}$ om de oorsprong.
  antwoord: |-
    $2i$
  uitwerking: |-
    $\sqrt3 + i = 2\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$. Draaien over $\frac{\pi}{3}$ geeft $2\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = 2i$.

- id: h3-t6
  soort: test
  niveau: 2
  thema: |-
    argument met het rekentoestel
  opgave: |-
    Schrijf $-3 + 4i$ in goniometrische vorm, met het argument op drie decimalen.
  antwoord: |-
    $5(\cos 2{,}214 + i\sin 2{,}214)$
  uitwerking: |-
    $r = 5$. Tweede kwadrant: $\bgtan(-\frac43) \approx -0{,}927$, dus $\theta = \pi - 0{,}927 \approx 2{,}214$.

- id: h3-t7
  soort: test
  niveau: 2
  thema: |-
    modulus en argument van een product
  opgave: |-
    Bepaal de modulus en de hoofdwaarde van het argument van $(-1 + i)(-\sqrt3 + i)$, zonder het product uit te werken.
  antwoord: |-
    $2\sqrt2$ en $-\frac{5\pi}{12}$
  uitwerking: |-
    $-1 + i$ heeft modulus $\sqrt2$ en argument $\frac{3\pi}{4}$, en $-\sqrt3 + i$ heeft modulus 2 en argument $\frac{5\pi}{6}$. Het product heeft modulus $2\sqrt2$ en argument $\frac{3\pi}{4} + \frac{5\pi}{6} = \frac{19\pi}{12}$. Dat is groter dan $\pi$: trek $2\pi$ af, en de hoofdwaarde is $-\frac{5\pi}{12}$.
