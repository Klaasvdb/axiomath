# Oefeningen van hoofdstuk 3. Zie oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Geef $\cos\frac{2\pi}{3}$ en $\sin\frac{2\pi}{3}$.
      antwoord: |-
        $-\tfrac12$ en $\tfrac{\sqrt3}{2}$
      uitwerking: |-
        $\frac{2\pi}{3} = \pi - \frac{\pi}{3}$ ligt in het tweede kwadrant: $\cos\frac{2\pi}{3} = -\frac12$ en $\sin\frac{2\pi}{3} = \frac{\sqrt3}{2}$.
    - opgave: |-
        Geef $\cos(-\frac{\pi}{4})$ en $\sin(-\frac{\pi}{4})$.
      antwoord: |-
        $\tfrac{\sqrt2}{2}$ en $-\tfrac{\sqrt2}{2}$
      uitwerking: |-
        Vierde kwadrant: $\cos(-\frac{\pi}{4}) = \frac{\sqrt2}{2}$ en $\sin(-\frac{\pi}{4}) = -\frac{\sqrt2}{2}$.
    - opgave: |-
        Zet $150^\circ$ om naar radialen.
      antwoord: |-
        $\tfrac{5\pi}{6}$
      uitwerking: |-
        $150 \cdot \frac{\pi}{180} = \frac{5\pi}{6}$.
    - opgave: |-
        Vul aan: $\cos(\alpha + \beta) = \ldots$ en $\sin(\alpha + \beta) = \ldots$
      antwoord: |-
        $\cos\alpha\cos\beta - \sin\alpha\sin\beta$; \ $\sin\alpha\cos\beta + \cos\alpha\sin\beta$
      uitwerking: |-
        De somformules: $\cos(\alpha + \beta) = \cos\alpha\cos\beta - \sin\alpha\sin\beta$ en $\sin(\alpha + \beta) = \sin\alpha\cos\beta + \cos\alpha\sin\beta$.
    - opgave: |-
        Bereken $|-1 + i\sqrt3|$.
      antwoord: |-
        $2$
      uitwerking: |-
        $\sqrt{1 + 3} = 2$.
    - opgave: |-
        Geef een hoek $\theta \in \, ]-\pi, \pi]$ met $\tan\theta = -1$ en $\cos\theta > 0$.
      antwoord: |-
        $-\tfrac{\pi}{4}$
      uitwerking: |-
        $\cos\theta > 0$ en $\tan\theta < 0$: vierde kwadrant, dus $\theta = -\frac{\pi}{4}$.

- id: h3-verken
  soort: start
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm]
        \gauss{-4}{2}{-1}{3}
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken}\quad Gegeven: $z = 1 + i$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $z^2$, $z^3$ en $z^4$, en stel $z$, $z^2$, $z^3$ en $z^4$ voor in het vlak van Gauss.
      antwoord: |-
        $2i$, $-2 + 2i$, $-4$
      uitwerking: |-
        $z^2 = 1 + 2i + i^2 = 2i$, \ $z^3 = 2i(1 + i) = -2 + 2i$, \ $z^4 = (2i)^2 = -4$.\par
        \begin{tikzpicture}[x=.5cm,y=.5cm]
          \gauss{-4}{2}{-1}{3}
          \draw[accent!50] (1,1) -- (0,2) -- (-2,2) -- (-4,0);
          \cpunt[right]{1}{1}{$z$}
          \cpunt[right]{0}{2}{$z^2$}
          \cpunt[above]{-2}{2}{$z^3$}
          \cpunt[above]{-4}{0}{$z^4$}
        \end{tikzpicture}
    - opgave: |-
        Bereken de modulus van de vier getallen, en meet de hoek van de positieve reële as naar elk getal.
      antwoord: |-
        moduli $\sqrt2$, $2$, $2\sqrt2$, $4$; hoeken $\frac{\pi}{4}$, $\frac{\pi}{2}$, $\frac{3\pi}{4}$, $\pi$ ($45^\circ$, $90^\circ$, $135^\circ$, $180^\circ$)
      uitwerking: |-
        $|z| = \sqrt2$, $|z^2| = 2$, $|z^3| = \sqrt8 = 2\sqrt2$ en $|z^4| = 4$. De hoeken zijn $\frac{\pi}{4}$, $\frac{\pi}{2}$, $\frac{3\pi}{4}$ en $\pi$.
    - opgave: |-
        Wat gebeurt er met de modulus en met de hoek als je met $z$ vermenigvuldigt?
      antwoord: |-
        de modulus wordt maal $\sqrt2$ gedaan, de hoek wordt $\frac{\pi}{4}$ groter
      uitwerking: |-
        Bij elke vermenigvuldiging met $z$ wordt de modulus vermenigvuldigd met $|z| = \sqrt2$, en komt er bij de hoek $\frac{\pi}{4}$ bij: de hoek van $z$.

- id: h3-omzet
  soort: kort
  opgave: |-
    Schrijf in goniometrische vorm, met de hoofdwaarde van het argument.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2 + 2i$
      antwoord: |-
        $2\sqrt2\bigl(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\bigr)$
      uitwerking: |-
        $r = \sqrt8 = 2\sqrt2$, eerste kwadrant met $a = b$: $\theta = \frac{\pi}{4}$.
    - opgave: |-
        $-\sqrt3 + i$
      antwoord: |-
        $2\bigl(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\bigr)$
      uitwerking: |-
        $r = 2$, $\cos\theta = -\frac{\sqrt3}{2}$ en $\sin\theta = \frac12$: $\theta = \frac{5\pi}{6}$.
    - opgave: |-
        $-5i$
      antwoord: |-
        $5\bigl(\cos(-\frac{\pi}{2}) + i\sin(-\frac{\pi}{2})\bigr)$
      uitwerking: |-
        Op de negatieve imaginaire as: $r = 5$ en $\theta = -\frac{\pi}{2}$.
    - opgave: |-
        $1 - i\sqrt3$
      antwoord: |-
        $2\bigl(\cos(-\frac{\pi}{3}) + i\sin(-\frac{\pi}{3})\bigr)$
      uitwerking: |-
        $r = 2$, $\cos\theta = \frac12$ en $\sin\theta = -\frac{\sqrt3}{2}$: $\theta = -\frac{\pi}{3}$.
    - opgave: |-
        $-6$
      antwoord: |-
        $6(\cos\pi + i\sin\pi)$
      uitwerking: |-
        Op de negatieve reële as: $r = 6$ en $\theta = \pi$.
    - opgave: |-
        $3 + 4i$
      antwoord: |-
        $5\bigl(\cos 0{,}927 + i\sin 0{,}927\bigr)$
      uitwerking: |-
        $r = 5$, eerste kwadrant: $\theta = \bgtan\frac43 \approx 0{,}927$.

- id: h3-terug
  soort: kort
  opgave: |-
    Schrijf in cartesische vorm.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $6\bigl(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\bigr)$
      antwoord: |-
        $3 + 3i\sqrt3$
      uitwerking: |-
        $6\bigl(\frac12 + \frac{\sqrt3}{2}i\bigr) = 3 + 3i\sqrt3$.
    - opgave: |-
        $\sqrt2\bigl(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\bigr)$
      antwoord: |-
        $-1 + i$
      uitwerking: |-
        $\sqrt2\bigl(-\frac{\sqrt2}{2} + \frac{\sqrt2}{2}i\bigr) = -1 + i$.
    - opgave: |-
        $5\bigl(\cos(-\frac{\pi}{2}) + i\sin(-\frac{\pi}{2})\bigr)$
      antwoord: |-
        $-5i$
      uitwerking: |-
        $5(0 - i) = -5i$.
    - opgave: |-
        $2(\cos 2 + i\sin 2)$, op twee decimalen
      antwoord: |-
        $-0{,}83 + 1{,}82i$
      uitwerking: |-
        Met het rekentoestel in radialen: $2\cos 2 \approx -0{,}83$ en $2\sin 2 \approx 1{,}82$.

- id: h3-product
  soort: kort
  opgave: |-
    Gegeven: $z_1 = 4\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$ en $z_2 = 2\bigl(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\bigr)$. Bereken in goniometrische vorm, en zet daarna om naar de cartesische vorm.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $z_1 z_2$
      antwoord: |-
        $8\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = 8i$
      uitwerking: |-
        $4 \cdot 2 = 8$ en $\frac{\pi}{6} + \frac{\pi}{3} = \frac{\pi}{2}$: $8i$.
    - opgave: |-
        $\dfrac{z_1}{z_2}$
      antwoord: |-
        $2\bigl(\cos(-\frac{\pi}{6}) + i\sin(-\frac{\pi}{6})\bigr) = \sqrt3 - i$
      uitwerking: |-
        $\frac42 = 2$ en $\frac{\pi}{6} - \frac{\pi}{3} = -\frac{\pi}{6}$: $2\bigl(\frac{\sqrt3}{2} - \frac12 i\bigr) = \sqrt3 - i$.
    - opgave: |-
        $z_1^2$
      antwoord: |-
        $16\bigl(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\bigr) = 8 + 8i\sqrt3$
      uitwerking: |-
        $z_1 \cdot z_1$: $4 \cdot 4 = 16$ en $\frac{\pi}{6} + \frac{\pi}{6} = \frac{\pi}{3}$: $16\bigl(\frac12 + \frac{\sqrt3}{2}i\bigr) = 8 + 8i\sqrt3$.

- id: h3-draai
  soort: kort
  opgave: |-
    Draai het punt $1 + 2i$ om de oorsprong
  lijst: enumerate
  delen:
    - opgave: |-
        over $\frac{\pi}{2}$;
      antwoord: |-
        $-2 + i$
      uitwerking: |-
        Vermenigvuldig met $\cos\frac{\pi}{2} + i\sin\frac{\pi}{2} = i$: $(1 + 2i)i = -2 + i$.
    - opgave: |-
        over $\frac{\pi}{4}$.
      antwoord: |-
        $\tfrac{\sqrt2}{2}(-1 + 3i)$
      uitwerking: |-
        Vermenigvuldig met $\cos\frac{\pi}{4} + i\sin\frac{\pi}{4} = \frac{\sqrt2}{2}(1 + i)$: $\frac{\sqrt2}{2}(1 + 2i)(1 + i) = \frac{\sqrt2}{2}(1 + i + 2i - 2) = \frac{\sqrt2}{2}(-1 + 3i)$.

- id: h3-arg
  soort: kort
  opgave: |-
    Geef zonder te rekenen de hoofdwaarde van het argument. Maak een schets.
  lijst: reeks
  kolommen: 6
  delen:
    - opgave: |-
        $7$
      antwoord: |-
        $0$
      uitwerking: |-
        Op de positieve reële as: $0$.
    - opgave: |-
        $-2$
      antwoord: |-
        $\pi$
      uitwerking: |-
        Op de negatieve reële as: $\pi$ (en niet $-\pi$, dat niet in $]-\pi, \pi]$ ligt).
    - opgave: |-
        $-4i$
      antwoord: |-
        $-\tfrac{\pi}{2}$
      uitwerking: |-
        Op de negatieve imaginaire as, onder de reële as: $-\frac{\pi}{2}$.
    - opgave: |-
        $5 + 5i$
      antwoord: |-
        $\tfrac{\pi}{4}$
      uitwerking: |-
        Op de bissectrice van het eerste kwadrant: $\frac{\pi}{4}$.
    - opgave: |-
        $-3 + 3i$
      antwoord: |-
        $\tfrac{3\pi}{4}$
      uitwerking: |-
        Op de bissectrice van het tweede kwadrant: $\pi - \frac{\pi}{4} = \frac{3\pi}{4}$.
    - opgave: |-
        $2 - 2i$
      antwoord: |-
        $-\tfrac{\pi}{4}$
      uitwerking: |-
        Op de bissectrice van het vierde kwadrant: $-\frac{\pi}{4}$.

- id: h3-rekentoestel
  soort: kort
  opgave: |-
    Schrijf in goniometrische vorm, met de modulus en het argument op drie decimalen. Let op het kwadrant.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $-2 + 5i$
      antwoord: |-
        $5{,}385(\cos 1{,}951 + i\sin 1{,}951)$
      uitwerking: |-
        $r = \sqrt{29} \approx 5{,}385$. Tweede kwadrant: $\bgtan\bigl(-\frac52\bigr) \approx -1{,}190$ ligt in het vierde, dus $\theta \approx -1{,}190 + \pi \approx 1{,}951$.
    - opgave: |-
        $-6 - i$
      antwoord: |-
        $6{,}083\bigl(\cos(-2{,}976) + i\sin(-2{,}976)\bigr)$
      uitwerking: |-
        $r = \sqrt{37} \approx 6{,}083$. Derde kwadrant: $\bgtan\frac16 \approx 0{,}165$ ligt in het eerste, dus $\theta \approx 0{,}165 - \pi \approx -2{,}976$.
    - opgave: |-
        $1 - 3i$
      antwoord: |-
        $3{,}162\bigl(\cos(-1{,}249) + i\sin(-1{,}249)\bigr)$
      uitwerking: |-
        $r = \sqrt{10} \approx 3{,}162$. Vierde kwadrant: de tangens geeft meteen de juiste hoek, $\theta = \bgtan(-3) \approx -1{,}249$.

- id: h3-product2
  soort: kort
  opgave: |-
    Zet de getallen eerst in goniometrische vorm, en bereken dan. Schrijf het resultaat in goniometrische en in cartesische vorm.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(1 + i\sqrt3)(\sqrt3 + i)$
      antwoord: |-
        $4\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = 4i$
      uitwerking: |-
        $1 + i\sqrt3 = 2\bigl(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\bigr)$ en $\sqrt3 + i = 2\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$. Moduli maal elkaar: 4; argumenten samen: $\frac{\pi}{3} + \frac{\pi}{6} = \frac{\pi}{2}$. Dus $4i$.
    - opgave: |-
        $\dfrac{2i}{1 + i\sqrt3}$
      antwoord: |-
        $\cos\frac{\pi}{6} + i\sin\frac{\pi}{6} = \tfrac{\sqrt3}{2} + \tfrac12 i$
      uitwerking: |-
        $2i = 2\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr)$. Moduli delen: $\frac22 = 1$; argumenten aftrekken: $\frac{\pi}{2} - \frac{\pi}{3} = \frac{\pi}{6}$. Dus $\frac{\sqrt3}{2} + \frac12 i$.
    - opgave: |-
        $\dfrac{-3 + 3i}{1 - i}$
      antwoord: |-
        $3(\cos\pi + i\sin\pi) = -3$
      uitwerking: |-
        $-3 + 3i = 3\sqrt2\bigl(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\bigr)$ en $1 - i = \sqrt2\bigl(\cos(-\frac{\pi}{4}) + i\sin(-\frac{\pi}{4})\bigr)$. Moduli: $\frac{3\sqrt2}{\sqrt2} = 3$; argumenten: $\frac{3\pi}{4} + \frac{\pi}{4} = \pi$. Dus $-3$.

- id: h3-gonio
  soort: kort
  opgave: |-
    Staat het getal in goniometrische vorm? Zo niet, schrijf het in goniometrische vorm, met de hoofdwaarde van het argument.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3\bigl(\cos\frac{\pi}{5} + i\sin\frac{\pi}{5}\bigr)$
      antwoord: |-
        ja
      uitwerking: |-
        De modulus 3 is positief, er staat een plusteken en twee keer dezelfde hoek: dit is een goniometrische vorm.
    - opgave: |-
        $3\bigl(\cos\frac{\pi}{5} - i\sin\frac{\pi}{5}\bigr)$
      antwoord: |-
        $3\bigl(\cos(-\frac{\pi}{5}) + i\sin(-\frac{\pi}{5})\bigr)$
      uitwerking: |-
        Er staat een minteken. Met $\cos(-\alpha) = \cos\alpha$ en $\sin(-\alpha) = -\sin\alpha$ is het getal $3\bigl(\cos(-\frac{\pi}{5}) + i\sin(-\frac{\pi}{5})\bigr)$.
    - opgave: |-
        $-4\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$
      antwoord: |-
        $4\bigl(\cos(-\frac{5\pi}{6}) + i\sin(-\frac{5\pi}{6})\bigr)$
      uitwerking: |-
        De factor is negatief. $-\cos\frac{\pi}{6} = \cos\frac{7\pi}{6}$ en $-\sin\frac{\pi}{6} = \sin\frac{7\pi}{6}$, dus het getal is $4\bigl(\cos\frac{7\pi}{6} + i\sin\frac{7\pi}{6}\bigr)$. De hoofdwaarde is $\frac{7\pi}{6} - 2\pi = -\frac{5\pi}{6}$.
    - opgave: |-
        $5\bigl(\cos\frac{\pi}{3} + i\sin\frac{\pi}{6}\bigr)$
      antwoord: |-
        $\tfrac{5\sqrt2}{2}\bigl(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\bigr)$
      uitwerking: |-
        Twee verschillende hoeken: dit is geen goniometrische vorm. In cartesische vorm is het $5 \cdot \frac12 + 5 \cdot \frac12 i = \frac52 + \frac52 i$, met modulus $\frac52\sqrt2$ en argument $\frac{\pi}{4}$.

- id: h3-hoofdwaarde
  soort: kort
  opgave: |-
    Schrijf met de hoofdwaarde van het argument.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $7\bigl(\cos\frac{13\pi}{6} + i\sin\frac{13\pi}{6}\bigr)$
      antwoord: |-
        $7\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$
      uitwerking: |-
        $\frac{13\pi}{6} - 2\pi = \frac{\pi}{6}$.
    - opgave: |-
        $5\bigl(\cos(-\frac{7\pi}{6}) + i\sin(-\frac{7\pi}{6})\bigr)$
      antwoord: |-
        $5\bigl(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\bigr)$
      uitwerking: |-
        $-\frac{7\pi}{6}$ is kleiner dan $-\pi$: $-\frac{7\pi}{6} + 2\pi = \frac{5\pi}{6}$.
    - opgave: |-
        $\cos\frac{17\pi}{3} + i\sin\frac{17\pi}{3}$
      antwoord: |-
        $\cos(-\frac{\pi}{3}) + i\sin(-\frac{\pi}{3})$
      uitwerking: |-
        Trek drie volle toeren af: $\frac{17\pi}{3} - 6\pi = \frac{17\pi - 18\pi}{3} = -\frac{\pi}{3}$.
    - opgave: |-
        $4(\cos 3\pi + i\sin 3\pi)$
      antwoord: |-
        $4(\cos\pi + i\sin\pi)$
      uitwerking: |-
        $3\pi - 2\pi = \pi$. Dat ligt in $]-\pi, \pi]$; $-\pi$ is geen hoofdwaarde. In cartesische vorm is het getal $-4$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    naar goniometrische vorm
  opgave: |-
    Schrijf in goniometrische vorm, met de hoofdwaarde van het argument.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $-1 - i$
      antwoord: |-
        $\sqrt2\bigl(\cos(-\frac{3\pi}{4}) + i\sin(-\frac{3\pi}{4})\bigr)$
      uitwerking: |-
        $r = \sqrt2$, derde kwadrant met $|a| = |b|$: $\theta = -\frac{3\pi}{4}$.
    - opgave: |-
        $4\sqrt3 - 4i$
      antwoord: |-
        $8\bigl(\cos(-\frac{\pi}{6}) + i\sin(-\frac{\pi}{6})\bigr)$
      uitwerking: |-
        $r = \sqrt{48 + 16} = 8$, $\cos\theta = \frac{\sqrt3}{2}$ en $\sin\theta = -\frac12$: $\theta = -\frac{\pi}{6}$.
    - opgave: |-
        $7i$
      antwoord: |-
        $7\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr)$
      uitwerking: |-
        Op de positieve imaginaire as: $r = 7$, $\theta = \frac{\pi}{2}$.
    - opgave: |-
        $-2 + 2i\sqrt3$
      antwoord: |-
        $4\bigl(\cos\frac{2\pi}{3} + i\sin\frac{2\pi}{3}\bigr)$
      uitwerking: |-
        $r = \sqrt{4 + 12} = 4$, $\cos\theta = -\frac12$ en $\sin\theta = \frac{\sqrt3}{2}$: $\theta = \frac{2\pi}{3}$.
    - opgave: |-
        $-3$
      antwoord: |-
        $3(\cos\pi + i\sin\pi)$
      uitwerking: |-
        $r = 3$ en $\theta = \pi$.
    - opgave: |-
        $5 + 5i\sqrt3$
      antwoord: |-
        $10\bigl(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\bigr)$
      uitwerking: |-
        $r = \sqrt{25 + 75} = 10$, $\cos\theta = \frac12$ en $\sin\theta = \frac{\sqrt3}{2}$: $\theta = \frac{\pi}{3}$.
    - opgave: |-
        $-\sqrt2 - i\sqrt2$
      antwoord: |-
        $2\bigl(\cos(-\frac{3\pi}{4}) + i\sin(-\frac{3\pi}{4})\bigr)$
      uitwerking: |-
        $r = \sqrt{2 + 2} = 2$, derde kwadrant met $|a| = |b|$: $\theta = -\frac{3\pi}{4}$.
    - opgave: |-
        $-\tfrac12 i$
      antwoord: |-
        $\tfrac12\bigl(\cos(-\frac{\pi}{2}) + i\sin(-\frac{\pi}{2})\bigr)$
      uitwerking: |-
        Op de negatieve imaginaire as: $r = \frac12$ en $\theta = -\frac{\pi}{2}$.
    - opgave: |-
        $3\sqrt3 + 3i$
      antwoord: |-
        $6\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$
      uitwerking: |-
        $r = \sqrt{27 + 9} = 6$, $\cos\theta = \frac{\sqrt3}{2}$ en $\sin\theta = \frac12$: $\theta = \frac{\pi}{6}$.
    - opgave: |-
        $-\sqrt6 + i\sqrt2$
      antwoord: |-
        $2\sqrt2\bigl(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\bigr)$
      uitwerking: |-
        $r = \sqrt{6 + 2} = 2\sqrt2$, $\cos\theta = \frac{-\sqrt6}{2\sqrt2} = -\frac{\sqrt3}{2}$ en $\sin\theta = \frac{\sqrt2}{2\sqrt2} = \frac12$: $\theta = \frac{5\pi}{6}$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    naar cartesische vorm
  opgave: |-
    Schrijf in cartesische vorm.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2\bigl(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\bigr)$
      antwoord: |-
        $-\sqrt3 + i$
      uitwerking: |-
        $2\bigl(-\frac{\sqrt3}{2} + \frac12 i\bigr) = -\sqrt3 + i$.
    - opgave: |-
        $3\bigl(\cos(-\frac{2\pi}{3}) + i\sin(-\frac{2\pi}{3})\bigr)$
      antwoord: |-
        $-\tfrac32 - \tfrac{3\sqrt3}{2} i$
      uitwerking: |-
        $3\bigl(-\frac12 - \frac{\sqrt3}{2}i\bigr) = -\frac32 - \frac{3\sqrt3}{2}i$.
    - opgave: |-
        $10(\cos\pi + i\sin\pi)$
      antwoord: |-
        $-10$
      uitwerking: |-
        $10(-1 + 0i) = -10$.
    - opgave: |-
        $4\bigl(\cos(-\frac{\pi}{4}) + i\sin(-\frac{\pi}{4})\bigr)$
      antwoord: |-
        $2\sqrt2 - 2i\sqrt2$
      uitwerking: |-
        $4\bigl(\frac{\sqrt2}{2} - \frac{\sqrt2}{2}i\bigr) = 2\sqrt2 - 2i\sqrt2$.
    - opgave: |-
        $8\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$
      antwoord: |-
        $4\sqrt3 + 4i$
      uitwerking: |-
        $8\bigl(\frac{\sqrt3}{2} + \frac12 i\bigr) = 4\sqrt3 + 4i$.
    - opgave: |-
        $\tfrac12\bigl(\cos(-\frac{3\pi}{4}) + i\sin(-\frac{3\pi}{4})\bigr)$
      antwoord: |-
        $-\tfrac{\sqrt2}{4} - \tfrac{\sqrt2}{4} i$
      uitwerking: |-
        $\frac12\bigl(-\frac{\sqrt2}{2} - \frac{\sqrt2}{2}i\bigr) = -\frac{\sqrt2}{4} - \frac{\sqrt2}{4}i$.
    - opgave: |-
        $3\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr)$
      antwoord: |-
        $3i$
      uitwerking: |-
        $3(0 + 1 \cdot i) = 3i$.
    - opgave: |-
        $\sqrt3\bigl(\cos\frac{2\pi}{3} + i\sin\frac{2\pi}{3}\bigr)$
      antwoord: |-
        $-\tfrac{\sqrt3}{2} + \tfrac32 i$
      uitwerking: |-
        $\sqrt3\bigl(-\frac12 + \frac{\sqrt3}{2}i\bigr) = -\frac{\sqrt3}{2} + \frac32 i$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    product en quotiënt in goniometrische vorm
  opgave: |-
    Gegeven: $z = 6\bigl(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\bigr)$ en $w = 3\bigl(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\bigr)$. Bereken en schrijf in cartesische vorm.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $zw$
      antwoord: |-
        $-18$
      uitwerking: |-
        $18(\cos\pi + i\sin\pi) = -18$.
    - opgave: |-
        $\dfrac{z}{w}$
      antwoord: |-
        $2i$
      uitwerking: |-
        $2\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = 2i$.
    - opgave: |-
        $\dfrac{w}{z}$
      antwoord: |-
        $-\tfrac12 i$
      uitwerking: |-
        $\frac12\bigl(\cos(-\frac{\pi}{2}) + i\sin(-\frac{\pi}{2})\bigr) = -\frac12 i$.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    modulus en argument aflezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm]
        \gauss{-3}{3}{-3}{3}
        \cpunt[right]{0}{3}{$A$}
        \cpunt[below left]{-2}{-2}{$B$}
        \cpunt[above]{2}{0}{$C$}
        \cpunt[above left]{-3}{3}{$D$}
        \cpunt[below right]{2}{-2}{$E$}
      \end{tikzpicture}
  opgave: |-
    Geef van elk punt de modulus en de hoofdwaarde van het argument. Schrijf het getal in goniometrische vorm.
  antwoord: |-
    $A$: $3$, $\frac{\pi}{2}$; \ $B$: $2\sqrt2$, $-\frac{3\pi}{4}$; \ $C$: $2$, $0$; \ $D$: $3\sqrt2$, $\frac{3\pi}{4}$; \ $E$: $2\sqrt2$, $-\frac{\pi}{4}$
  uitwerking: |-
    $A = 3i = 3\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr)$.\par
    $B = -2 - 2i = 2\sqrt2\bigl(\cos(-\frac{3\pi}{4}) + i\sin(-\frac{3\pi}{4})\bigr)$.\par
    $C = 2 = 2(\cos 0 + i\sin 0)$.\par
    $D = -3 + 3i = 3\sqrt2\bigl(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\bigr)$.\par
    $E = 2 - 2i = 2\sqrt2\bigl(\cos(-\frac{\pi}{4}) + i\sin(-\frac{\pi}{4})\bigr)$.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    argument met het rekentoestel
  opgave: |-
    Schrijf in goniometrische vorm. Rond de modulus en het argument af op drie decimalen. Let op het kwadrant.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3 + 2i$
      antwoord: |-
        $3{,}606(\cos 0{,}588 + i\sin 0{,}588)$
      uitwerking: |-
        $r = \sqrt{13} \approx 3{,}606$, eerste kwadrant: $\theta = \bgtan\frac23 \approx 0{,}588$.
    - opgave: |-
        $-4 + i$
      antwoord: |-
        $4{,}123(\cos 2{,}897 + i\sin 2{,}897)$
      uitwerking: |-
        $r = \sqrt{17} \approx 4{,}123$. Tweede kwadrant: $\bgtan(-\frac14) \approx -0{,}245$ ligt in het vierde, dus $\theta = \pi - 0{,}245 \approx 2{,}897$.
    - opgave: |-
        $-1 - 5i$
      antwoord: |-
        $5{,}099(\cos(-1{,}768) + i\sin(-1{,}768))$
      uitwerking: |-
        $r = \sqrt{26} \approx 5{,}099$. Derde kwadrant: $\bgtan 5 \approx 1{,}373$ ligt in het eerste, dus $\theta = 1{,}373 - \pi \approx -1{,}768$.

- id: h3-o6
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten
  opgave: |-
    Waar of vals? Verbeter wat vals is.
  lijst: enumerate
  delen:
    - opgave: |-
        $\arg(-1 - i) = \frac{\pi}{4}$, want $\tan\frac{\pi}{4} = \frac{-1}{-1} = 1$.
      antwoord: |-
        vals: $-\frac{3\pi}{4}$
      uitwerking: |-
        Vals: $-1 - i$ ligt in het derde kwadrant. De tangens is 1, maar de hoek is $-\frac{3\pi}{4}$.
    - opgave: |-
        $2\bigl(\cos\frac{\pi}{3} - i\sin\frac{\pi}{3}\bigr)$ heeft argument $\frac{\pi}{3}$.
      antwoord: |-
        vals: $-\frac{\pi}{3}$
      uitwerking: |-
        Vals: dit is geen goniometrische vorm. Het is $2\bigl(\cos(-\frac{\pi}{3}) + i\sin(-\frac{\pi}{3})\bigr)$, met argument $-\frac{\pi}{3}$.
    - opgave: |-
        $-3\bigl(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\bigr)$ heeft modulus $-3$ en argument $\frac{\pi}{4}$.
      antwoord: |-
        vals: modulus 3, argument $-\frac{3\pi}{4}$
      uitwerking: |-
        Vals: een modulus is nooit negatief. Het minteken is een puntspiegeling, een halve draai: modulus 3 en argument $\frac{\pi}{4} - \pi = -\frac{3\pi}{4}$.
    - opgave: |-
        Het argument van een product is de som van de argumenten, dus $\arg(zw) = \arg z + \arg w$ voor de hoofdwaarden.
      antwoord: |-
        vals: op een veelvoud van $2\pi$ na
      uitwerking: |-
        Vals voor de hoofdwaarden: $\arg(-1) + \arg(-1) = 2\pi$, maar $\arg\bigl((-1)(-1)\bigr) = \arg 1 = 0$. De som is wel een argument van $zw$, maar soms niet de hoofdwaarde.
    - opgave: |-
        $|zw| = |z| \cdot |w|$
      antwoord: |-
        waar
      uitwerking: |-
        Waar: de moduli worden vermenigvuldigd.

- id: h3-o7
  soort: opdracht
  niveau: 2
  thema: |-
    een vierkant construeren
  opgave: |-
    De punten $A = 1 + i$ en $B = 4 + 2i$ zijn twee opeenvolgende hoekpunten van een vierkant $ABCD$, dat links van $AB$ ligt (tegen de wijzers van de klok in). Bepaal $C$ en $D$. Draai daarvoor de vector $B - A$ over $\frac{\pi}{2}$.
  antwoord: |-
    $C = 3 + 5i$, $D = 4i$
  uitwerking: |-
    $B - A = 3 + i$. Een kwartslag: $(3 + i)i = -1 + 3i$. Dan is $C = B + (-1 + 3i) = 3 + 5i$ en $D = A + (-1 + 3i) = 4i$.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    een gelijkzijdige driehoek
  opgave: |-
    Bepaal de punten $P$ zo dat $0$, $4$ en $P$ een gelijkzijdige driehoek vormen.
  antwoord: |-
    $2 + 2i\sqrt3$ of $2 - 2i\sqrt3$
  uitwerking: |-
    Draai $4$ over $\frac{\pi}{3}$ of over $-\frac{\pi}{3}$ om de oorsprong: $4\bigl(\cos\frac{\pi}{3} \pm i\sin\frac{\pi}{3}\bigr) = 4\bigl(\frac12 \pm \frac{\sqrt3}{2}i\bigr) = 2 \pm 2i\sqrt3$.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    modulus en argument van product en quotiënt
  opgave: |-
    Gegeven: $z = 1 + i\sqrt3$ en $w = -1 - i$. Bepaal de modulus en de hoofdwaarde van het argument van $zw$ en van $\dfrac{z}{w}$, zonder het product of het quotiënt uit te rekenen.
  antwoord: |-
    $zw$: $2\sqrt2$, $-\frac{5\pi}{12}$; \ $\frac{z}{w}$: $\sqrt2$, $-\frac{11\pi}{12}$
  uitwerking: |-
    $|z| = 2$ met $\arg z = \frac{\pi}{3}$, en $|w| = \sqrt2$ met $\arg w = -\frac{3\pi}{4}$.\par
    $|zw| = 2\sqrt2$ en $\frac{\pi}{3} - \frac{3\pi}{4} = -\frac{5\pi}{12}$, dat ligt in $]-\pi, \pi]$.\par
    $\bigl|\frac{z}{w}\bigr| = \frac{2}{\sqrt2} = \sqrt2$ en $\frac{\pi}{3} + \frac{3\pi}{4} = \frac{13\pi}{12}$. Dat is groter dan $\pi$: trek $2\pi$ af en je krijgt $-\frac{11\pi}{12}$.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    vermenigvuldigen als draaiing en uitrekking
  opgave: |-
    Alle hoekpunten van een figuur worden vermenigvuldigd met $w = 2\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Beschrijf meetkundig wat er met de figuur gebeurt.
      antwoord: |-
        draaiing over $\frac{\pi}{6}$ om 0, en een vermenigvuldiging met factor 2 vanuit 0
      uitwerking: |-
        Elk punt draait over $\frac{\pi}{6}$ om de oorsprong, en zijn afstand tot de oorsprong wordt verdubbeld.
    - opgave: |-
        Wat gebeurt er met de lengte van de zijden en met de oppervlakte?
      antwoord: |-
        lengtes maal 2, oppervlakte maal 4
      uitwerking: |-
        $|wz_1 - wz_2| = |w| \cdot |z_1 - z_2| = 2|z_1 - z_2|$: elke lengte wordt verdubbeld. De oppervlakte wordt dan met $2^2 = 4$ vermenigvuldigd.
    - opgave: |-
        Met welk getal moet je vermenigvuldigen om de figuur terug op haar plaats te krijgen?
      antwoord: |-
        $\frac{1}{w} = \frac12\bigl(\cos(-\frac{\pi}{6}) + i\sin(-\frac{\pi}{6})\bigr)$
      uitwerking: |-
        Met $\frac{1}{w} = \frac12\bigl(\cos(-\frac{\pi}{6}) + i\sin(-\frac{\pi}{6})\bigr) = \frac{\sqrt3}{4} - \frac14 i$: terugdraaien en halveren.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    context: windmolen
  opgave: |-
    We leggen het vlak van Gauss in het vlak van de wieken van een windmolen, met de as in de oorsprong en de meter als eenheid. Het uiteinde van een wiek staat in $20 + 15i$. De wieken draaien tegen de wijzers van de klok in, over $\frac{\pi}{10}$ per seconde.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de wiek?
      antwoord: |-
        $25$ m
      uitwerking: |-
        $|20 + 15i| = \sqrt{400 + 225} = 25$ m.
    - opgave: |-
        Waar staat het uiteinde na 5 seconden? En na 1 seconde, op cm nauwkeurig?
      antwoord: |-
        $-15 + 20i$; \ $14{,}39 + 20{,}45i$
      uitwerking: |-
        Na 5 seconden is de wiek over $\frac{\pi}{2}$ gedraaid: $(20 + 15i)i = -15 + 20i$.\par
        Na 1 seconde: $(20 + 15i)\bigl(\cos\frac{\pi}{10} + i\sin\frac{\pi}{10}\bigr) \approx (20 + 15i)(0{,}95106 + 0{,}30902i) \approx 14{,}39 + 20{,}45i$.
    - opgave: |-
        Na hoeveel seconden staat het uiteinde voor het eerst terug in $20 + 15i$?
      antwoord: |-
        na 20 seconden
      uitwerking: |-
        Een volle toer is $2\pi = 20 \cdot \frac{\pi}{10}$: na 20 seconden.

- id: h3-o12
  soort: opdracht
  niveau: 3
  thema: |-
    z gedeeld door z streep
  opgave: |-
    Neem $z = r(\cos\theta + i\sin\theta)$ met $r > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $\conj{z}$ in goniometrische vorm, en toon aan dat $\dfrac{z}{\conj{z}} = \cos 2\theta + i\sin 2\theta$.
      antwoord: |-
        $\conj{z} = r(\cos(-\theta) + i\sin(-\theta))$
      uitwerking: |-
        $\conj{z} = r\cos\theta - ir\sin\theta = r(\cos(-\theta) + i\sin(-\theta))$, want de cosinus is even en de sinus oneven. Met de regel voor het quotiënt: $\frac{z}{\conj{z}} = \frac{r}{r}\bigl(\cos(\theta + \theta) + i\sin(\theta + \theta)\bigr) = \cos 2\theta + i\sin 2\theta$.
    - opgave: |-
        Voor welke $z$ is $\dfrac{z}{\conj{z}} = i$? Waar liggen die punten?
      antwoord: |-
        argument $\frac{\pi}{4}$ of $-\frac{3\pi}{4}$: de rechte $y = x$ zonder 0
      uitwerking: |-
        $\cos 2\theta + i\sin 2\theta = i$ als $2\theta = \frac{\pi}{2} + k \cdot 2\pi$, dus $\theta = \frac{\pi}{4} + k\pi$. Met een hoofdwaarde: $\theta = \frac{\pi}{4}$ of $\theta = -\frac{3\pi}{4}$, en $r > 0$ willekeurig. Dat zijn alle punten van de rechte $y = x$, behalve de oorsprong.

- id: h3-o13
  soort: opdracht
  niveau: 3
  thema: |-
    hoek tussen twee vectoren
  opgave: |-
    De hoek van de vector $z$ naar de vector $w$ is $\arg\dfrac{w}{z}$. Bereken zo de hoek bij de oorsprong in de driehoek met hoekpunten $0$, $3 + i$ en $1 + 2i$. Leg uit waarom de formule klopt.
  antwoord: |-
    $\frac{\pi}{4}$
  uitwerking: |-
    $\frac{1 + 2i}{3 + i} = \frac{(1 + 2i)(3 - i)}{10} = \frac{5 + 5i}{10} = \frac12 + \frac12 i$, met argument $\frac{\pi}{4}$. De hoek is dus $\frac{\pi}{4}$.\par
    Het argument van $\frac{w}{z}$ is $\arg w - \arg z$ (op een veelvoud van $2\pi$ na): het verschil van de hoeken van de twee vectoren met de reële as.

- id: h3-o14
  soort: opdracht
  niveau: 3
  thema: |-
    draaien om een ander punt
  opgave: |-
    Draai het punt $z = 3 + 2i$ over $\frac{\pi}{2}$ om het punt $c = 1 + i$. Verschuif daarvoor eerst $c$ naar de oorsprong, draai, en verschuif terug. Schrijf de draaiing als één formule.
  antwoord: |-
    $3i$; \ $z \mapsto i(z - c) + c$
  uitwerking: |-
    $z - c = 2 + i$. Draaien: $(2 + i)i = -1 + 2i$. Terug verschuiven: $-1 + 2i + 1 + i = 3i$. In één formule: $z \mapsto i(z - c) + c$, en voor een draaiing over $\alpha$: $z \mapsto (\cos\alpha + i\sin\alpha)(z - c) + c$.

- id: h3-o15
  soort: opdracht
  niveau: 1
  thema: |-
    goniometrische vorm in een figuur herkennen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.62cm,y=.62cm,font=\scriptsize]
        \foreach \h in {0,30,...,330}{\draw[black!14] (0,0) -- (\h:3.3);}
        \foreach \s in {1,2,3}{\draw[black!14] (0,0) circle (\s);}
        \draw[->,grijs] (-3.5,0) -- (3.7,0) node[right,text=black] {Re};
        \draw[->,grijs] (0,-3.5) -- (0,3.7) node[above,text=black] {Im};
        \foreach \s in {1,2,3}{\node[below,inner sep=1.5pt] at (\s,0) {$\s$};}
        \cpunt[right]{2.598}{1.5}{$A$}
        \cpunt[above left]{-1}{1.732}{$B$}
        \cpunt[right]{0}{-3}{$C$}
        \cpunt[below left]{-1.414}{-1.414}{$D$}
        \cpunt[above left]{-2.598}{1.5}{$E$}
        \cpunt[below right]{1.732}{-1}{$F$}
      \end{tikzpicture}
  opgave: |-
    De lijnen door de oorsprong liggen telkens $\frac{\pi}{6}$ uit elkaar, en de cirkels hebben straal 1, 2 en 3. Welk punt hoort bij
  lijst: enumerate
  delen:
    - opgave: |-
        $2\bigl(\cos(-\frac{\pi}{6}) + i\sin(-\frac{\pi}{6})\bigr)$
      antwoord: |-
        $F$
      uitwerking: |-
        Op de cirkel met straal 2, een stap van $\frac{\pi}{6}$ onder de reële as: $F$.
    - opgave: |-
        $3\bigl(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\bigr)$
      antwoord: |-
        $E$
      uitwerking: |-
        Straal 3, vijf stappen van $\frac{\pi}{6}$ tegen de wijzers van de klok in: $E$.
    - opgave: |-
        $2\bigl(\cos\frac{2\pi}{3} + i\sin\frac{2\pi}{3}\bigr)$
      antwoord: |-
        $B$
      uitwerking: |-
        Straal 2, en $\frac{2\pi}{3} = \frac{4\pi}{6}$: vier stappen. Punt $B$.
    - opgave: |-
        $3\bigl(\cos(-\frac{\pi}{2}) + i\sin(-\frac{\pi}{2})\bigr)$
      antwoord: |-
        $C$
      uitwerking: |-
        Straal 3, op de negatieve imaginaire as: $C = -3i$.
    - opgave: |-
        $2\bigl(\cos\frac{5\pi}{4} + i\sin\frac{5\pi}{4}\bigr)$
      antwoord: |-
        $D$
      uitwerking: |-
        Straal 2. De hoek $\frac{5\pi}{4}$ is geen hoofdwaarde: hij is gelijk aan $-\frac{3\pi}{4}$, de bissectrice van het derde kwadrant. Punt $D$.
    - opgave: |-
        $3\bigl(\cos\frac{13\pi}{6} + i\sin\frac{13\pi}{6}\bigr)$
      antwoord: |-
        $A$
      uitwerking: |-
        Straal 3, en $\frac{13\pi}{6} = \frac{\pi}{6} + 2\pi$: een volle toer en nog een stap. Punt $A$.

- id: h3-o16
  soort: opdracht
  niveau: 1
  thema: |-
    klassieke fouten bij product en quotiënt
  opgave: |-
    Gegeven: $z = 2\bigl(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\bigr)$ en $w = 3\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$. Waar zit de fout? Geef het juiste resultaat, ook in cartesische vorm.
  lijst: enumerate
  delen:
    - opgave: |-
        Iemand schrijft: `$zw = 5\bigl(\cos\frac{\pi}{18} + i\sin\frac{\pi}{18}\bigr)$.'
      antwoord: |-
        moduli vermenigvuldigen, argumenten optellen: $6\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = 6i$
      uitwerking: |-
        De moduli zijn opgeteld en de argumenten vermenigvuldigd: net omgekeerd. Juist: $zw = 2 \cdot 3\bigl(\cos(\frac{\pi}{3} + \frac{\pi}{6}) + i\sin(\frac{\pi}{3} + \frac{\pi}{6})\bigr) = 6\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = 6i$.
    - opgave: |-
        Iemand schrijft: `$\dfrac{z}{w} = \dfrac23\bigl(\cos(-\frac{\pi}{6}) + i\sin(-\frac{\pi}{6})\bigr)$.'
      antwoord: |-
        argument van $z$ min argument van $w$: $\tfrac23\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr) = \tfrac{\sqrt3}{3} + \tfrac13 i$
      uitwerking: |-
        De argumenten zijn in de verkeerde volgorde afgetrokken: het is $\theta_z - \theta_w = \frac{\pi}{3} - \frac{\pi}{6} = \frac{\pi}{6}$. Juist: $\frac{z}{w} = \frac23\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr) = \frac23\bigl(\frac{\sqrt3}{2} + \frac12 i\bigr) = \frac{\sqrt3}{3} + \frac13 i$.

- id: h3-o17
  soort: opdracht
  niveau: 1
  thema: |-
    drill: product en quotiënt in goniometrische vorm
  opgave: |-
    Bereken en schrijf in cartesische vorm.
  lijst: enumerate
  delen:
    - opgave: |-
        $2\bigl(\cos\frac{\pi}{5} + i\sin\frac{\pi}{5}\bigr) \cdot 3\bigl(\cos\frac{3\pi}{10} + i\sin\frac{3\pi}{10}\bigr)$
      antwoord: |-
        $6i$
      uitwerking: |-
        $6\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = 6i$, want $\frac{2\pi}{10} + \frac{3\pi}{10} = \frac{\pi}{2}$.
    - opgave: |-
        $\dfrac{4\bigl(\cos\frac{5\pi}{12} + i\sin\frac{5\pi}{12}\bigr)}{2\bigl(\cos\frac{\pi}{12} + i\sin\frac{\pi}{12}\bigr)}$
      antwoord: |-
        $1 + i\sqrt3$
      uitwerking: |-
        $2\bigl(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\bigr) = 1 + i\sqrt3$, want $\frac{5\pi}{12} - \frac{\pi}{12} = \frac{4\pi}{12} = \frac{\pi}{3}$.
    - opgave: |-
        $\bigl(\cos\frac{3\pi}{8} + i\sin\frac{3\pi}{8}\bigr)\bigl(\cos\frac{5\pi}{8} + i\sin\frac{5\pi}{8}\bigr)$
      antwoord: |-
        $-1$
      uitwerking: |-
        Moduli 1, argument $\frac{8\pi}{8} = \pi$: $\cos\pi + i\sin\pi = -1$.
    - opgave: |-
        $\dfrac{6\bigl(\cos(-\frac{\pi}{4}) + i\sin(-\frac{\pi}{4})\bigr)}{3\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr)}$
      antwoord: |-
        $-\sqrt2 - i\sqrt2$
      uitwerking: |-
        $2\bigl(\cos(-\frac{3\pi}{4}) + i\sin(-\frac{3\pi}{4})\bigr) = 2\bigl(-\frac{\sqrt2}{2} - \frac{\sqrt2}{2}i\bigr) = -\sqrt2 - i\sqrt2$, want $-\frac{\pi}{4} - \frac{\pi}{2} = -\frac{3\pi}{4}$.
    - opgave: |-
        $\sqrt2\bigl(\cos\frac{7\pi}{12} + i\sin\frac{7\pi}{12}\bigr) \cdot \sqrt2\bigl(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\bigr)$
      antwoord: |-
        $-\sqrt3 + i$
      uitwerking: |-
        $2\bigl(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\bigr) = -\sqrt3 + i$, want $\frac{7\pi}{12} + \frac{3\pi}{12} = \frac{10\pi}{12}$.
    - opgave: |-
        $\dfrac{10\bigl(\cos\frac{2\pi}{3} + i\sin\frac{2\pi}{3}\bigr)}{5\bigl(\cos(-\frac{2\pi}{3}) + i\sin(-\frac{2\pi}{3})\bigr)}$
      antwoord: |-
        $-1 - i\sqrt3$
      uitwerking: |-
        Argument $\frac{2\pi}{3} + \frac{2\pi}{3} = \frac{4\pi}{3}$, groter dan $\pi$: dat is $-\frac{2\pi}{3}$. Dus $2\bigl(\cos(-\frac{2\pi}{3}) + i\sin(-\frac{2\pi}{3})\bigr) = -1 - i\sqrt3$.

- id: h3-o19
  soort: opdracht
  niveau: 1
  thema: |-
    gelijke getallen in goniometrische vorm
  opgave: |-
    Welke van deze getallen zijn gelijk aan $2\bigl(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\bigr)$? Leg telkens uit.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2\bigl(\cos\frac{9\pi}{4} + i\sin\frac{9\pi}{4}\bigr)$
      antwoord: |-
        ja
      uitwerking: |-
        Ja: $\frac{9\pi}{4} = \frac{\pi}{4} + 2\pi$, een volle toer meer.
    - opgave: |-
        $2\bigl(\cos\frac{\pi}{4} - i\sin\frac{\pi}{4}\bigr)$
      antwoord: |-
        nee
      uitwerking: |-
        Nee: dit is $\sqrt2 - i\sqrt2$, de toegevoegde, met argument $-\frac{\pi}{4}$.
    - opgave: |-
        $\sqrt2 + i\sqrt2$
      antwoord: |-
        ja
      uitwerking: |-
        Ja: $2\bigl(\frac{\sqrt2}{2} + \frac{\sqrt2}{2}i\bigr) = \sqrt2 + i\sqrt2$.
    - opgave: |-
        $-2\bigl(\cos\frac{5\pi}{4} + i\sin\frac{5\pi}{4}\bigr)$
      antwoord: |-
        ja
      uitwerking: |-
        Ja, al staat er geen goniometrische vorm: $\cos\frac{5\pi}{4} + i\sin\frac{5\pi}{4} = -\frac{\sqrt2}{2} - \frac{\sqrt2}{2}i$, en maal $-2$ geeft dat $\sqrt2 + i\sqrt2$. Het minteken is een halve draai: $\frac{5\pi}{4} - \pi = \frac{\pi}{4}$.
    - opgave: |-
        $2\bigl(\cos(-\frac{7\pi}{4}) + i\sin(-\frac{7\pi}{4})\bigr)$
      antwoord: |-
        ja
      uitwerking: |-
        Ja: $-\frac{7\pi}{4} + 2\pi = \frac{\pi}{4}$.
    - opgave: |-
        $2\bigl(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\bigr)$
      antwoord: |-
        nee
      uitwerking: |-
        Nee: dit is $-\sqrt2 + i\sqrt2$, in het tweede kwadrant.
    - opgave: |-
        $2\bigl(\sin\frac{\pi}{4} + i\cos\frac{\pi}{4}\bigr)$
      antwoord: |-
        ja, maar alleen omdat $\sin\frac{\pi}{4} = \cos\frac{\pi}{4}$
      uitwerking: |-
        Ja, want $\sin\frac{\pi}{4} = \cos\frac{\pi}{4} = \frac{\sqrt2}{2}$. Maar het is geen goniometrische vorm: in het algemeen heeft $\sin\theta + i\cos\theta = \cos(\frac{\pi}{2} - \theta) + i\sin(\frac{\pi}{2} - \theta)$ het argument $\frac{\pi}{2} - \theta$.

- id: h3-o18
  soort: opdracht
  niveau: 2
  thema: |-
    verzamelingen tekenen met modulus en argument
  opgave: |-
    Teken in het vlak van Gauss alle complexe getallen $z \neq 0$ waarvoor
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $|z| = 2$ \ en \ $\arg z = \frac{2\pi}{3}$
      antwoord: |-
        één punt: $-1 + i\sqrt3$
      uitwerking: |-
        Modulus en argument liggen vast, dus het is één punt: $2\bigl(\cos\frac{2\pi}{3} + i\sin\frac{2\pi}{3}\bigr) = -1 + i\sqrt3$.\par
        \begin{tikzpicture}[x=.38cm,y=.38cm]
          \gaussstap{2}{-3}{3}{-3}{3}
          \draw[hulplijn] (0,0) circle (2);
          \draw[vector] (0,0) -- (-1,1.732);
          \cpunt[above left]{-1}{1.732}{}
        \end{tikzpicture}
    - opgave: |-
        $\arg z = -\frac{\pi}{4}$
      antwoord: |-
        de halfrechte vanuit 0 door $1 - i$, zonder 0
      uitwerking: |-
        Alle getallen in de richting $-\frac{\pi}{4}$, op elke afstand: een halfrechte vanuit de oorsprong door $1 - i$. De oorsprong zelf hoort er niet bij, want 0 heeft geen argument.\par
        \begin{tikzpicture}[x=.38cm,y=.38cm]
          \gaussstap{2}{-3}{3}{-3}{3}
          \draw[accent,thick] (0,0) -- (3.2,-3.2);
          \fill[white] (0,0) circle (2.5pt); \draw[accent] (0,0) circle (2.5pt);
        \end{tikzpicture}
    - opgave: |-
        $1 \leqslant |z| \leqslant 3$ \ en \ $0 \leqslant \arg z \leqslant \frac{\pi}{2}$
      antwoord: |-
        een kwart van een ring, in het eerste kwadrant
      uitwerking: |-
        Tussen de cirkels met straal 1 en 3, en tussen de positieve reële en de positieve imaginaire as: een kwart ring, met de rand erbij.\par
        \begin{tikzpicture}[x=.38cm,y=.38cm]
          \gaussstap{2}{-3}{3}{-3}{3}
          \fill[accent!25] (1,0) -- (3,0) arc[start angle=0,end angle=90,radius=3] -- (0,1) arc[start angle=90,end angle=0,radius=1] -- cycle;
          \draw[accent,thick] (1,0) -- (3,0) arc[start angle=0,end angle=90,radius=3] -- (0,1) arc[start angle=90,end angle=0,radius=1] -- cycle;
        \end{tikzpicture}
    - opgave: |-
        $\arg z = \pi$
      antwoord: |-
        de negatieve reële as, zonder 0
      uitwerking: |-
        Alle negatieve reële getallen: de negatieve reële as, zonder de oorsprong.\par
        \begin{tikzpicture}[x=.38cm,y=.38cm]
          \gaussstap{2}{-3}{3}{-3}{3}
          \draw[accent,thick] (0,0) -- (-3.3,0);
          \fill[white] (0,0) circle (2.5pt); \draw[accent] (0,0) circle (2.5pt);
        \end{tikzpicture}

- id: h3-o20
  soort: opdracht
  niveau: 2
  thema: |-
    context: een zeilboot
  opgave: |-
    Een zeilboot vertrekt uit een haven in de oorsprong. De reële as wijst naar het oosten, de imaginaire as naar het noorden, en de eenheid is 1 km. De boot vaart eerst 6 km in de richting met hoek $\frac{\pi}{6}$, en daarna 4 km in de richting met hoek $\frac{2\pi}{3}$ (de hoeken gemeten zoals een argument).
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf de twee verplaatsingen in goniometrische en in cartesische vorm.
      antwoord: |-
        $6\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr) = 3\sqrt3 + 3i$ en $4\bigl(\cos\frac{2\pi}{3} + i\sin\frac{2\pi}{3}\bigr) = -2 + 2i\sqrt3$
      uitwerking: |-
        $6\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr) = 6\bigl(\frac{\sqrt3}{2} + \frac12 i\bigr) = 3\sqrt3 + 3i$ en $4\bigl(\cos\frac{2\pi}{3} + i\sin\frac{2\pi}{3}\bigr) = 4\bigl(-\frac12 + \frac{\sqrt3}{2}i\bigr) = -2 + 2i\sqrt3$.
    - opgave: |-
        Waar ligt de boot na de tweede tocht? Hoe ver ligt ze van de haven, op 10 m nauwkeurig? Waarom is die afstand zo eenvoudig te berekenen?
      antwoord: |-
        $(3\sqrt3 - 2) + (3 + 2\sqrt3)i \approx 3{,}20 + 6{,}46i$; $2\sqrt{13} \approx 7{,}21$ km; de twee richtingen staan loodrecht
      uitwerking: |-
        Verplaatsingen tel je op: $(3\sqrt3 - 2) + (3 + 2\sqrt3)i \approx 3{,}20 + 6{,}46i$.\par
        De afstand is de modulus: $(3\sqrt3 - 2)^2 + (3 + 2\sqrt3)^2 = 27 - 12\sqrt3 + 4 + 9 + 12\sqrt3 + 12 = 52$, dus $\sqrt{52} = 2\sqrt{13} \approx 7{,}21$ km.\par
        De hoeken verschillen $\frac{2\pi}{3} - \frac{\pi}{6} = \frac{\pi}{2}$: de tochten staan loodrecht op elkaar, en met Pythagoras is de afstand $\sqrt{6^2 + 4^2} = \sqrt{52}$.
    - opgave: |-
        In welke richting moet de boot varen om recht naar de haven terug te keren? Geef de hoek op drie decimalen.
      antwoord: |-
        $-2{,}030$
      uitwerking: |-
        De boot ligt in het eerste kwadrant, met argument $\bgtan\dfrac{3 + 2\sqrt3}{3\sqrt3 - 2} \approx 1{,}112$. Terugvaren is de vector naar 0, het tegengestelde getal: een halve draai verder. In $]-\pi, \pi]$ is dat $1{,}112 - \pi \approx -2{,}030$, ongeveer naar het zuidzuidwesten.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten bij draaien
  opgave: |-
    Waar zit de fout? Geef het juiste punt.
  lijst: enumerate
  delen:
    - opgave: |-
        Iemand moet het punt $3 + i$ over $\frac{\pi}{2}$ draaien met de wijzers van de klok mee, en berekent $(3 + i) \cdot i = -1 + 3i$.
      antwoord: |-
        met de klok mee is over $-\frac{\pi}{2}$: maal $-i$, dus $1 - 3i$
      uitwerking: |-
        Met de wijzers van de klok mee is een draaiing over $-\frac{\pi}{2}$, dus vermenigvuldigen met $\cos(-\frac{\pi}{2}) + i\sin(-\frac{\pi}{2}) = -i$: $(3 + i)(-i) = -3i - i^2 = 1 - 3i$.
    - opgave: |-
        Iemand moet het punt $2 + 2i$ over $\frac{\pi}{4}$ draaien om de oorsprong, en vermenigvuldigt met $1 + i$, omdat dat getal argument $\frac{\pi}{4}$ heeft.
      antwoord: |-
        $|1 + i| = \sqrt2$ rekt ook uit; juist is $2\sqrt2\, i$
      uitwerking: |-
        $1 + i$ heeft modulus $\sqrt2$: het draait en rekt uit met factor $\sqrt2$, en geeft $(2 + 2i)(1 + i) = 4i$, op afstand 4 in plaats van $2\sqrt2$. Om alleen te draaien, vermenigvuldig je met $\cos\frac{\pi}{4} + i\sin\frac{\pi}{4} = \frac{\sqrt2}{2}(1 + i)$: $(2 + 2i) \cdot \frac{\sqrt2}{2}(1 + i) = \frac{\sqrt2}{2} \cdot 4i = 2\sqrt2\, i$.

- id: h3-o22
  soort: opdracht
  niveau: 2
  thema: |-
    een getal bepalen uit modulus en argument
  opgave: |-
    Bepaal het complex getal $z$ in cartesische vorm.
  lijst: enumerate
  delen:
    - opgave: |-
        $|z| = 4$ \ en \ $\arg(iz) = \frac{\pi}{3}$
      antwoord: |-
        $2\sqrt3 - 2i$
      uitwerking: |-
        Vermenigvuldigen met $i$ telt $\frac{\pi}{2}$ bij het argument, dus $\arg z = \frac{\pi}{3} - \frac{\pi}{2} = -\frac{\pi}{6}$. Dan is $z = 4\bigl(\cos(-\frac{\pi}{6}) + i\sin(-\frac{\pi}{6})\bigr) = 4\bigl(\frac{\sqrt3}{2} - \frac12 i\bigr) = 2\sqrt3 - 2i$.
    - opgave: |-
        $z(1 - i\sqrt3)$ heeft modulus 6 en argument $\frac{\pi}{2}$
      antwoord: |-
        $-\tfrac{3\sqrt3}{2} + \tfrac32 i$
      uitwerking: |-
        $1 - i\sqrt3$ heeft modulus 2 en argument $-\frac{\pi}{3}$. Dus $|z| = \frac62 = 3$ en $\arg z = \frac{\pi}{2} - (-\frac{\pi}{3}) = \frac{5\pi}{6}$: $z = 3\bigl(-\frac{\sqrt3}{2} + \frac12 i\bigr) = -\frac{3\sqrt3}{2} + \frac32 i$.
    - opgave: |-
        $\dfrac{z}{-2}$ heeft modulus 1 en argument $\frac{\pi}{4}$
      antwoord: |-
        $-\sqrt2 - i\sqrt2$
      uitwerking: |-
        $\frac{z}{-2} = \cos\frac{\pi}{4} + i\sin\frac{\pi}{4} = \frac{\sqrt2}{2} + \frac{\sqrt2}{2}i$, dus $z = -2\bigl(\frac{\sqrt2}{2} + \frac{\sqrt2}{2}i\bigr) = -\sqrt2 - i\sqrt2$.

- id: h3-o23
  soort: opdracht
  niveau: 2
  thema: |-
    een driehoek vermenigvuldigen
  opgave: |-
    De driehoek $T$ heeft hoekpunten $1$, $3$ en $1 + 2i$. We vermenigvuldigen elk hoekpunt met $w = 1 + i$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de beelden van de hoekpunten. Teken $T$ en zijn beeld.
      antwoord: |-
        $1 + i$, $3 + 3i$, $-1 + 3i$
      uitwerking: |-
        $1 \cdot (1 + i) = 1 + i$, \ $3(1 + i) = 3 + 3i$ \ en \ $(1 + 2i)(1 + i) = 1 + i + 2i + 2i^2 = -1 + 3i$.\par
        \begin{tikzpicture}[x=.5cm,y=.5cm]
          \gauss{-2}{4}{-1}{4}
          \draw[accent,thick,fill=accent!15] (1,0) -- (3,0) -- (1,2) -- cycle;
          \draw[fel!80!black,thick,fill=fel!20] (1,1) -- (3,3) -- (-1,3) -- cycle;
          \node[font=\small] at (1.6,.6) {$T$};
        \end{tikzpicture}
    - opgave: |-
        Over welke hoek is $T$ gedraaid, en met welke factor zijn de zijden vermenigvuldigd? Controleer met de zijde van $1$ naar $3$.
      antwoord: |-
        over $\frac{\pi}{4}$, factor $\sqrt2$
      uitwerking: |-
        $w = 1 + i = \sqrt2\bigl(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\bigr)$: een draaiing over $\frac{\pi}{4}$ om de oorsprong en een uitrekking met factor $\sqrt2$.\par
        Controle: de zijde van $1$ naar $3$ is de vector $2$, met lengte 2 en richting 0. Het beeld loopt van $1 + i$ naar $3 + 3i$: de vector $2 + 2i$, met lengte $2\sqrt2$ en richting $\frac{\pi}{4}$.

- id: h3-o24
  soort: opdracht
  niveau: 3
  thema: |-
    evenwijdig en loodrecht met een quotiënt
  opgave: |-
    Neem twee complexe getallen $z \neq 0$ en $w \neq 0$, en bekijk ze als vectoren vanuit de oorsprong.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: de vectoren liggen op één rechte als en slechts als $\tfrac{z}{w}$ reëel is, en ze staan loodrecht op elkaar als en slechts als $\tfrac{z}{w}$ zuiver imaginair is.
      antwoord: |-
        bewijs
      uitwerking: |-
        Een argument van $\frac{z}{w}$ is $\theta_z - \theta_w$, de hoek tussen de twee vectoren. De vectoren liggen op één rechte als die hoek $0$ of $\pi$ is (op een veelvoud van $2\pi$ na). Dat betekent dat $\frac{z}{w}$ op de reële as ligt: het is reëel (en niet 0, want $z \neq 0$). Ze staan loodrecht als de hoek $\frac{\pi}{2}$ of $-\frac{\pi}{2}$ is, en dan ligt $\frac{z}{w}$ op de imaginaire as: het is zuiver imaginair.
    - opgave: |-
        Onderzoek $z = 2 + 3i$ en $w = -6 + 4i$, en ook $z = 2 - 6i$ en $w = -1 + 3i$.
      antwoord: |-
        $\frac{z}{w} = -\frac12 i$: loodrecht; \ $\frac{z}{w} = -2$: op één rechte
      uitwerking: |-
        $\dfrac{2 + 3i}{-6 + 4i} = \dfrac{(2 + 3i)(-6 - 4i)}{36 + 16} = \dfrac{-12 - 8i - 18i + 12}{52} = \dfrac{-26i}{52} = -\tfrac12 i$: zuiver imaginair, dus loodrecht.\par
        $\dfrac{2 - 6i}{-1 + 3i} = \dfrac{-2(-1 + 3i)}{-1 + 3i} = -2$: reëel, dus op één rechte, in tegengestelde zin.

- id: h3-o25
  soort: opdracht
  niveau: 3
  thema: |-
    sommen van boogtangensen
  opgave: |-
    Het argument van $a + bi$ met $a > 0$ en $b > 0$ is $\bgtan\frac{b}{a}$. Gebruik dat het argument van een product (op een veelvoud van $2\pi$ na) de som is van de argumenten.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $(2 + i)(3 + i)$, en leid af dat $\bgtan\frac12 + \bgtan\frac13 = \frac{\pi}{4}$.
      antwoord: |-
        $5 + 5i$
      uitwerking: |-
        $(2 + i)(3 + i) = 6 + 2i + 3i + i^2 = 5 + 5i$, met argument $\frac{\pi}{4}$.\par
        De argumenten van de factoren zijn $\bgtan\frac12$ en $\bgtan\frac13$, allebei tussen 0 en $\frac{\pi}{2}$. Hun som ligt tussen 0 en $\pi$ en is een argument van $5 + 5i$. In dat interval is $\frac{\pi}{4}$ het enige argument van $5 + 5i$, dus $\bgtan\frac12 + \bgtan\frac13 = \frac{\pi}{4}$.
    - opgave: |-
        Toon op dezelfde manier aan dat $\bgtan 1 + \bgtan 2 + \bgtan 3 = \pi$.
      antwoord: |-
        $(1 + i)(1 + 2i)(1 + 3i) = -10$
      uitwerking: |-
        $(1 + i)(1 + 2i) = 1 + 3i + 2i^2 = -1 + 3i$, en $(-1 + 3i)(1 + 3i) = -1 - 3i + 3i + 9i^2 = -10$, met argument $\pi$.\par
        De drie argumenten $\bgtan 1$, $\bgtan 2$ en $\bgtan 3$ liggen tussen 0 en $\frac{\pi}{2}$, dus hun som ligt tussen 0 en $\frac{3\pi}{2}$. Het enige argument van $-10$ in dat interval is $\pi$. Dus $\bgtan 1 + \bgtan 2 + \bgtan 3 = \pi$.

- id: h3-o26
  soort: opdracht
  niveau: 3
  thema: |-
    de som van twee getallen met modulus 1
  opgave: |-
    Neem $z = \cos\alpha + i\sin\alpha$ en $w = \cos\beta + i\sin\beta$, met $0 < \alpha - \beta < \pi$.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg met een figuur uit waarom $z + w$ een argument $\tfrac{\alpha + \beta}{2}$ heeft.
      antwoord: |-
        $0$, $w$, $z + w$, $z$ vormen een ruit; de diagonaal halveert de hoek
      uitwerking: |-
        \naast{\begin{minipage}{8.6cm}De punten $0$, $w$, $z + w$ en $z$ vormen een parallellogram met vier zijden van lengte 1: een ruit. In een ruit halveert de diagonaal vanuit 0 de hoek bij 0. Die hoek loopt van $\beta$ tot $\alpha$, dus de diagonaal $z + w$ heeft richting $\beta + \frac{\alpha - \beta}{2} = \frac{\alpha + \beta}{2}$.\end{minipage}}{\begin{tikzpicture}[x=1.3cm,y=1.3cm,font=\small]
          \draw[->,grijs] (-.3,0) -- (1.9,0) node[right,text=black,font=\scriptsize] {Re};
          \draw[->,grijs] (0,-.2) -- (0,1.9) node[above,text=black,font=\scriptsize] {Im};
          \draw[vector] (0,0) -- (100:1);
          \draw[vector] (0,0) -- (20:1);
          \draw[hulplijn] (100:1) -- ($(100:1)+(20:1)$) -- (20:1);
          \draw[vector,fel!80!black] (0,0) -- ($(100:1)+(20:1)$);
          \node[above left] at (100:1) {$z$};
          \node[right] at (20:1) {$w$};
          \node[above right] at ($(100:1)+(20:1)$) {$z + w$};
        \end{tikzpicture}}
    - opgave: |-
        Toon aan dat $|z + w| = 2\cos\tfrac{\alpha - \beta}{2}$.
      antwoord: |-
        bewijs
      uitwerking: |-
        De diagonalen van een ruit staan loodrecht op elkaar en delen elkaar middendoor. In de rechthoekige driehoek met hoekpunten 0, $z$ en het snijpunt van de diagonalen is de schuine zijde $|z| = 1$, en de hoek bij 0 is $\frac{\alpha - \beta}{2}$. De aanliggende rechthoekszijde, de halve diagonaal, is dus $\cos\frac{\alpha - \beta}{2}$, en $|z + w| = 2\cos\frac{\alpha - \beta}{2}$.
    - opgave: |-
        Controleer met $z = \cos\frac{\pi}{3} + i\sin\frac{\pi}{3}$ en $w = 1$.
      antwoord: |-
        $\sqrt3\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$
      uitwerking: |-
        Met de formules: argument $\frac{\pi}{6}$ en modulus $2\cos\frac{\pi}{6} = \sqrt3$. Rechtstreeks: $z + w = \frac32 + \frac{\sqrt3}{2}i$, met $|z + w| = \sqrt{\frac94 + \frac34} = \sqrt3$ en $\sqrt3\bigl(\frac{\sqrt3}{2} + \frac12 i\bigr) = \frac32 + \frac{\sqrt3}{2}i$. Het klopt.

