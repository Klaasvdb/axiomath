# Oefeningen van hoofdstuk 3. Zie oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $X \sim B(20;\, 0{,}5)$. Bereken $P(X \geqslant 14)$.
      antwoord: |-
        $\approx 0{,}058$
      uitwerking: |-
        $1 - $ \texttt{binomcdf(20,0.5,13)} $\approx 0{,}058$.
    - opgave: |-
        $X \sim N(500;\, 0{,}4)$. Bereken $P(X \leqslant 499)$.
      antwoord: |-
        $\approx 0{,}006$
      uitwerking: |-
        \texttt{normalcdf(-1E99,499,500,0.4)} $\approx 0{,}006$.
    - opgave: |-
        Bereken $\frac{8}{\sqrt{16}}$ en $\frac{8}{\sqrt{64}}$.
      antwoord: |-
        2 en 1
      uitwerking: |-
        $\frac84 = 2$ en $\frac88 = 1$.
    - opgave: |-
        Wat is het complement van \textit{minstens 30} bij een aantal?
      antwoord: |-
        hoogstens 29
      uitwerking: |-
        \textit{Hoogstens 29}: daarom $P(X \geqslant 30) = 1 - P(X \leqslant 29)$.
    - opgave: |-
        Is 0,03 kleiner dan 5~\%?
      antwoord: |-
        ja
      uitwerking: |-
        $0{,}03 = 3$~\% $< 5$~\%.
    - opgave: |-
        Hoeveel zessen verwacht je bij 60 worpen met een eerlijke dobbelsteen?
      antwoord: |-
        10
      uitwerking: |-
        $60 \cdot \frac16 = 10$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Sam gooit 60 keer met een dobbelsteen en krijgt 16 keer zes. Hij zegt: \textit{de dobbelsteen is vervalst}.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel zessen verwacht je bij een eerlijke dobbelsteen? Is 16 veel meer?
      antwoord: |-
        10
      uitwerking: |-
        10. Zestien is meer, maar het toeval kan ook voor afwijkingen zorgen.
    - opgave: |-
        Kan een eerlijke dobbelsteen 16 keer zes geven bij 60 worpen?
      antwoord: |-
        ja
      uitwerking: |-
        Ja, elke uitkomst van 0 tot 60 kan. De vraag is hoe waarschijnlijk dat is.
    - opgave: |-
        Bereken de kans dat een eerlijke dobbelsteen bij 60 worpen minstens 16 keer zes geeft. Vind jij Sams besluit overtuigend?
      antwoord: |-
        $\approx 0{,}034$
      uitwerking: |-
        $X \sim B(60;\, \frac16)$: $P(X \geqslant 16) = 1 - P(X \leqslant 15) \approx 0{,}034$. Een eerlijke dobbelsteen doet dit maar in ongeveer 3~\% van de reeksen: een sterke aanwijzing, maar geen bewijs.

- id: h3-steekproef
  soort: kort
  opgave: |-
    Een populatie heeft $\mu = 70$ en $\sigma = 8$. Je neemt een aselecte steekproef van 16. Bereken de standaardafwijking van $\overline{X}$, en de kans dat het steekproefgemiddelde minstens 74 is.
  antwoord: |-
    2; \ $\approx 0{,}023$
  uitwerking: |-
    $\sigma(\overline{X}) = \frac{8}{\sqrt{16}} = 2$. 74 ligt 2 standaardafwijkingen boven 70: $P(\overline{X} \geqslant 74) \approx 0{,}023$.

- id: h3-phat
  soort: kort
  opgave: |-
    In een land steunt 52~\% van de kiezers een voorstel. Een peilingbureau ondervraagt 400 aselect gekozen kiezers.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\E(\hat{p})$ en $\sigma(\hat{p})$.
      antwoord: |-
        $0{,}52$; \ $\approx 0{,}025$
      uitwerking: |-
        $\E(\hat{p}) = p = 0{,}52$ en $\sigma(\hat{p}) = \sqrt{\frac{0{,}52 \cdot 0{,}48}{400}} \approx 0{,}025$.
    - opgave: |-
        Wat is de kans dat de peiling ten onrechte een minderheid voor het voorstel toont, dus $\hat{p} < 0{,}5$?
      antwoord: |-
        $\approx 0{,}21$
      uitwerking: |-
        Voor $n = 400$ is $\hat{p}$ bij benadering normaal: \texttt{normalcdf(-1E99,0.5,0.52,0.025)} $\approx 0{,}21$. Ongeveer één peiling op vijf geeft dus de verkeerde winnaar.

- id: h3-begrippen
  soort: kort
  opgave: |-
    Een bakker beweert dat gemiddeld 400~g in zijn broden zit. Een klant vermoedt dat de broden lichter zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        Formuleer $H_0$ en $H_1$.
      antwoord: |-
        $H_0\colon \mu = 400$, $H_1\colon \mu < 400$
      uitwerking: |-
        $H_0$ is de bewering met een vaste waarde: $\mu = 400$. De klant vermoedt lichter: $H_1\colon \mu < 400$.
    - opgave: |-
        De toets geeft een p-waarde van 0,03. Wat besluit je bij $\alpha = 0{,}05$? En bij $\alpha = 0{,}01$?
      antwoord: |-
        verwerpen; niet verwerpen
      uitwerking: |-
        $0{,}03 \leqslant 0{,}05$: $H_0$ verwerpen, de broden zijn waarschijnlijk lichter. $0{,}03 > 0{,}01$: bij het strengere niveau verwerp je $H_0$ niet.
    - opgave: |-
        Wat betekent de p-waarde van 0,03 in deze context?
      antwoord: |-
        kans op zo'n licht gemiddelde als $\mu = 400$
      uitwerking: |-
        Als de broden echt gemiddeld 400~g wegen, is er een kans van 3~\% op een steekproefgemiddelde dat minstens zo laag is als dat van de klant.

- id: h3-proportie
  soort: kort
  opgave: |-
    Vroeger kwam 25~\% van de patiënten van een tandarts te laat. Na de invoering van een sms-herinnering komen 9 van 60 aselect gekozen patiënten te laat. Is het aandeel gedaald? Toets bij $\alpha = 0{,}05$.
  lijst: enumerate
  delen:
    - opgave: |-
        Formuleer $H_0$ en $H_1$, en geef de verdeling van het aantal laatkomers als $H_0$ waar is.
      antwoord: |-
        $p = 0{,}25$ tegen $p < 0{,}25$; $X \sim B(60;\, 0{,}25)$
      uitwerking: |-
        $H_0\colon p = 0{,}25$, $H_1\colon p < 0{,}25$ (gedaald). Onder $H_0$ is het aantal laatkomers $X \sim B(60;\, 0{,}25)$, met verwachting 15.
    - opgave: |-
        Bereken de p-waarde en formuleer je besluit.
      antwoord: |-
        $\approx 0{,}045$: verwerpen
      uitwerking: |-
        Extremer in de richting van $H_1$ is minder laatkomers: p-waarde $= P(X \leqslant 9) = {}$\texttt{binomcdf(60,0.25,9)} $\approx 0{,}045 \leqslant 0{,}05$. $H_0$ verwerpen: het aandeel laatkomers is waarschijnlijk gedaald. Of de sms de oorzaak is, zegt de toets niet: er is geen controlegroep.

- id: h3-toets
  soort: kort
  opgave: |-
    Voer de toets uit bij $\alpha = 0{,}05$. Schrijf $H_0$, $H_1$, de p-waarde en je besluit.
  lijst: enumerate
  delen:
    - opgave: |-
        Vroeger had 30~\% van de leerlingen een bijbaantje. In een aselecte steekproef van 40 leerlingen zijn het er 18. Is het aandeel gestegen?
      antwoord: |-
        p-waarde $\approx 0{,}032$: verwerpen
      uitwerking: |-
        $H_0\colon p = 0{,}3$, $H_1\colon p > 0{,}3$. Onder $H_0$ is $X \sim B(40;\, 0{,}3)$. p-waarde $= P(X \geqslant 18) \approx 0{,}032 \leqslant 0{,}05$: $H_0$ verwerpen. Het aandeel is waarschijnlijk gestegen.
    - opgave: |-
        De scores op een toets hadden vroeger $\mu = 70$ en $\sigma = 8$. Na een nieuwe aanpak haalt een aselecte groep van 36 leerlingen gemiddeld 72,4. Zijn de scores gestegen?
      antwoord: |-
        p-waarde $\approx 0{,}036$: verwerpen
      uitwerking: |-
        $H_0\colon \mu = 70$, $H_1\colon \mu > 70$. Onder $H_0$ is $\overline{X} \sim N\bigl(70;\, \frac86\bigr)$. p-waarde $= P(\overline{X} \geqslant 72{,}4) \approx 0{,}036 \leqslant 0{,}05$: $H_0$ verwerpen. De scores zijn waarschijnlijk gestegen (maar een experiment met controlegroep is nodig om het aan de aanpak toe te schrijven).

- id: h3-tweezijdig
  soort: kort
  opgave: |-
    Een machine snijdt staven met een gemiddelde lengte van 50~cm en $\sigma = 2$~cm. Een steekproef van 30 staven heeft gemiddeld 50,6~cm. Is de machine ontregeld (te lang of te kort)? Toets tweezijdig bij $\alpha = 0{,}05$.
  antwoord: |-
    p-waarde $\approx 0{,}10$: niet verwerpen
  uitwerking: |-
    $H_0\colon \mu = 50$, $H_1\colon \mu \neq 50$. $\sigma(\overline{X}) = \frac{2}{\sqrt{30}} \approx 0{,}365$, en $z = \frac{0{,}6}{0{,}365} \approx 1{,}64$. De rechterstaart is $\approx 0{,}050$, de p-waarde het dubbel: $\approx 0{,}10 > 0{,}05$. $H_0$ niet verwerpen: geen duidelijke aanwijzing dat de machine ontregeld is.

- id: h3-tweezijdig-2
  soort: kort
  opgave: |-
    Bij een blinde smaaktest kiezen 32 van de 50 proevers frisdrank A boven frisdrank B. Verschilt de voorkeur van 50~\%? Toets tweezijdig bij $\alpha = 0{,}05$. Wat had je besloten bij een eenzijdige toets, als je vooraf had vermoed dat A de voorkeur krijgt?
  antwoord: |-
    tweezijdig: p-waarde $\approx 0{,}065$, niet verwerpen; eenzijdig: $\approx 0{,}032$, verwerpen
  uitwerking: |-
    $H_0\colon p = 0{,}5$, $H_1\colon p \neq 0{,}5$, met $X \sim B(50;\, 0{,}5)$ onder $H_0$. Het resultaat ligt boven 25: $P(X \geqslant 32) = 1 - {}$\texttt{binomcdf(50,0.5,31)} $\approx 0{,}032$. Tweezijdig verdubbel je: p-waarde $\approx 0{,}065 > 0{,}05$, dus $H_0$ niet verwerpen. Met een eenzijdige $H_1\colon p > 0{,}5$, vooraf gekozen, is de p-waarde $0{,}032 \leqslant 0{,}05$ en verwerp je $H_0$.

- id: h3-fouten
  soort: kort
  opgave: |-
    Een rechtbank gaat ervan uit dat een verdachte onschuldig is ($H_0$), en veroordeelt alleen bij sterk bewijs. Wat is hier een fout van de eerste soort, en wat een fout van de tweede soort? Welke wil de rechtbank vooral vermijden?
  antwoord: |-
    eerste: een onschuldige veroordelen; tweede: een schuldige vrijspreken
  uitwerking: |-
    Eerste soort: $H_0$ verwerpen terwijl ze waar is, dus een onschuldige veroordelen. Tweede soort: $H_0$ niet verwerpen terwijl ze niet waar is, dus een schuldige vrijspreken. De rechtbank wil vooral de eerste vermijden, en eist daarom sterk bewijs (een kleine $\alpha$), met als prijs dat soms een schuldige vrijuit gaat.

- id: h3-fouten-2
  soort: kort
  opgave: |-
    Een klant controleert een grote lading schroeven: hij neemt er 20 aselect, en keurt de lading af als minstens 3 schroeven defect zijn. De leverancier belooft $H_0\colon p = 0{,}05$.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de kans op een fout van de eerste soort?
      antwoord: |-
        $\approx 0{,}075$
      uitwerking: |-
        Een goede lading ($p = 0{,}05$) afkeuren: $P(X \geqslant 3) = 1 - {}$\texttt{binomcdf(20,0.05,2)} $\approx 0{,}075$.
    - opgave: |-
        Wat is de kans op een fout van de tweede soort als in werkelijkheid 15~\% defect is?
      antwoord: |-
        $\approx 0{,}40$
      uitwerking: |-
        Een slechte lading ($p = 0{,}15$) aanvaarden: $P(X \leqslant 2) = {}$\texttt{binomcdf(20,0.15,2)} $\approx 0{,}40$.
    - opgave: |-
        De klant wil een fout van de eerste soort van hoogstens 5~\%. Welke regel moet hij nemen, en wat gebeurt er met de fout van de tweede soort?
      antwoord: |-
        afkeuren vanaf 4; ze stijgt tot $\approx 0{,}65$
      uitwerking: |-
        Afkeuren vanaf 4 defecte: $P(X \geqslant 4 \mid p = 0{,}05) \approx 0{,}016 \leqslant 0{,}05$. Maar dan aanvaardt hij een lading met 15~\% defect met kans $P(X \leqslant 3 \mid p = 0{,}15) \approx 0{,}65$. De ene fout kleiner maken, maakt de andere groter; alleen een grotere steekproef verkleint beide.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h3-dobbel
  soort: kort
  opgave: |-
    Je gooit twee keer met een eerlijke dobbelsteen en neemt het gemiddelde $\overline{X}$ van de twee ogen. Eén worp heeft $\mu = 3{,}5$ en $\sigma = \sqrt{\frac{35}{12}} \approx 1{,}708$.
  lijst: enumerate
  delen:
    - opgave: |-
        Maak een tabel met de kansverdeling van $\overline{X}$.
      antwoord: |-
        waarden $1;\ 1{,}5;\ \ldots;\ 6$ met kansen $\frac{1}{36}, \frac{2}{36}, \ldots, \frac{6}{36}, \ldots, \frac{1}{36}$
      uitwerking: |-
        Er zijn 36 even waarschijnlijke uitkomsten. Het gemiddelde $1$ komt 1 keer voor, $1{,}5$ 2 keer, $2$ 3 keer, $2{,}5$ 4 keer, $3$ 5 keer, $3{,}5$ 6 keer, en daarna symmetrisch: $4$ 5 keer, $4{,}5$ 4 keer, $5$ 3 keer, $5{,}5$ 2 keer en $6$ 1 keer.
    - opgave: |-
        Bereken $\E(\overline{X})$ en $\sigma(\overline{X})$.
      antwoord: |-
        $3{,}5$ en $\approx 1{,}208$
      uitwerking: |-
        De verdeling is symmetrisch rond $3{,}5$, dus $\E(\overline{X}) = 3{,}5$. De variantie is $\sum (x - 3{,}5)^2\, P(\overline{X} = x) = \frac{2 \cdot (6{,}25 \cdot 1 + 4 \cdot 2 + 2{,}25 \cdot 3 + 1 \cdot 4 + 0{,}25 \cdot 5)}{36} = \frac{52{,}5}{36} = \frac{35}{24}$, dus $\sigma(\overline{X}) = \sqrt{\frac{35}{24}} \approx 1{,}208$.
    - opgave: |-
        Klopt dat met de stelling over de steekproevenverdeling van een gemiddelde?
      antwoord: |-
        ja
      uitwerking: |-
        De stelling geeft $\E(\overline{X}) = \mu = 3{,}5$ en $\sigma(\overline{X}) = \frac{\sigma}{\sqrt 2} = \frac{1{,}708}{1{,}414} \approx 1{,}208$. Exact: $\frac{35}{12} : 2 = \frac{35}{24}$.

- id: h3-clt
  soort: kort
  opgave: |-
    Het bedrag van een bestelling bij een webshop heeft $\mu = 42$~euro en $\sigma = 30$~euro. Veel bestellingen zijn klein, enkele heel groot.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom is het bedrag van één bestelling niet normaal verdeeld?
      antwoord: |-
        de verdeling is scheef
      uitwerking: |-
        De verdeling is scheef, met een lange staart naar grote bedragen. Een normaal model $N(42, 30)$ zou ook een flinke kans geven aan negatieve bedragen ($z = -1{,}4$).
    - opgave: |-
        Bereken de kans dat 100 aselect gekozen bestellingen gemiddeld meer dan 48~euro bedragen.
      antwoord: |-
        $\approx 0{,}023$
      uitwerking: |-
        Volgens de centrale limietstelling is $\overline{X} \approx N\bigl(42, \frac{30}{10}\bigr) = N(42, 3)$, want $n = 100$ is groot. 48 ligt 2 standaardafwijkingen boven 42: \texttt{normalcdf(48,1E99,42,3)} $\approx 0{,}023$.

- id: h3-hypothesen
  soort: kort
  opgave: |-
    Formuleer $H_0$ en $H_1$. Zeg ook welke parameter je toetst.
  lijst: enumerate
  delen:
    - opgave: |-
        Een school beweert dat haar leerlingen gemiddeld 8 uur per nacht slapen. Een ouder vermoedt dat het minder is.
      antwoord: |-
        $H_0\colon \mu = 8$, $H_1\colon \mu < 8$
      uitwerking: |-
        De parameter is de gemiddelde slaapduur $\mu$ van alle leerlingen. $H_0\colon \mu = 8$ (de bewering van de school), $H_1\colon \mu < 8$ (het vermoeden).
    - opgave: |-
        Vroeger had 15~\% van de klanten een klacht. Na een nieuwe verpakking hoopt het bedrijf dat het aandeel gedaald is.
      antwoord: |-
        $H_0\colon p = 0{,}15$, $H_1\colon p < 0{,}15$
      uitwerking: |-
        De parameter is het aandeel $p$ van alle klanten met een klacht, na de nieuwe verpakking. $H_0\colon p = 0{,}15$ (er is niets veranderd), $H_1\colon p < 0{,}15$.
    - opgave: |-
        Spelers speelden een spel gemiddeld 25 minuten per sessie. De makers denken dat een nieuwe versie spelers langer vasthoudt.
      antwoord: |-
        $H_0\colon \mu = 25$, $H_1\colon \mu > 25$
      uitwerking: |-
        De parameter is de gemiddelde speelduur $\mu$ per sessie met de nieuwe versie. $H_0\colon \mu = 25$, $H_1\colon \mu > 25$.

- id: h3-fouten-n
  soort: kort
  opgave: |-
    De klant uit de vorige oefening controleert nu 60 schroeven in plaats van 20. Hij toetst opnieuw $H_0\colon p = 0{,}05$ tegen $H_1\colon p > 0{,}05$, bij $\alpha = 0{,}05$.
  lijst: enumerate
  delen:
    - opgave: |-
        Vanaf hoeveel defecte schroeven keurt hij de lading af?
      antwoord: |-
        vanaf 7
      uitwerking: |-
        Onder $H_0$ is $X \sim B(60;\, 0{,}05)$. $P(X \geqslant 6) \approx 0{,}079 > 0{,}05$ en $P(X \geqslant 7) \approx 0{,}030 \leqslant 0{,}05$: afkeuren vanaf 7 defecte schroeven.
    - opgave: |-
        Wat is de kans op een fout van de tweede soort als in werkelijkheid 15~\% defect is? Vergelijk met de steekproef van 20.
      antwoord: |-
        $\approx 0{,}18$, veel kleiner dan $0{,}65$
      uitwerking: |-
        Een slechte lading aanvaarden: $P(X \leqslant 6 \mid p = 0{,}15) = {}$\texttt{binomcdf(60,0.15,6)} $\approx 0{,}18$. Met 20 schroeven en een kans op een fout van de eerste soort onder 5~\% was dat 0,65: de grotere steekproef verkleint de fout van de tweede soort sterk.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    drill: hypothesen formuleren
  opgave: |-
    Formuleer $H_0$ en $H_1$. Is de toets eenzijdig of tweezijdig?
  lijst: enumerate
  delen:
    - opgave: |-
        Een nieuwe meststof zou de gemiddelde opbrengst van 8 ton per hectare verhogen.
      antwoord: |-
        $\mu = 8$ tegen $\mu > 8$; eenzijdig
      uitwerking: |-
        $H_0\colon \mu = 8$, $H_1\colon \mu > 8$: eenzijdig.
    - opgave: |-
        Een peiling wil weten of het aandeel voorstanders van een plan verschilt van de helft.
      antwoord: |-
        $p = 0{,}5$ tegen $p \neq 0{,}5$; tweezijdig
      uitwerking: |-
        $H_0\colon p = 0{,}5$, $H_1\colon p \neq 0{,}5$: tweezijdig.
    - opgave: |-
        Een school vermoedt dat minder dan 15~\% van haar leerlingen te laat komt.
      antwoord: |-
        $p = 0{,}15$ tegen $p < 0{,}15$; eenzijdig
      uitwerking: |-
        $H_0\colon p = 0{,}15$, $H_1\colon p < 0{,}15$: eenzijdig.
    - opgave: |-
        Een fabrikant wil controleren of zijn machine nog gemiddeld 330~ml in een blikje doet, niet meer en niet minder.
      antwoord: |-
        $\mu = 330$ tegen $\mu \neq 330$; tweezijdig
      uitwerking: |-
        $H_0\colon \mu = 330$, $H_1\colon \mu \neq 330$: afwijken in beide richtingen is een probleem, dus tweezijdig.
    - opgave: |-
        Een speler vermoedt dat een roulettewiel te weinig op rood valt (normaal $\frac{18}{37}$).
      antwoord: |-
        $p = \frac{18}{37}$ tegen $p < \frac{18}{37}$; eenzijdig
      uitwerking: |-
        $H_0\colon p = \frac{18}{37}$, $H_1\colon p < \frac{18}{37}$: eenzijdig.
    - opgave: |-
        Een fietsenmaker beweert dat zijn banden gemiddeld minstens 6000~km meegaan. Een klant twijfelt.
      antwoord: |-
        $\mu = 6000$ tegen $\mu < 6000$; eenzijdig
      uitwerking: |-
        $H_0\colon \mu = 6000$ (de grensgeval van de bewering), $H_1\colon \mu < 6000$: de klant vermoedt minder. Eenzijdig.
    - opgave: |-
        Een onderzoeker wil weten of een geneesmiddel de reactietijd beïnvloedt (gemiddeld 0,45~s zonder middel).
      antwoord: |-
        $\mu = 0{,}45$ tegen $\mu \neq 0{,}45$; tweezijdig
      uitwerking: |-
        \textit{Beïnvloedt} zegt niets over de richting: $H_0\colon \mu = 0{,}45$, $H_1\colon \mu \neq 0{,}45$, tweezijdig.
    - opgave: |-
        Volgens een zaadhandel kiemt 90~\% van de zaadjes. Een tuinder vermoedt dat het minder is.
      antwoord: |-
        $p = 0{,}9$ tegen $p < 0{,}9$; eenzijdig
      uitwerking: |-
        $H_0\colon p = 0{,}9$, $H_1\colon p < 0{,}9$: eenzijdig.
    - opgave: |-
        Een sportclub denkt dat haar leden gemiddeld meer dan 4 uur per week sporten.
      antwoord: |-
        $\mu = 4$ tegen $\mu > 4$; eenzijdig
      uitwerking: |-
        $H_0\colon \mu = 4$, $H_1\colon \mu > 4$: eenzijdig.
    - opgave: |-
        Een stad wil weten of het aandeel fietsers anders is dan de 30~\% van vijf jaar geleden.
      antwoord: |-
        $p = 0{,}3$ tegen $p \neq 0{,}3$; tweezijdig
      uitwerking: |-
        $H_0\colon p = 0{,}3$, $H_1\colon p \neq 0{,}3$: \textit{anders} is tweezijdig.

- id: h3-d2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: steekproevenverdeling
  opgave: |-
    Bereken de standaardafwijking van $\hat{p}$ of van $\overline{X}$, voor aselecte steekproeven van grootte $n$. Rond af op drie decimalen waar nodig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $p = 0{,}5$, $n = 100$
      antwoord: |-
        $0{,}05$
      uitwerking: |-
        $\sigma(\hat{p}) = \sqrt{\frac{0{,}5 \cdot 0{,}5}{100}} = \frac{0{,}5}{10} = 0{,}05$.
    - opgave: |-
        $\mu = 50$, $\sigma = 10$, $n = 25$
      antwoord: |-
        2
      uitwerking: |-
        $\sigma(\overline{X}) = \frac{10}{\sqrt{25}} = 2$.
    - opgave: |-
        $p = 0{,}2$, $n = 400$
      antwoord: |-
        $0{,}02$
      uitwerking: |-
        $\sqrt{\frac{0{,}2 \cdot 0{,}8}{400}} = \frac{0{,}4}{20} = 0{,}02$.
    - opgave: |-
        $\sigma = 12$, $n = 36$
      antwoord: |-
        2
      uitwerking: |-
        $\frac{12}{\sqrt{36}} = 2$.
    - opgave: |-
        $p = 0{,}1$, $n = 900$
      antwoord: |-
        $0{,}01$
      uitwerking: |-
        $\sqrt{\frac{0{,}1 \cdot 0{,}9}{900}} = \frac{0{,}3}{30} = 0{,}01$.
    - opgave: |-
        $\sigma = 3$, $n = 100$
      antwoord: |-
        $0{,}3$
      uitwerking: |-
        $\frac{3}{10} = 0{,}3$.
    - opgave: |-
        $p = 0{,}3$, $n = 50$
      antwoord: |-
        $\approx 0{,}065$
      uitwerking: |-
        $\sqrt{\frac{0{,}3 \cdot 0{,}7}{50}} = \sqrt{0{,}0042} \approx 0{,}065$.
    - opgave: |-
        $\sigma = 15$, $n = 10$
      antwoord: |-
        $\approx 4{,}743$
      uitwerking: |-
        $\frac{15}{\sqrt{10}} \approx 4{,}743$.
    - opgave: |-
        $p = 0{,}9$, $n = 100$
      antwoord: |-
        $0{,}03$
      uitwerking: |-
        $\sqrt{\frac{0{,}9 \cdot 0{,}1}{100}} = \frac{0{,}3}{10} = 0{,}03$: even groot als bij $p = 0{,}1$.
    - opgave: |-
        $\sigma = 8$, $n = 64$
      antwoord: |-
        1
      uitwerking: |-
        $\frac{8}{8} = 1$.

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    toets voor een proportie, linkszijdig
  opgave: |-
    Een fabrikant beweert dat 40~\% van de snoepjes in een zak rood is. In een zak van 50 snoepjes zijn er 14 rood. Toets bij $\alpha = 0{,}05$ of er minder rode zijn dan beweerd.
  antwoord: |-
    p-waarde $\approx 0{,}054$: niet verwerpen
  uitwerking: |-
    $H_0\colon p = 0{,}4$, $H_1\colon p < 0{,}4$. Onder $H_0$: $X \sim B(50;\, 0{,}4)$, verwacht 20. Extremer in de richting van $H_1$ is minder rode: p-waarde $= P(X \leqslant 14) = {}$\texttt{binomcdf(50,0.4,14)} $\approx 0{,}054 > 0{,}05$. $H_0$ niet verwerpen: er zijn net niet genoeg aanwijzingen dat er minder rode snoepjes zijn. (Dat bewijst niet dat de 40~\% klopt.)

- id: h3-o12
  soort: opdracht
  niveau: 1
  thema: |-
    de p-waarde in een figuur
  opgave: |-
    Een toets voor een gemiddelde heeft $H_0\colon \mu = 40$. Onder $H_0$ is $\overline{X} \sim N(40, 1)$. Elke figuur toont een p-waarde als gekleurd gebied.
    \figuren{\begin{tikzpicture}[x=.42cm,y=8cm,font=\scriptsize]
      \fill[accent!30] plot[domain=42:44,samples=20] (\x,{gauss(\x,40,1)}) -- (44,0) -- (42,0) -- cycle;
      \fill[accent!30] plot[domain=36:38,samples=20] (\x,{gauss(\x,40,1)}) -- (38,0) -- (36,0) -- cycle;
      \draw[->,grijs] (35.8,0) -- (44.4,0);
      \draw[accent,thick] plot[domain=36:44,samples=60,smooth] (\x,{gauss(\x,40,1)});
      \foreach \t in {38,40,42}{\node[below] at (\t,0) {\t};}
      \node[font=\small\bfseries] at (36.6,.33) {A};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.42cm,y=8cm,font=\scriptsize]
      \fill[accent!30] plot[domain=36:38,samples=20] (\x,{gauss(\x,40,1)}) -- (38,0) -- (36,0) -- cycle;
      \draw[->,grijs] (35.8,0) -- (44.4,0);
      \draw[accent,thick] plot[domain=36:44,samples=60,smooth] (\x,{gauss(\x,40,1)});
      \foreach \t in {38,40}{\node[below] at (\t,0) {\t};}
      \node[font=\small\bfseries] at (36.6,.33) {B};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.42cm,y=8cm,font=\scriptsize]
      \fill[accent!30] plot[domain=42:44,samples=20] (\x,{gauss(\x,40,1)}) -- (44,0) -- (42,0) -- cycle;
      \draw[->,grijs] (35.8,0) -- (44.4,0);
      \draw[accent,thick] plot[domain=36:44,samples=60,smooth] (\x,{gauss(\x,40,1)});
      \foreach \t in {40,42}{\node[below] at (\t,0) {\t};}
      \node[font=\small\bfseries] at (36.6,.33) {C};
    \end{tikzpicture}}
    Welke figuur hoort bij welke toets? Bereken telkens de p-waarde.
  lijst: enumerate
  delen:
    - opgave: |-
        $H_1\colon \mu > 40$ en $\xbar = 42$
      antwoord: |-
        C; $\approx 0{,}023$
      uitwerking: |-
        Extremer in de richting van $H_1$ is groter: de rechterstaart vanaf 42, figuur C. \texttt{normalcdf(42,1E99,40,1)} $\approx 0{,}023$.
    - opgave: |-
        $H_1\colon \mu \neq 40$ en $\xbar = 42$
      antwoord: |-
        A; $\approx 0{,}046$
      uitwerking: |-
        Tweezijdig: 38 is even extreem als 42, dus beide staarten, figuur A. $2 \cdot 0{,}0228 \approx 0{,}046$.
    - opgave: |-
        $H_1\colon \mu < 40$ en $\xbar = 38$
      antwoord: |-
        B; $\approx 0{,}023$
      uitwerking: |-
        De linkerstaart tot 38, figuur B. \texttt{normalcdf(-1E99,38,40,1)} $\approx 0{,}023$.

- id: h3-d3
  soort: opdracht
  niveau: 1
  thema: |-
    drill: beslissen met p en $\alpha$
  opgave: |-
    Verwerp je $H_0$? Gegeven zijn de p-waarde en het significantieniveau.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $0{,}032$ en $\alpha = 0{,}05$
      antwoord: |-
        ja
      uitwerking: |-
        $0{,}032 \leqslant 0{,}05$: verwerpen.
    - opgave: |-
        $0{,}032$ en $\alpha = 0{,}01$
      antwoord: |-
        nee
      uitwerking: |-
        $0{,}032 > 0{,}01$: niet verwerpen.
    - opgave: |-
        $0{,}05$ en $\alpha = 0{,}05$
      antwoord: |-
        ja
      uitwerking: |-
        Gelijk aan $\alpha$: volgens de afspraak ($\leqslant$) verwerpen.
    - opgave: |-
        $0{,}21$ en $\alpha = 0{,}10$
      antwoord: |-
        nee
      uitwerking: |-
        $0{,}21 > 0{,}10$: niet verwerpen.
    - opgave: |-
        $0{,}004$ en $\alpha = 0{,}01$
      antwoord: |-
        ja
      uitwerking: |-
        $0{,}004 \leqslant 0{,}01$: verwerpen.
    - opgave: |-
        $0{,}08$ en $\alpha = 0{,}10$
      antwoord: |-
        ja
      uitwerking: |-
        $0{,}08 \leqslant 0{,}10$: verwerpen.
    - opgave: |-
        $0{,}08$ en $\alpha = 0{,}05$
      antwoord: |-
        nee
      uitwerking: |-
        $0{,}08 > 0{,}05$: niet verwerpen.
    - opgave: |-
        $0{,}011$ en $\alpha = 0{,}01$
      antwoord: |-
        nee
      uitwerking: |-
        $0{,}011 > 0{,}01$: net niet verwerpen.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    toets voor een gemiddelde
  opgave: |-
    Jongeren slapen gemiddeld 7,6 uur met $\sigma = 0{,}9$ uur. In een aselecte steekproef van 64 jongeren met een gsm op hun kamer is het gemiddelde 7,3 uur. Slapen zij minder? Toets bij $\alpha = 0{,}01$.
  antwoord: |-
    p-waarde $\approx 0{,}004$: verwerpen
  uitwerking: |-
    $H_0\colon \mu = 7{,}6$, $H_1\colon \mu < 7{,}6$. Onder $H_0$ is $\overline{X} \sim N(7{,}6;\, 0{,}1125)$, want $\sigma(\overline{X}) = \frac{0{,}9}{\sqrt{64}} = 0{,}1125$. Dan is $z = \frac{7{,}3 - 7{,}6}{0{,}1125} \approx -2{,}67$, en de p-waarde $= P(\overline{X} \leqslant 7{,}3) = {}$\texttt{normalcdf(-1E99,7.3,7.6,0.1125)} $\approx 0{,}004 \leqslant 0{,}01$. $H_0$ verwerpen: ze slapen gemiddeld minder. Of de gsm de oorzaak is, toont deze observationele studie niet.

- id: h3-o11
  soort: opdracht
  niveau: 1
  thema: |-
    de p-waarde in een staafdiagram
  figuur:
    code: |-
      \begin{tikzpicture}[x=.28cm,y=12cm,font=\scriptsize]
        \foreach \k/\h in {1/0.0000,2/0.0002,3/0.0011,4/0.0046,5/0.0148,6/0.0370,7/0.0739,8/0.1201,9/0.1602,10/0.1762,11/0.1602,12/0.1201,13/0.0739,14/0.0370,15/0.0148,16/0.0046,17/0.0011,18/0.0002,19/0.0000}{\staaf{\k}{\h}{.8}}
        \draw[->,grijs] (-.5,0) -- (21,0) node[right,text=black] {$k$};
        \foreach \t in {0,5,10,15,20}{\node[below] at (\t,0) {\t};}
      \end{tikzpicture}
  opgave: |-
    Je gooit 20 keer met een munt om $H_0\colon p = 0{,}5$ te toetsen. Het staafdiagram toont $P(X = k)$ als $H_0$ waar is. Je gooit 6 keer kop.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke staven vormen samen de p-waarde bij $H_1\colon p < 0{,}5$? Bereken ze.
      antwoord: |-
        $k \leqslant 6$; $\approx 0{,}058$
      uitwerking: |-
        Minstens zo extreem in de richting van $H_1$: 6 of minder keer kop, de staven van 0 tot 6. $P(X \leqslant 6) = {}$\texttt{binomcdf(20,0.5,6)} $\approx 0{,}058$.
    - opgave: |-
        Welke staven horen erbij bij $H_1\colon p \neq 0{,}5$? Bereken de p-waarde.
      antwoord: |-
        $k \leqslant 6$ en $k \geqslant 14$; $\approx 0{,}115$
      uitwerking: |-
        Ook 14 of meer keer kop ligt even ver van 10: de staven van 0 tot 6 en van 14 tot 20. Door de symmetrie is de p-waarde $2 \cdot 0{,}058 \approx 0{,}115$.
    - opgave: |-
        Verwerp je $H_0$ bij $\alpha = 0{,}05$?
      antwoord: |-
        in beide gevallen niet
      uitwerking: |-
        $0{,}058 > 0{,}05$ en $0{,}115 > 0{,}05$: in beide gevallen $H_0$ niet verwerpen.

- id: h3-o10
  soort: opdracht
  niveau: 1
  thema: |-
    drill: p-waarde bij een gegeven $z$
  opgave: |-
    Bij een toets voor een gemiddelde is $z = \frac{\xbar - \mu_0}{\sigma / \sqrt{n}}$. Bereken de p-waarde op drie decimalen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $H_1\colon \mu > \mu_0$, $z = 2{,}1$
      antwoord: |-
        $0{,}018$
      uitwerking: |-
        \texttt{normalcdf(2.1,1E99,0,1)} $\approx 0{,}018$.
    - opgave: |-
        $H_1\colon \mu < \mu_0$, $z = -1{,}5$
      antwoord: |-
        $0{,}067$
      uitwerking: |-
        \texttt{normalcdf(-1E99,-1.5,0,1)} $\approx 0{,}067$.
    - opgave: |-
        $H_1\colon \mu \neq \mu_0$, $z = 2{,}1$
      antwoord: |-
        $0{,}036$
      uitwerking: |-
        Het dubbel van de rechterstaart: $2 \cdot 0{,}0179 \approx 0{,}036$.
    - opgave: |-
        $H_1\colon \mu \neq \mu_0$, $z = -2{,}6$
      antwoord: |-
        $0{,}009$
      uitwerking: |-
        Het dubbel van de linkerstaart: $2 \cdot {}$\texttt{normalcdf(-1E99,-2.6,0,1)} $\approx 2 \cdot 0{,}0047 \approx 0{,}009$.
    - opgave: |-
        $H_1\colon \mu > \mu_0$, $z = 0{,}8$
      antwoord: |-
        $0{,}212$
      uitwerking: |-
        \texttt{normalcdf(0.8,1E99,0,1)} $\approx 0{,}212$.
    - opgave: |-
        $H_1\colon \mu > \mu_0$, $z = -1{,}8$
      antwoord: |-
        $0{,}964$
      uitwerking: |-
        Extremer in de richting van $H_1$ is groter dan $-1{,}8$: \texttt{normalcdf(-1.8,1E99,0,1)} $\approx 0{,}964$. Het gemiddelde ligt aan de verkeerde kant: zeker geen aanwijzing voor $\mu > \mu_0$.

- id: h3-o13
  soort: opdracht
  niveau: 1
  thema: |-
    context: broden wegen
  opgave: |-
    Een bakkerij verkoopt broden van 800~g. De massa heeft $\sigma = 15$~g. Een controleur weegt 25 aselect gekozen broden en vindt een gemiddelde van 794~g. Zijn de broden gemiddeld te licht? Toets bij $\alpha = 0{,}05$.
  antwoord: |-
    p-waarde $\approx 0{,}023$: verwerpen
  uitwerking: |-
    $H_0\colon \mu = 800$, $H_1\colon \mu < 800$. Onder $H_0$ is $\overline{X} \sim N(800, 3)$, want $\sigma(\overline{X}) = \frac{15}{\sqrt{25}} = 3$. Dan is $z = \frac{794 - 800}{3} = -2$ en de p-waarde $= {}$\texttt{normalcdf(-1E99,794,800,3)} $\approx 0{,}023 \leqslant 0{,}05$. $H_0$ verwerpen: de broden zijn waarschijnlijk gemiddeld te licht.

- id: h3-o4
  soort: opdracht
  niveau: 2
  thema: |-
    context: bijwerkingen
  opgave: |-
    Volgens de bijsluiter krijgt 2~\% van de gebruikers een bepaalde bijwerking. Een arts ziet bij 200 patiënten 9 gevallen. Toets bij $\alpha = 0{,}05$ of de bijwerking vaker voorkomt.
  antwoord: |-
    p-waarde $\approx 0{,}020$: verwerpen
  uitwerking: |-
    $H_0\colon p = 0{,}02$, $H_1\colon p > 0{,}02$. Onder $H_0$: $X \sim B(200;\, 0{,}02)$, verwacht 4. p-waarde $= P(X \geqslant 9) = 1 - {}$\texttt{binomcdf(200,0.02,8)} $\approx 0{,}020 \leqslant 0{,}05$: $H_0$ verwerpen. De bijwerking komt waarschijnlijk vaker voor dan vermeld, al geldt dat alleen voor patiënten zoals die van deze arts: zijn patiënten zijn geen aselecte steekproef van alle gebruikers.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    Waar zit de fout?
  opgave: |-
    Waar zit de fout? Verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Bij $H_0\colon \mu = 70$, $H_1\colon \mu > 70$, $\sigma = 8$, $n = 16$ en $\xbar = 73{,}5$ berekent Bram $z = \frac{73{,}5 - 70}{8} \approx 0{,}44$ en een p-waarde van $0{,}33$.
      antwoord: |-
        $\sigma(\overline{X}) = 2$; p-waarde $\approx 0{,}040$
      uitwerking: |-
        Hij gebruikt $\sigma$ in plaats van $\sigma(\overline{X}) = \frac{8}{\sqrt{16}} = 2$. Juist: $z = \frac{3{,}5}{2} = 1{,}75$ en p-waarde $\approx 0{,}040$. Bij $\alpha = 0{,}05$ verwerp je $H_0$ dus wel.
    - opgave: |-
        Bij $H_0\colon p = 0{,}2$, $H_1\colon p > 0{,}2$, $n = 25$ en 9 successen berekent Sofie de p-waarde als $P(X = 9) \approx 0{,}029$.
      antwoord: |-
        $P(X \geqslant 9) \approx 0{,}047$
      uitwerking: |-
        De p-waarde is de kans op het resultaat \textit{of iets extremer}: $P(X \geqslant 9) = 1 - {}$\texttt{binomcdf(25,0.2,8)} $\approx 0{,}047$.
    - opgave: |-
        Kobe schrijft $H_0\colon p > 0{,}5$ en $H_1\colon p = 0{,}5$.
      antwoord: |-
        omgekeerd
      uitwerking: |-
        $H_0$ heeft een vaste waarde (met $=$), en $H_1$ is het vermoeden: $H_0\colon p = 0{,}5$, $H_1\colon p > 0{,}5$.
    - opgave: |-
        Na de toets schrijft Lotte: \textit{de p-waarde is 0,30, dus we aanvaarden $H_0$: de munt is eerlijk.}
      antwoord: |-
        niet verwerpen is geen bewijs
      uitwerking: |-
        Je verwerpt $H_0$ niet, maar dat bewijst niet dat ze waar is. Beter: \textit{er zijn geen sterke aanwijzingen dat de munt oneerlijk is}.
    - opgave: |-
        Jens ziet dat zijn steekproefgemiddelde onder $\mu_0$ ligt, en kiest daarom $H_1\colon \mu < \mu_0$.
      antwoord: |-
        $H_1$ kiezen vóór de data
      uitwerking: |-
        $H_1$ kies je vooraf, op basis van de vraag. Wie de richting kiest na het zien van de data, halveert ongemerkt de p-waarde. Zonder vooraf gekozen richting toets je tweezijdig.

- id: h3-o18
  soort: opdracht
  niveau: 2
  thema: |-
    centrale limietstelling
  opgave: |-
    De wachttijd aan een loket is scheef verdeeld (veel korte en enkele lange wachttijden), met $\mu = 6$~min en $\sigma = 5$~min.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom kun je de kans dat één klant langer dan 8 minuten wacht niet met de normale verdeling berekenen?
      antwoord: |-
        de verdeling is scheef
      uitwerking: |-
        De wachttijd van één klant is niet normaal verdeeld: de verdeling is scheef. Een normaal model zou bovendien een kans op een negatieve wachttijd geven: $\frac{0 - 6}{5} = -1{,}2$ ligt maar 1,2 standaardafwijkingen onder $\mu$.
    - opgave: |-
        Je meet de wachttijd van 50 aselect gekozen klanten. Wat zijn het gemiddelde en de standaardafwijking van $\overline{X}$? Waarom mag je hier wel normaal rekenen?
      antwoord: |-
        6 en $\approx 0{,}71$; centrale limietstelling
      uitwerking: |-
        $\E(\overline{X}) = 6$ en $\sigma(\overline{X}) = \frac{5}{\sqrt{50}} \approx 0{,}71$. Volgens de centrale limietstelling is $\overline{X}$ voor grote $n$ bij benadering normaal, ook als de populatie scheef is.
    - opgave: |-
        Bereken de kans dat het gemiddelde van de 50 klanten meer dan 7 minuten is.
      antwoord: |-
        $\approx 0{,}079$
      uitwerking: |-
        \texttt{normalcdf(7,1E99,6,0.7071)} $\approx 0{,}079$.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    context: een thermometer ijken
  opgave: |-
    Een labo test een thermometer in een bad van precies 37,0~°C. De metingen van zo'n thermometer hebben $\sigma = 0{,}2$~°C. Tien metingen geven gemiddeld 37,12~°C. Meet de thermometer verkeerd, te hoog of te laag?
  lijst: enumerate
  delen:
    - opgave: |-
        Formuleer de hypothesen en bereken de p-waarde.
      antwoord: |-
        $\mu = 37$ tegen $\mu \neq 37$; $\approx 0{,}058$
      uitwerking: |-
        $H_0\colon \mu = 37$, $H_1\colon \mu \neq 37$ (te hoog of te laag). $\sigma(\overline{X}) = \frac{0{,}2}{\sqrt{10}} \approx 0{,}0632$, $z = \frac{0{,}12}{0{,}0632} \approx 1{,}90$. Tweezijdig: p-waarde $= 2 \cdot {}$\texttt{normalcdf(37.12,1E99,37,0.0632)} $\approx 2 \cdot 0{,}029 = 0{,}058$.
    - opgave: |-
        Wat besluit je bij $\alpha = 0{,}05$? En bij $\alpha = 0{,}10$?
      antwoord: |-
        niet verwerpen; verwerpen
      uitwerking: |-
        $0{,}058 > 0{,}05$: niet verwerpen. $0{,}058 \leqslant 0{,}10$: wel verwerpen.
    - opgave: |-
        Wat leer je uit b over het kiezen van $\alpha$?
      antwoord: |-
        vooraf kiezen
      uitwerking: |-
        Het besluit hangt af van $\alpha$. Daarom kies je $\alpha$ vooraf, en niet nadat je de p-waarde kent. Het labo kan beter meer metingen doen: met meer metingen wordt een echte afwijking van 0,12~°C duidelijk.

- id: h3-o6
  soort: opdracht
  niveau: 2
  thema: |-
    misvattingen over de p-waarde
  opgave: |-
    Waar of vals? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Een p-waarde van 0,03 betekent dat $H_0$ met kans 0,03 waar is.
      antwoord: |-
        vals
      uitwerking: |-
        Vals: de p-waarde is de kans op zo'n resultaat \textit{als} $H_0$ waar is, niet de kans dat $H_0$ waar is.
    - opgave: |-
        Verwerp je $H_0$, dan is $H_1$ bewezen.
      antwoord: |-
        vals
      uitwerking: |-
        Vals: je kunt een fout van de eerste soort maken, met kans hoogstens $\alpha$.
    - opgave: |-
        Verwerp je $H_0$ niet, dan is $H_0$ waar.
      antwoord: |-
        vals
      uitwerking: |-
        Vals: misschien is de steekproef te klein om een afwijking te zien (fout van de tweede soort).
    - opgave: |-
        Met $\alpha = 0{,}01$ verwerp je $H_0$ minder vaak ten onrechte dan met $\alpha = 0{,}05$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: de kans op een fout van de eerste soort is hoogstens $\alpha$.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    context: retourzendingen
  opgave: |-
    Bij een webshop werd 12~\% van de bestellingen teruggestuurd. Na de invoering van een nieuwe maattabel worden van 150 aselect gekozen bestellingen er 10 teruggestuurd.
  lijst: enumerate
  delen:
    - opgave: |-
        Formuleer de hypothesen. Hoeveel retourzendingen verwacht je onder $H_0$?
      antwoord: |-
        $p = 0{,}12$ tegen $p < 0{,}12$; 18
      uitwerking: |-
        $H_0\colon p = 0{,}12$, $H_1\colon p < 0{,}12$. Onder $H_0$ is $X \sim B(150;\, 0{,}12)$ met verwachting $150 \cdot 0{,}12 = 18$.
    - opgave: |-
        Bereken de p-waarde en besluit bij $\alpha = 0{,}05$.
      antwoord: |-
        $\approx 0{,}023$: verwerpen
      uitwerking: |-
        p-waarde $= P(X \leqslant 10) = {}$\texttt{binomcdf(150,0.12,10)} $\approx 0{,}023 \leqslant 0{,}05$: $H_0$ verwerpen. Het aandeel retourzendingen is waarschijnlijk gedaald.
    - opgave: |-
        De webshop besluit: \textit{de maattabel halveert bijna de retourzendingen}. Wat vind je daarvan?
      antwoord: |-
        te sterk
      uitwerking: |-
        Te sterk. De toets zegt alleen dat het aandeel waarschijnlijk gedaald is, niet hoeveel: $\hat{p} = \frac{10}{150} \approx 0{,}067$ is een onzekere schatting. En zonder controlegroep kan ook iets anders veranderd zijn, zoals het seizoen.

- id: h3-o19
  soort: opdracht
  niveau: 2
  thema: |-
    steekproevenverdeling en $n$
  figuur:
    code: |-
      \begin{tikzpicture}[x=.2cm,y=7cm,font=\scriptsize]
        \draw[black!15] (36,0) grid[xstep=2,ystep=.1] (64,.42);
        \draw[->,grijs] (36,0) -- (65,0) node[right,text=black] {$\xbar$};
        \foreach \t in {40,45,50,55,60}{\node[below] at (\t,0) {\t};}
        \draw[grijs,thick,dashed] plot[domain=36:64,samples=80,smooth] (\x,{gauss(\x,50,5)});
        \draw[accent,thick] plot[domain=43:57,samples=80,smooth] (\x,{gauss(\x,50,2)});
        \draw[fel!80!black,thick] plot[domain=46:54,samples=80,smooth] (\x,{gauss(\x,50,1)});
        \node[fel!80!black] at (52.6,.37) {A};
        \node[text=accent] at (54.5,.15) {B};
        \node at (59,.05) {C};
      \end{tikzpicture}
  opgave: |-
    Een populatie heeft $\mu = 50$ en $\sigma = 10$. De figuur toont de steekproevenverdeling van $\overline{X}$ voor ${n = 4}$, ${n = 25}$ en ${n = 100}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke kromme hoort bij welke $n$?
      antwoord: |-
        A: 100; B: 25; C: 4
      uitwerking: |-
        $\sigma(\overline{X}) = \frac{10}{\sqrt n}$ is 5, 2 en 1 voor $n = 4$, 25 en 100. Hoe groter $n$, hoe smaller de kromme: A hoort bij $n = 100$, B bij $n = 25$ en C bij $n = 4$.
    - opgave: |-
        Bereken voor elke $n$ de kans dat $\overline{X}$ tussen 48 en 52 ligt.
      antwoord: |-
        $\approx 0{,}311$; $0{,}683$; $0{,}954$
      uitwerking: |-
        $n = 4$: \texttt{normalcdf(48,52,50,5)} $\approx 0{,}311$. $n = 25$: \texttt{normalcdf(48,52,50,2)} $\approx 0{,}683$. $n = 100$: \texttt{normalcdf(48,52,50,1)} $\approx 0{,}954$.
    - opgave: |-
        Hoe groot moet $n$ minstens zijn opdat die kans minstens 0,99 is?
      antwoord: |-
        $n \geqslant 166$
      uitwerking: |-
        Er moet 99~\% binnen $\mu \pm 2$ liggen. Voor $N(0, 1)$ ligt 99~\% tussen $\pm 2{,}576$ (\texttt{invNorm(0.995,0,1)}). Dus $2 \geqslant 2{,}576 \cdot \frac{10}{\sqrt n}$, of $\sqrt n \geqslant 12{,}88$, en $n \geqslant 165{,}9$: minstens 166.

- id: h3-o7
  soort: opdracht
  niveau: 2
  thema: |-
    beslissingsregel
  opgave: |-
    Je gooit 20 keer met een munt om $H_0\colon p = 0{,}5$ te toetsen tegen $H_1\colon p > 0{,}5$ bij $\alpha = 0{,}05$. Vanaf hoeveel keer kop verwerp je $H_0$? Bereken daarvoor $P(X \geqslant k)$ voor enkele $k$.
  antwoord: |-
    vanaf 15
  uitwerking: |-
    Zoek de kleinste $k$ met $P(X \geqslant k) \leqslant 0{,}05$, met $X \sim B(20;\, 0{,}5)$. $P(X \geqslant 14) = 1 - {}$\texttt{binomcdf(20,0.5,13)} $\approx 0{,}058 > 0{,}05$ en $P(X \geqslant 15) \approx 0{,}021 \leqslant 0{,}05$. Je verwerpt $H_0$ vanaf 15 keer kop. De echte kans op een fout van de eerste soort is dan 0,021, kleiner dan $\alpha$.

- id: h3-o20
  soort: opdracht
  niveau: 2
  thema: |-
    fouten in context: een rookmelder
  opgave: |-
    Een rookmelder \textit{toetst} voortdurend $H_0$: er is geen brand. Hij geeft alarm als hij genoeg rook meet.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is een fout van de eerste soort? En van de tweede soort?
      antwoord: |-
        vals alarm; een brand missen
      uitwerking: |-
        Eerste soort: $H_0$ verwerpen terwijl ze waar is, dus alarm zonder brand (bijvoorbeeld door aangebrande toast). Tweede soort: $H_0$ niet verwerpen terwijl er brand is: geen alarm bij een echte brand.
    - opgave: |-
        Welke fout is hier het ergst? Stel je de melder dan gevoelig of ongevoelig af?
      antwoord: |-
        tweede soort; gevoelig
      uitwerking: |-
        Een brand missen is levensgevaarlijk, een vals alarm alleen vervelend. Je stelt de melder gevoelig af: dat is een grote $\alpha$, met meer valse alarmen maar minder gemiste branden.
    - opgave: |-
        Vergelijk met een rechtbank, waar $H_0$ is: de verdachte is onschuldig. Waarom kies je daar net een kleine $\alpha$?
      antwoord: |-
        een onschuldige veroordelen is erger
      uitwerking: |-
        Daar is de fout van de eerste soort, een onschuldige veroordelen, de ergste. Dus kies je een kleine $\alpha$: je verwerpt $H_0$ alleen bij zeer sterk bewijs. Welke $\alpha$ past, hangt af van de gevolgen van beide fouten.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    context: tweezijdig met een proportie
  opgave: |-
    In een land is 51,2~\% van de pasgeborenen een jongen. In een groot ziekenhuis waren de laatste 500 geboorten 230 jongens. Wijkt het aandeel jongens in dit ziekenhuis af? Toets tweezijdig bij $\alpha = 0{,}05$.
  antwoord: |-
    p-waarde $\approx 0{,}023$: verwerpen
  uitwerking: |-
    $H_0\colon p = 0{,}512$, $H_1\colon p \neq 0{,}512$. Onder $H_0$ is $X \sim B(500;\, 0{,}512)$, verwacht 256. Het resultaat ligt eronder: $P(X \leqslant 230) = {}$\texttt{binomcdf(500,0.512,230)} $\approx 0{,}011$. Tweezijdig: p-waarde $\approx 2 \cdot 0{,}011 = 0{,}023 \leqslant 0{,}05$. $H_0$ verwerpen. Let op: de 500 geboorten zijn geen aselecte steekproef, en wie veel ziekenhuizen toetst, vindt er altijd wel enkele met een significante afwijking.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    beslissingsregel voor een gemiddelde
  opgave: |-
    Een consumentenorganisatie toetst $H_0\colon \mu = 500$ tegen $H_1\colon \mu < 500$ voor de inhoud van flessen, met $\sigma = 2$~ml, $n = 25$ en $\alpha = 0{,}05$.
  lijst: enumerate
  delen:
    - opgave: |-
        Onder welke waarde van $\xbar$ verwerpt ze $H_0$?
      antwoord: |-
        $\xbar \leqslant 499{,}34$
      uitwerking: |-
        Onder $H_0$ is $\overline{X} \sim N(500;\, 0{,}4)$. Links van de grens moet 5~\% liggen: \texttt{invNorm(0.05,500,0.4)} $\approx 499{,}34$. Ze verwerpt $H_0$ als $\xbar \leqslant 499{,}34$~ml.
    - opgave: |-
        In werkelijkheid vult de machine gemiddeld 499~ml. Wat is de kans dat de organisatie dat niet ontdekt?
      antwoord: |-
        $\approx 0{,}20$
      uitwerking: |-
        Een fout van de tweede soort: $\xbar > 499{,}34$ terwijl $\overline{X} \sim N(499;\, 0{,}4)$. \texttt{normalcdf(499.34,1E99,499,0.4)} $\approx 0{,}20$.
    - opgave: |-
        Hoe kan de organisatie die kans verkleinen zonder $\alpha$ te veranderen?
      antwoord: |-
        meer flessen meten
      uitwerking: |-
        Met een grotere steekproef: dan wordt $\sigma(\overline{X})$ kleiner, de grens schuift dichter naar 500, en de verdelingen onder $\mu = 500$ en $\mu = 499$ overlappen minder.

- id: h3-o5
  soort: opdracht
  niveau: 2
  thema: |-
    exact en benaderd
  opgave: |-
    In een peiling bij 400 kiezers is 220 voor een kandidaat. Toets bij $\alpha = 0{,}05$ of meer dan de helft van alle kiezers voor is, eerst exact met de binomiale verdeling, dan met de normale benadering van $\hat{p}$.
  antwoord: |-
    $\approx 0{,}026$ en $\approx 0{,}023$: verwerpen
  uitwerking: |-
    $H_0\colon p = 0{,}5$, $H_1\colon p > 0{,}5$. Exact, met $X \sim B(400;\, 0{,}5)$: $P(X \geqslant 220) = 1 - {}$\texttt{binomcdf(400,0.5,219)} $\approx 0{,}026$. Benaderd: $\hat{p} = 0{,}55$ en $\sigma(\hat{p}) = \sqrt{\frac{0{,}25}{400}} = 0{,}025$, dus $z = \frac{0{,}55 - 0{,}5}{0{,}025} = 2$ en p-waarde $\approx 0{,}023$. Beide $\leqslant 0{,}05$: $H_0$ verwerpen. De benadering is iets te klein, omdat ze de staaf van 220 maar half meetelt.

- id: h3-o9
  soort: opdracht
  niveau: 3
  thema: |-
    steekproefgrootte kiezen
  opgave: |-
    Een onderzoeker wil een gemiddelde schatten in een populatie met $\sigma = 8$, zo dat de standaardafwijking van $\overline{X}$ hoogstens 1 is. Hoe groot moet de steekproef minstens zijn? Hoe groot voor hoogstens 0,5?
  antwoord: |-
    64; \ 256
  uitwerking: |-
    Los de ongelijkheid op naar $n$: $\frac{8}{\sqrt n} \leqslant 1 \iff \sqrt n \geqslant 8 \iff n \geqslant 64$. Voor 0,5: $\sqrt n \geqslant 16$, dus $n \geqslant 256$. De spreiding halveren kost vier keer zoveel waarnemingen, omdat $n$ onder een wortel staat.

- id: h3-o23
  soort: opdracht
  niveau: 3
  thema: |-
    significant of belangrijk?
  opgave: |-
    Een toets heeft scores met $\mu = 70$ en $\sigma = 8$. Een studieapp claimt beter te doen. Bij de gebruikers is het gemiddelde 70,3.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de p-waarde voor $H_1\colon \mu > 70$ als dat gemiddelde komt van 10\,000 gebruikers.
      antwoord: |-
        $\approx 0{,}0001$
      uitwerking: |-
        $\sigma(\overline{X}) = \frac{8}{100} = 0{,}08$, $z = \frac{0{,}3}{0{,}08} = 3{,}75$, p-waarde $= {}$\texttt{normalcdf(70.3,1E99,70,0.08)} $\approx 0{,}0001$: zeer significant.
    - opgave: |-
        En als het komt van 100 gebruikers?
      antwoord: |-
        $\approx 0{,}35$
      uitwerking: |-
        $\sigma(\overline{X}) = 0{,}8$, $z = 0{,}375$, p-waarde $\approx 0{,}35$: niet significant.
    - opgave: |-
        Is de app de moeite waard? Wat zegt een kleine p-waarde wel, en wat niet?
      antwoord: |-
        significant is niet hetzelfde als groot
      uitwerking: |-
        Een verschil van 0,3 punt op een toets met $\sigma = 8$ is in de praktijk verwaarloosbaar. Met een zeer grote steekproef wordt elk klein verschil significant. Een kleine p-waarde zegt dat het verschil waarschijnlijk niet door toeval komt, niet dat het groot of belangrijk is. Kijk dus ook naar de grootte van het verschil. (En zonder controlegroep zegt het ook niets over de app als oorzaak.)

- id: h3-o8
  soort: opdracht
  niveau: 3
  thema: |-
    veel toetsen
  opgave: |-
    Een onderzoeker toetst 20 verschillende voedingsmiddelen op een verband met hoofdpijn, telkens bij $\alpha = 0{,}05$. In werkelijkheid heeft geen enkel voedingsmiddel invloed, en de toetsen zijn onafhankelijk. Wat is de kans dat hij minstens één significant resultaat vindt? Wat leer je daaruit?
  antwoord: |-
    $\approx 0{,}64$
  uitwerking: |-
    Per toets is de kans op een (ten onrechte) significant resultaat 0,05, want elke $H_0$ is waar. Geen enkele significante: $0{,}95^{20} \approx 0{,}36$. Minstens één: $1 - 0{,}36 \approx 0{,}64$. Wie veel toetsen doet en alleen de significante rapporteert, vindt bijna zeker iets, ook als er niets is. Een gevonden verband moet je daarom in een nieuw onderzoek bevestigen.

- id: h3-o22
  soort: opdracht
  niveau: 3
  thema: |-
    de kans om een effect te ontdekken
  opgave: |-
    Een munt valt in werkelijkheid in 60~\% van de worpen op kop. Twee leerlingen toetsen $H_0\colon p = 0{,}5$ tegen $H_1\colon p > 0{,}5$ bij $\alpha = 0{,}05$. Anna gooit 20 keer, Bert 200 keer.
  lijst: enumerate
  delen:
    - opgave: |-
        Anna verwerpt $H_0$ vanaf 15 keer kop (zie opdracht \ref{oef:h3-o7}). Wat is de kans dat zij de oneerlijke munt ontdekt?
      antwoord: |-
        $\approx 0{,}126$
      uitwerking: |-
        Met $X \sim B(20;\, 0{,}6)$: $P(X \geqslant 15) = 1 - {}$\texttt{binomcdf(20,0.6,14)} $\approx 0{,}126$. Ze mist de afwijking dus in bijna 9 op 10 gevallen.
    - opgave: |-
        Bepaal vanaf hoeveel keer kop Bert $H_0$ verwerpt.
      antwoord: |-
        vanaf 113
      uitwerking: |-
        Zoek de kleinste $k$ met $P(X \geqslant k) \leqslant 0{,}05$ voor $X \sim B(200;\, 0{,}5)$. $P(X \geqslant 112) = 1 - {}$\texttt{binomcdf(200,0.5,111)} $\approx 0{,}0518$ en $P(X \geqslant 113) \approx 0{,}0384$. Bert verwerpt vanaf 113.
    - opgave: |-
        Wat is de kans dat Bert de oneerlijke munt ontdekt? Wat leer je hieruit?
      antwoord: |-
        $\approx 0{,}86$
      uitwerking: |-
        Met $X \sim B(200;\, 0{,}6)$: $P(X \geqslant 113) = 1 - {}$\texttt{binomcdf(200,0.6,112)} $\approx 0{,}86$. Een kleine steekproef heeft weinig kans om een echt effect te vinden: een niet-significant resultaat bij 20 worpen zegt dus bijna niets.

- id: h3-o24
  soort: opdracht
  niveau: 3
  thema: |-
    de richting kiezen na de data
  opgave: |-
    Een onderzoeker kijkt eerst naar zijn data en toetst daarna eenzijdig in de richting van zijn resultaat, telkens bij $\alpha = 0{,}05$. Neem een toets voor een gemiddelde, zodat $Z$ onder $H_0$ standaardnormaal is.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke waarden van $z$ verwerpt hij $H_0$?
      antwoord: |-
        $z \geqslant 1{,}645$ of $z \leqslant -1{,}645$
      uitwerking: |-
        Bij een positieve $z$ toetst hij rechtszijdig en verwerpt hij als $z \geqslant 1{,}645$ (\texttt{invNorm(0.95,0,1)}). Bij een negatieve $z$ toetst hij linkszijdig en verwerpt hij als $z \leqslant -1{,}645$.
    - opgave: |-
        Wat is zijn echte kans op een fout van de eerste soort?
      antwoord: |-
        $0{,}10$
      uitwerking: |-
        Als $H_0$ waar is: $P(Z \geqslant 1{,}645) + P(Z \leqslant -1{,}645) = 0{,}05 + 0{,}05 = 0{,}10$, het dubbele van wat hij beweert.
    - opgave: |-
        Hoe moet hij het doen?
      antwoord: |-
        $H_1$ vooraf kiezen, anders tweezijdig
      uitwerking: |-
        $H_1$ vastleggen voor hij de data ziet. Weet hij vooraf geen richting, dan toetst hij tweezijdig: hij verwerpt bij $|z| \geqslant 1{,}96$, en dan is de kans op een fout van de eerste soort echt 0,05.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h3-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: data
    onderwerp: Kansrekenen
  thema: |-
    hoeveel significante resultaten kloppen
  opgave: |-
    In een onderzoeksveld werkt maar 10~\% van de geteste behandelingen echt. Een toets bij $\alpha = 0{,}05$ ontdekt een werkzame behandeling met kans 0,8. Een toets is significant. Wat is de kans dat de behandeling toch niet werkt? Gebruik de wet van Bayes.
  antwoord: |-
    $0{,}36$
  uitwerking: |-
    $P(\text{significant}) = 0{,}9 \cdot 0{,}05 + 0{,}1 \cdot 0{,}8 = 0{,}125$. $P(\text{werkt niet} \gegeven \text{significant}) = \frac{0{,}045}{0{,}125} = 0{,}36$. Meer dan een derde van de significante resultaten is vals, veel meer dan $\alpha$. Herhalen van onderzoek is daarom belangrijk.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    toets voor een proportie
  opgave: |-
    Vroeger was een kwart van de bezoekers van een museum jonger dan 18. In een aselecte steekproef van 30 bezoekers zijn er 13 jonger dan 18. Toets bij $\alpha = 0{,}05$ of het aandeel jongeren gestegen is.
  antwoord: |-
    p-waarde $\approx 0{,}022$: verwerpen
  uitwerking: |-
    $H_0\colon p = 0{,}25$, $H_1\colon p > 0{,}25$. Onder $H_0$: $X \sim B(30;\, 0{,}25)$. p-waarde $= P(X \geqslant 13) \approx 0{,}022 \leqslant 0{,}05$: $H_0$ verwerpen.

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    toets voor een gemiddelde
  opgave: |-
    Een machine vult zakken met gemiddeld 250~g, $\sigma = 3$~g. In een steekproef van 16 zakken is het gemiddelde 251,5~g. Vult de machine te veel? Toets bij $\alpha = 0{,}05$.
  antwoord: |-
    p-waarde $\approx 0{,}023$: verwerpen
  uitwerking: |-
    $H_0\colon \mu = 250$, $H_1\colon \mu > 250$. $\sigma(\overline{X}) = \frac34 = 0{,}75$, $z = 2$. p-waarde $\approx 0{,}023 \leqslant 0{,}05$: $H_0$ verwerpen.

- id: h3-t3
  soort: test
  niveau: 2
  thema: |-
    tweezijdige toets
  opgave: |-
    Een munt landt 41 keer op kop bij 100 worpen. Toets tweezijdig bij $\alpha = 0{,}05$ of de munt oneerlijk is.
  antwoord: |-
    p-waarde $\approx 0{,}089$: niet verwerpen
  uitwerking: |-
    $H_0\colon p = 0{,}5$, $H_1\colon p \neq 0{,}5$. $P(X \leqslant 41) \approx 0{,}044$, dus p-waarde $\approx 0{,}089 > 0{,}05$: $H_0$ niet verwerpen.

- id: h3-t4
  soort: test
  niveau: 1
  thema: |-
    soorten fouten
  opgave: |-
    Een fabriek toetst of een lading onderdelen te veel defecte stukken bevat ($H_0$: de lading is in orde). Beschrijf een fout van de eerste en van de tweede soort in deze context.
  antwoord: |-
    eerste: een goede lading afkeuren; tweede: een slechte lading aanvaarden
  uitwerking: |-
    Eerste soort: $H_0$ verwerpen terwijl ze waar is: een goede lading ten onrechte afkeuren. Tweede soort: $H_0$ niet verwerpen terwijl ze niet waar is: een slechte lading aanvaarden.

- id: h3-t5
  soort: test
  niveau: 1
  thema: |-
    steekproevenverdeling van een gemiddelde
  opgave: |-
    Een populatie heeft $\mu = 100$ en $\sigma = 12$. Je neemt een aselecte steekproef van 36. Bereken $\sigma(\overline{X})$ en $P(\overline{X} \geqslant 104)$.
  antwoord: |-
    2; \ $\approx 0{,}023$
  uitwerking: |-
    $\sigma(\overline{X}) = \frac{12}{\sqrt{36}} = 2$. Dan is \texttt{normalcdf(104,1E99,100,2)} $\approx 0{,}023$: 104 ligt twee standaardafwijkingen boven 100.

- id: h3-t6
  soort: test
  niveau: 1
  thema: |-
    p-waarde en besluit
  opgave: |-
    Een toets met $H_0\colon p = 0{,}3$ en $H_1\colon p > 0{,}3$ geeft een p-waarde van 0,04. Wat besluit je bij $\alpha = 0{,}05$ en bij $\alpha = 0{,}01$? Wat betekent de p-waarde van 0,04?
  antwoord: |-
    verwerpen; niet verwerpen
  uitwerking: |-
    $0{,}04 \leqslant 0{,}05$: $H_0$ verwerpen. $0{,}04 > 0{,}01$: $H_0$ niet verwerpen. Als $p = 0{,}3$ echt klopt, is er een kans van 4~\% op een resultaat dat minstens zo groot is als het waargenomen.

- id: h3-t7
  soort: test
  niveau: 2
  thema: |-
    kans op een fout berekenen
  opgave: |-
    Je gooit 12 keer met een munt en verwerpt $H_0\colon p = 0{,}5$ ten voordele van $H_1\colon p > 0{,}5$ als er minstens 10 keer kop valt. Bereken de kans op een fout van de eerste soort, en op een fout van de tweede soort als in werkelijkheid $p = 0{,}8$.
  antwoord: |-
    $\approx 0{,}019$; \ $\approx 0{,}44$
  uitwerking: |-
    Eerste soort: $P(X \geqslant 10 \mid p = 0{,}5) = 1 - {}$\texttt{binomcdf(12,0.5,9)} $\approx 0{,}019$. Tweede soort: $P(X \leqslant 9 \mid p = 0{,}8) = {}$\texttt{binomcdf(12,0.8,9)} $\approx 0{,}44$.
