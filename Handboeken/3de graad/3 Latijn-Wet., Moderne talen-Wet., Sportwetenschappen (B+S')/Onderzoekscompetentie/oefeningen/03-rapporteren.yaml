# Oefeningen van hoofdstuk 3. Zie oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer} Rond af op een zinvolle nauwkeurigheid.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Een lengte, gemeten met een meetlat in mm: $12{,}3456$ cm.
      antwoord: |-
        $12{,}3$ cm
      uitwerking: |-
        Een meetlat met mm-verdeling geeft hoogstens $0{,}1$ cm nauwkeurig.
    - opgave: |-
        Het gemiddelde van $3$, $4$ en $4$ kinderen per gezin: $3{,}666\ldots$
      antwoord: |-
        $3{,}7$
      uitwerking: |-
        Eén decimaal volstaat; meer suggereert een precisie die er niet is.
    - opgave: |-
        Een kans berekend als $\frac{1}{6}$.
      antwoord: |-
        $\frac16$ of $0{,}167$
      uitwerking: |-
        Exact $\frac16$; als decimaal getal bijvoorbeeld $0{,}167$.
    - opgave: |-
        Een tijd van $2{,}0063$ s, gemeten met een chronometer in honderdsten.
      antwoord: |-
        $2{,}01$ s
      uitwerking: |-
        Op honderdsten: $2{,}01$ s.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Lees dit stukje uit een verslag: \textit{Ik heb alles gemeten en het klopte ongeveer. De formule is $x^2$. Dus het besluit is dat het werkt.}
  lijst: enumerate
  delen:
    - opgave: |-
        Welke informatie ontbreekt om te begrijpen wat er onderzocht is?
      antwoord: |-
        de vraag, wat gemeten werd, welke formule waarvoor
      uitwerking: |-
        Wat is de vraag? Wat werd gemeten, hoe en hoeveel keer? Wat stelt $x$ voor, en waarvoor is $x^2$ de formule? Wat betekent \textit{ongeveer} en \textit{het werkt}?
    - opgave: |-
        Herschrijf het in drie precieze zinnen, met een voorbeeld naar keuze.
      antwoord: |-
        open
      uitwerking: |-
        Bijvoorbeeld: \textit{We onderzochten hoe de remafstand $s$ (in m) van een fiets afhangt van de snelheid $v$ (in m/s). Bij tien metingen lagen de punten $(v^2, s)$ dicht bij een rechte door de oorsprong ($r = 0{,}97$). Dat ondersteunt het model $s = c\,v^2$, met $c \approx 0{,}08$ s$^2$/m.}

- id: h3-schrijven
  soort: kort
  opgave: |-
    Verbeter de zin.
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{De oppervlakte is 50 en dat is het grootst bij 5.}
      antwoord: |-
        met symbolen, eenheden en de veranderlijke
      uitwerking: |-
        \textit{De oppervlakte $A(x)$ is maximaal voor $x = 5$ m, en is dan $50$ m$^2$.}
    - opgave: |-
        \textit{Uit de grafiek zie je dat het altijd stijgt, dus dat is bewezen.}
      antwoord: |-
        een grafiek is geen bewijs
      uitwerking: |-
        Een grafiek toont maar een deel van het domein en is geen bewijs. Beter: \textit{De grafiek suggereert dat $f$ stijgt. Inderdaad is $f'(x) = 3x^2 + 1 > 0$ voor alle $x$.}

- id: h3-figuren
  soort: kort
  opgave: |-
    Een leerling maakt een grafiek van de temperatuur van thee in de tijd. Op de assen staat niets, en de punten zijn verbonden met rechte lijnstukken. Geef drie verbeteringen.
  antwoord: |-
    assen met naam en eenheid, een model in plaats van lijnstukken, een bijschrift
  uitwerking: |-
    Benoem de assen met eenheid (tijd in minuten, temperatuur in $^\circ$C). Teken de meetpunten als punten en eventueel een passend model, geen lijnstukken ertussen (die suggereren metingen die er niet zijn). Voeg een bijschrift toe dat zegt wat de figuur toont.

- id: h3-bronnen
  soort: kort
  opgave: |-
    Moet je in deze gevallen een bron vermelden?
  lijst: enumerate
  delen:
    - opgave: |-
        Je gebruikt de stelling van Pythagoras.
      antwoord: |-
        nee
      uitwerking: |-
        Nee: algemeen bekende leerstof hoef je niet te vermelden.
    - opgave: |-
        Je neemt de bevolkingscijfers van België over van een website.
      antwoord: |-
        ja
      uitwerking: |-
        Ja: organisatie, titel van de tabel, website en raadpleegdatum.
    - opgave: |-
        Een AI-hulpmiddel stelde de opbouw van je verslag voor.
      antwoord: |-
        ja, volgens de afspraken van de school
      uitwerking: |-
        Ja: vermeld welk hulpmiddel en waarvoor je het gebruikte, volgens de afspraken van de school.

- id: h3-besluit
  soort: kort
  opgave: |-
    Onderzoeksvraag: \textit{Hoe hangt de remafstand van een fiets af van de snelheid, tussen $10$ en $35$ km/h?} Is dit een goed besluit? Zeg waarom.
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{We hebben veel geleerd over remmen en over wiskunde.}
      antwoord: |-
        nee, geen antwoord op de vraag
      uitwerking: |-
        Nee: dit zegt niets over de remafstand. Het hoort hoogstens in de reflectie.
    - opgave: |-
        \textit{De remafstand stijgt als de snelheid stijgt.}
      antwoord: |-
        te vaag
      uitwerking: |-
        Juist, maar te vaag: de vraag is \textit{hoe} de remafstand afhangt van de snelheid. Dat wist je ook zonder onderzoek.
    - opgave: |-
        \textit{De remafstand $s$ (in m) is ongeveer evenredig met het kwadraat van de snelheid $v$ (in km/h): $s \approx 0{,}015\,v^2$ voor snelheden tussen $10$ en $35$ km/h.}
      antwoord: |-
        goed
      uitwerking: |-
        Goed: het beantwoordt de vraag precies, met gedefinieerde symbolen, eenheden en de grenzen van het model.
    - opgave: |-
        \textit{Bij $100$ km/h remt een fiets in $150$ m.}
      antwoord: |-
        nee, extrapolatie
      uitwerking: |-
        Nee: $100$ km/h ligt ver buiten de metingen (extrapolatie), en het beantwoordt de vraag niet. Een fiets haalt die snelheid trouwens nauwelijks.

- id: h3-afronden
  soort: kort
  opgave: |-
    Bereken, en schrijf het resultaat in een volzin, met een eenheid en een zinvolle nauwkeurigheid.
  lijst: enumerate
  delen:
    - opgave: |-
        Een slinger met lengte $L = 0{,}65$ m heeft een periode $T = 1{,}62$ s. Bereken $g = \frac{4\pi^2 L}{T^2}$.
      antwoord: |-
        $g \approx 9{,}8$ m/s$^2$
      uitwerking: |-
        $g = \frac{4\pi^2 \cdot 0{,}65}{1{,}62^2} \approx 9{,}778$. De lengte is maar op twee cijfers gegeven, dus: \textit{Uit $L = 0{,}65$ m en $T = 1{,}62$ s volgt $g \approx 9{,}8$ m/s$^2$.}
    - opgave: |-
        Een fietser legt $4{,}2$ km af in $13$ min $25$ s. Bereken zijn gemiddelde snelheid in km/h.
      antwoord: |-
        ongeveer $19$ km/h
      uitwerking: |-
        $13$ min $25$ s $= 805$ s $\approx 0{,}2236$ h. $v = \frac{4{,}2}{0{,}2236} \approx 18{,}78$ km/h. De afstand heeft twee cijfers: \textit{De gemiddelde snelheid is ongeveer $19$ km/h.}

- id: h3-bijschrift
  soort: kort
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.22cm,y=.032cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=5,ystep=10] (0,0) grid (25,100);
        \draw[grijs,->] (0,0) -- (26.5,0) node[right,text=black] {$t$ (min)};
        \draw[grijs,->] (0,0) -- (0,108) node[above,text=black] {$T$ ($^\circ$C)};
        \foreach \t in {5,10,15,20,25}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {20,40,60,80,100}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \draw[grijs,dashed] (0,20) -- (25,20);
        \draw[accent,thick] plot[domain=0:25,samples=40,smooth] (\x,{20+70*0.951^\x});
        \foreach \x/\y in {0/90,5/74.5,10/62.5,15/53.1,20/45.8}{\fill[accent] (\x,\y) circle (2pt);}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de temperatuur $T$ van een tas thee in een kamer van $20\,^\circ$C, met het model $T = 20 + 70 \cdot 0{,}951^t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Na hoeveel minuten is de thee volgens het model onder $60\,^\circ$C? Lees af en reken na.
      antwoord: |-
        na ongeveer $11$ minuten
      uitwerking: |-
        Aflezen: tussen $10$ en $15$ minuten, ongeveer $11$. Narekenen: $20 + 70 \cdot 0{,}951^t = 60$ geeft $0{,}951^t = \frac47$, dus $t = \frac{\ln(4/7)}{\ln 0{,}951} \approx 11{,}1$ minuten.
    - opgave: |-
        Schrijf een bijschrift bij de figuur.
      antwoord: |-
        open
      uitwerking: |-
        Bijvoorbeeld: \textit{Figuur 3: temperatuur van thee (in $^\circ$C) tegen de tijd (in min), gemeten om de vijf minuten, met het model $T = 20 + 70 \cdot 0{,}951^t$. De gestreepte lijn is de kamertemperatuur: het temperatuurverschil met de kamer neemt elke minuut met ongeveer $5$\,\% af.}

- id: h3-onderdelen
  soort: kort
  opgave: |-
    In welk onderdeel van een verslag hoort elke zin?
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{Bij een lengte van $0{,}60$ m maten we $15{,}5$ s voor tien periodes.}
      antwoord: |-
        resultaten
      uitwerking: |-
        Resultaten: een meting, met eenheden.
    - opgave: |-
        \textit{We gebruikten bij elke meting hetzelfde gewichtje van $50$ g.}
      antwoord: |-
        methode
      uitwerking: |-
        Methode: zo kan iemand anders het experiment herhalen.
    - opgave: |-
        \textit{Een volgende keer zouden we ook langere slingers meten, tot $2$ m.}
      antwoord: |-
        reflectie
      uitwerking: |-
        Reflectie: wat je anders zou doen.
    - opgave: |-
        \textit{We onderzoeken voor welke $n$ het getal $n^2 + n + 11$ een priemgetal is.}
      antwoord: |-
        inleiding
      uitwerking: |-
        Inleiding: de onderzoeksvraag.
    - opgave: |-
        \textit{Voor $n = 0, 1, \ldots, 9$ is $n^2 + n + 11$ priem, maar niet voor $n = 10$ en $n = 11$.}
      antwoord: |-
        besluit
      uitwerking: |-
        Besluit: een precies antwoord op de vraag. (Voor $n = 10$ is het $121 = 11^2$, voor $n = 11$ is het $143 = 11 \cdot 13$.)

- id: h3-beduidend
  soort: kort
  opgave: |-
    Elk getal is gemeten op de laatste decimaal. Hoeveel beduidende cijfers heeft het? Geef de absolute en de relatieve fout.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $0{,}0306$ kg
      antwoord: |-
        $3$; $0{,}00005$ kg; $0{,}16$\,\%
      uitwerking: |-
        Drie beduidende cijfers: $3$, $0$, $6$. Gemeten op $0{,}0001$ kg, dus $\Delta x = 0{,}00005$ kg, en $\frac{0{,}00005}{0{,}0306} \approx 0{,}0016 = 0{,}16$\,\%.
    - opgave: |-
        $12{,}50$ s
      antwoord: |-
        $4$; $0{,}005$ s; $0{,}04$\,\%
      uitwerking: |-
        Vier beduidende cijfers. $\Delta x = 0{,}005$ s, en $\frac{0{,}005}{12{,}50} = 0{,}0004 = 0{,}04$\,\%.
    - opgave: |-
        $3{,}0$ m
      antwoord: |-
        $2$; $0{,}05$ m; $1{,}7$\,\%
      uitwerking: |-
        Twee beduidende cijfers. $\Delta x = 0{,}05$ m, en $\frac{0{,}05}{3{,}0} \approx 0{,}017 = 1{,}7$\,\%.

- id: h3-fouten
  soort: kort
  opgave: |-
    Rekenen met gemeten getallen.
  lijst: enumerate
  delen:
    - opgave: |-
        Een fietstocht bestaat uit twee ritten: $12{,}5$ km (gemeten op $0{,}1$ km) en $3{,}27$ km (gemeten op $0{,}01$ km). Hoe lang is de tocht, en hoe groot kan de fout zijn? Hoe rapporteer je de lengte?
      antwoord: |-
        $15{,}77$ km, fout hoogstens $0{,}055$ km; $15{,}8$ km
      uitwerking: |-
        $12{,}5 + 3{,}27 = 15{,}77$ km. De absolute fouten tellen op: $0{,}05 + 0{,}005 = 0{,}055$ km. Rapporteer $15{,}8$ km: één decimaal, zoals de minst nauwkeurige rit.
    - opgave: |-
        Een rechthoek meet $4{,}0$ cm bij $3{,}5$ cm, beide gemeten op $0{,}1$ cm. Hoe groot is de relatieve fout van de oppervlakte? Hoe rapporteer je de oppervlakte?
      antwoord: |-
        ongeveer $2{,}7$\,\%; $14$ cm$^2$
      uitwerking: |-
        Relatieve fouten $\frac{0{,}05}{4{,}0} = 1{,}25$\,\% en $\frac{0{,}05}{3{,}5} \approx 1{,}43$\,\%: samen ongeveer $2{,}7$\,\%. $A = 14{,}0$ cm$^2$, met een fout van ongeveer $0{,}027 \cdot 14 \approx 0{,}4$ cm$^2$. Rapporteer $A \approx 14$ cm$^2$: twee beduidende cijfers, zoals de metingen.

- id: h3-tabel
  soort: kort
  opgave: |-
    Een leerling hangt gewichtjes aan een veer en meet de lengte van de veer, telkens op $1$ mm. Verbeter haar tabel.
    \figuren{\renewcommand{\arraystretch}{1.2}%
    \begin{tabular}{|c|c|c|c|}
    \hline
    massa & 50 g & 0,1 kg & 150 g \\ \hline
    lengte & 12 cm & 14,05 cm & 16,1 \\ \hline
    \end{tabular}}
  antwoord: |-
    kop $m$ (g) en $L$ (cm); $50$, $100$, $150$; $12{,}0$; $14{,}1$; $16{,}1$
  uitwerking: |-
    Zet de grootheden met hun eenheid in de kop: $m$ (g) en $L$ (cm). De massa's worden $50$, $100$ en $150$ g. De lengtes zijn op $1$ mm $= 0{,}1$ cm gemeten, dus allemaal met één decimaal: $12{,}0$; $14{,}1$; $16{,}1$ (ook $14{,}05$ kan niet nauwkeuriger zijn dan de meting). Zet er een nummer en een titel boven, bijvoorbeeld \textit{Tabel 2: lengte van de veer bij verschillende massa's.}

- id: h3-dia
  soort: kort
  opgave: |-
    Een leerling stelt haar onderzoek voor met een dia met als titel \textit{Resultaten}, twaalf regels tekst in kleine letters en een tabel met dertig getallen. Geef drie verbeteringen.
  antwoord: |-
    titel als boodschap; figuur in plaats van tekst; alleen de belangrijkste getallen
  uitwerking: |-
    Maak van de titel de boodschap, bijvoorbeeld \textit{De remafstand groeit met het kwadraat van de snelheid}. Vervang de tekst door een figuur die die boodschap toont. Toon alleen de paar getallen die het publiek moet onthouden; de volledige tabel hoort in het verslag. Gebruik ook grote letters.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    de juiste plaats
  opgave: |-
    In welk deel van het verslag hoort elk stuk tekst thuis?
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{We maten de periode telkens over tien slingeringen, en deelden door tien.}
      antwoord: |-
        methode
      uitwerking: |-
        Methode: het beschrijft hoe je mat, zodat iemand anders het kan herhalen.
    - opgave: |-
        \textit{Het model voorspelt goed tot een lengte van 1 m; voor langere slingers hebben we geen metingen.}
      antwoord: |-
        besluit
      uitwerking: |-
        Besluit: het zegt hoever het antwoord op de vraag geldt, de grenzen van het model.
    - opgave: |-
        \textit{De chronometer met de hand bedienen was de grootste bron van fouten; een sensor zou beter zijn.}
      antwoord: |-
        reflectie
      uitwerking: |-
        Reflectie: het kijkt terug op de werkwijze en zegt wat je anders zou doen.

- id: h3-o2
  soort: opdracht
  niveau: 2
  thema: |-
    een redenering opschrijven
  opgave: |-
    Schrijf de redenering voor het aantal diagonalen van een $n$-hoek (hoofdstuk 1) uit zoals in een verslag: met een definitie van de symbolen, in volzinnen, en met de formule in een zin.
  antwoord: |-
    open
  uitwerking: |-
    Bijvoorbeeld: \textit{Noem $d(n)$ het aantal diagonalen van een veelhoek met $n$ hoekpunten. Uit elk hoekpunt vertrekken $n - 3$ diagonalen, want het is niet verbonden met zichzelf en met zijn twee buren. Zo tellen we $n(n - 3)$ diagonalen, maar elke diagonaal twee keer, eens vanuit elk eindpunt. Dus is $d(n) = \frac{n(n - 3)}{2}$.}

- id: h3-o3
  soort: opdracht
  niveau: 2
  thema: |-
    nalezen
  opgave: |-
    Maak met de theorie en de werkwijze van dit hoofdstuk een checklist van minstens acht punten om een verslag na te lezen. Gebruik ze om het verslag van een klasgenoot na te lezen, en geef twee tips.
  antwoord: |-
    open
  uitwerking: |-
    Bijvoorbeeld: Is de vraag precies? Staan er deelvragen? Kan iemand de methode herhalen? Hebben alle figuren assen met eenheden en een bijschrift? Zijn alle symbolen gedefinieerd? Staan formules in zinnen? Is de nauwkeurigheid zinvol? Beantwoordt het besluit de vraag, met grenzen? Is er een reflectie? Zijn alle bronnen vermeld?

- id: h3-o4
  soort: opdracht
  niveau: 2
  thema: |-
    een presentatie
  opgave: |-
    Je hebt vijf minuten om je onderzoek voor te stellen. Welke drie dingen moet het publiek zeker onthouden? Ontwerp drie dia's, met per dia één boodschap en een figuur.
  antwoord: |-
    open
  uitwerking: |-
    Bijvoorbeeld: dia 1, de vraag (met een foto of schets van de situatie); dia 2, het belangrijkste resultaat (één figuur met het model); dia 3, het antwoord en één beperking. Details staan in het verslag, niet op de dia's.

- id: h3-o5
  soort: opdracht
  niveau: 3
  thema: |-
    reflecteren
  opgave: |-
    Schrijf een reflectie van een halve pagina over een onderzoek dat je deed (of over een opdracht uit deze cursus). Beantwoord: wat liep anders dan gepland, wat zou je anders doen, en welke nieuwe vraag kwam er op?
  antwoord: |-
    open
  uitwerking: |-
    Een goede reflectie is concreet (\textit{we maten te weinig punten boven 1 m} in plaats van \textit{we hadden beter moeten meten}) en eindigt met een vraag die een volgend onderzoek kan zijn.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    zinvolle nauwkeurigheid
  opgave: |-
    Bereken en rond af op een zinvolle nauwkeurigheid. Vuistregel: geef het resultaat met evenveel beduidende cijfers als de minst nauwkeurige meting.
  lijst: enumerate
  delen:
    - opgave: |-
        $g = \frac{4\pi^2 L}{T^2}$ met $L = 0{,}80$ m en $T = 1{,}79$ s.
      antwoord: |-
        $9{,}9$ m/s$^2$
      uitwerking: |-
        $\frac{4\pi^2 \cdot 0{,}80}{1{,}79^2} \approx 9{,}857$. $L$ heeft twee beduidende cijfers: $g \approx 9{,}9$ m/s$^2$.
    - opgave: |-
        De oppervlakte van een cirkel met straal $2{,}4$ cm.
      antwoord: |-
        $18$ cm$^2$
      uitwerking: |-
        $\pi \cdot 2{,}4^2 \approx 18{,}10$. Twee beduidende cijfers: $18$ cm$^2$. ($\pi$ is exact en telt niet mee.)
    - opgave: |-
        Het gemiddelde van de tijden $12{,}4$ s, $12{,}6$ s en $12{,}3$ s.
      antwoord: |-
        $12{,}4$ s
      uitwerking: |-
        $\frac{37{,}3}{3} \approx 12{,}433$. De tijden zijn op tienden gemeten: $12{,}4$ s.
    - opgave: |-
        De gemiddelde snelheid van een fietser die $12{,}5$ km rijdt in $0{,}62$ h.
      antwoord: |-
        $20$ km/h
      uitwerking: |-
        $\frac{12{,}5}{0{,}62} \approx 20{,}16$. De tijd heeft twee beduidende cijfers: $20$ km/h.
    - opgave: |-
        Het percentage leerlingen dat met de bus komt, als dat $7$ van de $23$ leerlingen zijn.
      antwoord: |-
        $30$\,\%
      uitwerking: |-
        $\frac{7}{23} \approx 0{,}3043$, dus $30{,}43$\,\%. Eén leerling is al ruim $4$\,\%: decimalen hebben geen zin. Schrijf $30$\,\%, of beter nog \textit{$7$ van de $23$}.
    - opgave: |-
        De omtrek van een cirkel met diameter $7{,}0$ cm.
      antwoord: |-
        $22$ cm
      uitwerking: |-
        $\pi \cdot 7{,}0 \approx 21{,}99$. Twee beduidende cijfers: $22$ cm.

- id: h3-o7
  soort: opdracht
  niveau: 1
  thema: |-
    eenheden in een model
  opgave: |-
    Geef de eenheid van elk getal in het model.
  lijst: enumerate
  delen:
    - opgave: |-
        $T^2 = 4{,}03\,L$, met $T$ in s en $L$ in m.
      antwoord: |-
        s$^2$/m
      uitwerking: |-
        $4{,}03 = \frac{T^2}{L}$, dus de eenheid is s$^2$/m.
    - opgave: |-
        $L = 0{,}042\,m + 12{,}0$, met $L$ in cm en $m$ in g.
      antwoord: |-
        $0{,}042$ cm/g; $12{,}0$ cm
      uitwerking: |-
        $0{,}042\,m$ moet in cm uitkomen, met $m$ in g: $0{,}042$ cm/g. Het getal $12{,}0$ wordt opgeteld bij een lengte: $12{,}0$ cm.
    - opgave: |-
        $\ln N = 4{,}6 - 0{,}22\,t$, met $N$ in mg en $t$ in uur.
      antwoord: |-
        $0{,}22$ per uur
      uitwerking: |-
        $0{,}22\,t$ heeft geen eenheid (een logaritme heeft er geen), dus $0{,}22$ is \textit{per uur}. (Het getal $4{,}6$ is de logaritme van de beginhoeveelheid in mg: $\e^{4{,}6} \approx 100$ mg.)
    - opgave: |-
        $s = 0{,}015\,v^2$, met $s$ in m en $v$ in km/h.
      antwoord: |-
        m/(km/h)$^2$
      uitwerking: |-
        $0{,}015 = \frac{s}{v^2}$: meter per (km/h)$^2$. Een vreemde eenheid, maar ze moet erbij: in m/s zou het getal anders zijn.

- id: h3-o8
  soort: opdracht
  niveau: 1
  thema: |-
    een voorstelling kiezen
  opgave: |-
    Kies voor je verslag een spreidingsdiagram, een grafiek in de tijd, een staafdiagram of een tabel. Zeg waarom.
  lijst: enumerate
  delen:
    - opgave: |-
        De lichaamslengte en de spanwijdte van de armen van $25$ leerlingen, om te zien of ze samenhangen.
      antwoord: |-
        spreidingsdiagram
      uitwerking: |-
        Een spreidingsdiagram: twee grootheden per leerling, en je zoekt een verband. Zet er eventueel de kleinste-kwadratenrechte bij.
    - opgave: |-
        De temperatuur in een lokaal, elke minuut gemeten door een sensor, een hele schooldag lang.
      antwoord: |-
        grafiek in de tijd
      uitwerking: |-
        Een grafiek in de tijd. Bij honderden metingen vlak na elkaar mag je de punten verbinden: tussen twee metingen verandert de temperatuur weinig. Bij enkele metingen ver uit elkaar teken je beter alleen punten.
    - opgave: |-
        Het aantal leerlingen in elke studierichting van de school.
      antwoord: |-
        staafdiagram
      uitwerking: |-
        Een staafdiagram: een aantal per categorie, zonder volgorde of verband tussen de categorieën.
    - opgave: |-
        De vijf metingen van $L$ en $T$ waarmee je $g$ berekent.
      antwoord: |-
        tabel
      uitwerking: |-
        Een tabel: de lezer moet de exacte waarden kunnen nagaan en narekenen. Een spreidingsdiagram mag erbij.

- id: h3-o9
  soort: opdracht
  niveau: 1
  thema: |-
    bronvermelding
  opgave: |-
    Wat ontbreekt er aan de bronvermelding?
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{www.statbel.fgov.be}
      antwoord: |-
        organisatie, titel, raadpleegdatum
      uitwerking: |-
        Alleen het waar staat er. Vermeld ook wie (Statbel, het Belgische statistiekbureau), wat (de titel van de tabel of pagina, met het volledige adres) en wanneer (de datum waarop je ze raadpleegde).
    - opgave: |-
        \textit{Een boek over fractalen, 2019.}
      antwoord: |-
        auteur, titel, uitgever
      uitwerking: |-
        Alleen het wanneer staat er. Vermeld de auteur, de titel van het boek en de uitgever, en eventueel de bladzijden die je gebruikte.
    - opgave: |-
        \textit{Wikipedia.}
      antwoord: |-
        titel, adres, raadpleegdatum
      uitwerking: |-
        Vermeld de titel van het artikel, de taalversie of het volledige adres, en de raadpleegdatum: een artikel op Wikipedia verandert voortdurend.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    een misleidende figuur
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=1cm,y=5cm,font=\scriptsize]
        \draw[black!14,very thin] (0,0) grid[ystep=.1] (2.4,.5);
        \fill[accent!60] (.4,0) rectangle (.9,.1);
        \fill[accent] (1.4,0) rectangle (1.9,.4);
        \draw[grijs] (0,.5) -- (0,0) -- (2.4,0);
        \foreach \t/\l in {0/7{,}0,.1/7{,}1,.2/7{,}2,.3/7{,}3,.4/7{,}4,.5/7{,}5}{\node[left,inner sep=1.5pt] at (0,\t) {$\l$};}
        \node[below] at (.65,0) {klas A};
        \node[below] at (1.65,0) {klas B};
        \node[above] at (1.2,.52) {gemiddelde score op 10};
      \end{tikzpicture}
  opgave: |-
    Een leerling toont met deze figuur dat klas B het veel beter deed dan klas A: gemiddeld $7{,}4$ tegen $7{,}1$ op $10$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel keer zo hoog is de balk van klas B?
      antwoord: |-
        $4$ keer
      uitwerking: |-
        De as begint bij $7{,}0$: de balken zijn $0{,}1$ en $0{,}4$ hoog. De balk van B is $4$ keer zo hoog.
    - opgave: |-
        Hoeveel procent hoger is de score van klas B echt?
      antwoord: |-
        ongeveer $4$\,\%
      uitwerking: |-
        $\frac{7{,}4 - 7{,}1}{7{,}1} = \frac{0{,}3}{7{,}1} \approx 0{,}042$: ongeveer $4$\,\% hoger, en geen $300$\,\%.
    - opgave: |-
        Hoe stel je het resultaat eerlijk voor?
      antwoord: |-
        as vanaf $0$, of de getallen zelf
      uitwerking: |-
        Laat de as bij $0$ beginnen (de scores gaan van $0$ tot $10$), zodat de balken bijna even hoog zijn. Of geef gewoon de twee getallen in een zin: voor twee waarden is een figuur overbodig. Vermeld ook hoeveel leerlingen er in elke klas zijn: met kleine klassen kan een verschil van $0{,}3$ toeval zijn.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    past het besluit bij de vraag?
  opgave: |-
    Beantwoordt het besluit de onderzoeksvraag? Zo niet, verbeter het.
  lijst: enumerate
  delen:
    - opgave: |-
        Vraag: \textit{Hoeveel diagonalen heeft een veelhoek met $n$ hoekpunten?} Besluit: \textit{We telden de diagonalen voor $n = 3$ tot $7$ en vonden een patroon.}
      antwoord: |-
        nee: de formule en het bewijs ontbreken
      uitwerking: |-
        Nee: het antwoord zelf ontbreekt, en een patroon is nog geen bewijs. Beter: \textit{Een veelhoek met $n$ hoekpunten heeft $\frac{n(n - 3)}{2}$ diagonalen. We vonden die formule door kleine gevallen te tellen en bewezen ze door te tellen hoeveel diagonalen er uit elk hoekpunt vertrekken.}
    - opgave: |-
        Vraag: \textit{Welke cilinder met een inhoud van $33$ cl heeft de kleinste oppervlakte?} Besluit: \textit{De cilinder met straal $3{,}7$ cm en hoogte $7{,}5$ cm: de hoogte is gelijk aan de diameter.}
      antwoord: |-
        ja
      uitwerking: |-
        Ja: precies, met eenheden en een zinvolle nauwkeurigheid. (Narekenen: $\pi r^2 h = 330$ met $h = 2r$ geeft $r = \sqrt[3]{\tfrac{330}{2\pi}} \approx 3{,}74$ cm.) Een mooie aanvulling: waarom zijn echte blikjes hoger en smaller?
    - opgave: |-
        Vraag: \textit{Hoe hangt de periode van een slinger af van zijn lengte?} Besluit: \textit{De periode hangt niet af van de massa van het gewicht.}
      antwoord: |-
        nee: antwoord op een andere vraag
      uitwerking: |-
        Nee: dat is het antwoord op een andere vraag. Beter: \textit{De periode $T$ (in s) is evenredig met de vierkantswortel van de lengte $L$ (in m): $T \approx 2{,}01\sqrt{L}$, voor lengtes van $0{,}2$ tot $1{,}0$ m.} Dat volgt uit $T^2 \approx 4{,}025\,L$ in het voorbeeld met de slinger in hoofdstuk~2. Het resultaat over de massa kan een extra vaststelling zijn.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    een methode beschrijven
  opgave: |-
    Dit zijn de notities van een leerling: \textit{touw + moer, 5 lengtes, chrono, 10x heen en terug, :10, lengte tot midden moer, kleine uitwijking.}
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf de methode in volzinnen, zodat een klasgenoot het experiment kan herhalen.
      antwoord: |-
        open
      uitwerking: |-
        Bijvoorbeeld: \textit{We maakten een slinger met een touw en een moer als gewicht. Voor vijf lengtes, van $0{,}2$ m tot $1{,}0$ m, maten we de lengte van het ophangpunt tot het midden van de moer. We lieten de slinger los met een kleine uitwijking, maten met een chronometer de tijd voor tien volledige slingeringen (heen en terug), en deelden die door tien.}
    - opgave: |-
        Welke informatie ontbreekt nog om het experiment echt te kunnen herhalen?
      antwoord: |-
        bv. welke lengtes, hoe groot de uitwijking, nauwkeurigheid, aantal herhalingen
      uitwerking: |-
        Welke lengtes precies; hoe groot de uitwijking (bijvoorbeeld hoogstens $10^\circ$); hoe nauwkeurig de meetlat en de chronometer zijn; of elke meting herhaald werd en hoe je de resultaten combineerde.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    een regressie rapporteren
  opgave: |-
    Je meet de dikte $d$ (in mm, gemeten op $1$ mm) van vijf boeken uit dezelfde reeks, met $p$ bladzijden: voor $p = 100, 200, 300, 400, 500$ is $d = 9, 15, 23, 29, 36$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de kleinste-kwadratenrechte en $r$.
      antwoord: |-
        $d = 0{,}068\,p + 2{,}0$; $r \approx 0{,}999$
      uitwerking: |-
        $\overline{p} = 300$, $\overline{d} = 22{,}4$. Afwijkingen $p$: $-200, -100, 0, 100, 200$; $d$: $-13{,}4$; $-7{,}4$; $0{,}6$; $6{,}6$; $13{,}6$. Som van de producten $6800$, $\sum(p_i - \overline{p})^2 = 100\,000$, $\sum(d_i - \overline{d})^2 = 463{,}2$. $a = 0{,}068$, $b = 22{,}4 - 0{,}068 \cdot 300 = 2{,}0$, $r = \frac{6800}{\sqrt{100\,000 \cdot 463{,}2}} \approx 0{,}999$.
    - opgave: |-
        Schrijf het resultaat in twee volzinnen, met eenheden en de betekenis van beide getallen.
      antwoord: |-
        open
      uitwerking: |-
        Bijvoorbeeld: \textit{De dikte $d$ (in mm) van een boek met $p$ bladzijden is goed te beschrijven met $d = 0{,}068\,p + 2{,}0$ ($r = 0{,}999$). Per $100$ bladzijden wordt een boek ongeveer $7$ mm dikker, dus is één blad (twee bladzijden) ongeveer $0{,}14$ mm dik; de $2$ mm is de dikte zonder bladzijden: de twee kaften samen.}
    - opgave: |-
        Schrijf een bijschrift bij het spreidingsdiagram.
      antwoord: |-
        open
      uitwerking: |-
        Bijvoorbeeld: \textit{Figuur 1: dikte (in mm) tegen het aantal bladzijden, voor vijf boeken uit dezelfde reeks, met de kleinste-kwadratenrechte $d = 0{,}068\,p + 2{,}0$. De punten liggen bijna op de rechte.}

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    getallen eerlijk rapporteren
  opgave: |-
    Waar zit de fout?
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{De gemiddelde lengte van de twaalf leerlingen, elk gemeten op $1$ cm, is $172{,}4583$ cm.}
      antwoord: |-
        te veel decimalen: $172$ cm (of $172{,}5$ cm)
      uitwerking: |-
        Metingen op $1$ cm laten geen vier decimalen toe. Schrijf $172$ cm, of hoogstens $172{,}5$ cm: een gemiddelde van veel metingen mag één cijfer meer hebben.
    - opgave: |-
        \textit{$95$\,\% van onze $7$ proefpersonen vond de test makkelijk.}
      antwoord: |-
        kan niet: $6$ van $7$ is $86$\,\%
      uitwerking: |-
        Met $7$ personen is elk percentage een veelvoud van $\frac17 \approx 14{,}3$\,\%: $6$ van de $7$ is $86$\,\%, $7$ van de $7$ is $100$\,\%. $95$\,\% kan niet. Schrijf bij zo'n kleine groep gewoon \textit{$6$ van de $7$ proefpersonen}.
    - opgave: |-
        \textit{De prijs stijgt met $3$\,\% per jaar, dus na $10$ jaar is ze $30$\,\% hoger.}
      antwoord: |-
        $1{,}03^{10} \approx 1{,}34$: $34$\,\% hoger
      uitwerking: |-
        De stijgingen stapelen: na $10$ jaar is de prijs $1{,}03^{10} \approx 1{,}344$ keer zo hoog, dus ongeveer $34$\,\% hoger.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    AI-hulpmiddelen eerlijk gebruiken
  opgave: |-
    Is dit gebruik van een AI-hulpmiddel eerlijk? Wat vermeld je, en wat moet je zelf nog doen? Volg ook de afspraken van je school.
  lijst: enumerate
  delen:
    - opgave: |-
        Je laat je tekst nalezen op spelfouten.
      antwoord: |-
        meestal wel; vermelden
      uitwerking: |-
        Meestal toegelaten: de inhoud blijft van jou. Vermeld welk hulpmiddel je waarvoor gebruikte, als de school dat vraagt.
    - opgave: |-
        Je laat het hulpmiddel de hele methode schrijven en neemt die over.
      antwoord: |-
        nee
      uitwerking: |-
        Niet eerlijk: het verslag moet je eigen werk tonen. Bovendien beschrijft zo'n tekst niet wat jij echt deed, en kan hij fouten bevatten die je niet opmerkt.
    - opgave: |-
        Het hulpmiddel geeft je een formule voor de remafstand, en die gebruik je.
      antwoord: |-
        nagaan in een betrouwbare bron, en beide vermelden
      uitwerking: |-
        Zo'n formule kan fout zijn. Zoek ze op in een betrouwbare bron (een handboek fysica, een officiële website) en vermeld die bron. Vermeld ook dat het hulpmiddel je op het idee bracht, en ga de formule na met je eigen metingen.

- id: h3-o16
  soort: opdracht
  niveau: 3
  thema: |-
    een verslag beoordelen
  opgave: |-
    Lees dit korte verslag. \textit{Inleiding: we onderzochten koffie. Methode: we maten de temperatuur. Resultaten: $T = 20 + 70 \cdot 0{,}95^t$ en $r = 0{,}99876543$ (zie de figuur, zonder assen). Besluit: na $2$ uur is de koffie $20{,}148$ graden. Dat bewijst dat koffie altijd afkoelt tot $20$ graden.}
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek minstens zes problemen.
      antwoord: |-
        bv. vage vraag, methode niet herhaalbaar, symbolen en eenheden, decimalen, figuur, extrapolatie, \textit{bewijst}
      uitwerking: |-
        (1) Er is geen precieze onderzoeksvraag. (2) De methode is niet herhaalbaar: hoe vaak, hoe lang, met welke thermometer, bij welke kamertemperatuur? (3) $T$ en $t$ zijn niet gedefinieerd, en er staan geen eenheden bij. (4) $r$ met acht decimalen suggereert een precisie die er niet is. (5) Een figuur zonder assen kan de lezer niet lezen. (6) De voorspelling na $2$ uur is wellicht een extrapolatie, als er maar enkele minuten gemeten is. (7) Een model past bij metingen, maar \textit{bewijst} niets, en \textit{altijd tot $20$ graden} geldt alleen in een kamer van $20\,^\circ$C. (8) Er is geen reflectie en geen bronvermelding.
    - opgave: |-
        Herschrijf het besluit.
      antwoord: |-
        open
      uitwerking: |-
        Bijvoorbeeld: \textit{In een kamer van $20\,^\circ$C daalt de temperatuur $T$ (in $^\circ$C) van koffie gedurende de eerste $25$ minuten volgens $T \approx 20 + 70 \cdot 0{,}95^t$, met $t$ in minuten: het verschil met de kamertemperatuur neemt elke minuut met ongeveer $5$\,\% af. Het model voorspelt dat de koffie de kamertemperatuur benadert; voor langere tijden hebben we dat niet gemeten.}

- id: h3-o17
  soort: opdracht
  niveau: 3
  thema: |-
    hoe nauwkeurig is het resultaat?
  opgave: |-
    Je meet een slinger met lengte $L = 1{,}000$ m en vindt een periode $T = 2{,}01$ s, met een fout van hoogstens $0{,}01$ s. Je berekent $g = \frac{4\pi^2 L}{T^2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $g$ voor $T = 2{,}00$ s, $2{,}01$ s en $2{,}02$ s.
      antwoord: |-
        $9{,}87$; $9{,}77$; $9{,}68$ m/s$^2$
      uitwerking: |-
        $\frac{4\pi^2}{2{,}00^2} \approx 9{,}87$, $\frac{4\pi^2}{2{,}01^2} \approx 9{,}77$, $\frac{4\pi^2}{2{,}02^2} \approx 9{,}68$ (in m/s$^2$).
    - opgave: |-
        Hoeveel cijfers van $g$ zijn betrouwbaar? Hoe rapporteer je het resultaat?
      antwoord: |-
        $g = 9{,}8 \pm 0{,}1$ m/s$^2$
      uitwerking: |-
        Een fout van $0{,}01$ s op $T$ geeft een verschil van ongeveer $0{,}1$ m/s$^2$ op $g$: ongeveer $1$\,\%, twee keer de relatieve fout op $T$ (want $T$ staat in het kwadraat). Zelfs de eerste decimaal kan dus één eenheid verschillen, en meer decimalen hebben geen zin: \textit{$g = 9{,}8 \pm 0{,}1$ m/s$^2$}.
    - opgave: |-
        Hoe meet je $g$ nauwkeuriger, met dezelfde chronometer?
      antwoord: |-
        meet de tijd voor bv. $10$ slingeringen
      uitwerking: |-
        Meet de tijd voor $10$ slingeringen en deel door $10$. De fout van de chronometer (de reactietijd) blijft ongeveer even groot, maar wordt over tien periodes verdeeld: de fout op $T$ wordt ongeveer $0{,}001$ s, en die op $g$ ongeveer $0{,}01$ m/s$^2$. Herhaal de meting ook enkele keren en neem het gemiddelde.

- id: h3-o18
  soort: opdracht
  niveau: 3
  thema: |-
    een logaritmische schaal
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.55cm,y=1.6cm,font=\scriptsize]
        \foreach \k in {0,1}{\foreach \m in {2,...,9}{\draw[black!14,very thin] (0,{\k+log10(\m)}) -- (7,{\k+log10(\m)});}}
        \foreach \k in {0,1,2}{\draw[black!30,thin] (0,\k) -- (7,\k);}
        \draw[grijs,->] (0,0) -- (7.4,0) node[right,text=black] {$t$};
        \draw[grijs,->] (0,0) -- (0,2.25) node[above,text=black] {$N$};
        \foreach \t in {1,...,6}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \node[left,inner sep=1.5pt] at (0,0) {$1000$};
        \node[left,inner sep=1.5pt] at (0,1) {$10\,000$};
        \node[left,inner sep=1.5pt] at (0,2) {$100\,000$};
        \foreach \x/\y in {1/.0792,2/.3222,3/.5441,4/.7853,5/1.0128,6/1.2504}{\fill[accent] (\x,\y) circle (2pt);}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de gegevens van het filmpje uit opdracht~\ref{oef:h2-o14} van hoofdstuk~2, met een \textit{logaritmische} verticale as: tussen $1000$ en $10\,000$ is even veel plaats als tussen $10\,000$ en $100\,000$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom liggen de punten op deze as ongeveer op een rechte?
      antwoord: |-
        de as toont $\log N$, en $\log N$ is lineair in $t$
      uitwerking: |-
        De hoogte van een punt is evenredig met $\log N$ (vanaf $\log 1000 = 3$). Bij exponentiële groei $N = N_0 \cdot g^t$ is $\log N = \log N_0 + t\log g$ lineair in $t$: de punten liggen op een rechte.
    - opgave: |-
        Na hoeveel dagen wordt $N$ telkens tien keer zo groot? Lees af en reken na met $g \approx 1{,}71$.
      antwoord: |-
        ongeveer $4{,}3$ dagen
      uitwerking: |-
        Aflezen: van ongeveer $1200$ op dag $1$ tot $12\,000$ iets na dag $5$: ongeveer $4$ dagen. Narekenen: $1{,}71^t = 10$ geeft $t = \frac{\ln 10}{\ln 1{,}71} \approx 4{,}3$ dagen.
    - opgave: |-
        Wanneer kies je in een verslag zo'n as? En wat moet er dan in het bijschrift staan?
      antwoord: |-
        bij groei over meerdere grootteordes; vermeld de logaritmische schaal
      uitwerking: |-
        Als de waarden over meerdere grootteordes lopen, of om exponentiële groei te herkennen: op een gewone as zouden de eerste punten tegen de as plakken. Zeg in het bijschrift uitdrukkelijk dat de verticale as logaritmisch is, want een rechte op zo'n as betekent iets anders (vaste groeifactor) dan een rechte op een gewone as (vaste toename).

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: Statistiek
  thema: |-
    een resultaat met onzekerheid
  opgave: |-
    Tien metingen van $g$ geven een gemiddelde van $9{,}78$ m/s$^2$ met standaardafwijking $0{,}12$ m/s$^2$. Hoe rapporteer je dat eerlijk? Tip: de standaardafwijking van het gemiddelde is $\frac{s}{\sqrt n}$.
  antwoord: |-
    $g \approx 9{,}78 \pm 0{,}04$ m/s$^2$
  uitwerking: |-
    $\frac{0{,}12}{\sqrt{10}} \approx 0{,}04$: \textit{$g = 9{,}78 \pm 0{,}04$ m/s$^2$ (gemiddelde van tien metingen, met de standaardafwijking van het gemiddelde)}. Een 95\,\%-betrouwbaarheidsinterval is ongeveer twee keer zo breed (zie Statistiek).

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    precies schrijven
  opgave: |-
    Verbeter: \textit{v = 13,888888 dus hij reed te snel.} (Gegeven: iemand reed 50 km in 1 uur; de toegelaten snelheid is 50 km/h.)
  antwoord: |-
    $v = 50$ km/h $\approx 13{,}9$ m/s, niet te snel
  uitwerking: |-
    \textit{De gemiddelde snelheid is $v = \frac{50 \text{ km}}{1 \text{ h}} = 50$ km/h $\approx 13{,}9$ m/s.} Dat is niet meer dan de toegelaten $50$ km/h. Het oorspronkelijke besluit klopte niet, het getal had geen eenheid, en te veel decimalen.

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    een figuur
  opgave: |-
    Noem drie dingen die een goede figuur in een verslag zeker heeft.
  antwoord: |-
    assen met naam en eenheid, duidelijke schaal, bijschrift
  uitwerking: |-
    Assen met een naam en een eenheid, een duidelijke schaal, en een bijschrift dat zegt wat je moet zien.

- id: h3-t3
  soort: test
  niveau: 1
  thema: |-
    bronnen
  opgave: |-
    Wat vermeld je minstens bij een website als bron?
  antwoord: |-
    wie, wat, waar, wanneer
  uitwerking: |-
    De auteur of organisatie, de titel, het webadres, en de datum waarop je de pagina raadpleegde.

- id: h3-t4
  soort: test
  niveau: 1
  thema: |-
    een besluit
  opgave: |-
    Onderzoeksvraag: \textit{Hoeveel rechthoeken (van elke grootte) staan er op een schaakbord?} Besluit: \textit{Er staan heel veel rechthoeken op een schaakbord, veel meer dan vierkanten.} Is dat een goed besluit? Verbeter het.
  antwoord: |-
    nee, het getal ontbreekt: $\binom92^2 = 1296$
  uitwerking: |-
    Nee: \textit{heel veel} is geen antwoord op \textit{hoeveel}. Beter: \textit{Op een schaakbord staan $1296$ rechthoeken. Een rechthoek ligt vast door twee van de negen verticale en twee van de negen horizontale lijnen, dus er zijn $\binom92 \cdot \binom92 = 36 \cdot 36 = 1296$.}

- id: h3-t5
  soort: test
  niveau: 1
  thema: |-
    nauwkeurigheid en eenheden
  opgave: |-
    Een leerling meet een rechthoekig perceel van $12{,}4$ m bij $18{,}7$ m, en schrijft: \textit{A = 231,88}. Verbeter de zin.
  antwoord: |-
    $A = 12{,}4 \text{ m} \cdot 18{,}7 \text{ m} \approx 232$ m$^2$
  uitwerking: |-
    \textit{De oppervlakte van het perceel is $A = 12{,}4 \text{ m} \cdot 18{,}7 \text{ m} \approx 232$ m$^2$.} Het symbool is uitgelegd, er staat een eenheid bij, en drie beduidende cijfers zoals de metingen.
