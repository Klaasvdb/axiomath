- id: h4-t1
  soort: test
  niveau: 1
  thema: |-
    extrema
  opgave: |-
    Bepaal het verloop en de extrema van $f(x) = x^3 - 12x$.
  antwoord: |-
    max. $f(-2) = 16$, min. $f(2) = -16$
  uitwerking: |-
    $f'(x) = 3(x - 2)(x + 2)$: $+$, $0$, $-$, $0$, $+$. Maximum $f(-2) = 16$, minimum $f(2) = -16$.

- id: h4-t2
  soort: test
  niveau: 1
  thema: |-
    extrema met e
  opgave: |-
    Bepaal de extrema van $f(x) = x\,\e^x$.
  antwoord: |-
    min. $f(-1) = -\frac1\e$
  uitwerking: |-
    $f'(x) = (1 + x)\e^x$: negatief voor $x < -1$, positief erna. Minimum $f(-1) = -\frac1\e$.

- id: h4-t3
  soort: test
  niveau: 2
  thema: |-
    buigpunt
  opgave: |-
    Bepaal de holheid en het buigpunt van $f(x) = x^3 + 3x^2 - 1$.
  antwoord: |-
    bol voor $x < -1$, hol voor $x > -1$; buigpunt $(-1, 1)$
  uitwerking: |-
    $f''(x) = 6x + 6$: negatief voor $x < -1$, positief erna. Buigpunt $(-1, f(-1)) = (-1, 1)$.

- id: h4-t4
  soort: test
  niveau: 2
  thema: |-
    optimaliseren
  opgave: |-
    Een tuin is een rechthoek met oppervlakte $50$ m$^2$, aan één kant tegen een muur. Op de drie andere zijden komt een haag. Welke afmetingen geven de kortste haag?
  antwoord: |-
    $5$ m loodrecht op de muur, $10$ m langs de muur
  uitwerking: |-
    Zijde $x$ loodrecht op de muur, langs de muur $\frac{50}{x}$. Haag $L(x) = 2x + \frac{50}{x}$, $L'(x) = 2 - \frac{50}{x^2} = 0$ voor $x = 5$, en $L'$ wisselt van $-$ naar $+$. Dus $5$ m en $10$ m, haag $20$ m.

- id: h4-t5
  soort: test
  niveau: 1
  thema: |-
    grafiek van f' lezen
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.45cm,font=\scriptsize]
        \rooster{-2}{1}{4}{-3}{1}{3}
        \kromme{-2}{4}{-(\x+1)*(\x-3)/2}
        \node[accent,above] at (1,2.1) {$f'$};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van de \textit{afgeleide} $f'$ van een functie $f$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar stijgt $f$, en waar daalt $f$?
      antwoord: |-
        stijgt op $[-1, 3]$, daalt voor $x < -1$ en $x > 3$
      uitwerking: |-
        $f' > 0$ tussen $-1$ en $3$: daar stijgt $f$. Daarbuiten is $f' < 0$: daar daalt $f$.
    - opgave: |-
        Geef de $x$-waarden van de extrema van $f$, en zeg of het een maximum of een minimum is.
      antwoord: |-
        min. in $x = -1$, max. in $x = 3$
      uitwerking: |-
        In $-1$ wisselt $f'$ van $-$ naar $+$: minimum. In $3$ van $+$ naar $-$: maximum.
    - opgave: |-
        Waar heeft de grafiek van $f$ een buigpunt?
      antwoord: |-
        in $x = 1$
      uitwerking: |-
        $f'$ stijgt tot $x = 1$ en daalt erna, dus $f''$ wisselt daar van $+$ naar $-$: buigpunt in $x = 1$.

- id: h4-t6
  soort: test
  niveau: 2
  thema: |-
    nulwaarde van f' zonder extremum
  opgave: |-
    Bepaal het verloop en de extrema van $f(x) = x^4 + 4x^3$.
  antwoord: |-
    min. $f(-3) = -27$; in $0$ geen extremum
  uitwerking: |-
    $f'(x) = 4x^3 + 12x^2 = 4x^2(x + 3)$. Tekentabel van $f'$: $-$, $0$, $+$, $0$, $+$ (nulwaarden $-3$ en $0$). $f$ daalt voor $x < -3$ en stijgt voor $x > -3$. Minimum $f(-3) = 81 - 108 = -27$. In $0$ is $f'$ nul zonder tekenwissel: geen extremum, wel een horizontale raaklijn.

- id: h4-t7
  soort: test
  niveau: 2
  thema: |-
    grootste en kleinste waarde op een interval
  opgave: |-
    Bepaal de grootste en de kleinste waarde van $f(x) = x^3 - 3x^2$ op $[-1, 4]$.
  antwoord: |-
    grootste $f(4) = 16$, kleinste $f(-1) = f(2) = -4$
  uitwerking: |-
    $f'(x) = 3x^2 - 6x = 3x(x - 2)$, met nulwaarden $0$ en $2$ in het interval. Vergelijk de kandidaten: $f(-1) = -1 - 3 = -4$, $f(0) = 0$, $f(2) = 8 - 12 = -4$ en $f(4) = 64 - 48 = 16$. De grootste waarde is $16$, op de rand. De kleinste is $-4$, zowel op de rand in $-1$ als in het minimum in $2$.
