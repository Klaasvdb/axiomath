# Oefeningen van hoofdstuk 4. Zie oefeningenbank.py voor de velden.

- id: h4-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Leid af: $x^3 - 6x^2 + 9x$.
      antwoord: |-
        $3x^2 - 12x + 9$
      uitwerking: |-
        $3x^2 - 12x + 9 = 3(x - 1)(x - 3)$.
    - opgave: |-
        Stel de tekentabel op van \mbox{$3(x - 1)(x - 3)$}.
      antwoord: |-
        $+$, $0$, $-$, $0$, $+$
      uitwerking: |-
        Positief buiten $[1, 3]$, negatief ertussen.
    - opgave: |-
        Een rechthoek heeft omtrek 20. Druk de oppervlakte uit met één zijde $x$.
      antwoord: |-
        $x(10 - x)$
      uitwerking: |-
        De andere zijde is $10 - x$.
    - opgave: |-
        Waar ligt de top van de parabool $y = x(10 - x)$?
      antwoord: |-
        $(5, 25)$
      uitwerking: |-
        Midden tussen de nulwaarden $0$ en $10$.

- id: h4-verken
  soort: start
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.45cm,font=\scriptsize]
        \rooster{-1}{1}{4}{-1}{1}{5}
        \kromme{-.4}{4.3}{(\x)^3-6*(\x)^2+9*\x}
        \draw[accent,dashed] (0,4) -- (2,4);
        \draw[accent,dashed] (2,0) -- (4,0);
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken} De figuur toont de grafiek van $f(x) = x^3 - 6x^2 + 9x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af waar $f$ een top en een dal heeft. Hoe ziet de raaklijn er daar uit?
      antwoord: |-
        top $(1, 4)$, dal $(3, 0)$; horizontaal
      uitwerking: |-
        Top in $(1, 4)$, dal in $(3, 0)$. De raaklijn is daar horizontaal.
    - opgave: |-
        Vergelijk met de nulwaarden van $f'$ uit de opwarmer. Wat valt op?
      antwoord: |-
        dezelfde $x$-waarden
      uitwerking: |-
        $f'(x) = 0$ voor $x = 1$ en $x = 3$: precies de top en het dal.
    - opgave: |-
        Waar stijgt $f$? Vergelijk met het teken van $f'$.
      antwoord: |-
        waar $f' > 0$
      uitwerking: |-
        $f$ stijgt voor $x < 1$ en $x > 3$, waar $f'$ positief is.

- id: h4-extrema
  soort: kort
  opgave: |-
    Bepaal het verloop en de extrema.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = 2x^3 - 9x^2 + 12x$
      antwoord: |-
        max. $f(1) = 5$, min. $f(2) = 4$
      uitwerking: |-
        $f'(x) = 6x^2 - 18x + 12 = 6(x - 1)(x - 2)$: $+$, $0$, $-$, $0$, $+$. Maximum $f(1) = 5$, minimum $f(2) = 4$.
    - opgave: |-
        $g(x) = \dfrac{x^2 + 1}{x}$
      antwoord: |-
        max. $g(-1) = -2$, min. $g(1) = 2$
      uitwerking: |-
        $g'(x) = 1 - \frac{1}{x^2} = \frac{(x - 1)(x + 1)}{x^2}$: $+$, $0$, $-$, $|$, $-$, $0$, $+$. Maximum $g(-1) = -2$, minimum $g(1) = 2$.

- id: h4-buigpunt
  soort: kort
  opgave: |-
    Bepaal de holheid en de buigpunten van $f(x) = x^3 - 6x^2 + 9x + 1$.
  antwoord: |-
    bol voor $x < 2$, hol voor $x > 2$; buigpunt $(2, 3)$
  uitwerking: |-
    $f''(x) = 6x - 12$: negatief voor $x < 2$ (bol), positief voor $x > 2$ (hol). Buigpunt $(2, f(2)) = (2, 3)$.

- id: h4-optimaal
  soort: kort
  opgave: |-
    Van alle rechthoeken met omtrek $40$ cm: welke heeft de grootste oppervlakte? En van alle rechthoeken met oppervlakte $36$ cm$^2$: welke heeft de kleinste omtrek?
  antwoord: |-
    het vierkant met zijde $10$; het vierkant met zijde $6$
  uitwerking: |-
    $A(x) = x(20 - x)$, $A'(x) = 20 - 2x = 0$ voor $x = 10$: een vierkant. $O(x) = 2x + \frac{72}{x}$, $O'(x) = 2 - \frac{72}{x^2} = 0$ voor $x = 6$, en $O'$ wisselt van $-$ naar $+$: een vierkant met zijde 6.

- id: h4-tekentabel
  soort: kort
  opgave: |-
    Bepaal het verloop en de extrema.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = -x^3 + 3x^2 + 9x$
      antwoord: |-
        min. $f(-1) = -5$, max. $f(3) = 27$
      uitwerking: |-
        $f'(x) = -3x^2 + 6x + 9 = -3(x + 1)(x - 3)$. Tekentabel van $f'$: $-$, $0$, $+$, $0$, $-$. Dus $f$ daalt voor $x < -1$, stijgt op $\left]-1, 3\right[$ en daalt voor $x > 3$. Minimum $f(-1) = 1 + 3 - 9 = -5$, maximum $f(3) = -27 + 27 + 27 = 27$.
    - opgave: |-
        $f(x) = x^3 + 3x^2 + 3x$
      antwoord: |-
        overal stijgend, geen extrema
      uitwerking: |-
        $f'(x) = 3x^2 + 6x + 3 = 3(x + 1)^2$. Tekentabel van $f'$: $+$, $0$, $+$. De afgeleide is nul in $-1$, maar wisselt niet van teken: $f$ stijgt overal en heeft geen extremum. In $(-1, -1)$ is de raaklijn horizontaal.
    - opgave: |-
        $f(x) = 3x^4 + 4x^3$
      antwoord: |-
        min. $f(-1) = -1$; in $0$ geen extremum
      uitwerking: |-
        $f'(x) = 12x^3 + 12x^2 = 12x^2(x + 1)$. Tekentabel van $f'$: $-$, $0$, $+$, $0$, $+$ (met nulwaarden $-1$ en $0$). Minimum $f(-1) = 3 - 4 = -1$. In $0$ is $f'$ nul zonder tekenwissel ($x^2 \geqslant 0$): geen extremum.

- id: h4-extremaexp
  soort: kort
  opgave: |-
    Bepaal de extrema.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = x^2\,\e^x$
      antwoord: |-
        max. $f(-2) = \frac{4}{\e^2} \approx 0{,}54$, min. $f(0) = 0$
      uitwerking: |-
        Productregel: $f'(x) = 2x\,\e^x + x^2\,\e^x = x(x + 2)\,\e^x$. Omdat $\e^x > 0$, hangt het teken af van $x(x + 2)$: $+$, $0$, $-$, $0$, $+$. Maximum $f(-2) = 4\e^{-2} \approx 0{,}54$, minimum $f(0) = 0$.
    - opgave: |-
        $f(x) = x - \ln x$
      antwoord: |-
        min. $f(1) = 1$
      uitwerking: |-
        Domein $\left]0, +\infty\right[$. $f'(x) = 1 - \frac1x = \frac{x - 1}{x}$, met $x > 0$: negatief voor $x < 1$, positief voor $x > 1$. Minimum $f(1) = 1 - 0 = 1$.
    - opgave: |-
        $f(x) = \dfrac{\e^x}{x}$
      antwoord: |-
        min. $f(1) = \e$
      uitwerking: |-
        Domein $\R \setminus \{0\}$. Quotiëntregel: $f'(x) = \frac{\e^x \cdot x - \e^x}{x^2} = \frac{(x - 1)\e^x}{x^2}$. Tekentabel: $-$ voor $x < 0$, $|$ in $0$, $-$ op $\left]0, 1\right[$, $0$ in $1$, $+$ erna. Minimum $f(1) = \e$. Links van $0$ daalt $f$ alleen: daar is geen extremum.

- id: h4-holbol
  soort: kort
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.6cm,font=\scriptsize]
        \rooster{-3}{1}{3}{-1}{1}{3}
        \kromme{-2.55}{2.55}{(\x)^4/4-1.5*(\x)^2+2}
        \vol{(-1,.75)} \vol{(1,.75)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f(x) = \frac14 x^4 - \frac32 x^2 + 2$. De twee punten zijn de buigpunten.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af waar de grafiek hol en waar ze bol is.
      antwoord: |-
        hol voor $x < -1$ en $x > 1$, bol op $\left]-1, 1\right[$
      uitwerking: |-
        Links van $-1$ en rechts van $1$ buigt de grafiek naar boven ($\cup$): hol. Tussen $-1$ en $1$ buigt ze naar onder ($\cap$): bol.
    - opgave: |-
        Controleer met $f''$, en bereken de buigpunten.
      antwoord: |-
        $f''(x) = 3(x - 1)(x + 1)$; buigpunten $\bigl(\pm 1, \frac34\bigr)$
      uitwerking: |-
        $f'(x) = x^3 - 3x$ en $f''(x) = 3x^2 - 3 = 3(x - 1)(x + 1)$. Tekentabel van $f''$: $+$, $0$, $-$, $0$, $+$. Dat klopt met de figuur. De buigpunten zijn $(-1, f(-1))$ en $(1, f(1))$, met $f(\pm 1) = \frac14 - \frac32 + 2 = \frac34$.
    - opgave: |-
        In welk buigpunt stijgt de grafiek, en in welk daalt ze?
      antwoord: |-
        stijgt in $x = -1$, daalt in $x = 1$
      uitwerking: |-
        $f'(-1) = -1 + 3 = 2 > 0$: daar stijgt de grafiek. $f'(1) = 1 - 3 = -2 < 0$: daar daalt ze.

- id: h4-buigpunt2
  soort: kort
  opgave: |-
    Bepaal de extrema, de holheid en de buigpunten.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = x^4 - 4x^3 + 4x^2$
      antwoord: |-
        min. $f(0) = f(2) = 0$, max. $f(1) = 1$; buigpunten $\bigl(1 \pm \frac{\sqrt3}{3}, \frac49\bigr)$
      uitwerking: |-
        $f'(x) = 4x^3 - 12x^2 + 8x = 4x(x - 1)(x - 2)$: $-$, $0$, $+$, $0$, $-$, $0$, $+$. Minima $f(0) = 0$ en $f(2) = 0$, maximum $f(1) = 1$.
        $f''(x) = 12x^2 - 24x + 8 = 4(3x^2 - 6x + 2)$, met nulwaarden $x = 1 \pm \frac{\sqrt3}{3}$ (ongeveer $0{,}42$ en $1{,}58$). Tekentabel van $f''$: $+$, $0$, $-$, $0$, $+$: hol buiten die twee punten, bol ertussen. Omdat $f(x) = x^2(x - 2)^2 = \bigl((x - 1)^2 - 1\bigr)^2$, is $f\bigl(1 \pm \frac{\sqrt3}{3}\bigr) = \bigl(\frac13 - 1\bigr)^2 = \frac49$. Buigpunten $\bigl(1 \pm \frac{\sqrt3}{3}, \frac49\bigr)$.
    - opgave: |-
        $f(x) = x\,\e^{-x}$ (de functie uit voorbeeld~\ref{vb:h4-extrema2})
      antwoord: |-
        max. $f(1) = \frac1\e$; bol voor $x < 2$, hol voor $x > 2$; buigpunt $\bigl(2, \frac{2}{\e^2}\bigr)$
      uitwerking: |-
        Uit het voorbeeld: $f'(x) = (1 - x)\e^{-x}$ en maximum $f(1) = \frac1\e$. Opnieuw de productregel: $f''(x) = -\e^{-x} - (1 - x)\e^{-x} = (x - 2)\e^{-x}$. Negatief voor $x < 2$ (bol), positief voor $x > 2$ (hol). Buigpunt $\bigl(2, 2\e^{-2}\bigr) \approx (2;\ 0{,}27)$.

- id: h4-weide2
  soort: kort
  opgave: |-
    Een boer zet met $120$ m draad een rechthoekige weide af, en verdeelt ze met een extra draad in twee gelijke delen: drie zijden van lengte $x$ en twee van lengte $y$. Welke afmetingen geven de grootste oppervlakte? Hoeveel draad gaat er dan in elke richting?
  antwoord: |-
    $x = 20$ m, $y = 30$ m, $600$ m$^2$; $60$ m in elke richting
  uitwerking: |-
    Voorwaarde: $3x + 2y = 120$, dus $y = 60 - \frac32 x$. Oppervlakte $A(x) = x\bigl(60 - \frac32 x\bigr) = 60x - \frac32 x^2$, met $0 < x < 40$. $A'(x) = 60 - 3x = 0 \iff x = 20$, en $A'$ wisselt daar van $+$ naar $-$: maximum. Dan $y = 30$ en $A = 600$ m$^2$. In de richting van $x$ gaat $3 \cdot 20 = 60$ m draad, in de richting van $y$ ook $2 \cdot 30 = 60$ m: de draad wordt eerlijk verdeeld over de twee richtingen. Bij de weide langs de rivier was dat ook zo: $2 \cdot 25 = 50$.

- id: h4-blik2
  soort: opdracht
  niveau: 2
  thema: |-
    zuinigste drinkbeker
  opgave: |-
    Een cilindervormige drinkbeker zonder deksel moet $250$ cm$^3$ bevatten. Welke straal en hoogte vragen het minste materiaal? Toon aan dat dan $h = r$, en verklaar het verschil met het blik uit voorbeeld~\ref{vb:h4-blik}.
  antwoord: |-
    $r = h = \sqrt[3]{\frac{250}{\pi}} \approx 4{,}30$ cm
  uitwerking: |-
    $\pi r^2 h = 250$ geeft $h = \frac{250}{\pi r^2}$. Bodem en mantel: $A(r) = \pi r^2 + 2\pi r h = \pi r^2 + \frac{500}{r}$, met $r > 0$. $A'(r) = 2\pi r - \frac{500}{r^2} = 0 \iff r^3 = \frac{250}{\pi}$, dus $r \approx 4{,}30$ cm. $A'$ wisselt daar van $-$ naar $+$: minimum. Uit $r^3 = \frac{250}{\pi}$ volgt $h = \frac{250}{\pi r^2} = \frac{r^3}{r^2} = r \approx 4{,}30$ cm. Bij het blik tellen de cirkels twee keer mee, want het heeft ook een deksel. Een smallere, hogere vorm is dan zuiniger: $h = 2r$.

- id: h4-stijgen
  soort: kort
  opgave: |-
    Waar stijgt en waar daalt $f$?
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = 3 - 2x - x^2$
      antwoord: |-
        stijgt op $\left]-\infty, -1\right[$, daalt op $\left]-1, +\infty\right[$
      uitwerking: |-
        $f'(x) = -2 - 2x$. Dat is positief voor $x < -1$ en negatief voor $x > -1$. De grafiek is een bergparabool met top in $x = -1$.
    - opgave: |-
        $f(x) = x^3 + x$
      antwoord: |-
        stijgt overal
      uitwerking: |-
        $f'(x) = 3x^2 + 1 \geqslant 1 > 0$ voor elke $x$: $f$ stijgt op $\R$.
    - opgave: |-
        $f(x) = \dfrac1x$. Daalt $f$ op heel haar domein? Vergelijk $f(-1)$ en $f(1)$.
      antwoord: |-
        daalt op $\left]-\infty, 0\right[$ en op $\left]0, +\infty\right[$, niet op het hele domein
      uitwerking: |-
        $f'(x) = -\frac{1}{x^2} < 0$, dus $f$ daalt op elk van de twee intervallen $\left]-\infty, 0\right[$ en $\left]0, +\infty\right[$. Maar $-1 < 1$ en $f(-1) = -1 < f(1) = 1$: op het hele domein is $f$ niet dalend. De stelling geldt alleen op een interval, en het domein $\R \setminus \{0\}$ is geen interval.

- id: h4-interval
  soort: kort
  opgave: |-
    Bepaal de grootste en de kleinste waarde van $f$ op het gegeven interval.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^2 - 6x$ op $[0, 4]$
      antwoord: |-
        grootste $f(0) = 0$, kleinste $f(3) = -9$
      uitwerking: |-
        $f'(x) = 2x - 6$, nul in $3$. Vergelijk $f(0) = 0$, $f(3) = -9$ en $f(4) = -8$. Grootste waarde $0$ (op de rand), kleinste $-9$.
    - opgave: |-
        $f(x) = x + \dfrac{9}{x}$ op $[1, 6]$
      antwoord: |-
        grootste $f(1) = 10$, kleinste $f(3) = 6$
      uitwerking: |-
        $f'(x) = 1 - \frac{9}{x^2} = \frac{(x - 3)(x + 3)}{x^2}$, in het interval alleen nul in $3$. Vergelijk $f(1) = 10$, $f(3) = 6$ en $f(6) = 7{,}5$. Grootste waarde $10$ (op de rand), kleinste $6$.

- id: h4-tweede
  soort: kort
  opgave: |-
    De tweede afgeleide.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $f''(x)$ voor $f(x) = x^4 - 2x^3 + x$ en voor $f(x) = \sin^2 x$.
      antwoord: |-
        $12x^2 - 12x$; $2\cos 2x$
      uitwerking: |-
        $f'(x) = 4x^3 - 6x^2 + 1$ en $f''(x) = 12x^2 - 12x$. Voor $\sin^2 x$: $f'(x) = 2\sin x\cos x = \sin 2x$, en met de kettingregel $f''(x) = 2\cos 2x$.
    - opgave: |-
        Een bal wordt omhoog gegooid: zijn hoogte is $s(t) = 1 + 15t - 5t^2$ (in m, $t$ in s). Bereken de snelheid en de versnelling. Wat valt op aan de versnelling?
      antwoord: |-
        $v(t) = 15 - 10t$; $a(t) = -10$ m/s$^2$
      uitwerking: |-
        $v(t) = s'(t) = 15 - 10t$ en $a(t) = s''(t) = -10$. De versnelling is constant: de zwaartekracht remt de bal elke seconde $10$ m/s af, ook als hij weer valt.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h4-o1
  soort: opdracht
  niveau: 1
  thema: |-
    extrema
  opgave: |-
    Bepaal het verloop en de extrema van $f(x) = x^4 - 2x^2$.
  antwoord: |-
    min. $f(\pm 1) = -1$, max. $f(0) = 0$
  uitwerking: |-
    $f'(x) = 4x^3 - 4x = 4x(x - 1)(x + 1)$: $-$, $0$, $+$, $0$, $-$, $0$, $+$. Minima $f(-1) = f(1) = -1$, maximum $f(0) = 0$.

- id: h4-o2
  soort: opdracht
  niveau: 1
  thema: |-
    de grafiek van de afgeleide
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.4cm,font=\scriptsize]
        \rooster{-3}{1}{4}{-3}{1}{4}
        \kromme{-2.3}{3.3}{(\x+1)*(\x-2)}
        \node[accent,right] at (3.1,3) {$f'$};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van de \textit{afgeleide} $f'$ van een functie $f$. Waar stijgt $f$? Waar heeft $f$ een maximum en een minimum? Waar heeft $f$ een buigpunt?
  antwoord: |-
    stijgt voor $x < -1$ en $x > 2$; max. in $-1$, min. in $2$; buigpunt in $\frac12$
  uitwerking: |-
    $f' > 0$ voor $x < -1$ en $x > 2$: daar stijgt $f$. $f'$ wisselt in $-1$ van $+$ naar $-$ (maximum) en in $2$ van $-$ naar $+$ (minimum). Een buigpunt ligt waar $f'$ zelf een extremum heeft (dan wisselt $f''$ van teken): in $x = \frac12$.

- id: h4-o3
  soort: opdracht
  niveau: 1
  thema: |-
    snelheid en versnelling
  opgave: |-
    Een wagentje beweegt op een rechte baan: $s(t) = t^3 - 6t^2 + 9t$ (in m, $t$ in s).
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de snelheid $v(t) = s'(t)$ en de versnelling $a(t) = v'(t)$.
      antwoord: |-
        $v(t) = 3t^2 - 12t + 9$; $a(t) = 6t - 12$
      uitwerking: |-
        $v(t) = 3t^2 - 12t + 9$ en $a(t) = 6t - 12$.
    - opgave: |-
        Wanneer staat het wagentje even stil? Wanneer rijdt het achteruit?
      antwoord: |-
        $t = 1$ en $t = 3$; tussen 1 en 3 s
      uitwerking: |-
        $v(t) = 3(t - 1)(t - 3) = 0$ voor $t = 1$ en $t = 3$; negatief ertussen: dan rijdt het achteruit.

- id: h4-o4
  soort: opdracht
  niveau: 2
  thema: |-
    een doos
  opgave: |-
    Uit een karton van $20$ cm op $12$ cm knip je in elke hoek een vierkant met zijde $x$ en plooit een doos zonder deksel: $V(x) = x(20 - 2x)(12 - 2x)$. Voor welke $x$ is de inhoud maximaal? (In Algemene functies las je dat af op een grafiek.)
  antwoord: |-
    $x = \frac{16 - 2\sqrt{19}}{3} \approx 2{,}43$ cm; $V \approx 262{,}7$ cm$^3$
  uitwerking: |-
    $V(x) = 4x^3 - 64x^2 + 240x$ op $\left]0, 6\right[$. $V'(x) = 12x^2 - 128x + 240 = 0 \iff 3x^2 - 32x + 60 = 0 \iff x = \frac{16 \pm 2\sqrt{19}}{3}$. Alleen $x \approx 2{,}43$ ligt in het domein ($8{,}24$ niet). $V'$ wisselt daar van $+$ naar $-$: maximum $V \approx 262{,}7$ cm$^3$.

- id: h4-o5
  soort: opdracht
  niveau: 2
  thema: |-
    ln x gedeeld door x
  opgave: |-
    Bepaal het verloop, de extrema en de buigpunten van $f(x) = \dfrac{\ln x}{x}$.
  antwoord: |-
    max. $f(\e) = \frac1\e$; buigpunt in $x = \e^{3/2}$
  uitwerking: |-
    $f'(x) = \frac{1 - \ln x}{x^2}$: positief voor $x < \e$, negatief erna. Maximum $f(\e) = \frac1\e$. $f''(x) = \frac{2\ln x - 3}{x^3}$: nul voor $x = \e^{3/2} \approx 4{,}48$, en wisselt daar van teken: buigpunt $\bigl(\e^{3/2}, \frac{3}{2}\e^{-3/2}\bigr)$.

- id: h4-o6
  soort: opdracht
  niveau: 2
  thema: |-
    een open doos
  opgave: |-
    Een verpakking heeft de vorm van een open doos met vierkant grondvlak en een inhoud van $32$ dm$^3$. Welke afmetingen vragen het minste karton (grondvlak en vier zijvlakken)?
  antwoord: |-
    grondvlak $4 \times 4$ dm, hoogte $2$ dm
  uitwerking: |-
    Zijde $x$, hoogte $h = \frac{32}{x^2}$. Karton $K(x) = x^2 + 4xh = x^2 + \frac{128}{x}$. $K'(x) = 2x - \frac{128}{x^2} = 0 \iff x^3 = 64 \iff x = 4$; $K'$ wisselt van $-$ naar $+$. Dan $h = 2$ dm.

- id: h4-o7
  soort: opdracht
  niveau: 3
  thema: |-
    kortste afstand
  opgave: |-
    Welk punt van de parabool $y = x^2$ ligt het dichtst bij het punt $(0, 2)$? Tip: minimaliseer het kwadraat van de afstand.
  antwoord: |-
    $\bigl(\pm\sqrt{\tfrac32}, \tfrac32\bigr)$, afstand $\frac{\sqrt7}{2}$
  uitwerking: |-
    $d^2(x) = x^2 + (x^2 - 2)^2 = x^4 - 3x^2 + 4$. Afgeleide $4x^3 - 6x = 2x(2x^2 - 3) = 0$ voor $x = 0$ of $x = \pm\sqrt{\frac32}$. $d^2(0) = 4$ is een maximum, $d^2\bigl(\pm\sqrt{\frac32}\bigr) = \frac94 - \frac92 + 4 = \frac74$ een minimum. Afstand $\frac{\sqrt7}{2} \approx 1{,}32$.

- id: h4-o8
  soort: opdracht
  niveau: 3
  thema: |-
    e tot de pi of pi tot de e
  opgave: |-
    Welk getal is groter: $\e^{\pi}$ of $\pi^{\e}$? Beslis zonder rekentoestel, met de functie $\frac{\ln x}{x}$ uit opdracht~\ref{oef:h4-o5}.
  antwoord: |-
    $\e^\pi$
  uitwerking: |-
    $\frac{\ln x}{x}$ heeft haar maximum in $\e$, dus $\frac{\ln \pi}{\pi} < \frac{\ln \e}{\e} = \frac1\e$. Vermenigvuldig met $\e\pi > 0$: $\e\ln\pi < \pi$, dus $\ln \pi^\e < \ln \e^\pi$ en $\pi^\e < \e^\pi$. (Controle: $22{,}46 < 23{,}14$.)

- id: h4-o9
  soort: opdracht
  niveau: 3
  thema: |-
    licht breekt
  opgave: |-
    Een redder staat op het strand in $A(0, 30)$ en wil zo snel mogelijk bij een zwemmer in $B(40, -20)$ (in m; de waterlijn is de $x$-as). Hij loopt $5$ m/s en zwemt $1$ m/s. Hij loopt naar het punt $(x, 0)$ en zwemt dan verder. Stel de tijd $T(x)$ op en zoek met je rekentoestel (door in te vullen) de beste $x$ op een meter.
  antwoord: |-
    $T(x) = \frac{\sqrt{x^2 + 900}}{5} + \sqrt{(40 - x)^2 + 400}$; $x \approx 37$ m
  uitwerking: |-
    $T(x) = \frac{\sqrt{x^2 + 900}}{5} + \sqrt{(40 - x)^2 + 400}$ (in s). Waarden: $T(30) \approx 30{,}85$, $T(35) \approx 29{,}84$, $T(36) \approx 29{,}77$, $T(37) \approx 29{,}75$, $T(38) \approx 29{,}78$. Het minimum ligt bij $x \approx 37$ m: hij loopt bijna tot recht tegenover de zwemmer, want zwemmen is veel trager.

- id: h4-o10
  soort: opdracht
  niveau: 1
  thema: |-
    drill: stijgen, dalen en extrema
  opgave: |-
    Bepaal waar $f$ stijgt en daalt, en de extrema.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = x^2 - 6x + 5$
      antwoord: |-
        daalt voor $x < 3$, stijgt erna; min. $f(3) = -4$
      uitwerking: |-
        $f'(x) = 2x - 6 = 2(x - 3)$: $-$, $0$, $+$. Minimum $f(3) = 9 - 18 + 5 = -4$.
    - opgave: |-
        $f(x) = 2x^3 - 6x$
      antwoord: |-
        max. $f(-1) = 4$, min. $f(1) = -4$
      uitwerking: |-
        $f'(x) = 6x^2 - 6 = 6(x - 1)(x + 1)$: $+$, $0$, $-$, $0$, $+$. Maximum $f(-1) = -2 + 6 = 4$, minimum $f(1) = 2 - 6 = -4$.
    - opgave: |-
        $f(x) = -x^3 + 12x + 1$
      antwoord: |-
        min. $f(-2) = -15$, max. $f(2) = 17$
      uitwerking: |-
        $f'(x) = -3x^2 + 12 = -3(x - 2)(x + 2)$: $-$, $0$, $+$, $0$, $-$. Minimum $f(-2) = 8 - 24 + 1 = -15$, maximum $f(2) = -8 + 24 + 1 = 17$.
    - opgave: |-
        $f(x) = x^3 + 3x$
      antwoord: |-
        overal stijgend, geen extrema
      uitwerking: |-
        $f'(x) = 3x^2 + 3 > 0$ voor elke $x$: $f$ stijgt overal en heeft geen extrema.
    - opgave: |-
        $f(x) = x^4 - 8x^2$
      antwoord: |-
        min. $f(\pm 2) = -16$, max. $f(0) = 0$
      uitwerking: |-
        $f'(x) = 4x^3 - 16x = 4x(x - 2)(x + 2)$: $-$, $0$, $+$, $0$, $-$, $0$, $+$. Minima $f(-2) = f(2) = 16 - 32 = -16$, maximum $f(0) = 0$.
    - opgave: |-
        $f(x) = x^3 + 3x^2 - 9x$
      antwoord: |-
        max. $f(-3) = 27$, min. $f(1) = -5$
      uitwerking: |-
        $f'(x) = 3x^2 + 6x - 9 = 3(x + 3)(x - 1)$: $+$, $0$, $-$, $0$, $+$. Maximum $f(-3) = -27 + 27 + 27 = 27$, minimum $f(1) = 1 + 3 - 9 = -5$.
    - opgave: |-
        $f(x) = 3x^4 - 4x^3$
      antwoord: |-
        min. $f(1) = -1$; in $0$ geen extremum
      uitwerking: |-
        $f'(x) = 12x^3 - 12x^2 = 12x^2(x - 1)$: $-$, $0$, $-$, $0$, $+$. Minimum $f(1) = -1$. In $0$ wisselt $f'$ niet van teken: geen extremum.
    - opgave: |-
        $f(x) = x + \dfrac{4}{x}$
      antwoord: |-
        max. $f(-2) = -4$, min. $f(2) = 4$
      uitwerking: |-
        Domein $\R \setminus \{0\}$. $f'(x) = 1 - \frac{4}{x^2} = \frac{(x - 2)(x + 2)}{x^2}$: $+$, $0$, $-$, $|$, $-$, $0$, $+$. Maximum $f(-2) = -4$, minimum $f(2) = 4$. Het maximum is kleiner dan het minimum: ze liggen op twee verschillende takken.
    - opgave: |-
        $f(x) = \dfrac{x}{x^2 + 4}$
      antwoord: |-
        min. $f(-2) = -\frac14$, max. $f(2) = \frac14$
      uitwerking: |-
        Quotiëntregel: $f'(x) = \frac{x^2 + 4 - 2x^2}{(x^2 + 4)^2} = \frac{(2 - x)(2 + x)}{(x^2 + 4)^2}$: $-$, $0$, $+$, $0$, $-$. Minimum $f(-2) = -\frac{2}{8} = -\frac14$, maximum $f(2) = \frac14$.
    - opgave: |-
        $f(x) = (x - 1)^2(x + 2)$
      antwoord: |-
        max. $f(-1) = 4$, min. $f(1) = 0$
      uitwerking: |-
        Productregel: $f'(x) = 2(x - 1)(x + 2) + (x - 1)^2 = (x - 1)(2x + 4 + x - 1) = 3(x - 1)(x + 1)$: $+$, $0$, $-$, $0$, $+$. Maximum $f(-1) = 4 \cdot 1 = 4$, minimum $f(1) = 0$.
    - opgave: |-
        $f(x) = x^5 - 5x$
      antwoord: |-
        max. $f(-1) = 4$, min. $f(1) = -4$
      uitwerking: |-
        $f'(x) = 5x^4 - 5 = 5(x^2 + 1)(x - 1)(x + 1)$, en $x^2 + 1 > 0$: $+$, $0$, $-$, $0$, $+$. Maximum $f(-1) = -1 + 5 = 4$, minimum $f(1) = -4$.
    - opgave: |-
        $f(x) = x - 2\sqrt{x}$
      antwoord: |-
        daalt op $[0, 1]$, stijgt erna; min. $f(1) = -1$
      uitwerking: |-
        Domein $[0, +\infty[$. Voor $x > 0$ is $f'(x) = 1 - \frac{1}{\sqrt{x}} = \frac{\sqrt{x} - 1}{\sqrt{x}}$: negatief voor $x < 1$, positief voor $x > 1$. Minimum $f(1) = 1 - 2 = -1$.

- id: h4-o16
  soort: opdracht
  niveau: 1
  thema: |-
    drill: tweede afgeleide
  opgave: |-
    Bereken $f''(x)$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = x^5 - 3x^2$
      antwoord: |-
        $20x^3 - 6$
      uitwerking: |-
        $f'(x) = 5x^4 - 6x$, $f''(x) = 20x^3 - 6$.
    - opgave: |-
        $f(x) = \sqrt{x}$
      antwoord: |-
        $-\dfrac{1}{4x\sqrt{x}}$
      uitwerking: |-
        $f'(x) = \frac12 x^{-1/2}$, $f''(x) = -\frac14 x^{-3/2} = -\frac{1}{4x\sqrt{x}}$.
    - opgave: |-
        $f(x) = \dfrac1x$
      antwoord: |-
        $\dfrac{2}{x^3}$
      uitwerking: |-
        $f'(x) = -x^{-2}$, $f''(x) = 2x^{-3} = \frac{2}{x^3}$.
    - opgave: |-
        $f(x) = x\,\e^x$
      antwoord: |-
        $(x + 2)\,\e^x$
      uitwerking: |-
        $f'(x) = \e^x + x\,\e^x = (x + 1)\e^x$, en opnieuw de productregel: $f''(x) = \e^x + (x + 1)\e^x = (x + 2)\e^x$.
    - opgave: |-
        $f(x) = \sin 2x$
      antwoord: |-
        $-4\sin 2x$
      uitwerking: |-
        $f'(x) = 2\cos 2x$, $f''(x) = -4\sin 2x$.
    - opgave: |-
        $f(x) = \ln x$
      antwoord: |-
        $-\dfrac{1}{x^2}$
      uitwerking: |-
        $f'(x) = \frac1x = x^{-1}$, $f''(x) = -x^{-2} = -\frac{1}{x^2}$.
    - opgave: |-
        $f(x) = x^2 \ln x$
      antwoord: |-
        $2\ln x + 3$
      uitwerking: |-
        $f'(x) = 2x\ln x + x^2 \cdot \frac1x = 2x\ln x + x$, $f''(x) = 2\ln x + 2x \cdot \frac1x + 1 = 2\ln x + 3$.
    - opgave: |-
        $f(x) = \e^{-x^2}$
      antwoord: |-
        $(4x^2 - 2)\,\e^{-x^2}$
      uitwerking: |-
        $f'(x) = -2x\,\e^{-x^2}$, $f''(x) = -2\e^{-x^2} + (-2x)(-2x)\e^{-x^2} = (4x^2 - 2)\e^{-x^2}$.
    - opgave: |-
        $f(x) = \dfrac{x}{x + 1}$
      antwoord: |-
        $-\dfrac{2}{(x + 1)^3}$
      uitwerking: |-
        $f'(x) = \frac{(x + 1) - x}{(x + 1)^2} = (x + 1)^{-2}$, $f''(x) = -2(x + 1)^{-3} = -\frac{2}{(x + 1)^3}$.

- id: h4-o12
  soort: opdracht
  niveau: 1
  thema: |-
    verloop aflezen op een grafiek
  figuur:
    opties: |-
      5cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.6cm,font=\scriptsize]
        \rooster{-3}{1}{5}{-3}{1}{3}
        \kromme{-3}{5}{((\x)^3-3*(\x)^2-9*\x+11)/8}
        \node[accent,above] at (4.6,2.2) {$f$};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van een functie $f$ met $\dom f = [-3, 5]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar stijgt $f$, en waar daalt $f$?
      antwoord: |-
        stijgt op $[-3, -1]$ en $[3, 5]$, daalt op $[-1, 3]$
      uitwerking: |-
        De grafiek gaat omhoog van $x = -3$ tot $x = -1$ en van $x = 3$ tot $x = 5$, en omlaag ertussen.
    - opgave: |-
        Geef de extrema binnen het domein.
      antwoord: |-
        max. $f(-1) = 2$, min. $f(3) = -2$
      uitwerking: |-
        In $x = -1$ gaat stijgen over in dalen: maximum $f(-1) = 2$. In $x = 3$ gaat dalen over in stijgen: minimum $f(3) = -2$. Daar is de raaklijn horizontaal.
    - opgave: |-
        Waar is de grafiek hol, waar bol? Geef het buigpunt.
      antwoord: |-
        bol op $[-3, 1]$, hol op $[1, 5]$; buigpunt $(1, 0)$
      uitwerking: |-
        Links van $x = 1$ buigt de grafiek naar onder ($\cap$), rechts ervan naar boven ($\cup$). Het buigpunt is $(1, 0)$: daar daalt de grafiek het steilst.
    - opgave: |-
        Is $f'(2)$ positief of negatief? En $f''(2)$?
      antwoord: |-
        $f'(2) < 0$, $f''(2) > 0$
      uitwerking: |-
        In $x = 2$ daalt de grafiek, dus $f'(2) < 0$. Ze is daar hol, dus $f''(2) > 0$.

- id: h4-o15
  soort: opdracht
  niveau: 1
  thema: |-
    teken van f' en f'' uit de vorm
  opgave: |-
    Geef bij elk stuk grafiek het teken van $f'$ en van $f''$.

    \figuren{\begin{tikzpicture}[x=.7cm,y=.7cm,font=\scriptsize]
      \draw[->,grijs] (0,0) -- (2.2,0); \draw[->,grijs] (0,0) -- (0,2.2);
      \kromme{.3}{2}{2-.5*(2-\x)^2}
      \node[above] at (1,2.3) {A};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.7cm,y=.7cm,font=\scriptsize]
      \draw[->,grijs] (0,0) -- (2.2,0); \draw[->,grijs] (0,0) -- (0,2.2);
      \kromme{.4}{2}{.8/\x}
      \node[above] at (1,2.3) {B};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.7cm,y=.7cm,font=\scriptsize]
      \draw[->,grijs] (0,0) -- (2.2,0); \draw[->,grijs] (0,0) -- (0,2.2);
      \kromme{.2}{2}{2-.45*(\x)^2}
      \node[above] at (1,2.3) {C};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.7cm,y=.7cm,font=\scriptsize]
      \draw[->,grijs] (0,0) -- (2.2,0); \draw[->,grijs] (0,0) -- (0,2.2);
      \kromme{.2}{2}{.45*(\x)^2+.1}
      \node[above] at (1,2.3) {D};
    \end{tikzpicture}}
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        A
      antwoord: |-
        $f' > 0$, $f'' < 0$
      uitwerking: |-
        Stijgend, dus $f' > 0$. Ze buigt naar onder ($\cap$): bol, dus $f'' < 0$.
    - opgave: |-
        B
      antwoord: |-
        $f' < 0$, $f'' > 0$
      uitwerking: |-
        Dalend, dus $f' < 0$. Ze buigt naar boven ($\cup$): hol, dus $f'' > 0$.
    - opgave: |-
        C
      antwoord: |-
        $f' < 0$, $f'' < 0$
      uitwerking: |-
        Dalend en steeds steiler: $f' < 0$, en de grafiek is bol, dus $f'' < 0$.
    - opgave: |-
        D
      antwoord: |-
        $f' > 0$, $f'' > 0$
      uitwerking: |-
        Stijgend en steeds steiler: $f' > 0$, en de grafiek is hol, dus $f'' > 0$.

- id: h4-o11
  soort: opdracht
  niveau: 1
  thema: |-
    drill: holheid en buigpunten
  opgave: |-
    Bepaal waar de grafiek hol en bol is, en de buigpunten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = x^3 - 3x^2 + 4$
      antwoord: |-
        bol voor $x < 1$, hol erna; buigpunt $(1, 2)$
      uitwerking: |-
        $f'(x) = 3x^2 - 6x$, $f''(x) = 6x - 6$: $-$, $0$, $+$. Buigpunt $(1, f(1)) = (1, 2)$.
    - opgave: |-
        $f(x) = x^4 - 6x^2$
      antwoord: |-
        hol, bol, hol; buigpunten $(\pm 1, -5)$
      uitwerking: |-
        $f'(x) = 4x^3 - 12x$, $f''(x) = 12x^2 - 12 = 12(x - 1)(x + 1)$: $+$, $0$, $-$, $0$, $+$. Hol voor $|x| > 1$, bol op $\left]-1, 1\right[$. Buigpunten $(-1, -5)$ en $(1, -5)$.
    - opgave: |-
        $f(x) = -x^3 + 6x^2$
      antwoord: |-
        hol voor $x < 2$, bol erna; buigpunt $(2, 16)$
      uitwerking: |-
        $f'(x) = -3x^2 + 12x$, $f''(x) = -6x + 12$: $+$, $0$, $-$. Buigpunt $(2, -8 + 24) = (2, 16)$.
    - opgave: |-
        $f(x) = x^4 + x^2$
      antwoord: |-
        overal hol, geen buigpunt
      uitwerking: |-
        $f'(x) = 4x^3 + 2x$, $f''(x) = 12x^2 + 2 > 0$ voor elke $x$: overal hol, geen buigpunt.
    - opgave: |-
        $f(x) = x^4 - 2x^3$
      antwoord: |-
        hol, bol, hol; buigpunten $(0, 0)$ en $(1, -1)$
      uitwerking: |-
        $f'(x) = 4x^3 - 6x^2$, $f''(x) = 12x^2 - 12x = 12x(x - 1)$: $+$, $0$, $-$, $0$, $+$. Buigpunten $(0, 0)$ en $(1, -1)$.
    - opgave: |-
        $f(x) = x^4$
      antwoord: |-
        overal hol, geen buigpunt
      uitwerking: |-
        $f''(x) = 12x^2$ is nul in $0$, maar wisselt niet van teken: $+$, $0$, $+$. De grafiek is overal hol en heeft geen buigpunt.
    - opgave: |-
        $f(x) = x^5 - 5x^4$
      antwoord: |-
        bol voor $x < 3$, hol erna; buigpunt $(3, -162)$
      uitwerking: |-
        $f'(x) = 5x^4 - 20x^3$, $f''(x) = 20x^3 - 60x^2 = 20x^2(x - 3)$: $-$, $0$, $-$, $0$, $+$. In $0$ geen tekenwissel. Buigpunt $(3, 243 - 405) = (3, -162)$.
    - opgave: |-
        $f(x) = x\,\e^x$
      antwoord: |-
        bol voor $x < -2$, hol erna; buigpunt $\bigl(-2, -\frac{2}{\e^2}\bigr)$
      uitwerking: |-
        $f'(x) = (x + 1)\e^x$, $f''(x) = (x + 2)\e^x$. Het teken is dat van $x + 2$: $-$, $0$, $+$. Buigpunt $\bigl(-2, -2\e^{-2}\bigr)$.
    - opgave: |-
        $f(x) = \ln(x^2 + 1)$
      antwoord: |-
        bol, hol, bol; buigpunten $(\pm 1, \ln 2)$
      uitwerking: |-
        $f'(x) = \frac{2x}{x^2 + 1}$, $f''(x) = \frac{2(x^2 + 1) - 2x \cdot 2x}{(x^2 + 1)^2} = \frac{2(1 - x^2)}{(x^2 + 1)^2}$: $-$, $0$, $+$, $0$, $-$. Buigpunten $(-1, \ln 2)$ en $(1, \ln 2)$.
    - opgave: |-
        $f(x) = x^3 + 3x^2 + 3x$
      antwoord: |-
        bol voor $x < -1$, hol erna; buigpunt $(-1, -1)$
      uitwerking: |-
        $f'(x) = 3x^2 + 6x + 3 = 3(x + 1)^2$, $f''(x) = 6x + 6$: $-$, $0$, $+$. Buigpunt $(-1, -1 + 3 - 3) = (-1, -1)$. Daar is ook $f'(-1) = 0$: een buigpunt met een horizontale raaklijn.

- id: h4-o13
  soort: opdracht
  niveau: 1
  thema: |-
    van tekentabel naar schets
  opgave: |-
    Van een functie $f$ met domein $\R$ weet je: $f(-2) = 3$, $f(1) = -1$, $f(4) = 2$, en
    \figuren{\tekentabel{cccccccc}{x & & -2 & & 1 & & 4 & }{f'(x) & + & 0 & - & 0 & + & 0 & -}}
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de extrema van $f$.
      antwoord: |-
        max. $f(-2) = 3$, min. $f(1) = -1$, max. $f(4) = 2$
      uitwerking: |-
        In $-2$ en in $4$ wisselt $f'$ van $+$ naar $-$: maxima $f(-2) = 3$ en $f(4) = 2$. In $1$ wisselt $f'$ van $-$ naar $+$: minimum $f(1) = -1$.
    - opgave: |-
        Schets een mogelijke grafiek.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        Stijgend tot het maximum $(-2, 3)$, dalend tot het minimum $(1, -1)$, stijgend tot het maximum $(4, 2)$ en daarna dalend. In de drie extrema is de raaklijn horizontaal. Bijvoorbeeld:
        \figuren{\begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
          \rooster{-4}{1}{6}{-2}{1}{4}
          \draw[accent,thick] (-3.6,-1) to[out=75,in=180] (-2,3) to[out=0,in=180] (1,-1) to[out=0,in=180] (4,2) to[out=0,in=105] (5.6,-1.5);
          \vol{(-2,3)} \vol{(1,-1)} \vol{(4,2)}
        \end{tikzpicture}}
    - opgave: |-
        Hoeveel nulwaarden heeft $f$ zeker? Kan het er meer zijn?
      antwoord: |-
        zeker $2$; het kunnen er ook $3$ of $4$ zijn
      uitwerking: |-
        Op $[-2, 1]$ daalt $f$ van $3$ naar $-1$: precies één nulwaarde. Op $[1, 4]$ stijgt $f$ van $-1$ naar $2$: weer precies één. Links van $-2$ en rechts van $4$ weet je niet hoe ver $f$ zakt: daar kan nog telkens een nulwaarde liggen. Dus minstens $2$ en hoogstens $4$.

- id: h4-o14
  soort: opdracht
  niveau: 2
  thema: |-
    grafiek van f' met een dubbele nulwaarde
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.5cm,font=\scriptsize]
        \rooster{-3}{1}{3}{-3}{1}{3}
        \kromme{-2.8}{2.6}{(\x+2)*(\x-1)^2/4}
        \node[accent,left] at (2.5,2.9) {$f'$};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van de \textit{afgeleide} $f'$ van een functie $f$. In $x = 1$ raakt ze de $x$-as.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar stijgt $f$, en waar daalt $f$?
      antwoord: |-
        daalt voor $x < -2$, stijgt voor $x > -2$
      uitwerking: |-
        $f' < 0$ voor $x < -2$: daar daalt $f$. Voor $x > -2$ is $f' \geqslant 0$, en alleen nul in het punt $1$: daar stijgt $f$.
    - opgave: |-
        Geef de extrema van $f$. Is er een extremum in $x = 1$?
      antwoord: |-
        min. in $x = -2$; in $x = 1$ geen extremum
      uitwerking: |-
        In $-2$ wisselt $f'$ van $-$ naar $+$: een minimum. In $1$ is $f'$ nul, maar ze blijft positief aan beide kanten: geen extremum. De grafiek van $f$ heeft daar een horizontale raaklijn en stijgt door.
    - opgave: |-
        Waar is de grafiek van $f$ hol, en waar bol? Waar liggen de buigpunten?
      antwoord: |-
        hol voor $x < -1$ en $x > 1$, bol op $\left]-1, 1\right[$; buigpunten in $x = -1$ en $x = 1$
      uitwerking: |-
        $f''$ is de afgeleide van $f'$: positief waar de grafiek van $f'$ stijgt, negatief waar ze daalt. $f'$ stijgt voor $x < -1$, daalt op $\left]-1, 1\right[$ en stijgt voor $x > 1$. Dus hol, bol, hol, met buigpunten in de extrema van $f'$: $x = -1$ en $x = 1$.

- id: h4-o23
  soort: opdracht
  niveau: 2
  thema: |-
    drill: extrema met e, ln en sin
  opgave: |-
    Bepaal de extrema.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^2\,\e^{-x}$
      antwoord: |-
        min. $f(0) = 0$, max. $f(2) = \frac{4}{\e^2}$
      uitwerking: |-
        $f'(x) = 2x\,\e^{-x} - x^2\,\e^{-x} = x(2 - x)\e^{-x}$: $-$, $0$, $+$, $0$, $-$. Minimum $f(0) = 0$, maximum $f(2) = 4\e^{-2} \approx 0{,}54$.
    - opgave: |-
        $f(x) = x\ln x$
      antwoord: |-
        min. $f\bigl(\frac1\e\bigr) = -\frac1\e$
      uitwerking: |-
        Domein $\left]0, +\infty\right[$. $f'(x) = \ln x + x \cdot \frac1x = \ln x + 1$, nul voor $\ln x = -1$, dus $x = \frac1\e$. Negatief ervoor, positief erna: minimum $f\bigl(\frac1\e\bigr) = \frac1\e \cdot (-1) = -\frac1\e$.
    - opgave: |-
        $f(x) = \e^x - 2x$
      antwoord: |-
        min. $f(\ln 2) = 2 - 2\ln 2$
      uitwerking: |-
        $f'(x) = \e^x - 2$, nul voor $x = \ln 2$. Omdat $\e^x$ stijgt, is $f'$ negatief ervoor en positief erna: minimum $f(\ln 2) = 2 - 2\ln 2 \approx 0{,}61$.
    - opgave: |-
        $f(x) = \dfrac{x^2 + 3}{x - 1}$
      antwoord: |-
        max. $f(-1) = -2$, min. $f(3) = 6$
      uitwerking: |-
        Domein $\R \setminus \{1\}$. $f'(x) = \frac{2x(x - 1) - (x^2 + 3)}{(x - 1)^2} = \frac{x^2 - 2x - 3}{(x - 1)^2} = \frac{(x - 3)(x + 1)}{(x - 1)^2}$: $+$, $0$, $-$, $|$, $-$, $0$, $+$. Maximum $f(-1) = \frac{4}{-2} = -2$, minimum $f(3) = \frac{12}{2} = 6$.
    - opgave: |-
        $f(x) = \dfrac{\ln x}{x^2}$
      antwoord: |-
        max. $f(\sqrt{\e}) = \frac{1}{2\e}$
      uitwerking: |-
        Domein $\left]0, +\infty\right[$. $f'(x) = \frac{\frac1x \cdot x^2 - 2x\ln x}{x^4} = \frac{1 - 2\ln x}{x^3}$, nul voor $\ln x = \frac12$, dus $x = \sqrt{\e}$. Positief ervoor, negatief erna: maximum $f(\sqrt\e) = \frac{1/2}{\e} = \frac{1}{2\e}$.
    - opgave: |-
        $f(x) = x - 2\sin x$ op $\left]0, 2\pi\right[$
      antwoord: |-
        min. $f\bigl(\frac{\pi}{3}\bigr) = \frac{\pi}{3} - \sqrt3$, max. $f\bigl(\frac{5\pi}{3}\bigr) = \frac{5\pi}{3} + \sqrt3$
      uitwerking: |-
        $f'(x) = 1 - 2\cos x$, nul voor $\cos x = \frac12$: $x = \frac{\pi}{3}$ of $x = \frac{5\pi}{3}$. Tekentabel: $-$, $0$, $+$, $0$, $-$. Minimum $f\bigl(\frac{\pi}{3}\bigr) = \frac{\pi}{3} - \sqrt3 \approx -0{,}68$, maximum $f\bigl(\frac{5\pi}{3}\bigr) = \frac{5\pi}{3} + \sqrt3 \approx 6{,}97$.

- id: h4-o19
  soort: opdracht
  niveau: 2
  thema: |-
    zuinigste snelheid
  figuur:
    opties: |-
      5cm
    code: |-
      \begin{tikzpicture}[x=.034cm,y=.0075cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=20,ystep=100] (0,0) grid (140,400);
        \draw[->,grijs] (0,0) -- (150,0) node[right,text=black] {$v$};
        \draw[->,grijs] (0,0) -- (0,440) node[above,text=black] {$K$};
        \foreach \t in {20,40,...,140}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {100,200,300,400}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \kromme{28}{140}{10800/\x+1.5*\x}
      \end{tikzpicture}
  opgave: |-
    Een vrachtwagen rijdt $300$ km aan een constante snelheid $v$ (in km/h). Per uur kost de chauffeur $30$ euro, en de diesel $6 + \frac{v^2}{200}$ euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de totale kost \mbox{$K(v) = \frac{10\,800}{v} + 1{,}5\,v$} euro is.
      antwoord: |-
        rijtijd $\frac{300}{v}$ uur maal de kost per uur
      uitwerking: |-
        De rit duurt $\frac{300}{v}$ uur, en elk uur kost $30 + 6 + \frac{v^2}{200} = 36 + \frac{v^2}{200}$ euro. Dus $K(v) = \frac{300}{v}\bigl(36 + \frac{v^2}{200}\bigr) = \frac{10\,800}{v} + \frac{300v}{200} = \frac{10\,800}{v} + 1{,}5\,v$.
    - opgave: |-
        Bij welke snelheid is de rit het goedkoopst? Hoeveel kost hij dan? Rond af op een cent.
      antwoord: |-
        $v = 60\sqrt2 \approx 84{,}9$ km/h; $K \approx 254{,}56$ euro
      uitwerking: |-
        $K'(v) = -\frac{10\,800}{v^2} + 1{,}5 = 0 \iff v^2 = 7200 \iff v = 60\sqrt2 \approx 84{,}9$ (want $v > 0$). $K'$ wisselt daar van $-$ naar $+$: minimum. $K(60\sqrt2) \approx 127{,}28 + 127{,}28 = 254{,}56$ euro. De twee termen zijn dan even groot.
    - opgave: |-
        Op een deel van de route mag hij maar $70$~km/h. Welke snelheid is daar het zuinigst?
      antwoord: |-
        $70$ km/h
      uitwerking: |-
        Op $\left]0, 70\right]$ is $K'(v) < 0$, want $70 < 84{,}9$: $K$ daalt over het hele toegelaten interval. Het minimum ligt dus op de rand: zo snel als mag, $70$ km/h. Dan is $K(70) \approx 259{,}29$ euro.

- id: h4-o17
  soort: opdracht
  niveau: 2
  thema: |-
    Waar zit de fout? (extrema, buigpunten, randen)
  opgave: |-
    Elke redenering is fout. Zeg wat er fout is, en geef het juiste antwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = x^3 + 2$. Omdat $f'(0) = 0$, heeft $f$ een extremum in $0$.
      antwoord: |-
        geen extremum: $f'$ wisselt niet van teken
      uitwerking: |-
        $f'(x) = 3x^2$ is nul in $0$, maar positief aan beide kanten. $f$ stijgt dus overal en heeft geen extremum. In $(0, 2)$ ligt een buigpunt met een horizontale raaklijn. Een nulwaarde van $f'$ is maar een kandidaat: kijk naar het teken.
    - opgave: |-
        $f(x) = x^4 - x$. Omdat $f''(0) = 0$, is $(0, 0)$ een buigpunt.
      antwoord: |-
        geen buigpunt: $f''$ wisselt niet van teken
      uitwerking: |-
        $f''(x) = 12x^2$ is nul in $0$, maar nergens negatief. De grafiek is overal hol: er is geen buigpunt. Ook voor een buigpunt moet je de tekenwissel nagaan.
    - opgave: |-
        De grootste waarde van $f(x) = x^2 - 4x$ op $[0, 5]$: $f'(x) = 2x - 4 = 0$ voor $x = 2$, dus de grootste waarde is $f(2) = -4$.
      antwoord: |-
        $f(2) = -4$ is de kleinste waarde; de grootste is $f(5) = 5$
      uitwerking: |-
        $f'$ wisselt in $2$ van $-$ naar $+$: $f(2) = -4$ is een minimum. Op een gesloten interval moet je ook de randen nagaan: $f(0) = 0$ en $f(5) = 25 - 20 = 5$. De grootste waarde is $5$, op de rand.
    - opgave: |-
        $f(x) = \dfrac1x$ heeft $f'(x) = -\dfrac{1}{x^2} < 0$, dus $f$ is dalend en $f(-1) > f(1)$.
      antwoord: |-
        $\dom f$ is geen interval; $f(-1) = -1 < 1 = f(1)$
      uitwerking: |-
        Het verband tussen $f' < 0$ en dalen geldt op een interval. $\R \setminus \{0\}$ is geen interval: $f$ daalt op $\left]-\infty, 0\right[$ en op $\left]0, +\infty\right[$ afzonderlijk. Over de asymptoot heen kun je niet vergelijken: $f(-1) = -1 < 1 = f(1)$.

- id: h4-o20
  soort: opdracht
  niveau: 2
  thema: |-
    rechthoek onder een parabool
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.27cm,font=\scriptsize]
        \fill[accent!15] (-1.4,0) rectangle (1.4,10.04);
        \rooster{-4}{1}{4}{0}{2}{12}
        \kromme{-3.46}{3.46}{12-(\x)^2}
        \draw[accent] (-1.4,0) rectangle (1.4,10.04);
        \vol{(1.4,10.04)}
        \draw[<->,accent] (0,1.2) -- (1.4,1.2) node[midway,above,inner sep=1pt] {$x$};
      \end{tikzpicture}
  opgave: |-
    Een rechthoek heeft twee hoekpunten op de $x$-as en twee op de parabool $y = 12 - x^2$, symmetrisch rond de $y$-as. Het rechtse hoekpunt op de parabool is \mbox{$(x, 12 - x^2)$}.
  lijst: enumerate
  delen:
    - opgave: |-
        Druk de oppervlakte $A$ uit in functie van $x$, en geef het domein.
      antwoord: |-
        $A(x) = 2x(12 - x^2)$, $0 < x < 2\sqrt3$
      uitwerking: |-
        De breedte is $2x$, de hoogte $12 - x^2$: $A(x) = 2x(12 - x^2) = 24x - 2x^3$. Er is een rechthoek als $x > 0$ en $12 - x^2 > 0$, dus $0 < x < 2\sqrt3$.
    - opgave: |-
        Welke rechthoek heeft de grootste oppervlakte?
      antwoord: |-
        $x = 2$: $4$ breed en $8$ hoog, $A = 32$
      uitwerking: |-
        $A'(x) = 24 - 6x^2 = 0 \iff x^2 = 4 \iff x = 2$ (in het domein). $A'$ wisselt van $+$ naar $-$: maximum. De rechthoek is $4$ breed en $12 - 4 = 8$ hoog, met $A(2) = 32$.

- id: h4-o24
  soort: opdracht
  niveau: 2
  thema: |-
    f, f' en f'' herkennen
  opgave: |-
    De figuren tonen de grafieken van een functie $f$, haar afgeleide $f'$ en haar tweede afgeleide $f''$, in een andere volgorde.

    \figuren{\begin{tikzpicture}[x=.5cm,y=.4cm,font=\scriptsize]
      \rooster{-2}{1}{2}{-3}{1}{3}
      \kromme{-2}{2}{(\x)^2-1}
      \node at (-1.6,3.6) {A};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.5cm,y=.4cm,font=\scriptsize]
      \rooster{-2}{1}{2}{-3}{1}{3}
      \kromme{-1.5}{1.5}{2*\x}
      \node at (-1.6,3.6) {B};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.5cm,y=.4cm,font=\scriptsize]
      \rooster{-2}{1}{2}{-3}{1}{3}
      \kromme{-2}{2}{(\x)^3/3-\x}
      \node at (-1.6,3.6) {C};
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Welke grafiek hoort bij $f$, welke bij $f'$ en welke bij $f''$?
      antwoord: |-
        C is $f$, A is $f'$, B is $f''$
      uitwerking: |-
        C heeft een maximum in $-1$ en een minimum in $1$, en precies daar is A nul, met de juiste tekens: A is de afgeleide van C. A heeft een minimum in $0$, en daar is B nul: B is de afgeleide van A. Dus C is $f$, A is $f'$ en B is $f''$.
    - opgave: |-
        Waar ligt het buigpunt van $f$? Controleer op de drie grafieken.
      antwoord: |-
        in $x = 0$
      uitwerking: |-
        C wisselt in $x = 0$ van bol naar hol. Daar heeft A een minimum en wisselt B van teken: van $-$ naar $+$.

- id: h4-o21
  soort: opdracht
  niveau: 2
  thema: |-
    parameters uit een buigpunt en een extremum
  opgave: |-
    De functie $f(x) = x^3 + ax^2 + bx + 1$ heeft een buigpunt in $x = 1$ en een extremum in $x = -2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $a$ en $b$.
      antwoord: |-
        $a = -3$, $b = -24$
      uitwerking: |-
        $f'(x) = 3x^2 + 2ax + b$ en $f''(x) = 6x + 2a$. Buigpunt in $1$: $f''(1) = 6 + 2a = 0$, dus $a = -3$. Extremum in $-2$: $f'(-2) = 12 - 4a + b = 12 + 12 + b = 0$, dus $b = -24$.
    - opgave: |-
        Is het extremum in $-2$ een maximum of een minimum? Geef ook het andere extremum en het buigpunt.
      antwoord: |-
        max. $f(-2) = 29$, min. $f(4) = -79$, buigpunt $(1, -25)$
      uitwerking: |-
        $f(x) = x^3 - 3x^2 - 24x + 1$ en $f'(x) = 3x^2 - 6x - 24 = 3(x + 2)(x - 4)$: $+$, $0$, $-$, $0$, $+$. Maximum $f(-2) = -8 - 12 + 48 + 1 = 29$, minimum $f(4) = 64 - 48 - 96 + 1 = -79$. Buigpunt $(1, 1 - 3 - 24 + 1) = (1, -25)$: precies midden tussen de twee extrema.

- id: h4-o18
  soort: opdracht
  niveau: 2
  thema: |-
    de steilste plek van een achtbaan
  figuur:
    opties: |-
      5cm
    code: |-
      \begin{tikzpicture}[x=.075cm,y=.075cm,font=\scriptsize]
        \rooster{0}{10}{60}{0}{10}{40}
        \kromme{0}{60}{(\x/10)^3/3-3*(\x/10)^2+40}
        \vol{(30,22)}
      \end{tikzpicture}
  opgave: |-
    Een afdaling van een achtbaan volgt de kromme $h(x) = \frac{x^3}{3000} - 0{,}03\,x^2 + 40$, met $x \in [0, 60]$ de horizontale afstand en $h$ de hoogte, beide in meter.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de baan daalt van een top in $x = 0$ naar een dal in $x = 60$. Hoe hoog is de afdaling?
      antwoord: |-
        $h'(x) = \frac{x(x - 60)}{1000} \leqslant 0$; $36$ m
      uitwerking: |-
        $h'(x) = \frac{x^2}{1000} - 0{,}06\,x = \frac{x(x - 60)}{1000}$: nul in $0$ en $60$, negatief ertussen. De baan daalt dus over het hele stuk, met een horizontale raaklijn aan het begin en op het einde. $h(0) = 40$ en $h(60) = 72 - 108 + 40 = 4$: de afdaling is $36$ m.
    - opgave: |-
        Waar is de baan het steilst? Hoe groot is de helling daar?
      antwoord: |-
        in $x = 30$ (hoogte $22$ m); helling $-0{,}9$
      uitwerking: |-
        De helling $h'$ is het meest negatief waar $h'$ een minimum heeft, dus waar $h''$ van teken wisselt: in het buigpunt. $h''(x) = \frac{x}{500} - 0{,}06 = 0 \iff x = 30$, met tekenwissel van $-$ naar $+$. Daar is $h'(30) = \frac{30 \cdot (-30)}{1000} = -0{,}9$ en $h(30) = 9 - 27 + 40 = 22$ m.
    - opgave: |-
        Onder welke hoek met de horizontale daalt de baan daar? Rond af op een graad.
      antwoord: |-
        ongeveer $42^\circ$
      uitwerking: |-
        De richtingscoëfficiënt is $\tan\alpha$: $\tan\alpha = 0{,}9$ geeft $\alpha \approx 41{,}99^\circ \approx 42^\circ$.

- id: h4-o22
  soort: opdracht
  niveau: 2
  thema: |-
    grootste en kleinste waarde op een gesloten interval
  opgave: |-
    Bepaal de grootste en de kleinste waarde van $f$ op het gegeven interval. Vergeet de randen niet.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^3 - 3x$ op $[0, 3]$
      antwoord: |-
        grootste $f(3) = 18$, kleinste $f(1) = -2$
      uitwerking: |-
        $f'(x) = 3(x - 1)(x + 1)$, met in $[0, 3]$ alleen de nulwaarde $1$. Vergelijk $f(0) = 0$, $f(1) = -2$ en $f(3) = 27 - 9 = 18$. Grootste waarde $18$ (op de rand), kleinste $-2$.
    - opgave: |-
        $f(x) = x\,\e^{-x}$ op $[0, 3]$
      antwoord: |-
        grootste $f(1) = \frac1\e$, kleinste $f(0) = 0$
      uitwerking: |-
        $f'(x) = (1 - x)\e^{-x}$, nul in $1$. Vergelijk $f(0) = 0$, $f(1) = \frac1\e \approx 0{,}37$ en $f(3) = 3\e^{-3} \approx 0{,}15$. Grootste waarde $\frac1\e$, kleinste $0$ (op de rand).
    - opgave: |-
        $f(x) = \sin x + \cos x$ op $[0, \pi]$
      antwoord: |-
        grootste $f\bigl(\frac{\pi}{4}\bigr) = \sqrt2$, kleinste $f(\pi) = -1$
      uitwerking: |-
        $f'(x) = \cos x - \sin x = 0 \iff \tan x = 1$, in $[0, \pi]$ alleen $x = \frac{\pi}{4}$. Vergelijk $f(0) = 1$, $f\bigl(\frac{\pi}{4}\bigr) = \frac{\sqrt2}{2} + \frac{\sqrt2}{2} = \sqrt2$ en $f(\pi) = 0 - 1 = -1$. Grootste waarde $\sqrt2$, kleinste $-1$ (op de rand).
    - opgave: |-
        $f(x) = x + \dfrac1x$ op $\bigl[\frac12, 3\bigr]$
      antwoord: |-
        grootste $f(3) = \frac{10}{3}$, kleinste $f(1) = 2$
      uitwerking: |-
        $f'(x) = 1 - \frac{1}{x^2} = \frac{(x - 1)(x + 1)}{x^2}$, in het interval alleen nul in $1$. Vergelijk $f\bigl(\frac12\bigr) = \frac52$, $f(1) = 2$ en $f(3) = \frac{10}{3}$. Grootste waarde $\frac{10}{3}$ (op de rand), kleinste $2$.

- id: h4-o25
  soort: opdracht
  niveau: 3
  thema: |-
    elke derdegraadsfunctie heeft één buigpunt
  opgave: |-
    Neem een derdegraadsfunctie $f(x) = ax^3 + bx^2 + cx + d$ met $a \neq 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de grafiek precies één buigpunt heeft, in $x = -\dfrac{b}{3a}$.
      antwoord: |-
        $f''(x) = 6ax + 2b$ is een eerstegraadsfunctie
      uitwerking: |-
        $f'(x) = 3ax^2 + 2bx + c$ en $f''(x) = 6ax + 2b$. Omdat $a \neq 0$, is $f''$ een eerstegraadsfunctie: ze heeft één nulwaarde $x = -\frac{2b}{6a} = -\frac{b}{3a}$ en wisselt daar van teken. Er is dus precies één buigpunt.
    - opgave: |-
        Toon aan: $f$ heeft twee extrema als $b^2 > 3ac$, en geen als $b^2 \leqslant 3ac$.
      antwoord: |-
        discriminant van $f'$ is $4(b^2 - 3ac)$
      uitwerking: |-
        $f'$ is een tweedegraadsfunctie met discriminant $D = 4b^2 - 12ac = 4(b^2 - 3ac)$. Als $D > 0$, heeft $f'$ twee nulwaarden en wisselt ze in beide van teken: twee extrema. Als $D < 0$, heeft $f'$ overal het teken van $a$. Als $D = 0$, is $f'$ nul in één punt zonder tekenwissel. In die twee gevallen is er geen extremum.
    - opgave: |-
        Toon aan dat het buigpunt, als er twee extrema zijn, precies midden tussen hun $x$-waarden ligt.
      antwoord: |-
        $\frac{x_1 + x_2}{2} = -\frac{b}{3a}$
      uitwerking: |-
        De $x$-waarden $x_1$ en $x_2$ van de extrema zijn de nulwaarden van $3ax^2 + 2bx + c$. Hun som is $x_1 + x_2 = -\frac{2b}{3a}$, dus hun gemiddelde is $-\frac{b}{3a}$: de $x$-waarde van het buigpunt. (Dat zag je ook bij $x^3 - 3x^2 - 24x + 1$: extrema in $-2$ en $4$, buigpunt in $1$.)

- id: h4-o26
  soort: opdracht
  niveau: 3
  thema: |-
    ongelijkheden bewijzen met een minimum
  opgave: |-
    Een ongelijkheid $g(x) \geqslant 0$ bewijs je door aan te tonen dat het minimum van $g$ niet negatief is.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat $\e^x \geqslant 1 + x$ voor elke $x$.
      antwoord: |-
        $g(x) = \e^x - 1 - x$ heeft minimum $g(0) = 0$
      uitwerking: |-
        Stel $g(x) = \e^x - 1 - x$. Dan $g'(x) = \e^x - 1$: negatief voor $x < 0$, positief voor $x > 0$. Het minimum is $g(0) = 1 - 1 - 0 = 0$. Dus $g(x) \geqslant 0$, of $\e^x \geqslant 1 + x$, met gelijkheid alleen in $0$.
    - opgave: |-
        Bewijs dat $\ln x \leqslant x - 1$ voor elke $x > 0$.
      antwoord: |-
        $g(x) = x - 1 - \ln x$ heeft minimum $g(1) = 0$
      uitwerking: |-
        Stel $g(x) = x - 1 - \ln x$ op $\left]0, +\infty\right[$. Dan $g'(x) = 1 - \frac1x = \frac{x - 1}{x}$: negatief voor $x < 1$, positief voor $x > 1$. Minimum $g(1) = 0$, dus $\ln x \leqslant x - 1$.
    - opgave: |-
        De rechten $y = 1 + x$ en $y = x - 1$ zijn raaklijnen. Aan welke grafiek, en in welk punt? Verklaar beide ongelijkheden met hol en bol.
      antwoord: |-
        raaklijn aan $\e^x$ in $(0, 1)$ en aan $\ln x$ in $(1, 0)$
      uitwerking: |-
        $(\e^x)' = 1$ in $0$, en $\e^0 = 1$: $y = 1 + x$ raakt de grafiek van $\e^x$ in $(0, 1)$. $(\ln x)' = 1$ in $1$, en $\ln 1 = 0$: $y = x - 1$ raakt de grafiek van $\ln x$ in $(1, 0)$. De grafiek van $\e^x$ is overal hol ($(\e^x)'' = \e^x > 0$) en ligt dus boven haar raaklijn. De grafiek van $\ln x$ is overal bol ($(\ln x)'' = -\frac{1}{x^2} < 0$) en ligt onder haar raaklijn.
    - opgave: |-
        Leid uit b af dat $\ln x \geqslant 1 - \dfrac1x$ voor $x > 0$, zonder opnieuw af te leiden.
      antwoord: |-
        vul $\frac1x$ in voor $x$
      uitwerking: |-
        Pas b toe op $\frac1x > 0$: $\ln \frac1x \leqslant \frac1x - 1$. Omdat $\ln \frac1x = -\ln x$, staat er $-\ln x \leqslant \frac1x - 1$, of $\ln x \geqslant 1 - \frac1x$.

- id: h4-o27
  soort: opdracht
  niveau: 3
  thema: |-
    aantal nulwaarden met een parameter
  opgave: |-
    Neem $f(x) = x^3 - kx + 2$, met $k$ een reëel getal.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $k$ heeft $f$ twee extrema?
      antwoord: |-
        $k > 0$
      uitwerking: |-
        $f'(x) = 3x^2 - k$. Voor $k > 0$ heeft $f'$ twee nulwaarden $\pm\sqrt{k/3}$ met tekenwissel: een maximum en een minimum. Voor $k \leqslant 0$ is $f'(x) \geqslant 0$ en wisselt ze niet van teken: $f$ stijgt overal, zonder extrema.
    - opgave: |-
        Bepaal $k$ zodat de grafiek de $x$-as raakt. Ontbind dan $f(x)$.
      antwoord: |-
        $k = 3$; $f(x) = (x - 1)^2(x + 2)$
      uitwerking: |-
        De grafiek raakt de $x$-as in een extremum met waarde $0$. Het maximum in $-\sqrt{k/3}$ is $\frac{2k}{3}\sqrt{\frac{k}{3}} + 2 > 0$. Het minimum in $\sqrt{k/3}$ is $f\bigl(\sqrt{k/3}\bigr) = \frac{k}{3}\sqrt{\frac{k}{3}} - k\sqrt{\frac{k}{3}} + 2 = 2 - \frac{2k}{3}\sqrt{\frac{k}{3}}$. Dat is nul als $\bigl(\frac{k}{3}\bigr)^{3/2} = 1$, dus $k = 3$. Dan is $f(x) = x^3 - 3x + 2 = (x - 1)^2(x + 2)$, met een dubbele nulwaarde in $1$.
    - opgave: |-
        Voor welke $k$ heeft $f$ drie nulwaarden? En voor welke één?
      antwoord: |-
        drie voor $k > 3$; één voor $k < 3$
      uitwerking: |-
        Voor $k \leqslant 0$ stijgt $f$ overal: één nulwaarde. Voor $k > 0$ is het maximum positief. Is ook het minimum positief ($0 < k < 3$), dan snijdt de grafiek de $x$-as alleen links van het maximum: één nulwaarde. Is het minimum negatief ($k > 3$), dan snijdt ze drie keer. Voor $k = 3$ zijn er twee. Dus drie nulwaarden voor $k > 3$, één voor $k < 3$.

