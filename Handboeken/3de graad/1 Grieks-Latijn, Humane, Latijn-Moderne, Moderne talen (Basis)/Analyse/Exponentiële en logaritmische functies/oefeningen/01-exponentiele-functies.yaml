# Oefeningen van hoofdstuk 1. Zie oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer} Bereken of vereenvoudig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2^3 \cdot 2^4$
      antwoord: |-
        $2^7 = 128$
      uitwerking: |-
        $2^{3 + 4} = 2^7 = 128$.
    - opgave: |-
        $(3^2)^3$
      antwoord: |-
        $3^6 = 729$
      uitwerking: |-
        $3^{2 \cdot 3} = 3^6 = 729$.
    - opgave: |-
        $5^0$
      antwoord: |-
        1
      uitwerking: |-
        $1$.
    - opgave: |-
        $2^{-3}$
      antwoord: |-
        $\frac18$
      uitwerking: |-
        $\frac{1}{2^3} = \frac18$.
    - opgave: |-
        $\bigl(\frac23\bigr)^{-2}$
      antwoord: |-
        $\frac94$
      uitwerking: |-
        $\bigl(\frac32\bigr)^2 = \frac94$.
    - opgave: |-
        $1{,}2 \cdot 1{,}2 \cdot 1{,}2$
      antwoord: |-
        $1{,}728$
      uitwerking: |-
        $1{,}2^3 = 1{,}728$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Een blad papier is $0{,}1$ mm dik. Bij elke vouw verdubbelt de dikte.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe dik is het pakje na 1, 2, 3 en 10 vouwen?
      antwoord: |-
        $0{,}2$; $0{,}4$; $0{,}8$; $102{,}4$ mm
      uitwerking: |-
        $0{,}2$ mm, $0{,}4$ mm, $0{,}8$ mm, en na 10 vouwen $0{,}1 \cdot 2^{10} = 102{,}4$ mm.
    - opgave: |-
        Geef een formule voor de dikte $d(n)$ na $n$ vouwen.
      antwoord: |-
        $d(n) = 0{,}1 \cdot 2^n$
      uitwerking: |-
        $d(n) = 0{,}1 \cdot 2^n$ (in mm).
    - opgave: |-
        Hoeveel keer zou je moeten vouwen om meer dan 1 km dik te zijn? Zoek met je rekentoestel.
      antwoord: |-
        24
      uitwerking: |-
        1 km is $10^7 \cdot 0{,}1$ mm, dus $2^n > 10^7$. $2^{23} \approx 8{,}4$ miljoen, $2^{24} \approx 16{,}8$ miljoen: 24 keer.

- id: h1-k-macht
  soort: kort
  opgave: |-
    Schrijf de eerste drie als een macht met een rationale exponent of als een wortel. Bereken de laatste twee zonder rekentoestel.
  lijst: reeks
  kolommen: 5
  delen:
    - opgave: |-
        $\sqrt[5]{7^2}$
      antwoord: |-
        $7^{\frac25}$
      uitwerking: |-
        De wortel wordt de noemer van de exponent: $\sqrt[5]{7^2} = 7^{\frac25}$.
    - opgave: |-
        $\dfrac{1}{\sqrt{3}}$
      antwoord: |-
        $3^{-\frac12}$
      uitwerking: |-
        $\dfrac{1}{\sqrt{3}} = \dfrac{1}{3^{\frac12}} = 3^{-\frac12}$.
    - opgave: |-
        $5^{\frac34}$
      antwoord: |-
        $\sqrt[4]{5^3}$
      uitwerking: |-
        De noemer 4 is de wortel, de teller 3 de macht: $5^{\frac34} = \sqrt[4]{5^3} = \sqrt[4]{125}$.
    - opgave: |-
        $27^{\frac43}$
      antwoord: |-
        81
      uitwerking: |-
        Eerst de derdemachtswortel: $27^{\frac43} = \bigl(\sqrt[3]{27}\bigr)^4 = 3^4 = 81$.
    - opgave: |-
        $\bigl(\frac49\bigr)^{-\frac32}$
      antwoord: |-
        $\frac{27}{8}$
      uitwerking: |-
        Het minteken keert de breuk om: $\bigl(\frac49\bigr)^{-\frac32} = \bigl(\frac94\bigr)^{\frac32} = \Bigl(\sqrt{\tfrac94}\Bigr)^3 = \bigl(\frac32\bigr)^3 = \frac{27}{8}$.

- id: h1-k-product
  soort: kort
  opgave: |-
    Bereken zonder rekentoestel, of schrijf als één macht van $x$ (met $x > 0$).
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $5^{0{,}7} \cdot 5^{1{,}3}$
      antwoord: |-
        25
      uitwerking: |-
        Zelfde grondtal, dus exponenten optellen: $5^{0{,}7 + 1{,}3} = 5^2 = 25$.
    - opgave: |-
        $x^{\frac12} \cdot x^{\frac34}$
      antwoord: |-
        $x^{\frac54}$
      uitwerking: |-
        Exponenten optellen, op dezelfde noemer: $x^{\frac24 + \frac34} = x^{\frac54}$.
    - opgave: |-
        $7^{\frac13} \cdot 7^{-\frac43}$
      antwoord: |-
        $\frac17$
      uitwerking: |-
        $7^{\frac13 - \frac43} = 7^{-1} = \frac17$.

- id: h1-k-quotient
  soort: kort
  opgave: |-
    Bereken zonder rekentoestel, of schrijf als één macht van $x$ (met $x > 0$).
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{6^{\frac52}}{6^{\frac12}}$
      antwoord: |-
        36
      uitwerking: |-
        Exponenten aftrekken: $6^{\frac52 - \frac12} = 6^2 = 36$.
    - opgave: |-
        $\dfrac{x}{\sqrt[4]{x}}$
      antwoord: |-
        $x^{\frac34}$
      uitwerking: |-
        $\dfrac{x^1}{x^{\frac14}} = x^{1 - \frac14} = x^{\frac34}$.
    - opgave: |-
        $\dfrac{1}{\sqrt[5]{x^2}}$
      antwoord: |-
        $x^{-\frac25}$
      uitwerking: |-
        $\sqrt[5]{x^2} = x^{\frac25}$, en één gedeeld door een macht is de macht met de tegengestelde exponent: $\dfrac{1}{x^{\frac25}} = x^{-\frac25}$.

- id: h1-k-machtmacht
  soort: kort
  opgave: |-
    Bereken zonder rekentoestel, of schrijf als één macht van $x$ (met $x > 0$).
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\bigl(9^{\frac34}\bigr)^{\frac23}$
      antwoord: |-
        3
      uitwerking: |-
        Exponenten vermenigvuldigen: $9^{\frac34 \cdot \frac23} = 9^{\frac12} = \sqrt9 = 3$.
    - opgave: |-
        $\sqrt[3]{x^{\frac34}}$
      antwoord: |-
        $x^{\frac14}$
      uitwerking: |-
        Een derdemachtswortel is de macht $\frac13$: $\bigl(x^{\frac34}\bigr)^{\frac13} = x^{\frac34 \cdot \frac13} = x^{\frac14}$.
    - opgave: |-
        $\bigl(8^{-\frac12}\bigr)^{\frac43}$
      antwoord: |-
        $\frac14$
      uitwerking: |-
        $8^{-\frac12 \cdot \frac43} = 8^{-\frac23} = \dfrac{1}{\bigl(\sqrt[3]{8}\bigr)^2} = \dfrac{1}{4}$.

- id: h1-k-prodgrondtal
  soort: kort
  opgave: |-
    Bereken zonder rekentoestel, of vereenvoudig (met $x > 0$).
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3^{\frac12} \cdot 12^{\frac12}$
      antwoord: |-
        6
      uitwerking: |-
        Zelfde exponent, dus grondtallen vermenigvuldigen: $(3 \cdot 12)^{\frac12} = 36^{\frac12} = 6$.
    - opgave: |-
        $5^{\frac23} \cdot 25^{\frac23}$
      antwoord: |-
        25
      uitwerking: |-
        $(5 \cdot 25)^{\frac23} = 125^{\frac23} = \bigl(\sqrt[3]{125}\bigr)^2 = 5^2 = 25$.
    - opgave: |-
        $\bigl(8x^6\bigr)^{\frac13}$
      antwoord: |-
        $2x^2$
      uitwerking: |-
        Verdeel de exponent over de factoren: $8^{\frac13} \cdot \bigl(x^6\bigr)^{\frac13} = 2 \cdot x^{6 \cdot \frac13} = 2x^2$.

- id: h1-k-quotgrondtal
  soort: kort
  opgave: |-
    Bereken zonder rekentoestel, of vereenvoudig (met $x > 0$).
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{80^{\frac14}}{5^{\frac14}}$
      antwoord: |-
        2
      uitwerking: |-
        Zelfde exponent, dus grondtallen delen: $\bigl(\frac{80}{5}\bigr)^{\frac14} = 16^{\frac14} = 2$.
    - opgave: |-
        $\dfrac{2^{\frac35}}{64^{\frac35}}$
      antwoord: |-
        $\frac18$
      uitwerking: |-
        $\bigl(\frac{2}{64}\bigr)^{\frac35} = \bigl(\frac{1}{32}\bigr)^{\frac35} = \Bigl(\sqrt[5]{\tfrac{1}{32}}\Bigr)^3 = \bigl(\frac12\bigr)^3 = \frac18$.
    - opgave: |-
        $\Bigl(\dfrac{27}{x^3}\Bigr)^{\frac23}$
      antwoord: |-
        $\dfrac{9}{x^2}$
      uitwerking: |-
        $\dfrac{27^{\frac23}}{\bigl(x^3\bigr)^{\frac23}} = \dfrac{\bigl(\sqrt[3]{27}\bigr)^2}{x^2} = \dfrac{9}{x^2}$.

- id: h1-machten
  soort: kort
  opgave: |-
    Bereken zonder rekentoestel, of schrijf als één macht van $x$ (met $x > 0$).
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $25^{\frac32}$
      antwoord: |-
        125
      uitwerking: |-
        $25^{\frac32} = \bigl(\sqrt{25}\bigr)^3 = 5^3 = 125$.
    - opgave: |-
        $16^{-\frac14}$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        $16^{-\frac14} = \dfrac{1}{16^{\frac14}} = \dfrac{1}{\sqrt[4]{16}} = \dfrac12$.
    - opgave: |-
        $x^{\frac23} \cdot x^{\frac14}$
      antwoord: |-
        $x^{\frac{11}{12}}$
      uitwerking: |-
        Exponenten optellen, op dezelfde noemer: $x^{\frac{8}{12} + \frac{3}{12}} = x^{\frac{11}{12}}$.
    - opgave: |-
        $\dfrac{x^2}{\sqrt{x}}$
      antwoord: |-
        $x^{\frac32}$
      uitwerking: |-
        $\dfrac{x^2}{x^{\frac12}} = x^{2 - \frac12} = x^{\frac32}$.

- id: h1-k-vergelijken
  soort: kort
  opgave: |-
    Welk getal is het grootst? Antwoord zonder rekentoestel.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $1{,}5^{0{,}3}$ of $1{,}5^{0{,}29}$
      antwoord: |-
        $1{,}5^{0{,}3}$
      uitwerking: |-
        Het grondtal $1{,}5 > 1$, dus $1{,}5^x$ is stijgend. Omdat $0{,}3 > 0{,}29$, is $1{,}5^{0{,}3} > 1{,}5^{0{,}29}$.
    - opgave: |-
        $\bigl(\frac23\bigr)^{\sqrt2}$ of $\bigl(\frac23\bigr)^{1{,}5}$
      antwoord: |-
        $\bigl(\frac23\bigr)^{\sqrt2}$
      uitwerking: |-
        Het grondtal ligt tussen 0 en 1, dus de functie is dalend. Omdat $\sqrt2 \approx 1{,}414 < 1{,}5$, is $\bigl(\frac23\bigr)^{\sqrt2} > \bigl(\frac23\bigr)^{1{,}5}$.
    - opgave: |-
        $0{,}9^{10}$ of $1$
      antwoord: |-
        $1$
      uitwerking: |-
        Schrijf $1 = 0{,}9^0$. De functie $0{,}9^x$ is dalend en $10 > 0$, dus $0{,}9^{10} < 0{,}9^0 = 1$.
    - opgave: |-
        $4^{-2}$ of $2^{-3}$
      antwoord: |-
        $2^{-3}$
      uitwerking: |-
        Breng beide naar grondtal 2: $4^{-2} = \bigl(2^2\bigr)^{-2} = 2^{-4}$. Omdat $2^x$ stijgt en $-4 < -3$, is $2^{-4} < 2^{-3}$.

- id: h1-k-grafiek
  soort: kort
  opgave: |-
    Schets de grafiek en geef het beeld van het punt $(0, 1)$ van de grafiek van $2^x$, $\bigl(\frac12\bigr)^x$ of $3^x$. Geef het domein, het bereik en de asymptoot.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = 2^x - 4$
      antwoord: |-
        $(0, -3)$; $\R$; $\left]-4, +\infty\right[$; $y = -4$
      uitwerking: |-
        De grafiek van $2^x$ schuift 4 naar onder: $(0, 1) \mapsto (0, -3)$. Asymptoot $y = -4$, $\dom f = \R$, $\ber f = \left]-4, +\infty\right[$.
        \figuren{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-4}{1}{4}
          \draw[grijs,dashed] (-3,-4) -- (3.3,-4);
          \kromme{-3}{3}{2^(\x)-4}
          \vol{(0,-3)}
        \end{tikzpicture}}
    - opgave: |-
        $g(x) = \bigl(\frac12\bigr)^{x + 1} + 1$
      antwoord: |-
        $(-1, 2)$; $\R$; $\left]1, +\infty\right[$; $y = 1$
      uitwerking: |-
        De dalende grafiek van $\bigl(\frac12\bigr)^x$ schuift 1 naar links en 1 naar boven: $(0, 1) \mapsto (-1, 2)$. Asymptoot $y = 1$, $\dom g = \R$, $\ber g = \left]1, +\infty\right[$.
        \figuren{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-1}{1}{5}
          \draw[grijs,dashed] (-3,1) -- (3.3,1);
          \kromme{-3}{3}{0.5^(\x+1)+1}
          \vol{(-1,2)}
        \end{tikzpicture}}
    - opgave: |-
        $h(x) = 2 - 3^x$
      antwoord: |-
        $(0, 1)$; $\R$; $\left]-\infty, 2\right[$; $y = 2$
      uitwerking: |-
        $h(x) = -3^x + 2$: de grafiek van $3^x$ spiegelen om de $x$-as en dan 2 naar boven. $(0, 1) \mapsto (0, -1) \mapsto (0, 1)$. Asymptoot $y = 2$, $\dom h = \R$, $\ber h = \left]-\infty, 2\right[$: de grafiek ligt onder de asymptoot.
        \figuren{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-4}{1}{3}
          \draw[grijs,dashed] (-3,2) -- (3.3,2);
          \kromme{-3}{1.6}{2-3^(\x)}
          \vol{(0,1)}
        \end{tikzpicture}}

- id: h1-vergelijking
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3^{2x - 1} = 27$
      antwoord: |-
        $x = 2$
      uitwerking: |-
        $3^{2x - 1} = 3^3$, dus $2x - 1 = 3$ en $x = 2$.
    - opgave: |-
        $4^x = 8$
      antwoord: |-
        $x = \frac32$
      uitwerking: |-
        Schrijf beide leden als macht van 2: $(2^2)^x = 2^3$, dus $2^{2x} = 2^3$. Dan is $2x = 3$ en $x = \frac32$.
    - opgave: |-
        $\bigl(\frac12\bigr)^x = 16$
      antwoord: |-
        $x = -4$
      uitwerking: |-
        $\bigl(\frac12\bigr)^x = (2^{-1})^x = 2^{-x}$ en $16 = 2^4$. Dus $-x = 4$ en $x = -4$.

- id: h1-k-tweekanten
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $25^x = 125^{x - 2}$
      antwoord: |-
        $x = 6$
      uitwerking: |-
        Beide als macht van 5: $5^{2x} = 5^{3(x - 2)} = 5^{3x - 6}$. Exponenten gelijk: $2x = 3x - 6$, dus $x = 6$.
    - opgave: |-
        $\bigl(\frac14\bigr)^x = 8^{x + 5}$
      antwoord: |-
        $x = -3$
      uitwerking: |-
        Beide als macht van 2: $2^{-2x} = 2^{3x + 15}$. Dan is $-2x = 3x + 15$, dus $-5x = 15$ en $x = -3$.
    - opgave: |-
        $3^{x^2} = 9^{x + 4}$
      antwoord: |-
        $x = 4$ of $x = -2$
      uitwerking: |-
        $9^{x + 4} = 3^{2x + 8}$, dus $x^2 = 2x + 8$. Dan is $x^2 - 2x - 8 = (x - 4)(x + 2) = 0$: $x = 4$ of $x = -2$.

- id: h1-k-intrest
  soort: kort
  opgave: |-
    Je zet $3500$ euro op een spaarrekening met $2{,}4$\,\% intrest per jaar, die elk jaar wordt bijgeteld.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel staat er na 6 jaar op de rekening?
      antwoord: |-
        $\approx 4035{,}23$ euro
      uitwerking: |-
        Groeifactor $1 + \frac{2{,}4}{100} = 1{,}024$, dus $K(t) = 3500 \cdot 1{,}024^t$ en $K(6) = 3500 \cdot 1{,}024^6 \approx 4035{,}23$ euro.
    - opgave: |-
        Hoeveel is dat meer dan met enkelvoudige intrest?
      antwoord: |-
        $\approx 31{,}23$ euro meer
      uitwerking: |-
        Enkelvoudig komt er elk jaar $0{,}024 \cdot 3500 = 84$ euro bij: na 6 jaar $3500 + 6 \cdot 84 = 4004$ euro. Het verschil is $4035{,}23 - 4004 \approx 31{,}23$ euro.
    - opgave: |-
        Hoeveel had je 3 jaar geleden moeten storten om nu $3500$ euro te hebben?
      antwoord: |-
        $\approx 3259{,}63$ euro
      uitwerking: |-
        Drie jaar terug in de tijd is $t = -3$: $K_0 = 3500 \cdot 1{,}024^{-3} = \dfrac{3500}{1{,}024^3} \approx 3259{,}63$ euro. Controle: $3259{,}63 \cdot 1{,}024^3 \approx 3500$.

- id: h1-k-verval
  soort: kort
  opgave: |-
    Een medicijn heeft in het bloed een halveringstijd van 3 uur. Iemand neemt $400$ mg.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel is er na 8 uur nog over?
      antwoord: |-
        $\approx 63{,}0$ mg
      uitwerking: |-
        Na $t$ uur zijn er $\frac{t}{3}$ halveringstijden voorbij: $M(t) = 400 \cdot \bigl(\frac12\bigr)^{\frac{t}{3}}$. Dan is $M(8) = 400 \cdot 0{,}5^{\frac83} \approx 63{,}0$ mg.
    - opgave: |-
        Met hoeveel procent daalt de hoeveelheid per uur?
      antwoord: |-
        $\approx 20{,}6$\,\%
      uitwerking: |-
        De groeifactor per uur is $0{,}5^{\frac13} \approx 0{,}7937$. Elk uur blijft $79{,}4$\,\% over: een daling van ongeveer $20{,}6$\,\% per uur.
    - opgave: |-
        Na hoeveel uur is er nog $50$ mg? Reken exact.
      antwoord: |-
        na 9 uur
      uitwerking: |-
        $400 \cdot \bigl(\frac12\bigr)^{\frac{t}{3}} = 50 \iff \bigl(\frac12\bigr)^{\frac{t}{3}} = \frac18 = \bigl(\frac12\bigr)^3$. Exponenten gelijkstellen: $\frac{t}{3} = 3$, dus $t = 9$ uur (drie halveringstijden).

- id: h1-k-daling
  soort: kort
  opgave: |-
    Een kudde van $1200$ rendieren wordt elk jaar $7$\,\% kleiner.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de groeifactor en het model.
      antwoord: |-
        $0{,}93$; $R(t) = 1200 \cdot 0{,}93^t$
      uitwerking: |-
        Er verdwijnt $7$\,\%, dus er blijft $93$\,\% over: de groeifactor is $1 - \frac{7}{100} = 0{,}93$, en $R(t) = 1200 \cdot 0{,}93^t$ met $t$ in jaar.
    - opgave: |-
        Hoeveel rendieren zijn er na 5 jaar?
      antwoord: |-
        ongeveer 835
      uitwerking: |-
        $R(5) = 1200 \cdot 0{,}93^5 \approx 834{,}8$: ongeveer 835 rendieren.
    - opgave: |-
        Met hoeveel procent is de kudde in die 5 jaar afgenomen?
      antwoord: |-
        ongeveer $30{,}4$\,\%
      uitwerking: |-
        $0{,}93^5 \approx 0{,}696$: er blijft $69{,}6$\,\% over, dus de kudde is met ongeveer $30{,}4$\,\% afgenomen. Dat is minder dan $5 \cdot 7\,\% = 35$\,\%.

- id: h1-groei
  soort: kort
  opgave: |-
    Een stad heeft $40\,000$ inwoners en groeit met $2$\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef het model en het aantal inwoners na 15 jaar.
      antwoord: |-
        $N(t) = 40\,000 \cdot 1{,}02^t$; ongeveer $53\,800$
      uitwerking: |-
        Beginwaarde $40\,000$, groeifactor $1 + \frac{2}{100} = 1{,}02$: $N(t) = 40\,000 \cdot 1{,}02^t$. Dan is $N(15) = 40\,000 \cdot 1{,}02^{15} \approx 53\,835$, ongeveer $53\,800$ inwoners.
    - opgave: |-
        Met hoeveel procent groeit de stad per 10 jaar?
      antwoord: |-
        ongeveer $21{,}9$\,\%
      uitwerking: |-
        De groeifactor per 10 jaar is $1{,}02^{10} \approx 1{,}219$: ongeveer $21{,}9$\,\% per 10 jaar. Dat is meer dan $10 \cdot 2$\,\%, omdat ook de groei zelf weer groeit.

- id: h1-k-verdubbeltijd
  soort: kort
  opgave: |-
    Het aantal volgers van een videokanaal verdubbelt elke 5 weken. Nu zijn er $1200$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel volgers zijn er na 12 weken?
      antwoord: |-
        ongeveer 6334
      uitwerking: |-
        Na $t$ weken zijn er $\frac{t}{5}$ verdubbelingstijden voorbij: $V(t) = 1200 \cdot 2^{\frac{t}{5}}$. Dan is $V(12) = 1200 \cdot 2^{2{,}4} \approx 6334$ volgers.
    - opgave: |-
        Met hoeveel procent groeit het aantal per week?
      antwoord: |-
        ongeveer $14{,}9$\,\%
      uitwerking: |-
        De groeifactor per week is $2^{\frac15} \approx 1{,}1487$: ongeveer $14{,}9$\,\% per week. Controle: $1{,}1487^5 \approx 2$.

- id: h1-e
  soort: kort
  opgave: |-
    Een kapitaal van $5000$ euro groeit continu met $4$\,\% per jaar. Hoeveel is het na 12 jaar? Hoeveel scheelt dat met $4$\,\% per jaar, jaarlijks bijgeteld?
  antwoord: |-
    $\approx 8080{,}37$ euro; $\approx 75$ euro meer
  uitwerking: |-
    Continu: $K(t) = 5000\,\e^{0{,}04\,t}$, dus $K(12) = 5000\,\e^{0{,}48} \approx 8080{,}37$ euro. Jaarlijks: $5000 \cdot 1{,}04^{12} \approx 8005{,}16$ euro. Continu levert dus ongeveer $75$ euro meer op.

- id: h1-k-e
  soort: kort
  opgave: |-
    Een populatie insecten telt $800$ dieren en groeit continu: $P(t) = 800\,\e^{0{,}12\,t}$, met $t$ in weken.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel insecten zijn er na 5 weken?
      antwoord: |-
        ongeveer 1458
      uitwerking: |-
        $P(5) = 800\,\e^{0{,}6} \approx 1457{,}7$: ongeveer 1458 insecten.
    - opgave: |-
        Met hoeveel procent groeit de populatie per week?
      antwoord: |-
        $\approx 12{,}75$\,\%
      uitwerking: |-
        $\e^{0{,}12\,t} = \bigl(\e^{0{,}12}\bigr)^t$, dus de groeifactor per week is $\e^{0{,}12} \approx 1{,}1275$: ongeveer $12{,}75$\,\% per week, iets meer dan $12$\,\%.
    - opgave: |-
        Na hoeveel volle weken is de populatie voor het eerst meer dan verdubbeld? Zoek met je rekentoestel.
      antwoord: |-
        na 6 weken
      uitwerking: |-
        Verdubbeld is meer dan $1600$ dieren. $P(5) \approx 1458$ en $P(6) = 800\,\e^{0{,}72} \approx 1644$: na 6 weken.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3 (zelfde volgorde als in het hoofdstuk)
#----------------------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: rationale exponenten
  opgave: |-
    Bereken zonder rekentoestel.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $16^{\frac34}$
      antwoord: |-
        8
      uitwerking: |-
        $16^{\frac34} = \bigl(\sqrt[4]{16}\bigr)^3 = 2^3 = 8$.
    - opgave: |-
        $32^{-\frac25}$
      antwoord: |-
        $\frac14$
      uitwerking: |-
        $32^{-\frac25} = \dfrac{1}{\bigl(\sqrt[5]{32}\bigr)^2} = \dfrac{1}{2^2} = \dfrac14$.
    - opgave: |-
        $\bigl(\frac19\bigr)^{-\frac12}$
      antwoord: |-
        3
      uitwerking: |-
        Het minteken keert de breuk om: $\bigl(\frac19\bigr)^{-\frac12} = 9^{\frac12} = \sqrt9 = 3$.
    - opgave: |-
        $1000^{\frac23}$
      antwoord: |-
        100
      uitwerking: |-
        $1000^{\frac23} = \bigl(\sqrt[3]{1000}\bigr)^2 = 10^2 = 100$.
    - opgave: |-
        $81^{\frac34}$
      antwoord: |-
        27
      uitwerking: |-
        $81^{\frac34} = \bigl(\sqrt[4]{81}\bigr)^3 = 3^3 = 27$.
    - opgave: |-
        $4^{-\frac32}$
      antwoord: |-
        $\frac18$
      uitwerking: |-
        $4^{-\frac32} = \dfrac{1}{\bigl(\sqrt4\bigr)^3} = \dfrac{1}{2^3} = \dfrac18$.
    - opgave: |-
        $\bigl(\frac{8}{27}\bigr)^{\frac23}$
      antwoord: |-
        $\frac49$
      uitwerking: |-
        $\bigl(\frac{8}{27}\bigr)^{\frac23} = \Bigl(\sqrt[3]{\tfrac{8}{27}}\Bigr)^2 = \bigl(\frac23\bigr)^2 = \frac49$.
    - opgave: |-
        $0{,}01^{-\frac12}$
      antwoord: |-
        10
      uitwerking: |-
        $0{,}01 = 10^{-2}$, dus $0{,}01^{-\frac12} = 10^{(-2) \cdot (-\frac12)} = 10^1 = 10$.
    - opgave: |-
        $125^{-\frac13}$
      antwoord: |-
        $\frac15$
      uitwerking: |-
        $125^{-\frac13} = \dfrac{1}{\sqrt[3]{125}} = \dfrac15$.
    - opgave: |-
        $64^{\frac56}$
      antwoord: |-
        32
      uitwerking: |-
        $64^{\frac56} = \bigl(\sqrt[6]{64}\bigr)^5 = 2^5 = 32$.
    - opgave: |-
        $2^{\frac12} \cdot 8^{\frac12}$
      antwoord: |-
        4
      uitwerking: |-
        Zelfde exponent: $2^{\frac12} \cdot 8^{\frac12} = (2 \cdot 8)^{\frac12} = \sqrt{16} = 4$.
    - opgave: |-
        $\dfrac{3^{\frac52}}{3^{\frac12}}$
      antwoord: |-
        9
      uitwerking: |-
        Zelfde grondtal: $3^{\frac52 - \frac12} = 3^2 = 9$.

- id: h1-o10
  soort: opdracht
  niveau: 1
  thema: |-
    drill: groeifactor en groeipercentage
  opgave: |-
    Geef bij een verandering per tijdseenheid de groeifactor. Geef bij een groeifactor de verandering in procent, en zeg of het om groei of verval gaat.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        een stijging van $7$\,\%
      antwoord: |-
        $1{,}07$
      uitwerking: |-
        $a = 1 + \frac{7}{100} = 1{,}07$.
    - opgave: |-
        een daling van $12$\,\%
      antwoord: |-
        $0{,}88$
      uitwerking: |-
        $a = 1 - \frac{12}{100} = 0{,}88$.
    - opgave: |-
        groeifactor $1{,}035$
      antwoord: |-
        $+3{,}5$\,\%, groei
      uitwerking: |-
        $1{,}035 = 1 + 0{,}035$: een stijging van $3{,}5$\,\%. Groei, want $a > 1$.
    - opgave: |-
        groeifactor $0{,}6$
      antwoord: |-
        $-40$\,\%, verval
      uitwerking: |-
        $0{,}6 = 1 - 0{,}4$: een daling van $40$\,\%. Verval, want $0 < a < 1$.
    - opgave: |-
        een verdubbeling
      antwoord: |-
        $2$
      uitwerking: |-
        $a = 2$: een stijging van $100$\,\%.
    - opgave: |-
        groeifactor $1{,}4$
      antwoord: |-
        $+40$\,\%, groei
      uitwerking: |-
        $1{,}4 = 1 + 0{,}4$: een stijging van $40$\,\%, groei.
    - opgave: |-
        een daling van $0{,}5$\,\%
      antwoord: |-
        $0{,}995$
      uitwerking: |-
        $a = 1 - \frac{0{,}5}{100} = 0{,}995$.
    - opgave: |-
        groeifactor $2{,}5$
      antwoord: |-
        $+150$\,\%, groei
      uitwerking: |-
        $2{,}5 = 1 + 1{,}5$: een stijging van $150$\,\%, groei. Een groeifactor groter dan 2 is meer dan een verdubbeling.
    - opgave: |-
        een halvering
      antwoord: |-
        $0{,}5$
      uitwerking: |-
        $a = \frac12 = 0{,}5$: een daling van $50$\,\%.
    - opgave: |-
        een stijging van $250$\,\%
      antwoord: |-
        $3{,}5$
      uitwerking: |-
        $a = 1 + \frac{250}{100} = 3{,}5$. Let op: niet $2{,}5$, want het oude bedrag blijft er ook.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: rekenregels
  opgave: |-
    Schrijf als één macht van $x$ (met $x > 0$).
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\sqrt[3]{x} \cdot \sqrt{x}$
      antwoord: |-
        $x^{\frac56}$
      uitwerking: |-
        $x^{\frac13} \cdot x^{\frac12} = x^{\frac26 + \frac36} = x^{\frac56}$.
    - opgave: |-
        $\dfrac{1}{x\sqrt{x}}$
      antwoord: |-
        $x^{-\frac32}$
      uitwerking: |-
        $x\sqrt{x} = x^{1 + \frac12} = x^{\frac32}$, dus $\dfrac{1}{x^{\frac32}} = x^{-\frac32}$.
    - opgave: |-
        $\sqrt{x \cdot \sqrt[3]{x}}$
      antwoord: |-
        $x^{\frac23}$
      uitwerking: |-
        Binnen de wortel: $x^{1 + \frac13} = x^{\frac43}$. Dan $\bigl(x^{\frac43}\bigr)^{\frac12} = x^{\frac23}$.
    - opgave: |-
        $\bigl(x^{\frac23}\bigr)^{\frac34}$
      antwoord: |-
        $x^{\frac12}$
      uitwerking: |-
        Exponenten vermenigvuldigen: $x^{\frac23 \cdot \frac34} = x^{\frac12}$.
    - opgave: |-
        $\dfrac{\sqrt[4]{x^3}}{x}$
      antwoord: |-
        $x^{-\frac14}$
      uitwerking: |-
        $\dfrac{x^{\frac34}}{x^1} = x^{\frac34 - 1} = x^{-\frac14}$.
    - opgave: |-
        $x^{-\frac12} \cdot x^{\frac32}$
      antwoord: |-
        $x$
      uitwerking: |-
        $x^{-\frac12 + \frac32} = x^1 = x$.
    - opgave: |-
        $\sqrt[3]{x^2} \cdot \sqrt[6]{x^5}$
      antwoord: |-
        $x^{\frac32}$
      uitwerking: |-
        $x^{\frac23} \cdot x^{\frac56} = x^{\frac46 + \frac56} = x^{\frac96} = x^{\frac32}$.
    - opgave: |-
        $\dfrac{1}{\sqrt[5]{x^2}}$
      antwoord: |-
        $x^{-\frac25}$
      uitwerking: |-
        $\dfrac{1}{x^{\frac25}} = x^{-\frac25}$.
    - opgave: |-
        $\dfrac{(\sqrt{x})^5}{x^3}$
      antwoord: |-
        $x^{-\frac12}$
      uitwerking: |-
        $(\sqrt{x})^5 = x^{\frac52}$, dus $x^{\frac52 - 3} = x^{-\frac12}$.
    - opgave: |-
        $\sqrt[4]{x^2\sqrt{x}}$
      antwoord: |-
        $x^{\frac58}$
      uitwerking: |-
        Binnen de wortel: $x^{2 + \frac12} = x^{\frac52}$. Dan $\bigl(x^{\frac52}\bigr)^{\frac14} = x^{\frac58}$.

- id: h1-o12
  soort: opdracht
  niveau: 1
  thema: |-
    grafieken kiezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.55cm,font=\scriptsize]
        \rooster{-3}{1}{3}{-1}{1}{5}
        \kromme{-3}{1.46}{3^(\x)}
        \kromme{-2.32}{3}{0.5^(\x)}
        \kromme{-3}{3}{1.5^(\x)}
        \kromme{-1}{3}{0.2^(\x)}
        \node[above,text=accent] at (1.46,5) {A};
        \node[above,text=accent] at (-2.32,5) {B};
        \node[right,text=accent] at (3,3.375) {C};
        \node[above,text=accent] at (-1,5) {D};
      \end{tikzpicture}
  opgave: |-
    Welke grafiek hoort bij welk voorschrift? Controleer je keuze met een punt dat je afleest.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = 0{,}5^x$
      antwoord: |-
        B
      uitwerking: |-
        Dalend, want $0{,}5 < 1$. Twee dalende grafieken: B en D. Voor $x = -1$ is $0{,}5^{-1} = 2$: dat is B.
    - opgave: |-
        $y = 3^x$
      antwoord: |-
        A
      uitwerking: |-
        Stijgend, en het steilst: voor $x = 1$ is $y = 3$. Dat is A.
    - opgave: |-
        $y = 0{,}2^x$
      antwoord: |-
        D
      uitwerking: |-
        Dalend en het steilst links: $0{,}2^{-1} = 5$. Dat is D.
    - opgave: |-
        $y = 1{,}5^x$
      antwoord: |-
        C
      uitwerking: |-
        Stijgend, maar trager dan $3^x$: voor $x = 2$ is $1{,}5^2 = 2{,}25$. Dat is C.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    drill: exponentiële vergelijkingen
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $5^{x^2} = 625$
      antwoord: |-
        $x = \pm 2$
      uitwerking: |-
        $5^{x^2} = 5^4$, dus $x^2 = 4$ en $x = 2$ of $x = -2$.
    - opgave: |-
        $9^{x} = 3^{x + 3}$
      antwoord: |-
        $x = 3$
      uitwerking: |-
        $9^x = (3^2)^x = 3^{2x}$, dus $3^{2x} = 3^{x + 3}$. Dan is $2x = x + 3$ en $x = 3$.
    - opgave: |-
        $2^{x} \cdot 4 = \sqrt{2}$
      antwoord: |-
        $x = -\frac32$
      uitwerking: |-
        $2^x \cdot 2^2 = 2^{x + 2}$ en $\sqrt2 = 2^{\frac12}$. Dus $x + 2 = \frac12$ en $x = -\frac32$.
    - opgave: |-
        $2^{x} = \frac{1}{32}$
      antwoord: |-
        $x = -5$
      uitwerking: |-
        $\frac{1}{32} = \frac{1}{2^5} = 2^{-5}$, dus $x = -5$.
    - opgave: |-
        $10^{2x - 1} = 0{,}001$
      antwoord: |-
        $x = -1$
      uitwerking: |-
        $0{,}001 = 10^{-3}$, dus $2x - 1 = -3$ en $x = -1$.
    - opgave: |-
        $\bigl(\frac13\bigr)^{x} = \sqrt[3]{9}$
      antwoord: |-
        $x = -\frac23$
      uitwerking: |-
        $\bigl(\frac13\bigr)^x = 3^{-x}$ en $\sqrt[3]{9} = \sqrt[3]{3^2} = 3^{\frac23}$. Dus $-x = \frac23$ en $x = -\frac23$.
    - opgave: |-
        $8^{x} = 4^{x + 1}$
      antwoord: |-
        $x = 2$
      uitwerking: |-
        Alles als macht van 2: $2^{3x} = 2^{2(x + 1)}$. Dus $3x = 2x + 2$ en $x = 2$.
    - opgave: |-
        $25^{x} = \frac15$
      antwoord: |-
        $x = -\frac12$
      uitwerking: |-
        $5^{2x} = 5^{-1}$, dus $2x = -1$ en $x = -\frac12$.
    - opgave: |-
        $\e^{2x - 5} = 1$
      antwoord: |-
        $x = \frac52$
      uitwerking: |-
        $1 = \e^0$, dus $2x - 5 = 0$ en $x = \frac52$.
    - opgave: |-
        $7^{x^2 - x} = 49$
      antwoord: |-
        $x = 2$ of $x = -1$
      uitwerking: |-
        $7^{x^2 - x} = 7^2$, dus $x^2 - x - 2 = 0$. Ontbinden: $(x - 2)(x + 1) = 0$, dus $x = 2$ of $x = -1$.

- id: h1-o15
  soort: opdracht
  niveau: 1
  thema: |-
    samengestelde intrest
  opgave: |-
    Bereken het eindkapitaal bij samengestelde intrest.
  lijst: enumerate
  delen:
    - opgave: |-
        $5000$ euro aan $2$\,\% per jaar, gedurende 6 jaar.
      antwoord: |-
        $\approx 5630{,}81$ euro
      uitwerking: |-
        Groeifactor $1{,}02$: $5000 \cdot 1{,}02^6 \approx 5630{,}81$ euro.
    - opgave: |-
        $1200$ euro aan $4{,}5$\,\% per jaar, gedurende 10 jaar.
      antwoord: |-
        $\approx 1863{,}56$ euro
      uitwerking: |-
        Groeifactor $1{,}045$: $1200 \cdot 1{,}045^{10} \approx 1863{,}56$ euro.
    - opgave: |-
        $800$ euro aan $0{,}25$\,\% per maand, gedurende 3 jaar.
      antwoord: |-
        $\approx 875{,}24$ euro
      uitwerking: |-
        De tijdseenheid is hier een maand: groeifactor $1{,}0025$ en 3 jaar is 36 maanden. $800 \cdot 1{,}0025^{36} \approx 875{,}24$ euro.

- id: h1-o13
  soort: opdracht
  niveau: 1
  thema: |-
    Waar zit de fout? Rekenregels voor machten
  opgave: |-
    Elke berekening bevat een fout. Waar zit de fout? Verbeter.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2^3 \cdot 2^4 = 4^7$
      antwoord: |-
        $2^7 = 128$
      uitwerking: |-
        Bij gelijke grondtallen tel je de exponenten op, het grondtal blijft: $2^3 \cdot 2^4 = 2^7 = 128$, en niet $4^7 = 16\,384$.
    - opgave: |-
        $(x^2)^3 = x^5$
      antwoord: |-
        $x^6$
      uitwerking: |-
        Een macht van een macht: exponenten vermenigvuldigen. $(x^2)^3 = x^2 \cdot x^2 \cdot x^2 = x^6$.
    - opgave: |-
        $3 \cdot 2^x = 6^x$
      antwoord: |-
        niet te vereenvoudigen
      uitwerking: |-
        Alleen 2 staat tot de macht $x$, niet 3. Voor $x = 2$ is $3 \cdot 2^2 = 12$, maar $6^2 = 36$. Je kunt $3 \cdot 2^x$ niet korter schrijven.
    - opgave: |-
        $\sqrt{9 + 16} = 3 + 4$
      antwoord: |-
        $\sqrt{25} = 5$
      uitwerking: |-
        Een wortel (een macht met exponent $\frac12$) van een som is niet de som van de wortels: $\sqrt{9 + 16} = \sqrt{25} = 5$, niet $7$.
    - opgave: |-
        $2^{-3} = -8$
      antwoord: |-
        $\frac18$
      uitwerking: |-
        Een negatieve exponent geeft het omgekeerde, geen negatief getal: $2^{-3} = \frac{1}{2^3} = \frac18$.
    - opgave: |-
        $8^{\frac23} = \frac{16}{3}$
      antwoord: |-
        4
      uitwerking: |-
        Je vermenigvuldigt niet het grondtal met de exponent. $8^{\frac23} = \bigl(\sqrt[3]{8}\bigr)^2 = 2^2 = 4$.

- id: h1-o11
  soort: opdracht
  niveau: 1
  thema: |-
    exponentieel of niet, uit een tabel
  opgave: |-
    Vijf functies hebben deze functiewaarden.

    \figuren{\renewcommand{\arraystretch}{1.2}%
    \begin{tabular}{c|cccc}
    $x$ & $0$ & $1$ & $2$ & $3$ \\ \hline
    $f(x)$ & $3$ & $6$ & $12$ & $24$ \\
    $g(x)$ & $3$ & $6$ & $9$ & $12$ \\
    $h(x)$ & $80$ & $60$ & $45$ & $33{,}75$ \\
    $k(x)$ & $5$ & $6$ & $9$ & $14$ \\
    $m(x)$ & $1000$ & $100$ & $10$ & $1$
    \end{tabular}}
  lijst: enumerate
  delen:
    - opgave: |-
        Welke functies kunnen exponentieel zijn? Bereken de quotiënten van opeenvolgende waarden.
      antwoord: |-
        $f$, $h$ en $m$
      uitwerking: |-
        Bij een exponentiële functie is het quotiënt van opeenvolgende waarden constant (de groeifactor). $f$: telkens $2$. $g$: $2$, $1{,}5$, $1{,}33$, niet constant. $h$: telkens $0{,}75$. $k$: $1{,}2$, $1{,}5$, $1{,}56$, niet constant. $m$: telkens $0{,}1$. Dus $f$, $h$ en $m$.
    - opgave: |-
        Geef voor die functies een voorschrift van de vorm $b \cdot a^x$.
      antwoord: |-
        $3 \cdot 2^x$; $80 \cdot 0{,}75^x$; $1000 \cdot 0{,}1^x$
      uitwerking: |-
        De beginwaarde $b$ is de waarde in $x = 0$, de groeifactor $a$ het quotiënt. $f(x) = 3 \cdot 2^x$, $h(x) = 80 \cdot 0{,}75^x$ en $m(x) = 1000 \cdot 0{,}1^x$.
    - opgave: |-
        Bereken voor die functies de waarde in $x = -1$.
      antwoord: |-
        $\frac32$; $\frac{320}{3} \approx 106{,}7$; $10\,000$
      uitwerking: |-
        Eén stap terug is delen door de groeifactor. $f(-1) = 3 \cdot 2^{-1} = \frac32$, $h(-1) = \frac{80}{0{,}75} = \frac{320}{3} \approx 106{,}7$ en $m(-1) = \frac{1000}{0{,}1} = 10\,000$.
    - opgave: |-
        Bij $g$ is niet het quotiënt maar iets anders constant. Wat? Geef een voorschrift.
      antwoord: |-
        het verschil; $g(x) = 3x + 3$
      uitwerking: |-
        Het verschil van opeenvolgende waarden is telkens $3$: $g$ is lineair, $g(x) = 3x + 3$.

- id: h1-o14
  soort: opdracht
  niveau: 1
  thema: |-
    grondtal uit een punt
  opgave: |-
    De grafiek van $f(x) = a^x$ gaat door het gegeven punt. Bepaal het grondtal $a$.
  lijst: reeks
  kolommen: 5
  delen:
    - opgave: |-
        $(2, 9)$
      antwoord: |-
        $a = 3$
      uitwerking: |-
        $a^2 = 9$ en $a > 0$, dus $a = 3$.
    - opgave: |-
        $\bigl(3, \frac18\bigr)$
      antwoord: |-
        $a = \frac12$
      uitwerking: |-
        $a^3 = \frac18$, dus $a = \sqrt[3]{\tfrac18} = \frac12$.
    - opgave: |-
        $(-1, 4)$
      antwoord: |-
        $a = \frac14$
      uitwerking: |-
        $a^{-1} = \frac1a = 4$, dus $a = \frac14$.
    - opgave: |-
        $\bigl(\frac12, 5\bigr)$
      antwoord: |-
        $a = 25$
      uitwerking: |-
        $a^{\frac12} = \sqrt{a} = 5$, dus $a = 25$.
    - opgave: |-
        $\bigl(-2, \frac{1}{16}\bigr)$
      antwoord: |-
        $a = 4$
      uitwerking: |-
        $a^{-2} = \frac{1}{a^2} = \frac{1}{16}$, dus $a^2 = 16$ en $a = 4$.

- id: h1-o4
  soort: opdracht
  niveau: 2
  thema: |-
    grafieken en transformaties
  opgave: |-
    Beschrijf de transformatie vanuit $2^x$, $\bigl(\frac12\bigr)^x$ of $3^x$. Geef het domein, het bereik en de asymptoot, en eventuele nulwaarden.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = 4 - 2^x$
      antwoord: |-
        $\R$; $\left]-\infty, 4\right[$; $y = 4$; nulwaarde $2$
      uitwerking: |-
        Spiegelen om de $x$-as, dan 4 naar boven. $\dom f = \R$, $\ber f = \left]-\infty, 4\right[$, asymptoot $y = 4$. Nulwaarde: $4 - 2^x = 0 \iff 2^x = 2^2 \iff x = 2$.
    - opgave: |-
        $g(x) = 3^{-x}$
      antwoord: |-
        $\R$; $\left]0, +\infty\right[$; $y = 0$
      uitwerking: |-
        Spiegelen om de $y$-as: $g(x) = \bigl(\frac13\bigr)^x$, dalend. $\dom g = \R$, $\ber g = \left]0, +\infty\right[$, asymptoot $y = 0$. Geen nulwaarde: een macht is nooit nul.
    - opgave: |-
        $h(x) = 2^{x - 3} + 1$
      antwoord: |-
        $\R$; $\left]1, +\infty\right[$; $y = 1$
      uitwerking: |-
        3 naar rechts, 1 naar boven. $\dom h = \R$, $\ber h = \left]1, +\infty\right[$, asymptoot $y = 1$. Geen nulwaarde, want $h(x) > 1$.
    - opgave: |-
        $k(x) = 1 - \bigl(\frac12\bigr)^{x + 2}$
      antwoord: |-
        $\R$; $\left]-\infty, 1\right[$; $y = 1$; nulwaarde $-2$
      uitwerking: |-
        $\bigl(\frac12\bigr)^x$ schuift 2 naar links, spiegelt om de $x$-as en schuift 1 naar boven. $\dom k = \R$, $\ber k = \left]-\infty, 1\right[$, asymptoot $y = 1$. Nulwaarde: $\bigl(\frac12\bigr)^{x + 2} = 1 = \bigl(\frac12\bigr)^0$, dus $x = -2$.
    - opgave: |-
        $m(x) = 3 \cdot 2^x - 6$
      antwoord: |-
        $\R$; $\left]-6, +\infty\right[$; $y = -6$; nulwaarde $1$
      uitwerking: |-
        Verticaal uitrekken met factor 3, dan 6 naar onder. $\dom m = \R$, $\ber m = \left]-6, +\infty\right[$, asymptoot $y = -6$. Nulwaarde: $3 \cdot 2^x = 6 \iff 2^x = 2 \iff x = 1$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    halveringstijd
  opgave: |-
    Een radioactieve stof heeft een halveringstijd van 6 uur. Een labo heeft nu $80$ mg van de stof.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een model voor de hoeveelheid $H(t)$ na $t$ uur.
      antwoord: |-
        $H(t) = 80 \cdot \bigl(\frac12\bigr)^{\frac{t}{6}}$
      uitwerking: |-
        Na $t$ uur zijn er $\frac{t}{6}$ halveringstijden voorbij: $H(t) = 80 \cdot \bigl(\frac12\bigr)^{\frac{t}{6}}$, in mg.
    - opgave: |-
        Hoeveel is er na een dag over?
      antwoord: |-
        5 mg
      uitwerking: |-
        Een dag is 24 uur, of 4 halveringstijden: $H(24) = 80 \cdot \bigl(\frac12\bigr)^4 = \frac{80}{16} = 5$ mg.
    - opgave: |-
        Na hoeveel uur is er nog $10$ mg? Reken exact.
      antwoord: |-
        na 18 uur
      uitwerking: |-
        $80 \cdot \bigl(\frac12\bigr)^{\frac{t}{6}} = 10 \iff \bigl(\frac12\bigr)^{\frac{t}{6}} = \frac18 = \bigl(\frac12\bigr)^3$. Dus $\frac{t}{6} = 3$ en $t = 18$ uur.
    - opgave: |-
        Met hoeveel procent daalt de hoeveelheid per uur?
      antwoord: |-
        $\approx 10{,}9$\,\%
      uitwerking: |-
        Groeifactor per uur: $\bigl(\frac12\bigr)^{\frac16} \approx 0{,}8909$. Er blijft elk uur $89{,}1$\,\% over: een daling van ongeveer $10{,}9$\,\% per uur.
    - opgave: |-
        Hoeveel was er 9 uur geleden?
      antwoord: |-
        $\approx 226{,}3$ mg
      uitwerking: |-
        Terug in de tijd is $t = -9$: $H(-9) = 80 \cdot \bigl(\frac12\bigr)^{-\frac32} = 80 \cdot 2^{\frac32} = 80 \cdot 2\sqrt2 \approx 226{,}3$ mg.

- id: h1-o22
  soort: opdracht
  niveau: 2
  thema: |-
    groeifactor uit twee waarden
  opgave: |-
    Veronderstel exponentiële groei of exponentieel verval. Bepaal de groeifactor en de verandering per jaar in procent, op $0{,}1$\,\% nauwkeurig.
  lijst: enumerate
  delen:
    - opgave: |-
        Een huis kostte $250\,000$ euro, en zes jaar later $310\,000$ euro.
      antwoord: |-
        $a \approx 1{,}0365$; $+3{,}7$\,\% per jaar
      uitwerking: |-
        $250\,000 \cdot a^6 = 310\,000 \iff a^6 = 1{,}24$. Dus $a = 1{,}24^{\frac16} \approx 1{,}0365$: een stijging van ongeveer $3{,}7$\,\% per jaar.
    - opgave: |-
        Een vispopulatie daalde in vijf jaar van $1800$ tot $1100$ vissen.
      antwoord: |-
        $a \approx 0{,}9062$; $-9{,}4$\,\% per jaar
      uitwerking: |-
        $1800 \cdot a^5 = 1100 \iff a^5 = \frac{11}{18}$. Dus $a = \bigl(\frac{11}{18}\bigr)^{\frac15} \approx 0{,}9062$: een daling van ongeveer $9{,}4$\,\% per jaar.
    - opgave: |-
        Een spaarbedrag is in negen jaar verdubbeld.
      antwoord: |-
        $a \approx 1{,}0801$; $+8{,}0$\,\% per jaar
      uitwerking: |-
        Het beginbedrag doet er niet toe: $a^9 = 2$, dus $a = 2^{\frac19} \approx 1{,}0801$, ongeveer $8{,}0$\,\% per jaar.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    verschuiven of uitrekken
  opgave: |-
    Neem $f(x) = 2^x$, $g(x) = 2^{x - 2}$ en $h(x) = \frac14 \cdot 2^x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Maak een tabel voor $x = -1, 0, 1, 2, 3$ en schets de drie grafieken in één figuur.
      antwoord: |-
        $g$ en $h$ hebben dezelfde tabel
      uitwerking: |-
        $f$: $\frac12$, $1$, $2$, $4$, $8$. $g$ en $h$: $\frac18$, $\frac14$, $\frac12$, $1$, $2$. De grafieken van $g$ en $h$ vallen samen.
        \figuren{\begin{tikzpicture}[x=.6cm,y=.5cm,font=\scriptsize]
          \rooster{-2}{1}{4}{-1}{1}{6}
          \kromme[dashed]{-2}{2.58}{2^(\x)}
          \kromme{-2}{4}{2^(\x-2)}
          \node[left,text=accent] at (2.58,6) {$f$};
          \node[right,text=accent] at (4,4) {$g = h$};
        \end{tikzpicture}}
    - opgave: |-
        Wat valt op? Verklaar met een rekenregel.
      antwoord: |-
        $g = h$, want $2^{x - 2} = 2^x \cdot 2^{-2}$
      uitwerking: |-
        $g(x) = 2^{x - 2} = 2^x \cdot 2^{-2} = \frac14 \cdot 2^x = h(x)$. Bij een exponentiële functie is 2 naar rechts schuiven hetzelfde als verticaal samendrukken met factor $\frac14$.
    - opgave: |-
        Welke horizontale verschuiving van de grafiek van $2^x$ geeft dezelfde grafiek als een verticale uitrekking met factor 8?
      antwoord: |-
        3 naar links
      uitwerking: |-
        $8 \cdot 2^x = 2^3 \cdot 2^x = 2^{x + 3}$: 3 naar links schuiven.

- id: h1-o6
  soort: opdracht
  niveau: 2
  thema: |-
    wereldbevolking
  opgave: |-
    De wereldbevolking telt ongeveer $8{,}1$ miljard mensen en groeit met ongeveer $0{,}9$\,\% per jaar. Veronderstel dat dit zo blijft.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een model en voorspel de bevolking over 25 jaar.
      antwoord: |-
        $B(t) = 8{,}1 \cdot 1{,}009^t$; ongeveer $10{,}1$ miljard
      uitwerking: |-
        Beginwaarde $8{,}1$ miljard, groeifactor $1 + \frac{0{,}9}{100} = 1{,}009$: $B(t) = 8{,}1 \cdot 1{,}009^t$ (in miljard). $B(25) = 8{,}1 \cdot 1{,}009^{25} \approx 10{,}1$ miljard.
    - opgave: |-
        Met hoeveel procent groeit de bevolking per decennium?
      antwoord: |-
        ongeveer $9{,}4$\,\%
      uitwerking: |-
        Groeifactor per 10 jaar: $1{,}009^{10} \approx 1{,}094$, ongeveer $9{,}4$\,\% per decennium.
    - opgave: |-
        Waarom is zo'n voorspelling onzeker?
      antwoord: |-
        het groeipercentage verandert
      uitwerking: |-
        Het groeipercentage blijft in werkelijkheid niet constant: het daalt al decennia. Het model is alleen voor korte termijn bruikbaar.

- id: h1-o21
  soort: opdracht
  niveau: 2
  thema: |-
    Waar zit de fout? Procenten bij groei
  opgave: |-
    Klopt de redenering? Waar zit de fout? Verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Een prijs stijgt drie jaar na elkaar met $10$\,\%, dus in totaal met $30$\,\%.
      antwoord: |-
        fout: $33{,}1$\,\%
      uitwerking: |-
        De percentages tel je niet op: elk jaar komt $10$\,\% van de nieuwe prijs erbij. De groeifactor voor drie jaar is $1{,}1^3 = 1{,}331$, een stijging van $33{,}1$\,\%.
    - opgave: |-
        Een aandeel daalt $50$\,\% en stijgt daarna $50$\,\%. Het staat dus weer op zijn beginwaarde.
      antwoord: |-
        fout: $25$\,\% lager
      uitwerking: |-
        De stijging is $50$\,\% van een kleiner bedrag. Samen: $0{,}5 \cdot 1{,}5 = 0{,}75$. Het aandeel staat $25$\,\% lager dan in het begin.
    - opgave: |-
        Bij $2$\,\% groei per maand is de groei per jaar $24$\,\%.
      antwoord: |-
        fout: $\approx 26{,}8$\,\%
      uitwerking: |-
        De groeifactor per jaar is $1{,}02^{12} \approx 1{,}268$: ongeveer $26{,}8$\,\% per jaar.
    - opgave: |-
        Bij een halveringstijd van 10 jaar is na 5 jaar een kwart verdwenen.
      antwoord: |-
        fout: $\approx 29{,}3$\,\% verdwenen
      uitwerking: |-
        Na een halve halveringstijd blijft $\bigl(\frac12\bigr)^{\frac12} = \frac{1}{\sqrt2} \approx 0{,}707$ over. Er is dus ongeveer $29{,}3$\,\% verdwenen, niet $25$\,\%: in de eerste 5 jaar verdwijnt meer dan in de volgende 5, omdat er dan meer is.

- id: h1-o5
  soort: opdracht
  niveau: 2
  thema: |-
    model uit twee punten
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.26cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=1,ystep=2] (-2,0) grid (3,14);
        \draw[->,grijs] (-2,0) -- (3.4,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,0) -- (0,15) node[above,text=black] {$y$};
        \foreach \t in {-2,-1,1,2,3}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {4,8,12}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \kromme{-2}{2.2}{3*2^(\x)}
        \vol{(0,3)} \vol{(2,12)}
      \end{tikzpicture}
  opgave: |-
    De grafiek van $f(x) = b \cdot a^x$ gaat door $(0, 3)$ en $(2, 12)$. Bepaal $a$ en $b$, en bereken $f(-1)$.
  antwoord: |-
    $b = 3$, $a = 2$; $f(-1) = \frac32$
  uitwerking: |-
    $f(0) = b \cdot a^0 = b$, dus $b = 3$. Dan is $f(2) = 3a^2 = 12$, dus $a^2 = 4$ en $a = 2$ (want $a > 0$). Zo is $f(x) = 3 \cdot 2^x$ en $f(-1) = 3 \cdot 2^{-1} = \frac32$.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    kroos op een vijver
  opgave: |-
    Op een vijver van $512$ m\textsuperscript{2} drijft $2$ m\textsuperscript{2} kroos. De bedekte oppervlakte verdubbelt elke 5 dagen.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een model voor de bedekte oppervlakte $K(t)$ na $t$ dagen.
      antwoord: |-
        $K(t) = 2 \cdot 2^{\frac{t}{5}}$
      uitwerking: |-
        Na $t$ dagen zijn er $\frac{t}{5}$ verdubbelingstijden voorbij: $K(t) = 2 \cdot 2^{\frac{t}{5}}$, in m\textsuperscript{2}.
    - opgave: |-
        Hoeveel m\textsuperscript{2} is na twee weken bedekt?
      antwoord: |-
        $\approx 13{,}9$ m\textsuperscript{2}
      uitwerking: |-
        $K(14) = 2 \cdot 2^{\frac{14}{5}} = 2 \cdot 2^{2{,}8} \approx 13{,}9$ m\textsuperscript{2}.
    - opgave: |-
        Wanneer is de vijver volledig bedekt? Reken exact.
      antwoord: |-
        na 40 dagen
      uitwerking: |-
        $2 \cdot 2^{\frac{t}{5}} = 512 \iff 2^{\frac{t}{5}} = 256 = 2^8$. Dus $\frac{t}{5} = 8$ en $t = 40$ dagen.
    - opgave: |-
        Met hoeveel procent groeit het kroos per dag?
      antwoord: |-
        $\approx 14{,}9$\,\%
      uitwerking: |-
        Groeifactor per dag: $2^{\frac15} \approx 1{,}1487$, ongeveer $14{,}9$\,\% per dag.
    - opgave: |-
        Waarom kan het model niet blijven kloppen?
      antwoord: |-
        de vijver is begrensd
      uitwerking: |-
        Na 40 dagen zou het kroos meer dan de hele vijver bedekken. Al eerder groeit het trager, omdat er minder plaats en voedsel is.

- id: h1-o23
  soort: opdracht
  niveau: 2
  thema: |-
    continue groei en daling
  opgave: |-
    Op een eiland groeit de bevolking continu: $B(t) = 2400\,\e^{0{,}015\,t}$. Op een ander eiland daalt ze: $C(t) = 3000\,\e^{-0{,}02\,t}$. Daarbij is $t$ de tijd in jaren.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel inwoners heeft het eerste eiland na 20 jaar?
      antwoord: |-
        ongeveer 3240
      uitwerking: |-
        $B(20) = 2400\,\e^{0{,}3} \approx 3239{,}7$: ongeveer 3240 inwoners.
    - opgave: |-
        Toon aan dat $N_0\,\e^{rt}$ een exponentieel model $N_0 \cdot a^t$ is. Wat is $a$? Wanneer is het groei, wanneer verval?
      antwoord: |-
        $a = \e^r$; groei als $r > 0$, verval als $r < 0$
      uitwerking: |-
        Met de rekenregel $(a^r)^s = a^{rs}$: $\e^{rt} = \bigl(\e^r\bigr)^t$, dus $a = \e^r$. Is $r > 0$, dan is $\e^r > \e^0 = 1$: groei. Is $r < 0$, dan is $0 < \e^r < 1$: verval.
    - opgave: |-
        Met hoeveel procent per jaar daalt de bevolking van het tweede eiland?
      antwoord: |-
        $\approx 1{,}98$\,\%
      uitwerking: |-
        $a = \e^{-0{,}02} \approx 0{,}9802$: een daling van ongeveer $1{,}98$\,\% per jaar.
    - opgave: |-
        Zoek met een tabel na hoeveel jaar het eerste eiland voor het eerst meer inwoners heeft dan het tweede.
      antwoord: |-
        na 7 jaar
      uitwerking: |-
        $t = 6$: $B(6) \approx 2626$ en $C(6) \approx 2661$. $t = 7$: $B(7) \approx 2666$ en $C(7) \approx 2608$. Na 7 jaar heeft het eerste eiland meer inwoners.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    gebruikers van een app
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.06cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=1,ystep=10] (0,0) grid (10,50);
        \draw[->,grijs] (0,0) -- (10.6,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,56) node[above,text=black] {$G$};
        \foreach \t in {2,4,...,10}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {10,20,...,50}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \kromme{0}{10}{50-45*0.7^(\x)}
      \end{tikzpicture}
  opgave: |-
    Een nieuwe app heeft na $t$ maanden $G(t) = 50 - 45 \cdot 0{,}7^t$ duizend gebruikers. De figuur toont de grafiek.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel gebruikers had de app bij de lancering?
      antwoord: |-
        $5000$
      uitwerking: |-
        $G(0) = 50 - 45 \cdot 1 = 5$: $5000$ gebruikers.
    - opgave: |-
        Hoeveel gebruikers zijn er na een half jaar?
      antwoord: |-
        ongeveer $44\,700$
      uitwerking: |-
        $G(6) = 50 - 45 \cdot 0{,}7^6 \approx 44{,}71$: ongeveer $44\,700$ gebruikers.
    - opgave: |-
        Welke horizontale asymptoot heeft de grafiek? Wat betekent ze?
      antwoord: |-
        $G = 50$: nooit meer dan $50\,000$
      uitwerking: |-
        $0{,}7^t$ wordt willekeurig klein, maar blijft positief. Dus $G(t)$ nadert $50$ van onder: de asymptoot is $G = 50$. Het aantal gebruikers groeit naar $50\,000$, maar haalt dat nooit.
    - opgave: |-
        Lees af wanneer de app $40\,000$ gebruikers heeft. Controleer met je rekentoestel.
      antwoord: |-
        na ongeveer $4{,}2$ maanden
      uitwerking: |-
        Op de grafiek: bij $G = 40$ is $t \approx 4{,}2$. Controle: $G(4) \approx 39{,}2$ en $G(4{,}2) \approx 39{,}9$, $G(4{,}3) \approx 40{,}3$. Na ongeveer $4{,}2$ maanden.

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    een medicijn
  opgave: |-
    Het lichaam breekt een medicijn af: om de 4 uur verdwijnt $30$\,\% van wat er nog is. Iemand krijgt $500$ mg.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de groeifactor per 4 uur, per uur en per dag?
      antwoord: |-
        $0{,}7$; $\approx 0{,}915$; $\approx 0{,}118$
      uitwerking: |-
        Per 4 uur blijft $70$\,\% over: $0{,}7$. Per uur: $0{,}7^{\frac14} \approx 0{,}915$, want vier uurstappen samen moeten $0{,}7$ geven. Per dag (6 keer 4 uur): $0{,}7^6 \approx 0{,}118$.
    - opgave: |-
        Hoeveel is er na een dag nog over?
      antwoord: |-
        ongeveer $58{,}8$ mg
      uitwerking: |-
        $500 \cdot 0{,}7^6 \approx 58{,}8$ mg.
    - opgave: |-
        Na hoeveel volle uren is er voor het eerst minder dan $100$ mg over? Zoek met je rekentoestel.
      antwoord: |-
        na 19 uur
      uitwerking: |-
        $M(t) = 500 \cdot 0{,}7^{\frac{t}{4}}$. $M(18) \approx 100{,}4$ en $M(19) \approx 91{,}9$: na 19 uur.

- id: h1-o20
  soort: opdracht
  niveau: 2
  thema: |-
    lineair of exponentieel sparen
  opgave: |-
    Lotte heeft $1000$ euro in een spaarpot en legt er elk jaar $100$ euro bij. Tim zet $1000$ euro op een rekening met $6$\,\% samengestelde intrest per jaar en doet verder niets.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef voor beiden een formule voor het bedrag na $t$ jaar.
      antwoord: |-
        $L(t) = 1000 + 100t$; $T(t) = 1000 \cdot 1{,}06^t$
      uitwerking: |-
        Lotte krijgt er elk jaar hetzelfde bedrag bij: lineair, $L(t) = 1000 + 100t$. Tim krijgt elk jaar dezelfde factor: exponentieel, $T(t) = 1000 \cdot 1{,}06^t$.
    - opgave: |-
        Bereken beide bedragen na 5 en na 10 jaar.
      antwoord: |-
        $1500$ en $\approx 1338$; $2000$ en $\approx 1791$
      uitwerking: |-
        Na 5 jaar: $L(5) = 1500$ en $T(5) \approx 1338{,}23$ euro. Na 10 jaar: $L(10) = 2000$ en $T(10) \approx 1790{,}85$ euro.
    - opgave: |-
        Na hoeveel jaar heeft Tim voor het eerst meer dan Lotte? Zoek met een tabel.
      antwoord: |-
        na 18 jaar
      uitwerking: |-
        $L(17) = 2700$ en $T(17) \approx 2692{,}77$; $L(18) = 2800$ en $T(18) \approx 2854{,}34$. Na 18 jaar heeft Tim meer, en daarna groeit zijn voorsprong steeds sneller.

- id: h1-o26
  soort: opdracht
  niveau: 3
  thema: |-
    vergelijkingen met een som van machten
  opgave: |-
    Los op. Breng een macht buiten haakjes, of stel $t = 2^x$ of $t = 3^x$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2^{x + 1} + 2^x = 48$
      antwoord: |-
        $x = 4$
      uitwerking: |-
        $2^{x + 1} = 2 \cdot 2^x$, dus $2 \cdot 2^x + 2^x = 3 \cdot 2^x = 48$. Dan is $2^x = 16 = 2^4$ en $x = 4$.
    - opgave: |-
        $3^{x + 2} - 3^x = 72$
      antwoord: |-
        $x = 2$
      uitwerking: |-
        $3^{x + 2} = 9 \cdot 3^x$, dus $9 \cdot 3^x - 3^x = 8 \cdot 3^x = 72$. Dan is $3^x = 9$ en $x = 2$.
    - opgave: |-
        $4^x - 6 \cdot 2^x + 8 = 0$
      antwoord: |-
        $x = 1$ of $x = 2$
      uitwerking: |-
        Stel $t = 2^x$, dan is $4^x = (2^x)^2 = t^2$: $t^2 - 6t + 8 = 0$, dus $(t - 2)(t - 4) = 0$. $2^x = 2$ geeft $x = 1$, $2^x = 4$ geeft $x = 2$.
    - opgave: |-
        $9^x - 3^{x + 1} - 54 = 0$
      antwoord: |-
        $x = 2$
      uitwerking: |-
        Stel $t = 3^x$: $9^x = t^2$ en $3^{x + 1} = 3t$. Dus $t^2 - 3t - 54 = 0$, of $(t - 9)(t + 6) = 0$. $t = -6$ kan niet, want $3^x > 0$. $3^x = 9$ geeft $x = 2$.

- id: h1-o8
  soort: opdracht
  niveau: 3
  thema: |-
    intrest per maand of continu
  opgave: |-
    Een bank biedt $6$\,\% intrest per jaar, een andere $0{,}5$\,\% per maand. Een derde rekent $6$\,\% per jaar, continu bijgeteld.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke is het voordeligst? Geef voor elk het werkelijke rendement per jaar.
      antwoord: |-
        $6$\,\%; $\approx 6{,}17$\,\%; $\approx 6{,}18$\,\%: continu
      uitwerking: |-
        Vergelijk de groeifactor per jaar. Per jaar: $1{,}06$. Per maand: $1{,}005^{12} \approx 1{,}0617$. Continu: $\e^{0{,}06} \approx 1{,}0618$. De continue groei is net het voordeligst, maar het verschil met maandelijks is klein.
    - opgave: |-
        Welk percentage per maand zou de tweede bank moeten geven om precies hetzelfde op te leveren als de eerste?
      antwoord: |-
        $\approx 0{,}487$\,\%
      uitwerking: |-
        Twaalf maandstappen moeten samen $1{,}06$ geven: $a^{12} = 1{,}06$, dus $a = 1{,}06^{\frac{1}{12}} \approx 1{,}004\,87$. Dat is ongeveer $0{,}487$\,\% per maand, iets minder dan $\frac{6}{12} = 0{,}5$\,\%.

- id: h1-o25
  soort: opdracht
  niveau: 3
  thema: |-
    gelijke stappen, gelijke factoren
  opgave: |-
    Neem een exponentiële functie $f(x) = b \cdot a^x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{f(x + h)}{f(x)} = a^h$ voor elke $x$. Wat betekent dat voor gelijke stappen in $x$?
      antwoord: |-
        bij gelijke stappen hoort telkens dezelfde factor
      uitwerking: |-
        $\dfrac{f(x + h)}{f(x)} = \dfrac{b \cdot a^{x + h}}{b \cdot a^x} = a^{x + h - x} = a^h$. Het quotiënt hangt niet van $x$ af: bij elke stap $h$ in $x$ wordt de functiewaarde met dezelfde factor $a^h$ vermenigvuldigd.
    - opgave: |-
        Kan de grafiek van zo'n functie door $(1, 6)$, $(2, 12)$ en $(3, 20)$ gaan?
      antwoord: |-
        nee
      uitwerking: |-
        De stappen in $x$ zijn gelijk, dus de quotiënten moeten gelijk zijn. Maar $\frac{12}{6} = 2$ en $\frac{20}{12} = \frac53$: dat kan niet.
    - opgave: |-
        De grafiek gaat door $(1, 6)$ en $(4, 48)$. Bepaal $f(2)$ en $f(3)$ zonder eerst $b$ te berekenen.
      antwoord: |-
        $f(2) = 12$, $f(3) = 24$
      uitwerking: |-
        Van $x = 1$ naar $x = 4$ is een stap 3: $a^3 = \frac{48}{6} = 8$, dus $a = 2$. Elke stap 1 verdubbelt: $f(2) = 12$ en $f(3) = 24$ (en $b = 3$).

- id: h1-o27
  soort: opdracht
  niveau: 3
  thema: |-
    elke 8 uur een tablet
  opgave: |-
    Een patiënt neemt elke 8 uur een tablet van $100$ mg. In 8 uur breekt het lichaam de helft af van wat er in het bloed zit. Noem $H_n$ de hoeveelheid in het bloed net na de $n$de tablet, zodat $H_1 = 100$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $H_2$, $H_3$ en $H_4$.
      antwoord: |-
        $150$; $175$; $187{,}5$ mg
      uitwerking: |-
        Telkens de helft van de vorige, plus een nieuwe tablet: $H_{n + 1} = \frac12 H_n + 100$. $H_2 = 50 + 100 = 150$, $H_3 = 75 + 100 = 175$, $H_4 = 87{,}5 + 100 = 187{,}5$ mg.
    - opgave: |-
        Toon aan dat $H_n = 200 - 200 \cdot \bigl(\frac12\bigr)^n$ klopt voor $n = 1$, en dat de formule blijft kloppen als je van $H_n$ naar $H_{n + 1}$ gaat.
      antwoord: |-
        bewijs
      uitwerking: |-
        Voor $n = 1$: $200 - 200 \cdot \frac12 = 100 = H_1$. Klopt de formule voor $H_n$, dan is
        \[H_{n + 1} = \tfrac12 H_n + 100 = 100 - 100 \cdot \bigl(\tfrac12\bigr)^n + 100 = 200 - 200 \cdot \bigl(\tfrac12\bigr)^{n + 1},\]
        want $100 \cdot \bigl(\frac12\bigr)^n = 200 \cdot \bigl(\frac12\bigr)^{n + 1}$. Dat is de formule voor $n + 1$, dus ze klopt voor elke $n$.
    - opgave: |-
        Welke hoeveelheid nadert $H_n$? Verklaar met de formule en met de afbraak.
      antwoord: |-
        $200$ mg
      uitwerking: |-
        $\bigl(\frac12\bigr)^n$ wordt willekeurig klein, dus $H_n$ nadert $200$ mg. Bij $200$ mg breekt het lichaam in 8 uur net $100$ mg af, evenveel als een tablet: dan blijft het evenwicht.

- id: h1-o24
  soort: opdracht
  niveau: 3
  thema: |-
    variaties op het getal $\e$
  opgave: |-
    Het getal $\e$ is wat $\bigl(1 + \frac1n\bigr)^n$ nadert. Wat gebeurt er als je de $1$ in de breuk vervangt?
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\bigl(1 + \frac2n\bigr)^n$ voor $n = 10$, $100$, $1000$ en $10^6$. Welk getal lijkt dit te naderen? Vergelijk met $\e^2$.
      antwoord: |-
        $6{,}192$; $7{,}245$; $7{,}374$; $7{,}389\,04$; het nadert $\e^2 \approx 7{,}389\,06$
      uitwerking: |-
        $6{,}1917$, $7{,}2446$, $7{,}3743$ en $7{,}389\,04$. Dat nadert $\e^2 \approx 7{,}389\,06$.
    - opgave: |-
        Toon aan dat $\bigl(1 + \frac2n\bigr)^n = \Bigl(\bigl(1 + \frac1m\bigr)^m\Bigr)^2$ met $m = \frac{n}{2}$. Verklaar daarmee wat je in a zag.
      antwoord: |-
        $(\ldots)^m$ nadert $\e$, dus het kwadraat nadert $\e^2$
      uitwerking: |-
        Met $n = 2m$ is $\frac2n = \frac1m$, dus $\bigl(1 + \frac2n\bigr)^n = \bigl(1 + \frac1m\bigr)^{2m} = \Bigl(\bigl(1 + \frac1m\bigr)^m\Bigr)^2$. Als $n$ onbeperkt groeit, doet $m$ dat ook: het binnenste nadert $\e$, en het geheel dus $\e^2$.
    - opgave: |-
        Bereken $\bigl(1 - \frac1n\bigr)^n$ voor $n = 1000$. Welk getal vermoed je?
      antwoord: |-
        $\approx 0{,}3677$; $\frac1\e \approx 0{,}3679$
      uitwerking: |-
        $0{,}999^{1000} \approx 0{,}3677$. Dat ligt dicht bij $\frac1\e = \e^{-1} \approx 0{,}3679$. Je vermoedt dat $\bigl(1 - \frac1n\bigr)^n$ het getal $\e^{-1}$ nadert, en in het algemeen $\bigl(1 + \frac{r}{n}\bigr)^n$ het getal $\e^r$: zo komt $\e^{rt}$ bij continue groei.

- id: h1-o9
  soort: opdracht
  niveau: 3
  thema: |-
    exponentieel wint
  opgave: |-
    Neem $f(n) = 1{,}1^n$ en $g(n) = n^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Vergelijk $f(n)$ en $g(n)$ voor $n = 10$, $50$, $100$ en $200$. Welke groeit uiteindelijk het snelst?
      antwoord: |-
        $1{,}1^n$
      uitwerking: |-
        $n = 10$: $2{,}6$ tegenover $100$. $n = 50$: $117$ tegenover $2500$. $n = 100$: $13\,781$ tegenover $10\,000$. $n = 200$: ongeveer $1{,}9 \cdot 10^8$ tegenover $40\,000$. De exponentiële functie wint uiteindelijk ruim.
    - opgave: |-
        Zoek met je rekentoestel vanaf welk natuurlijk getal $n$ de exponentiële functie voorgoed groter is. Waarom blijft ze daarna groter?
      antwoord: |-
        vanaf $n = 96$
      uitwerking: |-
        $1{,}1^{95} \approx 8557 < 9025$ en $1{,}1^{96} \approx 9412 > 9216$: vanaf $n = 96$. Daarna wordt $f$ bij elke stap $10$\,\% groter, terwijl $g(n + 1) = (n + 1)^2$ minder dan $10$\,\% groter is dan $n^2$, want $\bigl(1 + \frac1n\bigr)^2 < 1{,}1$ zodra $n \geqslant 21$. Dus de voorsprong van $f$ groeit.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h1-koppel-1
  soort: koppel
  niveau: 1
  koppel:
    rubriek: discreet
    onderwerp: Rijen
  thema: |-
    meetkundige rij
  opgave: |-
    Een meetkundige rij heeft beginterm $u_0 = 5$ en reden $q = 3$. Toon aan dat \mbox{$u_n = f(n)$} voor een exponentiële functie $f$. Welke punten van de grafiek van $f$ horen bij de rij?
  antwoord: |-
    $f(x) = 5 \cdot 3^x$; de punten met $x \in \mathbb{N}$
  uitwerking: |-
    $u_n = 5 \cdot 3^n = f(n)$ met $f(x) = 5 \cdot 3^x$. De termen zijn de punten $(n, f(n))$ met $n$ natuurlijk: een meetkundige rij is een exponentiële functie op de natuurlijke getallen.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: Kansrekenen
  thema: |-
    nooit een zes
  opgave: |-
    Je gooit $n$ keer met een eerlijke dobbelsteen. Toon aan dat de kans op geen enkele zes $\bigl(\frac56\bigr)^n$ is. Vanaf hoeveel worpen is de kans op minstens één zes groter dan $\frac12$?
  antwoord: |-
    vanaf 4 worpen
  uitwerking: |-
    De worpen zijn onafhankelijk, elk met kans $\frac56$ op geen zes. $\bigl(\frac56\bigr)^3 \approx 0{,}579$ en $\bigl(\frac56\bigr)^4 \approx 0{,}482$: vanaf 4 worpen is de kans op minstens één zes groter dan $\frac12$.

- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    machten
  opgave: |-
    Bereken $27^{\frac23}$, en schrijf $\dfrac{x^{\frac34} \cdot x}{\sqrt[4]{x}}$ als één macht van $x$.
  antwoord: |-
    9; $x^{\frac32}$
  uitwerking: |-
    $27^{\frac23} = \bigl(\sqrt[3]{27}\bigr)^2 = 3^2 = 9$. Met $\sqrt[4]{x} = x^{\frac14}$: $\dfrac{x^{\frac34} \cdot x^1}{x^{\frac14}} = x^{\frac34 + 1 - \frac14} = x^{\frac32}$.

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    vergelijking
  opgave: |-
    Los op: $9^x = 27^{x - 1}$.
  antwoord: |-
    $x = 3$
  uitwerking: |-
    Beide leden als macht van 3: $(3^2)^x = (3^3)^{x - 1}$, dus $3^{2x} = 3^{3x - 3}$. Exponenten gelijkstellen: $2x = 3x - 3$, dus $x = 3$.

- id: h1-t3
  soort: test
  niveau: 1
  thema: |-
    grafiek
  opgave: |-
    Geef het domein, het bereik en de asymptoot van $g(x) = 2^{x - 1} + 2$, en het beeld van $(0, 1)$ op de grafiek van $2^x$.
  antwoord: |-
    $\R$; $\left]2, +\infty\right[$; $y = 2$; $(1, 3)$
  uitwerking: |-
    De grafiek van $2^x$ schuift 1 naar rechts en 2 naar boven: $(0, 1) \mapsto (1, 3)$. De asymptoot $y = 0$ schuift mee naar $y = 2$. $\dom g = \R$, $\ber g = \left]2, +\infty\right[$.

- id: h1-t4
  soort: test
  niveau: 1
  thema: |-
    intrest
  opgave: |-
    Je zet $1500$ euro op een rekening met $2{,}5$\,\% samengestelde intrest per jaar. Hoeveel staat er na 8 jaar op?
  antwoord: |-
    $1827{,}60$ euro
  uitwerking: |-
    Groeifactor $1 + \frac{2{,}5}{100} = 1{,}025$: $K(8) = 1500 \cdot 1{,}025^8 \approx 1827{,}60$ euro.

- id: h1-t5
  soort: test
  niveau: 2
  thema: |-
    halveringstijd
  opgave: |-
    Jodium-131 heeft een halveringstijd van 8 dagen. Welk percentage van een hoeveelheid is na 30 dagen over? Wat is de groeifactor per dag?
  antwoord: |-
    ongeveer $7{,}4$\,\%; $\approx 0{,}917$
  uitwerking: |-
    Na $t$ dagen blijft een fractie $\bigl(\frac12\bigr)^{\frac{t}{8}}$ over. $\bigl(\frac12\bigr)^{\frac{30}{8}} = 0{,}5^{3{,}75} \approx 0{,}074$: ongeveer $7{,}4$\,\%. Groeifactor per dag: $0{,}5^{\frac18} \approx 0{,}917$.

- id: h1-t6
  soort: test
  niveau: 1
  thema: |-
    continue groei
  opgave: |-
    Een kapitaal van $4000$ euro groeit continu met $3$\,\% per jaar: $K(t) = 4000\,\e^{0{,}03\,t}$. Hoeveel is het na 15 jaar?
  antwoord: |-
    $\approx 6273{,}25$ euro
  uitwerking: |-
    $K(15) = 4000\,\e^{0{,}03 \cdot 15} = 4000\,\e^{0{,}45} \approx 6273{,}25$ euro.

- id: h1-t7
  soort: test
  niveau: 2
  thema: |-
    groeifactor voor een andere tijdseenheid
  opgave: |-
    Het aantal leden van een club daalt elke maand met $4$\,\%. Met hoeveel procent daalt het per jaar? Waarom is dat geen $48$\,\%?
  antwoord: |-
    $\approx 38{,}7$\,\%
  uitwerking: |-
    Groeifactor per maand $0{,}96$, per jaar $0{,}96^{12} \approx 0{,}6127$: een daling van ongeveer $38{,}7$\,\%. Geen $12 \cdot 4 = 48$\,\%, want elke maand gaat er $4$\,\% af van een kleiner aantal.
