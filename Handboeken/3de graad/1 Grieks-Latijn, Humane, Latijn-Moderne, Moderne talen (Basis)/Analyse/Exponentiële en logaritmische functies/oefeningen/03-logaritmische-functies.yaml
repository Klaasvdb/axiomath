# Oefeningen van hoofdstuk 3. Zie oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken $\log_2 8 + \log_2 \frac12$.
      antwoord: |-
        2
      uitwerking: |-
        $3 + (-1) = 2$.
    - opgave: |-
        Wat is de inverse van $f(x) = 2^x$?
      antwoord: |-
        $\log_2 x$
      uitwerking: |-
        $y = 2^x \iff x = \log_2 y$, dus $\inv{f}(x) = \log_2 x$.
    - opgave: |-
        Los op: $x^2 - 2x - 8 = 0$.
      antwoord: |-
        $x = 4$ of $x = -2$
      uitwerking: |-
        $(x - 4)(x + 2) = 0$.
    - opgave: |-
        Los op: $-2x < 6$.
      antwoord: |-
        $x > -3$
      uitwerking: |-
        Delen door $-2$ keert het teken om.
    - opgave: |-
        Schrijf $3$ als logaritme met grondtal 2.
      antwoord: |-
        $\log_2 8$
      uitwerking: |-
        $3 = \log_2 2^3 = \log_2 8$.
    - opgave: |-
        Is $\ln 0{,}8$ positief of negatief?
      antwoord: |-
        negatief
      uitwerking: |-
        $0{,}8 < 1$ en $\e^0 = 1$, dus $\ln 0{,}8 < 0$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Neem $f(x) = 2^x$ en $g(x) = \log_2 x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Maak een tabel van $g$ voor $x = \frac14, \frac12, 1, 2, 4, 8$.
      antwoord: |-
        $-2, -1, 0, 1, 2, 3$
      uitwerking: |-
        $-2$, $-1$, $0$, $1$, $2$, $3$.
    - opgave: |-
        Vergelijk met een tabel van $f$ voor $x = -2, -1, 0, 1, 2, 3$. Wat valt op?
      antwoord: |-
        de rijen zijn gewisseld
      uitwerking: |-
        $f$ geeft $\frac14, \frac12, 1, 2, 4, 8$: dezelfde getallen, met $x$ en $y$ gewisseld. $g$ is de inverse van $f$.
    - opgave: |-
        Bestaat $g(0)$ of $g(-1)$? Waarom niet?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: geen enkele macht van 2 is $0$ of negatief.

#----------------------------------------------------------------------------------------
# KORTE OEFENINGEN IN DE LEERSTOF (in de volgorde van het boek)
#----------------------------------------------------------------------------------------

- id: h3-k-schets
  soort: kort
  opgave: |-
    Schets de grafiek vanuit die van $\log_2 x$ of $\log_3 x$. Geef het domein, de asymptoot en de nulwaarde.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \log_2(x + 1) - 2$
      antwoord: |-
        $\left]-1, +\infty\right[$; $x = -1$; $3$
      uitwerking: |-
        De grafiek van $\log_2 x$ schuift 1 naar links en 2 naar onder: $(1, 0) \mapsto (0, -2)$ en $(2, 1) \mapsto (1, -1)$. Domein: $x + 1 > 0$, dus $\dom f = \left]-1, +\infty\right[$, met asymptoot $x = -1$. Nulwaarde: $\log_2(x + 1) = 2$, dus $x + 1 = 2^2 = 4$ en $x = 3$.
        \figuren{\begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
          \rooster{-2}{1}{6}{-3}{1}{2}
          \draw[grijs,dashed] (-1,-3) -- (-1,2.3);
          \kromme{-.5}{6}{ln(\x+1)/ln(2)-2}
          \vol{(0,-2)} \vol{(3,0)}
        \end{tikzpicture}}
    - opgave: |-
        $g(x) = \log_3(x - 2) + 1$
      antwoord: |-
        $\left]2, +\infty\right[$; $x = 2$; $\frac73$
      uitwerking: |-
        De grafiek van $\log_3 x$ schuift 2 naar rechts en 1 naar boven: $(1, 0) \mapsto (3, 1)$. Domein: $x - 2 > 0$, dus $\dom g = \left]2, +\infty\right[$, met asymptoot $x = 2$. Nulwaarde: $\log_3(x - 2) = -1$, dus $x - 2 = 3^{-1} = \frac13$ en $x = \frac73$.
        \figuren{\begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
          \rooster{-1}{1}{8}{-2}{1}{3}
          \draw[grijs,dashed] (2,-2) -- (2,3.3);
          \kromme{2.04}{8}{ln(\x-2)/ln(3)+1}
          \vol{(3,1)} \vol{(2.333,0)}
        \end{tikzpicture}}

- id: h3-grafiek
  soort: kort
  opgave: |-
    Geef het domein, de asymptoot en de nulwaarde.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = \log_3(x + 1)$
      antwoord: |-
        $\left]-1, +\infty\right[$; $x = -1$; $0$
      uitwerking: |-
        De grafiek van $\log_3 x$ schuift 1 naar links. Domein: $x + 1 > 0$, dus $\dom f = \left]-1, +\infty\right[$, met asymptoot $x = -1$. Nulwaarde: $\log_3(x + 1) = 0$, dus $x + 1 = 3^0 = 1$ en $x = 0$.
    - opgave: |-
        $g(x) = -\log_2 x$
      antwoord: |-
        $\left]0, +\infty\right[$; $x = 0$; $1$
      uitwerking: |-
        Gespiegeld om de $x$-as, dus dalend. Het domein verandert niet: $\dom g = \left]0, +\infty\right[$, met asymptoot $x = 0$. Nulwaarde: $-\log_2 x = 0$, dus $x = 1$.
    - opgave: |-
        $h(x) = \ln(-x)$
      antwoord: |-
        $\left]-\infty, 0\right[$; $x = 0$; $-1$
      uitwerking: |-
        Gespiegeld om de $y$-as. Domein: $-x > 0$, dus $\dom h = \left]-\infty, 0\right[$, met asymptoot $x = 0$. Nulwaarde: $-x = \e^0 = 1$, dus $x = -1$.

- id: h3-k-domein
  soort: kort
  opgave: |-
    Bepaal het domein.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \ln(5 - 2x)$
      antwoord: |-
        $\left]-\infty, \frac52\right[$
      uitwerking: |-
        $5 - 2x > 0 \iff 2x < 5 \iff x < \frac52$. Dus $\dom f = \left]-\infty, \frac52\right[$.
    - opgave: |-
        $f(x) = \log(x^2 - 3x - 4)$
      antwoord: |-
        $\left]-\infty, -1\right[ \cup \left]4, +\infty\right[$
      uitwerking: |-
        $x^2 - 3x - 4 = (x + 1)(x - 4)$ heeft nulwaarden $-1$ en $4$. Een dalparabool is positief buiten de nulwaarden: $\dom f = \left]-\infty, -1\right[ \cup \left]4, +\infty\right[$.
    - opgave: |-
        $f(x) = \log_2(x^2 + 4x + 5)$
      antwoord: |-
        $\R$
      uitwerking: |-
        $x^2 + 4x + 5 = (x + 2)^2 + 1 \geqslant 1 > 0$ voor elke $x$ (de discriminant $16 - 20$ is negatief). Dus $\dom f = \R$.

- id: h3-k-teken
  soort: kort
  opgave: |-
    Is de logaritme positief of negatief? Antwoord zonder rekentoestel.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\log_5 0{,}7$
      antwoord: |-
        negatief
      uitwerking: |-
        Grondtal $5 > 1$, dus stijgend. Omdat $0{,}7 < 1$, is $\log_5 0{,}7 < \log_5 1 = 0$.
    - opgave: |-
        $\log_{0{,}3} 0{,}1$
      antwoord: |-
        positief
      uitwerking: |-
        Grondtal tussen 0 en 1, dus dalend. Omdat $0{,}1 < 1$, is $\log_{0{,}3} 0{,}1 > \log_{0{,}3} 1 = 0$.
    - opgave: |-
        $\ln 1{,}01$
      antwoord: |-
        positief
      uitwerking: |-
        Grondtal $\e > 1$, dus stijgend. Omdat $1{,}01 > 1$, is $\ln 1{,}01 > \ln 1 = 0$ (al is het maar net: ongeveer $0{,}00995$).
    - opgave: |-
        $\log_{\frac12} 8$
      antwoord: |-
        negatief
      uitwerking: |-
        Grondtal tussen 0 en 1, dus dalend. Omdat $8 > 1$, is $\log_{\frac12} 8 < 0$. Exact: $\bigl(\frac12\bigr)^{-3} = 8$, dus $\log_{\frac12} 8 = -3$.

- id: h3-k-def
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log_2(x + 3) = 5$
      antwoord: |-
        $x = 29$
      uitwerking: |-
        Voorwaarde: $x + 3 > 0 \iff x > -3$. Definitie: $x + 3 = 2^5 = 32$, dus $x = 29$. Dat voldoet.
    - opgave: |-
        $\log(1 - 2x) = -1$
      antwoord: |-
        $x = 0{,}45$
      uitwerking: |-
        Voorwaarde: $1 - 2x > 0 \iff x < \frac12$. Definitie: $1 - 2x = 10^{-1} = 0{,}1$, dus $2x = 0{,}9$ en $x = 0{,}45$. Dat voldoet.
    - opgave: |-
        $\ln(3x) = 2$
      antwoord: |-
        $x = \frac{\e^2}{3} \approx 2{,}46$
      uitwerking: |-
        Voorwaarde: $x > 0$. Definitie: $3x = \e^2$, dus $x = \frac{\e^2}{3} \approx 2{,}46$. Dat voldoet.

- id: h3-vergelijking
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log_5 x = 3$
      antwoord: |-
        $x = 125$
      uitwerking: |-
        Voorwaarde: $x > 0$. Definitie: $x = 5^3 = 125$.
    - opgave: |-
        $\ln(x - 2) = 1$
      antwoord: |-
        $x = 2 + \e$
      uitwerking: |-
        Voorwaarde: $x > 2$. Definitie: $x - 2 = \e^1$, dus $x = 2 + \e \approx 4{,}72$. Dat voldoet.
    - opgave: |-
        $\log(3x) = \log(x + 4)$
      antwoord: |-
        $x = 2$
      uitwerking: |-
        Voorwaarden: $3x > 0$ en $x + 4 > 0$, samen $x > 0$. Gelijke logaritmen, dus gelijke argumenten: $3x = x + 4$, zodat $x = 2$. Dat voldoet.

- id: h3-k-gelijk
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\log_3(2x - 1) = \log_3(x + 4)$
      antwoord: |-
        $x = 5$
      uitwerking: |-
        Voorwaarden: $2x - 1 > 0$ en $x + 4 > 0$, samen $x > \frac12$. Gelijke logaritmen: $2x - 1 = x + 4$, dus $x = 5$. Dat voldoet.
    - opgave: |-
        $\ln\bigl(x^2\bigr) = \ln(5x - 6)$
      antwoord: |-
        $x = 2$ of $x = 3$
      uitwerking: |-
        Voorwaarden: $x^2 > 0$ (dus $x \neq 0$) en $5x - 6 > 0$, samen $x > \frac65$. Gelijke logaritmen: $x^2 = 5x - 6$, dus $x^2 - 5x + 6 = (x - 2)(x - 3) = 0$. Beide oplossingen voldoen: $x = 2$ of $x = 3$.
    - opgave: |-
        $\log_5\bigl(x^2 - 4\bigr) = \log_5(3x)$
      antwoord: |-
        $x = 4$
      uitwerking: |-
        Voorwaarden: $x^2 - 4 > 0$ en $3x > 0$, samen $x > 2$. Gelijke logaritmen: $x^2 - 4 = 3x$, dus $x^2 - 3x - 4 = (x - 4)(x + 1) = 0$, zodat $x = 4$ of $x = -1$. Alleen $x = 4$ voldoet; voor $x = -1$ bestaat $\log_5(3x)$ niet.

- id: h3-k-twee
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\log_3 x + \log_3(x + 8) = 2$
      antwoord: |-
        $x = 1$
      uitwerking: |-
        Voorwaarden: $x > 0$ en $x > -8$, samen $x > 0$. Productregel: $\log_3\bigl(x(x + 8)\bigr) = 2$, dus $x^2 + 8x = 9$. Dan $x^2 + 8x - 9 = (x - 1)(x + 9) = 0$, dus $x = 1$ of $x = -9$. Alleen $x = 1$ voldoet aan $x > 0$.
    - opgave: |-
        $\log_2(x + 2) - \log_2(x - 1) = 2$
      antwoord: |-
        $x = 2$
      uitwerking: |-
        Voorwaarden: $x > -2$ en $x > 1$, samen $x > 1$. Quotiëntregel: $\log_2 \frac{x + 2}{x - 1} = 2$, dus $\frac{x + 2}{x - 1} = 4$. Dan $x + 2 = 4x - 4$, zodat $x = 2$. Dat voldoet aan $x > 1$.

- id: h3-k-machtong
  soort: kort
  opgave: |-
    Los op zonder rekentoestel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2^{x - 1} < 16$
      antwoord: |-
        $x < 5$
      uitwerking: |-
        $16 = 2^4$, en het grondtal $2 > 1$, dus het teken blijft: $x - 1 < 4$, zodat $x < 5$.
    - opgave: |-
        $0{,}5^x \geqslant \frac18$
      antwoord: |-
        $x \leqslant 3$
      uitwerking: |-
        $\frac18 = 0{,}5^3$, en het grondtal ligt tussen 0 en 1, dus het teken keert om: $x \leqslant 3$.
    - opgave: |-
        $\bigl(\frac25\bigr)^{2x} > 1$
      antwoord: |-
        $x < 0$
      uitwerking: |-
        $1 = \bigl(\frac25\bigr)^0$, en het grondtal ligt tussen 0 en 1, dus het teken keert om: $2x < 0$, zodat $x < 0$.

- id: h3-k-expong
  soort: kort
  opgave: |-
    Los op met een ongelijkheid.
  lijst: enumerate
  delen:
    - opgave: |-
        Een visbestand van $5000$ vissen neemt elk jaar met $6$\,\% af. Na hoeveel jaar zijn er minder dan $2000$ vissen?
      antwoord: |-
        na 15 jaar ($t > 14{,}81$)
      uitwerking: |-
        $5000 \cdot 0{,}94^t < 2000 \iff 0{,}94^t < 0{,}4$. Neem $\ln$ van beide leden: $t \ln 0{,}94 < \ln 0{,}4$. Delen door $\ln 0{,}94 < 0$ keert het teken om: $t > \frac{\ln 0{,}4}{\ln 0{,}94} \approx 14{,}81$. Na 15 jaar zijn er minder dan $2000$ vissen.
    - opgave: |-
        Een spaarrekening geeft $2{,}5$\,\% intrest per jaar. Na hoeveel jaar is het kapitaal meer dan anderhalf keer zo groot?
      antwoord: |-
        na 17 jaar ($t > 16{,}42$)
      uitwerking: |-
        $1{,}025^t > 1{,}5 \iff t \ln 1{,}025 > \ln 1{,}5$. Nu is $\ln 1{,}025 > 0$, dus het teken blijft: $t > \frac{\ln 1{,}5}{\ln 1{,}025} \approx 16{,}42$. De intrest wordt per jaar bijgeteld: na 17 jaar.

- id: h3-ongelijkheid
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2^x > 100$
      antwoord: |-
        $x > \log_2 100 \approx 6{,}644$
      uitwerking: |-
        Het grondtal $2 > 1$, dus $\log_2$ van beide leden behoudt het teken: $x > \log_2 100 = \frac{\ln 100}{\ln 2} \approx 6{,}644$.
    - opgave: |-
        $0{,}5^x \geqslant 0{,}01$
      antwoord: |-
        $x \leqslant 6{,}644$
      uitwerking: |-
        $\ln$ van beide leden: $x \ln 0{,}5 \geqslant \ln 0{,}01$. Delen door $\ln 0{,}5 < 0$ keert het teken om: $x \leqslant \frac{\ln 0{,}01}{\ln 0{,}5} \approx 6{,}644$.
    - opgave: |-
        $\log_{0{,}5} x > 2$
      antwoord: |-
        $0 < x < \frac14$
      uitwerking: |-
        Voorwaarde: $x > 0$. Schrijf $2 = \log_{0{,}5} 0{,}25$. Het grondtal is kleiner dan 1, dus het teken keert om: $x < 0{,}5^2 = \frac14$. Samen: $0 < x < \frac14$.

- id: h3-k-logong
  soort: kort
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\log_2(x + 1) < 3$
      antwoord: |-
        $\left]-1, 7\right[$
      uitwerking: |-
        Voorwaarde: $x + 1 > 0 \iff x > -1$. Schrijf $3 = \log_2 8$; grondtal $2 > 1$, dus het teken blijft: $x + 1 < 8 \iff x < 7$. Samen: $x \in \left]-1, 7\right[$.
    - opgave: |-
        $\log_{\frac13}(x - 1) \geqslant -2$
      antwoord: |-
        $\left]1, 10\right]$
      uitwerking: |-
        Voorwaarde: $x - 1 > 0 \iff x > 1$. Schrijf $-2 = \log_{\frac13} 9$, want $\bigl(\frac13\bigr)^{-2} = 9$. Grondtal kleiner dan 1, dus het teken keert om: $x - 1 \leqslant 9 \iff x \leqslant 10$. Samen: $x \in \left]1, 10\right]$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3 (volgorde van het boek)
#----------------------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: domein
  opgave: |-
    Bepaal het domein.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \log(x + 5)$
      antwoord: |-
        $\left]-5, +\infty\right[$
      uitwerking: |-
        $x + 5 > 0 \iff x > -5$, dus $\dom f = \left]-5, +\infty\right[$.
    - opgave: |-
        $f(x) = \ln(x^2 - 9)$
      antwoord: |-
        $\left]-\infty, -3\right[ \cup \left]3, +\infty\right[$
      uitwerking: |-
        $x^2 - 9 > 0 \iff x^2 > 9$: buiten de nulwaarden $\pm 3$ van de dalparabool. Dus $\dom f = \left]-\infty, -3\right[ \cup \left]3, +\infty\right[$.
    - opgave: |-
        $f(x) = \log_2(3 - x) + \log_2 x$
      antwoord: |-
        $\left]0, 3\right[$
      uitwerking: |-
        Beide argumenten moeten positief zijn: $3 - x > 0$ en $x > 0$, dus $0 < x < 3$ en $\dom f = \left]0, 3\right[$.
    - opgave: |-
        $f(x) = \dfrac{1}{\ln x}$
      antwoord: |-
        $\left]0, 1\right[ \cup \left]1, +\infty\right[$
      uitwerking: |-
        $\ln x$ bestaat voor $x > 0$, en de noemer mag niet nul zijn: $\ln x \neq 0$, dus $x \neq 1$. Dus $\dom f = \left]0, 1\right[ \cup \left]1, +\infty\right[$.
    - opgave: |-
        $f(x) = \log(2x - 6)$
      antwoord: |-
        $\left]3, +\infty\right[$
      uitwerking: |-
        $2x - 6 > 0 \iff x > 3$, dus $\dom f = \left]3, +\infty\right[$.
    - opgave: |-
        $f(x) = \ln(x^2 + 1)$
      antwoord: |-
        $\R$
      uitwerking: |-
        $x^2 + 1 \geqslant 1 > 0$ voor elke $x$, dus $\dom f = \R$.
    - opgave: |-
        $f(x) = \log_3 |x|$
      antwoord: |-
        $\R \setminus \{0\}$
      uitwerking: |-
        $|x| > 0 \iff x \neq 0$, dus $\dom f = \R \setminus \{0\}$.
    - opgave: |-
        $f(x) = \ln \dfrac{x - 1}{x + 2}$
      antwoord: |-
        $\left]-\infty, -2\right[ \cup \left]1, +\infty\right[$
      uitwerking: |-
        $\frac{x - 1}{x + 2} > 0$: teller en noemer hebben hetzelfde teken. Tekentabel met nulwaarde $1$ en pool $-2$: positief voor $x < -2$ en voor $x > 1$. Dus $\dom f = \left]-\infty, -2\right[ \cup \left]1, +\infty\right[$.
    - opgave: |-
        $f(x) = \ln(\ln x)$
      antwoord: |-
        $\left]1, +\infty\right[$
      uitwerking: |-
        De binnenste logaritme vraagt $x > 0$, de buitenste $\ln x > 0$, dus $x > \e^0 = 1$. Samen $\dom f = \left]1, +\infty\right[$.
    - opgave: |-
        $f(x) = \sqrt{\log x}$
      antwoord: |-
        $\left[1, +\infty\right[$
      uitwerking: |-
        $\log x$ vraagt $x > 0$, de wortel vraagt $\log x \geqslant 0$, dus $x \geqslant 10^0 = 1$. Samen $\dom f = \left[1, +\infty\right[$.

- id: h3-o11
  soort: opdracht
  niveau: 1
  thema: |-
    grondtal uit de grafiek
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.45cm,y=.55cm,font=\scriptsize]
        \rooster{0}{1}{9}{-2}{1}{2}
        \kromme{.12}{9.6}{ln(\x)/ln(3)}
        \vol{(3,1)} \vol{(9,2)}
        \node[below right,text=accent] at (6,1.6) {$f$};
      \end{tikzpicture}
  opgave: |-
    Hiernaast staat de grafiek van $f(x) = \log_a x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal het grondtal $a$.
      antwoord: |-
        $a = 3$
      uitwerking: |-
        De grafiek gaat door $(9, 2)$: $\log_a 9 = 2$, dus $a^2 = 9$ en $a = 3$ (een grondtal is positief). Controle: ze gaat ook door $(3, 1)$, en $\log_3 3 = 1$.
    - opgave: |-
        Bereken $f(27)$ en $f\bigl(\frac19\bigr)$.
      antwoord: |-
        $3$; $-2$
      uitwerking: |-
        $f(27) = \log_3 3^3 = 3$ en $f\bigl(\frac19\bigr) = \log_3 3^{-2} = -2$.
    - opgave: |-
        Los op: $f(x) = 4$.
      antwoord: |-
        $x = 81$
      uitwerking: |-
        $\log_3 x = 4 \iff x = 3^4 = 81$.
    - opgave: |-
        Los op met de grafiek: $f(x) \leqslant 1$.
      antwoord: |-
        $\left]0, 3\right]$
      uitwerking: |-
        $f(3) = 1$ en $f$ stijgt, dus de grafiek ligt op of onder de hoogte 1 links van $x = 3$. Met het domein: $x \in \left]0, 3\right]$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: logaritmische vergelijkingen
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log_4 x = \frac12$
      antwoord: |-
        $x = 2$
      uitwerking: |-
        Voorwaarde $x > 0$. $x = 4^{\frac12} = \sqrt4 = 2$.
    - opgave: |-
        $\log(x + 3) = 2$
      antwoord: |-
        $x = 97$
      uitwerking: |-
        Voorwaarde $x > -3$. $x + 3 = 10^2 = 100$, dus $x = 97$.
    - opgave: |-
        $\ln(2x) = \ln(x + 5)$
      antwoord: |-
        $x = 5$
      uitwerking: |-
        Voorwaarden $x > 0$ en $x > -5$, samen $x > 0$. Gelijke argumenten: $2x = x + 5$, dus $x = 5$.
    - opgave: |-
        $\log_2 x = 5$
      antwoord: |-
        $x = 32$
      uitwerking: |-
        Voorwaarde $x > 0$. $x = 2^5 = 32$.
    - opgave: |-
        $\log_3 x = -2$
      antwoord: |-
        $x = \frac19$
      uitwerking: |-
        Voorwaarde $x > 0$. $x = 3^{-2} = \frac19$.
    - opgave: |-
        $\ln x = -1$
      antwoord: |-
        $x = \frac1\e$
      uitwerking: |-
        Voorwaarde $x > 0$. $x = \e^{-1} = \frac1\e \approx 0{,}368$.
    - opgave: |-
        $\log_{\frac12} x = 3$
      antwoord: |-
        $x = \frac18$
      uitwerking: |-
        Voorwaarde $x > 0$. $x = \bigl(\frac12\bigr)^3 = \frac18$.
    - opgave: |-
        $\log_5(2x - 1) = 2$
      antwoord: |-
        $x = 13$
      uitwerking: |-
        Voorwaarde $x > \frac12$. $2x - 1 = 5^2 = 25$, dus $x = 13$.
    - opgave: |-
        $\ln(4x + 1) = 0$
      antwoord: |-
        $x = 0$
      uitwerking: |-
        Voorwaarde $x > -\frac14$. $4x + 1 = \e^0 = 1$, dus $x = 0$.
    - opgave: |-
        $\log_x 49 = 2$
      antwoord: |-
        $x = 7$
      uitwerking: |-
        Het grondtal moet positief en verschillend van 1 zijn. $x^2 = 49$, dus $x = 7$ of $x = -7$. Alleen $x = 7$ is een grondtal.
    - opgave: |-
        $\log_2(x^2) = 4$
      antwoord: |-
        $x = 4$ of $x = -4$
      uitwerking: |-
        Voorwaarde $x^2 > 0$, dus $x \neq 0$. $x^2 = 2^4 = 16$, dus $x = 4$ of $x = -4$: beide voldoen.
    - opgave: |-
        $2\log_3 x = 4$
      antwoord: |-
        $x = 9$
      uitwerking: |-
        Voorwaarde $x > 0$. $\log_3 x = 2$, dus $x = 3^2 = 9$.
    - opgave: |-
        $\log \dfrac{x}{2} = -1$
      antwoord: |-
        $x = 0{,}2$
      uitwerking: |-
        Voorwaarde $x > 0$. $\frac{x}{2} = 10^{-1} = 0{,}1$, dus $x = 0{,}2$.
    - opgave: |-
        $\ln(x + 1) = \ln(2x - 5)$
      antwoord: |-
        $x = 6$
      uitwerking: |-
        Voorwaarden $x > -1$ en $x > \frac52$, samen $x > \frac52$. $x + 1 = 2x - 5$, dus $x = 6$. Dat voldoet.
    - opgave: |-
        $\ln(x^2 - 1) = \ln(3x + 3)$
      antwoord: |-
        $x = 4$
      uitwerking: |-
        Voorwaarden $x^2 - 1 > 0$ en $3x + 3 > 0$, samen $x > 1$. Gelijke argumenten: $x^2 - 1 = 3x + 3 \iff x^2 - 3x - 4 = 0 \iff (x - 4)(x + 1) = 0$. Alleen $x = 4$ voldoet; voor $x = -1$ bestaat geen van beide logaritmen.

- id: h3-o12
  soort: opdracht
  niveau: 1
  thema: |-
    grafieken schetsen
  opgave: |-
    Schets de grafiek vanuit die van $\log_2 x$. Geef het domein, de asymptoot en het beeld van het punt $(1, 0)$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = \log_2(x + 2)$
      antwoord: |-
        $\left]-2, +\infty\right[$; $x = -2$; $(-1, 0)$
      uitwerking: |-
        2 naar links. $x + 2 > 0$, dus $\dom f = \left]-2, +\infty\right[$, asymptoot $x = -2$, en $(1, 0) \mapsto (-1, 0)$.
        \figuren{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-3}{1}{4}{-3}{1}{3}
          \draw[grijs,dashed] (-2,-3) -- (-2,3.3);
          \kromme[densely dotted]{.13}{4}{ln(\x)/ln(2)}
          \kromme{-1.87}{4}{ln(\x+2)/ln(2)}
          \vol{(-1,0)}
        \end{tikzpicture}}
    - opgave: |-
        $g(x) = \log_2 x - 2$
      antwoord: |-
        $\left]0, +\infty\right[$; $x = 0$; $(1, -2)$
      uitwerking: |-
        2 naar onder. Het domein verandert niet: $\dom g = \left]0, +\infty\right[$, asymptoot $x = 0$, en $(1, 0) \mapsto (1, -2)$. De nulwaarde is $x = 4$.
        \figuren{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-1}{1}{6}{-3}{1}{3}
          \kromme[densely dotted]{.13}{6}{ln(\x)/ln(2)}
          \kromme{.5}{6}{ln(\x)/ln(2)-2}
          \vol{(1,-2)}
        \end{tikzpicture}}
    - opgave: |-
        $h(x) = -\log_2(x - 1)$
      antwoord: |-
        $\left]1, +\infty\right[$; $x = 1$; $(2, 0)$
      uitwerking: |-
        1 naar rechts en gespiegeld om de $x$-as, dus dalend. $x - 1 > 0$, dus $\dom h = \left]1, +\infty\right[$, asymptoot $x = 1$, en $(1, 0) \mapsto (2, 0)$.
        \figuren{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-1}{1}{6}{-3}{1}{3}
          \draw[grijs,dashed] (1,-3) -- (1,3.3);
          \kromme[densely dotted]{.13}{6}{ln(\x)/ln(2)}
          \kromme{1.13}{6}{-ln(\x-1)/ln(2)}
          \vol{(2,0)}
        \end{tikzpicture}}

- id: h3-o13
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijken met het stijgen of dalen
  opgave: |-
    Welk getal is het grootst? Antwoord zonder rekentoestel en verklaar met het stijgen of dalen van een functie.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log_2 5$ of $\log_2 7$
      antwoord: |-
        $\log_2 7$
      uitwerking: |-
        $\log_2 x$ stijgt (grondtal $2 > 1$) en $5 < 7$, dus $\log_2 5 < \log_2 7$.
    - opgave: |-
        $\log_{0{,}5} 5$ of $\log_{0{,}5} 7$
      antwoord: |-
        $\log_{0{,}5} 5$
      uitwerking: |-
        $\log_{0{,}5} x$ daalt (grondtal kleiner dan 1) en $5 < 7$, dus $\log_{0{,}5} 5 > \log_{0{,}5} 7$.
    - opgave: |-
        $\log_3 10$ of $2$
      antwoord: |-
        $\log_3 10$
      uitwerking: |-
        $2 = \log_3 9$ en $\log_3 x$ stijgt, dus $\log_3 10 > \log_3 9 = 2$.
    - opgave: |-
        $\ln 0{,}9$ of $0$
      antwoord: |-
        $0$
      uitwerking: |-
        $0 = \ln 1$ en $\ln x$ stijgt, dus $\ln 0{,}9 < \ln 1 = 0$.
    - opgave: |-
        $\log_{\frac13} 0{,}2$ of $1$
      antwoord: |-
        $\log_{\frac13} 0{,}2$
      uitwerking: |-
        $1 = \log_{\frac13} \frac13$. De functie daalt en $0{,}2 < \frac13$, dus $\log_{\frac13} 0{,}2 > 1$. (Met het rekentoestel: $\approx 1{,}46$.)
    - opgave: |-
        $0{,}7^{2{,}5}$ of $0{,}7^{3}$
      antwoord: |-
        $0{,}7^{2{,}5}$
      uitwerking: |-
        $0{,}7^x$ daalt (grondtal kleiner dan 1) en $2{,}5 < 3$, dus $0{,}7^{2{,}5} > 0{,}7^3$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    voorschrift uit een grafiek
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
        \rooster{-2}{1}{5}{-3}{1}{3}
        \draw[grijs,dashed] (-1,-3) -- (-1,3.3);
        \kromme{-.93}{5}{ln(\x+1)/ln(3)+1}
        \vol{(0,1)} \vol{(2,2)}
      \end{tikzpicture}
  opgave: |-
    De grafiek hiernaast ontstaat uit die van $\log_3 x$ door verschuiven. Ze gaat door $(0, 1)$ en $(2, 2)$, met asymptoot $x = -1$. Geef het voorschrift en de nulwaarde.
  antwoord: |-
    $\log_3(x + 1) + 1$; $-\frac23$
  uitwerking: |-
    De asymptoot $x = 0$ van $\log_3 x$ is $x = -1$ geworden: 1 naar links. Het punt $(1, 0)$ van $\log_3 x$ gaat dan naar $(0, 0)$, maar ligt op $(0, 1)$: ook 1 naar boven. Dus $f(x) = \log_3(x + 1) + 1$. Controle: $f(2) = \log_3 3 + 1 = 2$. Nulwaarde: $\log_3(x + 1) = -1$, dus $x + 1 = 3^{-1} = \frac13$ en $x = -\frac23$.

- id: h3-o14
  soort: opdracht
  niveau: 1
  thema: |-
    eenvoudige ongelijkheden
  opgave: |-
    Los op zonder rekentoestel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log_2 x > 3$
      antwoord: |-
        $x > 8$
      uitwerking: |-
        Voorwaarde $x > 0$. $3 = \log_2 8$, grondtal $> 1$: $x > 8$.
    - opgave: |-
        $\ln x \leqslant 0$
      antwoord: |-
        $0 < x \leqslant 1$
      uitwerking: |-
        Voorwaarde $x > 0$. $0 = \ln 1$, grondtal $\e > 1$: $x \leqslant 1$. Samen $0 < x \leqslant 1$.
    - opgave: |-
        $\log_{\frac13} x < 2$
      antwoord: |-
        $x > \frac19$
      uitwerking: |-
        Voorwaarde $x > 0$. $2 = \log_{\frac13} \frac19$, grondtal $< 1$, dus het teken keert om: $x > \frac19$.
    - opgave: |-
        $3^x < \frac{1}{27}$
      antwoord: |-
        $x < -3$
      uitwerking: |-
        $3^x < 3^{-3}$, grondtal $> 1$: $x < -3$.
    - opgave: |-
        $0{,}2^x > 25$
      antwoord: |-
        $x < -2$
      uitwerking: |-
        $0{,}2 = 5^{-1}$, dus $5^{-x} > 5^2$, grondtal $> 1$: $-x > 2$, dus $x < -2$.
    - opgave: |-
        $\log(x + 1) \geqslant 1$
      antwoord: |-
        $x \geqslant 9$
      uitwerking: |-
        Voorwaarde $x > -1$. $1 = \log 10$: $x + 1 \geqslant 10$, dus $x \geqslant 9$.

- id: h3-o15
  soort: opdracht
  niveau: 1
  thema: |-
    grafieken herkennen
  opgave: |-
    Welke grafiek hoort bij welk voorschrift? Let op de asymptoot en op een punt dat je kent.

    \figuren{\begin{tikzpicture}[x=.37cm,y=.37cm,font=\tiny]
      \rooster{-3}{1}{4}{-3}{1}{3}
      \kromme{.13}{4}{-ln(\x)/ln(2)}
      \node[text=accent,font=\scriptsize] at (-2,2.5) {A};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.37cm,y=.37cm,font=\tiny]
      \rooster{-3}{1}{4}{-3}{1}{3}
      \draw[grijs,dashed] (-2,-3) -- (-2,3.3);
      \kromme{-1.87}{4}{ln(\x+2)/ln(2)}
      \node[text=accent,font=\scriptsize] at (-2.6,2.5) {B};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.37cm,y=.37cm,font=\tiny]
      \rooster{-3}{1}{4}{-3}{1}{3}
      \kromme{.5}{4}{ln(\x)/ln(2)-2}
      \node[text=accent,font=\scriptsize] at (-2,2.5) {C};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.37cm,y=.37cm,font=\tiny]
      \rooster{-3}{1}{4}{-3}{1}{3}
      \draw[grijs,dashed] (-3,-2) -- (4.3,-2);
      \kromme{-3}{2.32}{2^(\x)-2}
      \node[text=accent,font=\scriptsize] at (-2,2.5) {D};
    \end{tikzpicture}}
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\log_2(x + 2)$
      antwoord: |-
        B
      uitwerking: |-
        Verticale asymptoot $x = -2$, en door $(-1, 0)$ en $(0, 1)$: grafiek B.
    - opgave: |-
        $2^x - 2$
      antwoord: |-
        D
      uitwerking: |-
        Een exponentiële functie heeft een horizontale asymptoot, hier $y = -2$, en gaat door $(1, 0)$: grafiek D.
    - opgave: |-
        $\log_2 x - 2$
      antwoord: |-
        C
      uitwerking: |-
        Asymptoot $x = 0$, stijgend, door $(1, -2)$ en $(4, 0)$: grafiek C.
    - opgave: |-
        $\log_{\frac12} x$
      antwoord: |-
        A
      uitwerking: |-
        Grondtal kleiner dan 1: dalend, door $(1, 0)$ en $(2, -1)$. Grafiek A.
  slot: |-
    Welke twee grafieken zijn elkaars spiegelbeeld om de rechte $y = x$? Verklaar.
  antwoord: |-
    \textbf{a.}~B \quad \textbf{b.}~D \quad \textbf{c.}~C \quad \textbf{d.}~A \quad B en D zijn elkaars spiegelbeeld.
  uitwerking: |-
    \textbf{a.}~$\log_2(x + 2)$: verticale asymptoot $x = -2$, door $(-1, 0)$ en $(0, 1)$. Grafiek B.\par
    \textbf{b.}~$2^x - 2$: een exponentiële functie heeft een horizontale asymptoot, hier $y = -2$, en gaat door $(1, 0)$. Grafiek D.\par
    \textbf{c.}~$\log_2 x - 2$: asymptoot $x = 0$, stijgend, door $(1, -2)$ en $(4, 0)$. Grafiek C.\par
    \textbf{d.}~$\log_{\frac12} x$: grondtal kleiner dan 1, dus dalend, door $(1, 0)$ en $(2, -1)$. Grafiek A.\par
    B en D zijn elkaars spiegelbeeld om $y = x$: ze zijn elkaars inverse. Uit $y = 2^x - 2$ volgt $2^x = y + 2$, dus $x = \log_2(y + 2)$. Ook de punten wisselen: $(0, -1)$ op D en $(-1, 0)$ op B, de asymptoot $y = -2$ en $x = -2$.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    een logaritmisch groeimodel
  opgave: |-
    Een leerling oefent typen. Na $t$ weken typt ze $W(t) = 25 + 12\ln(t + 1)$ woorden per minuut.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel woorden per minuut typt ze bij de start, en na 4 weken?
      antwoord: |-
        $25$; ongeveer $44$
      uitwerking: |-
        $W(0) = 25 + 12\ln 1 = 25$ en $W(4) = 25 + 12\ln 5 \approx 44{,}3$ woorden per minuut.
    - opgave: |-
        Na hoeveel weken haalt ze $60$ woorden per minuut?
      antwoord: |-
        na ongeveer $17{,}5$ weken
      uitwerking: |-
        $25 + 12\ln(t + 1) = 60 \iff \ln(t + 1) = \frac{35}{12}$. Definitie: $t + 1 = \e^{\frac{35}{12}}$, dus $t = \e^{\frac{35}{12}} - 1 \approx 17{,}5$ weken.
    - opgave: |-
        Hoeveel weken extra oefenen zijn nodig om van $60$ naar $70$ woorden per minuut te gaan? Waarom duurt dat zo lang?
      antwoord: |-
        ongeveer 24 weken; de logaritme groeit steeds trager
      uitwerking: |-
        $\ln(t + 1) = \frac{45}{12} = 3{,}75$ geeft $t = \e^{3{,}75} - 1 \approx 41{,}5$ weken: ongeveer $41{,}5 - 17{,}5 = 24$ weken extra. Telkens $12$ woorden meer vraagt dat $t + 1$ met $\e$ vermenigvuldigd wordt: een logaritmische functie stijgt steeds trager.

- id: h3-o4
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijkingen met twee logaritmen
  opgave: |-
    Los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\log_2 x + \log_2(x - 2) = 3$
      antwoord: |-
        $x = 4$
      uitwerking: |-
        Voorwaarden: $x > 0$ en $x > 2$, samen $x > 2$. Productregel: $\log_2\bigl(x(x - 2)\bigr) = 3$, dus $x^2 - 2x = 8$. Dan $x^2 - 2x - 8 = (x - 4)(x + 2) = 0$, dus $x = 4$ of $x = -2$. Alleen $x = 4$ voldoet aan $x > 2$.
    - opgave: |-
        $\log_3(x + 1) + \log_3(x + 3) = 1$
      antwoord: |-
        $x = 0$
      uitwerking: |-
        Voorwaarden: $x > -1$ en $x > -3$, samen $x > -1$. Productregel: $(x + 1)(x + 3) = 3^1 = 3$, dus $x^2 + 4x = 0$ en $x(x + 4) = 0$. Dan $x = 0$ of $x = -4$; alleen $x = 0$ voldoet aan $x > -1$.
    - opgave: |-
        $\log(x + 6) - \log(x - 3) = 1$
      antwoord: |-
        $x = 4$
      uitwerking: |-
        Voorwaarden: $x > -6$ en $x > 3$, samen $x > 3$. Quotiëntregel: $\log \frac{x + 6}{x - 3} = 1$, dus $\frac{x + 6}{x - 3} = 10$. Dan $x + 6 = 10x - 30$, zodat $9x = 36$ en $x = 4$. Dat voldoet.
    - opgave: |-
        $2\ln x = \ln(x + 6)$
      antwoord: |-
        $x = 3$
      uitwerking: |-
        Voorwaarden: $x > 0$ en $x > -6$, samen $x > 0$. Machtregel: $\ln x^2 = \ln(x + 6)$, dus $x^2 = x + 6$. Dan $x^2 - x - 6 = (x - 3)(x + 2) = 0$, dus $x = 3$ of $x = -2$. Alleen $x = 3$ voldoet aan $x > 0$.

- id: h3-o19
  soort: opdracht
  niveau: 2
  thema: |-
    grafisch oplossen
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.6cm,font=\scriptsize]
        \rooster{0}{1}{6}{-2}{1}{3}
        \kromme{.25}{6}{ln(\x)/ln(2)}
        \kromme[dashed]{0}{5}{3-\x}
        \node[above,text=accent] at (5.2,2.4) {$f$};
        \node[right,text=accent] at (4.9,-1.4) {$g$};
      \end{tikzpicture}
  opgave: |-
    Hiernaast staan de grafieken van $f(x) = \log_2 x$ en $g(x) = 3 - x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees het snijpunt af en controleer door in te vullen.
      antwoord: |-
        $(2, 1)$
      uitwerking: |-
        De grafieken snijden in $(2, 1)$. Controle: $\log_2 2 = 1$ en $3 - 2 = 1$.
    - opgave: |-
        Los op: $\log_2 x \geqslant 3 - x$.
      antwoord: |-
        $x \geqslant 2$
      uitwerking: |-
        $f$ stijgt en $g$ daalt, dus ze snijden maar één keer. Rechts van het snijpunt ligt $f$ boven $g$. Met het domein $x > 0$: $x \in \left[2, +\infty\right[$.
    - opgave: |-
        Waarom kun je $\log_2 x = 3 - x$ niet oplossen met de werkwijze van dit hoofdstuk?
      antwoord: |-
        $x$ staat in en buiten de logaritme
      uitwerking: |-
        De onbekende staat zowel in de logaritme als erbuiten. Je kunt de vergelijking dus niet in de vorm $\log_2 A = c$ of $\log_2 A = \log_2 B$ brengen. Grafisch (of door te proberen) lukt het wel.

- id: h3-o7
  soort: opdracht
  niveau: 2
  thema: |-
    aardbevingen
  opgave: |-
    De magnitude van een aardbeving is $M = \log \frac{A}{A_0}$, met $A$ de uitslag van de seismograaf en $A_0$ een vaste referentie. De vrijgekomen energie is evenredig met $10^{1{,}5M}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Een beving heeft magnitude 7, een andere magnitude 5. Hoeveel keer groter is de uitslag?
      antwoord: |-
        100 keer
      uitwerking: |-
        $7 - 5 = \log \frac{A_7}{A_0} - \log \frac{A_5}{A_0} = \log \frac{A_7}{A_5}$ (quotiëntregel), dus $\frac{A_7}{A_5} = 10^2 = 100$.
    - opgave: |-
        Hoeveel keer meer energie komt er vrij?
      antwoord: |-
        1000 keer
      uitwerking: |-
        $\frac{10^{1{,}5 \cdot 7}}{10^{1{,}5 \cdot 5}} = 10^{1{,}5 \cdot 2} = 10^3 = 1000$.
    - opgave: |-
        Bij een beving komt $1000$ keer meer energie vrij dan bij een beving met magnitude $5{,}5$. Welke magnitude heeft ze?
      antwoord: |-
        $7{,}5$
      uitwerking: |-
        $10^{1{,}5(M - 5{,}5)} = 1000 = 10^3$, dus $1{,}5(M - 5{,}5) = 3$ en $M - 5{,}5 = 2$. De magnitude is $7{,}5$.

- id: h3-o6
  soort: opdracht
  niveau: 2
  thema: |-
    drill: ongelijkheden
  opgave: |-
    Los op. Rond af op twee decimalen waar nodig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3 \cdot 1{,}2^x \geqslant 30$
      antwoord: |-
        $x \geqslant 12{,}63$
      uitwerking: |-
        $1{,}2^x \geqslant 10$. $\ln$ van beide leden, en $\ln 1{,}2 > 0$: $x \geqslant \frac{\ln 10}{\ln 1{,}2} \approx 12{,}63$.
    - opgave: |-
        $\log_2(x + 1) \geqslant 3$
      antwoord: |-
        $x \geqslant 7$
      uitwerking: |-
        Voorwaarde $x > -1$. $3 = \log_2 8$, grondtal $> 1$: $x + 1 \geqslant 8$, dus $x \geqslant 7$. Samen $x \geqslant 7$.
    - opgave: |-
        $\ln(2 - x) < 0$
      antwoord: |-
        $1 < x < 2$
      uitwerking: |-
        Voorwaarde $2 - x > 0 \iff x < 2$. $0 = \ln 1$: $2 - x < 1$, dus $x > 1$. Samen $1 < x < 2$.
    - opgave: |-
        $5 \cdot 0{,}8^x < 1$
      antwoord: |-
        $x > 7{,}21$
      uitwerking: |-
        $0{,}8^x < 0{,}2$. $\ln$ van beide leden: $x\ln 0{,}8 < \ln 0{,}2$. Delen door $\ln 0{,}8 < 0$ keert het teken om: $x > \frac{\ln 0{,}2}{\ln 0{,}8} \approx 7{,}21$.
    - opgave: |-
        $\log_{0{,}5}(2x - 1) \geqslant -2$
      antwoord: |-
        $\frac12 < x \leqslant \frac52$
      uitwerking: |-
        Voorwaarde $x > \frac12$. $-2 = \log_{0{,}5} 4$, grondtal $< 1$, dus het teken keert om: $2x - 1 \leqslant 4$, dus $x \leqslant \frac52$. Samen $x \in \left]\frac12, \frac52\right]$.
    - opgave: |-
        $\log x + \log(x + 3) < 1$
      antwoord: |-
        $0 < x < 2$
      uitwerking: |-
        Voorwaarden $x > 0$ en $x > -3$, samen $x > 0$. Productregel en $1 = \log 10$: $x(x + 3) < 10$, dus $x^2 + 3x - 10 = (x + 5)(x - 2) < 0$ en $-5 < x < 2$. Samen $x \in \left]0, 2\right[$.
    - opgave: |-
        $2^{x + 1} > 3^x$
      antwoord: |-
        $x < 1{,}71$
      uitwerking: |-
        $\ln$ van beide leden: $(x + 1)\ln 2 > x\ln 3$, dus $x(\ln 3 - \ln 2) < \ln 2$. Nu is $\ln 3 - \ln 2 > 0$: $x < \frac{\ln 2}{\ln 1{,}5} \approx 1{,}71$.
    - opgave: |-
        $\bigl(\frac13\bigr)^x \geqslant 9^{x - 1}$
      antwoord: |-
        $x \leqslant \frac23$
      uitwerking: |-
        Alles als macht van 3: $3^{-x} \geqslant 3^{2x - 2}$. Grondtal $> 1$: $-x \geqslant 2x - 2$, dus $3x \leqslant 2$ en $x \leqslant \frac23$.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    waar zit de fout?
  opgave: |-
    Elke oplossing bevat een fout. Waar zit de fout? Geef de juiste oplossing.
  lijst: enumerate
  delen:
    - opgave: |-
        Lies: $\log x + \log(x - 3) = 1 \Rightarrow x(x - 3) = 10 \Rightarrow x = 5$ of $x = -2$.
      antwoord: |-
        alleen $x = 5$
      uitwerking: |-
        Lies vergat de bestaansvoorwaarden: $x > 0$ en $x > 3$, samen $x > 3$. Voor $x = -2$ bestaan $\log(-2)$ en $\log(-5)$ niet. De enige oplossing is $x = 5$; controle: $\log 5 + \log 2 = \log 10 = 1$.
    - opgave: |-
        Bram: $\ln(x^2) = 2 \Rightarrow 2\ln x = 2 \Rightarrow \ln x = 1 \Rightarrow x = \e$.
      antwoord: |-
        $x = \e$ of $x = -\e$
      uitwerking: |-
        $\ln(x^2) = 2\ln x$ geldt alleen voor $x > 0$, maar $\ln(x^2)$ bestaat voor elke $x \neq 0$. Zo verliest Bram een oplossing. Juist: $x^2 = \e^2$, dus $x = \e$ of $x = -\e$. (Voor elke $x \neq 0$ is $\ln(x^2) = 2\ln|x|$.)
    - opgave: |-
        Nora: $\log_{0{,}5} x > 3 \Rightarrow x > 0{,}5^3 \Rightarrow x > \frac18$.
      antwoord: |-
        $0 < x < \frac18$
      uitwerking: |-
        Het grondtal $0{,}5$ is kleiner dan 1: de functie daalt, dus het teken moet omkeren. Met de voorwaarde $x > 0$: $0 < x < \frac18$. Controle: $\log_{0{,}5} 1 = 0$ is niet groter dan 3, en $1 > \frac18$.
    - opgave: |-
        Ward: $0{,}7^t < 0{,}2 \Rightarrow t\ln 0{,}7 < \ln 0{,}2 \Rightarrow t < \dfrac{\ln 0{,}2}{\ln 0{,}7} \approx 4{,}51$.
      antwoord: |-
        $t > 4{,}51$
      uitwerking: |-
        Ward deelt door $\ln 0{,}7$, en dat is negatief: het teken moet omkeren. Juist: $t > \frac{\ln 0{,}2}{\ln 0{,}7} \approx 4{,}51$. Logisch ook: $0{,}7^t$ daalt, dus het wordt pas klein voor grote $t$.

- id: h3-o20
  soort: opdracht
  niveau: 2
  thema: |-
    waardeverlies van een auto
  opgave: |-
    Een nieuwe auto kost $28\,000$ euro en verliest elk jaar $15$\,\% van zijn waarde.
  lijst: enumerate
  delen:
    - opgave: |-
        Na hoeveel jaar is de auto minder dan $10\,000$ euro waard?
      antwoord: |-
        na 7 jaar ($t > 6{,}34$)
      uitwerking: |-
        $28\,000 \cdot 0{,}85^t < 10\,000 \iff 0{,}85^t < \frac{10}{28}$. $\ln$ van beide leden en delen door $\ln 0{,}85 < 0$: $t > \frac{\ln \frac{10}{28}}{\ln 0{,}85} \approx 6{,}34$. Na 7 jaar (de waarde is dan ongeveer $8976$ euro; na 6 jaar nog ongeveer $10\,560$ euro).
    - opgave: |-
        Na hoeveel tijd is hij de helft van zijn waarde kwijt?
      antwoord: |-
        na ongeveer $4{,}3$ jaar
      uitwerking: |-
        $0{,}85^t = 0{,}5 \iff t = \frac{\ln 0{,}5}{\ln 0{,}85} \approx 4{,}27$ jaar. Dat hangt niet af van de aankoopprijs.
    - opgave: |-
        Een ander merk belooft dat zijn auto van $28\,000$ euro na 5 jaar nog minstens $15\,000$ euro waard is. Hoeveel procent per jaar mag die auto dan hoogstens verliezen?
      antwoord: |-
        ongeveer $11{,}7$\,\%
      uitwerking: |-
        Met groeifactor $a$: $28\,000 \cdot a^5 \geqslant 15\,000 \iff a^5 \geqslant \frac{15}{28}$. Omdat $x^5$ stijgt voor $x > 0$: $a \geqslant \bigl(\frac{15}{28}\bigr)^{\frac15} \approx 0{,}8826$. Het verlies is hoogstens $1 - 0{,}8826 \approx 0{,}117$, dus ongeveer $11{,}7$\,\% per jaar.

- id: h3-o5
  soort: opdracht
  niveau: 2
  thema: |-
    substitutie
  opgave: |-
    Los op. Tip: stel $t$ gelijk aan de logaritme of de macht die meerdere keren voorkomt.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(\ln x)^2 - 3\ln x + 2 = 0$
      antwoord: |-
        $x = \e$ of $x = \e^2$
      uitwerking: |-
        Voorwaarde $x > 0$. Stel $t = \ln x$: $t^2 - 3t + 2 = (t - 1)(t - 2) = 0$, dus $t = 1$ of $t = 2$. Dan $\ln x = 1$ of $\ln x = 2$, dus $x = \e$ of $x = \e^2$. Beide voldoen.
    - opgave: |-
        $(\log x)^2 = \log x^3$
      antwoord: |-
        $x = 1$ of $x = 1000$
      uitwerking: |-
        Voorwaarde $x > 0$. Machtregel: $(\log x)^2 = 3\log x$. Stel $t = \log x$: $t^2 - 3t = t(t - 3) = 0$, dus $t = 0$ of $t = 3$. Dan $x = 10^0 = 1$ of $x = 10^3 = 1000$.
    - opgave: |-
        $\e^{2x} - 4\e^x + 3 = 0$
      antwoord: |-
        $x = 0$ of $x = \ln 3$
      uitwerking: |-
        Stel $t = \e^x > 0$, dan is $\e^{2x} = t^2$: $t^2 - 4t + 3 = (t - 1)(t - 3) = 0$, dus $t = 1$ of $t = 3$. Beide zijn positief: $\e^x = 1$ geeft $x = 0$, $\e^x = 3$ geeft $x = \ln 3 \approx 1{,}10$.

- id: h3-o22
  soort: opdracht
  niveau: 2
  thema: |-
    snijpunt van twee logaritmische grafieken
  figuur:
    opties: |-
      5cm
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.5cm,font=\scriptsize]
        \roosterleeg{-4}{1}{7}{-2}{1}{4}
        \foreach \t in {-4,-2,2,4,6}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {-2,-1,1,2,3,4}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \draw[grijs,dashed] (-4,-2) -- (-4,4.3);
        \kromme{-3.75}{7}{ln(\x+4)/ln(2)}
        \kromme[dashed]{.125}{7}{ln(\x)/ln(2)+1}
        \node[above,text=accent] at (-2.6,1.3) {$f$};
        \node[right,text=accent] at (.4,-1.6) {$g$};
      \end{tikzpicture}
  opgave: |-
    Hiernaast staan de grafieken van $f(x) = \log_2(x + 4)$ en $g(x) = \log_2 x + 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het snijpunt.
      antwoord: |-
        $(4, 3)$
      uitwerking: |-
        Voorwaarden: $x > -4$ en $x > 0$, samen $x > 0$. Schrijf $1 = \log_2 2$, dan is $g(x) = \log_2(2x)$. Uit $\log_2(x + 4) = \log_2(2x)$ volgt $x + 4 = 2x$, dus $x = 4$. Het snijpunt is $(4, \log_2 8) = (4, 3)$.
    - opgave: |-
        Voor welke $x$ ligt de grafiek van $f$ boven die van $g$?
      antwoord: |-
        $0 < x < 4$
      uitwerking: |-
        Waar beide bestaan ($x > 0$): $\log_2(x + 4) > \log_2(2x) \iff x + 4 > 2x \iff x < 4$, want het grondtal is groter dan 1. Dus $0 < x < 4$. Voor $-4 < x \leqslant 0$ bestaat alleen $f$.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    koolstofdatering
  opgave: |-
    Koolstof-14 heeft een halveringstijd van $5730$ jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        In een bot is nog $30$\,\% van de oorspronkelijke hoeveelheid koolstof-14 over. Hoe oud is het bot?
      antwoord: |-
        ongeveer $10\,000$ jaar
      uitwerking: |-
        Na $t$ jaar is de fractie $0{,}5^{\frac{t}{5730}}$ over. $0{,}5^{\frac{t}{5730}} = 0{,}3 \iff \frac{t}{5730} = \frac{\ln 0{,}3}{\ln 0{,}5}$, dus $t = 5730 \cdot \frac{\ln 0{,}3}{\ln 0{,}5} \approx 9953$ jaar: ongeveer $10\,000$ jaar.
    - opgave: |-
        Hoeveel procent is er na $2000$ jaar nog over?
      antwoord: |-
        ongeveer $78{,}5$\,\%
      uitwerking: |-
        $0{,}5^{\frac{2000}{5730}} \approx 0{,}785$: ongeveer $78{,}5$\,\%.
    - opgave: |-
        Een toestel kan koolstof-14 meten zolang er minstens $1$\,\% over is. Hoe oud mag een voorwerp hoogstens zijn om het zo te dateren?
      antwoord: |-
        ongeveer $38\,000$ jaar
      uitwerking: |-
        $0{,}5^{\frac{t}{5730}} \geqslant 0{,}01$. $\ln$ van beide leden en delen door $\ln 0{,}5 < 0$: $t \leqslant 5730 \cdot \frac{\ln 0{,}01}{\ln 0{,}5} \approx 38\,069$ jaar, dus ongeveer $38\,000$ jaar.

- id: h3-o18
  soort: opdracht
  niveau: 2
  thema: |-
    rekenregels veranderen het domein
  opgave: |-
    Neem $f(x) = \ln x + \ln(x - 2)$ en $g(x) = \ln(x^2 - 2x)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal het domein van $f$ en van $g$.
      antwoord: |-
        $\dom f = \left]2, +\infty\right[$; $\dom g = \left]-\infty, 0\right[ \cup \left]2, +\infty\right[$
      uitwerking: |-
        $f$: $x > 0$ en $x > 2$, dus $\dom f = \left]2, +\infty\right[$. $g$: $x^2 - 2x = x(x - 2) > 0$, buiten de nulwaarden 0 en 2: $\dom g = \left]-\infty, 0\right[ \cup \left]2, +\infty\right[$.
    - opgave: |-
        Los op: $f(x) = \ln 3$, en ook $g(x) = \ln 3$.
      antwoord: |-
        $f$: $x = 3$; $g$: $x = 3$ of $x = -1$
      uitwerking: |-
        In beide gevallen volgt $x^2 - 2x = 3$, dus $(x - 3)(x + 1) = 0$ en $x = 3$ of $x = -1$. Voor $f$ voldoet alleen $x = 3$ (want $x > 2$). Voor $g$ liggen beide in het domein: $g(-1) = \ln 3$ en $g(3) = \ln 3$.
    - opgave: |-
        Zijn $f$ en $g$ dezelfde functie? Wat leer je daaruit over de productregel?
      antwoord: |-
        alleen gelijk op $\left]2, +\infty\right[$
      uitwerking: |-
        Nee: ze hebben een ander domein. Op $\left]2, +\infty\right[$ zijn ze gelijk, want daar mag je de productregel gebruiken. De productregel $\ln A + \ln B = \ln(AB)$ geldt alleen als $A > 0$ en $B > 0$. Wie $f(x) = \ln 3$ oplost via $g$, vindt er een oplossing bij: controleer altijd de bestaansvoorwaarden van de opgave.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    afkoelen
  figuur:
    opties: |-
      5cm
    code: |-
      \begin{tikzpicture}[x=.14cm,y=.032cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=5,ystep=10] (0,0) grid (30,100);
        \draw[->,grijs] (0,0) -- (32,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,106) node[above,text=black] {$T$};
        \foreach \t in {10,20,30}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {20,50,100}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \draw[grijs,dashed] (0,20) -- (30,20);
        \kromme{0}{30}{20+70*0.9^(\x)}
      \end{tikzpicture}
  opgave: |-
    Een kop koffie koelt af. Na $t$ minuten is de temperatuur $T(t) = 20 + 70 \cdot 0{,}9^t$ (in $^\circ$C).
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe warm is de koffie bij het inschenken?
      antwoord: |-
        $90\,^\circ$C
      uitwerking: |-
        $T(0) = 20 + 70 \cdot 1 = 90\,^\circ$C.
    - opgave: |-
        Vanaf wanneer is de koffie kouder dan $50\,^\circ$C?
      antwoord: |-
        na ongeveer 8 minuten ($t > 8{,}04$)
      uitwerking: |-
        $20 + 70 \cdot 0{,}9^t < 50 \iff 0{,}9^t < \frac37$. $\ln$ van beide leden en delen door $\ln 0{,}9 < 0$: $t > \frac{\ln \frac37}{\ln 0{,}9} \approx 8{,}04$ minuten.
    - opgave: |-
        Welke temperatuur nadert de koffie? Hoe zie je dat aan het voorschrift en aan de grafiek?
      antwoord: |-
        $20\,^\circ$C, de horizontale asymptoot
      uitwerking: |-
        $0{,}9^t$ nadert $0$ als $t$ groot wordt, dus $T$ nadert $20\,^\circ$C, de temperatuur van de kamer. De grafiek heeft de horizontale asymptoot $T = 20$: de koffie wordt volgens het model nooit precies $20\,^\circ$C.

- id: h3-o23
  soort: opdracht
  niveau: 3
  thema: |-
    verschillende grondtallen
  opgave: |-
    Los op. Breng eerst alles naar hetzelfde grondtal.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log_2 x + \log_4 x = 3$
      antwoord: |-
        $x = 4$
      uitwerking: |-
        Voorwaarde $x > 0$. $\log_4 x = \frac{\log_2 x}{\log_2 4} = \frac12 \log_2 x$. Dus $\frac32 \log_2 x = 3$, $\log_2 x = 2$ en $x = 4$.
    - opgave: |-
        $\log_3 x = \log_9(x + 6)$
      antwoord: |-
        $x = 3$
      uitwerking: |-
        Voorwaarden $x > 0$ en $x > -6$, samen $x > 0$. $\log_9(x + 6) = \frac12 \log_3(x + 6)$, dus $2\log_3 x = \log_3(x + 6)$ en $x^2 = x + 6$. Dan $(x - 3)(x + 2) = 0$; alleen $x = 3$ voldoet.
    - opgave: |-
        $x^{\log x} = 100x$
      antwoord: |-
        $x = 100$ of $x = \frac{1}{10}$
      uitwerking: |-
        Voorwaarde $x > 0$. Neem $\log$ van beide leden: $\log x \cdot \log x = \log 100 + \log x$. Stel $t = \log x$: $t^2 - t - 2 = (t - 2)(t + 1) = 0$, dus $t = 2$ of $t = -1$, en $x = 100$ of $x = \frac{1}{10}$. Controle: $100^2 = 100 \cdot 100$ en $\bigl(\frac{1}{10}\bigr)^{-1} = 10 = 100 \cdot \frac{1}{10}$.

- id: h3-o10
  soort: opdracht
  niveau: 3
  thema: |-
    gespiegelde en uitgerekte grafieken
  opgave: |-
    Grafieken van logaritmische functies met een ander grondtal hangen samen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\log_{1/a} x = -\log_a x$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Verandering van grondtal: $\log_{1/a} x = \frac{\ln x}{\ln \frac1a} = \frac{\ln x}{-\ln a} = -\log_a x$, want $\ln \frac1a = \ln 1 - \ln a = -\ln a$.
    - opgave: |-
        Wat betekent dat voor de grafieken van $\log_2 x$ en $\log_{1/2} x$?
      antwoord: |-
        spiegelbeeld om de $x$-as
      uitwerking: |-
        Bij elke $x$ is de functiewaarde van $\log_{1/2} x$ het tegengestelde van die van $\log_2 x$: de grafieken zijn elkaars spiegelbeeld om de $x$-as.
    - opgave: |-
        Welk verband is er tussen de grafieken van $\log_2 x$ en $\log_4 x$? Schets beide.
      antwoord: |-
        $\log_4 x = \frac12 \log_2 x$
      uitwerking: |-
        $\log_4 x = \frac{\ln x}{\ln 4} = \frac{\ln x}{2\ln 2} = \frac12 \log_2 x$: de grafiek van $\log_2 x$ wordt verticaal samengedrukt met factor $\frac12$. Beide gaan door $(1, 0)$; $\log_4 x$ (gestippeld) gaat door $(4, 1)$.
        \figuren{\begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
          \rooster{0}{1}{8}{-2}{1}{3}
          \kromme{.25}{8}{ln(\x)/ln(2)}
          \kromme[densely dotted]{.07}{8}{ln(\x)/ln(4)}
          \vol{(2,1)} \vol{(4,1)} \vol{(1,0)}
        \end{tikzpicture}}

- id: h3-o24
  soort: opdracht
  niveau: 3
  thema: |-
    logaritme tegenover wortel
  opgave: |-
    Een logaritmische functie stijgt traag. Vergelijk $\log_2 x$ met $\sqrt{x}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken beide voor $x = 1$, $2$, $4$, $9$, $16$, $64$ en $1024$.
      antwoord: |-
        zie de tabel
      uitwerking: |-
        {\renewcommand{\arraystretch}{1.2}\begin{tabular}{c|ccccccc}
        $x$ & $1$ & $2$ & $4$ & $9$ & $16$ & $64$ & $1024$ \\ \hline
        $\log_2 x$ & $0$ & $1$ & $2$ & $3{,}17$ & $4$ & $6$ & $10$ \\
        $\sqrt{x}$ & $1$ & $1{,}41$ & $2$ & $3$ & $4$ & $8$ & $32$
        \end{tabular}}
    - opgave: |-
        Schets beide grafieken. Voor welke $x$ is $\log_2 x > \sqrt{x}$?
      antwoord: |-
        $4 < x < 16$
      uitwerking: |-
        De grafieken snijden in $(4, 2)$ en $(16, 4)$. Daartussen ligt $\log_2 x$ boven $\sqrt x$ (bijvoorbeeld bij $x = 9$), daarbuiten eronder: $4 < x < 16$.
        \figuren{\begin{tikzpicture}[x=.25cm,y=.6cm,font=\scriptsize]
          \draw[black!14,very thin,xstep=2,ystep=1] (0,0) grid (20,5);
          \draw[->,grijs] (0,0) -- (21,0) node[right,text=black] {$x$};
          \draw[->,grijs] (0,0) -- (0,5.4) node[above,text=black] {$y$};
          \foreach \t in {4,8,12,16,20}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
          \foreach \t in {1,2,3,4,5}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
          \kromme{1}{20}{ln(\x)/ln(2)}
          \kromme[densely dotted]{0}{20}{sqrt(\x)}
          \vol{(4,2)} \vol{(16,4)}
        \end{tikzpicture}}
    - opgave: |-
        Neem $x = 4^n$ met $n$ natuurlijk. Toon aan dat dan $\sqrt{x} = 2^n$ en $\log_2 x = 2n$. Leg uit waarom $\sqrt{x}$ voor die getallen vanaf $x = 64$ steeds verder voorloopt.
      antwoord: |-
        $2^n > 2n$ voor $n \geqslant 3$
      uitwerking: |-
        $\sqrt{4^n} = (2^2)^{\frac{n}{2}} = 2^n$ en $\log_2 4^n = \log_2 2^{2n} = 2n$. Voor $n = 3$ is $2^3 = 8 > 6$. Verhoog je $n$ met 1, dan verdubbelt $2^n$, terwijl $2n$ maar met 2 toeneemt: het verschil wordt steeds groter. De wortel wint dus op den duur, ook al is het bij kleine $x$ andersom.

- id: h3-o26
  soort: opdracht
  niveau: 3
  thema: |-
    waar zit de fout? een vals bewijs
  opgave: |-
    Iemand bewijst zo dat $2 > 3$. Uit $\frac14 > \frac18$ volgt $\bigl(\frac12\bigr)^2 > \bigl(\frac12\bigr)^3$. Neem $\log$ van beide leden: \mbox{$2\log\frac12 > 3\log\frac12$}. Deel door $\log \frac12$: $2 > 3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke stappen kloppen? Waar zit de fout?
      antwoord: |-
        delen door $\log\frac12 < 0$
      uitwerking: |-
        $\frac14 > \frac18$ klopt en is hetzelfde als $\bigl(\frac12\bigr)^2 > \bigl(\frac12\bigr)^3$. $\log$ van beide leden nemen mag en behoudt het teken, want $\log$ stijgt; de machtregel geeft $2\log\frac12 > 3\log\frac12$. Maar $\log \frac12 < 0$: bij het delen moet het teken omkeren. Juist is dus $2 < 3$.
    - opgave: |-
        Volg dezelfde redenering met $\log_{0{,}5}$ in plaats van $\log$. In welke stap keert het teken nu om, en waarom?
      antwoord: |-
        bij het nemen van $\log_{0{,}5}$
      uitwerking: |-
        $\log_{0{,}5}$ daalt, dus al bij het nemen van de logaritme keert het teken om: $2\log_{0{,}5}\frac12 < 3\log_{0{,}5}\frac12$, dus $2 \cdot 1 < 3 \cdot 1$. Delen door $\log_{0{,}5} \frac12 = 1 > 0$ verandert dan niets meer. Beide wegen geven $2 < 3$.

- id: h3-o9
  soort: opdracht
  niveau: 3
  thema: |-
    een rechte maken
  opgave: |-
    Bij een proef meet men een hoeveelheid $N$ op tijdstip $t$ (in uur): $(0, 50)$, $(2, 72)$, $(4, 104)$, $(6, 150)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\log N$ voor elke meting. Toon aan dat de punten $(t, \log N)$ ongeveer op een rechte liggen.
      antwoord: |-
        $1{,}699$; $1{,}857$; $2{,}017$; $2{,}176$: telkens $+0{,}16$
      uitwerking: |-
        $\log 50 \approx 1{,}699$, $\log 72 \approx 1{,}857$, $\log 104 \approx 2{,}017$ en $\log 150 \approx 2{,}176$. De verschillen zijn $0{,}158$, $0{,}160$ en $0{,}159$: bij gelijke stappen van 2 uur komt er telkens ongeveer hetzelfde bij, dus de punten liggen op een rechte.
    - opgave: |-
        Toon aan: als $N = N_0 \cdot a^t$, dan is $\log N = \log N_0 + t \log a$. Bepaal zo $N_0$ en $a$.
      antwoord: |-
        $N_0 = 50$, $a \approx 1{,}2$
      uitwerking: |-
        $\log N = \log(N_0 \cdot a^t) = \log N_0 + \log a^t = \log N_0 + t\log a$ (product- en machtregel): een rechte in $t$ met beginwaarde $\log N_0$ en richtingscoëfficiënt $\log a$. Beginwaarde $\log N_0 \approx 1{,}699$, dus $N_0 = 50$. Richtingscoëfficiënt $\frac{2{,}176 - 1{,}699}{6 - 0} \approx 0{,}0795$, dus $a \approx 10^{0{,}0795} \approx 1{,}20$. Controle: $50 \cdot 1{,}2^6 \approx 149$.
    - opgave: |-
        Voorspel $N$ na 10 uur. Na hoeveel uur bereikt $N$ de waarde $1000$?
      antwoord: |-
        ongeveer $310$; na ongeveer $16{,}4$ uur
      uitwerking: |-
        $N(10) = 50 \cdot 1{,}2^{10} \approx 310$. $50 \cdot 1{,}2^t = 1000 \iff 1{,}2^t = 20 \iff t = \frac{\ln 20}{\ln 1{,}2} \approx 16{,}4$ uur.

- id: h3-o25
  soort: opdracht
  niveau: 3
  thema: |-
    het grondtal als onbekende
  opgave: |-
    Het grondtal $a$ is onbekend ($a > 0$, $a \neq 1$). Onderscheid telkens $a > 1$ en $0 < a < 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $a$ is $\log_a 5 > \log_a 3$?
      antwoord: |-
        $a > 1$
      uitwerking: |-
        Is $a > 1$, dan stijgt $\log_a x$ en is $\log_a 5 > \log_a 3$. Is $0 < a < 1$, dan daalt ze en is $\log_a 5 < \log_a 3$. Dus $a > 1$.
    - opgave: |-
        Voor welke $a$ is $\log_a 2 > 1$?
      antwoord: |-
        $1 < a < 2$
      uitwerking: |-
        Schrijf $1 = \log_a a$. Als $a > 1$: $\log_a 2 > \log_a a \iff 2 > a$, dus $1 < a < 2$. Als $0 < a < 1$: het teken keert om, $2 < a$, en dat kan niet. Dus $1 < a < 2$.
    - opgave: |-
        Voor welke $a$ ligt de grafiek van $\log_a x$ boven die van $\log_2 x$ op het interval $\left]0, 1\right[$?
      antwoord: |-
        $0 < a < 1$ of $a > 2$
      uitwerking: |-
        $\log_a x > \log_2 x \iff \frac{\ln x}{\ln a} > \frac{\ln x}{\ln 2}$. Op $\left]0, 1\right[$ is $\ln x < 0$: delen keert het teken om, $\frac{1}{\ln a} < \frac{1}{\ln 2}$. Is $0 < a < 1$, dan is $\frac{1}{\ln a} < 0 < \frac{1}{\ln 2}$: altijd waar. Is $a > 1$, dan zijn beide positief en volgt $\ln a > \ln 2$, dus $a > 2$. Antwoord: $0 < a < 1$ of $a > 2$.

