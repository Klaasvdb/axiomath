# KOPPEL
#----------------------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Algemene functies
  thema: |-
    inverse bepalen
  opgave: |-
    Bepaal de inverse van $f(x) = 2^{x - 1} + 3$, met haar domein.
  antwoord: |-
    $\inv{f}(x) = 1 + \log_2(x - 3)$, domein $\left]3, +\infty\right[$
  uitwerking: |-
    $\ber f = \left]3, +\infty\right[$. $y = 2^{x - 1} + 3 \iff x - 1 = \log_2(y - 3)$, dus $\inv{f}(x) = 1 + \log_2(x - 3)$ met domein $\left]3, +\infty\right[$.

- id: h3-koppel-2
  soort: koppel
  niveau: 1
  koppel:
    rubriek: discreet
    onderwerp: Rijen
  thema: |-
    de eerste grote term
  opgave: |-
    De meetkundige rij $u_n = 3 \cdot 2^n$. Vanaf welke $n$ is $u_n > 10^6$?
  antwoord: |-
    vanaf $n = 19$
  uitwerking: |-
    $2^n > \frac{10^6}{3}$, dus $n > \log_2 \frac{10^6}{3} \approx 18{,}35$: vanaf $n = 19$.

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    grafiek
  opgave: |-
    Geef het domein, de asymptoot en de nulwaarde van $g(x) = \log_3(x + 2) - 1$.
  antwoord: |-
    $\left]-2, +\infty\right[$; $x = -2$; $1$
  uitwerking: |-
    De grafiek van $\log_3 x$ schuift 2 naar links en 1 naar onder. Domein: $x + 2 > 0$, dus $\dom g = \left]-2, +\infty\right[$, met asymptoot $x = -2$. Nulwaarde: $\log_3(x + 2) = 1$, dus $x + 2 = 3$ en $x = 1$.

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    domein
  opgave: |-
    Bepaal het domein van $f(x) = \ln(9 - x^2)$.
  antwoord: |-
    $\left]-3, 3\right[$
  uitwerking: |-
    $9 - x^2 > 0 \iff x^2 < 9 \iff -3 < x < 3$: tussen de nulwaarden van de bergparabool. Dus $\dom f = \left]-3, 3\right[$.

- id: h3-t3
  soort: test
  niveau: 1
  thema: |-
    vergelijking
  opgave: |-
    Los op: $\log_2(3x + 1) = 4$.
  antwoord: |-
    $x = 5$
  uitwerking: |-
    Voorwaarde: $3x + 1 > 0 \iff x > -\frac13$. Definitie: $3x + 1 = 2^4 = 16$, dus $x = 5$. Dat voldoet.

- id: h3-t4
  soort: test
  niveau: 2
  thema: |-
    vergelijking met twee logaritmen
  opgave: |-
    Los op: $\log_6 x + \log_6(x + 5) = 2$.
  antwoord: |-
    $x = 4$
  uitwerking: |-
    Voorwaarden: $x > 0$ en $x > -5$, samen $x > 0$. Productregel: $x(x + 5) = 6^2 = 36$, dus $x^2 + 5x - 36 = (x - 4)(x + 9) = 0$ en $x = 4$ of $x = -9$. Alleen $x = 4$ voldoet.

- id: h3-t5
  soort: test
  niveau: 2
  thema: |-
    ongelijkheid in een context
  opgave: |-
    Een hoeveelheid neemt elk jaar met $10$\,\% af. Na hoeveel jaar is er minder dan de helft over?
  antwoord: |-
    na 7 jaar ($t > 6{,}58$)
  uitwerking: |-
    $0{,}9^t < 0{,}5$. $\ln$ van beide leden: $t\ln 0{,}9 < \ln 0{,}5$. Delen door $\ln 0{,}9 < 0$ keert het teken om: $t > \frac{\ln 0{,}5}{\ln 0{,}9} \approx 6{,}58$. Na 7 jaar.

- id: h3-t6
  soort: test
  niveau: 2
  thema: |-
    logaritmische ongelijkheid
  opgave: |-
    Los op: $\log_{0{,}5}(x + 2) > -3$.
  antwoord: |-
    $\left]-2, 6\right[$
  uitwerking: |-
    Voorwaarde: $x + 2 > 0 \iff x > -2$. Schrijf $-3 = \log_{0{,}5} 8$, want $0{,}5^{-3} = 8$. Het grondtal is kleiner dan 1, dus het teken keert om: $x + 2 < 8 \iff x < 6$. Samen: $x \in \left]-2, 6\right[$.

- id: h3-t7
  soort: test
  niveau: 2
  thema: |-
    voorschrift uit een grafiek
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
        \rooster{-1}{1}{5}{-2}{1}{4}
        \draw[grijs,dashed] (1,-2) -- (1,4.3);
        \kromme{1.0625}{5}{ln(\x-1)/ln(2)+2}
        \vol{(2,2)} \vol{(3,3)}
      \end{tikzpicture}
  opgave: |-
    De grafiek hiernaast ontstaat door de grafiek van $\log_2 x$ te verschuiven. Ze gaat door $(2, 2)$ en $(3, 3)$, met asymptoot $x = 1$. Geef het voorschrift en bereken de nulwaarde.
  antwoord: |-
    $\log_2(x - 1) + 2$; $\frac54$
  uitwerking: |-
    De asymptoot is $x = 1$: 1 naar rechts. Het punt $(1, 0)$ van $\log_2 x$ gaat dan naar $(2, 0)$, maar ligt op $(2, 2)$: ook 2 naar boven. Dus $f(x) = \log_2(x - 1) + 2$. Controle: $f(3) = \log_2 2 + 2 = 3$. Nulwaarde: $\log_2(x - 1) = -2$, dus $x - 1 = \frac14$ en $x = \frac54$.
