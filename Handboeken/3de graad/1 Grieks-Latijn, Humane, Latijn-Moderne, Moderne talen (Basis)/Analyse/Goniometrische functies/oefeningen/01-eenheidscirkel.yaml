# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    omrekenen
  opgave: |-
    Zet $240^\circ$ om naar radialen en $\frac{5\pi}{12}$ naar graden.
  antwoord: |-
    $\frac{4\pi}{3}$; $75^\circ$
  uitwerking: |-
    $240 \cdot \frac{\pi}{180} = \frac{4\pi}{3}$ en $\frac{5}{12} \cdot 180^\circ = 75^\circ$.

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    boog en sector
  opgave: |-
    Een boog op een cirkel met straal $8$ cm is $10$ cm lang. Hoe groot is de middelpuntshoek in radialen? Hoe groot is de sector?
  antwoord: |-
    $1{,}25$ rad; $40$ cm$^2$
  uitwerking: |-
    $\theta = \frac{s}{r} = \frac{10}{8} = 1{,}25$ rad en $A = \frac12 r^2\theta = \frac12 \cdot 64 \cdot 1{,}25 = 40$ cm$^2$.

- id: h1-t3
  soort: test
  niveau: 1
  thema: |-
    exacte waarden
  opgave: |-
    Bepaal exact $\sin\frac{3\pi}{4}$, $\cos\frac{3\pi}{4}$ en $\tan\frac{3\pi}{4}$.
  antwoord: |-
    $\frac{\sqrt2}{2}$; $-\frac{\sqrt2}{2}$; $-1$
  uitwerking: |-
    $\frac{3\pi}{4} = \pi - \frac{\pi}{4}$: het spiegelbeeld van het punt bij $\frac{\pi}{4}$ om de $y$-as. Dus $\sin\frac{3\pi}{4} = \frac{\sqrt2}{2}$, $\cos\frac{3\pi}{4} = -\frac{\sqrt2}{2}$ en $\tan\frac{3\pi}{4} = -1$.

- id: h1-t4
  soort: test
  niveau: 1
  thema: |-
    grondformule
  opgave: |-
    Gegeven: $\cos\theta = 0{,}6$ en $\frac{3\pi}{2} < \theta < 2\pi$. Bepaal $\sin\theta$ en $\tan\theta$.
  antwoord: |-
    $-0{,}8$; $-\frac43$
  uitwerking: |-
    $\sin^2\theta = 1 - 0{,}36 = 0{,}64$; vierde kwadrant: $\sin\theta = -0{,}8$. $\tan\theta = \frac{-0{,}8}{0{,}6} = -\frac43$.

- id: h1-t5
  soort: test
  niveau: 2
  thema: |-
    verwante hoeken
  opgave: |-
    Bepaal exact $\cos\bigl(-\frac{5\pi}{6}\bigr)$ en $\sin\frac{7\pi}{3}$.
  antwoord: |-
    $-\frac{\sqrt3}{2}$; $\frac{\sqrt3}{2}$
  uitwerking: |-
    $\cos\bigl(-\frac{5\pi}{6}\bigr) = \cos\frac{5\pi}{6} = -\cos\frac{\pi}{6} = -\frac{\sqrt3}{2}$. $\frac{7\pi}{3} - 2\pi = \frac{\pi}{3}$, dus $\sin\frac{7\pi}{3} = \sin\frac{\pi}{3} = \frac{\sqrt3}{2}$.

- id: h1-t6
  soort: test
  niveau: 1
  thema: |-
    punt op de eenheidscirkel
  opgave: |-
    Geef de exacte coördinaten van het punt op de eenheidscirkel bij de hoek $-\frac{3\pi}{4}$. In welk kwadrant ligt het?
  antwoord: |-
    $\bigl(-\frac{\sqrt2}{2}, -\frac{\sqrt2}{2}\bigr)$; het derde
  uitwerking: |-
    $-\frac{3\pi}{4}$ is in wijzerzin voorbij $-\frac{\pi}{2}$: het derde kwadrant. Het punt is het spiegelbeeld van het punt bij $\frac{\pi}{4}$ om de oorsprong, dus $\bigl(-\frac{\sqrt2}{2}, -\frac{\sqrt2}{2}\bigr)$.

- id: h1-t7
  soort: test
  niveau: 2
  thema: |-
    vereenvoudigen
  opgave: |-
    Vereenvoudig $\cos(\pi - x) + \sin\bigl(\frac{\pi}{2} - x\bigr) - \cos(-x)$.
  antwoord: |-
    $-\cos x$
  uitwerking: |-
    Supplementair, complementair en tegengesteld: $-\cos x + \cos x - \cos x = -\cos x$.

- id: h1-t8
  soort: test
  niveau: 2
  thema: |-
    identiteit
  opgave: |-
    Bewijs: $\dfrac{1 - \cos^2 x}{\sin x\cos x} = \tan x$ (als $\sin x \neq 0$ en $\cos x \neq 0$).
  antwoord: |-
    bewijs
  uitwerking: |-
    Met de grondformule is de teller $1 - \cos^2 x = \sin^2 x$. Dus $\dfrac{\sin^2 x}{\sin x\cos x} = \dfrac{\sin x}{\cos x} = \tan x$.
