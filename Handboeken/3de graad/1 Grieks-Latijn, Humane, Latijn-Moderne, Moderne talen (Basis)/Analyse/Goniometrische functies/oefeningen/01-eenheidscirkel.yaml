# Oefeningen van hoofdstuk 1. Zie oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Een rechthoekige driehoek heeft schuine zijde $10$ en een hoek van $30^\circ$. Hoe lang is de overstaande zijde?
      antwoord: |-
        5
      uitwerking: |-
        $10 \sin 30^\circ = 5$.
    - opgave: |-
        Geef $\sin 30^\circ$, $\cos 60^\circ$ en $\tan 45^\circ$.
      antwoord: |-
        $\frac12$; $\frac12$; $1$
      uitwerking: |-
        $\frac12$, $\frac12$ en $1$.
    - opgave: |-
        Wat is de omtrek van een cirkel met straal 3?
      antwoord: |-
        $6\pi$
      uitwerking: |-
        $2\pi \cdot 3 = 6\pi$.
    - opgave: |-
        Bereken $\sqrt{1 - 0{,}6^2}$.
      antwoord: |-
        $0{,}8$
      uitwerking: |-
        $\sqrt{0{,}64} = 0{,}8$.
    - opgave: |-
        In welk kwadrant ligt het punt $(-2, 3)$?
      antwoord: |-
        het tweede
      uitwerking: |-
        $x < 0$ en $y > 0$: het tweede kwadrant.
    - opgave: |-
        Spiegel $(3, 1)$ om de rechte $y = x$.
      antwoord: |-
        $(1, 3)$
      uitwerking: |-
        $(1, 3)$.

- id: h1-verken
  soort: start
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=1.3,font=\scriptsize]
        \eenheidscirkel
        \draw[->,accent] (.3,0) arc (0:30:.3);
        \draw[accent] (0,0) -- (30:1);
        \fill[accent] (30:1) circle (.035) node[above right] {$G$};
        \fill[accent] (1,0) circle (.035);
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken} Een gondel van een reuzenrad met straal 1 vertrekt in $(1, 0)$ en draait in tegenwijzerzin rond de oorsprong.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat zijn de coördinaten na een draaiing over $90^\circ$, $180^\circ$ en $270^\circ$?
      antwoord: |-
        $(0, 1)$; $(-1, 0)$; $(0, -1)$
      uitwerking: |-
        $(0, 1)$, $(-1, 0)$ en $(0, -1)$.
    - opgave: |-
        Na $30^\circ$ is de gondel in $G$. Bereken de coördinaten met een rechthoekige driehoek.
      antwoord: |-
        $\bigl(\frac{\sqrt3}{2}, \frac12\bigr)$
      uitwerking: |-
        Schuine zijde 1: $x = \cos 30^\circ = \frac{\sqrt3}{2}$ en $y = \sin 30^\circ = \frac12$.
    - opgave: |-
        Waar is de gondel na $150^\circ$? Gebruik een spiegeling.
      antwoord: |-
        $\bigl(-\frac{\sqrt3}{2}, \frac12\bigr)$
      uitwerking: |-
        Het spiegelbeeld van $G$ om de $y$-as: $\bigl(-\frac{\sqrt3}{2}, \frac12\bigr)$.

- id: h1-radialen
  soort: kort
  opgave: |-
    Zet om.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $60^\circ$ naar radialen
      antwoord: |-
        $\frac{\pi}{3}$
      uitwerking: |-
        $60 \cdot \frac{\pi}{180} = \frac{\pi}{3}$.
    - opgave: |-
        $210^\circ$ naar radialen
      antwoord: |-
        $\frac{7\pi}{6}$
      uitwerking: |-
        $210 \cdot \frac{\pi}{180} = \frac{7\pi}{6}$.
    - opgave: |-
        $\frac{5\pi}{4}$ naar graden
      antwoord: |-
        $225^\circ$
      uitwerking: |-
        $\frac54 \cdot 180^\circ = 225^\circ$.
    - opgave: |-
        $1$ rad naar graden
      antwoord: |-
        $\approx 57{,}3^\circ$
      uitwerking: |-
        $\frac{180^\circ}{\pi} \approx 57{,}3^\circ$.
    - opgave: |-
        $3$ rad naar graden
      antwoord: |-
        $\approx 171{,}9^\circ$
      uitwerking: |-
        $3 \cdot \frac{180^\circ}{\pi} \approx 171{,}9^\circ$: iets minder dan $180^\circ$, want $3$ is iets minder dan $\pi$.

- id: h1-sector
  soort: kort
  opgave: |-
    Een tuinsproeier sproeit tot $6$ m ver en draait heen en weer over een hoek van $\frac{2\pi}{3}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de buitenrand van het besproeide stuk?
      antwoord: |-
        $4\pi \approx 12{,}57$ m
      uitwerking: |-
        De buitenrand is een boog met $r = 6$ en $\theta = \frac{2\pi}{3}$: $s = 6 \cdot \frac{2\pi}{3} = 4\pi \approx 12{,}57$ m.
    - opgave: |-
        Hoe groot is het besproeide stuk?
      antwoord: |-
        $12\pi \approx 37{,}70$ m$^2$
      uitwerking: |-
        Een cirkelsector: $A = \frac12 \cdot 6^2 \cdot \frac{2\pi}{3} = 12\pi \approx 37{,}70$ m$^2$.
    - opgave: |-
        Over welke hoek moet de sproeier draaien om precies $30$ m$^2$ te besproeien?
      antwoord: |-
        $\frac53 \approx 1{,}67$ rad
      uitwerking: |-
        Los $\frac12 r^2 \theta = A$ op naar $\theta$: $\theta = \frac{2A}{r^2} = \frac{60}{36} = \frac53 \approx 1{,}67$ rad (ongeveer $95{,}5^\circ$).

- id: h1-punt
  soort: kort
  opgave: |-
    Geef de exacte coördinaten van het punt op de eenheidscirkel bij de hoek.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\frac{7\pi}{6}$
      antwoord: |-
        $\bigl(-\frac{\sqrt3}{2}, -\frac12\bigr)$
      uitwerking: |-
        $\frac{7\pi}{6} = \pi + \frac{\pi}{6}$: het spiegelbeeld van het punt bij $\frac{\pi}{6}$ om de oorsprong, dus $\bigl(-\frac{\sqrt3}{2}, -\frac12\bigr)$.
    - opgave: |-
        $-\frac{\pi}{3}$
      antwoord: |-
        $\bigl(\frac12, -\frac{\sqrt3}{2}\bigr)$
      uitwerking: |-
        Het spiegelbeeld van het punt bij $\frac{\pi}{3}$ om de $x$-as: $\bigl(\frac12, -\frac{\sqrt3}{2}\bigr)$.
    - opgave: |-
        $\frac{3\pi}{2}$
      antwoord: |-
        $(0, -1)$
      uitwerking: |-
        Driekwart toer in tegenwijzerzin: het laagste punt $(0, -1)$.
    - opgave: |-
        $\frac{5\pi}{4}$
      antwoord: |-
        $\bigl(-\frac{\sqrt2}{2}, -\frac{\sqrt2}{2}\bigr)$
      uitwerking: |-
        $\frac{5\pi}{4} = \pi + \frac{\pi}{4}$: derde kwadrant, beide coördinaten $-\frac{\sqrt2}{2}$.

- id: h1-waarden
  soort: kort
  opgave: |-
    Bepaal exact.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin\frac{2\pi}{3}$
      antwoord: |-
        $\frac{\sqrt3}{2}$
      uitwerking: |-
        $\sin\bigl(\pi - \frac{\pi}{3}\bigr) = \sin\frac{\pi}{3} = \frac{\sqrt3}{2}$.
    - opgave: |-
        $\cos\frac{3\pi}{4}$
      antwoord: |-
        $-\frac{\sqrt2}{2}$
      uitwerking: |-
        Tweede kwadrant: $-\cos\frac{\pi}{4} = -\frac{\sqrt2}{2}$.
    - opgave: |-
        $\tan\frac{5\pi}{6}$
      antwoord: |-
        $-\frac{\sqrt3}{3}$
      uitwerking: |-
        $\frac{5\pi}{6} = \pi - \frac{\pi}{6}$: $\sin\frac{5\pi}{6} = \frac12$ en $\cos\frac{5\pi}{6} = -\frac{\sqrt3}{2}$, dus $\tan\frac{5\pi}{6} = \frac{1/2}{-\sqrt3/2} = -\frac{1}{\sqrt3} = -\frac{\sqrt3}{3}$.
    - opgave: |-
        $\sin\theta$ en $\tan\theta$ als $\cos\theta = -\frac{5}{13}$ en $\pi < \theta < \frac{3\pi}{2}$
      antwoord: |-
        $-\frac{12}{13}$; $\frac{12}{5}$
      uitwerking: |-
        $\sin^2\theta = 1 - \frac{25}{169} = \frac{144}{169}$; derde kwadrant: $\sin\theta = -\frac{12}{13}$. $\tan\theta = \frac{-12/13}{-5/13} = \frac{12}{5}$.

- id: h1-grondf
  soort: kort
  opgave: |-
    Bepaal de andere twee goniometrische getallen exact.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin\theta = -\frac23$ en $\pi < \theta < \frac{3\pi}{2}$
      antwoord: |-
        $\cos\theta = -\frac{\sqrt5}{3}$, $\tan\theta = \frac{2\sqrt5}{5}$
      uitwerking: |-
        $\cos^2\theta = 1 - \frac49 = \frac59$. In het derde kwadrant is $\cos\theta < 0$, dus $\cos\theta = -\frac{\sqrt5}{3}$. Dan is $\tan\theta = \frac{-2/3}{-\sqrt5/3} = \frac{2}{\sqrt5} = \frac{2\sqrt5}{5}$.
    - opgave: |-
        $\cos\theta = \frac13$ en $\frac{3\pi}{2} < \theta < 2\pi$
      antwoord: |-
        $\sin\theta = -\frac{2\sqrt2}{3}$, $\tan\theta = -2\sqrt2$
      uitwerking: |-
        $\sin^2\theta = 1 - \frac19 = \frac89$. Vierde kwadrant: $\sin\theta < 0$, dus $\sin\theta = -\frac{\sqrt8}{3} = -\frac{2\sqrt2}{3}$. Dan is $\tan\theta = \frac{-2\sqrt2/3}{1/3} = -2\sqrt2$.
    - opgave: |-
        $\sin\theta = 0{,}96$ en $\theta$ is een stompe hoek
      antwoord: |-
        $\cos\theta = -0{,}28$, $\tan\theta = -\frac{24}{7}$
      uitwerking: |-
        Stomp betekent $\frac{\pi}{2} < \theta < \pi$: tweede kwadrant, dus $\cos\theta < 0$. $\cos^2\theta = 1 - 0{,}9216 = 0{,}0784$, dus $\cos\theta = -0{,}28$. Dan is $\tan\theta = \frac{0{,}96}{-0{,}28} = -\frac{96}{28} = -\frac{24}{7}$.

- id: h1-verwant
  soort: kort
  opgave: |-
    Bepaal exact, of vereenvoudig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin\frac{11\pi}{6}$
      antwoord: |-
        $-\frac12$
      uitwerking: |-
        $\frac{11\pi}{6} = 2\pi - \frac{\pi}{6}$, dus $\sin\bigl(-\frac{\pi}{6}\bigr) = -\frac12$.
    - opgave: |-
        $\cos\bigl(-\frac{2\pi}{3}\bigr)$
      antwoord: |-
        $-\frac12$
      uitwerking: |-
        $\cos\frac{2\pi}{3} = -\cos\frac{\pi}{3} = -\frac12$.
    - opgave: |-
        $\tan\frac{5\pi}{4}$
      antwoord: |-
        1
      uitwerking: |-
        $\tan\bigl(\pi + \frac{\pi}{4}\bigr) = \tan\frac{\pi}{4} = 1$.
    - opgave: |-
        $\sin(\pi - x) + \sin(-x)$
      antwoord: |-
        0
      uitwerking: |-
        $\sin x - \sin x = 0$.

- id: h1-herleid
  soort: kort
  opgave: |-
    Bepaal exact. Trek eerst een veelvoud van $2\pi$ af of tel het erbij op.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\cos\frac{19\pi}{6}$
      antwoord: |-
        $-\frac{\sqrt3}{2}$
      uitwerking: |-
        $\frac{19\pi}{6} - 2\pi = \frac{7\pi}{6} = \pi + \frac{\pi}{6}$, dus $\cos\frac{19\pi}{6} = -\cos\frac{\pi}{6} = -\frac{\sqrt3}{2}$.
    - opgave: |-
        $\sin\bigl(-\frac{11\pi}{4}\bigr)$
      antwoord: |-
        $-\frac{\sqrt2}{2}$
      uitwerking: |-
        $-\frac{11\pi}{4} + 4\pi = \frac{5\pi}{4} = \pi + \frac{\pi}{4}$, dus $-\sin\frac{\pi}{4} = -\frac{\sqrt2}{2}$.
    - opgave: |-
        $\tan\frac{10\pi}{3}$
      antwoord: |-
        $\sqrt3$
      uitwerking: |-
        $\frac{10\pi}{3} - 2\pi = \frac{4\pi}{3} = \pi + \frac{\pi}{3}$, en $\tan(\pi + \theta) = \tan\theta$: $\tan\frac{\pi}{3} = \sqrt3$.
    - opgave: |-
        $\cos\bigl(-\frac{7\pi}{3}\bigr)$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        $-\frac{7\pi}{3} + 2\pi = -\frac{\pi}{3}$, dus $\cos\bigl(-\frac{\pi}{3}\bigr) = \cos\frac{\pi}{3} = \frac12$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3. De volgorde in het boek staat
# in het hoofdstuk; hieronder dezelfde volgorde.
#----------------------------------------------------------------------------------------

- id: h1-boog-k
  soort: kort
  opgave: |-
    Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        De lengte van de boog die een middelpuntshoek van $2{,}5$ rad afsnijdt op een cirkel met straal $4$ cm.
      antwoord: |-
        $10$ cm
      uitwerking: |-
        $s = r\theta = 4 \cdot 2{,}5 = 10$ cm.
    - opgave: |-
        De lengte van de boog bij een middelpuntshoek van $\frac{3\pi}{4}$ op een cirkel met straal $4$ cm.
      antwoord: |-
        $3\pi \approx 9{,}42$ cm
      uitwerking: |-
        $s = 4 \cdot \frac{3\pi}{4} = 3\pi \approx 9{,}42$ cm.
    - opgave: |-
        De middelpuntshoek die op een cirkel met straal $6$ cm een boog van $15$ cm afsnijdt, in radialen en in graden.
      antwoord: |-
        $2{,}5$ rad $\approx 143{,}2^\circ$
      uitwerking: |-
        Uit $s = r\theta$ volgt $\theta = \frac{s}{r} = \frac{15}{6} = 2{,}5$ rad, en $2{,}5 \cdot \frac{180^\circ}{\pi} \approx 143{,}2^\circ$.

- id: h1-toer-k
  soort: kort
  opgave: |-
    Georiënteerde hoeken.
  lijst: enumerate
  delen:
    - opgave: |-
        In welk kwadrant ligt het punt bij $\frac{5\pi}{3}$? En bij $-\frac{3\pi}{4}$?
      antwoord: |-
        het vierde; het derde
      uitwerking: |-
        $\frac{5\pi}{3}$ ligt tussen $\frac{3\pi}{2}$ en $2\pi$: het vierde kwadrant. $-\frac{3\pi}{4}$ is een draaiing in wijzerzin over meer dan een kwart en minder dan een halve toer: het derde kwadrant.
    - opgave: |-
        Geef een positieve en een negatieve hoek die bij hetzelfde punt horen als $\frac{3\pi}{4}$.
      antwoord: |-
        bijvoorbeeld $\frac{11\pi}{4}$ en $-\frac{5\pi}{4}$
      uitwerking: |-
        Tel een volle toer op of trek er een af: $\frac{3\pi}{4} + 2\pi = \frac{11\pi}{4}$ en $\frac{3\pi}{4} - 2\pi = -\frac{5\pi}{4}$. Ook elke andere hoek $\frac{3\pi}{4} + k \cdot 2\pi$ is goed.
    - opgave: |-
        Welke hoek in $[0, 2\pi[$ hoort bij hetzelfde punt als $\frac{17\pi}{6}$? En als $-\frac{9\pi}{4}$?
      antwoord: |-
        $\frac{5\pi}{6}$; $\frac{7\pi}{4}$
      uitwerking: |-
        $\frac{17\pi}{6} - 2\pi = \frac{17\pi}{6} - \frac{12\pi}{6} = \frac{5\pi}{6}$. En $-\frac{9\pi}{4} + 2 \cdot 2\pi = -\frac{9\pi}{4} + \frac{16\pi}{4} = \frac{7\pi}{4}$.

- id: h1-assen-k
  soort: kort
  opgave: |-
    Bepaal zonder rekentoestel. Teken het punt op de eenheidscirkel.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\cos\pi$ en $\sin\pi$
      antwoord: |-
        $-1$; $0$
      uitwerking: |-
        Na een halve toer is $P(-1, 0)$, dus $\cos\pi = -1$ en $\sin\pi = 0$.
    - opgave: |-
        $\sin\bigl(-\frac{\pi}{2}\bigr)$
      antwoord: |-
        $-1$
      uitwerking: |-
        Een kwart toer in wijzerzin: $P(0, -1)$, dus $\sin\bigl(-\frac{\pi}{2}\bigr) = -1$.
    - opgave: |-
        $\tan 3\pi$
      antwoord: |-
        $0$
      uitwerking: |-
        $3\pi = \pi + 2\pi$, dus $P(-1, 0)$ en $\tan 3\pi = \frac{0}{-1} = 0$.
    - opgave: |-
        $\cos\frac{5\pi}{2}$ en $\tan\frac{5\pi}{2}$
      antwoord: |-
        $0$; bestaat niet
      uitwerking: |-
        $\frac{5\pi}{2} = \frac{\pi}{2} + 2\pi$, dus $P(0, 1)$: $\cos\frac{5\pi}{2} = 0$, en de tangens bestaat niet omdat de noemer $0$ is.
    - opgave: |-
        het teken van $\sin 6$ en van $\cos 6$
      antwoord: |-
        $\sin 6 < 0$, $\cos 6 > 0$
      uitwerking: |-
        $\frac{3\pi}{2} \approx 4{,}71 < 6 < 2\pi \approx 6{,}28$: het punt ligt in het vierde kwadrant, dus $\sin 6 < 0$ en $\cos 6 > 0$.

- id: h1-ident-k
  soort: kort
  opgave: |-
    Bewijs (voor alle $x$ waarvoor beide leden bestaan).
  lijst: enumerate
  delen:
    - opgave: |-
        $(1 - \cos x)(1 + \cos x) = \sin^2 x$
      antwoord: |-
        bewijs
      uitwerking: |-
        Werk het product uit: $(1 - \cos x)(1 + \cos x) = 1 - \cos^2 x = \sin^2 x$, met de grondformule.
    - opgave: |-
        $\sin^2 x - \cos^2 x = 1 - 2\cos^2 x$
      antwoord: |-
        bewijs
      uitwerking: |-
        Vervang $\sin^2 x$ door $1 - \cos^2 x$: $\sin^2 x - \cos^2 x = 1 - \cos^2 x - \cos^2 x = 1 - 2\cos^2 x$.
    - opgave: |-
        $\dfrac{\sin^2 x}{1 + \cos x} = 1 - \cos x$
      antwoord: |-
        bewijs
      uitwerking: |-
        Het linkerlid bestaat als $\cos x \neq -1$. Dan is $\dfrac{\sin^2 x}{1 + \cos x} = \dfrac{1 - \cos^2 x}{1 + \cos x} = \dfrac{(1 - \cos x)(1 + \cos x)}{1 + \cos x} = 1 - \cos x$.

- id: h1-tabel-k
  soort: kort
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\cos^2\frac{\pi}{6} - \sin^2\frac{\pi}{6}$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        $\bigl(\frac{\sqrt3}{2}\bigr)^2 - \bigl(\frac12\bigr)^2 = \frac34 - \frac14 = \frac12$.
    - opgave: |-
        $\dfrac{\sin\frac{\pi}{3}}{1 + \cos\frac{\pi}{3}}$
      antwoord: |-
        $\frac{\sqrt3}{3}$
      uitwerking: |-
        $\dfrac{\sqrt3/2}{1 + 1/2} = \dfrac{\sqrt3/2}{3/2} = \dfrac{\sqrt3}{3}$.
    - opgave: |-
        $\cos 0 + 2\sin\frac{\pi}{2}\tan\frac{\pi}{4}$
      antwoord: |-
        $3$
      uitwerking: |-
        $1 + 2 \cdot 1 \cdot 1 = 3$.
    - opgave: |-
        $\sqrt2\cos\frac{\pi}{4} - \tan^2\frac{\pi}{3}$
      antwoord: |-
        $-2$
      uitwerking: |-
        $\sqrt2 \cdot \frac{\sqrt2}{2} - (\sqrt3)^2 = 1 - 3 = -2$.

- id: h1-tegen-k
  soort: kort
  opgave: |-
    Bepaal exact, of vereenvoudig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\cos\bigl(-\frac{\pi}{4}\bigr)$
      antwoord: |-
        $\frac{\sqrt2}{2}$
      uitwerking: |-
        $\cos\bigl(-\frac{\pi}{4}\bigr) = \cos\frac{\pi}{4} = \frac{\sqrt2}{2}$.
    - opgave: |-
        $\sin\bigl(-\frac{\pi}{6}\bigr)$
      antwoord: |-
        $-\frac12$
      uitwerking: |-
        $\sin\bigl(-\frac{\pi}{6}\bigr) = -\sin\frac{\pi}{6} = -\frac12$.
    - opgave: |-
        $\tan\bigl(-\frac{\pi}{6}\bigr)$
      antwoord: |-
        $-\frac{\sqrt3}{3}$
      uitwerking: |-
        $\tan\bigl(-\frac{\pi}{6}\bigr) = -\tan\frac{\pi}{6} = -\frac{\sqrt3}{3}$.
    - opgave: |-
        $\cos(-x)\sin x + \sin(-x)\cos x$
      antwoord: |-
        $0$
      uitwerking: |-
        $\cos x \sin x + (-\sin x)\cos x = 0$.

- id: h1-compl-k
  soort: kort
  opgave: |-
    Complementaire hoeken.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $\cos\frac{2\pi}{5}$ als de sinus van een hoek tussen $0$ en $\frac{\pi}{2}$.
      antwoord: |-
        $\sin\frac{\pi}{10}$
      uitwerking: |-
        $\cos\frac{2\pi}{5} = \sin\bigl(\frac{\pi}{2} - \frac{2\pi}{5}\bigr) = \sin\bigl(\frac{5\pi}{10} - \frac{4\pi}{10}\bigr) = \sin\frac{\pi}{10}$.
    - opgave: |-
        Vereenvoudig $\dfrac{\cos\bigl(\frac{\pi}{2} - x\bigr)}{\sin\bigl(\frac{\pi}{2} - x\bigr)}$.
      antwoord: |-
        $\tan x$
      uitwerking: |-
        Teller en noemer zijn $\sin x$ en $\cos x$, dus het quotiënt is $\dfrac{\sin x}{\cos x} = \tan x$.
    - opgave: |-
        Bereken exact $\sin^2\frac{\pi}{10} + \sin^2\frac{2\pi}{5}$.
      antwoord: |-
        $1$
      uitwerking: |-
        De hoeken zijn complementair: $\frac{\pi}{2} - \frac{2\pi}{5} = \frac{\pi}{10}$, dus $\sin\frac{2\pi}{5} = \cos\frac{\pi}{10}$. De som is $\sin^2\frac{\pi}{10} + \cos^2\frac{\pi}{10} = 1$, door de grondformule.

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: omrekenen
  opgave: |-
    Zet om naar radialen (exact) of naar graden.
  lijst: reeks
  kolommen: 5
  delen:
    - opgave: |-
        $15^\circ$
      antwoord: |-
        $\frac{\pi}{12}$
      uitwerking: |-
        $15 \cdot \frac{\pi}{180} = \frac{\pi}{12}$.
    - opgave: |-
        $300^\circ$
      antwoord: |-
        $\frac{5\pi}{3}$
      uitwerking: |-
        $300 \cdot \frac{\pi}{180} = \frac{5\pi}{3}$.
    - opgave: |-
        $-45^\circ$
      antwoord: |-
        $-\frac{\pi}{4}$
      uitwerking: |-
        $-45 \cdot \frac{\pi}{180} = -\frac{\pi}{4}$.
    - opgave: |-
        $\frac{7\pi}{12}$
      antwoord: |-
        $105^\circ$
      uitwerking: |-
        $\frac{7}{12} \cdot 180^\circ = 105^\circ$.
    - opgave: |-
        $3$ rad
      antwoord: |-
        $\approx 171{,}9^\circ$
      uitwerking: |-
        $3 \cdot \frac{180^\circ}{\pi} \approx 171{,}9^\circ$.
    - opgave: |-
        $72^\circ$
      antwoord: |-
        $\frac{2\pi}{5}$
      uitwerking: |-
        $72 \cdot \frac{\pi}{180} = \frac{2\pi}{5}$.
    - opgave: |-
        $\frac{11\pi}{6}$
      antwoord: |-
        $330^\circ$
      uitwerking: |-
        $\frac{11}{6} \cdot 180^\circ = 330^\circ$.
    - opgave: |-
        $-210^\circ$
      antwoord: |-
        $-\frac{7\pi}{6}$
      uitwerking: |-
        $-210 \cdot \frac{\pi}{180} = -\frac{7\pi}{6}$.
    - opgave: |-
        $0{,}5$ rad
      antwoord: |-
        $\approx 28{,}6^\circ$
      uitwerking: |-
        $0{,}5 \cdot \frac{180^\circ}{\pi} \approx 28{,}6^\circ$.
    - opgave: |-
        $-\frac{3\pi}{2}$
      antwoord: |-
        $-270^\circ$
      uitwerking: |-
        $-\frac32 \cdot 180^\circ = -270^\circ$.

- id: h1-o10
  soort: opdracht
  niveau: 1
  thema: |-
    hoek en punt aflezen
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=1.45,font=\scriptsize]
        \foreach \h in {0,15,...,345} \draw[black!18] (0,0) -- (\h:1);
        \eenheidscirkel
        \foreach \h/\n/\p in {60/A/above right,135/B/above left,180/C/above left,210/D/below left,270/E/below right,330/F/below right}
          \fill[accent] (\h:1) circle (.035) node[\p,text=black,inner sep=1.5pt] {$\n$};
      \end{tikzpicture}
  opgave: |-
    De dunne stralen staan om de $\frac{\pi}{12}$. Welke hoek in $[0, 2\pi[$ hoort bij het punt? Geef ook de exacte coördinaten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $A$
      antwoord: |-
        $\frac{\pi}{3}$; $\bigl(\frac12, \frac{\sqrt3}{2}\bigr)$
      uitwerking: |-
        Vier stralen boven de $x$-as: $4 \cdot \frac{\pi}{12} = \frac{\pi}{3}$. Het punt is $\bigl(\cos\frac{\pi}{3}, \sin\frac{\pi}{3}\bigr) = \bigl(\frac12, \frac{\sqrt3}{2}\bigr)$.
    - opgave: |-
        $B$
      antwoord: |-
        $\frac{3\pi}{4}$; $\bigl(-\frac{\sqrt2}{2}, \frac{\sqrt2}{2}\bigr)$
      uitwerking: |-
        Negen stralen: $\frac{9\pi}{12} = \frac{3\pi}{4} = \pi - \frac{\pi}{4}$. Tweede kwadrant: $\bigl(-\frac{\sqrt2}{2}, \frac{\sqrt2}{2}\bigr)$.
    - opgave: |-
        $C$
      antwoord: |-
        $\pi$; $(-1, 0)$
      uitwerking: |-
        Een halve toer: $\pi$, met het punt $(-1, 0)$.
    - opgave: |-
        $D$
      antwoord: |-
        $\frac{7\pi}{6}$; $\bigl(-\frac{\sqrt3}{2}, -\frac12\bigr)$
      uitwerking: |-
        Twee stralen voorbij $\pi$: $\pi + \frac{\pi}{6} = \frac{7\pi}{6}$. Derde kwadrant: $\bigl(-\frac{\sqrt3}{2}, -\frac12\bigr)$.
    - opgave: |-
        $E$
      antwoord: |-
        $\frac{3\pi}{2}$; $(0, -1)$
      uitwerking: |-
        Driekwart toer: $\frac{3\pi}{2}$, met het punt $(0, -1)$.
    - opgave: |-
        $F$
      antwoord: |-
        $\frac{11\pi}{6}$; $\bigl(\frac{\sqrt3}{2}, -\frac12\bigr)$
      uitwerking: |-
        Twee stralen onder de positieve $x$-as: $2\pi - \frac{\pi}{6} = \frac{11\pi}{6}$. Vierde kwadrant: $\bigl(\frac{\sqrt3}{2}, -\frac12\bigr)$.

- id: h1-o13
  soort: opdracht
  niveau: 1
  thema: |-
    kwadrant uit het teken
  opgave: |-
    In welk kwadrant ligt het punt bij de hoek $\theta$ als:
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin\theta > 0$ en $\cos\theta < 0$
      antwoord: |-
        II
      uitwerking: |-
        $y > 0$ en $x < 0$: het tweede kwadrant.
    - opgave: |-
        $\sin\theta < 0$ en $\tan\theta > 0$
      antwoord: |-
        III
      uitwerking: |-
        $\tan\theta > 0$: $\sin\theta$ en $\cos\theta$ hebben hetzelfde teken, dus ook $\cos\theta < 0$. Beide negatief: het derde kwadrant.
    - opgave: |-
        $\cos\theta > 0$ en $\tan\theta < 0$
      antwoord: |-
        IV
      uitwerking: |-
        $\tan\theta < 0$: tegengestelde tekens, dus $\sin\theta < 0$. Met $\cos\theta > 0$: het vierde kwadrant.
    - opgave: |-
        $\sin\theta \cdot \cos\theta > 0$
      antwoord: |-
        I of III
      uitwerking: |-
        Hetzelfde teken: beide positief (eerste kwadrant) of beide negatief (derde kwadrant).

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: exacte waarden
  opgave: |-
    Bepaal exact.
  lijst: reeks
  kolommen: 5
  delen:
    - opgave: |-
        $\sin\frac{3\pi}{2}$
      antwoord: |-
        $-1$
      uitwerking: |-
        $\frac{3\pi}{2}$ hoort bij het punt $(0, -1)$, en de sinus is de $y$-coördinaat: $-1$.
    - opgave: |-
        $\cos\frac{5\pi}{3}$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        $\frac{5\pi}{3} - 2\pi = -\frac{\pi}{3}$, dus $\cos\bigl(-\frac{\pi}{3}\bigr) = \cos\frac{\pi}{3} = \frac12$.
    - opgave: |-
        $\tan\bigl(-\frac{\pi}{4}\bigr)$
      antwoord: |-
        $-1$
      uitwerking: |-
        Tegengestelde hoek: $-\tan\frac{\pi}{4} = -1$.
    - opgave: |-
        $\sin\frac{13\pi}{6}$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        $\frac{13\pi}{6} - 2\pi = \frac{\pi}{6}$, dus $\sin\frac{\pi}{6} = \frac12$.
    - opgave: |-
        $\cos 3\pi$
      antwoord: |-
        $-1$
      uitwerking: |-
        $3\pi - 2\pi = \pi$: het punt $(-1, 0)$, dus $-1$.
    - opgave: |-
        $\tan\frac{7\pi}{6}$
      antwoord: |-
        $\frac{\sqrt3}{3}$
      uitwerking: |-
        $\tan\bigl(\pi + \frac{\pi}{6}\bigr) = \tan\frac{\pi}{6} = \frac{\sqrt3}{3}$.
    - opgave: |-
        $\sin\frac{4\pi}{3}$
      antwoord: |-
        $-\frac{\sqrt3}{2}$
      uitwerking: |-
        $\sin\bigl(\pi + \frac{\pi}{3}\bigr) = -\sin\frac{\pi}{3} = -\frac{\sqrt3}{2}$.
    - opgave: |-
        $\cos\frac{7\pi}{4}$
      antwoord: |-
        $\frac{\sqrt2}{2}$
      uitwerking: |-
        $\frac{7\pi}{4} - 2\pi = -\frac{\pi}{4}$, dus $\cos\frac{\pi}{4} = \frac{\sqrt2}{2}$.
    - opgave: |-
        $\tan\frac{2\pi}{3}$
      antwoord: |-
        $-\sqrt3$
      uitwerking: |-
        $\sin\frac{2\pi}{3} = \frac{\sqrt3}{2}$ en $\cos\frac{2\pi}{3} = -\frac12$, dus $\tan\frac{2\pi}{3} = -\sqrt3$.
    - opgave: |-
        $\cos\bigl(-\frac{\pi}{2}\bigr)$
      antwoord: |-
        $0$
      uitwerking: |-
        $-\frac{\pi}{2}$ hoort bij het punt $(0, -1)$: de $x$-coördinaat is $0$.

- id: h1-o11
  soort: opdracht
  niveau: 1
  thema: |-
    drill: booglengte en sectoroppervlakte
  opgave: |-
    Een middelpuntshoek $\theta$ (in rad) snijdt op een cirkel met straal $r$ een boog met lengte $s$ en een sector met oppervlakte $A$ af. Bereken wat gevraagd is.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $r = 5$, $\theta = 1{,}2$; bereken $s$
      antwoord: |-
        $6$
      uitwerking: |-
        $s = r\theta = 5 \cdot 1{,}2 = 6$.
    - opgave: |-
        $r = 4$, $\theta = \frac{\pi}{3}$; bereken $A$
      antwoord: |-
        $\frac{8\pi}{3} \approx 8{,}38$
      uitwerking: |-
        $A = \frac12 r^2\theta = \frac12 \cdot 16 \cdot \frac{\pi}{3} = \frac{8\pi}{3} \approx 8{,}38$.
    - opgave: |-
        $s = 6$, $r = 2{,}5$; bereken $\theta$
      antwoord: |-
        $2{,}4$ rad
      uitwerking: |-
        $\theta = \frac{s}{r} = \frac{6}{2{,}5} = 2{,}4$ rad.
    - opgave: |-
        $s = 7$, $\theta = 0{,}5$; bereken $r$
      antwoord: |-
        $14$
      uitwerking: |-
        $r = \frac{s}{\theta} = \frac{7}{0{,}5} = 14$.
    - opgave: |-
        $A = 12$, $r = 4$; bereken $\theta$
      antwoord: |-
        $1{,}5$ rad
      uitwerking: |-
        $\theta = \frac{2A}{r^2} = \frac{24}{16} = 1{,}5$ rad.
    - opgave: |-
        $A = 50$, $\theta = 1$; bereken $r$
      antwoord: |-
        $10$
      uitwerking: |-
        $r^2 = \frac{2A}{\theta} = 100$, dus $r = 10$.
    - opgave: |-
        $r = 3$, $\theta = 150^\circ$; bereken $s$
      antwoord: |-
        $\frac{5\pi}{2} \approx 7{,}85$
      uitwerking: |-
        Eerst naar radialen: $150^\circ = \frac{5\pi}{6}$. Dan $s = 3 \cdot \frac{5\pi}{6} = \frac{5\pi}{2} \approx 7{,}85$.
    - opgave: |-
        $s = \pi$, $\theta = \frac{\pi}{6}$; bereken $A$
      antwoord: |-
        $3\pi \approx 9{,}42$
      uitwerking: |-
        Eerst $r = \frac{s}{\theta} = \frac{\pi}{\pi/6} = 6$, dan $A = \frac12 \cdot 36 \cdot \frac{\pi}{6} = 3\pi \approx 9{,}42$.

- id: h1-o14
  soort: opdracht
  niveau: 1
  thema: |-
    drill: grondformule en kwadrant
  opgave: |-
    Bepaal de andere twee goniometrische getallen exact.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin\theta = \frac{5}{13}$, $\frac{\pi}{2} < \theta < \pi$
      antwoord: |-
        $\cos\theta = -\frac{12}{13}$, $\tan\theta = -\frac{5}{12}$
      uitwerking: |-
        $\cos^2\theta = 1 - \frac{25}{169} = \frac{144}{169}$; tweede kwadrant, dus $\cos\theta = -\frac{12}{13}$ en $\tan\theta = \frac{5/13}{-12/13} = -\frac{5}{12}$.
    - opgave: |-
        $\cos\theta = -0{,}8$, $\pi < \theta < \frac{3\pi}{2}$
      antwoord: |-
        $\sin\theta = -0{,}6$, $\tan\theta = 0{,}75$
      uitwerking: |-
        $\sin^2\theta = 1 - 0{,}64 = 0{,}36$; derde kwadrant, dus $\sin\theta = -0{,}6$ en $\tan\theta = \frac{-0{,}6}{-0{,}8} = 0{,}75$.
    - opgave: |-
        $\sin\theta = -\frac13$, $\frac{3\pi}{2} < \theta < 2\pi$
      antwoord: |-
        $\cos\theta = \frac{2\sqrt2}{3}$, $\tan\theta = -\frac{\sqrt2}{4}$
      uitwerking: |-
        $\cos^2\theta = 1 - \frac19 = \frac89$; vierde kwadrant, dus $\cos\theta = \frac{2\sqrt2}{3}$ en $\tan\theta = \frac{-1/3}{2\sqrt2/3} = -\frac{1}{2\sqrt2} = -\frac{\sqrt2}{4}$.
    - opgave: |-
        $\cos\theta = \frac14$, $0 < \theta < \frac{\pi}{2}$
      antwoord: |-
        $\sin\theta = \frac{\sqrt{15}}{4}$, $\tan\theta = \sqrt{15}$
      uitwerking: |-
        $\sin^2\theta = 1 - \frac{1}{16} = \frac{15}{16}$; eerste kwadrant, dus $\sin\theta = \frac{\sqrt{15}}{4}$ en $\tan\theta = \frac{\sqrt{15}/4}{1/4} = \sqrt{15}$.
    - opgave: |-
        $\sin\theta = -\frac{7}{25}$, $\pi < \theta < \frac{3\pi}{2}$
      antwoord: |-
        $\cos\theta = -\frac{24}{25}$, $\tan\theta = \frac{7}{24}$
      uitwerking: |-
        $\cos^2\theta = 1 - \frac{49}{625} = \frac{576}{625}$; derde kwadrant, dus $\cos\theta = -\frac{24}{25}$ en $\tan\theta = \frac{-7/25}{-24/25} = \frac{7}{24}$.
    - opgave: |-
        $\cos\theta = -\frac{\sqrt2}{3}$, $\frac{\pi}{2} < \theta < \pi$
      antwoord: |-
        $\sin\theta = \frac{\sqrt7}{3}$, $\tan\theta = -\frac{\sqrt{14}}{2}$
      uitwerking: |-
        $\sin^2\theta = 1 - \frac29 = \frac79$; tweede kwadrant, dus $\sin\theta = \frac{\sqrt7}{3}$ en $\tan\theta = \frac{\sqrt7/3}{-\sqrt2/3} = -\frac{\sqrt7}{\sqrt2} = -\frac{\sqrt{14}}{2}$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    kwadranten
  opgave: |-
    In welk kwadrant ligt het punt bij de hoek (in radialen)? Geef het teken van de sinus en de cosinus.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2$
      antwoord: |-
        II; $\sin > 0$, $\cos < 0$
      uitwerking: |-
        $\frac{\pi}{2} \approx 1{,}57 < 2 < \pi$: tweede kwadrant.
    - opgave: |-
        $4$
      antwoord: |-
        III; beide $< 0$
      uitwerking: |-
        $\pi < 4 < \frac{3\pi}{2} \approx 4{,}71$: derde kwadrant.
    - opgave: |-
        $-1$
      antwoord: |-
        IV; $\sin < 0$, $\cos > 0$
      uitwerking: |-
        $-\frac{\pi}{2} < -1 < 0$: vierde kwadrant.
    - opgave: |-
        $5$
      antwoord: |-
        IV; $\sin < 0$, $\cos > 0$
      uitwerking: |-
        $\frac{3\pi}{2} < 5 < 2\pi \approx 6{,}28$: vierde kwadrant.
    - opgave: |-
        $-3$
      antwoord: |-
        III; beide $< 0$
      uitwerking: |-
        $-\pi \approx -3{,}14 < -3 < -\frac{\pi}{2}$: in wijzerzin voorbij de negatieve $y$-as, het derde kwadrant.
    - opgave: |-
        $8$
      antwoord: |-
        II; $\sin > 0$, $\cos < 0$
      uitwerking: |-
        $8 - 2\pi \approx 1{,}72$, en $\frac{\pi}{2} < 1{,}72 < \pi$: tweede kwadrant.

- id: h1-o15
  soort: opdracht
  niveau: 1
  thema: |-
    rekenen met bijzondere waarden
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2\sin\frac{\pi}{6}\cos\frac{\pi}{6}$
      antwoord: |-
        $\frac{\sqrt3}{2}$
      uitwerking: |-
        $2 \cdot \frac12 \cdot \frac{\sqrt3}{2} = \frac{\sqrt3}{2}$.
    - opgave: |-
        $\sin^2\frac{\pi}{4} - \cos\frac{\pi}{3}$
      antwoord: |-
        $0$
      uitwerking: |-
        $\bigl(\frac{\sqrt2}{2}\bigr)^2 - \frac12 = \frac24 - \frac12 = 0$.
    - opgave: |-
        $\tan\frac{\pi}{3} \cdot \tan\frac{\pi}{6}$
      antwoord: |-
        $1$
      uitwerking: |-
        $\sqrt3 \cdot \frac{\sqrt3}{3} = \frac33 = 1$.
    - opgave: |-
        $\cos\pi + \sin\frac{3\pi}{2}$
      antwoord: |-
        $-2$
      uitwerking: |-
        $-1 + (-1) = -2$.
    - opgave: |-
        $4\sin\frac{5\pi}{6} - \tan\frac{3\pi}{4}$
      antwoord: |-
        $3$
      uitwerking: |-
        $\sin\frac{5\pi}{6} = \frac12$ en $\tan\frac{3\pi}{4} = -1$: $4 \cdot \frac12 - (-1) = 3$.
    - opgave: |-
        $\sin\frac{2\pi}{3}\cos\frac{5\pi}{6}$
      antwoord: |-
        $-\frac34$
      uitwerking: |-
        $\frac{\sqrt3}{2} \cdot \bigl(-\frac{\sqrt3}{2}\bigr) = -\frac34$.

- id: h1-o12
  soort: opdracht
  niveau: 1
  thema: |-
    fouten: radialen en grondformule
  opgave: |-
    Elke redenering bevat een fout. Wat is er fout? Geef het juiste antwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        `Een middelpuntshoek van $60^\circ$ op een cirkel met straal 5 snijdt een boog af met lengte $s = 5 \cdot 60 = 300$.'
      antwoord: |-
        $\theta$ moet in radialen; $s = \frac{5\pi}{3} \approx 5{,}24$
      uitwerking: |-
        De formule $s = r\theta$ geldt alleen met $\theta$ in radialen. Een boog van 300 is ook veel langer dan de hele omtrek $10\pi \approx 31{,}4$. Juist: $60^\circ = \frac{\pi}{3}$, dus $s = 5 \cdot \frac{\pi}{3} = \frac{5\pi}{3} \approx 5{,}24$.
    - opgave: |-
        `Met de rekenmachine vind ik $\sin 2 \approx 0{,}0349$.'
      antwoord: |-
        rekenmachine in graden; $\sin 2 \approx 0{,}909$
      uitwerking: |-
        De rekenmachine stond in graden: $0{,}0349$ is $\sin 2^\circ$. Zonder gradenteken is de hoek $2$ rad, in het tweede kwadrant. In radialen: $\sin 2 \approx 0{,}909$.
    - opgave: |-
        `Uit $\sin^2\theta + \cos^2\theta = 1$ volgt $\sin\theta + \cos\theta = 1$.'
      antwoord: |-
        de vierkantswortel van een som is niet de som van de wortels
      uitwerking: |-
        Je mag niet de vierkantswortel van elke term apart nemen. Tegenvoorbeeld: $\theta = \frac{\pi}{4}$ geeft $\sin\theta + \cos\theta = \frac{\sqrt2}{2} + \frac{\sqrt2}{2} = \sqrt2 \neq 1$.

- id: h1-o4
  soort: opdracht
  niveau: 2
  thema: |-
    uit de tangens
  opgave: |-
    Gegeven: $\tan\theta = 2$ en $\pi < \theta < \frac{3\pi}{2}$. Bepaal exact $\cos\theta$ en $\sin\theta$. Tip: deel de grondformule door $\cos^2\theta$.
  antwoord: |-
    $\cos\theta = -\frac{\sqrt5}{5}$, $\sin\theta = -\frac{2\sqrt5}{5}$
  uitwerking: |-
    Deel $\sin^2\theta + \cos^2\theta = 1$ door $\cos^2\theta$: $\tan^2\theta + 1 = \frac{1}{\cos^2\theta}$, dus $\frac{1}{\cos^2\theta} = 5$ en $\cos^2\theta = \frac15$. In het derde kwadrant is $\cos\theta < 0$: $\cos\theta = -\frac{1}{\sqrt5} = -\frac{\sqrt5}{5}$. Dan is $\sin\theta = \tan\theta \cdot \cos\theta = -\frac{2\sqrt5}{5}$ (ook negatief, zoals het hoort in het derde kwadrant).

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    een fietswiel
  opgave: |-
    Een fietswiel heeft een diameter van $70$ cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Over hoeveel radialen draait het wiel als de fiets $10$ m vooruit rijdt?
      antwoord: |-
        $\frac{200}{7} \approx 28{,}6$ rad
      uitwerking: |-
        Het wiel rolt zonder te slippen: de afgelegde weg is de booglengte op de rand. Met $r = 35$ cm en $s = 1000$ cm is $\theta = \frac{s}{r} = \frac{1000}{35} = \frac{200}{7} \approx 28{,}6$ rad.
    - opgave: |-
        Hoeveel toeren is dat?
      antwoord: |-
        $\approx 4{,}55$
      uitwerking: |-
        Eén toer is $2\pi$ rad: $\frac{200/7}{2\pi} = \frac{100}{7\pi} \approx 4{,}55$ toeren.
    - opgave: |-
        Over hoeveel radialen per seconde draait het wiel bij $18$ km/h?
      antwoord: |-
        $\frac{100}{7} \approx 14{,}3$ rad/s
      uitwerking: |-
        $18$ km/h is $5$ m/s, dus $500$ cm per seconde. Per seconde draait het wiel $\frac{500}{35} = \frac{100}{7} \approx 14{,}3$ rad.

- id: h1-o5
  soort: opdracht
  niveau: 2
  thema: |-
    vereenvoudigen
  opgave: |-
    Vereenvoudig.
  lijst: enumerate
  delen:
    - opgave: |-
        $\cos(\pi - x) + \cos(-x)$
      antwoord: |-
        0
      uitwerking: |-
        Supplementair en tegengesteld: $-\cos x + \cos x = 0$.
    - opgave: |-
        $\sin\bigl(\frac{\pi}{2} - x\bigr) \cos x + \sin(\pi + x)\sin(-x)$
      antwoord: |-
        1
      uitwerking: |-
        $\cos x \cdot \cos x + (-\sin x)(-\sin x) = \cos^2 x + \sin^2 x = 1$, met de grondformule.
    - opgave: |-
        $\tan(\pi + x) \cdot \tan\bigl(\frac{\pi}{2} - x\bigr)$
      antwoord: |-
        1
      uitwerking: |-
        $\tan\bigl(\frac{\pi}{2} - x\bigr) = \frac{\sin(\pi/2 - x)}{\cos(\pi/2 - x)} = \frac{\cos x}{\sin x}$ en $\tan(\pi + x) = \frac{-\sin x}{-\cos x} = \frac{\sin x}{\cos x}$: het product is 1.
    - opgave: |-
        $\sin^2(\pi + x) + \cos^2(-x)$
      antwoord: |-
        1
      uitwerking: |-
        $\sin(\pi + x) = -\sin x$, en het kwadraat is $\sin^2 x$. Met $\cos(-x) = \cos x$: $\sin^2 x + \cos^2 x = 1$.
    - opgave: |-
        $\dfrac{\sin(\pi - x)\cos(\pi + x)}{\cos\bigl(\frac{\pi}{2} - x\bigr)}$
      antwoord: |-
        $-\cos x$
      uitwerking: |-
        $\dfrac{\sin x \cdot (-\cos x)}{\sin x} = -\cos x$ (als $\sin x \neq 0$).

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    verwante hoeken in de figuur
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=1.45,font=\scriptsize]
        \eenheidscirkel
        \draw[accent] (0,0) -- (-.6,.8);
        \draw[->,accent] (.22,0) arc (0:126.87:.22);
        \node[accent] at (55:.36) {$\theta$};
        \draw[accent,dashed] (-.6,.8) -- (-.6,0);
        \fill[accent] (-.6,.8) circle (.035) node[above left,text=black] {$P$};
        \node[below,inner sep=1.5pt] at (-.6,0) {$-0{,}6$};
        \draw[grijs] (-.03,.8) -- (.03,.8) node[right,text=black] {$0{,}8$};
      \end{tikzpicture}
  opgave: |-
    Het punt $P(-0{,}6;\ 0{,}8)$ op de eenheidscirkel hoort bij de hoek $\theta$. Teken het punt bij de gegeven hoek en geef zijn coördinaten.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\pi - \theta$
      antwoord: |-
        $(0{,}6;\ 0{,}8)$
      uitwerking: |-
        Spiegelen om de $y$-as: $(0{,}6;\ 0{,}8)$.
    - opgave: |-
        $\pi + \theta$
      antwoord: |-
        $(0{,}6;\ {-0{,}8})$
      uitwerking: |-
        Spiegelen om de oorsprong: $(0{,}6;\ {-0{,}8})$.
    - opgave: |-
        $-\theta$
      antwoord: |-
        $(-0{,}6;\ {-0{,}8})$
      uitwerking: |-
        Spiegelen om de $x$-as: $(-0{,}6;\ {-0{,}8})$.
    - opgave: |-
        $\frac{\pi}{2} - \theta$
      antwoord: |-
        $(0{,}8;\ {-0{,}6})$
      uitwerking: |-
        Spiegelen om de rechte $y = x$: de coördinaten wisselen, $\cos\bigl(\frac{\pi}{2} - \theta\bigr) = \sin\theta = 0{,}8$ en $\sin\bigl(\frac{\pi}{2} - \theta\bigr) = \cos\theta = -0{,}6$. Het punt is $(0{,}8;\ {-0{,}6})$.
        \figuren{\begin{tikzpicture}[scale=1.5,font=\scriptsize]
          \eenheidscirkel
          \draw[grijs,dashed] (-1.1,-1.1) -- (1.2,1.2);
          \foreach \px/\py/\n/\p in {-.6/.8/P/above left,.6/.8/\pi - \theta/above right,.6/-.8/\pi + \theta/below right,-.6/-.8/-\theta/below left,.8/-.6/\frac{\pi}{2} - \theta/right}{
            \draw[accent] (0,0) -- (\px,\py);
            \fill[accent] (\px,\py) circle (.035) node[\p,text=black] {$\n$};}
        \end{tikzpicture}}

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    een klok
  opgave: |-
    De minutenwijzer van een klok is $12$ cm lang.
  lijst: enumerate
  delen:
    - opgave: |-
        Over welke hoek (in radialen) draait hij in 20 minuten?
      antwoord: |-
        $\frac{2\pi}{3}$
      uitwerking: |-
        20 minuten is een derde van een volle toer: $\frac13 \cdot 2\pi = \frac{2\pi}{3}$.
    - opgave: |-
        Welke afstand legt de punt van de wijzer dan af?
      antwoord: |-
        $8\pi \approx 25{,}1$ cm
      uitwerking: |-
        De punt beschrijft een boog: $s = 12 \cdot \frac{2\pi}{3} = 8\pi \approx 25{,}1$ cm.
    - opgave: |-
        Hoe groot is de oppervlakte die de wijzer bestrijkt?
      antwoord: |-
        $48\pi \approx 150{,}8$ cm$^2$
      uitwerking: |-
        Een cirkelsector: $A = \frac12 \cdot 12^2 \cdot \frac{2\pi}{3} = 48\pi \approx 150{,}8$ cm$^2$.

- id: h1-o20
  soort: opdracht
  niveau: 2
  thema: |-
    drill: grote en negatieve hoeken
  opgave: |-
    Bepaal exact.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\sin\frac{17\pi}{6}$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        $\frac{17\pi}{6} - 2\pi = \frac{5\pi}{6} = \pi - \frac{\pi}{6}$: $\sin\frac{\pi}{6} = \frac12$.
    - opgave: |-
        $\cos\bigl(-\frac{13\pi}{4}\bigr)$
      antwoord: |-
        $-\frac{\sqrt2}{2}$
      uitwerking: |-
        $-\frac{13\pi}{4} + 4\pi = \frac{3\pi}{4} = \pi - \frac{\pi}{4}$: $-\cos\frac{\pi}{4} = -\frac{\sqrt2}{2}$.
    - opgave: |-
        $\tan\frac{11\pi}{3}$
      antwoord: |-
        $-\sqrt3$
      uitwerking: |-
        $\frac{11\pi}{3} - 4\pi = -\frac{\pi}{3}$: $-\tan\frac{\pi}{3} = -\sqrt3$.
    - opgave: |-
        $\cos\frac{25\pi}{6}$
      antwoord: |-
        $\frac{\sqrt3}{2}$
      uitwerking: |-
        $\frac{25\pi}{6} - 4\pi = \frac{\pi}{6}$: $\cos\frac{\pi}{6} = \frac{\sqrt3}{2}$.
    - opgave: |-
        $\sin\bigl(-\frac{9\pi}{4}\bigr)$
      antwoord: |-
        $-\frac{\sqrt2}{2}$
      uitwerking: |-
        $-\frac{9\pi}{4} + 2\pi = -\frac{\pi}{4}$: $-\sin\frac{\pi}{4} = -\frac{\sqrt2}{2}$.
    - opgave: |-
        $\cos 7\pi$
      antwoord: |-
        $-1$
      uitwerking: |-
        $7\pi - 6\pi = \pi$: het punt $(-1, 0)$, dus $-1$.
    - opgave: |-
        $\tan\bigl(-\frac{5\pi}{6}\bigr)$
      antwoord: |-
        $\frac{\sqrt3}{3}$
      uitwerking: |-
        $-\frac{5\pi}{6} = -\pi + \frac{\pi}{6}$, en $\tan(\theta + \pi) = \tan\theta$: $\tan\frac{\pi}{6} = \frac{\sqrt3}{3}$.
    - opgave: |-
        $\sin\frac{100\pi}{3}$
      antwoord: |-
        $-\frac{\sqrt3}{2}$
      uitwerking: |-
        $\frac{100\pi}{3} = 32\pi + \frac{4\pi}{3}$, dus $\sin\frac{4\pi}{3} = \sin\bigl(\pi + \frac{\pi}{3}\bigr) = -\frac{\sqrt3}{2}$.

- id: h1-o6
  soort: opdracht
  niveau: 2
  thema: |-
    identiteiten
  opgave: |-
    Bewijs (voor alle $x$ waarvoor beide leden bestaan).
  lijst: enumerate
  delen:
    - opgave: |-
        $(\sin x + \cos x)^2 = 1 + 2\sin x\cos x$
      antwoord: |-
        bewijs
      uitwerking: |-
        Werk het linkerlid uit met het merkwaardig product en gebruik de grondformule: $(\sin x + \cos x)^2 = \sin^2 x + 2\sin x \cos x + \cos^2 x = 1 + 2\sin x \cos x$.
    - opgave: |-
        $1 + \tan^2 x = \dfrac{1}{\cos^2 x}$
      antwoord: |-
        bewijs
      uitwerking: |-
        Schrijf de tangens als quotiënt en zet op één noemer: $1 + \frac{\sin^2 x}{\cos^2 x} = \frac{\cos^2 x + \sin^2 x}{\cos^2 x} = \frac{1}{\cos^2 x}$, met de grondformule in de teller.
    - opgave: |-
        $\sin^4 x - \cos^4 x = \sin^2 x - \cos^2 x$
      antwoord: |-
        bewijs
      uitwerking: |-
        Het linkerlid is een verschil van twee kwadraten: $\sin^4 x - \cos^4 x = (\sin^2 x - \cos^2 x)(\sin^2 x + \cos^2 x)$. De tweede factor is 1, dus het linkerlid is $\sin^2 x - \cos^2 x$.
    - opgave: |-
        $\dfrac{\cos x}{1 - \sin x} = \dfrac{1 + \sin x}{\cos x}$
      antwoord: |-
        bewijs
      uitwerking: |-
        Vermenigvuldig teller en noemer van het linkerlid met $1 + \sin x$, zodat de noemer een verschil van kwadraten wordt: $\dfrac{\cos x\,(1 + \sin x)}{1 - \sin^2 x} = \dfrac{\cos x\,(1 + \sin x)}{\cos^2 x} = \dfrac{1 + \sin x}{\cos x}$.

- id: h1-o22
  soort: opdracht
  niveau: 2
  thema: |-
    een robotarm
  opgave: |-
    Een robotarm van $40$ cm draait in een verticaal vlak rond een scharnier in de oorsprong. De arm maakt een hoek $\theta$ met de positieve $x$-as.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de exacte coördinaten van het uiteinde bij $\theta = \frac{2\pi}{3}$.
      antwoord: |-
        $(-20,\ 20\sqrt3) \approx (-20;\ 34{,}6)$
      uitwerking: |-
        Het uiteinde ligt op een cirkel met straal 40: $(40\cos\theta, 40\sin\theta)$. Met $\cos\frac{2\pi}{3} = -\frac12$ en $\sin\frac{2\pi}{3} = \frac{\sqrt3}{2}$ is dat $(-20,\ 20\sqrt3) \approx (-20;\ 34{,}6)$.
    - opgave: |-
        Idem bij $\theta = -\frac{\pi}{4}$.
      antwoord: |-
        $(20\sqrt2,\ {-20\sqrt2}) \approx (28{,}3;\ {-28{,}3})$
      uitwerking: |-
        $\bigl(40 \cdot \frac{\sqrt2}{2},\ 40 \cdot \bigl(-\frac{\sqrt2}{2}\bigr)\bigr) = (20\sqrt2,\ {-20\sqrt2}) \approx (28{,}3;\ {-28{,}3})$.
    - opgave: |-
        Bij welke hoeken in $[0, 2\pi[$ ligt het uiteinde op $x = -20$?
      antwoord: |-
        $\frac{2\pi}{3}$ en $\frac{4\pi}{3}$
      uitwerking: |-
        $40\cos\theta = -20$, dus $\cos\theta = -\frac12$. Bij $\frac{\pi}{3}$ is de cosinus $\frac12$; tegengesteld teken krijg je in het tweede en derde kwadrant: $\pi - \frac{\pi}{3} = \frac{2\pi}{3}$ en $\pi + \frac{\pi}{3} = \frac{4\pi}{3}$.
    - opgave: |-
        De arm draait in tegenwijzerzin van $\theta = -\frac{\pi}{4}$ naar $\theta = \frac{2\pi}{3}$. Welke afstand legt het uiteinde af?
      antwoord: |-
        $\frac{110\pi}{3} \approx 115{,}2$ cm
      uitwerking: |-
        De arm draait over $\frac{2\pi}{3} - \bigl(-\frac{\pi}{4}\bigr) = \frac{11\pi}{12}$. Het uiteinde beschrijft een boog: $s = 40 \cdot \frac{11\pi}{12} = \frac{110\pi}{3} \approx 115{,}2$ cm.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    fouten: teken en verwante hoeken
  opgave: |-
    Elke redenering bevat een fout. Wat is er fout? Geef het juiste antwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        `Gegeven: $\sin\theta = 0{,}6$ en $\frac{\pi}{2} < \theta < \pi$. Dan is $\cos\theta = \sqrt{1 - 0{,}36} = 0{,}8$ en $\tan\theta = 0{,}75$.'
      antwoord: |-
        teken vergeten; $\cos\theta = -0{,}8$ en $\tan\theta = -0{,}75$
      uitwerking: |-
        De grondformule geeft $\cos^2\theta = 0{,}64$, dus $\cos\theta = \pm 0{,}8$. In het tweede kwadrant is de $x$-coördinaat negatief: $\cos\theta = -0{,}8$, en dan $\tan\theta = \frac{0{,}6}{-0{,}8} = -0{,}75$.
    - opgave: |-
        `$\cos(\pi + \theta) = \cos\pi + \cos\theta = -1 + \cos\theta$.'
      antwoord: |-
        $\cos$ van een som is niet de som; $\cos(\pi + \theta) = -\cos\theta$
      uitwerking: |-
        De cosinus van een som is niet de som van de cosinussen. Tegenvoorbeeld: $\theta = \pi$ geeft links $\cos 2\pi = 1$ en rechts $-1 + (-1) = -2$. Juist is $\cos(\pi + \theta) = -\cos\theta$ (antisupplementaire hoeken: spiegelen om de oorsprong).
    - opgave: |-
        `$\frac{7\pi}{6} = \pi + \frac{\pi}{6}$, dus $\sin\frac{7\pi}{6} = \sin\frac{\pi}{6} = \frac12$.'
      antwoord: |-
        teken; $\sin\frac{7\pi}{6} = -\frac12$
      uitwerking: |-
        Bij antisupplementaire hoeken verandert het teken: $\sin(\pi + \theta) = -\sin\theta$. Het punt bij $\frac{7\pi}{6}$ ligt in het derde kwadrant, onder de $x$-as. Dus $\sin\frac{7\pi}{6} = -\frac12$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    een afgezaagd tafelblad
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=1.25,font=\scriptsize]
        \fill[accent!20] (30:1) arc (30:150:1) -- cycle;
        \draw[grijs] (0,0) circle (1);
        \draw[accent,thick] (30:1) -- (150:1);
        \draw (0,0) -- (30:1) (0,0) -- (150:1);
        \draw (0,0) -- node[right,pos=.6] {$60$} (30:1);
        \draw (30:.2) arc (30:150:.2);
        \node at (90:.36) {$\frac{2\pi}{3}$};
        \fill (0,0) circle (.025);
      \end{tikzpicture}
  opgave: |-
    Een rond tafelblad heeft straal $60$ cm. Langs een rechte zaagt men er een stuk af. De rechte snijdt de rand in twee punten met een middelpuntshoek van $\frac{2\pi}{3}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is het stuk van de rand dat verdwijnt?
      antwoord: |-
        $40\pi \approx 125{,}7$ cm
      uitwerking: |-
        Een boog met $r = 60$ en $\theta = \frac{2\pi}{3}$: $s = 60 \cdot \frac{2\pi}{3} = 40\pi \approx 125{,}7$ cm.
    - opgave: |-
        Hoe lang is de nieuwe rechte rand?
      antwoord: |-
        $60\sqrt3 \approx 103{,}9$ cm
      uitwerking: |-
        De loodlijn uit het middelpunt op de koorde deelt de hoek middendoor: twee rechthoekige driehoeken met schuine zijde 60 en hoek $\frac{\pi}{3}$ bij het middelpunt. Een halve koorde is $60\sin\frac{\pi}{3} = 30\sqrt3$, de koorde dus $60\sqrt3 \approx 103{,}9$ cm.
    - opgave: |-
        Hoe groot is het afgezaagde stuk?
      antwoord: |-
        $1200\pi - 900\sqrt3 \approx 2211{,}1$ cm$^2$
      uitwerking: |-
        Het afgezaagde stuk is de sector min de driehoek met het middelpunt. Sector: $\frac12 \cdot 60^2 \cdot \frac{2\pi}{3} = 1200\pi$. De driehoek heeft basis $60\sqrt3$ en hoogte $60\cos\frac{\pi}{3} = 30$, dus oppervlakte $\frac12 \cdot 60\sqrt3 \cdot 30 = 900\sqrt3$. Het stuk: $1200\pi - 900\sqrt3 \approx 3769{,}9 - 1558{,}8 \approx 2211{,}1$ cm$^2$.

- id: h1-o23
  soort: opdracht
  niveau: 2
  thema: |-
    hoeken terugvinden
  opgave: |-
    Geef alle hoeken $\theta$ in $[0, 2\pi[$ waarvoor:
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin\theta = \frac{\sqrt2}{2}$
      antwoord: |-
        $\frac{\pi}{4}$, $\frac{3\pi}{4}$
      uitwerking: |-
        $\sin\frac{\pi}{4} = \frac{\sqrt2}{2}$. Dezelfde hoogte heeft het spiegelbeeld om de $y$-as: $\pi - \frac{\pi}{4} = \frac{3\pi}{4}$.
    - opgave: |-
        $\cos\theta = -\frac{\sqrt3}{2}$
      antwoord: |-
        $\frac{5\pi}{6}$, $\frac{7\pi}{6}$
      uitwerking: |-
        $\cos\frac{\pi}{6} = \frac{\sqrt3}{2}$. Een negatieve $x$-coördinaat: tweede en derde kwadrant, $\pi - \frac{\pi}{6} = \frac{5\pi}{6}$ en $\pi + \frac{\pi}{6} = \frac{7\pi}{6}$.
    - opgave: |-
        $\tan\theta = -1$
      antwoord: |-
        $\frac{3\pi}{4}$, $\frac{7\pi}{4}$
      uitwerking: |-
        $\sin\theta = -\cos\theta$: de punten op de rechte $y = -x$, dus $\frac{3\pi}{4}$ en $\frac{7\pi}{4}$.
    - opgave: |-
        $\sin\theta = -1$
      antwoord: |-
        $\frac{3\pi}{2}$
      uitwerking: |-
        Alleen het laagste punt $(0, -1)$: $\frac{3\pi}{2}$.
    - opgave: |-
        $\cos\theta = \frac12$ en $\sin\theta < 0$
      antwoord: |-
        $\frac{5\pi}{3}$
      uitwerking: |-
        $\cos\theta = \frac12$ bij $\frac{\pi}{3}$ en $-\frac{\pi}{3}$. Onder de $x$-as ligt alleen $-\frac{\pi}{3}$, in $[0, 2\pi[$ is dat $\frac{5\pi}{3}$.
    - opgave: |-
        $\sin\theta = \cos\theta$
      antwoord: |-
        $\frac{\pi}{4}$, $\frac{5\pi}{4}$
      uitwerking: |-
        $x = y$: de snijpunten van de eenheidscirkel met de rechte $y = x$, bij $\frac{\pi}{4}$ en $\pi + \frac{\pi}{4} = \frac{5\pi}{4}$.

- id: h1-o21
  soort: opdracht
  niveau: 2
  thema: |-
    een slinger
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=1.7,font=\scriptsize]
        \fill[grijs] (-.35,0) rectangle (.35,.06);
        \draw[grijs,dashed] (0,0) -- (0,-1.15);
        \draw[accent,dashed] (0,0) -- (-102:1.1);
        \draw[accent] (0,0) -- node[right,pos=.45,text=black] {$80$} (-78:1.1);
        \draw[accent,thick] (-102:1.1) arc (-102:-78:1.1);
        \fill[accent] (-78:1.1) circle (.045);
        \fill[accent] (-102:1.1) circle (.045);
        \draw (-90:.45) arc (-90:-78:.45);
        \node at (-84:.62) {$12^\circ$};
      \end{tikzpicture}
  opgave: |-
    Een slinger van $80$ cm zwaait naar beide kanten tot $12^\circ$ van de verticale stand.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke afstand legt het gewicht af van de ene uiterste stand naar de andere?
      antwoord: |-
        $\frac{32\pi}{3} \approx 33{,}5$ cm
      uitwerking: |-
        Van uiterste naar uiterste is $24^\circ = \frac{24\pi}{180} = \frac{2\pi}{15}$. De boog: $s = 80 \cdot \frac{2\pi}{15} = \frac{32\pi}{3} \approx 33{,}5$ cm.
    - opgave: |-
        Hoe ver staat het gewicht in een uiterste stand horizontaal van de verticale stand?
      antwoord: |-
        $\approx 16{,}6$ cm
      uitwerking: |-
        In de rechthoekige driehoek met schuine zijde 80 en hoek $12^\circ$ bij het ophangpunt is de horizontale afstand de overstaande zijde: $80\sin 12^\circ \approx 16{,}6$ cm.
    - opgave: |-
        Hoeveel hoger dan in de laagste stand hangt het gewicht dan?
      antwoord: |-
        $\approx 1{,}75$ cm
      uitwerking: |-
        In de uiterste stand hangt het gewicht $80\cos 12^\circ \approx 78{,}25$ cm onder het ophangpunt, in de laagste stand $80$ cm. Het verschil is $80(1 - \cos 12^\circ) \approx 1{,}75$ cm.

- id: h1-o24
  soort: opdracht
  niveau: 3
  thema: |-
    regelmatige veelhoek in de eenheidscirkel
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=1.35,font=\scriptsize]
        \draw[grijs] (0,0) circle (1);
        \fill[accent!20] (0,0) -- (1,0) -- (60:1) -- cycle;
        \draw[accent,thick] (0:1) -- (60:1) -- (120:1) -- (180:1) -- (240:1) -- (300:1) -- cycle;
        \draw[accent] (0,0) -- (1,0) (0,0) -- (60:1);
        \draw[dashed] (60:1) -- ({cos(60)},0);
        \fill (0,0) circle (.025) node[below left,inner sep=1pt] {$O$};
        \node[right] at (1,0) {$B$};
        \node[above right,inner sep=1pt] at (60:1) {$C$};
      \end{tikzpicture}
  opgave: |-
    Een regelmatige $n$-hoek is ingeschreven in de eenheidscirkel. De figuur toont het geval $n = 6$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de oppervlakte van de $n$-hoek gelijk is aan $A_n = \frac{n}{2}\sin\frac{2\pi}{n}$. Tip: neem $B(1, 0)$ en $C$ het volgende hoekpunt.
      antwoord: |-
        bewijs
      uitwerking: |-
        Verbind het middelpunt $O$ met alle hoekpunten. Dat geeft $n$ gelijke driehoeken, elk met tophoek $\frac{2\pi}{n}$ in $O$. In driehoek $OBC$ is $C$ het punt van de eenheidscirkel bij $\frac{2\pi}{n}$, dus $C = \bigl(\cos\frac{2\pi}{n}, \sin\frac{2\pi}{n}\bigr)$. Met basis $|OB| = 1$ op de $x$-as is de hoogte de $y$-coördinaat van $C$: $\sin\frac{2\pi}{n}$. Eén driehoek heeft dus oppervlakte $\frac12\sin\frac{2\pi}{n}$, en de $n$-hoek $A_n = \frac{n}{2}\sin\frac{2\pi}{n}$.
    - opgave: |-
        Bereken exact $A_4$, $A_6$ en $A_{12}$.
      antwoord: |-
        $2$; $\frac{3\sqrt3}{2}$; $3$
      uitwerking: |-
        $A_4 = 2\sin\frac{\pi}{2} = 2$ (een vierkant met diagonaal 2). $A_6 = 3\sin\frac{\pi}{3} = \frac{3\sqrt3}{2} \approx 2{,}598$. $A_{12} = 6\sin\frac{\pi}{6} = 3$.
    - opgave: |-
        Bereken $A_{100}$ op vier decimalen. Welk getal benaderen de oppervlakten als $n$ groot wordt? Verklaar.
      antwoord: |-
        $\approx 3{,}1395$; $\pi$
      uitwerking: |-
        $A_{100} = 50\sin\frac{\pi}{50} \approx 3{,}1395$. Hoe meer hoekpunten, hoe beter de veelhoek de cirkel vult. De oppervlakten naderen dus de oppervlakte van de eenheidscirkel: $\pi \approx 3{,}1416$.

- id: h1-o8
  soort: opdracht
  niveau: 3
  thema: |-
    op de aardbol
  opgave: |-
    De aarde is (bijna) een bol met straal $6371$ km. Brussel ligt op $50{,}85^\circ$ noorderbreedte.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe ver ligt Brussel, langs het aardoppervlak, van het punt op de evenaar met dezelfde lengtegraad?
      antwoord: |-
        $\approx 5654$ km
      uitwerking: |-
        Beide punten liggen op een grote cirkel door de polen, met straal 6371 km en middelpuntshoek $50{,}85^\circ = 50{,}85 \cdot \frac{\pi}{180}$ rad. De booglengte is $6371 \cdot 50{,}85 \cdot \frac{\pi}{180} \approx 5654$ km.
    - opgave: |-
        Door de draaiing van de aarde beschrijft Brussel elke 24 uur een cirkel. Wat is de straal van die cirkel? Hoe snel beweegt Brussel?
      antwoord: |-
        $\approx 4022$ km; $\approx 1053$ km/h
      uitwerking: |-
        De straal is de afstand van Brussel tot de aardas. In de rechthoekige driehoek met schuine zijde 6371 en hoek $50{,}85^\circ$ in het middelpunt is dat de aanliggende zijde: $6371 \cos 50{,}85^\circ \approx 4022$ km. Per uur draait de aarde over $\frac{2\pi}{24} = \frac{\pi}{12}$ rad, dus Brussel legt per uur $4022 \cdot \frac{\pi}{12} \approx 1053$ km af: ongeveer $1053$ km/h.

- id: h1-o26
  soort: opdracht
  niveau: 3
  thema: |-
    uit een som van sinus en cosinus
  opgave: |-
    Gegeven: $\sin\theta + \cos\theta = \frac15$ en $0 < \theta < \pi$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\sin\theta\cos\theta$. Tip: kwadrateer.
      antwoord: |-
        $-\frac{12}{25}$
      uitwerking: |-
        $(\sin\theta + \cos\theta)^2 = \sin^2\theta + 2\sin\theta\cos\theta + \cos^2\theta = 1 + 2\sin\theta\cos\theta$. Dat is $\frac{1}{25}$, dus $2\sin\theta\cos\theta = -\frac{24}{25}$ en $\sin\theta\cos\theta = -\frac{12}{25}$.
    - opgave: |-
        In welk kwadrant ligt het punt bij $\theta$?
      antwoord: |-
        het tweede
      uitwerking: |-
        Voor $0 < \theta < \pi$ is $\sin\theta > 0$. Het product $\sin\theta\cos\theta$ is negatief, dus $\cos\theta < 0$: het tweede kwadrant.
    - opgave: |-
        Bepaal $\sin\theta$ en $\cos\theta$ exact. Tip: bereken eerst $(\sin\theta - \cos\theta)^2$.
      antwoord: |-
        $\sin\theta = \frac45$, $\cos\theta = -\frac35$
      uitwerking: |-
        $(\sin\theta - \cos\theta)^2 = 1 - 2\sin\theta\cos\theta = 1 + \frac{24}{25} = \frac{49}{25}$. Omdat $\sin\theta > 0 > \cos\theta$ is $\sin\theta - \cos\theta$ positief: $\sin\theta - \cos\theta = \frac75$. Tel op bij $\sin\theta + \cos\theta = \frac15$: $2\sin\theta = \frac85$, dus $\sin\theta = \frac45$ en $\cos\theta = \frac15 - \frac45 = -\frac35$. Controle: $\bigl(\frac45\bigr)^2 + \bigl(\frac35\bigr)^2 = 1$.

- id: h1-o25
  soort: opdracht
  niveau: 3
  thema: |-
    sinus, boog en tangens vergelijken
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=2.3,font=\scriptsize]
        \fill[accent!15] (0,0) -- (1,0) arc (0:50:1) -- cycle;
        \draw[->,lijngrijs] (-.1,0) -- (1.3,0);
        \draw[->,lijngrijs] (0,-.1) -- (0,1.3);
        \draw[grijs] (1,0) arc (0:90:1);
        \draw (1,-.08) -- (1,1.28);
        \draw[accent] (0,0) -- (1,{tan(50)});
        \draw[accent] (1,0) -- (50:1);
        \draw[dashed] (50:1) -- ({cos(50)},0);
        \fill[accent] (50:1) circle (.022) node[above left,text=black,inner sep=1.5pt] {$P$};
        \fill[accent] (1,{tan(50)}) circle (.022) node[right,text=black] {$T$};
        \node[below right,inner sep=1.5pt] at (1,0) {$A$};
        \node[below left,inner sep=1.5pt] at (0,0) {$O$};
        \node[below,inner sep=1.5pt] at ({cos(50)},0) {$Q$};
        \node at (25:.22) {$\alpha$};
      \end{tikzpicture}
  opgave: |-
    Neem $0 < \alpha < \frac{\pi}{2}$. Op de eenheidscirkel is $P$ het punt bij $\alpha$, $Q$ zijn projectie op de $x$-as en $A(1, 0)$. De rechte $OP$ snijdt de raaklijn in $A$ aan de cirkel in $T$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $|AT| = \tan\alpha$.
      antwoord: |-
        bewijs
      uitwerking: |-
        De driehoeken $OQP$ en $OAT$ hebben een rechte hoek (in $Q$ en $A$) en de hoek $\alpha$ in $O$ gemeen: ze zijn gelijkvormig. Dus $\frac{|AT|}{|OA|} = \frac{|QP|}{|OQ|}$, en met $|OA| = 1$, $|QP| = \sin\alpha$ en $|OQ| = \cos\alpha$ volgt $|AT| = \frac{\sin\alpha}{\cos\alpha} = \tan\alpha$.
    - opgave: |-
        Vergelijk de oppervlakten van driehoek $OAP$, sector $OAP$ en driehoek $OAT$, en leid af dat $\sin\alpha < \alpha < \tan\alpha$.
      antwoord: |-
        $\frac12\sin\alpha < \frac12\alpha < \frac12\tan\alpha$
      uitwerking: |-
        Driehoek $OAP$ heeft basis $|OA| = 1$ en hoogte $|QP| = \sin\alpha$: oppervlakte $\frac12\sin\alpha$. De sector heeft oppervlakte $\frac12 \cdot 1^2 \cdot \alpha = \frac{\alpha}{2}$. Driehoek $OAT$ heeft rechthoekszijden 1 en $\tan\alpha$: oppervlakte $\frac12\tan\alpha$. De driehoek $OAP$ ligt binnen de sector, en de sector binnen driehoek $OAT$. Dus $\frac12\sin\alpha < \frac12\alpha < \frac12\tan\alpha$, en na vermenigvuldigen met 2: $\sin\alpha < \alpha < \tan\alpha$.
    - opgave: |-
        Controleer met de rekenmachine voor $\alpha = 0{,}5$ en voor $\alpha = 1{,}2$.
      antwoord: |-
        $0{,}479 < 0{,}5 < 0{,}546$; $0{,}932 < 1{,}2 < 2{,}572$
      uitwerking: |-
        In radialen: $\sin 0{,}5 \approx 0{,}479$ en $\tan 0{,}5 \approx 0{,}546$; $\sin 1{,}2 \approx 0{,}932$ en $\tan 1{,}2 \approx 2{,}572$. Voor de kleine hoek liggen de drie getallen dicht bij elkaar, voor de grote hoek niet.
    - opgave: |-
        Leid uit b af dat $\cos\alpha < \frac{\sin\alpha}{\alpha} < 1$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Uit $\sin\alpha < \alpha$ volgt, na delen door $\alpha > 0$, $\frac{\sin\alpha}{\alpha} < 1$. Uit $\alpha < \tan\alpha = \frac{\sin\alpha}{\cos\alpha}$ volgt, na vermenigvuldigen met $\cos\alpha > 0$, $\alpha\cos\alpha < \sin\alpha$, en na delen door $\alpha$: $\cos\alpha < \frac{\sin\alpha}{\alpha}$.

- id: h1-o9
  soort: opdracht
  niveau: 3
  thema: |-
    een reuzenrad
  opgave: |-
    Een reuzenrad heeft straal $20$ m; de as staat op $25$ m hoogte. Een gondel staat bij de hoek $\theta$, gemeten vanaf de horizontale door de as, in tegenwijzerzin.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de hoogte van de gondel $h = 25 + 20\sin\theta$ is.
      antwoord: |-
        bewijs
      uitwerking: |-
        Neem de as als oorsprong. De gondel is het punt $(20\cos\theta, 20\sin\theta)$ van de cirkel met straal 20: het punt van de eenheidscirkel bij $\theta$, vermenigvuldigd met 20. Hij ligt dus $20\sin\theta$ boven de as (onder de as als $\sin\theta < 0$), en de as staat op 25 m: $h = 25 + 20\sin\theta$.
    - opgave: |-
        Bereken de hoogte bij $\theta = \frac{7\pi}{6}$.
      antwoord: |-
        15 m
      uitwerking: |-
        $\sin\frac{7\pi}{6} = -\sin\frac{\pi}{6} = -\frac12$, dus $h = 25 + 20 \cdot \bigl(-\frac12\bigr) = 15$ m.
    - opgave: |-
        Bij welke hoeken in $[0, 2\pi[$ is de gondel $35$ m hoog?
      antwoord: |-
        $\frac{\pi}{6}$ en $\frac{5\pi}{6}$
      uitwerking: |-
        $25 + 20\sin\theta = 35$ geeft $\sin\theta = \frac12$: $\theta = \frac{\pi}{6}$ of het spiegelbeeld om de $y$-as, $\theta = \pi - \frac{\pi}{6} = \frac{5\pi}{6}$.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h1-koppel-2
  soort: koppel
  niveau: 1
  koppel:
    rubriek: analyse
    onderwerp: Algemene functies
  thema: |-
    even en oneven
  opgave: |-
    Zijn de functies $\sin x$, $\cos x$ en $\tan x$ even, oneven of geen van beide? Gebruik de verwante hoeken.
  antwoord: |-
    oneven; even; oneven
  uitwerking: |-
    $\sin(-x) = -\sin x$: oneven. $\cos(-x) = \cos x$: even. $\tan(-x) = \frac{-\sin x}{\cos x} = -\tan x$: oneven.

- id: h1-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: Matrices
  thema: |-
    rotatiematrix
  opgave: |-
    De matrix
    \[R = \begin{pmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{pmatrix}\]
    draait een punt over de hoek $\theta$ rond de oorsprong. Bereken het beeld van $(1, 0)$ en van $(0, 1)$ voor $\theta = \frac{\pi}{3}$. Liggen ze op de eenheidscirkel?
  antwoord: |-
    $\bigl(\frac12, \frac{\sqrt3}{2}\bigr)$ en $\bigl(-\frac{\sqrt3}{2}, \frac12\bigr)$; ja
  uitwerking: |-
    $R\binom{1}{0} = \binom{\cos\theta}{\sin\theta} = \binom{1/2}{\sqrt3/2}$, het punt bij $\frac{\pi}{3}$. $R\binom{0}{1} = \binom{-\sin\theta}{\cos\theta} = \binom{-\sqrt3/2}{1/2}$, het punt bij $\frac{\pi}{3} + \frac{\pi}{2} = \frac{5\pi}{6}$. Beide liggen op de eenheidscirkel.

