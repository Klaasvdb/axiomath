- id: h3-periodiek-k
  soort: kort
  opgave: |-
    Periodieke functies.
  lijst: enumerate
  delen:
    - opgave: |-
        Een functie $f$ is periodiek met periode $4$, met $f(1) = 3$ en $f(2) = -1$. Bereken $f(9)$, $f(-2)$ en $f(14)$.
      antwoord: |-
        $3$; $-1$; $-1$
      uitwerking: |-
        $f(9) = f(1 + 2 \cdot 4) = f(1) = 3$, $f(-2) = f(2 - 4) = f(2) = -1$ en $f(14) = f(2 + 3 \cdot 4) = f(2) = -1$.
    - opgave: |-
        Voor alle $x$ is $\sin(x + 4\pi) = \sin x$. Waarom is $4\pi$ dan niet de periode van de sinus?
      antwoord: |-
        $2\pi$ is kleiner
      uitwerking: |-
        Ook $\sin(x + 2\pi) = \sin x$ voor alle $x$, en $2\pi < 4\pi$. De periode is het kleinste positieve getal met die eigenschap.
    - opgave: |-
        Een functie $g$ heeft periode $5$. Is $g(3) = g(-7)$? Waarom?
      antwoord: |-
        ja
      uitwerking: |-
        Ja: $-7 = 3 - 2 \cdot 5$, dus $-7$ ligt twee periodes vóór $3$, en $g(-7) = g(3)$.

- id: h3-sin-k
  soort: kort
  opgave: |-
    De sinusfunctie. Gebruik een schets van de grafiek.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef alle nulwaarden van $\sin x$ in $[-\pi, 3\pi]$.
      antwoord: |-
        $-\pi$, $0$, $\pi$, $2\pi$, $3\pi$
      uitwerking: |-
        De nulwaarden zijn $k\pi$; in $[-\pi, 3\pi]$ is dat voor $k = -1, 0, 1, 2, 3$: $-\pi$, $0$, $\pi$, $2\pi$ en $3\pi$.
    - opgave: |-
        Voor welke $x$ is $\sin x = 1$?
      antwoord: |-
        $x = \frac{\pi}{2} + k \cdot 2\pi$ ($k \in \Z$)
      uitwerking: |-
        De top ligt in $\frac{\pi}{2}$, en herhaalt zich na elke periode $2\pi$: $x = \frac{\pi}{2} + k \cdot 2\pi$ met $k \in \Z$.
    - opgave: |-
        Hoeveel oplossingen heeft $\sin x = -0{,}5$ in $[-2\pi, 2\pi]$?
      antwoord: |-
        4
      uitwerking: |-
        $-0{,}5$ ligt tussen $-1$ en $1$: twee oplossingen per periode. Het interval telt twee periodes, en in de randen is $\sin x = 0$. Dus 4 oplossingen.

- id: h3-cos-k
  soort: kort
  opgave: |-
    De cosinusfunctie. Gebruik een schets van de grafiek.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef alle nulwaarden van $\cos x$ in $[0, 3\pi]$.
      antwoord: |-
        $\frac{\pi}{2}$, $\frac{3\pi}{2}$, $\frac{5\pi}{2}$
      uitwerking: |-
        De nulwaarden zijn $\frac{\pi}{2} + k\pi$; in $[0, 3\pi]$ is dat voor $k = 0, 1, 2$: $\frac{\pi}{2}$, $\frac{3\pi}{2}$ en $\frac{5\pi}{2}$.
    - opgave: |-
        Voor welke $x$ is $\cos x = 1$?
      antwoord: |-
        $x = k \cdot 2\pi$ ($k \in \Z$)
      uitwerking: |-
        De cosinus begint in een top in $0$, en die herhaalt zich na elke periode: $x = k \cdot 2\pi$ met $k \in \Z$.
    - opgave: |-
        Op welk deel van $[0, 2\pi]$ is $\cos x$ negatief?
      antwoord: |-
        $\bigl]\frac{\pi}{2}, \frac{3\pi}{2}\bigr[$
      uitwerking: |-
        Tussen de nulwaarden $\frac{\pi}{2}$ en $\frac{3\pi}{2}$ ligt het dal $(\pi, -1)$: daar is de cosinus negatief. Op de eenheidscirkel is dat het tweede en het derde kwadrant.

- id: h3-amplitude-k
  soort: kort
  opgave: |-
    De amplitude.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Geef het bereik van $5\sin x$.
      antwoord: |-
        $[-5, 5]$
      uitwerking: |-
        Amplitude $5$, evenwichtslijn $y = 0$: het bereik is $[-5, 5]$.
    - opgave: |-
        Geef het bereik van $0{,}4\sin x$.
      antwoord: |-
        $[-0{,}4;\ 0{,}4]$
      uitwerking: |-
        Amplitude $0{,}4$: het bereik is $[-0{,}4;\ 0{,}4]$.
    - opgave: |-
        Voor welke $a > 0$ is de grootste waarde van $a\sin x$ gelijk aan $2{,}5$?
      antwoord: |-
        $a = 2{,}5$
      uitwerking: |-
        De grootste waarde van $a\sin x$ is $a$, dus $a = 2{,}5$.
    - opgave: |-
        Geef het bereik en de amplitude van $-2\sin x$.
      antwoord: |-
        $[-2, 2]$; $2$
      uitwerking: |-
        Uit $-1 \leqslant \sin x \leqslant 1$ volgt $-2 \leqslant -2\sin x \leqslant 2$. Het bereik is $[-2, 2]$ en de amplitude $2$. De grafiek is die van $2\sin x$, gespiegeld om de $x$-as.

- id: h3-fase-k
  soort: kort
  opgave: |-
    De faseverschuiving.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $\sin(3x + \pi)$ in de vorm $\sin\bigl(b(x - c)\bigr)$. Over hoeveel en in welke zin is de grafiek van $\sin 3x$ verschoven?
      antwoord: |-
        $\sin\bigl(3(x + \frac{\pi}{3})\bigr)$; $\frac{\pi}{3}$ naar links
      uitwerking: |-
        $3x + \pi = 3\bigl(x + \frac{\pi}{3}\bigr) = 3\bigl(x - (-\frac{\pi}{3})\bigr)$, dus $c = -\frac{\pi}{3}$: een verschuiving over $\frac{\pi}{3}$ naar links.
    - opgave: |-
        Schrijf $\sin\bigl(\frac{x}{2} - \frac{\pi}{4}\bigr)$ in de vorm $\sin\bigl(b(x - c)\bigr)$ en geef het stijgende nulpunt.
      antwoord: |-
        $\sin\bigl(\frac12(x - \frac{\pi}{2})\bigr)$; $\bigl(\frac{\pi}{2}, 0\bigr)$
      uitwerking: |-
        $\frac{x}{2} - \frac{\pi}{4} = \frac12\bigl(x - \frac{\pi}{2}\bigr)$, dus $c = \frac{\pi}{2}$ en het stijgende nulpunt is $\bigl(\frac{\pi}{2}, 0\bigr)$.
    - opgave: |-
        Over hoeveel en in welke zin moet je de grafiek van $\sin 4x$ verschuiven om die van $\sin(4x - \pi)$ te krijgen?
      antwoord: |-
        $\frac{\pi}{4}$ naar rechts
      uitwerking: |-
        $4x - \pi = 4\bigl(x - \frac{\pi}{4}\bigr)$, dus $c = \frac{\pi}{4}$: over $\frac{\pi}{4}$ naar rechts, niet over $\pi$.

- id: h3-evenwicht-k
  soort: kort
  opgave: |-
    De evenwichtslijn.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de grootste en de kleinste waarde van $3\sin 2x - 4$.
      antwoord: |-
        $-1$ en $-7$
      uitwerking: |-
        $a = 3$ en $d = -4$: de grootste waarde is $d + a = -1$, de kleinste $d - a = -7$.
    - opgave: |-
        Een sinusfunctie schommelt tussen $2$ en $10$. Geef de evenwichtslijn en de amplitude.
      antwoord: |-
        $y = 6$; $4$
      uitwerking: |-
        $d = \frac{10 + 2}{2} = 6$ en $a = \frac{10 - 2}{2} = 4$.
    - opgave: |-
        Geef het bereik van $\frac12\sin(\pi x) + 1$.
      antwoord: |-
        $\bigl[\frac12, \frac32\bigr]$
      uitwerking: |-
        $d = 1$ en $a = \frac12$: van $1 - \frac12 = \frac12$ tot $1 + \frac12 = \frac32$.

- id: h3-o9
  soort: opdracht
  niveau: 1
  thema: |-
    drill: periode
  opgave: |-
    Geef de periode.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin 5x$
      antwoord: |-
        $\frac{2\pi}{5}$
      uitwerking: |-
        $\frac{2\pi}{b}$ met $b = 5$: $\frac{2\pi}{5}$.
    - opgave: |-
        $\cos 4x$
      antwoord: |-
        $\frac{\pi}{2}$
      uitwerking: |-
        $\frac{2\pi}{4} = \frac{\pi}{2}$.
    - opgave: |-
        $\tan 3x$
      antwoord: |-
        $\frac{\pi}{3}$
      uitwerking: |-
        De tangens heeft periode $\pi$: $\frac{\pi}{3}$.
    - opgave: |-
        $\sin\frac{x}{3}$
      antwoord: |-
        $6\pi$
      uitwerking: |-
        $b = \frac13$: $\frac{2\pi}{1/3} = 6\pi$.
    - opgave: |-
        $\cos \pi x$
      antwoord: |-
        $2$
      uitwerking: |-
        $\frac{2\pi}{\pi} = 2$.
    - opgave: |-
        $\tan\frac{\pi x}{2}$
      antwoord: |-
        $2$
      uitwerking: |-
        $\frac{\pi}{\pi/2} = 2$.
    - opgave: |-
        $3\sin(2x - 1) + 4$
      antwoord: |-
        $\pi$
      uitwerking: |-
        Alleen $b = 2$ telt: $\frac{2\pi}{2} = \pi$.
    - opgave: |-
        $\cos\frac{2\pi x}{5}$
      antwoord: |-
        $5$
      uitwerking: |-
        $\frac{2\pi}{2\pi/5} = 5$.
    - opgave: |-
        $\tan\frac{x}{4}$
      antwoord: |-
        $4\pi$
      uitwerking: |-
        $\frac{\pi}{1/4} = 4\pi$.
    - opgave: |-
        $5\sin\frac{\pi x}{6}$
      antwoord: |-
        $12$
      uitwerking: |-
        $\frac{2\pi}{\pi/6} = 12$.
    - opgave: |-
        $\cos(-3x)$
      antwoord: |-
        $\frac{2\pi}{3}$
      uitwerking: |-
        $\cos(-3x) = \cos 3x$: $\frac{2\pi}{3}$.
    - opgave: |-
        $\sin 4\pi x$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        $\frac{2\pi}{4\pi} = \frac12$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    grafiek lezen
  figuur:
    opties: |-
      5.6cm
    code: |-
      \begin{tikzpicture}[x=.62cm,y=.45cm,font=\scriptsize]
        \draw[black!14,very thin] (0,-1) grid[xstep=1.5708,ystep=1] (7.9,3);
        \draw[->,grijs] (-.2,0) -- (8.2,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,-1.4) -- (0,3.6) node[above,text=black] {$y$};
        \foreach \t/\n in {1.5708/\frac{\pi}{2},3.1416/\pi,4.7124/\frac{3\pi}{2},6.2832/2\pi}{\node[below,inner sep=1.5pt] at (\t,0) {$\n$};}
        \foreach \t in {-1,1,2,3}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \draw[accent,thick] plot[domain=0:7.85,samples=100,smooth] (\x,{2*sin(\x r)+1});
      \end{tikzpicture}
  opgave: |-
    De figuur toont een sinusgrafiek. Geef amplitude, periode en evenwichtslijn, en een voorschrift.
  antwoord: |-
    $2$; $2\pi$; $y = 1$; $f(x) = 2\sin x + 1$
  uitwerking: |-
    Top $3$ in $\frac{\pi}{2}$, dal $-1$ in $\frac{3\pi}{2}$: amplitude $\frac{3 - (-1)}{2} = 2$ en evenwichtslijn $y = \frac{3 + (-1)}{2} = 1$. Van top tot dal is $\pi$, dus de periode is $2\pi$ en $b = 1$. In $x = 0$ snijdt de grafiek de evenwichtslijn stijgend: $c = 0$, en $f(x) = 2\sin x + 1$.

- id: h3-o11
  soort: opdracht
  niveau: 1
  thema: |-
    eigenschappen van sin, cos en tan
  opgave: |-
    Waar of niet waar? Verklaar met de grafiek of met een formule.
  lijst: enumerate
  delen:
    - opgave: |-
        De sinus heeft periode $\pi$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $\sin(x + \pi) = -\sin x$, en dat is niet altijd $\sin x$ (neem $x = \frac{\pi}{2}$). De periode is $2\pi$.
    - opgave: |-
        $\tan(x + \pi) = \tan x$ voor alle $x$ in het domein.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $\tan(x + \pi) = \dfrac{-\sin x}{-\cos x} = \tan x$ (antisupplementaire hoeken).
    - opgave: |-
        Het bereik van de cosinus is $\R$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $\cos x$ is een $x$-coördinaat op de eenheidscirkel, dus het bereik is $[-1, 1]$. Het bereik van de tangens is wel $\R$.
    - opgave: |-
        De grafiek van $\cos x$ is die van $\sin x$, $\frac{\pi}{2}$ naar rechts geschoven.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $\cos x = \sin\bigl(x + \frac{\pi}{2}\bigr)$, dus naar \textit{links}. De top van de sinus ligt in $\frac{\pi}{2}$, die van de cosinus in $0$.
    - opgave: |-
        De tangens heeft dezelfde nulwaarden als de sinus.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $\tan x = \frac{\sin x}{\cos x} = 0$ precies als $\sin x = 0$, dus in $x = k\pi$. Daar is $\cos x = \pm 1 \neq 0$, dus de tangens bestaat er.
    - opgave: |-
        Op $\bigl[0, \frac{\pi}{2}\bigr[$ stijgen de sinus en de tangens, en daalt de cosinus.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: in het eerste kwadrant gaat het punt op de eenheidscirkel omhoog en naar links, dus $y$ stijgt en $x$ daalt. Het quotiënt $\frac{\sin x}{\cos x}$ stijgt dan ook.

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    kenmerken
  opgave: |-
    Geef amplitude, periode, evenwichtslijn en faseverschuiving.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $5\sin x - 2$
      antwoord: |-
        $5$; $2\pi$; $y = -2$; $0$
      uitwerking: |-
        $a = 5$, $b = 1$, $c = 0$, $d = -2$: amplitude 5, periode $2\pi$, evenwichtslijn $y = -2$, geen faseverschuiving.
    - opgave: |-
        $\sin 4x + 1$
      antwoord: |-
        $1$; $\frac{\pi}{2}$; $y = 1$; $0$
      uitwerking: |-
        $a = 1$, $b = 4$, $c = 0$, $d = 1$: amplitude 1, periode $\frac{2\pi}{4} = \frac{\pi}{2}$, evenwichtslijn $y = 1$, geen faseverschuiving.
    - opgave: |-
        $\frac12\sin\bigl(x - \frac{\pi}{3}\bigr)$
      antwoord: |-
        $\frac12$; $2\pi$; $y = 0$; $\frac{\pi}{3}$
      uitwerking: |-
        $a = \frac12$, $b = 1$, $c = \frac{\pi}{3}$, $d = 0$: amplitude $\frac12$, periode $2\pi$, evenwichtslijn $y = 0$, faseverschuiving $\frac{\pi}{3}$ naar rechts.

- id: h3-o10
