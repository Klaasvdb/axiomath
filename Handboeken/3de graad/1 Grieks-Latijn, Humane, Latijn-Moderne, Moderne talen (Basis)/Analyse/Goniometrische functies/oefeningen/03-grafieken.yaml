# KOPPEL
#----------------------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Afgeleiden
  thema: |-
    de helling in 0
  opgave: |-
    Bereken $\frac{\sin h}{h}$ voor $h = 0{,}1$, $0{,}01$ en $0{,}001$ (in radialen). Welk getal benadert het? Wat zegt dat over de grafiek van de sinus in de oorsprong? Werkt het ook in graden?
  antwoord: |-
    1; de raaklijn is $y = x$; nee
  uitwerking: |-
    $0{,}99833$, $0{,}99998$, $0{,}9999998$: het nadert 1. Dicht bij $0$ is $\sin h \approx h$: de grafiek raakt de rechte $y = x$. In graden is $\sin h^\circ \approx \frac{\pi}{180}h$: dan is de helling geen 1. Daarom werkt men in radialen.

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    aantal oplossingen
  opgave: |-
    Hoeveel oplossingen heeft $\cos x = -0{,}3$ in $[0, 2\pi]$? En $\tan x = -1$ in $[0, 2\pi]$?
  antwoord: |-
    2; 2
  uitwerking: |-
    De cosinus neemt elke waarde van $]-1, 1[$ twee keer aan per periode. De tangens één keer per periode $\pi$: twee keer in $[0, 2\pi]$ (in $\frac{3\pi}{4}$ en $\frac{7\pi}{4}$).

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    schetsen
  opgave: |-
    Geef amplitude, periode, evenwichtslijn, beginpunt, grootste en kleinste waarde van $f(x) = 2\sin\bigl(\frac12(x + \pi)\bigr) - 1$.
  antwoord: |-
    $2$; $4\pi$; $y = -1$; $(-\pi, -1)$; $1$ en $-3$
  uitwerking: |-
    Amplitude 2, periode $\frac{2\pi}{1/2} = 4\pi$, evenwichtslijn $y = -1$, beginpunt $(-\pi, -1)$. Grootste waarde $1$, kleinste $-3$.

- id: h3-t3
  soort: test
  niveau: 2
  thema: |-
    voorschrift
  opgave: |-
    Een sinusgrafiek heeft een top in $(2, 10)$ en het eerstvolgende dal in $(5, 4)$. Geef een voorschrift.
  antwoord: |-
    $3\cos\bigl(\frac{\pi}{3}(x - 2)\bigr) + 7$
  uitwerking: |-
    $d = 7$, $a = 3$, periode $6$, $b = \frac{\pi}{3}$; top in $x = 2$: $f(x) = 3\cos\bigl(\frac{\pi}{3}(x - 2)\bigr) + 7$.

- id: h3-t4
  soort: test
  niveau: 2
  thema: |-
    model
  opgave: |-
    De watertemperatuur van een meer is het hoogst op dag 210 van het jaar ($22\,^\circ$C) en het laagst een half jaar later ($4\,^\circ$C). Stel een model op en schat de temperatuur op dag 100.
  antwoord: |-
    $T(t) = 9\cos\bigl(\frac{2\pi}{365}(t - 210)\bigr) + 13$; $\approx 10{,}1\,^\circ$C
  uitwerking: |-
    $d = 13$, $a = 9$, periode 365: $T(t) = 9\cos\bigl(\frac{2\pi}{365}(t - 210)\bigr) + 13$. $T(100) \approx 9 \cdot (-0{,}318) + 13 \approx 10{,}1\,^\circ$C.

- id: h3-t5
  soort: test
  niveau: 1
  thema: |-
    tangens
  opgave: |-
    Geef de periode, de nulwaarden en de verticale asymptoten van $f(x) = \tan\frac{x}{3}$.
  antwoord: |-
    $3\pi$; $x = 3k\pi$; $x = \frac{3\pi}{2} + 3k\pi$
  uitwerking: |-
    Periode $\frac{\pi}{1/3} = 3\pi$. Nulwaarden: $\frac{x}{3} = k\pi$, dus $x = 3k\pi$. Asymptoten: $\frac{x}{3} = \frac{\pi}{2} + k\pi$, dus $x = \frac{3\pi}{2} + 3k\pi$ ($k \in \Z$).

- id: h3-t7
  soort: test
  niveau: 1
  thema: |-
    schetsen met vijf punten
  opgave: |-
    Schets $g(x) = \frac12\sin(3x - \pi) + 2$ over één periode. Geef de vijf punten die je gebruikt.
  antwoord: |-
    $\bigl(\frac{\pi}{3}, 2\bigr)$, $\bigl(\frac{\pi}{2}, \frac52\bigr)$, $\bigl(\frac{2\pi}{3}, 2\bigr)$, $\bigl(\frac{5\pi}{6}, \frac32\bigr)$, $(\pi, 2)$
  uitwerking: |-
    $3x - \pi = 3\bigl(x - \frac{\pi}{3}\bigr)$, dus $g(x) = \frac12\sin\bigl(3(x - \frac{\pi}{3})\bigr) + 2$. Amplitude $\frac12$, periode $\frac{2\pi}{3}$, kwart periode $\frac{\pi}{6}$, evenwichtslijn $y = 2$, beginpunt $\bigl(\frac{\pi}{3}, 2\bigr)$. Top $\bigl(\frac{\pi}{2}, \frac52\bigr)$, $\bigl(\frac{2\pi}{3}, 2\bigr)$, dal $\bigl(\frac{5\pi}{6}, \frac32\bigr)$, einde $(\pi, 2)$.

    \figuren{\begin{tikzpicture}[x=1.5cm,y=.9cm,font=\scriptsize]
      \draw[black!14,very thin] (0,0) grid[xstep=.5236,ystep=.5] (3.1416,3);
      \draw[->,grijs] (-.15,0) -- (3.45,0) node[right,text=black] {$x$};
      \draw[->,grijs] (0,-.2) -- (0,3.4) node[above,text=black] {$y$};
      \foreach \t/\n in {1.0472/\frac{\pi}{3},1.5708/\frac{\pi}{2},2.0944/\frac{2\pi}{3},2.618/\frac{5\pi}{6},3.1416/\pi}{\node[below,inner sep=1.5pt] at (\t,0) {$\n$};}
      \foreach \t in {1,2,3}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
      \draw[grijs,dashed] (0,2) -- (3.1416,2);
      \draw[accent,thick] plot[domain=1.0472:3.1416,samples=80,smooth] (\x,{.5*sin(3*\x r-180)+2});
      \foreach \p in {(1.0472,2),(1.5708,2.5),(2.0944,2),(2.618,1.5),(3.1416,2)}{\fill[accent] \p circle (1.6pt);}
    \end{tikzpicture}}

- id: h3-t6
  soort: test
  niveau: 2
  thema: |-
    voorschrift uit een grafiek
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.4cm,font=\scriptsize]
        \rooster{0}{1}{6}{-4}{1}{2}
        \kromme{0}{6}{3*sin(90*(\x-1))-1}
      \end{tikzpicture}
  opgave: |-
    De figuur toont een sinusgrafiek. Geef een voorschrift met een sinus en een met een cosinus.
  antwoord: |-
    $3\sin\bigl(\frac{\pi}{2}(x - 1)\bigr) - 1$; $3\cos\bigl(\frac{\pi}{2}(x - 2)\bigr) - 1$
  uitwerking: |-
    Top $(2, 2)$, dal $(4, -4)$: $d = \frac{2 + (-4)}{2} = -1$, $a = \frac{2 - (-4)}{2} = 3$, periode $2 \cdot (4 - 2) = 4$, dus $b = \frac{\pi}{2}$. Stijgend door de evenwichtslijn in $x = 1$: $f(x) = 3\sin\bigl(\frac{\pi}{2}(x - 1)\bigr) - 1$. Met de top in $x = 2$: $f(x) = 3\cos\bigl(\frac{\pi}{2}(x - 2)\bigr) - 1$.
