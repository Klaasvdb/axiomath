- id: h3-o12
  soort: opdracht
  niveau: 1
  thema: |-
    drill: grootste en kleinste waarde
  opgave: |-
    Geef het bereik.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $3\sin x + 2$
      antwoord: |-
        $[-1, 5]$
      uitwerking: |-
        $-1 \leqslant \sin x \leqslant 1$, dus $-3 + 2 \leqslant 3\sin x + 2 \leqslant 3 + 2$: $[-1, 5]$.
    - opgave: |-
        $4 - 2\cos x$
      antwoord: |-
        $[2, 6]$
      uitwerking: |-
        $-2 \leqslant -2\cos x \leqslant 2$, dus $[2, 6]$. Het minteken wisselt alleen top en dal.
    - opgave: |-
        $\frac12\cos 3x - 1$
      antwoord: |-
        $\bigl[-\frac32, -\frac12\bigr]$
      uitwerking: |-
        $d = -1$, $a = \frac12$: van $-1 - \frac12$ tot $-1 + \frac12$. De $3$ verandert alleen de periode.
    - opgave: |-
        $5\sin(x - 1) + 5$
      antwoord: |-
        $[0, 10]$
      uitwerking: |-
        $d = 5$, $a = 5$: $[0, 10]$.
    - opgave: |-
        $-\sin x$
      antwoord: |-
        $[-1, 1]$
      uitwerking: |-
        Spiegelen om de $x$-as verandert het bereik $[-1, 1]$ niet.
    - opgave: |-
        $\sin^2 x$
      antwoord: |-
        $[0, 1]$
      uitwerking: |-
        $\sin x \in [-1, 1]$, dus $\sin^2 x \in [0, 1]$: $0$ in $x = 0$ en $1$ in $x = \frac{\pi}{2}$.
    - opgave: |-
        $|\cos x|$
      antwoord: |-
        $[0, 1]$
      uitwerking: |-
        $|\cos x| \in [0, 1]$: $0$ in $\frac{\pi}{2}$ en $1$ in $0$.
    - opgave: |-
        $2\tan x$
      antwoord: |-
        $\R$
      uitwerking: |-
        De tangens neemt op elke tak alle reële waarden aan: bereik $\R$, zonder grootste of kleinste waarde.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    schetsen
  opgave: |-
    Schets over één periode. Geef de vijf punten die je gebruikt.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = 2\sin\bigl(x - \frac{\pi}{3}\bigr)$
      antwoord: |-
        $(\frac{\pi}{3}, 0)$, $(\frac{5\pi}{6}, 2)$, $(\frac{4\pi}{3}, 0)$, $(\frac{11\pi}{6}, -2)$, $(\frac{7\pi}{3}, 0)$
      uitwerking: |-
        $a = 2$, periode $2\pi$, $d = 0$, $c = \frac{\pi}{3}$. Beginpunt $(\frac{\pi}{3}, 0)$, dan om de kwart periode $\frac{\pi}{2}$: top $(\frac{5\pi}{6}, 2)$, $(\frac{4\pi}{3}, 0)$, dal $(\frac{11\pi}{6}, -2)$, einde $(\frac{7\pi}{3}, 0)$.

        \figuren{\begin{tikzpicture}[x=.62cm,y=.42cm,font=\scriptsize]
          \draw[black!14,very thin] (0,-2) grid[xstep=1.0472,ystep=1] (7.33,2);
