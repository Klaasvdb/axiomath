# Oefeningen van hoofdstuk 3. Zie oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken $\sin\frac{\pi}{2}$, $\cos\pi$ en $\sin\frac{3\pi}{2}$.
      antwoord: |-
        $1$; $-1$; $-1$
      uitwerking: |-
        $1$, $-1$ en $-1$.
    - opgave: |-
        Welk getal ligt midden tussen $5$ en $-1$?
      antwoord: |-
        2
      uitwerking: |-
        $\frac{5 + (-1)}{2} = 2$.
    - opgave: |-
        Hoe ontstaat de grafiek van $2\sin x + 1$ uit die van $\sin x$?
      antwoord: |-
        verticaal $\times 2$, 1 naar boven
      uitwerking: |-
        Verticaal uitrekken met factor 2, dan 1 naar boven.
    - opgave: |-
        Vereenvoudig $\sin(x + 2\pi)$ en \mbox{$\cos\bigl(\frac{\pi}{2} - x\bigr)$}.
      antwoord: |-
        $\sin x$; $\sin x$
      uitwerking: |-
        Een volle toer verder: $\sin x$. Complementaire hoek: $\sin x$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Een reuzenrad met straal $20$ m en de as op $25$ m hoogte maakt één toer per 4 minuten. Een gondel is op $t = 0$ op de hoogte van de as, en gaat omhoog.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de hoogte na $0$, $1$, $2$, $3$ en $4$ minuten.
      antwoord: |-
        $25$; $45$; $25$; $5$; $25$ m
      uitwerking: |-
        $25$, $45$, $25$, $5$ en $25$ m: as, top, as, onderaan, as.
    - opgave: |-
        Wat gebeurt er na 4 minuten? Wat zijn de grootste en de kleinste hoogte?
      antwoord: |-
        alles herhaalt zich; $45$ m en $5$ m
      uitwerking: |-
        Alles begint opnieuw. Hoogstens $45$ m, minstens $5$ m.
    - opgave: |-
        Schets de hoogte als functie van de tijd over 8 minuten. Op welke grafiek lijkt ze?
      antwoord: |-
        een sinus
      uitwerking: |-
        Een golf die op de sinus lijkt: $h(t) = 20\sin\bigl(\frac{\pi}{2}t\bigr) + 25$.

- id: h3-periode
  soort: kort
  opgave: |-
    Geef de periode. Vul $x + p$ in om te controleren.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin 3x$
      antwoord: |-
        $\frac{2\pi}{3}$
      uitwerking: |-
        $\sin\bigl(3(x + \frac{2\pi}{3})\bigr) = \sin(3x + 2\pi) = \sin 3x$.
    - opgave: |-
        $\cos\frac{x}{2}$
      antwoord: |-
        $4\pi$
      uitwerking: |-
        $\cos\frac{x + 4\pi}{2} = \cos\bigl(\frac{x}{2} + 2\pi\bigr)$.
    - opgave: |-
        $\tan 2x$
      antwoord: |-
        $\frac{\pi}{2}$
      uitwerking: |-
        $\tan(2x + \pi) = \tan 2x$, dus periode $\frac{\pi}{2}$.

- id: h3-aantal
  soort: kort
  opgave: |-
    Hoeveel oplossingen heeft de vergelijking? Gebruik een schets van de grafiek.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\cos x = 0{,}7$ in $[0, 4\pi]$
      antwoord: |-
        4
      uitwerking: |-
        De cosinus neemt de waarde $0{,}7$ twee keer aan per periode $2\pi$, en $[0, 4\pi]$ telt twee periodes: $2 \cdot 2 = 4$ oplossingen. In de randen is $\cos x = 1$, dus daar ligt geen extra oplossing.
    - opgave: |-
        $\sin x = -1$ in $[0, 6\pi]$
      antwoord: |-
        3
      uitwerking: |-
        De waarde $-1$ is het dal: één keer per periode, in $\frac{3\pi}{2}$, $\frac{7\pi}{2}$ en $\frac{11\pi}{2}$. Drie periodes, dus 3 oplossingen.
    - opgave: |-
        $\tan x = -3$ in $[0, 3\pi]$
      antwoord: |-
        3
      uitwerking: |-
        Op elke tak neemt de tangens elke waarde één keer aan. Een negatieve waarde ligt op het stuk rechts van een asymptoot: in $\bigl]\frac{\pi}{2}, \pi\bigr[$, $\bigl]\frac{3\pi}{2}, 2\pi\bigr[$ en $\bigl]\frac{5\pi}{2}, 3\pi\bigr[$. Op $\bigl[0, \frac{\pi}{2}\bigr[$ is $\tan x \geqslant 0$. Samen 3 oplossingen.
    - opgave: |-
        $\sin x = 1{,}2$ in $\R$
      antwoord: |-
        0
      uitwerking: |-
        Het bereik van de sinus is $[-1, 1]$, en $1{,}2$ ligt erbuiten: geen oplossingen.
    - opgave: |-
        $\sin 2x = 0{,}5$ in $[0, 2\pi]$
      antwoord: |-
        4
      uitwerking: |-
        $\sin 2x$ heeft periode $\pi$, dus $[0, 2\pi]$ telt twee periodes. Twee oplossingen per periode: 4 oplossingen.

- id: h3-kenmerken
  soort: kort
  opgave: |-
    Geef amplitude, periode, evenwichtslijn en beginpunt. Zet zo nodig eerst $b$ buiten haakjes.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = 4\sin\bigl(3(x - \frac{\pi}{6})\bigr) + 2$
      antwoord: |-
        $4$; $\frac{2\pi}{3}$; $y = 2$; $\bigl(\frac{\pi}{6}, 2\bigr)$
      uitwerking: |-
        $a = 4$, $b = 3$, $c = \frac{\pi}{6}$, $d = 2$. Amplitude 4, periode $\frac{2\pi}{3}$, evenwichtslijn $y = 2$, beginpunt $\bigl(\frac{\pi}{6}, 2\bigr)$.
    - opgave: |-
        $g(x) = \sin\bigl(2x - \frac{\pi}{2}\bigr) - 1$
      antwoord: |-
        $1$; $\pi$; $y = -1$; $\bigl(\frac{\pi}{4}, -1\bigr)$
      uitwerking: |-
        Zet $2$ buiten haakjes: $2x - \frac{\pi}{2} = 2\bigl(x - \frac{\pi}{4}\bigr)$, dus $g(x) = \sin\bigl(2(x - \frac{\pi}{4})\bigr) - 1$. Amplitude 1, periode $\frac{2\pi}{2} = \pi$, evenwichtslijn $y = -1$, beginpunt $\bigl(\frac{\pi}{4}, -1\bigr)$. Let op: de faseverschuiving is $\frac{\pi}{4}$, niet $\frac{\pi}{2}$.
    - opgave: |-
        $h(x) = \frac12\sin(\pi x + \pi) + 3$
      antwoord: |-
        $\frac12$; $2$; $y = 3$; $(-1, 3)$
      uitwerking: |-
        $\pi x + \pi = \pi(x + 1) = \pi\bigl(x - (-1)\bigr)$, dus $c = -1$. Amplitude $\frac12$, periode $\frac{2\pi}{\pi} = 2$, evenwichtslijn $y = 3$, beginpunt $(-1, 3)$.

- id: h3-schets
  soort: kort
  opgave: |-
    Schets over één periode, met de vijf punten. Controleer met de grootste en de kleinste waarde.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = 2\sin\bigl(x + \frac{\pi}{2}\bigr) - 1$
      antwoord: |-
        $\bigl(-\frac{\pi}{2}, -1\bigr)$, $(0, 1)$, $\bigl(\frac{\pi}{2}, -1\bigr)$, $(\pi, -3)$, $\bigl(\frac{3\pi}{2}, -1\bigr)$
      uitwerking: |-
        $a = 2$, periode $2\pi$, $d = -1$, $c = -\frac{\pi}{2}$. Beginpunt $\bigl(-\frac{\pi}{2}, -1\bigr)$, en dan om de kwart periode $\frac{\pi}{2}$: top $(0, 1)$, $\bigl(\frac{\pi}{2}, -1\bigr)$, dal $(\pi, -3)$, einde $\bigl(\frac{3\pi}{2}, -1\bigr)$. De grootste waarde is $-1 + 2 = 1$, de kleinste $-1 - 2 = -3$. (Dit is $2\cos x - 1$.)

        \figuren{\begin{tikzpicture}[x=.7cm,y=.42cm,font=\scriptsize]
          \draw[black!14,very thin] (-1.5708,-3) grid[xstep=1.5708,ystep=1] (4.7124,1);
          \draw[->,grijs] (-1.9,0) -- (5.1,0) node[right,text=black] {$x$};
          \draw[->,grijs] (0,-3.4) -- (0,1.7) node[above,text=black] {$y$};
          \foreach \t/\n in {-1.5708/-\frac{\pi}{2},1.5708/\frac{\pi}{2},3.1416/\pi,4.7124/\frac{3\pi}{2}}{\node[below,inner sep=1.5pt] at (\t,0) {$\n$};}
          \foreach \t in {-3,-1,1}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
          \draw[grijs,dashed] (-1.5708,-1) -- (4.7124,-1);
          \draw[accent,thick] plot[domain=-1.5708:4.7124,samples=90,smooth] (\x,{2*sin(\x r+90)-1});
          \foreach \p in {(-1.5708,-1),(0,1),(1.5708,-1),(3.1416,-3),(4.7124,-1)}{\fill[accent] \p circle (1.6pt);}
        \end{tikzpicture}}
    - opgave: |-
        $g(x) = 3\sin\bigl(\frac{\pi}{2}(x - 1)\bigr)$
      antwoord: |-
        $(1, 0)$, $(2, 3)$, $(3, 0)$, $(4, -3)$, $(5, 0)$
      uitwerking: |-
        $a = 3$, periode $\frac{2\pi}{\pi/2} = 4$, $d = 0$, $c = 1$. Beginpunt $(1, 0)$, en om de kwart periode $1$: top $(2, 3)$, $(3, 0)$, dal $(4, -3)$, einde $(5, 0)$. Grootste waarde 3, kleinste $-3$.

        \figuren{\begin{tikzpicture}[x=.7cm,y=.42cm,font=\scriptsize]
          \rooster{0}{1}{5}{-3}{1}{3}
          \kromme{0}{5}{3*sin(90*(\x-1))}
          \foreach \p in {(1,0),(2,3),(3,0),(4,-3),(5,0)}{\fill[accent] \p circle (1.6pt);}
        \end{tikzpicture}}

- id: h3-sinusfunctie
  soort: kort
  opgave: |-
    Sinusfuncties.
  lijst: enumerate
  delen:
    - opgave: |-
        Neem $f(x) = 2\sin\bigl(\pi(x - 1)\bigr) - 3$. Geef amplitude, periode, evenwichtslijn, grootste en kleinste waarde.
      antwoord: |-
        $2$; $2$; $y = -3$; $-1$ en $-5$
      uitwerking: |-
        Amplitude 2, periode $\frac{2\pi}{\pi} = 2$, evenwichtslijn $y = -3$, grootste waarde $-1$, kleinste $-5$.
    - opgave: |-
        Een sinusgrafiek heeft een top in $(0, 7)$ en het eerstvolgende dal in $(5, 1)$. Geef een voorschrift.
      antwoord: |-
        $3\cos\frac{\pi x}{5} + 4$
      uitwerking: |-
        $d = 4$, $a = 3$, periode $10$, dus $b = \frac{\pi}{5}$. Top in $0$: $f(x) = 3\cos\frac{\pi x}{5} + 4$.

- id: h3-voorschrift-grafiek
  soort: kort
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.42cm,font=\scriptsize]
        \rooster{0}{1}{6}{0}{1}{5}
        \kromme{0}{6}{2*cos(90*(\x-1))+3}
      \end{tikzpicture}
  opgave: |-
    De figuur toont een sinusgrafiek.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een voorschrift met een cosinus.
      antwoord: |-
        $f(x) = 2\cos\bigl(\frac{\pi}{2}(x - 1)\bigr) + 3$
      uitwerking: |-
        Top $(1, 5)$, eerstvolgend dal $(3, 1)$. Evenwicht $d = \frac{5 + 1}{2} = 3$, amplitude $a = \frac{5 - 1}{2} = 2$, periode $2 \cdot (3 - 1) = 4$, dus $b = \frac{2\pi}{4} = \frac{\pi}{2}$. Een cosinus begint in de top: $f(x) = 2\cos\bigl(\frac{\pi}{2}(x - 1)\bigr) + 3$.
    - opgave: |-
        Geef een voorschrift met een sinus.
      antwoord: |-
        $f(x) = 2\sin\bigl(\frac{\pi}{2}x\bigr) + 3$
      uitwerking: |-
        Het stijgende evenwichtspunt ligt een kwart periode vóór de top, in $x = 1 - 1 = 0$: beginpunt $(0, 3)$. Dus $f(x) = 2\sin\bigl(\frac{\pi}{2}x\bigr) + 3$.

- id: h3-model
  soort: kort
  opgave: |-
    In een haven is het hoogwater $4{,}8$ m om 2 uur, en het volgende laagwater $0{,}4$ m om 8.15 uur. Stel een sinusmodel op voor de waterhoogte $h$ ($t$ in uur na middernacht), en bereken de hoogte om 12 uur.
  antwoord: |-
    $h(t) = 2{,}2\cos\bigl(\frac{2\pi}{12{,}5}(t - 2)\bigr) + 2{,}6$; $\approx 3{,}28$ m
  uitwerking: |-
    $d = 2{,}6$, $a = 2{,}2$, periode $2 \cdot 6{,}25 = 12{,}5$ uur. Met de top om 2 uur: $h(t) = 2{,}2\cos\bigl(\frac{2\pi}{12{,}5}(t - 2)\bigr) + 2{,}6$. $h(12) = 2{,}2\cos(1{,}6\pi) + 2{,}6 \approx 3{,}28$ m.

- id: h3-model-2
  soort: kort
  opgave: |-
    In een serre is het op een zomerdag het warmst om 14 uur ($28\,^\circ$C) en het koudst om 2 uur 's nachts ($12\,^\circ$C).
  lijst: enumerate
  delen:
    - opgave: |-
        Stel een sinusmodel op voor de temperatuur $T$, met $t$ in uur na middernacht.
      antwoord: |-
        $T(t) = 8\cos\bigl(\frac{\pi}{12}(t - 14)\bigr) + 20$
      uitwerking: |-
        Evenwicht $d = \frac{28 + 12}{2} = 20$, amplitude $a = \frac{28 - 12}{2} = 8$. De periode is een dag: $24$ uur, dus $b = \frac{2\pi}{24} = \frac{\pi}{12}$. Een cosinus met de top om 14 uur: $T(t) = 8\cos\bigl(\frac{\pi}{12}(t - 14)\bigr) + 20$.
    - opgave: |-
        Bereken exact de temperatuur om 8 uur en om 18 uur.
      antwoord: |-
        $20\,^\circ$C; $24\,^\circ$C
      uitwerking: |-
        $T(8) = 8\cos\bigl(-\frac{\pi}{2}\bigr) + 20 = 20\,^\circ$C: 8 uur ligt een kwart periode vóór de top, op de evenwichtslijn. $T(18) = 8\cos\frac{\pi}{3} + 20 = 8 \cdot \frac12 + 20 = 24\,^\circ$C.
    - opgave: |-
        Waarom is de top hier precies 12 uur van het dal verwijderd? Klopt dat in werkelijkheid?
      antwoord: |-
        een halve periode; niet altijd
      uitwerking: |-
        In een sinusmodel ligt het dal altijd een halve periode na de top. In werkelijkheid warmt een serre vaak sneller op dan ze afkoelt: dan liggen top en dal niet precies 12 uur uit elkaar, en is het model maar een benadering.

