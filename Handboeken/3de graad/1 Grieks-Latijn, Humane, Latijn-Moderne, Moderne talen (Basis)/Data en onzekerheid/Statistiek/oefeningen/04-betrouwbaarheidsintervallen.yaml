# Oefeningen van hoofdstuk 4. Zie oefeningenbank.py voor de velden.

- id: h4-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken $\sqrt{\frac{0{,}5 \cdot 0{,}5}{100}}$.
      antwoord: |-
        $0{,}05$
      uitwerking: |-
        $\sqrt{0{,}0025} = 0{,}05$.
    - opgave: |-
        Bereken \texttt{invNorm(0.975)}. Waarom is dat ongeveer 1,96?
      antwoord: |-
        $\approx 1{,}96$
      uitwerking: |-
        Links van 1,96 ligt 97,5~\%, dus tussen $-1{,}96$ en $1{,}96$ ligt 95~\%.
    - opgave: |-
        Hoeveel is 2,6 procentpunt meer dan 23~\%?
      antwoord: |-
        25,6~\%
      uitwerking: |-
        $23 + 2{,}6 = 25{,}6$~\%.
    - opgave: |-
        Los op: $\frac{8}{\sqrt n} \leqslant 2$.
      antwoord: |-
        $n \geqslant 16$
      uitwerking: |-
        $\sqrt n \geqslant 4$, dus $n \geqslant 16$.

- id: h4-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad In een aselecte steekproef van 1000 Belgen overweegt 23~\% een elektrische auto.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel dat in werkelijkheid $p = 0{,}23$. Bereken de standaardafwijking van $\hat{p}$ voor steekproeven van 1000.
      antwoord: |-
        $\approx 0{,}0133$
      uitwerking: |-
        $\sqrt{\frac{0{,}23 \cdot 0{,}77}{1000}} \approx 0{,}0133$.
    - opgave: |-
        Tussen welke grenzen ligt $\hat{p}$ dan in ongeveer 95~\% van de steekproeven? Gebruik de vuistregel met 2 standaardafwijkingen.
      antwoord: |-
        ongeveer $[0{,}204;\ 0{,}256]$
      uitwerking: |-
        $0{,}23 \pm 2 \cdot 0{,}0133 \approx [0{,}203;\ 0{,}257]$.
    - opgave: |-
        Je kent $p$ eigenlijk niet. Wat zegt b over waar $p$ waarschijnlijk ligt, als je $\hat{p} = 0{,}23$ gevonden hebt?
      antwoord: |-
        binnen ongeveer 2,6 procentpunt van 0,23
      uitwerking: |-
        Als $\hat{p}$ meestal binnen 0,026 van $p$ ligt, dan ligt $p$ meestal binnen 0,026 van $\hat{p}$: ongeveer tussen 20,4~\% en 25,6~\%.

- id: h4-proportie
  soort: kort
  opgave: |-
    In een aselecte steekproef van 600 leerlingen eet 312 elke dag ontbijt. Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor het aandeel van alle leerlingen, en formuleer je besluit.
  antwoord: |-
    $[0{,}48;\ 0{,}56]$
  uitwerking: |-
    $\hat{p} = 0{,}52$, $E = 1{,}96\sqrt{\frac{0{,}52 \cdot 0{,}48}{600}} \approx 0{,}040$. Interval $[0{,}48;\ 0{,}56]$: met 95~\% betrouwbaarheid ontbijt tussen 48~\% en 56~\% van alle leerlingen elke dag. Of het meer dan de helft is, kun je hieruit niet besluiten.

- id: h4-niveau
  soort: kort
  opgave: |-
    In een aselecte steekproef van 300 leerlingen speelt 78 een muziekinstrument.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor het aandeel van alle leerlingen.
      antwoord: |-
        $[0{,}210;\ 0{,}310]$
      uitwerking: |-
        $\hat{p} = \frac{78}{300} = 0{,}26$ en $E = 1{,}96\sqrt{\frac{0{,}26 \cdot 0{,}74}{300}} \approx 0{,}050$. Interval $[0{,}210;\ 0{,}310]$.
    - opgave: |-
        Bereken ook een 90~\%- en een 99~\%-interval.
      antwoord: |-
        $[0{,}218;\ 0{,}302]$; \ $[0{,}195;\ 0{,}325]$
      uitwerking: |-
        90~\%: $E = 1{,}645\sqrt{\frac{0{,}26 \cdot 0{,}74}{300}} \approx 0{,}042$, interval $[0{,}218;\ 0{,}302]$. 99~\%: $E = 2{,}576 \cdot 0{,}0253 \approx 0{,}065$, interval $[0{,}195;\ 0{,}325]$.
    - opgave: |-
        Waarom is het 99~\%-interval het breedst?
      antwoord: |-
        meer zekerheid vraagt een breder interval
      uitwerking: |-
        Wie vaker gelijk wil hebben (99 van de 100 intervallen moeten $p$ bevatten), moet een ruimer interval nemen: $z = 2{,}576$ is groter dan 1,96.

- id: h4-interpretatie
  soort: kort
  figuur:
    code: |-
      \begin{tikzpicture}[x=16cm,y=.24cm,font=\scriptsize]
        \draw[grijs] (.1,0) -- (.56,0);
        \foreach \t/\l in {.1/{0,1},.2/{0,2},.3/{0,3},.4/{0,4},.5/{0,5}}{\draw[grijs] (\t,0) -- (\t,-.4) node[below,text=black] {\l};}
        \draw[fel!80!black,dashed] (.3,0) -- (.3,13) node[above,text=black] {$p$};
        \foreach \a/\b/\i in {.285/.475/1,.183/.357/2,.183/.357/3,.229/.411/4,.183/.357/5,.219/.401/6,.247/.433/7,.343/.537/8,.183/.357/9,.266/.454/10,.122/.278/11,.229/.411/12}{\draw[accent,thick] (\a,\i) -- (\b,\i); \fill[accent] ({(\a+\b)/2},\i) circle (1pt); \node[left] at (.1,\i) {\i};}
      \end{tikzpicture}
  opgave: |-
    Twaalf leerlingen trokken elk een aselecte steekproef van 100 uit dezelfde populatie, met $p = 0{,}3$, en berekenden een 95~\%-\hspace{0pt}interval.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke intervallen bevatten $p$ niet?
      antwoord: |-
        8 en 11
      uitwerking: |-
        Interval 8 ligt volledig rechts van 0,3, interval 11 volledig links. De andere tien bevatten 0,3.
    - opgave: |-
        Hoeveel missers verwacht je bij 12 intervallen? Is 2 verrassend?
      antwoord: |-
        0,6; nee
      uitwerking: |-
        Elk interval mist met kans 0,05: verwacht $12 \cdot 0{,}05 = 0{,}6$. Twee missers is iets meer, maar bij zo weinig intervallen niet verrassend.
    - opgave: |-
        Leerling 2 zegt: \textit{de kans dat $p$ in mijn interval ligt, is 95~\%}. Wat antwoord je?
      antwoord: |-
        fout: $p$ ligt vast
      uitwerking: |-
        Fout: $p$ ligt vast, en ligt in zijn interval of niet (hier wel). De 95~\% gaat over de methode: van alle intervallen die zo gemaakt worden, bevat ongeveer 95~\% de echte $p$.

- id: h4-gemiddelde
  soort: kort
  opgave: |-
    Een aselecte groep van 36 leerlingen haalt gemiddeld 72,4 op een toets met $\sigma = 8$. Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor het gemiddelde van alle leerlingen.
  antwoord: |-
    $[69{,}8;\ 75{,}0]$
  uitwerking: |-
    $E = 1{,}96 \cdot \frac{8}{6} \approx 2{,}61$. Interval $[69{,}8;\ 75{,}0]$.

- id: h4-terug
  soort: kort
  opgave: |-
    Een onderzoeker meldt een 95~\%-\hspace{0pt}betrouwbaarheidsinterval $[48{,}04;\ 51{,}96]$ voor een gemiddelde, met $\sigma = 6$.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat was het steekproefgemiddelde, en wat de foutenmarge?
      antwoord: |-
        $\xbar = 50$; $E = 1{,}96$
      uitwerking: |-
        Het midden: $\xbar = \frac{48{,}04 + 51{,}96}{2} = 50$. De halve breedte: $E = \frac{51{,}96 - 48{,}04}{2} = 1{,}96$.
    - opgave: |-
        Hoe groot was de steekproef?
      antwoord: |-
        36
      uitwerking: |-
        $1{,}96 \cdot \frac{6}{\sqrt n} = 1{,}96$, dus $\sqrt n = 6$ en $n = 36$.

- id: h4-n
  soort: kort
  opgave: |-
    Hoe groot moet de steekproef minstens zijn, bij 95~\% betrouwbaarheid?
  lijst: enumerate
  delen:
    - opgave: |-
        Een aandeel schatten met een foutenmarge van 2 procentpunt, als je uit vroeger onderzoek weet dat het ongeveer 10~\% is.
      antwoord: |-
        865
      uitwerking: |-
        Gebruik $\hat{p} \approx 0{,}1$: $1{,}96\sqrt{\frac{0{,}1 \cdot 0{,}9}{n}} \leqslant 0{,}02 \iff n \geqslant \frac{1{,}96^2 \cdot 0{,}09}{0{,}02^2} \approx 864{,}4$: dus 865.
    - opgave: |-
        Hetzelfde, als je niets over het aandeel weet.
      antwoord: |-
        2401
      uitwerking: |-
        Het ongunstigste geval $\hat{p} = 0{,}5$: $n \geqslant \frac{1{,}96^2 \cdot 0{,}25}{0{,}02^2} = 2401$. Zonder voorkennis heb je bijna drie keer zoveel personen nodig.
    - opgave: |-
        Een gemiddelde schatten tot op 3 eenheden, met $\sigma = 15$.
      antwoord: |-
        97
      uitwerking: |-
        $1{,}96 \cdot \frac{15}{\sqrt n} \leqslant 3 \iff \sqrt n \geqslant 9{,}8 \iff n \geqslant 96{,}04$: dus 97. Naar boven afronden, anders is de marge net te groot.

- id: h4-marge
  soort: kort
  opgave: |-
    Hoe verandert de foutenmarge als je
  lijst: enumerate
  delen:
    - opgave: |-
        de steekproef vier keer zo groot maakt?
      antwoord: |-
        ze halveert
      uitwerking: |-
        $\sqrt{4n} = 2\sqrt n$: de marge wordt de helft.
    - opgave: |-
        99~\% in plaats van 95~\% betrouwbaarheid vraagt?
      antwoord: |-
        ze wordt ongeveer 1,3 keer zo groot
      uitwerking: |-
        $z$ gaat van 1,96 naar 2,576: $\frac{2{,}576}{1{,}96} \approx 1{,}31$ keer zo groot.
    - opgave: |-
        een foutenmarge van 2 procentpunt wilt voor een proportie? Hoeveel personen heb je minstens nodig?
      antwoord: |-
        2401
      uitwerking: |-
        $1{,}96\sqrt{\frac{0{,}25}{n}} \leqslant 0{,}02 \iff \sqrt n \geqslant 49 \iff n \geqslant 2401$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h4-voorwaarde
  soort: kort
  opgave: |-
    Mag je hier de formule voor een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor een proportie gebruiken? Bereken het interval als het mag.
  lijst: enumerate
  delen:
    - opgave: |-
        In een aselecte steekproef van 50 leerlingen zijn er 3 linkshandig.
      antwoord: |-
        nee: $n\hat{p} = 3 < 5$
      uitwerking: |-
        $\hat{p} = 0{,}06$ en $n\hat{p} = 3 < 5$: de normale benadering is niet bruikbaar. De formule zou $[-0{,}006;\ 0{,}126]$ geven, met een negatieve ondergrens.
    - opgave: |-
        In een aselecte steekproef van 200 leerlingen zijn er 12 linkshandig.
      antwoord: |-
        ja: $[0{,}027;\ 0{,}093]$
      uitwerking: |-
        $n\hat{p} = 12 \geqslant 5$ en $n(1 - \hat{p}) = 188 \geqslant 5$. Met $\hat{p} = 0{,}06$ is $E = 1{,}96\sqrt{\frac{0{,}06 \cdot 0{,}94}{200}} \approx 0{,}033$: interval $[0{,}027;\ 0{,}093]$.
    - opgave: |-
        Op de website van een sportclub stemmen 5000 bezoekers; 3100 willen een nieuwe tribune.
      antwoord: |-
        nee: geen aselecte steekproef
      uitwerking: |-
        De aantallen zijn groot genoeg, maar de stemmers zijn vrijwilligers en bezoekers van de site: de steekproef is niet aselect. Een interval rond $\hat{p} = 0{,}62$ zegt niets betrouwbaars over alle supporters.

- id: h4-d1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: interval voor een proportie
  opgave: |-
    In een aselecte steekproef van $n$ personen hebben er $x$ een eigenschap. Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor $p$, met grenzen op drie decimalen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $n = 400$, $x = 100$
      antwoord: |-
        $[0{,}208;\ 0{,}292]$
      uitwerking: |-
        $\hat{p} = 0{,}25$, $E = 1{,}96\sqrt{\frac{0{,}25 \cdot 0{,}75}{400}} \approx 0{,}042$.
    - opgave: |-
        $n = 250$, $x = 150$
      antwoord: |-
        $[0{,}539;\ 0{,}661]$
      uitwerking: |-
        $\hat{p} = 0{,}6$, $E = 1{,}96\sqrt{\frac{0{,}6 \cdot 0{,}4}{250}} \approx 0{,}061$.
    - opgave: |-
        $n = 1000$, $x = 480$
      antwoord: |-
        $[0{,}449;\ 0{,}511]$
      uitwerking: |-
        $\hat{p} = 0{,}48$, $E = 1{,}96\sqrt{\frac{0{,}48 \cdot 0{,}52}{1000}} \approx 0{,}031$.
    - opgave: |-
        $n = 80$, $x = 20$
      antwoord: |-
        $[0{,}155;\ 0{,}345]$
      uitwerking: |-
        $\hat{p} = 0{,}25$, $E = 1{,}96\sqrt{\frac{0{,}25 \cdot 0{,}75}{80}} \approx 0{,}095$: veel breder dan in a, met dezelfde $\hat{p}$.
    - opgave: |-
        $n = 2500$, $x = 1750$
      antwoord: |-
        $[0{,}682;\ 0{,}718]$
      uitwerking: |-
        $\hat{p} = 0{,}7$, $E = 1{,}96\sqrt{\frac{0{,}7 \cdot 0{,}3}{2500}} \approx 0{,}018$.
    - opgave: |-
        $n = 150$, $x = 12$
      antwoord: |-
        $[0{,}037;\ 0{,}123]$
      uitwerking: |-
        $\hat{p} = 0{,}08$, $E = 1{,}96\sqrt{\frac{0{,}08 \cdot 0{,}92}{150}} \approx 0{,}043$.
    - opgave: |-
        $n = 600$, $x = 390$
      antwoord: |-
        $[0{,}612;\ 0{,}688]$
      uitwerking: |-
        $\hat{p} = 0{,}65$, $E = 1{,}96\sqrt{\frac{0{,}65 \cdot 0{,}35}{600}} \approx 0{,}038$.
    - opgave: |-
        $n = 50$, $x = 41$
      antwoord: |-
        $[0{,}714;\ 0{,}926]$
      uitwerking: |-
        $\hat{p} = 0{,}82$, $E = 1{,}96\sqrt{\frac{0{,}82 \cdot 0{,}18}{50}} \approx 0{,}106$.

- id: h4-o2
  soort: opdracht
  niveau: 1
  thema: |-
    interval voor een gemiddelde
  opgave: |-
    40 aselect gekozen appels wegen gemiddeld 182~g. De standaardafwijking van alle appels is 11~g. Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor het gemiddelde gewicht.
  antwoord: |-
    $[178{,}6;\ 185{,}4]$
  uitwerking: |-
    De foutenmarge is $E = 1{,}96 \cdot \frac{11}{\sqrt{40}} \approx 3{,}41$~g. Interval: $182 \pm 3{,}41$, dus $[178{,}6;\ 185{,}4]$~g. Met 95~\% betrouwbaarheid ligt het gemiddelde gewicht van alle appels tussen 178,6 en 185,4~g.

- id: h4-o11
  soort: opdracht
  niveau: 1
  thema: |-
    interpretatie: juist of fout
  opgave: |-
    Een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor het aandeel linkshandigen is $[0{,}09;\ 0{,}13]$. Juist of fout? Verbeter de foute uitspraken.
  lijst: enumerate
  delen:
    - opgave: |-
        Met 95~\% betrouwbaarheid is tussen 9~\% en 13~\% van alle mensen linkshandig.
      antwoord: |-
        juist
      uitwerking: |-
        Juist: zo formuleer je het besluit.
    - opgave: |-
        De kans dat $p$ tussen 0,09 en 0,13 ligt, is 95~\%.
      antwoord: |-
        fout
      uitwerking: |-
        Fout: $p$ ligt vast. De 95~\% is de kans dat de methode een interval geeft dat $p$ bevat, vóór je de steekproef trekt.
    - opgave: |-
        95~\% van alle steekproeven geeft een $\hat{p}$ tussen 0,09 en 0,13.
      antwoord: |-
        fout
      uitwerking: |-
        Fout: het interval is rond deze $\hat{p}$ gebouwd. Andere steekproeven geven andere intervallen; ongeveer 95~\% daarvan bevat $p$.
    - opgave: |-
        In de steekproef was $\hat{p} = 0{,}11$.
      antwoord: |-
        juist
      uitwerking: |-
        Juist: $\hat{p}$ ligt in het midden van het interval.
    - opgave: |-
        Een 99~\%-interval met dezelfde gegevens is smaller.
      antwoord: |-
        fout
      uitwerking: |-
        Fout: het is breder, want $z = 2{,}576$ in plaats van 1,96.
    - opgave: |-
        Met een vier keer zo grote steekproef wordt het interval ongeveer half zo breed.
      antwoord: |-
        juist
      uitwerking: |-
        Juist: $E$ bevat $\frac{1}{\sqrt n}$, en $\sqrt{4n} = 2\sqrt n$ (bij ongeveer dezelfde $\hat{p}$).

- id: h4-o9
  soort: opdracht
  niveau: 1
  thema: |-
    het betrouwbaarheidsniveau
  opgave: |-
    Van 400 aselect gekozen inwoners vindt 168 dat er te weinig groen is in hun buurt.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval.
      antwoord: |-
        $[0{,}372;\ 0{,}468]$
      uitwerking: |-
        $\hat{p} = \frac{168}{400} = 0{,}42$ en $E = 1{,}96\sqrt{\frac{0{,}42 \cdot 0{,}58}{400}} \approx 0{,}048$. Interval $[0{,}372;\ 0{,}468]$.
    - opgave: |-
        Bereken een 90~\%-interval.
      antwoord: |-
        $[0{,}379;\ 0{,}461]$
      uitwerking: |-
        $E = 1{,}645 \cdot 0{,}0247 \approx 0{,}041$. Interval $[0{,}379;\ 0{,}461]$.
    - opgave: |-
        Bereken een 99~\%-interval.
      antwoord: |-
        $[0{,}356;\ 0{,}484]$
      uitwerking: |-
        $E = 2{,}576 \cdot 0{,}0247 \approx 0{,}064$. Interval $[0{,}356;\ 0{,}484]$.
    - opgave: |-
        Kun je met 99~\% betrouwbaarheid zeggen dat minder dan de helft van de inwoners zo denkt?
      antwoord: |-
        ja
      uitwerking: |-
        Ja: zelfs het breedste interval, $[0{,}356;\ 0{,}484]$, ligt volledig onder 0,5.

- id: h4-d2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: interval voor een gemiddelde
  opgave: |-
    Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor $\mu$, met $\sigma$ gekend. Rond de grenzen af op één decimaal meer dan het gegeven gemiddelde.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\xbar = 50$, $\sigma = 10$, $n = 25$
      antwoord: |-
        $[46{,}1;\ 53{,}9]$
      uitwerking: |-
        $E = 1{,}96 \cdot \frac{10}{5} = 3{,}92$.
    - opgave: |-
        $\xbar = 120$, $\sigma = 15$, $n = 100$
      antwoord: |-
        $[117{,}1;\ 122{,}9]$
      uitwerking: |-
        $E = 1{,}96 \cdot \frac{15}{10} = 2{,}94$.
    - opgave: |-
        $\xbar = 3{,}2$, $\sigma = 0{,}8$, $n = 64$
      antwoord: |-
        $[3{,}00;\ 3{,}40]$
      uitwerking: |-
        $E = 1{,}96 \cdot \frac{0{,}8}{8} = 0{,}196$.
    - opgave: |-
        $\xbar = 75$, $\sigma = 12$, $n = 36$
      antwoord: |-
        $[71{,}1;\ 78{,}9]$
      uitwerking: |-
        $E = 1{,}96 \cdot \frac{12}{6} = 3{,}92$.
    - opgave: |-
        $\xbar = 250$, $\sigma = 4$, $n = 16$
      antwoord: |-
        $[248{,}0;\ 252{,}0]$
      uitwerking: |-
        $E = 1{,}96 \cdot \frac44 = 1{,}96$.
    - opgave: |-
        $\xbar = 18{,}5$, $\sigma = 2{,}5$, $n = 40$
      antwoord: |-
        $[17{,}73;\ 19{,}27]$
      uitwerking: |-
        $E = 1{,}96 \cdot \frac{2{,}5}{\sqrt{40}} \approx 0{,}775$.
    - opgave: |-
        $\xbar = 1000$, $\sigma = 50$, $n = 200$
      antwoord: |-
        $[993{,}1;\ 1006{,}9]$
      uitwerking: |-
        $E = 1{,}96 \cdot \frac{50}{\sqrt{200}} \approx 6{,}93$.
    - opgave: |-
        $\xbar = 6{,}4$, $\sigma = 1{,}1$, $n = 30$
      antwoord: |-
        $[6{,}01;\ 6{,}79]$
      uitwerking: |-
        $E = 1{,}96 \cdot \frac{1{,}1}{\sqrt{30}} \approx 0{,}394$.

- id: h4-o10
  soort: opdracht
  niveau: 1
  thema: |-
    een foutenmarge in de krant
  opgave: |-
    Een krant meldt: \textit{38~\% van de jongeren wil later in het buitenland werken (foutenmarge 3 procentpunt, betrouwbaarheid 95~\%)}.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef het betrouwbaarheidsinterval.
      antwoord: |-
        $[0{,}35;\ 0{,}41]$
      uitwerking: |-
        $0{,}38 \pm 0{,}03$: $[0{,}35;\ 0{,}41]$.
    - opgave: |-
        Ongeveer hoeveel jongeren werden ondervraagd?
      antwoord: |-
        ongeveer 1000
      uitwerking: |-
        Uit $1{,}96\sqrt{\frac{0{,}38 \cdot 0{,}62}{n}} = 0{,}03$ volgt $n = \frac{1{,}96^2 \cdot 0{,}38 \cdot 0{,}62}{0{,}03^2} \approx 1006$: ongeveer 1000 jongeren (de marge is afgerond).
    - opgave: |-
        Mag de krant schrijven: \textit{minder dan 4 op 10 jongeren wil in het buitenland werken}?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: het interval gaat tot 41~\%, dus ook iets meer dan 4 op 10 is verenigbaar met de peiling.

- id: h4-o1
  soort: opdracht
  niveau: 1
  thema: |-
    interval voor een proportie
  opgave: |-
    Een festival onderzoekt hoeveel bezoekers met de trein komen.
  lijst: enumerate
  delen:
    - opgave: |-
        Van 120 aselect gekozen bezoekers komt 54 met de trein. Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor het aandeel treinreizigers.
      antwoord: |-
        $[0{,}361;\ 0{,}539]$
      uitwerking: |-
        $\hat{p} = \frac{54}{120} = 0{,}45$ en $E = 1{,}96\sqrt{\frac{0{,}45 \cdot 0{,}55}{120}} \approx 0{,}089$. Interval $[0{,}361;\ 0{,}539]$.
    - opgave: |-
        Doe hetzelfde als er 540 van de 1200 met de trein kwamen. Vergelijk.
      antwoord: |-
        $[0{,}422;\ 0{,}478]$
      uitwerking: |-
        Weer $\hat{p} = 0{,}45$, maar $E = 1{,}96\sqrt{\frac{0{,}45 \cdot 0{,}55}{1200}} \approx 0{,}028$: interval $[0{,}422;\ 0{,}478]$. Tien keer zoveel bezoekers geeft een $\sqrt{10} \approx 3{,}2$ keer kleinere marge, geen tien keer kleinere.

- id: h4-o8
  soort: opdracht
  niveau: 1
  thema: |-
    intervallen aflezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=20cm,y=.5cm,font=\scriptsize]
        \foreach \t in {.34,.36,...,.55}{\draw[black!15] (\t,0) -- (\t,4.6);}
        \draw[grijs] (.32,0) -- (.56,0);
        \foreach \t/\l in {.34/{0,34},.38/{0,38},.42/{0,42},.46/{0,46},.50/{0,50},.54/{0,54}}{\draw[grijs] (\t,0) -- (\t,-.15) node[below,text=black] {\l};}
        \foreach \a/\b/\i/\n in {.370/.430/4/A,.352/.488/3/B,.359/.401/2/C,.343/.537/1/D}{\draw[accent,thick] (\a,\i) -- (\b,\i); \draw[accent] (\a,\i-.15) -- (\a,\i+.15) (\b,\i-.15) -- (\b,\i+.15); \fill[accent] ({(\a+\b)/2},\i) circle (1.3pt); \node[left] at (.32,\i) {\n};}
        \draw[fel!80!black,dashed] (.45,0) -- (.45,4.6);
      \end{tikzpicture}
  opgave: |-
    Vier peilingbureaus schatten het aandeel kiezers van een partij, telkens met een 95~\%-\hspace{0pt}interval. De stip is $\hat{p}$; de stippellijn staat bij 0,45.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees $\hat{p}$ en de foutenmarge af voor A en voor D.
      antwoord: |-
        A: 0,40 en 0,03; D: 0,44 en 0,097
      uitwerking: |-
        A loopt van 0,37 tot 0,43: $\hat{p} = 0{,}40$ en $E \approx 0{,}03$. D loopt van ongeveer 0,343 tot 0,537: $\hat{p} = 0{,}44$ en $E \approx 0{,}097$.
    - opgave: |-
        Welk bureau ondervroeg de meeste kiezers? Verklaar.
      antwoord: |-
        C
      uitwerking: |-
        C heeft het smalste interval. De $\hat{p}$'s verschillen weinig, dus de breedte hangt vooral af van $n$: het smalste interval hoort bij de grootste steekproef.
    - opgave: |-
        Hoeveel kiezers ondervroeg D ongeveer?
      antwoord: |-
        ongeveer 100
      uitwerking: |-
        $1{,}96\sqrt{\frac{0{,}44 \cdot 0{,}56}{n}} \approx 0{,}097$ geeft $n \approx \frac{1{,}96^2 \cdot 0{,}2464}{0{,}097^2} \approx 101$: ongeveer 100 kiezers.
    - opgave: |-
        Welke peilingen zijn verenigbaar met een aandeel van 45~\%?
      antwoord: |-
        B en D
      uitwerking: |-
        De intervallen die 0,45 bevatten: B en D. A en C liggen volledig links van de stippellijn. Dat de breedste intervallen 0,45 bevatten, is geen toeval: een breed interval sluit weinig uit.

- id: h4-o12
  soort: opdracht
  niveau: 1
  thema: |-
    context: broden
  opgave: |-
    Een bakkerij weegt 30 aselect gekozen broden. Ze wegen gemiddeld 796~g. De standaardafwijking van alle broden is 12~g.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor het gemiddelde gewicht van alle broden.
      antwoord: |-
        $[791{,}7;\ 800{,}3]$
      uitwerking: |-
        $E = 1{,}96 \cdot \frac{12}{\sqrt{30}} \approx 4{,}29$~g. Interval $[791{,}7;\ 800{,}3]$~g.
    - opgave: |-
        Op de verpakking staat 800~g. Bewijst de steekproef dat de broden gemiddeld te licht zijn?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: 800 ligt (net) in het interval, dus een gemiddelde van 800~g is verenigbaar met de steekproef. Om een kleine afwijking aan te tonen, moet de bakkerij meer broden wegen.

- id: h4-o3
  soort: opdracht
  niveau: 2
  thema: |-
    interpretatie
  opgave: |-
    Een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor de gemiddelde slaapduur van jongeren is $[7{,}08;\ 7{,}52]$ uur. Welke uitspraken zijn juist? Verbeter de foute.
  lijst: enumerate
  delen:
    - opgave: |-
        95~\% van de jongeren slaapt tussen 7,08 en 7,52 uur.
      antwoord: |-
        fout
      uitwerking: |-
        Fout: het interval gaat over het gemiddelde van alle jongeren, niet over individuele jongeren, die veel meer verschillen: met $\sigma = 0{,}9$ uur slaapt het middelste 95~\% ongeveer tussen 5,5 en 9,1 uur.
    - opgave: |-
        De methode geeft intervallen die in 95~\% van de steekproeven het echte gemiddelde bevatten.
      antwoord: |-
        juist
      uitwerking: |-
        Juist: dat is de betekenis van het betrouwbaarheidsniveau.
    - opgave: |-
        Het steekproefgemiddelde was 7,3 uur.
      antwoord: |-
        juist
      uitwerking: |-
        Juist: het midden van het interval, $\frac{7{,}08 + 7{,}52}{2} = 7{,}3$.

- id: h4-d3
  soort: opdracht
  niveau: 2
  thema: |-
    drill: benodigde steekproefgrootte
  opgave: |-
    Hoe groot moet $n$ minstens zijn? Rond naar boven af.
  lijst: enumerate
  delen:
    - opgave: |-
        Een proportie, marge 5 procentpunt, 95~\%, zonder voorkennis.
      antwoord: |-
        385
      uitwerking: |-
        $n \geqslant \frac{1{,}96^2 \cdot 0{,}25}{0{,}05^2} = 384{,}16$: 385.
    - opgave: |-
        Een proportie, marge 1 procentpunt, 95~\%, zonder voorkennis.
      antwoord: |-
        9604
      uitwerking: |-
        $n \geqslant \frac{1{,}96^2 \cdot 0{,}25}{0{,}01^2} = 9604$. Vijf keer zo nauwkeurig kost 25 keer zoveel personen.
    - opgave: |-
        Een proportie van ongeveer 10~\%, marge 3 procentpunt, 95~\%.
      antwoord: |-
        385
      uitwerking: |-
        $n \geqslant \frac{1{,}96^2 \cdot 0{,}1 \cdot 0{,}9}{0{,}03^2} = 384{,}16$: 385.
    - opgave: |-
        Een proportie, marge 3 procentpunt, 99~\%, zonder voorkennis.
      antwoord: |-
        1844
      uitwerking: |-
        $n \geqslant \frac{2{,}576^2 \cdot 0{,}25}{0{,}03^2} \approx 1843{,}3$: 1844.
    - opgave: |-
        Een proportie, marge 3 procentpunt, 90~\%, zonder voorkennis.
      antwoord: |-
        752
      uitwerking: |-
        $n \geqslant \frac{1{,}645^2 \cdot 0{,}25}{0{,}03^2} \approx 751{,}7$: 752.
    - opgave: |-
        Een gemiddelde, $\sigma = 10$, marge 2, 95~\%.
      antwoord: |-
        97
      uitwerking: |-
        $\sqrt n \geqslant \frac{1{,}96 \cdot 10}{2} = 9{,}8$, dus $n \geqslant 96{,}04$: 97.
    - opgave: |-
        Een gemiddelde, $\sigma = 10$, marge 1, 95~\%.
      antwoord: |-
        385
      uitwerking: |-
        $\sqrt n \geqslant 19{,}6$, dus $n \geqslant 384{,}16$: 385. De marge halveren kost ongeveer vier keer zoveel waarnemingen.
    - opgave: |-
        Een gemiddelde, $\sigma = 3$, marge 0,5, 95~\%.
      antwoord: |-
        139
      uitwerking: |-
        $\sqrt n \geqslant \frac{1{,}96 \cdot 3}{0{,}5} = 11{,}76$, dus $n \geqslant 138{,}3$: 139.

- id: h4-o15
  soort: opdracht
  niveau: 2
  thema: |-
    context: twee groepen
  opgave: |-
    Een gemeente vraagt of de inwoners een nieuw skatepark willen. Van 300 aselect gekozen jongeren is 162 voor, van 500 aselect gekozen volwassenen 205.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken voor elke groep een 95~\%-\hspace{0pt}betrouwbaarheidsinterval.
      antwoord: |-
        $[0{,}484;\ 0{,}596]$; \ $[0{,}367;\ 0{,}453]$
      uitwerking: |-
        Jongeren: $\hat{p} = 0{,}54$, $E = 1{,}96\sqrt{\frac{0{,}54 \cdot 0{,}46}{300}} \approx 0{,}056$, interval $[0{,}484;\ 0{,}596]$. Volwassenen: $\hat{p} = 0{,}41$, $E = 1{,}96\sqrt{\frac{0{,}41 \cdot 0{,}59}{500}} \approx 0{,}043$, interval $[0{,}367;\ 0{,}453]$.
    - opgave: |-
        Mag je besluiten dat jongeren vaker voor zijn?
      antwoord: |-
        ja
      uitwerking: |-
        De intervallen overlappen niet: zelfs de kleinste waarde voor de jongeren (0,484) ligt boven de grootste voor de volwassenen (0,453). Het verschil is dus geen toeval van de steekproef.
    - opgave: |-
        Mag je besluiten dat een meerderheid van de jongeren voor is?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: het interval van de jongeren bevat ook waarden onder 0,5.

- id: h4-o13
  soort: opdracht
  niveau: 2
  thema: |-
    Waar zit de fout?
  opgave: |-
    Waar zit de fout? Verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        64 leerlingen halen gemiddeld 72 op een toets met $\sigma = 8$. Rik berekent $E = 1{,}96 \cdot 8$ en vindt 15,7.
      antwoord: |-
        $E = 1{,}96 \cdot \frac{8}{8} = 1{,}96$
      uitwerking: |-
        Hij vergeet te delen door $\sqrt n$: de marge gaat over het gemiddelde, niet over één leerling. Juist: $E = 1{,}96 \cdot \frac{8}{\sqrt{64}} = 1{,}96$, interval $[70{,}04;\ 73{,}96]$.
    - opgave: |-
        Elise: \textit{verdubbel je de steekproef, dan halveert de foutenmarge}.
      antwoord: |-
        factor $\frac{1}{\sqrt2} \approx 0{,}71$
      uitwerking: |-
        De marge bevat $\frac{1}{\sqrt n}$: verdubbelen maakt ze $\frac{1}{\sqrt2} \approx 0{,}71$ keer zo groot. Halveren vraagt vier keer zoveel waarnemingen.
    - opgave: |-
        Voor een 99~\%-interval gebruikt Wout $z = 1{,}96$.
      antwoord: |-
        $z = 2{,}576$
      uitwerking: |-
        1,96 hoort bij 95~\%. Voor 99~\% is $z = 2{,}576$, want er moet 0,5~\% in elke staart liggen.
    - opgave: |-
        Het peilingbureau vindt $n \geqslant 1067{,}1$ en ondervraagt 1067 personen.
      antwoord: |-
        1068
      uitwerking: |-
        Met 1067 personen is de marge net groter dan gevraagd. Bij een minimum rond je altijd naar boven af: 1068.
    - opgave: |-
        Een school schrijft: \textit{met 95~\% betrouwbaarheid slaapt een leerling tussen 7,1 en 7,5 uur}.
      antwoord: |-
        het gaat over het gemiddelde
      uitwerking: |-
        Het interval gaat over het gemiddelde van alle leerlingen, niet over één leerling. Juist: \textit{met 95~\% betrouwbaarheid ligt de gemiddelde slaapduur tussen 7,1 en 7,5 uur}.

- id: h4-o19
  soort: opdracht
  niveau: 2
  thema: |-
    context: een busrit
  opgave: |-
    Volgens de dienstregeling duurt een busrit gemiddeld 25 minuten. Een reiziger noteert de duur van 40 ritten: gemiddeld 26,3 minuten. Uit vroegere metingen is $\sigma = 3{,}5$ minuten.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor de gemiddelde ritduur.
      antwoord: |-
        $[25{,}2;\ 27{,}4]$
      uitwerking: |-
        $E = 1{,}96 \cdot \frac{3{,}5}{\sqrt{40}} \approx 1{,}08$. Interval $[25{,}2;\ 27{,}4]$ minuten.
    - opgave: |-
        Klopt de dienstregeling? Verklaar met het interval.
      antwoord: |-
        waarschijnlijk niet
      uitwerking: |-
        25 ligt buiten het interval: een gemiddelde van 25 minuten is niet verenigbaar met de metingen. Een tweezijdige toets van $H_0\colon \mu = 25$ bij $\alpha = 0{,}05$ zou $H_0$ verwerpen.
    - opgave: |-
        Waarom moet de reiziger opletten met hoe hij de 40 ritten kiest?
      antwoord: |-
        anders geen aselecte steekproef
      uitwerking: |-
        Neemt hij alleen ritten in de ochtendspits, dan zijn ze waarschijnlijk trager dan gemiddeld. De formule geldt alleen voor een aselecte steekproef van alle ritten.

- id: h4-o14
  soort: opdracht
  niveau: 2
  thema: |-
    context: een precisieweegschaal
  opgave: |-
    Een juwelier weegt een gouden ring 8 keer op een weegschaal waarvan de metingen een standaardafwijking van 0,05~g hebben. Het gemiddelde is 4,612~g.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor de echte massa.
      antwoord: |-
        $[4{,}577;\ 4{,}647]$
      uitwerking: |-
        $E = 1{,}96 \cdot \frac{0{,}05}{\sqrt8} \approx 0{,}035$. Interval $[4{,}577;\ 4{,}647]$~g.
    - opgave: |-
        Waarom weegt hij meerdere keren in plaats van één keer?
      antwoord: |-
        het gemiddelde schommelt minder
      uitwerking: |-
        Eén meting heeft een marge van $1{,}96 \cdot 0{,}05 \approx 0{,}098$~g. Het gemiddelde van 8 metingen heeft een $\sqrt8 \approx 2{,}8$ keer kleinere marge.
    - opgave: |-
        Hoeveel keer moet hij wegen voor een foutenmarge van hoogstens 0,01~g?
      antwoord: |-
        97
      uitwerking: |-
        $1{,}96 \cdot \frac{0{,}05}{\sqrt n} \leqslant 0{,}01 \iff \sqrt n \geqslant 9{,}8 \iff n \geqslant 96{,}04$: 97 keer. In de praktijk koopt hij beter een nauwkeuriger weegschaal.

- id: h4-o4
  soort: opdracht
  niveau: 2
  thema: |-
    peilingen vergelijken
  opgave: |-
    Partij A haalt 21~\% in een peiling bij 1000 kiezers, een maand later 23~\%. Een krant schrijft: \textit{Partij A wint 2 procent}. Bereken de foutenmarges en bespreek de kop.
  antwoord: |-
    marges $\approx 2{,}5$ en $2{,}6$ procentpunt: geen duidelijke winst
  uitwerking: |-
    $E_1 = 1{,}96\sqrt{\frac{0{,}21 \cdot 0{,}79}{1000}} \approx 0{,}025$ en $E_2 = 1{,}96\sqrt{\frac{0{,}23 \cdot 0{,}77}{1000}} \approx 0{,}026$. De intervallen $[18{,}5;\ 23{,}5]$ en $[20{,}4;\ 25{,}6]$ (in procent) overlappen sterk: de stijging kan toeval zijn. Bovendien is het 2 procentpunt, geen 2~\%: van 21 naar 23 is een stijging met ongeveer 10~\%.

- id: h4-o16
  soort: opdracht
  niveau: 2
  thema: |-
    een simulatie van intervallen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.2cm,font=\scriptsize]
        \draw[grijs] (42,0) -- (60,0);
        \foreach \t in {42,46,50,54,58}{\draw[grijs] (\t,0) -- (\t,-.5) node[below,text=black] {\t};}
        \draw[fel!80!black,dashed] (50,0) -- (50,21) node[above,text=black] {$\mu$};
        \foreach \m/\i in {47.55/1,50.76/2,51.99/3,48.97/4,47.34/5,49.87/6,50.96/7,52.2/8,47.57/9,47.41/10,51.41/11,50.95/12,53.07/13,51.96/14,49.8/15,49.45/16,55.14/17,49.42/18,48.43/19,47.72/20}{\draw[accent,thick] (\m-3.92,\i) -- (\m+3.92,\i); \fill[accent] (\m,\i) circle (1pt);}
      \end{tikzpicture}
  opgave: |-
    De computer trok 20 aselecte steekproeven van 25 waarden uit een populatie met $\mu = 50$ en $\sigma = 10$, en berekende telkens een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor $\mu$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel intervallen bevatten $\mu$ niet? Klopt dat met wat je verwacht?
      antwoord: |-
        1; ja
      uitwerking: |-
        Alleen het 17de interval (rond 55,1) ligt volledig rechts van 50. Verwacht: $20 \cdot 0{,}05 = 1$.
    - opgave: |-
        Waarom zijn alle intervallen even breed? Bereken die breedte.
      antwoord: |-
        $E$ hangt niet af van de steekproef; breedte 7,84
      uitwerking: |-
        $E = 1{,}96 \cdot \frac{10}{\sqrt{25}} = 3{,}92$ hangt alleen van $\sigma$ en $n$ af, niet van de steekproef. Alleen het midden $\xbar$ schommelt. De breedte is $2 \cdot 3{,}92 = 7{,}84$. Bij een proportie hangt $E$ wel van $\hat{p}$ af, zodat de intervallen daar iets verschillen in breedte.
    - opgave: |-
        Hoe zou de figuur eruitzien met steekproeven van 100 waarden?
      antwoord: |-
        half zo brede intervallen, dichter bij 50
      uitwerking: |-
        De intervallen worden half zo breed ($E = 1{,}96$) en de middens liggen dichter bij 50. Er missen er nog altijd ongeveer 5~\%.

- id: h4-o5
  soort: opdracht
  niveau: 2
  thema: |-
    benodigde steekproefgrootte voor een gemiddelde
  opgave: |-
    Een onderzoeker wil een gemiddelde schatten tot op 1 eenheid nauwkeurig (foutenmarge 1) bij 95~\% betrouwbaarheid. De standaardafwijking is 8. Hoeveel waarnemingen heeft hij nodig?
  antwoord: |-
    246
  uitwerking: |-
    Los de ongelijkheid op naar $n$: $1{,}96 \cdot \frac{8}{\sqrt n} \leqslant 1 \iff \sqrt n \geqslant 15{,}68 \iff n \geqslant 245{,}9$. Naar boven afronden: 246 waarnemingen.

- id: h4-o17
  soort: opdracht
  niveau: 2
  thema: |-
    context: een belofte nagaan
  opgave: |-
    Een leverancier belooft dat hoogstens 2~\% van zijn led-lampen defect is. Een winkel test 500 aselect gekozen lampen: 17 zijn defect.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor het aandeel defecte lampen.
      antwoord: |-
        $[0{,}018;\ 0{,}050]$
      uitwerking: |-
        $\hat{p} = \frac{17}{500} = 0{,}034$ en $E = 1{,}96\sqrt{\frac{0{,}034 \cdot 0{,}966}{500}} \approx 0{,}016$. Interval $[0{,}018;\ 0{,}050]$.
    - opgave: |-
        Kan de winkel met dit interval aantonen dat de belofte niet klopt?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: 0,02 ligt (net) in het interval, dus 2~\% defect is verenigbaar met de steekproef. Wel is het interval vooral boven 2~\% gelegen: de winkel kan beter meer lampen testen.
    - opgave: |-
        Waarom is de formule hier minder betrouwbaar dan bij een peiling met $\hat{p} = 0{,}4$?
      antwoord: |-
        weinig successen: de normale benadering is ruwer
      uitwerking: |-
        De formule steunt op de normale benadering van $\hat{p}$. Met maar 17 defecte lampen is de binomiale verdeling nog wat scheef, zodat de 95~\% maar bij benadering klopt. (Vuistregel: minstens 10 successen en 10 mislukkingen; dat is hier nog net in orde.)

- id: h4-o18
  soort: opdracht
  niveau: 2
  thema: |-
    context: wat nauwkeurigheid kost
  opgave: |-
    Een peilingbureau rekent 8~euro per ondervraagde persoon. Een krant wil het aandeel voorstanders van een plan kennen bij 95~\% betrouwbaarheid.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel kost een peiling met een foutenmarge van 3 procentpunt?
      antwoord: |-
        1068 personen, 8544 euro
      uitwerking: |-
        $n \geqslant \frac{1{,}96^2 \cdot 0{,}25}{0{,}03^2} \approx 1067{,}1$: 1068 personen, dus $1068 \cdot 8 = 8544$ euro.
    - opgave: |-
        En met een marge van 1,5 procentpunt?
      antwoord: |-
        4269 personen, 34\,152 euro
      uitwerking: |-
        $n \geqslant \frac{1{,}96^2 \cdot 0{,}25}{0{,}015^2} \approx 4268{,}4$: 4269 personen, dus 34\,152 euro.
    - opgave: |-
        De krant wil de marge halveren voor het dubbele budget. Lukt dat?
      antwoord: |-
        nee: het kost vier keer zoveel
      uitwerking: |-
        Nee: de marge halveren vraagt vier keer zoveel personen, dus ongeveer vier keer het budget. Met het dubbele budget (2136 personen) wordt de marge $\frac{0{,}03}{\sqrt2} \approx 0{,}021$: 2,1 procentpunt.

- id: h4-o6
  soort: opdracht
  niveau: 2
  thema: |-
    interval en toets
  opgave: |-
    Een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor een proportie is $[0{,}48;\ 0{,}56]$. Zou een tweezijdige toets van $H_0\colon p = 0{,}5$ bij $\alpha = 0{,}05$ de nulhypothese verwerpen? En van $H_0\colon p = 0{,}45$? Verklaar met het interval.
  antwoord: |-
    0,5 niet verwerpen; 0,45 wel
  uitwerking: |-
    0,5 ligt in het interval: de steekproef is verenigbaar met $p = 0{,}5$, dus niet verwerpen. 0,45 ligt erbuiten: verwerpen. Bij benadering geldt: een tweezijdige toets bij 5~\% verwerpt precies de waarden buiten het 95~\%-interval, want beide gebruiken dezelfde 1,96 standaardafwijkingen.

- id: h4-o20
  soort: opdracht
  niveau: 3
  thema: |-
    waarom het interval werkt
  opgave: |-
    Neem een aselecte steekproef van $n$ waarden uit een populatie met gekende $\sigma$, en stel $E = 1{,}96\frac{\sigma}{\sqrt n}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $P(\mu - E \leqslant \overline{X} \leqslant \mu + E) \approx 0{,}95$.
      antwoord: |-
        met $Z = \frac{\overline{X} - \mu}{\sigma / \sqrt n}$
      uitwerking: |-
        $\overline{X}$ is (bij benadering) normaal met gemiddelde $\mu$ en standaardafwijking $\frac{\sigma}{\sqrt n}$. Standaardiseren geeft
        \[ P(\mu - E \leqslant \overline{X} \leqslant \mu + E) = P(-1{,}96 \leqslant Z \leqslant 1{,}96) \approx 0{,}95. \]
    - opgave: |-
        Toon aan dat $\mu - E \leqslant \xbar \leqslant \mu + E \iff \xbar - E \leqslant \mu \leqslant \xbar + E$.
      antwoord: |-
        ongelijkheden herschikken
      uitwerking: |-
        $\mu - E \leqslant \xbar \iff \mu \leqslant \xbar + E$, en $\xbar \leqslant \mu + E \iff \xbar - E \leqslant \mu$. Beide samen: $\xbar - E \leqslant \mu \leqslant \xbar + E$.
    - opgave: |-
        Leg uit wat a en b samen betekenen, en waarom je daarna toch niet mag zeggen dat $\mu$ met kans 95~\% in het berekende interval ligt.
      antwoord: |-
        de kans gaat over $\overline{X}$, niet over $\mu$
      uitwerking: |-
        Samen: met kans 0,95 levert de steekproef een interval $[\overline{X} - E;\ \overline{X} + E]$ dat $\mu$ bevat. Het toeval zit in $\overline{X}$. Na de steekproef is $\xbar$ een vast getal en ook $\mu$ ligt vast: het interval bevat $\mu$ of niet, er is geen toeval meer.

- id: h4-o23
  soort: opdracht
  niveau: 3
  thema: |-
    wanneer de formule faalt
  opgave: |-
    Een zeldzame eigenschap komt voor bij 5~\% van de bevolking. Een leerling neemt een aselecte steekproef van 20 personen en berekent een 95~\%-\hspace{0pt}interval met de formule.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de kans dat niemand in de steekproef de eigenschap heeft?
      antwoord: |-
        $\approx 0{,}358$
      uitwerking: |-
        $P(X = 0) = 0{,}95^{20} \approx 0{,}358$.
    - opgave: |-
        Welk interval geeft de formule dan? Bevat het $p$?
      antwoord: |-
        $[0;\ 0]$; nee
      uitwerking: |-
        $\hat{p} = 0$, dus $E = 1{,}96\sqrt{\frac{0 \cdot 1}{20}} = 0$: het interval is $[0;\ 0]$, en bevat $p = 0{,}05$ niet.
    - opgave: |-
        Wat besluit je over het betrouwbaarheidsniveau van de methode in deze situatie?
      antwoord: |-
        veel lager dan 95~\%
      uitwerking: |-
        In ruim 35~\% van de steekproeven mist het interval $p$ al door dit ene geval: de methode haalt hier zeker geen 95~\%. De formule steunt op de normale benadering, die bij kleine $n$ en een $p$ dicht bij 0 of 1 slecht is. Neem een grotere steekproef (minstens 10 successen en 10 mislukkingen verwacht).

- id: h4-o21
  soort: opdracht
  niveau: 3
  thema: |-
    de vermelde foutenmarge
  opgave: |-
    Een peiling bij 1000 kiezers vermeldt één foutenmarge van \textit{3,1 procentpunt}, voor alle partijen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat 3,1 procentpunt de marge is voor een partij met 50~\%.
      antwoord: |-
        $1{,}96\sqrt{\frac{0{,}25}{1000}} \approx 0{,}031$
      uitwerking: |-
        $E = 1{,}96\sqrt{\frac{0{,}5 \cdot 0{,}5}{1000}} \approx 0{,}031$.
    - opgave: |-
        Bereken de echte marge voor een partij met 5~\%.
      antwoord: |-
        $\approx 1{,}4$ procentpunt
      uitwerking: |-
        $E = 1{,}96\sqrt{\frac{0{,}05 \cdot 0{,}95}{1000}} \approx 0{,}0135$: ongeveer 1,4 procentpunt.
    - opgave: |-
        Waarom vermelden peilingbureaus toch de 3,1? Is de marge van de kleine partij relatief klein?
      antwoord: |-
        het is het ongunstigste geval; relatief niet
      uitwerking: |-
        3,1 is de grootste marge, voor $\hat{p} = 0{,}5$: ze geldt dus zeker voor alle partijen. In procentpunt is de marge van de kleine partij kleiner, maar relatief niet: 1,4 op 5 is 27~\% van haar score, terwijl 3,1 op 50 maar 6~\% is.

- id: h4-o7
  soort: opdracht
  niveau: 3
  thema: |-
    simulatie interpreteren
  opgave: |-
    Een leerkracht laat 30 leerlingen elk een eigen aselecte steekproef trekken uit dezelfde populatie, en een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor $p$ berekenen. Hoeveel intervallen verwacht je die $p$ niet bevatten? Wat is de kans dat alle 30 intervallen $p$ bevatten?
  antwoord: |-
    $1{,}5$; \ $\approx 0{,}21$
  uitwerking: |-
    Elk interval mist $p$ met kans 0,05. Het aantal missers is binomiaal met $n = 30$ en $p = 0{,}05$: verwacht $30 \cdot 0{,}05 = 1{,}5$ intervallen. Alle 30 raak: $0{,}95^{30} \approx 0{,}21$ (als de steekproeven onafhankelijk zijn). Een klas waarin geen enkel interval mist, is dus eerder uitzondering dan regel.

- id: h4-o22
  soort: opdracht
  niveau: 3
  thema: |-
    $z$ bij elk betrouwbaarheidsniveau
  opgave: |-
    Bij een betrouwbaarheidsniveau van $1 - \alpha$ gebruik je in de formule het getal $z$ waarvoor $P(-z \leqslant Z \leqslant z) = 1 - \alpha$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $z = {}$\texttt{invNorm}$(1 - \frac{\alpha}{2})$, en controleer 1,96 en 2,576.
      antwoord: |-
        in elke staart $\frac{\alpha}{2}$
      uitwerking: |-
        Buiten $[-z, z]$ ligt $\alpha$, door de symmetrie $\frac{\alpha}{2}$ in elke staart. Links van $z$ ligt dus $1 - \frac{\alpha}{2}$. Voor 95~\%: \texttt{invNorm(0.975,0,1)} $\approx 1{,}96$; voor 99~\%: \texttt{invNorm(0.995,0,1)} $\approx 2{,}576$.
    - opgave: |-
        Bepaal $z$ voor een 80~\%-interval, en het 80~\%-interval bij $\xbar = 50$, $\sigma = 10$ en $n = 25$.
      antwoord: |-
        $z \approx 1{,}28$; $[47{,}4;\ 52{,}6]$
      uitwerking: |-
        \texttt{invNorm(0.9,0,1)} $\approx 1{,}2816$. $E = 1{,}2816 \cdot 2 \approx 2{,}56$, interval $[47{,}4;\ 52{,}6]$.
    - opgave: |-
        Waarom bestaat er geen 100~\%-interval met een eindige breedte?
      antwoord: |-
        $z$ zou oneindig zijn
      uitwerking: |-
        Voor $1 - \alpha \to 1$ gaat $z \to +\infty$: de Gausskromme is nooit 0, dus elke eindige grens laat nog een kleine kans buiten. Volledige zekerheid vraagt een oneindig breed interval, en dat zegt niets.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h4-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Tweedegraadsfuncties
  thema: |-
    het ongunstigste geval
  opgave: |-
    Toon aan dat $f(p) = p(1 - p)$ op $[0, 1]$ maximaal is voor $p = 0{,}5$, met maximum 0,25. Waarom gebruikt een peilingbureau dat maximum om de steekproefgrootte te bepalen?
  antwoord: |-
    top van een bergparabool; de marge is dan het grootst
  uitwerking: |-
    $f(p) = -p^2 + p$ is een bergparabool met top bij $p = \frac{-1}{2 \cdot (-1)} = 0{,}5$ en $f(0{,}5) = 0{,}25$. De foutenmarge is het grootst als $p(1 - p)$ het grootst is. Wie met 0,25 rekent, haalt de gewenste marge zeker, welke $p$ het ook is.

- id: h4-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: Kansrekenen
  thema: |-
    hoeveel intervallen missen
  opgave: |-
    Een onderzoeksbureau publiceert per jaar 40 peilingen met een 95~\%-interval. Het aantal intervallen dat de echte waarde mist, is binomiaal verdeeld. Bereken de verwachtingswaarde, en de kans dat meer dan 4 intervallen missen.
  antwoord: |-
    2; \ $\approx 0{,}048$
  uitwerking: |-
    $X \sim B(40;\, 0{,}05)$: $\E(X) = 2$. $P(X > 4) = 1 - P(X \leqslant 4) \approx 0{,}048$.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h4-t1
  soort: test
  niveau: 1
  thema: |-
    interval voor een proportie
  opgave: |-
    Van 500 aselect gekozen inwoners fietst 130 naar het werk. Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor het aandeel van alle inwoners.
  antwoord: |-
    $[0{,}222;\ 0{,}298]$
  uitwerking: |-
    $\hat{p} = 0{,}26$, $E = 1{,}96\sqrt{\frac{0{,}26 \cdot 0{,}74}{500}} \approx 0{,}038$. Interval $[0{,}222;\ 0{,}298]$.

- id: h4-t2
  soort: test
  niveau: 1
  thema: |-
    interval voor een gemiddelde
  opgave: |-
    64 aselect gekozen jongeren slapen gemiddeld 7,3 uur, met $\sigma = 0{,}9$ uur. Bereken een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor de gemiddelde slaapduur.
  antwoord: |-
    $[7{,}08;\ 7{,}52]$
  uitwerking: |-
    $E = 1{,}96 \cdot \frac{0{,}9}{8} \approx 0{,}22$. Interval $[7{,}08;\ 7{,}52]$ uur.

- id: h4-t3
  soort: test
  niveau: 2
  thema: |-
    steekproefgrootte
  opgave: |-
    Hoeveel personen moet je ondervragen om een aandeel te schatten met een foutenmarge van hoogstens 4 procentpunt, bij 95~\% betrouwbaarheid?
  antwoord: |-
    601
  uitwerking: |-
    $1{,}96\sqrt{\frac{0{,}25}{n}} \leqslant 0{,}04 \iff \sqrt n \geqslant 24{,}5 \iff n \geqslant 600{,}25$: dus 601.

- id: h4-t4
  soort: test
  niveau: 1
  thema: |-
    interpretatie
  opgave: |-
    Een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor het aandeel jongeren met een bijbaan is $[0{,}31;\ 0{,}37]$. Wat betekent \textit{95~\%} hier? Waarom is \textit{de kans dat $p$ tussen 0,31 en 0,37 ligt, is 95~\%} fout?
  antwoord: |-
    95~\% van zulke intervallen bevat $p$; $p$ ligt vast
  uitwerking: |-
    Van alle intervallen die je op deze manier uit aselecte steekproeven berekent, bevat ongeveer 95~\% de echte $p$. De uitspraak is fout omdat $p$ vastligt: dit ene interval bevat $p$ of niet. Het toeval zit in de steekproef, niet in $p$.

- id: h4-t5
  soort: test
  niveau: 1
  thema: |-
    een ander betrouwbaarheidsniveau
  opgave: |-
    Van 400 aselect gekozen klanten betaalt 144 contactloos met hun gsm. Bereken een 99~\%-\hspace{0pt}betrouwbaarheidsinterval voor het aandeel van alle klanten.
  antwoord: |-
    $[0{,}298;\ 0{,}422]$
  uitwerking: |-
    $\hat{p} = \frac{144}{400} = 0{,}36$ en $E = 2{,}576\sqrt{\frac{0{,}36 \cdot 0{,}64}{400}} \approx 0{,}062$. Interval $[0{,}298;\ 0{,}422]$.

- id: h4-t6
  soort: test
  niveau: 2
  thema: |-
    van interval naar gegevens
  opgave: |-
    Het interval $[62{,}04;\ 65{,}96]$ is een 95~\%-\hspace{0pt}betrouwbaarheidsinterval voor een gemiddelde, met $\sigma = 5$. Bereken het steekproefgemiddelde, de foutenmarge en de grootte van de steekproef.
  antwoord: |-
    $\xbar = 64$; $E = 1{,}96$; $n = 25$
  uitwerking: |-
    Het midden: $\xbar = 64$. De halve breedte: $E = 1{,}96$. Uit $1{,}96 \cdot \frac{5}{\sqrt n} = 1{,}96$ volgt $\sqrt n = 5$, dus $n = 25$.

- id: h4-t7
  soort: test
  niveau: 1
  thema: |-
    invloed van $n$
  opgave: |-
    Een peiling bij 400 personen heeft een foutenmarge van 4,9 procentpunt. Hoe groot wordt de marge bij 1600 personen, met ongeveer dezelfde $\hat{p}$? En bij 800?
  antwoord: |-
    $\approx 2{,}5$; $\approx 3{,}5$ procentpunt
  uitwerking: |-
    Vier keer zoveel personen halveert de marge: $\frac{4{,}9}{2} \approx 2{,}5$ procentpunt. Dubbel zoveel deelt ze door $\sqrt2$: $\frac{4{,}9}{\sqrt2} \approx 3{,}5$ procentpunt.
