- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    De Morgan
  opgave: |-
    Ontken: \textit{de film is lang of saai}.
  antwoord: |-
    de film is niet lang en niet saai
  uitwerking: |-
    $\niet(p \of q) \asa \niet p \en \niet q$: \textit{de film is niet lang en niet saai}.

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    omgekeerde en contrapositie
  opgave: |-
    Gegeven: \textit{als een getal deelbaar is door 6, dan is het deelbaar door 3}. Geef de omgekeerde en de contrapositie, en zeg of ze waar zijn.
  antwoord: |-
    omgekeerde vals (9); contrapositie waar
  uitwerking: |-
    Omgekeerde: \textit{als deelbaar door 3, dan door 6}: vals (9). Contrapositie: \textit{als niet deelbaar door 3, dan niet door 6}: waar.

- id: h1-t3
  soort: test
  niveau: 2
  thema: |-
    kwantoren ontkennen
  opgave: |-
    Ontken met kwantoren en in woorden: $\forall n \in \N\ \exists p\colon p$ is een priemgetal en $p > n$.
  antwoord: |-
    $\exists n\ \forall p\colon p$ is geen priemgetal of $p \leqslant n$
  uitwerking: |-
    $\exists n \in \N\ \forall p\colon p$ is geen priemgetal of $p \leqslant n$: \textit{er is een getal waarboven geen priemgetallen meer liggen}. (De oorspronkelijke uitspraak is waar: er zijn oneindig veel priemgetallen; zie hoofdstuk 2.)

- id: h1-t4
  soort: test
  niveau: 1
  thema: |-
    tegenvoorbeeld
  opgave: |-
    Weerleg: \textit{voor alle reële $x$ is $\frac{1}{x + 1} = \frac1x + 1$}.
  antwoord: |-
    bv. $x = 1$
  uitwerking: |-
    $x = 1$: $\frac12 \neq 2$.

- id: h1-t5
  soort: test
  niveau: 1
  thema: |-
    nodig, voldoende en equivalentie
  opgave: |-
    Gegeven: \textit{als een vierhoek een rechthoek is, dan zijn zijn diagonalen even lang}.
  lijst: enumerate
  delen:
    - opgave: |-
        Vul aan: een rechthoek zijn is een \ldots{} voorwaarde om even lange diagonalen te hebben, en even lange diagonalen hebben is een \ldots{} voorwaarde om een rechthoek te zijn.
      antwoord: |-
        voldoende; nodig
      uitwerking: |-
        Bij $p \dan q$ is $p$ voldoende voor $q$ en $q$ nodig voor $p$: een rechthoek zijn is voldoende, even lange diagonalen hebben is nodig.
    - opgave: |-
        Is de equivalentie \textit{een vierhoek is een rechthoek als en slechts als zijn diagonalen even lang zijn} waar? Verklaar.
      antwoord: |-
        vals
      uitwerking: |-
        Vals: de omgekeerde implicatie is vals. Een gelijkbenig trapezium dat geen rechthoek is, heeft ook even lange diagonalen.

- id: h1-t6
  soort: test
  niveau: 2
  thema: |-
    de volgorde van kwantoren
  opgave: |-
    Met $x, y \in \R$. Zeg in woorden wat er staat, en of het waar is.
  lijst: enumerate
  delen:
    - opgave: |-
        $\forall x\ \exists y\colon y < x$
      antwoord: |-
        waar
      uitwerking: |-
        Bij elk getal is er een kleiner getal. Waar: neem $y = x - 1$.
    - opgave: |-
        $\exists y\ \forall x\colon y < x$
      antwoord: |-
        vals
      uitwerking: |-
        Er is een getal dat kleiner is dan alle getallen. Vals: voor $x = y$ is $y < x$ vals, welke $y$ je ook kiest.

- id: h1-t7
  soort: test
  niveau: 1
  thema: |-
    waarheidswaarde van connectieven
  opgave: |-
    Neem $p$: \textit{7 is een priemgetal} en $q$: \textit{7 is even}. Is de uitspraak waar of vals?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $p \en q$
      antwoord: |-
        vals
      uitwerking: |-
        $p$ is waar, $q$ is vals: de conjunctie is vals.
    - opgave: |-
        $p \of q$
      antwoord: |-
        waar
      uitwerking: |-
        $p$ is waar: de disjunctie is waar.
    - opgave: |-
        $\niet p \of q$
      antwoord: |-
        vals
      uitwerking: |-
        $\niet p$ en $q$ zijn allebei vals.
    - opgave: |-
        $q \dan p$
      antwoord: |-
        waar
      uitwerking: |-
        $q$ is vals, dus de implicatie is waar.
    - opgave: |-
        $p \dan q$
      antwoord: |-
        vals
      uitwerking: |-
        $p$ waar en $q$ vals: de implicatie is vals.
    - opgave: |-
        $p \asa \niet q$
      antwoord: |-
        waar
      uitwerking: |-
        $p$ en $\niet q$ zijn allebei waar.
