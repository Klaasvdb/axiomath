- id: h3-t6
  soort: test
  niveau: 1
  thema: |-
    sommatieteken
  opgave: |-
    Schrijf uit en bereken $\displaystyle\sum_{k=1}^{5} (2k + 1)$. Schrijf $2 + 4 + 8 + \cdots + 256$ met het sommatieteken.
  antwoord: |-
    35; \ $\sum_{k=1}^{8} 2^k$
  uitwerking: |-
    $3 + 5 + 7 + 9 + 11 = 35$.\par
    De machten van 2, en $256 = 2^8$: $\displaystyle\sum_{k=1}^{8} 2^k$.

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    binomium uitwerken
  opgave: |-
    Werk uit: $(2x - 3)^3$.
  antwoord: |-
    $8x^3 - 36x^2 + 54x - 27$
  uitwerking: |-
    Rij 3 met $a = 2x$ en $b = -3$: $(2x)^3 - 3(2x)^2 \cdot 3 + 3(2x) \cdot 9 - 27 = 8x^3 - 36x^2 + 54x - 27$.

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    coëfficiënt van een macht
  opgave: |-
    Bepaal de coëfficiënt van $x^3$ in $(3 - x)^5$.
  antwoord: |-
    $-90$
  uitwerking: |-
    Algemene term $\binom5k 3^{5 - k}(-x)^k$. Met $k = 3$: $\binom53 \cdot 3^2 \cdot (-1)^3 = 10 \cdot 9 \cdot (-1) = -90$.

- id: h3-t3
  soort: test
  niveau: 2
  thema: |-
    term zonder x
  opgave: |-
    Bepaal de term zonder $x$ in $\Bigl(x + \dfrac3x\Bigr)^4$.
  antwoord: |-
    54
  uitwerking: |-
    Algemene term $\binom4k x^{4 - k}3^k x^{-k} = \binom4k 3^k x^{4 - 2k}$. Exponent 0 voor $k = 2$: $6 \cdot 9 = 54$.

- id: h3-t7
  soort: test
  niveau: 2
  thema: |-
    een parameter zoeken
  opgave: |-
    De coëfficiënt van $x^2$ in $(1 + ax)^5$ is 90. Bepaal $a$.
  antwoord: |-
    $a = 3$ of $a = -3$
  uitwerking: |-
    De coëfficiënt van $x^2$ is $\binom52 a^2 = 10a^2$. Uit $10a^2 = 90$ volgt $a^2 = 9$, dus $a = 3$ of $a = -3$.

- id: h3-t4
  soort: test
  niveau: 2
  thema: |-
    benaderen
  opgave: |-
    Benader $0{,}98^6$ met de eerste drie termen van het binomium.
  antwoord: |-
    $0{,}886$
  uitwerking: |-
    $(1 - 0{,}02)^6 \approx 1 - 6 \cdot 0{,}02 + 15 \cdot 0{,}0004 = 1 - 0{,}12 + 0{,}006 = 0{,}886$ (exact: $0{,}88584\ldots$).

- id: h3-t5
  soort: test
  niveau: 1
  thema: |-
    som van een rij en regel van Pascal
  opgave: |-
    Bereken $\displaystyle\sum_{k=0}^{7}\binom7k$ en $\binom94 + \binom95$ zonder rekentoestel.
  antwoord: |-
    128; \ 252
  uitwerking: |-
    De som van rij 7: $2^7 = 128$. Met de regel van Pascal: $\binom94 + \binom95 = \binom{10}{5} = 252$.
