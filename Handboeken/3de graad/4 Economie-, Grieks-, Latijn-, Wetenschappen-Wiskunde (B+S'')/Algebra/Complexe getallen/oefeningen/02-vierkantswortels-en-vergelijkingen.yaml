# Oefeningen van hoofdstuk 2. Zie oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken de discriminant van $3x^2 - 2x + 5 = 0$.
      antwoord: |-
        $-56$
      uitwerking: |-
        $D = (-2)^2 - 4 \cdot 3 \cdot 5 = 4 - 60 = -56$.
    - opgave: |-
        Los op in $\R$: $x^2 - 6x + 5 = 0$.
      antwoord: |-
        $x = 1$ of $x = 5$
      uitwerking: |-
        $D = 36 - 20 = 16$, dus $x = \frac{6 \pm 4}{2}$: $x = 1$ of $x = 5$.
    - opgave: |-
        Schrijf $x^2 + 6x + 13$ als een kwadraat plus een getal.
      antwoord: |-
        $(x + 3)^2 + 4$
      uitwerking: |-
        $(x + 3)^2 = x^2 + 6x + 9$, dus $x^2 + 6x + 13 = (x + 3)^2 + 4$.
    - opgave: |-
        Ontbind in factoren: $x^3 - 4x$.
      antwoord: |-
        $x(x - 2)(x + 2)$
      uitwerking: |-
        $x(x^2 - 4) = x(x - 2)(x + 2)$.
    - opgave: |-
        Bereken $(3 + 2i)^2$.
      antwoord: |-
        $5 + 12i$
      uitwerking: |-
        $9 + 12i + 4i^2 = 5 + 12i$.
    - opgave: |-
        Los op in $\R$: $x^4 - 5x^2 - 36 = 0$.
      antwoord: |-
        $x = 3$ of $x = -3$
      uitwerking: |-
        Stel $t = x^2$: $t^2 - 5t - 36 = 0$ geeft $t = 9$ of $t = -4$. Alleen $x^2 = 9$ heeft reële oplossingen: $x = \pm 3$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Je rekent nu in $\C$, waar $i^2 = -1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek twee complexe getallen $z$ met $z^2 = -9$.
      antwoord: |-
        $3i$ en $-3i$
      uitwerking: |-
        $(3i)^2 = 9i^2 = -9$ en $(-3i)^2 = 9i^2 = -9$.
    - opgave: |-
        Zoek twee complexe getallen $z$ met $z^2 = -7$.
      antwoord: |-
        $i\sqrt7$ en $-i\sqrt7$
      uitwerking: |-
        $\bigl(i\sqrt7\bigr)^2 = i^2 \cdot 7 = -7$, en ook $\bigl(-i\sqrt7\bigr)^2 = -7$.
    - opgave: |-
        Schrijf $x^2 + 6x + 13 = 0$ als $(x + 3)^2 = \ldots$ (zie de Opwarmer). Los de vergelijking op in $\C$ zoals in a.
      antwoord: |-
        $x = -3 + 2i$ of $x = -3 - 2i$
      uitwerking: |-
        $(x + 3)^2 + 4 = 0$, dus $(x + 3)^2 = -4$. Dan is $x + 3 = 2i$ of $x + 3 = -2i$, dus $x = -3 \pm 2i$.
    - opgave: |-
        Bereken de som en het product van de twee oplossingen uit c. Wat valt je op?
      antwoord: |-
        som $-6$, product $13$: de coëfficiënten, de som met het andere teken
      uitwerking: |-
        Som: $(-3 + 2i) + (-3 - 2i) = -6$. Product: $(-3)^2 + 2^2 = 13$. In $x^2 + 6x + 13$ staat $6$ (het tegengestelde van de som) en $13$ (het product).

- id: h2-wortel
  soort: kort
  opgave: |-
    Bepaal de vierkantswortels.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $-16$
      antwoord: |-
        $\pm 4i$
      uitwerking: |-
        $\pm i\sqrt{16} = \pm 4i$.
    - opgave: |-
        $-3$
      antwoord: |-
        $\pm i\sqrt3$
      uitwerking: |-
        $\pm i\sqrt3$.
    - opgave: |-
        $-50$
      antwoord: |-
        $\pm 5i\sqrt2$
      uitwerking: |-
        $\pm i\sqrt{50} = \pm i\sqrt{25 \cdot 2} = \pm 5i\sqrt2$.
    - opgave: |-
        $-\tfrac14$
      antwoord: |-
        $\pm \tfrac12 i$
      uitwerking: |-
        $\pm i\sqrt{\tfrac14} = \pm \tfrac12 i$.

- id: h2-vkv
  soort: kort
  opgave: |-
    Los op in $\C$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $z^2 + 25 = 0$
      antwoord: |-
        $\pm 5i$
      uitwerking: |-
        $z^2 = -25$, dus $z = \pm 5i$.
    - opgave: |-
        $z^2 - 2z + 10 = 0$
      antwoord: |-
        $1 \pm 3i$
      uitwerking: |-
        $D = 4 - 40 = -36$, dus $z = \frac{2 \pm 6i}{2} = 1 \pm 3i$.
    - opgave: |-
        $z^2 + 6z + 34 = 0$
      antwoord: |-
        $-3 \pm 5i$
      uitwerking: |-
        $D = 36 - 136 = -100$, dus $z = \frac{-6 \pm 10i}{2} = -3 \pm 5i$.
    - opgave: |-
        $z^2 + z + 1 = 0$
      antwoord: |-
        $-\tfrac12 \pm \tfrac{\sqrt3}{2} i$
      uitwerking: |-
        $D = 1 - 4 = -3$, dus $z = \frac{-1 \pm i\sqrt3}{2}$.
    - opgave: |-
        $3z^2 - 2z + 1 = 0$
      antwoord: |-
        $\tfrac13 \pm \tfrac{\sqrt2}{3} i$
      uitwerking: |-
        $D = 4 - 12 = -8$, met vierkantswortels $\pm 2i\sqrt2$. Dus $z = \frac{2 \pm 2i\sqrt2}{6} = \frac13 \pm \frac{\sqrt2}{3} i$.

- id: h2-opstellen
  soort: kort
  opgave: |-
    Los op.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel een tweedegraadsvergelijking met reële coëfficiënten op met oplossing $4i$.
      antwoord: |-
        $z^2 + 16 = 0$
      uitwerking: |-
        De andere oplossing is $-4i$. Som 0, product $16$: $z^2 + 16 = 0$.
    - opgave: |-
        Stel een tweedegraadsvergelijking met reële coëfficiënten op met oplossing $1 - 5i$.
      antwoord: |-
        $z^2 - 2z + 26 = 0$
      uitwerking: |-
        De andere oplossing is $1 + 5i$. Som 2, product $1 + 25 = 26$: $z^2 - 2z + 26 = 0$.
    - opgave: |-
        Ontbind in factoren van de eerste graad: $z^2 + 9$ \ en \ $z^2 - 4z + 5$.
      antwoord: |-
        $(z - 3i)(z + 3i)$; \ $(z - 2 - i)(z - 2 + i)$
      uitwerking: |-
        $z^2 + 9 = 0$ geeft $z = \pm 3i$, dus $z^2 + 9 = (z - 3i)(z + 3i)$. En $z^2 - 4z + 5 = 0$ heeft $D = -4$ en oplossingen $2 \pm i$, dus $z^2 - 4z + 5 = (z - 2 - i)(z - 2 + i)$.

- id: h2-hoger
  soort: kort
  opgave: |-
    Los op in $\C$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $z^3 + 9z = 0$
      antwoord: |-
        $0$, $\pm 3i$
      uitwerking: |-
        $z(z^2 + 9) = 0$, dus $z = 0$ of $z = \pm 3i$.
    - opgave: |-
        $z^4 - 16 = 0$
      antwoord: |-
        $\pm 2$, $\pm 2i$
      uitwerking: |-
        $(z^2 - 4)(z^2 + 4) = 0$, dus $z = \pm 2$ of $z = \pm 2i$.
    - opgave: |-
        $z^3 - 2z^2 + 5z = 0$
      antwoord: |-
        $0$, $1 \pm 2i$
      uitwerking: |-
        $z(z^2 - 2z + 5) = 0$. De tweede factor heeft $D = 4 - 20 = -16$, dus $z = 0$ of $z = \frac{2 \pm 4i}{2} = 1 \pm 2i$.

- id: h2-vw
  soort: kort
  opgave: |-
    Bepaal de vierkantswortels.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3 + 4i$
      antwoord: |-
        $\pm(2 + i)$
      uitwerking: |-
        $x^2 - y^2 = 3$, $x^2 + y^2 = 5$, $xy = 2$: $x^2 = 4$, $y^2 = 1$, zelfde teken. Dus $\pm(2 + i)$.
    - opgave: |-
        $-5 - 12i$
      antwoord: |-
        $\pm(2 - 3i)$
      uitwerking: |-
        $x^2 - y^2 = -5$, $x^2 + y^2 = 13$, $xy = -6$: $x^2 = 4$, $y^2 = 9$, verschillend teken. Dus $\pm(2 - 3i)$.
    - opgave: |-
        $2i$
      antwoord: |-
        $\pm(1 + i)$
      uitwerking: |-
        $x^2 - y^2 = 0$, $x^2 + y^2 = 2$, $xy = 1$: $x^2 = y^2 = 1$, zelfde teken. Dus $\pm(1 + i)$.

- id: h2-vkv2
  soort: kort
  opgave: |-
    Breng eerst alles naar één lid, en los op in $\C$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $z^2 = 2z - 5$
      antwoord: |-
        $1 \pm 2i$
      uitwerking: |-
        $z^2 - 2z + 5 = 0$. $D = 4 - 20 = -16$, dus $z = \frac{2 \pm 4i}{2} = 1 \pm 2i$.
    - opgave: |-
        $z(z + 4) = -8$
      antwoord: |-
        $-2 \pm 2i$
      uitwerking: |-
        $z^2 + 4z + 8 = 0$. $D = 16 - 32 = -16$, dus $z = \frac{-4 \pm 4i}{2} = -2 \pm 2i$.
    - opgave: |-
        $(z - 3)^2 + 16 = 0$
      antwoord: |-
        $3 \pm 4i$
      uitwerking: |-
        Uitwerken hoeft niet: $(z - 3)^2 = -16$, dus $z - 3 = \pm 4i$ en $z = 3 \pm 4i$.

- id: h2-somproduct
  soort: kort
  opgave: |-
    Bepaal de som en het product van de oplossingen, zonder de vergelijking op te lossen. Controleer bij a door op te lossen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $z^2 - 6z + 13 = 0$
      antwoord: |-
        som $6$, product $13$
      uitwerking: |-
        Som $-\frac{-6}{1} = 6$, product $\frac{13}{1} = 13$. Controle: $D = 36 - 52 = -16$, dus $z = 3 \pm 2i$, met som $6$ en product $3^2 + 2^2 = 13$.
    - opgave: |-
        $2z^2 + 3z + 5 = 0$
      antwoord: |-
        som $-\tfrac32$, product $\tfrac52$
      uitwerking: |-
        Som $-\frac{b}{a} = -\frac32$, product $\frac{c}{a} = \frac52$.
    - opgave: |-
        $4z^2 + 9 = 0$
      antwoord: |-
        som $0$, product $\tfrac94$
      uitwerking: |-
        $b = 0$: som $0$, product $\frac94$. (De oplossingen zijn $\pm\frac32 i$.)

- id: h2-hoger2
  soort: kort
  opgave: |-
    Ga na dat $r$ een oplossing is. Deel door $z - r$, bijvoorbeeld met de regel van Horner, en los op in $\C$.
  lijst: enumerate
  delen:
    - opgave: |-
        $z^3 - z^2 + 2 = 0$, \ $r = -1$
      antwoord: |-
        $-1$, $1 \pm i$
      uitwerking: |-
        $(-1)^3 - (-1)^2 + 2 = -1 - 1 + 2 = 0$. Delen geeft $z^3 - z^2 + 2 = (z + 1)(z^2 - 2z + 2)$. De tweede factor heeft $D = 4 - 8 = -4$, dus $z = -1$ of $z = \frac{2 \pm 2i}{2} = 1 \pm i$.
    - opgave: |-
        $z^3 - 6z^2 + 13z - 10 = 0$, \ $r = 2$
      antwoord: |-
        $2$, $2 \pm i$
      uitwerking: |-
        $8 - 24 + 26 - 10 = 0$. Delen geeft $z^3 - 6z^2 + 13z - 10 = (z - 2)(z^2 - 4z + 5)$. De tweede factor heeft $D = 16 - 20 = -4$, dus $z = 2$ of $z = \frac{4 \pm 2i}{2} = 2 \pm i$.

- id: h2-product0
  soort: kort
  opgave: |-
    Los op in $\C$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(z - 2i)(z + 1 + i) = 0$
      antwoord: |-
        $2i$, $-1 - i$
      uitwerking: |-
        $z - 2i = 0$ of $z + 1 + i = 0$, dus $z = 2i$ of $z = -1 - i$.
    - opgave: |-
        $z(3z + 6i) = 0$
      antwoord: |-
        $0$, $-2i$
      uitwerking: |-
        $z = 0$ of $3z = -6i$, dus $z = 0$ of $z = -2i$.
    - opgave: |-
        $(iz - 1)(2z + 4 - i) = 0$
      antwoord: |-
        $-i$, $-2 + \tfrac12 i$
      uitwerking: |-
        $iz = 1$ geeft $z = \dfrac{1}{i} = -i$. En $2z = -4 + i$ geeft $z = -2 + \tfrac12 i$.

- id: h2-conj
  soort: kort
  opgave: |-
    Gebruik de rekenregels voor de toegevoegde.
  lijst: enumerate
  delen:
    - opgave: |-
        Gegeven: $(3 + 2i)(1 - 4i) = 11 - 10i$. Bereken $(3 - 2i)(1 + 4i)$ zonder de haakjes uit te werken.
      antwoord: |-
        $11 + 10i$
      uitwerking: |-
        $3 - 2i$ en $1 + 4i$ zijn de toegevoegden van $3 + 2i$ en $1 - 4i$. Het product van de toegevoegden is de toegevoegde van het product: $\conj{11 - 10i} = 11 + 10i$.
    - opgave: |-
        Gegeven: $(1 + 2i)^3 = -11 - 2i$. Bereken $(1 - 2i)^3$.
      antwoord: |-
        $-11 + 2i$
      uitwerking: |-
        $(1 - 2i)^3 = \bigl(\conj{1 + 2i}\bigr)^3 = \conj{(1 + 2i)^3} = \conj{-11 - 2i} = -11 + 2i$.
    - opgave: |-
        Toon aan: $\conj{z - w} = \conj{z} - \conj{w}$.
      antwoord: |-
        zie de uitgewerkte oplossingen
      uitwerking: |-
        Neem $z = a + bi$ en $w = c + di$. Dan is $z - w = (a - c) + (b - d)i$, dus $\conj{z - w} = (a - c) - (b - d)i = (a - bi) - (c - di) = \conj{z} - \conj{w}$.

- id: h2-hoger3
  soort: kort
  opgave: |-
    Los op in $\C$.
  lijst: enumerate
  delen:
    - opgave: |-
        $z^4 + 3z^2 - 4 = 0$
      antwoord: |-
        $\pm 1$, $\pm 2i$
      uitwerking: |-
        Stel $t = z^2$: $t^2 + 3t - 4 = 0$, met $D = 9 + 16 = 25$, dus $t = \frac{-3 \pm 5}{2}$: $t = 1$ of $t = -4$. Dan is $z^2 = 1$ of $z^2 = -4$, dus $z = \pm 1$ of $z = \pm 2i$.
    - opgave: |-
        $z^3 + z^2 + 3z - 5 = 0$, als je weet dat $-1 + 2i$ een oplossing is
      antwoord: |-
        $-1 + 2i$, $-1 - 2i$, $1$
      uitwerking: |-
        De coëfficiënten zijn reëel, dus ook $-1 - 2i$ is een oplossing. Samen geven ze de factor $(z + 1 - 2i)(z + 1 + 2i) = (z + 1)^2 - (2i)^2 = z^2 + 2z + 5$. Dan is $z^3 + z^2 + 3z - 5 = (z^2 + 2z + 5)(z + c)$, en de constante termen geven $5c = -5$, dus $c = -1$. De oplossingen zijn $-1 + 2i$, $-1 - 2i$ en $1$. Controle: $(z^2 + 2z + 5)(z - 1) = z^3 + z^2 + 3z - 5$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    tweedegraadsvergelijkingen
  opgave: |-
    Los op in $\C$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $z^2 + 4z + 5 = 0$
      antwoord: |-
        $-2 \pm i$
      uitwerking: |-
        $D = 16 - 20 = -4$, dus $z = \frac{-4 \pm 2i}{2} = -2 \pm i$.
    - opgave: |-
        $4z^2 + 9 = 0$
      antwoord: |-
        $\pm \tfrac32 i$
      uitwerking: |-
        $z^2 = -\frac94$, dus $z = \pm \frac32 i$.
    - opgave: |-
        $z^2 - 8z + 25 = 0$
      antwoord: |-
        $4 \pm 3i$
      uitwerking: |-
        $D = 64 - 100 = -36$, dus $z = \frac{8 \pm 6i}{2} = 4 \pm 3i$.
    - opgave: |-
        $z^2 + 49 = 0$
      antwoord: |-
        $\pm 7i$
      uitwerking: |-
        $z^2 = -49$, dus $z = \pm 7i$.
    - opgave: |-
        $2z^2 - 6z + 5 = 0$
      antwoord: |-
        $\tfrac32 \pm \tfrac12 i$
      uitwerking: |-
        $D = 36 - 40 = -4$, dus $z = \frac{6 \pm 2i}{4} = \frac32 \pm \frac12 i$.
    - opgave: |-
        $z^2 - 3z + 4 = 0$
      antwoord: |-
        $\tfrac32 \pm \tfrac{\sqrt7}{2} i$
      uitwerking: |-
        $D = 9 - 16 = -7$, dus $z = \frac{3 \pm i\sqrt7}{2}$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    vierkantswortels van een negatief getal
  opgave: |-
    Bepaal de vierkantswortels.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $-36$
      antwoord: |-
        $\pm 6i$
      uitwerking: |-
        $\pm i\sqrt{36} = \pm 6i$.
    - opgave: |-
        $-20$
      antwoord: |-
        $\pm 2i\sqrt5$
      uitwerking: |-
        $\pm i\sqrt{20} = \pm i\sqrt{4 \cdot 5} = \pm 2i\sqrt5$.
    - opgave: |-
        $-\tfrac29$
      antwoord: |-
        $\pm \tfrac{\sqrt2}{3} i$
      uitwerking: |-
        $\pm i\sqrt{\tfrac29} = \pm \tfrac{\sqrt2}{3} i$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    aantal en soort oplossingen
  opgave: |-
    Bereken de discriminant. Zeg zonder op te lossen hoeveel oplossingen de vergelijking in $\C$ heeft, en of ze reëel zijn.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $z^2 + 2z - 3 = 0$
      antwoord: |-
        $D = 16$: twee reële
      uitwerking: |-
        $D = 4 + 12 = 16 > 0$: twee reële oplossingen.
    - opgave: |-
        $z^2 + 2z + 3 = 0$
      antwoord: |-
        $D = -8$: twee niet-reële, toegevoegd
      uitwerking: |-
        $D = 4 - 12 = -8 < 0$: twee niet-reële oplossingen, elkaars toegevoegde.
    - opgave: |-
        $9z^2 - 6z + 1 = 0$
      antwoord: |-
        $D = 0$: één reële
      uitwerking: |-
        $D = 36 - 36 = 0$: één reële oplossing.
    - opgave: |-
        $z^2 + 5 = 0$
      antwoord: |-
        $D = -20$: twee niet-reële, toegevoegd
      uitwerking: |-
        $D = 0 - 20 = -20 < 0$: twee niet-reële oplossingen, $\pm i\sqrt5$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    ontbinden in factoren
  opgave: |-
    Ontbind in factoren van de eerste graad.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $z^2 + 36$
      antwoord: |-
        $(z - 6i)(z + 6i)$
      uitwerking: |-
        De oplossingen van $z^2 + 36 = 0$ zijn $\pm 6i$.
    - opgave: |-
        $z^2 - 6z + 10$
      antwoord: |-
        $(z - 3 - i)(z - 3 + i)$
      uitwerking: |-
        $D = 36 - 40 = -4$, oplossingen $3 \pm i$.
    - opgave: |-
        $4z^2 + 1$
      antwoord: |-
        $(2z - i)(2z + i)$
      uitwerking: |-
        Oplossingen $\pm \frac12 i$, dus $4z^2 + 1 = 4\bigl(z - \frac12 i\bigr)\bigl(z + \frac12 i\bigr) = (2z - i)(2z + i)$.
    - opgave: |-
        $z^2 + 4z + 13$
      antwoord: |-
        $(z + 2 - 3i)(z + 2 + 3i)$
      uitwerking: |-
        $D = 16 - 52 = -36$, oplossingen $-2 \pm 3i$, dus $\bigl(z - (-2 + 3i)\bigr)\bigl(z - (-2 - 3i)\bigr) = (z + 2 - 3i)(z + 2 + 3i)$.
    - opgave: |-
        $z^3 + 25z$
      antwoord: |-
        $z(z - 5i)(z + 5i)$
      uitwerking: |-
        Zonder $z$ af: $z(z^2 + 25)$, en $z^2 + 25 = 0$ geeft $z = \pm 5i$. Dus $z^3 + 25z = z(z - 5i)(z + 5i)$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    een oplossing nagaan
  opgave: |-
    Ga na dat $1 + i\sqrt2$ een oplossing is van $z^2 - 2z + 3 = 0$. Geef zonder te rekenen de andere oplossing.
  antwoord: |-
    andere oplossing $1 - i\sqrt2$
  uitwerking: |-
    $\bigl(1 + i\sqrt2\bigr)^2 = 1 + 2i\sqrt2 - 2 = -1 + 2i\sqrt2$, dus $z^2 - 2z + 3 = -1 + 2i\sqrt2 - 2 - 2i\sqrt2 + 3 = 0$. De coëfficiënten zijn reëel, dus ook de toegevoegde $1 - i\sqrt2$ is een oplossing.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    vierkantswortels van een complex getal
  opgave: |-
    Bepaal de vierkantswortels.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $8 + 6i$
      antwoord: |-
        $\pm(3 + i)$
      uitwerking: |-
        $x^2 - y^2 = 8$, $x^2 + y^2 = 10$, $xy = 3$: $x^2 = 9$, $y^2 = 1$, zelfde teken: $\pm(3 + i)$.
    - opgave: |-
        $-3 + 4i$
      antwoord: |-
        $\pm(1 + 2i)$
      uitwerking: |-
        $x^2 - y^2 = -3$, $x^2 + y^2 = 5$, $xy = 2$: $x^2 = 1$, $y^2 = 4$, zelfde teken: $\pm(1 + 2i)$.
    - opgave: |-
        $-2i$
      antwoord: |-
        $\pm(1 - i)$
      uitwerking: |-
        $x^2 - y^2 = 0$, $x^2 + y^2 = 2$, $xy = -1$: $x^2 = y^2 = 1$, verschillend teken: $\pm(1 - i)$.
    - opgave: |-
        $-15 + 8i$
      antwoord: |-
        $\pm(1 + 4i)$
      uitwerking: |-
        $x^2 - y^2 = -15$, $x^2 + y^2 = 17$, $xy = 4$: $x^2 = 1$, $y^2 = 16$, zelfde teken: $\pm(1 + 4i)$.
    - opgave: |-
        $7 - 24i$
      antwoord: |-
        $\pm(4 - 3i)$
      uitwerking: |-
        $x^2 - y^2 = 7$, $x^2 + y^2 = 25$, $xy = -12$: $x^2 = 16$, $y^2 = 9$, verschillend teken: $\pm(4 - 3i)$.
    - opgave: |-
        $8i$
      antwoord: |-
        $\pm(2 + 2i)$
      uitwerking: |-
        $x^2 - y^2 = 0$, $x^2 + y^2 = 8$, $xy = 4$: $x^2 = y^2 = 4$, zelfde teken: $\pm(2 + 2i)$.
    - opgave: |-
        $-21 - 20i$
      antwoord: |-
        $\pm(2 - 5i)$
      uitwerking: |-
        $x^2 - y^2 = -21$, $x^2 + y^2 = 29$, $xy = -10$: $x^2 = 4$, $y^2 = 25$, verschillend teken: $\pm(2 - 5i)$.
    - opgave: |-
        $-24 - 10i$
      antwoord: |-
        $\pm(1 - 5i)$
      uitwerking: |-
        $x^2 - y^2 = -24$, $x^2 + y^2 = 26$, $xy = -5$: $x^2 = 1$, $y^2 = 25$, verschillend teken: $\pm(1 - 5i)$.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijking opstellen
  opgave: |-
    Stel een vergelijking met reële coëfficiënten en een zo laag mogelijke graad op met de gegeven oplossingen.
  lijst: enumerate
  delen:
    - opgave: |-
        $-2 + 5i$
      antwoord: |-
        $z^2 + 4z + 29 = 0$
      uitwerking: |-
        Ook $-2 - 5i$ is een oplossing. Som $-4$, product $4 + 25 = 29$: $z^2 + 4z + 29 = 0$.
    - opgave: |-
        $i\sqrt3$
      antwoord: |-
        $z^2 + 3 = 0$
      uitwerking: |-
        Ook $-i\sqrt3$. Som 0, product 3: $z^2 + 3 = 0$.
    - opgave: |-
        $2$ en $1 - i$
      antwoord: |-
        $z^3 - 4z^2 + 6z - 4 = 0$
      uitwerking: |-
        Ook $1 + i$ is een oplossing: de graad is minstens 3. Bij $1 \pm i$ hoort $z^2 - 2z + 2$, dus $(z - 2)(z^2 - 2z + 2) = z^3 - 4z^2 + 6z - 4 = 0$.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    vierdegraadsvergelijkingen
  opgave: |-
    Los op in $\C$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $z^4 - 81 = 0$
      antwoord: |-
        $\pm 3$, $\pm 3i$
      uitwerking: |-
        $(z^2 - 9)(z^2 + 9) = 0$, dus $z = \pm 3$ of $z = \pm 3i$.
    - opgave: |-
        $z^4 + 5z^2 + 4 = 0$
      antwoord: |-
        $\pm i$, $\pm 2i$
      uitwerking: |-
        Stel $t = z^2$: $t^2 + 5t + 4 = 0$ geeft $t = -1$ of $t = -4$. Dus $z = \pm i$ of $z = \pm 2i$.
    - opgave: |-
        $z^4 - z^2 - 12 = 0$
      antwoord: |-
        $\pm 2$, $\pm i\sqrt3$
      uitwerking: |-
        $t^2 - t - 12 = 0$ geeft $t = 4$ of $t = -3$. Dus $z = \pm 2$ of $z = \pm i\sqrt3$.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    context: gedempte trilling
  prent:
    naam: veer
  opgave: |-
    Een gewicht hangt aan een veer en beweegt in olie, die de beweging afremt. Of het gewicht op en neer blijft gaan, hangt af van de oplossingen van een vergelijking $r^2 + cr + 20 = 0$, met $c > 0$ de demping. Zijn de oplossingen niet reëel, dan trilt het gewicht, en het imaginair deel bepaalt hoe snel.
  lijst: enumerate
  delen:
    - opgave: |-
        Los de vergelijking op voor $c = 4$.
      antwoord: |-
        $r = -2 \pm 4i$
      uitwerking: |-
        $D = 16 - 80 = -64$, dus $r = \frac{-4 \pm 8i}{2} = -2 \pm 4i$.
    - opgave: |-
        Voor welke waarden van $c$ trilt het gewicht?
      antwoord: |-
        $0 < c < 4\sqrt5 \approx 8{,}94$
      uitwerking: |-
        De oplossingen zijn niet reëel als $D = c^2 - 80 < 0$, dus $c^2 < 80$. Met $c > 0$: $0 < c < \sqrt{80} = 4\sqrt5 \approx 8{,}94$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    coëfficiënten bepalen uit een oplossing
  opgave: |-
    Het getal $2 - 3i$ is een oplossing van $z^2 + bz + c = 0$, met $b, c \in \R$. Bepaal $b$ en $c$ op twee manieren: met som en product, en door $2 - 3i$ in te vullen en de gelijkheid van complexe getallen te gebruiken.
  antwoord: |-
    $b = -4$, $c = 13$
  uitwerking: |-
    Met som en product: de andere oplossing is $2 + 3i$. Som 4, dus $b = -4$; product $4 + 9 = 13$, dus $c = 13$.\par
    Door in te vullen: $(2 - 3i)^2 + b(2 - 3i) + c = -5 - 12i + 2b - 3bi + c = (-5 + 2b + c) + (-12 - 3b)i = 0$. Het imaginair deel geeft $b = -4$, het reëel deel dan $c = 5 + 8 = 13$.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten
  opgave: |-
    Waar of vals? Verbeter wat vals is.
  lijst: enumerate
  delen:
    - opgave: |-
        De vergelijking $z^2 + 1 = 0$ heeft één oplossing: $i$.
      antwoord: |-
        vals: ook $-i$
      uitwerking: |-
        Vals: $z^2 = -1$ heeft twee oplossingen, $i$ en $-i$.
    - opgave: |-
        Elke tweedegraadsvergelijking met reële coëfficiënten heeft minstens één oplossing in $\C$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: ook als $D < 0$ zijn er oplossingen, $\frac{-b \pm i\sqrt{-D}}{2a}$.
    - opgave: |-
        Als $3 + i$ een oplossing is van $z^2 + bz + c = 0$, dan is $3 - i$ dat ook.
      antwoord: |-
        vals als $b$ of $c$ niet reëel is
      uitwerking: |-
        Vals in het algemeen: dat geldt alleen als $b$ en $c$ reëel zijn. Met $b = -3 - i$ en $c = 0$ zijn de oplossingen $0$ en $3 + i$.
    - opgave: |-
        $z^2 = -4$, dus $z = \sqrt{-4} = 2i$.
      antwoord: |-
        vals: $z = \pm 2i$, en geen $\sqrt{-4}$
      uitwerking: |-
        Vals: er zijn twee oplossingen, $z = \pm 2i$, en het wortelteken staat niet bij een negatief getal.
    - opgave: |-
        $\tfrac{\sqrt2}{2}(1 + i)$ is een vierkantswortel van $i$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $\bigl(\tfrac{\sqrt2}{2}\bigr)^2 (1 + i)^2 = \tfrac12 \cdot 2i = i$.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    derdemachtswortels van een reëel getal
  opgave: |-
    Los op in $\C$. Gebruik $a^3 - b^3 = (a - b)(a^2 + ab + b^2)$ en $a^3 + b^3 = (a + b)(a^2 - ab + b^2)$.
  lijst: enumerate
  delen:
    - opgave: |-
        $z^3 - 8 = 0$. Stel de oplossingen voor in het vlak van Gauss. Wat merk je op?
      antwoord: |-
        $2$, $-1 \pm i\sqrt3$: een gelijkzijdige driehoek op de cirkel met straal 2
      uitwerking: |-
        $(z - 2)(z^2 + 2z + 4) = 0$. De tweede factor heeft $D = 4 - 16 = -12$, dus $z = \frac{-2 \pm 2i\sqrt3}{2} = -1 \pm i\sqrt3$.
        \naast{\begin{minipage}{8cm}Alle drie hebben modulus 2: $|-1 + i\sqrt3| = \sqrt{1 + 3} = 2$. Ze liggen op de cirkel met middelpunt 0 en straal 2, en vormen een gelijkzijdige driehoek. In hoofdstuk 4 zie je waarom.\end{minipage}}{\begin{tikzpicture}[x=.6cm,y=.6cm]
          \gaussleeg{-2}{2}{-2}{2}
          \draw[hulplijn] (0,0) circle (2);
          \draw[accent!60] (2,0) -- (-1,1.732) -- (-1,-1.732) -- cycle;
          \cpunt[above right]{2}{0}{$2$}
          \cpunt[above left]{-1}{1.732}{$-1 + i\sqrt3$}
          \cpunt[below left]{-1}{-1.732}{$-1 - i\sqrt3$}
        \end{tikzpicture}}
    - opgave: |-
        $z^3 + 1 = 0$
      antwoord: |-
        $-1$, $\tfrac12 \pm \tfrac{\sqrt3}{2} i$
      uitwerking: |-
        $(z + 1)(z^2 - z + 1) = 0$. De tweede factor heeft $D = 1 - 4 = -3$, dus $z = -1$ of $z = \frac{1 \pm i\sqrt3}{2}$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    derdegraadsvergelijking met een gegeven oplossing
  opgave: |-
    Toon aan dat $z = 1$ een oplossing is van $z^3 - 3z^2 + 4z - 2 = 0$, en bepaal de andere oplossingen.
  antwoord: |-
    $1$, $1 \pm i$
  uitwerking: |-
    $1 - 3 + 4 - 2 = 0$. Deel door $z - 1$ (bijvoorbeeld met de regel van Horner): $z^3 - 3z^2 + 4z - 2 = (z - 1)(z^2 - 2z + 2)$. De tweede factor heeft $D = 4 - 8 = -4$, dus $z = 1 \pm i$.

- id: h2-o14
  soort: opdracht
  niveau: 3
  thema: |-
    derdegraadsvergelijking met een gegeven niet-reële oplossing
  opgave: |-
    Het getal $2i$ is een oplossing van $z^3 - 3z^2 + 4z - 12 = 0$. Bepaal alle oplossingen, zonder te delen.
  antwoord: |-
    $2i$, $-2i$, $3$
  uitwerking: |-
    De coëfficiënten zijn reëel, dus ook $-2i$ is een oplossing, en $(z - 2i)(z + 2i) = z^2 + 4$ is een factor. Dan is $z^3 - 3z^2 + 4z - 12 = (z^2 + 4)(z + p)$, en de constante term geeft $4p = -12$, dus $p = -3$. Controle: $(z^2 + 4)(z - 3) = z^3 - 3z^2 + 4z - 12$. De oplossingen zijn $2i$, $-2i$ en $3$.

- id: h2-o15
  soort: opdracht
  niveau: 3
  thema: |-
    vergelijking met een niet-reële coëfficiënt
  opgave: |-
    De vergelijking $z^2 - 3z + 3 + i = 0$ heeft een niet-reële constante term. Los ze op met de formule $z = (-b \pm w)/(2a)$, waarin $w$ een vierkantswortel is van de discriminant. Zijn de oplossingen elkaars toegevoegde? Waarom kon je dat verwachten?
  antwoord: |-
    $2 - i$ en $1 + i$; niet toegevoegd, want de coëfficiënten zijn niet allemaal reëel
  uitwerking: |-
    $D = 9 - 4(3 + i) = -3 - 4i$. Vierkantswortels: $x^2 - y^2 = -3$, $x^2 + y^2 = 5$, $xy = -2$, dus $x^2 = 1$, $y^2 = 4$ met verschillend teken: $w = 1 - 2i$. Dan is $z = \frac{3 \pm (1 - 2i)}{2}$: $z = 2 - i$ of $z = 1 + i$.\par
    Die zijn niet elkaars toegevoegde. De stelling over toegevoegde oplossingen geldt alleen bij reële coëfficiënten, en $3 + i$ is niet reëel. (De formule zelf blijft geldig: het bewijs met het kwadraat afsplitsen werkt ook hier.)

- id: h2-o16
  soort: opdracht
  niveau: 3
  thema: |-
    wanneer is een kwadraat reëel
  opgave: |-
    Toon aan: $z^2$ is reëel als en slechts als $z$ reëel of zuiver imaginair is (of 0). Wanneer is $z^2$ een negatief reëel getal?
  antwoord: |-
    bewijs; als $z$ zuiver imaginair is
  uitwerking: |-
    Met $z = a + bi$ is $z^2 = (a^2 - b^2) + 2abi$. Dat is reëel als en slechts als $2ab = 0$, dus $a = 0$ of $b = 0$: $z$ is zuiver imaginair, reëel of 0.\par
    Als $b = 0$ is $z^2 = a^2 \geqslant 0$. Als $a = 0$ en $b \neq 0$ is $z^2 = -b^2 < 0$. Dus $z^2$ is negatief als en slechts als $z$ zuiver imaginair is.

- id: h2-o17
  soort: opdracht
  niveau: 3
  thema: |-
    parameter en modulus
  opgave: |-
    Gegeven: de vergelijking $z^2 + kz + 9 = 0$ met $k \in \R$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $k$ zijn de oplossingen niet reëel?
      antwoord: |-
        $-6 < k < 6$
      uitwerking: |-
        $D = k^2 - 36 < 0$ als $-6 < k < 6$.
    - opgave: |-
        Toon aan dat de oplossingen dan allebei modulus 3 hebben. Waar liggen ze in het vlak van Gauss als $k$ verandert?
      antwoord: |-
        bewijs; op de cirkel met middelpunt 0 en straal 3
      uitwerking: |-
        De oplossingen zijn $z$ en $\conj{z}$, met product $z \cdot \conj{z} = |z|^2 = 9$. Dus $|z| = |\conj{z}| = 3$: de oplossingen liggen op de cirkel met middelpunt 0 en straal 3, symmetrisch ten opzichte van de reële as.

- id: h2-o18
  soort: opdracht
  niveau: 3
  thema: |-
    z tot de vierde gelijk aan -1
  opgave: |-
    Los op in $\C$: $z^4 = -1$. Bepaal daarvoor eerst $z^2$, en daarna de vierkantswortels. Stel de oplossingen voor in het vlak van Gauss.
  antwoord: |-
    $\tfrac{\sqrt2}{2}(\pm 1 \pm i)$: de hoekpunten van een vierkant op de cirkel met straal 1
  uitwerking: |-
    $z^2$ is een vierkantswortel van $-1$, dus $z^2 = i$ of $z^2 = -i$.\par
    $z^2 = i$: $x^2 - y^2 = 0$, $x^2 + y^2 = 1$, $xy = \frac12 > 0$, dus $x^2 = y^2 = \frac12$ met hetzelfde teken: $z = \pm\frac{\sqrt2}{2}(1 + i)$.\par
    $z^2 = -i$: nu $xy < 0$: $z = \pm\frac{\sqrt2}{2}(1 - i)$.\par
    \naast{\begin{minipage}{8cm}De vier oplossingen hebben modulus 1 en liggen op de diagonalen: ze vormen een vierkant op de cirkel met straal 1.\end{minipage}}{\begin{tikzpicture}[x=1cm,y=1cm]
      \gaussleeg{-1}{1}{-1}{1}
      \draw[hulplijn] (0,0) circle (1);
      \draw[accent!60] (.707,.707) -- (-.707,.707) -- (-.707,-.707) -- (.707,-.707) -- cycle;
      \foreach \x/\y in {.707/.707,-.707/.707,-.707/-.707,.707/-.707}{\fill[accent] (\x,\y) circle (2.2pt);}
    \end{tikzpicture}}

- id: h2-o19
  soort: opdracht
  niveau: 1
  thema: |-
    drill: tweedegraadsvergelijkingen
  opgave: |-
    Los op in $\C$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $z^2 + 81 = 0$
      antwoord: |-
        $\pm 9i$
      uitwerking: |-
        $z^2 = -81$, dus $z = \pm 9i$.
    - opgave: |-
        $z^2 - 4z + 20 = 0$
      antwoord: |-
        $2 \pm 4i$
      uitwerking: |-
        $D = 16 - 80 = -64$, dus $z = \frac{4 \pm 8i}{2} = 2 \pm 4i$.
    - opgave: |-
        $z^2 + 2z - 8 = 0$
      antwoord: |-
        $2$ of $-4$
      uitwerking: |-
        $D = 4 + 32 = 36 > 0$: twee reële oplossingen, $z = \frac{-2 \pm 6}{2}$, dus $z = 2$ of $z = -4$.
    - opgave: |-
        $9z^2 + 4 = 0$
      antwoord: |-
        $\pm \tfrac23 i$
      uitwerking: |-
        $z^2 = -\frac49$, dus $z = \pm \frac23 i$.
    - opgave: |-
        $z^2 + 6z + 9 = 0$
      antwoord: |-
        $-3$
      uitwerking: |-
        $D = 36 - 36 = 0$, of $(z + 3)^2 = 0$: één oplossing, $z = -3$.
    - opgave: |-
        $z^2 - z + 1 = 0$
      antwoord: |-
        $\tfrac12 \pm \tfrac{\sqrt3}{2} i$
      uitwerking: |-
        $D = 1 - 4 = -3$, dus $z = \frac{1 \pm i\sqrt3}{2}$.
    - opgave: |-
        $5z^2 - 2z + 1 = 0$
      antwoord: |-
        $\tfrac15 \pm \tfrac25 i$
      uitwerking: |-
        $D = 4 - 20 = -16$, dus $z = \frac{2 \pm 4i}{10} = \frac15 \pm \frac25 i$.
    - opgave: |-
        $z^2 + 3z = 0$
      antwoord: |-
        $0$ of $-3$
      uitwerking: |-
        Zonder $z$ af: $z(z + 3) = 0$, dus $z = 0$ of $z = -3$.
    - opgave: |-
        $-z^2 + 2z - 10 = 0$
      antwoord: |-
        $1 \pm 3i$
      uitwerking: |-
        Vermenigvuldig met $-1$: $z^2 - 2z + 10 = 0$. $D = 4 - 40 = -36$, dus $z = \frac{2 \pm 6i}{2} = 1 \pm 3i$.
    - opgave: |-
        $z^2 + 2\sqrt2\,z + 3 = 0$
      antwoord: |-
        $-\sqrt2 \pm i$
      uitwerking: |-
        $D = 8 - 12 = -4$, dus $z = \frac{-2\sqrt2 \pm 2i}{2} = -\sqrt2 \pm i$.
    - opgave: |-
        $2z^2 + 8 = 0$
      antwoord: |-
        $\pm 2i$
      uitwerking: |-
        $z^2 = -4$, dus $z = \pm 2i$.
    - opgave: |-
        $z^2 - 10z + 41 = 0$
      antwoord: |-
        $5 \pm 4i$
      uitwerking: |-
        $D = 100 - 164 = -64$, dus $z = \frac{10 \pm 8i}{2} = 5 \pm 4i$.

- id: h2-o20
  soort: opdracht
  niveau: 1
  thema: |-
    parabolen en het soort oplossingen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.26cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=1,ystep=2] (-2,-4) grid (4,8);
        \draw[->,grijs] (-2,0) -- (4.5,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,-4) -- (0,8.7) node[above,text=black] {$y$};
        \foreach \t in {-1,1,2,3}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {-4,-2,2,4,6,8}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \draw[accent,thick] plot[domain=-1.8:3.8,samples=50,smooth] (\x,{(\x)^2-2*(\x)-3});
        \draw[fel!80!black,thick] plot[domain=-1.6:3.6,samples=50,smooth] (\x,{(\x)^2-2*(\x)+1});
        \draw[grijs,thick] plot[domain=-.6:2.6,samples=50,smooth] (\x,{(\x)^2-2*(\x)+5});
        \node[above] at (2.6,6.56) {$h$};
        \node[right] at (3.6,6.76) {$g$};
        \node[right] at (3.8,3.84) {$f$};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafieken van $f(x) = x^2 - 2x - 3$, $g(x) = x^2 - 2x + 1$ en $h(x) = x^2 - 2x + 5$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke van de vergelijkingen $f(x) = 0$, $g(x) = 0$ en $h(x) = 0$ heeft twee niet-reële oplossingen? Leg uit met de grafiek.
      antwoord: |-
        $h(x) = 0$: de grafiek van $h$ snijdt de $x$-as niet
      uitwerking: |-
        De reële oplossingen zijn de snijpunten met de $x$-as. De grafiek van $f$ snijdt de $x$-as twee keer, die van $g$ raakt ze, en die van $h$ ligt er volledig boven. Dus $h(x) = 0$ heeft geen reële oplossingen, en in $\C$ twee toegevoegde.
    - opgave: |-
        Los de drie vergelijkingen op in $\C$. Wat hebben alle oplossingen met de symmetrieas van de parabolen te maken?
      antwoord: |-
        $f$: $-1$, $3$; \ $g$: $1$; \ $h$: $1 \pm 2i$; reëel deel (of gemiddelde) 1
      uitwerking: |-
        $f(x) = 0$: $D = 4 + 12 = 16$, dus $x = \frac{2 \pm 4}{2}$: $x = -1$ of $x = 3$.\par
        $g(x) = 0$: $(x - 1)^2 = 0$, dus $x = 1$.\par
        $h(x) = 0$: $D = 4 - 20 = -16$, dus $x = \frac{2 \pm 4i}{2} = 1 \pm 2i$.\par
        De symmetrieas is telkens $x = 1$. De reële oplossingen liggen symmetrisch rond 1, en de niet-reële hebben reëel deel 1: de som van de oplossingen is altijd $-\frac{b}{a} = 2$.

- id: h2-o21
  soort: opdracht
  niveau: 1
  thema: |-
    klassieke fouten in de formule
  opgave: |-
    Waar zit de fout? Geef de juiste oplossingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Iemand lost $z^2 + 4z + 13 = 0$ op: `$D = 16 - 52 = -36$, dus $z = \dfrac{4 \pm 6i}{2} = 2 \pm 3i$.'
      antwoord: |-
        in de teller hoort $-b = -4$: $z = -2 \pm 3i$
      uitwerking: |-
        In de formule staat $-b$, en $b = 4$. Juist is $z = \frac{-4 \pm 6i}{2} = -2 \pm 3i$. Controle met de som: $-b = -4$, en $(-2 + 3i) + (-2 - 3i) = -4$.
    - opgave: |-
        Iemand lost $2z^2 - 2z + 5 = 0$ op: `$D = 4 - 40 = -36$, dus $z = \dfrac{2 \pm 6i}{2} = 1 \pm 3i$.'
      antwoord: |-
        de noemer is $2a = 4$: $z = \tfrac12 \pm \tfrac32 i$
      uitwerking: |-
        De noemer is $2a = 4$, niet 2. Juist is $z = \frac{2 \pm 6i}{4} = \frac12 \pm \frac32 i$. Controle met het product: $\frac{c}{a} = \frac52$, en $\bigl(\frac12\bigr)^2 + \bigl(\frac32\bigr)^2 = \frac{10}{4} = \frac52$.

- id: h2-o22
  soort: opdracht
  niveau: 2
  thema: |-
    context: een rechthoek die niet bestaat
  opgave: |-
    Bestaat er een rechthoekig terrein met omtrek 20 m en oppervlakte 30 m\textsuperscript{2}? Noem de lengte en de breedte $x$ en $y$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $x$ en $y$ de oplossingen zijn van $z^2 - 10z + 30 = 0$.
      antwoord: |-
        som 10, product 30
      uitwerking: |-
        De omtrek is $2(x + y) = 20$, dus $x + y = 10$, en de oppervlakte is $xy = 30$. Twee getallen met som 10 en product 30 zijn de oplossingen van $z^2 - 10z + 30 = 0$, want daar is $-\frac{b}{a} = 10$ en $\frac{c}{a} = 30$.
    - opgave: |-
        Los de vergelijking op in $\C$. Bestaat zo'n terrein?
      antwoord: |-
        $5 \pm i\sqrt5$: nee
      uitwerking: |-
        $D = 100 - 120 = -20$, dus $z = \frac{10 \pm 2i\sqrt5}{2} = 5 \pm i\sqrt5$. Een lengte is een reëel getal, dus zo'n terrein bestaat niet. Toch voldoen de twee complexe getallen aan de voorwaarden: hun som is 10 en hun product $25 + 5 = 30$.
    - opgave: |-
        Voor welke oppervlakten $A$ bestaat er wel een rechthoek met omtrek 20 m? Welke rechthoek heeft de grootste oppervlakte?
      antwoord: |-
        $0 < A \leqslant 25$; het vierkant met zijde 5 m
      uitwerking: |-
        Nu zijn $x$ en $y$ de oplossingen van $z^2 - 10z + A = 0$. Ze zijn reëel als $D = 100 - 4A \geqslant 0$, dus $A \leqslant 25$ (en positief, want $x, y > 0$). Voor $A = 25$ is $D = 0$ en $x = y = 5$: het vierkant met zijde 5 m heeft de grootste oppervlakte.

- id: h2-o23
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijkingen van hogere graad
  opgave: |-
    Los op in $\C$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $z^3 - 2z^2 + 4z - 8 = 0$
      antwoord: |-
        $2$, $\pm 2i$
      uitwerking: |-
        Groeperen: $z^2(z - 2) + 4(z - 2) = (z - 2)(z^2 + 4) = 0$. Dus $z = 2$ of $z^2 = -4$, en $z = \pm 2i$.
    - opgave: |-
        $z^3 = 4z^2 - 5z$
      antwoord: |-
        $0$, $2 \pm i$
      uitwerking: |-
        Alles naar één lid: $z^3 - 4z^2 + 5z = z(z^2 - 4z + 5) = 0$. De tweede factor heeft $D = 16 - 20 = -4$, dus $z = 0$ of $z = 2 \pm i$.
    - opgave: |-
        $z^4 - 2z^3 + 2z^2 = 0$
      antwoord: |-
        $0$, $1 \pm i$
      uitwerking: |-
        $z^2(z^2 - 2z + 2) = 0$. Dus $z = 0$ (een dubbele oplossing) of $z^2 - 2z + 2 = 0$, met $D = -4$ en $z = 1 \pm i$.
    - opgave: |-
        $z^4 + 6z^2 + 25 = 0$
      antwoord: |-
        $\pm(1 + 2i)$, $\pm(1 - 2i)$
      uitwerking: |-
        Stel $t = z^2$: $t^2 + 6t + 25 = 0$, met $D = 36 - 100 = -64$, dus $t = -3 \pm 4i$.\par
        $z^2 = -3 + 4i$: $x^2 - y^2 = -3$, $x^2 + y^2 = 5$, $xy = 2$, dus $x^2 = 1$, $y^2 = 4$ met hetzelfde teken: $z = \pm(1 + 2i)$.\par
        $z^2 = -3 - 4i$: nu is $xy = -2$, dus $z = \pm(1 - 2i)$.

- id: h2-o24
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fout: het product van toegevoegden
  opgave: |-
    Iemand stelt een vergelijking op met oplossing $3 - 2i$: `De andere oplossing is $3 + 2i$. De som is 6 en het product $3^2 - 2^2 = 5$, dus $z^2 - 6z + 5 = 0$.'
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is er fout? Geef de juiste vergelijking.
      antwoord: |-
        het product is $3^2 + 2^2 = 13$: $z^2 - 6z + 13 = 0$
      uitwerking: |-
        $(3 - 2i)(3 + 2i) = 9 - 4i^2 = 9 + 4 = 13$: bij toegevoegden tel je de kwadraten op. De juiste vergelijking is $z^2 - 6z + 13 = 0$.
    - opgave: |-
        Hoe zie je zonder op te lossen dat $z^2 - 6z + 5 = 0$ niet kan kloppen?
      antwoord: |-
        $D = 16 > 0$: de oplossingen zijn reëel
      uitwerking: |-
        De discriminant is $36 - 20 = 16 > 0$: die vergelijking heeft twee reële oplossingen (1 en 5), en dus geen oplossing $3 - 2i$.

- id: h2-o25
  soort: opdracht
  niveau: 2
  thema: |-
    toegevoegde oplossingen in het vlak herkennen
  opgave: |-
    Elke figuur toont een verzameling van complexe getallen. Welke kan de verzameling van alle oplossingen zijn van een veeltermvergelijking met reële coëfficiënten en een zo laag mogelijke graad? Geef bij die figuren zo'n vergelijking.\par
    \figuren{\begin{tikzpicture}[x=.36cm,y=.36cm]
      \gaussleeg{-2}{2}{-2}{2}
      \cpunt[right]{1}{2}{}\cpunt[right]{1}{-2}{}
      \node[below,font=\small] at (0,-2.4) {(1)};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.36cm,y=.36cm]
      \gaussleeg{-2}{2}{-2}{2}
      \cpunt[right]{-1}{1}{}\cpunt[right]{1}{1}{}
      \node[below,font=\small] at (0,-2.4) {(2)};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.36cm,y=.36cm]
      \gaussleeg{-2}{2}{-2}{2}
      \cpunt[right]{2}{0}{}\cpunt[right]{-1}{1}{}\cpunt[right]{-1}{-1}{}
      \node[below,font=\small] at (0,-2.4) {(3)};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[x=.36cm,y=.36cm]
      \gaussleeg{-2}{2}{-2}{2}
      \cpunt[right]{0}{2}{}\cpunt[right]{0}{-2}{}\cpunt[right]{1}{1}{}
      \node[below,font=\small] at (0,-2.4) {(4)};
    \end{tikzpicture}}
    {\footnotesize Op de assen staan de roosterlijnen telkens 1 uit elkaar.}
  antwoord: |-
    (1): $z^2 - 2z + 5 = 0$; \ (3): $z^3 - 2z - 4 = 0$; \ (2) en (4) niet
  uitwerking: |-
    Bij reële coëfficiënten is met elke oplossing ook haar toegevoegde een oplossing: de figuur moet symmetrisch zijn ten opzichte van de reële as.\par
    (1) $1 \pm 2i$ is een toegevoegd paar: som 2, product $1 + 4 = 5$, dus $z^2 - 2z + 5 = 0$.\par
    (2) Bij $1 + i$ ontbreekt $1 - i$ (de figuur is symmetrisch om de imaginaire as, maar dat telt niet): niet mogelijk.\par
    (3) $2$ en het paar $-1 \pm i$, met $z^2 + 2z + 2$: $(z - 2)(z^2 + 2z + 2) = z^3 - 2z - 4 = 0$.\par
    (4) $\pm 2i$ is een paar, maar bij $1 + i$ ontbreekt $1 - i$: niet mogelijk.

- id: h2-o26
  soort: opdracht
  niveau: 3
  thema: |-
    hoeveel reële oplossingen
  opgave: |-
    Een veeltermvergelijking van graad $n \geqslant 1$ heeft in $\C$ precies $n$ oplossingen, als je een oplossing die $k$ keer als factor voorkomt ook $k$ keer telt. Dat is de hoofdstelling van de algebra; Gauss gaf er in 1799 een bewijs van. Neem in deze opdracht aan dat de coëfficiënten reëel zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit waarom een vergelijking van graad 5 minstens één reële oplossing heeft. Deel daarvoor door $(z - w)(z - \conj{w})$ als $w$ een niet-reële oplossing is.
      antwoord: |-
        de niet-reële oplossingen vallen weg in paren; er blijft een eerstegraadsfactor over
      uitwerking: |-
        Is $w = p + qi$ ($q \neq 0$) een oplossing, dan ook $\conj{w}$, en $(z - w)(z - \conj{w}) = z^2 - 2pz + p^2 + q^2$ heeft reële coëfficiënten. Deel je de veelterm daardoor, dan heeft het quotiënt ook reële coëfficiënten en een graad die 2 lager is. Zo haal je de niet-reële oplossingen per twee weg: van graad 5 naar 3 naar 1. Een veelterm van graad 1 met reële coëfficiënten, $az + b$, heeft de reële oplossing $-\frac{b}{a}$. Er blijft dus altijd minstens één reële oplossing over.
    - opgave: |-
        Kan een vergelijking van graad 4 precies één reële oplossing hebben? Let op het verschil tussen \textit{één oplossing} en \textit{één keer geteld}.
      antwoord: |-
        één keer geteld: nee; wel één reële oplossing die twee keer telt, zoals $(z - 1)^2(z^2 + 1) = 0$
      uitwerking: |-
        Op dezelfde manier vallen de niet-reële oplossingen per twee weg, dus geteld met hun aantal is het aantal reële oplossingen $4$, $2$ of $0$: altijd even. Een enkelvoudige reële oplossing die als enige overblijft, kan dus niet.\par
        Wel kan er maar één reëel getal oplossing zijn, als het twee keer telt: $(z - 1)^2(z^2 + 1) = 0$ heeft als oplossingen $1$ (twee keer) en $\pm i$.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Tweedegraadsfuncties
  thema: |-
    de top van de parabool en de complexe oplossingen
  opgave: |-
    De parabool met vergelijking $y = x^2 - 4x + 13$ heeft top $(2, 9)$, en de vergelijking $x^2 - 4x + 13 = 0$ heeft oplossingen $2 \pm 3i$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $x^2 + px + q$ als $(x - h)^2 + k$. Wat is de top van de parabool $y = x^2 + px + q$?
      antwoord: |-
        $h = -\tfrac{p}{2}$, $k = q - \tfrac{p^2}{4}$; top $(h, k)$
      uitwerking: |-
        $x^2 + px + q = \bigl(x + \frac{p}{2}\bigr)^2 + q - \frac{p^2}{4}$, dus $h = -\frac{p}{2}$ en $k = q - \frac{p^2}{4}$. De top is $(h, k)$.
    - opgave: |-
        Toon aan: ligt de top boven de $x$-as ($k > 0$), dan zijn de oplossingen van $x^2 + px + q = 0$ gelijk aan $h \pm i\sqrt{k}$. Controleer met het voorbeeld.
      antwoord: |-
        bewijs; $2 \pm i\sqrt9 = 2 \pm 3i$
      uitwerking: |-
        $(x - h)^2 + k = 0 \iff (x - h)^2 = -k$, en met $k > 0$ zijn de vierkantswortels van $-k$ gelijk aan $\pm i\sqrt{k}$. Dus $x = h \pm i\sqrt{k}$. In het voorbeeld is $h = 2$ en $k = 9$: $2 \pm 3i$.
    - opgave: |-
        Lees de oplossingen van $x^2 + 2x + 5 = 0$ af uit de top van de parabool.
      antwoord: |-
        top $(-1, 4)$: $-1 \pm 2i$
      uitwerking: |-
        $x^2 + 2x + 5 = (x + 1)^2 + 4$: top $(-1, 4)$, dus de oplossingen zijn $-1 \pm i\sqrt4 = -1 \pm 2i$.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Veeltermvergelijkingen
  thema: |-
    Bombelli en de derdegraadsvergelijking
  opgave: |-
    Rond 1570 bestudeerde de Italiaan Rafael Bombelli de vergelijking $x^3 = 15x + 4$. Een formule voor derdegraadsvergelijkingen, die toen al bekend was, gaf als oplossing een som van twee derdemachtswortels: van $2 + 11i$ en van $2 - 11i$, hoewel er niets imaginairs in de vergelijking staat.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $x = 4$ een oplossing is.
      antwoord: |-
        $64 = 60 + 4$
      uitwerking: |-
        $4^3 = 64$ en $15 \cdot 4 + 4 = 64$.
    - opgave: |-
        Bereken $(2 + i)^3$ en $(2 - i)^3$.
      antwoord: |-
        $2 + 11i$ en $2 - 11i$
      uitwerking: |-
        $(2 + i)^2 = 3 + 4i$, dus $(2 + i)^3 = (3 + 4i)(2 + i) = 6 + 3i + 8i + 4i^2 = 2 + 11i$. Met de rekenregels voor de toegevoegde is $(2 - i)^3 = \conj{(2 + i)^3} = 2 - 11i$.
    - opgave: |-
        Leg uit hoe Bombelli zo de reële oplossing $x = 4$ terugvond.
      antwoord: |-
        $(2 + i) + (2 - i) = 4$
      uitwerking: |-
        Een derdemachtswortel van $2 + 11i$ is $2 + i$, en een van $2 - 11i$ is $2 - i$. Hun som is $(2 + i) + (2 - i) = 4$: de imaginaire delen vallen weg. Zo werd duidelijk dat rekenen met zulke getallen zinvol kan zijn, ook als je een reëel antwoord zoekt.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    vierkantswortels van een negatief getal
  opgave: |-
    Bepaal de vierkantswortels van $-45$.
  antwoord: |-
    $\pm 3i\sqrt5$
  uitwerking: |-
    $\pm i\sqrt{45} = \pm i\sqrt{9 \cdot 5} = \pm 3i\sqrt5$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    tweedegraadsvergelijking
  opgave: |-
    Los op in $\C$: $z^2 + 10z + 26 = 0$.
  antwoord: |-
    $-5 \pm i$
  uitwerking: |-
    $D = 100 - 104 = -4$, dus $z = \frac{-10 \pm 2i}{2} = -5 \pm i$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    tweedegraadsvergelijking met a verschillend van 1
  opgave: |-
    Los op in $\C$: $2z^2 - 2z + 1 = 0$.
  antwoord: |-
    $\tfrac12 \pm \tfrac12 i$
  uitwerking: |-
    $D = 4 - 8 = -4$, dus $z = \frac{2 \pm 2i}{4} = \frac12 \pm \frac12 i$.

- id: h2-t4
  soort: test
  niveau: 1
  thema: |-
    vergelijking opstellen
  opgave: |-
    Stel een tweedegraadsvergelijking met reële coëfficiënten op met oplossing $3 + 4i$.
  antwoord: |-
    $z^2 - 6z + 25 = 0$
  uitwerking: |-
    De andere oplossing is $3 - 4i$. Som 6, product $9 + 16 = 25$: $z^2 - 6z + 25 = 0$.

- id: h2-t5
  soort: test
  niveau: 2
  thema: |-
    ontbinden in factoren
  opgave: |-
    Ontbind $z^2 + 8z + 17$ in factoren van de eerste graad.
  antwoord: |-
    $(z + 4 - i)(z + 4 + i)$
  uitwerking: |-
    $D = 64 - 68 = -4$, oplossingen $-4 \pm i$. Dus $z^2 + 8z + 17 = (z + 4 - i)(z + 4 + i)$.

- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    vergelijking van hogere graad
  opgave: |-
    Los op in $\C$: $z^3 + 4z^2 + 13z = 0$.
  antwoord: |-
    $0$, $-2 \pm 3i$
  uitwerking: |-
    $z(z^2 + 4z + 13) = 0$. De tweede factor heeft $D = 16 - 52 = -36$, dus $z = 0$ of $z = \frac{-4 \pm 6i}{2} = -2 \pm 3i$.

- id: h2-t7
  soort: test
  niveau: 2
  thema: |-
    vierkantswortels van een complex getal
  opgave: |-
    Bepaal de vierkantswortels van $15 - 8i$.
  antwoord: |-
    $\pm(4 - i)$
  uitwerking: |-
    $x^2 - y^2 = 15$, $x^2 + y^2 = 17$, $xy = -4$: $x^2 = 16$, $y^2 = 1$, verschillend teken. Dus $\pm(4 - i)$. Controle: $(4 - i)^2 = 16 - 8i - 1 = 15 - 8i$.

- id: h2-t8
  soort: test
  niveau: 2
  thema: |-
    toegevoegde oplossingen
  opgave: |-
    Het getal $1 - 2i$ is een oplossing van $z^3 - z^2 + 3z + 5 = 0$. Bepaal alle oplossingen.
  antwoord: |-
    $1 - 2i$, $1 + 2i$, $-1$
  uitwerking: |-
    De coëfficiënten zijn reëel, dus ook $1 + 2i$ is een oplossing. Bij dat paar hoort de factor $z^2 - 2z + 5$ (som 2, product $1 + 4 = 5$). Dan is $z^3 - z^2 + 3z + 5 = (z^2 - 2z + 5)(z + p)$, en de constante term geeft $5p = 5$, dus $p = 1$. Controle: $(z^2 - 2z + 5)(z + 1) = z^3 - z^2 + 3z + 5$. De oplossingen zijn $1 \pm 2i$ en $-1$.
