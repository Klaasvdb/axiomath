# Oefeningen van hoofdstuk 3. Zie oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Schrijf $h(x) = (x^2 + 1)^3$ als $f(g(x))$.
      antwoord: |-
        $f(u) = u^3$, $g(x) = x^2 + 1$
      uitwerking: |-
        Binnenste $g(x) = x^2 + 1$, buitenste $f(u) = u^3$.
    - opgave: |-
        Bereken $\e^{\ln 5}$ en $\ln \e^3$.
      antwoord: |-
        5; 3
      uitwerking: |-
        $\e^x$ en $\ln x$ zijn elkaars inverse.
    - opgave: |-
        Leid af: $x^{10}$ en $\sqrt x$.
      antwoord: |-
        $10x^9$; $\frac{1}{2\sqrt x}$
      uitwerking: |-
        Machtregel: $(x^{10})' = 10x^9$, en $\sqrt x = x^{1/2}$ geeft $\tfrac12 x^{-1/2} = \frac{1}{2\sqrt x}$.
    - opgave: |-
        Vul aan: $2\sin x\cos x = \ldots$
      antwoord: |-
        $\sin 2x$
      uitwerking: |-
        Verdubbelingsformule.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Neem $h(x) = (2x + 1)^2$ en $k(x) = (2x + 1)^3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Werk $h(x)$ uit en leid af. Schrijf het resultaat als een veelvoud van $2x + 1$.
      antwoord: |-
        $8x + 4 = 4(2x + 1)$
      uitwerking: |-
        $4x^2 + 4x + 1$ afleiden: $8x + 4 = 4(2x + 1)$.
    - opgave: |-
        Een leerling zegt: \textit{de afgeleide van $(2x + 1)^2$ is $2(2x + 1)$, zoals bij $u^2$.} Wat is fout?
      antwoord: |-
        er ontbreekt een factor 2
      uitwerking: |-
        Het juiste resultaat is twee keer zo groot: er ontbreekt een factor $2$, de afgeleide van $2x + 1$.
    - opgave: |-
        Doe hetzelfde met $k(x)$. Welke regel vermoed je?
      antwoord: |-
        $3(2x + 1)^2 \cdot 2$
      uitwerking: |-
        $k(x) = 8x^3 + 12x^2 + 6x + 1$, $k'(x) = 24x^2 + 24x + 6 = 6(2x + 1)^2 = 3(2x + 1)^2 \cdot 2$: de buitenste afgeleid, maal de afgeleide van de binnenste.

- id: h3-ketting
  soort: kort
  opgave: |-
    Leid af met de kettingregel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(3x - 2)^5$
      antwoord: |-
        $15(3x - 2)^4$
      uitwerking: |-
        $5(3x - 2)^4 \cdot 3$.
    - opgave: |-
        $\dfrac{1}{x^2 + 1}$
      antwoord: |-
        $-\frac{2x}{(x^2 + 1)^2}$
      uitwerking: |-
        $(u^{-1})' = -u^{-2}$, maal $2x$.
    - opgave: |-
        $\sqrt{4 - x}$
      antwoord: |-
        $-\frac{1}{2\sqrt{4 - x}}$
      uitwerking: |-
        $\frac{1}{2\sqrt{4 - x}} \cdot (-1)$.

- id: h3-gonio
  soort: kort
  opgave: |-
    Leid af.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin(2x + 1)$
      antwoord: |-
        $2\cos(2x + 1)$
      uitwerking: |-
        $\cos(2x + 1) \cdot 2$.
    - opgave: |-
        $x\sin x$
      antwoord: |-
        $\sin x + x\cos x$
      uitwerking: |-
        Productregel: $1 \cdot \sin x + x \cdot \cos x$.
    - opgave: |-
        $\tan x^2$
      antwoord: |-
        $\frac{2x}{\cos^2 x^2}$
      uitwerking: |-
        $\frac{1}{\cos^2 x^2} \cdot 2x$.

- id: h3-explog
  soort: kort
  opgave: |-
    Leid af.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\e^{3x}$
      antwoord: |-
        $3\e^{3x}$
      uitwerking: |-
        $\e^{3x} \cdot 3$.
    - opgave: |-
        $2^x$
      antwoord: |-
        $2^x \ln 2$
      uitwerking: |-
        $(a^x)' = a^x \ln a$.
    - opgave: |-
        $\ln 5x$
      antwoord: |-
        $\frac1x$
      uitwerking: |-
        $\frac{1}{5x} \cdot 5 = \frac1x$ (of: $\ln 5 + \ln x$).
    - opgave: |-
        $x\ln x$
      antwoord: |-
        $\ln x + 1$
      uitwerking: |-
        $1 \cdot \ln x + x \cdot \frac1x$.

- id: h3-kmacht
  soort: kort
  opgave: |-
    Leid af met de kettingregel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(1 - 3x)^4$
      antwoord: |-
        $-12(1 - 3x)^3$
      uitwerking: |-
        Buitenste $u^4$, binnenste $u = 1 - 3x$ met $u' = -3$: $4(1 - 3x)^3 \cdot (-3) = -12(1 - 3x)^3$.
    - opgave: |-
        $(x^3 - 2x)^6$
      antwoord: |-
        $6(3x^2 - 2)(x^3 - 2x)^5$
      uitwerking: |-
        Buitenste $u^6$, binnenste $u = x^3 - 2x$ met $u' = 3x^2 - 2$: $6(x^3 - 2x)^5 \cdot (3x^2 - 2)$.
    - opgave: |-
        $\dfrac{1}{(2x + 5)^3}$
      antwoord: |-
        $-\dfrac{6}{(2x + 5)^4}$
      uitwerking: |-
        Schrijf als $(2x + 5)^{-3}$. Dan $-3(2x + 5)^{-4} \cdot 2 = -\dfrac{6}{(2x + 5)^4}$.

- id: h3-kwortel
  soort: kort
  opgave: |-
    Leid af.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sqrt{6x - 5}$
      antwoord: |-
        $\dfrac{3}{\sqrt{6x - 5}}$
      uitwerking: |-
        $\dfrac{1}{2\sqrt{6x - 5}} \cdot 6 = \dfrac{3}{\sqrt{6x - 5}}$.
    - opgave: |-
        $\sqrt{9 - x^2}$
      antwoord: |-
        $-\dfrac{x}{\sqrt{9 - x^2}}$
      uitwerking: |-
        $\dfrac{1}{2\sqrt{9 - x^2}} \cdot (-2x) = -\dfrac{x}{\sqrt{9 - x^2}}$.
    - opgave: |-
        $\sqrt[3]{x^2 + 4}$
      antwoord: |-
        $\dfrac{2x}{3\sqrt[3]{(x^2 + 4)^2}}$
      uitwerking: |-
        Schrijf als $(x^2 + 4)^{1/3}$. Dan $\tfrac13 (x^2 + 4)^{-2/3} \cdot 2x = \dfrac{2x}{3\sqrt[3]{(x^2 + 4)^2}}$.

- id: h3-lagen
  soort: kort
  opgave: |-
    Meer lagen en de notatie van Leibniz.
  lijst: enumerate
  delen:
    - opgave: |-
        Leid af: $\bigl((2x + 1)^2 + 1\bigr)^3$.
      antwoord: |-
        $12(2x + 1)\bigl((2x + 1)^2 + 1\bigr)^2$
      uitwerking: |-
        Drie lagen: $u^3$, daarin $v^2 + 1$, daarin $2x + 1$. Van buiten naar binnen: $3\bigl((2x + 1)^2 + 1\bigr)^2 \cdot 2(2x + 1) \cdot 2 = 12(2x + 1)\bigl((2x + 1)^2 + 1\bigr)^2$.
    - opgave: |-
        Leid af: $\sqrt{1 + \sqrt{x}}$.
      antwoord: |-
        $\dfrac{1}{4\sqrt{x}\,\sqrt{1 + \sqrt{x}}}$
      uitwerking: |-
        Buitenste $\sqrt{u}$, binnenste $1 + \sqrt{x}$ met afgeleide $\frac{1}{2\sqrt{x}}$: $\dfrac{1}{2\sqrt{1 + \sqrt{x}}} \cdot \dfrac{1}{2\sqrt{x}} = \dfrac{1}{4\sqrt{x}\,\sqrt{1 + \sqrt{x}}}$.
    - opgave: |-
        Neem $y = \sqrt{u}$ en $u = x^3 + 1$. Bereken $\frac{\mathrm{d}y}{\mathrm{d}x}$ in $x = 2$ met $\frac{\mathrm{d}y}{\mathrm{d}x} = \frac{\mathrm{d}y}{\mathrm{d}u} \cdot \frac{\mathrm{d}u}{\mathrm{d}x}$.
      antwoord: |-
        $2$
      uitwerking: |-
        $\frac{\mathrm{d}y}{\mathrm{d}u} = \frac{1}{2\sqrt{u}}$ en $\frac{\mathrm{d}u}{\mathrm{d}x} = 3x^2$. In $x = 2$ is $u = 9$, dus $\frac{\mathrm{d}y}{\mathrm{d}x} = \frac{1}{2 \cdot 3} \cdot 12 = 2$.

- id: h3-gonio2
  soort: kort
  opgave: |-
    Leid af.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\cos^3 x$
      antwoord: |-
        $-3\cos^2 x\sin x$
      uitwerking: |-
        Buitenste $u^3$, binnenste $\cos x$: $3\cos^2 x \cdot (-\sin x) = -3\cos^2 x\sin x$.
    - opgave: |-
        $\sin^2 2x$
      antwoord: |-
        $2\sin 4x$
      uitwerking: |-
        Drie lagen: $2\sin 2x \cdot \cos 2x \cdot 2 = 4\sin 2x\cos 2x = 2\sin 4x$ (verdubbelingsformule).
    - opgave: |-
        $\tan\sqrt{x}$
      antwoord: |-
        $\dfrac{1}{2\sqrt{x}\cos^2\sqrt{x}}$
      uitwerking: |-
        $\dfrac{1}{\cos^2\sqrt{x}} \cdot \dfrac{1}{2\sqrt{x}} = \dfrac{1}{2\sqrt{x}\cos^2\sqrt{x}}$.

- id: h3-cosbewijs
  soort: kort
  opgave: |-
    Bewijs zoals bij de sinus dat $(\cos x)' = -\sin x$. Gebruik de somformule
    \[\cos(x + h) = \cos x\cos h - \sin x\sin h.\]
  antwoord: |-
    bewijs
  uitwerking: |-
    $\dfrac{\cos(x + h) - \cos x}{h} = \cos x \cdot \dfrac{\cos h - 1}{h} - \sin x \cdot \dfrac{\sin h}{h}$. Voor $h \to 0$ gaat $\frac{\cos h - 1}{h}$ naar $0$ en $\frac{\sin h}{h}$ naar $1$, dus het differentiequotiënt gaat naar $\cos x \cdot 0 - \sin x \cdot 1 = -\sin x$.

- id: h3-explog2
  soort: kort
  opgave: |-
    Leid af.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\e^{5x - 2}$
      antwoord: |-
        $5\e^{5x - 2}$
      uitwerking: |-
        $\e^{5x - 2} \cdot 5$.
    - opgave: |-
        $3^{x^2}$
      antwoord: |-
        $2x \cdot 3^{x^2}\ln 3$
      uitwerking: |-
        $(a^u)' = a^u \ln a \cdot u'$: $3^{x^2}\ln 3 \cdot 2x$.
    - opgave: |-
        $\ln(3x^2 + 1)$
      antwoord: |-
        $\dfrac{6x}{3x^2 + 1}$
      uitwerking: |-
        $\dfrac{1}{3x^2 + 1} \cdot 6x$.
    - opgave: |-
        $\log_2(4x - 1)$
      antwoord: |-
        $\dfrac{4}{(4x - 1)\ln 2}$
      uitwerking: |-
        $\dfrac{1}{(4x - 1)\ln 2} \cdot 4$.

- id: h3-combi
  soort: kort
  opgave: |-
    Leid af en vereenvoudig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^3\e^{-x}$
      antwoord: |-
        $x^2(3 - x)\e^{-x}$
      uitwerking: |-
        Productregel, met $(\e^{-x})' = -\e^{-x}$: $3x^2\e^{-x} - x^3\e^{-x} = x^2(3 - x)\e^{-x}$.
    - opgave: |-
        $\dfrac{\e^x}{x^2 + 1}$
      antwoord: |-
        $\dfrac{(x - 1)^2\e^x}{(x^2 + 1)^2}$
      uitwerking: |-
        Quotiëntregel: $\dfrac{\e^x(x^2 + 1) - \e^x \cdot 2x}{(x^2 + 1)^2} = \dfrac{(x^2 - 2x + 1)\e^x}{(x^2 + 1)^2} = \dfrac{(x - 1)^2\e^x}{(x^2 + 1)^2}$.
    - opgave: |-
        $\sqrt{x}\,\ln x$
      antwoord: |-
        $\dfrac{\ln x + 2}{2\sqrt{x}}$
      uitwerking: |-
        Productregel: $\dfrac{1}{2\sqrt{x}}\ln x + \sqrt{x} \cdot \dfrac1x = \dfrac{\ln x}{2\sqrt{x}} + \dfrac{2}{2\sqrt{x}} = \dfrac{\ln x + 2}{2\sqrt{x}}$.

- id: h3-sinlim
  soort: kort
  opgave: |-
    Limieten met de sinus. Werk in radialen.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\displaystyle\lim_{h \to 0} \dfrac{\sin 5h}{h}$ en $\displaystyle\lim_{h \to 0} \dfrac{\sin h}{4h}$.
      antwoord: |-
        $5$; $\frac14$
      uitwerking: |-
        $\dfrac{\sin 5h}{h} = 5 \cdot \dfrac{\sin 5h}{5h} \to 5 \cdot 1 = 5$, want met $u = 5h$ gaat ook $u$ naar $0$. En $\dfrac{\sin h}{4h} = \dfrac14 \cdot \dfrac{\sin h}{h} \to \dfrac14$.
    - opgave: |-
        Bereken $\displaystyle\lim_{h \to 0} \dfrac{\tan h}{h}$.
      antwoord: |-
        $1$
      uitwerking: |-
        $\dfrac{\tan h}{h} = \dfrac{\sin h}{h} \cdot \dfrac{1}{\cos h} \to 1 \cdot \dfrac11 = 1$.
    - opgave: |-
        Bereken $\frac{\sin 0{,}01}{0{,}01}$ met je rekentoestel, eerst in radialen en dan in graden. Verklaar het verschil.
      antwoord: |-
        $\approx 0{,}99998$; $\approx 0{,}01745$
      uitwerking: |-
        In radialen is het quotiënt ongeveer $0{,}99998$, dicht bij $1$. In graden is $0{,}01^\circ = 0{,}01 \cdot \frac{\pi}{180}$ radialen, dus $\sin 0{,}01^\circ \approx 0{,}01 \cdot \frac{\pi}{180}$ en het quotiënt is ongeveer $\frac{\pi}{180} \approx 0{,}01745$. De limiet is alleen $1$ in radialen: daar is de hoek de lengte van de boog.

- id: h3-sin
  soort: kort
  opgave: |-
    De sinus afleiden.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de raaklijn aan de grafiek van $f(x) = \sin x$ in het punt met $x = \pi$.
      antwoord: |-
        $y = -x + \pi$
      uitwerking: |-
        $f(\pi) = 0$ en $f'(\pi) = \cos\pi = -1$. Raaklijn: $y = 0 - 1 \cdot (x - \pi) = -x + \pi$.
    - opgave: |-
        Leid af: $\sin 7x$, \ $4\sin\frac{x}{3}$ \ en \ $x^2\sin x$.
      antwoord: |-
        $7\cos 7x$; $\frac43\cos\frac{x}{3}$; $2x\sin x + x^2\cos x$
      uitwerking: |-
        Kettingregel: $\cos 7x \cdot 7$. Veelvoud- en kettingregel: $4\cos\frac{x}{3} \cdot \frac13 = \frac43\cos\frac{x}{3}$. Productregel: $2x\sin x + x^2\cos x$.

- id: h3-exp
  soort: kort
  opgave: |-
    De functie $\e^x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Leid af: $\e^{4x}$, \ $\e^{x^2 + 1}$ \ en \ $5\e^{-x/2}$.
      antwoord: |-
        $4\e^{4x}$; $2x\,\e^{x^2 + 1}$; $-\frac52\e^{-x/2}$
      uitwerking: |-
        Telkens blijft $\e^u$ staan, maal $u'$: $\e^{4x} \cdot 4$, \ $\e^{x^2 + 1} \cdot 2x$ \ en \ $5\e^{-x/2} \cdot \bigl(-\frac12\bigr) = -\frac52\e^{-x/2}$.
    - opgave: |-
        Geef de raaklijn aan de grafiek van $\e^x$ in het punt $(0, 1)$.
      antwoord: |-
        $y = x + 1$
      uitwerking: |-
        De afgeleide in $0$ is $\e^0 = 1$: $y = 1 + 1 \cdot (x - 0) = x + 1$.
    - opgave: |-
        In welk punt van de grafiek van $\e^x$ heeft de raaklijn richtingscoëfficiënt $2$?
      antwoord: |-
        $(\ln 2, 2)$
      uitwerking: |-
        $(\e^x)' = \e^x = 2 \iff x = \ln 2$. Het punt is $(\ln 2, \e^{\ln 2}) = (\ln 2, 2)$: daar is de helling gelijk aan de hoogte.

- id: h3-ax
  soort: kort
  opgave: |-
    Leid af.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $5^x$
      antwoord: |-
        $5^x \ln 5$
      uitwerking: |-
        $(a^x)' = a^x \ln a$ met $a = 5$.
    - opgave: |-
        $2^{-x}$
      antwoord: |-
        $-2^{-x} \ln 2$
      uitwerking: |-
        Kettingregel: $2^{-x} \ln 2 \cdot (-1)$.
    - opgave: |-
        $4^{3x}$
      antwoord: |-
        $3 \cdot 4^{3x} \ln 4$
      uitwerking: |-
        $4^{3x} \ln 4 \cdot 3$.
    - opgave: |-
        $10^{x^2}$
      antwoord: |-
        $2x \cdot 10^{x^2} \ln 10$
      uitwerking: |-
        $10^{x^2} \ln 10 \cdot 2x$.

- id: h3-ln
  soort: kort
  opgave: |-
    De natuurlijke logaritme.
  lijst: enumerate
  delen:
    - opgave: |-
        Leid af: $\ln(x^2 + 3x)$ \ en \ $\ln x^3$.
      antwoord: |-
        $\frac{2x + 3}{x^2 + 3x}$; $\frac{3}{x}$
      uitwerking: |-
        $\dfrac{u'}{u}$ met $u = x^2 + 3x$: $\dfrac{2x + 3}{x^2 + 3x}$. En $\ln x^3 = 3\ln x$, met afgeleide $\dfrac{3}{x}$ (of met de kettingregel: $\dfrac{1}{x^3} \cdot 3x^2 = \dfrac{3}{x}$).
    - opgave: |-
        Toon op twee manieren aan dat $\ln 7x$ dezelfde afgeleide heeft als $\ln x$.
      antwoord: |-
        beide $\frac1x$
      uitwerking: |-
        Met de kettingregel: $\dfrac{1}{7x} \cdot 7 = \dfrac1x$. Met een rekenregel voor logaritmen: $\ln 7x = \ln 7 + \ln x$, en de constante $\ln 7$ heeft afgeleide $0$. De grafieken zijn verticaal verschoven, met overal dezelfde helling.
    - opgave: |-
        Geef de raaklijn aan de grafiek van $\ln x$ in het punt $(1, 0)$.
      antwoord: |-
        $y = x - 1$
      uitwerking: |-
        De afgeleide in $1$ is $\frac11 = 1$: $y = 0 + 1 \cdot (x - 1) = x - 1$. Dat is het spiegelbeeld van de raaklijn $y = x + 1$ aan $\e^x$ in $(0, 1)$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    gemengd afleiden
  opgave: |-
    Leid af.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x^2 - 3x)^4$
      antwoord: |-
        $4(x^2 - 3x)^3(2x - 3)$
      uitwerking: |-
        Buitenste $u^4$, binnenste $x^2 - 3x$ met afgeleide $2x - 3$: $4(x^2 - 3x)^3 \cdot (2x - 3)$.
    - opgave: |-
        $\sqrt{1 + \sin x}$
      antwoord: |-
        $\frac{\cos x}{2\sqrt{1 + \sin x}}$
      uitwerking: |-
        $\frac{1}{2\sqrt{1 + \sin x}} \cdot \cos x$.
    - opgave: |-
        $\e^{\sin x}$
      antwoord: |-
        $\cos x\,\e^{\sin x}$
      uitwerking: |-
        $\e^{\sin x} \cdot \cos x$.
    - opgave: |-
        $\ln(\cos x)$
      antwoord: |-
        $-\tan x$
      uitwerking: |-
        $\frac{1}{\cos x} \cdot (-\sin x) = -\tan x$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    raaklijnen
  opgave: |-
    Geef de raaklijn aan de grafiek van $\e^x$ in $x = 0$, en die van $\ln x$ in $x = 1$. Hoe liggen die twee raaklijnen tegenover elkaar?
  antwoord: |-
    $y = x + 1$; $y = x - 1$; elkaars spiegelbeeld om $y = x$
  uitwerking: |-
    $\e^0 = 1$ en $(\e^x)' = 1$ in $0$: $y = x + 1$. $\ln 1 = 0$ en $(\ln x)' = 1$ in $1$: $y = x - 1$. Ze zijn elkaars spiegelbeeld om $y = x$, net als de grafieken.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    een constante functie
  opgave: |-
    Leid $\sin^2 x + \cos^2 x$ af met de kettingregel. Wat verwachtte je?
  antwoord: |-
    0
  uitwerking: |-
    $2\sin x\cos x + 2\cos x \cdot (-\sin x) = 0$: zoals verwacht, want de functie is constant $1$.

- id: h3-o4
  soort: opdracht
  niveau: 2
  thema: |-
    horizontale raaklijn
  opgave: |-
    Waar heeft de grafiek van $f(x) = x\,\e^{-x}$ een horizontale raaklijn?
  antwoord: |-
    in $\bigl(1, \frac1\e\bigr)$
  uitwerking: |-
    $f'(x) = \e^{-x} - x\,\e^{-x} = (1 - x)\e^{-x}$. Omdat $\e^{-x} > 0$: $f'(x) = 0 \iff x = 1$. Het punt $\bigl(1, \frac1\e\bigr)$.

- id: h3-o5
  soort: opdracht
  niveau: 2
  thema: |-
    afkoelen
  opgave: |-
    Een kop thee koelt af volgens $T(t) = 20 + 70\,\e^{-0{,}05t}$ (in $^\circ$C, $t$ in minuten).
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $T'(t)$. Hoe snel koelt de thee af bij het begin, en na 20 minuten?
      antwoord: |-
        $T'(t) = -3{,}5\,\e^{-0{,}05t}$; $3{,}5$ en $\approx 1{,}29$ $^\circ$C per minuut
      uitwerking: |-
        $T'(t) = 70 \cdot (-0{,}05)\e^{-0{,}05t} = -3{,}5\,\e^{-0{,}05t}$. $T'(0) = -3{,}5$ en $T'(20) = -3{,}5\,\e^{-1} \approx -1{,}29$ $^\circ$C per minuut.
    - opgave: |-
        Toon aan dat $T'(t) = -0{,}05\,\bigl(T(t) - 20\bigr)$. Wat betekent dat?
      antwoord: |-
        de afkoelsnelheid is evenredig met het temperatuurverschil
      uitwerking: |-
        $T(t) - 20 = 70\,\e^{-0{,}05t}$, dus $-0{,}05(T - 20) = -3{,}5\,\e^{-0{,}05t} = T'(t)$. De thee koelt sneller af naarmate ze warmer is dan de kamer (wet van Newton).

- id: h3-o6
  soort: opdracht
  niveau: 2
  thema: |-
    een slinger
  opgave: |-
    De uitwijking van een slinger is $x(t) = 5\cos 2t$ (in cm, $t$ in seconden). Geef de snelheid $v(t) = x'(t)$. Wanneer is de snelheid het grootst, en waar is de slinger dan?
  antwoord: |-
    $v(t) = -10\sin 2t$; $|v| = 10$ cm/s als $x = 0$
  uitwerking: |-
    $v(t) = -5\sin 2t \cdot 2 = -10\sin 2t$. $|v|$ is maximaal $10$ cm/s als $\sin 2t = \pm 1$, bijvoorbeeld $t = \frac{\pi}{4}$. Dan is $\cos 2t = 0$: de slinger gaat door het evenwichtspunt.

- id: h3-o7
  soort: opdracht
  niveau: 3
  thema: |-
    tangens afleiden
  opgave: |-
    Bewijs met de quotiëntregel dat $(\tan x)' = \frac{1}{\cos^2 x}$, en ook dat dat gelijk is aan $1 + \tan^2 x$.
  antwoord: |-
    bewijs
  uitwerking: |-
    $\Bigl(\frac{\sin x}{\cos x}\Bigr)' = \frac{\cos x\cos x - \sin x(-\sin x)}{\cos^2 x} = \frac{\cos^2 x + \sin^2 x}{\cos^2 x} = \frac{1}{\cos^2 x}$, en dat is ook $\frac{\cos^2 x}{\cos^2 x} + \frac{\sin^2 x}{\cos^2 x} = 1 + \tan^2 x$.

- id: h3-o8
  soort: opdracht
  niveau: 3
  thema: |-
    x tot de macht x
  opgave: |-
    De functie $f(x) = x^x$ (voor $x > 0$) is geen macht en geen exponentiële functie. Schrijf ze als $\e^{x\ln x}$ en bereken $f'(x)$. Waar heeft de grafiek een horizontale raaklijn?
  antwoord: |-
    $x^x(\ln x + 1)$; in $x = \frac1\e$
  uitwerking: |-
    $x^x = \e^{\ln x^x} = \e^{x\ln x}$. Kettingregel: $\e^{x\ln x}(\ln x + 1) = x^x(\ln x + 1)$. Nul als $\ln x = -1$, dus $x = \frac{1}{\e}$.

- id: h3-o9
  soort: opdracht
  niveau: 1
  thema: |-
    drill: kettingregel met machten en wortels
  opgave: |-
    Leid af.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(5x - 1)^4$
      antwoord: |-
        $20(5x - 1)^3$
      uitwerking: |-
        $4(5x - 1)^3 \cdot 5$.
    - opgave: |-
        $(x^2 + 4)^3$
      antwoord: |-
        $6x(x^2 + 4)^2$
      uitwerking: |-
        $3(x^2 + 4)^2 \cdot 2x$.
    - opgave: |-
        $(1 - x^3)^5$
      antwoord: |-
        $-15x^2(1 - x^3)^4$
      uitwerking: |-
        $5(1 - x^3)^4 \cdot (-3x^2)$.
    - opgave: |-
        $\sqrt{2x + 7}$
      antwoord: |-
        $\dfrac{1}{\sqrt{2x + 7}}$
      uitwerking: |-
        $\dfrac{1}{2\sqrt{2x + 7}} \cdot 2$.
    - opgave: |-
        $\sqrt{x^3 + 1}$
      antwoord: |-
        $\dfrac{3x^2}{2\sqrt{x^3 + 1}}$
      uitwerking: |-
        $\dfrac{1}{2\sqrt{x^3 + 1}} \cdot 3x^2$.
    - opgave: |-
        $\dfrac{1}{(3x - 2)^2}$
      antwoord: |-
        $-\dfrac{6}{(3x - 2)^3}$
      uitwerking: |-
        $\bigl((3x - 2)^{-2}\bigr)' = -2(3x - 2)^{-3} \cdot 3$.
    - opgave: |-
        $\dfrac{4}{x^2 + 2}$
      antwoord: |-
        $-\dfrac{8x}{(x^2 + 2)^2}$
      uitwerking: |-
        $\bigl(4(x^2 + 2)^{-1}\bigr)' = -4(x^2 + 2)^{-2} \cdot 2x$.
    - opgave: |-
        $(x^2 - x)^{-3}$
      antwoord: |-
        $-\dfrac{3(2x - 1)}{(x^2 - x)^4}$
      uitwerking: |-
        $-3(x^2 - x)^{-4} \cdot (2x - 1)$.
    - opgave: |-
        $\sqrt[3]{3x + 1}$
      antwoord: |-
        $\dfrac{1}{\sqrt[3]{(3x + 1)^2}}$
      uitwerking: |-
        $\bigl((3x + 1)^{1/3}\bigr)' = \tfrac13 (3x + 1)^{-2/3} \cdot 3 = (3x + 1)^{-2/3}$.
    - opgave: |-
        $\dfrac{1}{\sqrt{1 - 2x}}$
      antwoord: |-
        $\dfrac{1}{(1 - 2x)\sqrt{1 - 2x}}$
      uitwerking: |-
        $\bigl((1 - 2x)^{-1/2}\bigr)' = -\tfrac12 (1 - 2x)^{-3/2} \cdot (-2) = (1 - 2x)^{-3/2}$.
    - opgave: |-
        $(2\sqrt{x} + 1)^3$
      antwoord: |-
        $\dfrac{3(2\sqrt{x} + 1)^2}{\sqrt{x}}$
      uitwerking: |-
        $3(2\sqrt{x} + 1)^2 \cdot 2 \cdot \dfrac{1}{2\sqrt{x}}$.
    - opgave: |-
        $\Bigl(x + \dfrac1x\Bigr)^2$
      antwoord: |-
        $2\Bigl(x + \dfrac1x\Bigr)\Bigl(1 - \dfrac{1}{x^2}\Bigr)$
      uitwerking: |-
        $2\bigl(x + \tfrac1x\bigr) \cdot \bigl(1 - \tfrac{1}{x^2}\bigr)$. Uitwerken mag ook: $2x - \dfrac{2}{x^3}$.

- id: h3-o10
  soort: opdracht
  niveau: 1
  thema: |-
    drill: kettingregel met sin, cos en tan
  opgave: |-
    Leid af.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin 5x$
      antwoord: |-
        $5\cos 5x$
      uitwerking: |-
        $\cos 5x \cdot 5$.
    - opgave: |-
        $\cos(1 - 2x)$
      antwoord: |-
        $2\sin(1 - 2x)$
      uitwerking: |-
        $-\sin(1 - 2x) \cdot (-2)$.
    - opgave: |-
        $\tan 4x$
      antwoord: |-
        $\dfrac{4}{\cos^2 4x}$
      uitwerking: |-
        $\dfrac{1}{\cos^2 4x} \cdot 4$.
    - opgave: |-
        $3\sin\dfrac{x}{2}$
      antwoord: |-
        $\dfrac32\cos\dfrac{x}{2}$
      uitwerking: |-
        $3\cos\dfrac{x}{2} \cdot \dfrac12$.
    - opgave: |-
        $\cos^2 x$
      antwoord: |-
        $-\sin 2x$
      uitwerking: |-
        $2\cos x \cdot (-\sin x) = -\sin 2x$.
    - opgave: |-
        $\sin^3 x$
      antwoord: |-
        $3\sin^2 x\cos x$
      uitwerking: |-
        $3\sin^2 x \cdot \cos x$.
    - opgave: |-
        $\sin\sqrt{x}$
      antwoord: |-
        $\dfrac{\cos\sqrt{x}}{2\sqrt{x}}$
      uitwerking: |-
        $\cos\sqrt{x} \cdot \dfrac{1}{2\sqrt{x}}$.
    - opgave: |-
        $\cos(x^2 + 1)$
      antwoord: |-
        $-2x\sin(x^2 + 1)$
      uitwerking: |-
        $-\sin(x^2 + 1) \cdot 2x$.
    - opgave: |-
        $\tan^2 x$
      antwoord: |-
        $\dfrac{2\tan x}{\cos^2 x}$
      uitwerking: |-
        $2\tan x \cdot \dfrac{1}{\cos^2 x}$.
    - opgave: |-
        $\dfrac{1}{\cos x}$
      antwoord: |-
        $\dfrac{\sin x}{\cos^2 x}$
      uitwerking: |-
        $\bigl((\cos x)^{-1}\bigr)' = -(\cos x)^{-2} \cdot (-\sin x)$.
    - opgave: |-
        $\sqrt{\sin x}$
      antwoord: |-
        $\dfrac{\cos x}{2\sqrt{\sin x}}$
      uitwerking: |-
        $\dfrac{1}{2\sqrt{\sin x}} \cdot \cos x$.
    - opgave: |-
        $\sin(\cos x)$
      antwoord: |-
        $-\sin x\cos(\cos x)$
      uitwerking: |-
        $\cos(\cos x) \cdot (-\sin x)$.

- id: h3-o11
  soort: opdracht
  niveau: 1
  thema: |-
    drill: kettingregel met exponentiële functies en logaritmen
  opgave: |-
    Leid af.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\e^{-4x}$
      antwoord: |-
        $-4\e^{-4x}$
      uitwerking: |-
        $\e^{-4x} \cdot (-4)$.
    - opgave: |-
        $\e^{x^2 - 1}$
      antwoord: |-
        $2x\,\e^{x^2 - 1}$
      uitwerking: |-
        $\e^{x^2 - 1} \cdot 2x$.
    - opgave: |-
        $3\e^{x/3}$
      antwoord: |-
        $\e^{x/3}$
      uitwerking: |-
        $3\e^{x/3} \cdot \tfrac13$.
    - opgave: |-
        $\e^{\sqrt{x}}$
      antwoord: |-
        $\dfrac{\e^{\sqrt{x}}}{2\sqrt{x}}$
      uitwerking: |-
        $\e^{\sqrt{x}} \cdot \dfrac{1}{2\sqrt{x}}$.
    - opgave: |-
        $10^x$
      antwoord: |-
        $10^x\ln 10$
      uitwerking: |-
        $(a^x)' = a^x\ln a$ met $a = 10$.
    - opgave: |-
        $2^{3x}$
      antwoord: |-
        $3 \cdot 2^{3x}\ln 2$
      uitwerking: |-
        $2^{3x}\ln 2 \cdot 3$.
    - opgave: |-
        $5^{x^2}$
      antwoord: |-
        $2x \cdot 5^{x^2}\ln 5$
      uitwerking: |-
        $5^{x^2}\ln 5 \cdot 2x$.
    - opgave: |-
        $\ln(4x + 1)$
      antwoord: |-
        $\dfrac{4}{4x + 1}$
      uitwerking: |-
        $\dfrac{1}{4x + 1} \cdot 4$.
    - opgave: |-
        $\ln(x^2 + x)$
      antwoord: |-
        $\dfrac{2x + 1}{x^2 + x}$
      uitwerking: |-
        $\dfrac{1}{x^2 + x} \cdot (2x + 1)$.
    - opgave: |-
        $\ln\sqrt{x}$
      antwoord: |-
        $\dfrac{1}{2x}$
      uitwerking: |-
        $\ln\sqrt{x} = \tfrac12\ln x$, dus $\dfrac{1}{2x}$. Met de kettingregel: $\dfrac{1}{\sqrt{x}} \cdot \dfrac{1}{2\sqrt{x}}$, hetzelfde.
    - opgave: |-
        $\log_3 x$
      antwoord: |-
        $\dfrac{1}{x\ln 3}$
      uitwerking: |-
        $(\log_a x)' = \dfrac{1}{x\ln a}$ met $a = 3$.
    - opgave: |-
        $\log_2(x^2 + 1)$
      antwoord: |-
        $\dfrac{2x}{(x^2 + 1)\ln 2}$
      uitwerking: |-
        $\dfrac{1}{(x^2 + 1)\ln 2} \cdot 2x$.

- id: h3-o12
  soort: opdracht
  niveau: 1
  thema: |-
    welke regel eerst: product, quotiënt of ketting
  opgave: |-
    Welke regel heb je als eerste nodig: de productregel, de quotiëntregel of de kettingregel? Je hoeft niet af te leiden.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $x\sin x$
      antwoord: |-
        product
      uitwerking: |-
        Een product van $x$ en $\sin x$.
    - opgave: |-
        $\sin x^2$
      antwoord: |-
        ketting
      uitwerking: |-
        De sinus van $x^2$: binnenste $x^2$.
    - opgave: |-
        $\sin^2 x$
      antwoord: |-
        ketting
      uitwerking: |-
        Het kwadraat van $\sin x$: buitenste $u^2$.
    - opgave: |-
        $\dfrac{\e^x}{x}$
      antwoord: |-
        quotiënt
      uitwerking: |-
        Een quotiënt met $x$ in de noemer.
    - opgave: |-
        $\e^{x/2}$
      antwoord: |-
        ketting
      uitwerking: |-
        Binnenste $\tfrac{x}{2}$.
    - opgave: |-
        $(\ln x)^3$
      antwoord: |-
        ketting
      uitwerking: |-
        Buitenste $u^3$, binnenste $\ln x$.
    - opgave: |-
        $\dfrac{\sin x}{5}$
      antwoord: |-
        geen: constante factor
      uitwerking: |-
        Dat is $\tfrac15 \sin x$: een constante factor, de quotiëntregel is niet nodig. De afgeleide is $\tfrac15\cos x$.
    - opgave: |-
        $x^2\e^{3x}$
      antwoord: |-
        product
      uitwerking: |-
        Een product; voor de factor $\e^{3x}$ heb je daarna de kettingregel nodig.

- id: h3-o13
  soort: opdracht
  niveau: 1
  thema: |-
    notatie van Leibniz
  opgave: |-
    Bereken $\dfrac{\mathrm{d}y}{\mathrm{d}x}$ met $\dfrac{\mathrm{d}y}{\mathrm{d}x} = \dfrac{\mathrm{d}y}{\mathrm{d}u} \cdot \dfrac{\mathrm{d}u}{\mathrm{d}x}$, en schrijf het resultaat met $x$.
  lijst: enumerate
  delen:
    - opgave: |-
        $y = u^3$ en $u = 2x^2 - 1$.
      antwoord: |-
        $12x(2x^2 - 1)^2$
      uitwerking: |-
        $\frac{\mathrm{d}y}{\mathrm{d}u} = 3u^2$ en $\frac{\mathrm{d}u}{\mathrm{d}x} = 4x$, dus $\frac{\mathrm{d}y}{\mathrm{d}x} = 3u^2 \cdot 4x = 12x(2x^2 - 1)^2$.
    - opgave: |-
        $y = \ln u$ en $u = 1 + \e^x$.
      antwoord: |-
        $\dfrac{\e^x}{1 + \e^x}$
      uitwerking: |-
        $\frac{\mathrm{d}y}{\mathrm{d}u} = \frac1u$ en $\frac{\mathrm{d}u}{\mathrm{d}x} = \e^x$, dus $\frac{\mathrm{d}y}{\mathrm{d}x} = \dfrac{\e^x}{1 + \e^x}$.
    - opgave: |-
        $y = \sin u$ en $u = \sqrt{x}$. Bereken ook de waarde in $x = \frac{\pi^2}{9}$.
      antwoord: |-
        $\dfrac{\cos\sqrt{x}}{2\sqrt{x}}$; $\dfrac{3}{4\pi}$
      uitwerking: |-
        $\frac{\mathrm{d}y}{\mathrm{d}u} = \cos u$ en $\frac{\mathrm{d}u}{\mathrm{d}x} = \frac{1}{2\sqrt{x}}$, dus $\frac{\mathrm{d}y}{\mathrm{d}x} = \dfrac{\cos\sqrt{x}}{2\sqrt{x}}$. In $x = \frac{\pi^2}{9}$ is $\sqrt{x} = \frac{\pi}{3}$: $\dfrac{\cos\frac{\pi}{3}}{2 \cdot \frac{\pi}{3}} = \dfrac{1/2}{2\pi/3} = \dfrac{3}{4\pi}$.

- id: h3-o14
  soort: opdracht
  niveau: 1
  thema: |-
    kettingregel met een tabel
  opgave: |-
    Van twee functies $f$ en $g$ ken je alleen deze waarden.

    \vspace{1mm}
    {\renewcommand{\arraystretch}{1.2}%
    \begin{tabular}{c|ccc}
    $x$ & $1$ & $2$ & $3$ \\ \hline
    $f(x)$ & $3$ & $1$ & $2$ \\
    $f'(x)$ & $-1$ & $4$ & $2$ \\
    $g(x)$ & $2$ & $3$ & $1$ \\
    $g'(x)$ & $5$ & $-2$ & $3$
    \end{tabular}}
  lijst: enumerate
  delen:
    - opgave: |-
        Neem $h(x) = f\bigl(g(x)\bigr)$. Bereken $h(1)$ en $h'(1)$.
      antwoord: |-
        $1$; $20$
      uitwerking: |-
        $h(1) = f(g(1)) = f(2) = 1$. $h'(1) = f'(g(1)) \cdot g'(1) = f'(2) \cdot 5 = 4 \cdot 5 = 20$.
    - opgave: |-
        Neem $k(x) = g\bigl(f(x)\bigr)$. Bereken $k'(1)$.
      antwoord: |-
        $-3$
      uitwerking: |-
        $k'(1) = g'(f(1)) \cdot f'(1) = g'(3) \cdot (-1) = -3$.
    - opgave: |-
        Bereken de afgeleide van $\bigl(f(x)\bigr)^2$ in $x = 3$.
      antwoord: |-
        $8$
      uitwerking: |-
        $\bigl(f(x)^2\bigr)' = 2f(x)f'(x)$; in $3$: $2 \cdot 2 \cdot 2 = 8$.
    - opgave: |-
        Bereken de afgeleide van $f(2x)$ in $x = 1$.
      antwoord: |-
        $8$
      uitwerking: |-
        $\bigl(f(2x)\bigr)' = f'(2x) \cdot 2$; in $1$: $f'(2) \cdot 2 = 8$.
    - opgave: |-
        Bereken de afgeleide van $g\bigl(g(x)\bigr)$ in $x = 2$.
      antwoord: |-
        $-6$
      uitwerking: |-
        $g'(g(2)) \cdot g'(2) = g'(3) \cdot (-2) = 3 \cdot (-2) = -6$.

- id: h3-o15
  soort: opdracht
  niveau: 1
  thema: |-
    raaklijnen met de kettingregel
  opgave: |-
    Geef een vergelijking van de raaklijn aan de grafiek in het gegeven punt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = \sin 2x$ in $x = 0$
      antwoord: |-
        $y = 2x$
      uitwerking: |-
        $y(0) = 0$; $y' = 2\cos 2x$, dus $y'(0) = 2$. Raaklijn: $y = 0 + 2(x - 0) = 2x$.
    - opgave: |-
        $y = \sqrt{2x + 5}$ in $x = 2$
      antwoord: |-
        $y = \tfrac13 x + \tfrac73$
      uitwerking: |-
        $y(2) = 3$; $y' = \dfrac{1}{\sqrt{2x + 5}}$, dus $y'(2) = \tfrac13$. Raaklijn: $y = 3 + \tfrac13(x - 2) = \tfrac13 x + \tfrac73$.
    - opgave: |-
        $y = \e^{1 - x}$ in $x = 1$
      antwoord: |-
        $y = -x + 2$
      uitwerking: |-
        $y(1) = 1$; $y' = -\e^{1 - x}$, dus $y'(1) = -1$. Raaklijn: $y = 1 - (x - 1) = -x + 2$.
    - opgave: |-
        $y = \ln(2x - 1)$ in $x = 1$
      antwoord: |-
        $y = 2x - 2$
      uitwerking: |-
        $y(1) = \ln 1 = 0$; $y' = \dfrac{2}{2x - 1}$, dus $y'(1) = 2$. Raaklijn: $y = 2(x - 1) = 2x - 2$.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    drill: product- en quotiëntregel samen met de kettingregel
  opgave: |-
    Leid af en vereenvoudig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x(2x + 1)^3$
      antwoord: |-
        $(2x + 1)^2(8x + 1)$
      uitwerking: |-
        $(2x + 1)^3 + x \cdot 3(2x + 1)^2 \cdot 2 = (2x + 1)^2(2x + 1 + 6x)$.
    - opgave: |-
        $x^2\sqrt{1 - x}$
      antwoord: |-
        $\dfrac{x(4 - 5x)}{2\sqrt{1 - x}}$
      uitwerking: |-
        $2x\sqrt{1 - x} - \dfrac{x^2}{2\sqrt{1 - x}} = \dfrac{4x(1 - x) - x^2}{2\sqrt{1 - x}}$.
    - opgave: |-
        $x\,\e^{-2x}$
      antwoord: |-
        $(1 - 2x)\e^{-2x}$
      uitwerking: |-
        $\e^{-2x} + x \cdot (-2)\e^{-2x}$.
    - opgave: |-
        $\e^x\sin 2x$
      antwoord: |-
        $\e^x(\sin 2x + 2\cos 2x)$
      uitwerking: |-
        $\e^x\sin 2x + \e^x \cdot 2\cos 2x$.
    - opgave: |-
        $\dfrac{x}{\sqrt{x^2 + 1}}$
      antwoord: |-
        $\dfrac{1}{(x^2 + 1)\sqrt{x^2 + 1}}$
      uitwerking: |-
        $\dfrac{\sqrt{x^2 + 1} - x \cdot \frac{x}{\sqrt{x^2 + 1}}}{x^2 + 1}$; maal $\sqrt{x^2 + 1}$ boven en onder: $\dfrac{x^2 + 1 - x^2}{(x^2 + 1)\sqrt{x^2 + 1}}$.
    - opgave: |-
        $\dfrac{\e^{2x}}{x}$
      antwoord: |-
        $\dfrac{(2x - 1)\e^{2x}}{x^2}$
      uitwerking: |-
        $\dfrac{2\e^{2x} \cdot x - \e^{2x} \cdot 1}{x^2}$.
    - opgave: |-
        $x\ln(x^2)$
      antwoord: |-
        $\ln(x^2) + 2$
      uitwerking: |-
        $1 \cdot \ln(x^2) + x \cdot \dfrac{2x}{x^2} = \ln(x^2) + 2$.
    - opgave: |-
        $\dfrac{\sin 3x}{x}$
      antwoord: |-
        $\dfrac{3x\cos 3x - \sin 3x}{x^2}$
      uitwerking: |-
        $\dfrac{3\cos 3x \cdot x - \sin 3x \cdot 1}{x^2}$.
    - opgave: |-
        $\sin x\cos^2 x$
      antwoord: |-
        $\cos^3 x - 2\sin^2 x\cos x$
      uitwerking: |-
        $\cos x \cdot \cos^2 x + \sin x \cdot 2\cos x \cdot (-\sin x)$.
    - opgave: |-
        $\dfrac{1}{1 + \e^{-x}}$
      antwoord: |-
        $\dfrac{\e^{-x}}{(1 + \e^{-x})^2}$
      uitwerking: |-
        $-(1 + \e^{-x})^{-2} \cdot (-\e^{-x})$.
    - opgave: |-
        $\e^{-x}\cos x$
      antwoord: |-
        $-\e^{-x}(\cos x + \sin x)$
      uitwerking: |-
        $-\e^{-x}\cos x + \e^{-x} \cdot (-\sin x)$.
    - opgave: |-
        $x^2\ln 3x$
      antwoord: |-
        $2x\ln 3x + x$
      uitwerking: |-
        $2x\ln 3x + x^2 \cdot \dfrac{3}{3x} = 2x\ln 3x + x$.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    waar zit de fout: klassieke fouten met de kettingregel
  opgave: |-
    Waar zit de fout? Zeg wat er misloopt, en geef de juiste afgeleide.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(\sin x^2)' = \cos 2x$
      antwoord: |-
        $2x\cos x^2$
      uitwerking: |-
        De binnenste $x^2$ moet blijven staan, en dan pas vermenigvuldig je met zijn afgeleide: $\cos x^2 \cdot 2x$.
    - opgave: |-
        $(\e^{3x})' = \e^{3x}$
      antwoord: |-
        $3\e^{3x}$
      uitwerking: |-
        De afgeleide van de binnenste $3x$ ontbreekt: $\e^{3x} \cdot 3$.
    - opgave: |-
        $(\ln 2x)' = \dfrac{1}{2x}$
      antwoord: |-
        $\dfrac1x$
      uitwerking: |-
        Ook hier ontbreekt de factor $2$: $\dfrac{1}{2x} \cdot 2 = \dfrac1x$. Dat klopt met $\ln 2x = \ln 2 + \ln x$.
    - opgave: |-
        $(2^x)' = x \cdot 2^{x - 1}$
      antwoord: |-
        $2^x\ln 2$
      uitwerking: |-
        De machtregel geldt voor $x^r$ met een vaste exponent, niet als $x$ in de exponent staat. Juist: $(a^x)' = a^x\ln a$.
    - opgave: |-
        $(\cos 3x)' = 3\sin 3x$
      antwoord: |-
        $-3\sin 3x$
      uitwerking: |-
        Het minteken van $(\cos u)' = -\sin u$ is vergeten.
    - opgave: |-
        $(\e^{x^2})' = x^2\e^{x^2 - 1}$
      antwoord: |-
        $2x\,\e^{x^2}$
      uitwerking: |-
        Weer de machtregel op een exponentiële functie. Juist: $\e^{x^2} \cdot 2x$.

- id: h3-o18
  soort: opdracht
  niveau: 2
  thema: |-
    kettingregel met grafieken aflezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.55cm,font=\scriptsize]
        \rooster{0}{1}{6}{0}{1}{5}
        \draw[accent,thick] (0,1) -- (4,5) -- (6,4);
        \draw[accent,thick,dashed] (0,5) -- (2,1) -- (6,3);
        \node[above,text=accent] at (5,4.5) {$f$};
        \node[below right,text=accent] at (5,2.5) {$g$};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafieken van $f$ (volle lijn) en $g$ (streepjes). Neem $h(x) = f\bigl(g(x)\bigr)$ en $k(x) = g\bigl(f(x)\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af: $g(1)$, $g'(1)$, $f(3)$ en $f'(3)$.
      antwoord: |-
        $3$; $-2$; $4$; $1$
      uitwerking: |-
        $g(1) = 3$. Op $[0, 2]$ is $g$ een rechte met helling $\frac{1 - 5}{2} = -2$. $f(3) = 4$, en op $[0, 4]$ heeft $f$ helling $\frac{5 - 1}{4} = 1$.
    - opgave: |-
        Bereken $h(1)$ en $h'(1)$.
      antwoord: |-
        $4$; $-2$
      uitwerking: |-
        $h(1) = f(g(1)) = f(3) = 4$. $h'(1) = f'(g(1)) \cdot g'(1) = f'(3) \cdot (-2) = -2$.
    - opgave: |-
        Bereken $h'(4)$ en $k'(3)$.
      antwoord: |-
        $\tfrac12$; $\tfrac12$
      uitwerking: |-
        $g(4) = 2$, $g'(4) = \frac12$ en $f'(2) = 1$: $h'(4) = 1 \cdot \frac12 = \frac12$. $f(3) = 4$, $f'(3) = 1$ en $g'(4) = \frac12$: $k'(3) = g'(4) \cdot f'(3) = \frac12$.
    - opgave: |-
        Bestaat $h'(2)$? Verklaar.
      antwoord: |-
        nee: $g$ heeft een knik in $2$
      uitwerking: |-
        Neen. $g$ heeft in $2$ een knik: links is de helling $-2$, rechts $\frac12$. Rond $g(2) = 1$ heeft $f$ helling $1$, dus $h$ heeft links helling $1 \cdot (-2) = -2$ en rechts $1 \cdot \frac12 = \frac12$: ook $h$ heeft een knik in $2$.

- id: h3-o19
  soort: opdracht
  niveau: 2
  thema: |-
    grafiek van de afgeleide kiezen
  opgave: |-
    De eerste figuur toont $f(x) = \sin 2x$ op $[0, 2\pi]$. Welke van de grafieken A, B of C is die van $f'$? Verklaar zonder te rekenen waarom de twee andere niet kunnen.

    \figuren{\begin{tikzpicture}[x=.3cm,y=.4cm,font=\scriptsize]
      \roosterleeg{0}{1}{6.2832}{-2}{1}{2}
      \kromme{0}{6.2832}{sin(2*\x r)}
      \node[below] at (3.1416,0) {$\pi$}; \node[left] at (0,1) {$1$};
      \node[above,text=accent] at (1,2) {$f$};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.3cm,y=.4cm,font=\scriptsize]
      \roosterleeg{0}{1}{6.2832}{-2}{1}{2}
      \kromme{0}{6.2832}{2*cos(2*\x r)}
      \node[below] at (3.1416,0) {$\pi$}; \node[left] at (0,1) {$1$};
      \node[above,text=accent] at (5,2) {A};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.3cm,y=.4cm,font=\scriptsize]
      \roosterleeg{0}{1}{6.2832}{-2}{1}{2}
      \kromme{0}{6.2832}{cos(2*\x r)}
      \node[below] at (3.1416,0) {$\pi$}; \node[left] at (0,1) {$1$};
      \node[above,text=accent] at (5,2) {B};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.3cm,y=.4cm,font=\scriptsize]
      \roosterleeg{0}{1}{6.2832}{-2}{1}{2}
      \kromme{0}{6.2832}{2*cos(\x r)}
      \node[below] at (3.1416,0) {$\pi$}; \node[left] at (0,1) {$1$};
      \node[above,text=accent] at (5,2) {C};
    \end{tikzpicture}}
  antwoord: |-
    A
  uitwerking: |-
    $f'(x) = 2\cos 2x$: grafiek A. In $0$ stijgt $f$ even steil als de rechte $y = 2x$, dus $f'(0) = 2$; B heeft daar de waarde $1$ (de factor $2$ van de binnenste functie is vergeten). $f$ herhaalt zich na $\pi$, dus $f'$ ook; C herhaalt zich pas na $2\pi$ (dat is $2\cos x$, de binnenste functie is vergeten).

- id: h3-o20
  soort: opdracht
  niveau: 2
  thema: |-
    groeisnelheid van een boom
  figuur:
    code: |-
      \begin{tikzpicture}[x=.2cm,y=.09cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=5,ystep=10] (0,0) grid (20,30);
        \draw[->,grijs] (0,0) -- (22.0,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,34.0) node[above,text=black] {$h$};
        \foreach \t in {5,10,15,20} \node[below,inner sep=1.5pt] at (\t,0) {$\t$};
        \foreach \t in {10,20,30} \node[left,inner sep=1.5pt] at (0,\t) {$\t$};
        \kromme{0}{20}{30/(1+9*exp(-0.4*\x))}
        \draw[grijs,dashed] (0,30) -- (20,30);
      \end{tikzpicture}
  opgave: |-
    Een jonge boom van $3$ m groeit volgens
    \[h(t) = \frac{30}{1 + 9\,\e^{-0{,}4t}}\]
    (in meter, $t$ in jaar).
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $h'(t) = \dfrac{108\,\e^{-0{,}4t}}{(1 + 9\,\e^{-0{,}4t})^2}$.
      antwoord: |-
        kettingregel
      uitwerking: |-
        $h(t) = 30(1 + 9\,\e^{-0{,}4t})^{-1}$, dus $h'(t) = -30(1 + 9\,\e^{-0{,}4t})^{-2} \cdot 9\,\e^{-0{,}4t} \cdot (-0{,}4) = \dfrac{108\,\e^{-0{,}4t}}{(1 + 9\,\e^{-0{,}4t})^2}$.
    - opgave: |-
        Hoe snel groeit de boom bij het planten, en na $10$ jaar? Rond af op twee decimalen.
      antwoord: |-
        $1{,}08$ m per jaar; $\approx 1{,}46$ m per jaar
      uitwerking: |-
        $h'(0) = \dfrac{108}{10^2} = 1{,}08$ m per jaar. $h'(10) = \dfrac{108\,\e^{-4}}{(1 + 9\,\e^{-4})^2} \approx 1{,}46$ m per jaar.
    - opgave: |-
        Na hoeveel jaar is de boom $15$ m hoog? Hoe snel groeit hij dan?
      antwoord: |-
        $t = \dfrac{\ln 9}{0{,}4} \approx 5{,}49$ jaar; $3$ m per jaar
      uitwerking: |-
        $\dfrac{30}{1 + 9\,\e^{-0{,}4t}} = 15 \iff 9\,\e^{-0{,}4t} = 1 \iff t = \dfrac{\ln 9}{0{,}4} \approx 5{,}49$. Dan is $\e^{-0{,}4t} = \frac19$, dus $h'(t) = \dfrac{108 \cdot \frac19}{2^2} = 3$ m per jaar. Op de grafiek is de boom daar het steilst.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    veranderingssnelheden koppelen: een ballon
  opgave: |-
    Je blaast een bolvormige ballon op. De straal neemt toe met $0{,}5$ cm per seconde. Gebruik $V = \tfrac43\pi r^3$, $A = 4\pi r^2$ en $\frac{\mathrm{d}V}{\mathrm{d}t} = \frac{\mathrm{d}V}{\mathrm{d}r} \cdot \frac{\mathrm{d}r}{\mathrm{d}t}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe snel neemt het volume toe op het ogenblik dat de straal $10$ cm is?
      antwoord: |-
        $200\pi \approx 628$ cm$^3$ per seconde
      uitwerking: |-
        $\frac{\mathrm{d}V}{\mathrm{d}r} = 4\pi r^2$ en $\frac{\mathrm{d}r}{\mathrm{d}t} = 0{,}5$, dus $\frac{\mathrm{d}V}{\mathrm{d}t} = 4\pi \cdot 100 \cdot 0{,}5 = 200\pi \approx 628$ cm$^3$ per seconde.
    - opgave: |-
        Hoe snel neemt de oppervlakte dan toe?
      antwoord: |-
        $40\pi \approx 126$ cm$^2$ per seconde
      uitwerking: |-
        $\frac{\mathrm{d}A}{\mathrm{d}t} = 8\pi r \cdot 0{,}5 = 8\pi \cdot 10 \cdot 0{,}5 = 40\pi \approx 126$ cm$^2$ per seconde.
    - opgave: |-
        Bij welke straal neemt het volume toe met $1000$ cm$^3$ per seconde? Rond af op $0{,}1$ cm.
      antwoord: |-
        $\approx 12{,}6$ cm
      uitwerking: |-
        $4\pi r^2 \cdot 0{,}5 = 1000 \iff r^2 = \dfrac{500}{\pi} \iff r \approx 12{,}6$ cm. Het volume groeit steeds sneller, hoewel de straal gelijkmatig groeit.

- id: h3-o22
  soort: opdracht
  niveau: 2
  thema: |-
    snelheid van het getij
  figuur:
    code: |-
      \begin{tikzpicture}[x=.17cm,y=.42cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=6,ystep=1] (0,0) grid (24,5);
        \draw[->,grijs] (0,0) -- (26.4,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,5.4) node[above,text=black] {$h$};
        \foreach \t in {6,12,18,24} \node[below,inner sep=1.5pt] at (\t,0) {$\t$};
        \foreach \t in {1,2,3,4,5} \node[left,inner sep=1.5pt] at (0,\t) {$\t$};
        \kromme{0}{24}{3+1.5*sin(30*\x)}
      \end{tikzpicture}
  opgave: |-
    In een haven is de waterhoogte $h(t) = 3 + 1{,}5\sin\tfrac{\pi t}{6}$ (in meter, $t$ in uur na middernacht).
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $h'(t)$. Hoe snel stijgt het water om middernacht? Rond af op een centimeter per uur.
      antwoord: |-
        $h'(t) = \dfrac{\pi}{4}\cos\dfrac{\pi t}{6}$; $\approx 79$ cm per uur
      uitwerking: |-
        $h'(t) = 1{,}5\cos\dfrac{\pi t}{6} \cdot \dfrac{\pi}{6} = \dfrac{\pi}{4}\cos\dfrac{\pi t}{6}$. $h'(0) = \dfrac{\pi}{4} \approx 0{,}785$ m per uur, dus ongeveer $79$ cm per uur.
    - opgave: |-
        Stijgt of daalt het water om 4 uur, en hoe snel?
      antwoord: |-
        daalt, $\frac{\pi}{8} \approx 0{,}39$ m per uur
      uitwerking: |-
        $h'(4) = \dfrac{\pi}{4}\cos\dfrac{2\pi}{3} = -\dfrac{\pi}{8} \approx -0{,}39$: het water daalt met ongeveer $39$ cm per uur.
    - opgave: |-
        Wanneer stijgt het water het snelst, en hoe hoog staat het dan?
      antwoord: |-
        om $0$, $12$ en $24$ uur; $3$ m
      uitwerking: |-
        $h'(t)$ is het grootst als $\cos\frac{\pi t}{6} = 1$, dus $\frac{\pi t}{6} = k \cdot 2\pi$, of $t = 0$, $12$ of $24$. Dan is $\sin\frac{\pi t}{6} = 0$ en $h = 3$ m: het water stijgt het snelst halfweg tussen eb en vloed.

- id: h3-o23
  soort: opdracht
  niveau: 2
  thema: |-
    concentratie van een medicijn
  figuur:
    code: |-
      \begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=2,ystep=2] (0,0) grid (10,6);
        \draw[->,grijs] (0,0) -- (10.8,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,6.8) node[above,text=black] {$C$};
        \foreach \t in {2,4,6,8,10} \node[below,inner sep=1.5pt] at (\t,0) {$\t$};
        \foreach \t in {2,4,6} \node[left,inner sep=1.5pt] at (0,\t) {$\t$};
        \kromme{0}{10}{10*(exp(-\x/5)-exp(-\x))}
      \end{tikzpicture}
  opgave: |-
    Na het innemen van een pil is de concentratie van het medicijn in het bloed $C(t) = 10\bigl(\e^{-0{,}2t} - \e^{-t}\bigr)$ (in mg/L, $t$ in uur).
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $C'(t)$ en $C'(0)$.
      antwoord: |-
        $C'(t) = 10\bigl(\e^{-t} - 0{,}2\,\e^{-0{,}2t}\bigr)$; $8$ mg/L per uur
      uitwerking: |-
        $C'(t) = 10\bigl(-0{,}2\,\e^{-0{,}2t} + \e^{-t}\bigr)$. $C'(0) = 10(1 - 0{,}2) = 8$ mg/L per uur.
    - opgave: |-
        Op welk ogenblik is de raaklijn horizontaal? Hoe groot is de concentratie dan? Rond af op twee decimalen.
      antwoord: |-
        $t = \dfrac{\ln 5}{0{,}8} \approx 2{,}01$ uur; $\approx 5{,}35$ mg/L
      uitwerking: |-
        $C'(t) = 0 \iff \e^{-t} = 0{,}2\,\e^{-0{,}2t} \iff \e^{-0{,}8t} = 0{,}2 \iff t = \dfrac{\ln 5}{0{,}8} \approx 2{,}01$ uur. Dan is $C \approx 10(0{,}6687 - 0{,}1337) \approx 5{,}35$ mg/L: het hoogste punt van de grafiek.
    - opgave: |-
        Hoe snel verandert de concentratie na $6$ uur?
      antwoord: |-
        daalt met $\approx 0{,}58$ mg/L per uur
      uitwerking: |-
        $C'(6) = 10\bigl(\e^{-6} - 0{,}2\,\e^{-1{,}2}\bigr) \approx 10(0{,}0025 - 0{,}0602) \approx -0{,}58$: de concentratie daalt met ongeveer $0{,}58$ mg/L per uur.

- id: h3-o24
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijn met een voorwaarde
  opgave: |-
    Raaklijnen met een voorwaarde.
  lijst: enumerate
  delen:
    - opgave: |-
        In welk punt van de grafiek van $y = \sqrt{2x - 1}$ is de raaklijn evenwijdig met de rechte $y = \tfrac13 x$? Geef ook die raaklijn.
      antwoord: |-
        $(5, 3)$; $y = \tfrac13 x + \tfrac43$
      uitwerking: |-
        $y' = \dfrac{1}{2\sqrt{2x - 1}} \cdot 2 = \dfrac{1}{\sqrt{2x - 1}}$. Evenwijdig: $\dfrac{1}{\sqrt{2x - 1}} = \dfrac13 \iff 2x - 1 = 9 \iff x = 5$, met $y = 3$. Raaklijn: $y = 3 + \tfrac13(x - 5) = \tfrac13 x + \tfrac43$.
    - opgave: |-
        Een raaklijn aan de grafiek van $y = \e^{2x}$ gaat door de oorsprong. Bepaal het raakpunt en de vergelijking van die raaklijn.
      antwoord: |-
        $\bigl(\tfrac12, \e\bigr)$; $y = 2\e\,x$
      uitwerking: |-
        De raaklijn in $x = a$ is $y = \e^{2a} + 2\e^{2a}(x - a)$. Door $(0, 0)$: $0 = \e^{2a}(1 - 2a)$, en omdat $\e^{2a} > 0$ is $a = \tfrac12$. Raakpunt $\bigl(\tfrac12, \e\bigr)$, raaklijn $y = \e + 2\e\bigl(x - \tfrac12\bigr) = 2\e\,x$.

- id: h3-o25
  soort: opdracht
  niveau: 3
  thema: |-
    hyperbolische functies cosh en sinh
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.4cm,font=\scriptsize]
        \rooster{-2}{1}{2}{-3}{1}{4}
        \kromme{-2}{2}{(exp(\x)+exp(-\x))/2}
        \kromme[dashed]{-1.9}{1.9}{(exp(\x)-exp(-\x))/2}
        \node[right,text=accent] at (2,3.76) {$\cosh$};
        \node[left,text=accent] at (-1.9,-3.2) {$\sinh$};
      \end{tikzpicture}
  opgave: |-
    Een hangende ketting heeft de vorm van de grafiek van de \textit{cosinus hyperbolicus}. Samen met de \textit{sinus hyperbolicus} is die zo gedefinieerd:
    \[\cosh x = \frac{\e^x + \e^{-x}}{2} \qquad \sinh x = \frac{\e^x - \e^{-x}}{2}\]
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $(\cosh x)' = \sinh x$ en $(\sinh x)' = \cosh x$. Welk verschil zie je met $\cos$ en $\sin$?
      antwoord: |-
        er komt geen minteken bij
      uitwerking: |-
        $(\e^{-x})' = -\e^{-x}$, dus $(\cosh x)' = \dfrac{\e^x - \e^{-x}}{2} = \sinh x$ en $(\sinh x)' = \dfrac{\e^x + \e^{-x}}{2} = \cosh x$. Bij $(\cos x)' = -\sin x$ staat er een minteken, hier niet.
    - opgave: |-
        Toon aan dat $\cosh^2 x - \sinh^2 x = 1$. Vergelijk met de grondformule van de goniometrie.
      antwoord: |-
        een min in plaats van een plus
      uitwerking: |-
        $\cosh^2 x - \sinh^2 x = \dfrac{\e^{2x} + 2 + \e^{-2x}}{4} - \dfrac{\e^{2x} - 2 + \e^{-2x}}{4} = \dfrac44 = 1$. Bij $\cos^2 x + \sin^2 x = 1$ staat een plus.
    - opgave: |-
        Neem $\tanh x = \dfrac{\sinh x}{\cosh x}$. Toon aan dat $(\tanh x)' = \dfrac{1}{\cosh^2 x}$, en dat dat gelijk is aan $1 - \tanh^2 x$. Vergelijk met $(\tan x)'$.
      antwoord: |-
        $1 - \tanh^2 x$ tegenover $1 + \tan^2 x$
      uitwerking: |-
        Quotiëntregel: $\dfrac{\cosh x\cosh x - \sinh x\sinh x}{\cosh^2 x} = \dfrac{1}{\cosh^2 x}$ (vorige deelvraag). Dat is ook $\dfrac{\cosh^2 x - \sinh^2 x}{\cosh^2 x} = 1 - \tanh^2 x$. Bij de tangens is het $1 + \tan^2 x$.
    - opgave: |-
        Leid af: $\cosh 2x$ en $\sinh x^2$.
      antwoord: |-
        $2\sinh 2x$; $2x\cosh x^2$
      uitwerking: |-
        Kettingregel: $\sinh 2x \cdot 2$ en $\cosh x^2 \cdot 2x$.

- id: h3-o26
  soort: opdracht
  niveau: 3
  thema: |-
    afgeleide van een inverse functie
  opgave: |-
    De kettingregel geeft ook de afgeleide van een inverse functie, zoals bij $\ln x$ in de leerstof.
  lijst: enumerate
  delen:
    - opgave: |-
        Leid beide leden van $\bigl(\sqrt{x}\bigr)^2 = x$ af met de kettingregel, en vind zo $(\sqrt{x})'$ zonder de machtregel.
      antwoord: |-
        $\dfrac{1}{2\sqrt{x}}$
      uitwerking: |-
        $2\sqrt{x} \cdot (\sqrt{x})' = 1$, dus $(\sqrt{x})' = \dfrac{1}{2\sqrt{x}}$ (voor $x > 0$).
    - opgave: |-
        Is $g$ de inverse functie van $f$, dan is $f\bigl(g(x)\bigr) = x$. Toon aan dat $g'(x) = \dfrac{1}{f'\bigl(g(x)\bigr)}$ als $f'\bigl(g(x)\bigr) \neq 0$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Leid beide leden af: $f'\bigl(g(x)\bigr) \cdot g'(x) = 1$. Deel door $f'\bigl(g(x)\bigr) \neq 0$.
    - opgave: |-
        De functie $f(x) = x^3 + x + 2$ heeft een inverse $g$, maar een voorschrift voor $g$ vinden is lastig. Bereken toch $g(4)$ en $g'(4)$.
      antwoord: |-
        $g(4) = 1$; $g'(4) = \tfrac14$
      uitwerking: |-
        $f(1) = 4$, dus $g(4) = 1$. $f'(x) = 3x^2 + 1$, dus $g'(4) = \dfrac{1}{f'(1)} = \dfrac14$.
    - opgave: |-
        De boogtangens $y = \operatorname{bgtan} x$ is de hoek $y \in \bigl]-\frac{\pi}{2}, \frac{\pi}{2}\bigr[$ met $\tan y = x$. Toon aan dat $(\operatorname{bgtan} x)' = \dfrac{1}{1 + x^2}$.
      antwoord: |-
        $\dfrac{1}{1 + x^2}$
      uitwerking: |-
        Leid $\tan(\operatorname{bgtan} x) = x$ af: $\bigl(1 + \tan^2(\operatorname{bgtan} x)\bigr) \cdot (\operatorname{bgtan} x)' = 1$. Omdat $\tan(\operatorname{bgtan} x) = x$, is dat $(1 + x^2) \cdot (\operatorname{bgtan} x)' = 1$.

- id: h3-o27
  soort: opdracht
  niveau: 3
  thema: |-
    hogere afgeleiden en een patroon
  opgave: |-
    Leid je $f'$ opnieuw af, dan krijg je $f''$, dan $f'''$, enzovoort. De $n$-de afgeleide noteer je $f^{(n)}$. Bereken telkens enkele afgeleiden, zoek het patroon en geef $f^{(n)}$.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = \e^{-2x}$
      antwoord: |-
        $f^{(n)}(x) = (-2)^n\e^{-2x}$
      uitwerking: |-
        $f' = -2\e^{-2x}$, $f'' = 4\e^{-2x}$, $f''' = -8\e^{-2x}$: elke keer komt er een factor $-2$ bij. Dus $f^{(n)}(x) = (-2)^n\e^{-2x}$.
    - opgave: |-
        $f(x) = \sin x$. Bereken ook $f^{(2026)}(x)$.
      antwoord: |-
        $\cos x$, $-\sin x$, $-\cos x$, $\sin x$, \ldots; $f^{(2026)}(x) = -\sin x$
      uitwerking: |-
        $f' = \cos x$, $f'' = -\sin x$, $f''' = -\cos x$, $f^{(4)} = \sin x$: na vier stappen begint het opnieuw. $2026 = 4 \cdot 506 + 2$, dus $f^{(2026)} = f'' = -\sin x$.
    - opgave: |-
        $f(x) = x\,\e^x$
      antwoord: |-
        $f^{(n)}(x) = (x + n)\e^x$
      uitwerking: |-
        $f' = (x + 1)\e^x$, $f'' = \e^x + (x + 1)\e^x = (x + 2)\e^x$, $f''' = (x + 3)\e^x$. Elke afgeleide telt $1$ op bij de factor voor $\e^x$: $f^{(n)}(x) = (x + n)\e^x$.
    - opgave: |-
        $f(x) = \ln x$
      antwoord: |-
        $f^{(n)}(x) = \dfrac{(-1)^{n-1}(n - 1)!}{x^n}$
      uitwerking: |-
        $f' = x^{-1}$, $f'' = -x^{-2}$, $f''' = 2x^{-3}$, $f^{(4)} = -6x^{-4}$, $f^{(5)} = 24x^{-5}$. Het teken wisselt, en de factoren $1, 1, 2, 6, 24$ zijn $0!, 1!, 2!, 3!, 4!$. Dus $f^{(n)}(x) = \dfrac{(-1)^{n-1}(n - 1)!}{x^n}$.

- id: h3-o28
  soort: opdracht
  niveau: 3
  thema: |-
    symmetrie en de kettingregel
  opgave: |-
    De kettingregel zegt iets over de symmetrie van een afgeleide.
  lijst: enumerate
  delen:
    - opgave: |-
        Een functie $f$ is even als $f(-x) = f(x)$ voor alle $x$. Leid beide leden af. Wat besluit je over $f'$?
      antwoord: |-
        $f'$ is oneven
      uitwerking: |-
        $\bigl(f(-x)\bigr)' = f'(-x) \cdot (-1)$, dus $-f'(-x) = f'(x)$, of $f'(-x) = -f'(x)$: $f'$ is oneven.
    - opgave: |-
        Toon net zo aan dat de afgeleide van een oneven functie even is. Controleer beide besluiten met $\cos x$, $\sin x$ en $x^3$.
      antwoord: |-
        $f'$ is even
      uitwerking: |-
        Uit $f(-x) = -f(x)$ volgt $-f'(-x) = -f'(x)$, dus $f'(-x) = f'(x)$. Controle: $\cos x$ is even en $-\sin x$ oneven; $\sin x$ is oneven en $\cos x$ even; $x^3$ is oneven en $3x^2$ even.
    - opgave: |-
        De functie $\ln|x|$ is even. Toon aan dat haar afgeleide $\frac1x$ is, ook voor $x < 0$. Past dat bij deelvraag a?
      antwoord: |-
        ja: $\frac1x$ is oneven
      uitwerking: |-
        Voor $x < 0$ is $\ln|x| = \ln(-x)$, met afgeleide $\dfrac{1}{-x} \cdot (-1) = \dfrac1x$. Voor $x > 0$ is het $(\ln x)' = \frac1x$. De functie $\frac1x$ is oneven, zoals deelvraag a voorspelt.
    - opgave: |-
        Is $f$ periodiek met periode $p$, dan is $f'$ dat ook. Toon dat aan. Geldt het omgekeerde? Denk aan $f(x) = x + \sin x$.
      antwoord: |-
        ja; nee
      uitwerking: |-
        Leid $f(x + p) = f(x)$ af: $f'(x + p) \cdot 1 = f'(x)$. Het omgekeerde geldt niet: $f'(x) = 1 + \cos x$ is periodiek met periode $2\pi$, maar $f(x + 2\pi) = f(x) + 2\pi$, dus $f$ is niet periodiek.

