- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    kettingregel
  opgave: |-
    Leid af: $(x^3 + 2)^4$.
  antwoord: |-
    $12x^2(x^3 + 2)^3$
  uitwerking: |-
    $4(x^3 + 2)^3 \cdot 3x^2$.

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    goniometrisch
  opgave: |-
    Leid af: $\cos x^2$ en $\sin x\cos x$.
  antwoord: |-
    $-2x\sin x^2$; $\cos 2x$
  uitwerking: |-
    $-\sin x^2 \cdot 2x$. Productregel: $\cos^2 x - \sin^2 x = \cos 2x$.

- id: h3-t3
  soort: test
  niveau: 1
  thema: |-
    exp en ln
  opgave: |-
    Leid af: $\e^{2x + 1}$ en $\ln(x^2 - 4)$.
  antwoord: |-
    $2\e^{2x + 1}$; $\frac{2x}{x^2 - 4}$
  uitwerking: |-
    $\e^{2x + 1} \cdot 2$ en $\frac{1}{x^2 - 4} \cdot 2x$.

- id: h3-t4
  soort: test
  niveau: 2
  thema: |-
    combinatie
  opgave: |-
    Leid af: $x\,\e^{2x}$.
  antwoord: |-
    $(1 + 2x)\e^{2x}$
  uitwerking: |-
    Productregel en kettingregel: $\e^{2x} + x \cdot 2\e^{2x}$.

- id: h3-t5
  soort: test
  niveau: 2
  thema: |-
    raaklijn
  opgave: |-
    Geef een vergelijking van de raaklijn aan de grafiek van $y = \sqrt{x^2 + 5}$ in $x = 2$.
  antwoord: |-
    $y = \tfrac23 x + \tfrac53$
  uitwerking: |-
    $y(2) = 3$. $y' = \dfrac{2x}{2\sqrt{x^2 + 5}} = \dfrac{x}{\sqrt{x^2 + 5}}$, dus $y'(2) = \tfrac23$. Raaklijn: $y = 3 + \tfrac23(x - 2) = \tfrac23 x + \tfrac53$.

- id: h3-t6
  soort: test
  niveau: 2
  thema: |-
    veranderingssnelheid in een context
  opgave: |-
    De lading van een batterij is $Q(t) = 50\bigl(1 - \e^{-0{,}2t}\bigr)$ (in Wh, $t$ in uur). Hoe snel laadt ze bij het begin, en na $5$ uur? Rond af op twee decimalen.
  antwoord: |-
    $10$ Wh per uur; $\approx 3{,}68$ Wh per uur
  uitwerking: |-
    $Q'(t) = 50 \cdot \bigl(-\e^{-0{,}2t}\bigr) \cdot (-0{,}2) = 10\,\e^{-0{,}2t}$. $Q'(0) = 10$ Wh per uur en $Q'(5) = 10\,\e^{-1} \approx 3{,}68$ Wh per uur.

- id: h3-t7
  soort: test
  niveau: 1
  thema: |-
    andere grondtallen
  opgave: |-
    Leid af: $3^{2x}$ en $\log_5(x^2 + 1)$.
  antwoord: |-
    $2 \cdot 3^{2x}\ln 3$; $\dfrac{2x}{(x^2 + 1)\ln 5}$
  uitwerking: |-
    $3^{2x}\ln 3 \cdot 2$ en $\dfrac{1}{(x^2 + 1)\ln 5} \cdot 2x$.

- id: h3-t8
  soort: test
  niveau: 2
  thema: |-
    een fout opsporen
  opgave: |-
    Een leerling schrijft $\bigl(\ln x^2\bigr)' = \dfrac{1}{x^2}$. Waar zit de fout? Geef de juiste afgeleide, op twee manieren.
  antwoord: |-
    $\dfrac2x$
  uitwerking: |-
    De afgeleide van de binnenste $x^2$ ontbreekt: $\dfrac{1}{x^2} \cdot 2x = \dfrac2x$. Of: $\ln x^2 = 2\ln|x|$, met afgeleide $\dfrac2x$.
