# Oefeningen van hoofdstuk 2. Zie oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer} Welke exponent hoort op de plaats van het vraagteken?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $10^{?} = 1000$
      antwoord: |-
        3
      uitwerking: |-
        $10^3 = 1000$.
    - opgave: |-
        $2^{?} = 64$
      antwoord: |-
        6
      uitwerking: |-
        $2^6 = 64$.
    - opgave: |-
        $10^{?} = 0{,}01$
      antwoord: |-
        $-2$
      uitwerking: |-
        $10^{-2} = 0{,}01$.
    - opgave: |-
        $3^{?} = \frac19$
      antwoord: |-
        $-2$
      uitwerking: |-
        $3^{-2} = \frac19$.
    - opgave: |-
        $10^{?} = \sqrt{10}$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        $10^{\frac12} = \sqrt{10}$.
    - opgave: |-
        $\e^{?} = 1$
      antwoord: |-
        0
      uitwerking: |-
        $\e^0 = 1$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Een kapitaal groeit met $3$\,\% per jaar: na $t$ jaar is het met $1{,}03^t$ vermenigvuldigd.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $1{,}03^t$ voor $t = 10$, $20$ en $25$. Tussen welke twee is het kapitaal verdubbeld?
      antwoord: |-
        $1{,}344$; $1{,}806$; $2{,}094$; tussen 20 en 25 jaar
      uitwerking: |-
        $1{,}344$, $1{,}806$ en $2{,}094$: tussen 20 en 25 jaar.
    - opgave: |-
        Zoek door te proberen het jaar waarin het kapitaal voor het eerst verdubbeld is.
      antwoord: |-
        na 24 jaar
      uitwerking: |-
        $1{,}03^{23} \approx 1{,}974$ en $1{,}03^{24} \approx 2{,}033$: na 24 jaar.
    - opgave: |-
        Waarom lukt het niet om $1{,}03^t = 2$ op te lossen zoals $2^{x + 1} = \frac18$?
      antwoord: |-
        2 is geen macht van $1{,}03$ met een mooie exponent
      uitwerking: |-
        Je kunt 2 niet schrijven als een macht van $1{,}03$ met een exponent die je kent. Je hebt een nieuw begrip nodig: de logaritme.

#----------------------------------------------------------------------------------------
# KORTE OEFENINGEN IN DE LEERSTOF (in de volgorde van het boek)
#----------------------------------------------------------------------------------------

- id: h2-k-omzetten
  soort: kort
  opgave: |-
    Schrijf de logaritme als een macht, of de macht als een logaritme.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\log_2 \frac18 = -3$
      antwoord: |-
        $2^{-3} = \frac18$
      uitwerking: |-
        Het grondtal 2 tot de macht $-3$ (de logaritme) geeft $\frac18$: $2^{-3} = \frac18$.
    - opgave: |-
        $\log 0{,}1 = -1$
      antwoord: |-
        $10^{-1} = 0{,}1$
      uitwerking: |-
        Grondtal 10: $10^{-1} = 0{,}1$.
    - opgave: |-
        $5^3 = 125$
      antwoord: |-
        $\log_5 125 = 3$
      uitwerking: |-
        De exponent 3 is de logaritme van 125 met grondtal 5: $\log_5 125 = 3$.
    - opgave: |-
        $\e^2 \approx 7{,}389$
      antwoord: |-
        $\ln 7{,}389 \approx 2$
      uitwerking: |-
        Grondtal $\e$, dus de natuurlijke logaritme: $\ln 7{,}389 \approx 2$.

- id: h2-definitie
  soort: kort
  opgave: |-
    Bereken zonder rekentoestel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log_3 81$
      antwoord: |-
        4
      uitwerking: |-
        $3^4 = 81$.
    - opgave: |-
        $\log_5 \frac{1}{25}$
      antwoord: |-
        $-2$
      uitwerking: |-
        $5^{-2} = \frac{1}{25}$.
    - opgave: |-
        $\log_9 3$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        $9^{\frac12} = 3$.
    - opgave: |-
        $\ln \sqrt{\e}$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        $\ln \e^{\frac12} = \frac12$.
    - opgave: |-
        $\log_2 \sqrt{8}$
      antwoord: |-
        $\frac32$
      uitwerking: |-
        $\sqrt8 = 2^{\frac32}$.
    - opgave: |-
        $\log 1$
      antwoord: |-
        0
      uitwerking: |-
        $10^0 = 1$.

- id: h2-k-tussen
  soort: kort
  opgave: |-
    Tussen welke twee opeenvolgende gehele getallen ligt de logaritme? Leg uit zonder rekentoestel, en controleer daarna met je rekentoestel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log 450$
      antwoord: |-
        tussen 2 en 3; $\approx 2{,}653$
      uitwerking: |-
        $10^2 = 100 < 450 < 1000 = 10^3$, dus $2 < \log 450 < 3$. Rekentoestel: $\log 450 \approx 2{,}653$.
    - opgave: |-
        $\ln 20$
      antwoord: |-
        tussen 2 en 3; $\approx 2{,}996$
      uitwerking: |-
        $\e^2 \approx 7{,}39 < 20 < \e^3 \approx 20{,}09$, dus $2 < \ln 20 < 3$, en zelfs heel dicht bij 3. Rekentoestel: $\ln 20 \approx 2{,}996$.
    - opgave: |-
        $\log 0{,}03$
      antwoord: |-
        tussen $-2$ en $-1$; $\approx -1{,}523$
      uitwerking: |-
        $10^{-2} = 0{,}01 < 0{,}03 < 0{,}1 = 10^{-1}$, dus $-2 < \log 0{,}03 < -1$. Rekentoestel: $\log 0{,}03 \approx -1{,}523$.

- id: h2-k-logmacht
  soort: kort
  opgave: |-
    Vereenvoudig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log_2 8^x$
      antwoord: |-
        $3x$
      uitwerking: |-
        $8^x = \bigl(2^3\bigr)^x = 2^{3x}$, dus $\log_2 8^x = \log_2 2^{3x} = 3x$.
    - opgave: |-
        $\ln \e^{2x + 1}$
      antwoord: |-
        $2x + 1$
      uitwerking: |-
        De logaritme van een macht van het grondtal $\e$ is de exponent: $2x + 1$.
    - opgave: |-
        $\log_5 \sqrt{5^x}$
      antwoord: |-
        $\frac{x}{2}$
      uitwerking: |-
        $\sqrt{5^x} = \bigl(5^x\bigr)^{\frac12} = 5^{\frac{x}{2}}$, dus $\log_5 \sqrt{5^x} = \frac{x}{2}$.

- id: h2-k-machtlog
  soort: kort
  opgave: |-
    Bereken zonder rekentoestel.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $7^{\log_7 5}$
      antwoord: |-
        5
      uitwerking: |-
        Macht en logaritme met hetzelfde grondtal heffen elkaar op: $7^{\log_7 5} = 5$.
    - opgave: |-
        $2^{3 + \log_2 5}$
      antwoord: |-
        40
      uitwerking: |-
        Product van machten: $2^3 \cdot 2^{\log_2 5} = 8 \cdot 5 = 40$.
    - opgave: |-
        $\e^{2\ln 3}$
      antwoord: |-
        9
      uitwerking: |-
        Macht van een macht: $\e^{2\ln 3} = \bigl(\e^{\ln 3}\bigr)^2 = 3^2 = 9$.
    - opgave: |-
        $10^{-\log 4}$
      antwoord: |-
        $\frac14$
      uitwerking: |-
        Negatieve exponent: $10^{-\log 4} = \dfrac{1}{10^{\log 4}} = \dfrac14$.

- id: h2-k-product
  soort: kort
  opgave: |-
    Bereken zonder rekentoestel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log_6 3 + \log_6 12$
      antwoord: |-
        2
      uitwerking: |-
        Productregel: $\log_6(3 \cdot 12) = \log_6 36 = 2$.
    - opgave: |-
        $\log 25 + \log 40$
      antwoord: |-
        3
      uitwerking: |-
        Productregel: $\log(25 \cdot 40) = \log 1000 = 3$.
    - opgave: |-
        $\ln \dfrac{\e}{2} + \ln(2\e)$
      antwoord: |-
        2
      uitwerking: |-
        Productregel: $\ln\bigl(\frac{\e}{2} \cdot 2\e\bigr) = \ln \e^2 = 2$.

- id: h2-k-quotient
  soort: kort
  opgave: |-
    Bereken zonder rekentoestel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log_2 80 - \log_2 5$
      antwoord: |-
        4
      uitwerking: |-
        Quotiëntregel: $\log_2 \frac{80}{5} = \log_2 16 = 4$.
    - opgave: |-
        $\log 3 - \log 3000$
      antwoord: |-
        $-3$
      uitwerking: |-
        Quotiëntregel: $\log \frac{3}{3000} = \log 0{,}001 = -3$.
    - opgave: |-
        $\ln 5 - \ln\bigl(5\e^2\bigr)$
      antwoord: |-
        $-2$
      uitwerking: |-
        Quotiëntregel: $\ln \frac{5}{5\e^2} = \ln \e^{-2} = -2$.

- id: h2-k-macht
  soort: kort
  opgave: |-
    Schrijf als een veelvoud van $\ln 2$.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\ln 8$
      antwoord: |-
        $3\ln 2$
      uitwerking: |-
        $\ln 2^3 = 3\ln 2$.
    - opgave: |-
        $\ln \sqrt2$
      antwoord: |-
        $\frac12 \ln 2$
      uitwerking: |-
        $\ln 2^{\frac12} = \frac12 \ln 2$.
    - opgave: |-
        $\ln \dfrac{1}{16}$
      antwoord: |-
        $-4\ln 2$
      uitwerking: |-
        $\frac{1}{16} = 2^{-4}$, dus $\ln 2^{-4} = -4\ln 2$.
    - opgave: |-
        $\ln \sqrt[3]{4}$
      antwoord: |-
        $\frac23 \ln 2$
      uitwerking: |-
        $\sqrt[3]{4} = \bigl(2^2\bigr)^{\frac13} = 2^{\frac23}$, dus $\ln \sqrt[3]{4} = \frac23 \ln 2$.

- id: h2-k-samen
  soort: kort
  opgave: |-
    Schrijf als één logaritme en bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log 4 + \log 250$
      antwoord: |-
        3
      uitwerking: |-
        Productregel: $\log(4 \cdot 250) = \log 1000 = 3$.
    - opgave: |-
        $2\log_3 6 - \log_3 4$
      antwoord: |-
        2
      uitwerking: |-
        Machtregel: $\log_3 6^2 - \log_3 4 = \log_3 36 - \log_3 4$.\\
        Quotiëntregel: $\log_3 \frac{36}{4} = \log_3 9 = 2$.
    - opgave: |-
        $\ln 6 - \ln 3 + \ln \frac{\e}{2}$
      antwoord: |-
        1
      uitwerking: |-
        $\ln \frac{6}{3} + \ln \frac{\e}{2} = \ln\bigl(2 \cdot \frac{\e}{2}\bigr) = \ln \e = 1$.

- id: h2-k-uitsplitsen
  soort: kort
  opgave: |-
    Schrijf met $\ln x$ en $\ln y$, of met $\log_2 x$ en $\log_2 y$ (met $x, y > 0$).
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ln\bigl(x^3 y\bigr)$
      antwoord: |-
        $3\ln x + \ln y$
      uitwerking: |-
        Productregel, dan machtregel: $\ln x^3 + \ln y = 3\ln x + \ln y$.
    - opgave: |-
        $\log_2 \dfrac{8x}{y^2}$
      antwoord: |-
        $3 + \log_2 x - 2\log_2 y$
      uitwerking: |-
        $\log_2 8 + \log_2 x - \log_2 y^2 = 3 + \log_2 x - 2\log_2 y$.
    - opgave: |-
        $\ln \sqrt{\dfrac{x}{\e}}$
      antwoord: |-
        $\frac12 \ln x - \frac12$
      uitwerking: |-
        Machtregel, dan quotiëntregel: $\frac12 \ln \frac{x}{\e} = \frac12(\ln x - \ln \e) = \frac12 \ln x - \frac12$.

- id: h2-rekenregels
  soort: kort
  opgave: |-
    Bereken met de rekenregels; het laatste met je rekentoestel.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\log_6 4 + \log_6 9$
      antwoord: |-
        2
      uitwerking: |-
        $\log_6 36 = 2$.
    - opgave: |-
        $\log_2 48 - \log_2 3$
      antwoord: |-
        4
      uitwerking: |-
        $\log_2 16 = 4$.
    - opgave: |-
        $3\ln 2 - \ln 4$
      antwoord: |-
        $\ln 2$
      uitwerking: |-
        $\ln 8 - \ln 4 = \ln 2$.
    - opgave: |-
        $\log_5 12$
      antwoord: |-
        $\approx 1{,}544$
      uitwerking: |-
        $\frac{\ln 12}{\ln 5} \approx 1{,}544$.

- id: h2-k-grondtal
  soort: kort
  opgave: |-
    Bereken op drie decimalen en controleer met een macht.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log_3 15$
      antwoord: |-
        $\approx 2{,}465$
      uitwerking: |-
        $\log_3 15 = \frac{\ln 15}{\ln 3} \approx 2{,}465$.\\
        Controle: $3^{2{,}465} \approx 15{,}0$.
    - opgave: |-
        $\log_{0{,}2} 3$
      antwoord: |-
        $\approx -0{,}683$
      uitwerking: |-
        $\log_{0{,}2} 3 = \frac{\ln 3}{\ln 0{,}2} \approx -0{,}683$. Negatief, want je moet $0{,}2$ tot een negatieve macht verheffen om een getal groter dan 1 te krijgen.\\
        Controle: $0{,}2^{-0{,}683} \approx 3{,}00$.
    - opgave: |-
        $\log_{1{,}5} 100$
      antwoord: |-
        $\approx 11{,}358$
      uitwerking: |-
        $\log_{1{,}5} 100 = \frac{\ln 100}{\ln 1{,}5} \approx 11{,}358$.\\
        Controle: $1{,}5^{11{,}358} \approx 100$.

- id: h2-k-afzonderen
  soort: kort
  opgave: |-
    Los op, op drie decimalen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $4 \cdot 3^x = 70$
      antwoord: |-
        $\approx 2{,}605$
      uitwerking: |-
        Delen door 4: $3^x = 17{,}5$.\\
        Definitie: $x = \log_3 17{,}5 = \frac{\ln 17{,}5}{\ln 3} \approx 2{,}605$.
    - opgave: |-
        $5^x + 8 = 20$
      antwoord: |-
        $\approx 1{,}544$
      uitwerking: |-
        Eerst 8 aftrekken: $5^x = 12$.\\
        Definitie: $x = \log_5 12 = \frac{\ln 12}{\ln 5} \approx 1{,}544$.
    - opgave: |-
        $2\,\e^{x - 1} = 9$
      antwoord: |-
        $\approx 2{,}504$
      uitwerking: |-
        Delen door 2: $\e^{x - 1} = 4{,}5$.\\
        Definitie van $\ln$: $x - 1 = \ln 4{,}5$, dus $x = 1 + \ln 4{,}5 \approx 2{,}504$.

- id: h2-k-verdubbeling
  soort: kort
  opgave: |-
    Een stad groeit met $1{,}5$\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Na hoeveel jaar is het aantal inwoners verdubbeld?
      antwoord: |-
        na ongeveer $46{,}6$ jaar
      uitwerking: |-
        $N_0 \cdot 1{,}015^t = 2N_0 \iff 1{,}015^t = 2$: de beginwaarde valt weg.\\
        $t = \frac{\ln 2}{\ln 1{,}015} \approx 46{,}6$ jaar.
    - opgave: |-
        Na hoeveel jaar is het aantal inwoners met de helft toegenomen?
      antwoord: |-
        na ongeveer $27{,}2$ jaar
      uitwerking: |-
        Met de helft toegenomen is $1{,}5$ keer zo groot: $1{,}015^t = 1{,}5$.\\
        $t = \frac{\ln 1{,}5}{\ln 1{,}015} \approx 27{,}2$ jaar. Dat is meer dan de helft van de verdubbelingstijd.

- id: h2-vergelijking
  soort: kort
  opgave: |-
    Los op, op drie decimalen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $5^x = 40$
      antwoord: |-
        $\approx 2{,}292$
      uitwerking: |-
        $x = \log_5 40 = \frac{\ln 40}{\ln 5} \approx 2{,}292$.
    - opgave: |-
        $200 \cdot 0{,}85^x = 50$
      antwoord: |-
        $\approx 8{,}530$
      uitwerking: |-
        $0{,}85^x = 0{,}25$, dus $x = \frac{\ln 0{,}25}{\ln 0{,}85} \approx 8{,}530$.
    - opgave: |-
        $3^x = 5^{x - 1}$
      antwoord: |-
        $\approx 3{,}151$
      uitwerking: |-
        $x \ln 3 = (x - 1)\ln 5$, dus $x(\ln 5 - \ln 3) = \ln 5$ en $x = \frac{\ln 5}{\ln \frac53} \approx 3{,}151$.

- id: h2-k-db
  soort: kort
  opgave: |-
    Het geluidsniveau is $L = 10 \log \frac{I}{I_0}$ (in dB).
  lijst: enumerate
  delen:
    - opgave: |-
        Een stofzuiger maakt $72$ dB, gefluister $30$ dB. Hoeveel keer intenser is het geluid van de stofzuiger?
      antwoord: |-
        $10^{4{,}2} \approx 15\,800$ keer
      uitwerking: |-
        $72 - 30 = 10 \log \frac{I_s}{I_f}$, dus $\log \frac{I_s}{I_f} = 4{,}2$ en $\frac{I_s}{I_f} = 10^{4{,}2} \approx 15\,800$.
    - opgave: |-
        Met hoeveel dB stijgt het geluidsniveau als de intensiteit $1000$ keer zo groot wordt?
      antwoord: |-
        met 30 dB
      uitwerking: |-
        $L_2 - L_1 = 10 \log \frac{I_2}{I_1} = 10 \log 1000 = 10 \cdot 3 = 30$ dB.

- id: h2-schaal
  soort: kort
  opgave: |-
    Sirius, de helderste ster aan de nachthemel, heeft magnitude $-1{,}46$, de Poolster $1{,}98$. Hoeveel keer helderder is Sirius?
  antwoord: |-
    ongeveer 24 keer
  uitwerking: |-
    $1{,}98 - (-1{,}46) = 3{,}44 = 2{,}5 \log \frac{I_S}{I_P}$, dus $\frac{I_S}{I_P} = 10^{\frac{3{,}44}{2{,}5}} \approx 23{,}8$.

- id: h2-k-ph
  soort: kort
  opgave: |-
    Citroensap heeft pH $2{,}4$, tomatensap pH $4{,}1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de concentratie $[\mathrm{H}^+]$ in citroensap.
      antwoord: |-
        $\approx 4{,}0 \cdot 10^{-3}$ mol per liter
      uitwerking: |-
        $-\log [\mathrm{H}^+] = 2{,}4 \iff \log [\mathrm{H}^+] = -2{,}4$.\\
        Definitie: $[\mathrm{H}^+] = 10^{-2{,}4} \approx 0{,}0040$ mol per liter.
    - opgave: |-
        Hoeveel keer zuurder is citroensap dan tomatensap?
      antwoord: |-
        ongeveer 50 keer
      uitwerking: |-
        $\frac{10^{-2{,}4}}{10^{-4{,}1}} = 10^{-2{,}4 + 4{,}1} = 10^{1{,}7} \approx 50$: het verschil in pH is $1{,}7$, dus de factor is $10^{1{,}7}$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3 (zelfde volgorde als in het boek)
#----------------------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: definitie
  opgave: |-
    Bereken zonder rekentoestel.
  lijst: reeks
  kolommen: 5
  delen:
    - opgave: |-
        $\log_2 \frac{1}{16}$
      antwoord: |-
        $-4$
      uitwerking: |-
        $\frac{1}{16} = 2^{-4}$, dus $\log_2 \frac{1}{16} = -4$.
    - opgave: |-
        $\log_{\frac13} 9$
      antwoord: |-
        $-2$
      uitwerking: |-
        $\bigl(\frac13\bigr)^{y} = 9 \iff 3^{-y} = 3^2$, dus $y = -2$.
    - opgave: |-
        $\log 0{,}01$
      antwoord: |-
        $-2$
      uitwerking: |-
        $0{,}01 = 10^{-2}$, dus $\log 0{,}01 = -2$.
    - opgave: |-
        $\ln \frac{1}{\e}$
      antwoord: |-
        $-1$
      uitwerking: |-
        $\frac1\e = \e^{-1}$, dus $\ln \frac1\e = -1$.
    - opgave: |-
        $\log_8 2$
      antwoord: |-
        $\frac13$
      uitwerking: |-
        $8^{y} = 2 \iff 2^{3y} = 2^1$, dus $y = \frac13$.
    - opgave: |-
        $\log_{\sqrt2} 4$
      antwoord: |-
        4
      uitwerking: |-
        $(\sqrt2)^y = 4 \iff 2^{\frac{y}{2}} = 2^2$, dus $y = 4$.
    - opgave: |-
        $\log_4 \frac18$
      antwoord: |-
        $-\frac32$
      uitwerking: |-
        $4^y = \frac18 \iff 2^{2y} = 2^{-3}$, dus $2y = -3$ en $y = -\frac32$.
    - opgave: |-
        $\log_{27} 9$
      antwoord: |-
        $\frac23$
      uitwerking: |-
        $27^y = 9 \iff 3^{3y} = 3^2$, dus $y = \frac23$.
    - opgave: |-
        $10^{\log 7}$
      antwoord: |-
        7
      uitwerking: |-
        $\log 7$ is de exponent waartoe je 10 moet verheffen om 7 te krijgen: $10^{\log 7} = 7$.
    - opgave: |-
        $\e^{2\ln 3}$
      antwoord: |-
        9
      uitwerking: |-
        Machtregel: $2\ln 3 = \ln 9$, dus $\e^{2\ln 3} = \e^{\ln 9} = 9$.

- id: h2-o16
  soort: opdracht
  niveau: 1
  thema: |-
    waardeverlies van een auto
  opgave: |-
    Een nieuwe auto kost $30\,000$ euro en verliest elk jaar $20$\,\% van zijn waarde.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een formule voor de waarde $W(t)$ na $t$ jaar.
      antwoord: |-
        $W(t) = 30\,000 \cdot 0{,}8^t$
      uitwerking: |-
        Groeifactor $1 - \frac{20}{100} = 0{,}8$, dus $W(t) = 30\,000 \cdot 0{,}8^t$ (in euro).
    - opgave: |-
        Na hoeveel jaar is de auto nog de helft waard?
      antwoord: |-
        na ongeveer $3{,}1$ jaar
      uitwerking: |-
        $30\,000 \cdot 0{,}8^t = 15\,000 \iff 0{,}8^t = 0{,}5$.\\
        $t = \frac{\ln 0{,}5}{\ln 0{,}8} \approx 3{,}11$ jaar.
    - opgave: |-
        Na hoeveel jaar is hij nog $7500$ euro waard? Vergelijk met b en verklaar.
      antwoord: |-
        na ongeveer $6{,}2$ jaar: twee keer zo lang
      uitwerking: |-
        $0{,}8^t = \frac{7500}{30\,000} = 0{,}25$, dus $t = \frac{\ln 0{,}25}{\ln 0{,}8} \approx 6{,}21$ jaar.\\
        Dat is precies het dubbele van b: $7500$ euro is twee keer halveren, en elke halvering duurt even lang. Met de rekenregels: $\ln 0{,}25 = \ln 0{,}5^2 = 2\ln 0{,}5$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: rekenregels
  opgave: |-
    Schrijf als één logaritme en bereken als het kan.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log_3 54 - \log_3 2$
      antwoord: |-
        3
      uitwerking: |-
        Quotiëntregel: $\log_3 \frac{54}{2} = \log_3 27 = 3$.
    - opgave: |-
        $\frac12 \log 16 + \log 25$
      antwoord: |-
        2
      uitwerking: |-
        Machtregel: $\frac12 \log 16 = \log 16^{\frac12} = \log 4$.\\
        Productregel: $\log 4 + \log 25 = \log 100 = 2$.
    - opgave: |-
        $\ln 12 - 2\ln 2$
      antwoord: |-
        $\ln 3$
      uitwerking: |-
        $\ln 12 - \ln 2^2 = \ln \frac{12}{4} = \ln 3$. Dat is geen mooi getal: laat het zo staan.
    - opgave: |-
        $\log_2 6 + \log_2 \frac83$
      antwoord: |-
        4
      uitwerking: |-
        $\log_2 \bigl(6 \cdot \frac83\bigr) = \log_2 16 = 4$.
    - opgave: |-
        $\log 8 + \log 125$
      antwoord: |-
        3
      uitwerking: |-
        $\log(8 \cdot 125) = \log 1000 = 3$.
    - opgave: |-
        $\log_5 50 - \log_5 2$
      antwoord: |-
        2
      uitwerking: |-
        $\log_5 \frac{50}{2} = \log_5 25 = 2$.
    - opgave: |-
        $2\log_6 3 + \log_6 4$
      antwoord: |-
        2
      uitwerking: |-
        $\log_6 3^2 + \log_6 4 = \log_6 36 = 2$.
    - opgave: |-
        $3\log_4 2$
      antwoord: |-
        $\frac32$
      uitwerking: |-
        $\log_4 2^3 = \log_4 8$, en $4^y = 8 \iff 2^{2y} = 2^3$, dus $\frac32$.
    - opgave: |-
        $\log 0{,}2 + \log 50$
      antwoord: |-
        1
      uitwerking: |-
        $\log(0{,}2 \cdot 50) = \log 10 = 1$.
    - opgave: |-
        $\log_3 18 - 2\log_3 \sqrt2$
      antwoord: |-
        2
      uitwerking: |-
        $2\log_3 \sqrt2 = \log_3 (\sqrt2)^2 = \log_3 2$, dus $\log_3 \frac{18}{2} = \log_3 9 = 2$.
    - opgave: |-
        $\ln 10 - \ln 2 - \ln 5$
      antwoord: |-
        0
      uitwerking: |-
        $\ln \frac{10}{2 \cdot 5} = \ln 1 = 0$.
    - opgave: |-
        $\log_2 \sqrt{12} - \frac12 \log_2 3$
      antwoord: |-
        1
      uitwerking: |-
        $\log_2 12^{\frac12} - \log_2 3^{\frac12} = \log_2 \sqrt{\frac{12}{3}} = \log_2 2 = 1$.

- id: h2-o11
  soort: opdracht
  niveau: 1
  thema: |-
    logaritmen aflezen op een grafiek
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[x=.7cm,y=.4cm,font=\scriptsize]
        \rooster{-2}{1}{3}{0}{1}{8}
        \kromme{-2}{3}{2^(\x)}
        \node[left,text=accent] at (2.75,7.3) {$y = 2^x$};
      \end{tikzpicture}
  opgave: |-
    Hiernaast staat de grafiek van $y = 2^x$. Een logaritme met grondtal 2 is een exponent: je vindt hem dus op de $x$-as.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees een benadering af van $\log_2 3$ en $\log_2 6$. Controleer met je rekentoestel.
      antwoord: |-
        $\approx 1{,}6$ en $\approx 2{,}6$ ($1{,}585$ en $2{,}585$)
      uitwerking: |-
        Zoek de hoogte $y = 3$ op de grafiek en lees de $x$ af: ongeveer $1{,}6$. Bij $y = 6$: ongeveer $2{,}6$.\\
        Rekentoestel: $\log_2 3 = \frac{\ln 3}{\ln 2} \approx 1{,}585$ en $\log_2 6 \approx 2{,}585$.
    - opgave: |-
        Lees $\log_2 0{,}5$ af. Waarom is het antwoord negatief?
      antwoord: |-
        $-1$
      uitwerking: |-
        Bij $y = 0{,}5$ hoort $x = -1$, want $2^{-1} = \frac12$. Het getal $0{,}5$ ligt onder 1, en $2^x < 1$ alleen voor $x < 0$.
    - opgave: |-
        Waarom is $\log_2 6 - \log_2 3$ precies 1? Verklaar met de rekenregels en met de grafiek.
      antwoord: |-
        $\log_2 2 = 1$; één stap naar rechts verdubbelt
      uitwerking: |-
        Quotiëntregel: $\log_2 6 - \log_2 3 = \log_2 \frac63 = \log_2 2 = 1$.\\
        Op de grafiek: van hoogte 3 naar hoogte 6 is verdubbelen, en de grafiek van $2^x$ verdubbelt telkens als $x$ met 1 toeneemt.

- id: h2-o12
  soort: opdracht
  niveau: 1
  thema: |-
    verandering van grondtal
  opgave: |-
    Bereken op drie decimalen en controleer met een macht.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\log_3 50$
      antwoord: |-
        $\approx 3{,}561$
      uitwerking: |-
        $\frac{\ln 50}{\ln 3} \approx 3{,}561$. Controle: $3^{3{,}561} \approx 50$.
    - opgave: |-
        $\log_{0{,}5} 10$
      antwoord: |-
        $\approx -3{,}322$
      uitwerking: |-
        $\frac{\ln 10}{\ln 0{,}5} \approx -3{,}322$. Controle: $0{,}5^{-3{,}322} = 2^{3{,}322} \approx 10$.
    - opgave: |-
        $\log_7 0{,}2$
      antwoord: |-
        $\approx -0{,}827$
      uitwerking: |-
        $\frac{\ln 0{,}2}{\ln 7} \approx -0{,}827$. Controle: $7^{-0{,}827} \approx 0{,}2$.
    - opgave: |-
        $\log_{1{,}05} 2$
      antwoord: |-
        $\approx 14{,}207$
      uitwerking: |-
        $\frac{\ln 2}{\ln 1{,}05} \approx 14{,}207$. Controle: $1{,}05^{14{,}207} \approx 2$. Dat is de verdubbelingstijd bij $5$\,\% groei.

- id: h2-o13
  soort: opdracht
  niveau: 1
  thema: |-
    klassieke fouten met rekenregels
  opgave: |-
    Juist of fout, voor alle $a, b > 0$ waarvoor beide leden bestaan? Geef bij een foute gelijkheid een tegenvoorbeeld.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\log(a + b) = \log a + \log b$
      antwoord: |-
        fout
      uitwerking: |-
        Fout. Neem $a = b = 1$: $\log 2 \approx 0{,}301$, maar $\log 1 + \log 1 = 0$. Voor een som is er geen regel; juist is $\log(ab) = \log a + \log b$.
    - opgave: |-
        $\log(ab) = \log a \cdot \log b$
      antwoord: |-
        fout
      uitwerking: |-
        Fout. Neem $a = b = 10$: $\log 100 = 2$, maar $\log 10 \cdot \log 10 = 1$. De logaritme van een product is een som.
    - opgave: |-
        $\dfrac{\log a}{\log b} = \log \dfrac{a}{b}$
      antwoord: |-
        fout
      uitwerking: |-
        Fout. Neem $a = 100$ en $b = 10$: $\frac{2}{1} = 2$, maar $\log 10 = 1$. Juist is $\log \frac{a}{b} = \log a - \log b$; het quotiënt $\frac{\log a}{\log b}$ is $\log_b a$.
    - opgave: |-
        $(\log a)^2 = 2\log a$
      antwoord: |-
        fout
      uitwerking: |-
        Fout. Neem $a = 1000$: $3^2 = 9$, maar $2 \cdot 3 = 6$. De machtregel geldt voor $\log a^2$, niet voor $(\log a)^2$.
    - opgave: |-
        $\log \dfrac{a}{b} = -\log \dfrac{b}{a}$
      antwoord: |-
        juist
      uitwerking: |-
        Juist: $\log \frac{a}{b} = \log a - \log b = -(\log b - \log a) = -\log \frac{b}{a}$.
    - opgave: |-
        $\log(10a) = 10\log a$
      antwoord: |-
        fout
      uitwerking: |-
        Fout. Neem $a = 1$: $\log 10 = 1$, maar $10 \log 1 = 0$. Juist is $\log(10a) = \log 10 + \log a = 1 + \log a$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijkingen
  opgave: |-
    Los op, op drie decimalen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\e^{2x} = 7$
      antwoord: |-
        $\approx 0{,}973$
      uitwerking: |-
        Definitie van $\ln$: $2x = \ln 7$, dus $x = \frac{\ln 7}{2} \approx 0{,}973$.
    - opgave: |-
        $0{,}8^x = 0{,}3$
      antwoord: |-
        $\approx 5{,}396$
      uitwerking: |-
        $x = \log_{0{,}8} 0{,}3 = \frac{\ln 0{,}3}{\ln 0{,}8} \approx 5{,}396$.
    - opgave: |-
        $10^{x + 1} = 0{,}5$
      antwoord: |-
        $\approx -1{,}301$
      uitwerking: |-
        Definitie van $\log$: $x + 1 = \log 0{,}5 \approx -0{,}301$, dus $x \approx -1{,}301$.

- id: h2-o14
  soort: opdracht
  niveau: 1
  thema: |-
    zuurtegraad van water
  opgave: |-
    De zuurtegraad is $\mathrm{pH} = -\log [\mathrm{H}^+]$, met $[\mathrm{H}^+]$ in mol per liter.
  lijst: enumerate
  delen:
    - opgave: |-
        In regenwater is $[\mathrm{H}^+] = 2{,}5 \cdot 10^{-6}$ mol per liter. Bereken de pH.
      antwoord: |-
        $\approx 5{,}6$
      uitwerking: |-
        $\mathrm{pH} = -\log\bigl(2{,}5 \cdot 10^{-6}\bigr) \approx -(-5{,}602) \approx 5{,}6$.
    - opgave: |-
        Het water van een vijver heeft pH $7{,}8$. Bereken $[\mathrm{H}^+]$.
      antwoord: |-
        $\approx 1{,}6 \cdot 10^{-8}$ mol per liter
      uitwerking: |-
        $\log [\mathrm{H}^+] = -7{,}8$, dus $[\mathrm{H}^+] = 10^{-7{,}8} \approx 1{,}6 \cdot 10^{-8}$ mol per liter.
    - opgave: |-
        Hoeveel keer zuurder is het regenwater dan het vijverwater?
      antwoord: |-
        ongeveer 160 keer
      uitwerking: |-
        $\frac{2{,}5 \cdot 10^{-6}}{10^{-7{,}8}} \approx 158$. Of met het verschil in pH: $10^{7{,}8 - 5{,}602} = 10^{2{,}198} \approx 158$.

- id: h2-o15
  soort: opdracht
  niveau: 1
  thema: |-
    exacte oplossingen
  opgave: |-
    Los exact op, zonder rekentoestel: geef de oplossing met $\log$, $\ln$ of $\log_a$.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\e^x = 5$
      antwoord: |-
        $x = \ln 5$
      uitwerking: |-
        Definitie van $\ln$: $x = \ln 5$.
    - opgave: |-
        $10^{2x} = 3$
      antwoord: |-
        $x = \frac12 \log 3$
      uitwerking: |-
        $2x = \log 3$, dus $x = \frac12 \log 3$ (of $\log \sqrt3$).
    - opgave: |-
        $2^{x - 1} = 7$
      antwoord: |-
        $x = 1 + \log_2 7$
      uitwerking: |-
        $x - 1 = \log_2 7$, dus $x = 1 + \log_2 7$.
    - opgave: |-
        $3\,\e^{-x} = 12$
      antwoord: |-
        $x = -\ln 4$
      uitwerking: |-
        $\e^{-x} = 4$, dus $-x = \ln 4$ en $x = -\ln 4$ (of $\ln \frac14$).

- id: h2-o4
  soort: opdracht
  niveau: 2
  thema: |-
    uitsplitsen
  opgave: |-
    Schrijf met $\log a$ en $\log b$ (met $a, b > 0$).
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log (a^2 b^3)$
      antwoord: |-
        $2\log a + 3\log b$
      uitwerking: |-
        Productregel, dan machtregel: $\log a^2 + \log b^3 = 2\log a + 3\log b$.
    - opgave: |-
        $\log \dfrac{\sqrt{a}}{b}$
      antwoord: |-
        $\frac12 \log a - \log b$
      uitwerking: |-
        Quotiëntregel: $\log a^{\frac12} - \log b = \frac12 \log a - \log b$.
    - opgave: |-
        $\log (100a)$
      antwoord: |-
        $2 + \log a$
      uitwerking: |-
        $\log 100 + \log a = 2 + \log a$.
    - opgave: |-
        $\log \sqrt[3]{a b^2}$
      antwoord: |-
        $\frac13 \log a + \frac23 \log b$
      uitwerking: |-
        $\log (ab^2)^{\frac13} = \frac13 \log(ab^2) = \frac13(\log a + 2\log b) = \frac13 \log a + \frac23 \log b$.
    - opgave: |-
        $\log \dfrac{a}{10b^2}$
      antwoord: |-
        $\log a - 1 - 2\log b$
      uitwerking: |-
        $\log a - \log(10b^2) = \log a - (\log 10 + 2\log b) = \log a - 1 - 2\log b$. Let op de haakjes: de hele noemer wordt afgetrokken.
    - opgave: |-
        $\log \dfrac{1}{a\sqrt{b}}$
      antwoord: |-
        $-\log a - \frac12 \log b$
      uitwerking: |-
        $\log 1 - \log\bigl(a\, b^{\frac12}\bigr) = 0 - \bigl(\log a + \frac12 \log b\bigr) = -\log a - \frac12 \log b$.

- id: h2-o5
  soort: opdracht
  niveau: 2
  thema: |-
    bacteriën
  opgave: |-
    Een kweek begint met $500$ bacteriën. Hun aantal verdubbelt om de $20$ minuten. Na hoeveel tijd zijn er een miljoen?
  antwoord: |-
    na ongeveer 219 minuten (3 u 39 min)
  uitwerking: |-
    Na $t$ minuten zijn er $\frac{t}{20}$ verdubbelingen voorbij: $N(t) = 500 \cdot 2^{\frac{t}{20}}$.\\
    $500 \cdot 2^{\frac{t}{20}} = 10^6 \iff 2^{\frac{t}{20}} = 2000$ (delen door 500).\\
    Definitie: $\frac{t}{20} = \log_2 2000 = \frac{\ln 2000}{\ln 2} \approx 10{,}97$, dus $t \approx 219{,}3$ minuten, ongeveer 3 uur en 39 minuten.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    drill: exponentiële vergelijkingen
  opgave: |-
    Los op. Geef de exacte oplossing en, als dat nodig is, een benadering op drie decimalen. Let op: niet elke vergelijking heeft een oplossing.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $7^x = 30$
      antwoord: |-
        $\log_7 30 \approx 1{,}748$
      uitwerking: |-
        $x = \log_7 30 = \frac{\ln 30}{\ln 7} \approx 1{,}748$.
    - opgave: |-
        $2 \cdot 5^x - 3 = 47$
      antwoord: |-
        $x = 2$
      uitwerking: |-
        $2 \cdot 5^x = 50$, dus $5^x = 25 = 5^2$ en $x = 2$. Hier heb je geen logaritme nodig.
    - opgave: |-
        $\e^{3x} = 20$
      antwoord: |-
        $\frac{\ln 20}{3} \approx 0{,}999$
      uitwerking: |-
        $3x = \ln 20$, dus $x = \frac{\ln 20}{3} \approx 0{,}999$. Niet exact 1: $\e^3 \approx 20{,}09$.
    - opgave: |-
        $4^x = -16$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        Geen oplossing: een macht van 4 is altijd positief.
    - opgave: |-
        $6 \cdot 0{,}9^x = 2$
      antwoord: |-
        $\log_{0{,}9} \frac13 \approx 10{,}427$
      uitwerking: |-
        $0{,}9^x = \frac13$, dus $x = \frac{\ln \frac13}{\ln 0{,}9} \approx 10{,}427$.
    - opgave: |-
        $3^{x + 2} = 5^x$
      antwoord: |-
        $\frac{2\ln 3}{\ln 5 - \ln 3} \approx 4{,}301$
      uitwerking: |-
        $\ln$ van beide leden: $(x + 2)\ln 3 = x\ln 5$.\\
        $x(\ln 5 - \ln 3) = 2\ln 3$, dus $x = \frac{2\ln 3}{\ln 5 - \ln 3} \approx 4{,}301$.
    - opgave: |-
        $10^{1 - x} = 0{,}04$
      antwoord: |-
        $1 - \log 0{,}04 \approx 2{,}398$
      uitwerking: |-
        $1 - x = \log 0{,}04 \approx -1{,}398$, dus $x = 1 - \log 0{,}04 \approx 2{,}398$.
    - opgave: |-
        $2^{2x} = 3 \cdot 2^x$
      antwoord: |-
        $\log_2 3 \approx 1{,}585$
      uitwerking: |-
        $2^{2x} = 2^x \cdot 2^x$. Deel door $2^x$, dat nooit nul is: $2^x = 3$, dus $x = \log_2 3 \approx 1{,}585$.
    - opgave: |-
        $2^x \cdot 3^x = 10$
      antwoord: |-
        $\log_6 10 \approx 1{,}285$
      uitwerking: |-
        Rekenregel voor machten: $2^x \cdot 3^x = 6^x$. Dus $6^x = 10$ en $x = \log_6 10 = \frac{\ln 10}{\ln 6} \approx 1{,}285$.

- id: h2-o22
  soort: opdracht
  niveau: 2
  thema: |-
    rekenen met gegeven logaritmen
  opgave: |-
    Gegeven: $\log 2 \approx 0{,}301$ en $\log 3 \approx 0{,}477$. Bereken zonder rekentoestel, met de rekenregels.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\log 6$
      antwoord: |-
        $\approx 0{,}778$
      uitwerking: |-
        $\log(2 \cdot 3) = \log 2 + \log 3 \approx 0{,}301 + 0{,}477 = 0{,}778$.
    - opgave: |-
        $\log 1{,}5$
      antwoord: |-
        $\approx 0{,}176$
      uitwerking: |-
        $\log \frac32 = \log 3 - \log 2 \approx 0{,}176$.
    - opgave: |-
        $\log 12$
      antwoord: |-
        $\approx 1{,}079$
      uitwerking: |-
        $\log(2^2 \cdot 3) = 2\log 2 + \log 3 \approx 0{,}602 + 0{,}477 = 1{,}079$.
    - opgave: |-
        $\log 5$
      antwoord: |-
        $\approx 0{,}699$
      uitwerking: |-
        $\log \frac{10}{2} = \log 10 - \log 2 \approx 1 - 0{,}301 = 0{,}699$.
    - opgave: |-
        $\log \sqrt{18}$
      antwoord: |-
        $\approx 0{,}628$
      uitwerking: |-
        $\frac12 \log(2 \cdot 3^2) = \frac12(\log 2 + 2\log 3) \approx \frac12(0{,}301 + 0{,}954) \approx 0{,}628$.
    - opgave: |-
        $\log_2 3$
      antwoord: |-
        $\approx 1{,}585$
      uitwerking: |-
        Verandering van grondtal: $\frac{\log 3}{\log 2} \approx \frac{0{,}477}{0{,}301} \approx 1{,}585$.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    afkoelende koffie
  figuur:
    opties: |-
      4.8cm
    code: |-
      \begin{tikzpicture}[x=.075cm,y=.034cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=10,ystep=10] (0,0) grid (60,90);
        \draw[->,grijs] (0,0) -- (65,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,96) node[above,text=black] {$T$};
        \foreach \t in {10,20,...,60}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {20,40,...,80}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \draw[grijs,dashed] (0,20) -- (60,20);
        \kromme{0}{60}{20+65*0.95^(\x)}
      \end{tikzpicture}
  opgave: |-
    Een kop koffie koelt af in een kamer van $20$\,°C. Na $t$ minuten is de temperatuur $T(t) = 20 + 65 \cdot 0{,}95^t$ (in~°C). Hiernaast staat de grafiek.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe warm is de koffie bij het inschenken, en na 10 minuten?
      antwoord: |-
        $85$\,°C; ongeveer $58{,}9$\,°C
      uitwerking: |-
        $T(0) = 20 + 65 = 85$\,°C en $T(10) = 20 + 65 \cdot 0{,}95^{10} \approx 58{,}9$\,°C.
    - opgave: |-
        Na hoeveel minuten is de koffie $50$\,°C? Controleer op de grafiek.
      antwoord: |-
        na ongeveer 15 minuten
      uitwerking: |-
        $20 + 65 \cdot 0{,}95^t = 50 \iff 0{,}95^t = \frac{30}{65} = \frac{6}{13}$.\\
        $t = \frac{\ln \frac{6}{13}}{\ln 0{,}95} \approx 15{,}1$ minuten. Op de grafiek: de hoogte 50 hoort bij $t \approx 15$.
    - opgave: |-
        Wordt de koffie ooit $15$\,°C? Wat betekent de stippellijn?
      antwoord: |-
        nee; de asymptoot $T = 20$
      uitwerking: |-
        Nee: $65 \cdot 0{,}95^t > 0$, dus $T(t) > 20$ voor elke $t$. De stippellijn $T = 20$ is de horizontale asymptoot: de koffie nadert de kamertemperatuur, maar komt er nooit onder.
    - opgave: |-
        Na hoeveel minuten is het verschil met de kamertemperatuur gehalveerd? Toon aan dat dit niet afhangt van het tijdstip waarop je begint.
      antwoord: |-
        na ongeveer $13{,}5$ minuten, telkens opnieuw
      uitwerking: |-
        Het verschil is $T(t) - 20 = 65 \cdot 0{,}95^t$. Het halveert als $0{,}95^h = \frac12$, dus $h = \frac{\ln 0{,}5}{\ln 0{,}95} \approx 13{,}5$ minuten.\\
        Vanaf een tijdstip $t$: $65 \cdot 0{,}95^{t + h} = 65 \cdot 0{,}95^t \cdot 0{,}95^h = \frac12 \cdot 65 \cdot 0{,}95^t$. Dus elke $13{,}5$ minuten halveert het verschil.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    waar zit de fout?
  opgave: |-
    Elke uitwerking bevat een fout. Zoek de fout en los correct op.
  lijst: enumerate
  delen:
    - opgave: |-
        $3 \cdot 2^x = 48 \;\Rightarrow\; 6^x = 48 \;\Rightarrow\; x = \log_6 48 \approx 2{,}161$
      antwoord: |-
        $x = 4$
      uitwerking: |-
        $3 \cdot 2^x$ is niet $6^x$: alleen de macht van 2 heeft exponent $x$. Juist: deel door 3, $2^x = 16 = 2^4$, dus $x = 4$.
    - opgave: |-
        $2^x + 2^x = 64 \;\Rightarrow\; 2^{2x} = 64 \;\Rightarrow\; x = 3$
      antwoord: |-
        $x = 5$
      uitwerking: |-
        Bij een som tel je de exponenten niet op. Juist: $2^x + 2^x = 2 \cdot 2^x = 2^{x + 1} = 64 = 2^6$, dus $x + 1 = 6$ en $x = 5$.
    - opgave: |-
        $\log_2 7 = \dfrac{\log 2}{\log 7} \approx 0{,}356$
      antwoord: |-
        $\approx 2{,}807$
      uitwerking: |-
        Teller en noemer zijn verwisseld. Controle: $2^{0{,}356} \approx 1{,}28$, niet 7. Juist: $\log_2 7 = \frac{\log 7}{\log 2} \approx 2{,}807$.
    - opgave: |-
        $5^{x + 1} = 3^x \;\Rightarrow\; x + \ln 5 = x\ln 3 \;\Rightarrow\; x = \dfrac{\ln 5}{\ln 3 - 1} \approx 16{,}3$
      antwoord: |-
        $\frac{\ln 5}{\ln 3 - \ln 5} \approx -3{,}151$
      uitwerking: |-
        De haakjes ontbreken: $\ln 5^{x + 1} = (x + 1)\ln 5$. Juist: $(x + 1)\ln 5 = x\ln 3$, dus $x(\ln 3 - \ln 5) = \ln 5$ en $x = \frac{\ln 5}{\ln 3 - \ln 5} \approx -3{,}151$.\\
        Dat de oplossing negatief is, kon je verwachten: voor $x \geqslant 0$ is $5^{x + 1} > 5^x \geqslant 3^x$.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    decibel
  opgave: |-
    Het geluidsniveau is $L = 10 \log \frac{I}{I_0}$ (in dB).
  lijst: enumerate
  delen:
    - opgave: |-
        Een concert is $110$ dB, een gesprek $60$ dB. Hoeveel keer intenser is het concert?
      antwoord: |-
        $10^5$ keer
      uitwerking: |-
        $110 - 60 = 10 \log \frac{I_c}{I_0} - 10 \log \frac{I_g}{I_0} = 10 \log \frac{I_c}{I_g}$ (quotiëntregel).\\
        $\log \frac{I_c}{I_g} = 5$, dus $\frac{I_c}{I_g} = 10^5$.
    - opgave: |-
        Een luidspreker geeft $80$ dB. Hoeveel dB geven twee zulke luidsprekers samen (dubbele intensiteit)?
      antwoord: |-
        ongeveer 83 dB
      uitwerking: |-
        Productregel: $10 \log \frac{2I}{I_0} = 10\log 2 + 10 \log \frac{I}{I_0} \approx 3{,}0 + 80 = 83$ dB. Niet $160$ dB: verdubbelen telt er maar $10 \log 2 \approx 3$ dB bij.
    - opgave: |-
        Hoeveel zulke luidsprekers heb je nodig voor $100$ dB?
      antwoord: |-
        100
      uitwerking: |-
        Met $n$ luidsprekers: $10 \log \frac{nI}{I_0} = 10\log n + 80 = 100$.\\
        $\log n = 2$, dus $n = 100$ luidsprekers.

- id: h2-o24
  soort: opdracht
  niveau: 2
  thema: |-
    samenvoegen met letters
  opgave: |-
    Schrijf als één logaritme (met $x, y, z > 0$).
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\log x + 2\log y - \frac12 \log z$
      antwoord: |-
        $\log \dfrac{xy^2}{\sqrt{z}}$
      uitwerking: |-
        Machtregel: $\log x + \log y^2 - \log \sqrt z$. Product- en quotiëntregel: $\log \frac{xy^2}{\sqrt z}$.
    - opgave: |-
        $\ln x - 1$
      antwoord: |-
        $\ln \dfrac{x}{\e}$
      uitwerking: |-
        Schrijf $1 = \ln \e$: $\ln x - \ln \e = \ln \frac{x}{\e}$.
    - opgave: |-
        $2 + \log x$
      antwoord: |-
        $\log(100x)$
      uitwerking: |-
        Schrijf $2 = \log 100$: $\log 100 + \log x = \log(100x)$.
    - opgave: |-
        $\frac13 \log_2 x - \log_2 y + 3$
      antwoord: |-
        $\log_2 \dfrac{8\sqrt[3]{x}}{y}$
      uitwerking: |-
        Schrijf $3 = \log_2 8$ en $\frac13 \log_2 x = \log_2 \sqrt[3]{x}$: $\log_2 \sqrt[3]{x} - \log_2 y + \log_2 8 = \log_2 \frac{8\sqrt[3]{x}}{y}$.

- id: h2-o6
  soort: opdracht
  niveau: 2
  thema: |-
    halveringstijd uit een meting
  opgave: |-
    Van een radioactieve stof is na 3 jaar nog $65$ g over van $80$ g. Bepaal de groeifactor per jaar en de halveringstijd.
  antwoord: |-
    $\approx 0{,}9331$; ongeveer 10 jaar
  uitwerking: |-
    Model $N(t) = 80 \cdot a^t$. Uit $N(3) = 65$: $a^3 = \frac{65}{80} = 0{,}8125$, dus $a = 0{,}8125^{\frac13} \approx 0{,}9331$.\\
    Halveringstijd $T$: $a^T = \frac12$, dus $T = \frac{\ln 0{,}5}{\ln a}$. Met $\ln a = \frac13 \ln 0{,}8125$ wordt dat $T = \frac{3\ln 0{,}5}{\ln 0{,}8125} \approx 10{,}0$ jaar.

- id: h2-o21
  soort: opdracht
  niveau: 2
  thema: |-
    magnitude van sterren
  opgave: |-
    De magnitude van een ster is $m = -2{,}5 \log \frac{I}{I_0}$, met $I$ de helderheid.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat een verschil van 1 magnitude ongeveer een factor $2{,}5$ in helderheid is.
      antwoord: |-
        $10^{0{,}4} \approx 2{,}51$
      uitwerking: |-
        Voor twee sterren: $m_2 - m_1 = -2{,}5 \log \frac{I_2}{I_0} + 2{,}5 \log \frac{I_1}{I_0} = 2{,}5 \log \frac{I_1}{I_2}$.\\
        Is $m_2 - m_1 = 1$, dan $\log \frac{I_1}{I_2} = 0{,}4$ en $\frac{I_1}{I_2} = 10^{0{,}4} \approx 2{,}51$.
    - opgave: |-
        Ster A is 40 keer helderder dan ster B, die magnitude $4{,}2$ heeft. Bereken de magnitude van A.
      antwoord: |-
        $\approx 0{,}2$
      uitwerking: |-
        $m_B - m_A = 2{,}5 \log \frac{I_A}{I_B} = 2{,}5 \log 40 \approx 4{,}0$.\\
        $m_A \approx 4{,}2 - 4{,}0 = 0{,}2$. Een kleinere magnitude: A is helderder.
    - opgave: |-
        Met het blote oog zie je sterren tot magnitude $6$, met een verrekijker tot magnitude $9{,}5$. Hoeveel keer zwakker is de zwakste ster die je met de verrekijker ziet?
      antwoord: |-
        ongeveer 25 keer
      uitwerking: |-
        $9{,}5 - 6 = 3{,}5 = 2{,}5 \log \frac{I_6}{I_{9{,}5}}$, dus $\frac{I_6}{I_{9{,}5}} = 10^{1{,}4} \approx 25$.

- id: h2-o23
  soort: opdracht
  niveau: 2
  thema: |-
    twee groeiende bevolkingen
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.08cm,y=.13cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=10,ystep=5] (0,0) grid (50,25);
        \draw[->,grijs] (0,0) -- (55,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,27) node[above,text=black] {$N$};
        \foreach \t in {10,20,...,50}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {5,10,...,20}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \kromme{0}{50}{2*1.05^(\x)}
        \kromme[dashed]{0}{50}{5*1.02^(\x)}
        \node[right,text=accent] at (50,22.9) {A};
        \node[right,text=accent] at (50,13.5) {B};
      \end{tikzpicture}
  opgave: |-
    Een bevolking A telt $2000$ dieren en groeit met $5$\,\% per jaar. Een bevolking B telt $5000$ dieren en groeit met $2$\,\% per jaar. De figuur toont beide, verticaal in duizenden dieren.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef voor beide een model.
      antwoord: |-
        $A(t) = 2000 \cdot 1{,}05^t$; $B(t) = 5000 \cdot 1{,}02^t$
      uitwerking: |-
        $A(t) = 2000 \cdot 1{,}05^t$ en $B(t) = 5000 \cdot 1{,}02^t$, met $t$ in jaar.
    - opgave: |-
        Na hoeveel jaar zijn ze even groot? Controleer op de figuur.
      antwoord: |-
        na ongeveer $31{,}6$ jaar
      uitwerking: |-
        $2000 \cdot 1{,}05^t = 5000 \cdot 1{,}02^t \iff \frac{1{,}05^t}{1{,}02^t} = 2{,}5 \iff \Bigl(\frac{1{,}05}{1{,}02}\Bigr)^t = 2{,}5$.\\
        $t = \frac{\ln 2{,}5}{\ln \frac{1{,}05}{1{,}02}} \approx 31{,}6$ jaar. Op de figuur snijden de grafieken bij $t \approx 32$.\\
        Of: neem $\ln$ van beide leden, $\ln 2000 + t\ln 1{,}05 = \ln 5000 + t\ln 1{,}02$: hetzelfde antwoord.
    - opgave: |-
        Hoeveel dieren telt elke bevolking dan?
      antwoord: |-
        ongeveer 9350
      uitwerking: |-
        Vul de onafgeronde $t$ in: $A(t) = 2000 \cdot 1{,}05^{t} \approx 9350$ en $B(t) = 5000 \cdot 1{,}02^{t} \approx 9350$. Met $t = 31{,}6$ krijg je ongeveer $9346$ en $9348$: de kleine afwijking komt van het afronden.

- id: h2-o20
  soort: opdracht
  niveau: 2
  thema: |-
    licht onder water
  opgave: |-
    In helder zeewater neemt de lichtsterkte per meter diepte met $8$\,\% af.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk percentage van het licht aan het oppervlak bereikt een duiker op $10$ m diepte?
      antwoord: |-
        ongeveer $43$\,\%
      uitwerking: |-
        Groeifactor per meter $0{,}92$: $0{,}92^{10} \approx 0{,}434$, dus ongeveer $43$\,\%.
    - opgave: |-
        Op welke diepte is de lichtsterkte gehalveerd?
      antwoord: |-
        ongeveer $8{,}3$ m
      uitwerking: |-
        $0{,}92^d = 0{,}5$, dus $d = \frac{\ln 0{,}5}{\ln 0{,}92} \approx 8{,}3$ m.
    - opgave: |-
        Planten hebben minstens $1$\,\% van het licht aan het oppervlak nodig. Op welke diepte is er nog precies $1$\,\% over?
      antwoord: |-
        ongeveer $55$ m
      uitwerking: |-
        $0{,}92^d = 0{,}01$, dus $d = \frac{\ln 0{,}01}{\ln 0{,}92} \approx 55{,}2$ m. Dieper groeien er geen planten.

- id: h2-o8
  soort: opdracht
  niveau: 3
  thema: |-
    substitutie
  opgave: |-
    Los op: $4^x - 3 \cdot 2^x - 4 = 0$. Tip: stel $t = 2^x$ en merk op dat $4^x = t^2$.
  antwoord: |-
    $x = 2$
  uitwerking: |-
    Stel $t = 2^x$. Dan is $4^x = (2^2)^x = (2^x)^2 = t^2$, en de vergelijking wordt $t^2 - 3t - 4 = 0$.\\
    Ontbinden: $(t - 4)(t + 1) = 0$, dus $t = 4$ of $t = -1$.\\
    $2^x = -1$ kan niet, want $2^x > 0$. $2^x = 4 = 2^2$ geeft $x = 2$.

- id: h2-o25
  soort: opdracht
  niveau: 3
  thema: |-
    grote machten vergelijken
  opgave: |-
    Gebruik $\log 2 \approx 0{,}3010$ en $\log 3 \approx 0{,}4771$, niet je rekentoestel. Deze getallen zijn te groot om gewoon uit te rekenen.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk getal is groter: $2^{100}$ of $3^{63}$?
      antwoord: |-
        $2^{100}$
      uitwerking: |-
        Vergelijk de logaritmen; $\log$ is stijgend, dus het grootste getal heeft de grootste logaritme.\\
        $\log 2^{100} = 100 \log 2 \approx 30{,}10$ en $\log 3^{63} = 63 \log 3 \approx 30{,}06$. Dus $2^{100}$ is groter, ongeveer $10^{0{,}04} \approx 1{,}1$ keer.
    - opgave: |-
        Rangschik van klein naar groot: $2^{75}$, $3^{47}$ en $5^{32}$.
      antwoord: |-
        $5^{32} < 3^{47} < 2^{75}$
      uitwerking: |-
        $\log 2^{75} = 75 \cdot 0{,}3010 \approx 22{,}58$ en $\log 3^{47} = 47 \cdot 0{,}4771 \approx 22{,}42$.\\
        $\log 5 = \log \frac{10}{2} = 1 - \log 2 \approx 0{,}6990$, dus $\log 5^{32} \approx 22{,}37$.\\
        Dus $5^{32} < 3^{47} < 2^{75}$.

- id: h2-o9
  soort: opdracht
  niveau: 3
  thema: |-
    de regel van 70
  opgave: |-
    Economen schatten de verdubbelingstijd bij een groei van $p$\,\% per jaar met $T \approx \frac{70}{p}$ jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de exacte verdubbelingstijd $T = \dfrac{\ln 2}{\ln\bigl(1 + \frac{p}{100}\bigr)}$ is.
      antwoord: |-
        bewijs
      uitwerking: |-
        Na $T$ jaar is een bedrag $K_0$ gegroeid tot $K_0\bigl(1 + \frac{p}{100}\bigr)^T$. Verdubbeld betekent $K_0\bigl(1 + \frac{p}{100}\bigr)^T = 2K_0$, en na delen door $K_0$: $\bigl(1 + \frac{p}{100}\bigr)^T = 2$.\\
        Neem $\ln$ van beide leden en gebruik de machtregel: $T \ln\bigl(1 + \frac{p}{100}\bigr) = \ln 2$. Deel door $\ln\bigl(1 + \frac{p}{100}\bigr)$, dat niet nul is omdat $p > 0$.
    - opgave: |-
        Vergelijk de exacte waarde en de schatting voor $p = 1$, $3$, $7$ en $10$.
      antwoord: |-
        $69{,}7$; $23{,}4$; $10{,}2$; $7{,}3$ tegenover $70$; $23{,}3$; $10$; $7$
      uitwerking: |-
        Exact: $\frac{\ln 2}{\ln 1{,}01} \approx 69{,}7$, $\frac{\ln 2}{\ln 1{,}03} \approx 23{,}4$, $\frac{\ln 2}{\ln 1{,}07} \approx 10{,}2$ en $\frac{\ln 2}{\ln 1{,}10} \approx 7{,}3$ jaar.\\
        Schatting: $70$, $23{,}3$, $10$ en $7$ jaar. De schatting is goed voor kleine $p$ en wordt minder goed als $p$ groter wordt.
    - opgave: |-
        Bereken $\ln 1{,}01$, $\ln 1{,}03$ en $\ln 2$. Verklaar de regel.
      antwoord: |-
        $\ln(1 + x) \approx x$ voor kleine $x$, en $\ln 2 \approx 0{,}69$
      uitwerking: |-
        $\ln 1{,}01 \approx 0{,}00995$ en $\ln 1{,}03 \approx 0{,}0296$: voor kleine $x$ is $\ln(1 + x) \approx x$. Dus $\ln\bigl(1 + \frac{p}{100}\bigr) \approx \frac{p}{100}$ en
        $T \approx \frac{0{,}693}{p/100} = \frac{69{,}3}{p}$. Men neemt $70$ omdat het makkelijker deelt (door 2, 5, 7 en 10).

- id: h2-o26
  soort: opdracht
  niveau: 3
  thema: |-
    een irrationale logaritme
  opgave: |-
    We tonen aan dat $\log_2 3$ geen breuk is.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel dat $\log_2 3 = \frac{p}{q}$ met $p$ en $q$ strikt positieve gehele getallen. Toon aan dat dan $2^p = 3^q$, en leid een tegenstrijdigheid af. Waarom mag je $p$ en $q$ positief nemen?
      antwoord: |-
        even = oneven, onmogelijk
      uitwerking: |-
        $\log_2 3 > 0$, want $3 > 1$; een positieve breuk kun je schrijven met $p, q > 0$.\\
        Definitie: $2^{\frac{p}{q}} = 3$. Verhef beide leden tot de macht $q$: $2^p = 3^q$.\\
        Maar $2^p$ is even (want $p \geqslant 1$) en $3^q$ is oneven, als product van oneven getallen. Tegenstrijdig, dus $\log_2 3$ is geen breuk: het is irrationaal.
    - opgave: |-
        Is $\log_4 8$ rationaal? En $\log_2 10$? Waarom werkt de redenering van a niet bij $\log_4 8$?
      antwoord: |-
        $\log_4 8 = \frac32$ wel; $\log_2 10$ niet
      uitwerking: |-
        $\log_4 8 = \frac32$ is rationaal. De redenering zou $4^p = 8^q$ geven, dus $2^{2p} = 2^{3q}$: beide even, geen tegenstrijdigheid (en $p = 3$, $q = 2$ werkt).\\
        $\log_2 10 = \frac{p}{q}$ zou $2^p = 10^q = 2^q \cdot 5^q$ geven. Rechts staat een factor 5, links niet: tegenstrijdig, dus $\log_2 10$ is irrationaal.

- id: h2-o10
  soort: opdracht
  niveau: 3
  thema: |-
    bewijzen
  opgave: |-
    Bewijs (voor positieve $a$, $b$, $c$ en $x$, met grondtallen verschillend van 1):
  lijst: enumerate
  delen:
    - opgave: |-
        $\log_a b \cdot \log_b a = 1$
      antwoord: |-
        bewijs
      uitwerking: |-
        Verandering van grondtal naar $\ln$: $\log_a b \cdot \log_b a = \frac{\ln b}{\ln a} \cdot \frac{\ln a}{\ln b} = 1$. Dat mag, want $\ln a \neq 0$ en $\ln b \neq 0$ omdat $a, b \neq 1$.
    - opgave: |-
        $\log_{a^2} x = \frac12 \log_a x$
      antwoord: |-
        bewijs
      uitwerking: |-
        Verandering van grondtal en machtregel: $\log_{a^2} x = \frac{\ln x}{\ln a^2} = \frac{\ln x}{2\ln a} = \frac12 \cdot \frac{\ln x}{\ln a} = \frac12 \log_a x$.
    - opgave: |-
        $a^{\log_b c} = c^{\log_b a}$
      antwoord: |-
        bewijs
      uitwerking: |-
        Schrijf $a = b^{\log_b a}$ en $c = b^{\log_b c}$ (definitie). Met de rekenregel $(b^r)^s = b^{rs}$:\\
        $a^{\log_b c} = \bigl(b^{\log_b a}\bigr)^{\log_b c} = b^{\log_b a \cdot \log_b c}$ en $c^{\log_b a} = \bigl(b^{\log_b c}\bigr)^{\log_b a} = b^{\log_b c \cdot \log_b a}$.\\
        De exponenten zijn gelijk, dus de machten ook. Bijvoorbeeld $2^{\log_3 7} = 7^{\log_3 2} \approx 3{,}41$.

- id: h2-o27
  soort: opdracht
  niveau: 3
  thema: |-
    vergelijking met een parameter
  opgave: |-
    Neem de vergelijking $4^x - 2^{x + 1} = c$, met $c$ een reëel getal. Stel $t = 2^x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Los op voor $c = 3$.
      antwoord: |-
        $x = \log_2 3$
      uitwerking: |-
        $4^x = t^2$ en $2^{x + 1} = 2t$, dus $t^2 - 2t - 3 = 0$, of $(t - 3)(t + 1) = 0$.\\
        $t = -1$ kan niet ($2^x > 0$). $2^x = 3$ geeft $x = \log_2 3 \approx 1{,}585$.
    - opgave: |-
        Los op voor $c = -\frac34$.
      antwoord: |-
        $x = -1$ of $x = \log_2 \frac32$
      uitwerking: |-
        $t^2 - 2t + \frac34 = 0$, dus $4t^2 - 8t + 3 = 0$ en $(2t - 1)(2t - 3) = 0$: $t = \frac12$ of $t = \frac32$.\\
        Beide zijn positief: $2^x = \frac12$ geeft $x = -1$, en $2^x = \frac32$ geeft $x = \log_2 \frac32 \approx 0{,}585$.
    - opgave: |-
        Voor welke $c$ heeft de vergelijking twee oplossingen? Eén? Geen?
      antwoord: |-
        twee als $-1 < c < 0$; één als $c = -1$ of $c \geqslant 0$; geen als $c < -1$
      uitwerking: |-
        Elke positieve oplossing $t$ van $t^2 - 2t - c = 0$ geeft precies één $x = \log_2 t$. Tel dus de positieve oplossingen.\\
        Discriminant $4 + 4c$: geen oplossingen als $c < -1$, één ($t = 1$, $x = 0$) als $c = -1$.\\
        Als $c > -1$: twee oplossingen met som $2$ en product $-c$. Zijn beide positief, dan is het product positief: $-1 < c < 0$ geeft twee oplossingen. Als $c > 0$ is het product negatief: één positieve en één negatieve $t$, dus één $x$. Als $c = 0$: $t = 0$ of $t = 2$, dus één $x$.\\
        Samen: twee oplossingen als $-1 < c < 0$, één als $c = -1$ of $c \geqslant 0$, geen als $c < -1$.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: discreet
    onderwerp: Telproblemen
  thema: |-
    cijfers tellen
  opgave: |-
    Een getal $N \geqslant 1$ heeft $k$ cijfers als $10^{k - 1} \leqslant N < 10^k$. Hoeveel cijfers heeft $2^{100}$? Hoeveel cijfers heeft een miljoen in het tweetallig stelsel?
  antwoord: |-
    31; 20
  uitwerking: |-
    $\log 2^{100} = 100 \log 2 \approx 30{,}1$, dus $10^{30} \leqslant 2^{100} < 10^{31}$: 31 cijfers. $\log_2 10^6 \approx 19{,}93$, dus $2^{19} \leqslant 10^6 < 2^{20}$: 20 cijfers.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: Kansrekenen
  thema: |-
    bijna zeker een zes
  opgave: |-
    Hoeveel keer moet je minstens met een dobbelsteen gooien om met kans $0{,}99$ minstens één zes te hebben?
  antwoord: |-
    26
  uitwerking: |-
    $1 - \bigl(\frac56\bigr)^n \geqslant 0{,}99 \iff \bigl(\frac56\bigr)^n \leqslant 0{,}01 \iff n \geqslant \frac{\ln 0{,}01}{\ln \frac56} \approx 25{,}3$. Het teken keert om, want $\ln \frac56 < 0$. Dus 26 worpen.

- id: h2-koppel-3
  soort: koppel
  niveau: 1
  koppel:
    rubriek: analyse
    onderwerp: Integralen
  thema: |-
    ln als oppervlakte
  opgave: |-
    Een primitieve van $\frac1x$ (voor $x > 0$) is $\ln x$. Bereken $\int_1^{\e} \frac1x\,\mathrm{d}x$ en $\int_1^{2} \frac1x\,\mathrm{d}x$.
  antwoord: |-
    1; $\ln 2 \approx 0{,}693$
  uitwerking: |-
    $\ln \e - \ln 1 = 1$ en $\ln 2 - \ln 1 = \ln 2 \approx 0{,}693$.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    definitie
  opgave: |-
    Bereken zonder rekentoestel: $\log_2 64$, $\log_{25} 5$ en $\log 0{,}0001$.
  antwoord: |-
    6; $\frac12$; $-4$
  uitwerking: |-
    $2^6 = 64$, dus $\log_2 64 = 6$. $25^{\frac12} = \sqrt{25} = 5$, dus $\log_{25} 5 = \frac12$. $10^{-4} = 0{,}0001$, dus $\log 0{,}0001 = -4$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    rekenregels
  opgave: |-
    Bereken: $\log_2 40 - \log_2 5$ en $\log 2 + \log 50$.
  antwoord: |-
    3; 2
  uitwerking: |-
    Quotiëntregel: $\log_2 \frac{40}{5} = \log_2 8 = 3$. Productregel: $\log(2 \cdot 50) = \log 100 = 2$.

- id: h2-t8
  soort: test
  niveau: 1
  thema: |-
    uitsplitsen
  opgave: |-
    Schrijf $\log \dfrac{a^3}{\sqrt{b}}$ met $\log a$ en $\log b$ (met $a, b > 0$).
  antwoord: |-
    $3\log a - \frac12 \log b$
  uitwerking: |-
    Quotiëntregel: $\log a^3 - \log b^{\frac12}$. Machtregel: $3\log a - \frac12 \log b$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    rekentoestel
  opgave: |-
    Bereken $\log_3 20$ op drie decimalen en controleer.
  antwoord: |-
    $\approx 2{,}727$
  uitwerking: |-
    Verandering van grondtal: $\log_3 20 = \frac{\ln 20}{\ln 3} \approx 2{,}727$. Controle: $3^{2{,}727} \approx 20{,}0$.

- id: h2-t4
  soort: test
  niveau: 1
  thema: |-
    vergelijking
  opgave: |-
    Los op: $4 \cdot 1{,}5^x = 30$.
  antwoord: |-
    $\approx 4{,}969$
  uitwerking: |-
    Delen door 4: $1{,}5^x = 7{,}5$. Definitie: $x = \log_{1{,}5} 7{,}5 = \frac{\ln 7{,}5}{\ln 1{,}5} \approx 4{,}969$.

- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    twee grondtallen
  opgave: |-
    Los op, op drie decimalen: $2^{x + 3} = 5^x$.
  antwoord: |-
    $\approx 2{,}269$
  uitwerking: |-
    $\ln$ van beide leden: $(x + 3)\ln 2 = x\ln 5$.\\
    $x(\ln 5 - \ln 2) = 3\ln 2$, dus $x = \frac{3\ln 2}{\ln 5 - \ln 2} \approx 2{,}269$. Controle: $2^{5{,}269} \approx 38{,}6 \approx 5^{2{,}269}$.

- id: h2-t5
  soort: test
  niveau: 2
  thema: |-
    verdubbelingstijd
  opgave: |-
    Na hoeveel jaar is een kapitaal verdubbeld bij $4{,}5$\,\% samengestelde intrest per jaar?
  antwoord: |-
    na 16 jaar ($t \approx 15{,}75$)
  uitwerking: |-
    $K_0 \cdot 1{,}045^t = 2K_0 \iff 1{,}045^t = 2$, dus $t = \frac{\ln 2}{\ln 1{,}045} \approx 15{,}75$. De intrest wordt per jaar bijgeteld: na 16 jaar is het kapitaal verdubbeld.

- id: h2-t7
  soort: test
  niveau: 2
  thema: |-
    logaritmische schaal
  opgave: |-
    Azijn heeft pH $2{,}9$, melk pH $6{,}5$. Hoeveel keer zuurder is azijn? Gebruik $\mathrm{pH} = -\log [\mathrm{H}^+]$.
  antwoord: |-
    ongeveer 4000 keer
  uitwerking: |-
    $[\mathrm{H}^+] = 10^{-\mathrm{pH}}$, dus $\frac{10^{-2{,}9}}{10^{-6{,}5}} = 10^{6{,}5 - 2{,}9} = 10^{3{,}6} \approx 3981$: ongeveer 4000 keer.
