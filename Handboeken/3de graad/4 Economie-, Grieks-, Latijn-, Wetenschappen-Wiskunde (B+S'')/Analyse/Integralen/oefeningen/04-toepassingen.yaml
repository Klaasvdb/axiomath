        \gebiedtussen{1}{4}{1/(\x)^2}{1/(\x)^3}
        \rooster{0}{1}{4}{0}{1}{1}
        \kromme{1}{4}{1/(\x)^2}
        \kromme[dashed]{1}{4}{1/(\x)^3}
      \end{tikzpicture}
  opgave: |-
    Het gebied tussen $y = \dfrac{1}{x^2}$ en $y = \dfrac{1}{x^3}$, met $x \geqslant 1$, loopt naar rechts tot in het oneindige. Bereken de oppervlakte.
  antwoord: |-
    $\tfrac12$
  uitwerking: |-
    Voor $x\geqslant 1$ ligt $\tfrac{1}{x^2}$ bovenaan: $\displaystyle\int_1^{+\infty}\dfrac{1}{x^2}\dx-\int_1^{+\infty}\dfrac{1}{x^3}\dx=1-\dfrac12=\dfrac12$.

- id: h4-o22
  soort: opdracht
  niveau: 2
  thema: |-
    energie uit vermogen
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.3cm,y=.5cm,font=\scriptsize]
        \gebied{7}{18}{3*sin((\x-7)*16.3636)}
        \draw[black!14,very thin,xstep=2,ystep=1] (6,0) grid (20,3);
        \draw[->,grijs] (6,0) -- (20.8,0) node[right,text=black] {$t$};
        \draw[->,grijs] (6,0) -- (6,3.6) node[above,text=black] {$P$};
        \draw[accent,dashed] (7,0) -- (12,3) -- (18,0);
