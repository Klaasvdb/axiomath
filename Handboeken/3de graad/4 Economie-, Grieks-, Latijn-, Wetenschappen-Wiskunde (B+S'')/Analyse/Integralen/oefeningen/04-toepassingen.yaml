- id: h4-o23
  soort: opdracht
  niveau: 3
  thema: |-
    divergent, en toch een eindig volume
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.75cm,y=.8cm,font=\scriptsize]
        \fill[accent!25] (1,-1) .. controls (1.6,-.5) and (2.5,-.3) .. (4.4,-.23) -- (4.4,.23) .. controls (2.5,.3) and (1.6,.5) .. (1,1) -- cycle;
        \assen{-.1}{4.8}{-1.3}{1.4}
        \kromme{1}{4.4}{1/\x}
        \kromme[dashed]{1}{4.4}{-1/\x}
        \draw[accent] (1,0) ellipse (.13 and 1);
        \draw[accent] (2,0) ellipse (.07 and .5);
        \node[below] at (1.25,-.1) {1};
      \end{tikzpicture}
  opgave: |-
    Wentel de grafiek van $y = \dfrac1x$ op $[1, +\infty[$ om de $x$-as. Dat lichaam lijkt op een oneindig lange hoorn.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de hoorn een eindig volume heeft, en bereken het.
      antwoord: |-
        $\pi$
      uitwerking: |-
        $\pi\displaystyle\int_1^{+\infty}\dfrac{1}{x^2}\dx=\pi$.
    - opgave: |-
        Toon aan dat de oppervlakte onder de grafiek oneindig is.
      antwoord: |-
        divergent
      uitwerking: |-
        $\displaystyle\int_1^{+\infty}\dfrac1x\dx$ divergeert.
    - opgave: |-
        Zijn de twee antwoorden in tegenspraak? Leg uit.
      antwoord: |-
        nee
      uitwerking: |-
        Nee. De straal $\tfrac1x$ gaat naar 0, en in het volume telt het kwadraat van de straal, dus $\tfrac{1}{x^2}$, en dat is veel kleiner. Het zijn ook verschillende grootheden: een oppervlakte in het vlak en een volume.

- id: h4-o24
  soort: opdracht
  niveau: 3
  thema: |-
    ontsnappingssnelheid
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.75cm,y=1cm,font=\scriptsize]
        \gebied{1}{4.2}{1/(\x)^2}
        \draw[->,grijs] (-.1,0) -- (4.6,0) node[right,text=black] {$r$};
        \draw[->,grijs] (0,-.05) -- (0,1.35) node[above,text=black] {$F$};
        \kromme{.9}{4.2}{1/(\x)^2}
        \node[below] at (1,0) {$R$};
      \end{tikzpicture}
  opgave: |-
    De kracht van de zwaartekracht op een massa $m$ op afstand $r$ van het midden van de aarde is $F(r) = \dfrac{GMm}{r^2}$. Neem $GM = 3{,}986 \cdot 10^{14}$ m³/s² en de straal $R = 6{,}371 \cdot 10^{6}$ m.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de arbeid om $m$ van het aardoppervlak helemaal weg te brengen, als functie van $m$.
      antwoord: |-
        $\tfrac{GMm}{R}$
      uitwerking: |-
        $\displaystyle\int_R^{+\infty}\dfrac{GMm}{r^2}\,\mathrm{d}r=\displaystyle\lim_{b\to+\infty}GMm\Bigl(\dfrac1R-\dfrac1b\Bigr)=\dfrac{GMm}{R}$.
    - opgave: |-
        Stel die arbeid gelijk aan de bewegingsenergie $\tfrac12 m v^2$. Bereken de ontsnappingssnelheid $v$ in km/s, op één decimaal.
      antwoord: |-
        $\approx 11{,}2$ km/s
      uitwerking: |-
        $v=\sqrt{\dfrac{2GM}{R}}\approx 11\,186$ m/s. De massa $m$ valt weg.

- id: h4-machten
  soort: opdracht
  niveau: 3
  thema: |-
    machten van x: convergentie volgens de exponent
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.85cm,y=.72cm,font=\scriptsize]
        \rooster{0}{1}{4}{0}{1}{3}
        \draw[lijngrijs,dashed] (1,0) -- (1,3);
        \kromme{.58}{4}{1/(\x)^2}
        \kromme[very thick]{.34}{4}{1/\x}
        \kromme[dashed]{.112}{4}{1/sqrt(\x)}
      \end{tikzpicture}
  opgave: |-
    Of een oneindig gebied eindig is, hangt af van hoe snel de functie daalt. We onderzoeken dat voor de machten van $x$: de functies $y = \dfrac{1}{x^p}$, met $p > 0$. In de figuur staan $p = 2$, $p = 1$ (dik) en $p = \tfrac12$ (gestreept).
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat voor $p \neq 1$ geldt: $\ig_1^b \dfrac{1}{x^p}\dx = \dfrac{b^{1-p} - 1}{1 - p}$ en $\ig_c^1 \dfrac{1}{x^p}\dx = \dfrac{1 - c^{1-p}}{1 - p}$.
      uitwerking: |-
        $\dfrac{x^{1-p}}{1-p}$ is een primitieve van $x^{-p}$. Vul de grenzen in.
    - opgave: |-
        Voor welke $p$ convergeert $\ig_1^{+\infty} \dfrac{1}{x^p}\dx$, en naar welke waarde?
      antwoord: |-
        $p>1$, naar $\tfrac{1}{p-1}$
      uitwerking: |-
        Is $p>1$, dan $1-p<0$ en $b^{1-p}\to 0$: de limiet is $\dfrac{-1}{1-p}=\dfrac{1}{p-1}$. Is $p<1$, dan $b^{1-p}\to+\infty$: divergent. Is $p=1$, dan is de primitieve $\ln x$ en $\ln b\to+\infty$: divergent.
    - opgave: |-
        Voor welke $p$ convergeert $\ig_0^1 \dfrac{1}{x^p}\dx$, en naar welke waarde?
      antwoord: |-
        $p<1$, naar $\tfrac{1}{1-p}$
      uitwerking: |-
        Is $p<1$, dan $1-p>0$ en $c^{1-p}\to 0$ voor $c$ naar 0: de limiet is $\dfrac{1}{1-p}$. Is $p>1$, dan $c^{1-p}\to+\infty$: divergent. Is $p=1$, dan $\ln c\to-\infty$: divergent.
    - opgave: |-
        Waarom zijn de voorwaarden omgekeerd? Leg dat uit met de figuur, links en rechts van $x = 1$.
      uitwerking: |-
        Rechts van $x=1$ ligt $\tfrac{1}{x^2}$ het laagst: ze gaat het snelst naar 0, en daar is de oppervlakte eindig. Links van $x=1$ ligt diezelfde functie het hoogst: ze schiet het snelst omhoog, en daar is de oppervlakte oneindig. Bij $\tfrac{1}{\sqrt{x}}$ is het net andersom. $\tfrac1x$ zit op de grens, en haar oppervlakte is aan beide kanten oneindig.
    - opgave: |-
        Lees af zonder te rekenen: convergeren $\ig_1^{+\infty} x^{-3/2}\dx$ en $\ig_0^1 x^{-3/2}\dx$?
      antwoord: |-
        de eerste wel, de tweede niet
      uitwerking: |-
        $p=\tfrac32>1$: de eerste convergeert (naar 2), de tweede divergeert.

- id: h4-o25
  soort: opdracht
  niveau: 3
  thema: |-
    arbeid: een put leegpompen
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.75cm,y=.55cm,font=\scriptsize]
        \fill[accent!25] (-1,-5) rectangle (1,0);
        \fill[accent!55] (-1,-2.4) rectangle (1,-2);
        \draw[thick,grijs] (-1,.3) -- (-1,-5) -- (1,-5) -- (1,.3);
        \draw[grijs] (-1.7,0) -- (-1,0) (1,0) -- (1.7,0);
        \draw[grijs,<->] (1.5,0) -- (1.5,-2) node[midway,right,text=black] {$y$};
        \draw[grijs,<->] (-1.5,0) -- (-1.5,-5) node[midway,left,text=black] {5};
        \draw[grijs,<->] (0,-4.6) -- (1,-4.6) node[midway,above,text=black] {1};
      \end{tikzpicture}
  opgave: |-
    Een cilindrische put heeft een straal van 1 m en een diepte van 5 m, en staat vol water. Water heeft een massadichtheid van 1000 kg/m³. Neem $g = 9{,}81$ m/s².
  lijst: enumerate
  delen:
    - opgave: |-
        Een plakje water op diepte $y$ heeft een dikte $\Delta y$. Hoe groot is de arbeid om het plakje naar boven te brengen?
      uitwerking: |-
        Massa: $1000\cdot\pi\cdot 1^2\cdot\Delta y$. Kracht maal afstand: $1000\pi\cdot 9{,}81\cdot y\,\Delta y$.
    - opgave: |-
        Bereken de arbeid om de put leeg te pompen. Rond af op kJ.
      antwoord: |-
        $\approx 385$ kJ
      uitwerking: |-
        $9810\pi\displaystyle\int_0^5 y\,\mathrm{d}y=9810\pi\cdot 12{,}5\approx 385\,238$ J.
    - opgave: |-
        Waarom is dat niet gelijk aan het gewicht van al het water maal 5 m?
      uitwerking: |-
        Niet al het water komt van 5 m diep. Het zwaartepunt ligt op 2,5 m, en het resultaat is gewicht maal 2,5 m.

- id: h4-o26
  soort: opdracht
  niveau: 3
  thema: |-
    oneigenlijk: grenswaarde van $p$
  opgave: |-
    Onderzoek voor welke $p$ de integraal $\ig_{\e}^{+\infty} \dfrac{1}{x(\ln x)^p}\dx$ convergeert. Gebruik $u = \ln x$. Bereken de waarde voor $p = 2$.
  antwoord: |-
    Convergent als $p>1$; voor $p=2$ is de waarde 1.
  uitwerking: |-
    $u=\ln x$, grenzen 1 en $+\infty$: $\displaystyle\int_1^{+\infty}\dfrac{1}{u^p}\du$, en dat convergeert precies als $p>1$. Voor $p=2$: 1.

- id: h4-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Ruimtemeetkunde
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
        \fill[accent!30] (-2,0) arc (180:0:2) -- cycle;
        \draw[accent,thick] (-2,0) arc (180:0:2) -- cycle;
        \draw[accent,thick] (3,0) rectangle (7,2);
        \fill[accent!30] (3,0) rectangle (7,2);
        \fill[white] (5,0) -- (3,2) -- (7,2) -- cycle;
        \draw[accent,thick] (3,0) rectangle (7,2);
        \draw[accent,thick] (5,0) -- (3,2) (5,0) -- (7,2);
        \draw[accent,very thick] (-1.732,1) -- (1.732,1);
        \draw[accent,very thick] (3,1) -- (4,1) (6,1) -- (7,1);
        \draw[grijs,dashed] (-2.5,1) -- (7.5,1);
        \node[above] at (7.6,1) {$x$};
      \end{tikzpicture}
  opgave: |-
    Zet een halve bol met straal $r$ op haar platte kant. Zet ernaast een cilinder met straal $r$ en hoogte $r$, waaruit een kegel is gehaald: het grondvlak van de kegel is de bovenkant van de cilinder, en de top ligt in het midden van de onderkant.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken op hoogte $x$ de oppervlakte van de doorsnede van de halve bol.
      uitwerking: |-
        Een cirkel met straal $\sqrt{r^2-x^2}$: $\pi(r^2-x^2)$.
    - opgave: |-
        Bereken op hoogte $x$ de oppervlakte van de doorsnede van het andere lichaam.
      uitwerking: |-
        Op hoogte $x$ is de kegel een cirkel met straal $x$. De doorsnede is een ring: $\pi r^2-\pi x^2$.
    - opgave: |-
        Wat besluit je over de twee volumes? Bereken daaruit het volume van de bol zonder integraal.
      uitwerking: |-
        Dezelfde $A(x)$ op elke hoogte, dus hetzelfde volume (Cavalieri). Halve bol: $\pi r^3-\tfrac13\pi r^3=\tfrac23\pi r^3$. Dus de bol heeft $\tfrac43\pi r^3$.
  antwoord: |-
    \textbf{a, b.}~$\pi(r^2-x^2)$ \quad \textbf{c.}~even groot; $\tfrac43\pi r^3$

- id: h4-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: discreet
    onderwerp: |-
      Telproblemen
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.5cm,y=1.35cm,font=\scriptsize]
        \gebied[accent!16]{0}{7}{(\x)^2*exp(-\x)}
        \rooster{0}{1}{7}{0}{1}{1}
        \kromme[dashed]{0}{7}{exp(-\x)}
        \kromme{0}{7}{\x*exp(-\x)}
        \kromme[very thick]{0}{7}{(\x)^2*exp(-\x)}
      \end{tikzpicture}
  opgave: |-
    Faculteiten als integraal. Noem $I_n = \ig_0^{+\infty} x^n \e^{-x}\dx$. Je mag gebruiken dat $\displaystyle\lim_{b \to +\infty} b^n \e^{-b} = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $I_0$.
      antwoord: |-
        1
      uitwerking: |-
        $\displaystyle\int_0^{+\infty}\e^{-x}\dx=1$.
    - opgave: |-
        Toon met partiële integratie aan: $I_n = n\,I_{n-1}$ voor $n \geqslant 1$.
      uitwerking: |-
        $f=x^n$, $g=-\e^{-x}$: $\bigl[-x^n\e^{-x}\bigr]_0^{+\infty}+n\displaystyle\int_0^{+\infty}x^{n-1}\e^{-x}\dx=n\,I_{n-1}$.
    - opgave: |-
        Toon aan: $I_n = n!$. Bereken $I_5$.
      antwoord: |-
        $I_5=120$
      uitwerking: |-
        $I_0=1=0!$ en dezelfde recursie als faculteiten: $n!=n\cdot(n-1)!$. Dus $I_5=5!=120$.

- id: h4-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: data
    onderwerp: |-
      Statistiek
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.5cm,y=3.4cm,font=\scriptsize]
        \gebied{3}{7.2}{.5*exp(-\x/2)}
        \draw[black!14,very thin,xstep=1,ystep=.1] (0,0) grid (7,.5);
        \draw[->,grijs] (0,0) -- (7.6,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,0) -- (0,.58) node[above,text=black] {$f$};
        \kromme{0}{7.2}{.5*exp(-\x/2)}
        \draw[accent,dashed] (1.386,0) -- (1.386,.25);
        \foreach \t in {1,3,5,7} \node[below] at (\t,0) {\t};
        \node[left] at (0,.5) {0,5};
      \end{tikzpicture}
  opgave: |-
    De levensduur $X$ (in jaar) van een lamp heeft de dichtheid $f(x) = \tfrac12 \e^{-x/2}$ voor $x \geqslant 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de totale oppervlakte onder de dichtheid gelijk is aan 1.
      uitwerking: |-
        $\displaystyle\lim_{b\to+\infty}\Bigl[-\e^{-x/2}\Bigr]_0^b=1$.
    - opgave: |-
        Bereken de kans dat de lamp langer dan 3 jaar meegaat. Rond af op drie decimalen.
      antwoord: |-
        $\e^{-1{,}5}\approx 0{,}223$
      uitwerking: |-
        $\displaystyle\int_3^{+\infty}f(x)\dx=\e^{-3/2}\approx 0{,}223$.
    - opgave: |-
        De verwachte levensduur is $\ig_0^{+\infty} x f(x)\dx$. Bereken die.
      antwoord: |-
        2 jaar
      uitwerking: |-
        Partieel: $\bigl[-(x+2)\e^{-x/2}\bigr]_0^{+\infty}=2$.
    - opgave: |-
        Na hoeveel jaar is de helft van de lampen stuk? Waarom is dat niet de verwachte levensduur?
      antwoord: |-
        $2\ln 2\approx 1{,}39$ jaar
      uitwerking: |-
        $1-\e^{-t/2}=\tfrac12$ geeft $t=2\ln 2$. Dat is de mediaan. Enkele lampen gaan heel lang mee en trekken het gemiddelde omhoog.

- id: h4-koppel-4
  soort: koppel
  niveau: 3
  koppel:
    rubriek: discreet
    onderwerp: |-
      Rijen
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.62cm,y=1.35cm,font=\scriptsize]
        \foreach \k in {2,...,6}{\pgfmathsetmacro{\hh}{1/(\k*\k)}\draw[accent,fill=accent!22] (\k-1,0) rectangle (\k,\hh);}
        \rooster{0}{1}{6}{0}{1}{1}
        \kromme{1}{6}{1/(\x)^2}
      \end{tikzpicture}
  opgave: |-
    Bekijk de rij $s_n = 1 + \dfrac{1}{2^2} + \dfrac{1}{3^2} + \cdots + \dfrac{1}{n^2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken rechthoeken onder de grafiek van $\tfrac{1}{x^2}$ en toon aan: $s_n - 1 \leqslant \ig_1^n \dfrac{1}{x^2}\dx < 1$.
      uitwerking: |-
        De rechthoek op $[k-1,k]$ met hoogte $\tfrac{1}{k^2}$ ligt onder de grafiek. De som vanaf $k=2$ is dus hoogstens $\displaystyle\int_1^n\dfrac{1}{x^2}\dx=1-\dfrac1n<1$.
    - opgave: |-
        Waarom heeft $s_n$ dus een limiet? Tussen welke twee getallen ligt die?
      antwoord: |-
        tussen 1 en 2
      uitwerking: |-
        De rij stijgt en is begrensd door 2. Een stijgende, begrensde rij heeft een limiet. Die ligt tussen 1 en 2 (hij is $\tfrac{\pi^2}{6}\approx 1{,}645$).
    - opgave: |-
        Met $\tfrac1x$ in plaats van $\tfrac{1}{x^2}$ is er geen limiet. Wat is het verschil?
      antwoord: |-
        de integraal van $\tfrac1x$ divergeert
      uitwerking: |-
        $\displaystyle\int_1^{+\infty}\dfrac{1}{x^2}\dx$ convergeert en $\displaystyle\int_1^{+\infty}\dfrac{1}{x}\dx$ divergeert.

- id: h4-t1
  soort: test
  niveau: 1
  opgave: |-
    Een lichaam ligt tussen $x = 0$ en $x = 3$. De doorsnede op de plaats $x$ is een vierkant met zijde $x$. Bereken het volume.
  antwoord: |-
    9
  uitwerking: |-
    $\displaystyle\int_0^3 x^2\dx=9$.

- id: h4-t2
  soort: test
  niveau: 1
  opgave: |-
    De grafiek van $y = 2x - x^2$ op $[0, 2]$ wentelt om de $x$-as. Bereken het volume.
  antwoord: |-
    $\tfrac{16\pi}{15}$
  uitwerking: |-
    $\pi\displaystyle\int_0^2(4x^2-4x^3+x^4)\dx=\pi\Bigl(\dfrac{32}{3}-16+\dfrac{32}{5}\Bigr)=\dfrac{16\pi}{15}$.

- id: h4-t3
  soort: test
  niveau: 2
  opgave: |-
    Het gebied tussen $y = 4$ en $y = x^2$, met $0 \leqslant x \leqslant 2$, wentelt om de $x$-as. Bereken het volume.
  antwoord: |-
    $\tfrac{128\pi}{5}$
  uitwerking: |-
    $\pi\displaystyle\int_0^2(16-x^4)\dx=\pi\Bigl(32-\dfrac{32}{5}\Bigr)=\dfrac{128\pi}{5}$.

- id: h4-t4
  soort: test
  niveau: 2
  opgave: |-
    De kromme $y = x^3$ met $0 \leqslant y \leqslant 8$ wentelt om de $y$-as. Bereken het volume.
  antwoord: |-
    $\tfrac{96\pi}{5}$
  uitwerking: |-
    $\pi\displaystyle\int_0^8 y^{2/3}\,\mathrm{d}y=\pi\Bigl[\tfrac35 y^{5/3}\Bigr]_0^8=\pi\cdot\dfrac{96}{5}$.

- id: h4-t5
  soort: test
  niveau: 2
  opgave: |-
    Bereken exact de lengte van de grafiek van $f(x) = \tfrac23 (x + 1)^{3/2}$ op $[0, 2]$.
  antwoord: |-
    $\tfrac{16-4\sqrt{2}}{3}\approx 3{,}45$
  uitwerking: |-
    $f'(x)=\sqrt{x+1}$, dus $L=\displaystyle\int_0^2\sqrt{x+2}\dx=\Bigl[\tfrac23(x+2)^{3/2}\Bigr]_0^2=\tfrac23\bigl(8-2\sqrt{2}\bigr)$.

- id: h4-t6
  soort: test
  niveau: 1
  opgave: |-
    Een kracht $F(x) = 6x + 2$ (in newton) werkt van $x = 0$ tot $x = 3$ (in meter). Bereken de arbeid.
  antwoord: |-
    33 J
  uitwerking: |-
    $\bigl[3x^2+2x\bigr]_0^3=27+6=33$ J.

- id: h4-t7
  soort: test
  niveau: 2
  opgave: |-
    Een voorwerp heeft versnelling $a(t) = 4 - 2t$ (in m/s²) en beginsnelheid 1 m/s. Bereken de verplaatsing in de eerste 3 s.
  antwoord: |-
    12 m
  uitwerking: |-
    $v(t)=1+4t-t^2$ en $\displaystyle\int_0^3(1+4t-t^2)\dt=3+18-9=12$ m.

- id: h4-t8
  soort: test
  niveau: 2
  opgave: |-
    Bereken, als dat kan.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_1^{+\infty} \dfrac{1}{x^4}\dx$
      antwoord: |-
        $\tfrac13$
      uitwerking: |-
        $\displaystyle\lim_{b\to+\infty}\Bigl[-\dfrac{1}{3x^3}\Bigr]_1^b=\dfrac13$.
    - opgave: |-
        $\ig_0^9 \dfrac{1}{\sqrt{x}}\dx$
      antwoord: |-
        6
      uitwerking: |-
        $\limr{c}{0}\bigl[2\sqrt{x}\bigr]_c^9=6$.
    - opgave: |-
        $\ig_0^2 \dfrac1x\dx$
      antwoord: |-
        divergent
      uitwerking: |-
        $\limr{c}{0}(\ln 2-\ln c)=+\infty$.
