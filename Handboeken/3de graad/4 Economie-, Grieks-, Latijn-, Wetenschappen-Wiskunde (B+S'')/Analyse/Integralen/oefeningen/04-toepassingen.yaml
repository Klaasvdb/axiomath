- id: h4-okies
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte, volume om elke as
  figuur:
    code: |-
      \begin{tikzpicture}[x=1.15cm,y=.95cm,font=\scriptsize]
        \gebiedtussen{0}{1.414}{2}{(\x)^2}
        \rooster{0}{1}{2}{0}{1}{2}
        \kromme{0}{1.6}{(\x)^2}
        \draw[accent,thick] (0,2) -- (1.8,2);
      \end{tikzpicture}
  opgave: |-
    De figuur toont het gebied $G$ tussen $y = 2$ en $y = x^2$, met $x \geqslant 0$. Schrijf telkens de integraal en bereken ze exact.
  lijst: enumerate
  delen:
    - opgave: |-
        De oppervlakte van $G$.
      antwoord: |-
        $\tfrac{4\sqrt{2}}{3}$
    - opgave: |-
        Het volume als $G$ wentelt om de $x$-as.
      antwoord: |-
        $\tfrac{16\sqrt{2}\,\pi}{5}$
    - opgave: |-
        Het volume als $G$ wentelt om de $y$-as.
      antwoord: |-
        $2\pi$
  uitwerking: |-
    De grafieken snijden in $x=\sqrt{2}$.\\
    \textbf{a.}~$\displaystyle\int_0^{\sqrt{2}}(2-x^2)\dx=2\sqrt{2}-\tfrac{2\sqrt{2}}{3}=\tfrac{4\sqrt{2}}{3}$.\\
    \textbf{b.}~$\pi\displaystyle\int_0^{\sqrt{2}}(4-x^4)\dx=\pi\Bigl(4\sqrt{2}-\tfrac{4\sqrt{2}}{5}\Bigr)=\tfrac{16\sqrt{2}\,\pi}{5}$.\\
    \textbf{c.}~$x=\sqrt{y}$ en $0\leqslant y\leqslant 2$: $\pi\displaystyle\int_0^2 y\,\mathrm{d}y=2\pi$.

- id: h4-o13
  soort: opdracht
  niveau: 2
  thema: |-
    omwenteling tussen twee krommen
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=1.9cm,y=1.9cm,font=\scriptsize]
        \gebiedtussen{0}{1}{sqrt(\x)}{(\x)^2}
        \rooster{0}{1}{1}{0}{1}{1}
        \kromme{0.003}{1.1}{sqrt(\x)}
        \kromme{0}{1.1}{(\x)^2}
        \draw[lijngrijs,dashed] (0,0) -- (1.1,1.1);
      \end{tikzpicture}
  opgave: |-
    Het gebied tussen $y = x^2$ en $y = \sqrt{x}$ wentelt om de $x$-as. Bereken het volume. Wentel daarna hetzelfde gebied om de $y$-as, en leg uit waarom je dezelfde uitkomst krijgt.
  antwoord: |-
    $\tfrac{3\pi}{10}$ in beide gevallen
  uitwerking: |-
    $\pi\displaystyle\int_0^1(x-x^4)\dx=\pi\bigl(\tfrac12-\tfrac15\bigr)=\tfrac{3\pi}{10}$. De twee krommen zijn elkaars spiegelbeeld ten opzichte van $y=x$: het gebied is symmetrisch, en bij spiegelen wisselen de $x$-as en de $y$-as van plaats.

- id: h4-o14
  soort: opdracht
  niveau: 2
  thema: |-
    om de verticale as: tussen twee krommen
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=1cm,y=.5cm,font=\scriptsize]
        \gebiedtussen{0}{2}{2*\x}{(\x)^2}
        \rooster{0}{1}{2}{0}{1}{4}
        \kromme{0}{2.05}{(\x)^2}
        \kromme{0}{2.05}{2*\x}
      \end{tikzpicture}
  opgave: |-
    Het gebied tussen $y = x^2$ en $y = 2x$ met $x \geqslant 0$ wentelt om de $y$-as. Bereken het volume.
  antwoord: |-
    $\tfrac{8\pi}{3}$
  uitwerking: |-
    Op hoogte $y$ gaat het gebied van $x=\tfrac{y}{2}$ tot $x=\sqrt{y}$, met $0\leqslant y\leqslant 4$. $V=\pi\displaystyle\int_0^4\Bigl(y-\dfrac{y^2}{4}\Bigr)\mathrm{d}y=\pi\Bigl(8-\dfrac{16}{3}\Bigr)=\dfrac{8\pi}{3}$.

- id: h4-o15
  soort: opdracht
  niveau: 2
  thema: |-
    bolsegment
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.62cm,y=.62cm,font=\scriptsize]
        \fill[accent!35] (-1.732,-1) arc (210:330:2) -- cycle;
        \draw[accent,thick] (0,0) circle (2);
        \draw[accent] (-1.732,-1) -- (1.732,-1);
        \draw[grijs,<->] (2.4,-2) -- (2.4,-1) node[midway,right,text=black] {$h$};
        \draw[lijngrijs,dashed] (0,-2) -- (2.4,-2) (1.732,-1) -- (2.4,-1);
        \draw[grijs] (0,0) -- (-1.414,1.414) node[midway,above right,inner sep=1pt,text=black] {$R$};
      \end{tikzpicture}
  opgave: |-
    Een bolvormige tank met straal $R$ is gevuld tot hoogte $h$ boven het laagste punt.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: het volume water is $V = \dfrac{\pi h^2 (3R - h)}{3}$.
      uitwerking: |-
        Het water ligt tussen $x=R-h$ en $x=R$: $\pi\displaystyle\int_{R-h}^{R}(R^2-x^2)\dx=\pi\Bigl(R^2 h-\dfrac{R^3-(R-h)^3}{3}\Bigr)=\pi\Bigl(R h^2-\dfrac{h^3}{3}\Bigr)$.
    - opgave: |-
        Een tank met $R = 2$ m is gevuld tot $h = 1$ m. Hoeveel $\text{m}^3$ water is dat? Welk deel van de tank is gevuld?
      antwoord: |-
        $\tfrac{5\pi}{3}\approx 5{,}24$ m³, ongeveer 15,6\%
      uitwerking: |-
        $\dfrac{\pi(6-1)}{3}=\dfrac{5\pi}{3}$. Het volle volume is $\dfrac{32\pi}{3}$, dus het deel is $\tfrac{5}{32}\approx 15{,}6\%$.

- id: h4-o16
  soort: opdracht
  niveau: 2
  thema: |-
    volume met een parameter
  opgave: |-
    De grafiek van $y = a\sin x$ op $[0, \pi]$, met $a > 0$, wentelt om de $x$-as. Voor welke $a$ is het volume $\pi^2$?
  antwoord: |-
    $a=\sqrt{2}$
  uitwerking: |-
    $V=\pi a^2\cdot\tfrac{\pi}{2}=\pi^2$ geeft $a^2=2$.

- id: h4-o17
  soort: opdracht
  niveau: 2
  thema: |-
    booglengte: volkomen kwadraat
  opgave: |-
    Bereken de lengte van de grafiek van $f(x) = \dfrac{x^3}{6} + \dfrac{1}{2x}$ op $[1, 2]$.
  antwoord: |-
    $\tfrac{17}{12}$
  uitwerking: |-
    $f'(x)=\dfrac{x^2}{2}-\dfrac{1}{2x^2}$, dus $1+f'(x)^2=\Bigl(\dfrac{x^2}{2}+\dfrac{1}{2x^2}\Bigr)^2$.\\
    $L=\displaystyle\int_1^2\Bigl(\dfrac{x^2}{2}+\dfrac{1}{2x^2}\Bigr)\dx=\Bigl[\dfrac{x^3}{6}-\dfrac{1}{2x}\Bigr]_1^2=\Bigl(\dfrac43-\dfrac14\Bigr)-\Bigl(\dfrac16-\dfrac12\Bigr)=\dfrac{17}{12}$.

- id: h4-o18
  soort: opdracht
  niveau: 2
  thema: |-
    booglengte: numeriek
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=1cm,y=1cm,font=\scriptsize]
        \roosterleeg{0}{1}{3}{0}{1}{1}
        \kromme{0}{3.1416}{sin(\x r)}
        \draw[accent,dashed] (0,0) -- (1.5708,1) -- (3.1416,0);
        \node[below] at (1.5708,0) {$\frac{\pi}{2}$};
        \node[below] at (3.1416,0) {$\pi$};
        \node[left] at (0,1) {1};
      \end{tikzpicture}
  opgave: |-
    De bulten van een pumptrack, een parcours voor mountainbikes, volgen de grafiek van $y = \sin x$ (in meter).
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf de integraal voor de lengte van één boog, op $[0, \pi]$, en bereken die met je rekentoestel op drie decimalen.
      antwoord: |-
        $\approx 3{,}820$
      uitwerking: |-
        $\displaystyle\int_0^{\pi}\sqrt{1+\cos^2 x}\dx\approx 3{,}820$.
    - opgave: |-
        Vergelijk met de twee lijnstukken van $(0, 0)$ naar $(\tfrac{\pi}{2}, 1)$ en naar $(\pi, 0)$. Waarom is de booglengte groter?
      antwoord: |-
        $\approx 3{,}724$
      uitwerking: |-
        $2\sqrt{\tfrac{\pi^2}{4}+1}\approx 3{,}724$. Een rechte is de kortste weg tussen twee punten, dus de boog is langer.
    - opgave: |-
        Hoeveel langer is de weg over de bult dan een vlakke weg van $(0, 0)$ naar $(\pi, 0)$, in procent?
      antwoord: |-
        $\approx 21{,}6\%$
      uitwerking: |-
        $\dfrac{3{,}820}{\pi}\approx 1{,}216$.

- id: h4-o19
  soort: opdracht
  niveau: 2
  thema: |-
    drill: oneigenlijke integralen
  opgave: |-
    Bereken, als dat kan.\\ Je mag gebruiken: $\displaystyle\lim_{b \to +\infty} b\,\e^{-b} = 0$ en $\limr{c}{0} c\ln c = 0$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_2^{+\infty} \dfrac{1}{x^3}\dx$
      antwoord: |-
        $\tfrac18$
      uitwerking: |-
        $\displaystyle\lim_{b\to+\infty}\Bigl[-\dfrac{1}{2x^2}\Bigr]_2^b=\dfrac18$.
    - opgave: |-
        $\ig_0^{+\infty} x\,\e^{-x}\dx$
      antwoord: |-
        1
      uitwerking: |-
        $\bigl[-(x+1)\e^{-x}\bigr]_0^b=1-(b+1)\e^{-b}\to 1$.
    - opgave: |-
        $\ig_0^1 \ln x\dx$
      antwoord: |-
        $-1$
      uitwerking: |-
        $\bigl[x\ln x-x\bigr]_c^1=-1-c\ln c+c\to -1$.
    - opgave: |-
        $\ig_{-\infty}^{+\infty} \dfrac{1}{1 + x^2}\dx$
      antwoord: |-
        $\pi$
      uitwerking: |-
        Splits in 0: elk stuk geeft $\tfrac{\pi}{2}$.
    - opgave: |-
        $\ig_{-1}^{8} \dfrac{1}{\sqrt[3]{x}}\dx$
      antwoord: |-
        $\tfrac92$
      uitwerking: |-
        Splits in 0: $\Bigl[\tfrac32 x^{2/3}\Bigr]_{-1}^{0}=-\tfrac32$ en $\Bigl[\tfrac32 x^{2/3}\Bigr]_{0}^{8}=6$. Samen $\tfrac92$.
    - opgave: |-
        $\ig_0^{2} \dfrac{1}{(x - 1)^2}\dx$
      antwoord: |-
        divergent
      uitwerking: |-
        Splits in 1. Op $[1,2]$: $\limr{c}{1}\Bigl(-1+\dfrac{1}{c-1}\Bigr)=+\infty$.
        \figuren{\begin{tikzpicture}[x=.9cm,y=2.4cm,font=\scriptsize]
          \gebied{0}{4.2}{\x*exp(-\x)}
          \rooster{0}{1}{4}{0}{1}{1}
          \kromme{0}{4.2}{\x*exp(-\x)}
        \end{tikzpicture}\qquad
        \begin{tikzpicture}[x=1.7cm,y=.55cm,font=\scriptsize]
          \gebied{.03}{1}{ln(\x)}
          \rooster{0}{1}{1}{-3}{1}{0}
          \kromme{.05}{1.2}{ln(\x)}
        \end{tikzpicture}}

- id: h4-o21
