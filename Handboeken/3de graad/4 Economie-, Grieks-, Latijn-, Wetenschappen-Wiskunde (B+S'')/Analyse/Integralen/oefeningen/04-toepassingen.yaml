        \foreach \t in {1,2,3} \node[left] at (6,\t) {\t};
      \end{tikzpicture}
  opgave: |-
    Op een zonnige dag is het vermogen van zonnepanelen ongeveer $P(t) = 3\sin\dfrac{\pi(t - 7)}{11}$ kW, met $t$ de tijd in uren tussen 7 en 18 uur.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de opgewekte energie op twee decimalen.
      antwoord: |-
        $\tfrac{66}{\pi}\approx 21{,}01$ kWh
      uitwerking: |-
        $u=\dfrac{\pi(t-7)}{11}$: $3\cdot\dfrac{11}{\pi}\displaystyle\int_0^{\pi}\sin u\du=\dfrac{66}{\pi}$.
    - opgave: |-
        Bereken het gemiddelde vermogen.
      antwoord: |-
