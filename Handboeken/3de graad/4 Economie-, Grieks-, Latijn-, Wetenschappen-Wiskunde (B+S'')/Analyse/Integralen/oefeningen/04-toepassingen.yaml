# Oefeningen van hoofdstuk 4. Zie oefeningenbank.py voor de velden.

- id: h4-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het volume van een cilinder met straal 2 en hoogte 5.
      antwoord: |-
        $20\pi$
      uitwerking: |-
        $\pi\cdot 4\cdot 5=20\pi$.
    - opgave: |-
        Bereken het volume van een kegel met straal 3 en hoogte 4.
      antwoord: |-
        $12\pi$
      uitwerking: |-
        $\tfrac13\pi\cdot 9\cdot 4=12\pi$.
    - opgave: |-
        Bereken $\ig_0^{\pi} \sin^2 x\dx$.
      antwoord: |-
        $\tfrac{\pi}{2}$
      uitwerking: |-
        Dubbele hoek: $\Bigl[\tfrac{x}{2}-\tfrac{\sin 2x}{4}\Bigr]_0^{\pi}=\tfrac{\pi}{2}$.
    - opgave: |-
        Bereken de afgeleide van $\tfrac23 x^{3/2}$.
      antwoord: |-
        $\sqrt{x}$
      uitwerking: |-
        $\tfrac23\cdot\tfrac32 x^{1/2}=\sqrt{x}$.
    - opgave: |-
        Bereken $\displaystyle\lim_{b \to +\infty} \Bigl(1 - \dfrac1b\Bigr)$ en $\displaystyle\lim_{b \to +\infty} \e^{-b}$.
      antwoord: |-
        1 en 0
      uitwerking: |-
        $\tfrac1b\to 0$ en $\e^{-b}=\tfrac{1}{\e^b}\to 0$.

- id: h4-verken
  soort: start
  opgave: |+
    \blokkop{Verken}\quad Draai de grafiek van $y = \sqrt{x}$ op $[0, 4]$ om de $x$-as. Dat geeft een lichaam dat op een kom lijkt. Benader het volume met vier schijven die elk 1 dik zijn.

    \figuren{\begin{tikzpicture}[x=1cm,y=.62cm,font=\scriptsize]
      \foreach \k/\r in {1/1,2/1.414,3/1.732,4/2}{
        \draw[accent,fill=accent!15] (\k-1,-\r) rectangle (\k,\r);
        \draw[accent] (\k,0) ellipse (.1 and \r);}
      \assen{-.2}{4.6}{-2.3}{2.5}
      \kromme{0.01}{4}{sqrt(\x)}
      \kromme[dashed]{0.01}{4}{-sqrt(\x)}
      \foreach \t in {1,2,3,4} \node[below right,inner sep=1pt] at (\t,0) {\t};
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Neem als straal van elke schijf de functiewaarde links. Bereken de som van de volumes.
      antwoord: |-
        $6\pi$
      uitwerking: |-
        De stralen zijn $0$, $1$, $\sqrt{2}$, $\sqrt{3}$, en de volumes $\pi r^2\cdot 1$: $\pi(0+1+2+3)=6\pi$.
    - opgave: |-
        Neem nu de functiewaarde rechts.
      antwoord: |-
        $10\pi$
      uitwerking: |-
        $\pi(1+2+3+4)=10\pi$.
    - opgave: |-
        Schrijf het volume van een schijf met dikte $\Delta x$ op de plaats $x$. Welke integraal hoort bij die som? Bereken die.
      antwoord: |-
        $\pi x\,\Delta x$; $\pi\displaystyle\int_0^4 x\dx=8\pi$
      uitwerking: |-
        $\pi(\sqrt{x})^2\Delta x=\pi x\,\Delta x$. De som is een Riemannsom van $\pi x$, met limiet $\pi\displaystyle\int_0^4 x\dx=8\pi$.

- id: h4-doorsnede
  soort: kort
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.6cm,font=\scriptsize]
        \draw[accent,fill=accent!12] (0,0) circle (2);
        \fill[accent!40] (.75,-1.854) rectangle (1.25,1.854);
        \draw[accent] (1,-1.732) -- (1,1.732);
        \assen{-2.5}{2.8}{-2.4}{2.6}
        \node[below right,inner sep=1pt] at (1,0) {$x$};
      \end{tikzpicture}
  opgave: |-
    Het grondvlak van een lichaam is een cirkelschijf met straal 2. Elke doorsnede loodrecht op een vaste middellijn is een vierkant, met één zijde in het grondvlak. Bereken het volume.
  antwoord: |-
    $\tfrac{128}{3}$
  uitwerking: |-
    Neem de middellijn als $x$-as. De koorde op de plaats $x$ heeft lengte $2\sqrt{4-x^2}$, dus $A(x)=4(4-x^2)$ en $V=\displaystyle\int_{-2}^{2}4(4-x^2)\dx=4\cdot\tfrac{32}{3}=\tfrac{128}{3}$.

- id: h4-bol
  soort: kort
  opgave: |-
    Toon aan dat een kegel met straal $r$ en hoogte $h$ volume $\tfrac13 \pi r^2 h$ heeft. Wentel daarvoor een rechte door de oorsprong.
  antwoord: |-
    $f(x)=\tfrac{r}{h}x$ op $[0,h]$
  uitwerking: |-
    $V=\pi\displaystyle\int_0^h\dfrac{r^2}{h^2}x^2\dx=\pi\dfrac{r^2}{h^2}\cdot\dfrac{h^3}{3}=\dfrac13\pi r^2 h$.
    \figuren{\begin{tikzpicture}[x=.9cm,y=.6cm,font=\scriptsize]
      \fill[accent!30] (0,0) -- (3,1.8) -- (3,0) -- cycle;
      \assen{-.2}{3.6}{-2.2}{2.3}
      \draw[accent,thick] (0,0) -- (3,1.8);
      \draw[accent,dashed] (0,0) -- (3,-1.8);
      \draw[accent] (3,0) ellipse (.2 and 1.8);
      \node[below right,inner sep=1pt] at (3,0) {$h$};
      \node[above left] at (3,1.8) {$r$};
    \end{tikzpicture}}

- id: h4-ring
  soort: kort
  opgave: |-
    Het gebied tussen $y = 2x$ en $y = x^2$ wentelt om de $x$-as. Bereken het volume.
  antwoord: |-
    $\tfrac{64\pi}{15}$
  uitwerking: |-
    Snijpunten 0 en 2, en $y=2x$ ligt bovenaan: $\pi\displaystyle\int_0^2(4x^2-x^4)\dx=\pi\Bigl(\dfrac{32}{3}-\dfrac{32}{5}\Bigr)=\dfrac{64\pi}{15}$.

- id: h4-vert
  soort: kort
  opgave: |-
    De kromme $y = x^3$ met $0 \leqslant y \leqslant 1$ wentelt om de $y$-as. Bereken het volume.
  antwoord: |-
    $\tfrac{3\pi}{5}$
  uitwerking: |-
    $x=y^{1/3}$, dus $V=\pi\displaystyle\int_0^1 y^{2/3}\,\mathrm{d}y=\pi\Bigl[\tfrac35 y^{5/3}\Bigr]_0^1=\dfrac{3\pi}{5}$.

- id: h4-boog
  soort: kort
  opgave: |-
    Een ketting tussen twee palen hangt volgens de cosinus hyperbolicus: $f(x) = \cosh x = \tfrac12(\e^x + \e^{-x})$. Toon aan dat $1 + f'(x)^2 = f(x)^2$, en bereken de lengte op $[0, 1]$. Rond af op drie decimalen.
  antwoord: |-
    $\tfrac12(\e-\e^{-1})\approx 1{,}175$
  uitwerking: |-
    $f'(x)=\tfrac12(\e^x-\e^{-x})$, dus $1+f'(x)^2=1+\tfrac14(\e^{2x}-2+\e^{-2x})=\tfrac14(\e^{2x}+2+\e^{-2x})=f(x)^2$.\\
    $L=\displaystyle\int_0^1 f(x)\dx=\Bigl[\tfrac12(\e^x-\e^{-x})\Bigr]_0^1=\tfrac12(\e-\e^{-1})\approx 1{,}175$.

- id: h4-context
  soort: kort
  opgave: |-
    Een voorwerp vertrekt uit stilstand met versnelling $a(t) = 12 - 6t$ (in m/s²).
  lijst: enumerate
  delen:
    - opgave: |-
        Wanneer staat het opnieuw stil?
      antwoord: |-
        $t=4$
      uitwerking: |-
        $v(t)=12t-3t^2=3t(4-t)$.
    - opgave: |-
        Hoe ver is het dan?
      antwoord: |-
        32 m
      uitwerking: |-
        $\displaystyle\int_0^4(12t-3t^2)\dt=\bigl[6t^2-t^3\bigr]_0^4=96-64=32$ m.
        \figuren{\begin{tikzpicture}[x=.8cm,y=.18cm,font=\scriptsize]
          \gebied{0}{4}{12*\x-3*(\x)^2}
          \draw[black!14,very thin,xstep=1,ystep=4] (0,0) grid (4,12);
          \draw[->,grijs] (0,0) -- (4.4,0) node[right,text=black] {$t$};
          \draw[->,grijs] (0,0) -- (0,14) node[above,text=black] {$v$};
          \kromme{0}{4}{12*\x-3*(\x)^2}
          \foreach \t in {1,2,3,4} \node[below] at (\t,0) {\t};
          \foreach \t in {4,8,12} \node[left] at (0,\t) {\t};
        \end{tikzpicture}}

- id: h4-arbeid
  soort: kort
  opgave: |-
    Je tilt een emmer water 8 m op aan een touw dat zelf niet meetelt. De emmer weegt eerst 12 kg, maar lekt onderweg gelijkmatig tot nog 4 kg boven. Bereken de arbeid met $g = 9{,}81$ m/s². Rond af op een geheel getal.
  antwoord: |-
    Ongeveer 628 J
  uitwerking: |-
    De massa op hoogte $x$ is $12-x$ (van 12 naar 4 over 8 m). $W=9{,}81\displaystyle\int_0^8(12-x)\dx=9{,}81\cdot(96-32)=9{,}81\cdot 64\approx 628$ J.

- id: h4-oneindig
  soort: kort
  opgave: |-
    Bereken, als dat kan.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_0^{+\infty} \e^{-2x}\dx$
      antwoord: |-
        $\tfrac12$
      uitwerking: |-
        $\displaystyle\lim_{b\to+\infty}\Bigl[-\tfrac12\e^{-2x}\Bigr]_0^b=\tfrac12$.
    - opgave: |-
        $\ig_1^{+\infty} \dfrac{1}{\sqrt{x}}\dx$
      antwoord: |-
        divergent
      uitwerking: |-
        $\displaystyle\lim_{b\to+\infty}\bigl(2\sqrt{b}-2\bigr)=+\infty$.
    - opgave: |-
        $\ig_0^{1} \dfrac{1}{\sqrt[3]{x}}\dx$
      antwoord: |-
        $\tfrac32$
      uitwerking: |-
        $\limr{c}{0}\Bigl[\tfrac32 x^{2/3}\Bigr]_c^1=\tfrac32$.

- id: h4-o1
  soort: opdracht
  niveau: 1
  thema: |-
    omwenteling
  opgave: |-
    De grafiek van $y = 2x$ op $[0, 3]$ wentelt om de $x$-as. Bereken het volume. Welk lichaam is dat? Controleer met de formule ervan.
  antwoord: |-
    $36\pi$, een kegel
  uitwerking: |-
    $\pi\displaystyle\int_0^3 4x^2\dx=36\pi$. Een kegel met straal 6 en hoogte 3: $\tfrac13\pi\cdot 36\cdot 3=36\pi$.
    \figuren{\begin{tikzpicture}[x=.75cm,y=.3cm,font=\scriptsize]
      \fill[accent!30] (0,0) -- (3,6) -- (3,0) -- cycle;
      \rooster{0}{1}{3}{-6}{2}{6}
      \draw[accent,thick] (0,0) -- (3,6);
      \draw[accent,dashed] (0,0) -- (3,-6);
      \draw[accent] (3,0) ellipse (.14 and 6);
    \end{tikzpicture}}

- id: h4-o3
  soort: opdracht
  niveau: 1
  thema: |-
    booglengte: een rechte
  opgave: |-
    Bereken met de formule de lengte van de rechte $y = 3x + 1$ op $[0, 4]$. Controleer met Pythagoras.
  antwoord: |-
    $4\sqrt{10}$
  uitwerking: |-
    $\displaystyle\int_0^4\sqrt{1+9}\dx=4\sqrt{10}$. Pythagoras: $\sqrt{4^2+12^2}=\sqrt{160}=4\sqrt{10}$.

- id: h4-o4
  soort: opdracht
  niveau: 1
  thema: |-
    doorsneden
  opgave: |-
    Een lichaam ligt tussen $x = 0$ en $x = 4$. De doorsnede op de plaats $x$ is een vierkant met zijde $\sqrt{x}$. Bereken het volume.
  antwoord: |-
    8
  uitwerking: |-
    $A(x)=x$, dus $V=\displaystyle\int_0^4 x\dx=8$.

- id: h4-o5
  soort: opdracht
  niveau: 1
  thema: |-
    omwenteling: wortel, exponentiële en sinus
  opgave: |-
    Elk gebied onder de grafiek wentelt om de $x$-as. Bereken het volume exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $y = \sqrt{x}$ op $[1, 4]$
      antwoord: |-
        $\tfrac{15\pi}{2}$
      uitwerking: |-
        $\pi\displaystyle\int_1^4 x\dx=\pi\cdot\tfrac{15}{2}$.
    - opgave: |-
        $y = \e^x$ op $[0, 1]$
      antwoord: |-
        $\tfrac{\pi(\e^2-1)}{2}$
      uitwerking: |-
        $\pi\displaystyle\int_0^1\e^{2x}\dx=\pi\cdot\tfrac12(\e^2-1)$.
    - opgave: |-
        $y = \sin x$ op $[0, \pi]$
      antwoord: |-
        $\tfrac{\pi^2}{2}$
      uitwerking: |-
        $\pi\displaystyle\int_0^{\pi}\sin^2 x\dx=\pi\cdot\tfrac{\pi}{2}$.

- id: h4-o6
  soort: opdracht
  niveau: 1
  thema: |-
    arbeid
  opgave: |-
    Een kracht $F(x) = 4x + 3$ (in newton) werkt langs een rechte van $x = 0$ tot $x = 2$ (in meter). Bereken de arbeid.
  antwoord: |-
    14 J
  uitwerking: |-
    $\bigl[2x^2+3x\bigr]_0^2=8+6=14$ J.
    \figuren{\begin{tikzpicture}[x=1cm,y=.25cm,font=\scriptsize]
      \fill[accent!30] (0,0) -- (0,3) -- (2,11) -- (2,0) -- cycle;
      \draw[black!14,very thin,xstep=1,ystep=2] (0,0) grid (2,12);
      \draw[->,grijs] (0,0) -- (2.4,0) node[right,text=black] {$x$};
      \draw[->,grijs] (0,0) -- (0,13.5) node[above,text=black] {$F$};
      \draw[accent,thick] (0,3) -- (2,11);
      \foreach \t in {1,2} \node[below] at (\t,0) {\t};
      \foreach \t in {4,8,12} \node[left] at (0,\t) {\t};
    \end{tikzpicture}}

- id: h4-o7
  soort: opdracht
  niveau: 1
  thema: |-
    is de integraal oneigenlijk?
  opgave: |-
    Is de integraal oneigenlijk? Reken niet. Waarom wel of niet?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_0^1 \dfrac{1}{x + 1}\dx$
      antwoord: |-
        nee
      uitwerking: |-
        Continu op $[0,1]$.
    - opgave: |-
        $\ig_1^2 \dfrac{1}{x - 1}\dx$
      antwoord: |-
        ja
      uitwerking: |-
        Asymptoot in $x=1$.
    - opgave: |-
        $\ig_{-1}^{1} \e^x\dx$
      antwoord: |-
        nee
      uitwerking: |-
        Continu op $[-1,1]$.
    - opgave: |-
        $\ig_0^{\pi/2} \tan x\dx$
      antwoord: |-
        ja
      uitwerking: |-
        Asymptoot in $x=\tfrac{\pi}{2}$.
    - opgave: |-
        $\ig_0^{\pi/4} \tan x\dx$
      antwoord: |-
        nee
      uitwerking: |-
        $\tfrac{\pi}{4}$ valt binnen het domein.
    - opgave: |-
        $\ig_0^{+\infty} \e^{-x}\dx$
      antwoord: |-
        ja
      uitwerking: |-
        Oneindige grens.

- id: h4-o8
  soort: opdracht
  niveau: 1
  thema: |-
    oppervlakte, volume of lengte?
  opgave: |-
    Gebruik de grafiek van $y = x^2$ op $[0, 1]$. Schrijf drie integralen, en bereken ze: de oppervlakte onder de grafiek, het volume na wentelen om de $x$-as, en de lengte van de grafiek (numeriek).
  antwoord: |-
    $\tfrac13$; $\tfrac{\pi}{5}$; $\approx 1{,}479$
  uitwerking: |-
    $A=\displaystyle\int_0^1 x^2\dx=\tfrac13$, $V=\pi\displaystyle\int_0^1 x^4\dx=\tfrac{\pi}{5}$ en $L=\displaystyle\int_0^1\sqrt{1+4x^2}\dx\approx 1{,}479$.

- id: h4-o9
  soort: opdracht
  niveau: 2
  thema: |-
    arbeid: wet van Hooke
  prent:
    naam: veer
  opgave: |-
    Om een veer 5 cm uit te rekken, heb je een kracht van 20 N nodig. De kracht is evenredig met de uitrekking: $F(x) = kx$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $k$ in N/m.
      antwoord: |-
        400
      uitwerking: |-
        $20=k\cdot 0{,}05$, dus $k=400$.
    - opgave: |-
        Bereken de arbeid om de veer van 0 tot 5 cm uit te rekken.
      antwoord: |-
        0,5 J
      uitwerking: |-
        $\displaystyle\int_0^{0{,}05}400x\dx=\bigl[200x^2\bigr]_0^{0{,}05}=0{,}5$ J.
    - opgave: |-
        Bereken de arbeid om ze van 5 tot 10 cm uit te rekken. Waarom is dat niet evenveel?
      antwoord: |-
        1,5 J
      uitwerking: |-
        $\bigl[200x^2\bigr]_{0{,}05}^{0{,}1}=2-0{,}5=1{,}5$ J. Bij een grotere uitrekking is de kracht groter.
        \figuren{\begin{tikzpicture}[x=.5cm,y=.05cm,font=\scriptsize]
          \fill[accent!15] (0,0) -- (5,20) -- (5,0) -- cycle;
          \fill[accent!35] (5,0) -- (5,20) -- (10,40) -- (10,0) -- cycle;
          \draw[black!14,very thin,xstep=5,ystep=10] (0,0) grid (10,40);
          \draw[->,grijs] (0,0) -- (11,0) node[right,text=black] {cm};
          \draw[->,grijs] (0,0) -- (0,45) node[above,text=black] {$F$};
          \draw[accent,thick] (0,0) -- (10,40);
          \foreach \t in {5,10} \node[below] at (\t,0) {\t};
          \foreach \t in {20,40} \node[left] at (0,\t) {\t};
          \node at (3.8,6) {0,5};
          \node at (7.5,12) {1,5};
        \end{tikzpicture}}

- id: h4-o10
  soort: opdracht
  niveau: 2
  thema: |-
    omwenteling in een context
  prent:
    naam: vaas
  opgave: |-
    De binnenkant van een vaas ontstaat door een grafiek te wentelen om de $x$-as:
    \[ f(x) = 6 + 2\sin\dfrac{\pi x}{10} \quad\text{op } [0, 20], \]
    met $x$ en $f(x)$ in cm. Hoeveel liter past erin? Rond af op twee decimalen.
  antwoord: |-
    $760\pi$ cm³, dus ongeveer 2,39 liter
  uitwerking: |-
    $V=\pi\displaystyle\int_0^{20}\Bigl(36+24\sin\dfrac{\pi x}{10}+4\sin^2\dfrac{\pi x}{10}\Bigr)\dx$. De sinus doorloopt een volledige periode en geeft 0. De gemiddelde waarde van $\sin^2$ is $\tfrac12$. Dus $V=\pi(720+0+40)=760\pi\approx 2388$ cm³.
    \figuren{\begin{tikzpicture}[x=.3cm,y=.3cm,font=\scriptsize]
      \gebied{0}{20}{6+2*sin(\x*18)}
      \draw[black!14,very thin,xstep=5,ystep=2] (0,-8) grid (20,8);
      \draw[->,grijs] (0,0) -- (21.5,0) node[right,text=black] {$x$};
      \draw[->,grijs] (0,-8.3) -- (0,9.5) node[above,text=black] {$y$};
      \kromme{0}{20}{6+2*sin(\x*18)}
      \kromme[dashed]{0}{20}{-6-2*sin(\x*18)}
      \foreach \t in {5,10,15,20} \node[below] at (\t,0) {\t};
      \foreach \t in {4,8} \node[left] at (0,\t) {\t};
    \end{tikzpicture}}

- id: h4-o11
  soort: opdracht
  niveau: 2
  thema: |-
    inhoud van een ton
  prent:
    naam: ton
  opgave: |-
    Een ton is 100 cm hoog. In het midden is de straal 30 cm, aan de uiteinden 25 cm. De wand is een parabool.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de wand past bij $f(x) = 30 - \dfrac{x^2}{500}$ op $[-50, 50]$.
      uitwerking: |-
        $f(0)=30$ en $f(\pm 50)=30-5=25$.
    - opgave: |-
        Bereken de inhoud in liter. Rond af op een geheel getal.
      antwoord: |-
        ongeveer 253 liter
      uitwerking: |-
        $V=2\pi\displaystyle\int_0^{50}\Bigl(900-\dfrac{3x^2}{25}+\dfrac{x^4}{250\,000}\Bigr)\dx=2\pi(45\,000-5000+250)=80\,500\pi\approx 252\,898$ cm³.
    - opgave: |-
        Vergelijk met een cilinder van dezelfde hoogte en een straal van 27,5 cm.
      antwoord: |-
        de cilinder heeft ongeveer 238 liter
      uitwerking: |-
        $\pi\cdot 27{,}5^2\cdot 100\approx 237\,583$ cm³.
        \figuren{\begin{tikzpicture}[x=.05cm,y=.05cm,font=\scriptsize]
          \gebied{-50}{50}{30-(\x)^2/500}
          \draw[black!14,very thin,xstep=25,ystep=10] (-50,-30) grid (50,30);
          \draw[->,grijs] (-50,0) -- (57,0) node[right,text=black] {$x$};
          \draw[->,grijs] (0,-30) -- (0,36) node[above,text=black] {$y$};
          \kromme{-50}{50}{30-(\x)^2/500}
          \kromme[dashed]{-50}{50}{-30+(\x)^2/500}
          \foreach \t in {-50,50} \node[below] at (\t,0) {$\t$};
          \foreach \t in {25} \node[above left,inner sep=1pt] at (0,\t) {\t};
        \end{tikzpicture}}

- id: h4-o12
  soort: opdracht
  niveau: 2
  thema: |-
    om de verticale as: halfvol
  prent:
    naam: trechter
  opgave: |-
    Een trechter is een omgekeerde kegel met hoogte 12 cm en bovenaan straal 6 cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Wentel $x = \tfrac{y}{2}$ om de $y$-as. Toon aan dat het volume tot hoogte $h$ gelijk is aan $\dfrac{\pi h^3}{12}$.
      uitwerking: |-
        $\pi\displaystyle\int_0^h\dfrac{y^2}{4}\,\mathrm{d}y=\dfrac{\pi h^3}{12}$.
    - opgave: |-
        Tot welke hoogte staat het water als de trechter halfvol is? Rond af op twee decimalen.
      antwoord: |-
        $\approx 9{,}52$ cm
      uitwerking: |-
        Het volle volume is $144\pi$. Uit $\dfrac{\pi h^3}{12}=72\pi$ volgt $h^3=864$, dus $h\approx 9{,}52$ cm: niet de helft van de hoogte.
        \figuren{\begin{tikzpicture}[x=.3cm,y=.3cm,font=\scriptsize]
          \fill[accent!30] (0,0) -- (4.76,9.52) -- (-4.76,9.52) -- cycle;
