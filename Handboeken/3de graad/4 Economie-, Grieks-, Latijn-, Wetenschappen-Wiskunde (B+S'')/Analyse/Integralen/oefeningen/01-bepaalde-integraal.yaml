# Oefeningen van hoofdstuk 1. Zie oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de oppervlakte van een driehoek met basis 6 en hoogte 3.
      antwoord: |-
        9
      uitwerking: |-
        $\tfrac12\cdot 6\cdot 3=9$.
    - opgave: |-
        Bereken de oppervlakte van een trapezium met evenwijdige zijden 2 en 5 en hoogte 4.
      antwoord: |-
        14
      uitwerking: |-
        $\dfrac{2+5}{2}\cdot 4=14$.
    - opgave: |-
        Bereken de oppervlakte van een halve cirkel met straal 3.
      antwoord: |-
        $\tfrac{9\pi}{2}$
      uitwerking: |-
        $\tfrac12\cdot\pi\cdot 3^2=\tfrac{9\pi}{2}$.
    - opgave: |-
        Bereken $\displaystyle\sum_{k=1}^{4} k^2$.
      antwoord: |-
        30
      uitwerking: |-
        $1+4+9+16=30$.
    - opgave: |-
        Bereken $\displaystyle\lim_{n \to +\infty} \dfrac{(n+1)(2n+1)}{n^2}$.
      antwoord: |-
        2
      uitwerking: |-
        De teller is $2n^2+3n+1$: de hoogste machten bepalen de limiet, en dat geeft $\tfrac21=2$.
    - opgave: |-
        Een trein rijdt een kwartier aan 80 km/h. Hoe ver rijdt hij?
      antwoord: |-
        20 km
      uitwerking: |-
        $80\cdot\tfrac14=20$ km.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Een fietser vertrekt uit stilstand. Na $t$ seconden is zijn snelheid $v(t) = 2t$ meter per seconde. Hoe ver is hij na 4 seconden?
  lijst: enumerate
  delen:
    - opgave: |-
        Schat de afstand: doe alsof de snelheid in elke seconde constant blijft, en gelijk is aan de snelheid aan het begin van die seconde. Is dat te veel of te weinig?
      antwoord: |-
        12 m, te weinig
      uitwerking: |-
        $0+2+4+6=12$ m. Dat is te weinig, want de snelheid stijgt tijdens elke seconde.
    - opgave: |-
        Doe hetzelfde met de snelheid aan het einde van elke seconde.
      antwoord: |-
        20 m
      uitwerking: |-
        $2+4+6+8=20$ m.
    - opgave: |-
        Herhaal beide schattingen met stukjes van een halve seconde.
      antwoord: |-
        14 m en 18 m
      uitwerking: |-
        De snelheden aan het begin zijn $0,\ 1,\ \ldots,\ 7$, en elk stukje duurt $\tfrac12$ s: $\tfrac12\cdot 28=14$ m. Aan het einde zijn het $1,\ 2,\ \ldots,\ 8$: $\tfrac12\cdot 36=18$ m.
    - opgave: |-
        Teken de grafiek van $v$ op $[0, 4]$. Waar zie je je schattingen op die grafiek? Wat is de echte afstand?
      antwoord: |-
        16 m
      uitwerking: |-
        Snelheid maal tijd is de oppervlakte van een rechthoek onder of boven de grafiek. De echte afstand is de oppervlakte onder de grafiek: de driehoek $\tfrac12\cdot 4\cdot 8=16$ m.
        \figuren{\begin{tikzpicture}[x=.75cm,y=.32cm,font=\scriptsize]
          \riemann{4}{0}{4}{2*\x}{0}
          \rooster{0}{1}{4}{0}{2}{8}
          \kromme{0}{4}{2*\x}
          \node[right] at (4.6,8) {$v$};
        \end{tikzpicture}\qquad
        \begin{tikzpicture}[x=.75cm,y=.32cm,font=\scriptsize]
          \riemann{4}{0}{4}{2*\x}{1}
          \rooster{0}{1}{4}{0}{2}{8}
          \kromme{0}{4}{2*\x}
        \end{tikzpicture}}

- id: h1-oboven
  soort: kort
  opgave: |-
    Bereken $O_4$ en $B_4$ voor $f(x) = \dfrac{1}{x}$ op $[1, 3]$. Let op: de functie daalt.
  antwoord: |-
    $O_4=0{,}95$ en $B_4\approx 1{,}28$
  uitwerking: |-
    $\Delta x=\tfrac12$, deelpunten $1;\ 1{,}5;\ 2;\ 2{,}5;\ 3$. De functie daalt, dus de kleinste waarde staat rechts.\\
    $O_4=\tfrac12\bigl(\tfrac23+\tfrac12+\tfrac25+\tfrac13\bigr)=\tfrac12\cdot 1{,}9=0{,}95$.\\
    $B_4=\tfrac12\bigl(1+\tfrac23+\tfrac12+\tfrac25\bigr)=\tfrac12\cdot\tfrac{77}{30}=\tfrac{77}{60}\approx 1{,}28$.

- id: h1-limiet
  soort: kort
  opgave: |-
    Bereken de oppervlakte onder de grafiek van $f(x) = 2x$ op $[0, 4]$ als limiet van de bovensom. Controleer met de formule voor een driehoek.
  antwoord: |-
    16
  uitwerking: |-
    $\Delta x=\tfrac4n$ en $x_k=\tfrac{4k}{n}$, dus $B_n=\displaystyle\sum_{k=1}^{n} \dfrac{8k}{n}\cdot\dfrac4n=\dfrac{32}{n^2}\cdot\dfrac{n(n+1)}{2}=\dfrac{16(n+1)}{n}$, en dat heeft limiet 16. De driehoek: $\tfrac12\cdot 4\cdot 8=16$.

- id: h1-herken
  soort: kort
  opgave: |-
    Schrijf $\displaystyle\lim_{n \to +\infty} \sum_{k=1}^{n} \Bigl(1 + \dfrac{2k}{n}\Bigr)^{\!2} \cdot \dfrac{2}{n}$ als een bepaalde integraal.
  antwoord: |-
    $\displaystyle\int_1^3 x^2\dx$
  uitwerking: |-
    $\Delta x=\tfrac2n$, $x_k=1+\tfrac{2k}{n}$ loopt van 1 tot 3, en de functie is het kwadraat. Dus $\displaystyle\int_1^3 x^2\dx$.

- id: h1-georienteerd
  soort: kort
  opgave: |-
    Bereken met een figuur:
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_0^3 (2x - 2)\dx$
      antwoord: |-
        3
      uitwerking: |-
        Van 0 tot 1 onder de as: $-\tfrac12\cdot 1\cdot 2=-1$. Van 1 tot 3 erboven: $\tfrac12\cdot 2\cdot 4=4$. Samen 3.
    - opgave: |-
        $\ig_{-3}^{3} -\sqrt{9 - x^2}\dx$
      antwoord: |-
        $-\tfrac{9\pi}{2}$
      uitwerking: |-
        De grafiek is de onderste helft van de cirkel met straal 3: $-\tfrac12\cdot\pi\cdot 9=-\tfrac{9\pi}{2}$.

        \figuren{\begin{tikzpicture}[x=.7cm,y=.35cm,font=\scriptsize]
          \gebied[accent!15]{0}{1}{2*\x-2}
          \gebied{1}{3}{2*\x-2}
          \rooster{0}{1}{3}{-2}{2}{4}
          \kromme{0}{3}{2*\x-2}
        \end{tikzpicture}\qquad
        \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
          \fill[accent!15] (-3,0) arc (180:360:3) -- cycle;
          \rooster{-3}{1}{3}{-3}{1}{1}
          \draw[accent,thick] (-3,0) arc (180:360:3);
        \end{tikzpicture}}

- id: h1-snelheid
  soort: kort
  opgave: |-
    Een bal rolt een helling op en weer af. Zijn snelheid is $v(t) = 3 - 1{,}5t$ (in m/s) op $[0, 4]$. Bereken de verplaatsing en de afgelegde weg. Wat betekent de verplaatsing hier?
  antwoord: |-
    Verplaatsing 0 m; afgelegde weg 6 m
  uitwerking: |-
    De snelheid is 0 voor $t=2$. Boven de as: $\tfrac12\cdot 2\cdot 3=3$. Eronder: $\tfrac12\cdot 2\cdot 3=3$. De verplaatsing is 0 m: de bal is terug waar hij vertrok. De afgelegde weg is 6 m.

- id: h1-regels
  soort: kort
  opgave: |-
    Gegeven: $\ig_1^6 f(x)\dx = 10$, \ $\ig_1^2 f(x)\dx = 4$ en $\ig_2^6 g(x)\dx = -3$.\\[1mm] Bereken $\ig_2^6 \bigl(f(x) + 2g(x) + 1\bigr)\dx$.
  antwoord: |-
    4
  uitwerking: |-
    $\displaystyle\int_2^6 f(x)\dx=10-4=6$ en $\displaystyle\int_2^6 1\dx=4$ (een rechthoek). Samen: $6+2\cdot(-3)+4=4$.

- id: h1-symmetrie
  soort: kort
  opgave: |-
    Bereken $\ig_{-3}^{3} (x^5 - 4x + 2)\dx$.
  antwoord: |-
    12
  uitwerking: |-
    $x^5-4x$ is oneven en geeft 0. De rechthoek geeft $6\cdot 2=12$.

- id: h1-gemiddelde
  soort: kort
  opgave: |-
    Bereken de gemiddelde waarde van $f(x) = |x|$ op $[-1, 3]$ en de waarde $c$ uit de middelwaardestelling.
  antwoord: |-
    Gemiddelde $\tfrac54$ en $c=\tfrac54$
  uitwerking: |-
    De integraal is $\tfrac12+\tfrac92=5$, dus het gemiddelde is $\tfrac54$. Uit $|c|=\tfrac54$ volgt $c=\pm\tfrac54$. Enkel $c=\tfrac54$ ligt in $[-1,3]$.

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    ondersom, bovensom
  opgave: |-
    Bereken $O_4$ en $B_4$ voor $f(x) = x^2 + 1$ op $[0, 2]$.
  antwoord: |-
    $O_4=3{,}75$ en $B_4=5{,}75$
  uitwerking: |-
    $\Delta x=\tfrac12$. De functie stijgt op $[0,2]$; de waarden zijn $1;\ 1{,}25;\ 2;\ 3{,}25;\ 5$.\\
    $O_4=\tfrac12(1+1{,}25+2+3{,}25)=3{,}75$ en $B_4=\tfrac12(1{,}25+2+3{,}25+5)=5{,}75$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    integraal met meetkunde
  opgave: |-
    Bereken met een figuur.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_1^4 3\dx$
      antwoord: |-
        9
      uitwerking: |-
        Rechthoek: $3\cdot 3=9$.
    - opgave: |-
        $\ig_0^5 (x+1)\dx$
      antwoord: |-
        $\tfrac{35}{2}$
      uitwerking: |-
        Trapezium: $\dfrac{1+6}{2}\cdot 5=\tfrac{35}{2}$.
    - opgave: |-
        $\ig_{-2}^{0} (-x)\dx$
      antwoord: |-
        2
      uitwerking: |-
        Driehoek boven de as: $\tfrac12\cdot 2\cdot 2=2$.
    - opgave: |-
        $\ig_0^3 (x-3)\dx$
      antwoord: |-
        $-\tfrac92$
      uitwerking: |-
        Driehoek onder de as: $-\tfrac12\cdot 3\cdot 3=-\tfrac92$.

        \figuren{\begin{tikzpicture}[x=.55cm,y=.3cm,font=\scriptsize]
          \fill[accent!30] (1,0) rectangle (4,3);
          \rooster{0}{1}{4}{0}{1}{3}
          \draw[accent,thick] (0,3) -- (4,3);
        \end{tikzpicture}\quad
        \begin{tikzpicture}[x=.42cm,y=.3cm,font=\scriptsize]
          \fill[accent!30] (0,0) -- (0,1) -- (5,6) -- (5,0) -- cycle;
          \rooster{0}{1}{5}{0}{2}{6}
          \draw[accent,thick] (0,1) -- (5,6);
        \end{tikzpicture}\quad
        \begin{tikzpicture}[x=.55cm,y=.42cm,font=\scriptsize]
          \fill[accent!30] (-2,0) -- (-2,2) -- (0,0) -- cycle;
          \rooster{-2}{1}{0}{0}{1}{2}
          \draw[accent,thick] (-2,2) -- (0,0);
        \end{tikzpicture}\quad
        \begin{tikzpicture}[x=.55cm,y=.42cm,font=\scriptsize]
          \fill[accent!15] (0,0) -- (0,-3) -- (3,0) -- cycle;
          \rooster{0}{1}{3}{-3}{1}{0}
          \draw[accent,thick] (0,-3) -- (3,0);
        \end{tikzpicture}}

- id: h1-oh
  soort: opdracht
  niveau: 1
  thema: |-
    integraal schatten met hokjes
  figuur:
    opties: |-
      5.4cm
    code: |-
      \begin{tikzpicture}[x=.72cm,y=.72cm,font=\scriptsize]
        \gebied{0}{6}{.1*(\x)^3-(\x)^2+2.4*\x+1}
        \rooster{0}{1}{6}{0}{1}{3}
        \kromme{0}{6}{.1*(\x)^3-(\x)^2+2.4*\x+1}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van een functie $f$ op $[0, 6]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schat $\ig_0^6 f(x)\dx$ door de hokjes te tellen.
      antwoord: |-
        ongeveer 9,5
      uitwerking: |-
        Per stuk van breedte 1 ongeveer $1{,}9$; $2{,}6$; $2{,}3$; $1{,}4$; $0{,}7$ en $0{,}6$. Samen ongeveer 9,5. (Dat is een schatting: elke waarde tussen 9 en 10 is goed.)
    - opgave: |-
        Schat daarmee de gemiddelde waarde van $f$ op $[0, 6]$. Teken ze als een horizontale rechte op de figuur.
      antwoord: |-
        ongeveer 1,6
      uitwerking: |-
        $\tfrac{9{,}5}{6}\approx 1{,}6$.

- id: h1-ol
  soort: opdracht
  niveau: 1
  thema: |-
    gebroken lijn
  figuur:
    opties: |-
      5.4cm
    code: |-
      \begin{tikzpicture}[x=.72cm,y=.5cm,font=\scriptsize]
        \fill[accent!30] (0,0) -- (0,2) -- (2,2) -- (4,0) -- cycle;
        \fill[accent!15] (4,0) -- (6,-2) -- (6,0) -- cycle;
        \rooster{0}{1}{6}{-2}{1}{3}
        \draw[accent,thick] (0,2) -- (2,2) -- (6,-2);
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f$. Bereken:
  lijst: enumerate
  delen:
    - opgave: |-
        $\ig_0^2 f(x)\dx$ en $\ig_2^6 f(x)\dx$;
      antwoord: |-
        4 en 0
      uitwerking: |-
        De rechthoek geeft $2\cdot 2=4$. Op $[2,6]$ heffen twee even grote driehoeken elkaar op: $2-2=0$.
    - opgave: |-
        $\ig_0^6 f(x)\dx$;
      antwoord: |-
        4
      uitwerking: |-
        $4+0=4$.
    - opgave: |-
        de werkelijke oppervlakte tussen de grafiek en de as op $[0, 6]$;
      antwoord: |-
        8
      uitwerking: |-
        $4+2+2=8$.
    - opgave: |-
        de gemiddelde waarde van $f$ op $[0, 6]$.
      antwoord: |-
        $\tfrac23$
      uitwerking: |-
        $\tfrac46=\tfrac23$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    teken van een integraal
  opgave: |-
    Is de integraal positief, negatief of nul? Reken niet: redeneer met een figuur.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_0^{\pi} \sin x\dx$
      antwoord: |-
        positief
      uitwerking: |-
        De grafiek ligt boven de as.
    - opgave: |-
        $\ig_{\pi}^{2\pi} \sin x\dx$
      antwoord: |-
        negatief
      uitwerking: |-
        De grafiek ligt onder de as.
    - opgave: |-
        $\ig_0^{2\pi} \sin x\dx$
      antwoord: |-
        nul
      uitwerking: |-
        De twee stukken heffen elkaar op.
    - opgave: |-
        $\ig_{-1}^{0} x^3\dx$
      antwoord: |-
        negatief
      uitwerking: |-
        De grafiek ligt onder de as.
    - opgave: |-
        $\ig_3^{1} x^2\dx$
      antwoord: |-
        negatief
      uitwerking: |-
        $x^2>0$, maar de grenzen staan omgekeerd: $\displaystyle\int_3^1 x^2\dx=-\int_1^3 x^2\dx<0$.
    - opgave: |-
        $\ig_{-5}^{5} x^3\dx$
      antwoord: |-
        nul
      uitwerking: |-
        $x^3$ is oneven.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    regels op gegeven waarden
  opgave: |-
    Gegeven: $\ig_1^3 f(x)\dx = 5$ en $\ig_3^7 f(x)\dx = -2$. Bereken:
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_1^7 f(x)\dx$
      antwoord: |-
        3
      uitwerking: |-
        $5+(-2)=3$.
    - opgave: |-
        $\ig_7^3 f(x)\dx$
      antwoord: |-
        2
      uitwerking: |-
        Grenzen wisselen: $-(-2)=2$.
    - opgave: |-
        $\ig_3^3 f(x)\dx$
      antwoord: |-
        0
      uitwerking: |-
        Gelijke grenzen: 0.
    - opgave: |-
        $\ig_1^3 \bigl(2f(x) + 1\bigr)\dx$
      antwoord: |-
        12
      uitwerking: |-
        $2\cdot 5+\displaystyle\int_1^3 1\dx=10+2=12$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    oppervlakte versus integraal
  figuur:
    opties: |-
      6.1cm
    code: |-
      \begin{tikzpicture}[x=1.05cm,y=.9cm,font=\scriptsize]
        \gebied{0}{2}{.25*\x*(\x-2)*(\x-4)}
        \gebied[accent!15]{2}{4}{.25*\x*(\x-2)*(\x-4)}
        \gebied{4}{4.6}{.25*\x*(\x-2)*(\x-4)}
        \assen{-.15}{5}{-1}{2}
        \kromme{0}{4.62}{.25*\x*(\x-2)*(\x-4)}
        \node at (1,.3) {3};
        \node at (3,-.3) {5};
        \node at (4.42,.25) {2};
        \node[below left] at (0,0) {$a$};
        \node[above] at (2,0) {$b$};
        \node[above] at (4,0) {$c$};
        \node[below] at (4.6,0) {$d$};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f$. De oppervlaktes van de drie gebieden staan erin.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\ig_a^d f(x)\dx$.
      antwoord: |-
        0
      uitwerking: |-
        $3-5+2=0$.
    - opgave: |-
        Bereken $\ig_b^d f(x)\dx$.
      antwoord: |-
        $-3$
      uitwerking: |-
        $-5+2=-3$.
    - opgave: |-
        Hoe groot is de werkelijke oppervlakte tussen de grafiek en de as van $a$ tot $d$?
      antwoord: |-
        10
      uitwerking: |-
        $3+5+2=10$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    limiet van een som herkennen
  opgave: |-
    Schrijf als een bepaalde integraal.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\lim_{n \to +\infty} \sum_{k=1}^{n} \dfrac{k^2}{n^2} \cdot \dfrac1n$
      antwoord: |-
        $\displaystyle\int_0^1 x^2\dx$
      uitwerking: |-
        $\Delta x=\tfrac1n$, $x_k=\tfrac{k}{n}$ loopt van 0 tot 1, en de functie is $x^2$.
    - opgave: |-
        $\displaystyle\lim_{n \to +\infty} \sum_{k=1}^{n} \sqrt{\dfrac{k}{n}} \cdot \dfrac1n$
      antwoord: |-
        $\displaystyle\int_0^1 \sqrt{x}\dx$
      uitwerking: |-
        Zelfde $\Delta x$ en $x_k$, de functie is $\sqrt{x}$.
    - opgave: |-
        $\displaystyle\lim_{n \to +\infty} \sum_{k=1}^{n} \Bigl(1 + \dfrac{2k}{n}\Bigr) \dfrac2n$
      antwoord: |-
        $\displaystyle\int_1^3 x\dx$
      uitwerking: |-
        $\Delta x=\tfrac2n$ en $x_k=1+\tfrac{2k}{n}$ loopt van 1 tot 3, en de functie is $x$.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    gemiddelde waarde
  opgave: |-
    Bereken de gemiddelde waarde van $f(x) = 2x + 1$ op $[1, 3]$. Voor welke $c$ neemt $f$ die waarde aan?
  antwoord: |-
    Gemiddelde 5 en $c=2$
  uitwerking: |-
    De integraal is een trapezium: $\dfrac{3+7}{2}\cdot 2=10$. Het gemiddelde is $\tfrac{10}{2}=5$. Uit $2c+1=5$ volgt $c=2$.

- id: h1-o8
  soort: opdracht
  niveau: 1
  thema: |-
    afstand uit snelheid
  prent:
    naam: auto
  opgave: |-
    Een auto rijdt 20 seconden aan 30 m/s en remt dan gelijkmatig tot stilstand in 10 seconden.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de grafiek van de snelheid.
    - opgave: |-
        Hoe ver rijdt de auto in die 30 seconden?
      antwoord: |-
        750 m
    - opgave: |-
        Bereken de gemiddelde snelheid.
      antwoord: |-
        25 m/s
  uitwerking: |-
    \textbf{a.}~Horizontaal op hoogte 30 van $t=0$ tot $t=20$, dan een rechte naar 0 bij $t=30$.

    \figuren{\begin{tikzpicture}[x=.17cm,y=.05cm,font=\scriptsize]
      \fill[accent!30] (0,0) -- (0,30) -- (20,30) -- (30,0) -- cycle;
      \rooster{0}{10}{30}{0}{10}{30}
      \draw[accent,thick] (0,30) -- (20,30) -- (30,0);
    \end{tikzpicture}}

    \textbf{b.}~$20\cdot 30+\tfrac12\cdot 10\cdot 30=750$ m.\\
    \textbf{c.}~$\tfrac{750}{30}=25$ m/s.

- id: h1-o9
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijken
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.85cm,y=.5cm,font=\scriptsize]
        \rooster{-1}{1}{2}{-1}{1}{4}
        \kromme{-1}{2}{(\x)^2}
        \kromme{-1}{2}{\x}
        \node[right] at (1.9,3.3) {$x^2$};
        \node[right] at (2,1.7) {$x$};
      \end{tikzpicture}
  opgave: |-
    Welke van de twee integralen is het grootst? Reken niet, maar gebruik de grafieken.
  lijst: enumerate
  delen:
    - opgave: |-
        $\ig_0^1 x\dx$ of $\ig_0^1 x^2\dx$
      antwoord: |-
        $\displaystyle\int_0^1 x\dx$
      uitwerking: |-
        Op $[0,1]$ is $x^2\leqslant x$.
    - opgave: |-
        $\ig_1^2 x\dx$ of $\ig_1^2 x^2\dx$
      antwoord: |-
        $\displaystyle\int_1^2 x^2\dx$
      uitwerking: |-
        Op $[1,2]$ is $x\leqslant x^2$.
    - opgave: |-
        $\ig_{-1}^{0} x\dx$ of $\ig_{-1}^{0} x^2\dx$
      antwoord: |-
        $\displaystyle\int_{-1}^{0} x^2\dx$
      uitwerking: |-
        Op $[-1,0]$ is $x\leqslant 0\leqslant x^2$.

- id: h1-o10
  soort: opdracht
  niveau: 1
  thema: |-
    oneven functie: klassieke fout
  opgave: |-
    Lena schrijft: ``$\int_{-2}^{2} x^3\dx = 0$, dus de grafiek van $x^3$ en de horizontale as sluiten op $[-2, 2]$ geen oppervlakte in.'' Wat klopt er niet?
  antwoord: |-
    De integraal is 0, de oppervlakte niet.
  uitwerking: |-
    De integraal is wel 0, omdat het stuk onder de as negatief telt en even groot is als het stuk erboven. De oppervlakte is de som van twee positieve stukken, dus niet 0.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    limiet van de bovensom
  opgave: |-
    Bereken $\ig_0^2 3x\dx$ als limiet van de bovensom. Controleer met een figuur.
  antwoord: |-
    6
  uitwerking: |-
    $\Delta x=\tfrac2n$ en $x_k=\tfrac{2k}{n}$, dus $B_n=\displaystyle\sum_{k=1}^{n} \dfrac{6k}{n}\cdot\dfrac2n=\dfrac{12}{n^2}\cdot\dfrac{n(n+1)}{2}=\dfrac{6(n+1)}{n}$, met limiet 6. De driehoek: $\tfrac12\cdot 2\cdot 6=6$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    debiet
  opgave: |-
    Een bad wordt gevuld. De eerste 4 minuten stroomt er 12 liter per minuut in. Van minuut 4 tot 6 daalt het debiet gelijkmatig tot 0. Van minuut 6 tot 10 loopt er 8 liter per minuut weg. Het bad is in het begin leeg.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de grafiek van het debiet, met weglopen als negatief debiet.
    - opgave: |-
        Hoeveel water zit er na 10 minuten in het bad?
      antwoord: |-
        28 liter
    - opgave: |-
        Op welk moment zit er het meest in, en hoeveel is dat?
      antwoord: |-
        na 6 minuten, 60 liter
  uitwerking: |-
    \textbf{a.}~De figuur:

    \figuren{\begin{tikzpicture}[x=.5cm,y=.13cm,font=\scriptsize]
      \fill[accent!30] (0,0) -- (0,12) -- (4,12) -- (6,0) -- cycle;
      \fill[accent!15] (6,0) rectangle (10,-8);
      \rooster{0}{2}{10}{-8}{4}{12}
      \draw[accent,thick] (0,12) -- (4,12) -- (6,0) (6,-8) -- (10,-8);
    \end{tikzpicture}}
    \textbf{b.}~Rechthoek $4\cdot 12=48$, driehoek $\tfrac12\cdot 2\cdot 12=12$ en rechthoek onder de as $4\cdot(-8)=-32$. Samen 28 liter.\\
    \textbf{c.}~Zolang het debiet positief is, neemt het volume toe: tot minuut 6. Dan is het volume $48+12=60$ liter.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    cirkel en absolute waarde herkennen
  opgave: |-
    Bereken met een figuur.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_0^2 \sqrt{4 - x^2}\dx$
      antwoord: |-
        $\pi$
      uitwerking: |-
        Een kwart van een cirkel met straal 2: $\tfrac14\cdot\pi\cdot 4=\pi$.
    - opgave: |-
        $\ig_{-2}^{2} \bigl(3 + \sqrt{4 - x^2}\bigr)\dx$
      antwoord: |-
        $12+2\pi$
      uitwerking: |-
        Een rechthoek $4\cdot 3=12$ plus een halve cirkel met straal 2, dat is $2\pi$.
    - opgave: |-
        $\ig_0^4 \sqrt{4x - x^2}\dx$
      antwoord: |-
        $2\pi$
      uitwerking: |-
        $y=\sqrt{4x-x^2}$ geeft $(x-2)^2+y^2=4$ met $y\geqslant 0$: de bovenste helft van de cirkel met middelpunt $(2,0)$ en straal 2. Dus $2\pi$.
    - opgave: |-
        $\ig_0^4 |x - 1|\dx$
      antwoord: |-
        5
      uitwerking: |-
        Twee driehoeken: $\tfrac12\cdot 1\cdot 1+\tfrac12\cdot 3\cdot 3=5$.
    - opgave: |-
        $\ig_{-1}^{2} \bigl(|x| + 1\bigr)\dx$
      antwoord: |-
        $\tfrac{11}{2}$
      uitwerking: |-
        Rechthoek $3\cdot 1=3$ en twee driehoeken: $\tfrac12\cdot 1\cdot 1+\tfrac12\cdot 2\cdot 2=\tfrac52$. Samen $\tfrac{11}{2}$.
    - opgave: |-
        $\ig_{-3}^{3} |x|\dx$
      antwoord: |-
        9
      uitwerking: |-
        Twee driehoeken met basis 3 en hoogte 3: $2\cdot\tfrac92=9$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    Riemannsom: midden van elk deel
  opgave: |-
    We benaderen $\ig_1^2 \dfrac1x\dx$ met $n = 4$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $O_4$ en $B_4$, op drie decimalen.
      antwoord: |-
        $O_4\approx 0{,}635$ en $B_4\approx 0{,}760$
      uitwerking: |-
        $\Delta x=\tfrac14$. $O_4=\tfrac14\bigl(\tfrac45+\tfrac23+\tfrac47+\tfrac12\bigr)\approx 0{,}635$ en $B_4=\tfrac14\bigl(1+\tfrac45+\tfrac23+\tfrac47\bigr)\approx 0{,}760$.
    - opgave: |-
        Neem nu de hoogte in het midden van elk deel. Bereken die Riemannsom op drie decimalen.
      antwoord: |-
        $\approx 0{,}691$
      uitwerking: |-
        De middens zijn $1{,}125;\ 1{,}375;\ 1{,}625;\ 1{,}875$. De som is $\tfrac14\bigl(\tfrac{8}{9}+\tfrac{8}{11}+\tfrac{8}{13}+\tfrac{8}{15}\bigr)\approx 0{,}691$.
    - opgave: |-
        Waarom verwacht je dat die laatste benadering beter is?
      uitwerking: |-
        In elk deel ligt een stuk van de rechthoek boven en een stuk onder de grafiek, en die heffen elkaar grotendeels op.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    hoe fijn verdelen?
  figuur:
    opties: |-
      3.8cm
    code: |-
      \begin{tikzpicture}[x=1.45cm,y=.55cm,font=\scriptsize]
        \riemann{4}{0}{2}{(\x)^2}{0}
        \foreach \l/\o/\b in {0/0/.25,.5/.25/1,1/1/2.25,1.5/2.25/4}{\fill[accent!55] (\l,\o) rectangle (\l+.5,\b);}
        \assen{-.1}{2.2}{-.2}{4.5}
        \kromme{0}{2}{(\x)^2}
      \end{tikzpicture}
  opgave: |-
    Een stijgende functie op $[a, b]$ heeft ondersom $O_n$ en bovensom $B_n$. De donkere rechthoekjes in de figuur vormen het verschil $B_n - O_n$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schuif ze in gedachten onder elkaar in één kolom. Toon zo aan: $B_n - O_n = \Delta x \cdot \bigl(f(b) - f(a)\bigr)$.
      uitwerking: |-
        In $B_n-O_n$ valt alles weg behalve $\Delta x\cdot f(x_n)-\Delta x\cdot f(x_0)$, want elke andere functiewaarde staat in beide sommen.
    - opgave: |-
        Voor $f(x) = x^2$ op $[0, 2]$: hoe groot moet $n$ minstens zijn opdat $B_n - O_n < 0{,}01$?
      antwoord: |-
        $n=801$
      uitwerking: |-
        $\tfrac2n\cdot 4<0{,}01$ geeft $n>800$, dus minstens $n=801$.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    arbeid
  opgave: |-
    Je duwt een kar 4 m ver met een constante kracht van 50 N. Daarna neemt de kracht gelijkmatig af tot 0 N over de volgende 2 m.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de kracht als functie van de afstand.
    - opgave: |-
        De arbeid (in joule) is de oppervlakte onder die grafiek. Bereken die.
      antwoord: |-
        250 J
  uitwerking: |-
    \textbf{a.}~Horizontaal op hoogte 50 tot 4 m, dan een rechte naar 0 bij 6 m.

    \figuren{\begin{tikzpicture}[x=.6cm,y=.04cm,font=\scriptsize]
      \fill[accent!30] (0,0) -- (0,50) -- (4,50) -- (6,0) -- cycle;
      \rooster{0}{2}{6}{0}{25}{50}
      \draw[accent,thick] (0,50) -- (4,50) -- (6,0);
    \end{tikzpicture}}

    \textbf{b.}~$4\cdot 50+\tfrac12\cdot 2\cdot 50=250$ J.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    vermogen en energie
  opgave: |-
    Het vermogen van zonnepanelen stijgt op een dag gelijkmatig van 0 kW om 7 uur tot 3 kW om 12 uur, en daalt dan gelijkmatig tot 0 kW om 18 uur.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de opgewekte energie. Welke eenheid krijgt de uitkomst?
      antwoord: |-
        16,5 kWh
      uitwerking: |-
        De oppervlakte is een driehoek: $\tfrac12\cdot 11\cdot 3=16{,}5$. De eenheid is kW maal uur: kilowattuur.
    - opgave: |-
        Bereken het gemiddelde vermogen tussen 7 en 18 uur.
      antwoord: |-
        1,5 kW
      uitwerking: |-
        $\tfrac{16{,}5}{11}=1{,}5$ kW.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    middelwaardestelling
  opgave: |-
    Gegeven: $f(x) = \sqrt{16 - x^2}$ op $[-4, 4]$. Bereken de gemiddelde waarde en alle waarden $c$ uit de middelwaardestelling, op twee decimalen.
  antwoord: |-
    Gemiddelde $\pi$; $c\approx\pm 2{,}48$
  uitwerking: |-
    De integraal is een halve cirkel: $\tfrac12\cdot\pi\cdot 16=8\pi$, dus het gemiddelde is $\tfrac{8\pi}{8}=\pi$. Uit $\sqrt{16-c^2}=\pi$ volgt $c^2=16-\pi^2$, dus $c\approx\pm 2{,}48$. Beide liggen in het interval.

- id: h1-o20
  soort: opdracht
  niveau: 2
  thema: |-
    onbekende in de grens of het voorschrift
  opgave: |-
    Bepaal de onbekende met een figuur.
  lijst: enumerate
  delen:
    - opgave: |-
        $\ig_0^x 2t\dt = 9$ met $x > 0$
      antwoord: |-
        $x=3$
      uitwerking: |-
        De driehoek heeft basis $x$ en hoogte $2x$: $x^2=9$, dus $x=3$.
    - opgave: |-
        $\ig_0^a (a - t)\dt = 8$ met $a > 0$
      antwoord: |-
        $a=4$
      uitwerking: |-
        De driehoek heeft basis $a$ en hoogte $a$: $\tfrac{a^2}{2}=8$, dus $a=4$.
    - opgave: |-
        $\ig_0^2 (kx + 1)\dx = 8$
      antwoord: |-
        $k=3$
      uitwerking: |-
        Lineariteit: $k\cdot 2+2=8$, want $\displaystyle\int_0^2 x\dx=2$. Dus $k=3$.

- id: h1-o21
  soort: opdracht
  niveau: 2
  thema: |-
    bewijs: veelvoud
  opgave: |-
    Bewijs met Riemannsommen:
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_a^b r f(x)\dx = r \ig_a^b f(x)\dx$
    - opgave: |-
        $\ig_a^b r\dx = r(b - a)$
  antwoord: |-
    Zie de uitgewerkte oplossingen.
  uitwerking: |-
    $\displaystyle\sum_{k=1}^{n} r f(c_k)\,\Delta x=r\sum_{k=1}^{n} f(c_k)\,\Delta x$. Neem aan beide kanten de limiet.\\
    Voor de constante functie is elke Riemannsom gelijk aan $n\cdot r\cdot\dfrac{b-a}{n}=r(b-a)$, en dat is dus ook de limiet.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    algemene formule
  opgave: |-
    Gebruik de bovensom.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: $\ig_0^a x^2\dx = \dfrac{a^3}{3}$ voor elke $a > 0$.
      uitwerking: |-
        $\Delta x=\tfrac{a}{n}$ en $x_k=\tfrac{ak}{n}$, dus $B_n=\dfrac{a^3}{n^3}\displaystyle\sum_{k=1}^{n} k^2=\dfrac{a^3(n+1)(2n+1)}{6n^2}$, met limiet $\dfrac{a^3\cdot 2}{6}=\dfrac{a^3}{3}$.
    - opgave: |-
        Bereken daarmee $\ig_1^4 x^2\dx$ en $\ig_{-1}^{2} (x^2 + 1)\dx$.
      antwoord: |-
        21 en 6
      uitwerking: |-
        $\displaystyle\int_1^4 x^2\dx=\dfrac{64}{3}-\dfrac13=21$. $x^2$ is even, dus $\displaystyle\int_{-1}^{0} x^2\dx=\int_0^1 x^2\dx=\tfrac13$. Samen met $\int_0^2 x^2\dx=\tfrac83$ en de rechthoek 3: $\tfrac13+\tfrac83+3=6$.

- id: h1-o23
  soort: opdracht
  niveau: 3
  thema: |-
    limiet van de bovensom: derde macht
  opgave: |-
    Er geldt $\displaystyle\sum_{k=1}^{n} k^3 = \Bigl(\dfrac{n(n+1)}{2}\Bigr)^{\!2}$. Bereken $\ig_0^2 x^3\dx$ als limiet van de bovensom.
  antwoord: |-
    4
  uitwerking: |-
    $\Delta x=\tfrac2n$ en $x_k=\tfrac{2k}{n}$, dus $B_n=\dfrac{16}{n^4}\displaystyle\sum_{k=1}^{n} k^3=\dfrac{16}{n^4}\cdot\dfrac{n^2(n+1)^2}{4}=\dfrac{4(n+1)^2}{n^2}$, met limiet 4.

- id: h1-o24
  soort: opdracht
  niveau: 3
  thema: |-
    schatten met vergelijken
  opgave: |-
    Niemand kan $\ig_0^1 \e^{-x^2}\dx$ uitrekenen met een formule, maar je kunt de waarde wel insluiten.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom geldt $1 - x^2 \leqslant \e^{-x^2} \leqslant 1$ op $[0, 1]$? Gebruik dat $\e^u \geqslant 1 + u$ voor elke $u$.
      uitwerking: |-
        Met $u=-x^2$ krijg je $\e^{-x^2}\geqslant 1-x^2$. Omdat $-x^2\leqslant 0$ is ook $\e^{-x^2}\leqslant\e^0=1$.
    - opgave: |-
        Toon aan: $\tfrac23 \leqslant \ig_0^1 \e^{-x^2}\dx \leqslant 1$. Je mag $\int_0^1 x^2\dx = \tfrac13$ gebruiken.
      uitwerking: |-
        Vergelijken geeft $\displaystyle\int_0^1(1-x^2)\dx\leqslant\int_0^1\e^{-x^2}\dx\leqslant\int_0^1 1\dx$, en links staat $1-\tfrac13=\tfrac23$.
  antwoord: |-
    Zie de uitgewerkte oplossingen.

- id: h1-o25
  soort: opdracht
  niveau: 3
  thema: |-
    niet elke functie is integreerbaar
  opgave: |-
    Neem de functie $D$ op $[0, 1]$ met $D(x) = 1$ als $x$ rationaal is, en $D(x) = 0$ als $x$ irrationaal is.
  lijst: enumerate
  delen:
    - opgave: |-
        In elk deel van $[0, 1]$ liggen rationale en irrationale getallen. Hoe groot is $B_n$? En $O_n$?
      antwoord: |-
        $B_n=1$ en $O_n=0$
      uitwerking: |-
        De grootste waarde in elk deel is 1, de kleinste 0. Dus $B_n=n\cdot\tfrac1n\cdot 1=1$ en $O_n=0$ voor elke $n$.
    - opgave: |-
        Waarom bestaat de limiet uit de definitie van de bepaalde integraal hier niet? Welke voorwaarde uit de definitie is niet voldaan?
      uitwerking: |-
        De Riemannsom hangt af van de keuze van de punten $c_k$: de limiet is 1 of 0, of iets anders. De functie is niet continu, en dat was de voorwaarde.

- id: h1-o26
  soort: opdracht
  niveau: 3
  thema: |-
    gemiddelde is nul
  opgave: |-
    Stel dat $f$ continu is op $[a, b]$ en dat $\ig_a^b f(x)\dx = 0$. Bewijs dat de grafiek van $f$ de horizontale as op $[a, b]$ minstens één keer raakt of snijdt.
  antwoord: |-
    Gebruik de middelwaardestelling.
  uitwerking: |-
    Volgens de middelwaardestelling is er een $c\in[a,b]$ met $f(c)\,(b-a)=0$. Omdat $b\neq a$ (anders staat er niets te bewijzen) is $f(c)=0$.

- id: h1-koppel-1
  soort: koppel
  niveau: 3
  koppel:
    rubriek: discreet
    onderwerp: |-
      Rijen
  opgave: |-
    We berekenen $\ig_0^1 2^x\dx$ met een bovensom. De termen vormen een meetkundige rij.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: $B_n = \dfrac1n\bigl(2^{1/n} + 2^{2/n} + \cdots + 2^{n/n}\bigr) = \dfrac1n \cdot 2^{1/n} \cdot \dfrac{1}{2^{1/n} - 1}$.
      uitwerking: |-
        De functie stijgt, $\Delta x=\tfrac1n$. De rij heeft eerste term $2^{1/n}$, reden $q=2^{1/n}$ en $n$ termen, dus de som is $2^{1/n}\cdot\dfrac{q^{\,n}-1}{q-1}=2^{1/n}\cdot\dfrac{2-1}{2^{1/n}-1}$.
    - opgave: |-
        Bereken $B_{10}$ en $B_{100}$ op vier decimalen.
      antwoord: |-
        $B_{10}\approx 1{,}4933$ en $B_{100}\approx 1{,}4477$
      uitwerking: |-
        Rechtstreeks invullen.
    - opgave: |-
        Stel $h = \tfrac1n$ en gebruik $\displaystyle\lim_{h \to 0} \dfrac{2^h - 1}{h} = \ln 2$. Bereken de limiet van $B_n$.
      antwoord: |-
        $\dfrac{1}{\ln 2}\approx 1{,}4427$
      uitwerking: |-
        $B_n=2^h\cdot\dfrac{h}{2^h-1}$, en dat gaat naar $1\cdot\dfrac{1}{\ln 2}$.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Goniometrie
  figuur:
    opties: |-
      2.9cm
    code: |-
      \begin{tikzpicture}[x=1.25cm,y=1.25cm,font=\scriptsize]
        \draw[lijngrijs] (0,0) circle (1);
        \fill[accent!30] (0,0) -- (1,0) -- (60:1) -- cycle;
        \foreach \h in {0,60,...,300}{\draw[accent] (0,0) -- (\h:1) -- (\h+60:1);}
        \node[right] at (.25,.12) {$\frac{2\pi}{n}$};
        \node[below] at (.5,0) {$r$};
      \end{tikzpicture}
  opgave: |-
    De oppervlakte van een cirkel is de limiet van een som van driehoeken. Teken in een cirkel met straal $r$ een regelmatige $n$-hoek, en verbind de hoekpunten met het middelpunt.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de $n$-hoek oppervlakte $\dfrac{n r^2}{2} \sin\dfrac{2\pi}{n}$ heeft.
      uitwerking: |-
        Elke driehoek heeft twee zijden $r$ met tophoek $\tfrac{2\pi}{n}$, dus oppervlakte $\tfrac12 r^2\sin\tfrac{2\pi}{n}$. Er zijn $n$ driehoeken.
    - opgave: |-
        Bereken die oppervlakte voor $r = 1$ en $n = 6$, $n = 12$ en $n = 100$, op vier decimalen.
      antwoord: |-
        $2{,}5981$; $3{,}0000$; $3{,}1395$
      uitwerking: |-
        Rechtstreeks invullen, in radialen.
    - opgave: |-
        Gebruik $\displaystyle\lim_{h \to 0} \dfrac{\sin h}{h} = 1$ met $h = \tfrac{2\pi}{n}$ om de limiet voor $n \to +\infty$ te bepalen.
      antwoord: |-
        $\pi r^2$
      uitwerking: |-
        $\dfrac{nr^2}{2}\sin\dfrac{2\pi}{n}=\pi r^2\cdot\dfrac{\sin h}{h}$, en dat gaat naar $\pi r^2$.

- id: h1-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: |-
      Statistiek
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[x=.095cm,y=45cm,font=\scriptsize]
        \draw[accent,fill=accent!25] (0,0) rectangle (10,.02);
        \draw[accent,fill=accent!25] (10,0) rectangle (25,.0333);
        \draw[accent,fill=accent!25] (25,0) rectangle (40,.02);
        \draw[->,grijs] (-1,0) -- (43,0);
        \draw[->,grijs] (0,0) -- (0,.042);
        \foreach \x/\l in {0/150,10/160,25/175,40/190}{\node[below] at (\x,0) {\l};}
      \end{tikzpicture}
  opgave: |-
    Bij een histogram met ongelijke klassen is de oppervlakte van een staaf de relatieve frequentie, en niet de hoogte. Van de lengte van 200 leerlingen (in cm) weet je: 20\% in $[150, 160[$, 50\% in $[160, 175[$ en 30\% in $[175, 190[$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de hoogte van elke staaf. Wat is de totale oppervlakte?
      antwoord: |-
        $0{,}02$; $\tfrac{1}{30}$; $0{,}02$ en oppervlakte 1
      uitwerking: |-
        $\tfrac{0{,}20}{10}=0{,}02$, $\tfrac{0{,}50}{15}=\tfrac1{30}$ en $\tfrac{0{,}30}{15}=0{,}02$. De totale oppervlakte is $0{,}2+0{,}5+0{,}3=1$.
    - opgave: |-
        Stel dat de lengtes gelijkmatig over de klassen verdeeld zijn. Welk deel van de leerlingen is korter dan 170 cm?
      antwoord: |-
        $\tfrac{8}{15}\approx 53{,}3\%$
      uitwerking: |-
        $0{,}20+10\cdot\tfrac{1}{30}=\tfrac15+\tfrac13=\tfrac{8}{15}$.
    - opgave: |-
        Wat wordt het histogram als je de klassen steeds smaller maakt? Hoe bereken je dan het deel van de leerlingen tussen $a$ en $b$?
      antwoord: |-
        met een integraal
      uitwerking: |-
        De staven worden een kromme, de dichtheidsfunctie $f$ met totale oppervlakte 1. Het deel tussen $a$ en $b$ is $\displaystyle\int_a^b f(x)\dx$.

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Bereken $O_4$ en $B_4$ voor $f(x) = 4 - x^2$ op $[0, 2]$.
  antwoord: |-
    $O_4=4{,}25$ en $B_4=6{,}25$
  uitwerking: |-
    $\Delta x=\tfrac12$. De functie daalt; de waarden zijn $4;\ 3{,}75;\ 3;\ 1{,}75;\ 0$.\\
    $O_4=\tfrac12(3{,}75+3+1{,}75+0)=4{,}25$ en $B_4=\tfrac12(4+3{,}75+3+1{,}75)=6{,}25$.

- id: h1-t2
  soort: test
  niveau: 2
  opgave: |-
    Bereken $\ig_0^1 4x\dx$ als limiet van de bovensom.
  antwoord: |-
    2
  uitwerking: |-
    $\Delta x=\tfrac1n$ en $x_k=\tfrac{k}{n}$, dus $B_n=\displaystyle\sum_{k=1}^{n}\dfrac{4k}{n}\cdot\dfrac1n=\dfrac{4}{n^2}\cdot\dfrac{n(n+1)}{2}=\dfrac{2(n+1)}{n}$, met limiet 2.

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Schrijf $\displaystyle\lim_{n \to +\infty} \sum_{k=1}^{n} \Bigl(1 + \dfrac{k}{n}\Bigr)^{\!3} \cdot \dfrac1n$ als een bepaalde integraal.
  antwoord: |-
    $\displaystyle\int_1^2 x^3\dx$
  uitwerking: |-
    $\Delta x=\tfrac1n$ en $x_k=1+\tfrac{k}{n}$ loopt van 1 tot 2.

- id: h1-t4
  soort: test
  niveau: 1
  opgave: |-
    Bereken $\ig_{-1}^{3} 2x\dx$ en de werkelijke oppervlakte tussen de grafiek en de horizontale as op dat interval.
  antwoord: |-
    Integraal 8 en oppervlakte 10
  uitwerking: |-
    Onder de as: $\tfrac12\cdot 1\cdot 2=1$. Erboven: $\tfrac12\cdot 3\cdot 6=9$. De integraal is $9-1=8$, de oppervlakte $9+1=10$.

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    De snelheid van een voorwerp is $v(t) = 2t - 4$ (in m/s) op $[0, 5]$. Bereken de verplaatsing en de afgelegde weg.
  antwoord: |-
    Verplaatsing 5 m, afgelegde weg 13 m
  uitwerking: |-
    De snelheid is 0 voor $t=2$. Onder de as: $\tfrac12\cdot 2\cdot 4=4$. Erboven: $\tfrac12\cdot 3\cdot 6=9$. Verplaatsing $9-4=5$ m, afgelegde weg $9+4=13$ m.

- id: h1-t6
  soort: test
  niveau: 1
  opgave: |-
    Gegeven: $\ig_0^4 f(x)\dx = 6$, \ $\ig_0^1 f(x)\dx = 2$ en $\ig_1^4 g(x)\dx = -1$.\\[1mm] Bereken $\ig_1^4 \bigl(f(x) - 2g(x)\bigr)\dx$.
  antwoord: |-
    6
  uitwerking: |-
    $\displaystyle\int_1^4 f(x)\dx=6-2=4$, dus de uitkomst is $4-2\cdot(-1)=6$.

- id: h1-t7
  soort: test
  niveau: 1
  opgave: |-
    Bereken $\ig_{-2}^{2} (x^3 + 2)\dx$.
  antwoord: |-
    8
  uitwerking: |-
    $x^3$ is oneven en geeft 0. De rechthoek geeft $4\cdot 2=8$.

- id: h1-t8
  soort: test
  niveau: 1
  opgave: |-
    Bereken de gemiddelde waarde van $f(x) = 3 - x$ op $[0, 3]$ en de waarde $c$ uit de middelwaardestelling.
  antwoord: |-
    Gemiddelde $\tfrac32$ en $c=\tfrac32$
  uitwerking: |-
    De integraal is $\tfrac12\cdot 3\cdot 3=\tfrac92$, en $\tfrac92\cdot\tfrac13=\tfrac32$. Uit $3-c=\tfrac32$ volgt $c=\tfrac32$.
