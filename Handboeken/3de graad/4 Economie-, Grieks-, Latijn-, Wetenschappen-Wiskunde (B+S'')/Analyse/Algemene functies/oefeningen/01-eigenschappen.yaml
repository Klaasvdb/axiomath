- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    domein
  opgave: |-
    Bepaal het domein van $f(x) = \dfrac{\sqrt{x + 2}}{x - 3}$.
  antwoord: |-
    $\left[-2, 3\right[ \cup \left]3, +\infty\right[$
  uitwerking: |-
    Wortel: $x + 2 \geqslant 0 \iff x \geqslant -2$. Noemer: $x \neq 3$. Samen $\left[-2, 3\right[ \cup \left]3, +\infty\right[$.

- id: h1-t5
  soort: test
  niveau: 1
  thema: |-
    grafiek lezen
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
        \rooster{-4}{1}{3}{-2}{1}{2}
        \draw[accent,thick] (-4,0) -- (-2,2) -- (0,-2) -- (3,1);
        \vol{(-4,0)} \open{(3,1)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef het domein en het bereik.
      antwoord: |-
        $\left[-4, 3\right[$; $[-2, 2]$
      uitwerking: |-
        $\dom f = \left[-4, 3\right[$ (open bolletje in $x = 3$), $\ber f = [-2, 2]$.
    - opgave: |-
        Geef de nulwaarden en de tekentabel.
      antwoord: |-
        $-4$, $-1$, $2$; \tekentabel{cccccc}{x & -4 & & -1 & & 2 & }{f(x) & 0 & + & 0 & - & 0 & +}
      uitwerking: |-
        Van $(-2, 2)$ naar $(0, -2)$ daalt de lijn 2 per eenheid: nulwaarde $-1$. Van $(0, -2)$ naar $(3, 1)$ stijgt ze 1 per eenheid: nulwaarde $2$. Ook $-4$ is een nulwaarde.\\ \tekentabel{cccccc}{x & -4 & & -1 & & 2 & }{f(x) & 0 & + & 0 & - & 0 & +}

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    tekentabel
  opgave: |-
    Bepaal de nulwaarden en de tekentabel van $f(x) = x^3 - x^2 - 6x$.
  antwoord: |-
    \tekentabel{cccccccc}{x & & -2 & & 0 & & 3 & }{f(x) & - & 0 & + & 0 & - & 0 & +}
  uitwerking: |-
    $f(x) = x(x^2 - x - 6) = x(x - 3)(x + 2)$, nulwaarden $-2$, $0$, $3$. Eén getal per interval: $f(-3) = -18$, $f(-1) = 4$, $f(1) = -6$, $f(4) = 24$:\\ \tekentabel{cccccccc}{x & & -2 & & 0 & & 3 & }{f(x) & - & 0 & + & 0 & - & 0 & +}

- id: h1-t6
  soort: test
  niveau: 2
  thema: |-
    tekentabel met een noemer
  opgave: |-
    Stel de tekentabel op van $f(x) = \dfrac{x^2 - 1}{x + 3}$.
  antwoord: |-
    \tekentabel{cccccccc}{x & & -3 & & -1 & & 1 & }{f(x) & - & | & + & 0 & - & 0 & +}
  uitwerking: |-
    Nulwaarden $-1$ en $1$; $f$ bestaat niet in $-3$.\\ \tekentabel{cccccccc}{x & & -3 & & -1 & & 1 & \\\hline x^2 - 1 & + & + & + & 0 & - & 0 & + \\ x + 3 & - & 0 & + & + & + & + & +}{f(x) & - & | & + & 0 & - & 0 & +}

- id: h1-t3
  soort: test
  niveau: 2
  thema: |-
    verloop aflezen
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.38cm,font=\scriptsize]
        \rooster{-3}{1}{3}{-4}{1}{4}
        \kromme{-3.4}{3.4}{-(\x)^3/4+3*\x}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f(x) = -\frac14x^3 + 3x$. Geef waar $f$ stijgt en daalt, en de extrema.
  antwoord: |-
    dalend op $\left]-\infty, -2\right]$ en $\left[2, +\infty\right[$, stijgend op $[-2, 2]$; min. $-4$ in $-2$, max. $4$ in $2$
  uitwerking: |-
    Dalend op $\left]-\infty, -2\right]$, stijgend op $[-2, 2]$, dalend op $\left[2, +\infty\right[$. Minimum $f(-2) = 2 - 6 = -4$, maximum $f(2) = -2 + 6 = 4$, geen van beide absoluut: de grafiek gaat links onbeperkt omhoog en rechts onbeperkt omlaag.

- id: h1-t4
  soort: test
  niveau: 1
  thema: |-
    even en oneven
  opgave: |-
    Even, oneven of geen van beide?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = \dfrac{x}{x^4 + 1}$
      antwoord: |-
        oneven
      uitwerking: |-
        $f(-x) = \dfrac{-x}{x^4 + 1} = -f(x)$.
    - opgave: |-
        $g(x) = x^2 - 2|x|$
      antwoord: |-
        even
      uitwerking: |-
        $g(-x) = x^2 - 2|x| = g(x)$.
    - opgave: |-
        $h(x) = x^2 - 2x$
      antwoord: |-
        geen van beide
      uitwerking: |-
        $h(1) = -1$, $h(-1) = 3$: $h(-1) \neq h(1)$ en $h(-1) \neq -h(1)$.

- id: h1-t7
  soort: test
  niveau: 2
  thema: |-
    symmetrie op een grafiek
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.55cm,font=\scriptsize]
        \rooster{-3}{1}{3}{-2}{1}{2}
        \draw[accent,thick] (0,1) -- (2,-1) -- (3,0);
        \vol{(0,1)} \vol{(3,0)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van een functie $f$ met domein $[-3, 3]$, alleen voor $x \geqslant 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de volledige grafiek als $f$ even is.
      antwoord: |-
        hoekpunten $(-3, 0)$, $(-2, -1)$, $(0, 1)$, $(2, -1)$, $(3, 0)$
      uitwerking: |-
        Spiegel om de $y$-as:
        \figuren{\begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-2}{1}{2}
          \draw[accent,thick] (-3,0) -- (-2,-1) -- (0,1) -- (2,-1) -- (3,0);
          \vol{(-3,0)} \vol{(3,0)}
        \end{tikzpicture}}
    - opgave: |-
        Kan $f$ oneven zijn?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: een oneven functie met $0$ in het domein heeft $f(0) = -f(0)$, dus $f(0) = 0$. Hier is $f(0) = 1$.
