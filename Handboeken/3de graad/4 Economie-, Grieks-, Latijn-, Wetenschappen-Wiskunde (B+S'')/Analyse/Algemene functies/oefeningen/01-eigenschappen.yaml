# Oefeningen van hoofdstuk 1. Zie oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken $f(-2)$ als $f(x) = 2x^2 - 3x$.
      antwoord: |-
        14
      uitwerking: |-
        $2 \cdot 4 + 6 = 14$.
    - opgave: |-
        Los op: $x^2 - 5x + 6 = 0$.
      antwoord: |-
        $x = 2$ of $x = 3$
      uitwerking: |-
        $(x - 2)(x - 3) = 0$.
    - opgave: |-
        Ontbind: $x^3 - 9x$.
      antwoord: |-
        $x(x - 3)(x + 3)$
      uitwerking: |-
        $x(x^2 - 9) = x(x - 3)(x + 3)$.
    - opgave: |-
        Los op: $4 - 2x \geqslant 0$.
      antwoord: |-
        $x \leqslant 2$
      uitwerking: |-
        $-2x \geqslant -4$, dus $x \leqslant 2$ (delen door een negatief getal keert het teken om).
    - opgave: |-
        Schrijf als interval: $-1 < x \leqslant 5$.
      antwoord: |-
        $\left]-1, 5\right]$
      uitwerking: |-
        $\left]-1, 5\right]$.
    - opgave: |-
        Bereken $f(a + 1)$ als $f(x) = x^2$.
      antwoord: |-
        $a^2 + 2a + 1$
      uitwerking: |-
        $(a + 1)^2 = a^2 + 2a + 1$.

- id: h1-verken
  soort: start
  figuur:
    opties: |-
      6.4cm
    code: |-
      \begin{tikzpicture}[x=.24cm,y=.36cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=3,ystep=1] (0,-3) grid (24,7);
        \draw[->,grijs] (0,0) -- (25.5,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,-3) -- (0,7.6) node[above,text=black] {$T$};
        \foreach \t in {3,6,...,24}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {-2,2,4,6}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \kromme{0}{24}{-4*cos(15*(\x-3))+2}
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken} De grafiek toont de temperatuur $T$ (in $^\circ$C) op een winterdag, $t$ uur na middernacht.
  lijst: enumerate
  delen:
    - opgave: |-
        Wanneer was het het warmst, en hoe warm?
      antwoord: |-
        om 15 uur, $6\,^\circ$C
      uitwerking: |-
        De top van de grafiek: $t = 15$, $T = 6$.
    - opgave: |-
        Wanneer vroor het?
      antwoord: |-
        van 0 tot 7 uur en van 23 tot 24 uur
      uitwerking: |-
        Waar de grafiek onder de $t$-as ligt: tot 7 uur en na 23 uur.
    - opgave: |-
        Wanneer werd het warmer?
      antwoord: |-
        van 3 tot 15 uur
      uitwerking: |-
        Waar de grafiek stijgt: van het dal in $t = 3$ tot de top in $t = 15$.

- id: h1-domein
  soort: kort
  opgave: |-
    Bepaal het domein.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac{x + 3}{x^2 - x}$
      antwoord: |-
        $\R \setminus \{0, 1\}$
      uitwerking: |-
        $x^2 - x = x(x - 1) \neq 0$, dus $x \neq 0$ en $x \neq 1$.
    - opgave: |-
        $g(x) = \dfrac{1}{\sqrt{4 - x}}$
      antwoord: |-
        $\left]-\infty, 4\right[$
      uitwerking: |-
        $4 - x > 0$: strikt, want de wortel staat in de noemer.

- id: h1-aflezen
  soort: kort
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.55cm,font=\scriptsize]
        \rooster{-3}{1}{4}{-2}{1}{3}
        \draw[accent,thick] (-3,-2) -- (0,1) (0,3) -- (4,0);
        \vol{(-3,-2)} \open{(0,1)} \vol{(0,3)} \open{(4,0)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees het domein en het bereik af.
      antwoord: |-
        $\dom f = \left[-3, 4\right[$, $\ber f = [-2, 3]$
      uitwerking: |-
        Projecteer op de $x$-as: van $-3$ (vol) tot $4$ (open), dus $\dom f = \left[-3, 4\right[$. Projecteer op de $y$-as: het linkerstuk geeft $\left[-2, 1\right[$, het rechterstuk $\left]0, 3\right]$. Samen $\ber f = [-2, 3]$.
    - opgave: |-
        Hoeveel is $f(0)$?
      antwoord: |-
        3
      uitwerking: |-
        In $x = 0$ hoort het volle bolletje $(0, 3)$ bij de grafiek, het open bolletje $(0, 1)$ niet. Dus $f(0) = 3$.
    - opgave: |-
        Hoeveel oplossingen heeft de vergelijking $f(x) = 1$?
      antwoord: |-
        één
      uitwerking: |-
        De horizontale rechte $y = 1$ raakt het linkerstuk alleen in het open bolletje $(0, 1)$, dat niet bij de grafiek hoort. Ze snijdt het rechterstuk één keer (in $x = \frac83$). Eén oplossing.

- id: h1-teken-veelterm
  soort: kort
  opgave: |-
    Bepaal de nulwaarden en het tekenverloop.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = 9x - x^3$
      antwoord: |-
        \tekentabel{cccccccc}{x & & -3 & & 0 & & 3 & }{f(x) & + & 0 & - & 0 & + & 0 & -}
      uitwerking: |-
        $f(x) = x(9 - x^2) = x(3 - x)(3 + x)$, nulwaarden $-3$, $0$, $3$. Eén getal per interval: $f(-4) = 28$, $f(-1) = -8$, $f(1) = 8$, $f(4) = -28$.\\
        \tekentabel{cccccccc}{x & & -3 & & 0 & & 3 & }{f(x) & + & 0 & - & 0 & + & 0 & -}
    - opgave: |-
        $g(x) = (x - 1)^2(x + 2)$
      antwoord: |-
        \tekentabel{cccccc}{x & & -2 & & 1 & }{g(x) & - & 0 & + & 0 & +}
      uitwerking: |-
        Nulwaarden $-2$ en $1$. De factor $(x - 1)^2$ is nooit negatief, dus $g$ heeft het teken van $x + 2$, behalve in $1$. In $1$ wisselt het teken dus niet.\\
        \tekentabel{cccccc}{x & & -2 & & 1 & }{g(x) & - & 0 & + & 0 & +}

- id: h1-teken
  soort: kort
  opgave: |-
    Bepaal de nulwaarden en stel de tekentabel op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^2(x - 3)$
      antwoord: |-
        \tekentabel{cccccc}{x & & 0 & & 3 & }{f(x) & - & 0 & - & 0 & +}
      uitwerking: |-
        Nulwaarden $0$ en $3$. De factor $x^2$ is nooit negatief, dus het teken is dat van $x - 3$:\\ \tekentabel{cccccc}{x & & 0 & & 3 & }{f(x) & - & 0 & - & 0 & +}
    - opgave: |-
        $g(x) = \dfrac{2 - x}{x + 1}$
      antwoord: |-
        \tekentabel{cccccc}{x & & -1 & & 2 & }{g(x) & - & | & + & 0 & -}
      uitwerking: |-
        Nulwaarde $2$, $g$ bestaat niet in $-1$:\\ \tekentabel{cccccc}{x & & -1 & & 2 & \\\hline 2 - x & + & + & + & 0 & - \\ x + 1 & - & 0 & + & + & +}{g(x) & - & | & + & 0 & -}

- id: h1-verloop
  soort: kort
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.42cm,font=\scriptsize]
        \rooster{-3}{1}{3}{-4}{1}{2}
        \kromme{-3}{3}{(\x)^4/4-2*(\x)^2}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f(x) = \frac14x^4 - 2x^2$. Geef de intervallen waar $f$ stijgt en daalt, en de extrema. Welke zijn absoluut?
  antwoord: |-
    dalend op $\left]-\infty, -2\right]$ en $[0, 2]$, stijgend op $[-2, 0]$ en $\left[2, +\infty\right[$; min. $-4$ in $\pm 2$ (absoluut), max. $0$ in $0$
  uitwerking: |-
    Dalend op $\left]-\infty, -2\right]$ en op $[0, 2]$, stijgend op $[-2, 0]$ en op $\left[2, +\infty\right[$. Minimum $f(-2) = f(2) = -4$, absoluut. Maximum $f(0) = 0$, niet absoluut: voor grote $x$ wordt $f(x)$ positief.

- id: h1-verlooptabel
  soort: kort
  opgave: |-
    Een functie $f$ met domein $\R$ heeft deze verlooptabel:\par
    \figuren{\tekentabel{cccccc}{x & & -3 & & 1 & }{f(x) & \searrow & -2 & \nearrow & 4 & \searrow}}
  lijst: enumerate
  delen:
    - opgave: |-
        Waar stijgt $f$, en waar daalt $f$?
      antwoord: |-
        stijgend op $[-3, 1]$; dalend op $\left]-\infty, -3\right]$ en $\left[1, +\infty\right[$
      uitwerking: |-
        De pijl omhoog staat tussen $-3$ en $1$: stijgend op $[-3, 1]$. Dalend op $\left]-\infty, -3\right]$ en op $\left[1, +\infty\right[$.
    - opgave: |-
        Geef de extrema.
      antwoord: |-
        min. $-2$ in $-3$; max. $4$ in $1$
      uitwerking: |-
        Van dalen naar stijgen in $-3$: minimum $f(-3) = -2$. Van stijgen naar dalen in $1$: maximum $f(1) = 4$.
    - opgave: |-
        Schets een mogelijke grafiek.
      antwoord: |-
        zie de uitgewerkte oplossingen
      uitwerking: |-
        Bijvoorbeeld (er zijn er veel):
        \figuren{\begin{tikzpicture}[x=.45cm,y=.35cm,font=\scriptsize]
          \rooster{-5}{1}{3}{-3}{1}{5}
          \kromme{-5}{2.8}{-3/16*(\x)^3-9/16*(\x)^2+27/16*\x+49/16}
          \vol{(-3,-2)} \vol{(1,4)}
        \end{tikzpicture}}
    - opgave: |-
        Hoeveel nulwaarden heeft $f$ minstens?
      antwoord: |-
        minstens één
      uitwerking: |-
        Tussen $-3$ en $1$ stijgt $f$ van $-2$ naar $4$: de grafiek snijdt de $x$-as daar precies één keer (als ze een doorlopende lijn is). Over de waarden links van $-3$ en rechts van $1$ zegt de tabel niets: daar kunnen nog nulwaarden liggen of niet.

- id: h1-even
  soort: kort
  opgave: |-
    Even, oneven of geen van beide? Toon aan.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = x^4 - 3x^2$
      antwoord: |-
        even
      uitwerking: |-
        $f(-x) = x^4 - 3x^2 = f(x)$.
    - opgave: |-
        $g(x) = \dfrac{x}{x^2 + 1}$
      antwoord: |-
        oneven
      uitwerking: |-
        $g(-x) = \dfrac{-x}{x^2 + 1} = -g(x)$.
    - opgave: |-
        $h(x) = x^3 + 1$
      antwoord: |-
        geen van beide
      uitwerking: |-
        $h(1) = 2$ en $h(-1) = 0$: $h(-1) \neq h(1)$ en $h(-1) \neq -h(1)$.

- id: h1-symmetrie
  soort: kort
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.55cm,font=\scriptsize]
        \rooster{-3}{1}{3}{-2}{1}{2}
        \draw[accent,thick] (0,0) -- (1,2) -- (3,-1);
        \vol{(0,0)} \vol{(3,-1)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van een functie $f$ met domein $[-3, 3]$, maar alleen voor $x \geqslant 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de volledige grafiek als $f$ even is.
      antwoord: |-
        hoekpunten $(-3, -1)$, $(-1, 2)$, $(0, 0)$, $(1, 2)$, $(3, -1)$
      uitwerking: |-
        Spiegel om de $y$-as: $(x, y) \mapsto (-x, y)$. Links komen de hoekpunten $(-1, 2)$ en $(-3, -1)$.
        \figuren{\begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-2}{1}{2}
          \draw[accent,thick] (-3,-1) -- (-1,2) -- (0,0) -- (1,2) -- (3,-1);
          \vol{(-3,-1)} \vol{(3,-1)}
        \end{tikzpicture}}
    - opgave: |-
        Teken de volledige grafiek als $f$ oneven is.
      antwoord: |-
        hoekpunten $(-3, 1)$, $(-1, -2)$, $(0, 0)$, $(1, 2)$, $(3, -1)$
      uitwerking: |-
        Spiegel om de oorsprong: $(x, y) \mapsto (-x, -y)$. Links komen de hoekpunten $(-1, -2)$ en $(-3, 1)$.
        \figuren{\begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-2}{1}{2}
          \draw[accent,thick] (-3,1) -- (-1,-2) -- (0,0) -- (1,2) -- (3,-1);
          \vol{(-3,1)} \vol{(3,-1)}
        \end{tikzpicture}}
    - opgave: |-
        Bereken in beide gevallen $f(-1)$ en $f(-3)$.
      antwoord: |-
        even: $2$ en $-1$; oneven: $-2$ en $1$
      uitwerking: |-
        Even: $f(-1) = f(1) = 2$ en $f(-3) = f(3) = -1$. Oneven: $f(-1) = -f(1) = -2$ en $f(-3) = -f(3) = 1$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h1-domein-valkuil
  soort: kort
  opgave: |-
    Bepaal eerst het domein, en vereenvoudig daarna het voorschrift.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac{x^2 - 9}{x + 3}$
      antwoord: |-
        $\R \setminus \{-3\}$; $f(x) = x - 3$
      uitwerking: |-
        De noemer: $x + 3 \neq 0$, dus $\dom f = \R \setminus \{-3\}$. Voor $x \neq -3$ is $f(x) = \frac{(x - 3)(x + 3)}{x + 3} = x - 3$. De grafiek is de rechte $y = x - 3$ met een open bolletje in $(-3, -6)$.
    - opgave: |-
        $g(x) = \dfrac{x^2 - 2x}{x^2 - 4}$
      antwoord: |-
        $\R \setminus \{-2, 2\}$; $g(x) = \dfrac{x}{x + 2}$
      uitwerking: |-
        De noemer: $x^2 - 4 = (x - 2)(x + 2) \neq 0$, dus $\dom g = \R \setminus \{-2, 2\}$. Voor die $x$ is $g(x) = \frac{x(x - 2)}{(x - 2)(x + 2)} = \frac{x}{x + 2}$. Het vereenvoudigde voorschrift bestaat ook in $2$, maar $g$ niet.

- id: h1-bereik
  soort: kort
  opgave: |-
    Bepaal het bereik.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = x^2 - 2x + 5$
      antwoord: |-
        $\left[4, +\infty\right[$
      uitwerking: |-
        $f(x) = (x - 1)^2 + 4 \geqslant 4$. Omgekeerd: voor $y \geqslant 4$ is $x = 1 + \sqrt{y - 4}$ een oplossing van $f(x) = y$. Dus $\ber f = \left[4, +\infty\right[$.
    - opgave: |-
        $g(x) = 3 - x^2$
      antwoord: |-
        $\left]-\infty, 3\right]$
      uitwerking: |-
        $x^2 \geqslant 0$, dus $g(x) \leqslant 3$. Omgekeerd: voor $y \leqslant 3$ is $x = \sqrt{3 - y}$ een oplossing van $g(x) = y$. Dus $\ber g = \left]-\infty, 3\right]$.
    - opgave: |-
        $h(x) = 2 + \sqrt{x - 1}$
      antwoord: |-
        $\left[2, +\infty\right[$
      uitwerking: |-
        Een wortel is nooit negatief, dus $h(x) \geqslant 2$. Omgekeerd: voor $y \geqslant 2$ geeft $\sqrt{x - 1} = y - 2$ de oplossing $x = 1 + (y - 2)^2$, en die ligt in $\dom h = \left[1, +\infty\right[$. Dus $\ber h = \left[2, +\infty\right[$.

- id: h1-teken-factoren
  soort: kort
  opgave: |-
    Bepaal de nulwaarden en stel de tekentabel op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = (x + 1)(x - 2)(x - 5)$
      antwoord: |-
        \tekentabel{cccccccc}{x & & -1 & & 2 & & 5 & }{f(x) & - & 0 & + & 0 & - & 0 & +}
      uitwerking: |-
        Nulwaarden $-1$, $2$ en $5$. Eén getal per interval: $f(-2) = -28$, $f(0) = 10$, $f(3) = -8$, $f(6) = 28$.\\
        \tekentabel{cccccccc}{x & & -1 & & 2 & & 5 & }{f(x) & - & 0 & + & 0 & - & 0 & +}
    - opgave: |-
        $g(x) = (x^2 + x + 1)(3 - x)$
      antwoord: |-
        \tekentabel{cccc}{x & & 3 & }{g(x) & + & 0 & -}
      uitwerking: |-
        De factor $x^2 + x + 1$ heeft $D = 1 - 4 = -3 < 0$: geen nulwaarden, en overal positief (zoals de coëfficiënt $1$ van $x^2$). Dus $g$ heeft het teken van $3 - x$, met nulwaarde $3$.\\
        \tekentabel{cccc}{x & & 3 & }{g(x) & + & 0 & -}

- id: h1-stijgend-def
  soort: kort
  opgave: |-
    Toon aan met de definitie.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = 4 - 3x$ is dalend op $\R$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Neem $x_1 < x_2$. Dan is $f(x_2) - f(x_1) = (4 - 3x_2) - (4 - 3x_1) = -3(x_2 - x_1) < 0$, want $x_2 - x_1 > 0$. Dus $f(x_1) > f(x_2)$: $f$ is dalend.
    - opgave: |-
        $g(x) = 2 - \sqrt{x}$ is dalend op $\left[0, +\infty\right[$. Je mag voorbeeld~\ref{vb:h1-stijgend} gebruiken.
      antwoord: |-
        bewijs
      uitwerking: |-
        Neem $0 \leqslant x_1 < x_2$. Omdat $\sqrt{x}$ stijgend is, is $\sqrt{x_1} < \sqrt{x_2}$. Dan is $g(x_2) - g(x_1) = -\bigl(\sqrt{x_2} - \sqrt{x_1}\bigr) < 0$, dus $g(x_1) > g(x_2)$: $g$ is dalend.

- id: h1-absoluut
  soort: kort
  opgave: |-
    Neem $f(x) = |x - 1|$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef alle extrema als het domein $[-2, 3]$ is. Welke zijn absoluut?
      antwoord: |-
        min. $0$ in $1$ (absoluut); max. $3$ in $-2$ (absoluut); max. $2$ in $3$ (niet absoluut)
      uitwerking: |-
        $f$ daalt op $[-2, 1]$ van $3$ naar $0$ en stijgt op $[1, 3]$ van $0$ naar $2$. Minimum $f(1) = 0$, absoluut, want een absolute waarde is nooit negatief. Maximum $f(-2) = 3$ in het linkerrandpunt, absoluut. Maximum $f(3) = 2$ in het rechterrandpunt, niet absoluut, want $f(-2) = 3 > 2$.
        \figuren{\begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
          \rooster{-2}{1}{3}{0}{1}{3}
          \draw[accent,thick] (-2,3) -- (1,0) -- (3,2);
          \vol{(-2,3)} \vol{(1,0)} \vol{(3,2)}
        \end{tikzpicture}}
    - opgave: |-
        Dezelfde vraag als het domein $\left]-2, 3\right]$ is.
      antwoord: |-
        min. $0$ in $1$ (absoluut); max. $2$ in $3$ (niet absoluut); geen absoluut maximum
      uitwerking: |-
        Het minimum $f(1) = 0$ en het maximum $f(3) = 2$ blijven. Het maximum in $-2$ verdwijnt, want $-2$ hoort niet meer bij het domein. De beelden komen willekeurig dicht bij $3$ zonder het te bereiken, en ze zijn groter dan $2$ voor $x$ dicht bij $-2$. Er is dus geen absoluut maximum.

- id: h1-symm-domein
  soort: kort
  opgave: |-
    Even, oneven of geen van beide? Let op het domein, en op $f(0)$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^4$, $\dom f = [-2, 2]$
      antwoord: |-
        even
      uitwerking: |-
        Het domein is symmetrisch: met $x$ ligt ook $-x$ in $[-2, 2]$. En $f(-x) = (-x)^4 = x^4 = f(x)$.
    - opgave: |-
        $g(x) = x^3$, $\dom g = \left]-2, 2\right]$
      antwoord: |-
        geen van beide
      uitwerking: |-
        $2 \in \dom g$, maar $-2 \notin \dom g$. Het domein is niet symmetrisch, dus $g$ is even noch oneven.
    - opgave: |-
        $h(x) = x^3 + 2x + 1$
      antwoord: |-
        geen van beide
      uitwerking: |-
        $h(0) = 1 \neq 0$, dus $h$ is niet oneven. $h(1) = 4$ en $h(-1) = -2$, dus $h(-1) \neq h(1)$: niet even.

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: domein
  opgave: |-
    Bepaal het domein.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = \sqrt{2x + 5}$
      antwoord: |-
        $\left[-\frac52, +\infty\right[$
      uitwerking: |-
        $2x + 5 \geqslant 0 \iff x \geqslant -\frac52$.
    - opgave: |-
        $f(x) = \dfrac{\sqrt{x}}{x - 9}$
      antwoord: |-
        $\left[0, 9\right[ \cup \left]9, +\infty\right[$
      uitwerking: |-
        Wortel: $x \geqslant 0$. Noemer: $x \neq 9$. Samen $\left[0, 9\right[ \cup \left]9, +\infty\right[$.
    - opgave: |-
        $f(x) = \dfrac{3}{x^2 + 4}$
      antwoord: |-
        $\R$
      uitwerking: |-
        $x^2 + 4 \geqslant 4$ is nooit nul.
    - opgave: |-
        $f(x) = \sqrt{x^2 - 2x}$
      antwoord: |-
        $\left]-\infty, 0\right] \cup \left[2, +\infty\right[$
      uitwerking: |-
        $x(x - 2) \geqslant 0$: buiten de nulwaarden $0$ en $2$, en in de nulwaarden zelf.
    - opgave: |-
        $f(x) = \dfrac{1}{x^2 - 9}$
      antwoord: |-
        $\R \setminus \{-3, 3\}$
      uitwerking: |-
        $x^2 - 9 = (x - 3)(x + 3) \neq 0$, dus $x \neq 3$ en $x \neq -3$.
    - opgave: |-
        $f(x) = \sqrt{6 - 3x}$
      antwoord: |-
        $\left]-\infty, 2\right]$
      uitwerking: |-
        $6 - 3x \geqslant 0 \iff -3x \geqslant -6 \iff x \leqslant 2$ (het teken keert om).
    - opgave: |-
        $f(x) = \dfrac{x + 1}{x^2 + 2x}$
      antwoord: |-
        $\R \setminus \{-2, 0\}$
      uitwerking: |-
        $x^2 + 2x = x(x + 2) \neq 0$, dus $x \neq 0$ en $x \neq -2$. De teller speelt geen rol: $-1$ hoort bij het domein.
    - opgave: |-
        $f(x) = \dfrac{2}{\sqrt{x + 3}}$
      antwoord: |-
        $\left]-3, +\infty\right[$
      uitwerking: |-
        $x + 3 > 0$: strikt, want de wortel staat in de noemer.
    - opgave: |-
        $f(x) = \sqrt{x - 1} + \sqrt{5 - x}$
      antwoord: |-
        $[1, 5]$
      uitwerking: |-
        $x - 1 \geqslant 0$ en $5 - x \geqslant 0$, dus $x \geqslant 1$ en $x \leqslant 5$.
    - opgave: |-
        $f(x) = \dfrac{1}{|x| - 2}$
      antwoord: |-
        $\R \setminus \{-2, 2\}$
      uitwerking: |-
        $|x| - 2 = 0 \iff |x| = 2 \iff x = \pm 2$.
    - opgave: |-
        $f(x) = \sqrt[3]{x - 4}$
      antwoord: |-
        $\R$
      uitwerking: |-
        Een derdemachtswortel bestaat ook van een negatief getal, bijvoorbeeld $\sqrt[3]{-8} = -2$. Er is geen voorwaarde.
    - opgave: |-
        $f(x) = \dfrac{\sqrt{x}}{x^2 - x - 6}$
      antwoord: |-
        $\left[0, 3\right[ \cup \left]3, +\infty\right[$
      uitwerking: |-
        Wortel: $x \geqslant 0$. Noemer: $(x - 3)(x + 2) \neq 0$, dus $x \neq 3$ en $x \neq -2$. Omdat $-2$ al buiten $x \geqslant 0$ valt, blijft $\left[0, 3\right[ \cup \left]3, +\infty\right[$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    grafiek lezen
  figuur:
    opties: |-
      5.6cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.55cm,font=\scriptsize]
        \rooster{-4}{1}{5}{-2}{1}{3}
        \draw[accent,thick] (-4,-2) -- (-2,2) -- (1,-1) -- (3,3) -- (5,1);
        \vol{(-4,-2)} \open{(5,1)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef het domein en het bereik.
      antwoord: |-
        $\dom f = \left[-4, 5\right[$, $\ber f = [-2, 3]$
      uitwerking: |-
        Projecteer op de $x$-as: $\dom f = \left[-4, 5\right[$, want het bolletje in $x = 5$ is open. Projecteer op de $y$-as: het laagste punt is $(-4, -2)$, het hoogste $(3, 3)$, dus $\ber f = [-2, 3]$.
    - opgave: |-
        Geef de nulwaarden en het tekenverloop.
      antwoord: |-
        $-3$, $0$, $\frac32$; \tekentabel{cccccccc}{x & & -3 & & 0 & & \frac32 & }{f(x) & - & 0 & + & 0 & - & 0 & +}
      uitwerking: |-
        Op elk lijnstuk dat de $x$-as snijdt, een nulwaarde. Van $(-4, -2)$ naar $(-2, 2)$ stijgt de lijn 2 per eenheid: ze snijdt de as halfweg, in $-3$. Van $(-2, 2)$ naar $(1, -1)$ daalt ze 1 per eenheid: nulwaarde $0$. Van $(1, -1)$ naar $(3, 3)$ stijgt ze 2 per eenheid: nulwaarde $1 + \frac12 = \frac32$. Tekentabel op $\left[-4, 5\right[$:\\ \tekentabel{cccccccc}{x & & -3 & & 0 & & \frac32 & }{f(x) & - & 0 & + & 0 & - & 0 & +}
    - opgave: |-
        Waar stijgt $f$? Wat is de grootste en de kleinste functiewaarde?
      antwoord: |-
        stijgend op $[-4, -2]$ en $[1, 3]$; grootste $3$, kleinste $-2$
      uitwerking: |-
        Stijgend op $[-4, -2]$ en op $[1, 3]$. De grootste functiewaarde is $f(3) = 3$, de kleinste $f(-4) = -2$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    even en oneven
  opgave: |-
    Even, oneven of geen van beide?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = x^5 + x$
      antwoord: |-
        oneven
      uitwerking: |-
        $f(-x) = -x^5 - x = -f(x)$.
    - opgave: |-
        $f(x) = |x| + x^2$
      antwoord: |-
        even
      uitwerking: |-
        $|{-x}| = |x|$, dus $f(-x) = f(x)$.
    - opgave: |-
        $f(x) = \sqrt{x}$
      antwoord: |-
        geen van beide
      uitwerking: |-
        $1 \in \dom f$ maar $-1 \notin \dom f$: het domein is niet symmetrisch.
    - opgave: |-
        $f(x) = x^2 + \dfrac{1}{x^2}$
      antwoord: |-
        even
      uitwerking: |-
        Het domein $\R \setminus \{0\}$ is symmetrisch, en $(-x)^2 = x^2$, dus $f(-x) = f(x)$.
    - opgave: |-
        $f(x) = \dfrac1x - x$
      antwoord: |-
        oneven
      uitwerking: |-
        $f(-x) = -\dfrac1x + x = -\Bigl(\dfrac1x - x\Bigr) = -f(x)$.
    - opgave: |-
        $f(x) = (x + 1)^2$
      antwoord: |-
        geen van beide
      uitwerking: |-
        $f(1) = 4$ en $f(-1) = 0$: $f(-1) \neq f(1)$ en $f(-1) \neq -f(1)$.

- id: h1-o12
  soort: opdracht
  niveau: 1
  thema: |-
    functiewaarden
  opgave: |-
    Neem $f(x) = x^2 - 4x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $f(-1)$ en $f\bigl(\frac12\bigr)$.
      antwoord: |-
        $5$; $-\frac74$
      uitwerking: |-
        $f(-1) = 1 + 4 = 5$ en $f\bigl(\frac12\bigr) = \frac14 - 2 = -\frac74$.
    - opgave: |-
        Voor welke $x$ is $f(x) = 5$?
      antwoord: |-
        $x = -1$ of $x = 5$
      uitwerking: |-
        $x^2 - 4x - 5 = 0 \iff (x - 5)(x + 1) = 0$, dus $x = 5$ of $x = -1$.
    - opgave: |-
        Is $-5$ een functiewaarde van $f$?
      antwoord: |-
        nee
      uitwerking: |-
        $x^2 - 4x = -5 \iff x^2 - 4x + 5 = 0$, met discriminant $16 - 20 < 0$: geen oplossing. Ook zo: $f(x) = (x - 2)^2 - 4 \geqslant -4$.
    - opgave: |-
        Bereken en vereenvoudig $f(a + 2)$.
      antwoord: |-
        $a^2 - 4$
      uitwerking: |-
        $(a + 2)^2 - 4(a + 2) = a^2 + 4a + 4 - 4a - 8 = a^2 - 4$.

- id: h1-o10
  soort: opdracht
  niveau: 1
  thema: |-
    drill: nulwaarden
  opgave: |-
    Bepaal de nulwaarden.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = 2x - 7$
      antwoord: |-
        $\frac72$
      uitwerking: |-
        $2x - 7 = 0 \iff x = \frac72$.
    - opgave: |-
        $f(x) = x^2 - 5x$
      antwoord: |-
        $0$ en $5$
      uitwerking: |-
        $x(x - 5) = 0$.
    - opgave: |-
        $f(x) = x^2 - 2x - 15$
      antwoord: |-
        $-3$ en $5$
      uitwerking: |-
        $(x - 5)(x + 3) = 0$ (som $2$, product $-15$).
    - opgave: |-
        $f(x) = 4x^2 - 9$
      antwoord: |-
        $-\frac32$ en $\frac32$
      uitwerking: |-
        $(2x - 3)(2x + 3) = 0$.
    - opgave: |-
        $f(x) = x^3 + 2x^2 - 8x$
      antwoord: |-
        $-4$, $0$ en $2$
      uitwerking: |-
        $x(x^2 + 2x - 8) = x(x + 4)(x - 2) = 0$.
    - opgave: |-
        $f(x) = x^4 - 5x^2 + 4$
      antwoord: |-
        $-2$, $-1$, $1$ en $2$
      uitwerking: |-
        Een vergelijking in $x^2$: $(x^2 - 1)(x^2 - 4) = 0$, dus $x^2 = 1$ of $x^2 = 4$.
    - opgave: |-
        $f(x) = 2x^2 + 3$
      antwoord: |-
        geen
      uitwerking: |-
        $2x^2 + 3 \geqslant 3 > 0$ voor elke $x$.
    - opgave: |-
        $f(x) = \sqrt{x + 1} - 3$
      antwoord: |-
        $8$
      uitwerking: |-
        $\sqrt{x + 1} = 3 \iff x + 1 = 9 \iff x = 8$ (en $8 \in \dom f$).
    - opgave: |-
        $f(x) = \dfrac{x^2 - 1}{x + 1}$
      antwoord: |-
        $1$
      uitwerking: |-
        De teller is nul in $1$ en $-1$, maar $-1 \notin \dom f$ (noemer nul). Alleen $1$ is een nulwaarde.
    - opgave: |-
        $f(x) = |x - 2| - 3$
      antwoord: |-
        $-1$ en $5$
      uitwerking: |-
        $|x - 2| = 3 \iff x - 2 = 3$ of $x - 2 = -3$.
    - opgave: |-
        $f(x) = \dfrac{x - 2}{x^2 + 1}$
      antwoord: |-
        $2$
      uitwerking: |-
        Een breuk is nul als de teller nul is en de noemer niet: $x = 2$, en $x^2 + 1 \neq 0$.
    - opgave: |-
        $f(x) = \sqrt{4 - x^2}$
      antwoord: |-
        $-2$ en $2$
      uitwerking: |-
        $4 - x^2 = 0 \iff x = \pm 2$.

- id: h1-o11
  soort: opdracht
  niveau: 1
  thema: |-
    functie of niet
  opgave: |-
    Is de figuur de grafiek van een functie? Leg uit.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
          \roosterleeg{-2}{1}{2}{-2}{1}{2}
          \draw[accent,thick] (0,0) circle (1.5);
        \end{tikzpicture}}
      antwoord: |-
        nee
      uitwerking: |-
        Nee: de verticale rechte $x = 0$ snijdt de cirkel twee keer.
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
          \roosterleeg{-2}{1}{2}{-2}{1}{2}
          \draw[accent,thick] plot[domain=-2:2,samples=40,smooth] ({(\x)^2/2-1.5},\x);
        \end{tikzpicture}}
      antwoord: |-
        nee
      uitwerking: |-
        Nee: rechts van de top snijdt een verticale rechte de kromme twee keer.
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
          \roosterleeg{-2}{1}{2}{-2}{1}{2}
          \draw[accent,thick] (-2,-1) -- (0,-1) (0,1) -- (2,1);
          \open{(0,-1)} \vol{(0,1)}
        \end{tikzpicture}}
      antwoord: |-
        ja
      uitwerking: |-
        Ja: in $x = 0$ hoort alleen het volle bolletje bij de grafiek, dus elke $x$ heeft hoogstens één beeld.
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
          \roosterleeg{-2}{1}{2}{-2}{1}{2}
          \draw[accent,thick] (-2,-1) -- (0,-1) (0,1) -- (2,1);
          \vol{(0,-1)} \vol{(0,1)}
        \end{tikzpicture}}
      antwoord: |-
        nee
      uitwerking: |-
        Nee: beide bolletjes zijn vol, dus $x = 0$ zou twee beelden hebben, $-1$ en $1$.

- id: h1-o14
  soort: opdracht
  niveau: 1
  thema: |-
    tekentabel lezen
  opgave: |-
    Van een functie $f$ ken je de tekentabel:\par
    \figuren{\tekentabel{cccccccc}{x & & -3 & & 1 & & 4 & }{f(x) & + & 0 & - & | & + & 0 & -}}
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de nulwaarden van $f$. Waar bestaat $f$ niet?
      antwoord: |-
        $-3$ en $4$; in $1$
      uitwerking: |-
        Een $0$ staat onder $-3$ en $4$: dat zijn de nulwaarden. De streep onder $1$ betekent dat $f$ daar niet bestaat.
    - opgave: |-
        Los op: $f(x) > 0$.
      antwoord: |-
        $\left]-\infty, -3\right[ \cup \left]1, 4\right[$
      uitwerking: |-
        De intervallen met een $+$: $\left]-\infty, -3\right[ \cup \left]1, 4\right[$.
    - opgave: |-
        Los op: $f(x) \leqslant 0$.
      antwoord: |-
        $\left[-3, 1\right[ \cup \left[4, +\infty\right[$
      uitwerking: |-
        De intervallen met een $-$, samen met de nulwaarden, maar zonder $1$: $\left[-3, 1\right[ \cup \left[4, +\infty\right[$.
    - opgave: |-
        Ligt het punt $(5, 2)$ op de grafiek van $f$?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: voor $x > 4$ is $f(x) < 0$, dus $f(5) \neq 2$.

- id: h1-o16
  soort: opdracht
  niveau: 1
  thema: |-
    een fietsrit
  figuur:
    opties: |-
      6cm
    code: |-
      \begin{tikzpicture}[x=.18cm,y=.028cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=2,ystep=10] (0,0) grid (30,90);
        \draw[->,grijs] (0,0) -- (31.5,0) node[right,text=black] {$d$};
        \draw[->,grijs] (0,0) -- (0,96) node[above,text=black] {$h$};
        \foreach \t in {6,12,...,30}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {20,40,60,80}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \draw[accent,thick] (0,20) -- (6,50) -- (10,40) -- (18,80) -- (30,20);
        \vol{(0,20)} \vol{(30,20)}
      \end{tikzpicture}
  opgave: |-
    Een fietser rijdt een rit van 30 km. De grafiek toont de hoogte $h$ van de weg (in m) in functie van de afgelegde afstand $d$ (in km).
  lijst: enumerate
  delen:
    - opgave: |-
        Geef het domein en het bereik.
      antwoord: |-
        $[0, 30]$; $[20, 80]$
      uitwerking: |-
        De afstand loopt van $0$ tot $30$ km: $\dom h = [0, 30]$. De hoogte gaat van $20$ m tot $80$ m: $\ber h = [20, 80]$.
    - opgave: |-
        Op welke stukken van de rit klimt de fietser?
      antwoord: |-
        van 0 tot 6 km en van 10 tot 18 km
      uitwerking: |-
        Waar de grafiek stijgt: op $[0, 6]$ en op $[10, 18]$.
    - opgave: |-
        Waar ligt het hoogste punt van de rit, en hoe hoog?
      antwoord: |-
        na 18 km, 80 m
      uitwerking: |-
        Het absolute maximum: $h(18) = 80$ m.
    - opgave: |-
        Over hoeveel kilometer ligt de weg hoger dan 60 m?
      antwoord: |-
        8 km
      uitwerking: |-
        De horizontale lijn $h = 60$ snijdt de grafiek in $d = 14$ en $d = 22$ (de lijnstukken stijgen en dalen 5 m per km). Daartussen ligt de weg hoger: $22 - 14 = 8$ km.

- id: h1-o17
  soort: opdracht
  niveau: 1
  thema: |-
    symmetrie op een grafiek
  opgave: |-
    Is de functie even, oneven of geen van beide? Lees af op de grafiek.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
          \roosterleeg{-2}{1}{2}{-2}{1}{2}
          \kromme{-2}{2}{(\x)^3/2-\x}
        \end{tikzpicture}}
      antwoord: |-
        oneven
      uitwerking: |-
        Oneven: draai je de grafiek een halve slag om de oorsprong, dan valt ze op zichzelf.
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
          \roosterleeg{-2}{1}{2}{-2}{1}{2}
          \draw[accent,thick] (-2,-1) -- (-1,1) -- (0,0) -- (1,1) -- (2,-1);
        \end{tikzpicture}}
      antwoord: |-
        even
      uitwerking: |-
        Even: de grafiek is symmetrisch om de $y$-as.
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
          \roosterleeg{-2}{1}{2}{-2}{1}{2}
          \kromme{-1}{2}{(\x-.5)^2-1.2}
        \end{tikzpicture}}
      antwoord: |-
        geen van beide
      uitwerking: |-
        Geen van beide: de symmetrieas van deze parabool is niet de $y$-as, en de oorsprong is geen symmetriepunt.
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
          \roosterleeg{-2}{1}{2}{-2}{1}{2}
          \kromme{.5}{2}{1/\x} \kromme{-2}{-.5}{1/\x}
        \end{tikzpicture}}
      antwoord: |-
        oneven
      uitwerking: |-
        Oneven: de twee takken zijn elkaars beeld bij een halve draai om de oorsprong. (Het is de grafiek van $\frac1x$.)

- id: h1-o4
  soort: opdracht
  niveau: 2
  thema: |-
    tekentabel
  opgave: |-
    Stel de tekentabel op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = -x^3 + x^2 + 2x$
      antwoord: |-
        \tekentabel{cccccccc}{x & & -1 & & 0 & & 2 & }{f(x) & + & 0 & - & 0 & + & 0 & -}
      uitwerking: |-
        $f(x) = -x(x^2 - x - 2) = -x(x - 2)(x + 1)$. Nulwaarden $-1$, $0$, $2$; $f(-2) = 8$, $f(-\frac12) = -\frac58$, $f(1) = 2$, $f(3) = -12$:\\ \tekentabel{cccccccc}{x & & -1 & & 0 & & 2 & }{f(x) & + & 0 & - & 0 & + & 0 & -}
    - opgave: |-
        $g(x) = \dfrac{x^2 - 4}{x}$
      antwoord: |-
        \tekentabel{cccccccc}{x & & -2 & & 0 & & 2 & }{g(x) & - & 0 & + & | & - & 0 & +}
      uitwerking: |-
        Nulwaarden $\pm 2$, $g$ bestaat niet in $0$. $g(-3) = -\frac53$, $g(-1) = 3$, $g(1) = -3$, $g(3) = \frac53$:\\ \tekentabel{cccccccc}{x & & -2 & & 0 & & 2 & }{g(x) & - & 0 & + & | & - & 0 & +}
    - opgave: |-
        $h(x) = \dfrac{x + 3}{x^2 - 2x}$
      antwoord: |-
        \tekentabel{cccccccc}{x & & -3 & & 0 & & 2 & }{h(x) & - & 0 & + & | & - & | & +}
      uitwerking: |-
        $h(x) = \dfrac{x + 3}{x(x - 2)}$. Nulwaarde $-3$; $h$ bestaat niet in $0$ en $2$. $h(-4) = -\frac{1}{24}$, $h(-1) = \frac23$, $h(1) = -4$, $h(3) = 2$:\\ \tekentabel{cccccccc}{x & & -3 & & 0 & & 2 & }{h(x) & - & 0 & + & | & - & | & +}
    - opgave: |-
        $k(x) = \dfrac{(x - 1)^2}{4 - x^2}$
      antwoord: |-
        \tekentabel{cccccccc}{x & & -2 & & 1 & & 2 & }{k(x) & - & | & + & 0 & + & | & -}
      uitwerking: |-
        Nulwaarde $1$ (een kwadraat: geen tekenwissel); $k$ bestaat niet in $-2$ en $2$. De teller is nooit negatief, dus $k$ heeft het teken van $4 - x^2$, positief tussen $-2$ en $2$:\\ \tekentabel{cccccccc}{x & & -2 & & 1 & & 2 & }{k(x) & - & | & + & 0 & + & | & -}

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    verloop op een gesloten interval
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[x=.75cm,y=.55cm,font=\scriptsize]
        \rooster{-1}{1}{3}{-2}{1}{2}
        \kromme{-1}{3}{(\x)^3-3*(\x)^2+2}
        \vol{(-1,-2)} \vol{(3,2)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f(x) = x^3 - 3x^2 + 2$ met domein $[-1, 3]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar stijgt $f$, en waar daalt $f$?
      antwoord: |-
        stijgend op $[-1, 0]$ en $[2, 3]$, dalend op $[0, 2]$
      uitwerking: |-
        Stijgend op $[-1, 0]$ en op $[2, 3]$, dalend op $[0, 2]$.
    - opgave: |-
        Geef de grootste en de kleinste functiewaarde. Waar worden ze bereikt?
      antwoord: |-
        grootste $2$, in $0$ en $3$; kleinste $-2$, in $-1$ en $2$
      uitwerking: |-
        De top $f(0) = 2$ en het eindpunt $f(3) = 27 - 27 + 2 = 2$ liggen even hoog: het absolute maximum $2$ wordt twee keer bereikt. Zo ook het minimum $-2$: $f(-1) = -1 - 3 + 2 = -2$ en $f(2) = 8 - 12 + 2 = -2$.
    - opgave: |-
        Geef het bereik.
      antwoord: |-
        $[-2, 2]$
      uitwerking: |-
        Van de kleinste tot de grootste functiewaarde: $\ber f = [-2, 2]$.
    - opgave: |-
        Hoeveel oplossingen heeft de vergelijking $f(x) = 1$? En $f(x) = 2$?
      antwoord: |-
        drie; twee
      uitwerking: |-
        De rechte $y = 1$ snijdt elk van de drie stukken (stijgend, dalend, stijgend) één keer: drie oplossingen. De rechte $y = 2$ raakt de grafiek in de top en in het eindpunt: twee oplossingen, $0$ en $3$. Controle: $x^3 - 3x^2 = 0 \iff x^2(x - 3) = 0$.

- id: h1-o5
  soort: opdracht
  niveau: 2
  thema: |-
    bereik berekenen
  opgave: |-
    Bepaal het bereik. Tip: kwadraat afsplitsen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^2 - 6x + 10$
      antwoord: |-
        $\left[1, +\infty\right[$
      uitwerking: |-
        $f(x) = (x - 3)^2 + 1 \geqslant 1$, met gelijkheid in $x = 3$. De parabool stijgt rechts van de top onbeperkt, dus elke waarde vanaf $1$ wordt bereikt.
    - opgave: |-
        $g(x) = -2x^2 + 4x$
      antwoord: |-
        $\left]-\infty, 2\right]$
      uitwerking: |-
        $g(x) = -2(x^2 - 2x) = -2(x - 1)^2 + 2 \leqslant 2$, met gelijkheid in $x = 1$. Een bergparabool daalt onbeperkt: $\ber g = \left]-\infty, 2\right]$.
    - opgave: |-
        $h(x) = \sqrt{9 - x^2}$
      antwoord: |-
        $[0, 3]$
      uitwerking: |-
        $9 - x^2$ neemt op $[-3, 3]$ alle waarden van $0$ tot $9$ aan, de wortel dus van $0$ tot $3$. De grafiek is een halve cirkel.
    - opgave: |-
        $k(x) = \dfrac{1}{x^2 + 1}$
      antwoord: |-
        $\left]0, 1\right]$
      uitwerking: |-
        $x^2 + 1$ neemt alle waarden vanaf $1$ aan. Het omgekeerde ligt dan tussen $0$ (niet bereikt) en $1$ (in $x = 0$): $\ber k = \left]0, 1\right]$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    waar zit de fout?
  opgave: |-
    Elke uitspraak is fout. Leg uit waarom, en verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Dina: \textit{$f(x) = \dfrac{x^2 - 4}{x - 2}$ heeft de nulwaarden $2$ en $-2$.}
      antwoord: |-
        alleen $-2$
      uitwerking: |-
        In $2$ is de noemer nul, dus $2 \notin \dom f$: daar kan geen nulwaarde liggen. De enige nulwaarde is $-2$.
    - opgave: |-
        Bram: \textit{het domein van $\dfrac{\sqrt{x - 1}}{x - 3}$ is $\left[1, +\infty\right[$.}
      antwoord: |-
        $\left[1, 3\right[ \cup \left]3, +\infty\right[$
      uitwerking: |-
        Hij vergeet de noemer: $x \neq 3$. Het domein is $\left[1, 3\right[ \cup \left]3, +\infty\right[$.
    - opgave: |-
        Sam, over $f(x) = x^3 - 3x$ uit voorbeeld~\ref{vb:h1-verloop}: \textit{het maximum is $-1$.}
      antwoord: |-
        het maximum $2$ wordt bereikt in $-1$
      uitwerking: |-
        $-1$ is de plaats van het maximum, niet het maximum zelf. Het maximum is de functiewaarde $f(-1) = 2$.
    - opgave: |-
        Lotte: \textit{$f(x) = x^3 - x + 1$ is even, want $f(-1) = f(1)$.}
      antwoord: |-
        niet even: $f(-2) \neq f(2)$
      uitwerking: |-
        Wel $f(1) = 1 = f(-1)$, maar even vraagt $f(-x) = f(x)$ voor \textit{elke} $x$. Tegenvoorbeeld: $f(2) = 7$ en $f(-2) = -5$. De functie is ook niet oneven, want $f(-1) \neq -f(1)$.

- id: h1-o20
  soort: opdracht
  niveau: 2
  thema: |-
    even en oneven bewijzen
  opgave: |-
    Is de functie even, oneven of geen van beide? Toon aan, en let op het domein.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x\,|x|$
      antwoord: |-
        oneven
      uitwerking: |-
        $\dom f = \R$. $f(-x) = (-x)\,|{-x}| = -x\,|x| = -f(x)$.
    - opgave: |-
        $f(x) = \sqrt{9 - x^2}$
      antwoord: |-
        even
      uitwerking: |-
        $\dom f = [-3, 3]$ is symmetrisch, en $f(-x) = \sqrt{9 - (-x)^2} = \sqrt{9 - x^2} = f(x)$.
    - opgave: |-
        $f(x) = \dfrac{1}{x - 1} + \dfrac{1}{x + 1}$
      antwoord: |-
        oneven
      uitwerking: |-
        $\dom f = \R \setminus \{-1, 1\}$ is symmetrisch. $f(-x) = \dfrac{1}{-x - 1} + \dfrac{1}{-x + 1} = -\dfrac{1}{x + 1} - \dfrac{1}{x - 1} = -f(x)$.
    - opgave: |-
        $f(x) = \dfrac{x^2}{x - 1}$
      antwoord: |-
        geen van beide
      uitwerking: |-
        $\dom f = \R \setminus \{1\}$ is niet symmetrisch: $-1 \in \dom f$ maar $1 \notin \dom f$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    tekentabel op een grafiek
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.42cm,y=.34cm,font=\scriptsize]
        \rooster{-3}{1}{6}{-4}{1}{5}
        \draw[grijs,dashed] (2,-4) -- (2,5.3);
        \kromme{-3}{1.4}{(\x+1)/(\x-2)}
        \kromme{2.75}{6}{(\x+1)/(\x-2)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont een deel van de grafiek van $f(x) = \dfrac{x + 1}{x - 2}$. De streepjeslijn is de rechte $x = 2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees de nulwaarde af. Waar bestaat $f$ niet?
      antwoord: |-
        $-1$; in $2$
      uitwerking: |-
        De grafiek snijdt de $x$-as in $-1$. In $2$ is de noemer nul: de grafiek heeft daar twee takken, en geen punt.
    - opgave: |-
        Stel de tekentabel op met de grafiek.
      antwoord: |-
        \tekentabel{cccccc}{x & & -1 & & 2 & }{f(x) & + & 0 & - & | & +}
      uitwerking: |-
        Boven de $x$-as links van $-1$ en rechts van $2$, eronder tussen $-1$ en $2$:\\ \tekentabel{cccccc}{x & & -1 & & 2 & }{f(x) & + & 0 & - & | & +}
    - opgave: |-
        Controleer met een rij voor de teller en een rij voor de noemer.
      antwoord: |-
        hetzelfde resultaat
      uitwerking: |-
        \tekentabel{cccccc}{x & & -1 & & 2 & \\\hline x + 1 & - & 0 & + & + & + \\ x - 2 & - & - & - & 0 & +}{f(x) & + & 0 & - & | & +}

- id: h1-o26
  soort: opdracht
  niveau: 2
  thema: |-
    winst van een brouwerij
  opgave: |-
    Een kleine brouwerij brouwt per week $q$ hectoliter bier, met $0 \leqslant q \leqslant 25$. De winst (in honderd euro) is $W(q) = -2q^2 + 40q - 150$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $W(0)$. Wat betekent dat getal?
      antwoord: |-
        $-150$: een verlies van 15\,000 euro
      uitwerking: |-
        $W(0) = -150$. Zonder productie verliest de brouwerij 15\,000 euro per week: de vaste kosten.
    - opgave: |-
        Bij welke productie maakt de brouwerij winst?
      antwoord: |-
        meer dan 5 en minder dan 15 hectoliter
      uitwerking: |-
        $W(q) = -2(q^2 - 20q + 75) = -2(q - 5)(q - 15)$. Nulwaarden $5$ en $15$; een bergparabool is positief tussen de nulwaarden. Winst voor $5 < q < 15$.
    - opgave: |-
        Toon aan dat $W(q) = -2(q - 10)^2 + 50$. Wat is de grootste winst?
      antwoord: |-
        5000 euro, bij 10 hectoliter
      uitwerking: |-
        $-2(q - 10)^2 + 50 = -2(q^2 - 20q + 100) + 50 = -2q^2 + 40q - 150$. Een kwadraat is niet negatief, dus $W(q) \leqslant 50$, met gelijkheid in $q = 10$: de grootste winst is 5000 euro.
    - opgave: |-
        Geef het bereik van $W$.
      antwoord: |-
        $[-400, 50]$
      uitwerking: |-
        $W$ stijgt op $[0, 10]$ en daalt op $[10, 25]$. De kleinste waarde ligt in een eindpunt: $W(0) = -150$ en $W(25) = -2 \cdot 225 + 50 = -400$. Dus $\ber W = [-400, 50]$.

- id: h1-o6
  soort: opdracht
  niveau: 2
  thema: |-
    een grafiek ontwerpen
  opgave: |-
    Een functie heeft domein $[-3, 3]$, bereik $[-1, 4]$, nulwaarden $-2$ en $1$, en een maximum $4$ in $x = -1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schets zo'n grafiek. Is er maar één zo'n functie?
      antwoord: |-
        bijvoorbeeld de gebroken lijn door $(-3, -1)$, $(-2, 0)$, $(-1, 4)$, $(1, 0)$, $(3, -1)$; er zijn er oneindig veel
      uitwerking: |-
        Bijvoorbeeld de gebroken lijn door $(-3, -1)$, $(-2, 0)$, $(-1, 4)$, $(1, 0)$ en $(3, -1)$. Er zijn oneindig veel zulke functies: de gegevens leggen alleen enkele punten vast.
        \figuren{\begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-1}{1}{4}
          \draw[accent,thick] (-3,-1) -- (-2,0) -- (-1,4) -- (1,0) -- (3,-1);
          \vol{(-3,-1)} \vol{(3,-1)}
        \end{tikzpicture}}
    - opgave: |-
        Kan zo'n functie even zijn? En oneven?
      antwoord: |-
        geen van beide
      uitwerking: |-
        Even: dan is $f(2) = f(-2) = 0$, en zou $2$ ook een nulwaarde zijn. Oneven: dan is $f(1) = -f(-1) = -4$, maar $-4$ ligt niet in het bereik. Geen van beide kan dus.

- id: h1-o21
  soort: opdracht
  niveau: 2
  thema: |-
    aantal oplossingen aflezen
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.42cm,font=\scriptsize]
        \rooster{-2}{1}{2}{-4}{1}{4}
        \kromme{-2.2}{2.2}{(\x)^3-3*\x}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f(x) = x^3 - 3x$. Hoeveel oplossingen heeft de vergelijking $f(x) = k$?
  lijst: enumerate
  delen:
    - opgave: |-
        $k = 1$
      antwoord: |-
        drie
      uitwerking: |-
        De horizontale rechte $y = 1$ ligt tussen het minimum $-2$ en het maximum $2$: ze snijdt elk stuk (stijgend, dalend, stijgend) één keer. Drie oplossingen.
    - opgave: |-
        $k = 2$
      antwoord: |-
        twee
      uitwerking: |-
        $y = 2$ raakt de top in $x = -1$ en snijdt het laatste stijgende stuk nog eens (in $x = 2$). Twee oplossingen.
    - opgave: |-
        $k = -3$
      antwoord: |-
        één
      uitwerking: |-
        $y = -3$ ligt onder het minimum $-2$: ze snijdt alleen het eerste stijgende stuk. Eén oplossing.
    - opgave: |-
        Voor welke $k$ zijn er precies drie oplossingen?
      antwoord: |-
        $-2 < k < 2$
      uitwerking: |-
        Als de rechte $y = k$ strikt tussen het minimum en het maximum ligt: $-2 < k < 2$.

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    som en product
  opgave: |-
    Neem twee functies $f$ en $g$ met domein $\R$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs: als $f$ en $g$ oneven zijn, dan is $f + g$ oneven.
      antwoord: |-
        bewijs
      uitwerking: |-
        Neem $x \in \R$. Omdat $f$ en $g$ oneven zijn, is $f(-x) = -f(x)$ en $g(-x) = -g(x)$. Dus $(f + g)(-x) = f(-x) + g(-x) = -f(x) - g(x) = -(f + g)(x)$.
    - opgave: |-
        Bewijs: als $f$ en $g$ oneven zijn, dan is $f \cdot g$ even.
      antwoord: |-
        bewijs
      uitwerking: |-
        $(f g)(-x) = f(-x)\,g(-x) = (-f(x))(-g(x)) = f(x)\,g(x) = (f g)(x)$: twee mintekens heffen elkaar op.
    - opgave: |-
        Wat is het product van een even en een oneven functie?
      antwoord: |-
        oneven
      uitwerking: |-
        Is $f$ even en $g$ oneven, dan is $f(-x)\,g(-x) = f(x)\,(-g(x)) = -f(x)\,g(x)$: oneven. Bijvoorbeeld $x^2 \cdot x = x^3$.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    van verlooptabel naar grafiek
  opgave: |-
    Een functie $f$ met domein $[-4, 5]$ heeft deze verlooptabel. Haar grafiek is één doorlopende lijn.\par
    \figuren{\tekentabel{ccccccc}{x & -4 & & -1 & & 3 & & 5}{f(x) & 1 & \searrow & -3 & \nearrow & 2 & \searrow & 0}}
  lijst: enumerate
  delen:
    - opgave: |-
        Schets een mogelijke grafiek.
      antwoord: |-
        zie de uitgewerkte oplossingen
      uitwerking: |-
        Bijvoorbeeld de gebroken lijn door $(-4, 1)$, $(-1, -3)$, $(3, 2)$ en $(5, 0)$:
        \figuren{\begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
          \rooster{-4}{1}{5}{-3}{1}{2}
          \draw[accent,thick] (-4,1) -- (-1,-3) -- (3,2) -- (5,0);
          \vol{(-4,1)} \vol{(5,0)}
        \end{tikzpicture}}
    - opgave: |-
        Geef de grootste en de kleinste functiewaarde, en het bereik.
      antwoord: |-
        grootste $2$, kleinste $-3$; $[-3, 2]$
      uitwerking: |-
        De grootste waarde is $f(3) = 2$ (groter dan $f(-4) = 1$), de kleinste $f(-1) = -3$ (kleiner dan $f(5) = 0$). De grafiek is doorlopend, dus $\ber f = [-3, 2]$.
    - opgave: |-
        Hoeveel nulwaarden heeft $f$?
      antwoord: |-
        drie
      uitwerking: |-
        Op $[-4, -1]$ daalt $f$ van $1$ naar $-3$: één nulwaarde. Op $[-1, 3]$ stijgt $f$ van $-3$ naar $2$: één nulwaarde. Op $[3, 5]$ daalt $f$ van $2$ naar $0$: de nulwaarde $5$. Samen drie.
    - opgave: |-
        Hoeveel oplossingen heeft de vergelijking $f(x) = 1$?
      antwoord: |-
        drie
      uitwerking: |-
        $x = -4$ is er een. Op $\left]-1, 3\right[$ stijgt $f$ van $-3$ naar $2$: nog een. Op $\left]3, 5\right[$ daalt $f$ van $2$ naar $0$: nog een. Samen drie.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    stijgend en dalend met de definitie
  opgave: |-
    Gebruik de definitie van stijgend en dalend.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $f(x) = x^2$ stijgend is op $\left[0, +\infty\right[$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Neem $0 \leqslant x_1 < x_2$. Dan is $f(x_2) - f(x_1) = x_2^2 - x_1^2 = (x_2 - x_1)(x_2 + x_1)$. Beide factoren zijn positief: $x_2 - x_1 > 0$ en $x_2 + x_1 > 0$. Dus $f(x_1) < f(x_2)$.
    - opgave: |-
        Toon aan dat $g(x) = \dfrac1x$ dalend is op $\left]0, +\infty\right[$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Neem $0 < x_1 < x_2$. Dan is $g(x_1) - g(x_2) = \dfrac{1}{x_1} - \dfrac{1}{x_2} = \dfrac{x_2 - x_1}{x_1 x_2} > 0$, want teller en noemer zijn positief. Dus $g(x_1) > g(x_2)$.
    - opgave: |-
        $g$ is ook dalend op $\left]-\infty, 0\right[$. Is $g$ dalend op $\R \setminus \{0\}$?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: $-1 < 1$, maar $g(-1) = -1 < 1 = g(1)$. Dalend op twee intervallen apart betekent niet dalend op hun unie.

- id: h1-o9
  soort: opdracht
  niveau: 3
  thema: |-
    even plus oneven
  opgave: |-
    Neem een functie $f$ met domein $\R$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $g(x) = \frac12\bigl(f(x) + f(-x)\bigr)$ even is en $h(x) = \frac12\bigl(f(x) - f(-x)\bigr)$ oneven, en dat $f = g + h$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Vul $-x$ in, met $-(-x) = x$: $g(-x) = \frac12\bigl(f(-x) + f(x)\bigr) = g(x)$ en $h(-x) = \frac12\bigl(f(-x) - f(x)\bigr) = -h(x)$. Optellen: $g(x) + h(x) = \frac12 f(x) + \frac12 f(x) = f(x)$.
    - opgave: |-
        Schrijf $f(x) = x^3 + x^2 - 2x + 1$ als som van een even en een oneven functie.
      antwoord: |-
        $(x^2 + 1) + (x^3 - 2x)$
      uitwerking: |-
        $f(-x) = -x^3 + x^2 + 2x + 1$. Dan is $g(x) = \frac12\bigl(f(x) + f(-x)\bigr) = x^2 + 1$ (de even machten) en $h(x) = \frac12\bigl(f(x) - f(-x)\bigr) = x^3 - 2x$ (de oneven machten).
    - opgave: |-
        Welke functie is zowel even als oneven?
      antwoord: |-
        de nulfunctie
      uitwerking: |-
        $f(x) = f(-x) = -f(x)$ geeft $2f(x) = 0$: alleen $f(x) = 0$ (op een symmetrisch domein).

- id: h1-o8
  soort: opdracht
  niveau: 3
  thema: |-
    een doos vouwen
  figuur:
    opties: |-
      5.2cm
    code: |-
      \begin{tikzpicture}[x=.68cm,y=.0115cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=1,ystep=50] (0,0) grid (6,300);
        \draw[->,grijs] (0,0) -- (6.5,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,0) -- (0,330) node[above,text=black] {$V$};
        \foreach \t in {1,...,6}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {100,200,300}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \kromme{0}{6}{\x*(20-2*\x)*(12-2*\x)}
      \end{tikzpicture}
  opgave: |-
    Uit een rechthoekig karton van $20$ cm op $12$ cm knip je in elke hoek een vierkant met zijde $x$ cm weg. Je plooit de randen omhoog tot een doos zonder deksel.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de inhoud \mbox{$V(x) = x(20 - 2x)(12 - 2x)$} is, en bepaal het domein in deze context.
      antwoord: |-
        $\left]0, 6\right[$
      uitwerking: |-
        Het grondvlak meet $(20 - 2x)$ op $(12 - 2x)$, de hoogte is $x$. In de context moet $x > 0$ en $12 - 2x > 0$: $\dom V = \left]0, 6\right[$.
    - opgave: |-
        De functie \mbox{$x \mapsto x(20 - 2x)(12 - 2x)$} heeft als domein $\R$. Stel de tekentabel op.
      antwoord: |-
        \tekentabel{cccccccc}{x & & 0 & & 6 & & 10 & }{V(x) & - & 0 & + & 0 & - & 0 & +}
      uitwerking: |-
        Nulwaarden $0$, $6$ en $10$; de hoogstegraadsterm is $4x^3$:\\ \tekentabel{cccccccc}{x & & 0 & & 6 & & 10 & }{V(x) & - & 0 & + & 0 & - & 0 & +}
    - opgave: |-
        Lees op de grafiek af voor welke $x$ de inhoud het grootst is, en hoe groot ze dan is.
      antwoord: |-
        $x \approx 2{,}4$ cm, $V \approx 263$ cm$^3$
      uitwerking: |-
        Ongeveer $x = 2{,}4$ cm, met $V(2{,}4) = 2{,}4 \cdot 15{,}2 \cdot 7{,}2 \approx 263$ cm$^3$. (Met afgeleiden vind je later $x \approx 2{,}43$.)

- id: h1-o24
  soort: opdracht
  niveau: 3
  thema: |-
    symmetrie en verloop
  opgave: |-
    Neem een functie $f$ met domein $\R$ die stijgend is op $\left[0, +\infty\right[$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: als $f$ oneven is, dan is $f$ ook stijgend op $\left]-\infty, 0\right]$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Neem $x_1 < x_2 \leqslant 0$. Dan is $0 \leqslant -x_2 < -x_1$, dus $f(-x_2) < f(-x_1)$ omdat $f$ stijgt op $\left[0, +\infty\right[$. Omdat $f$ oneven is: $-f(x_2) < -f(x_1)$, dus $f(x_1) < f(x_2)$.
    - opgave: |-
        Wat geldt op $\left]-\infty, 0\right]$ als $f$ even is? Toon aan.
      antwoord: |-
        $f$ is dalend op $\left]-\infty, 0\right]$
      uitwerking: |-
        Neem $x_1 < x_2 \leqslant 0$. Zoals in a.\ is $f(-x_2) < f(-x_1)$. Omdat $f$ even is: $f(x_2) < f(x_1)$. Dus $f$ is dalend op $\left]-\infty, 0\right]$, zoals de parabool $x^2$.
    - opgave: |-
        Toon aan dat een oneven $f$ zoals in a.\ stijgend is op heel $\R$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Blijft over: $x_1 < 0 < x_2$. Uit $f(-0) = -f(0)$ volgt $f(0) = 0$. Stijgend op $\left]-\infty, 0\right]$ geeft $f(x_1) < f(0)$, stijgend op $\left[0, +\infty\right[$ geeft $f(0) < f(x_2)$. Dus $f(x_1) < f(x_2)$.

- id: h1-o25
  soort: opdracht
  niveau: 3
  thema: |-
    een functie ontwerpen
  opgave: |-
    Geef een voorschrift van een functie met de gevraagde eigenschappen. Controleer je antwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        Domein $\left[2, +\infty\right[$ en bereik $\left]-\infty, 3\right]$.
      antwoord: |-
        bijvoorbeeld $f(x) = 3 - \sqrt{x - 2}$
      uitwerking: |-
        Bijvoorbeeld $f(x) = 3 - \sqrt{x - 2}$. De wortel bestaat voor $x \geqslant 2$ en neemt alle waarden vanaf $0$ aan, dus $3 - \sqrt{x - 2}$ alle waarden tot en met $3$.
    - opgave: |-
        Domein $\R \setminus \{-1, 1\}$ en geen nulwaarden.
      antwoord: |-
        bijvoorbeeld $f(x) = \dfrac{1}{x^2 - 1}$
      uitwerking: |-
        Bijvoorbeeld $f(x) = \dfrac{1}{x^2 - 1}$: de noemer is nul in $\pm 1$, en de teller is nooit nul.
    - opgave: |-
        Een veeltermfunctie met deze tekentabel:\quad \tekentabel{cccccccc}{x & & -2 & & 0 & & 3 & }{f(x) & + & 0 & - & 0 & + & 0 & -}
      antwoord: |-
        bijvoorbeeld $f(x) = -x(x + 2)(x - 3)$
      uitwerking: |-
        Nulwaarden $-2$, $0$ en $3$ geven de factoren $x + 2$, $x$ en $x - 3$. Het product $x(x + 2)(x - 3)$ is positief voor grote $x$; de tabel vraagt daar een min, dus $f(x) = -x(x + 2)(x - 3)$. Controle: $f(-3) = 18$, $f(-1) = -4$, $f(1) = 6$, $f(4) = -24$.
    - opgave: |-
        Even, met domein $\R$ en bereik $\left]0, 1\right]$.
      antwoord: |-
        bijvoorbeeld $f(x) = \dfrac{1}{x^2 + 1}$
      uitwerking: |-
        Bijvoorbeeld $f(x) = \dfrac{1}{x^2 + 1}$: even omdat $(-x)^2 = x^2$, en het bereik is $\left]0, 1\right]$ (zoals bij het bereik berekenen in een eerdere opdracht).

- id: h1-o23
  soort: opdracht
  niveau: 3
  thema: |-
    som en product van stijgende functies
  opgave: |-
    Neem twee functies $f$ en $g$ die stijgend zijn op een interval $I$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat $f + g$ stijgend is op $I$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Neem $x_1 < x_2$ in $I$. Dan is $f(x_1) < f(x_2)$ en $g(x_1) < g(x_2)$. Tel op: $f(x_1) + g(x_1) < f(x_2) + g(x_2)$.
    - opgave: |-
        Is $f \cdot g$ dan ook altijd stijgend? Geef een tegenvoorbeeld.
      antwoord: |-
        nee, bv. $f(x) = g(x) = x$ op $\R$
      uitwerking: |-
        Nee. Neem $f(x) = g(x) = x$, stijgend op $\R$. Het product $x^2$ is dalend op $\left]-\infty, 0\right]$.
    - opgave: |-
        Bewijs dat $f \cdot g$ wel stijgend is als $f$ en $g$ bovendien positief zijn op $I$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Neem $x_1 < x_2$ in $I$, dus $0 < f(x_1) < f(x_2)$ en $0 < g(x_1) < g(x_2)$. Vermenigvuldigen met een positief getal behoudt de ongelijkheid: $f(x_1)\,g(x_1) < f(x_2)\,g(x_1) < f(x_2)\,g(x_2)$.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h1-koppel-1
  soort: koppel
  niveau: 1
  koppel:
    rubriek: data
    onderwerp: Statistiek
  thema: |-
    symmetrie van de normale verdeling
  opgave: |-
    Toon aan dat de dichtheidsfunctie van de standaardnormale verdeling even is:
    \[\varphi(z) = \frac{1}{\sqrt{2\pi}}\,\mathrm{e}^{-z^2/2}.\]
    Leg uit waarom daaruit volgt dat $P(Z \leqslant -1) = P(Z \geqslant 1)$.
  antwoord: |-
    $\varphi(-z) = \varphi(z)$; de oppervlakten links van $-1$ en rechts van $1$ zijn elkaars spiegelbeeld
  uitwerking: |-
    $(-z)^2 = z^2$, dus $\varphi(-z) = \varphi(z)$. De grafiek is symmetrisch ten opzichte van de verticale as, dus de oppervlakte links van $-1$ is het spiegelbeeld van die rechts van $1$.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: discreet
    onderwerp: Logica en bewijzen
  thema: |-
    stijgend met kwantoren
  opgave: |-
    Schrijf met kwantoren: \textit{$f$ is stijgend op $I$}. Schrijf daarna de ontkenning, en zeg in woorden wat ze betekent.
  antwoord: |-
    $\forall x_1, x_2 \in I \colon x_1 < x_2 \Rightarrow f(x_1) < f(x_2)$; ontkenning: $\exists x_1, x_2 \in I \colon x_1 < x_2 \wedge f(x_1) \geqslant f(x_2)$
  uitwerking: |-
    $\forall x_1, x_2 \in I \colon x_1 < x_2 \Rightarrow f(x_1) < f(x_2)$. Ontkenning: $\exists x_1, x_2 \in I \colon x_1 < x_2 \wedge f(x_1) \geqslant f(x_2)$: er zijn twee getallen in $I$ waarvoor het grootste geen groter beeld heeft.

- id: h1-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Integralen
  thema: |-
    integraal van een oneven functie
  opgave: |-
    Leg met een figuur uit waarom $\int_{-a}^{a} f(x)\,\mathrm{d}x = 0$ als $f$ oneven is. Bereken daarmee zonder rekenwerk $\int_{-2}^{2} (x^3 - 3x)\,\mathrm{d}x$.
  antwoord: |-
    $0$
  uitwerking: |-
    Door de puntsymmetrie ligt er links van de $y$-as evenveel oppervlakte onder de as als er rechts boven ligt (en omgekeerd): ze heffen elkaar op. $x^3 - 3x$ is oneven, dus de integraal is $0$.

