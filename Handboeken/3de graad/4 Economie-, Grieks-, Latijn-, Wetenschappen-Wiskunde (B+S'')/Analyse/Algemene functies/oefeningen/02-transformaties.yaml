# Oefeningen van hoofdstuk 2. Zie oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Werk uit: $-2(x + 1)^2 + 3$.
      antwoord: |-
        $-2x^2 - 4x + 1$
      uitwerking: |-
        $-2(x^2 + 2x + 1) + 3 = -2x^2 - 4x + 1$.
    - opgave: |-
        Schrijf als $(x - c)^2 + d$: $x^2 - 4x + 7$.
      antwoord: |-
        $(x - 2)^2 + 3$
      uitwerking: |-
        $x^2 - 4x + 4 + 3 = (x - 2)^2 + 3$.
    - opgave: |-
        Los op: $\sqrt{x + 3} = 2$.
      antwoord: |-
        $x = 1$
      uitwerking: |-
        $x + 3 = 4$.
    - opgave: |-
        Zet 2 buiten haakjes: $2x - 6$.
      antwoord: |-
        $2(x - 3)$
      uitwerking: |-
        $2(x - 3)$.
    - opgave: |-
        Waar ligt de top van $y = x^2 + 4$?
      antwoord: |-
        $(0, 4)$
      uitwerking: |-
        $(0, 4)$.
    - opgave: |-
        Bereken $|-3| - |2|$.
      antwoord: |-
        1
      uitwerking: |-
        $3 - 2 = 1$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Neem $f(x) = x^2$ en $g(x) = (x - 1)^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $f(x)$ en $g(x)$ voor $x = -1, 0, 1, 2, 3$.
      antwoord: |-
        $f$: 1, 0, 1, 4, 9; $g$: 4, 1, 0, 1, 4
      uitwerking: |-
        $f$: $1, 0, 1, 4, 9$. $g$: $4, 1, 0, 1, 4$.
    - opgave: |-
        Voor welke $x$ is $g(x) = f(0)$? En $g(x) = f(1)$ met $x > 1$?
      antwoord: |-
        $x = 1$; $x = 2$
      uitwerking: |-
        $g(1) = 0 = f(0)$ en $g(2) = 1 = f(1)$: wat $f$ in $x$ doet, doet $g$ in $x + 1$.
    - opgave: |-
        Ligt de grafiek van $g$ links of rechts van die van $f$? Hoe ver?
      antwoord: |-
        1 naar rechts
      uitwerking: |-
        Elke waarde komt één plaats later: de grafiek schuift 1 naar rechts, ook al staat er een min.

- id: h2-basis
  soort: kort
  opgave: |-
    Welke basisfuncties uit de tabel:
  lijst: enumerate
  delen:
    - opgave: |-
        hebben als bereik heel $\R$?
      antwoord: |-
        $x^3$
      uitwerking: |-
        Alleen $x^3$: elke waarde wordt bereikt. De andere missen negatieve getallen of $0$.
    - opgave: |-
        zijn even?
      antwoord: |-
        $x^2$ en $|x|$
      uitwerking: |-
        $x^2$ en $|x|$: hun grafiek is symmetrisch om de $y$-as.
    - opgave: |-
        hebben geen nulwaarde?
      antwoord: |-
        $\frac1x$
      uitwerking: |-
        $\frac1x$: een breuk met teller $1$ is nooit nul. De andere vier zijn nul in $x = 0$.
    - opgave: |-
        zijn dalend op $\left]0, +\infty\right[$?
      antwoord: |-
        $\frac1x$
      uitwerking: |-
        Alleen $\frac1x$. De andere vier stijgen rechts van de $y$-as.

- id: h2-verschuiven
  soort: kort
  opgave: |-
    Beschrijf de verschuiving ten opzichte van de basisfunctie, en geef het domein en het bereik.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $g(x) = (x - 4)^2 - 2$
      antwoord: |-
        4 rechts, 2 onder; $\R$; $\left[-2, +\infty\right[$
      uitwerking: |-
        $x^2$ over 4 naar rechts en 2 naar onder. $\dom g = \R$, $\ber g = \left[-2, +\infty\right[$.
    - opgave: |-
        $g(x) = \dfrac{1}{x + 2} + 1$
      antwoord: |-
        2 links, 1 boven; $\R \setminus \{-2\}$; $\R \setminus \{1\}$
      uitwerking: |-
        $\frac1x$ over 2 naar links en 1 naar boven. $\dom g = \R \setminus \{-2\}$, $\ber g = \R \setminus \{1\}$.
    - opgave: |-
        $g(x) = \sqrt{x - 1} + 5$
      antwoord: |-
        1 rechts, 5 boven; $\left[1, +\infty\right[$; $\left[5, +\infty\right[$
      uitwerking: |-
        $\sqrt{x}$ over 1 naar rechts en 5 naar boven. $\dom g = \left[1, +\infty\right[$, $\ber g = \left[5, +\infty\right[$.

- id: h2-verschuiven-grafiek
  soort: kort
  opgave: |-
    De grafiek ontstaat door een basisfunctie te verschuiven. Geef het voorschrift.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-1}{1}{4}{-2}{1}{2}
          \draw[accent,thick] (-1,2) -- (2,-1) -- (4,1);
          \vol{(2,-1)}
        \end{tikzpicture}}
      antwoord: |-
        $y = |x - 2| - 1$
      uitwerking: |-
        Een V-vorm: de grafiek van $|x|$. De knik $(0, 0)$ is verschoven naar $(2, -1)$: 2 naar rechts en 1 naar onder. Dus $y = |x - 2| - 1$. Controle: in $x = 4$ is $y = 2 - 1 = 1$.
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-3}{1}{1}{-1}{1}{4}
          \kromme{-2.3}{.3}{(\x+1)^3+2}
          \vol{(-1,2)}
        \end{tikzpicture}}
      antwoord: |-
        $y = (x + 1)^3 + 2$
      uitwerking: |-
        De vorm van $x^3$, met het symmetriepunt $(0, 0)$ verschoven naar $(-1, 2)$: 1 naar links en 2 naar boven. Dus $y = (x + 1)^3 + 2$. Controle: in $x = 0$ is $y = 1 + 2 = 3$.

- id: h2-rekken
  soort: kort
  opgave: |-
    De grafiek van $f$ is de gebroken lijn uit voorbeeld~\ref{vb:h2-rekken}, door $(-2, 0)$, $(0, 2)$, $(2, 0)$ en $(4, -2)$. Geef de hoekpunten van de grafiek van:
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $-f(x)$
      antwoord: |-
        $(-2, 0)$, $(0, -2)$, $(2, 0)$, $(4, 2)$
      uitwerking: |-
        $(x, y) \mapsto (x, -y)$: $(-2, 0)$, $(0, -2)$, $(2, 0)$, $(4, 2)$.
    - opgave: |-
        $f(-x)$
      antwoord: |-
        $(2, 0)$, $(0, 2)$, $(-2, 0)$, $(-4, -2)$
      uitwerking: |-
        $(x, y) \mapsto (-x, y)$: $(2, 0)$, $(0, 2)$, $(-2, 0)$, $(-4, -2)$.
    - opgave: |-
        $f\bigl(\frac{x}{2}\bigr)$
      antwoord: |-
        $(-4, 0)$, $(0, 2)$, $(4, 0)$, $(8, -2)$
      uitwerking: |-
        $b = \frac12$, dus horizontaal $\times 2$: $(-4, 0)$, $(0, 2)$, $(4, 0)$, $(8, -2)$.

- id: h2-spiegelen
  soort: kort
  opgave: |-
    Spiegelen en uitrekken.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef het voorschrift van het spiegelbeeld van $y = (x - 3)^2$ om de $y$-as. Waar ligt de top?
      antwoord: |-
        $y = (x + 3)^2$; $(-3, 0)$
      uitwerking: |-
        Vervang $x$ door $-x$: $y = (-x - 3)^2 = (x + 3)^2$. De top $(3, 0)$ gaat naar $(-3, 0)$.
    - opgave: |-
        Spiegel de grafiek van $y = \sqrt{x - 1}$ om de $x$-as. Geef het voorschrift, het domein en het bereik.
      antwoord: |-
        $y = -\sqrt{x - 1}$; $\left[1, +\infty\right[$; $\left]-\infty, 0\right]$
      uitwerking: |-
        $y = -\sqrt{x - 1}$. Het domein blijft $\left[1, +\infty\right[$; het bereik $\left[0, +\infty\right[$ wordt $\left]-\infty, 0\right]$.
    - opgave: |-
        Toon aan dat $|3x| = 3|x|$. Welke twee transformaties van de grafiek van $|x|$ geven dus hetzelfde resultaat?
      antwoord: |-
        horizontaal $\times \frac13$ en verticaal $\times 3$
      uitwerking: |-
        $|3x| = |3| \cdot |x| = 3|x|$. De grafiek van $|3x|$ is die van $|x|$, horizontaal uitgerekt met factor $\frac13$; die van $3|x|$ is ze verticaal uitgerekt met factor $3$. Ze vallen samen.

- id: h2-combineren-schets
  soort: kort
  opgave: |-
    Schets vanuit een basisfunctie, met een bijzonder punt. Geef het domein en het bereik.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $g(x) = -(x - 1)^2 + 4$
      antwoord: |-
        top $(1, 4)$; $\R$; $\left]-\infty, 4\right]$
      uitwerking: |-
        $x^2$: 1 naar rechts, spiegelen om de $x$-as, 4 naar boven. Top $(0, 0) \mapsto (1, 4)$. $\dom g = \R$, $\ber g = \left]-\infty, 4\right]$.
        \figuren{\begin{tikzpicture}[x=.4cm,y=.4cm,font=\scriptsize]
          \rooster{-2}{1}{4}{-1}{1}{4}
          \kromme{-1.2}{3.2}{-(\x-1)^2+4}
          \vol{(1,4)}
        \end{tikzpicture}}
    - opgave: |-
        $h(x) = \dfrac{2}{x + 1} - 1$
      antwoord: |-
        centrum $(-1, -1)$; $\R \setminus \{-1\}$; $\R \setminus \{-1\}$
      uitwerking: |-
        $\frac1x$: 1 naar links, verticaal $\times 2$, 1 naar onder. De asymptoten $x = 0$ en $y = 0$ gaan naar $x = -1$ en $y = -1$. Controle: $h(0) = 1$. $\dom h = \R \setminus \{-1\}$, $\ber h = \R \setminus \{-1\}$.
        \figuren{\begin{tikzpicture}[x=.4cm,y=.4cm,font=\scriptsize]
          \rooster{-4}{1}{2}{-4}{1}{2}
          \draw[grijs,dashed] (-1,-4) -- (-1,2.3) (-4,-1) -- (2.3,-1);
          \kromme{-.33}{2}{2/(\x+1)-1} \kromme{-4}{-1.67}{2/(\x+1)-1}
          \vol{(0,1)}
        \end{tikzpicture}}

- id: h2-combineren
  soort: kort
  opgave: |-
    Beschrijf de transformaties vanuit een basisfunctie, en geef het domein en het bereik.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $g(x) = 2|x - 3| - 1$
      antwoord: |-
        $\R$; $\left[-1, +\infty\right[$
      uitwerking: |-
        $|x|$: 3 naar rechts, verticaal $\times 2$, 1 naar onder. Knik in $(3, -1)$. $\dom g = \R$, $\ber g = \left[-1, +\infty\right[$.
    - opgave: |-
        $h(x) = \sqrt{4 - 2x}$
      antwoord: |-
        $\left]-\infty, 2\right]$; $\left[0, +\infty\right[$
      uitwerking: |-
        $\sqrt{-2(x - 2)}$: $\sqrt{x}$ horizontaal $\times \frac12$ en gespiegeld om de $y$-as, dan 2 naar rechts. Beginpunt $(2, 0)$. $\dom h = \left]-\infty, 2\right]$, $\ber h = \left[0, +\infty\right[$.

- id: h2-voorschrift-kort
  soort: kort
  opgave: |-
    Geef het voorschrift.
  lijst: enumerate
  delen:
    - opgave: |-
        Een parabool met top $(2, 3)$ gaat door $(0, -1)$.
      antwoord: |-
        $y = -(x - 2)^2 + 3$
      uitwerking: |-
        $y = a(x - 2)^2 + 3$. Vul $(0, -1)$ in: $-1 = 4a + 3$, dus $a = -1$.
    - opgave: |-
        De grafiek van $\sqrt{x}$ is verschoven en verticaal uitgerekt. Het beginpunt is $(-1, 2)$, en de grafiek gaat door $(3, 6)$.
      antwoord: |-
        $y = 2\sqrt{x + 1} + 2$
      uitwerking: |-
        $y = a\sqrt{x + 1} + 2$. Vul $(3, 6)$ in: $6 = a \cdot 2 + 2$, dus $a = 2$.
    - opgave: |-
        De grafiek van $|x|$ is verschoven en verticaal uitgerekt. De knik ligt in $(1, -2)$, en de grafiek gaat door $(3, 4)$.
      antwoord: |-
        $y = 3|x - 1| - 2$
      uitwerking: |-
        $y = a|x - 1| - 2$. Vul $(3, 4)$ in: $4 = 2a - 2$, dus $a = 3$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h2-vert-kort
  soort: kort
  opgave: |-
    Geef een bijzonder punt, het domein en het bereik.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $g(x) = x^2 + 3$
      antwoord: |-
        top $(0, 3)$; $\R$; $\left[3, +\infty\right[$
      uitwerking: |-
        $x^2$ over 3 naar boven: de top $(0, 0)$ gaat naar $(0, 3)$. $\dom g = \R$, $\ber g = \left[3, +\infty\right[$.
    - opgave: |-
        $g(x) = \sqrt{x} - 1$
      antwoord: |-
        beginpunt $(0, -1)$; $\left[0, +\infty\right[$; $\left[-1, +\infty\right[$
      uitwerking: |-
        $\sqrt{x}$ over 1 naar onder: het beginpunt $(0, 0)$ gaat naar $(0, -1)$. Het domein blijft $\left[0, +\infty\right[$, het bereik wordt $\left[-1, +\infty\right[$.
    - opgave: |-
        $g(x) = \dfrac1x + 2$
      antwoord: |-
        $(1, 3)$; $\R \setminus \{0\}$; $\R \setminus \{2\}$
      uitwerking: |-
        $\frac1x$ over 2 naar boven: $(1, 1)$ gaat naar $(1, 3)$. Het domein blijft $\R \setminus \{0\}$. De waarde $0$ wordt door $\frac1x$ niet bereikt, dus $2$ niet door $g$: $\ber g = \R \setminus \{2\}$.

- id: h2-hor-kort
  soort: kort
  opgave: |-
    Geef een bijzonder punt, het domein en het bereik.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $g(x) = (x + 4)^2$
      antwoord: |-
        top $(-4, 0)$; $\R$; $\left[0, +\infty\right[$
      uitwerking: |-
        $x + 4 = x - (-4)$: $x^2$ over 4 naar links. De top gaat naar $(-4, 0)$. $\dom g = \R$, $\ber g = \left[0, +\infty\right[$.
    - opgave: |-
        $g(x) = \sqrt{x - 3}$
      antwoord: |-
        beginpunt $(3, 0)$; $\left[3, +\infty\right[$; $\left[0, +\infty\right[$
      uitwerking: |-
        $\sqrt{x}$ over 3 naar rechts. Het beginpunt gaat naar $(3, 0)$, het domein naar $\left[3, +\infty\right[$. Het bereik blijft $\left[0, +\infty\right[$.
    - opgave: |-
        $g(x) = \dfrac{1}{x + 2}$
      antwoord: |-
        $(-1, 1)$; $\R \setminus \{-2\}$; $\R \setminus \{0\}$
      uitwerking: |-
        $\frac1x$ over 2 naar links: $(1, 1)$ gaat naar $(-1, 1)$, en $g$ bestaat niet in $-2$. $\dom g = \R \setminus \{-2\}$, $\ber g = \R \setminus \{0\}$.

- id: h2-vertrekken-kort
  soort: kort
  opgave: |-
    Het punt $(2, 3)$ ligt op de grafiek van $f$, en $5$ is een nulwaarde van $f$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk punt ligt zeker op de grafiek van $4f(x)$? En op die van $\frac13 f(x)$?
      antwoord: |-
        $(2, 12)$; $(2, 1)$
      uitwerking: |-
        Verticaal uitrekken: $(x, y) \mapsto (x, ay)$. Met $a = 4$ wordt $(2, 3)$ het punt $(2, 12)$, met $a = \frac13$ het punt $(2, 1)$.
    - opgave: |-
        Geef een nulwaarde van $2f(x)$.
      antwoord: |-
        $5$
      uitwerking: |-
        $2f(5) = 2 \cdot 0 = 0$: een punt op de $x$-as blijft liggen bij verticaal uitrekken.

- id: h2-horrekken-kort
  soort: kort
  opgave: |-
    Een functie $f$ heeft domein $[-8, 4]$ en de nulwaarden $-6$ en $3$. Geef het domein en de nulwaarden van:
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(3x)$
      antwoord: |-
        $\left[-\frac83, \frac43\right]$; $-2$ en $1$
      uitwerking: |-
        $b = 3$: alle $x$-coördinaten gedeeld door $3$. Domein $\left[-\frac83, \frac43\right]$, nulwaarden $-2$ en $1$. Controle: $f(3 \cdot 1) = f(3) = 0$.
    - opgave: |-
        $f\bigl(\frac12 x\bigr)$
      antwoord: |-
        $[-16, 8]$; $-12$ en $6$
      uitwerking: |-
        $b = \frac12$: alle $x$-coördinaten gedeeld door $\frac12$, dus maal $2$. Domein $[-16, 8]$, nulwaarden $-12$ en $6$. Controle: $f\bigl(\frac12 \cdot 6\bigr) = f(3) = 0$.

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: transformatie herkennen
  opgave: |-
    Uit welke basisfunctie ontstaat de grafiek van $g$, en hoe?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $g(x) = (x + 4)^3$
      antwoord: |-
        $x^3$, 4 naar links
      uitwerking: |-
        $x^3$, over 4 naar links: $x + 4 = x - (-4)$.
    - opgave: |-
        $g(x) = \dfrac1x + 2$
      antwoord: |-
        $\frac1x$, 2 naar boven
      uitwerking: |-
        $\frac1x$, over 2 naar boven.
    - opgave: |-
        $g(x) = |x - 1| - 3$
      antwoord: |-
        $|x|$, 1 naar rechts, 3 naar onder
      uitwerking: |-
        $|x|$, over 1 naar rechts en 3 naar onder.
    - opgave: |-
        $g(x) = -x^2 + 5$
      antwoord: |-
        $x^2$, spiegelen om de $x$-as, 5 naar boven
      uitwerking: |-
        $x^2$, gespiegeld om de $x$-as en 5 naar boven.
    - opgave: |-
        $g(x) = \sqrt{x + 3} - 1$
      antwoord: |-
        $\sqrt{x}$, 3 naar links, 1 naar onder
      uitwerking: |-
        $\sqrt{x}$, over 3 naar links en 1 naar onder.
    - opgave: |-
        $g(x) = 2|x|$
      antwoord: |-
        $|x|$, verticaal $\times 2$
      uitwerking: |-
        $|x|$, verticaal uitgerekt met factor $2$.
    - opgave: |-
        $g(x) = (3x)^2$
      antwoord: |-
        $x^2$, horizontaal $\times \frac13$
      uitwerking: |-
        $x^2$, horizontaal uitgerekt met factor $\frac13$ (dus smaller).
    - opgave: |-
        $g(x) = \sqrt{-x}$
      antwoord: |-
        $\sqrt{x}$, spiegelen om de $y$-as
      uitwerking: |-
        $\sqrt{x}$, gespiegeld om de $y$-as: $x$ is vervangen door $-x$.

- id: h2-o10
  soort: opdracht
  niveau: 1
  thema: |-
    drill: een punt transformeren
  opgave: |-
    Het punt $(2, 3)$ ligt op de grafiek van $f$. Welk punt ligt zeker op de grafiek van:
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $f(x) + 4$
      antwoord: |-
        $(2, 7)$
      uitwerking: |-
        $(x, y) \mapsto (x, y + 4)$: $(2, 7)$.
    - opgave: |-
        $f(x - 1)$
      antwoord: |-
        $(3, 3)$
      uitwerking: |-
        1 naar rechts: $(3, 3)$, want $f(3 - 1) = f(2) = 3$.
    - opgave: |-
        $f(x + 5)$
      antwoord: |-
        $(-3, 3)$
      uitwerking: |-
        5 naar links: $(-3, 3)$.
    - opgave: |-
        $3f(x)$
      antwoord: |-
        $(2, 9)$
      uitwerking: |-
        $(x, y) \mapsto (x, 3y)$: $(2, 9)$.
    - opgave: |-
        $f(2x)$
      antwoord: |-
        $(1, 3)$
      uitwerking: |-
        Horizontaal $\times \frac12$: $(1, 3)$, want $f(2 \cdot 1) = f(2)$.
    - opgave: |-
        $-f(x)$
      antwoord: |-
        $(2, -3)$
      uitwerking: |-
        Spiegelen om de $x$-as: $(2, -3)$.
    - opgave: |-
        $f(-x)$
      antwoord: |-
        $(-2, 3)$
      uitwerking: |-
        Spiegelen om de $y$-as: $(-2, 3)$.
    - opgave: |-
        $f\bigl(\frac{x}{2}\bigr)$
      antwoord: |-
        $(4, 3)$
      uitwerking: |-
        Horizontaal $\times 2$: $(4, 3)$, want $f\bigl(\frac42\bigr) = f(2)$.
    - opgave: |-
        $f(x - 1) + 2$
      antwoord: |-
        $(3, 5)$
      uitwerking: |-
        1 naar rechts en 2 naar boven: $(3, 5)$.
    - opgave: |-
        $-f(x) + 1$
      antwoord: |-
        $(2, -2)$
      uitwerking: |-
        Eerst spiegelen, dan 1 naar boven: $(2, -3 + 1) = (2, -2)$.
    - opgave: |-
        $f(-x) - 3$
      antwoord: |-
        $(-2, 0)$
      uitwerking: |-
        Spiegelen om de $y$-as en 3 naar onder: $(-2, 0)$.
    - opgave: |-
        $2f(x + 1)$
      antwoord: |-
        $(1, 6)$
      uitwerking: |-
        1 naar links en verticaal $\times 2$: $(1, 6)$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    voorschrift opstellen
  opgave: |-
    Geef het voorschrift van de functie waarvan de grafiek ontstaat door:
  lijst: enumerate
  delen:
    - opgave: |-
        de grafiek van $\sqrt{x}$ 2 naar links en 3 naar boven te schuiven;
      antwoord: |-
        $\sqrt{x + 2} + 3$
      uitwerking: |-
        Naar links: $x$ wordt $x + 2$. Naar boven: $+3$. Dus $\sqrt{x + 2} + 3$.
    - opgave: |-
        de grafiek van $\frac1x$ te spiegelen om de $x$-as en 1 naar rechts te schuiven;
      antwoord: |-
        $-\dfrac{1}{x - 1}$
      uitwerking: |-
        Spiegelen: $-\frac1x$. Naar rechts: $x$ wordt $x - 1$. Dus $-\dfrac{1}{x - 1}$.
    - opgave: |-
        de grafiek van $x^2$ verticaal uit te rekken met factor 3 en 4 naar onder te schuiven;
      antwoord: |-
        $3x^2 - 4$
      uitwerking: |-
        $3x^2 - 4$.
    - opgave: |-
        de grafiek van $|x|$ horizontaal uit te rekken met factor 2 en 1 naar boven te schuiven;
      antwoord: |-
        $\bigl|\frac{x}{2}\bigr| + 1$
      uitwerking: |-
        Horizontaal $\times 2$: $x$ wordt $\frac{x}{2}$, dus $\bigl|\frac{x}{2}\bigr| + 1$ (wat ook $\frac12|x| + 1$ is).
    - opgave: |-
        de grafiek van $x^3$ te spiegelen om de $y$-as en daarna 2 naar rechts te schuiven.
      antwoord: |-
        $(2 - x)^3$
      uitwerking: |-
        Spiegelen: $(-x)^3$. Daarna naar rechts: vervang $x$ door $x - 2$, dus $\bigl(-(x - 2)\bigr)^3 = (2 - x)^3$. Controle: het symmetriepunt $(0, 0)$ gaat naar $(2, 0)$.

- id: h2-o11
  soort: opdracht
  niveau: 1
  thema: |-
    parabolen herkennen
  opgave: |-
    Welke grafiek hoort bij welk voorschrift?\par
    \figuren{%
    \begin{tikzpicture}[x=.28cm,y=.4cm,font=\scriptsize]
      \rooster{-4}{2}{4}{-2}{1}{2}
      \kromme{-3.73}{-.27}{(\x+2)^2-1}
      \node[text=black] at (-3.5,-2.6) {\textbf{A}};
    \end{tikzpicture}\hspace{4mm}
    \begin{tikzpicture}[x=.28cm,y=.4cm,font=\scriptsize]
      \rooster{-4}{2}{4}{-2}{1}{2}
      \kromme{.27}{3.73}{-(\x-2)^2+1}
      \node[text=black] at (-3.5,-2.6) {\textbf{B}};
    \end{tikzpicture}\hspace{4mm}
    \begin{tikzpicture}[x=.28cm,y=.4cm,font=\scriptsize]
      \rooster{-4}{2}{4}{-2}{1}{2}
      \kromme{.27}{3.73}{(\x-2)^2-1}
      \node[text=black] at (-3.5,-2.6) {\textbf{C}};
    \end{tikzpicture}\hspace{4mm}
    \begin{tikzpicture}[x=.28cm,y=.4cm,font=\scriptsize]
      \rooster{-4}{2}{4}{-2}{1}{2}
      \kromme{-3.73}{-.27}{-(\x+2)^2+1}
      \node[text=black] at (-3.5,-2.6) {\textbf{D}};
    \end{tikzpicture}}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = (x - 2)^2 - 1$
      antwoord: |-
        C
      uitwerking: |-
        Dalparabool met top $(2, -1)$: C.
    - opgave: |-
        $y = -(x + 2)^2 + 1$
      antwoord: |-
        D
      uitwerking: |-
        Bergparabool met top $(-2, 1)$: D.
    - opgave: |-
        $y = (x + 2)^2 - 1$
      antwoord: |-
        A
      uitwerking: |-
        Dalparabool met top $(-2, -1)$: A.
    - opgave: |-
        $y = -(x - 2)^2 + 1$
      antwoord: |-
        B
      uitwerking: |-
        Bergparabool met top $(2, 1)$: B.

- id: h2-o12
  soort: opdracht
  niveau: 1
  thema: |-
    schetsen
  opgave: |-
    Schets de grafiek op een rooster. Duid een bijzonder punt aan.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $y = \sqrt{x - 2}$
      antwoord: |-
        beginpunt $(2, 0)$
    - opgave: |-
        $y = (x + 1)^3$
      antwoord: |-
        symmetriepunt $(-1, 0)$
    - opgave: |-
        $y = \dfrac1x - 2$
      antwoord: |-
        asymptoten $x = 0$, $y = -2$
    - opgave: |-
        $y = -|x| + 3$
      antwoord: |-
        knik $(0, 3)$
  uitwerking: |-
    \textbf{a.}~$\sqrt{x}$ 2 naar rechts. \quad \textbf{b.}~$x^3$ 1 naar links. \quad \textbf{c.}~$\frac1x$ 2 naar onder. \quad \textbf{d.}~$|x|$ gespiegeld om de $x$-as, 3 naar boven.
    \figuren{%
    \begin{tikzpicture}[x=.32cm,y=.32cm,font=\scriptsize]
      \rooster{-1}{1}{6}{-1}{1}{3}
      \kromme{2}{6}{sqrt(\x-2)} \vol{(2,0)}
      \node[text=black] at (5,-1.8) {\textbf{a}};
    \end{tikzpicture}\hspace{3mm}
    \begin{tikzpicture}[x=.32cm,y=.32cm,font=\scriptsize]
      \rooster{-3}{1}{1}{-3}{1}{3}
      \kromme{-2.44}{.44}{(\x+1)^3} \vol{(-1,0)}
      \node[text=black] at (1,-3.8) {\textbf{b}};
    \end{tikzpicture}\hspace{3mm}
    \begin{tikzpicture}[x=.32cm,y=.32cm,font=\scriptsize]
      \rooster{-3}{1}{3}{-4}{1}{2}
      \draw[grijs,dashed] (-3,-2) -- (3.3,-2);
      \kromme{.25}{3}{1/\x-2} \kromme{-3}{-.5}{1/\x-2}
      \node[text=black] at (3,-4.8) {\textbf{c}};
    \end{tikzpicture}\hspace{3mm}
    \begin{tikzpicture}[x=.32cm,y=.32cm,font=\scriptsize]
      \rooster{-3}{1}{3}{-1}{1}{3}
      \draw[accent,thick] (-3,0) -- (0,3) -- (3,0); \vol{(0,3)}
      \node[text=black] at (3,-1.8) {\textbf{d}};
    \end{tikzpicture}}

- id: h2-o13
  soort: opdracht
  niveau: 1
  thema: |-
    voorschrift na een transformatie
  opgave: |-
    Neem $f(x) = x^2 - 2x$. Geef het voorschrift van $g$ en werk het uit, als de grafiek van $g$ ontstaat uit die van $f$ door:
  lijst: enumerate
  delen:
    - opgave: |-
        3 naar rechts te schuiven;
      antwoord: |-
        $g(x) = x^2 - 8x + 15$
      uitwerking: |-
        $g(x) = f(x - 3) = (x - 3)^2 - 2(x - 3) = x^2 - 6x + 9 - 2x + 6 = x^2 - 8x + 15$.
    - opgave: |-
        te spiegelen om de $y$-as;
      antwoord: |-
        $g(x) = x^2 + 2x$
      uitwerking: |-
        $g(x) = f(-x) = (-x)^2 - 2(-x) = x^2 + 2x$.
    - opgave: |-
        verticaal uit te rekken met factor 2 en daarna 1 naar onder te schuiven;
      antwoord: |-
        $g(x) = 2x^2 - 4x - 1$
      uitwerking: |-
        $g(x) = 2f(x) - 1 = 2x^2 - 4x - 1$.
    - opgave: |-
        horizontaal uit te rekken met factor 2.
      antwoord: |-
        $g(x) = \frac14x^2 - x$
      uitwerking: |-
        $g(x) = f\bigl(\frac{x}{2}\bigr) = \frac{x^2}{4} - 2 \cdot \frac{x}{2} = \frac14x^2 - x$.

- id: h2-o14
  soort: opdracht
  niveau: 1
  thema: |-
    domein en bereik na een transformatie
  opgave: |-
    Een functie $f$ heeft domein $[-2, 4]$ en bereik $[1, 5]$. Geef het domein en het bereik van:
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x - 3)$
      antwoord: |-
        $[1, 7]$; $[1, 5]$
      uitwerking: |-
        3 naar rechts: het domein schuift mee, het bereik niet.
    - opgave: |-
        $f(x) + 2$
      antwoord: |-
        $[-2, 4]$; $[3, 7]$
      uitwerking: |-
        2 naar boven: het bereik schuift mee, het domein niet.
    - opgave: |-
        $-f(x)$
      antwoord: |-
        $[-2, 4]$; $[-5, -1]$
      uitwerking: |-
        Elke $y$ wordt $-y$: het bereik wordt $[-5, -1]$.
    - opgave: |-
        $f(-x)$
      antwoord: |-
        $[-4, 2]$; $[1, 5]$
      uitwerking: |-
        Elke $x$ wordt $-x$: het domein wordt $[-4, 2]$.
    - opgave: |-
        $2f(x)$
      antwoord: |-
        $[-2, 4]$; $[2, 10]$
      uitwerking: |-
        Elke $y$ wordt $2y$: het bereik wordt $[2, 10]$.
    - opgave: |-
        $f(2x)$
      antwoord: |-
        $[-1, 2]$; $[1, 5]$
      uitwerking: |-
        $f(2x)$ bestaat als $-2 \leqslant 2x \leqslant 4$, dus $-1 \leqslant x \leqslant 2$. Het bereik blijft.

- id: h2-o16
  soort: opdracht
  niveau: 1
  thema: |-
    bezoekers in een zwembad
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.36cm,y=.0095cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=1,ystep=50] (8,0) grid (20,320);
        \draw[->,grijs] (8,0) -- (20.8,0) node[right,text=black] {$t$};
        \draw[->,grijs] (8,0) -- (8,350) node[above,text=black] {$B$};
        \foreach \t in {10,12,...,20}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {100,200,300}{\node[left,inner sep=1.5pt] at (8,\t) {$\t$};}
        \kromme{9}{19}{300-12*(\x-14)^2}
        \vol{(14,300)}
      \end{tikzpicture}
  opgave: |-
    Een zwembad is open van 9 tot 19 uur. Op een gewone dag is het aantal bezoekers $t$ uur na middernacht $B(t) = 300 - 12(t - 14)^2$, met het drukste moment om 14 uur.
  lijst: enumerate
  delen:
    - opgave: |-
        Op zaterdag zijn er op elk moment 50 bezoekers meer. Geef het voorschrift met $B$, en het drukste moment.
      antwoord: |-
        $B(t) + 50$; om 14 uur, 350 bezoekers
      uitwerking: |-
        $Z(t) = B(t) + 50$: de grafiek schuift 50 naar boven. De top $(14, 300)$ wordt $(14, 350)$.
    - opgave: |-
        Op zondag opent en sluit het zwembad 2 uur later, en verloopt alles 2 uur later. Geef het voorschrift met $B$, en het domein.
      antwoord: |-
        $B(t - 2)$; $[11, 21]$
      uitwerking: |-
        Wat op een gewone dag om $t - 2$ uur gebeurt, gebeurt nu om $t$ uur: $S(t) = B(t - 2)$. De grafiek schuift 2 naar rechts, het domein wordt $[11, 21]$ en de top $(16, 300)$.
    - opgave: |-
        Tijdens een hittegolf zijn er op elk moment twee keer zoveel bezoekers. Geef het voorschrift met $B$, en het drukste moment.
      antwoord: |-
        $2B(t)$; om 14 uur, 600 bezoekers
      uitwerking: |-
        $H(t) = 2B(t)$: verticaal $\times 2$. De top $(14, 300)$ wordt $(14, 600)$.
    - opgave: |-
        Bereken $B(10)$. Hoeveel bezoekers zijn er op zondag om 12 uur?
      antwoord: |-
        108; 108
      uitwerking: |-
        $B(10) = 300 - 12 \cdot 16 = 108$. Op zondag om 12 uur: $B(12 - 2) = B(10) = 108$.

- id: h2-o3
  soort: opdracht
  niveau: 2
  thema: |-
    punten transformeren
  figuur:
    opties: |-
      4.8cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.55cm,font=\scriptsize]
        \rooster{-3}{1}{3}{-1}{1}{2}
        \draw[accent,thick] (-3,-1) -- (-1,2) -- (2,2) -- (3,0);
        \vol{(-3,-1)} \vol{(3,0)}
      \end{tikzpicture}
  opgave: |-
    De grafiek van $f$ is de gebroken lijn hiernaast, van $(-3, -1)$ over $(-1, 2)$ en $(2, 2)$ tot $(3, 0)$. Geef de hoekpunten, het domein en het bereik van:
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x - 1) + 2$
      antwoord: |-
        $(-2, 1)$, $(0, 4)$, $(3, 4)$, $(4, 2)$; $[-2, 4]$; $[1, 4]$
      uitwerking: |-
        $(x, y) \mapsto (x + 1, y + 2)$: $(-2, 1)$, $(0, 4)$, $(3, 4)$, $(4, 2)$. Domein $[-2, 4]$, bereik $[1, 4]$.
    - opgave: |-
        $-f(x)$
      antwoord: |-
        $(-3, 1)$, $(-1, -2)$, $(2, -2)$, $(3, 0)$; $[-3, 3]$; $[-2, 1]$
      uitwerking: |-
        $(x, y) \mapsto (x, -y)$: $(-3, 1)$, $(-1, -2)$, $(2, -2)$, $(3, 0)$. Domein $[-3, 3]$, bereik $[-2, 1]$.
    - opgave: |-
        $f(-x)$
      antwoord: |-
        $(3, -1)$, $(1, 2)$, $(-2, 2)$, $(-3, 0)$; $[-3, 3]$; $[-1, 2]$
      uitwerking: |-
        $(x, y) \mapsto (-x, y)$: $(3, -1)$, $(1, 2)$, $(-2, 2)$, $(-3, 0)$. Domein $[-3, 3]$, bereik $[-1, 2]$.
    - opgave: |-
        $\frac12 f(x)$
      antwoord: |-
        $(-3, -\frac12)$, $(-1, 1)$, $(2, 1)$, $(3, 0)$; $[-3, 3]$; $[-\frac12, 1]$
      uitwerking: |-
        $(x, y) \mapsto (x, \frac{y}{2})$: $(-3, -\frac12)$, $(-1, 1)$, $(2, 1)$, $(3, 0)$. Domein $[-3, 3]$, bereik $[-\frac12, 1]$.

- id: h2-o20
  soort: opdracht
  niveau: 2
  thema: |-
    kwadraat afsplitsen
  opgave: |-
    Schrijf als $a(x - c)^2 + d$. Beschrijf de transformaties vanuit $x^2$, en geef de top en het bereik.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = x^2 + 6x + 5$
      antwoord: |-
        $(x + 3)^2 - 4$; top $(-3, -4)$; $\left[-4, +\infty\right[$
      uitwerking: |-
        $x^2 + 6x + 9 - 4 = (x + 3)^2 - 4$: 3 naar links, 4 naar onder. Top $(-3, -4)$, bereik $\left[-4, +\infty\right[$.
    - opgave: |-
        $y = 2x^2 - 8x + 3$
      antwoord: |-
        $2(x - 2)^2 - 5$; top $(2, -5)$; $\left[-5, +\infty\right[$
      uitwerking: |-
        $2(x^2 - 4x) + 3 = 2(x - 2)^2 - 8 + 3 = 2(x - 2)^2 - 5$: 2 naar rechts, verticaal $\times 2$, 5 naar onder. Top $(2, -5)$, bereik $\left[-5, +\infty\right[$.
    - opgave: |-
        $y = -x^2 + 2x + 3$
      antwoord: |-
        $-(x - 1)^2 + 4$; top $(1, 4)$; $\left]-\infty, 4\right]$
      uitwerking: |-
        $-(x^2 - 2x) + 3 = -(x - 1)^2 + 1 + 3 = -(x - 1)^2 + 4$: 1 naar rechts, spiegelen om de $x$-as, 4 naar boven. Top $(1, 4)$, bereik $\left]-\infty, 4\right]$.
    - opgave: |-
        $y = \frac12x^2 + x$
      antwoord: |-
        $\frac12(x + 1)^2 - \frac12$; top $(-1, -\frac12)$; $\left[-\frac12, +\infty\right[$
      uitwerking: |-
        $\frac12(x^2 + 2x) = \frac12(x + 1)^2 - \frac12$: 1 naar links, verticaal $\times \frac12$, $\frac12$ naar onder. Top $(-1, -\frac12)$, bereik $\left[-\frac12, +\infty\right[$.

- id: h2-o4
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift uit een grafiek
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
        \rooster{-4}{1}{3}{-1}{1}{5}
        \draw[grijs,dashed] (-1,-1) -- (-1,5.3) (-4,2) -- (3.3,2);
        \kromme{-4}{-1.34}{1/(\x+1)+2} \kromme{-.67}{3}{1/(\x+1)+2}
        \vol{(0,3)}
      \end{tikzpicture}
  opgave: |-
    Geef het voorschrift.
  lijst: enumerate
  delen:
    - opgave: |-
        Een parabool met top $(2, -1)$ gaat door $(0, 3)$.
      antwoord: |-
        $y = (x - 2)^2 - 1$
      uitwerking: |-
        $y = a(x - 2)^2 - 1$ en $3 = 4a - 1$, dus $a = 1$.
    - opgave: |-
        De grafiek hiernaast ontstaat uit die van $\frac1x$ door verschuiven. De streepjeslijnen zijn de asymptoten.
      antwoord: |-
        $y = \dfrac{1}{x + 1} + 2$
      uitwerking: |-
        Het centrum $(0, 0)$ van $\frac1x$ schuift naar $(-1, 2)$: $y = \dfrac{1}{x + 1} + 2$. Controle: in $x = 0$ is $y = 3$.

- id: h2-o6
  soort: opdracht
  niveau: 2
  thema: |-
    waar zit de fout?
  opgave: |-
    Elke uitspraak is fout. Leg uit wat er misgaat, en verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Een leerling schetst $y = \sqrt{2x - 6}$ zo: \textit{eerst $\sqrt{x}$ horizontaal $\times \frac12$, dan 6 naar rechts.} Geef ook het juiste domein.
      antwoord: |-
        3 naar rechts, niet 6; $\left[3, +\infty\right[$
      uitwerking: |-
        $\sqrt{2x - 6} = \sqrt{2(x - 3)}$: na het uitrekken schuift de grafiek 3 naar rechts. Controle: de wortel begint waar $2x - 6 = 0$, in $x = 3$. Domein $\left[3, +\infty\right[$.
    - opgave: |-
        Lies: \textit{de grafiek van $y = (x + 3)^2$ is die van $x^2$, 3 naar rechts geschoven.}
      antwoord: |-
        3 naar links
      uitwerking: |-
        $x + 3 = x - (-3)$, dus $c = -3$: 3 naar links. Controle: de top ligt waar $x + 3 = 0$, in $x = -3$.
    - opgave: |-
        Ruben: \textit{de grafiek van $2f(x)$ is twee keer zo breed als die van $f$.}
      antwoord: |-
        twee keer zo hoog; $f\bigl(\frac{x}{2}\bigr)$ is twee keer zo breed
      uitwerking: |-
        De factor staat buiten $f$: hij werkt op de $y$-waarden. De grafiek wordt twee keer zo hoog. Twee keer zo breed is $f\bigl(\frac{x}{2}\bigr)$.
    - opgave: |-
        Mo: \textit{het bereik van $y = \dfrac{1}{x - 3}$ is $\R \setminus \{3\}$.}
      antwoord: |-
        $\R \setminus \{0\}$
      uitwerking: |-
        Verschuiven naar rechts verandert het domein, niet het bereik. Het domein is $\R \setminus \{3\}$, het bereik blijft dat van $\frac1x$: $\R \setminus \{0\}$.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    gecombineerde transformaties van een gebroken lijn
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
        \rooster{-3}{1}{3}{-1}{1}{3}
        \draw[accent,thick] (-3,1) -- (-1,-1) -- (1,3) -- (3,1);
        \vol{(-3,1)} \vol{(3,1)}
      \end{tikzpicture}
  opgave: |-
    De grafiek van $f$ is de gebroken lijn van $(-3, 1)$ over $(-1, -1)$ en $(1, 3)$ tot $(3, 1)$. Geef de hoekpunten van de grafiek van:
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x + 1) - 2$
      antwoord: |-
        $(-4, -1)$, $(-2, -3)$, $(0, 1)$, $(2, -1)$
      uitwerking: |-
        $(x, y) \mapsto (x - 1, y - 2)$: $(-4, -1)$, $(-2, -3)$, $(0, 1)$, $(2, -1)$.
    - opgave: |-
        $-\frac12 f(x)$
      antwoord: |-
        $(-3, -\frac12)$, $(-1, \frac12)$, $(1, -\frac32)$, $(3, -\frac12)$
      uitwerking: |-
        $(x, y) \mapsto (x, -\frac{y}{2})$: $(-3, -\frac12)$, $(-1, \frac12)$, $(1, -\frac32)$, $(3, -\frac12)$.
    - opgave: |-
        $f(-x) + 1$
      antwoord: |-
        $(3, 2)$, $(1, 0)$, $(-1, 4)$, $(-3, 2)$
      uitwerking: |-
        $(x, y) \mapsto (-x, y + 1)$: $(3, 2)$, $(1, 0)$, $(-1, 4)$, $(-3, 2)$.
    - opgave: |-
        $f(2x - 2)$
      antwoord: |-
        $(-\frac12, 1)$, $(\frac12, -1)$, $(\frac32, 3)$, $(\frac52, 1)$
      uitwerking: |-
        $f(2x - 2) = f\bigl(2(x - 1)\bigr)$: horizontaal $\times \frac12$, dan 1 naar rechts. $(x, y) \mapsto \bigl(\frac{x}{2} + 1, y\bigr)$: $(-\frac12, 1)$, $(\frac12, -1)$, $(\frac32, 3)$, $(\frac52, 1)$. Controle: $f(2 \cdot \frac32 - 2) = f(1) = 3$.
        \figuren{\begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-1}{1}{3}
          \draw[grijs,dashed,thick] (-3,1) -- (-1,-1) -- (1,3) -- (3,1);
          \draw[accent,thick] (-.5,1) -- (.5,-1) -- (1.5,3) -- (2.5,1);
        \end{tikzpicture}}

- id: h2-o5
  soort: opdracht
  niveau: 2
  thema: |-
    drill: domein en bereik voorspellen
  opgave: |-
    Geef het domein en het bereik zonder een tabel te maken. Beschrijf eerst kort de transformaties vanuit een basisfunctie.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $g(x) = -3\sqrt{2 - x} + 1$
      antwoord: |-
        $\left]-\infty, 2\right]$; $\left]-\infty, 1\right]$
      uitwerking: |-
        $\sqrt{2 - x} = \sqrt{-(x - 2)}$: spiegelen om de $y$-as, 2 naar rechts; dan verticaal $\times 3$, spiegelen om de $x$-as en 1 naar boven. Beginpunt $(2, 1)$, de grafiek loopt naar links en naar onder. $\dom g = \left]-\infty, 2\right]$, $\ber g = \left]-\infty, 1\right]$.
    - opgave: |-
        $g(x) = 2(x + 1)^2 - 3$
      antwoord: |-
        $\R$; $\left[-3, +\infty\right[$
      uitwerking: |-
        $x^2$: 1 naar links, verticaal $\times 2$, 3 naar onder. Top $(-1, -3)$, dalparabool.
    - opgave: |-
        $g(x) = -|x - 4| + 2$
      antwoord: |-
        $\R$; $\left]-\infty, 2\right]$
      uitwerking: |-
        $|x|$: 4 naar rechts, spiegelen om de $x$-as, 2 naar boven. Knik $(4, 2)$ is het hoogste punt.
    - opgave: |-
        $g(x) = \dfrac{3}{x - 2} + 1$
      antwoord: |-
        $\R \setminus \{2\}$; $\R \setminus \{1\}$
      uitwerking: |-
        $\frac1x$: 2 naar rechts, verticaal $\times 3$, 1 naar boven. De asymptoten worden $x = 2$ en $y = 1$.
    - opgave: |-
        $g(x) = \sqrt{3x + 6}$
      antwoord: |-
        $\left[-2, +\infty\right[$; $\left[0, +\infty\right[$
      uitwerking: |-
        $\sqrt{3(x + 2)}$: horizontaal $\times \frac13$, 2 naar links. Beginpunt $(-2, 0)$.
    - opgave: |-
        $g(x) = 4 - (x + 2)^3$
      antwoord: |-
        $\R$; $\R$
      uitwerking: |-
        $x^3$: 2 naar links, spiegelen om de $x$-as, 4 naar boven. Domein en bereik van $x^3$ zijn $\R$, en dat verandert niet.
    - opgave: |-
        $g(x) = -\dfrac1x - 5$
      antwoord: |-
        $\R \setminus \{0\}$; $\R \setminus \{-5\}$
      uitwerking: |-
        $\frac1x$: spiegelen om de $x$-as, 5 naar onder. De horizontale asymptoot $y = 0$ wordt $y = -5$.
    - opgave: |-
        $g(x) = \frac12\sqrt{-x} - 3$
      antwoord: |-
        $\left]-\infty, 0\right]$; $\left[-3, +\infty\right[$
      uitwerking: |-
        $\sqrt{x}$: spiegelen om de $y$-as, verticaal $\times \frac12$, 3 naar onder. Beginpunt $(0, -3)$, de grafiek loopt naar links en naar boven.

- id: h2-o24
  soort: opdracht
  niveau: 2
  thema: |-
    symmetrie na een transformatie
  opgave: |-
    Neem een functie $f$ met domein $\R$. Is $g$ dan zeker even, zeker oneven, of geen van beide? Toon aan, of geef een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        $f$ is even en $g(x) = f(x) + 3$.
      antwoord: |-
        $g$ is even
      uitwerking: |-
        $g(-x) = f(-x) + 3 = f(x) + 3 = g(x)$. Verticaal schuiven behoudt de symmetrie om de $y$-as.
    - opgave: |-
        $f$ is oneven en $g(x) = f(x) + 3$.
      antwoord: |-
        niet oneven
      uitwerking: |-
        Een oneven functie met domein $\R$ heeft $f(0) = 0$, dus $g(0) = 3$. Was $g$ oneven, dan zou $g(0) = 0$. Tegenvoorbeeld: $f(x) = x$ en $g(x) = x + 3$.
    - opgave: |-
        $f$ is even en $g(x) = f(x - 2)$.
      antwoord: |-
        niet altijd even
      uitwerking: |-
        Tegenvoorbeeld: $f(x) = x^2$ en $g(x) = (x - 2)^2$, met $g(1) = 1$ en $g(-1) = 9$. De symmetrieas schuift naar $x = 2$.
    - opgave: |-
        $f$ is oneven en $g(x) = 2f(3x)$.
      antwoord: |-
        $g$ is oneven
      uitwerking: |-
        $g(-x) = 2f(-3x) = 2 \cdot \bigl(-f(3x)\bigr) = -g(x)$. Uitrekken vanuit de oorsprong behoudt de puntsymmetrie.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift uit een grafiek
  opgave: |-
    Elke grafiek ontstaat uit een basisfunctie. Geef het voorschrift, en controleer met een punt. Bij c zijn de streepjeslijnen de asymptoten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-1}{1}{4}{-1}{1}{4}
          \kromme{-1}{3}{sqrt(3-\x)+1}
          \vol{(3,1)} \vol{(-1,3)}
        \end{tikzpicture}}
      antwoord: |-
        $y = \sqrt{3 - x} + 1$
      uitwerking: |-
        Een halve parabool die naar links loopt: $\sqrt{x}$ gespiegeld om de $y$-as, met beginpunt $(3, 1)$. Dus $y = a\sqrt{3 - x} + 1$. Het punt $(-1, 3)$ geeft $3 = 2a + 1$, dus $a = 1$.
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-5}{1}{2}{-1}{1}{4}
          \draw[accent,thick] (-5,1.5) -- (-2,3) -- (2,1);
          \vol{(-2,3)} \vol{(2,1)}
        \end{tikzpicture}}
      antwoord: |-
        $y = -\frac12|x + 2| + 3$
      uitwerking: |-
        Een omgekeerde V met knik $(-2, 3)$: $y = a|x + 2| + 3$. Het punt $(2, 1)$ geeft $1 = 4a + 3$, dus $a = -\frac12$.
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-2}{1}{4}{-5}{1}{3}
          \draw[grijs,dashed] (1,-5) -- (1,3.3) (-2,-2) -- (4.3,-2);
          \kromme{1.4}{4}{2/(\x-1)-2} \kromme{-2}{.33}{2/(\x-1)-2}
          \vol{(2,0)}
        \end{tikzpicture}}
      antwoord: |-
        $y = \dfrac{2}{x - 1} - 2$
      uitwerking: |-
        De asymptoten $x = 1$ en $y = -2$: $y = \dfrac{a}{x - 1} - 2$. Het punt $(2, 0)$ geeft $0 = a - 2$, dus $a = 2$. Controle: in $x = 0$ is $y = -4$.

- id: h2-o21
  soort: opdracht
  niveau: 2
  thema: |-
    een fontein verplaatsen
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.6cm,font=\scriptsize]
        \rooster{-1}{1}{5}{0}{1}{3}
        \kromme{0}{4}{-(\x-2)^2/2+2}
        \vol{(0,0)} \vol{(2,2)}
      \end{tikzpicture}
  opgave: |-
    De waterstraal van een fontein volgt de parabool $y = -\frac12(x - 2)^2 + 2$, met $x$ en $y$ in meter. Het spuitstuk staat in de oorsprong.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe hoog komt de straal, en waar komt ze op de grond?
      antwoord: |-
        2 m; in $x = 4$
      uitwerking: |-
        De top is $(2, 2)$: 2 m hoog. De parabool is symmetrisch om $x = 2$ en gaat door $(0, 0)$, dus ook door $(4, 0)$.
    - opgave: |-
        De fontein wordt 3 m naar links verplaatst, en het spuitstuk komt $0{,}5$ m hoger. Geef het nieuwe voorschrift.
      antwoord: |-
        $y = -\frac12(x + 1)^2 + 2{,}5$
      uitwerking: |-
        De hele straal schuift 3 naar links en $0{,}5$ naar boven: $y = -\frac12(x - 2 + 3)^2 + 2 + 0{,}5 = -\frac12(x + 1)^2 + 2{,}5$. Controle: het spuitstuk $(-3, 0{,}5)$ ligt erop.
    - opgave: |-
        Waar komt de straal nu op de grond?
      antwoord: |-
        in $x = -1 + \sqrt5 \approx 1{,}24$
      uitwerking: |-
        $-\frac12(x + 1)^2 + 2{,}5 = 0 \iff (x + 1)^2 = 5 \iff x = -1 \pm \sqrt5$. De straal gaat naar rechts, dus $x = -1 + \sqrt5 \approx 1{,}24$ m. Door het hogere spuitstuk komt ze verder dan $4 - 3 = 1$.

- id: h2-o25
  soort: opdracht
  niveau: 2
  thema: |-
    temperatuur in een andere eenheid
  figuur:
    opties: |-
      5cm
    code: |-
      \begin{tikzpicture}[x=.19cm,y=.09cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=3,ystep=5] (0,0) grid (24,30);
        \draw[->,grijs] (0,0) -- (25.5,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,33) node[above,text=black] {$T$};
        \foreach \t in {6,12,18,24}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {10,20,30}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \kromme{0}{24}{19-7*cos(18*(\x-5))}
        \vol{(5,12)} \vol{(15,26)}
      \end{tikzpicture}
  opgave: |-
    De grafiek toont de temperatuur $T(t)$ (in $^\circ$C) op een zomerdag, $t$ uur na middernacht. Het minimum is $12\,^\circ$C om 5 uur, het maximum $26\,^\circ$C om 15 uur.
  lijst: enumerate
  delen:
    - opgave: |-
        Een website geeft de temperatuur in graden Fahrenheit: $F(t) = 1{,}8\,T(t) + 32$. Welke transformaties zijn dat? Wat zijn het minimum en het maximum in $^\circ$F?
      antwoord: |-
        verticaal $\times 1{,}8$, 32 naar boven; $53{,}6\,^\circ$F en $78{,}8\,^\circ$F
      uitwerking: |-
        Verticaal uitrekken met factor $1{,}8$, dan 32 naar boven. De tijden blijven: minimum $1{,}8 \cdot 12 + 32 = 53{,}6\,^\circ$F om 5 uur, maximum $1{,}8 \cdot 26 + 32 = 78{,}8\,^\circ$F om 15 uur.
    - opgave: |-
        In een stad verder naar het westen verloopt de temperatuur net zo, maar één uur later. Geef het voorschrift met $T$. Wanneer is het daar het warmst?
      antwoord: |-
        $T(t - 1)$; om 16 uur
      uitwerking: |-
        Wat hier om $t - 1$ uur gebeurt, gebeurt daar om $t$ uur: $W(t) = T(t - 1)$. De grafiek schuift 1 naar rechts: het warmst om 16 uur.
    - opgave: |-
        Je drukt de tijd uit in minuten $m$ na middernacht. Geef het voorschrift met $T$. Welke transformatie is dat?
      antwoord: |-
        $T\bigl(\frac{m}{60}\bigr)$; horizontaal $\times 60$
      uitwerking: |-
        Na $m$ minuten zijn er $\frac{m}{60}$ uren verstreken: $M(m) = T\bigl(\frac{m}{60}\bigr)$. Horizontaal uitrekken met factor $60$: het maximum ligt nu in $m = 900$.

- id: h2-o7
  soort: opdracht
  niveau: 3
  thema: |-
    de volgorde telt
  opgave: |-
    Transformaties zijn niet altijd verwisselbaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Iemand rekt de grafiek van $f$ verticaal uit met factor 2 en schuift ze daarna 3 naar boven. Iemand anders doet het omgekeerd. Geef beide voorschriften. Zijn ze gelijk?
      antwoord: |-
        $2f(x) + 3$ en $2f(x) + 6$; nee
      uitwerking: |-
        Eerst uitrekken: $2f(x)$, dan schuiven: $2f(x) + 3$. Eerst schuiven: $f(x) + 3$, dan uitrekken: alles maal 2, dus $2\bigl(f(x) + 3\bigr) = 2f(x) + 6$. Niet gelijk: ook de verschuiving wordt mee uitgerekt.
    - opgave: |-
        Dezelfde vraag voor: 1 naar rechts schuiven en spiegelen om de $y$-as. Controleer met $f(x) = \sqrt{x}$ en het domein.
      antwoord: |-
        $f(-x - 1)$ en $f(1 - x)$; domeinen $\left]-\infty, -1\right]$ en $\left]-\infty, 1\right]$
      uitwerking: |-
        Eerst schuiven geeft $f(x - 1)$, dan spiegelen: $x$ vervangen door $-x$: $f(-x - 1)$. Eerst spiegelen geeft $f(-x)$, dan schuiven: $f\bigl(-(x - 1)\bigr) = f(1 - x)$. Met $\sqrt{x}$: $\sqrt{-x - 1}$ heeft domein $\left]-\infty, -1\right]$, $\sqrt{1 - x}$ heeft $\left]-\infty, 1\right]$.
    - opgave: |-
        Welke van deze paren zijn wel verwisselbaar: twee verschuivingen; een horizontale en een verticale transformatie?
      antwoord: |-
        beide
      uitwerking: |-
        Twee verschuivingen: $f(x - c) + d$ in beide volgordes. Een horizontale transformatie verandert alleen wat er met $x$ gebeurt, een verticale alleen wat er met $f(\ldots)$ gebeurt: ze hinderen elkaar niet. Bijvoorbeeld $2f(x - 1)$ in beide volgordes.

- id: h2-o8
  soort: opdracht
  niveau: 3
  thema: |-
    een worp
  opgave: |-
    De hoogte (in m) van een bal is $h(t) = -5(t - 1{,}2)^2 + 9{,}2$, met $t$ de tijd in seconden na de worp.
  lijst: enumerate
  delen:
    - opgave: |-
        Uit welke basisfunctie ontstaat de grafiek, en hoe?
      antwoord: |-
        $t^2$: verticaal $\times 5$, spiegelen, $1{,}2$ rechts, $9{,}2$ boven
      uitwerking: |-
        $t^2$: $1{,}2$ naar rechts, verticaal $\times 5$, gespiegeld om de horizontale as, $9{,}2$ naar boven.
    - opgave: |-
        Hoe hoog komt de bal, en wanneer?
      antwoord: |-
        $9{,}2$ m na $1{,}2$ s
      uitwerking: |-
        De top: $9{,}2$ m na $1{,}2$ s.
    - opgave: |-
        Van welke hoogte werd de bal gegooid?
      antwoord: |-
        2 m
      uitwerking: |-
        $h(0) = -5 \cdot 1{,}44 + 9{,}2 = 2$ m.
    - opgave: |-
        Wanneer valt de bal op de grond?
      antwoord: |-
        na ongeveer $2{,}56$ s
      uitwerking: |-
        $(t - 1{,}2)^2 = 1{,}84$, dus $t = 1{,}2 + \sqrt{1{,}84} \approx 2{,}56$ s (de andere oplossing is negatief).

- id: h2-o26
  soort: opdracht
  niveau: 3
  thema: |-
    absolute waarde buiten en binnen
  opgave: |-
    Neem $f(x) = (x - 2)^2 - 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit hoe je de grafiek van $|f(x)|$ maakt uit die van $f$, en teken ze.
      antwoord: |-
        delen onder de $x$-as spiegelen om de $x$-as
      uitwerking: |-
        Waar $f(x) \geqslant 0$ verandert er niets; waar $f(x) < 0$ (tussen de nulwaarden $1$ en $3$) wordt $f(x)$ vervangen door $-f(x)$: dat stuk spiegelt om de $x$-as.
        \figuren{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-1}{1}{5}{-1}{1}{3}
          \draw[grijs,dashed,thick] plot[domain=1:3,samples=40,smooth] (\x,{(\x-2)^2-1});
          \kromme{-.1}{1}{abs((\x-2)^2-1)} \kromme{1}{3}{abs((\x-2)^2-1)} \kromme{3}{4.1}{abs((\x-2)^2-1)}
        \end{tikzpicture}}
    - opgave: |-
        Leg uit hoe je de grafiek van $f(|x|)$ maakt, en teken ze.
      antwoord: |-
        het deel rechts van de $y$-as behouden en spiegelen om de $y$-as
      uitwerking: |-
        Voor $x \geqslant 0$ is $f(|x|) = f(x)$. Voor $x < 0$ is $f(|x|) = f(-x)$: de functie is even, dus links staat het spiegelbeeld van het rechterdeel.
        \figuren{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-4}{1}{4}{-1}{1}{3}
          \kromme{0}{4.1}{(\x-2)^2-1} \kromme{-4.1}{0}{(\x+2)^2-1}
        \end{tikzpicture}}
    - opgave: |-
        Hoeveel oplossingen heeft $|f(x)| = \frac12$? En $f(|x|) = 0$?
      antwoord: |-
        vier; vier
      uitwerking: |-
        $|f(x)| = \frac12$: de rechte $y = \frac12$ snijdt de grafiek van $|f(x)|$ vier keer: $(x - 2)^2 = \frac32$ of $(x - 2)^2 = \frac12$. $f(|x|) = 0$: $|x| = 1$ of $|x| = 3$, dus $x = \pm 1$ of $x = \pm 3$.
    - opgave: |-
        Is $|f(x)| = f(|x|)$ voor elke $x$?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: $|f(2)| = |-1| = 1$, maar $f(|2|) = f(2) = -1$.

- id: h2-o9
  soort: opdracht
  niveau: 3
  thema: |-
    symmetrie na verschuiven
  opgave: |-
    Neem een even functie $f$ met domein $\R$, en $g(x) = f(x - 2)$. Toon aan dat $g(2 + h) = g(2 - h)$ voor elke $h$. Wat betekent dat voor de grafiek van $g$? Geef een voorbeeld.
  antwoord: |-
    symmetrisch om de rechte $x = 2$; bv. $(x - 2)^2$
  uitwerking: |-
    $g(2 + h) = f(h)$ en $g(2 - h) = f(-h) = f(h)$, want $f$ is even. De punten $2 + h$ en $2 - h$ liggen even ver links en rechts van $2$ en hebben hetzelfde beeld: de grafiek van $g$ is symmetrisch ten opzichte van de verticale rechte $x = 2$, bijvoorbeeld de parabool $y = (x - 2)^2$.

- id: h2-o27
  soort: opdracht
  niveau: 3
  thema: |-
    alle parabolen zijn gelijkvormig
  opgave: |-
    Neem een parabool $y = ax^2 + bx + c$ met $a \neq 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $ax^2 + bx + c = a\Bigl(x + \dfrac{b}{2a}\Bigr)^2 + \dfrac{4ac - b^2}{4a}$. Waar ligt de top? Uit welke transformaties van $x^2$ ontstaat de parabool?
      antwoord: |-
        top $\Bigl(-\dfrac{b}{2a}, \dfrac{4ac - b^2}{4a}\Bigr)$
      uitwerking: |-
        Werk het rechterlid uit: $a\Bigl(x^2 + \dfrac{b}{a}x + \dfrac{b^2}{4a^2}\Bigr) + \dfrac{4ac - b^2}{4a} = ax^2 + bx + \dfrac{b^2}{4a} + c - \dfrac{b^2}{4a} = ax^2 + bx + c$. Dus: verticaal uitrekken met $|a|$ (en spiegelen als $a < 0$), en verschuiven tot de top $\Bigl(-\dfrac{b}{2a}, \dfrac{4ac - b^2}{4a}\Bigr)$.
    - opgave: |-
        Neem $a > 0$. Toon aan dat de grafiek van $y = ax^2$ ook ontstaat door die van $x^2$ in \textit{beide} richtingen uit te rekken met factor $\frac1a$.
      antwoord: |-
        $(x, y) \mapsto \bigl(\frac{x}{a}, \frac{y}{a}\bigr)$
      uitwerking: |-
        Het punt $(t, t^2)$ gaat naar $\bigl(\frac{t}{a}, \frac{t^2}{a}\bigr)$. Ligt dat op $y = ax^2$? $a\bigl(\frac{t}{a}\bigr)^2 = \frac{t^2}{a}$: ja. Omgekeerd is elk punt van $y = ax^2$ zo'n beeld.
    - opgave: |-
        Wat volgt daaruit voor de vorm van alle parabolen?
      antwoord: |-
        ze zijn allemaal gelijkvormig
      uitwerking: |-
        Uitrekken in beide richtingen met dezelfde factor is een vergroting of verkleining. Samen met spiegelen en verschuiven volgt: elke parabool is gelijkvormig met $y = x^2$. Een \textit{smalle} parabool is dus een verkleinde kopie, geen andere vorm.

- id: h2-o28
  soort: opdracht
  niveau: 3
  thema: |-
    horizontaal of verticaal uitrekken
  opgave: |-
    Voor sommige functies geeft horizontaal uitrekken hetzelfde als verticaal uitrekken.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{1}{bx} = \dfrac1b \cdot \dfrac1x$ en $\sqrt{bx} = \sqrt{b} \cdot \sqrt{x}$ voor $b > 0$. Wat betekent dat voor de grafieken van $\frac1x$ en $\sqrt{x}$?
      antwoord: |-
        horizontaal $\times \frac1b$ = verticaal $\times \frac1b$ (bij $\frac1x$), verticaal $\times \sqrt{b}$ (bij $\sqrt{x}$)
      uitwerking: |-
        Breuken en wortels splitsen over een product. Horizontaal uitrekken met factor $\frac1b$ geeft bij $\frac1x$ dezelfde grafiek als verticaal uitrekken met $\frac1b$, en bij $\sqrt{x}$ dezelfde als verticaal uitrekken met $\sqrt{b}$.
    - opgave: |-
        Zoek ook voor $x^2$, $x^3$ en $|x|$ de verticale factor die hetzelfde doet als $f(bx)$, met $b > 0$.
      antwoord: |-
        $b^2$, $b^3$ en $b$
      uitwerking: |-
        $(bx)^2 = b^2x^2$, $(bx)^3 = b^3x^3$ en $|bx| = b|x|$.
    - opgave: |-
        Bestaat zo'n factor ook voor $f(x) = x^2 + 1$?
      antwoord: |-
        nee (behalve voor $b = 1$)
      uitwerking: |-
        Stel $f(bx) = a f(x)$ voor alle $x$: $b^2x^2 + 1 = ax^2 + a$. In $x = 0$: $a = 1$. Dan $b^2x^2 = x^2$ voor alle $x$, dus $b = 1$. Alleen de triviale factor werkt.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Goniometrische functies
  thema: |-
    een sinusfunctie
  opgave: |-
    Beschrijf hoe de grafiek van $g(x) = 3\sin\bigl(2(x - \frac{\pi}{4})\bigr) + 1$ ontstaat uit die van $\sin x$. Wat zijn de grootste en de kleinste functiewaarde, en wat is de periode?
  antwoord: |-
    max. 4, min. $-2$, periode $\pi$
  uitwerking: |-
    Horizontaal $\times \frac12$, $\frac{\pi}{4}$ naar rechts, verticaal $\times 3$, 1 naar boven. De sinus ligt tussen $-1$ en $1$, dus $g$ tussen $-3 + 1 = -2$ en $3 + 1 = 4$. De periode $2\pi$ wordt $\pi$.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Exponentiële en logaritmische functies
  thema: |-
    schuiven is rekken
  opgave: |-
    Toon aan dat $2^{x - 3} = \frac18 \cdot 2^x$. Welke twee transformaties van de grafiek van $2^x$ geven dus hetzelfde resultaat?
  antwoord: |-
    3 naar rechts schuiven = verticaal $\times \frac18$
  uitwerking: |-
    $2^{x - 3} = 2^x \cdot 2^{-3} = \frac18 \cdot 2^x$. De grafiek 3 naar rechts schuiven geeft hetzelfde als ze verticaal uitrekken met factor $\frac18$.

- id: h2-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: data
    onderwerp: Statistiek
  thema: |-
    de normale dichtheid
  opgave: |-
    De dichtheidsfunctie van $N(\mu, \sigma)$ is $f(x) = \frac{1}{\sigma}\,\varphi\bigl(\frac{x - \mu}{\sigma}\bigr)$, met $\varphi$ de standaardnormale dichtheid. Beschrijf de transformaties vanuit $\varphi$. Waarom is de factor $\frac1\sigma$ vooraan nodig?
  antwoord: |-
    horizontaal $\times \sigma$, $\mu$ naar rechts, verticaal $\times \frac1\sigma$; anders is de totale oppervlakte niet 1
  uitwerking: |-
    $\varphi\bigl(\frac1\sigma(x - \mu)\bigr)$: horizontaal $\times \sigma$, dan $\mu$ naar rechts; daarna verticaal $\times \frac1\sigma$. Horizontaal uitrekken met $\sigma$ maakt de oppervlakte onder de grafiek $\sigma$ keer groter; de factor $\frac1\sigma$ brengt ze terug op 1.

