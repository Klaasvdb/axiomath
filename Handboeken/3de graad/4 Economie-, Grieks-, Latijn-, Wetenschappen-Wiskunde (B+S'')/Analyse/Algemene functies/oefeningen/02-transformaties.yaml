- id: h2-t5
  soort: test
  niveau: 1
  thema: |-
    basisfuncties
  opgave: |-
    Welke basisfuncties ($x^2$, $x^3$, $\sqrt{x}$, $|x|$, $\frac1x$):
  lijst: enumerate
  delen:
    - opgave: |-
        zijn oneven?
      antwoord: |-
        $x^3$ en $\frac1x$
      uitwerking: |-
        $x^3$ en $\frac1x$: hun grafiek is puntsymmetrisch om de oorsprong.
    - opgave: |-
        hebben domein $\left[0, +\infty\right[$?
      antwoord: |-
        $\sqrt{x}$
      uitwerking: |-
        Alleen $\sqrt{x}$.
    - opgave: |-
        hebben bereik $\left[0, +\infty\right[$?
      antwoord: |-
        $x^2$, $\sqrt{x}$ en $|x|$
      uitwerking: |-
        $x^2$, $\sqrt{x}$ en $|x|$: ze zijn nooit negatief, en elke positieve waarde wordt bereikt.

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    verschuiven
  opgave: |-
    Beschrijf hoe de grafiek van $g(x) = \sqrt{x - 2} + 4$ ontstaat uit die van $\sqrt{x}$, en geef het domein en het bereik.
  antwoord: |-
    2 rechts, 4 boven; $\left[2, +\infty\right[$; $\left[4, +\infty\right[$
  uitwerking: |-
    Over 2 naar rechts en 4 naar boven. Het beginpunt $(0, 0)$ gaat naar $(2, 4)$. $\dom g = \left[2, +\infty\right[$, $\ber g = \left[4, +\infty\right[$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    uitrekken en spiegelen
  opgave: |-
    De grafiek van $f$ is de gebroken lijn door $(-2, 0)$, $(0, 2)$, $(2, 0)$ en $(4, -2)$. Geef de hoekpunten van de grafiek van $g(x) = -f(2x)$.
  antwoord: |-
    $(-1, 0)$, $(0, -2)$, $(1, 0)$, $(2, 2)$
  uitwerking: |-
    $(x, y) \mapsto (\frac{x}{2}, -y)$: $(-1, 0)$, $(0, -2)$, $(1, 0)$, $(2, 2)$.

- id: h2-t6
  soort: test
  niveau: 1
  thema: |-
    een punt transformeren
  opgave: |-
    Het punt $(-1, 4)$ ligt op de grafiek van $f$. Welk punt ligt zeker op de grafiek van:
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $f(x + 2)$
      antwoord: |-
        $(-3, 4)$
      uitwerking: |-
        2 naar links: $(-3, 4)$.
    - opgave: |-
        $-2f(x)$
      antwoord: |-
        $(-1, -8)$
      uitwerking: |-
        $(x, y) \mapsto (x, -2y)$: $(-1, -8)$.
    - opgave: |-
        $f(-x) + 1$
      antwoord: |-
        $(1, 5)$
      uitwerking: |-
        $(x, y) \mapsto (-x, y + 1)$: $(1, 5)$.
    - opgave: |-
        $f\bigl(\frac{x}{2}\bigr)$
      antwoord: |-
        $(-2, 4)$
      uitwerking: |-
        Horizontaal $\times 2$: $(-2, 4)$.

- id: h2-t3
  soort: test
  niveau: 2
  thema: |-
    combineren
  opgave: |-
    Schets $g(x) = 3 - 2|x + 1|$ vanuit $|x|$. Geef de transformaties, het domein en het bereik.
  antwoord: |-
    knik in $(-1, 3)$; $\R$; $\left]-\infty, 3\right]$
  uitwerking: |-
    $g(x) = -2|x + 1| + 3$: 1 naar links, verticaal $\times 2$, spiegelen om de $x$-as, 3 naar boven. Knik in $(-1, 3)$. $\dom g = \R$, $\ber g = \left]-\infty, 3\right]$.
    \figuren{\begin{tikzpicture}[x=.4cm,y=.4cm,font=\scriptsize]
      \rooster{-4}{1}{2}{-3}{1}{3}
      \draw[accent,thick] (-4,-3) -- (-1,3) -- (2,-3);
      \vol{(-1,3)}
    \end{tikzpicture}}

- id: h2-t7
  soort: test
  niveau: 2
  thema: |-
    combineren met een wortel
  opgave: |-
    Schets $h(x) = -\sqrt{x - 1} + 2$ vanuit $\sqrt{x}$. Geef het domein en het bereik, en bereken de nulwaarde.
  antwoord: |-
    beginpunt $(1, 2)$; $\left[1, +\infty\right[$; $\left]-\infty, 2\right]$; nulwaarde $5$
  uitwerking: |-
    1 naar rechts, spiegelen om de $x$-as, 2 naar boven. Beginpunt $(1, 2)$, de grafiek daalt. $\dom h = \left[1, +\infty\right[$, $\ber h = \left]-\infty, 2\right]$. Nulwaarde: $\sqrt{x - 1} = 2 \iff x = 5$.
    \figuren{\begin{tikzpicture}[x=.4cm,y=.4cm,font=\scriptsize]
      \rooster{-1}{1}{7}{-1}{1}{3}
      \kromme{1}{7}{2-sqrt(\x-1)}
      \vol{(1,2)} \vol{(5,0)}
    \end{tikzpicture}}

- id: h2-t4
  soort: test
  niveau: 2
  thema: |-
    voorschrift uit een grafiek
  opgave: |-
    Een parabool heeft top $(-3, 4)$ en gaat door $(-1, 0)$. Geef het voorschrift.
  antwoord: |-
    $y = -(x + 3)^2 + 4$
  uitwerking: |-
    $y = a(x + 3)^2 + 4$ en $0 = 4a + 4$, dus $a = -1$.
