- id: h4-koppel-1
  soort: koppel
  niveau: 1
  koppel:
    rubriek: analyse
    onderwerp: Goniometrische functies
  thema: |-
    de cosinusregel
  opgave: |-
    Gebruik het scalair product om in de driehoek met $A(0, 0, 0)$, $B(4, 0, 0)$ en $C(1, 3, 0)$ de hoek in $A$ te berekenen. Controleer met de cosinusregel.
  antwoord: |-
    $\approx 71{,}6^\circ$
  uitwerking: |-
    $\cos\theta = \frac{4}{4\sqrt{10}} = \frac{1}{\sqrt{10}}$, $\theta \approx 71{,}6^\circ$. Cosinusregel: $|BC|^2 = 18 = 16 + 10 - 2 \cdot 4 \cdot \sqrt{10}\cos\theta$, dus $\cos\theta = \frac{8}{8\sqrt{10}}$: hetzelfde.

- id: h4-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: data
    onderwerp: Statistiek
  thema: |-
    correlatie als cosinus
  opgave: |-
    Drie metingen van $x$ en $y$ hebben afwijkingen van het gemiddelde $\vec a = \vcr{-1}{0}{1}$ en $\vec b = \vcr{-2}{1}{1}$. De correlatiecoëfficiënt is $r = \frac{\vec a \cdot \vec b}{\norm{\vec a}\,\norm{\vec b}}$. Bereken $r$. Wat betekent $r = 1$ meetkundig?
  antwoord: |-
    $r = \frac{3}{\sqrt{12}} \approx 0{,}87$; de vectoren zijn collineair
  uitwerking: |-
    $\vec a \cdot \vec b = 2 + 0 + 1 = 3$, $\norm{\vec a} = \sqrt2$, $\norm{\vec b} = \sqrt6$: $r = \frac{3}{\sqrt{12}} \approx 0{,}87$. De correlatie is de cosinus van de hoek tussen de afwijkingsvectoren; $r = 1$ betekent hoek $0$: de punten liggen op een stijgende rechte.

- id: h4-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: Matrices
  thema: |-
    een rotatie bewaart lengtes
  opgave: |-
    De rotatie om de $z$-as over $90^\circ$ stuurt $(x, y, z)$ naar $(-y, x, z)$. Toon aan dat ze het scalair product van twee vectoren niet verandert. Wat betekent dat voor lengtes en hoeken?
  antwoord: |-
    lengtes en hoeken blijven gelijk
  uitwerking: |-
    $(-v_2)(-w_2) + v_1w_1 + v_3w_3 = \vec v \cdot \vec w$. Omdat lengtes en hoeken met het scalair product berekend worden, blijven ze gelijk: een rotatie vervormt niets.

