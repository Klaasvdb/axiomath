- id: h4-t1
  soort: test
  niveau: 1
  thema: |-
    hoek
  opgave: |-
    Bereken de hoek tussen $\vcr{2}{1}{2}$ en $\vcr{1}{0}{-1}$.
  antwoord: |-
    $90^\circ$
  uitwerking: |-
    Het scalair product is $2 + 0 - 2 = 0$: de vectoren staan loodrecht op elkaar, de hoek is $90^\circ$.

- id: h4-t2
  soort: test
  niveau: 1
  thema: |-
    loodvlak
  opgave: |-
    Geef een vergelijking van het vlak door $(1, 0, -2)$ dat loodrecht staat op de rechte $(3, 1, 1) + r\vcr{1}{-2}{3}$.
  antwoord: |-
    $x - 2y + 3z = -5$
  uitwerking: |-
    $(x - 1) - 2y + 3(z + 2) = 0$, dus $x - 2y + 3z = -5$.

- id: h4-t3
  soort: test
  niveau: 1
  thema: |-
    afstand tot een vlak
  opgave: |-
    Bereken de afstand van $P(2, 1, -1)$ tot het vlak $2x + 2y - z = 1$.
  antwoord: |-
    2
  uitwerking: |-
    $\frac{|4 + 2 + 1 - 1|}{3} = 2$.

- id: h4-t4
  soort: test
  niveau: 2
  thema: |-
    afstand tot een rechte
  opgave: |-
    Bereken de afstand van $P(0, 3, 0)$ tot de rechte $r\vcr{1}{1}{0}$ door de oorsprong.
  antwoord: |-
    $\frac{3\sqrt2}{2} \approx 2{,}12$
  uitwerking: |-
    Loodvlak $x + y = 3$; snijpunt $2r = 3$, $V\bigl(\frac32, \frac32, 0\bigr)$. $|PV| = \sqrt{\frac94 + \frac94} = \frac{3\sqrt2}{2}$.

- id: h4-t5
  soort: test
  niveau: 1
  thema: |-
    hoek tussen vlakken
  opgave: |-
    Staan de vlakken $x - 2y + z = 3$ en $2x + y + 5z = 0$ loodrecht op elkaar? Bereken anders de hoek ertussen.
  antwoord: |-
    nee; $\approx 68{,}1^\circ$
  uitwerking: |-
    $\vcr{1}{-2}{1} \cdot \vcr{2}{1}{5} = 2 - 2 + 5 = 5 \neq 0$: niet loodrecht. Normen $\sqrt6$ en $\sqrt{30}$: $\cos\theta = \frac{5}{\sqrt{180}}$, dus $\theta \approx 68{,}1^\circ$.

- id: h4-t6
  soort: test
  niveau: 1
  thema: |-
    loodrecht met een parameter
  opgave: |-
    Voor welke $k$ staan $\vcr{k}{2}{-1}$ en $\vcr{3}{k}{4}$ loodrecht op elkaar?
  antwoord: |-
    $k = \frac45$
  uitwerking: |-
    $3k + 2k - 4 = 0$, dus $k = \frac45$.

- id: h4-t7
  soort: test
  niveau: 2
  thema: |-
    voetpunt op een vlak
  opgave: |-
    Bereken het voetpunt van de loodlijn uit $P(3, 3, 0)$ op het vlak $x + y - z = 0$, en de afstand van $P$ tot het vlak.
  antwoord: |-
    $(1, 1, 2)$; $2\sqrt3$
  uitwerking: |-
    Loodlijn $(3 + r, 3 + r, -r)$. Invullen: $6 + 3r = 0$, dus $r = -2$ en het voetpunt is $(1, 1, 2)$. Afstand: $\sqrt{4 + 4 + 4} = 2\sqrt3$. Controle met de formule: $\frac{|6|}{\sqrt3} = 2\sqrt3$.
