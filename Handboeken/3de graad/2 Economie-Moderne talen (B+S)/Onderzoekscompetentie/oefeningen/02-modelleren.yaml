# Oefeningen van hoofdstuk 2. Zie oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken het gemiddelde van $2, 4, 5, 4, 5$.
      antwoord: |-
        4
      uitwerking: |-
        $\frac{20}{5} = 4$.
    - opgave: |-
        Geef de rechte door $(0, 2)$ met richtingscoëfficiënt $0{,}5$.
      antwoord: |-
        $y = 0{,}5x + 2$
      uitwerking: |-
        $y = 0{,}5x + 2$.
    - opgave: |-
        Bereken $\ln 20$ en $\ln 40$. Hoeveel verschillen ze?
      antwoord: |-
        $\approx 3{,}00$; $\approx 3{,}69$; $\ln 2$
      uitwerking: |-
        $\ln 40 - \ln 20 = \ln 2 \approx 0{,}69$.
    - opgave: |-
        Hoe ziet de grafiek van $y = 3x^2$ eruit als je $y$ uitzet tegen $x^2$?
      antwoord: |-
        een rechte door de oorsprong
      uitwerking: |-
        Met $u = x^2$ is $y = 3u$: een rechte met richtingscoëfficiënt $3$.

- id: h2-verken
  soort: start
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[x=.7cm,y=.5cm,font=\scriptsize]
        \rooster{0}{1}{5}{0}{1}{6}
        \foreach \x/\y in {1/2,2/4,3/5,4/4,5/5}{\fill[accent] (\x,\y) circle (2pt);}
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken} De figuur toont vijf metingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg een lat op de figuur zodat ze \textit{zo goed mogelijk} bij de punten past. Teken de rechte en geef haar vergelijking.
      antwoord: |-
        ongeveer $y = 0{,}6x + 2{,}2$
      uitwerking: |-
        Iedereen vindt iets anders, ongeveer $y = 0{,}6x + 2{,}2$.
    - opgave: |-
        Vergelijk met een klasgenoot. Wat zou \textit{zo goed mogelijk} precies kunnen betekenen?
      antwoord: |-
        bijvoorbeeld: de afstanden tot de punten zo klein mogelijk
      uitwerking: |-
        Een afspraak is nodig: bijvoorbeeld dat de som van de (kwadraten van de) verticale afstanden minimaal is.

- id: h2-rechte
  soort: kort
  opgave: |-
    Bepaal de kleinste-kwadratenrechte en de correlatiecoëfficiënt voor de punten $(0, 1)$, $(1, 3)$, $(2, 2)$, $(3, 5)$, $(4, 4)$.
  antwoord: |-
    $y = 0{,}8x + 1{,}4$; $r = 0{,}8$
  uitwerking: |-
    $\xbar = 2$, $\ybar = 3$. Afwijkingen $x$: $-2, -1, 0, 1, 2$; $y$: $-2, 0, -1, 2, 1$. $\sum$ producten $= 4 + 0 + 0 + 2 + 2 = 8$, $\sum(x - \xbar)^2 = 10$, $\sum(y - \ybar)^2 = 10$. $a = 0{,}8$, $b = 3 - 1{,}6 = 1{,}4$, $r = \frac{8}{10} = 0{,}8$.

- id: h2-transformeren
  soort: kort
  opgave: |-
    Thee koelt af in een kamer van $20\,^\circ$C. Je meet de temperatuur $T$ om de 5 minuten: $90$; $74{,}5$; $62{,}5$; $53{,}1$; $45{,}8$. Je vermoedt $T - 20 = c \cdot g^t$. Hoe maak je dat lineair? Bereken $\ln(T - 20)$ en schat $g$ per minuut.
  antwoord: |-
    zet $\ln(T - 20)$ uit tegen $t$; $g \approx 0{,}951$
  uitwerking: |-
    $\ln(T - 20) = \ln c + t\ln g$. Waarden: $4{,}248$; $3{,}998$; $3{,}750$; $3{,}500$; $3{,}250$: elke 5 minuten ongeveer $-0{,}25$, dus $\ln g \approx -0{,}05$ en $g \approx \e^{-0{,}05} \approx 0{,}951$: ongeveer $5$\,\% minder temperatuurverschil per minuut.

- id: h2-kritisch
  soort: kort
  opgave: |-
    Wat is er mis met de redenering?
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{Een plant groeide de eerste vijf weken telkens 3 cm. Na een jaar is ze dus 1{,}56 m.}
      antwoord: |-
        extrapolatie
      uitwerking: |-
        Het lineaire model is maar getest op vijf weken. Planten groeien niet onbeperkt lineair.
    - opgave: |-
        \textit{Leerlingen met meer schermtijd hebben lagere punten ($r = -0{,}4$). Minder schermtijd zal hun punten dus verhogen.}
      antwoord: |-
        correlatie is geen oorzaak
      uitwerking: |-
        Een negatieve correlatie bewijst geen oorzaak; andere factoren (slaap, motivatie) kunnen beide beïnvloeden. Bovendien is $r = -0{,}4$ maar een zwak verband.

- id: h2-negatief
  soort: kort
  opgave: |-
    Bepaal de kleinste-kwadratenrechte en de correlatiecoëfficiënt voor de punten $(1, 8)$, $(2, 6)$, $(3, 5)$, $(4, 3)$, $(5, 3)$. Wat zegt het teken van $r$?
  antwoord: |-
    $y = -1{,}3x + 8{,}9$; $r \approx -0{,}97$; dalend verband
  uitwerking: |-
    $\xbar = 3$, $\ybar = 5$. Afwijkingen $x$: $-2, -1, 0, 1, 2$; $y$: $3, 1, 0, -2, -2$. Producten: $-6, -1, 0, -2, -4$, samen $-13$. $\sum(x_i - \xbar)^2 = 10$ en $\sum(y_i - \ybar)^2 = 9 + 1 + 0 + 4 + 4 = 18$. Dus $a = \frac{-13}{10} = -1{,}3$ en $b = 5 - (-1{,}3) \cdot 3 = 8{,}9$. $r = \frac{-13}{\sqrt{10 \cdot 18}} \approx -0{,}97$. Een negatieve $r$ hoort bij een dalend verband; omdat $r$ dicht bij $-1$ ligt, liggen de punten dicht bij de rechte.

- id: h2-kwadraat
  soort: kort
  opgave: |-
    Een knikker rolt van een lange, flauwe helling. Na $t$ seconden heeft hij $s$ cm afgelegd: voor $t = 1, 2, 3, 4$ is $s = 2{,}9$; $12{,}2$; $27{,}0$; $48{,}1$. Je vermoedt $s = c \cdot t^2$. Zet $s$ uit tegen $u = t^2$, bepaal de kleinste-kwadratenrechte en schat $c$.
  antwoord: |-
    $s \approx 3{,}01\,u + 0{,}00$; $c \approx 3{,}0$ cm/s$^2$
  uitwerking: |-
    $u = 1, 4, 9, 16$, met $\overline{u} = 7{,}5$ en $\overline{s} = 22{,}55$. Afwijkingen $u$: $-6{,}5$; $-3{,}5$; $1{,}5$; $8{,}5$. Afwijkingen $s$: $-19{,}65$; $-10{,}35$; $4{,}45$; $25{,}55$. Som van de producten $387{,}8$, $\sum(u_i - \overline{u})^2 = 129$. Dus $a = \frac{387{,}8}{129} \approx 3{,}006$ en $b = 22{,}55 - 3{,}006 \cdot 7{,}5 \approx 0{,}00$. De rechte gaat door de oorsprong, zoals het model voorspelt: $c \approx 3{,}0$ cm/s$^2$.

- id: h2-residuplot
  soort: kort
  opgave: |-
    Bij drie onderzoeken bepaalde je een kleinste-kwadratenrechte en zette je de residuen uit tegen $x$. Wat besluit je telkens over het lineaire model?
    \figuren{\begin{tikzpicture}[x=.27cm,y=.6cm,font=\scriptsize]
      \foreach \dx/\nm in {0/A,12.5/B,25/C}{
        \draw[grijs,->] (\dx,0) -- (\dx+9,0) node[right,text=black] {$x$};
        \draw[grijs] (\dx,-1) -- (\dx,1.7);
        \node[above] at (\dx+4.5,1.7) {\nm};}
      \foreach \x/\y in {1/.3,2/-.5,3/.1,4/.6,5/-.4,6/-.2,7/.5,8/-.4}{\fill[accent] (\x,\y) circle (1.6pt);}
      \foreach \x/\y in {1/.8,2/.1,3/-.4,4/-.6,5/-.6,6/-.3,7/.2,8/.8}{\fill[accent] (\x+12.5,\y) circle (1.6pt);}
      \foreach \x/\y in {1/.1,2/-.3,3/-.1,4/1.4,5/-.4,6/-.2,7/-.3,8/-.2}{\fill[accent] (\x+25,\y) circle (1.6pt);}
    \end{tikzpicture}}
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        Figuur A
      antwoord: |-
        het model past
      uitwerking: |-
        De residuen liggen willekeurig boven en onder nul, zonder patroon: het lineaire model past.
    - opgave: |-
        Figuur B
      antwoord: |-
        een ander model
      uitwerking: |-
        Eerst positief, dan negatief, dan weer positief: een systematisch patroon. Het verband is gebogen; probeer een ander model, zoals een macht of een exponentiële functie.
    - opgave: |-
        Figuur C
      antwoord: |-
        één meting nakijken
      uitwerking: |-
        Op één punt na liggen de residuen dicht bij nul. Kijk die ene meting na: is het een meetfout of een overschrijffout? Laat ze niet zomaar weg, maar vermeld in het verslag wat je ermee deed.

- id: h2-variabelen
  soort: kort
  opgave: |-
    Geef telkens de onafhankelijke en de afhankelijke variabele, en twee controlevariabelen.
  lijst: enumerate
  delen:
    - opgave: |-
        Je laat een bal vallen van verschillende hoogtes, en meet hoe hoog hij terugbotst.
      antwoord: |-
        valhoogte; terugbotshoogte; bv. dezelfde bal, dezelfde vloer
      uitwerking: |-
        Onafhankelijk: de valhoogte, die je zelf kiest. Afhankelijk: de hoogte van de terugbots, die je meet. Controlevariabelen: dezelfde bal (even hard opgepompt) en dezelfde vloer.
    - opgave: |-
        Je meet hoe lang een ijsblokje nodig heeft om te smelten in water van verschillende temperaturen.
      antwoord: |-
        watertemperatuur; smelttijd; bv. grootte van het blokje, hoeveelheid water
      uitwerking: |-
        Onafhankelijk: de temperatuur van het water. Afhankelijk: de smelttijd. Controlevariabelen: even grote ijsblokjes en telkens evenveel water.
    - opgave: |-
        Je onderzoekt hoe je hartslag afhangt van het aantal kniebuigingen dat je net deed.
      antwoord: |-
        aantal kniebuigingen; hartslag; bv. dezelfde persoon, hetzelfde tempo
      uitwerking: |-
        Onafhankelijk: het aantal kniebuigingen. Afhankelijk: de hartslag in slagen per minuut. Controlevariabelen: dezelfde persoon, hetzelfde tempo, en telkens even lang rust vóór elke reeks.

- id: h2-meten
  soort: kort
  opgave: |-
    Meetfouten.
  lijst: enumerate
  delen:
    - opgave: |-
        Een blad papier is te dun om met een lat te meten. Een stapel van $250$ bladen is $2{,}7$ cm dik. Hoe dik is één blad? Waarom is deze werkwijze nauwkeuriger?
      antwoord: |-
        ongeveer $0{,}11$ mm; de fout wordt door $250$ gedeeld
      uitwerking: |-
        $\frac{27 \text{ mm}}{250} \approx 0{,}108$ mm, dus ongeveer $0{,}11$ mm. Een fout van $1$ mm op de stapel wordt per blad maar $\frac{1}{250}$ mm $= 0{,}004$ mm.
    - opgave: |-
        Een keukenweegschaal toont $0{,}3$ kg als er niets op ligt. Welke soort fout is dat? Helpt het om elke meting drie keer te herhalen?
      antwoord: |-
        systematisch; nee
      uitwerking: |-
        Een systematische fout: elke meting is $0{,}3$ kg te groot. Herhalen helpt niet, want de fout zit in elke meting. Zet de weegschaal op nul, of trek $0{,}3$ kg af.
    - opgave: |-
        Vijf leerlingen meten dezelfde lengte met een meetlint: $152{,}3$; $152{,}6$; $151{,}9$; $152{,}4$; $152{,}3$ cm. Welke soort fout zie je? Welke lengte rapporteer je?
      antwoord: |-
        toevallig; $152{,}3$ cm
      uitwerking: |-
        Een toevallige fout: de metingen liggen nu eens hoger, dan weer lager. Rapporteer het gemiddelde: $\frac{761{,}5}{5} = 152{,}3$ cm.

- id: h2-model
  soort: kort
  opgave: |-
    Voor $x = 0, 1, 2, 3, 4$ vind je deze waarden van $y$. Is het verband lineair, exponentieel of een macht? Geef het voorschrift.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $7,\ 10,\ 13,\ 16,\ 19$
      antwoord: |-
        lineair: $y = 3x + 7$
      uitwerking: |-
        De verschillen zijn constant $3$, en voor $x = 0$ is $y = 7$: $y = 3x + 7$.
    - opgave: |-
        $500,\ 400,\ 320,\ 256,\ 204{,}8$
      antwoord: |-
        exponentieel: $y = 500 \cdot 0{,}8^x$
      uitwerking: |-
        De verschillen ($-100$, $-80$, $-64$, $-51{,}2$) zijn niet constant, de verhoudingen wel: telkens $0{,}8$. Met $y = 500$ voor $x = 0$: $y = 500 \cdot 0{,}8^x$.
    - opgave: |-
        $0,\ 0{,}5,\ 2,\ 4{,}5,\ 8$
      antwoord: |-
        macht: $y = 0{,}5\,x^2$
      uitwerking: |-
        De verschillen $0{,}5$; $1{,}5$; $2{,}5$; $3{,}5$ zijn niet constant, en een verhouding met $0$ bestaat niet. Maar $\frac{y}{x^2} = 0{,}5$ voor $x = 1, 2, 3, 4$: $y = 0{,}5\,x^2$. (De tweede verschillen zijn constant $1$, zoals bij elke kwadratische formule.)

- id: h2-residu
  soort: kort
  opgave: |-
    Voor de punten $(1, 3)$, $(2, 4)$, $(3, 4)$, $(4, 6)$, $(5, 8)$ stellen twee leerlingen een rechte voor: $y = x + 2$ en $y = 1{,}5x$. Bereken voor elke rechte de residuen en de kwadratensom. Welke rechte past het best?
  antwoord: |-
    $0, 0, -1, 0, 1$ en $S = 2$; $1{,}5;\ 1;\ -0{,}5;\ 0;\ 0{,}5$ en $S = 3{,}75$; $y = x + 2$
  uitwerking: |-
    Voor $y = x + 2$ zijn de voorspellingen $3, 4, 5, 6, 7$: residuen $0, 0, -1, 0, 1$ en $S = 0 + 0 + 1 + 0 + 1 = 2$. Voor $y = 1{,}5x$ zijn de voorspellingen $1{,}5;\ 3;\ 4{,}5;\ 6;\ 7{,}5$: residuen $1{,}5;\ 1;\ -0{,}5;\ 0;\ 0{,}5$ en $S = 2{,}25 + 1 + 0{,}25 + 0 + 0{,}25 = 3{,}75$. De rechte $y = x + 2$ heeft de kleinste kwadratensom en past dus het best van de twee.

- id: h2-besteb
  soort: kort
  opgave: |-
    Neem de punten uit oefening~\ref{oef:h2-residu}.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke rechte met richtingscoëfficiënt $1{,}5$ past het best? Bereken haar kwadratensom.
      antwoord: |-
        $y = 1{,}5x + 0{,}5$; $S = 2{,}5$
      uitwerking: |-
        Het gemiddelde punt is $(3, 5)$, dus $b = 5 - 1{,}5 \cdot 3 = 0{,}5$. Residuen van $y = 1{,}5x + 0{,}5$: $1;\ 0{,}5;\ -1;\ -0{,}5;\ 0$, en $S = 1 + 0{,}25 + 1 + 0{,}25 + 0 = 2{,}5$, kleiner dan de $3{,}75$ van $y = 1{,}5x$.
    - opgave: |-
        Is $y = x + 2$ de beste rechte met richtingscoëfficiënt $1$?
      antwoord: |-
        ja
      uitwerking: |-
        Ja: $b = 5 - 1 \cdot 3 = 2$. De rechte gaat door het gemiddelde punt $(3, 5)$.

- id: h2-helling
  soort: kort
  opgave: |-
    Bepaal de kleinste-kwadratenrechte voor de punten $(1, 2)$, $(2, 2)$, $(3, 4)$, $(4, 5)$, $(5, 7)$.
  antwoord: |-
    $y = 1{,}3x + 0{,}1$
  uitwerking: |-
    $\xbar = 3$, $\ybar = 4$. Afwijkingen $x$: $-2, -1, 0, 1, 2$; $y$: $-2, -2, 0, 1, 3$. Producten $4, 2, 0, 1, 6$, samen $13$; $\sum(x_i - \xbar)^2 = 10$. Dus $a = \frac{13}{10} = 1{,}3$ en $b = 4 - 1{,}3 \cdot 3 = 0{,}1$: $y = 1{,}3x + 0{,}1$.

- id: h2-controle
  soort: kort
  opgave: |-
    Voor de punten $(0, 1)$, $(2, 2)$, $(4, 6)$, $(6, 7)$ zijn enkele rechten voorgesteld.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon zonder de formule voor $a$ aan dat $y = 1{,}1x + 0{,}8$ niet de kleinste-kwadratenrechte is.
      antwoord: |-
        som van de residuen $-0{,}4 \neq 0$
      uitwerking: |-
        $\sum r_i = \sum y_i - 1{,}1\sum x_i - 4 \cdot 0{,}8 = 16 - 13{,}2 - 3{,}2 = -0{,}4 \neq 0$. Ook: het gemiddelde punt $(3, 4)$ ligt niet op de rechte, want $1{,}1 \cdot 3 + 0{,}8 = 4{,}1$.
    - opgave: |-
        De rechte $y = 1{,}2x + 0{,}4$ gaat door $(3, 4)$, en haar residuen hebben som $0$. Is zij dus de kleinste-kwadratenrechte?
      antwoord: |-
        nee
      uitwerking: |-
        Nee. De eigenschap kan alleen een fout opsporen: elke rechte door $(3, 4)$ heeft residuen met som $0$. De formule geeft een andere richtingscoëfficiënt (zie c).
    - opgave: |-
        Bepaal de kleinste-kwadratenrechte.
      antwoord: |-
        $y = 1{,}1x + 0{,}7$
      uitwerking: |-
        Afwijkingen $x$: $-3, -1, 1, 3$; $y$: $-3, -2, 2, 3$. Producten $9, 2, 2, 9$, samen $22$; $\sum(x_i - \xbar)^2 = 20$. Dus $a = 1{,}1$ en $b = 4 - 3{,}3 = 0{,}7$.

- id: h2-rgrenzen
  soort: kort
  opgave: |-
    De kwadratensom van de kleinste-kwadratenrechte.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor tien metingen is $\sum (y_i - \ybar)^2 = 50$ en $r = 0{,}9$. Bereken de kwadratensom van de kleinste-kwadratenrechte.
      antwoord: |-
        $9{,}5$
      uitwerking: |-
        $S_{\min} = (1 - 0{,}81) \cdot 50 = 0{,}19 \cdot 50 = 9{,}5$.
    - opgave: |-
        Voor welke waarden van $r$ is die kwadratensom $0$? Wat betekent dat voor de punten?
      antwoord: |-
        $r = 1$ of $r = -1$; alle punten op één rechte
      uitwerking: |-
        $(1 - r^2) \sum (y_i - \ybar)^2 = 0$ met $\sum (y_i - \ybar)^2 > 0$ geeft $r^2 = 1$, dus $r = \pm 1$. Alle residuen zijn dan $0$: de punten liggen op één rechte.
    - opgave: |-
        Een leerling vindt $r = 0$. Welke rechte is dan de kleinste-kwadratenrechte, en wat is haar kwadratensom?
      antwoord: |-
        $y = \ybar$; $\sum (y_i - \ybar)^2$
      uitwerking: |-
        Bij $r = 0$ is de teller $\sum (x_i - \xbar)(y_i - \ybar) = 0$, dus ook $a = 0$ en $b = \ybar$: de horizontale rechte $y = \ybar$. Haar kwadratensom is $(1 - 0) \sum (y_i - \ybar)^2$: de rechte verklaart niets van de spreiding.

- id: h2-macht
  soort: kort
  opgave: |-
    Je weegt stalen knikkers met diameter $d$ (in mm): voor $d = 10$; $12$; $15$; $20$; $25$ is de massa $m = 4{,}1$; $7{,}1$; $13{,}9$; $32{,}9$; $64{,}2$ g. Je vermoedt $m = c \cdot d^k$. Bepaal $k$ en $c$ met een kleinste-kwadratenrechte. Welke $k$ verwacht je, en waarom?
  antwoord: |-
    $k \approx 3{,}00$; $c \approx 0{,}0041$ g/mm$^3$; de massa volgt het volume
  uitwerking: |-
    Zet $\ln m$ uit tegen $\ln d$. $\ln d$: $2{,}303$; $2{,}485$; $2{,}708$; $2{,}996$; $3{,}219$. $\ln m$: $1{,}411$; $1{,}960$; $2{,}632$; $3{,}493$; $4{,}162$. Gemiddelden $2{,}742$ en $2{,}732$, $\sum (X_i - \overline{X})^2 \approx 0{,}552$ en $\sum (X_i - \overline{X})(Y_i - \overline{Y}) \approx 1{,}657$. Dus $k \approx \frac{1{,}657}{0{,}552} \approx 3{,}00$ en $\ln c \approx 2{,}732 - 3{,}00 \cdot 2{,}742 \approx -5{,}50$, zodat $c \approx \e^{-5{,}50} \approx 0{,}0041$. Dat $k = 3$ is, verwacht je: de massa is evenredig met het volume van een bol, $\frac{\pi}{6}d^3$.

- id: h2-inter
  soort: kort
  opgave: |-
    Voor tweedehandse smartphones van $1$ tot $4$ jaar oud vind je het model $p = -70t + 380$, met $p$ de prijs in euro en $t$ de leeftijd in jaar. Bereken de voorspelling. Is het interpoleren of extrapoleren? Vertrouw je ze?
  lijst: enumerate
  delen:
    - opgave: |-
        $t = 2{,}5$
      antwoord: |-
        $205$ euro; interpoleren; ja
      uitwerking: |-
        $p = -175 + 380 = 205$ euro. Interpoleren: $2{,}5$ ligt tussen $1$ en $4$. Betrouwbaar.
    - opgave: |-
        $t = 6$
      antwoord: |-
        $-40$ euro; extrapoleren; nee
      uitwerking: |-
        $p = -420 + 380 = -40$ euro. Extrapoleren, en een negatieve prijs kan niet: buiten de metingen klopt het model niet meer.
    - opgave: |-
        $t = 0$
      antwoord: |-
        $380$ euro; extrapoleren; onzeker
      uitwerking: |-
        $p = 380$ euro. Ook extrapoleren, al ligt $t = 0$ dicht bij de metingen. Een nieuwe smartphone verliest in het eerste jaar vaak meer waarde dan later, dus de echte nieuwprijs kan hoger liggen.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    een rechte bepalen
  opgave: |-
    Bepaal de kleinste-kwadratenrechte voor $(2, 3)$, $(4, 7)$, $(6, 8)$, $(8, 12)$. Voorspel $y$ voor ${x = 5}$.
  antwoord: |-
    $y = 1{,}4x + 0{,}5$; $7{,}5$
  uitwerking: |-
    $\xbar = 5$, $\ybar = 7{,}5$. $\sum(x - \xbar)(y - \ybar) = (-3)(-4{,}5) + (-1)(-0{,}5) + 1 \cdot 0{,}5 + 3 \cdot 4{,}5 = 28$, $\sum(x - \xbar)^2 = 20$. $a = 1{,}4$, $b = 7{,}5 - 7 = 0{,}5$. Voor $x = 5$: $7{,}5$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    een model kiezen
  opgave: |-
    Welk model past het best, en hoe maak je het lineair?
  lijst: enumerate
  delen:
    - opgave: |-
        Het aantal bacteriën verdubbelt ongeveer elk uur.
      antwoord: |-
        exponentieel; $\ln N$ tegen $t$
      uitwerking: |-
        Verdubbelen bij elke gelijke tijdstap is exponentieel: $N = N_0 \cdot 2^t$. Dan is $\ln N = \ln N_0 + t\ln 2$: zet $\ln N$ uit tegen $t$, en verwacht een rechte met richtingscoëfficiënt $\ln 2 \approx 0{,}69$.
    - opgave: |-
        De remafstand van een auto hangt af van het kwadraat van de snelheid.
      antwoord: |-
        macht; $s$ tegen $v^2$
      uitwerking: |-
        Een macht: $s = c v^2$. Met $u = v^2$ is $s = cu$: zet $s$ uit tegen $v^2$, en verwacht een rechte door de oorsprong met richtingscoëfficiënt $c$.
    - opgave: |-
        De prijs van een taxirit: een vast bedrag plus een prijs per km.
      antwoord: |-
        lineair
      uitwerking: |-
        Al lineair: $p = a \cdot x + b$, met $a$ de prijs per km en $b$ het vaste bedrag. Je hoeft niets te transformeren.

- id: h2-o3
  soort: opdracht
  niveau: 2
  thema: |-
    residuen
  opgave: |-
    Voor de punten uit voorbeeld~\ref{vb:h2-rechte} is de rechte $y = 0{,}6x + 2{,}2$. Bereken de vijf residuen en hun som. Wat valt op?
  antwoord: |-
    $-0{,}8$; $0{,}6$; $1$; $-0{,}6$; $-0{,}2$; som $0$
  uitwerking: |-
    Voorspellingen $2{,}8$; $3{,}4$; $4{,}0$; $4{,}6$; $5{,}2$. Residuen $-0{,}8$; $0{,}6$; $1{,}0$; $-0{,}6$; $-0{,}2$. De som is $0$: dat geldt altijd voor de kleinste-kwadratenrechte, omdat ze door $(\xbar, \ybar)$ gaat.

- id: h2-o4
  soort: opdracht
  niveau: 2
  thema: |-
    een eigen experiment
  opgave: |-
    Ontwerp een experiment dat je thuis kunt doen, met een verband dat je wiskundig wilt beschrijven (bijvoorbeeld: de hoogte van een stuiterende bal na elke bots, of de tijd om een fles leeg te laten lopen). Beschrijf: wat meet je, hoe vaak, welk model verwacht je, en hoe controleer je het.
  antwoord: |-
    open
  uitwerking: |-
    Bijvoorbeeld de stuiterbal: meet de hoogte na elke bots (minstens 5 bonsen, met een filmpje naast een meetlat). Verwacht model: elke keer dezelfde fractie, $h_n = h_0 \cdot q^n$. Controle: zet $\ln h_n$ uit tegen $n$ en kijk of de punten op een rechte liggen; bekijk de residuen.

- id: h2-o5
  soort: opdracht
  niveau: 3
  thema: |-
    de formule afleiden
  opgave: |-
    Neem eenvoudigheidshalve punten met $\xbar = 0$. Toon aan dat de som $S(a, b) = \sum (y_i - ax_i - b)^2$ minimaal is voor $b = \ybar$ en $a = \frac{\sum x_iy_i}{\sum x_i^2}$. Tip: beschouw $S$ eerst als functie van $b$ alleen (een parabool), daarna als functie van $a$.
  antwoord: |-
    bewijs
  uitwerking: |-
    Als functie van $b$: $S = nb^2 - 2b\sum(y_i - ax_i) + \ldots$, een dalparabool met top in $b = \frac1n\sum(y_i - ax_i) = \ybar - a\xbar = \ybar$. Als functie van $a$ (met $b = \ybar$): $S = a^2\sum x_i^2 - 2a\sum x_i(y_i - \ybar) + \ldots$, met top in $a = \frac{\sum x_i(y_i - \ybar)}{\sum x_i^2} = \frac{\sum x_iy_i}{\sum x_i^2}$ (want $\sum x_i = 0$). Dat is de formule uit het kader met $\xbar = 0$.

- id: h2-o6
  soort: opdracht
  niveau: 3
  thema: |-
    een gebogen verband
  opgave: |-
    De punten $(1, 1)$, $(2, 4)$, $(3, 9)$, $(4, 16)$, $(5, 25)$ liggen op een parabool. Bereken $r$. Is een hoge $r$ een bewijs voor een lineair verband? Wat tonen de residuen van de kleinste-kwadratenrechte?
  antwoord: |-
    $r \approx 0{,}98$; nee; residuen $+$, $-$, $-$, $-$, $+$
  uitwerking: |-
    $\xbar = 3$, $\ybar = 11$, $\sum(x - \xbar)(y - \ybar) = 60$, $\sum(x - \xbar)^2 = 10$, $\sum(y - \ybar)^2 = 374$: $r = \frac{60}{\sqrt{3740}} \approx 0{,}98$. De rechte is $y = 6x - 7$, met residuen $2$, $-1$, $-2$, $-1$, $2$: een duidelijk patroon, dus het lineaire model past niet, ondanks de hoge $r$.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    kleinste-kwadratenrechte en $r$ berekenen
  opgave: |-
    Bepaal de kleinste-kwadratenrechte en de correlatiecoëfficiënt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(1, 3)$, $(2, 5)$, $(3, 6)$, $(4, 8)$
      antwoord: |-
        $y = 1{,}6x + 1{,}5$; $r \approx 0{,}99$
      uitwerking: |-
        $\xbar = 2{,}5$, $\ybar = 5{,}5$. Afwijkingen $x$: $-1{,}5$; $-0{,}5$; $0{,}5$; $1{,}5$; $y$: $-2{,}5$; $-0{,}5$; $0{,}5$; $2{,}5$. Som van de producten $3{,}75 + 0{,}25 + 0{,}25 + 3{,}75 = 8$, $\sum(x_i - \xbar)^2 = 5$, $\sum(y_i - \ybar)^2 = 13$. $a = \frac85 = 1{,}6$, $b = 5{,}5 - 1{,}6 \cdot 2{,}5 = 1{,}5$, $r = \frac{8}{\sqrt{65}} \approx 0{,}99$.
    - opgave: |-
        $(0, 10)$, $(2, 7)$, $(4, 5)$, $(6, 2)$
      antwoord: |-
        $y = -1{,}3x + 9{,}9$; $r \approx -0{,}997$
      uitwerking: |-
        $\xbar = 3$, $\ybar = 6$. Afwijkingen $x$: $-3, -1, 1, 3$; $y$: $4, 1, -1, -4$. Som van de producten $-26$, $\sum(x_i - \xbar)^2 = 20$, $\sum(y_i - \ybar)^2 = 34$. $a = \frac{-26}{20} = -1{,}3$, $b = 6 + 1{,}3 \cdot 3 = 9{,}9$, $r = \frac{-26}{\sqrt{680}} \approx -0{,}997$.
    - opgave: |-
        $(1, 2)$, $(3, 3)$, $(5, 7)$, $(7, 8)$, $(9, 10)$
      antwoord: |-
        $y = 1{,}05x + 0{,}75$; $r \approx 0{,}98$
      uitwerking: |-
        $\xbar = 5$, $\ybar = 6$. Afwijkingen $x$: $-4, -2, 0, 2, 4$; $y$: $-4, -3, 1, 2, 4$. Som van de producten $16 + 6 + 0 + 4 + 16 = 42$, $\sum(x_i - \xbar)^2 = 40$, $\sum(y_i - \ybar)^2 = 46$. $a = \frac{42}{40} = 1{,}05$, $b = 6 - 1{,}05 \cdot 5 = 0{,}75$, $r = \frac{42}{\sqrt{1840}} \approx 0{,}98$.
    - opgave: |-
        $(10, 52)$, $(20, 47)$, $(30, 45)$, $(40, 38)$, $(50, 33)$
      antwoord: |-
        $y = -0{,}47x + 57{,}1$; $r \approx -0{,}99$
      uitwerking: |-
        $\xbar = 30$, $\ybar = 43$. Afwijkingen $x$: $-20, -10, 0, 10, 20$; $y$: $9, 4, 2, -5, -10$. Som van de producten $-180 - 40 + 0 - 50 - 200 = -470$, $\sum(x_i - \xbar)^2 = 1000$, $\sum(y_i - \ybar)^2 = 226$. $a = -0{,}47$, $b = 43 + 0{,}47 \cdot 30 = 57{,}1$, $r = \frac{-470}{\sqrt{226\,000}} \approx -0{,}99$.

- id: h2-o8
  soort: opdracht
  niveau: 1
  thema: |-
    correlatie aflezen
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.4cm,y=.4cm,font=\scriptsize]
        \foreach \dx/\dy/\nm in {0/6/A,5.6/6/B,0/0/C,5.6/0/D}{
          \draw[grijs] (\dx,\dy+4.5) -- (\dx,\dy) -- (\dx+4.5,\dy);
          \node[above] at (\dx+2.25,\dy+4.4) {\nm};}
        \foreach \x/\y in {.5/.8,1/1.2,1.5/1.5,2/2.4,2.5/2.4,3/3,3.5/3.3,4/3.9}{\fill[accent] (\x,\y+6) circle (1.5pt);}
        \foreach \x/\y in {.5/3.6,1/3.9,1.5/2.8,2/3,2.5/2,3/2.3,3.5/1.2,4/1.5}{\fill[accent] (\x+5.6,\y+6) circle (1.5pt);}
        \foreach \x/\y in {.5/2,1/3.5,1.5/1,2/3,2.5/2.2,3/1.2,3.5/3.4,4/2}{\fill[accent] (\x,\y) circle (1.5pt);}
        \foreach \x/\y in {.5/1,1/2.6,1.5/1.4,2/2,2.5/3.4,3/1.6,3.5/3,4/2.8}{\fill[accent] (\x+5.6,\y) circle (1.5pt);}
      \end{tikzpicture}
  opgave: |-
    Welke correlatiecoëfficiënt hoort bij welk spreidingsdiagram? Kies uit $-0{,}93$; $-0{,}02$; $0{,}57$ en $0{,}99$.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        A
      antwoord: |-
        $0{,}99$
      uitwerking: |-
        Stijgend, en de punten liggen bijna op een rechte: $r = 0{,}99$.
    - opgave: |-
        B
      antwoord: |-
        $-0{,}93$
      uitwerking: |-
        Dalend, met de punten vrij dicht bij een rechte: $r = -0{,}93$.
    - opgave: |-
        C
      antwoord: |-
        $-0{,}02$
      uitwerking: |-
        Geen stijgende of dalende trend: $r \approx 0$, dus $-0{,}02$.
    - opgave: |-
        D
      antwoord: |-
        $0{,}57$
      uitwerking: |-
        Licht stijgend, maar met veel spreiding rond de rechte: $r = 0{,}57$.

- id: h2-o9
  soort: opdracht
  niveau: 1
  thema: |-
    een model interpreteren
  opgave: |-
    Een leerling hangt gewichten van $0$ tot $500$ g aan een veer en meet telkens de lengte. De kleinste-kwadratenrechte is $L = 0{,}042\,m + 12{,}0$, met $m$ de massa in g en $L$ de lengte in cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat betekenen de getallen $0{,}042$ en $12{,}0$ in deze context?
      antwoord: |-
        $0{,}042$ cm per g extra; $12{,}0$ cm zonder gewicht
      uitwerking: |-
        $0{,}042$ is de richtingscoëfficiënt: per gram extra wordt de veer $0{,}042$ cm langer, of $4{,}2$ cm per $100$ g. $12{,}0$ is de lengte voor $m = 0$: de veer zonder gewicht.
    - opgave: |-
        Voorspel de lengte bij $250$ g.
      antwoord: |-
        $22{,}5$ cm
      uitwerking: |-
        $L = 0{,}042 \cdot 250 + 12{,}0 = 10{,}5 + 12{,}0 = 22{,}5$ cm. Dat is interpoleren: $250$ g ligt tussen de metingen.
    - opgave: |-
        Wat voorspelt het model bij $5$ kg? Vertrouw je die voorspelling?
      antwoord: |-
        $222$ cm; nee, extrapolatie
      uitwerking: |-
        $L = 0{,}042 \cdot 5000 + 12{,}0 = 222$ cm. Dat is ver buiten de metingen (tot $500$ g): de veer kan vervormen of breken, en het lineaire verband geldt alleen voor kleine uitrekkingen. Niet vertrouwen.
    - opgave: |-
        Welke massa geeft volgens het model een lengte van $30$ cm?
      antwoord: |-
        ongeveer $430$ g
      uitwerking: |-
        $0{,}042\,m + 12{,}0 = 30$ geeft $m = \frac{18}{0{,}042} \approx 429$, dus ongeveer $430$ g.

- id: h2-o10
  soort: opdracht
  niveau: 1
  thema: |-
    een model kiezen uit een tabel
  opgave: |-
    Voor $x = 1, 2, 3, 4, 5$ vind je deze waarden van $y$. Is het verband lineair, exponentieel of van de vorm $y = c \cdot x^2$? Geef het voorschrift.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2,\ 5,\ 8,\ 11,\ 14$
      antwoord: |-
        lineair: $y = 3x - 1$
      uitwerking: |-
        De verschillen zijn constant $3$: lineair, $y = 3x + b$ met $2 = 3 + b$, dus $y = 3x - 1$.
    - opgave: |-
        $3,\ 6,\ 12,\ 24,\ 48$
      antwoord: |-
        exponentieel: $y = 1{,}5 \cdot 2^x$
      uitwerking: |-
        De verhoudingen zijn constant $2$: exponentieel, $y = c \cdot 2^x$ met $3 = 2c$, dus $y = 1{,}5 \cdot 2^x$.
    - opgave: |-
        $2,\ 8,\ 18,\ 32,\ 50$
      antwoord: |-
        $y = 2x^2$
      uitwerking: |-
        Verschillen ($6, 10, 14, 18$) en verhoudingen zijn niet constant, maar $\frac{y}{x^2} = 2$ telkens: $y = 2x^2$.
    - opgave: |-
        $80,\ 40,\ 20,\ 10,\ 5$
      antwoord: |-
        exponentieel: $y = 160 \cdot 0{,}5^x$
      uitwerking: |-
        De verhoudingen zijn constant $\frac12$: exponentieel verval, $y = c \cdot 0{,}5^x$ met $80 = 0{,}5\,c$, dus $y = 160 \cdot 0{,}5^x$.

- id: h2-o11
  soort: opdracht
  niveau: 1
  thema: |-
    correlatie en oorzaak
  opgave: |-
    Het verband is echt, maar het besluit volgt niet. Geef een betere verklaring.
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{In gemeenten met meer bibliotheken worden meer misdrijven geregistreerd. Bibliotheken trekken dus criminaliteit aan.}
      antwoord: |-
        derde factor: het aantal inwoners
      uitwerking: |-
        Een derde factor verklaart beide: grote gemeenten hebben meer bibliotheken én meer misdrijven. Vergelijk per $1000$ inwoners.
    - opgave: |-
        \textit{Wie vaker naar de huisarts gaat, is vaker ziek. Naar de huisarts gaan maakt dus ziek.}
      antwoord: |-
        omgekeerde richting
      uitwerking: |-
        De oorzaak loopt andersom: wie ziek is, gaat naar de huisarts.
    - opgave: |-
        \textit{Op dagen waarop meer paraplu's verkocht worden, staan er meer files. Paraplu's veroorzaken files.}
      antwoord: |-
        derde factor: regen
      uitwerking: |-
        Regen verklaart beide: bij regen kopen mensen paraplu's, en rijden ze trager en vaker met de auto.

- id: h2-o12
  soort: opdracht
  niveau: 1
  thema: |-
    lineariseren
  opgave: |-
    Wat zet je uit tegen wat om een rechte te krijgen? Geef de richtingscoëfficiënt van die rechte.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = 5 \cdot 1{,}2^x$
      antwoord: |-
        $\ln y$ tegen $x$; $\ln 1{,}2 \approx 0{,}18$
      uitwerking: |-
        $\ln y = \ln 5 + x \ln 1{,}2$: een rechte in $x$ met richtingscoëfficiënt $\ln 1{,}2 \approx 0{,}18$ en snijpunt $\ln 5 \approx 1{,}61$.
    - opgave: |-
        $y = \dfrac{3}{x}$
      antwoord: |-
        $y$ tegen $\frac1x$; $3$
      uitwerking: |-
        Met $u = \frac1x$ is $y = 3u$: een rechte door de oorsprong met richtingscoëfficiënt $3$.
    - opgave: |-
        $y = 2\sqrt{x}$
      antwoord: |-
        $y$ tegen $\sqrt{x}$; $2$
      uitwerking: |-
        Met $u = \sqrt{x}$ is $y = 2u$: richtingscoëfficiënt $2$.
    - opgave: |-
        $y = 0{,}5\,x^3$
      antwoord: |-
        $y$ tegen $x^3$; $0{,}5$
      uitwerking: |-
        Met $u = x^3$ is $y = 0{,}5\,u$: richtingscoëfficiënt $0{,}5$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    een lineair model in context
  opgave: |-
    Je kijkt video's op een smartphone en noteert het batterijpercentage $B$ na $t$ minuten.
    \figuren{\renewcommand{\arraystretch}{1.2}%
    \begin{tabular}{c|cccccc}
    $t$ (min) & $0$ & $30$ & $60$ & $90$ & $120$ & $150$ \\ \hline
    $B$ (\%) & $100$ & $91$ & $83$ & $74$ & $65$ & $57$
    \end{tabular}}
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de kleinste-kwadratenrechte.
      antwoord: |-
        $B \approx -0{,}288\,t + 99{,}9$
      uitwerking: |-
        $\overline{t} = 75$, $\overline{B} = 78{,}33$. Afwijkingen $t$: $-75, -45, -15, 15, 45, 75$, met $\sum(t_i - \overline{t})^2 = 15\,750$. $\sum(t_i - \overline{t})(B_i - \overline{B}) = -4530$. Dus $a = \frac{-4530}{15\,750} \approx -0{,}288$ en $b = 78{,}33 + 0{,}288 \cdot 75 \approx 99{,}9$.
    - opgave: |-
        Bereken $r$. Past een lineair model?
      antwoord: |-
        $r \approx -1{,}00$; ja
      uitwerking: |-
        $\sum(B_i - \overline{B})^2 \approx 1303{,}3$, dus $r = \frac{-4530}{\sqrt{15\,750 \cdot 1303{,}3}} \approx -0{,}9998$. De residuen ($0{,}1$; $-0{,}3$; $0{,}4$; $0{,}0$; $-0{,}4$; $0{,}2$) tonen geen patroon: het lineaire model past goed.
    - opgave: |-
        Wanneer is de batterij volgens het model leeg?
      antwoord: |-
        na ongeveer $347$ min, bijna $6$ uur
      uitwerking: |-
        $-0{,}288\,t + 99{,}9 = 0$ geeft $t \approx 347$ minuten, ongeveer $5$ uur en $47$ minuten.
    - opgave: |-
        Waarom is die voorspelling onzeker?
      antwoord: |-
        extrapolatie
      uitwerking: |-
        Het model is alleen getest tot $57$\,\%. Bij een lage lading kan een batterij sneller leeglopen, en veel toestellen schakelen een spaarstand in. Dat is extrapoleren: meet verder om het na te gaan.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    exponentiële groei modelleren
  opgave: |-
    Een filmpje gaat rond op sociale media. Het totale aantal keer dat het bekeken is, $N$, na $t$ dagen:
    \figuren{\renewcommand{\arraystretch}{1.2}%
    \begin{tabular}{c|cccccc}
    $t$ & $1$ & $2$ & $3$ & $4$ & $5$ & $6$ \\ \hline
    $N$ & $1200$ & $2100$ & $3500$ & $6100$ & $10\,300$ & $17\,800$
    \end{tabular}}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\ln N$ op drie decimalen. Waarom wijst dat op exponentiële groei?
      antwoord: |-
        $7{,}090$; $7{,}650$; $8{,}161$; $8{,}716$; $9{,}240$; $9{,}787$
      uitwerking: |-
        $\ln N$: $7{,}090$; $7{,}650$; $8{,}161$; $8{,}716$; $9{,}240$; $9{,}787$. De verschillen zijn ongeveer gelijk ($0{,}56$; $0{,}51$; $0{,}56$; $0{,}52$; $0{,}55$): $\ln N$ is ongeveer lineair in $t$, dus $N$ groeit exponentieel.
    - opgave: |-
        Bepaal de kleinste-kwadratenrechte van $\ln N$ tegen $t$.
      antwoord: |-
        $\ln N \approx 0{,}537\,t + 6{,}560$
      uitwerking: |-
        $\overline{t} = 3{,}5$, $\overline{\ln N} \approx 8{,}441$, $\sum(t_i - \overline{t})^2 = 17{,}5$ en $\sum(t_i - \overline{t})(\ln N_i - \overline{\ln N}) \approx 9{,}405$. Dus $a \approx \frac{9{,}405}{17{,}5} \approx 0{,}537$ en $b \approx 8{,}441 - 0{,}537 \cdot 3{,}5 \approx 6{,}560$, met $r \approx 1{,}00$.
    - opgave: |-
        Bepaal de groeifactor per dag en de verdubbelingstijd.
      antwoord: |-
        $g \approx 1{,}71$; ongeveer $1{,}3$ dag
      uitwerking: |-
        $\ln g = 0{,}537$, dus $g = \e^{0{,}537} \approx 1{,}71$: elke dag ongeveer $71$\,\% meer. Verdubbelen: $g^t = 2$ geeft $t = \frac{\ln 2}{0{,}537} \approx 1{,}3$ dag.
    - opgave: |-
        Wat voorspelt het model voor dag $10$? Kan het model zo blijven gelden?
      antwoord: |-
        ongeveer $150\,000$; nee
      uitwerking: |-
        $N = \e^{0{,}537 \cdot 10 + 6{,}560} = \e^{11{,}93} \approx 152\,000$, dus ongeveer $150\,000$. Op lange termijn kan het niet: het aantal kijkers is beperkt, en de interesse daalt. De groei zal afvlakken.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    een machtsverband: vrije val
  opgave: |-
    Je laat een balletje vallen van verschillende hoogtes $h$ (in m) en meet de valtijd $t$ (in s). De natuurkunde voorspelt $h = \frac{g}{2}t^2$.
    \figuren{\renewcommand{\arraystretch}{1.2}%
    \begin{tabular}{c|ccccc}
    $t$ & $0{,}20$ & $0{,}30$ & $0{,}40$ & $0{,}50$ & $0{,}60$ \\ \hline
    $h$ & $0{,}20$ & $0{,}44$ & $0{,}79$ & $1{,}23$ & $1{,}77$
    \end{tabular}}
  lijst: enumerate
  delen:
    - opgave: |-
        Wat zet je uit tegen wat om een rechte te krijgen? Welke richtingscoëfficiënt verwacht je?
      antwoord: |-
        $h$ tegen $t^2$; $\frac{g}{2}$
      uitwerking: |-
        Met $u = t^2$ is $h = \frac{g}{2}u$: een rechte door de oorsprong met richtingscoëfficiënt $\frac{g}{2}$.
    - opgave: |-
        Bepaal de kleinste-kwadratenrechte.
      antwoord: |-
        $h \approx 4{,}91\,t^2 + 0{,}002$
      uitwerking: |-
        $u = t^2$: $0{,}04$; $0{,}09$; $0{,}16$; $0{,}25$; $0{,}36$, met $\overline{u} = 0{,}18$ en $\overline{h} = 0{,}886$. $\sum(u_i - \overline{u})^2 = 0{,}0654$ en $\sum(u_i - \overline{u})(h_i - \overline{h}) = 0{,}3213$. Dus $a = \frac{0{,}3213}{0{,}0654} \approx 4{,}91$ en $b = 0{,}886 - 4{,}91 \cdot 0{,}18 \approx 0{,}002$: bijna door de oorsprong.
    - opgave: |-
        Bepaal $g$.
      antwoord: |-
        $g \approx 9{,}8$ m/s$^2$
      uitwerking: |-
        $\frac{g}{2} \approx 4{,}91$, dus $g \approx 9{,}8$ m/s$^2$.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    een model beoordelen met residuen
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.1cm,y=.75cm,font=\scriptsize]
        \draw[black!14,very thin] (0,-1.5) grid[xstep=5,ystep=.5] (40,1.5);
        \draw[grijs,->] (0,0) -- (42,0) node[right,text=black] {$v$};
        \draw[grijs,->] (0,-1.5) -- (0,1.9) node[above,text=black] {residu (m)};
        \foreach \t in {10,20,30}{\node[below,inner sep=1.5pt] at (\t,-1.5) {$\t$};}
        \foreach \t in {-1,1}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \foreach \x/\y in {10/1.167,15/-.233,20/-.933,25/-.933,30/-.233,35/1.167}{\fill[accent] (\x,\y) circle (2pt);}
      \end{tikzpicture}
  opgave: |-
    Voor de remafstand $s$ (in m) van een fiets bij snelheid $v$ (in km/h) vond een leerling met zes metingen tussen $10$ en $35$ km/h de rechte $s = 0{,}66\,v - 5{,}67$, met $r = 0{,}988$. Ze besluit: \textit{het verband is lineair, en bij $50$ km/h is de remafstand $27$ m.} De figuur toont de residuen.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat tonen de residuen?
      antwoord: |-
        een patroon: $+$, $-$, $-$, $-$, $-$, $+$
      uitwerking: |-
        Aan de randen positief, in het midden negatief: een systematisch patroon. De punten liggen op een kromme die naar boven buigt, ondanks de hoge $r$.
    - opgave: |-
        Met $s$ uitgezet tegen $v^2$ vind je $s = 0{,}0146\,v^2 + 0{,}70$ met $r = 0{,}9999$. Welk model kies je, en waarom past dat ook bij de natuurkunde?
      antwoord: |-
        $s$ evenredig met $v^2$
      uitwerking: |-
        Het kwadratische model: $r$ is nog hoger en de residuen zijn veel kleiner (allemaal onder $0{,}07$ m). Het past bij de natuurkunde: de bewegingsenergie, en dus de remweg bij een vaste remkracht, is evenredig met $v^2$.
    - opgave: |-
        Wat is er mis met haar voorspelling bij $50$ km/h?
      antwoord: |-
        verkeerd model en extrapolatie; eerder $37$ m
      uitwerking: |-
        Twee problemen. Het lineaire model past niet, en $50$ km/h ligt buiten de metingen. Het kwadratische model geeft $0{,}0146 \cdot 2500 + 0{,}70 \approx 37$ m, tien meter meer. Ook dat is extrapolatie: vermeld het als een schatting.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten bij regressie
  opgave: |-
    Waar zit de fout?
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{De richtingscoëfficiënt is $a = \dfrac{\sum(x_i - \xbar)(y_i - \ybar)}{\sum(y_i - \ybar)^2}$.}
      antwoord: |-
        de noemer is $\sum(x_i - \xbar)^2$
      uitwerking: |-
        In de noemer staat $\sum(x_i - \xbar)^2$: je deelt door de spreiding van $x$, niet van $y$.
    - opgave: |-
        \textit{De correlatiecoëfficiënt is $r = 1{,}3$: een zeer sterk verband.}
      antwoord: |-
        $r$ ligt altijd tussen $-1$ en $1$
      uitwerking: |-
        Dat kan niet: $-1 \leqslant r \leqslant 1$. Er zit een rekenfout in, bijvoorbeeld een vergeten vierkantswortel in de noemer.
    - opgave: |-
        \textit{Het snijpunt met de $y$-as is $b = \ybar - a\,\ybar$.}
      antwoord: |-
        $b = \ybar - a\,\xbar$
      uitwerking: |-
        Het is $b = \ybar - a\,\xbar$: de rechte gaat door het punt $(\xbar, \ybar)$.
    - opgave: |-
        \textit{De rechte $y = 0{,}02x + 5$ is bijna horizontaal, dus $r$ ligt dicht bij $0$.}
      antwoord: |-
        $a$ hangt af van de eenheden, $r$ niet
      uitwerking: |-
        De richtingscoëfficiënt hangt af van de eenheden: meet je $x$ in gram in plaats van kilogram, dan wordt $a$ duizend keer kleiner. $r$ hangt daar niet van af. Zo kunnen punten perfect op $y = 0{,}02x + 5$ liggen, met $r = 1$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    eenheden en de rol van $x$ en $y$
  opgave: |-
    Voor de punten uit voorbeeld~\ref{vb:h2-rechte} is $y = 0{,}6x + 2{,}2$ en $r \approx 0{,}77$. Wat worden $a$, $b$ en $r$ als je de gegevens zo verandert? Reken na of redeneer.
  lijst: enumerate
  delen:
    - opgave: |-
        Je drukt $x$ uit in meter in plaats van centimeter: elke $x_i$ wordt $100$ keer kleiner.
      antwoord: |-
        $a = 60$, $b = 2{,}2$, $r \approx 0{,}77$
      uitwerking: |-
        Alle afwijkingen van $x$ worden $100$ keer kleiner: de teller van $a$ wordt $100$ keer kleiner, de noemer $10\,000$ keer, dus $a = 60$. $b = \ybar - a\,\xbar = 4 - 60 \cdot 0{,}03 = 2{,}2$. In $r$ vallen de factoren weg: $r \approx 0{,}77$.
    - opgave: |-
        Je telt bij elke $y_i$ het getal $10$ op.
      antwoord: |-
        $a = 0{,}6$, $b = 12{,}2$, $r \approx 0{,}77$
      uitwerking: |-
        De afwijkingen $y_i - \ybar$ veranderen niet, dus $a$ en $r$ blijven. Alleen $\ybar$ wordt $14$, zodat $b = 14 - 0{,}6 \cdot 3 = 12{,}2$: de rechte schuift $10$ omhoog.
    - opgave: |-
        Je verwisselt $x$ en $y$. Is de nieuwe richtingscoëfficiënt $\frac{1}{0{,}6}$?
      antwoord: |-
        nee: $x = 1{,}0\,y - 1{,}0$, $r \approx 0{,}77$
      uitwerking: |-
        Nee. Nu deel je door $\sum(y_i - \ybar)^2 = 6$ in plaats van door $10$: $a = \frac{6}{6} = 1$ en $b = 3 - 1 \cdot 4 = -1$, dus $x = y - 1$, en niet $x = \frac{1}{0{,}6}y - \ldots \approx 1{,}67\,y - \ldots$ De kleinste-kwadratenrechte minimaliseert verticale afstanden: wisselen verandert welke afstanden dat zijn. $r$ blijft $0{,}77$.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    een macht met onbekende exponent
  opgave: |-
    Voor vijf planeten kennen we de gemiddelde afstand $d$ tot de zon (in astronomische eenheden) en de omlooptijd $T$ (in jaar). Je vermoedt een verband $T = c \cdot d^k$.
    \figuren{\renewcommand{\arraystretch}{1.2}%
    \begin{tabular}{c|ccccc}
    & Mercurius & Venus & Aarde & Mars & Jupiter \\ \hline
    $d$ & $0{,}387$ & $0{,}723$ & $1{,}000$ & $1{,}524$ & $5{,}203$ \\
    $T$ & $0{,}241$ & $0{,}615$ & $1{,}000$ & $1{,}881$ & $11{,}86$
    \end{tabular}}
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\ln T$ lineair afhangt van $\ln d$, en bereken $\ln d$ en $\ln T$ op drie decimalen.
      antwoord: |-
        $\ln T = \ln c + k \ln d$
      uitwerking: |-
        Neem de natuurlijke logaritme: $\ln T = \ln c + k \ln d$. Met $X = \ln d$ en $Y = \ln T$ is dat een rechte $Y = kX + \ln c$. $\ln d$: $-0{,}949$; $-0{,}324$; $0$; $0{,}421$; $1{,}649$. $\ln T$: $-1{,}423$; $-0{,}486$; $0$; $0{,}632$; $2{,}473$.
    - opgave: |-
        Bepaal $k$ en $c$ met een kleinste-kwadratenrechte.
      antwoord: |-
        $k \approx 1{,}50$; $c \approx 1{,}00$
      uitwerking: |-
        $\overline{X} \approx 0{,}159$, $\overline{Y} \approx 0{,}239$, $\sum(X_i - \overline{X})^2 \approx 3{,}775$ en $\sum(X_i - \overline{X})(Y_i - \overline{Y}) \approx 5{,}661$. Dus $k \approx \frac{5{,}661}{3{,}775} \approx 1{,}50$, en $\ln c \approx 0{,}239 - 1{,}50 \cdot 0{,}159 \approx 0{,}000$, zodat $c \approx 1{,}00$. Het model is $T = d^{1{,}5}$, of $T^2 = d^3$: de derde wet van Kepler.
    - opgave: |-
        Saturnus staat op $9{,}537$ AE van de zon. Voorspel zijn omlooptijd.
      antwoord: |-
        ongeveer $29{,}5$ jaar
      uitwerking: |-
        $T = 9{,}537^{1{,}5} \approx 29{,}5$ jaar. (De gemeten waarde is ongeveer $29{,}5$ jaar: een extrapolatie die hier wel lukt, omdat het model uit de natuurkunde volgt.)

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    twee modellen vergelijken
  opgave: |-
    Het aantal inwoners $P$ van een nieuwe woonwijk, $t$ jaar na de opening: $1000$; $1080$; $1170$; $1260$; $1360$; $1470$ voor $t = 0, 1, \ldots, 5$.
  lijst: enumerate
  delen:
    - opgave: |-
        De kleinste-kwadratenrechte is $P = 93{,}7\,t + 989$, met $r = 0{,}999$. Bereken de residuen. Wat valt op?
      antwoord: |-
        $11$; $-3$; $-6$; $-10$; $-4$; $12$: een patroon
      uitwerking: |-
        Voorspellingen: $989$; $1083$; $1176$; $1270$; $1364$; $1458$. Residuen (afgerond): $11$; $-3$; $-6$; $-10$; $-4$; $12$. Positief aan de randen, negatief in het midden: de groei versnelt, ondanks $r = 0{,}999$.
    - opgave: |-
        Stel een exponentieel model op met $\ln P$ tegen $t$. Wat is de groei per jaar?
      antwoord: |-
        $P \approx 1001 \cdot 1{,}080^t$; $8$\,\% per jaar
      uitwerking: |-
        $\ln P$: $6{,}908$; $6{,}985$; $7{,}065$; $7{,}139$; $7{,}215$; $7{,}293$. De kleinste-kwadratenrechte is $\ln P \approx 0{,}0769\,t + 6{,}908$, dus $g = \e^{0{,}0769} \approx 1{,}080$ en $P_0 = \e^{6{,}908} \approx 1001$. De residuen van dit model zijn hoogstens $3$ inwoners, zonder patroon. De wijk groeit met ongeveer $8$\,\% per jaar.
    - opgave: |-
        Vergelijk de voorspellingen van beide modellen voor $t = 10$. Welke verkies je, en welk voorbehoud maak je?
      antwoord: |-
        lineair $\approx 1926$, exponentieel $\approx 2159$
      uitwerking: |-
        Lineair: $93{,}7 \cdot 10 + 989 \approx 1926$. Exponentieel: $1001 \cdot 1{,}080^{10} \approx 2159$. Het exponentiële model past beter (kleinere residuen zonder patroon). Maar beide voorspellingen zijn extrapolaties: een wijk heeft een beperkt aantal woningen, dus de groei moet ooit afvlakken.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    eigenschappen van de rechte bewijzen
  opgave: |-
    Neem de kleinste-kwadratenrechte $y = ax + b$ van $n$ punten, met $b = \ybar - a\,\xbar$ zoals in het kader.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat de rechte door het punt $(\xbar, \ybar)$ gaat.
      antwoord: |-
        $a\,\xbar + b = \ybar$
      uitwerking: |-
        Vul $x = \xbar$ in: $a\,\xbar + b = a\,\xbar + \ybar - a\,\xbar = \ybar$.
    - opgave: |-
        Bewijs dat de som van de residuen $0$ is.
      antwoord: |-
        $\sum r_i = n\ybar - a n\xbar - nb = 0$
      uitwerking: |-
        $\sum r_i = \sum (y_i - ax_i - b) = \sum y_i - a\sum x_i - nb$. Met $\sum y_i = n\ybar$ en $\sum x_i = n\xbar$ is dat $n\ybar - an\xbar - n(\ybar - a\,\xbar) = 0$.
    - opgave: |-
        Volgt hieruit dat een model met kleine residuen altijd goed is? En dat een model waarvan de residuen samen $0$ zijn, altijd goed is?
      antwoord: |-
        nee, twee keer
      uitwerking: |-
        Nee. De som is voor elke kleinste-kwadratenrechte $0$, ook als het model slecht past (zoals bij de parabool in de opdracht over een gebogen verband): positieve en negatieve residuen heffen elkaar op. En kleine residuen binnen de metingen zeggen niets over extrapolatie. Kijk naar het patroon van de residuen, en naar de grenzen van het model.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Afgeleiden
  thema: |-
    een rechte door de oorsprong
  opgave: |-
    Bij de slinger zoek je een rechte $y = ax$ door de oorsprong. Toon met een afgeleide aan dat $S(a) = \sum(y_i - ax_i)^2$ minimaal is voor $a = \frac{\sum x_iy_i}{\sum x_i^2}$.
  antwoord: |-
    bewijs
  uitwerking: |-
    $S'(a) = \sum 2(y_i - ax_i)(-x_i) = -2\sum x_iy_i + 2a\sum x_i^2 = 0$ geeft $a = \frac{\sum x_iy_i}{\sum x_i^2}$. $S''(a) = 2\sum x_i^2 > 0$: een minimum.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: Statistiek
  thema: |-
    steekproefvariabiliteit
  opgave: |-
    Twee klassen meten elk dezelfde slinger en vinden $g = 9{,}7$ en $g = 9{,}9$ m/s$^2$. Waarom verschillen de resultaten? Hoe zou je een betrouwbaarder resultaat krijgen?
  antwoord: |-
    meetfouten; meer en nauwkeurigere metingen
  uitwerking: |-
    Elke meting heeft toevallige fouten (reactietijd bij de chronometer, aflezen van de lengte). Meer metingen, en telkens de tijd voor tien slingeringen meten en delen door tien, maken het gemiddelde betrouwbaarder (zie Statistiek: de standaardafwijking van een gemiddelde daalt met $\sqrt n$).

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    kleinste kwadraten
  opgave: |-
    Bepaal de kleinste-kwadratenrechte voor $(1, 1)$, $(2, 3)$, $(3, 2)$, $(4, 4)$, $(5, 5)$.
  antwoord: |-
    $y = 0{,}9x + 0{,}3$
  uitwerking: |-
    $\xbar = 3$, $\ybar = 3$. Afwijkingen $x$: $-2, -1, 0, 1, 2$; $y$: $-2, 0, -1, 1, 2$. $\sum$ producten $= 4 + 0 + 0 + 1 + 4 = 9$, $\sum(x - \xbar)^2 = 10$: $a = 0{,}9$, $b = 3 - 2{,}7 = 0{,}3$.

- id: h2-t2
  soort: test
  niveau: 2
  thema: |-
    lineariseren
  opgave: |-
    Een hoeveelheid medicijn in het bloed meet je om het uur: $100$; $80$; $64$; $51$; $41$ mg. Welk model vermoed je? Hoe controleer je het met een rechte? Schat de groeifactor per uur.
  antwoord: |-
    exponentieel; $\ln N$ tegen $t$; $g \approx 0{,}8$
  uitwerking: |-
    De verhoudingen zijn telkens ongeveer $0{,}8$: exponentieel verval $N = 100 \cdot 0{,}8^t$. Zet $\ln N$ uit tegen $t$: $4{,}61$; $4{,}38$; $4{,}16$; $3{,}93$; $3{,}71$, telkens ongeveer $-0{,}22 = \ln 0{,}8$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    valkuilen
  opgave: |-
    In een gemeente stijgen tussen 2015 en 2024 het aantal fietspaden en het aantal fietsongevallen samen ($r = 0{,}9$). Een krant schrijft: \textit{fietspaden veroorzaken ongevallen}. Geef twee redenen waarom dat besluit niet volgt.
  antwoord: |-
    correlatie is geen oorzaak; een derde factor
  uitwerking: |-
    Correlatie is geen oorzaak. Een derde factor kan beide verklaren: er wordt meer gefietst, dus komen er fietspaden én meer ongevallen. Beter is het aantal ongevallen per gefietste kilometer te vergelijken.

- id: h2-t4
  soort: test
  niveau: 2
  thema: |-
    een machtsverband
  opgave: |-
    Je meet de massa $m$ (in g) van pizza's met diameter $d$ (in cm), en vermoedt $m = c \cdot d^2$.
    \figuren{\renewcommand{\arraystretch}{1.2}%
    \begin{tabular}{c|cccc}
    $d$ & $20$ & $25$ & $30$ & $35$ \\ \hline
    $m$ & $310$ & $480$ & $700$ & $950$
    \end{tabular}}
  lijst: enumerate
  delen:
    - opgave: |-
        Ga met een tabel van $\frac{m}{d^2}$ na dat het model past, en schat $c$.
      antwoord: |-
        $\approx 0{,}775$; $0{,}768$; $0{,}778$; $0{,}776$; $c \approx 0{,}77$ g/cm$^2$
      uitwerking: |-
        $\frac{310}{400} = 0{,}775$, $\frac{480}{625} = 0{,}768$, $\frac{700}{900} \approx 0{,}778$, $\frac{950}{1225} \approx 0{,}776$. Bijna constant, dus het model past, met $c \approx 0{,}77$ g/cm$^2$. (Een rechte van $m$ tegen $d^2$ geeft hetzelfde: richtingscoëfficiënt $0{,}78$, bijna door de oorsprong.)
    - opgave: |-
        Voorspel de massa van een pizza met een diameter van $40$ cm.
      antwoord: |-
        ongeveer $1{,}2$ kg
      uitwerking: |-
        $m \approx 0{,}775 \cdot 40^2 = 1240$ g, ongeveer $1{,}2$ kg.

- id: h2-t5
  soort: test
  niveau: 1
  thema: |-
    residuen
  opgave: |-
    De kleinste-kwadratenrechte van $(0, 2)$, $(1, 3)$, $(2, 5)$, $(3, 4)$, $(4, 6)$ is $y = 0{,}9x + 2{,}2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de residuen en hun som.
      antwoord: |-
        $-0{,}2$; $-0{,}1$; $1{,}0$; $-0{,}9$; $0{,}2$; som $0$
      uitwerking: |-
        Voorspellingen $2{,}2$; $3{,}1$; $4{,}0$; $4{,}9$; $5{,}8$. Residuen $y_i - (0{,}9x_i + 2{,}2)$: $-0{,}2$; $-0{,}1$; $1{,}0$; $-0{,}9$; $0{,}2$. Som $0$, zoals altijd bij de kleinste-kwadratenrechte.
    - opgave: |-
        Welk punt ligt het verst van de rechte? Wijzen de residuen op een ander model?
      antwoord: |-
        $(2, 5)$; nee
      uitwerking: |-
        $(2, 5)$, met residu $1{,}0$. De tekens ($-$, $-$, $+$, $-$, $+$) vormen geen systematisch patroon: met zo weinig punten is er geen reden voor een ander model.

- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    een model gebruiken en zijn grenzen
  opgave: |-
    Voor tweedehandse fietsen van $1$ tot $6$ jaar oud vind je tussen de prijs $p$ (in euro) en de leeftijd $t$ (in jaar) de rechte $p = -45t + 420$, met $r = -0{,}93$.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat betekenen $-45$ en $420$ in deze context?
      antwoord: |-
        $45$ euro minder per jaar; $420$ euro voor een nieuwe fiets
      uitwerking: |-
        Per jaar is een fiets gemiddeld $45$ euro minder waard. $420$ is de prijs voor $t = 0$, een bijna nieuwe fiets; maar $t = 0$ ligt net buiten de metingen.
    - opgave: |-
        Schat de prijs van een fiets van $3$ jaar.
      antwoord: |-
        $285$ euro
      uitwerking: |-
        $p = -45 \cdot 3 + 420 = 285$ euro.
    - opgave: |-
        Wat voorspelt het model voor een fiets van $12$ jaar? Wat is er mis?
      antwoord: |-
        $-120$ euro; extrapolatie
      uitwerking: |-
        $p = -45 \cdot 12 + 420 = -120$ euro: een negatieve prijs kan niet. $12$ jaar ligt ver buiten de metingen; daar daalt de prijs trager, en blijft ze positief.
