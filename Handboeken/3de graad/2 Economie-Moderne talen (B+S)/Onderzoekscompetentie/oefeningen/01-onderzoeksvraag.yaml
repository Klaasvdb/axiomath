# Oefeningen van hoofdstuk 1. Zie oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken $1 + 2 + 3 + \cdots + 10$.
      antwoord: |-
        55
      uitwerking: |-
        $\frac{10 \cdot 11}{2} = 55$.
    - opgave: |-
        Bereken $5!$.
      antwoord: |-
        120
      uitwerking: |-
        $5 \cdot 4 \cdot 3 \cdot 2 \cdot 1$.
    - opgave: |-
        Geef de volgende term: $1, 4, 9, 16, \ldots$
      antwoord: |-
        25
      uitwerking: |-
        De kwadraten.
    - opgave: |-
        Geef de volgende term: $2, 3, 5, 8, 12, \ldots$
      antwoord: |-
        17
      uitwerking: |-
        De verschillen zijn $1, 2, 3, 4$; dan $5$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Op een feest geeft iedereen iedereen één keer een hand.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel handdrukken zijn er met 2, 3, 4 en 5 personen?
      antwoord: |-
        $1$; $3$; $6$; $10$
      uitwerking: |-
        $1$, $3$, $6$, $10$.
    - opgave: |-
        Raad een formule voor $n$ personen. Test ze met 6 personen.
      antwoord: |-
        $\frac{n(n - 1)}{2}$; $15$
      uitwerking: |-
        $\frac{n(n - 1)}{2}$: voor 6 personen $15$. Tel na: klopt.
    - opgave: |-
        Waarom klopt de formule altijd?
      antwoord: |-
        elke persoon geeft $n - 1$ handen, elke handdruk telt twee keer
      uitwerking: |-
        Elke persoon geeft $n - 1$ handen: samen $n(n - 1)$, maar zo telt elke handdruk twee keer.

- id: h1-vraag
  soort: kort
  opgave: |-
    Is dit een goede onderzoeksvraag? Zo niet, maak er een goede van.
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{Is lotto spelen de moeite?}
      antwoord: |-
        niet precies; bv. de verwachte winst per lotje
      uitwerking: |-
        \textit{De moeite} is niet precies. Beter: \textit{Wat is de verwachte winst per lotje van één euro, met de prijzentabel van deze week?}
    - opgave: |-
        \textit{Hoeveel water verbruikt België?}
      antwoord: |-
        te breed en niet met wiskunde alleen
      uitwerking: |-
        Te breed, en vooral een kwestie van gegevens opzoeken. Beter: \textit{Welk model beschrijft het waterverbruik van ons gezin per dag het best, op basis van een maand metingen?}
    - opgave: |-
        \textit{Op hoeveel manieren kun je een trap van 10 treden oplopen met stappen van één of twee treden?}
      antwoord: |-
        goed
      uitwerking: |-
        Goed: afgebakend, precies en beantwoordbaar. (Het antwoord is $89$, een getal van Fibonacci.)

- id: h1-vermoeden
  soort: kort
  opgave: |-
    Hoeveel vierkanten (van elke grootte) staan er op een rooster van $n$ op $n$ hokjes? Tel voor $n = 1, 2, 3$, stel een vermoeden op en bereken het aantal op een schaakbord.
  antwoord: |-
    $1, 5, 14$; $1^2 + 2^2 + \cdots + n^2$; $204$
  uitwerking: |-
    $n = 1$: $1$. $n = 2$: $4 + 1 = 5$. $n = 3$: $9 + 4 + 1 = 14$. Vermoeden: $1^2 + 2^2 + \cdots + n^2$, want er zijn $(n - k + 1)^2$ vierkanten met zijde $k$. Op een schaakbord: $1 + 4 + \cdots + 64 = 204$.

- id: h1-onderwerp
  soort: kort
  opgave: |-
    Maak van het onderwerp \textit{dobbelstenen} een goede onderzoeksvraag.
  lijst: enumerate
  delen:
    - opgave: |-
        Formuleer de hoofdvraag.
      antwoord: |-
        bv. \textit{Welke som gooi je het vaakst met drie dobbelstenen?}
      uitwerking: |-
        Vertrek van een grootheid die je kunt tellen: de som van de ogen. Bijvoorbeeld: \textit{Welke som gooi je het vaakst met drie eerlijke dobbelstenen, en hoe groot is die kans?} Afgebakend (drie dobbelstenen), precies (\textit{het vaakst} betekent: met de grootste kans) en beantwoordbaar door te tellen.
    - opgave: |-
        Geef een deelvraag met een kleiner geval.
      antwoord: |-
        bv. dezelfde vraag met twee dobbelstenen
      uitwerking: |-
        \textit{Welke som gooi je het vaakst met twee dobbelstenen?} Dat is snel te tellen in een tabel van $6 \times 6$: de som $7$, met kans $\frac{6}{36} = \frac16$.
    - opgave: |-
        Geef een deelvraag die het onderzoek uitbreidt.
      antwoord: |-
        bv. met $n$ dobbelstenen
      uitwerking: |-
        \textit{Welke som is het waarschijnlijkst met $n$ dobbelstenen?} Of: \textit{wat verandert er met dobbelstenen met acht vlakken?} (Met drie dobbelstenen zijn $10$ en $11$ even waarschijnlijk, elk met kans $\frac{27}{216}$.)

- id: h1-patroon
  soort: kort
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.55cm]
        \foreach \i in {0,1,2}{\draw[accent,line width=1.6pt] (\i,0) -- (\i+1,0) (\i,1) -- (\i+1,1);}
        \foreach \i in {0,...,3}{\draw[accent,line width=1.6pt] (\i,0) -- (\i,1);}
      \end{tikzpicture}
  opgave: |-
    Met lucifers leg je een rij van $n$ vierkantjes naast elkaar. De figuur toont $n = 3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Tel het aantal lucifers voor $n = 1, 2, 3, 4$.
      antwoord: |-
        $4, 7, 10, 13$
      uitwerking: |-
        $n = 1$: $4$; $n = 2$: $7$; $n = 3$: $10$; $n = 4$: $13$.
    - opgave: |-
        Stel een vermoeden op en test het met een nieuw geval.
      antwoord: |-
        $3n + 1$; $n = 5$ geeft $16$
      uitwerking: |-
        De verschillen zijn telkens $3$, dus vermoeden: $L(n) = 3n + 1$. Test met $n = 5$, dat nog niet gebruikt is: tekenen en tellen geeft $16 = 3 \cdot 5 + 1$.
    - opgave: |-
        Verklaar waarom het vermoeden voor elke $n$ klopt.
      antwoord: |-
        één lucifer links, en per vierkantje drie
      uitwerking: |-
        Leg eerst de linkse verticale lucifer. Elk vierkantje vraagt dan nog drie lucifers: boven, onder en rechts. Dus $L(n) = 1 + 3n$ voor elke $n$.

- id: h1-tegenvoorbeeld
  soort: kort
  opgave: |-
    Zoek een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor elk natuurlijk getal $n$ is $n^2 + 1$ een priemgetal.
      antwoord: |-
        $n = 3$: $10$
      uitwerking: |-
        $n = 1, 2$ geven $2$ en $5$, priem. Maar $n = 3$ geeft $10 = 2 \cdot 5$.
    - opgave: |-
        De som van twee priemgetallen is altijd even.
      antwoord: |-
        $2 + 3 = 5$
      uitwerking: |-
        Twee oneven priemgetallen geven wel een even som, maar $2$ is een even priemgetal: $2 + 3 = 5$ is oneven.
    - opgave: |-
        Voor elk natuurlijk getal $n \geqslant 1$ is $2^n > n^2$.
      antwoord: |-
        $n = 3$: $8 < 9$
      uitwerking: |-
        $n = 1$: $2 > 1$, klopt. $n = 2$: $4 = 4$, al niet groter. $n = 3$: $8 < 9$. (Vanaf $n = 5$ klopt het wel.)
    - opgave: |-
        Een vierhoek met vier gelijke zijden is een vierkant.
      antwoord: |-
        een ruit die geen vierkant is
      uitwerking: |-
        Een ruit met hoeken van $60^\circ$ en $120^\circ$ heeft vier gelijke zijden, maar is geen vierkant.

- id: h1-cyclus
  soort: kort
  opgave: |-
    Een leerling onderzoekt hoeveel blokjes een trap van $n$ treden telt (een trap van $3$ treden telt $1 + 2 + 3$ blokjes). Haar notities staan door elkaar. In welke fase van de onderzoekscyclus hoort elke notitie?
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{Voor $1$, $2$, $3$ en $4$ treden tel ik $1$, $3$, $6$ en $10$ blokjes. Ik vermoed $\frac{n(n + 1)}{2}$, en twee trappen vormen samen een rechthoek van $n$ op $n + 1$.}
      antwoord: |-
        uitvoeren
      uitwerking: |-
        Uitvoeren: ze telt, stelt een vermoeden op en verklaart het.
    - opgave: |-
        \textit{Ik bouw enkele trappen met blokjes, en zie dat elke trede één blokje hoger is dan de vorige.}
      antwoord: |-
        oriënteren
      uitwerking: |-
        Oriënteren: ze verkent de situatie, nog zonder vraag.
    - opgave: |-
        \textit{Hoeveel blokjes telt een trap van $n$ treden?}
      antwoord: |-
        vraag stellen
      uitwerking: |-
        Een vraag stellen: afgebakend, precies en beantwoordbaar.
    - opgave: |-
        \textit{Een trap van $n$ treden telt $\frac{n(n + 1)}{2}$ blokjes; voor $20$ treden zijn dat er $210$.}
      antwoord: |-
        besluiten
      uitwerking: |-
        Besluiten: het antwoord op de vraag, met een voorbeeld. Inderdaad is $\frac{20 \cdot 21}{2} = 210$.
    - opgave: |-
        \textit{Eerst tel ik kleine trappen, dan zoek ik een formule. Ik neem er één lesuur voor.}
      antwoord: |-
        plannen
      uitwerking: |-
        Plannen: de aanpak en de tijd.
    - opgave: |-
        \textit{Ik schrijf de formule op met de figuur van de twee trappen. Nieuwe vraag: hoeveel blokjes telt een piramide met $n$ lagen?}
      antwoord: |-
        rapporteren
      uitwerking: |-
        Rapporteren, met een nieuwe vraag: daar begint de cyclus opnieuw.

- id: h1-verschillen
  soort: kort
  opgave: |-
    Bereken de verschillen en de tweede verschillen van de rij ($n = 1, 2, 3, \ldots$). Geef met de eigenschappen een formule voor $u_n$ als dat kan, en voorspel $u_6$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2,\ 7,\ 14,\ 23,\ 34$
      antwoord: |-
        $n^2 + 2n - 1$; $47$
      uitwerking: |-
        Verschillen $5, 7, 9, 11$; tweede verschillen $2$, dus $c = 2$ en $u_n = n^2 + pn + q$. Uit $n = 1$: $1 + p + q = 2$; uit $n = 2$: $4 + 2p + q = 7$. Aftrekken geeft $3 + p = 5$, dus $p = 2$ en $q = -1$: $u_n = n^2 + 2n - 1$. Test: $u_5 = 25 + 10 - 1 = 34$. Dan $u_6 = 47$.
    - opgave: |-
        $1,\ 3,\ 8,\ 16,\ 27$
      antwoord: |-
        $\frac32 n^2 - \frac52 n + 2$; $41$
      uitwerking: |-
        Verschillen $2, 5, 8, 11$; tweede verschillen $3$, dus $u_n = \frac32 n^2 + pn + q$. Uit $n = 1$: $\frac32 + p + q = 1$; uit $n = 2$: $6 + 2p + q = 3$. Aftrekken geeft $\frac92 + p = 2$, dus $p = -\frac52$ en $q = 2$. Test: $u_5 = \frac{75}{2} - \frac{25}{2} + 2 = 27$. Dan $u_6 = 54 - 15 + 2 = 41$.
    - opgave: |-
        $1,\ 2,\ 4,\ 8,\ 16$
      antwoord: |-
        kan niet; vermoeden $2^{n-1}$, $u_6 = 32$?
      uitwerking: |-
        Verschillen $1, 2, 4, 8$ en tweede verschillen $1, 2, 4$: geen van beide constant, dus de eigenschappen geven geen formule. De verschillen verdubbelen, net als de termen zelf: vermoeden $u_n = 2^{n-1}$ en $u_6 = 32$. Maar bij de stukken van een cirkel stopt precies dit patroon: $u_6 = 31$. Zonder bewijs blijft $32$ een vermoeden.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    vragen bij een onderwerp
  opgave: |-
    Formuleer bij elk onderwerp één goede onderzoeksvraag die je met wiskunde uit dit jaar kunt beantwoorden: \textit{fietsen}, \textit{muziek}, \textit{sociale media}.
  antwoord: |-
    open
  uitwerking: |-
    Bijvoorbeeld: \textit{Hoe hangt de afstand per trapomwenteling af van de gekozen versnelling?} (verhoudingen, rechten). \textit{Welke frequenties hebben de tonen van een toonladder, en waarom vormen ze een meetkundige rij?} (exponentiële functies). \textit{Hoe snel verspreidt een bericht zich als elke ontvanger het aan drie anderen doorstuurt?} (exponentiële groei, rijen).

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    deelvragen
  opgave: |-
    Splits de onderzoeksvraag \textit{Welke vorm van een blik van 33 cl gebruikt het minste metaal?} in drie of vier deelvragen.
  antwoord: |-
    open
  uitwerking: |-
    Bijvoorbeeld: Welke vormen komen in aanmerking (cilinder, balk)? Hoe druk je de oppervlakte van een cilinder uit met één veranderlijke, als de inhoud vastligt? Waar is die functie minimaal (afgeleiden)? Hoe verhoudt dat zich tot echte blikjes, en waarom wijken die af?

- id: h1-o3
  soort: opdracht
  niveau: 2
  thema: |-
    oneven getallen
  opgave: |-
    Bereken $1$, $1 + 3$, $1 + 3 + 5$, enzovoort. Stel een vermoeden op, test het, en bewijs het met een figuur.
  antwoord: |-
    $1 + 3 + \cdots + (2n - 1) = n^2$
  uitwerking: |-
    $1, 4, 9, 16$: vermoeden $n^2$. Figuur: een vierkant van $n$ op $n$ stippen bestaat uit L-vormige lagen van $1, 3, 5, \ldots$ stippen.

- id: h1-o4
  soort: opdracht
  niveau: 2
  thema: |-
    een vals vermoeden
  opgave: |-
    Iemand vermoedt: \textit{$n^2 - n + 41$ is een priemgetal voor elk natuurlijk getal $n$}. Test voor $n = 1, \ldots, 5$. Zoek een tegenvoorbeeld. Tip: probeer $n = 41$.
  antwoord: |-
    $41^2$ is geen priemgetal
  uitwerking: |-
    $41$, $43$, $47$, $53$, $61$: alle priem. Maar $n = 41$ geeft $41^2 - 41 + 41 = 41^2$. (Het eerste tegenvoorbeeld is al $n = 41$; voor $n \leqslant 40$ klopt het.)

- id: h1-o5
  soort: opdracht
  niveau: 2
  thema: |-
    een trap oplopen
  opgave: |-
    Op hoeveel manieren loop je een trap van $n$ treden op met stappen van één of twee treden? Tel voor $n = 1, \ldots, 5$, zoek een patroon en verklaar het. Bereken het aantal voor $10$ treden.
  antwoord: |-
    $1, 2, 3, 5, 8$; $a_n = a_{n-1} + a_{n-2}$; $89$
  uitwerking: |-
    $1, 2, 3, 5, 8$: elke term is de som van de twee vorige. Verklaring: de eerste stap is één trede (dan blijven er $n - 1$) of twee (dan blijven er $n - 2$), dus $a_n = a_{n-1} + a_{n-2}$. Verder: $13, 21, 34, 55, 89$.

- id: h1-o6
  soort: opdracht
  niveau: 3
  thema: |-
    stukken van een cirkel
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=1.1]
        \draw[grijs] (0,0) circle (1);
        \foreach \i in {0,...,3}{\coordinate (Q\i) at ({20+95*\i}:1);}
        \draw[accent] (Q0) -- (Q1) -- (Q2) -- (Q3) -- (Q0) -- (Q2) (Q1) -- (Q3);
        \foreach \i in {0,...,3}{\fill[accent] (Q\i) circle (1.6pt);}
      \end{tikzpicture}
  opgave: |-
    Je zet $n$ punten op een cirkel en trekt alle koorden ertussen (nooit drie door één punt). Tel het aantal stukken voor $n = 1, \ldots, 5$. Teken $n = 6$ zorgvuldig en tel. Wat leer je hieruit over vermoedens?
  antwoord: |-
    $1, 2, 4, 8, 16$; $31$
  uitwerking: |-
    $1, 2, 4, 8, 16$ suggereert $2^{n-1}$, maar $n = 6$ geeft $31$. Een patroon uit enkele gevallen kan bedriegen: zonder bewijs is het maar een vermoeden. De juiste formule is $\binom{n}{4} + \binom{n}{2} + 1$.

- id: h1-o7
  soort: opdracht
  niveau: 3
  thema: |-
    een eigen onderzoek plannen
  opgave: |-
    Kies een onderzoeksvraag uit opdracht~\ref{oef:h1-o1} of een eigen vraag. Schrijf een plan van een halve pagina: de vraag, de deelvragen, welke wiskunde je verwacht nodig te hebben, welke gegevens of experimenten, en een planning in weken.
  antwoord: |-
    open
  uitwerking: |-
    Een goed plan is zo concreet dat een klasgenoot het zou kunnen uitvoeren. Laat het nalezen door een klasgenoot: vindt die de vraag precies genoeg?

- id: h1-o8
  soort: opdracht
  niveau: 1
  thema: |-
    een onderzoeksvraag beoordelen
  opgave: |-
    Aan welke eis (afgebakend, precies, beantwoordbaar) voldoet de vraag niet? Maak er een goede onderzoeksvraag van. Is de vraag al goed, zeg dan waarom.
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{Hoe snel groeit een plant?}
      antwoord: |-
        niet afgebakend en niet precies
      uitwerking: |-
        Niet afgebakend: welke plant, in welke omstandigheden? Niet precies: wat is \textit{snel}, in cm per dag? Beter: \textit{Hoe hangt de lengte van tuinkers af van de tijd, in de eerste tien dagen na het zaaien, op kamertemperatuur?}
    - opgave: |-
        \textit{Is de trap nemen beter dan de lift?}
      antwoord: |-
        niet precies
      uitwerking: |-
        \textit{Beter} is niet precies: sneller, gezonder, goedkoper? Beter: \textit{Vanaf hoeveel verdiepingen ben je in ons schoolgebouw met de lift sneller boven dan te voet, als je de wachttijd meerekent?}
    - opgave: |-
        \textit{Hoeveel zandkorrels liggen er precies op alle stranden van de wereld?}
      antwoord: |-
        niet beantwoordbaar
      uitwerking: |-
        Een exact aantal kan niemand bepalen. Beter: \textit{Wat is de orde van grootte van het aantal zandkorrels op het strand van één badplaats?} Dat kun je schatten met een model (volume van het strand gedeeld door het volume van een korrel).
    - opgave: |-
        \textit{Hoeveel verschillende lengtes hebben de diagonalen van een regelmatige twaalfhoek?}
      antwoord: |-
        goed
      uitwerking: |-
        Goed: afgebakend (één figuur), precies (lengte en diagonaal zijn gedefinieerd) en beantwoordbaar (tellen, meetkunde). Het antwoord is $5$: een diagonaal verbindt twee hoekpunten die $2$, $3$, $4$, $5$ of $6$ plaatsen uit elkaar liggen.
    - opgave: |-
        \textit{Welke wiskunde zit er in muziek?}
      antwoord: |-
        niet afgebakend
      uitwerking: |-
        Veel te breed: daar kun je een boek over schrijven. Beter: \textit{Met welke factor verschillen de frequenties van twee opeenvolgende tonen in een gelijkzwevende stemming, en waarom?}

- id: h1-o9
  soort: opdracht
  niveau: 1
  thema: |-
    de onderzoekscyclus
  opgave: |-
    Een leerling onderzoekt waarom bijen zeshoekige cellen bouwen. In welke fase van de onderzoekscyclus zit ze telkens?
  lijst: enumerate
  delen:
    - opgave: |-
        Ze rekent voor een gelijkzijdige driehoek, een vierkant en een regelmatige zeshoek met oppervlakte $1$ cm$^2$ de omtrek uit.
      antwoord: |-
        uitvoeren
      uitwerking: |-
        Uitvoeren: ze voert de berekeningen uit het plan uit.
    - opgave: |-
        Ze leest een artikel over bijenraten en noteert wat haar opvalt.
      antwoord: |-
        oriënteren
      uitwerking: |-
        Oriënteren: ze verkent het onderwerp, nog zonder vraag.
    - opgave: |-
        Ze maakt drie dia's om haar resultaat aan de klas te tonen.
      antwoord: |-
        rapporteren
      uitwerking: |-
        Rapporteren.
    - opgave: |-
        Ze schrijft: \textit{Welke regelmatige veelhoek die het vlak kan betegelen, heeft bij een gegeven oppervlakte de kleinste omtrek?}
      antwoord: |-
        vraag stellen
      uitwerking: |-
        Een vraag stellen: afgebakend (drie veelhoeken), precies en beantwoordbaar.
    - opgave: |-
        Ze beslist om eerst alleen de drie regelmatige veelhoeken te vergelijken, en daar één week voor te nemen.
      antwoord: |-
        plannen
      uitwerking: |-
        Plannen: wat doet ze eerst, en hoeveel tijd krijgt het.
    - opgave: |-
        Ze schrijft: \textit{Van de drie veelhoeken heeft de zeshoek de kleinste omtrek, ongeveer $3{,}72$ cm tegen $4$ cm voor het vierkant.}
      antwoord: |-
        besluiten
      uitwerking: |-
        Besluiten: het antwoord op de vraag. (De driehoek heeft een omtrek van ongeveer $4{,}56$ cm.)

- id: h1-o10
  soort: opdracht
  niveau: 1
  thema: |-
    een vermoeden uit een tabel
  opgave: |-
    Een experiment gaf voor $n = 1, 2, 3, 4, 5$ deze uitkomsten. Stel een vermoeden op voor de uitkomst bij $n$, en voorspel $n = 6$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3,\ 5,\ 7,\ 9,\ 11$
      antwoord: |-
        $2n + 1$; $13$
      uitwerking: |-
        De verschillen zijn constant $2$, en voor $n = 1$ is de uitkomst $3$: $2n + 1$. Voor $n = 6$: $13$.
    - opgave: |-
        $2,\ 6,\ 12,\ 20,\ 30$
      antwoord: |-
        $n(n + 1)$; $42$
      uitwerking: |-
        $2 = 1 \cdot 2$, $6 = 2 \cdot 3$, $12 = 3 \cdot 4$: $n(n + 1)$. Voor $n = 6$: $42$.
    - opgave: |-
        $1,\ 3,\ 7,\ 15,\ 31$
      antwoord: |-
        $2^n - 1$; $63$
      uitwerking: |-
        Telkens één minder dan $2, 4, 8, 16, 32$: $2^n - 1$. Voor $n = 6$: $63$.
    - opgave: |-
        $0,\ 3,\ 8,\ 15,\ 24$
      antwoord: |-
        $n^2 - 1$; $35$
      uitwerking: |-
        Telkens één minder dan de kwadraten $1, 4, 9, 16, 25$: $n^2 - 1$. Voor $n = 6$: $35$.
    - opgave: |-
        $4,\ 7,\ 12,\ 19,\ 28$
      antwoord: |-
        $n^2 + 3$; $39$
      uitwerking: |-
        De verschillen $3, 5, 7, 9$ stijgen telkens met $2$, zoals bij de kwadraten. Vergelijk met $1, 4, 9, 16, 25$: telkens $3$ meer, dus $n^2 + 3$. Voor $n = 6$: $39$.
    - opgave: |-
        $5,\ 10,\ 20,\ 40,\ 80$
      antwoord: |-
        $5 \cdot 2^{n-1}$; $160$
      uitwerking: |-
        De verhouding van twee opeenvolgende uitkomsten is telkens $2$: $5 \cdot 2^{n-1}$. Voor $n = 6$: $160$.

- id: h1-o11
  soort: opdracht
  niveau: 1
  thema: |-
    deelvragen ordenen
  opgave: |-
    Hoofdvraag: \textit{Hoeveel water verliest een druppelende kraan in een jaar, en wat kost dat?} Een leerling noteert vier deelvragen: (A) Hoeveel kost $1$ m$^3$ water? (B) Hoeveel druppels vallen er per minuut? (C) Hoeveel ml is één druppel? (D) Hoeveel liter is dat in een jaar?
  lijst: enumerate
  delen:
    - opgave: |-
        Zet de deelvragen in een logische volgorde.
      antwoord: |-
        B, C, D, A (of C, B, D, A)
      uitwerking: |-
        Eerst de metingen B en C (hun volgorde maakt niet uit), dan de berekening D, die B en C nodig heeft, en tot slot de prijs A om D om te zetten in euro.
    - opgave: |-
        Welke deelvraag beantwoord je met een meting, welke met een berekening, en welke door iets op te zoeken?
      antwoord: |-
        B en C meten, D berekenen, A opzoeken
      uitwerking: |-
        B: druppels tellen gedurende een paar minuten. C: druppels opvangen in een maatbeker, bijvoorbeeld $100$ druppels, en delen. D: berekenen. A: opzoeken op de waterfactuur of de website van de waterleverancier.
    - opgave: |-
        Je telt $30$ druppels per minuut, en $20$ druppels vullen $1$ ml. Neem als prijs $5$ euro per m$^3$. Beantwoord de hoofdvraag.
      antwoord: |-
        ongeveer $790$ liter, ongeveer $4$ euro
      uitwerking: |-
        Per minuut $\frac{30}{20} = 1{,}5$ ml. Per jaar $1{,}5 \cdot 60 \cdot 24 \cdot 365 = 788\,400$ ml, ongeveer $790$ liter of $0{,}79$ m$^3$. Dat kost $0{,}79 \cdot 5 \approx 4$ euro per jaar.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    vermoeden en bewijs: klassieke fouten
  opgave: |-
    Waar zit de fout in de redenering?
  lijst: enumerate
  delen:
    - opgave: |-
        Nora: \textit{Voor $n = 1$ tot $10$ is $n^2 + n + 1$ oneven. Dat is dus bewezen voor elke $n$.}
      antwoord: |-
        tien gevallen zijn geen bewijs; wel waar want $n(n + 1)$ is even
      uitwerking: |-
        Tien gevallen testen is geen bewijs: een volgend geval kan anders zijn. Het vermoeden is wel waar: $n^2 + n = n(n + 1)$ is een product van twee opeenvolgende getallen, waarvan er één even is. Dus $n^2 + n$ is even, en $n^2 + n + 1$ oneven.
    - opgave: |-
        Ruben haalt het vermoeden $d = \frac{n(n - 3)}{2}$ voor het aantal diagonalen uit $n = 3, 4, 5$. Hij test het daarna met $n = 4$.
      antwoord: |-
        test met een nieuw geval
      uitwerking: |-
        Het vermoeden is gemaakt om te kloppen voor $n = 4$: die test zegt niets. Test met een geval dat je nog niet gebruikte, zoals $n = 8$: $\frac{8 \cdot 5}{2} = 20$ diagonalen. Tel na op een tekening.
    - opgave: |-
        Sara: \textit{Het vermoeden $2^{n-1}$ voor de stukken van de cirkel klopt niet voor $n = 6$. Dan zijn mijn tellingen voor $n = 1$ tot $5$ ook fout.}
      antwoord: |-
        de tellingen blijven juist, alleen de formule valt
      uitwerking: |-
        Een tegenvoorbeeld weerlegt de algemene formule, niet de gevallen die je correct telde. De tellingen $1, 2, 4, 8, 16$ blijven juist: je zoekt een andere formule die bij alle zes gevallen past.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    rechten in het vlak
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[scale=.75]
        \clip (-1.7,-1.4) rectangle (2.2,1.7);
        \draw[accent,thick] (-2,-1.2) -- (2.4,1);
        \draw[accent,thick] (-.6,1.7) -- (.95,-1.4);
        \draw[accent,thick] (-2,1.3) -- (2.4,.42);
      \end{tikzpicture}
  opgave: |-
    Je tekent $n$ rechten in een vlak. Geen twee zijn evenwijdig, en geen drie gaan door één punt. De figuur toont $n = 3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Tel het aantal snijpunten voor $n = 1, 2, 3, 4$.
      antwoord: |-
        $0, 1, 3, 6$
      uitwerking: |-
        Tekenen en tellen: $0$, $1$, $3$, $6$.
    - opgave: |-
        Stel een vermoeden op voor $n$ rechten en verklaar het.
      antwoord: |-
        $\frac{n(n - 1)}{2}$
      uitwerking: |-
        Vermoeden: $\frac{n(n - 1)}{2}$, zoals de handdrukken. Verklaring: elke twee rechten snijden elkaar in precies één punt (ze zijn niet evenwijdig), en elk snijpunt hoort bij precies één paar rechten (geen drie door één punt). Er zijn $\frac{n(n - 1)}{2}$ paren.
    - opgave: |-
        Tel het aantal gebieden waarin de rechten het vlak verdelen, voor $n = 1, 2, 3, 4$.
      antwoord: |-
        $2, 4, 7, 11$
      uitwerking: |-
        $2$, $4$, $7$, $11$. De verschillen zijn $2$, $3$, $4$.
    - opgave: |-
        Een nieuwe $n$-de rechte snijdt de $n - 1$ vorige. In hoeveel stukken verdelen die snijpunten de nieuwe rechte? Hoeveel gebieden komen er dus bij?
      antwoord: |-
        $n$ stukken, $n$ nieuwe gebieden
      uitwerking: |-
        $n - 1$ punten verdelen een rechte in $n$ stukken. Elk stuk snijdt een bestaand gebied in twee: er komen $n$ gebieden bij. Dus $g_n = g_{n-1} + n$.
    - opgave: |-
        Geef een formule voor het aantal gebieden. Controleer ze met ${n = 5}$.
      antwoord: |-
        $1 + \frac{n(n + 1)}{2}$; $16$
      uitwerking: |-
        Zonder rechten is er $1$ gebied, en er komen $1 + 2 + \cdots + n$ bij: $g_n = 1 + \frac{n(n + 1)}{2}$. Voor $n = 4$: $11$, klopt. Voor $n = 5$: $1 + 15 = 16$, en ook $11 + 5 = 16$.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    kortste routes in een rooster
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[scale=.6]
        \draw[black!30] (0,0) grid (3,3);
        \draw[accent,very thick] (0,0) -- (1,0) -- (1,2) -- (3,2) -- (3,3);
        \fill[accent] (0,0) circle (2.5pt) (3,3) circle (2.5pt);
        \node[below left,font=\scriptsize] at (0,0) {$S$};
        \node[above right,font=\scriptsize] at (3,3) {$E$};
      \end{tikzpicture}
  opgave: |-
    In een stad met een rooster van straten wandel je van de hoek $S$ naar de hoek $E$ van een vierkant van $n$ op $n$ blokken, telkens naar rechts of naar boven. De figuur toont één route voor $n = 3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Tel het aantal routes voor $n = 1$ en $n = 2$.
      antwoord: |-
        $2$; $6$
      uitwerking: |-
        $n = 1$: rechts-boven of boven-rechts, $2$ routes. $n = 2$: schrijf elke route als een woord met twee R en twee B: RRBB, RBRB, RBBR, BRRB, BRBR, BBRR, dus $6$.
    - opgave: |-
        Tel voor $n = 3$. Tip: schrijf bij elk kruispunt het aantal routes ernaartoe; dat is de som van de getallen links en onder.
      antwoord: |-
        $20$
      uitwerking: |-
        Langs de onderrand en de linkerrand staat overal $1$. Rij per rij: $1, 2, 3, 4$; $1, 3, 6, 10$; $1, 4, 10, 20$. In $E$ staat $20$.
    - opgave: |-
        Verklaar het aantal met een telformule en bereken het voor $n = 4$.
      antwoord: |-
        $\binom{2n}{n}$; $70$
      uitwerking: |-
        Elke route telt $2n$ stappen, waarvan er $n$ naar rechts gaan. Een route ligt vast als je kiest welke $n$ van de $2n$ stappen naar rechts gaan: $\binom{2n}{n}$. Controle: $\binom21 = 2$, $\binom42 = 6$, $\binom63 = 20$. Voor $n = 4$: $\binom84 = 70$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    een open vermoeden
  opgave: |-
    Christian Goldbach vermoedde in 1742: \textit{elk even getal groter dan $2$ is de som van twee priemgetallen}.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $4, 6, 8, \ldots, 20$ als de som van twee priemgetallen.
      antwoord: |-
        bv. $4 = 2 + 2$, $6 = 3 + 3$, \ldots, $20 = 3 + 17$
      uitwerking: |-
        $4 = 2 + 2$, $6 = 3 + 3$, $8 = 3 + 5$, $10 = 3 + 7$, $12 = 5 + 7$, $14 = 3 + 11$, $16 = 3 + 13$, $18 = 5 + 13$, $20 = 3 + 17$. Vaak kan het op meer manieren, zoals $10 = 5 + 5$.
    - opgave: |-
        Op hoeveel manieren kan het voor $30$? (De volgorde telt niet.)
      antwoord: |-
        $3$
      uitwerking: |-
        Overloop de priemgetallen tot $15$: $30 - 2 = 28$, $30 - 3 = 27$, $30 - 5 = 25$ zijn geen priemgetallen; $30 = 7 + 23 = 11 + 19 = 13 + 17$. Drie manieren.
    - opgave: |-
        Met computers is het vermoeden nagegaan voor alle even getallen tot ongeveer ${4 \cdot 10^{18}}$. Is het daarmee bewezen?
      antwoord: |-
        nee
      uitwerking: |-
        Nee. Er zijn oneindig veel even getallen, en geen enkel aantal gevallen sluit uit dat een groter getal een tegenvoorbeeld is. Het vermoeden van Goldbach is tot vandaag niet bewezen, en ook niet weerlegd.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    een onderzoeksplan beoordelen
  opgave: |-
    Lotte schrijft dit plan: \textit{Vraag: is wiskunde nuttig in de sport? Ik ga op internet zoeken wat er daarover bestaat, en dan schrijf ik een verslag. Planning: de laatste week voor de deadline.}
  lijst: enumerate
  delen:
    - opgave: |-
        Aan welke eisen voldoet haar vraag niet?
      antwoord: |-
        niet afgebakend, niet precies
      uitwerking: |-
        Niet afgebakend (welke sport, welk aspect?) en niet precies (\textit{nuttig} is niet meetbaar). Ze is ook nauwelijks met wiskunde te beantwoorden: het antwoord is een mening.
    - opgave: |-
        Wat ontbreekt er in het plan?
      antwoord: |-
        deelvragen, eigen werk, een realistische planning
      uitwerking: |-
        Deelvragen; wat ze zelf berekent, meet of bewijst (opzoeken alleen is geen onderzoek); welke wiskunde ze nodig heeft; en een planning over meerdere weken met tussenstappen.
    - opgave: |-
        Maak er een goede onderzoeksvraag over sport van, met twee deelvragen.
      antwoord: |-
        open, bv. over de beste hoek bij kogelstoten
      uitwerking: |-
        Bijvoorbeeld: \textit{Onder welke hoek moet je een kogel stoten om zo ver mogelijk te komen, als je hem op $2$ m hoogte loslaat met een vaste snelheid?} Deelvragen: \textit{Wat is de beste hoek als je de kogel op de grond loslaat?} (dan $45^\circ$) en \textit{Hoe verandert die hoek door de hoogte van $2$ m?}

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    driehoeken in een veelhoek
  opgave: |-
    Hoeveel driehoeken hebben als hoekpunten drie hoekpunten van een convexe $n$-hoek?
  lijst: enumerate
  delen:
    - opgave: |-
        Tel voor $n = 3, 4, 5$.
      antwoord: |-
        $1, 4, 10$
      uitwerking: |-
        Driehoek: $1$. Vierhoek: elke keuze van drie hoekpunten laat er één weg, dus $4$. Vijfhoek: $10$ (laat telkens twee hoekpunten weg: $10$ paren).
    - opgave: |-
        De verschillen zijn $3$ en $6$. Voorspel het aantal voor $n = 6$, en vergelijk met $\frac{n(n - 1)(n - 2)}{6}$.
      antwoord: |-
        $20$
      uitwerking: |-
        De verschillen $3, 6$ zijn de aantallen handdrukken; het volgende verschil is $10$, dus $10 + 10 = 20$. De formule geeft $\frac{3 \cdot 2 \cdot 1}{6} = 1$, $\frac{4 \cdot 3 \cdot 2}{6} = 4$, $\frac{5 \cdot 4 \cdot 3}{6} = 10$ en $\frac{6 \cdot 5 \cdot 4}{6} = 20$.
    - opgave: |-
        Bewijs de formule.
      antwoord: |-
        $\binom{n}{3}$: kies drie hoekpunten
      uitwerking: |-
        Een driehoek ligt vast door drie hoekpunten, en drie hoekpunten van een convexe veelhoek liggen nooit op één rechte. Kies ze na elkaar: $n(n - 1)(n - 2)$ manieren. Zo telt elk drietal $3 \cdot 2 \cdot 1 = 6$ keer (in elke volgorde). Dus $\frac{n(n - 1)(n - 2)}{6} = \binom{n}{3}$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    deelbaarheid: vermoeden en bewijs
  opgave: |-
    Neem een oneven getal, kwadrateer het en trek er $1$ af.
  lijst: enumerate
  delen:
    - opgave: |-
        Doe dat voor $1, 3, 5, 7, 9$.
      antwoord: |-
        $0, 8, 24, 48, 80$
      uitwerking: |-
        $1 - 1 = 0$, $9 - 1 = 8$, $25 - 1 = 24$, $49 - 1 = 48$, $81 - 1 = 80$.
    - opgave: |-
        Welk vermoeden over deelbaarheid ligt voor de hand? Test het met $11$.
      antwoord: |-
        deelbaar door $8$; $120 = 8 \cdot 15$
      uitwerking: |-
        Alle uitkomsten zijn veelvouden van $8$. Test: $11^2 - 1 = 120 = 8 \cdot 15$.
    - opgave: |-
        Bewijs het vermoeden.
      antwoord: |-
        $(2k + 1)^2 - 1 = 4k(k + 1)$
      uitwerking: |-
        Stel het oneven getal $2k + 1$, met $k$ natuurlijk. Dan is $(2k + 1)^2 - 1 = 4k^2 + 4k = 4k(k + 1)$. Van de opeenvolgende getallen $k$ en $k + 1$ is er één even, dus $k(k + 1) = 2m$ en $(2k + 1)^2 - 1 = 8m$.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    stukken van een cirkel: de formule
  opgave: |-
    In opdracht~\ref{oef:h1-o6} vond je $1, 2, 4, 8, 16, 31$ stukken. Een betere formule is $\binom{n}{4} + \binom{n}{2} + 1$ (met $\binom{n}{4} = 0$ als $n < 4$).
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de koorden binnen de cirkel $\binom{n}{4}$ snijpunten hebben.
      antwoord: |-
        elk viertal punten geeft precies één snijpunt
      uitwerking: |-
        Vier punten op de cirkel vormen een convexe vierhoek. Van de zes koorden ertussen snijden alleen de twee diagonalen elkaar binnen de cirkel, in één punt. Omgekeerd ligt elk snijpunt op twee koorden, met samen vier eindpunten. Zo hoort bij elk viertal precies één snijpunt, en omgekeerd: $\binom{n}{4}$ snijpunten.
    - opgave: |-
        Controleer de formule voor $n = 1, \ldots, 6$.
      antwoord: |-
        $1, 2, 4, 8, 16, 31$
      uitwerking: |-
        $n = 1$: $0 + 0 + 1 = 1$. $n = 2$: $0 + 1 + 1 = 2$. $n = 3$: $0 + 3 + 1 = 4$. $n = 4$: $1 + 6 + 1 = 8$. $n = 5$: $5 + 10 + 1 = 16$. $n = 6$: $15 + 15 + 1 = 31$.
    - opgave: |-
        Bereken het aantal stukken voor $n = 10$, en vergelijk met $2^{n-1}$. Wat leer je hieruit?
      antwoord: |-
        $256$, tegen $2^9 = 512$
      uitwerking: |-
        $\binom{10}{4} + \binom{10}{2} + 1 = 210 + 45 + 1 = 256$. Toevallig een macht van $2$, maar niet $2^9 = 512$. De formule is een veelterm van graad $4$ in $n$, en die groeit veel trager dan $2^{n-1}$: hoe groter $n$, hoe verder het vermoeden ernaast zit.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    een klein onderzoek: delers tellen
  opgave: |-
    Onderzoeksvraag: \textit{welk natuurlijk getal tot $100$ heeft de meeste delers?}
  lijst: enumerate
  delen:
    - opgave: |-
        Tel de delers van $12$, $16$, $18$, $24$ en $36$. Zet ook hun ontbinding in priemfactoren erbij. Wat valt op?
      antwoord: |-
        $6, 5, 6, 8, 9$
      uitwerking: |-
        $12 = 2^2 \cdot 3$: $6$ delers. $16 = 2^4$: $5$. $18 = 2 \cdot 3^2$: $6$. $24 = 2^3 \cdot 3$: $8$. $36 = 2^2 \cdot 3^2$: $9$. Het aantal hangt alleen af van de exponenten: verhoog elke exponent met één en vermenigvuldig. Zo geeft $36 = 2^2 \cdot 3^2$ precies $3 \cdot 3 = 9$ delers.
    - opgave: |-
        Bewijs: als $n = p^a q^b$ met $p$ en $q$ verschillende priemgetallen, dan heeft $n$ precies ${(a + 1)(b + 1)}$ delers.
      antwoord: |-
        een deler is $p^i q^j$ met $0 \leqslant i \leqslant a$, $0 \leqslant j \leqslant b$
      uitwerking: |-
        Elke deler van $n$ bevat alleen de priemfactoren $p$ en $q$, en hoogstens zo vaak als in $n$: een deler is $p^i q^j$ met $i \in \{0, 1, \ldots, a\}$ en $j \in \{0, 1, \ldots, b\}$. Voor $i$ zijn er $a + 1$ keuzes, voor $j$ zijn er $b + 1$, en verschillende keuzes geven verschillende delers (de ontbinding is uniek). Dus $(a + 1)(b + 1)$ delers. Met meer priemfactoren gaat het net zo.
    - opgave: |-
        Beantwoord de onderzoeksvraag, met een argument waarom geen enkel getal tot $100$ meer delers heeft.
      antwoord: |-
        $60, 72, 84, 90, 96$, elk met $12$ delers
      uitwerking: |-
        Het aantal delers is het product van de exponenten plus één. Zoek dus het kleinste getal bij elk aantal priemfactoren, met de kleinste priemgetallen en de grootste exponenten bij de kleinste priemgetallen. Eén priemfactor: hoogstens $2^6 = 64$, met $7$ delers. Twee: $2^3 \cdot 3^2 = 72$ en $2^5 \cdot 3 = 96$ geven $12$ delers. Meer dan $12$ vraagt $(a + 1)(b + 1) \geqslant 13$, en de kleinste kandidaten $2^4 \cdot 3^2 = 144$, $2^6 \cdot 3 = 192$ en $2^3 \cdot 3^3 = 216$ zijn te groot. Drie: $2^2 \cdot 3 \cdot 5 = 60$, $2^2 \cdot 3 \cdot 7 = 84$ en $2 \cdot 3^2 \cdot 5 = 90$ geven $12$; meer dan $12$ vraagt minstens $2^3 \cdot 3 \cdot 5 = 120$. Vier priemfactoren: minstens $2 \cdot 3 \cdot 5 \cdot 7 = 210$. Het maximum is dus $12$ delers, voor $60$, $72$, $84$, $90$ en $96$.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h1-koppel-3
  soort: koppel
  niveau: 1
  koppel:
    rubriek: discreet
    onderwerp: Rijen
  thema: |-
    een recursieve rij
  opgave: |-
    De rij van de handdrukken $h_n$ voldoet aan $h_n = h_{n-1} + (n - 1)$. Verklaar die formule zonder rekenen.
  antwoord: |-
    de nieuwe persoon geeft $n - 1$ handen
  uitwerking: |-
    Komt er een $n$-de persoon bij, dan blijven de oude handdrukken, en geeft die persoon $n - 1$ nieuwe.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    onderzoeksvraag
  opgave: |-
    Verbeter de onderzoeksvraag \textit{Is de wiskunde van een voetbal moeilijk?} tot een goede onderzoeksvraag.
  antwoord: |-
    open, bv. over vijf- en zeshoeken
  uitwerking: |-
    Bijvoorbeeld: \textit{Waarom bestaat een klassieke voetbal uit 12 vijfhoeken en 20 zeshoeken, en niet uit andere aantallen?} Of: \textit{Hoeveel naden heeft een voetbal met 12 vijfhoeken en 20 zeshoeken?} ($90$).

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    patroon zoeken
  opgave: |-
    Hoeveel lijnstukken verbinden $n$ punten op een cirkel? Tel voor kleine $n$, stel een vermoeden op en verklaar het.
  antwoord: |-
    $\frac{n(n - 1)}{2}$
  uitwerking: |-
    Voor $n = 1, 2, 3, 4, 5$ tel je $0, 1, 3, 6, 10$ lijnstukken. De verschillen zijn $1, 2, 3, 4$, zoals bij de handdrukken: vermoeden $\frac{n(n - 1)}{2}$. Test met $n = 6$: $15$. Verklaring: uit elk punt vertrekken $n - 1$ lijnstukken, samen $n(n - 1)$, maar zo telt elk lijnstuk twee keer, eens vanuit elk eindpunt. Dus $\frac{n(n - 1)}{2} = \binom{n}{2}$.

- id: h1-t3
  soort: test
  niveau: 2
  thema: |-
    tegenvoorbeeld
  opgave: |-
    Iemand vermoedt: \textit{als $n$ een priemgetal is, dan is $2^n - 1$ ook een priemgetal}. Test voor $n = 2, 3, 5, 7$, en zoek een tegenvoorbeeld bij $n = 11$ (tip: $2^{11} - 1 = 2047$ is deelbaar door 23).
  antwoord: |-
    $2047 = 23 \cdot 89$
  uitwerking: |-
    $3$, $7$, $31$, $127$: allemaal priem. Maar $2^{11} - 1 = 2047 = 23 \cdot 89$: het vermoeden is vals.

- id: h1-t4
  soort: test
  niveau: 1
  thema: |-
    deelvragen
  opgave: |-
    Splits de onderzoeksvraag \textit{Welke rechthoek met een omtrek van $24$ m heeft de grootste oppervlakte?} in drie deelvragen, van eenvoudig naar moeilijk. Beantwoord ze kort.
  antwoord: |-
    bv. tabel, formule $A(x) = x(12 - x)$, maximum: vierkant van $6$ m
  uitwerking: |-
    Deelvraag 1: \textit{Welke oppervlakte hebben enkele rechthoeken met omtrek $24$ m?} Bijvoorbeeld $2 \times 10$: $20$ m$^2$; $4 \times 8$: $32$ m$^2$; $6 \times 6$: $36$ m$^2$. Deelvraag 2: \textit{Hoe druk je de oppervlakte uit met één zijde $x$?} De andere zijde is $12 - x$, dus $A(x) = x(12 - x)$. Deelvraag 3: \textit{Voor welke $x$ is $A(x)$ maximaal?} De top van de parabool ligt in $x = 6$: het vierkant van $6$ m bij $6$ m, met $36$ m$^2$.

- id: h1-t5
  soort: test
  niveau: 2
  thema: |-
    bewijzen of weerleggen
  opgave: |-
    Bewijs het vermoeden, of geef een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        De som van drie opeenvolgende natuurlijke getallen is deelbaar door $3$.
      antwoord: |-
        waar: $3(n + 1)$
      uitwerking: |-
        Neem $n$, $n + 1$ en $n + 2$. Hun som is $3n + 3 = 3(n + 1)$, een veelvoud van $3$.
    - opgave: |-
        De som van vier opeenvolgende natuurlijke getallen is deelbaar door $4$.
      antwoord: |-
        vals: $1 + 2 + 3 + 4 = 10$
      uitwerking: |-
        Tegenvoorbeeld: $1 + 2 + 3 + 4 = 10$ is niet deelbaar door $4$. (In het algemeen is de som $4n + 6$, en die is nooit deelbaar door $4$.)
