# Oefeningen van hoofdstuk 3. Zie oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken de afgeleide van:
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin(x^2)$
      antwoord: |-
        $2x\cos(x^2)$
      uitwerking: |-
        Kettingregel.
    - opgave: |-
        $x\,\e^x$
      antwoord: |-
        $(x+1)\e^x$
      uitwerking: |-
        Productregel: $\e^x+x\e^x$.
    - opgave: |-
        $x \ln x$
      antwoord: |-
        $\ln x+1$
      uitwerking: |-
        Productregel: $\ln x+x\cdot\tfrac1x$.
    - opgave: |-
        $(x^2 + 1)^3$
      antwoord: |-
        $6x(x^2+1)^2$
      uitwerking: |-
        Kettingregel: $3(x^2+1)^2\cdot 2x$.
    - opgave: |-
        $\ln(x^2 + 1)$
      antwoord: |-
        $\tfrac{2x}{x^2+1}$
      uitwerking: |-
        Kettingregel: $\tfrac{1}{x^2+1}\cdot 2x$.
    - opgave: |-
        $\e^{-x}$
      antwoord: |-
        $-\e^{-x}$
      uitwerking: |-
        Kettingregel.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Gebruik de afgeleiden uit de opwarmer. Geef een primitieve van:
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2x \cos(x^2)$
      antwoord: |-
        $\sin(x^2)$
    - opgave: |-
        $x \cos(x^2)$
      antwoord: |-
        $\tfrac12\sin(x^2)$
    - opgave: |-
        $x(x^2 + 1)^2$
      antwoord: |-
        $\tfrac16(x^2+1)^3$
    - opgave: |-
        $\tfrac{x}{x^2 + 1}$
      antwoord: |-
        $\tfrac12\ln(x^2+1)$
    - opgave: |-
        $(x + 1)\e^x$
      antwoord: |-
        $x\e^x$
    - opgave: |-
        $x\e^x$
      antwoord: |-
        $(x-1)\e^x$
  slot: |-
    Bij welke kon je de vorige afgeleide meteen aanpassen? Waarom loopt de laatste minder vlot?
  uitwerking: |-
    \textbf{a.}~Rechtstreeks uit de opwarmer.\\
    \textbf{b, c, d.}~Een constante factor aanpassen: de binnenste afgeleide staat er, op een constante na.\\
    \textbf{e.}~Rechtstreeks uit de opwarmer.\\
    \textbf{f.}~$(x\e^x)'=x\e^x+\e^x$, dus $x\e^x$ is de afgeleide min $\e^x$: $x\e^x-\e^x$. Hier komt het product uit de productregel, en dat vraagt een eigen methode.

- id: h3-onb
  soort: kort
  opgave: |-
    Bepaal $f$ als $f'(x) = 6x + 2$ en $f(1) = 3$.
  antwoord: |-
    $f(x)=3x^2+2x-2$
  uitwerking: |-
    $f(x)=3x^2+2x+C$ en $3+2+C=3$, dus $C=-2$.

- id: h3-split
  soort: kort
  opgave: |-
    Bereken $\ig \dfrac{2x^3 - x + 5}{x^2}\dx$.
  antwoord: |-
    $x^2-\ln|x|-\tfrac5x+C$
  uitwerking: |-
    $\displaystyle\int\Bigl(2x-\dfrac1x+5x^{-2}\Bigr)\dx=x^2-\ln|x|-\dfrac5x+C$.

- id: h3-sub
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig 2x(x^2 + 3)^4\dx$
      antwoord: |-
        $\tfrac15(x^2+3)^5+C$
      uitwerking: |-
        $u=x^2+3$, $\mathrm{d}u=2x\dx$: $\displaystyle\int u^4\du=\tfrac15 u^5+C$.
    - opgave: |-
        $\ig \e^{-4x}\dx$
      antwoord: |-
        $-\tfrac14\e^{-4x}+C$
      uitwerking: |-
        $u=-4x$, $\mathrm{d}u=-4\dx$: $-\tfrac14\displaystyle\int\e^u\du$.
    - opgave: |-
        $\ig x\sqrt{x^2 + 1}\dx$
      antwoord: |-
        $\tfrac13(x^2+1)^{3/2}+C$
      uitwerking: |-
        $u=x^2+1$, $x\dx=\tfrac12\du$: $\tfrac12\displaystyle\int u^{1/2}\du=\tfrac13 u^{3/2}+C$.

- id: h3-vormen
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig \dfrac{1}{2x + 1}\dx$
      antwoord: |-
        $\tfrac12\ln|2x+1|+C$
      uitwerking: |-
        Lineaire binnenste functie, $a=2$.
    - opgave: |-
        $\ig \dfrac{\cos x}{\sin x}\dx$
      antwoord: |-
        $\ln|\sin x|+C$
      uitwerking: |-
        De afgeleide staat in de teller.
    - opgave: |-
        $\ig \dfrac{1}{9 + x^2}\dx$
      antwoord: |-
        $\tfrac13\bgtan\tfrac{x}{3}+C$
      uitwerking: |-
        $a=3$.

- id: h3-subgrens
  soort: kort
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_0^{\pi/2} \sin^3 x \cos x\dx$
      antwoord: |-
        $\tfrac14$
      uitwerking: |-
        $u=\sin x$, grenzen 0 en 1: $\displaystyle\int_0^1 u^3\du=\tfrac14$.
    - opgave: |-
        $\ig_0^3 \dfrac{x}{\sqrt{x^2 + 16}}\dx$
      antwoord: |-
        1
      uitwerking: |-
        $u=x^2+16$, $x\dx=\tfrac12\du$, grenzen 16 en 25: $\tfrac12\displaystyle\int_{16}^{25} u^{-1/2}\du=\bigl[\sqrt{u}\bigr]_{16}^{25}=1$.

- id: h3-omvormen
  soort: kort
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_0^{\pi/2} \cos^2 x\dx$
      antwoord: |-
        $\tfrac{\pi}{4}$
      uitwerking: |-
        $\Bigl[\tfrac{x}{2}+\tfrac{\sin 2x}{4}\Bigr]_0^{\pi/2}=\tfrac{\pi}{4}$.
    - opgave: |-
        $\ig_1^2 x\sqrt{x - 1}\dx$
      antwoord: |-
        $\tfrac{16}{15}$
      uitwerking: |-
        $u=x-1$, $x=u+1$, grenzen 0 en 1: $\displaystyle\int_0^1(u^{3/2}+u^{1/2})\du=\tfrac25+\tfrac23=\tfrac{16}{15}$.

- id: h3-dubbel
  soort: kort
  opgave: |-
    Bereken met twee substituties.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig x\sin(x^2)\cos^3(x^2)\dx$
      antwoord: |-
        $-\tfrac18\cos^4(x^2)+C$
      uitwerking: |-
        $u=x^2$ geeft $\tfrac12\displaystyle\int\sin u\cos^3 u\du$, en $v=\cos u$ geeft $-\tfrac12\displaystyle\int v^3\,\mathrm{d}v=-\tfrac18 v^4+C$.
    - opgave: |-
        $\ig \dfrac{\cos(\ln x)}{x\,\bigl(1 + \sin^2(\ln x)\bigr)}\dx$
      antwoord: |-
        $\bgtan\bigl(\sin(\ln x)\bigr)+C$
      uitwerking: |-
        $u=\ln x$ geeft $\displaystyle\int\dfrac{\cos u}{1+\sin^2 u}\du$, en $v=\sin u$ geeft $\displaystyle\int\dfrac{1}{1+v^2}\,\mathrm{d}v=\bgtan v+C$.

- id: h3-partieel
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig x\sin x\dx$
      antwoord: |-
        $\sin x-x\cos x+C$
      uitwerking: |-
        $f=x$, $g=-\cos x$: $-x\cos x+\displaystyle\int\cos x\dx=\sin x-x\cos x+C$.
    - opgave: |-
        $\ig \bgtan x\dx$
      antwoord: |-
        $x\bgtan x-\tfrac12\ln(1+x^2)+C$
      uitwerking: |-
        $f=\bgtan x$, $g=x$: $x\bgtan x-\displaystyle\int\dfrac{x}{1+x^2}\dx=x\bgtan x-\tfrac12\ln(1+x^2)+C$.

- id: h3-tweekeer
  soort: kort
  opgave: |-
    Bereken $\ig \e^x \cos x\dx$.
  antwoord: |-
    $\tfrac12\e^x(\sin x+\cos x)+C$
  uitwerking: |-
    $I=\e^x\cos x+\displaystyle\int\e^x\sin x\dx=\e^x\cos x+\e^x\sin x-I$, dus $I=\tfrac12\e^x(\sin x+\cos x)+C$.

- id: h3-pgrens
  soort: kort
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_0^1 x\,\e^{-x}\dx$
      antwoord: |-
        $1-\tfrac{2}{\e}$
      uitwerking: |-
        $f=x$, $g=-\e^{-x}$: $\bigl[-x\e^{-x}\bigr]_0^1+\displaystyle\int_0^1\e^{-x}\dx=-\e^{-1}+\bigl(1-\e^{-1}\bigr)=1-\tfrac{2}{\e}$.
    - opgave: |-
        $\ig_0^1 x\,2^{x}\dx$
      antwoord: |-
        $\tfrac{2}{\ln 2}-\tfrac{1}{(\ln 2)^2}$
      uitwerking: |-
        $f=x$, $g=\tfrac{2^x}{\ln 2}$: $\Bigl[\dfrac{x\,2^x}{\ln 2}\Bigr]_0^1-\dfrac{1}{\ln 2}\displaystyle\int_0^1 2^x\dx=\dfrac{2}{\ln 2}-\dfrac{1}{(\ln 2)^2}$.
    - opgave: |-
        $\ig_0^{\pi/3} x\cos 3x\dx$
      antwoord: |-
        $-\tfrac29$
      uitwerking: |-
        $f=x$, $g=\tfrac13\sin 3x$: $\Bigl[\dfrac{x\sin 3x}{3}+\dfrac{\cos 3x}{9}\Bigr]_0^{\pi/3}=-\dfrac19-\dfrac19=-\dfrac29$.

- id: h3-keuze
  soort: kort
  opgave: |-
    Welke methode kies je? Reken niet uit.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig x\cos x\dx$
      antwoord: |-
        partieel
      uitwerking: |-
        Een product van een veelterm en $\cos x$, zonder binnenste functie.
    - opgave: |-
        $\ig x\cos(x^2)\dx$
      antwoord: |-
        substitutie
      uitwerking: |-
        $u=x^2$.
    - opgave: |-
        $\ig \cos^2 x\dx$
      antwoord: |-
        dubbele hoek
      uitwerking: |-
        Een even macht van $\cos x$.
    - opgave: |-
        $\ig \dfrac{x}{1 + x^2}\dx$
      antwoord: |-
        substitutie
      uitwerking: |-
        De afgeleide van de noemer staat in de teller.
    - opgave: |-
        $\ig \dfrac{1}{1 + x^2}\dx$
      antwoord: |-
        onmiddellijk
      uitwerking: |-
        Rechtstreeks uit de tabel: $\bgtan x$.
    - opgave: |-
        $\ig \dfrac{1 + x^2}{x}\dx$
      antwoord: |-
        splitsing
      uitwerking: |-
        $\tfrac1x+x$.

- id: h3-d1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: onmiddellijk, splitsen en lineaire binnenste functie, door elkaar
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig (x^3 - 2x + 1)\dx$
      antwoord: |-
        $\tfrac{x^4}{4}-x^2+x$
    - opgave: |-
        $\ig \e^{3x}\dx$
      antwoord: |-
        $\tfrac13\e^{3x}$
    - opgave: |-
        $\ig \dfrac{x^2 + 1}{x}\dx$
      antwoord: |-
        $\tfrac{x^2}{2}+\ln|x|$
    - opgave: |-
        $\ig \dfrac{1}{x^3}\dx$
      antwoord: |-
        $-\tfrac{1}{2x^2}$
    - opgave: |-
        $\ig \sin 2x\dx$
      antwoord: |-
        $-\tfrac12\cos 2x$
    - opgave: |-
        $\ig (x + 2)^2\dx$
      antwoord: |-
        $\tfrac13(x+2)^3$
    - opgave: |-
        $\ig 3\sqrt{x}\dx$
      antwoord: |-
        $2x^{3/2}$
    - opgave: |-
        $\ig \sqrt{3x + 1}\dx$
      antwoord: |-
        $\tfrac29(3x+1)^{3/2}$
    - opgave: |-
        $\ig (2^x + \sin x)\dx$
      antwoord: |-
        $\tfrac{2^x}{\ln 2}-\cos x$
    - opgave: |-
        $\ig \dfrac{1}{2x + 1}\dx$
      antwoord: |-
        $\tfrac12\ln|2x+1|$
    - opgave: |-
        $\ig \dfrac{5}{1 + x^2}\dx$
      antwoord: |-
        $5\bgtan x$
    - opgave: |-
        $\ig \cos\dfrac{x}{2}\dx$
      antwoord: |-
        $2\sin\tfrac{x}{2}$
    - opgave: |-
        $\ig \dfrac{x^3 + x}{x^2}\dx$
      antwoord: |-
        $\tfrac{x^2}{2}+\ln|x|$
    - opgave: |-
        $\ig (5 - x)^4\dx$
      antwoord: |-
        $-\tfrac15(5-x)^5$
    - opgave: |-
        $\ig \dfrac{4}{\sqrt{1 - x^2}}\dx$
      antwoord: |-
        $4\bgsin x$
    - opgave: |-
        $\ig \e^{1 - x}\dx$
      antwoord: |-
        $-\e^{1-x}$
  antwoord_voor: |-
    (telkens $+\,C$)
  uitwerking: |-
    Controleer elk antwoord met de afgeleide. De methode: onmiddellijk bij \textbf{a, d, g, i, k, o}; splitsen bij \textbf{c, f, m} (bij \textbf{f} uitwerken of $u=x+2$); lineaire binnenste functie bij \textbf{b, e, h, j, l, n, p}, waar je deelt door de coëfficiënt van $x$.

- id: h3-d2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: eenvoudige substitutie en partiële integratie, door elkaar
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig \dfrac{\ln x}{x}\dx$
      antwoord: |-
        $\tfrac12(\ln x)^2$
    - opgave: |-
        $\ig x\cos x\dx$
      antwoord: |-
        $x\sin x+\cos x$
    - opgave: |-
        $\ig 2x(x^2 + 1)^3\dx$
      antwoord: |-
        $\tfrac14(x^2+1)^4$
    - opgave: |-
        $\ig (x + 1)\e^x\dx$
      antwoord: |-
        $x\e^x$
    - opgave: |-
        $\ig x^2(x^3 + 1)^4\dx$
      antwoord: |-
        $\tfrac{1}{15}(x^3+1)^5$
    - opgave: |-
        $\ig x\,\e^{-x}\dx$
      antwoord: |-
        $-(x+1)\e^{-x}$
    - opgave: |-
        $\ig x\,\e^{x^2}\dx$
      antwoord: |-
        $\tfrac12\e^{x^2}$
    - opgave: |-
        $\ig x\sin 2x\dx$
      antwoord: |-
        $-\tfrac{x}{2}\cos 2x+\tfrac14\sin 2x$
    - opgave: |-
        $\ig \cos x\sin^2 x\dx$
      antwoord: |-
        $\tfrac13\sin^3 x$
    - opgave: |-
        $\ig x\ln x\dx$
      antwoord: |-
        $\tfrac{x^2}{2}\ln x-\tfrac{x^2}{4}$
    - opgave: |-
        $\ig \dfrac{x}{x^2 + 1}\dx$
      antwoord: |-
        $\tfrac12\ln(x^2+1)$
    - opgave: |-
        $\ig \dfrac{\sin x}{\cos^2 x}\dx$
      antwoord: |-
        $\tfrac{1}{\cos x}$
    - opgave: |-
        $\ig \dfrac{1}{4 + x^2}\dx$
      antwoord: |-
        $\tfrac12\bgtan\tfrac{x}{2}$
    - opgave: |-
        $\ig x\sqrt{x^2 + 9}\dx$
      antwoord: |-
        $\tfrac13(x^2+9)^{3/2}$
    - opgave: |-
        $\ig (2x + 1)\e^x\dx$
      antwoord: |-
        $(2x-1)\e^x$
    - opgave: |-
        $\ig \dfrac{1}{\sqrt{9 - x^2}}\dx$
      antwoord: |-
        $\bgsin\tfrac{x}{3}$
  antwoord_voor: |-
    (telkens $+\,C$)
  uitwerking: |-
    Substitutie bij \textbf{a} ($u=\ln x$), \textbf{c} ($u=x^2+1$), \textbf{e} ($u=x^3+1$), \textbf{g} ($u=x^2$), \textbf{i} ($u=\sin x$), \textbf{k} ($u=x^2+1$), \textbf{l} ($u=\cos x$), \textbf{n} ($u=x^2+9$); de vormen met een constante bij \textbf{m} en \textbf{p}.\\
    Partiële integratie bij \textbf{b, d, f, h, o} met de veelterm als $f$, en bij \textbf{j} met $f=\ln x$.

- id: h3-d3
  soort: opdracht
  niveau: 1
  thema: |-
    drill: primitieve met voorwaarde
  opgave: |-
    Bepaal de functie $f$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f'(x) = 3x^2 - 2$ en $f(1) = 4$
      antwoord: |-
        $x^3-2x+5$
    - opgave: |-
        $f'(x) = \cos x$ en $f(0) = 2$
      antwoord: |-
        $\sin x+2$
    - opgave: |-
        $f'(x) = \e^x + 1$ en $f(0) = 3$
      antwoord: |-
        $\e^x+x+2$
    - opgave: |-
        $f'(x) = \tfrac1x$ en $f(1) = 5$, met $x > 0$
      antwoord: |-
        $\ln x+5$
  uitwerking: |-
    Zoek een primitieve met $C$, en vul de voorwaarde in.\\
    \textbf{a.}~$1-2+C=4$, dus $C=5$. \quad \textbf{b.}~$0+C=2$. \quad \textbf{c.}~$1+0+C=3$, dus $C=2$. \quad \textbf{d.}~$0+C=5$.

- id: h3-d4
  soort: opdracht
  niveau: 2
  thema: |-
    drill: alle methodes door elkaar, zelf herkennen
  opgave: |-
    Bereken. Bij een oneven macht van $\sin x$ of $\cos x$ houd je één factor apart, en bij een breuk met dezelfde graad deel je eerst.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig x^2\e^{-x}\dx$
      antwoord: |-
        $-\e^{-x}(x^2+2x+2)$
      uitwerking: |-
        Twee keer partieel, met de veelterm als $f$.
    - opgave: |-
        $\ig \sin x\cos^2 x\dx$
      antwoord: |-
        $-\tfrac13\cos^3 x$
      uitwerking: |-
        $u=\cos x$.
    - opgave: |-
        $\ig \sin^3 x\dx$
      antwoord: |-
        $-\cos x+\tfrac13\cos^3 x$
      uitwerking: |-
        $\sin x\,(1-\cos^2 x)$, dan $u=\cos x$.
    - opgave: |-
        $\ig \dfrac{\e^x}{1 + \e^x}\dx$
      antwoord: |-
        $\ln(1+\e^x)$
      uitwerking: |-
        De afgeleide van de noemer staat in de teller.
    - opgave: |-
        $\ig \dfrac{\e^x}{1 + \e^{2x}}\dx$
      antwoord: |-
        $\bgtan(\e^x)$
      uitwerking: |-
        $u=\e^x$ geeft $\displaystyle\int\dfrac{1}{1+u^2}\du$.
    - opgave: |-
        $\ig \dfrac{1}{x\ln x}\dx$
      antwoord: |-
        $\ln|\ln x|$
      uitwerking: |-
        $u=\ln x$ geeft $\displaystyle\int\dfrac1u\du$.
    - opgave: |-
        $\ig \dfrac{\cos x}{\sqrt{\sin x}}\dx$
      antwoord: |-
        $2\sqrt{\sin x}$
      uitwerking: |-
        $u=\sin x$ geeft $\displaystyle\int u^{-1/2}\du$.
    - opgave: |-
        $\ig \dfrac{x + 3}{x + 1}\dx$
      antwoord: |-
        $x+2\ln|x+1|$
      uitwerking: |-
        $\dfrac{(x+1)+2}{x+1}=1+\dfrac{2}{x+1}$.
    - opgave: |-
        $\ig \dfrac{x^2}{x^2 + 1}\dx$
      antwoord: |-
        $x-\bgtan x$
      uitwerking: |-
        $\dfrac{(x^2+1)-1}{x^2+1}=1-\dfrac{1}{x^2+1}$.
    - opgave: |-
        $\ig \sin^2(3x)\dx$
      antwoord: |-
        $\tfrac{x}{2}-\tfrac{\sin 6x}{12}$
      uitwerking: |-
        Dubbele hoek: $\dfrac{1-\cos 6x}{2}$.
    - opgave: |-
        $\ig \dfrac{1}{\sin^2 x\cos^2 x}\dx$
      antwoord: |-
        $\tan x-\cot x$
      uitwerking: |-
        Teller $=\sin^2 x+\cos^2 x$: dat geeft $\dfrac{1}{\cos^2 x}+\dfrac{1}{\sin^2 x}$.
    - opgave: |-
        $\ig x^2\ln x\dx$
      antwoord: |-
        $\tfrac{x^3}{3}\ln x-\tfrac{x^3}{9}$
      uitwerking: |-
        Partieel met $f=\ln x$.
    - opgave: |-
        $\ig (\ln x)^2\dx$
      antwoord: |-
        $x(\ln x)^2-2x\ln x+2x$
      uitwerking: |-
        Partieel met $f=(\ln x)^2$ en $g=x$, daarna nog eens $\displaystyle\int\ln x\dx$.
    - opgave: |-
        $\ig \cos^3 x\dx$
      antwoord: |-
        $\sin x-\tfrac13\sin^3 x$
      uitwerking: |-
        $\cos x\,(1-\sin^2 x)$, dan $u=\sin x$.
    - opgave: |-
        $\ig \dfrac{\ln x}{x^2}\dx$
      antwoord: |-
        $-\tfrac{\ln x}{x}-\tfrac1x$
      uitwerking: |-
        Partieel met $f=\ln x$ en $g=-\tfrac1x$.
    - opgave: |-
        $\ig x^2\sin x\dx$
      antwoord: |-
        $-x^2\cos x+2x\sin x+2\cos x$
      uitwerking: |-
        Twee keer partieel, met de veelterm als $f$.
  antwoord_voor: |-
    (telkens $+\,C$)

- id: h3-d5
  soort: opdracht
  niveau: 2
  thema: |-
    drill: bepaalde integralen, door elkaar
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig_0^1 (2x + 1)^3\dx$
      antwoord: |-
        10
    - opgave: |-
        $\ig_0^{\pi} x\sin x\dx$
      antwoord: |-
        $\pi$
    - opgave: |-
        $\ig_1^{\e} \ln x\dx$
      antwoord: |-
        1
    - opgave: |-
        $\ig_0^{\pi} \cos^2\dfrac{x}{2}\dx$
      antwoord: |-
        $\tfrac{\pi}{2}$
    - opgave: |-
        $\ig_0^1 x\,\e^x\dx$
      antwoord: |-
        1
    - opgave: |-
        $\ig_0^2 \dfrac{x}{x^2 + 1}\dx$
      antwoord: |-
        $\tfrac12\ln 5$
    - opgave: |-
        $\ig_1^{\e} \dfrac{(\ln x)^3}{x}\dx$
      antwoord: |-
        $\tfrac14$
    - opgave: |-
        $\ig_0^{\pi/4} \tan x\dx$
      antwoord: |-
        $\tfrac12\ln 2$
    - opgave: |-
        $\ig_0^1 x^2\e^{x^3}\dx$
      antwoord: |-
        $\tfrac{\e-1}{3}$
    - opgave: |-
        $\ig_0^{\pi/2} x\cos x\dx$
      antwoord: |-
        $\tfrac{\pi}{2}-1$
    - opgave: |-
        $\ig_0^4 \sqrt{2x + 1}\dx$
      antwoord: |-
        $\tfrac{26}{3}$
    - opgave: |-
        $\ig_0^{\pi/2} \sin^3 x\dx$
      antwoord: |-
        $\tfrac23$
  uitwerking: |-
    \textbf{a.}~$\bigl[\tfrac18(2x+1)^4\bigr]_0^1=10$. \quad \textbf{b.}~$\bigl[\sin x-x\cos x\bigr]_0^{\pi}=\pi$. \quad \textbf{c.}~$\bigl[x\ln x-x\bigr]_1^{\e}=1$.\\
    \textbf{d.}~$\displaystyle\int_0^{\pi}\dfrac{1+\cos x}{2}\dx=\tfrac{\pi}{2}$. \quad \textbf{e.}~$\bigl[(x-1)\e^x\bigr]_0^1=1$. \quad \textbf{f.}~$\bigl[\tfrac12\ln(x^2+1)\bigr]_0^2=\tfrac12\ln 5$.\\
    \textbf{g.}~$u=\ln x$: $\displaystyle\int_0^1 u^3\du=\tfrac14$. \quad \textbf{h.}~$\bigl[-\ln|\cos x|\bigr]_0^{\pi/4}=-\ln\tfrac{\sqrt{2}}{2}=\tfrac12\ln 2$.\\
    \textbf{i.}~$u=x^3$: $\tfrac13\displaystyle\int_0^1\e^u\du=\tfrac{\e-1}{3}$. \quad \textbf{j.}~$\bigl[x\sin x+\cos x\bigr]_0^{\pi/2}=\tfrac{\pi}{2}-1$.\\
    \textbf{k.}~$\bigl[\tfrac13(2x+1)^{3/2}\bigr]_0^4=\tfrac{27-1}{3}$. \quad \textbf{l.}~$u=\cos x$: $\displaystyle\int_0^1(1-u^2)\du=\tfrac23$.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    fouten opsporen
  opgave: |-
    Elk antwoord is fout. Toon dat aan met de afgeleide en geef het juiste antwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        $\ig \sin^2 x\dx = \dfrac{\sin^3 x}{3} + C$
      antwoord: |-
        $\tfrac{x}{2}-\tfrac{\sin 2x}{4}+C$
      uitwerking: |-
        De afgeleide is $\sin^2 x\cos x$. Juist: dubbele hoek.
    - opgave: |-
        $\ig \dfrac{1}{x^2 + 1}\dx = \ln(x^2 + 1) + C$
      antwoord: |-
        $\bgtan x+C$
      uitwerking: |-
        De afgeleide is $\tfrac{2x}{x^2+1}$. Juist: $\bgtan x+C$.
    - opgave: |-
        $\ig \e^{x^2}\dx = \dfrac{\e^{x^2}}{2x} + C$
      antwoord: |-
        geen primitieve in gekende functies
      uitwerking: |-
        De afgeleide met de quotiëntregel is $\e^{x^2}-\dfrac{\e^{x^2}}{2x^2}$, dus niet de integrand. Je mag niet delen door iets dat van $x$ afhangt. Deze integraal heeft geen primitieve in gekende functies.

- id: h3-oln
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte met substitutie
  figuur:
    code: |-
      \begin{tikzpicture}[x=.9cm,y=2.2cm,font=\scriptsize]
        \gebied{1}{2.718}{ln(\x)/\x}
        \rooster{0}{1}{3}{0}{1}{1}
        \kromme{1}{3}{ln(\x)/\x}
        \node[above,fill=white,inner sep=.5pt] at (2.718,0) {$\e$};
      \end{tikzpicture}
  opgave: |-
    Bereken de oppervlakte van het gekleurde gebied tussen de grafiek van $y = \dfrac{\ln x}{x}$ en de horizontale as op $[1, \e]$.
  antwoord: |-
    $\tfrac12$
  uitwerking: |-
    $u=\ln x$, grenzen 0 en 1: $\displaystyle\int_0^1 u\du=\tfrac12$.

- id: h3-osc
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte met dubbele hoek
  figuur:
    code: |-
      \begin{tikzpicture}[x=1.5cm,y=1.5cm,font=\scriptsize]
        \gebiedtussen{0}{.7854}{(cos(\x r))^2}{(sin(\x r))^2}
        \roosterleeg{0}{1}{2}{0}{1}{1}
        \kromme{0}{1.57}{(cos(\x r))^2}
        \kromme[dashed]{0}{1.57}{(sin(\x r))^2}
        \node[below] at (.7854,0) {$\frac{\pi}{4}$};
        \node[below] at (1.57,0) {$\frac{\pi}{2}$};
        \node[left] at (0,1) {1};
      \end{tikzpicture}
  opgave: |-
    Bereken de oppervlakte van het gebied tussen de grafieken van $y = \cos^2 x$ en $y = \sin^2 x$ op $\bigl[0, \tfrac{\pi}{4}\bigr]$. Welke formule voor de dubbele hoek maakt het kort?
  antwoord: |-
    $\tfrac12$
  uitwerking: |-
    $\cos^2 x-\sin^2 x=\cos 2x$, dus $\displaystyle\int_0^{\pi/4}\cos 2x\dx=\Bigl[\tfrac12\sin 2x\Bigr]_0^{\pi/4}=\tfrac12$.

- id: h3-o19
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte met partiële integratie
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.95cm,y=2.6cm,font=\scriptsize]
        \gebied{0}{2}{\x*exp(-\x)}
        \roosterleeg{0}{1}{3}{0}{1}{1}
        \kromme{0}{3}{\x*exp(-\x)}
        \node[below] at (1,0) {1};
        \node[below] at (2,0) {2};
        \node[left] at (0,1) {1};
      \end{tikzpicture}
  opgave: |-
    Bereken de oppervlakte tussen de grafiek van $y = x\,\e^{-x}$ en de horizontale as op $[0, 2]$. Rond af op drie decimalen.
  antwoord: |-
    $1-3\e^{-2}\approx 0{,}594$
  uitwerking: |-
    De functie is positief op dat interval. $\bigl[-(x+1)\e^{-x}\bigr]_0^2=-3\e^{-2}+1\approx 0{,}594$.

- id: h3-o20
  soort: opdracht
  niveau: 2
  thema: |-
    hoeveelheid uit een debiet
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.22cm,font=\scriptsize]
        \gebied{0}{4}{10*exp(-.5*\x)}
        \rooster{0}{2}{8}{0}{5}{10}
        \kromme{0}{8}{10*exp(-.5*\x)}
      \end{tikzpicture}
  opgave: |-
    Een patiënt krijgt via een infuus een medicijn. Het debiet is $10\,\e^{-0{,}5t}$ milligram per uur, met $t$ in uren.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel medicijn komt er binnen in de eerste 4 uur? Rond af op twee decimalen.
      antwoord: |-
        $\approx 17{,}29$ mg
      uitwerking: |-
        $\displaystyle\int_0^4 10\,\e^{-0{,}5t}\dt=\Bigl[-20\,\e^{-0{,}5t}\Bigr]_0^4=20(1-\e^{-2})\approx 17{,}29$.
    - opgave: |-
        Hoeveel komt er in totaal binnen als het infuus heel lang blijft hangen?
      antwoord: |-
        20 mg
      uitwerking: |-
        Op $[0,b]$ is de hoeveelheid $20(1-\e^{-0{,}5b})$, en dat gaat naar 20 voor $b\to+\infty$.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    verschillende antwoorden, hetzelfde resultaat
  opgave: |-
    Bereken $\ig \sin x\cos x\dx$ op drie manieren: met $u = \sin x$, met $u = \cos x$, en met \mbox{$\sin 2x = 2\sin x\cos x$}. Waarom zien de antwoorden er anders uit?
  antwoord: |-
    $\tfrac12\sin^2 x+C$; $-\tfrac12\cos^2 x+C$; $-\tfrac14\cos 2x+C$
  uitwerking: |-
    De drie functies verschillen een constante: $-\tfrac12\cos^2 x=\tfrac12\sin^2 x-\tfrac12$ en $-\tfrac14\cos 2x=\tfrac12\sin^2 x-\tfrac14$. De $C$ is dus niet in alle antwoorden dezelfde.
    \figuren{\begin{tikzpicture}[x=.65cm,y=1.4cm,font=\scriptsize]
      \roosterleeg{0}{1}{4}{-1}{1}{1}
      \kromme{0}{3.1416}{.5*(sin(\x r))^2}
      \kromme[dashed]{0}{3.1416}{-.5*(cos(\x r))^2}
      \kromme[dotted]{0}{3.1416}{-.25*cos(2*\x r)}
      \node[below] at (3.1416,0) {$\pi$};
    \end{tikzpicture}}

- id: h3-o23
  soort: opdracht
  niveau: 2
  thema: |-
    gemiddelde waarde: wisselspanning
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.48cm,y=.85cm,font=\scriptsize]
        \gebied[accent!18]{0}{6.2832}{(sin(\x r))^2}
        \roosterleeg{0}{1}{7}{-1}{1}{1}
        \kromme[dashed]{0}{6.2832}{sin(\x r)}
        \kromme{0}{6.2832}{(sin(\x r))^2}
        \draw[accent,dotted,thick] (0,.5) -- (6.2832,.5);
        \node[below] at (6.2832,0) {$T$};
        \node[left] at (0,1) {$U_0$};
      \end{tikzpicture}
  opgave: |-
    Een wisselspanning is $U(t) = U_0 \sin(\omega t)$, met periode $T = \tfrac{2\pi}{\omega}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom is de gemiddelde spanning over een periode 0?
      uitwerking: |-
        Het stuk boven de as en het stuk eronder heffen elkaar op.
    - opgave: |-
        Bereken de gemiddelde waarde van $U^2$ over een periode.
      antwoord: |-
        $\tfrac12 U_0^2$
      uitwerking: |-
        $\dfrac{U_0^2}{T}\displaystyle\int_0^T\sin^2(\omega t)\dt=\dfrac{U_0^2}{T}\Bigl[\dfrac{t}{2}-\dfrac{\sin(2\omega t)}{4\omega}\Bigr]_0^T=\dfrac{U_0^2}{T}\cdot\dfrac{T}{2}=\tfrac12 U_0^2$.
    - opgave: |-
        De effectieve spanning is de wortel uit die gemiddelde waarde. Op het stopcontact is dat 230 V. Hoe groot is $U_0$?
      antwoord: |-
        $\approx 325$ V
      uitwerking: |-
        $\dfrac{U_0}{\sqrt{2}}=230$, dus $U_0=230\sqrt{2}\approx 325$ V.

- id: h3-d6
  soort: opdracht
  niveau: 3
  thema: |-
    drill: lastige integralen, soms twee methodes na elkaar
  opgave: |-
    Bereken. Hier volstaat één methode niet altijd: combineer ze.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig x^3\e^{x^2}\dx$
      antwoord: |-
        $\tfrac12(x^2-1)\e^{x^2}$
      uitwerking: |-
        $u=x^2$ geeft $\tfrac12\displaystyle\int u\,\e^u\du$, daarna partieel.
    - opgave: |-
        $\ig \e^{\sqrt{x}}\dx$
      antwoord: |-
        $2(\sqrt{x}-1)\e^{\sqrt{x}}$
      uitwerking: |-
        $u=\sqrt{x}$, dus $\dx=2u\du$: $2\displaystyle\int u\,\e^u\du$, daarna partieel.
    - opgave: |-
        $\ig \sin(\ln x)\dx$
      antwoord: |-
        $\tfrac{x}{2}\bigl(\sin(\ln x)-\cos(\ln x)\bigr)$
      uitwerking: |-
        Twee keer partieel met $g=x$. De oorspronkelijke integraal keert terug.
    - opgave: |-
        $\ig x\bgtan x\dx$
      antwoord: |-
        $\tfrac12\bigl((x^2+1)\bgtan x-x\bigr)$
      uitwerking: |-
        Partieel met $f=\bgtan x$ en $g=\tfrac{x^2}{2}$. Schrijf daarna $\dfrac{x^2}{1+x^2}=1-\dfrac{1}{1+x^2}$.
    - opgave: |-
        $\ig \bgsin x\dx$
      antwoord: |-
        $x\bgsin x+\sqrt{1-x^2}$
      uitwerking: |-
        Partieel met $g=x$, daarna $u=1-x^2$.
    - opgave: |-
        $\ig \dfrac{1}{\e^x + \e^{-x}}\dx$
      antwoord: |-
        $\bgtan(\e^x)$
      uitwerking: |-
        Teller en noemer maal $\e^x$: $\displaystyle\int\dfrac{\e^x}{\e^{2x}+1}\dx$, en dan $u=\e^x$.
    - opgave: |-
        $\ig \dfrac{1}{x\,(1 + \ln^2 x)}\dx$
      antwoord: |-
        $\bgtan(\ln x)$
      uitwerking: |-
        $u=\ln x$.
    - opgave: |-
        $\ig \sin^4 x\dx$
      antwoord: |-
        $\tfrac{3x}{8}-\tfrac{\sin 2x}{4}+\tfrac{\sin 4x}{32}$
      uitwerking: |-
        Twee keer Carnot: $\sin^4 x=\tfrac14(1-\cos 2x)^2$, en daarin $\cos^2 2x=\tfrac12(1+\cos 4x)$.
    - opgave: |-
        $\ig \sin^3 x\cos^2 x\dx$
      antwoord: |-
        $-\tfrac13\cos^3 x+\tfrac15\cos^5 x$
      uitwerking: |-
        Houd één $\sin x$ apart: $\sin x\,(1-\cos^2 x)\cos^2 x$, en $u=\cos x$.
    - opgave: |-
        $\ig \tan^3 x\dx$
      antwoord: |-
        $\tfrac12\tan^2 x+\ln|\cos x|$
      uitwerking: |-
        $\tan^3 x=\tan x\Bigl(\dfrac{1}{\cos^2 x}-1\Bigr)$. Eerste deel met $u=\tan x$, en $\displaystyle\int\tan x\dx=-\ln|\cos x|$.
    - opgave: |-
        $\ig \dfrac{x^2}{\sqrt{x + 1}}\dx$
      antwoord: |-
        $\tfrac25(x+1)^{5/2}-\tfrac43(x+1)^{3/2}+2\sqrt{x+1}$
      uitwerking: |-
        $u=x+1$ en $x^2=(u-1)^2$: $\displaystyle\int(u^{3/2}-2u^{1/2}+u^{-1/2})\du$.
    - opgave: |-
        $\ig \dfrac{1}{1 + \sqrt{x}}\dx$
      antwoord: |-
        $2\sqrt{x}-2\ln(1+\sqrt{x})$
      uitwerking: |-
        $u=1+\sqrt{x}$, dus $\dx=2(u-1)\du$: $2\displaystyle\int\Bigl(1-\dfrac1u\Bigr)\du$.
    - opgave: |-
        $\ig \dfrac{1}{x^2 + 2x + 5}\dx$
      antwoord: |-
        $\tfrac12\bgtan\tfrac{x+1}{2}$
      uitwerking: |-
        Kwadraat afsplitsen: $(x+1)^2+4$, met $a=2$.
    - opgave: |-
        $\ig x\ln(x^2 + 1)\dx$
      antwoord: |-
        $\tfrac12\bigl((x^2+1)\ln(x^2+1)-x^2\bigr)$
      uitwerking: |-
        $u=x^2+1$ geeft $\tfrac12\displaystyle\int\ln u\du=\tfrac12(u\ln u-u)+C$. De constante $\tfrac12$ gaat op in $C$.
    - opgave: |-
        $\ig \cos x\,\ln(\sin x)\dx$
      antwoord: |-
        $\sin x\ln(\sin x)-\sin x$
      uitwerking: |-
        $u=\sin x$ geeft $\displaystyle\int\ln u\du$.
  antwoord_voor: |-
    (telkens $+\,C$)

- id: h3-weierstrass
  soort: opdracht
  niveau: 3
  thema: |-
    Weierstrasssubstitutie
  opgave: |-
    Elke breuk met $\sin x$ en $\cos x$ wordt een breuk zonder goniometrie met de substitutie \mbox{$t = \tan\tfrac{x}{2}$}.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: $\sin x = \dfrac{2t}{1 + t^2}$, \ $\cos x = \dfrac{1 - t^2}{1 + t^2}$ \ en \ $\mathrm{d}x = \dfrac{2}{1 + t^2}\dt$.
      uitwerking: |-
        $\sin x=2\sin\tfrac{x}{2}\cos\tfrac{x}{2}=\dfrac{2\tan\tfrac{x}{2}}{1/\cos^2\tfrac{x}{2}}=\dfrac{2t}{1+t^2}$, want $\dfrac{1}{\cos^2\alpha}=1+\tan^2\alpha$. Net zo $\cos x=\cos^2\tfrac{x}{2}-\sin^2\tfrac{x}{2}=\cos^2\tfrac{x}{2}\,(1-t^2)=\dfrac{1-t^2}{1+t^2}$. Uit $x=2\bgtan t$ volgt $\mathrm{d}x=\dfrac{2}{1+t^2}\dt$.
    - opgave: |-
        Bereken $\ig_0^{\pi/2} \dfrac{1}{1 + \cos x}\dx$.
      antwoord: |-
        1
      uitwerking: |-
        $1+\cos x=\dfrac{2}{1+t^2}$, grenzen 0 en 1: $\displaystyle\int_0^1\dfrac{1+t^2}{2}\cdot\dfrac{2}{1+t^2}\dt=\int_0^1 1\dt=1$.
    - opgave: |-
        Bereken $\ig \dfrac{1}{\sin x}\dx$.
      antwoord: |-
        $\ln\bigl|\tan\tfrac{x}{2}\bigr|+C$
      uitwerking: |-
        $\displaystyle\int\dfrac{1+t^2}{2t}\cdot\dfrac{2}{1+t^2}\dt=\int\dfrac1t\dt=\ln|t|+C$.
    - opgave: |-
        Bereken $\ig \dfrac{1}{1 + \sin x}\dx$.
      antwoord: |-
        $-\dfrac{2}{1+\tan\tfrac{x}{2}}+C$
      uitwerking: |-
        $1+\sin x=\dfrac{(1+t)^2}{1+t^2}$, dus $\displaystyle\int\dfrac{2}{(1+t)^2}\dt=-\dfrac{2}{1+t}+C$.
    - opgave: |-
        Bereken $\ig_0^{\pi/2} \dfrac{1}{2 + \cos x}\dx$.
      antwoord: |-
        $\tfrac{\pi}{3\sqrt{3}}$
      uitwerking: |-
        $2+\cos x=\dfrac{3+t^2}{1+t^2}$, dus $\displaystyle\int_0^1\dfrac{2}{3+t^2}\dt=\dfrac{2}{\sqrt{3}}\Bigl[\bgtan\dfrac{t}{\sqrt{3}}\Bigr]_0^1=\dfrac{2}{\sqrt{3}}\cdot\dfrac{\pi}{6}=\dfrac{\pi}{3\sqrt{3}}$.

- id: h3-hyperbolisch
  soort: opdracht
  niveau: 3
  thema: |-
    substitutie met cosh en sinh, vergeleken met tan
  opgave: |-
    Noem $\cosh t = \tfrac12(\e^t + \e^{-t})$ en $\sinh t = \tfrac12(\e^t - \e^{-t})$. Bij een wortel als $\sqrt{1 + x^2}$ helpt een substitutie die de wortel wegwerkt. Daarvoor heb je twee keuzes: $x = \sinh t$ of $x = \tan t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: $\cosh^2 t - \sinh^2 t = 1$, \ $(\sinh t)' = \cosh t$ \ en \ $(\cosh t)' = \sinh t$. Vergelijk de eerste formule met $1 + \tan^2 t = \dfrac{1}{\cos^2 t}$: wat doet elk van beide met $\sqrt{1 + x^2}$?
      uitwerking: |-
        Reken uit: $\cosh^2 t-\sinh^2 t=\tfrac14\bigl((\e^{2t}+2+\e^{-2t})-(\e^{2t}-2+\e^{-2t})\bigr)=1$. Met $x=\sinh t$ is $\sqrt{1+x^2}=\cosh t$, met $x=\tan t$ is $\sqrt{1+x^2}=\dfrac{1}{\cos t}$ (op $\bigl[0,\tfrac{\pi}{2}\bigr[$).
    - opgave: |-
        Bereken $\ig_0^1 \dfrac{1}{\sqrt{1 + x^2}}\dx$ met $x = \sinh t$. De bovengrens $t_1$ voldoet aan $\sinh t_1 = 1$: toon aan dat $t_1 = \ln(1 + \sqrt{2})$.
      antwoord: |-
        $\ln(1+\sqrt{2})$
      uitwerking: |-
        $\mathrm{d}x=\cosh t\dt$ en $\sqrt{1+x^2}=\cosh t$, dus de integraal is $\displaystyle\int_0^{t_1}1\dt=t_1$. Uit $\e^t-\e^{-t}=2$ volgt met $y=\e^t$: $y^2-2y-1=0$, dus $y=1+\sqrt{2}$.
    - opgave: |-
        Bereken dezelfde integraal met $x = \tan t$. Welke substitutie is hier het kortst?\\ Je mag gebruiken: $\dfrac{1}{1 - v^2} = \dfrac12\Bigl(\dfrac{1}{1 + v} + \dfrac{1}{1 - v}\Bigr)$.
      antwoord: |-
        opnieuw $\ln(1+\sqrt{2})$; $x=\sinh t$ is korter
      uitwerking: |-
        $\mathrm{d}x=\dfrac{\mathrm{d}t}{\cos^2 t}$, grenzen 0 en $\tfrac{\pi}{4}$: $\displaystyle\int_0^{\pi/4}\dfrac{1}{\cos t}\dt=\int_0^{\pi/4}\dfrac{\cos t}{1-\sin^2 t}\dt$. Met $v=\sin t$: $\displaystyle\int_0^{\sqrt{2}/2}\dfrac{1}{1-v^2}\,\mathrm{d}v=\Bigl[\tfrac12\ln\dfrac{1+v}{1-v}\Bigr]_0^{\sqrt{2}/2}=\tfrac12\ln\dfrac{2+\sqrt{2}}{2-\sqrt{2}}=\ln(1+\sqrt{2})$. Met $\sinh$ werd de integrand meteen 1.
    - opgave: |-
        Bereken $\ig_0^1 \sqrt{1 + x^2}\dx$ met $x = \sinh t$. Gebruik $\cosh^2 t = \tfrac12(1 + \cosh 2t)$.
      antwoord: |-
        $\tfrac12\ln(1+\sqrt{2})+\tfrac{\sqrt{2}}{2}\approx 1{,}148$
      uitwerking: |-
        $\displaystyle\int_0^{t_1}\cosh^2 t\dt=\Bigl[\dfrac{t}{2}+\dfrac{\sinh 2t}{4}\Bigr]_0^{t_1}=\dfrac{t_1}{2}+\dfrac{\sinh t_1\cosh t_1}{2}$, met $\sinh t_1=1$ en $\cosh t_1=\sqrt{2}$.

- id: h3-o24
  soort: opdracht
  niveau: 3
  thema: |-
    partieel met een parameter
  opgave: |-
    Bereken $\ig \e^{2x}\sin 3x\dx$ met twee keer partiële integratie.
  antwoord: |-
    $\tfrac{1}{13}\e^{2x}(2\sin 3x-3\cos 3x)+C$
  uitwerking: |-
    Noem de integraal $I$. Met $f=\sin 3x$ en $g=\tfrac12\e^{2x}$: $I=\tfrac12\e^{2x}\sin 3x-\tfrac32\displaystyle\int\e^{2x}\cos 3x\dx$.\\
    Nog eens met $f=\cos 3x$: $\displaystyle\int\e^{2x}\cos 3x\dx=\tfrac12\e^{2x}\cos 3x+\tfrac32 I$.\\
    Samen: $I=\tfrac12\e^{2x}\sin 3x-\tfrac34\e^{2x}\cos 3x-\tfrac94 I$, dus $\tfrac{13}{4}I=\tfrac14\e^{2x}(2\sin 3x-3\cos 3x)$.

- id: h3-o25
  soort: opdracht
  niveau: 3
  thema: |-
    reductieformule
  opgave: |-
    Noem $I_n = \ig (\ln x)^n\dx$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: $I_n = x(\ln x)^n - n\,I_{n-1}$ voor $n \geqslant 1$.
      uitwerking: |-
        $f=(\ln x)^n$, $f'=\dfrac{n(\ln x)^{n-1}}{x}$ en $g=x$. Dus $I_n=x(\ln x)^n-n\displaystyle\int(\ln x)^{n-1}\dx$.
    - opgave: |-
        Bereken $I_3$.
      antwoord: |-
        $x\bigl((\ln x)^3-3(\ln x)^2+6\ln x-6\bigr)+C$
      uitwerking: |-
        $I_0=x+C$, $I_1=x\ln x-x+C$, $I_2=x(\ln x)^2-2x\ln x+2x+C$, en $I_3=x(\ln x)^3-3I_2$.

- id: h3-o26
  soort: opdracht
  niveau: 3
  thema: |-
    een schijnbare paradox
  opgave: |-
    Mo past partiële integratie toe op $\ig \dfrac1x\dx$, met $f = \tfrac1x$ en $g' = 1$, en krijgt:
    \[ \ig \dfrac1x\dx = \dfrac1x \cdot x - \ig \Bigl(-\dfrac{1}{x^2}\Bigr) x\dx = 1 + \ig \dfrac1x\dx \]
    Aan beide kanten de integraal aftrekken geeft $0 = 1$. Wat is er misgegaan?
  antwoord: |-
    Een onbepaalde integraal is een verzameling primitieven.
  uitwerking: |-
    Een onbepaalde integraal is geen getal maar een verzameling primitieven die een constante verschillen. $1+\displaystyle\int\frac1x\dx$ is dezelfde verzameling als $\displaystyle\int\frac1x\dx$, dus je mag de integraal niet aftrekken alsof het getallen zijn. Met grenzen gebeurt er niets vreemds: $\Bigl[\tfrac1x\cdot x\Bigr]_a^b=0$.

- id: h3-o27
  soort: opdracht
  niveau: 3
  thema: |-
    slimme substitutie: symmetrie
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=1.55cm,y=1.9cm,font=\scriptsize]
        \gebied{0}{1.5708}{sin(\x r)/(sin(\x r)+cos(\x r))}
        \roosterleeg{0}{1}{2}{0}{1}{1}
        \kromme{0}{1.5708}{sin(\x r)/(sin(\x r)+cos(\x r))}
        \draw[accent,dashed] (0,.5) -- (1.5708,.5);
        \node[below] at (.7854,0) {$\frac{\pi}{4}$};
        \node[below] at (1.5708,0) {$\frac{\pi}{2}$};
        \node[left] at (0,1) {1};
        \node[left] at (0,.5) {$\frac12$};
      \end{tikzpicture}
  opgave: |-
    Noem $I = \ig_0^{\pi/2} \dfrac{\sin x}{\sin x + \cos x}\dx$.
  lijst: enumerate
  delen:
    - opgave: |-
        Gebruik $u = \tfrac{\pi}{2} - x$ om aan te tonen dat ook $I = \ig_0^{\pi/2} \dfrac{\cos u}{\cos u + \sin u}\du$.
      uitwerking: |-
        $\sin(\tfrac{\pi}{2}-u)=\cos u$, $\cos(\tfrac{\pi}{2}-u)=\sin u$, $\mathrm{d}x=-\mathrm{d}u$ en de grenzen wisselen: dat minteken verdwijnt door de grenzen om te keren.
    - opgave: |-
        Tel de twee vormen op en bereken $I$.
      antwoord: |-
        $\tfrac{\pi}{4}$
      uitwerking: |-
        $2I=\displaystyle\int_0^{\pi/2}1\dx=\dfrac{\pi}{2}$, dus $I=\dfrac{\pi}{4}$.

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Een primitieve van $(x^2 + 1)\e^x$ heeft de vorm $(ax^2 + bx + c)\e^x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Leid af en stel een stelsel op voor $a$, $b$ en $c$. Schrijf het als een matrixvergelijking.
      uitwerking: |-
        De afgeleide is $\bigl(ax^2+(2a+b)x+(b+c)\bigr)\e^x$, dus $\begin{pmatrix} 1 & 0 & 0 \\ 2 & 1 & 0 \\ 0 & 1 & 1 \end{pmatrix}\begin{pmatrix} a \\ b \\ c \end{pmatrix}=\begin{pmatrix} 1 \\ 0 \\ 1 \end{pmatrix}$.
    - opgave: |-
        Los op met de inverse matrix, en geef de primitieve.
      antwoord: |-
        $(x^2-2x+3)\e^x$
      uitwerking: |-
        De inverse is $\begin{pmatrix} 1 & 0 & 0 \\ -2 & 1 & 0 \\ 2 & -1 & 1 \end{pmatrix}$, en dat geeft $a=1$, $b=-2$, $c=3$.
    - opgave: |-
        Bereken met diezelfde inverse matrix meteen een primitieve van $(2x^2 - x + 3)\e^x$.
      antwoord: |-
        $(2x^2-5x+8)\e^x$
      uitwerking: |-
        Inverse maal $(2,-1,3)^T$ geeft $(2,-5,8)^T$.

- id: h3-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Analytische meetkunde
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=.7cm,y=.7cm,font=\scriptsize]
        \fill[accent!30] (-2,0) arc (180:0:2 and 1.2) -- cycle;
        \assen{-2.5}{2.6}{-1.4}{1.6}
        \draw[accent,thick] (0,0) ellipse (2 and 1.2);
        \node[below right,inner sep=1pt] at (2,0) {$a$};
        \node[above right,inner sep=1pt] at (0,1.2) {$b$};
      \end{tikzpicture}
  opgave: |-
    Ook de oppervlakte van een cirkel en een ellips vind je met een substitutie, namelijk $x = r\sin t$. Ze gaat hier van de andere kant: je drukt $x$ uit in de nieuwe veranderlijke.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: $\ig_{-r}^{r} \sqrt{r^2 - x^2}\dx = r^2 \ig_{-\pi/2}^{\pi/2} \cos^2 t\dt$. Bereken de integraal. Wat heb je berekend?
      antwoord: |-
        $\tfrac{\pi r^2}{2}$, een halve cirkel
      uitwerking: |-
        $\sqrt{r^2-r^2\sin^2 t}=r\cos t$ op $[-\tfrac{\pi}{2},\tfrac{\pi}{2}]$ en $\mathrm{d}x=r\cos t\dt$. De integraal is $r^2\cdot\tfrac{\pi}{2}$, de oppervlakte van een halve cirkel.
    - opgave: |-
        De ellips $\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1$ heeft bovenste helft $y = \dfrac{b}{a}\sqrt{a^2 - x^2}$. Bereken de oppervlakte van de ellips.
      antwoord: |-
        $\pi ab$
      uitwerking: |-
        $2\cdot\dfrac{b}{a}\cdot\dfrac{\pi a^2}{2}=\pi ab$.

- id: h3-koppel-4
  soort: koppel
  niveau: 3
  koppel:
    rubriek: discreet
    onderwerp: |-
      Rijen
  figuur:
    opties: ''
    code: |-
      \begin{tikzpicture}[x=2.2cm,y=.62cm,font=\scriptsize]
        \gebied[accent!16]{0}{1}{\x*exp(\x)}
        \gebied[accent!32]{0}{1}{(\x)^4*exp(\x)}
        \draw[black!14,very thin,step=.25] (0,0) grid (1,3);
        \draw[->,grijs] (0,0) -- (1.12,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,0) -- (0,3.2);
        \kromme{0}{1}{\x*exp(\x)}
        \kromme{0}{1}{(\x)^2*exp(\x)}
        \kromme{0}{1}{(\x)^4*exp(\x)}
        \node[below] at (1,0) {1};
        \node[left] at (0,2.718) {$\e$};
      \end{tikzpicture}
  opgave: |-
    Noem $I_n = \ig_0^1 x^n \e^x\dx$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: $I_n = \e - n\,I_{n-1}$ voor $n \geqslant 1$. Dat is een recursieve rij.
      uitwerking: |-
        $f=x^n$, $g=\e^x$: $\bigl[x^n\e^x\bigr]_0^1-n\displaystyle\int_0^1 x^{n-1}\e^x\dx$.
    - opgave: |-
        Bereken $I_0$ tot en met $I_4$ exact.
      antwoord: |-
        $\e-1$; 1; $\e-2$; $6-2\e$; $9\e-24$
      uitwerking: |-
        $I_0=\e-1$, $I_1=\e-(\e-1)=1$, $I_2=\e-2$, $I_3=\e-3(\e-2)=6-2\e$, $I_4=\e-4(6-2\e)=9\e-24$.
    - opgave: |-
        Toon aan: $0 \leqslant I_n \leqslant \dfrac{\e}{n + 1}$. Wat is de limiet van de rij?
      antwoord: |-
        0
      uitwerking: |-
        Op $[0,1]$ is $0\leqslant x^n\e^x\leqslant\e\,x^n$, en $\displaystyle\int_0^1\e\,x^n\dx=\dfrac{\e}{n+1}$. Insluiten: de limiet is 0.

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Bepaal $f$ als $f'(x) = 2x - 3$ en $f(2) = 1$.
  antwoord: |-
    $f(x)=x^2-3x+3$
  uitwerking: |-
    $f(x)=x^2-3x+C$ en $4-6+C=1$, dus $C=3$.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Bereken $\ig \dfrac{x^2 - 1}{x}\dx$.
  antwoord: |-
    $\tfrac{x^2}{2}-\ln|x|+C$
  uitwerking: |-
    $\displaystyle\int\Bigl(x-\dfrac1x\Bigr)\dx$.

- id: h3-t3
  soort: test
  niveau: 1
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig 3x^2 (x^3 + 2)^4\dx$
      antwoord: |-
        $\tfrac15(x^3+2)^5+C$
      uitwerking: |-
        $u=x^3+2$: $\displaystyle\int u^4\du$.
    - opgave: |-
        $\ig \dfrac{1}{16 + x^2}\dx$
      antwoord: |-
        $\tfrac14\bgtan\tfrac{x}{4}+C$
      uitwerking: |-
        De vorm met $a=4$.
    - opgave: |-
        $\ig \dfrac{x}{16 + x^2}\dx$
      antwoord: |-
        $\tfrac12\ln(16+x^2)+C$
      uitwerking: |-
        Op een factor 2 na de afgeleide van de noemer in de teller.

- id: h3-t5
  soort: test
  niveau: 2
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_0^1 x\,\e^{x^2}\dx$
      antwoord: |-
        $\tfrac12(\e-1)$
      uitwerking: |-
        $u=x^2$, grenzen 0 en 1: $\tfrac12\displaystyle\int_0^1\e^u\du=\tfrac12(\e-1)$.
    - opgave: |-
        $\ig_0^{\pi} \cos^2 x\dx$
      antwoord: |-
        $\tfrac{\pi}{2}$
      uitwerking: |-
        $\Bigl[\tfrac{x}{2}+\tfrac{\sin 2x}{4}\Bigr]_0^{\pi}=\tfrac{\pi}{2}$.

- id: h3-t7
  soort: test
  niveau: 2
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig x\cos 2x\dx$
      antwoord: |-
        $\tfrac{x\sin 2x}{2}+\tfrac{\cos 2x}{4}+C$
      uitwerking: |-
        $f=x$, $g=\tfrac12\sin 2x$: $\tfrac{x}{2}\sin 2x-\tfrac12\displaystyle\int\sin 2x\dx=\tfrac{x}{2}\sin 2x+\tfrac14\cos 2x+C$.
    - opgave: |-
        $\ig_1^{\e} x^2\ln x\dx$
      antwoord: |-
        $\tfrac{2\e^3+1}{9}$
      uitwerking: |-
        $f=\ln x$, $g=\tfrac{x^3}{3}$: $\dfrac{\e^3}{3}-\dfrac13\displaystyle\int_1^{\e}x^2\dx=\dfrac{\e^3}{3}-\dfrac{\e^3-1}{9}=\dfrac{2\e^3+1}{9}$.

- id: h3-t8
  soort: test
  niveau: 2
  opgave: |-
    Bereken $\ig \e^{x} \sin 2x\dx$.
  antwoord: |-
    $\tfrac15\e^x(\sin 2x-2\cos 2x)+C$
  uitwerking: |-
    $I=\e^x\sin 2x-2\displaystyle\int\e^x\cos 2x\dx=\e^x\sin 2x-2\bigl(\e^x\cos 2x+2I\bigr)$, dus $5I=\e^x(\sin 2x-2\cos 2x)$.

- id: h3-t10
  soort: test
  niveau: 1
  opgave: |-
    Welke methode kies je voor $\ig x\,\e^{3x}\dx$, $\ig \dfrac{\sin x}{\cos^2 x}\dx$ en $\ig \dfrac{3x^2 + x}{x}\dx$? Reken niet uit.
  antwoord: |-
    partieel; substitutie; splitsing
  uitwerking: |-
    Eerste: een veelterm maal een exponentiële functie, zonder binnenste functie met de juiste afgeleide. Tweede: $u=\cos x$. Derde: elke term door $x$ delen.
