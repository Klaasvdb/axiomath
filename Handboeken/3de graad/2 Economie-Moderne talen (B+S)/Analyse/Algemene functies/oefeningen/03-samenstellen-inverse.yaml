# Oefeningen van hoofdstuk 3. Zie oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken $f(g(2))$ als $f(x) = x^2$ en $g(x) = x + 1$.
      antwoord: |-
        9
      uitwerking: |-
        $g(2) = 3$, $f(3) = 9$.
    - opgave: |-
        Los op naar $x$: $y = 4x - 2$.
      antwoord: |-
        $x = \frac{y + 2}{4}$
      uitwerking: |-
        $4x = y + 2$.
    - opgave: |-
        Los op naar $x$: $y = x^3$.
      antwoord: |-
        $x = \sqrt[3]{y}$
      uitwerking: |-
        $x = \sqrt[3]{y}$.
    - opgave: |-
        Vul in: $f(x) = 3x - 1$, dus $f(a^2) = \ldots$
      antwoord: |-
        $3a^2 - 1$
      uitwerking: |-
        $3a^2 - 1$.
    - opgave: |-
        Spiegel het punt $(2, 5)$ om de rechte $y = x$.
      antwoord: |-
        $(5, 2)$
      uitwerking: |-
        De coördinaten wisselen: $(5, 2)$.
    - opgave: |-
        Wat is het bereik van $x^2 + 1$?
      antwoord: |-
        $\left[1, +\infty\right[$
      uitwerking: |-
        $x^2 \geqslant 0$, dus $x^2 + 1 \geqslant 1$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Een taxi rekent $3$ euro instap plus $2$ euro per kilometer.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de prijs $p(x)$ voor een rit van $x$ km. Wat kost een rit van 8 km?
      antwoord: |-
        $p(x) = 2x + 3$; 19 euro
      uitwerking: |-
        $p(x) = 2x + 3$ en $p(8) = 19$ euro.
    - opgave: |-
        Een rit kostte 27 euro. Hoe ver was die? Geef een formule $k(p)$ voor de afstand bij een prijs $p$.
      antwoord: |-
        12 km; $k(p) = \frac{p - 3}{2}$
      uitwerking: |-
        $2x + 3 = 27$ geeft $x = 12$ km. Algemeen $k(p) = \frac{p - 3}{2}$.
    - opgave: |-
        Bereken $k\bigl(p(8)\bigr)$. Wat merk je op?
      antwoord: |-
        8
      uitwerking: |-
        $k(19) = 8$: $k$ draait $p$ terug.

- id: h3-samenstellen-getal
  soort: kort
  opgave: |-
    Neem $f(x) = x^2 - 1$ en $g(x) = \dfrac1x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $(f \circ g)(2)$ en $(g \circ f)(2)$.
      antwoord: |-
        $-\frac34$; $\frac13$
      uitwerking: |-
        $(f \circ g)(2) = f\bigl(\frac12\bigr) = \frac14 - 1 = -\frac34$. $(g \circ f)(2) = g(3) = \frac13$.
    - opgave: |-
        Bepaal $f \circ g$ en $g \circ f$, met hun domein.
      antwoord: |-
        $\frac{1}{x^2} - 1$ op $\R \setminus \{0\}$; $\frac{1}{x^2 - 1}$ op $\R \setminus \{-1, 1\}$
      uitwerking: |-
        $(f \circ g)(x) = f\bigl(\frac1x\bigr) = \dfrac{1}{x^2} - 1$: $x$ moet in $\dom g$, dus $x \neq 0$. $(g \circ f)(x) = g(x^2 - 1) = \dfrac{1}{x^2 - 1}$: $f(x)$ moet in $\dom g$, dus $x^2 - 1 \neq 0$, $x \neq \pm 1$.

- id: h3-samenstellen-tabel
  soort: kort
  opgave: |-
    De tabel geeft enkele functiewaarden van $f$ en $g$.\par
    \figuren{{\renewcommand{\arraystretch}{1.2}$\begin{array}{c|cccc} x & 0 & 1 & 2 & 3 \\\hline f(x) & 2 & 3 & 0 & 1 \\ g(x) & 1 & 0 & 3 & 2 \end{array}$}}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken $(f \circ g)(0)$.
      antwoord: |-
        3
      uitwerking: |-
        $g(0) = 1$ en $f(1) = 3$.
    - opgave: |-
        Bereken $(g \circ f)(3)$.
      antwoord: |-
        0
      uitwerking: |-
        $f(3) = 1$ en $g(1) = 0$.
    - opgave: |-
        Bereken $(f \circ f)(1)$.
      antwoord: |-
        1
      uitwerking: |-
        $f(1) = 3$ en $f(3) = 1$.
    - opgave: |-
        Voor welke $x$ is $(g \circ f)(x) = 1$?
      antwoord: |-
        $x = 2$
      uitwerking: |-
        $g$ geeft $1$ alleen in $0$, dus $f(x) = 0$, en dat gebeurt in $x = 2$. Controle: $g(f(2)) = g(0) = 1$.

- id: h3-samenstellen
  soort: kort
  opgave: |-
    Neem $f(x) = \dfrac1x$ en $g(x) = x - 2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $f \circ g$ en $g \circ f$, met hun domein.
      antwoord: |-
        $\frac{1}{x - 2}$, $\R \setminus \{2\}$; $\frac1x - 2$, $\R \setminus \{0\}$
      uitwerking: |-
        $(f \circ g)(x) = f(x - 2) = \dfrac{1}{x - 2}$: $g(x)$ moet in $\dom f$, dus $x - 2 \neq 0$; domein $\R \setminus \{2\}$. $(g \circ f)(x) = g\bigl(\frac1x\bigr) = \dfrac1x - 2$: $x$ moet in $\dom f$; domein $\R \setminus \{0\}$.
    - opgave: |-
        Schrijf $h(x) = \sqrt{x^2 + 4}$ als samenstelling van twee functies.
      antwoord: |-
        $\sqrt{x}$ na $x^2 + 4$
      uitwerking: |-
        Eerst reken je $x^2 + 4$ uit, dan neem je de wortel: $h = f \circ g$ met $g(x) = x^2 + 4$ en $f(x) = \sqrt{x}$.

- id: h3-ontbinden
  soort: kort
  opgave: |-
    Schrijf als samenstelling $f \circ g$ van twee eenvoudige functies.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $(3x - 2)^4$
      antwoord: |-
        $x^4$ na $3x - 2$
      uitwerking: |-
        $g(x) = 3x - 2$, $f(x) = x^4$.
    - opgave: |-
        $\sqrt{x^3 + 1}$
      antwoord: |-
        $\sqrt{x}$ na $x^3 + 1$
      uitwerking: |-
        $g(x) = x^3 + 1$, $f(x) = \sqrt{x}$.
    - opgave: |-
        $\dfrac{2}{x^2 - 4}$
      antwoord: |-
        $\frac2x$ na $x^2 - 4$
      uitwerking: |-
        $g(x) = x^2 - 4$, $f(x) = \frac2x$.
    - opgave: |-
        $\Bigl(\dfrac1x + 1\Bigr)^2$
      antwoord: |-
        $x^2$ na $\frac1x + 1$
      uitwerking: |-
        $g(x) = \frac1x + 1$, $f(x) = x^2$.

- id: h3-injectief
  soort: kort
  opgave: |-
    Heeft de functie een inverse? Gebruik horizontale rechten.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
          \roosterleeg{-2}{1}{2}{-2}{1}{2}
          \kromme{-1.4}{1.4}{(\x)^2}
        \end{tikzpicture}}
      antwoord: |-
        nee
      uitwerking: |-
        Nee: de rechte $y = 1$ snijdt de parabool twee keer.
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
          \roosterleeg{-2}{1}{2}{-2}{1}{2}
          \kromme{-1.26}{1.26}{(\x)^3}
        \end{tikzpicture}}
      antwoord: |-
        ja
      uitwerking: |-
        Ja: de grafiek stijgt overal, elke horizontale rechte snijdt ze hoogstens één keer.
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
          \roosterleeg{-2}{1}{2}{-2}{1}{2}
          \draw[accent,thick] (-2,-2) -- (0,-1) -- (1,1.5) -- (2,2);
        \end{tikzpicture}}
      antwoord: |-
        ja
      uitwerking: |-
        Ja: de gebroken lijn stijgt overal.
    - opgave: |-
        \raisebox{-.5\height}{\begin{tikzpicture}[x=.38cm,y=.38cm,font=\scriptsize]
          \roosterleeg{-2}{1}{2}{-2}{1}{2}
          \draw[accent,thick] (-2,2) -- (0,0) -- (2,0);
        \end{tikzpicture}}
      antwoord: |-
        nee
      uitwerking: |-
        Nee: op het horizontale stuk hebben alle $x$ hetzelfde beeld $0$.

- id: h3-inverse-lineair
  soort: kort
  opgave: |-
    Bepaal de inverse, en controleer met één getal.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = 3x - 5$
      antwoord: |-
        $\inv{f}(x) = \dfrac{x + 5}{3}$
      uitwerking: |-
        $y = 3x - 5 \iff x = \dfrac{y + 5}{3}$. Controle: $f(2) = 1$ en $\inv{f}(1) = 2$.
    - opgave: |-
        $f(x) = \dfrac{2 - x}{4}$
      antwoord: |-
        $\inv{f}(x) = 2 - 4x$
      uitwerking: |-
        $y = \dfrac{2 - x}{4} \iff 4y = 2 - x \iff x = 2 - 4y$. Controle: $f(2) = 0$ en $\inv{f}(0) = 2$.
    - opgave: |-
        $f(x) = 2x^3 - 1$
      antwoord: |-
        $\inv{f}(x) = \sqrt[3]{\dfrac{x + 1}{2}}$
      uitwerking: |-
        $y = 2x^3 - 1 \iff x^3 = \dfrac{y + 1}{2} \iff x = \sqrt[3]{\dfrac{y + 1}{2}}$. Controle: $f(1) = 1$ en $\inv{f}(1) = 1$; $f(-1) = -3$ en $\inv{f}(-3) = \sqrt[3]{-1} = -1$.

- id: h3-inverse-grafiek
  soort: kort
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
        \rooster{-3}{1}{4}{-3}{1}{4}
        \draw[grijs,dashed] (-3,-3) -- (4.2,4.2);
        \draw[accent,thick] (-3,-2) -- (0,-1) -- (2,1) -- (3,4);
        \vol{(-3,-2)} \vol{(3,4)}
      \end{tikzpicture}
  opgave: |-
    De grafiek van $f$ is de gebroken lijn van $(-3, -2)$ over $(0, -1)$ en $(2, 1)$ tot $(3, 4)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de grafiek van $\inv{f}$.
      antwoord: |-
        hoekpunten $(-2, -3)$, $(-1, 0)$, $(1, 2)$, $(4, 3)$
      uitwerking: |-
        Spiegel om $y = x$: de coördinaten wisselen. Hoekpunten $(-2, -3)$, $(-1, 0)$, $(1, 2)$, $(4, 3)$.
        \figuren{\begin{tikzpicture}[x=.42cm,y=.42cm,font=\scriptsize]
          \rooster{-3}{1}{4}{-3}{1}{4}
          \draw[grijs,dashed] (-3,-3) -- (4.2,4.2);
          \draw[grijs,thick] (-3,-2) -- (0,-1) -- (2,1) -- (3,4);
          \draw[accent,thick] (-2,-3) -- (-1,0) -- (1,2) -- (4,3);
        \end{tikzpicture}}
    - opgave: |-
        Bereken $\inv{f}(1)$, $\inv{f}(4)$ en $\inv{f}(0)$.
      antwoord: |-
        $2$; $3$; $1$
      uitwerking: |-
        $f(2) = 1$ en $f(3) = 4$, dus $\inv{f}(1) = 2$ en $\inv{f}(4) = 3$. Van $(0, -1)$ naar $(2, 1)$ stijgt $f$ 1 per eenheid, dus $f(1) = 0$ en $\inv{f}(0) = 1$.
    - opgave: |-
        Geef het domein en het bereik van $\inv{f}$.
      antwoord: |-
        $[-2, 4]$; $[-3, 3]$
      uitwerking: |-
        $\dom \inv{f} = \ber f = [-2, 4]$ en $\ber \inv{f} = \dom f = [-3, 3]$.

- id: h3-inverse
  soort: kort
  opgave: |-
    Bepaal de inverse, met haar domein.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = 5 - \dfrac{x}{2}$
      antwoord: |-
        $\inv{f}(x) = 10 - 2x$, $\R$
      uitwerking: |-
        $y = 5 - \frac{x}{2} \iff \frac{x}{2} = 5 - y \iff x = 10 - 2y$, dus $\inv{f}(x) = 10 - 2x$ met domein $\R$.
    - opgave: |-
        $g(x) = \sqrt{x + 4}$
      antwoord: |-
        $\inv{g}(x) = x^2 - 4$, $\left[0, +\infty\right[$
      uitwerking: |-
        $\ber g = \left[0, +\infty\right[$. $y = \sqrt{x + 4} \iff x = y^2 - 4$ (met $y \geqslant 0$), dus $\inv{g}(x) = x^2 - 4$ met domein $\left[0, +\infty\right[$.

- id: h3-beperken
  soort: kort
  opgave: |-
    De functie is niet injectief. Beperk het domein zoals gevraagd, en bepaal de inverse met haar domein.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = x^2 + 4x$, beperkt tot het stijgende deel.
      antwoord: |-
        $\dom f = \left[-2, +\infty\right[$; $\inv{f}(x) = -2 + \sqrt{x + 4}$ op $\left[-4, +\infty\right[$
      uitwerking: |-
        $f(x) = (x + 2)^2 - 4$, top $(-2, -4)$. Stijgend deel: $\dom f = \left[-2, +\infty\right[$, $\ber f = \left[-4, +\infty\right[$. $y = (x + 2)^2 - 4$ met $x + 2 \geqslant 0$ geeft $x + 2 = \sqrt{y + 4}$. Dus $\inv{f}(x) = -2 + \sqrt{x + 4}$ met domein $\left[-4, +\infty\right[$.
    - opgave: |-
        $g(x) = |x - 3|$, beperkt tot $\left]-\infty, 3\right]$.
      antwoord: |-
        $\inv{g}(x) = 3 - x$ op $\left[0, +\infty\right[$
      uitwerking: |-
        Voor $x \leqslant 3$ is $x - 3 \leqslant 0$, dus $g(x) = 3 - x$, met bereik $\left[0, +\infty\right[$. $y = 3 - x \iff x = 3 - y$: $\inv{g}(x) = 3 - x$ met domein $\left[0, +\infty\right[$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h3-domein-valkuil
  soort: kort
  opgave: |-
    Bepaal $f \circ g$, vereenvoudig, en geef het domein.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac1x$ en $g(x) = \dfrac1x$
      antwoord: |-
        $x$, met domein $\R \setminus \{0\}$
      uitwerking: |-
        $(f \circ g)(x) = \frac{1}{1/x} = x$. Maar $x$ moet in $\dom g$ liggen, dus $x \neq 0$ (en $g(x) = \frac1x$ is nooit $0$, dus ligt altijd in $\dom f$). Domein $\R \setminus \{0\}$.
    - opgave: |-
        $f(x) = x^2 - 1$ en $g(x) = \sqrt{x + 1}$
      antwoord: |-
        $x$, met domein $\left[-1, +\infty\right[$
      uitwerking: |-
        $(f \circ g)(x) = \bigl(\sqrt{x + 1}\bigr)^2 - 1 = x + 1 - 1 = x$. $x$ moet in $\dom g$ liggen: $x \geqslant -1$, en $\dom f = \R$. Domein $\left[-1, +\infty\right[$.

- id: h3-inverse-breuk
  soort: kort
  opgave: |-
    Bepaal de inverse, met haar domein, en controleer met één getal.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac{1}{x + 1}$
      antwoord: |-
        $\inv{f}(x) = \dfrac1x - 1$, $\R \setminus \{0\}$
      uitwerking: |-
        $\ber f = \R \setminus \{0\}$: een breuk met teller $1$ is nooit $0$. $y = \frac{1}{x + 1} \iff x + 1 = \frac1y \iff x = \frac1y - 1$. Dus $\inv{f}(x) = \frac1x - 1$ met domein $\R \setminus \{0\}$. Controle: $f(0) = 1$ en $\inv{f}(1) = 0$.
    - opgave: |-
        $g(x) = 4 + \dfrac2x$
      antwoord: |-
        $\inv{g}(x) = \dfrac{2}{x - 4}$, $\R \setminus \{4\}$
      uitwerking: |-
        $\frac2x$ is nooit $0$, dus $\ber g = \R \setminus \{4\}$. $y = 4 + \frac2x \iff \frac2x = y - 4 \iff x = \frac{2}{y - 4}$. Dus $\inv{g}(x) = \frac{2}{x - 4}$ met domein $\R \setminus \{4\}$. Controle: $g(2) = 5$ en $\inv{g}(5) = 2$.

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    samenstellen
  opgave: |-
    Neem $f(x) = x^2 + 1$ en $g(x) = 2x - 3$. Bereken:
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(f \circ g)(2)$
      antwoord: |-
        2
      uitwerking: |-
        $g(2) = 1$, $f(1) = 2$.
    - opgave: |-
        $(g \circ f)(2)$
      antwoord: |-
        7
      uitwerking: |-
        $f(2) = 5$, $g(5) = 7$.
    - opgave: |-
        $(f \circ g)(x)$
      antwoord: |-
        $4x^2 - 12x + 10$
      uitwerking: |-
        $f(2x - 3) = (2x - 3)^2 + 1 = 4x^2 - 12x + 10$.
    - opgave: |-
        $(g \circ f)(x)$
      antwoord: |-
        $2x^2 - 1$
      uitwerking: |-
        $g(x^2 + 1) = 2(x^2 + 1) - 3 = 2x^2 - 1$.
    - opgave: |-
        $(f \circ f)(x)$
      antwoord: |-
        $x^4 + 2x^2 + 2$
      uitwerking: |-
        $f(x^2 + 1) = (x^2 + 1)^2 + 1 = x^4 + 2x^2 + 2$.
    - opgave: |-
        $(g \circ g)(x)$
      antwoord: |-
        $4x - 9$
      uitwerking: |-
        $g(2x - 3) = 2(2x - 3) - 3 = 4x - 9$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: inverse bepalen
  opgave: |-
    Bepaal de inverse.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^3 + 1$
      antwoord: |-
        $\sqrt[3]{x - 1}$
      uitwerking: |-
        $y = x^3 + 1 \iff x^3 = y - 1 \iff x = \sqrt[3]{y - 1}$.
    - opgave: |-
        $f(x) = \dfrac{1}{x - 2}$
      antwoord: |-
        $2 + \dfrac1x$
      uitwerking: |-
        $y = \frac{1}{x - 2} \iff x - 2 = \frac1y \iff x = 2 + \frac1y$. Domein van de inverse: $\R \setminus \{0\} = \ber f$.
    - opgave: |-
        $f(x) = 7 - 2x$
      antwoord: |-
        $\dfrac{7 - x}{2}$
      uitwerking: |-
        $y = 7 - 2x \iff 2x = 7 - y \iff x = \dfrac{7 - y}{2}$.
    - opgave: |-
        $f(x) = \dfrac{x + 4}{3}$
      antwoord: |-
        $3x - 4$
      uitwerking: |-
        $y = \dfrac{x + 4}{3} \iff x + 4 = 3y \iff x = 3y - 4$.
    - opgave: |-
        $f(x) = \sqrt[3]{x} + 2$
      antwoord: |-
        $(x - 2)^3$
      uitwerking: |-
        $y = \sqrt[3]{x} + 2 \iff \sqrt[3]{x} = y - 2 \iff x = (y - 2)^3$.
    - opgave: |-
        $f(x) = \dfrac{3}{x}$
      antwoord: |-
        $\dfrac3x$
      uitwerking: |-
        $y = \frac3x \iff x = \frac3y$: $f$ is haar eigen inverse.
    - opgave: |-
        $f(x) = \dfrac1x - 4$
      antwoord: |-
        $\dfrac{1}{x + 4}$
      uitwerking: |-
        $y = \frac1x - 4 \iff \frac1x = y + 4 \iff x = \dfrac{1}{y + 4}$, met domein $\R \setminus \{-4\} = \ber f$.
    - opgave: |-
        $f(x) = (2x - 1)^3$
      antwoord: |-
        $\dfrac{\sqrt[3]{x} + 1}{2}$
      uitwerking: |-
        $y = (2x - 1)^3 \iff 2x - 1 = \sqrt[3]{y} \iff x = \dfrac{\sqrt[3]{y} + 1}{2}$.

- id: h3-o11
  soort: opdracht
  niveau: 1
  thema: |-
    samenstellen op een grafiek
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
        \rooster{-3}{1}{3}{-2}{1}{4}
        \draw[accent,thick] (-3,0) -- (-1,2) -- (1,2) -- (3,-2);
        \draw[grijs,thick,dashed] (-3,4) -- (3,-2);
        \node[above,text=accent] at (1,2) {$f$};
        \node[right,text=black] at (-2.6,3.6) {$g$};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafieken van $f$ (de gebroken lijn) en $g$ (de streepjeslijn). Lees af en bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f\bigl(g(0)\bigr)$
      antwoord: |-
        2
      uitwerking: |-
        $g(0) = 1$ en $f(1) = 2$.
    - opgave: |-
        $g\bigl(f(0)\bigr)$
      antwoord: |-
        $-1$
      uitwerking: |-
        $f(0) = 2$ en $g(2) = -1$.
    - opgave: |-
        $(f \circ f)(-3)$
      antwoord: |-
        2
      uitwerking: |-
        $f(-3) = 0$ en $f(0) = 2$.
    - opgave: |-
        $(g \circ f)(3)$
      antwoord: |-
        3
      uitwerking: |-
        $f(3) = -2$ en $g(-2) = 3$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    drill: ontbinden
  opgave: |-
    Schrijf als samenstelling $f \circ g$ van twee eenvoudige functies.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{1}{(3x - 1)^2}$
      antwoord: |-
        $\frac{1}{x^2}$ na $3x - 1$
      uitwerking: |-
        $g(x) = 3x - 1$, $f(x) = \frac{1}{x^2}$.
    - opgave: |-
        $|x^3 - 2|$
      antwoord: |-
        $|x|$ na $x^3 - 2$
      uitwerking: |-
        $g(x) = x^3 - 2$, $f(x) = |x|$.
    - opgave: |-
        $\sqrt{x} + 5$
      antwoord: |-
        $x + 5$ na $\sqrt{x}$
      uitwerking: |-
        $g(x) = \sqrt{x}$, $f(x) = x + 5$: hier is de wortel de binnenste functie.
    - opgave: |-
        $\sqrt{1 - x^2}$
      antwoord: |-
        $\sqrt{x}$ na $1 - x^2$
      uitwerking: |-
        $g(x) = 1 - x^2$, $f(x) = \sqrt{x}$.
    - opgave: |-
        $(x^2 + x)^5$
      antwoord: |-
        $x^5$ na $x^2 + x$
      uitwerking: |-
        $g(x) = x^2 + x$, $f(x) = x^5$.
    - opgave: |-
        $\dfrac{1}{\sqrt{x}}$
      antwoord: |-
        $\frac1x$ na $\sqrt{x}$
      uitwerking: |-
        $g(x) = \sqrt{x}$, $f(x) = \frac1x$.
    - opgave: |-
        $|3 - x|$
      antwoord: |-
        $|x|$ na $3 - x$
      uitwerking: |-
        $g(x) = 3 - x$, $f(x) = |x|$.
    - opgave: |-
        $2(x + 1)^2$
      antwoord: |-
        $2x^2$ na $x + 1$
      uitwerking: |-
        $g(x) = x + 1$, $f(x) = 2x^2$.
    - opgave: |-
        $\dfrac{5}{(x^2 + 2)^3}$
      antwoord: |-
        $\frac{5}{x^3}$ na $x^2 + 2$
      uitwerking: |-
        $g(x) = x^2 + 2$, $f(x) = \frac{5}{x^3}$.

- id: h3-o14
  soort: opdracht
  niveau: 1
  thema: |-
    waar of niet waar
  opgave: |-
    Waar of niet waar? Geef een reden of een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        Het domein van $\inv{f}$ is het bereik van $f$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $\inv{f}$ werkt op de beelden van $f$.
    - opgave: |-
        Voor alle functies $f$ en $g$ is $f \circ g = g \circ f$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar. Met $f(x) = x + 1$ en $g(x) = x^2$ is $(f \circ g)(x) = x^2 + 1$ en $(g \circ f)(x) = (x + 1)^2$, en in $x = 1$ geeft dat $2 \neq 4$.
    - opgave: |-
        Elke functie die op haar hele domein stijgt, heeft een inverse.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: uit $x_1 < x_2$ volgt $f(x_1) < f(x_2)$, dus verschillende getallen hebben verschillende beelden. De functie is injectief.
    - opgave: |-
        $\inv{f}(x) = \dfrac{1}{f(x)}$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar. Met $f(x) = x + 1$ is $\inv{f}(x) = x - 1$, maar $\frac{1}{f(x)} = \frac{1}{x + 1}$. De $-1$ is hier een notatie, geen macht.
    - opgave: |-
        Als $(2, 5)$ op de grafiek van $f$ ligt, dan ligt $(5, 2)$ op die van $\inv{f}$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $f(2) = 5$ betekent $\inv{f}(5) = 2$.

- id: h3-o10
  soort: opdracht
  niveau: 1
  thema: |-
    drill: voorschrift van een samenstelling
  opgave: |-
    Neem $f(x) = 2x + 1$, $g(x) = x^2$ en $h(x) = \dfrac1x$. Geef het voorschrift.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f \circ g$
      antwoord: |-
        $2x^2 + 1$
      uitwerking: |-
        $f(x^2) = 2x^2 + 1$.
    - opgave: |-
        $g \circ f$
      antwoord: |-
        $(2x + 1)^2$
      uitwerking: |-
        $g(2x + 1) = (2x + 1)^2$.
    - opgave: |-
        $f \circ h$
      antwoord: |-
        $\frac2x + 1$
      uitwerking: |-
        $f\bigl(\frac1x\bigr) = \frac2x + 1$.
    - opgave: |-
        $h \circ f$
      antwoord: |-
        $\dfrac{1}{2x + 1}$
      uitwerking: |-
        $h(2x + 1) = \dfrac{1}{2x + 1}$.
    - opgave: |-
        $g \circ h$
      antwoord: |-
        $\dfrac{1}{x^2}$
      uitwerking: |-
        $g\bigl(\frac1x\bigr) = \frac{1}{x^2}$.
    - opgave: |-
        $h \circ g$
      antwoord: |-
        $\dfrac{1}{x^2}$
      uitwerking: |-
        $h(x^2) = \frac{1}{x^2}$: hier geeft de andere volgorde toevallig hetzelfde.
    - opgave: |-
        $f \circ f$
      antwoord: |-
        $4x + 3$
      uitwerking: |-
        $f(2x + 1) = 2(2x + 1) + 1 = 4x + 3$.
    - opgave: |-
        $h \circ h$
      antwoord: |-
        $x$ (voor $x \neq 0$)
      uitwerking: |-
        $h\bigl(\frac1x\bigr) = \dfrac{1}{1/x} = x$, met domein $\R \setminus \{0\}$.
    - opgave: |-
        $f \circ g \circ h$
      antwoord: |-
        $\dfrac{2}{x^2} + 1$
      uitwerking: |-
        Eerst $h$, dan $g$, dan $f$: $f\bigl(g\bigl(\tfrac1x\bigr)\bigr) = f\bigl(\tfrac{1}{x^2}\bigr) = \frac{2}{x^2} + 1$.

- id: h3-o12
  soort: opdracht
  niveau: 1
  thema: |-
    inverse uit een tabel
  opgave: |-
    Van een injectieve functie $f$ ken je deze waarden:\par
    \figuren{{\renewcommand{\arraystretch}{1.2}$\begin{array}{c|ccccc} x & -1 & 0 & 1 & 2 & 3 \\\hline f(x) & 5 & 3 & 1 & -1 & -3 \end{array}$}}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\inv{f}(1)$ en $\inv{f}(-3)$.
      antwoord: |-
        $1$; $3$
      uitwerking: |-
        $f(1) = 1$, dus $\inv{f}(1) = 1$. $f(3) = -3$, dus $\inv{f}(-3) = 3$.
    - opgave: |-
        Bereken $\inv{f}\bigl(f(2)\bigr)$ en $f\bigl(\inv{f}(5)\bigr)$.
      antwoord: |-
        $2$; $5$
      uitwerking: |-
        $\inv{f}\bigl(f(2)\bigr) = \inv{f}(-1) = 2$ en $f\bigl(\inv{f}(5)\bigr) = f(-1) = 5$: de inverse draait $f$ terug, en omgekeerd.
    - opgave: |-
        De punten liggen op een rechte. Geef een voorschrift van $f$ en van $\inv{f}$.
      antwoord: |-
        $f(x) = 3 - 2x$; $\inv{f}(x) = \dfrac{3 - x}{2}$
      uitwerking: |-
        Telkens $-2$ per stap, en $f(0) = 3$: $f(x) = 3 - 2x$. $y = 3 - 2x \iff x = \dfrac{3 - y}{2}$.
    - opgave: |-
        Bereken $\inv{f}(0)$.
      antwoord: |-
        $\frac32$
      uitwerking: |-
        $\inv{f}(0) = \frac32$. Controle: $f\bigl(\frac32\bigr) = 3 - 3 = 0$.

- id: h3-o16
  soort: opdracht
  niveau: 1
  thema: |-
    punten spiegelen om y = x
  opgave: |-
    Neem een injectieve functie $f$.
  lijst: enumerate
  delen:
    - opgave: |-
        Het punt $(2, 5)$ ligt op de grafiek van $f$. Welk punt ligt zeker op die van $\inv{f}$?
      antwoord: |-
        $(5, 2)$
      uitwerking: |-
        Spiegelen om $y = x$ wisselt de coördinaten: $(5, 2)$.
    - opgave: |-
        $f(-1) = 4$. Bereken $\inv{f}(4)$.
      antwoord: |-
        $-1$
      uitwerking: |-
        $\inv{f}(4) = -1$, want $f(-1) = 4$.
    - opgave: |-
        De grafiek van $f$ snijdt de $y$-as in $(0, 2)$. Waar snijdt de grafiek van $\inv{f}$ een as?
      antwoord: |-
        de $x$-as in $(2, 0)$
      uitwerking: |-
        Het spiegelbeeld van $(0, 2)$ is $(2, 0)$: de grafiek van $\inv{f}$ snijdt de $x$-as in $2$.
    - opgave: |-
        Het punt $(3, 3)$ ligt op de grafiek van $f$. Ligt het ook op die van $\inv{f}$?
      antwoord: |-
        ja
      uitwerking: |-
        Ja: het ligt op de rechte $y = x$, en is dus zijn eigen spiegelbeeld. ($f(3) = 3$ geeft $\inv{f}(3) = 3$.)

- id: h3-o4
  soort: opdracht
  niveau: 2
  thema: |-
    domein van een samenstelling
  opgave: |-
    Neem $f(x) = \sqrt{x}$ en $g(x) = x^2 - 4$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $f \circ g$ en $g \circ f$ met hun domein.
      antwoord: |-
        $\sqrt{x^2 - 4}$ op $\left]-\infty, -2\right] \cup \left[2, +\infty\right[$; $x - 4$ op $\left[0, +\infty\right[$
      uitwerking: |-
        $(f \circ g)(x) = \sqrt{x^2 - 4}$: $x^2 - 4 \geqslant 0$, dus domein $\left]-\infty, -2\right] \cup \left[2, +\infty\right[$. $(g \circ f)(x) = (\sqrt{x})^2 - 4 = x - 4$: $x$ moet in $\dom f$ liggen, dus domein $\left[0, +\infty\right[$.
    - opgave: |-
        Zijn $g \circ f$ en de functie $x - 4$ dezelfde functie?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: het voorschrift is hetzelfde, het domein niet. $(g \circ f)(-1)$ bestaat niet, want $\sqrt{-1}$ bestaat niet.

- id: h3-o18
  soort: opdracht
  niveau: 2
  thema: |-
    inverse met domein en bereik
  opgave: |-
    Bepaal de inverse, met haar domein en bereik.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \sqrt{2x - 4} + 1$
      antwoord: |-
        $\inv{f}(x) = \frac12(x - 1)^2 + 2$; $\left[1, +\infty\right[$; $\left[2, +\infty\right[$
      uitwerking: |-
        $\dom f = \left[2, +\infty\right[$, $\ber f = \left[1, +\infty\right[$. $y - 1 = \sqrt{2x - 4}$ met $y \geqslant 1$ geeft $(y - 1)^2 = 2x - 4$, dus $x = \frac12(y - 1)^2 + 2$. Domein van $\inv{f}$: $\left[1, +\infty\right[$, bereik $\left[2, +\infty\right[$.
    - opgave: |-
        $f(x) = 3 - \dfrac2x$
      antwoord: |-
        $\inv{f}(x) = \dfrac{2}{3 - x}$; $\R \setminus \{3\}$; $\R \setminus \{0\}$
      uitwerking: |-
        $y = 3 - \frac2x \iff \frac2x = 3 - y \iff x = \dfrac{2}{3 - y}$. $\dom \inv{f} = \ber f = \R \setminus \{3\}$ en $\ber \inv{f} = \dom f = \R \setminus \{0\}$.
    - opgave: |-
        $f(x) = (x + 1)^3 - 2$
      antwoord: |-
        $\inv{f}(x) = \sqrt[3]{x + 2} - 1$; $\R$; $\R$
      uitwerking: |-
        $y + 2 = (x + 1)^3 \iff x + 1 = \sqrt[3]{y + 2}$. Domein en bereik zijn $\R$.
    - opgave: |-
        $f(x) = -\sqrt{x + 3}$
      antwoord: |-
        $\inv{f}(x) = x^2 - 3$; $\left]-\infty, 0\right]$; $\left[-3, +\infty\right[$
      uitwerking: |-
        $\ber f = \left]-\infty, 0\right]$. $y = -\sqrt{x + 3}$ met $y \leqslant 0$ geeft $y^2 = x + 3$, dus $x = y^2 - 3$. Let op: het domein van $\inv{f}$ is $\left]-\infty, 0\right]$, niet $\left[0, +\infty\right[$. Het bereik is $\left[-3, +\infty\right[$.

- id: h3-o5
  soort: opdracht
  niveau: 2
  thema: |-
    inverse op een grafiek
  figuur:
    opties: |-
      4.8cm
    code: |-
      \begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
        \rooster{-3}{1}{4}{-3}{1}{4}
        \draw[grijs,dashed] (-3,-3) -- (4.2,4.2);
        \draw[accent,thick] (-2,-3) -- (0,-1) -- (2,0) -- (4,3);
        \vol{(-2,-3)} \vol{(4,3)}
      \end{tikzpicture}
  opgave: |-
    De grafiek van $f$ is de gebroken lijn van $(-2, -3)$ over $(0, -1)$ en $(2, 0)$ tot $(4, 3)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom heeft $f$ een inverse?
      antwoord: |-
        $f$ stijgt overal
      uitwerking: |-
        $f$ stijgt op heel haar domein, dus verschillende $x$ hebben verschillende beelden.
    - opgave: |-
        Geef de hoekpunten van de grafiek van $\inv{f}$, en haar domein.
      antwoord: |-
        $(-3, -2)$, $(-1, 0)$, $(0, 2)$, $(3, 4)$; $[-3, 3]$
      uitwerking: |-
        Coördinaten wisselen: $(-3, -2)$, $(-1, 0)$, $(0, 2)$, $(3, 4)$. $\dom \inv{f} = \ber f = [-3, 3]$.
    - opgave: |-
        Bereken $\inv{f}(0)$ en $\inv{f}(-2)$.
      antwoord: |-
        2; $-1$
      uitwerking: |-
        $f(2) = 0$, dus $\inv{f}(0) = 2$. Op het eerste lijnstuk stijgt $f$ 1 per eenheid: $f(-1) = -2$, dus $\inv{f}(-2) = -1$.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    waar zit de fout?
  opgave: |-
    Elke uitspraak is fout. Leg uit waarom, en verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Jonas: \textit{de inverse van $f(x) = x^2$ is $\sqrt{x}$.}
      antwoord: |-
        $x^2$ is niet injectief op $\R$
      uitwerking: |-
        $f(-2) = f(2) = 4$: $f$ is niet injectief en heeft geen inverse. Alleen de beperking van $f$ tot $\left[0, +\infty\right[$ heeft als inverse $\sqrt{x}$.
    - opgave: |-
        Eva: \textit{$f(x) = 2x + 6$, dus $\inv{f}(x) = \dfrac{1}{2x + 6}$.}
      antwoord: |-
        $\inv{f}(x) = \frac{x - 6}{2}$
      uitwerking: |-
        Ze verwart de inverse met het omgekeerde. $y = 2x + 6 \iff x = \frac{y - 6}{2}$, dus $\inv{f}(x) = \frac{x - 6}{2}$. Controle: $f(1) = 8$ en $\inv{f}(8) = 1$.
    - opgave: |-
        Nina: \textit{als $f(x) = x + 1$ en $g(x) = x^2$, dan is $(f \circ g)(x) = (x + 1)^2$.}
      antwoord: |-
        $(f \circ g)(x) = x^2 + 1$
      uitwerking: |-
        $f \circ g$ betekent: eerst $g$, dan $f$. Dus $(f \circ g)(x) = f(x^2) = x^2 + 1$. Wat Nina schrijft, is $g \circ f$.
    - opgave: |-
        Tom: \textit{de inverse van $f(x) = -\sqrt{x}$ is $\inv{f}(x) = x^2$ met domein $\left[0, +\infty\right[$.}
      antwoord: |-
        domein $\left]-\infty, 0\right]$
      uitwerking: |-
        $\dom \inv{f} = \ber f = \left]-\infty, 0\right]$: $\inv{f}$ werkt op de beelden van $f$, en die zijn nooit positief. Bijvoorbeeld $\inv{f}(-2) = 4$, want $f(4) = -2$. Dus $\inv{f}(x) = x^2$ met domein $\left]-\infty, 0\right]$.

- id: h3-o6
  soort: opdracht
  niveau: 2
  thema: |-
    injectief of niet
  opgave: |-
    Is de functie injectief? Toon aan met een tegenvoorbeeld of met het verloop.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^3$
      antwoord: |-
        ja
      uitwerking: |-
        Ja: $x^3$ stijgt overal.
    - opgave: |-
        $f(x) = |x|$
      antwoord: |-
        nee
      uitwerking: |-
        Nee: $f(-1) = f(1)$.
    - opgave: |-
        $f(x) = x^2 - 2x$ met domein $\left[1, +\infty\right[$
      antwoord: |-
        ja
      uitwerking: |-
        Ja: $f(x) = (x - 1)^2 - 1$ stijgt rechts van de top in $x = 1$.
    - opgave: |-
        $f(x) = x^3 - 3x$
      antwoord: |-
        nee
      uitwerking: |-
        Nee: $f(0) = f(\sqrt3) = 0$.
    - opgave: |-
        $f(x) = \dfrac1x$
      antwoord: |-
        ja
      uitwerking: |-
        Ja: uit $\frac{1}{x_1} = \frac{1}{x_2}$ volgt $x_1 = x_2$. (Toch is $f$ niet stijgend of dalend op heel haar domein.)
    - opgave: |-
        $f(x) = x^2 + x$
      antwoord: |-
        nee
      uitwerking: |-
        Nee: $f(0) = f(-1) = 0$.

- id: h3-o19
  soort: opdracht
  niveau: 2
  thema: |-
    een olievlek
  opgave: |-
    Een olievlek op het water is een cirkel. Na $t$ minuten is de straal $r(t) = 2t + 1$ meter. Een cirkel met straal $r$ heeft oppervlakte $A(r) = \pi r^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $(A \circ r)(3)$. Wat betekent dat getal?
      antwoord: |-
        $49\pi \approx 153{,}9$ m$^2$
      uitwerking: |-
        $r(3) = 7$ en $A(7) = 49\pi \approx 153{,}9$: na 3 minuten is de vlek ongeveer $153{,}9$ m$^2$ groot.
    - opgave: |-
        Geef het voorschrift van $A \circ r$.
      antwoord: |-
        $\pi(2t + 1)^2$
      uitwerking: |-
        $(A \circ r)(t) = A(2t + 1) = \pi(2t + 1)^2$: de oppervlakte in functie van de tijd.
    - opgave: |-
        Wanneer is de vlek 100 m$^2$ groot?
      antwoord: |-
        na ongeveer $2{,}32$ minuten
      uitwerking: |-
        $\pi(2t + 1)^2 = 100 \iff 2t + 1 = \sqrt{\frac{100}{\pi}} \approx 5{,}642$ (de straal is positief), dus $t \approx 2{,}32$ minuten.
    - opgave: |-
        Heeft $r \circ A$ in deze context een betekenis?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: $r$ verwacht een tijd, maar $A$ geeft een oppervlakte. Je kunt het voorschrift wel uitrekenen, maar het getal betekent niets.

- id: h3-o7
  soort: opdracht
  niveau: 2
  thema: |-
    Celsius en Fahrenheit
  opgave: |-
    Een temperatuur van $C$ graden Celsius is $F(C) = 1{,}8\,C + 32$ graden Fahrenheit.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de inverse functie. Wat betekent ze?
      antwoord: |-
        $C(F) = \frac{F - 32}{1{,}8}$
      uitwerking: |-
        $F = 1{,}8\,C + 32 \iff C = \dfrac{F - 32}{1{,}8}$: ze rekent Fahrenheit om naar Celsius.
    - opgave: |-
        Een lichaamstemperatuur van $98{,}6\,^\circ$F: hoeveel graden Celsius is dat?
      antwoord: |-
        $37\,^\circ$C
      uitwerking: |-
        $\frac{98{,}6 - 32}{1{,}8} = \frac{66{,}6}{1{,}8} = 37$.
    - opgave: |-
        Bij welke temperatuur geven beide schalen hetzelfde getal? Waar zie je dat op de grafieken?
      antwoord: |-
        $-40$; in het snijpunt met $y = x$
      uitwerking: |-
        $1{,}8\,C + 32 = C$ geeft $0{,}8\,C = -32$, dus $C = -40$. De grafieken van $F$ en haar inverse snijden elkaar daar op de rechte $y = x$.

- id: h3-o22
  soort: opdracht
  niveau: 2
  thema: |-
    inverse controleren met samenstellen
  opgave: |-
    Toon aan dat $g$ de inverse is van $f$: bereken $f\bigl(g(x)\bigr)$ en $g\bigl(f(x)\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = \dfrac{x - 1}{3}$ en $g(x) = 3x + 1$
      antwoord: |-
        beide geven $x$
      uitwerking: |-
        $f\bigl(g(x)\bigr) = \dfrac{3x + 1 - 1}{3} = x$ en $g\bigl(f(x)\bigr) = 3 \cdot \dfrac{x - 1}{3} + 1 = x$.
    - opgave: |-
        $f(x) = x^3 + 2$ en $g(x) = \sqrt[3]{x - 2}$
      antwoord: |-
        beide geven $x$
      uitwerking: |-
        $f\bigl(g(x)\bigr) = \bigl(\sqrt[3]{x - 2}\bigr)^3 + 2 = x$ en $g\bigl(f(x)\bigr) = \sqrt[3]{x^3} = x$.
    - opgave: |-
        $f(x) = \dfrac1x + 2$ en $g(x) = \dfrac{1}{x - 2}$
      antwoord: |-
        beide geven $x$
      uitwerking: |-
        $f\bigl(g(x)\bigr) = (x - 2) + 2 = x$ voor $x \neq 2$, en $g\bigl(f(x)\bigr) = \dfrac{1}{\frac1x} = x$ voor $x \neq 0$. Dat zijn precies de domeinen: $\dom g = \ber f = \R \setminus \{2\}$ en $\dom f = \R \setminus \{0\}$.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    domein van een samenstelling
  opgave: |-
    Bepaal $f \circ g$ en haar domein.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \sqrt{x}$, $g(x) = 4 - x^2$
      antwoord: |-
        $\sqrt{4 - x^2}$; $[-2, 2]$
      uitwerking: |-
        $\sqrt{4 - x^2}$, met $4 - x^2 \geqslant 0 \iff -2 \leqslant x \leqslant 2$.
    - opgave: |-
        $f(x) = \dfrac1x$, $g(x) = x^2 - 9$
      antwoord: |-
        $\dfrac{1}{x^2 - 9}$; $\R \setminus \{-3, 3\}$
      uitwerking: |-
        $\dfrac{1}{x^2 - 9}$, met $g(x) \neq 0$: $x \neq \pm 3$.
    - opgave: |-
        $f(x) = \dfrac{1}{x - 1}$, $g(x) = \sqrt{x}$
      antwoord: |-
        $\dfrac{1}{\sqrt{x} - 1}$; $\left[0, 1\right[ \cup \left]1, +\infty\right[$
      uitwerking: |-
        $\dfrac{1}{\sqrt{x} - 1}$. $x$ moet in $\dom g$: $x \geqslant 0$. $g(x)$ moet in $\dom f$: $\sqrt{x} \neq 1$, dus $x \neq 1$.
    - opgave: |-
        $f(x) = \sqrt{x - 2}$, $g(x) = x^2$
      antwoord: |-
        $\sqrt{x^2 - 2}$; $\left]-\infty, -\sqrt2\right] \cup \left[\sqrt2, +\infty\right[$
      uitwerking: |-
        $\sqrt{x^2 - 2}$, met $x^2 \geqslant 2 \iff |x| \geqslant \sqrt2$.
    - opgave: |-
        $f(x) = \sqrt{x}$, $g(x) = \dfrac{x}{x - 2}$
      antwoord: |-
        $\sqrt{\dfrac{x}{x - 2}}$; $\left]-\infty, 0\right] \cup \left]2, +\infty\right[$
      uitwerking: |-
        $x \neq 2$ (voor $g$) en $\frac{x}{x - 2} \geqslant 0$ (voor $f$). Tekentabel:\\ \tekentabel{cccccc}{x & & 0 & & 2 & }{\frac{x}{x - 2} & + & 0 & - & | & +} Dus $\left]-\infty, 0\right] \cup \left]2, +\infty\right[$.

- id: h3-o20
  soort: opdracht
  niveau: 2
  thema: |-
    een vallende steen
  opgave: |-
    Een steen valt van een brug van 80 m hoog. Na $t$ seconden is hij op hoogte $h(t) = 80 - 4{,}9\,t^2$ (in m), tot hij in het water valt.
  lijst: enumerate
  delen:
    - opgave: |-
        Wanneer valt de steen in het water? Geef het domein van $h$ in deze context.
      antwoord: |-
        na ongeveer $4{,}04$ s; $[0;\ 4{,}04]$
      uitwerking: |-
        $80 - 4{,}9\,t^2 = 0 \iff t^2 = \frac{80}{4{,}9} \iff t \approx 4{,}04$ s ($t \geqslant 0$). Domein ongeveer $[0;\ 4{,}04]$.
    - opgave: |-
        Waarom heeft $h$ op dat domein een inverse?
      antwoord: |-
        $h$ daalt
      uitwerking: |-
        Voor $t \geqslant 0$ is $h$ dalend (een bergparabool rechts van de top): elke hoogte wordt maar één keer bereikt.
    - opgave: |-
        Bepaal de inverse: de tijd in functie van de hoogte. Geef haar domein.
      antwoord: |-
        $t(h) = \sqrt{\dfrac{80 - h}{4{,}9}}$; $[0, 80]$
      uitwerking: |-
        $h = 80 - 4{,}9\,t^2 \iff t^2 = \dfrac{80 - h}{4{,}9} \iff t = \sqrt{\dfrac{80 - h}{4{,}9}}$, want $t \geqslant 0$. Het domein is het bereik van $h$: $[0, 80]$.
    - opgave: |-
        Wanneer is de steen op 20 m boven het water?
      antwoord: |-
        na ongeveer $3{,}50$ s
      uitwerking: |-
        $t(20) = \sqrt{\frac{60}{4{,}9}} \approx 3{,}50$ s.

- id: h3-o8
  soort: opdracht
  niveau: 3
  thema: |-
    inverse van een breuk
  opgave: |-
    Inverse van een homografische functie.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de inverse van $f(x) = \dfrac{2x + 1}{x - 3}$. Controleer dat het domein van $\inv{f}$ het bereik van $f$ is.
      antwoord: |-
        $\inv{f}(x) = \dfrac{3x + 1}{x - 2}$; $\dom \inv{f} = \R \setminus \{2\}$
      uitwerking: |-
        $y(x - 3) = 2x + 1 \iff yx - 2x = 3y + 1 \iff x = \dfrac{3y + 1}{y - 2}$. Dus $\inv{f}(x) = \dfrac{3x + 1}{x - 2}$ met domein $\R \setminus \{2\}$. Het bereik van $f$ is ook $\R \setminus \{2\}$: de vergelijking $f(x) = 2$ zou $2x + 1 = 2x - 6$ geven, en dat kan niet.
    - opgave: |-
        Toon algemeen aan: de inverse van $f(x) = \dfrac{ax + b}{cx + d}$ (met $c \neq 0$ en $ad - bc \neq 0$) is $\inv{f}(x) = \dfrac{dx - b}{-cx + a}$. Controleer met a.
      antwoord: |-
        bewijs; met $a = 2$, $b = 1$, $c = 1$, $d = -3$ klopt het
      uitwerking: |-
        $y(cx + d) = ax + b \iff cyx - ax = b - dy \iff x(cy - a) = b - dy \iff x = \dfrac{dy - b}{-cy + a}$. (Delen mag: $cy - a = 0$ zou $y = \frac{a}{c}$ geven, en die waarde neemt $f$ niet aan als $ad - bc \neq 0$.) Met de getallen uit a: $\dfrac{-3x - 1}{-x + 2} = \dfrac{3x + 1}{x - 2}$. Merk op: de inverse van zo'n functie wisselt $a$ en $d$ van plaats en verandert het teken van $b$ en $c$.

- id: h3-o24
  soort: opdracht
  niveau: 3
  thema: |-
    inverse van een samenstelling
  opgave: |-
    Neem twee functies $f$ en $g$ met domein en bereik $\R$ die een inverse hebben.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\inv{(f \circ g)} = \inv{g} \circ \inv{f}$.
      antwoord: |-
        bewijs
      uitwerking: |-
        $(\inv{g} \circ \inv{f}) \circ (f \circ g)(x) = \inv{g}\bigl(\inv{f}\bigl(f(g(x))\bigr)\bigr) = \inv{g}\bigl(g(x)\bigr) = x$, en net zo $(f \circ g) \circ (\inv{g} \circ \inv{f})(x) = f\bigl(g\bigl(\inv{g}(\inv{f}(x))\bigr)\bigr) = f\bigl(\inv{f}(x)\bigr) = x$. Dus $\inv{g} \circ \inv{f}$ draait $f \circ g$ terug.
    - opgave: |-
        Controleer met $f(x) = x^3$ en $g(x) = 2x + 1$.
      antwoord: |-
        beide geven $\dfrac{\sqrt[3]{x} - 1}{2}$
      uitwerking: |-
        $(f \circ g)(x) = (2x + 1)^3$. Rechtstreeks: $y = (2x + 1)^3 \iff x = \dfrac{\sqrt[3]{y} - 1}{2}$. Met de formule: $\inv{f}(x) = \sqrt[3]{x}$ en $\inv{g}(x) = \frac{x - 1}{2}$, dus $\inv{g}\bigl(\inv{f}(x)\bigr) = \dfrac{\sqrt[3]{x} - 1}{2}$.
    - opgave: |-
        Waarom is de volgorde omgekeerd? Leg uit met sokken en schoenen.
      antwoord: |-
        wat je laatst doet, draai je eerst terug
      uitwerking: |-
        Je trekt eerst je sokken aan ($g$) en dan je schoenen ($f$). Terugdraaien begint bij het laatste: eerst de schoenen uit ($\inv{f}$), dan de sokken ($\inv{g}$).

- id: h3-o9
  soort: opdracht
  niveau: 3
  thema: |-
    zijn eigen inverse
  opgave: |-
    Toon aan dat $f(x) = \dfrac{x + 1}{x - 1}$ haar eigen inverse is: $f\bigl(f(x)\bigr) = x$ voor $x \neq 1$. Wat betekent dat voor de grafiek? Geef nog twee functies die hun eigen inverse zijn.
  antwoord: |-
    symmetrisch om $y = x$; bv. $\frac1x$ en $-x$
  uitwerking: |-
    $f\bigl(f(x)\bigr) = \dfrac{\frac{x + 1}{x - 1} + 1}{\frac{x + 1}{x - 1} - 1} = \dfrac{\frac{2x}{x - 1}}{\frac{2}{x - 1}} = x$. Omdat $f$ zichzelf terugdraait, is $\inv{f} = f$: de grafiek is haar eigen spiegelbeeld om $y = x$. Andere voorbeelden: $\frac1x$, $-x$, $5 - x$.

- id: h3-o25
  soort: opdracht
  niveau: 3
  thema: |-
    snijpunten van f en haar inverse
  opgave: |-
    Snijpunten van de grafieken van $f$ en $\inv{f}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Neem $f(x) = x^2 - 2$ met domein $\left[0, +\infty\right[$. Bepaal $\inv{f}$ met haar domein.
      antwoord: |-
        $\inv{f}(x) = \sqrt{x + 2}$; $\left[-2, +\infty\right[$
      uitwerking: |-
        $\ber f = \left[-2, +\infty\right[$. $y = x^2 - 2$ met $x \geqslant 0$ geeft $x = \sqrt{y + 2}$.
    - opgave: |-
        Bereken het snijpunt van beide grafieken op de rechte $y = x$.
      antwoord: |-
        $(2, 2)$
      uitwerking: |-
        $x^2 - 2 = x \iff (x - 2)(x + 1) = 0$, en $x \geqslant 0$ geeft $x = 2$. Controle: $f(2) = 2$ en $\inv{f}(2) = \sqrt4 = 2$.
    - opgave: |-
        Toon aan: is $f$ stijgend, dan ligt elk snijpunt van de grafieken van $f$ en $\inv{f}$ op de rechte $y = x$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Stel $(a, b)$ ligt op beide grafieken: $f(a) = b$ en $\inv{f}(a) = b$, dus $f(b) = a$. Was $a < b$, dan zou $f(a) < f(b)$, dus $b < a$: onmogelijk. Zo ook $a > b$. Dus $a = b$.
    - opgave: |-
        Neem $f(x) = -x^3$. Toon aan dat de grafieken van $f$ en $\inv{f}$ elkaar ook snijden buiten de rechte $y = x$.
      antwoord: |-
        bv. in $(1, -1)$ en $(-1, 1)$
      uitwerking: |-
        $\inv{f}(x) = -\sqrt[3]{x}$. Het punt $(1, -1)$ ligt op beide grafieken: $f(1) = -1$ en $\inv{f}(1) = -1$. Net zo $(-1, 1)$. Voor een dalende functie geldt het resultaat van c dus niet.

- id: h3-o26
  soort: opdracht
  niveau: 3
  thema: |-
    ontbinden op meer manieren
  opgave: |-
    Ontbinden is niet uniek.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $h(x) = \dfrac{1}{\sqrt{2x - 3}}$ als samenstelling van drie functies.
      antwoord: |-
        $\frac1x$ na $\sqrt{x}$ na $2x - 3$
      uitwerking: |-
        $k(x) = 2x - 3$, $g(x) = \sqrt{x}$, $f(x) = \frac1x$: $h = f \circ g \circ k$.
    - opgave: |-
        Geef drie verschillende manieren om $(2x + 1)^6$ te schrijven als $f \circ g$, zonder $f(x) = x$ of $g(x) = x$.
      antwoord: |-
        bv. $x^6$ na $2x + 1$; $x^3$ na $(2x + 1)^2$; $x^2$ na $(2x + 1)^3$
      uitwerking: |-
        $f(x) = x^6$ en $g(x) = 2x + 1$; $f(x) = x^3$ en $g(x) = (2x + 1)^2$; $f(x) = x^2$ en $g(x) = (2x + 1)^3$. Ook $f(x) = (x + 1)^6$ en $g(x) = 2x$ kan.
    - opgave: |-
        Toon aan dat je elke functie $h$ met domein $\R$ kunt schrijven als $f \circ g$ met $g(x) = x + 1$.
      antwoord: |-
        neem $f(x) = h(x - 1)$
      uitwerking: |-
        Neem $f(x) = h(x - 1)$. Dan is $(f \circ g)(x) = f(x + 1) = h(x + 1 - 1) = h(x)$. Als binnenste functie kun je dus bijna alles kiezen: een goede ontbinding kies je zo dat beide functies eenvoudig zijn.

- id: h3-o27
  soort: opdracht
  niveau: 3
  thema: |-
    injectief bewijzen
  opgave: |-
    Injectief, stijgend en dalend.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon met de definitie aan dat $f(x) = \dfrac{2x + 1}{x - 3}$ injectief is. Tip: stel $f(x_1) = f(x_2)$ en toon aan dat $x_1 = x_2$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Stel $\dfrac{2x_1 + 1}{x_1 - 3} = \dfrac{2x_2 + 1}{x_2 - 3}$. Kruislings: $(2x_1 + 1)(x_2 - 3) = (2x_2 + 1)(x_1 - 3)$, dus $2x_1x_2 - 6x_1 + x_2 - 3 = 2x_1x_2 - 6x_2 + x_1 - 3$. Dat geeft $-7x_1 = -7x_2$, dus $x_1 = x_2$. Verschillende getallen hebben dus verschillende beelden.
    - opgave: |-
        Toon aan dat een functie die stijgend is op haar domein, injectief is.
      antwoord: |-
        bewijs
      uitwerking: |-
        Neem $x_1 \neq x_2$, bijvoorbeeld $x_1 < x_2$. Stijgend geeft $f(x_1) < f(x_2)$, dus $f(x_1) \neq f(x_2)$.
    - opgave: |-
        Is het omgekeerde waar? Geef een injectieve functie die op haar domein stijgend noch dalend is.
      antwoord: |-
        nee; bv. $\frac1x$
      uitwerking: |-
        Nee. $f(x) = \frac1x$ is injectief (zie de vorige opdracht met $\frac1x$), maar niet dalend op $\R \setminus \{0\}$: $-1 < 1$ en $f(-1) < f(1)$. Ook niet stijgend: $1 < 2$ en $f(1) > f(2)$.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 1
  koppel:
    rubriek: analyse
    onderwerp: Exponentiële en logaritmische functies
  thema: |-
    de logaritme als inverse
  opgave: |-
    De functie $f(x) = 2^x$ heeft domein $\R$ en bereik $\left]0, +\infty\right[$, en stijgt overal. Haar inverse is $\log_2 x$. Geef het domein en het bereik van $\log_2$, en bereken $\log_2 8$ en $\log_2\bigl(2^{5}\bigr)$.
  antwoord: |-
    domein $\left]0, +\infty\right[$, bereik $\R$; 3; 5
  uitwerking: |-
    $\dom \log_2 = \ber f = \left]0, +\infty\right[$, $\ber \log_2 = \dom f = \R$. $2^3 = 8$, dus $\log_2 8 = 3$. $\log_2(2^5) = 5$: de inverse draait $f$ terug.

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Goniometrische functies
  thema: |-
    een inverse voor de sinus
  opgave: |-
    Waarom heeft $\sin x$ op $\R$ geen inverse? Op welk interval rond $0$ is de sinus wel injectief, met als bereik heel $[-1, 1]$? Geef het domein en het bereik van de inverse $\operatorname{bgsin}$.
  antwoord: |-
    $\left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$; domein $[-1, 1]$, bereik $\left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$
  uitwerking: |-
    $\sin 0 = \sin \pi = 0$: niet injectief. Op $\left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$ stijgt de sinus van $-1$ tot $1$. Dus $\dom \operatorname{bgsin} = [-1, 1]$ en $\ber \operatorname{bgsin} = \left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$.

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    samenstellen
  opgave: |-
    Neem $f(x) = \sqrt{x}$ en $g(x) = x^2 - 1$. Bepaal $f \circ g$ en $g \circ f$ met hun domein.
  antwoord: |-
    $\sqrt{x^2 - 1}$ op $\left]-\infty, -1\right] \cup \left[1, +\infty\right[$; $x - 1$ op $\left[0, +\infty\right[$
  uitwerking: |-
    $(f \circ g)(x) = \sqrt{x^2 - 1}$: $x^2 - 1 \geqslant 0$, domein $\left]-\infty, -1\right] \cup \left[1, +\infty\right[$. $(g \circ f)(x) = (\sqrt{x})^2 - 1 = x - 1$: $x$ moet in $\dom f$, domein $\left[0, +\infty\right[$.

- id: h3-t5
  soort: test
  niveau: 1
  thema: |-
    samenstellen met getallen
  opgave: |-
    Neem $f(x) = x^2 + 2$ en $g(x) = 1 - 3x$. Bereken $(f \circ g)(-1)$ en $(g \circ f)(-1)$.
  antwoord: |-
    $18$; $-8$
  uitwerking: |-
    $g(-1) = 4$ en $f(4) = 18$. $f(-1) = 3$ en $g(3) = -8$.

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    ontbinden
  opgave: |-
    Schrijf $h(x) = (x^2 - 3)^4$ als samenstelling van twee functies.
  antwoord: |-
    $x^4$ na $x^2 - 3$
  uitwerking: |-
    $g(x) = x^2 - 3$ en $f(x) = x^4$: $h = f \circ g$.

- id: h3-t3
  soort: test
  niveau: 1
  thema: |-
    inverse
  opgave: |-
    Bepaal de inverse van $f(x) = 4 - 3x$, en controleer met één getal.
  antwoord: |-
    $\inv{f}(x) = \dfrac{4 - x}{3}$
  uitwerking: |-
    $y = 4 - 3x \iff 3x = 4 - y \iff x = \frac{4 - y}{3}$. Controle: $f(0) = 4$ en $\inv{f}(4) = 0$.

- id: h3-t4
  soort: test
  niveau: 2
  thema: |-
    inverse met domein
  opgave: |-
    Bepaal de inverse van $f(x) = \sqrt{x + 2}$, met haar domein.
  antwoord: |-
    $\inv{f}(x) = x^2 - 2$, $\left[0, +\infty\right[$
  uitwerking: |-
    $\ber f = \left[0, +\infty\right[$. $y = \sqrt{x + 2} \iff x = y^2 - 2$ met $y \geqslant 0$. Dus $\inv{f}(x) = x^2 - 2$ met domein $\left[0, +\infty\right[$.

- id: h3-t7
  soort: test
  niveau: 1
  thema: |-
    inverse op een grafiek
  opgave: |-
    Een injectieve functie $f$ heeft domein $[-1, 3]$ en bereik $[-4, 2]$, en het punt $(3, -2)$ ligt op haar grafiek.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk punt ligt op de grafiek van $\inv{f}$? Bereken $\inv{f}(-2)$.
      antwoord: |-
        $(-2, 3)$; $3$
      uitwerking: |-
        Spiegelen om $y = x$: $(-2, 3)$. Dus $\inv{f}(-2) = 3$.
    - opgave: |-
        Geef het domein en het bereik van $\inv{f}$.
      antwoord: |-
        $[-4, 2]$; $[-1, 3]$
      uitwerking: |-
        Domein en bereik wisselen: $\dom \inv{f} = [-4, 2]$, $\ber \inv{f} = [-1, 3]$.

- id: h3-t6
  soort: test
  niveau: 2
  thema: |-
    domein beperken
  opgave: |-
    Neem $f(x) = (x + 2)^2 - 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $f$ niet injectief is.
      antwoord: |-
        $f(-3) = f(-1)$
      uitwerking: |-
        $f(-3) = 1 - 1 = 0$ en $f(-1) = 1 - 1 = 0$.
    - opgave: |-
        Beperk het domein tot het stijgende deel, en bepaal de inverse met haar domein.
      antwoord: |-
        $\left[-2, +\infty\right[$; $\inv{f}(x) = -2 + \sqrt{x + 1}$ op $\left[-1, +\infty\right[$
      uitwerking: |-
        Top $(-2, -1)$: $\dom f = \left[-2, +\infty\right[$, $\ber f = \left[-1, +\infty\right[$. $y = (x + 2)^2 - 1$ met $x + 2 \geqslant 0$ geeft $x = -2 + \sqrt{y + 1}$. Dus $\inv{f}(x) = -2 + \sqrt{x + 1}$ met domein $\left[-1, +\infty\right[$.
