# Oefeningen van hoofdstuk 2. Zie oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken de afstand tussen $(1, 0)$ en $(0, 1)$.
      antwoord: |-
        $\sqrt2$
      uitwerking: |-
        $\sqrt{1 + 1} = \sqrt2$.
    - opgave: |-
        Werk uit: $(a - b)^2 + (c - d)^2$.
      antwoord: |-
        $a^2 - 2ab + b^2 + c^2 - 2cd + d^2$
      uitwerking: |-
        $a^2 - 2ab + b^2 + c^2 - 2cd + d^2$.
    - opgave: |-
        Schrijf $\frac{\pi}{12}$ als verschil van twee hoeken uit de tabel.
      antwoord: |-
        $\frac{\pi}{3} - \frac{\pi}{4}$
      uitwerking: |-
        $\frac{4\pi}{12} - \frac{3\pi}{12}$, of $\frac{\pi}{4} - \frac{\pi}{6}$.
    - opgave: |-
        Geef $\cos\alpha$ als $\sin\alpha = \frac{5}{13}$ en $\alpha$ in het eerste kwadrant.
      antwoord: |-
        $\frac{12}{13}$
      uitwerking: |-
        $\sqrt{1 - \frac{25}{169}} = \frac{12}{13}$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Gebruik je rekentoestel (in radialen).
  lijst: enumerate
  delen:
    - opgave: |-
        Neem $\alpha = 0{,}5$ en $\beta = 0{,}3$. Bereken $\cos(\alpha - \beta)$ en $\cos\alpha - \cos\beta$. Zijn ze gelijk?
      antwoord: |-
        $0{,}9801$ en $-0{,}0777$; nee
      uitwerking: |-
        $\cos 0{,}2 \approx 0{,}9801$ en $\cos 0{,}5 - \cos 0{,}3 \approx 0{,}8776 - 0{,}9553 = -0{,}0777$. Niet gelijk.
    - opgave: |-
        Bereken $\cos\alpha\cos\beta + \sin\alpha\sin\beta$. Wat valt op?
      antwoord: |-
        $0{,}9801$: gelijk aan $\cos(\alpha - \beta)$
      uitwerking: |-
        $0{,}8776 \cdot 0{,}9553 + 0{,}4794 \cdot 0{,}2955 \approx 0{,}9801 = \cos(\alpha - \beta)$.
    - opgave: |-
        Probeer met twee andere hoeken. Klopt het nog?
      antwoord: |-
        ja
      uitwerking: |-
        Ja: dat is de verschilformule, die in deze sectie bewezen wordt.

- id: h2-exactk
  soort: kort
  opgave: |-
    Bepaal exact. Schrijf de hoek als som of verschil van twee hoeken uit de tabel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin\frac{7\pi}{12}$
      antwoord: |-
        $\frac{\sqrt6 + \sqrt2}{4}$
      uitwerking: |-
        $\frac{7\pi}{12} = \frac{\pi}{3} + \frac{\pi}{4}$, dus $\sin\frac{7\pi}{12} = \sin\frac{\pi}{3}\cos\frac{\pi}{4} + \cos\frac{\pi}{3}\sin\frac{\pi}{4} = \frac{\sqrt3}{2} \cdot \frac{\sqrt2}{2} + \frac12 \cdot \frac{\sqrt2}{2} = \frac{\sqrt6 + \sqrt2}{4}$.
    - opgave: |-
        $\cos\frac{11\pi}{12}$
      antwoord: |-
        $-\frac{\sqrt6 + \sqrt2}{4}$
      uitwerking: |-
        $\frac{11\pi}{12} = \frac{2\pi}{3} + \frac{\pi}{4}$, dus $\cos\frac{11\pi}{12} = \cos\frac{2\pi}{3}\cos\frac{\pi}{4} - \sin\frac{2\pi}{3}\sin\frac{\pi}{4} = -\frac12 \cdot \frac{\sqrt2}{2} - \frac{\sqrt3}{2} \cdot \frac{\sqrt2}{2} = -\frac{\sqrt2 + \sqrt6}{4}$. Controle: de hoek ligt in het tweede kwadrant, dus de cosinus is negatief.
    - opgave: |-
        $\tan\frac{5\pi}{12}$
      antwoord: |-
        $2 + \sqrt3$
      uitwerking: |-
        $\frac{5\pi}{12} = \frac{\pi}{4} + \frac{\pi}{6}$, dus $\tan\frac{5\pi}{12} = \dfrac{1 + \frac{\sqrt3}{3}}{1 - \frac{\sqrt3}{3}} = \dfrac{3 + \sqrt3}{3 - \sqrt3}$. Vermenigvuldig teller en noemer met $3 + \sqrt3$: $\dfrac{(3 + \sqrt3)^2}{9 - 3} = \dfrac{12 + 6\sqrt3}{6} = 2 + \sqrt3$.

- id: h2-som
  soort: kort
  opgave: |-
    Bepaal exact.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin\frac{5\pi}{12}$
      antwoord: |-
        $\frac{\sqrt6 + \sqrt2}{4}$
      uitwerking: |-
        $\sin\bigl(\frac{\pi}{4} + \frac{\pi}{6}\bigr) = \frac{\sqrt2}{2} \cdot \frac{\sqrt3}{2} + \frac{\sqrt2}{2} \cdot \frac12 = \frac{\sqrt6 + \sqrt2}{4}$.
    - opgave: |-
        $\cos(\alpha + \beta)$ als $\cos\alpha = \frac45$, $\sin\beta = \frac{5}{13}$, beide hoeken in het eerste kwadrant
      antwoord: |-
        $\frac{33}{65}$
      uitwerking: |-
        $\sin\alpha = \frac35$, $\cos\beta = \frac{12}{13}$: $\frac45 \cdot \frac{12}{13} - \frac35 \cdot \frac{5}{13} = \frac{48 - 15}{65} = \frac{33}{65}$.
    - opgave: |-
        $\sin(\alpha - \beta)$ als $\sin\alpha = \frac{12}{13}$ met $\alpha$ in het tweede kwadrant, en $\cos\beta = \frac35$ met $\beta$ in het vierde kwadrant
      antwoord: |-
        $\frac{16}{65}$
      uitwerking: |-
        Tweede kwadrant: $\cos\alpha = -\sqrt{1 - \frac{144}{169}} = -\frac{5}{13}$. Vierde kwadrant: $\sin\beta = -\sqrt{1 - \frac{9}{25}} = -\frac45$. Dan is $\sin(\alpha - \beta) = \sin\alpha\cos\beta - \cos\alpha\sin\beta = \frac{12}{13} \cdot \frac35 - \bigl(-\frac{5}{13}\bigr)\bigl(-\frac45\bigr) = \frac{36 - 20}{65} = \frac{16}{65}$.
    - opgave: |-
        $\tan(\alpha + \beta)$ als $\tan\alpha = \frac13$ en $\tan\beta = -2$
      antwoord: |-
        $-1$
      uitwerking: |-
        $\tan(\alpha + \beta) = \dfrac{\tan\alpha + \tan\beta}{1 - \tan\alpha\tan\beta} = \dfrac{\frac13 - 2}{1 + \frac23} = \dfrac{-\frac53}{\frac53} = -1$.

- id: h2-verdubbel
  soort: kort
  opgave: |-
    Bereken exact $\sin 2\alpha$ en $\cos 2\alpha$.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin\alpha = \frac14$ en $\frac{\pi}{2} < \alpha < \pi$
      antwoord: |-
        $-\frac{\sqrt{15}}{8}$; $\frac78$
      uitwerking: |-
        Tweede kwadrant: $\cos\alpha = -\sqrt{1 - \frac{1}{16}} = -\frac{\sqrt{15}}{4}$. Dan is $\sin 2\alpha = 2 \cdot \frac14 \cdot \bigl(-\frac{\sqrt{15}}{4}\bigr) = -\frac{\sqrt{15}}{8}$ en $\cos 2\alpha = 1 - 2\sin^2\alpha = 1 - \frac{2}{16} = \frac78$.
    - opgave: |-
        $\tan\alpha = 3$ en $0 < \alpha < \frac{\pi}{2}$
      antwoord: |-
        $\frac35$; $-\frac45$
      uitwerking: |-
        Uit $1 + \tan^2\alpha = \frac{1}{\cos^2\alpha}$ volgt $\cos^2\alpha = \frac{1}{10}$. Eerste kwadrant: $\cos\alpha = \frac{1}{\sqrt{10}}$ en $\sin\alpha = \tan\alpha\cos\alpha = \frac{3}{\sqrt{10}}$. Dan is $\sin 2\alpha = 2 \cdot \frac{3}{\sqrt{10}} \cdot \frac{1}{\sqrt{10}} = \frac{6}{10} = \frac35$ en $\cos 2\alpha = \cos^2\alpha - \sin^2\alpha = \frac{1}{10} - \frac{9}{10} = -\frac45$.

- id: h2-dubbel
  soort: kort
  opgave: |-
    Gegeven: $\cos\alpha = \frac13$ en $\frac{3\pi}{2} < \alpha < 2\pi$. Bereken exact $\sin 2\alpha$, $\cos 2\alpha$ en $\tan 2\alpha$.
  antwoord: |-
    $-\frac{4\sqrt2}{9}$; $-\frac79$; $\frac{4\sqrt2}{7}$
  uitwerking: |-
    Vierde kwadrant: $\sin\alpha = -\sqrt{1 - \frac19} = -\frac{2\sqrt2}{3}$. $\sin 2\alpha = 2 \cdot \bigl(-\frac{2\sqrt2}{3}\bigr) \cdot \frac13 = -\frac{4\sqrt2}{9}$. $\cos 2\alpha = 2 \cdot \frac19 - 1 = -\frac79$. $\tan 2\alpha = \frac{-4\sqrt2/9}{-7/9} = \frac{4\sqrt2}{7}$.

- id: h2-carnotk
  soort: kort
  opgave: |-
    Schrijf zonder kwadraat, of bereken exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin^2 3x$
      antwoord: |-
        $\frac{1 - \cos 6x}{2}$
      uitwerking: |-
        Carnot met $\alpha = 3x$, dus $2\alpha = 6x$: $\sin^2 3x = \frac{1 - \cos 6x}{2}$.
    - opgave: |-
        $\cos^2\frac{\pi}{12}$
      antwoord: |-
        $\frac{2 + \sqrt3}{4}$
      uitwerking: |-
        $\cos^2\frac{\pi}{12} = \dfrac{1 + \cos\frac{\pi}{6}}{2} = \dfrac{1 + \frac{\sqrt3}{2}}{2} = \frac{2 + \sqrt3}{4}$.
    - opgave: |-
        $\cos^2 x - \frac12$
      antwoord: |-
        $\frac12\cos 2x$
      uitwerking: |-
        $\frac{1 + \cos 2x}{2} - \frac12 = \frac12\cos 2x$.

- id: h2-identk
  soort: kort
  opgave: |-
    Bewijs (voor alle $x$ waarvoor beide leden bestaan).
  lijst: enumerate
  delen:
    - opgave: |-
        $\dfrac{\sin 2x}{1 - \cos 2x} = \dfrac{1}{\tan x}$
      antwoord: |-
        bewijs
      uitwerking: |-
        Vertrek van het linkerlid en kies $\cos 2x = 1 - 2\sin^2 x$, zodat de 1 wegvalt: $\dfrac{2\sin x\cos x}{1 - (1 - 2\sin^2 x)} = \dfrac{2\sin x\cos x}{2\sin^2 x} = \dfrac{\cos x}{\sin x} = \dfrac{1}{\tan x}$.
    - opgave: |-
        $\cos^4 x - \sin^4 x = \cos 2x$
      antwoord: |-
        bewijs
      uitwerking: |-
        Ontbind als verschil van kwadraten: $\cos^4 x - \sin^4 x = (\cos^2 x - \sin^2 x)(\cos^2 x + \sin^2 x) = \cos 2x \cdot 1 = \cos 2x$.
    - opgave: |-
        $\tan x \cdot \sin 2x = 1 - \cos 2x$
      antwoord: |-
        bewijs
      uitwerking: |-
        Linkerlid: $\dfrac{\sin x}{\cos x} \cdot 2\sin x\cos x = 2\sin^2 x$. Rechterlid: $1 - (1 - 2\sin^2 x) = 2\sin^2 x$. Beide leden zijn gelijk.

- id: h2-samenvoegen
  soort: kort
  opgave: |-
    Schrijf als $R\sin(x + \varphi)$, en geef de grootste en de kleinste waarde.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sqrt3\sin x - \cos x$
      antwoord: |-
        $2\sin\bigl(x - \frac{\pi}{6}\bigr)$; $2$ en $-2$
      uitwerking: |-
        $R = \sqrt{3 + 1} = 2$, $\cos\varphi = \frac{\sqrt3}{2}$, $\sin\varphi = -\frac12$: vierde kwadrant, $\varphi = -\frac{\pi}{6}$. Grootste waarde $2$, kleinste $-2$.
    - opgave: |-
        $3\sin x + 4\cos x$
      antwoord: |-
        $5\sin(x + \varphi)$ met $\varphi \approx 0{,}927$; $5$ en $-5$
      uitwerking: |-
        $R = \sqrt{9 + 16} = 5$, $\cos\varphi = \frac35$, $\sin\varphi = \frac45$: eerste kwadrant, $\varphi \approx 0{,}927$ rad (rekentoestel). Grootste waarde $5$, kleinste $-5$.
    - opgave: |-
        $-\sin x + \cos x$
      antwoord: |-
        $\sqrt2\sin\bigl(x + \frac{3\pi}{4}\bigr)$; $\sqrt2$ en $-\sqrt2$
      uitwerking: |-
        $a = -1$, $b = 1$: $R = \sqrt2$, $\cos\varphi = -\frac{\sqrt2}{2}$, $\sin\varphi = \frac{\sqrt2}{2}$: tweede kwadrant, $\varphi = \frac{3\pi}{4}$. Grootste waarde $\sqrt2$, kleinste $-\sqrt2$.
    - opgave: |-
        $5\sin x - 12\cos x$
      antwoord: |-
        $13\sin(x + \varphi)$ met $\varphi \approx -1{,}176$; $13$ en $-13$
      uitwerking: |-
        $R = \sqrt{25 + 144} = 13$, $\cos\varphi = \frac{5}{13}$, $\sin\varphi = -\frac{12}{13}$: vierde kwadrant, $\varphi \approx -1{,}176$ rad. Grootste waarde $13$, kleinste $-13$.

- id: h2-uitwerkk
  soort: kort
  opgave: |-
    Omgekeerd: werk uit tot de vorm $a\sin x + b\cos x$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2\sin\bigl(x + \frac{\pi}{6}\bigr)$
      antwoord: |-
        $\sqrt3\sin x + \cos x$
      uitwerking: |-
        $2\bigl(\sin x\cos\frac{\pi}{6} + \cos x\sin\frac{\pi}{6}\bigr) = 2\bigl(\frac{\sqrt3}{2}\sin x + \frac12\cos x\bigr) = \sqrt3\sin x + \cos x$.
    - opgave: |-
        $4\sin\bigl(x - \frac{3\pi}{4}\bigr)$
      antwoord: |-
        $-2\sqrt2\sin x - 2\sqrt2\cos x$
      uitwerking: |-
        $4\bigl(\sin x\cos\frac{3\pi}{4} - \cos x\sin\frac{3\pi}{4}\bigr) = 4\bigl(-\frac{\sqrt2}{2}\sin x - \frac{\sqrt2}{2}\cos x\bigr) = -2\sqrt2\sin x - 2\sqrt2\cos x$.
    - opgave: |-
        $\sqrt2\cos\bigl(x - \frac{\pi}{4}\bigr)$
      antwoord: |-
        $\sin x + \cos x$
      uitwerking: |-
        Verschilformule van de cosinus: $\sqrt2\bigl(\cos x\cos\frac{\pi}{4} + \sin x\sin\frac{\pi}{4}\bigr) = \sqrt2 \cdot \frac{\sqrt2}{2}(\cos x + \sin x) = \sin x + \cos x$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h2-cosverschil-k
  soort: kort
  opgave: |-
    De cosinus van een verschil.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\cos\frac{\pi}{12}$ opnieuw, nu met $\frac{\pi}{12} = \frac{\pi}{4} - \frac{\pi}{6}$. Krijg je hetzelfde als in het voorbeeld?
      antwoord: |-
        $\frac{\sqrt6 + \sqrt2}{4}$; ja
      uitwerking: |-
        $\cos\frac{\pi}{4}\cos\frac{\pi}{6} + \sin\frac{\pi}{4}\sin\frac{\pi}{6} = \frac{\sqrt2}{2} \cdot \frac{\sqrt3}{2} + \frac{\sqrt2}{2} \cdot \frac12 = \frac{\sqrt6 + \sqrt2}{4}$: dezelfde uitkomst.
    - opgave: |-
        Bereken exact $\cos(\alpha - \beta)$ als $\cos\alpha = \frac35$ en $\cos\beta = \frac{5}{13}$, met $\alpha$ en $\beta$ in het eerste kwadrant.
      antwoord: |-
        $\frac{63}{65}$
      uitwerking: |-
        Met de grondformule, positief in het eerste kwadrant: $\sin\alpha = \frac45$ en $\sin\beta = \frac{12}{13}$. Dan is $\cos(\alpha - \beta) = \frac35 \cdot \frac{5}{13} + \frac45 \cdot \frac{12}{13} = \frac{15 + 48}{65} = \frac{63}{65}$.
    - opgave: |-
        Toon met de verschilformule aan dat $\cos(\pi - \theta) = -\cos\theta$.
      antwoord: |-
        bewijs
      uitwerking: |-
        $\cos(\pi - \theta) = \cos\pi\cos\theta + \sin\pi\sin\theta = (-1)\cos\theta + 0 \cdot \sin\theta = -\cos\theta$.

- id: h2-cossom-k
  soort: kort
  opgave: |-
    De cosinus van een som.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal exact $\cos\frac{13\pi}{12}$. Tip: $\frac{13\pi}{12} = \frac{3\pi}{4} + \frac{\pi}{3}$.
      antwoord: |-
        $-\frac{\sqrt2 + \sqrt6}{4}$
      uitwerking: |-
        $\cos\frac{3\pi}{4}\cos\frac{\pi}{3} - \sin\frac{3\pi}{4}\sin\frac{\pi}{3} = -\frac{\sqrt2}{2} \cdot \frac12 - \frac{\sqrt2}{2} \cdot \frac{\sqrt3}{2} = -\frac{\sqrt2 + \sqrt6}{4}$. Negatief, want $\frac{13\pi}{12}$ ligt in het derde kwadrant.
    - opgave: |-
        Vereenvoudig $\cos\bigl(x + \frac{\pi}{2}\bigr)$.
      antwoord: |-
        $-\sin x$
      uitwerking: |-
        $\cos x\cos\frac{\pi}{2} - \sin x\sin\frac{\pi}{2} = \cos x \cdot 0 - \sin x \cdot 1 = -\sin x$.
    - opgave: |-
        Schrijf $\cos 2x$ met $\sin x$ en $\cos x$. Tip: $2x = x + x$.
      antwoord: |-
        $\cos^2 x - \sin^2 x$
      uitwerking: |-
        $\cos(x + x) = \cos x\cos x - \sin x\sin x = \cos^2 x - \sin^2 x$.

- id: h2-sinsom-k
  soort: kort
  opgave: |-
    De sinus van een som.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal exact $\sin\frac{11\pi}{12}$. Tip: $\frac{11\pi}{12} = \frac{2\pi}{3} + \frac{\pi}{4}$.
      antwoord: |-
        $\frac{\sqrt6 - \sqrt2}{4}$
      uitwerking: |-
        $\sin\frac{2\pi}{3}\cos\frac{\pi}{4} + \cos\frac{2\pi}{3}\sin\frac{\pi}{4} = \frac{\sqrt3}{2} \cdot \frac{\sqrt2}{2} + \bigl(-\frac12\bigr) \cdot \frac{\sqrt2}{2} = \frac{\sqrt6 - \sqrt2}{4}$.
    - opgave: |-
        Bereken exact $\sin(\alpha + \beta)$ als $\sin\alpha = \frac{8}{17}$ en $\cos\beta = \frac45$, met $\alpha$ en $\beta$ in het eerste kwadrant.
      antwoord: |-
        $\frac{77}{85}$
      uitwerking: |-
        Grondformule, positief: $\cos\alpha = \sqrt{1 - \frac{64}{289}} = \frac{15}{17}$ en $\sin\beta = \frac35$. Dan is $\sin(\alpha + \beta) = \frac{8}{17} \cdot \frac45 + \frac{15}{17} \cdot \frac35 = \frac{32 + 45}{85} = \frac{77}{85}$.
    - opgave: |-
        Toon met de somformule aan dat $\sin(x + \pi) = -\sin x$.
      antwoord: |-
        bewijs
      uitwerking: |-
        $\sin x\cos\pi + \cos x\sin\pi = \sin x \cdot (-1) + \cos x \cdot 0 = -\sin x$.

- id: h2-sinverschil-k
  soort: kort
  opgave: |-
    De sinus van een verschil.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\sin\frac{\pi}{12}$ opnieuw, nu met $\frac{\pi}{12} = \frac{\pi}{4} - \frac{\pi}{6}$.
      antwoord: |-
        $\frac{\sqrt6 - \sqrt2}{4}$
      uitwerking: |-
        $\sin\frac{\pi}{4}\cos\frac{\pi}{6} - \cos\frac{\pi}{4}\sin\frac{\pi}{6} = \frac{\sqrt2}{2} \cdot \frac{\sqrt3}{2} - \frac{\sqrt2}{2} \cdot \frac12 = \frac{\sqrt6 - \sqrt2}{4}$.
    - opgave: |-
        Vereenvoudig $\sin\bigl(x - \frac{\pi}{2}\bigr)$.
      antwoord: |-
        $-\cos x$
      uitwerking: |-
        $\sin x\cos\frac{\pi}{2} - \cos x\sin\frac{\pi}{2} = 0 - \cos x = -\cos x$.
    - opgave: |-
        Schrijf korter: $\sin 5x\cos 2x - \cos 5x\sin 2x$.
      antwoord: |-
        $\sin 3x$
      uitwerking: |-
        Dat is de rechterkant van de verschilformule met $\alpha = 5x$ en $\beta = 2x$: $\sin(5x - 2x) = \sin 3x$.

- id: h2-tan-k
  soort: kort
  opgave: |-
    De tangens van een som en een verschil.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal exact $\tan\frac{11\pi}{12}$. Tip: $\frac{11\pi}{12} = \frac{2\pi}{3} + \frac{\pi}{4}$.
      antwoord: |-
        $\sqrt3 - 2$
      uitwerking: |-
        $\tan\frac{2\pi}{3} = -\sqrt3$ en $\tan\frac{\pi}{4} = 1$, dus $\tan\frac{11\pi}{12} = \dfrac{-\sqrt3 + 1}{1 - (-\sqrt3) \cdot 1} = \dfrac{1 - \sqrt3}{1 + \sqrt3}$. Vermenigvuldig teller en noemer met $1 - \sqrt3$: $\dfrac{(1 - \sqrt3)^2}{1 - 3} = \dfrac{4 - 2\sqrt3}{-2} = \sqrt3 - 2$.
    - opgave: |-
        Bereken $\tan(\alpha - \beta)$ als $\tan\alpha = 3$ en $\tan\beta = \frac12$.
      antwoord: |-
        $1$
      uitwerking: |-
        $\dfrac{3 - \frac12}{1 + 3 \cdot \frac12} = \dfrac{\frac52}{\frac52} = 1$.
    - opgave: |-
        Schrijf $\tan\bigl(x + \frac{\pi}{4}\bigr)$ met $\tan x$.
      antwoord: |-
        $\dfrac{\tan x + 1}{1 - \tan x}$
      uitwerking: |-
        Met $\tan\frac{\pi}{4} = 1$: $\dfrac{\tan x + 1}{1 - \tan x \cdot 1} = \dfrac{\tan x + 1}{1 - \tan x}$ (als $\tan x$ bestaat en $\tan x \neq 1$).

- id: h2-sindubbel-k
  soort: kort
  opgave: |-
    De sinus van de dubbele hoek.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken exact $2\sin\frac{3\pi}{8}\cos\frac{3\pi}{8}$.
      antwoord: |-
        $\frac{\sqrt2}{2}$
      uitwerking: |-
        Verdubbelingsformule met $\alpha = \frac{3\pi}{8}$: $\sin\frac{6\pi}{8} = \sin\frac{3\pi}{4} = \frac{\sqrt2}{2}$.
    - opgave: |-
        Bereken exact $\sin 2\alpha$ als $\sin\alpha = \frac{12}{13}$ en $\alpha$ in het tweede kwadrant ligt.
      antwoord: |-
        $-\frac{120}{169}$
      uitwerking: |-
        In het tweede kwadrant is $\cos\alpha = -\sqrt{1 - \frac{144}{169}} = -\frac{5}{13}$. Dan is $\sin 2\alpha = 2 \cdot \frac{12}{13} \cdot \bigl(-\frac{5}{13}\bigr) = -\frac{120}{169}$.
    - opgave: |-
        Schrijf $\sin 4x$ met $\sin 2x$ en $\cos 2x$.
      antwoord: |-
        $2\sin 2x\cos 2x$
      uitwerking: |-
        Verdubbelingsformule met $\alpha = 2x$: $\sin 4x = \sin(2 \cdot 2x) = 2\sin 2x\cos 2x$.

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: exacte waarden met som en verschil
  opgave: |-
    Bepaal exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\cos\frac{7\pi}{12}$
      antwoord: |-
        $\frac{\sqrt2 - \sqrt6}{4}$
      uitwerking: |-
        $\cos\bigl(\frac{\pi}{3} + \frac{\pi}{4}\bigr) = \frac12 \cdot \frac{\sqrt2}{2} - \frac{\sqrt3}{2} \cdot \frac{\sqrt2}{2} = \frac{\sqrt2 - \sqrt6}{4}$.
    - opgave: |-
        $\sin\frac{\pi}{12}$
      antwoord: |-
        $\frac{\sqrt6 - \sqrt2}{4}$
      uitwerking: |-
        $\sin\bigl(\frac{\pi}{3} - \frac{\pi}{4}\bigr) = \frac{\sqrt3}{2} \cdot \frac{\sqrt2}{2} - \frac12 \cdot \frac{\sqrt2}{2} = \frac{\sqrt6 - \sqrt2}{4}$.
    - opgave: |-
        $\tan\frac{\pi}{12}$
      antwoord: |-
        $2 - \sqrt3$
      uitwerking: |-
        $\tan\bigl(\frac{\pi}{3} - \frac{\pi}{4}\bigr) = \frac{\sqrt3 - 1}{1 + \sqrt3} = \frac{(\sqrt3 - 1)^2}{3 - 1} = \frac{4 - 2\sqrt3}{2} = 2 - \sqrt3$.
    - opgave: |-
        $\sin\frac{13\pi}{12}$
      antwoord: |-
        $\frac{\sqrt2 - \sqrt6}{4}$
      uitwerking: |-
        $\frac{13\pi}{12} = \pi + \frac{\pi}{12}$ (antisupplementair): $\sin\frac{13\pi}{12} = -\sin\frac{\pi}{12} = -\frac{\sqrt6 - \sqrt2}{4} = \frac{\sqrt2 - \sqrt6}{4}$.
    - opgave: |-
        $\cos\frac{17\pi}{12}$
      antwoord: |-
        $\frac{\sqrt2 - \sqrt6}{4}$
      uitwerking: |-
        $\frac{17\pi}{12} = \frac{5\pi}{4} + \frac{\pi}{6}$: $\cos\frac{5\pi}{4}\cos\frac{\pi}{6} - \sin\frac{5\pi}{4}\sin\frac{\pi}{6} = -\frac{\sqrt2}{2} \cdot \frac{\sqrt3}{2} + \frac{\sqrt2}{2} \cdot \frac12 = \frac{\sqrt2 - \sqrt6}{4}$.
    - opgave: |-
        $\sin 105^\circ$
      antwoord: |-
        $\frac{\sqrt6 + \sqrt2}{4}$
      uitwerking: |-
        $\sin(60^\circ + 45^\circ) = \frac{\sqrt3}{2} \cdot \frac{\sqrt2}{2} + \frac12 \cdot \frac{\sqrt2}{2} = \frac{\sqrt6 + \sqrt2}{4}$.
    - opgave: |-
        $\cos\bigl(-\frac{\pi}{12}\bigr)$
      antwoord: |-
        $\frac{\sqrt6 + \sqrt2}{4}$
      uitwerking: |-
        Tegengestelde hoeken: $\cos\bigl(-\frac{\pi}{12}\bigr) = \cos\frac{\pi}{12} = \frac{\sqrt2 + \sqrt6}{4}$ (zoals in het voorbeeld met $\cos\frac{\pi}{12}$).
    - opgave: |-
        $\tan\frac{7\pi}{12}$
      antwoord: |-
        $-2 - \sqrt3$
      uitwerking: |-
        $\tan\bigl(\frac{\pi}{3} + \frac{\pi}{4}\bigr) = \frac{\sqrt3 + 1}{1 - \sqrt3} = \frac{(\sqrt3 + 1)^2}{1 - 3} = \frac{4 + 2\sqrt3}{-2} = -2 - \sqrt3$.
    - opgave: |-
        $\sin\frac{23\pi}{12}$
      antwoord: |-
        $\frac{\sqrt2 - \sqrt6}{4}$
      uitwerking: |-
        $\frac{23\pi}{12} = 2\pi - \frac{\pi}{12}$, dus $\sin\frac{23\pi}{12} = \sin\bigl(-\frac{\pi}{12}\bigr) = -\frac{\sqrt6 - \sqrt2}{4} = \frac{\sqrt2 - \sqrt6}{4}$.
    - opgave: |-
        $\cos 255^\circ$
      antwoord: |-
        $\frac{\sqrt2 - \sqrt6}{4}$
      uitwerking: |-
        $\cos(210^\circ + 45^\circ) = -\frac{\sqrt3}{2} \cdot \frac{\sqrt2}{2} - \bigl(-\frac12\bigr) \cdot \frac{\sqrt2}{2} = \frac{\sqrt2 - \sqrt6}{4}$.

- id: h2-o13
  soort: opdracht
  niveau: 1
  thema: |-
    klassieke fouten: waar of vals
  opgave: |-
    Waar voor elke $x$, of vals? Geef bij vals een tegenvoorbeeld, bij waar de formule die het zegt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin 2x = 2\sin x$
      antwoord: |-
        vals
      uitwerking: |-
        Vals: voor $x = \frac{\pi}{2}$ is $\sin\pi = 0$, maar $2\sin\frac{\pi}{2} = 2$. Juist is $\sin 2x = 2\sin x\cos x$.
    - opgave: |-
        $\cos 2x = 1 - 2\sin^2 x$
      antwoord: |-
        waar
      uitwerking: |-
        Waar: een van de drie vormen van de verdubbelingsformule.
    - opgave: |-
        $\cos(x + \pi) = \cos x + \cos\pi$
      antwoord: |-
        vals
      uitwerking: |-
        Vals: voor $x = 0$ staat links $\cos\pi = -1$ en rechts $1 - 1 = 0$. Juist is $\cos(x + \pi) = -\cos x$.
    - opgave: |-
        $\tan(x + \pi) = \tan x$
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $\frac{\sin(x + \pi)}{\cos(x + \pi)} = \frac{-\sin x}{-\cos x} = \tan x$ (antisupplementaire hoeken).
    - opgave: |-
        $\cos 2x = 2\cos x - 1$
      antwoord: |-
        vals
      uitwerking: |-
        Vals: voor $x = \pi$ is $\cos 2\pi = 1$, maar $2\cos\pi - 1 = -3$. Het kwadraat ontbreekt: $\cos 2x = 2\cos^2 x - 1$.
    - opgave: |-
        $\sin\bigl(x + \frac{\pi}{2}\bigr) = \cos x$
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $\sin x\cos\frac{\pi}{2} + \cos x\sin\frac{\pi}{2} = \cos x$.
    - opgave: |-
        $\sin\frac{x}{2} = \frac12\sin x$
      antwoord: |-
        vals
      uitwerking: |-
        Vals: voor $x = \pi$ is $\sin\frac{\pi}{2} = 1$, maar $\frac12\sin\pi = 0$.
    - opgave: |-
        $\sin^2 x = \sin(x^2)$
      antwoord: |-
        vals
      uitwerking: |-
        Vals: $\sin^2 x$ betekent $(\sin x)^2$. Voor $x = \pi$ is $\sin^2\pi = 0$, maar $\sin(\pi^2) \approx -0{,}43$.

- id: h2-o10
  soort: opdracht
  niveau: 1
  thema: |-
    som en verschil met gegeven waarden
  opgave: |-
    Bereken exact.
  lijst: enumerate
  delen:
    - opgave: |-
        $\cos(\alpha + \beta)$, als $\sin\alpha = \frac{7}{25}$ en $\cos\beta = \frac45$, met $\alpha$ en $\beta$ in het eerste kwadrant.
      antwoord: |-
        $\frac35$
      uitwerking: |-
        Grondformule, eerste kwadrant: $\cos\alpha = \sqrt{1 - \frac{49}{625}} = \frac{24}{25}$ en $\sin\beta = \sqrt{1 - \frac{16}{25}} = \frac35$. Dan is $\cos(\alpha + \beta) = \frac{24}{25} \cdot \frac45 - \frac{7}{25} \cdot \frac35 = \frac{96 - 21}{125} = \frac{75}{125} = \frac35$.
    - opgave: |-
        $\sin(\alpha - \beta)$, als $\cos\alpha = -\frac35$ met $\alpha$ in het tweede kwadrant, en $\sin\beta = -\frac{5}{13}$ met $\beta$ in het derde kwadrant.
      antwoord: |-
        $-\frac{63}{65}$
      uitwerking: |-
        Tweede kwadrant: $\sin\alpha = \frac45$. Derde kwadrant: $\cos\beta = -\frac{12}{13}$. Dan is $\sin(\alpha - \beta) = \sin\alpha\cos\beta - \cos\alpha\sin\beta = \frac45 \cdot \bigl(-\frac{12}{13}\bigr) - \bigl(-\frac35\bigr)\bigl(-\frac{5}{13}\bigr) = \frac{-48 - 15}{65} = -\frac{63}{65}$.
    - opgave: |-
        $\cos(\alpha + \beta)$ en $\tan(\alpha + \beta)$, als $\tan\alpha = \frac34$ met $\alpha$ in het derde kwadrant, en $\tan\beta = -\frac{5}{12}$ met $\beta$ in het tweede kwadrant.
      antwoord: |-
        $\frac{63}{65}$; $\frac{16}{63}$
      uitwerking: |-
        Derde kwadrant met $\tan\alpha = \frac34$: $\cos\alpha = -\frac45$ en $\sin\alpha = -\frac35$ (de driehoek $3$, $4$, $5$, met beide tekens negatief). Tweede kwadrant met $\tan\beta = -\frac{5}{12}$: $\cos\beta = -\frac{12}{13}$ en $\sin\beta = \frac{5}{13}$. Dan is $\cos(\alpha + \beta) = \bigl(-\frac45\bigr)\bigl(-\frac{12}{13}\bigr) - \bigl(-\frac35\bigr)\frac{5}{13} = \frac{48 + 15}{65} = \frac{63}{65}$, en $\tan(\alpha + \beta) = \dfrac{\frac34 - \frac{5}{12}}{1 + \frac34 \cdot \frac{5}{12}} = \dfrac{\frac13}{\frac{63}{48}} = \frac{16}{63}$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: formules herkennen
  opgave: |-
    Schrijf korter, of bereken exact.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin 3x\cos x - \cos 3x\sin x$
      antwoord: |-
        $\sin 2x$
      uitwerking: |-
        Verschilformule van de sinus: $\sin(3x - x) = \sin 2x$.
    - opgave: |-
        $\cos^2 2x - \sin^2 2x$
      antwoord: |-
        $\cos 4x$
      uitwerking: |-
        Verdubbelingsformule met $\alpha = 2x$: $\cos(2 \cdot 2x) = \cos 4x$.
    - opgave: |-
        $2\sin\frac{\pi}{8}\cos\frac{\pi}{8}$
      antwoord: |-
        $\frac{\sqrt2}{2}$
      uitwerking: |-
        Verdubbelingsformule: $\sin\bigl(2 \cdot \frac{\pi}{8}\bigr) = \sin\frac{\pi}{4} = \frac{\sqrt2}{2}$.
    - opgave: |-
        $\cos 3x\cos x - \sin 3x\sin x$
      antwoord: |-
        $\cos 4x$
      uitwerking: |-
        Somformule van de cosinus: $\cos(3x + x) = \cos 4x$.
    - opgave: |-
        $2\cos^2\frac{x}{2} - 1$
      antwoord: |-
        $\cos x$
      uitwerking: |-
        $\cos 2\alpha = 2\cos^2\alpha - 1$ met $\alpha = \frac{x}{2}$: $\cos x$.
    - opgave: |-
        $\dfrac{2\tan 3x}{1 - \tan^2 3x}$
      antwoord: |-
        $\tan 6x$
      uitwerking: |-
        Verdubbelingsformule van de tangens met $\alpha = 3x$: $\tan 6x$.
    - opgave: |-
        $\sin\frac{\pi}{5}\cos\frac{\pi}{20} + \cos\frac{\pi}{5}\sin\frac{\pi}{20}$
      antwoord: |-
        $\frac{\sqrt2}{2}$
      uitwerking: |-
        Somformule: $\sin\bigl(\frac{\pi}{5} + \frac{\pi}{20}\bigr) = \sin\frac{5\pi}{20} = \sin\frac{\pi}{4} = \frac{\sqrt2}{2}$.
    - opgave: |-
        $\cos^2\frac{\pi}{12} - \sin^2\frac{\pi}{12}$
      antwoord: |-
        $\frac{\sqrt3}{2}$
      uitwerking: |-
        $\cos\bigl(2 \cdot \frac{\pi}{12}\bigr) = \cos\frac{\pi}{6} = \frac{\sqrt3}{2}$.
    - opgave: |-
        $4\sin x\cos x\cos 2x$
      antwoord: |-
        $\sin 4x$
      uitwerking: |-
        Twee keer verdubbelen: $4\sin x\cos x\cos 2x = 2\sin 2x\cos 2x = \sin 4x$.

- id: h2-o14
  soort: opdracht
  niveau: 1
  thema: |-
    som en verschil op de eenheidscirkel
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[scale=1.5,font=\scriptsize]
        \eenheidscirkel
        \draw[accent] (0,0) -- (.6,.8) (0,0) -- (-.4706,.8824);
        \draw[accent,dashed] (.6,.8) -- (-.4706,.8824);
        \fill[accent] (.6,.8) circle (.035) node[above right] {$P$};
        \fill[accent] (-.4706,.8824) circle (.035) node[above left] {$Q$};
        \draw[->,accent] (.22,0) arc (0:53.13:.22);
        \node[accent] at (24:.34) {$\alpha$};
        \draw[->,grijs] (.45,0) arc (0:118.07:.45);
        \node at (100:.6) {$\beta$};
      \end{tikzpicture}
  opgave: |-
    Op de eenheidscirkel ligt $P\bigl(\frac35, \frac45\bigr)$ bij de hoek $\alpha$, en $Q\bigl(-\frac{8}{17}, \frac{15}{17}\bigr)$ bij de hoek $\beta$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef $\cos\alpha$, $\sin\alpha$, $\cos\beta$ en $\sin\beta$.
      antwoord: |-
        $\frac35$; $\frac45$; $-\frac{8}{17}$; $\frac{15}{17}$
      uitwerking: |-
        De cosinus is de $x$-coördinaat en de sinus de $y$-coördinaat: $\cos\alpha = \frac35$, $\sin\alpha = \frac45$, $\cos\beta = -\frac{8}{17}$ en $\sin\beta = \frac{15}{17}$.
    - opgave: |-
        Bereken exact $\cos(\beta - \alpha)$, de cosinus van de hoek $\widehat{POQ}$.
      antwoord: |-
        $\frac{36}{85}$
      uitwerking: |-
        $\cos(\beta - \alpha) = \cos\beta\cos\alpha + \sin\beta\sin\alpha = -\frac{8}{17} \cdot \frac35 + \frac{15}{17} \cdot \frac45 = \frac{-24 + 60}{85} = \frac{36}{85}$.
    - opgave: |-
        Bereken exact $\sin(\alpha + \beta)$.
      antwoord: |-
        $\frac{13}{85}$
      uitwerking: |-
        $\sin(\alpha + \beta) = \sin\alpha\cos\beta + \cos\alpha\sin\beta = \frac45 \cdot \bigl(-\frac{8}{17}\bigr) + \frac35 \cdot \frac{15}{17} = \frac{-32 + 45}{85} = \frac{13}{85}$.
    - opgave: |-
        Bereken $|PQ|^2$ met de afstandsformule, en controleer dat $|PQ|^2 = 2 - 2\cos(\beta - \alpha)$, zoals in het bewijs van de verschilformule.
      antwoord: |-
        $\frac{98}{85}$
      uitwerking: |-
        $|PQ|^2 = \bigl(\frac35 + \frac{8}{17}\bigr)^2 + \bigl(\frac45 - \frac{15}{17}\bigr)^2 = \bigl(\frac{91}{85}\bigr)^2 + \bigl(-\frac{7}{85}\bigr)^2 = \frac{8281 + 49}{7225} = \frac{8330}{7225} = \frac{98}{85}$. En $2 - 2 \cdot \frac{36}{85} = \frac{170 - 72}{85} = \frac{98}{85}$: het klopt.

- id: h2-o12
  soort: opdracht
  niveau: 1
  thema: |-
    verdubbelen met gegeven waarde
  opgave: |-
    Gegeven: $\sin\alpha = -\frac23$ en $\pi < \alpha < \frac{3\pi}{2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken exact $\cos\alpha$.
      antwoord: |-
        $-\frac{\sqrt5}{3}$
      uitwerking: |-
        $\cos^2\alpha = 1 - \frac49 = \frac59$. In het derde kwadrant is de cosinus negatief: $\cos\alpha = -\frac{\sqrt5}{3}$.
    - opgave: |-
        Bereken exact $\sin 2\alpha$, $\cos 2\alpha$ en $\tan 2\alpha$.
      antwoord: |-
        $\frac{4\sqrt5}{9}$; $\frac19$; $4\sqrt5$
      uitwerking: |-
        $\sin 2\alpha = 2 \cdot \bigl(-\frac23\bigr)\bigl(-\frac{\sqrt5}{3}\bigr) = \frac{4\sqrt5}{9}$, $\cos 2\alpha = 1 - 2 \cdot \frac49 = \frac19$ en $\tan 2\alpha = \dfrac{4\sqrt5/9}{1/9} = 4\sqrt5$.
    - opgave: |-
        In welk kwadrant ligt het punt bij $2\alpha$? Controleer met de tekens uit b.
      antwoord: |-
        het eerste
      uitwerking: |-
        Uit $\pi < \alpha < \frac{3\pi}{2}$ volgt $2\pi < 2\alpha < 3\pi$: na een volle toer het eerste of het tweede kwadrant. $\sin 2\alpha > 0$ en $\cos 2\alpha > 0$: het eerste kwadrant.

- id: h2-o11
  soort: opdracht
  niveau: 1
  thema: |-
    drill: samenvoegen
  opgave: |-
    Schrijf als $R\sin(x + \varphi)$, met $R > 0$ en $\varphi \in \left]-\pi, \pi\right]$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sqrt3\sin x + \cos x$
      antwoord: |-
        $2\sin\bigl(x + \frac{\pi}{6}\bigr)$
      uitwerking: |-
        $R = 2$, $\cos\varphi = \frac{\sqrt3}{2}$, $\sin\varphi = \frac12$: $\varphi = \frac{\pi}{6}$.
    - opgave: |-
        $\sin x - \sqrt3\cos x$
      antwoord: |-
        $2\sin\bigl(x - \frac{\pi}{3}\bigr)$
      uitwerking: |-
        $R = 2$, $\cos\varphi = \frac12$, $\sin\varphi = -\frac{\sqrt3}{2}$: $\varphi = -\frac{\pi}{3}$.
    - opgave: |-
        $-\sin x - \cos x$
      antwoord: |-
        $\sqrt2\sin\bigl(x - \frac{3\pi}{4}\bigr)$
      uitwerking: |-
        $R = \sqrt2$, $\cos\varphi = \sin\varphi = -\frac{\sqrt2}{2}$: derde kwadrant, $\varphi = -\frac{3\pi}{4}$.
    - opgave: |-
        $2\sin x + 2\cos x$
      antwoord: |-
        $2\sqrt2\sin\bigl(x + \frac{\pi}{4}\bigr)$
      uitwerking: |-
        $R = \sqrt8 = 2\sqrt2$, $\cos\varphi = \sin\varphi = \frac{\sqrt2}{2}$: $\varphi = \frac{\pi}{4}$.
    - opgave: |-
        $-\sqrt3\sin x + \cos x$
      antwoord: |-
        $2\sin\bigl(x + \frac{5\pi}{6}\bigr)$
      uitwerking: |-
        $R = 2$, $\cos\varphi = -\frac{\sqrt3}{2}$, $\sin\varphi = \frac12$: tweede kwadrant, $\varphi = \frac{5\pi}{6}$.
    - opgave: |-
        $\cos x$
      antwoord: |-
        $\sin\bigl(x + \frac{\pi}{2}\bigr)$
      uitwerking: |-
        $a = 0$, $b = 1$: $R = 1$, $\cos\varphi = 0$, $\sin\varphi = 1$: $\varphi = \frac{\pi}{2}$.
    - opgave: |-
        $-3\sin x$
      antwoord: |-
        $3\sin(x + \pi)$
      uitwerking: |-
        $R = 3$, $\cos\varphi = -1$, $\sin\varphi = 0$: $\varphi = \pi$.
    - opgave: |-
        $3\sin x - 3\sqrt3\cos x$
      antwoord: |-
        $6\sin\bigl(x - \frac{\pi}{3}\bigr)$
      uitwerking: |-
        $R = \sqrt{9 + 27} = 6$, $\cos\varphi = \frac12$, $\sin\varphi = -\frac{\sqrt3}{2}$: $\varphi = -\frac{\pi}{3}$.
    - opgave: |-
        $4\sin x - 3\cos x$
      antwoord: |-
        $5\sin(x + \varphi)$, $\varphi \approx -0{,}644$
      uitwerking: |-
        $R = 5$, $\cos\varphi = \frac45$, $\sin\varphi = -\frac35$: vierde kwadrant, $\varphi \approx -0{,}644$ rad.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    verdubbelen met de tangens
  opgave: |-
    Gegeven: $\tan\alpha = \frac12$. Bereken $\tan 2\alpha$ en $\tan 3\alpha$.
  antwoord: |-
    $\frac43$; $\frac{11}{2}$
  uitwerking: |-
    $\tan 2\alpha = \dfrac{2 \cdot \frac12}{1 - \frac14} = \dfrac{1}{\frac34} = \frac43$. $\tan 3\alpha = \tan(2\alpha + \alpha) = \dfrac{\frac43 + \frac12}{1 - \frac43 \cdot \frac12} = \dfrac{\frac{11}{6}}{\frac13} = \frac{11}{2}$.

- id: h2-o15
  soort: opdracht
  niveau: 1
  thema: |-
    Carnot: kwadraten wegwerken
  opgave: |-
    Schrijf zonder kwadraten of producten van goniometrische functies.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\cos^2 3x$
      antwoord: |-
        $\frac{1 + \cos 6x}{2}$
      uitwerking: |-
        Carnot met $\alpha = 3x$: $\frac{1 + \cos 6x}{2}$.
    - opgave: |-
        $\sin^2\frac{x}{2}$
      antwoord: |-
        $\frac{1 - \cos x}{2}$
      uitwerking: |-
        Carnot met $\alpha = \frac{x}{2}$, dus $2\alpha = x$: $\frac{1 - \cos x}{2}$.
    - opgave: |-
        $2\sin^2 x + 1$
      antwoord: |-
        $2 - \cos 2x$
      uitwerking: |-
        $2 \cdot \frac{1 - \cos 2x}{2} + 1 = 1 - \cos 2x + 1 = 2 - \cos 2x$.
    - opgave: |-
        $6\cos^2 x - 3$
      antwoord: |-
        $3\cos 2x$
      uitwerking: |-
        $6 \cdot \frac{1 + \cos 2x}{2} - 3 = 3 + 3\cos 2x - 3 = 3\cos 2x$.
    - opgave: |-
        $\sin^2 x\cos^2 x$
      antwoord: |-
        $\frac{1 - \cos 4x}{8}$
      uitwerking: |-
        $\sin x\cos x = \frac12\sin 2x$, dus $\sin^2 x\cos^2 x = \frac14\sin^2 2x = \frac14 \cdot \frac{1 - \cos 4x}{2} = \frac{1 - \cos 4x}{8}$.
    - opgave: |-
        $\cos^4 x$
      antwoord: |-
        $\frac{3 + 4\cos 2x + \cos 4x}{8}$
      uitwerking: |-
        $\cos^4 x = \bigl(\frac{1 + \cos 2x}{2}\bigr)^2 = \frac{1 + 2\cos 2x + \cos^2 2x}{4}$. Nog eens Carnot: $\cos^2 2x = \frac{1 + \cos 4x}{2}$, zodat $\cos^4 x = \frac{2 + 4\cos 2x + 1 + \cos 4x}{8} = \frac{3 + 4\cos 2x + \cos 4x}{8}$.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    drill: vereenvoudigen
  opgave: |-
    Vereenvoudig zo ver mogelijk.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin\bigl(x + \frac{\pi}{3}\bigr) + \sin\bigl(x - \frac{\pi}{3}\bigr)$
      antwoord: |-
        $\sin x$
      uitwerking: |-
        De termen met $\cos x\sin\frac{\pi}{3}$ vallen tegen elkaar weg: $2\sin x\cos\frac{\pi}{3} = 2 \cdot \frac12\sin x = \sin x$.
    - opgave: |-
        $\cos\bigl(x + \frac{\pi}{4}\bigr) - \cos\bigl(x - \frac{\pi}{4}\bigr)$
      antwoord: |-
        $-\sqrt2\sin x$
      uitwerking: |-
        De termen met $\cos x\cos\frac{\pi}{4}$ vallen weg: $-2\sin x\sin\frac{\pi}{4} = -2 \cdot \frac{\sqrt2}{2}\sin x = -\sqrt2\sin x$.
    - opgave: |-
        $\dfrac{\sin 2x}{\sin x}$
      antwoord: |-
        $2\cos x$
      uitwerking: |-
        $\dfrac{2\sin x\cos x}{\sin x} = 2\cos x$ (voor $\sin x \neq 0$).
    - opgave: |-
        $\dfrac{\cos 2x}{\cos x + \sin x}$
      antwoord: |-
        $\cos x - \sin x$
      uitwerking: |-
        $\cos 2x = \cos^2 x - \sin^2 x = (\cos x - \sin x)(\cos x + \sin x)$: na vereenvoudigen blijft $\cos x - \sin x$.
    - opgave: |-
        $\dfrac{1 + \cos 2x}{2\cos x}$
      antwoord: |-
        $\cos x$
      uitwerking: |-
        Kies $\cos 2x = 2\cos^2 x - 1$, zodat de 1 wegvalt: $\dfrac{2\cos^2 x}{2\cos x} = \cos x$.
    - opgave: |-
        $(\cos x - \sin x)^2$
      antwoord: |-
        $1 - \sin 2x$
      uitwerking: |-
        $\cos^2 x - 2\sin x\cos x + \sin^2 x = 1 - \sin 2x$.
    - opgave: |-
        $\cos^2\bigl(\frac{\pi}{4} - x\bigr) - \sin^2\bigl(\frac{\pi}{4} - x\bigr)$
      antwoord: |-
        $\sin 2x$
      uitwerking: |-
        Verdubbelingsformule met $\alpha = \frac{\pi}{4} - x$: $\cos\bigl(\frac{\pi}{2} - 2x\bigr) = \sin 2x$ (complementaire hoeken).
    - opgave: |-
        $\dfrac{\tan x + \tan 2x}{1 - \tan x\tan 2x}$
      antwoord: |-
        $\tan 3x$
      uitwerking: |-
        Somformule van de tangens: $\tan(x + 2x) = \tan 3x$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    hoek tussen twee rechten
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[x=.75cm,y=.75cm,font=\scriptsize]
        \rooster{0}{1}{4}{0}{1}{4}
        \kromme{0}{1.333}{3*\x}
        \kromme{0}{4}{\x/2}
        \draw[grijs] (.8,0) arc (0:26.57:.8);
        \node at (13:1.05) {$\alpha$};
        \draw[accent,thick] (26.57:1.5) arc (26.57:71.57:1.5);
        \node[accent] at (49:1.8) {$\theta$};
        \node[right,text=accent] at (4,2) {$y = \frac{x}{2}$};
        \node[right,text=accent] at (1.33,4) {$y = 3x$};
      \end{tikzpicture}
  opgave: |-
    Op een kaart (eenheid 1 km) kruisen twee rechte wegen elkaar in de oorsprong: $y = \frac{x}{2}$ en $y = 3x$. Ze maken met de $x$-as de hoeken $\alpha$ en $\beta$, met $\tan\alpha = \frac12$ en $\tan\beta = 3$. De hoek tussen de wegen is $\theta = \beta - \alpha$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: voor twee rechten met richtingscoëfficiënten $m_1 = \tan\alpha$ en $m_2 = \tan\beta$ is $\tan(\beta - \alpha) = \dfrac{m_2 - m_1}{1 + m_1 m_2}$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Dat is de verschilformule van de tangens: $\tan(\beta - \alpha) = \dfrac{\tan\beta - \tan\alpha}{1 + \tan\beta\tan\alpha} = \dfrac{m_2 - m_1}{1 + m_1 m_2}$.
    - opgave: |-
        Bereken de hoek $\theta$ tussen de twee wegen, exact.
      antwoord: |-
        $\frac{\pi}{4}$
      uitwerking: |-
        $\tan\theta = \dfrac{3 - \frac12}{1 + \frac32} = \dfrac{\frac52}{\frac52} = 1$. Beide hoeken liggen tussen $0$ en $\frac{\pi}{2}$ en $\beta > \alpha$, dus $0 < \theta < \frac{\pi}{2}$: $\theta = \frac{\pi}{4}$.
    - opgave: |-
        Een derde weg is $y = -x$, een vierde $y = 2x$. Bereken de scherpe hoek tussen die twee, in radialen en in graden.
      antwoord: |-
        $\approx 1{,}249$ rad $\approx 71{,}6^\circ$
      uitwerking: |-
        Met $m_1 = -1$ en $m_2 = 2$: $\tan\theta = \dfrac{2 - (-1)}{1 + (-1) \cdot 2} = \dfrac{3}{-1} = -3$. De hoek $\theta = \beta - \alpha$ is dus stomp, en de scherpe hoek tussen de rechten is $\pi - \theta$, met tangens $3$. Rekentoestel: $\approx 1{,}249$ rad $\approx 71{,}6^\circ$.
    - opgave: |-
        Wanneer staan twee rechten loodrecht op elkaar? Leid het af uit de formule van a.
      antwoord: |-
        als $m_1 m_2 = -1$
      uitwerking: |-
        Bij een rechte hoek bestaat $\tan\theta$ niet: de noemer is $0$. Dus $1 + m_1 m_2 = 0$, of $m_1 m_2 = -1$. Dat is de voorwaarde uit de 2de graad.

- id: h2-o4
  soort: opdracht
  niveau: 2
  thema: |-
    identiteiten
  opgave: |-
    Bewijs.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin\bigl(x + \frac{\pi}{2}\bigr) = \cos x$, met de somformule
      antwoord: |-
        bewijs
      uitwerking: |-
        $\sin\bigl(x + \frac{\pi}{2}\bigr) = \sin x\cos\frac{\pi}{2} + \cos x\sin\frac{\pi}{2} = \sin x \cdot 0 + \cos x \cdot 1 = \cos x$.
    - opgave: |-
        $\cos(x + y)\cos(x - y) = \cos^2 x - \sin^2 y$
      antwoord: |-
        bewijs
      uitwerking: |-
        Het product is van de vorm $(A - B)(A + B)$ met $A = \cos x\cos y$ en $B = \sin x\sin y$: $(\cos x\cos y)^2 - (\sin x\sin y)^2$. Vervang $\cos^2 y = 1 - \sin^2 y$ en $\sin^2 x = 1 - \cos^2 x$: $\cos^2 x(1 - \sin^2 y) - (1 - \cos^2 x)\sin^2 y = \cos^2 x - \cos^2 x\sin^2 y - \sin^2 y + \cos^2 x\sin^2 y = \cos^2 x - \sin^2 y$.
    - opgave: |-
        $(\sin x + \cos x)^2 = 1 + \sin 2x$
      antwoord: |-
        bewijs
      uitwerking: |-
        $(\sin x + \cos x)^2 = \sin^2 x + \cos^2 x + 2\sin x\cos x = 1 + \sin 2x$ (grondformule en verdubbelingsformule).

- id: h2-o23
  soort: opdracht
  niveau: 2
  thema: |-
    vier- en drievoudige hoek
  opgave: |-
    Gegeven: $\cos\alpha = \frac35$ en $0 < \alpha < \frac{\pi}{2}$. Bereken exact. Gebruik telkens wat je al hebt.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\cos 2\alpha$
      antwoord: |-
        $-\frac{7}{25}$
      uitwerking: |-
        $\cos 2\alpha = 2\cos^2\alpha - 1 = \frac{18}{25} - 1 = -\frac{7}{25}$.
    - opgave: |-
        $\cos 4\alpha$
      antwoord: |-
        $-\frac{527}{625}$
      uitwerking: |-
        Verdubbel $2\alpha$: $\cos 4\alpha = 2\cos^2 2\alpha - 1 = 2 \cdot \frac{49}{625} - 1 = -\frac{527}{625}$.
    - opgave: |-
        $\sin 4\alpha$
      antwoord: |-
        $-\frac{336}{625}$
      uitwerking: |-
        $\sin\alpha = \frac45$, dus $\sin 2\alpha = 2 \cdot \frac45 \cdot \frac35 = \frac{24}{25}$ en $\sin 4\alpha = 2\sin 2\alpha\cos 2\alpha = 2 \cdot \frac{24}{25} \cdot \bigl(-\frac{7}{25}\bigr) = -\frac{336}{625}$.
    - opgave: |-
        $\cos 3\alpha$
      antwoord: |-
        $-\frac{117}{125}$
      uitwerking: |-
        $\cos 3\alpha = \cos(2\alpha + \alpha) = \cos 2\alpha\cos\alpha - \sin 2\alpha\sin\alpha = -\frac{7}{25} \cdot \frac35 - \frac{24}{25} \cdot \frac45 = \frac{-21 - 96}{125} = -\frac{117}{125}$.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    waar zit de fout?
  opgave: |-
    Elke berekening bevat een fout. Waar zit ze? Geef de juiste uitkomst.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sin\frac{7\pi}{12} = \sin\frac{\pi}{3} + \sin\frac{\pi}{4} = \frac{\sqrt3 + \sqrt2}{2}$
      antwoord: |-
        $\frac{\sqrt6 + \sqrt2}{4}$
      uitwerking: |-
        De sinus van een som is niet de som van de sinussen. Je ziet het ook aan de uitkomst: $\frac{\sqrt3 + \sqrt2}{2} \approx 1{,}57 > 1$, en een sinus is nooit groter dan $1$. Juist: $\sin\frac{\pi}{3}\cos\frac{\pi}{4} + \cos\frac{\pi}{3}\sin\frac{\pi}{4} = \frac{\sqrt6 + \sqrt2}{4}$.
    - opgave: |-
        $\sin\alpha = \frac35$ en $\frac{\pi}{2} < \alpha < \pi$, dus $\cos\alpha = \frac45$ en $\sin 2\alpha = 2 \cdot \frac35 \cdot \frac45 = \frac{24}{25}$.
      antwoord: |-
        $-\frac{24}{25}$
      uitwerking: |-
        Het teken van $\cos\alpha$ is fout: in het tweede kwadrant is $\cos\alpha = -\frac45$. Dan is $\sin 2\alpha = 2 \cdot \frac35 \cdot \bigl(-\frac45\bigr) = -\frac{24}{25}$.
    - opgave: |-
        $\cos^2\frac{\pi}{8} = \dfrac{1 + \cos\frac{\pi}{8}}{2}$
      antwoord: |-
        $\frac{2 + \sqrt2}{4}$
      uitwerking: |-
        Carnot ruilt het kwadraat in voor de dubbele hoek: rechts hoort $\cos\frac{\pi}{4}$. Juist: $\cos^2\frac{\pi}{8} = \dfrac{1 + \frac{\sqrt2}{2}}{2} = \frac{2 + \sqrt2}{4}$.
    - opgave: |-
        $\sqrt3\sin x - \cos x = 2\sin\bigl(x + \frac{5\pi}{6}\bigr)$, want $R = 2$ en $\tan\varphi = \frac{b}{a} = -\frac{1}{\sqrt3}$.
      antwoord: |-
        $2\sin\bigl(x - \frac{\pi}{6}\bigr)$
      uitwerking: |-
        De tangens alleen bepaalt $\varphi$ niet: $-\frac{\pi}{6}$ en $\frac{5\pi}{6}$ hebben dezelfde tangens. Kijk naar de tekens: $\cos\varphi = \frac{\sqrt3}{2} > 0$ en $\sin\varphi = -\frac12 < 0$, dus $\varphi = -\frac{\pi}{6}$. Controle: $2\sin\bigl(x + \frac{5\pi}{6}\bigr) = -\sqrt3\sin x + \cos x$, het tegengestelde.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    de voorkant van een tent
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=1,font=\scriptsize]
        \fill[accent!15] (-1.7,0) -- (0,1.5) -- (1.7,0) -- cycle;
        \draw[accent,thick] (-1.7,0) -- (0,1.5) -- (1.7,0);
        \draw[grijs] (-1.9,0) -- (1.9,0);
        \draw[dashed] (0,0) -- node[right,pos=.3] {$h$} (0,1.5);
        \node[above left] at (-.85,.75) {$2$};
        \node[above right] at (.85,.75) {$2$};
        \draw (0,1.5) ++(-138.58:.4) arc (-138.58:-41.42:.4);
        \node[fill=accent!15,inner sep=1pt] at (0,.92) {$2\alpha$};
        \draw[|-|,grijs] (-1.7,-.25) -- node[below] {$b$} (1.7,-.25);
      \end{tikzpicture}
  opgave: |-
    De voorkant van een tent is een gelijkbenige driehoek. De twee schuine zijden zijn $2$ m lang en maken een tophoek $2\alpha$, met $0 < 2\alpha < \pi$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de breedte $b = 4\sin\alpha$ en de hoogte $h = 2\cos\alpha$ is.
      antwoord: |-
        bewijs
      uitwerking: |-
        De hoogte verdeelt de driehoek in twee rechthoekige driehoeken met schuine zijde $2$ en hoek $\alpha$ bij de top. De halve breedte is de overstaande zijde, $2\sin\alpha$, dus $b = 4\sin\alpha$. De hoogte is de aanliggende zijde: $h = 2\cos\alpha$.
    - opgave: |-
        Toon aan dat de oppervlakte $A = 2\sin 2\alpha$ is (in m$^2$).
      antwoord: |-
        bewijs
      uitwerking: |-
        $A = \frac12 \cdot b \cdot h = \frac12 \cdot 4\sin\alpha \cdot 2\cos\alpha = 4\sin\alpha\cos\alpha = 2 \cdot 2\sin\alpha\cos\alpha = 2\sin 2\alpha$.
    - opgave: |-
        Bereken de oppervlakte als de tophoek $\frac{2\pi}{3}$ is.
      antwoord: |-
        $\sqrt3 \approx 1{,}73$ m$^2$
      uitwerking: |-
        $2\alpha = \frac{2\pi}{3}$: $A = 2\sin\frac{2\pi}{3} = 2 \cdot \frac{\sqrt3}{2} = \sqrt3 \approx 1{,}73$ m$^2$.
    - opgave: |-
        Bij welke tophoek is de oppervlakte het grootst? Hoe groot is ze dan?
      antwoord: |-
        $\frac{\pi}{2}$; $2$ m$^2$
      uitwerking: |-
        $\sin 2\alpha$ is hoogstens $1$, en dat bereikt het voor $2\alpha = \frac{\pi}{2}$: een rechte tophoek, met $A = 2$ m$^2$.

- id: h2-o5
  soort: opdracht
  niveau: 2
  thema: |-
    halve hoeken met Carnot
  opgave: |-
    Bereken exact met de formules van Carnot.
  lijst: enumerate
  delen:
    - opgave: |-
        $\cos\frac{\pi}{8}$ en $\sin\frac{\pi}{8}$
      antwoord: |-
        $\frac{\sqrt{2 + \sqrt2}}{2}$; $\frac{\sqrt{2 - \sqrt2}}{2}$
      uitwerking: |-
        $\cos^2\frac{\pi}{8} = \dfrac{1 + \cos\frac{\pi}{4}}{2} = \frac{2 + \sqrt2}{4}$. De hoek ligt in het eerste kwadrant, dus de cosinus is positief: $\cos\frac{\pi}{8} = \frac{\sqrt{2 + \sqrt2}}{2}$. Net zo is $\sin^2\frac{\pi}{8} = \dfrac{1 - \cos\frac{\pi}{4}}{2} = \frac{2 - \sqrt2}{4}$, dus $\sin\frac{\pi}{8} = \frac{\sqrt{2 - \sqrt2}}{2}$.
    - opgave: |-
        $\tan\frac{\pi}{8}$, zonder wortel in de noemer en zonder geneste wortel
      antwoord: |-
        $\sqrt2 - 1$
      uitwerking: |-
        $\tan^2\frac{\pi}{8} = \dfrac{2 - \sqrt2}{2 + \sqrt2} = \dfrac{(2 - \sqrt2)^2}{4 - 2} = \dfrac{6 - 4\sqrt2}{2} = 3 - 2\sqrt2 = (\sqrt2 - 1)^2$. De tangens is positief, dus $\tan\frac{\pi}{8} = \sqrt2 - 1$.
    - opgave: |-
        $\cos\frac{\pi}{12}$. Toon aan dat je hetzelfde krijgt als in voorbeeld~\ref{vb:h2-exact}.
      antwoord: |-
        $\frac{\sqrt{2 + \sqrt3}}{2} = \frac{\sqrt6 + \sqrt2}{4}$
      uitwerking: |-
        $\cos^2\frac{\pi}{12} = \dfrac{1 + \frac{\sqrt3}{2}}{2} = \frac{2 + \sqrt3}{4}$, dus $\cos\frac{\pi}{12} = \frac{\sqrt{2 + \sqrt3}}{2}$. Beide uitkomsten zijn positief, dus het volstaat dat hun kwadraten gelijk zijn: $\bigl(\frac{\sqrt6 + \sqrt2}{4}\bigr)^2 = \frac{6 + 2\sqrt{12} + 2}{16} = \frac{8 + 4\sqrt3}{16} = \frac{2 + \sqrt3}{4}$.

- id: h2-o21
  soort: opdracht
  niveau: 2
  thema: |-
    identiteiten met som en dubbele hoek
  opgave: |-
    Bewijs (voor alle hoeken waarvoor beide leden bestaan).
  lijst: enumerate
  delen:
    - opgave: |-
        $\dfrac{\sin(\alpha + \beta)}{\cos\alpha\cos\beta} = \tan\alpha + \tan\beta$
      antwoord: |-
        bewijs
      uitwerking: |-
        $\dfrac{\sin\alpha\cos\beta + \cos\alpha\sin\beta}{\cos\alpha\cos\beta} = \dfrac{\sin\alpha\cos\beta}{\cos\alpha\cos\beta} + \dfrac{\cos\alpha\sin\beta}{\cos\alpha\cos\beta} = \dfrac{\sin\alpha}{\cos\alpha} + \dfrac{\sin\beta}{\cos\beta} = \tan\alpha + \tan\beta$.
    - opgave: |-
        $\dfrac{\sin 3x}{\sin x} - \dfrac{\cos 3x}{\cos x} = 2$
      antwoord: |-
        bewijs
      uitwerking: |-
        Op gelijke noemer: $\dfrac{\sin 3x\cos x - \cos 3x\sin x}{\sin x\cos x}$. De teller is $\sin(3x - x) = \sin 2x = 2\sin x\cos x$, dus het quotiënt is $2$.
    - opgave: |-
        $\tan x + \dfrac{1}{\tan x} = \dfrac{2}{\sin 2x}$
      antwoord: |-
        bewijs
      uitwerking: |-
        $\dfrac{\sin x}{\cos x} + \dfrac{\cos x}{\sin x} = \dfrac{\sin^2 x + \cos^2 x}{\sin x\cos x} = \dfrac{1}{\sin x\cos x} = \dfrac{2}{2\sin x\cos x} = \dfrac{2}{\sin 2x}$.
    - opgave: |-
        $\dfrac{1 - \tan^2 x}{1 + \tan^2 x} = \cos 2x$
      antwoord: |-
        bewijs
      uitwerking: |-
        Vermenigvuldig teller en noemer met $\cos^2 x$: $\dfrac{\cos^2 x - \sin^2 x}{\cos^2 x + \sin^2 x} = \dfrac{\cos 2x}{1} = \cos 2x$.

- id: h2-o22
  soort: opdracht
  niveau: 2
  thema: |-
    twee golven samen
  opgave: |-
    Twee geluidsgolven komen samen in je oor. Op het tijdstip $t$ is de uitwijking van de ene $u_1 = 3\sin t$, van de andere $u_2 = 4\sin\bigl(t + \frac{\pi}{3}\bigr)$. Je hoort de som $u = u_1 + u_2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $u$ in de vorm $a\sin t + b\cos t$.
      antwoord: |-
        $u = 5\sin t + 2\sqrt3\cos t$
      uitwerking: |-
        $4\sin\bigl(t + \frac{\pi}{3}\bigr) = 4\bigl(\frac12\sin t + \frac{\sqrt3}{2}\cos t\bigr) = 2\sin t + 2\sqrt3\cos t$, dus $u = 3\sin t + 2\sin t + 2\sqrt3\cos t = 5\sin t + 2\sqrt3\cos t$.
    - opgave: |-
        Schrijf $u$ als $R\sin(t + \varphi)$. Geef $R$ exact en $\varphi$ op drie decimalen.
      antwoord: |-
        $R = \sqrt{37} \approx 6{,}08$; $\varphi \approx 0{,}606$
      uitwerking: |-
        $R = \sqrt{25 + 12} = \sqrt{37} \approx 6{,}08$. $\cos\varphi = \frac{5}{\sqrt{37}}$ en $\sin\varphi = \frac{2\sqrt3}{\sqrt{37}}$ zijn positief: eerste kwadrant, $\varphi \approx 0{,}606$ rad.
    - opgave: |-
        De grootste uitwijking is dus niet $3 + 4 = 7$. Waarom niet?
      antwoord: |-
        de toppen vallen niet samen
      uitwerking: |-
        $u_1$ is maximaal $3$ als $\sin t = 1$, $u_2$ is maximaal $4$ als $\sin\bigl(t + \frac{\pi}{3}\bigr) = 1$. Dat gebeurt niet op hetzelfde tijdstip: de golven zijn verschoven. De som haalt daarom maar $\sqrt{37} < 7$.
    - opgave: |-
        Bereken de grootste uitwijking als de tweede golf $u_2 = 4\sin\bigl(t + \frac{\pi}{2}\bigr)$ is.
      antwoord: |-
        $5$
      uitwerking: |-
        $u_2 = 4\cos t$, dus $u = 3\sin t + 4\cos t$ en $R = \sqrt{9 + 16} = 5$.

- id: h2-o6
  soort: opdracht
  niveau: 2
  thema: |-
    som van twee hoeken uit de tangens
  opgave: |-
    Twee hoeken $\alpha$ en $\beta$ in het eerste kwadrant hebben $\tan\alpha = 2$ en $\tan\beta = 3$. Bereken $\tan(\alpha + \beta)$ en leid daaruit $\alpha + \beta$ af.
  antwoord: |-
    $-1$; $\frac{3\pi}{4}$
  uitwerking: |-
    $\tan(\alpha + \beta) = \dfrac{2 + 3}{1 - 2 \cdot 3} = \dfrac{5}{-5} = -1$. Beide hoeken liggen tussen $\frac{\pi}{4}$ en $\frac{\pi}{2}$ (de tangens is groter dan 1), dus $\frac{\pi}{2} < \alpha + \beta < \pi$, en daar is de tangens $-1$ bij $\frac{3\pi}{4}$.

- id: h2-o20
  soort: opdracht
  niveau: 2
  thema: |-
    sinus en cosinus uit de tangens
  opgave: |-
    Stel $t = \tan\alpha$ (met $\cos\alpha \neq 0$).
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\sin 2\alpha = \dfrac{2t}{1 + t^2}$. Tip: $\sin 2\alpha = 2\tan\alpha\cos^2\alpha$ en $1 + \tan^2\alpha = \dfrac{1}{\cos^2\alpha}$.
      antwoord: |-
        bewijs
      uitwerking: |-
        $\sin 2\alpha = 2\sin\alpha\cos\alpha = 2\dfrac{\sin\alpha}{\cos\alpha}\cos^2\alpha = 2t\cos^2\alpha$, en $\cos^2\alpha = \dfrac{1}{1 + \tan^2\alpha} = \dfrac{1}{1 + t^2}$. Dus $\sin 2\alpha = \dfrac{2t}{1 + t^2}$.
    - opgave: |-
        Toon aan dat $\cos 2\alpha = \dfrac{1 - t^2}{1 + t^2}$.
      antwoord: |-
        bewijs
      uitwerking: |-
        $\cos 2\alpha = \cos^2\alpha - \sin^2\alpha = \cos^2\alpha(1 - \tan^2\alpha) = \dfrac{1 - t^2}{1 + t^2}$.
    - opgave: |-
        Bereken $\sin 2\alpha$ en $\cos 2\alpha$ voor $\tan\alpha = \frac12$, en controleer met $\tan 2\alpha$ uit opdracht~\ref{oef:h2-o3}.
      antwoord: |-
        $\frac45$; $\frac35$
      uitwerking: |-
        $\sin 2\alpha = \dfrac{1}{1 + \frac14} = \frac45$ en $\cos 2\alpha = \dfrac{\frac34}{\frac54} = \frac35$. Hun quotiënt is $\frac43$, net als $\tan 2\alpha$ in de opdracht met $\tan\alpha = \frac12$ en $\tan 3\alpha$.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    samenvoegen en grootste waarde
  opgave: |-
    Schrijf $f(x) = \sin x - \cos x$ als $R\sin(x + \varphi)$. Wat is de grootste waarde, en voor welke $x$ in $[0, 2\pi]$ wordt ze bereikt?
  antwoord: |-
    $\sqrt2\sin\bigl(x - \frac{\pi}{4}\bigr)$; $\sqrt2$ in $x = \frac{3\pi}{4}$
  uitwerking: |-
    $R = \sqrt{1 + 1} = \sqrt2$, $\cos\varphi = \frac{\sqrt2}{2}$, $\sin\varphi = -\frac{\sqrt2}{2}$: vierde kwadrant, $\varphi = -\frac{\pi}{4}$. Een sinus is hoogstens $1$, dus de grootste waarde is $\sqrt2$, als $x - \frac{\pi}{4} = \frac{\pi}{2}$ (de enige mogelijkheid in $[0, 2\pi]$), dus $x = \frac{3\pi}{4}$.

- id: h2-o8
  soort: opdracht
  niveau: 3
  thema: |-
    de drievoudige hoek
  opgave: |-
    Bewijs dat $\sin 3x = 3\sin x - 4\sin^3 x$. Tip: $3x = 2x + x$.
  antwoord: |-
    bewijs
  uitwerking: |-
    Somformule met $3x = 2x + x$: $\sin 3x = \sin 2x\cos x + \cos 2x\sin x$. Gebruik $\sin 2x = 2\sin x\cos x$ en, om alleen $\sin x$ over te houden, $\cos 2x = 1 - 2\sin^2 x$: $\sin 3x = 2\sin x\cos^2 x + (1 - 2\sin^2 x)\sin x$. Met $\cos^2 x = 1 - \sin^2 x$: $\sin 3x = 2\sin x - 2\sin^3 x + \sin x - 2\sin^3 x = 3\sin x - 4\sin^3 x$.

- id: h2-o24
  soort: opdracht
  niveau: 3
  thema: |-
    een product van cosinussen
  opgave: |-
    Een product van cosinussen bij steeds verdubbelende hoeken kun je exact berekenen.
  lijst: enumerate
  delen:
    - opgave: |-
        Vermenigvuldig $P = \cos\frac{\pi}{5}\cos\frac{2\pi}{5}$ met $\sin\frac{\pi}{5}$, en toon aan dat $\sin\frac{\pi}{5} \cdot P = \frac14\sin\frac{4\pi}{5}$.
      antwoord: |-
        bewijs
      uitwerking: |-
        $\sin\frac{\pi}{5}\cos\frac{\pi}{5} = \frac12\sin\frac{2\pi}{5}$, dus $\sin\frac{\pi}{5} \cdot P = \frac12\sin\frac{2\pi}{5}\cos\frac{2\pi}{5} = \frac12 \cdot \frac12\sin\frac{4\pi}{5} = \frac14\sin\frac{4\pi}{5}$.
    - opgave: |-
        Leid af dat $\cos\frac{\pi}{5}\cos\frac{2\pi}{5} = \frac14$.
      antwoord: |-
        $\frac14$
      uitwerking: |-
        Supplementaire hoeken: $\sin\frac{4\pi}{5} = \sin\bigl(\pi - \frac{\pi}{5}\bigr) = \sin\frac{\pi}{5}$. Dus $\sin\frac{\pi}{5} \cdot P = \frac14\sin\frac{\pi}{5}$, en omdat $\sin\frac{\pi}{5} \neq 0$ is $P = \frac14$.
    - opgave: |-
        Bereken op dezelfde manier $\cos\frac{\pi}{7}\cos\frac{2\pi}{7}\cos\frac{4\pi}{7}$.
      antwoord: |-
        $-\frac18$
      uitwerking: |-
        Noem het product $Q$. Drie keer verdubbelen: $\sin\frac{\pi}{7} \cdot Q = \frac12\sin\frac{2\pi}{7}\cos\frac{2\pi}{7}\cos\frac{4\pi}{7} = \frac14\sin\frac{4\pi}{7}\cos\frac{4\pi}{7} = \frac18\sin\frac{8\pi}{7}$. Antisupplementair: $\sin\frac{8\pi}{7} = \sin\bigl(\pi + \frac{\pi}{7}\bigr) = -\sin\frac{\pi}{7}$. Dus $Q = -\frac18$. Het teken klopt: $\cos\frac{4\pi}{7} < 0$, de andere twee factoren zijn positief.

- id: h2-o27
  soort: opdracht
  niveau: 3
  thema: |-
    grootste waarde met drie formules
  opgave: |-
    Gegeven: $f(x) = \sin x\cos x + \cos^2 x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $f(x)$ in de vorm $p + q\sin(2x + \varphi)$. Tip: werk eerst het product en het kwadraat weg.
      antwoord: |-
        $f(x) = \frac12 + \frac{\sqrt2}{2}\sin\bigl(2x + \frac{\pi}{4}\bigr)$
      uitwerking: |-
        Verdubbeling en Carnot: $f(x) = \frac12\sin 2x + \frac{1 + \cos 2x}{2} = \frac12 + \frac12(\sin 2x + \cos 2x)$. Samenvoegen met $a = b = 1$: $\sin 2x + \cos 2x = \sqrt2\sin\bigl(2x + \frac{\pi}{4}\bigr)$. Dus $f(x) = \frac12 + \frac{\sqrt2}{2}\sin\bigl(2x + \frac{\pi}{4}\bigr)$.
    - opgave: |-
        Bepaal de grootste en de kleinste waarde van $f$, en waar ze bereikt worden in $[0, \pi]$.
      antwoord: |-
        max $\frac{1 + \sqrt2}{2}$ in $\frac{\pi}{8}$; min $\frac{1 - \sqrt2}{2}$ in $\frac{5\pi}{8}$
      uitwerking: |-
        De sinus ligt tussen $-1$ en $1$. Grootste waarde $\frac12 + \frac{\sqrt2}{2} = \frac{1 + \sqrt2}{2}$, als $2x + \frac{\pi}{4} = \frac{\pi}{2}$, dus $x = \frac{\pi}{8}$. Kleinste waarde $\frac{1 - \sqrt2}{2}$, als $2x + \frac{\pi}{4} = \frac{3\pi}{2}$, dus $x = \frac{5\pi}{8}$. Voor $x \in [0, \pi]$ loopt $2x + \frac{\pi}{4}$ van $\frac{\pi}{4}$ tot $\frac{9\pi}{4}$, dus er zijn geen andere oplossingen.

- id: h2-o9
  soort: opdracht
  niveau: 3
  thema: |-
    een schilderij bekijken
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.6,font=\scriptsize]
        \draw[thick] (0,-.4) -- (0,4);
        \fill[accent!25] (-.15,1.5) rectangle (0,3.5);
        \draw[accent] (-.15,1.5) rectangle (0,3.5);
        \fill (4,0) circle (.08) node[below] {oog};
        \draw[grijs,dashed] (4,0) -- (0,0);
        \draw[accent] (4,0) -- (0,1.5) (4,0) -- (0,3.5);
        \node[below] at (2,0) {$x$};
        \node[left] at (-.15,.75) {$1$};
        \node[left] at (-.15,2.5) {$2$};
        \draw[|-|,grijs] (-.6,0) -- (-.6,1.5);
        \draw[|-|,grijs] (-.6,1.5) -- (-.6,3.5);
      \end{tikzpicture}
  opgave: |-
    Een schilderij van 2 m hoog hangt met de onderrand 1 m boven je ooghoogte. Je staat op $x$ m van de muur. De kijkhoek is $\theta = \beta - \alpha$, met $\tan\beta = \frac{3}{x}$ en $\tan\alpha = \frac{1}{x}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\tan\theta = \dfrac{2x}{x^2 + 3}$.
      antwoord: |-
        bewijs
      uitwerking: |-
        $\tan(\beta - \alpha) = \dfrac{\frac3x - \frac1x}{1 + \frac{3}{x^2}} = \dfrac{\frac2x}{\frac{x^2 + 3}{x^2}} = \dfrac{2x}{x^2 + 3}$.
    - opgave: |-
        Bereken $\theta$ voor $x = 1$, $x = \sqrt3$ en $x = 3$.
      antwoord: |-
        $\approx 0{,}464$; $\frac{\pi}{6} \approx 0{,}524$; $\approx 0{,}464$
      uitwerking: |-
        $\tan\theta = \frac12$, $\frac{2\sqrt3}{6} = \frac{\sqrt3}{3}$ en $\frac12$: $\theta \approx 0{,}464$ rad, $\frac{\pi}{6} \approx 0{,}524$ rad en $0{,}464$ rad.
    - opgave: |-
        Waar sta je best? Verklaar met de vorm van $\frac{2x}{x^2 + 3}$.
      antwoord: |-
        op $\sqrt3 \approx 1{,}73$ m
      uitwerking: |-
        $\frac{2x}{x^2 + 3} \leqslant \frac{\sqrt3}{3}$, want $\sqrt3 x^2 - 6x + 3\sqrt3 = \sqrt3(x - \sqrt3)^2 \geqslant 0$. Gelijkheid alleen voor $x = \sqrt3$. Hoe groter $\tan\theta$, hoe groter de scherpe hoek $\theta$: de kijkhoek is het grootst op $\sqrt3 \approx 1{,}73$ m.

- id: h2-o26
  soort: opdracht
  niveau: 3
  thema: |-
    tangensen in een driehoek
  opgave: |-
    De hoeken $\alpha$, $\beta$ en $\gamma$ van een driehoek zijn geen rechte hoeken.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat $\tan\alpha + \tan\beta + \tan\gamma = \tan\alpha\tan\beta\tan\gamma$. Tip: $\gamma = \pi - (\alpha + \beta)$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Uit $\gamma = \pi - (\alpha + \beta)$ volgt $\tan\gamma = -\tan(\alpha + \beta) = -\dfrac{\tan\alpha + \tan\beta}{1 - \tan\alpha\tan\beta}$. (De noemer is niet $0$: dan zou $\alpha + \beta = \frac{\pi}{2}$ en $\gamma$ recht zijn.) Vermenigvuldig met de noemer: $\tan\gamma - \tan\alpha\tan\beta\tan\gamma = -\tan\alpha - \tan\beta$, dus $\tan\alpha + \tan\beta + \tan\gamma = \tan\alpha\tan\beta\tan\gamma$.
    - opgave: |-
        Controleer met een gelijkzijdige driehoek, en met de driehoek met hoeken $\frac{\pi}{4}$, $\frac{\pi}{3}$ en $\frac{5\pi}{12}$.
      antwoord: |-
        $3\sqrt3$; $3 + 2\sqrt3$
      uitwerking: |-
        Gelijkzijdig: $3\tan\frac{\pi}{3} = 3\sqrt3$ en $(\sqrt3)^3 = 3\sqrt3$. Tweede driehoek, met $\tan\frac{5\pi}{12} = 2 + \sqrt3$: de som is $1 + \sqrt3 + 2 + \sqrt3 = 3 + 2\sqrt3$, het product $1 \cdot \sqrt3 \cdot (2 + \sqrt3) = 2\sqrt3 + 3$.

- id: h2-o25
  soort: opdracht
  niveau: 3
  thema: |-
    de exacte waarde van $\cos\frac{\pi}{5}$
  opgave: |-
    Neem $x = \frac{\pi}{5}$ (dat is $36^\circ$, de tophoek van een punt van een regelmatige vijfpuntige ster).
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\sin 3x = \sin 2x$.
      antwoord: |-
        bewijs
      uitwerking: |-
        $3x = \frac{3\pi}{5} = \pi - \frac{2\pi}{5} = \pi - 2x$, en supplementaire hoeken hebben dezelfde sinus: $\sin 3x = \sin 2x$.
    - opgave: |-
        Gebruik opdracht~\ref{oef:h2-o8} om af te leiden dat $4\cos^2 x - 2\cos x - 1 = 0$.
      antwoord: |-
        bewijs
      uitwerking: |-
        $\sin 3x = 3\sin x - 4\sin^3 x = \sin x(3 - 4\sin^2 x) = \sin x(4\cos^2 x - 1)$, en $\sin 2x = 2\sin x\cos x$. Deel door $\sin x \neq 0$: $4\cos^2 x - 1 = 2\cos x$, dus $4\cos^2 x - 2\cos x - 1 = 0$.
    - opgave: |-
        Bepaal $\cos\frac{\pi}{5}$ exact, en daarmee ook $\cos\frac{2\pi}{5}$.
      antwoord: |-
        $\frac{1 + \sqrt5}{4}$; $\frac{\sqrt5 - 1}{4}$
      uitwerking: |-
        Een vierkantsvergelijking in $c = \cos x$: $c = \dfrac{2 \pm \sqrt{4 + 16}}{8} = \dfrac{1 \pm \sqrt5}{4}$. In het eerste kwadrant is $c > 0$, dus $\cos\frac{\pi}{5} = \frac{1 + \sqrt5}{4} \approx 0{,}809$. Dan is $\cos\frac{2\pi}{5} = 2c^2 - 1 = 2 \cdot \frac{6 + 2\sqrt5}{16} - 1 = \frac{\sqrt5 - 1}{4}$. Controle met de opdracht over het product van cosinussen: $\frac{1 + \sqrt5}{4} \cdot \frac{\sqrt5 - 1}{4} = \frac{5 - 1}{16} = \frac14$.

