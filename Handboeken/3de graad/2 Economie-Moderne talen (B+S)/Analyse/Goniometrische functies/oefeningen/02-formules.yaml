# KOPPEL
#----------------------------------------------------------------------------------------

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Integralen
  thema: |-
    een kwadraat integreren
  opgave: |-
    Bereken $\int_0^{\pi} \sin^2 x\,\mathrm{d}x$ met een formule van Carnot.
  antwoord: |-
    $\frac{\pi}{2}$
  uitwerking: |-
    $\int_0^{\pi} \frac{1 - \cos 2x}{2}\,\mathrm{d}x = \Bigl[\frac{x}{2} - \frac{\sin 2x}{4}\Bigr]_0^{\pi} = \frac{\pi}{2}$.

- id: h2-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: Matrices
  thema: |-
    twee rotaties na elkaar
  opgave: |-
    De rotatiematrix over de hoek $\theta$ is
    \[R_\theta = \begin{pmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{pmatrix}.\]
    Bereken $R_\alpha R_\beta$ en toon aan dat het $R_{\alpha + \beta}$ is.
  antwoord: |-
    bewijs
  uitwerking: |-
    $R_\alpha R_\beta = \begin{pmatrix} \cos\alpha\cos\beta - \sin\alpha\sin\beta & -(\cos\alpha\sin\beta + \sin\alpha\cos\beta) \\ \sin\alpha\cos\beta + \cos\alpha\sin\beta & \cos\alpha\cos\beta - \sin\alpha\sin\beta \end{pmatrix} = R_{\alpha + \beta}$ volgens de somformules.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    exacte waarde
  opgave: |-
    Bepaal exact $\cos\frac{5\pi}{12}$.
  antwoord: |-
    $\frac{\sqrt6 - \sqrt2}{4}$
  uitwerking: |-
    $\frac{5\pi}{12} = \frac{\pi}{4} + \frac{\pi}{6}$, dus $\cos\frac{5\pi}{12} = \cos\frac{\pi}{4}\cos\frac{\pi}{6} - \sin\frac{\pi}{4}\sin\frac{\pi}{6} = \frac{\sqrt2}{2} \cdot \frac{\sqrt3}{2} - \frac{\sqrt2}{2} \cdot \frac12 = \frac{\sqrt6 - \sqrt2}{4}$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    verschilformule
  opgave: |-
    Gegeven: $\sin\alpha = \frac45$ met $\alpha$ in het eerste kwadrant, en $\cos\beta = -\frac{12}{13}$ met $\beta$ in het tweede kwadrant. Bereken $\cos(\alpha - \beta)$.
  antwoord: |-
    $-\frac{16}{65}$
  uitwerking: |-
    Grondformule: $\cos\alpha = \frac35$ (eerste kwadrant) en $\sin\beta = \frac{5}{13}$ (tweede kwadrant). $\cos(\alpha - \beta) = \cos\alpha\cos\beta + \sin\alpha\sin\beta = \frac35 \cdot \bigl(-\frac{12}{13}\bigr) + \frac45 \cdot \frac{5}{13} = \frac{-36 + 20}{65} = -\frac{16}{65}$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    verdubbelen
  opgave: |-
    Gegeven: $\cos\alpha = -\frac35$ en $\pi < \alpha < \frac{3\pi}{2}$. Bereken $\sin 2\alpha$ en $\cos 2\alpha$.
  antwoord: |-
    $\frac{24}{25}$; $-\frac{7}{25}$
  uitwerking: |-
    Derde kwadrant: $\sin\alpha = -\frac45$. $\sin 2\alpha = 2 \cdot \bigl(-\frac45\bigr)\bigl(-\frac35\bigr) = \frac{24}{25}$ en $\cos 2\alpha = \cos^2\alpha - \sin^2\alpha = \frac{9}{25} - \frac{16}{25} = -\frac{7}{25}$.

- id: h2-t6
  soort: test
  niveau: 1
  thema: |-
    Carnot en de dubbele hoek
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin^2\frac{3\pi}{8}$, met een formule van Carnot
      antwoord: |-
        $\frac{2 + \sqrt2}{4}$
      uitwerking: |-
        $\sin^2\frac{3\pi}{8} = \dfrac{1 - \cos\frac{3\pi}{4}}{2} = \dfrac{1 + \frac{\sqrt2}{2}}{2} = \frac{2 + \sqrt2}{4}$.
    - opgave: |-
        $\sin\frac{\pi}{8}\cos\frac{\pi}{8}$
      antwoord: |-
        $\frac{\sqrt2}{4}$
      uitwerking: |-
        $\frac12 \cdot 2\sin\frac{\pi}{8}\cos\frac{\pi}{8} = \frac12\sin\frac{\pi}{4} = \frac{\sqrt2}{4}$.

- id: h2-t4
  soort: test
  niveau: 2
  thema: |-
    identiteit
  opgave: |-
    Bewijs: $\dfrac{\sin 2x}{1 + \cos 2x} = \tan x$.
  antwoord: |-
    bewijs
  uitwerking: |-
    Kies $\cos 2x = 2\cos^2 x - 1$, zodat de 1 wegvalt: $\dfrac{2\sin x\cos x}{1 + 2\cos^2 x - 1} = \dfrac{2\sin x\cos x}{2\cos^2 x} = \dfrac{\sin x}{\cos x} = \tan x$.

- id: h2-t7
  soort: test
  niveau: 2
  thema: |-
    tangens van een som
  opgave: |-
    Twee scherpe hoeken hebben $\tan\alpha = \frac14$ en $\tan\beta = \frac35$. Bereken $\tan(\alpha + \beta)$, en daarmee $\alpha + \beta$.
  antwoord: |-
    $1$; $\frac{\pi}{4}$
  uitwerking: |-
    $\tan(\alpha + \beta) = \dfrac{\frac14 + \frac35}{1 - \frac14 \cdot \frac35} = \dfrac{\frac{17}{20}}{\frac{17}{20}} = 1$. Beide hoeken liggen tussen $0$ en $\frac{\pi}{2}$, dus $0 < \alpha + \beta < \pi$, en daar heeft alleen $\frac{\pi}{4}$ tangens $1$.

- id: h2-t5
  soort: test
  niveau: 2
  thema: |-
    samenvoegen
  opgave: |-
    Schrijf $\sin x + \cos x$ als $R\sin(x + \varphi)$.
  antwoord: |-
    $\sqrt2\sin\bigl(x + \frac{\pi}{4}\bigr)$
  uitwerking: |-
    $R = \sqrt{1 + 1} = \sqrt2$, $\cos\varphi = \sin\varphi = \frac{\sqrt2}{2}$: eerste kwadrant, $\varphi = \frac{\pi}{4}$.
