# Oefeningen van hoofdstuk 4. Zie oefeningenbank.py voor de velden.

- id: h4-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Geef twee hoeken in $[0, 2\pi[$ met sinus $\frac{\sqrt3}{2}$.
      antwoord: |-
        $\frac{\pi}{3}$ en $\frac{2\pi}{3}$
      uitwerking: |-
        $\frac{\pi}{3}$ en $\pi - \frac{\pi}{3} = \frac{2\pi}{3}$.
    - opgave: |-
        Los op: $2t^2 + t - 1 = 0$.
      antwoord: |-
        $t = \frac12$ of $t = -1$
      uitwerking: |-
        $(2t - 1)(t + 1) = 0$.
    - opgave: |-
        Schrijf $\sin 2x$ en $\cos 2x$ met $\sin x$ en $\cos x$.
      antwoord: |-
        $2\sin x\cos x$; $\cos^2 x - \sin^2 x$
      uitwerking: |-
        Verdubbelingsformules.
    - opgave: |-
        Welke getallen $\frac{\pi}{3} + k\pi$ (met $k \in \Z$) liggen in $[0, 2\pi[$?
      antwoord: |-
        $\frac{\pi}{3}$ en $\frac{4\pi}{3}$
      uitwerking: |-
        $k = 0$ en $k = 1$.

- id: h4-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Je rekentoestel staat in radialen.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\sin^{-1}(0{,}6)$ met je rekentoestel. Controleer dat de sinus van het resultaat $0{,}6$ is.
      antwoord: |-
        $\approx 0{,}6435$
      uitwerking: |-
        $\sin^{-1}(0{,}6) \approx 0{,}6435$ en $\sin 0{,}6435 \approx 0{,}6$.
    - opgave: |-
        Bereken $\sin(\pi - 0{,}6435)$. Wat valt op?
      antwoord: |-
        ook $0{,}6$
      uitwerking: |-
        Ook $0{,}6$: de supplementaire hoek heeft dezelfde sinus.
    - opgave: |-
        Hoeveel oplossingen heeft $\sin x = 0{,}6$ in $[0, 4\pi]$? Geef ze.
      antwoord: |-
        4
      uitwerking: |-
        $0{,}6435$; $2{,}4981$; $0{,}6435 + 2\pi \approx 6{,}9267$; $2{,}4981 + 2\pi \approx 8{,}7813$.

#----------------------------------------------------------------------------------------
# KORTE OEFENINGEN IN DE LEERSTOF
#----------------------------------------------------------------------------------------

- id: h4-bg
  soort: kort
  opgave: |-
    Bepaal exact.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\bgsin\frac{\sqrt3}{2}$
      antwoord: |-
        $\frac{\pi}{3}$
      uitwerking: |-
        $\sin\frac{\pi}{3} = \frac{\sqrt3}{2}$ en $\frac{\pi}{3} \in \bigl[-\frac{\pi}{2}, \frac{\pi}{2}\bigr]$, dus $\bgsin\frac{\sqrt3}{2} = \frac{\pi}{3}$.
    - opgave: |-
        $\bgcos 0$
      antwoord: |-
        $\frac{\pi}{2}$
      uitwerking: |-
        $\cos\frac{\pi}{2} = 0$ en $\frac{\pi}{2} \in [0, \pi]$, dus $\bgcos 0 = \frac{\pi}{2}$.
    - opgave: |-
        $\bgtan(-1)$
      antwoord: |-
        $-\frac{\pi}{4}$
      uitwerking: |-
        $\tan\bigl(-\frac{\pi}{4}\bigr) = -\tan\frac{\pi}{4} = -1$ en $-\frac{\pi}{4} \in \bigl]-\frac{\pi}{2}, \frac{\pi}{2}\bigr[$, dus $\bgtan(-1) = -\frac{\pi}{4}$.
    - opgave: |-
        $\bgcos\bigl(-\frac{\sqrt3}{2}\bigr)$
      antwoord: |-
        $\frac{5\pi}{6}$
      uitwerking: |-
        In $[0, \pi]$ is de cosinus negatief in het tweede kwadrant: $\cos\bigl(\pi - \frac{\pi}{6}\bigr) = -\cos\frac{\pi}{6} = -\frac{\sqrt3}{2}$. Dus $\bgcos\bigl(-\frac{\sqrt3}{2}\bigr) = \frac{5\pi}{6}$.
    - opgave: |-
        $\bgsin 1$
      antwoord: |-
        $\frac{\pi}{2}$
      uitwerking: |-
        $\sin\frac{\pi}{2} = 1$ en $\frac{\pi}{2}$ ligt (net) in $\bigl[-\frac{\pi}{2}, \frac{\pi}{2}\bigr]$, dus $\bgsin 1 = \frac{\pi}{2}$.
    - opgave: |-
        $\bgtan\bigl(-\frac{\sqrt3}{3}\bigr)$
      antwoord: |-
        $-\frac{\pi}{6}$
      uitwerking: |-
        $\tan\frac{\pi}{6} = \frac{\sqrt3}{3}$, en de tangens is oneven: $\tan\bigl(-\frac{\pi}{6}\bigr) = -\frac{\sqrt3}{3}$. Dus $\bgtan\bigl(-\frac{\sqrt3}{3}\bigr) = -\frac{\pi}{6}$.

- id: h4-sin
  soort: kort
  opgave: |-
    Geef de algemene oplossing, en de oplossingen in $[0, 2\pi[$. Rond zo nodig af op vier decimalen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin x = -\frac{\sqrt2}{2}$
      antwoord: |-
        $-\frac{\pi}{4} + k \cdot 2\pi$ of $\frac{5\pi}{4} + k \cdot 2\pi$; $\frac{5\pi}{4}$, $\frac{7\pi}{4}$
      uitwerking: |-
        $\bgsin\bigl(-\frac{\sqrt2}{2}\bigr) = -\frac{\pi}{4}$, en $\pi - \bigl(-\frac{\pi}{4}\bigr) = \frac{5\pi}{4}$. Dus $x = -\frac{\pi}{4} + k \cdot 2\pi$ of $x = \frac{5\pi}{4} + k \cdot 2\pi$. In $[0, 2\pi[$: $\frac{5\pi}{4}$ ($k = 0$) en $-\frac{\pi}{4} + 2\pi = \frac{7\pi}{4}$ ($k = 1$).
    - opgave: |-
        $\sin x = 1$
      antwoord: |-
        $\frac{\pi}{2} + k \cdot 2\pi$; $\frac{\pi}{2}$
      uitwerking: |-
        $\bgsin 1 = \frac{\pi}{2}$ en $\pi - \frac{\pi}{2} = \frac{\pi}{2}$: beide reeksen vallen samen. Dus $x = \frac{\pi}{2} + k \cdot 2\pi$, en in $[0, 2\pi[$ alleen $\frac{\pi}{2}$. Op de eenheidscirkel raakt de rechte $y = 1$ de cirkel in één punt.
    - opgave: |-
        $\sin x = 0{,}4$
      antwoord: |-
        $0{,}4115 + k \cdot 2\pi$ of $2{,}7301 + k \cdot 2\pi$; $0{,}4115$, $2{,}7301$
      uitwerking: |-
        $\bgsin 0{,}4 \approx 0{,}4115$ en $\pi - 0{,}4115 \approx 2{,}7301$. Dus $x \approx 0{,}4115 + k \cdot 2\pi$ of $x \approx 2{,}7301 + k \cdot 2\pi$. In $[0, 2\pi[$: $0{,}4115$ en $2{,}7301$.

- id: h4-elementair
  soort: kort
  opgave: |-
    Los op in $[0, 2\pi[$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\cos x = \frac{\sqrt2}{2}$
      antwoord: |-
        $\frac{\pi}{4}$, $\frac{7\pi}{4}$
      uitwerking: |-
        $\bgcos\frac{\sqrt2}{2} = \frac{\pi}{4}$, dus $x = \pm\frac{\pi}{4} + k \cdot 2\pi$. In $[0, 2\pi[$: $\frac{\pi}{4}$ en $-\frac{\pi}{4} + 2\pi = \frac{7\pi}{4}$.
    - opgave: |-
        $\tan x = \sqrt3$
      antwoord: |-
        $\frac{\pi}{3}$, $\frac{4\pi}{3}$
      uitwerking: |-
        $\bgtan\sqrt3 = \frac{\pi}{3}$, dus $x = \frac{\pi}{3} + k\pi$. In $[0, 2\pi[$: $\frac{\pi}{3}$ en $\frac{\pi}{3} + \pi = \frac{4\pi}{3}$.
    - opgave: |-
        $\sin 2x = 0$
      antwoord: |-
        $0$, $\frac{\pi}{2}$, $\pi$, $\frac{3\pi}{2}$
      uitwerking: |-
        $2x = 0 + k \cdot 2\pi$ of $2x = \pi + k \cdot 2\pi$, samen $2x = k\pi$. Dus $x = k\frac{\pi}{2}$: in $[0, 2\pi[$ zijn dat $0$, $\frac{\pi}{2}$, $\pi$ en $\frac{3\pi}{2}$.

- id: h4-veelvoud
  soort: kort
  opgave: |-
    Los op in $[0, 2\pi[$. Deel ook de periode.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin 3x = \frac{\sqrt2}{2}$
      antwoord: |-
        $\frac{\pi}{12}$, $\frac{\pi}{4}$, $\frac{3\pi}{4}$, $\frac{11\pi}{12}$, $\frac{17\pi}{12}$, $\frac{19\pi}{12}$
      uitwerking: |-
        $3x = \frac{\pi}{4} + k \cdot 2\pi$ of $3x = \frac{3\pi}{4} + k \cdot 2\pi$, dus $x = \frac{\pi}{12} + k\frac{2\pi}{3}$ of $x = \frac{\pi}{4} + k\frac{2\pi}{3}$. Met $k = 0, 1, 2$: $\frac{\pi}{12}$, $\frac{3\pi}{4}$, $\frac{17\pi}{12}$ en $\frac{\pi}{4}$, $\frac{11\pi}{12}$, $\frac{19\pi}{12}$. De periode is $\frac{2\pi}{3}$: drie keer zoveel oplossingen als bij $\sin x = \frac{\sqrt2}{2}$.
    - opgave: |-
        $\cos\frac{x}{2} = \frac12$
      antwoord: |-
        $\frac{2\pi}{3}$
      uitwerking: |-
        $\frac{x}{2} = \pm\frac{\pi}{3} + k \cdot 2\pi$, dus $x = \pm\frac{2\pi}{3} + k \cdot 4\pi$. In $[0, 2\pi[$ ligt alleen $\frac{2\pi}{3}$: $-\frac{2\pi}{3} + 4\pi = \frac{10\pi}{3}$ is te groot. De periode is $4\pi$, dus er zijn minder oplossingen.
    - opgave: |-
        $\tan\bigl(x - \frac{\pi}{6}\bigr) = -1$
      antwoord: |-
        $\frac{11\pi}{12}$, $\frac{23\pi}{12}$
      uitwerking: |-
        $x - \frac{\pi}{6} = -\frac{\pi}{4} + k\pi$, dus $x = -\frac{\pi}{12} + k\pi$. In $[0, 2\pi[$: $k = 1$ en $k = 2$ geven $\frac{11\pi}{12}$ en $\frac{23\pi}{12}$.

- id: h4-kwadr
  soort: kort
  opgave: |-
    Los op (algemene oplossing).
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2\sin^2 x + 3\sin x - 2 = 0$
      antwoord: |-
        $\frac{\pi}{6} + k \cdot 2\pi$ of $\frac{5\pi}{6} + k \cdot 2\pi$
      uitwerking: |-
        Stel $t = \sin x$: $2t^2 + 3t - 2 = 0$, met discriminant $25$, dus $t = \frac12$ of $t = -2$. Want $\sin x = -2$ kan niet, blijft $\sin x = \frac12$: $x = \frac{\pi}{6} + k \cdot 2\pi$ of $x = \frac{5\pi}{6} + k \cdot 2\pi$.
    - opgave: |-
        $\cos^2 x + \sin x + 1 = 0$
      antwoord: |-
        $-\frac{\pi}{2} + k \cdot 2\pi$
      uitwerking: |-
        Schrijf $\cos^2 x = 1 - \sin^2 x$, zodat er alleen $\sin x$ staat: $-\sin^2 x + \sin x + 2 = 0$, of $t^2 - t - 2 = 0$ met $t = \sin x$. Dus $t = 2$ (kan niet) of $t = -1$. Uit $\sin x = -1$ volgt $x = -\frac{\pi}{2} + k \cdot 2\pi$.
    - opgave: |-
        $\tan^2 x - 2\tan x - 3 = 0$
      antwoord: |-
        $-\frac{\pi}{4} + k\pi$ of $\approx 1{,}2490 + k\pi$
      uitwerking: |-
        Stel $t = \tan x$: $t^2 - 2t - 3 = (t - 3)(t + 1) = 0$, dus $t = 3$ of $t = -1$. $\tan x = -1$ geeft $x = -\frac{\pi}{4} + k\pi$, en $\tan x = 3$ geeft $x = \bgtan 3 + k\pi \approx 1{,}2490 + k\pi$.

- id: h4-ontbind
  soort: kort
  opgave: |-
    Los op (algemene oplossing). Breng alles naar één lid en ontbind.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\tan x \sin x = \sin x$
      antwoord: |-
        $k\pi$ of $\frac{\pi}{4} + k\pi$
      uitwerking: |-
        Voorwaarde: $\cos x \neq 0$, anders bestaat $\tan x$ niet. $\sin x\,(\tan x - 1) = 0$, dus $\sin x = 0$ of $\tan x = 1$. Dat geeft $x = k\pi$ (daar is $\cos x = \pm1$, dus in orde) of $x = \frac{\pi}{4} + k\pi$.
    - opgave: |-
        $\sin 2x = \sqrt3\sin x$
      antwoord: |-
        $k\pi$ of $\pm\frac{\pi}{6} + k \cdot 2\pi$
      uitwerking: |-
        $2\sin x\cos x - \sqrt3\sin x = \sin x\,(2\cos x - \sqrt3) = 0$. Dus $\sin x = 0$, met $x = k\pi$, of $\cos x = \frac{\sqrt3}{2}$, met $x = \pm\frac{\pi}{6} + k \cdot 2\pi$.
    - opgave: |-
        $\sin x\cos x + \cos x = 0$
      antwoord: |-
        $\frac{\pi}{2} + k\pi$
      uitwerking: |-
        $\cos x\,(\sin x + 1) = 0$. $\cos x = 0$ geeft $x = \frac{\pi}{2} + k\pi$. $\sin x = -1$ geeft $x = -\frac{\pi}{2} + k \cdot 2\pi$, maar die getallen zitten al in de eerste reeks. Samen: $x = \frac{\pi}{2} + k\pi$.

- id: h4-herleidbaar
  soort: kort
  opgave: |-
    Los op (algemene oplossing).
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2\cos^2 x + 3\cos x + 1 = 0$
      antwoord: |-
        $\pm\frac{2\pi}{3} + k \cdot 2\pi$ of $\pi + k \cdot 2\pi$
      uitwerking: |-
        $t = \cos x$: $2t^2 + 3t + 1 = 0$, $t = -\frac12$ of $t = -1$. Dus $x = \pm\frac{2\pi}{3} + k \cdot 2\pi$ of $x = \pi + k \cdot 2\pi$.
    - opgave: |-
        $\sin x = \cos x$
      antwoord: |-
        $\frac{\pi}{4} + k\pi$
      uitwerking: |-
        $\cos x = 0$ is geen oplossing (dan is $\sin x = \pm 1$). Delen door $\cos x$: $\tan x = 1$, dus $x = \frac{\pi}{4} + k\pi$.

- id: h4-samen
  soort: kort
  opgave: |-
    Voeg het linkerlid samen tot één sinus, en los op (algemene oplossing).
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin x - \cos x = 1$
      antwoord: |-
        $\frac{\pi}{2} + k \cdot 2\pi$ of $\pi + k \cdot 2\pi$
      uitwerking: |-
        $R = \sqrt{1 + 1} = \sqrt2$, $\cos\varphi = \frac{1}{\sqrt2}$ en $\sin\varphi = -\frac{1}{\sqrt2}$, dus $\varphi = -\frac{\pi}{4}$. Dan $\sqrt2\sin\bigl(x - \frac{\pi}{4}\bigr) = 1$, of $\sin\bigl(x - \frac{\pi}{4}\bigr) = \frac{\sqrt2}{2}$. Dus $x - \frac{\pi}{4} = \frac{\pi}{4} + k \cdot 2\pi$ of $\frac{3\pi}{4} + k \cdot 2\pi$, en $x = \frac{\pi}{2} + k \cdot 2\pi$ of $x = \pi + k \cdot 2\pi$. Controle: $\sin\pi - \cos\pi = 0 + 1 = 1$.
    - opgave: |-
        $\cos x - \sqrt3\sin x = -1$
      antwoord: |-
        $\frac{\pi}{3} + k \cdot 2\pi$ of $\pi + k \cdot 2\pi$
      uitwerking: |-
        $-\sqrt3\sin x + \cos x$: $R = 2$, $\cos\varphi = -\frac{\sqrt3}{2}$ en $\sin\varphi = \frac12$, dus $\varphi = \frac{5\pi}{6}$. Dan $\sin\bigl(x + \frac{5\pi}{6}\bigr) = -\frac12$, dus $x + \frac{5\pi}{6} = -\frac{\pi}{6} + k \cdot 2\pi$ of $\frac{7\pi}{6} + k \cdot 2\pi$. Daaruit $x = -\pi + k \cdot 2\pi$, wat hetzelfde is als $\pi + k \cdot 2\pi$, of $x = \frac{\pi}{3} + k \cdot 2\pi$. Controle: $\cos\frac{\pi}{3} - \sqrt3\sin\frac{\pi}{3} = \frac12 - \frac32 = -1$.

- id: h4-context
  soort: kort
  opgave: |-
    De hoogte van een gondel is $h(t) = 3\sin\frac{\pi t}{6} + 10$ (in m, $t$ in minuten). Wanneer is de gondel in de eerste 12 minuten hoger dan $11{,}5$ m?
  antwoord: |-
    tussen 1 en 5 minuten
  uitwerking: |-
    $3\sin\frac{\pi t}{6} + 10 > 11{,}5 \iff \sin\frac{\pi t}{6} > \frac12$. Gelijkheid: $\frac{\pi t}{6} = \frac{\pi}{6}$ of $\frac{5\pi}{6}$ (met $0 \leqslant \frac{\pi t}{6} \leqslant 2\pi$), dus $t = 1$ of $t = 5$. Daartussen ligt de top ($t = 3$): hoger dan $11{,}5$ m voor $1 < t < 5$.

- id: h4-schommel
  soort: kort
  opgave: |-
    De horizontale uitwijking van een schommel is $s(t) = 80\sin\frac{2\pi t}{3}$ (in cm, $t$ in seconden, positief naar voren).
  lijst: enumerate
  delen:
    - opgave: |-
        Wanneer in de eerste 3 seconden is de uitwijking $40$ cm?
      antwoord: |-
        na $0{,}25$ s en na $1{,}25$ s
      uitwerking: |-
        $80\sin\frac{2\pi t}{3} = 40 \iff \sin\frac{2\pi t}{3} = \frac12$. Met $0 \leqslant \frac{2\pi t}{3} < 2\pi$: $\frac{2\pi t}{3} = \frac{\pi}{6}$ of $\frac{5\pi}{6}$. Vermenigvuldig met $\frac{3}{2\pi}$: $t = \frac14$ of $t = \frac54$.
    - opgave: |-
        Hoe lang is de uitwijking per schommelbeweging meer dan $40$ cm?
      antwoord: |-
        1 s
      uitwerking: |-
        Tussen $t = \frac14$ en $t = \frac54$ ligt de top ($t = \frac34$, $s = 80$): de uitwijking is daar meer dan 40 cm. Dat duurt $\frac54 - \frac14 = 1$ s van de periode van 3 s.
    - opgave: |-
        Wanneer in de eerste 3 seconden is de schommel minstens $40$ cm naar achteren?
      antwoord: |-
        van $1{,}75$ s tot $2{,}75$ s
      uitwerking: |-
        $s(t) \leqslant -40 \iff \sin\frac{2\pi t}{3} \leqslant -\frac12$. Gelijkheid: $\frac{2\pi t}{3} = \frac{7\pi}{6}$ of $\frac{11\pi}{6}$, dus $t = \frac74$ of $t = \frac{11}{4}$. Daartussen ligt het dal ($t = \frac94$): $t \in \bigl[\frac74, \frac{11}{4}\bigr]$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3 (in de volgorde van het boek)
#----------------------------------------------------------------------------------------

- id: h4-bgsin-k
  soort: kort
  opgave: |-
    Boogsinus.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal exact $\bgsin\frac{\sqrt2}{2}$ en $\bgsin(-1)$.
      antwoord: |-
        $\frac{\pi}{4}$; $-\frac{\pi}{2}$
      uitwerking: |-
        $\sin\frac{\pi}{4} = \frac{\sqrt2}{2}$ en $\sin\bigl(-\frac{\pi}{2}\bigr) = -1$, en beide hoeken liggen in $\bigl[-\frac{\pi}{2}, \frac{\pi}{2}\bigr]$.
    - opgave: |-
        Bepaal $\bgsin(-0{,}3)$ op vier decimalen.
      antwoord: |-
        $\approx -0{,}3047$
      uitwerking: |-
        Rekentoestel in radialen: $\sin^{-1}(-0{,}3) \approx -0{,}3047$. Die hoek ligt in $\bigl[-\frac{\pi}{2}, \frac{\pi}{2}\bigr]$, in het vierde kwadrant.
    - opgave: |-
        Iemand beweert: $\bgsin\bigl(-\frac12\bigr) = \frac{7\pi}{6}$, want $\sin\frac{7\pi}{6} = -\frac12$. Wat is er fout?
      antwoord: |-
        $\frac{7\pi}{6}$ ligt niet in het bereik; $\bgsin\bigl(-\frac12\bigr) = -\frac{\pi}{6}$
      uitwerking: |-
        Het klopt dat $\sin\frac{7\pi}{6} = -\frac12$, maar $\frac{7\pi}{6}$ ligt niet in $\bigl[-\frac{\pi}{2}, \frac{\pi}{2}\bigr]$. De hoek in dat interval met sinus $-\frac12$ is $-\frac{\pi}{6}$.

- id: h4-bgcos-k
  soort: kort
  opgave: |-
    Boogcosinus.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal exact $\bgcos\frac12$ en $\bgcos(-1)$.
      antwoord: |-
        $\frac{\pi}{3}$; $\pi$
      uitwerking: |-
        $\cos\frac{\pi}{3} = \frac12$ en $\cos\pi = -1$, en beide hoeken liggen in $[0, \pi]$.
    - opgave: |-
        Bepaal $\bgcos(-0{,}4)$ op vier decimalen. In welk kwadrant ligt de hoek?
      antwoord: |-
        $\approx 1{,}9823$; het tweede
      uitwerking: |-
        Rekentoestel in radialen: $\cos^{-1}(-0{,}4) \approx 1{,}9823$. Dat ligt tussen $\frac{\pi}{2} \approx 1{,}5708$ en $\pi$: het tweede kwadrant.
    - opgave: |-
        Leg uit waarom $\bgcos(-a) = \pi - \bgcos a$ voor elke $a \in [-1, 1]$.
      antwoord: |-
        uitleg
      uitwerking: |-
        Stel $\theta = \bgcos a$, dus $\cos\theta = a$ en $0 \leqslant \theta \leqslant \pi$. Dan is $\cos(\pi - \theta) = -\cos\theta = -a$ (supplementaire hoeken), en ook $\pi - \theta$ ligt in $[0, \pi]$. Dus is $\pi - \theta$ de boogcosinus van $-a$.

- id: h4-cos-k
  soort: kort
  opgave: |-
    Los op.
  lijst: enumerate
  delen:
    - opgave: |-
        $\cos x = -\frac{\sqrt3}{2}$ (algemene oplossing)
      antwoord: |-
        $x = \pm\frac{5\pi}{6} + k \cdot 2\pi$
      uitwerking: |-
        $\bgcos\bigl(-\frac{\sqrt3}{2}\bigr) = \pi - \frac{\pi}{6} = \frac{5\pi}{6}$, dus $x = \frac{5\pi}{6} + k \cdot 2\pi$ of $x = -\frac{5\pi}{6} + k \cdot 2\pi$ ($k \in \Z$).
    - opgave: |-
        $\cos x = -0{,}3$ in $[0, 2\pi[$, op vier decimalen
      antwoord: |-
        $x \approx 1{,}8755$ of $x \approx 4{,}4077$
      uitwerking: |-
        $\bgcos(-0{,}3) \approx 1{,}8755$, dus $x \approx \pm 1{,}8755 + k \cdot 2\pi$. In $[0, 2\pi[$: $1{,}8755$ (met $k = 0$) en $-1{,}8755 + 2\pi \approx 4{,}4077$ (met $k = 1$).
    - opgave: |-
        $\cos x = -1$ (algemene oplossing)
      antwoord: |-
        $x = \pi + k \cdot 2\pi$
      uitwerking: |-
        $\bgcos(-1) = \pi$. De twee reeksen $\pi + k \cdot 2\pi$ en $-\pi + k \cdot 2\pi$ zijn dezelfde, want $-\pi$ en $\pi$ horen bij hetzelfde punt $(-1, 0)$: $x = \pi + k \cdot 2\pi$.

- id: h4-tan-k
  soort: kort
  opgave: |-
    Los op.
  lijst: enumerate
  delen:
    - opgave: |-
        $\tan x = \frac{\sqrt3}{3}$ (algemene oplossing)
      antwoord: |-
        $x = \frac{\pi}{6} + k\pi$
      uitwerking: |-
        $\bgtan\frac{\sqrt3}{3} = \frac{\pi}{6}$, dus $x = \frac{\pi}{6} + k\pi$ ($k \in \Z$).
    - opgave: |-
        $\tan x = 4$ in $[0, 2\pi[$, op vier decimalen
      antwoord: |-
        $x \approx 1{,}3258$ of $x \approx 4{,}4674$
      uitwerking: |-
        $\bgtan 4 \approx 1{,}3258$, dus $x \approx 1{,}3258 + k\pi$. In $[0, 2\pi[$: $k = 0$ en $k = 1$, dus $1{,}3258$ en $1{,}3258 + \pi \approx 4{,}4674$.
    - opgave: |-
        $\tan x = -2$ (algemene oplossing, op vier decimalen)
      antwoord: |-
        $x \approx -1{,}1071 + k\pi$
      uitwerking: |-
        $\bgtan(-2) \approx -1{,}1071$, dus $x \approx -1{,}1071 + k\pi$ ($k \in \Z$).

- id: h4-o1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: algemene oplossing
  opgave: |-
    Geef de algemene oplossing ($k \in \Z$).
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin 3x = 0$
      antwoord: |-
        $x = k\frac{\pi}{3}$
      uitwerking: |-
        $3x = k\pi$ (de twee reeksen $0 + k \cdot 2\pi$ en $\pi + k \cdot 2\pi$ samen), dus $x = k\frac{\pi}{3}$.
    - opgave: |-
        $\cos\bigl(x - \frac{\pi}{4}\bigr) = 1$
      antwoord: |-
        $x = \frac{\pi}{4} + k \cdot 2\pi$
      uitwerking: |-
        $\bgcos 1 = 0$, dus $x - \frac{\pi}{4} = k \cdot 2\pi$ en $x = \frac{\pi}{4} + k \cdot 2\pi$.
    - opgave: |-
        $\tan 2x = 1$
      antwoord: |-
        $x = \frac{\pi}{8} + k\frac{\pi}{2}$
      uitwerking: |-
        $2x = \frac{\pi}{4} + k\pi$, en delen door 2, ook de periode: $x = \frac{\pi}{8} + k\frac{\pi}{2}$.
    - opgave: |-
        $\cos x = -1$
      antwoord: |-
        $x = \pi + k \cdot 2\pi$
      uitwerking: |-
        $\bgcos(-1) = \pi$, en $\pm\pi$ geven hetzelfde punt: $x = \pi + k \cdot 2\pi$.
    - opgave: |-
        $\sin x = -\frac{\sqrt3}{2}$
      antwoord: |-
        $x = -\frac{\pi}{3} + k \cdot 2\pi$ of $x = \frac{4\pi}{3} + k \cdot 2\pi$
      uitwerking: |-
        $\bgsin\bigl(-\frac{\sqrt3}{2}\bigr) = -\frac{\pi}{3}$ en $\pi + \frac{\pi}{3} = \frac{4\pi}{3}$.
    - opgave: |-
        $\tan x = -\sqrt3$
      antwoord: |-
        $x = -\frac{\pi}{3} + k\pi$
      uitwerking: |-
        $\bgtan(-\sqrt3) = -\frac{\pi}{3}$, met periode $\pi$.
    - opgave: |-
        $\cos 2x = 0$
      antwoord: |-
        $x = \frac{\pi}{4} + k\frac{\pi}{2}$
      uitwerking: |-
        $2x = \pm\frac{\pi}{2} + k \cdot 2\pi$, samen $2x = \frac{\pi}{2} + k\pi$. Dus $x = \frac{\pi}{4} + k\frac{\pi}{2}$.
    - opgave: |-
        $\sin\bigl(x + \frac{\pi}{3}\bigr) = 0$
      antwoord: |-
        $x = -\frac{\pi}{3} + k\pi$
      uitwerking: |-
        $x + \frac{\pi}{3} = k\pi$, dus $x = -\frac{\pi}{3} + k\pi$.
    - opgave: |-
        $\cos\frac{x}{3} = \frac{\sqrt3}{2}$
      antwoord: |-
        $x = \pm\frac{\pi}{2} + k \cdot 6\pi$
      uitwerking: |-
        $\frac{x}{3} = \pm\frac{\pi}{6} + k \cdot 2\pi$. Vermenigvuldig met 3, ook de periode: $x = \pm\frac{\pi}{2} + k \cdot 6\pi$.
    - opgave: |-
        $\tan\frac{x}{2} = \frac{\sqrt3}{3}$
      antwoord: |-
        $x = \frac{\pi}{3} + k \cdot 2\pi$
      uitwerking: |-
        $\frac{x}{2} = \frac{\pi}{6} + k\pi$, dus $x = \frac{\pi}{3} + k \cdot 2\pi$.
    - opgave: |-
        $\sin 4x = 1$
      antwoord: |-
        $x = \frac{\pi}{8} + k\frac{\pi}{2}$
      uitwerking: |-
        $4x = \frac{\pi}{2} + k \cdot 2\pi$, dus $x = \frac{\pi}{8} + k\frac{\pi}{2}$.
    - opgave: |-
        $\cos\bigl(2x + \frac{\pi}{6}\bigr) = \frac{\sqrt2}{2}$
      antwoord: |-
        $x = \frac{\pi}{24} + k\pi$ of $x = -\frac{5\pi}{24} + k\pi$
      uitwerking: |-
        $2x + \frac{\pi}{6} = \pm\frac{\pi}{4} + k \cdot 2\pi$, dus $2x = \frac{\pi}{12} + k \cdot 2\pi$ of $2x = -\frac{5\pi}{12} + k \cdot 2\pi$. Delen door 2: $x = \frac{\pi}{24} + k\pi$ of $x = -\frac{5\pi}{24} + k\pi$.

- id: h4-o10
  soort: opdracht
  niveau: 1
  thema: |-
    drill: cyclometrische functies
  opgave: |-
    Bepaal exact, of leg uit waarom het getal niet bestaat.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\bgsin\frac12$
      antwoord: |-
        $\frac{\pi}{6}$
      uitwerking: |-
        $\sin\frac{\pi}{6} = \frac12$, met $\frac{\pi}{6} \in \bigl[-\frac{\pi}{2}, \frac{\pi}{2}\bigr]$.
    - opgave: |-
        $\bgcos(-1)$
      antwoord: |-
        $\pi$
      uitwerking: |-
        $\cos\pi = -1$, met $\pi \in [0, \pi]$.
    - opgave: |-
        $\bgtan(-\sqrt3)$
      antwoord: |-
        $-\frac{\pi}{3}$
      uitwerking: |-
        $\tan\bigl(-\frac{\pi}{3}\bigr) = -\sqrt3$, met $-\frac{\pi}{3} \in \bigl]-\frac{\pi}{2}, \frac{\pi}{2}\bigr[$.
    - opgave: |-
        $\bgsin\bigl(-\frac{\sqrt3}{2}\bigr)$
      antwoord: |-
        $-\frac{\pi}{3}$
      uitwerking: |-
        $\sin\bigl(-\frac{\pi}{3}\bigr) = -\frac{\sqrt3}{2}$, met $-\frac{\pi}{3} \in \bigl[-\frac{\pi}{2}, \frac{\pi}{2}\bigr]$. Niet $\frac{4\pi}{3}$: dat ligt buiten het bereik.
    - opgave: |-
        $\bgcos\frac{\sqrt2}{2}$
      antwoord: |-
        $\frac{\pi}{4}$
      uitwerking: |-
        $\cos\frac{\pi}{4} = \frac{\sqrt2}{2}$, met $\frac{\pi}{4} \in [0, \pi]$.
    - opgave: |-
        $\bgsin 0$
      antwoord: |-
        $0$
      uitwerking: |-
        $\sin 0 = 0$, met $0 \in \bigl[-\frac{\pi}{2}, \frac{\pi}{2}\bigr]$.
    - opgave: |-
        $\bgcos 2$
      antwoord: |-
        bestaat niet
      uitwerking: |-
        Het domein van $\bgcos$ is $[-1, 1]$: geen hoek heeft cosinus 2.
    - opgave: |-
        $\bgcos\bigl(-\frac12\bigr)$
      antwoord: |-
        $\frac{2\pi}{3}$
      uitwerking: |-
        $\cos\bigl(\pi - \frac{\pi}{3}\bigr) = -\frac12$, met $\frac{2\pi}{3} \in [0, \pi]$. Niet $-\frac{\pi}{3}$ of $-\frac{2\pi}{3}$: die liggen buiten het bereik.

- id: h4-o12
  soort: opdracht
  niveau: 1
  thema: |-
    oplossingen aflezen op een grafiek
  opgave: |-
    De figuur toont de grafiek van $y = \cos x$ op $[0, 4\pi]$ en de rechte $y = \frac12$. De verticale lijnen van het rooster staan om de $\frac{\pi}{6}$.

    \figuren{\begin{tikzpicture}[x=.75cm,y=.85cm,font=\scriptsize]
      \draw[black!14,very thin,xstep=0.5236,ystep=.5] (0,-1) grid (12.5664,1);
      \draw[->,grijs] (-.2,0) -- (13.1,0) node[right,text=black] {$x$};
      \draw[->,grijs] (0,-1.3) -- (0,1.45) node[above,text=black] {$y$};
      \foreach \t/\n in {3.1416/\pi,6.2832/2\pi,9.4248/3\pi,12.5664/4\pi}{\node[below right,inner sep=1.5pt] at (\t,0) {$\n$};}
      \foreach \t in {-1,1}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
      \node[left,inner sep=1.5pt] at (0,.5) {$\frac12$};
      \draw[grijs,dashed] (0,.5) -- (12.5664,.5);
      \draw[accent,thick] plot[domain=0:12.5664,samples=160,smooth] (\x,{cos(\x r)});
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel oplossingen heeft $\cos x = \frac12$ in $[0, 4\pi]$? Lees ze af als veelvoud van $\frac{\pi}{6}$.
      antwoord: |-
        4: $\frac{\pi}{3}$, $\frac{5\pi}{3}$, $\frac{7\pi}{3}$, $\frac{11\pi}{3}$
      uitwerking: |-
        De rechte snijdt de grafiek vier keer: na 2, 10, 14 en 22 roosterlijnen. Dat is $\frac{2\pi}{6} = \frac{\pi}{3}$, $\frac{10\pi}{6} = \frac{5\pi}{3}$, $\frac{7\pi}{3}$ en $\frac{11\pi}{3}$.
    - opgave: |-
        Controleer je antwoord door de vergelijking op te lossen.
      antwoord: |-
        $x = \pm\frac{\pi}{3} + k \cdot 2\pi$
      uitwerking: |-
        $x = \pm\frac{\pi}{3} + k \cdot 2\pi$. In $[0, 4\pi]$: $\frac{\pi}{3}$ en $\frac{\pi}{3} + 2\pi = \frac{7\pi}{3}$, en $-\frac{\pi}{3} + 2\pi = \frac{5\pi}{3}$ en $-\frac{\pi}{3} + 4\pi = \frac{11\pi}{3}$.
    - opgave: |-
        Voor welke $x$ in $[0, 4\pi]$ ligt de grafiek boven de rechte?
      antwoord: |-
        $\bigl[0, \frac{\pi}{3}\bigr[ \cup \bigl]\frac{5\pi}{3}, \frac{7\pi}{3}\bigr[ \cup \bigl]\frac{11\pi}{3}, 4\pi\bigr]$
      uitwerking: |-
        Rond de toppen $0$, $2\pi$ en $4\pi$ ligt de grafiek boven de rechte: $\bigl[0, \frac{\pi}{3}\bigr[ \cup \bigl]\frac{5\pi}{3}, \frac{7\pi}{3}\bigr[ \cup \bigl]\frac{11\pi}{3}, 4\pi\bigr]$.

- id: h4-o2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: met het rekentoestel
  opgave: |-
    Los op in $[0, 2\pi[$, op vier decimalen.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\sin x = 0{,}3$
      antwoord: |-
        $0{,}3047$; $2{,}8369$
      uitwerking: |-
        $\bgsin 0{,}3 \approx 0{,}3047$ en $\pi - 0{,}3047 \approx 2{,}8369$.
    - opgave: |-
        $\cos x = -0{,}7$
      antwoord: |-
        $2{,}3462$; $3{,}9370$
      uitwerking: |-
        $\bgcos(-0{,}7) \approx 2{,}3462$ en $-2{,}3462 + 2\pi \approx 3{,}9370$.
    - opgave: |-
        $\tan x = 3$
      antwoord: |-
        $1{,}2490$; $4{,}3906$
      uitwerking: |-
        $\bgtan 3 \approx 1{,}2490$ en $1{,}2490 + \pi \approx 4{,}3906$.
    - opgave: |-
        $\sin x = -0{,}45$
      antwoord: |-
        $3{,}6084$; $5{,}8164$
      uitwerking: |-
        $\bgsin(-0{,}45) \approx -0{,}4668$ ligt niet in $[0, 2\pi[$: $-0{,}4668 + 2\pi \approx 5{,}8164$. De tweede: $\pi - (-0{,}4668) \approx 3{,}6084$.
    - opgave: |-
        $\cos x = 0{,}25$
      antwoord: |-
        $1{,}3181$; $4{,}9651$
      uitwerking: |-
        $\bgcos 0{,}25 \approx 1{,}3181$ en $-1{,}3181 + 2\pi \approx 4{,}9651$.
    - opgave: |-
        $\tan x = -0{,}8$
      antwoord: |-
        $2{,}4669$; $5{,}6084$
      uitwerking: |-
        $\bgtan(-0{,}8) \approx -0{,}6747$. Tel er $\pi$ en $2\pi$ bij: $2{,}4669$ en $5{,}6084$.
    - opgave: |-
        $3\cos x = 2$
      antwoord: |-
        $0{,}8411$; $5{,}4421$
      uitwerking: |-
        $\cos x = \frac23$: $\bgcos\frac23 \approx 0{,}8411$ en $-0{,}8411 + 2\pi \approx 5{,}4421$.
    - opgave: |-
        $\sin 2x = 0{,}6$
      antwoord: |-
        $0{,}3218$; $1{,}2490$; $3{,}4633$; $4{,}3906$
      uitwerking: |-
        $2x \approx 0{,}6435 + k \cdot 2\pi$ of $2x \approx 2{,}4981 + k \cdot 2\pi$, dus $x \approx 0{,}3218 + k\pi$ of $x \approx 1{,}2490 + k\pi$. Met $k = 0$ en $k = 1$: vier oplossingen.

- id: h4-o13
  soort: opdracht
  niveau: 1
  thema: |-
    fouten: elementaire vergelijkingen
  opgave: |-
    Elke oplossing bevat een fout. Waar zit ze? Geef de juiste oplossing.
  lijst: enumerate
  delen:
    - opgave: |-
        `$\sin x = \frac12 \iff x = \frac{\pi}{6} + k \cdot 2\pi$.'
      antwoord: |-
        tweede reeks vergeten: ook $x = \frac{5\pi}{6} + k \cdot 2\pi$
      uitwerking: |-
        De rechte $y = \frac12$ snijdt de eenheidscirkel in twee punten. De supplementaire hoek ontbreekt: $x = \frac{\pi}{6} + k \cdot 2\pi$ of $x = \frac{5\pi}{6} + k \cdot 2\pi$.
    - opgave: |-
        `$\cos x = \frac12 \iff x = \frac{\pi}{3} + k \cdot 2\pi$ of $x = \frac{2\pi}{3} + k \cdot 2\pi$.'
      antwoord: |-
        regel van de sinus gebruikt; $x = \pm\frac{\pi}{3} + k \cdot 2\pi$
      uitwerking: |-
        Bij de cosinus is de tweede hoek de tegengestelde, niet de supplementaire: $\cos\frac{2\pi}{3} = -\frac12$. Juist: $x = \pm\frac{\pi}{3} + k \cdot 2\pi$.
    - opgave: |-
        `$\tan x = 1 \iff x = \frac{\pi}{4} + k \cdot 2\pi$.'
      antwoord: |-
        periode $\pi$; $x = \frac{\pi}{4} + k\pi$
      uitwerking: |-
        De tangens heeft periode $\pi$: ook $\tan\frac{5\pi}{4} = 1$. Juist: $x = \frac{\pi}{4} + k\pi$.
    - opgave: |-
        `$\sin 2x = 1 \iff 2x = \frac{\pi}{2} + k \cdot 2\pi \iff x = \frac{\pi}{4} + k \cdot 2\pi$.'
      antwoord: |-
        periode niet gedeeld; $x = \frac{\pi}{4} + k\pi$
      uitwerking: |-
        Ook de term $k \cdot 2\pi$ moet je door 2 delen. Juist: $x = \frac{\pi}{4} + k\pi$. Controle: $\sin\bigl(2 \cdot \frac{5\pi}{4}\bigr) = \sin\frac{5\pi}{2} = 1$.

- id: h4-o15
  soort: opdracht
  niveau: 1
  thema: |-
    kwadraten: twee tekens
  opgave: |-
    Los op (algemene oplossing). Let op: uit een kwadraat volgen twee mogelijkheden.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $4\cos^2 x = 3$
      antwoord: |-
        $x = \pm\frac{\pi}{6} + k\pi$
      uitwerking: |-
        $\cos x = \frac{\sqrt3}{2}$ of $\cos x = -\frac{\sqrt3}{2}$. Dat geeft $\pm\frac{\pi}{6} + k \cdot 2\pi$ en $\pm\frac{5\pi}{6} + k \cdot 2\pi$, samen $x = \pm\frac{\pi}{6} + k\pi$ (vier punten op de cirkel, telkens $\pi$ uit elkaar).
    - opgave: |-
        $\tan^2 x = 3$
      antwoord: |-
        $x = \pm\frac{\pi}{3} + k\pi$
      uitwerking: |-
        $\tan x = \sqrt3$ of $\tan x = -\sqrt3$, dus $x = \frac{\pi}{3} + k\pi$ of $x = -\frac{\pi}{3} + k\pi$.
    - opgave: |-
        $2\sin^2 x = 1$
      antwoord: |-
        $x = \frac{\pi}{4} + k\frac{\pi}{2}$
      uitwerking: |-
        $\sin x = \pm\frac{\sqrt2}{2}$. Dat zijn de vier hoeken $\frac{\pi}{4}$, $\frac{3\pi}{4}$, $\frac{5\pi}{4}$, $\frac{7\pi}{4}$, telkens $\frac{\pi}{2}$ uit elkaar: $x = \frac{\pi}{4} + k\frac{\pi}{2}$.
    - opgave: |-
        $\sin^2 x = 1$
      antwoord: |-
        $x = \frac{\pi}{2} + k\pi$
      uitwerking: |-
        $\sin x = 1$ of $\sin x = -1$: $x = \frac{\pi}{2} + k \cdot 2\pi$ of $x = -\frac{\pi}{2} + k \cdot 2\pi$, samen $x = \frac{\pi}{2} + k\pi$.
    - opgave: |-
        $4\sin^2 x - 1 = 0$
      antwoord: |-
        $x = \pm\frac{\pi}{6} + k\pi$
      uitwerking: |-
        $\sin x = \pm\frac12$: de hoeken $\frac{\pi}{6}$, $\frac{5\pi}{6}$, $\frac{7\pi}{6}$, $\frac{11\pi}{6}$. Samen $x = \pm\frac{\pi}{6} + k\pi$.
    - opgave: |-
        $\cos^2 x = \frac14$
      antwoord: |-
        $x = \pm\frac{\pi}{3} + k\pi$
      uitwerking: |-
        $\cos x = \pm\frac12$: de hoeken $\frac{\pi}{3}$, $\frac{2\pi}{3}$, $\frac{4\pi}{3}$, $\frac{5\pi}{3}$. Samen $x = \pm\frac{\pi}{3} + k\pi$.

- id: h4-o3
  soort: opdracht
  niveau: 1
  thema: |-
    geen oplossing
  opgave: |-
    Welke vergelijkingen hebben geen oplossing? Waarom?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3\sin x = 2$
      antwoord: |-
        heeft oplossingen
      uitwerking: |-
        $\sin x = \frac23$: kan, want $\frac23 \in [-1, 1]$.
    - opgave: |-
        $\cos x + 2 = 0$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        $\cos x = -2 < -1$: geen oplossing.
    - opgave: |-
        $\tan x = 100$
      antwoord: |-
        heeft oplossingen
      uitwerking: |-
        De tangens neemt elke reële waarde aan: $x = \bgtan 100 + k\pi$.
    - opgave: |-
        $\sin x = \frac{\pi}{3}$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        $\frac{\pi}{3} \approx 1{,}05 > 1$: geen oplossing. Verwar het getal $\frac{\pi}{3}$ niet met de hoek $\frac{\pi}{3}$.
    - opgave: |-
        $2\cos x = -\sqrt3$
      antwoord: |-
        heeft oplossingen
      uitwerking: |-
        $\cos x = -\frac{\sqrt3}{2} \in [-1, 1]$: $x = \pm\frac{5\pi}{6} + k \cdot 2\pi$.
    - opgave: |-
        $\sin^2 x = -\frac14$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        Een kwadraat is nooit negatief: geen oplossing.

- id: h4-o11
  soort: opdracht
  niveau: 1
  thema: |-
    drill: oplossingen in een interval
  opgave: |-
    Los op in $[0, 2\pi[$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin x = -\frac12$
      antwoord: |-
        $\frac{7\pi}{6}$, $\frac{11\pi}{6}$
      uitwerking: |-
        $x = -\frac{\pi}{6} + k \cdot 2\pi$ of $x = \frac{7\pi}{6} + k \cdot 2\pi$: $\frac{7\pi}{6}$ en $-\frac{\pi}{6} + 2\pi = \frac{11\pi}{6}$.
    - opgave: |-
        $\cos x = 0$
      antwoord: |-
        $\frac{\pi}{2}$, $\frac{3\pi}{2}$
      uitwerking: |-
        $x = \pm\frac{\pi}{2} + k \cdot 2\pi$: $\frac{\pi}{2}$ en $-\frac{\pi}{2} + 2\pi = \frac{3\pi}{2}$.
    - opgave: |-
        $\tan x = -1$
      antwoord: |-
        $\frac{3\pi}{4}$, $\frac{7\pi}{4}$
      uitwerking: |-
        $x = -\frac{\pi}{4} + k\pi$: met $k = 1$ en $k = 2$ krijg je $\frac{3\pi}{4}$ en $\frac{7\pi}{4}$.
    - opgave: |-
        $2\cos x = \sqrt3$
      antwoord: |-
        $\frac{\pi}{6}$, $\frac{11\pi}{6}$
      uitwerking: |-
        $\cos x = \frac{\sqrt3}{2}$, $x = \pm\frac{\pi}{6} + k \cdot 2\pi$: $\frac{\pi}{6}$ en $\frac{11\pi}{6}$.
    - opgave: |-
        $\sin x = -1$
      antwoord: |-
        $\frac{3\pi}{2}$
      uitwerking: |-
        $x = -\frac{\pi}{2} + k \cdot 2\pi$: alleen $\frac{3\pi}{2}$.
    - opgave: |-
        $\sqrt3\tan x = 1$
      antwoord: |-
        $\frac{\pi}{6}$, $\frac{7\pi}{6}$
      uitwerking: |-
        $\tan x = \frac{1}{\sqrt3} = \frac{\sqrt3}{3}$, $x = \frac{\pi}{6} + k\pi$: $\frac{\pi}{6}$ en $\frac{7\pi}{6}$.
    - opgave: |-
        $2\sin x + \sqrt2 = 0$
      antwoord: |-
        $\frac{5\pi}{4}$, $\frac{7\pi}{4}$
      uitwerking: |-
        $\sin x = -\frac{\sqrt2}{2}$, $x = -\frac{\pi}{4} + k \cdot 2\pi$ of $x = \frac{5\pi}{4} + k \cdot 2\pi$: $\frac{5\pi}{4}$ en $\frac{7\pi}{4}$.
    - opgave: |-
        $\cos x + 1 = 0$
      antwoord: |-
        $\pi$
      uitwerking: |-
        $\cos x = -1$: alleen $x = \pi$.
    - opgave: |-
        $4\sin x = 2\sqrt3$
      antwoord: |-
        $\frac{\pi}{3}$, $\frac{2\pi}{3}$
      uitwerking: |-
        $\sin x = \frac{\sqrt3}{2}$: $\frac{\pi}{3}$ en $\pi - \frac{\pi}{3} = \frac{2\pi}{3}$.

- id: h4-o14
  soort: opdracht
  niveau: 1
  thema: |-
    cyclometrische functies in een context
  opgave: |-
    Bereken de hoek in radialen (op drie decimalen) en in graden (op één decimaal).
  lijst: enumerate
  delen:
    - opgave: |-
        Een ladder van $5$ m staat tegen een muur, met de voet $1{,}5$ m van de muur. Welke hoek maakt de ladder met de grond?
      antwoord: |-
        $\approx 1{,}266$ rad $\approx 72{,}5^\circ$
      uitwerking: |-
        In de rechthoekige driehoek is $\cos\theta = \frac{1{,}5}{5} = 0{,}3$, met $\theta$ scherp. Dus $\theta = \bgcos 0{,}3 \approx 1{,}266$ rad, en $1{,}266 \cdot \frac{180^\circ}{\pi} \approx 72{,}5^\circ$.
    - opgave: |-
        Een weg stijgt $12\,\%$: per $100$ m horizontaal gaat hij $12$ m omhoog. Wat is de hellingshoek?
      antwoord: |-
        $\approx 0{,}119$ rad $\approx 6{,}8^\circ$
      uitwerking: |-
        $\tan\theta = \frac{12}{100} = 0{,}12$, dus $\theta = \bgtan 0{,}12 \approx 0{,}119$ rad $\approx 6{,}8^\circ$.
    - opgave: |-
        Een paal van $4$ m werpt een schaduw van $6$ m. Welke hoek maken de zonnestralen met de grond?
      antwoord: |-
        $\approx 0{,}588$ rad $\approx 33{,}7^\circ$
      uitwerking: |-
        $\tan\theta = \frac46 = \frac23$, dus $\theta = \bgtan\frac23 \approx 0{,}588$ rad $\approx 33{,}7^\circ$.

- id: h4-o16
  soort: opdracht
  niveau: 2
  thema: |-
    drill: herleidbare vergelijkingen
  opgave: |-
    Los op (algemene oplossing). Kies zelf de methode: substitutie, ontbinden of samenvoegen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2\cos^2 x - \cos x - 1 = 0$
      antwoord: |-
        $k \cdot 2\pi$ of $\pm\frac{2\pi}{3} + k \cdot 2\pi$
      uitwerking: |-
        $t = \cos x$: $2t^2 - t - 1 = (t - 1)(2t + 1) = 0$, dus $\cos x = 1$ of $\cos x = -\frac12$. Dat geeft $x = k \cdot 2\pi$ of $x = \pm\frac{2\pi}{3} + k \cdot 2\pi$.
    - opgave: |-
        $\cos^2 x - \sin^2 x = \frac12$
      antwoord: |-
        $\pm\frac{\pi}{6} + k\pi$
      uitwerking: |-
        Het linkerlid is $\cos 2x$ (verdubbelingsformule). $\cos 2x = \frac12$ geeft $2x = \pm\frac{\pi}{3} + k \cdot 2\pi$, dus $x = \pm\frac{\pi}{6} + k\pi$.
    - opgave: |-
        $\sin x + \cos x = 0$
      antwoord: |-
        $-\frac{\pi}{4} + k\pi$
      uitwerking: |-
        $\cos x = 0$ is geen oplossing (dan is $\sin x = \pm1$). Deel door $\cos x$: $\tan x = -1$, dus $x = -\frac{\pi}{4} + k\pi$.
    - opgave: |-
        $\cos 2x + \cos x = 0$
      antwoord: |-
        $\pm\frac{\pi}{3} + k \cdot 2\pi$ of $\pi + k \cdot 2\pi$
      uitwerking: |-
        $\cos 2x = 2\cos^2 x - 1$, dus $2\cos^2 x + \cos x - 1 = 0$. Met $t = \cos x$: $(2t - 1)(t + 1) = 0$, dus $\cos x = \frac12$ of $\cos x = -1$. Dat geeft $x = \pm\frac{\pi}{3} + k \cdot 2\pi$ of $x = \pi + k \cdot 2\pi$.
    - opgave: |-
        $\sqrt3\sin x + \cos x = \sqrt3$
      antwoord: |-
        $\frac{\pi}{6} + k \cdot 2\pi$ of $\frac{\pi}{2} + k \cdot 2\pi$
      uitwerking: |-
        Samenvoegen: $R = 2$, $\cos\varphi = \frac{\sqrt3}{2}$, $\sin\varphi = \frac12$, dus $2\sin\bigl(x + \frac{\pi}{6}\bigr) = \sqrt3$. Dan $x + \frac{\pi}{6} = \frac{\pi}{3} + k \cdot 2\pi$ of $\frac{2\pi}{3} + k \cdot 2\pi$, dus $x = \frac{\pi}{6} + k \cdot 2\pi$ of $x = \frac{\pi}{2} + k \cdot 2\pi$.
    - opgave: |-
        $2\sin^2 x + 5\cos x + 1 = 0$
      antwoord: |-
        $\pm\frac{2\pi}{3} + k \cdot 2\pi$
      uitwerking: |-
        $\sin^2 x = 1 - \cos^2 x$: $2 - 2\cos^2 x + 5\cos x + 1 = 0$, of $2t^2 - 5t - 3 = 0$ met $t = \cos x$. Dus $t = 3$ (kan niet) of $t = -\frac12$, en $x = \pm\frac{2\pi}{3} + k \cdot 2\pi$.
    - opgave: |-
        $\tan^2 x - (1 + \sqrt3)\tan x + \sqrt3 = 0$
      antwoord: |-
        $\frac{\pi}{4} + k\pi$ of $\frac{\pi}{3} + k\pi$
      uitwerking: |-
        $t = \tan x$: $t^2 - (1 + \sqrt3)t + \sqrt3 = (t - 1)(t - \sqrt3) = 0$ (som $1 + \sqrt3$, product $\sqrt3$). Dus $\tan x = 1$ of $\tan x = \sqrt3$: $x = \frac{\pi}{4} + k\pi$ of $x = \frac{\pi}{3} + k\pi$.
    - opgave: |-
        $\cos 2x = \cos^2 x$
      antwoord: |-
        $k\pi$
      uitwerking: |-
        $\cos^2 x - \sin^2 x = \cos^2 x$, dus $\sin^2 x = 0$ en $\sin x = 0$: $x = k\pi$.
    - opgave: |-
        $\sin x - \cos x = \sqrt2$
      antwoord: |-
        $\frac{3\pi}{4} + k \cdot 2\pi$
      uitwerking: |-
        Samenvoegen: $\sqrt2\sin\bigl(x - \frac{\pi}{4}\bigr) = \sqrt2$, dus $\sin\bigl(x - \frac{\pi}{4}\bigr) = 1$ en $x - \frac{\pi}{4} = \frac{\pi}{2} + k \cdot 2\pi$. Dus $x = \frac{3\pi}{4} + k \cdot 2\pi$.

- id: h4-o20
  soort: opdracht
  niveau: 2
  thema: |-
    snijpunten van twee grafieken
  figuur:
    opties: |-
      6cm
    code: |-
      \begin{tikzpicture}[x=.8cm,y=.62cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=0.5236,ystep=.5] (0,-2) grid (6.2832,2);
        \draw[->,grijs] (-.2,0) -- (6.7,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,-2.2) -- (0,2.5) node[above,text=black] {$y$};
        \foreach \t/\n in {1.5708/\frac{\pi}{2},3.1416/\pi,4.7124/\frac{3\pi}{2},6.2832/2\pi}{\node[below right,inner sep=1.5pt] at (\t,0) {$\n$};}
        \foreach \t in {-2,-1,1,2}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \draw[accent,thick] plot[domain=0:6.2832,samples=100,smooth] (\x,{sin(\x r)});
        \draw[accent,thick,dashed] plot[domain=0:6.2832,samples=100,smooth] (\x,{sqrt(3)*cos(\x r)});
        \node[accent,above] at (1.9,1) {$f$};
        \node[accent,right] at (6.3,1.73) {$g$};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafieken van $f(x) = \sin x$ (volle lijn) en $g(x) = \sqrt3\cos x$ (streepjes) op $[0, 2\pi]$. Het rooster staat om de $\frac{\pi}{6}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees de $x$-coördinaten van de snijpunten af.
      antwoord: |-
        $\frac{\pi}{3}$ en $\frac{4\pi}{3}$
      uitwerking: |-
        Ongeveer $2$ en $8$ roosterlijnen: $\frac{\pi}{3}$ en $\frac{4\pi}{3}$.
    - opgave: |-
        Bereken ze exact.
      antwoord: |-
        $\frac{\pi}{3}$ en $\frac{4\pi}{3}$
      uitwerking: |-
        $\sin x = \sqrt3\cos x$. Als $\cos x = 0$, dan is $\sin x = \pm1 \neq 0$: geen oplossing. Deel dus door $\cos x$: $\tan x = \sqrt3$, $x = \frac{\pi}{3} + k\pi$. In $[0, 2\pi]$: $\frac{\pi}{3}$ en $\frac{4\pi}{3}$.
    - opgave: |-
        Geef de coördinaten van de snijpunten.
      antwoord: |-
        $\bigl(\frac{\pi}{3}, \frac{\sqrt3}{2}\bigr)$ en $\bigl(\frac{4\pi}{3}, -\frac{\sqrt3}{2}\bigr)$
      uitwerking: |-
        $\sin\frac{\pi}{3} = \frac{\sqrt3}{2}$ en $\sin\frac{4\pi}{3} = -\frac{\sqrt3}{2}$.
    - opgave: |-
        Voor welke $x$ in $[0, 2\pi]$ is $\sin x > \sqrt3\cos x$?
      antwoord: |-
        $\bigl]\frac{\pi}{3}, \frac{4\pi}{3}\bigr[$
      uitwerking: |-
        Tussen de snijpunten ligt de volle lijn boven de streepjeslijn (controle: in $x = \pi$ is $0 > -\sqrt3$). Dus $x \in \bigl]\frac{\pi}{3}, \frac{4\pi}{3}\bigr[$.

- id: h4-o4
  soort: opdracht
  niveau: 2
  thema: |-
    met een verdubbelingsformule
  opgave: |-
    Los op in $[0, 2\pi[$: $\cos 2x = \sin x$.
  antwoord: |-
    $\frac{\pi}{6}$, $\frac{5\pi}{6}$, $\frac{3\pi}{2}$
  uitwerking: |-
    Kies de vorm van $\cos 2x$ met alleen $\sin x$: $1 - 2\sin^2 x = \sin x$, dus $2\sin^2 x + \sin x - 1 = 0$. Met $t = \sin x$: $(2t - 1)(t + 1) = 0$, dus $\sin x = \frac12$ of $\sin x = -1$. In $[0, 2\pi[$: $\frac{\pi}{6}$, $\frac{5\pi}{6}$ en $\frac{3\pi}{2}$.

- id: h4-o22
  soort: opdracht
  niveau: 2
  thema: |-
    een camera langs een weg
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[scale=.8,font=\scriptsize]
        \draw[thick] (-2.4,0) -- (2.6,0) node[above] {weg};
        \draw[grijs,dashed] (0,2) -- node[left] {$30$ m} (0,0);
        \draw[accent] (0,2) -- (1.6,0);
        \fill[accent] (1.6,0) circle (2pt);
        \draw[accent] (0,1.35) arc (-90:-51.3:.65);
        \node[accent] at (.28,1.05) {$\theta$};
        \draw[<->] (0,-.3) -- node[below] {$x$} (1.6,-.3);
        \fill (0,2) circle (2.5pt) node[right=2pt] {camera};
      \end{tikzpicture}
  opgave: |-
    Een camera hangt $30$ m van een rechte weg. Draait ze over de hoek $\theta$ (in rad) weg van de loodlijn op de weg, dan kijkt ze naar het punt op afstand $x = 30\tan\theta$ van de voet van die loodlijn. Naar rechts zijn $\theta$ en $x$ positief, naar links negatief.
  lijst: enumerate
  delen:
    - opgave: |-
        Bij welke hoek kijkt de camera naar het punt $30$ m naar rechts?
      antwoord: |-
        $\frac{\pi}{4}$
      uitwerking: |-
        $30\tan\theta = 30$, dus $\tan\theta = 1$ en $\theta = \bgtan 1 = \frac{\pi}{4}$. Andere oplossingen $\frac{\pi}{4} + k\pi$ liggen buiten $\bigl]-\frac{\pi}{2}, \frac{\pi}{2}\bigr[$, en de camera kijkt altijd naar de weg.
    - opgave: |-
        Bij welke hoek kijkt ze naar het punt $50$ m naar links?
      antwoord: |-
        $\approx -1{,}030$ rad
      uitwerking: |-
        $\tan\theta = -\frac{50}{30} = -\frac53$, dus $\theta = \bgtan\bigl(-\frac53\bigr) \approx -1{,}030$ rad (ongeveer $59^\circ$ naar links).
    - opgave: |-
        De camera kan tot $1{,}2$ rad naar elke kant draaien. Hoe lang is het stuk weg dat ze kan zien?
      antwoord: |-
        $\approx 154$ m
      uitwerking: |-
        $x$ stijgt met $\theta$, van $30\tan(-1{,}2) \approx -77{,}2$ m tot $30\tan 1{,}2 \approx 77{,}2$ m. Samen ongeveer $154$ m.
    - opgave: |-
        Waarom kan geen enkele draaihoek de hele weg in beeld brengen?
      antwoord: |-
        $x \to \infty$ als $\theta \to \frac{\pi}{2}$
      uitwerking: |-
        Om naar een punt ver op de weg te kijken, moet $\theta$ dicht bij $\frac{\pi}{2}$ liggen: $30\tan\theta$ wordt willekeurig groot als $\theta$ naar $\frac{\pi}{2}$ gaat. Bij $\theta = \frac{\pi}{2}$ zelf kijkt de camera evenwijdig met de weg, en bestaat $\tan\theta$ niet. Elke hoek met $|\theta| < \frac{\pi}{2}$ geeft een eindig stuk weg.

- id: h4-o18
  soort: opdracht
  niveau: 2
  thema: |-
    ongelijkheden
  opgave: |-
    Los op in $[0, 2\pi]$. Gebruik de eenheidscirkel of een schets van de grafiek.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sin x > \frac{\sqrt2}{2}$
      antwoord: |-
        $\bigl]\frac{\pi}{4}, \frac{3\pi}{4}\bigr[$
      uitwerking: |-
        Gelijkheid in $\frac{\pi}{4}$ en $\frac{3\pi}{4}$. Daartussen ligt de top $\frac{\pi}{2}$, waar $\sin x = 1$: $x \in \bigl]\frac{\pi}{4}, \frac{3\pi}{4}\bigr[$.
    - opgave: |-
        $\cos x \geqslant \frac{\sqrt3}{2}$
      antwoord: |-
        $\bigl[0, \frac{\pi}{6}\bigr] \cup \bigl[\frac{11\pi}{6}, 2\pi\bigr]$
      uitwerking: |-
        Gelijkheid in $\frac{\pi}{6}$ en $\frac{11\pi}{6}$. De cosinus is groot rond $0$ en $2\pi$, aan beide randen van het interval: $\bigl[0, \frac{\pi}{6}\bigr] \cup \bigl[\frac{11\pi}{6}, 2\pi\bigr]$.
    - opgave: |-
        $2\sin x + 1 < 0$
      antwoord: |-
        $\bigl]\frac{7\pi}{6}, \frac{11\pi}{6}\bigr[$
      uitwerking: |-
        $\sin x < -\frac12$. Gelijkheid in $\frac{7\pi}{6}$ en $\frac{11\pi}{6}$, met daartussen het dal $\frac{3\pi}{2}$: $x \in \bigl]\frac{7\pi}{6}, \frac{11\pi}{6}\bigr[$.
    - opgave: |-
        $\tan x \leqslant 1$
      antwoord: |-
        $\bigl[0, \frac{\pi}{4}\bigr] \cup \bigl]\frac{\pi}{2}, \frac{5\pi}{4}\bigr] \cup \bigl]\frac{3\pi}{2}, 2\pi\bigr]$
      uitwerking: |-
        $\tan x$ bestaat niet in $\frac{\pi}{2}$ en $\frac{3\pi}{2}$, en stijgt op elk stuk ertussen. Gelijkheid in $\frac{\pi}{4}$ en $\frac{5\pi}{4}$. Op $\bigl[0, \frac{\pi}{2}\bigr[$: tot $\frac{\pi}{4}$. Op $\bigl]\frac{\pi}{2}, \frac{3\pi}{2}\bigr[$: tot $\frac{5\pi}{4}$. Op $\bigl]\frac{3\pi}{2}, 2\pi\bigr]$ is $\tan x \leqslant 0$: overal. Samen $\bigl[0, \frac{\pi}{4}\bigr] \cup \bigl]\frac{\pi}{2}, \frac{5\pi}{4}\bigr] \cup \bigl]\frac{3\pi}{2}, 2\pi\bigr]$.

- id: h4-o19
  soort: opdracht
  niveau: 2
  thema: |-
    fouten: oplossingen verliezen of toevoegen
  opgave: |-
    Elke oplossing bevat een fout. Waar zit ze? Geef de juiste oplossing (algemene oplossing).
  lijst: enumerate
  delen:
    - opgave: |-
        `$\sin 2x = \cos x$. Ik deel door $\cos x$: $2\sin x = 1$, dus $x = \frac{\pi}{6} + k \cdot 2\pi$ of $x = \frac{5\pi}{6} + k \cdot 2\pi$.'
      antwoord: |-
        oplossingen met $\cos x = 0$ verloren; ook $x = \frac{\pi}{2} + k\pi$
      uitwerking: |-
        Delen door $\cos x$ mag niet als $\cos x = 0$, en net dan zijn beide leden 0. Ontbind: $\cos x\,(2\sin x - 1) = 0$. Juist: $x = \frac{\pi}{2} + k\pi$ of $x = \frac{\pi}{6} + k \cdot 2\pi$ of $x = \frac{5\pi}{6} + k \cdot 2\pi$.
    - opgave: |-
        `$\sin^2 x = \sin x$. Ik deel door $\sin x$: $\sin x = 1$, dus $x = \frac{\pi}{2} + k \cdot 2\pi$.'
      antwoord: |-
        $\sin x = 0$ verloren; ook $x = k\pi$
      uitwerking: |-
        Dezelfde fout: ontbind $\sin x\,(\sin x - 1) = 0$. Juist: $x = k\pi$ of $x = \frac{\pi}{2} + k \cdot 2\pi$.
    - opgave: |-
        `$2\cos^2 x + \cos x - 3 = 0$. Stel $t = \cos x$: $t = 1$ of $t = -\frac32$. Dus $x = k \cdot 2\pi$ of $x = \pm\bgcos\bigl(-\frac32\bigr) + k \cdot 2\pi$.'
      antwoord: |-
        $\cos x = -\frac32$ kan niet; alleen $x = k \cdot 2\pi$
      uitwerking: |-
        $-\frac32 < -1$, dus $\cos x = -\frac32$ heeft geen oplossing en $\bgcos\bigl(-\frac32\bigr)$ bestaat niet. Juist: $x = k \cdot 2\pi$.
    - opgave: |-
        `$\sin x + \cos x = 1$. Ik kwadrateer: $1 + 2\sin x\cos x = 1$, dus $\sin 2x = 0$ en $x = k\frac{\pi}{2}$.'
      antwoord: |-
        kwadrateren voegt valse oplossingen toe; $x = k \cdot 2\pi$ of $x = \frac{\pi}{2} + k \cdot 2\pi$
      uitwerking: |-
        Na kwadrateren voldoet ook $\sin x + \cos x = -1$. Controle: $x = \pi$ geeft $0 - 1 = -1 \neq 1$, en $x = \frac{3\pi}{2}$ ook. Juist, bijvoorbeeld met samenvoegen: $\sqrt2\sin\bigl(x + \frac{\pi}{4}\bigr) = 1$, dus $x + \frac{\pi}{4} = \frac{\pi}{4} + k \cdot 2\pi$ of $\frac{3\pi}{4} + k \cdot 2\pi$: $x = k \cdot 2\pi$ of $x = \frac{\pi}{2} + k \cdot 2\pi$.

- id: h4-o17
  soort: opdracht
  niveau: 2
  thema: |-
    drill: veelvouden van x in een interval
  opgave: |-
    Los op in $[0, 2\pi[$. Hoeveel oplossingen verwacht je?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\sin 2x = -\frac{\sqrt3}{2}$
      antwoord: |-
        $\frac{2\pi}{3}$, $\frac{5\pi}{6}$, $\frac{5\pi}{3}$, $\frac{11\pi}{6}$
      uitwerking: |-
        $2x = -\frac{\pi}{3} + k \cdot 2\pi$ of $2x = \frac{4\pi}{3} + k \cdot 2\pi$, dus $x = -\frac{\pi}{6} + k\pi$ of $x = \frac{2\pi}{3} + k\pi$. In $[0, 2\pi[$: $\frac{5\pi}{6}$, $\frac{11\pi}{6}$, $\frac{2\pi}{3}$, $\frac{5\pi}{3}$.
    - opgave: |-
        $\cos 3x = 0$
      antwoord: |-
        $\frac{\pi}{6}$, $\frac{\pi}{2}$, $\frac{5\pi}{6}$, $\frac{7\pi}{6}$, $\frac{3\pi}{2}$, $\frac{11\pi}{6}$
      uitwerking: |-
        $3x = \frac{\pi}{2} + k\pi$, dus $x = \frac{\pi}{6} + k\frac{\pi}{3}$. Met $k = 0, \ldots, 5$: zes oplossingen.
    - opgave: |-
        $\tan\frac{x}{2} = 1$
      antwoord: |-
        $\frac{\pi}{2}$
      uitwerking: |-
        $\frac{x}{2} = \frac{\pi}{4} + k\pi$, dus $x = \frac{\pi}{2} + k \cdot 2\pi$: alleen $\frac{\pi}{2}$.
    - opgave: |-
        $\cos\bigl(2x - \frac{\pi}{3}\bigr) = \frac12$
      antwoord: |-
        $0$, $\frac{\pi}{3}$, $\pi$, $\frac{4\pi}{3}$
      uitwerking: |-
        $2x - \frac{\pi}{3} = \pm\frac{\pi}{3} + k \cdot 2\pi$, dus $2x = \frac{2\pi}{3} + k \cdot 2\pi$ of $2x = k \cdot 2\pi$. Dan $x = \frac{\pi}{3} + k\pi$ of $x = k\pi$: $0$, $\frac{\pi}{3}$, $\pi$, $\frac{4\pi}{3}$.
    - opgave: |-
        $\sin\bigl(x + \frac{\pi}{4}\bigr) = 1$
      antwoord: |-
        $\frac{\pi}{4}$
      uitwerking: |-
        $x + \frac{\pi}{4} = \frac{\pi}{2} + k \cdot 2\pi$, dus $x = \frac{\pi}{4} + k \cdot 2\pi$: alleen $\frac{\pi}{4}$.
    - opgave: |-
        $\sqrt2\cos 2x = -1$
      antwoord: |-
        $\frac{3\pi}{8}$, $\frac{5\pi}{8}$, $\frac{11\pi}{8}$, $\frac{13\pi}{8}$
      uitwerking: |-
        $\cos 2x = -\frac{\sqrt2}{2}$, $2x = \pm\frac{3\pi}{4} + k \cdot 2\pi$, dus $x = \pm\frac{3\pi}{8} + k\pi$: $\frac{3\pi}{8}$, $\frac{11\pi}{8}$ en $\frac{5\pi}{8}$, $\frac{13\pi}{8}$.
    - opgave: |-
        $\cos\frac{x}{2} = -1$
      antwoord: |-
        geen oplossing
      uitwerking: |-
        $\frac{x}{2} = \pi + k \cdot 2\pi$, dus $x = 2\pi + k \cdot 4\pi$. Die getallen liggen niet in $[0, 2\pi[$: geen oplossing.
    - opgave: |-
        $\tan 3x = -\sqrt3$
      antwoord: |-
        $\frac{2\pi}{9}$, $\frac{5\pi}{9}$, $\frac{8\pi}{9}$, $\frac{11\pi}{9}$, $\frac{14\pi}{9}$, $\frac{17\pi}{9}$
      uitwerking: |-
        $3x = -\frac{\pi}{3} + k\pi$, dus $x = -\frac{\pi}{9} + k\frac{\pi}{3}$. Met $k = 1, \ldots, 6$: zes oplossingen.

- id: h4-o7
  soort: opdracht
  niveau: 2
  thema: |-
    de London Eye
  opgave: |-
    Op de London Eye is je hoogte $h(t) = -60\cos\frac{\pi t}{15} + 75$ (in m, $t$ in minuten, één toer duurt 30 minuten). Hoe lang ben je tijdens een toer hoger dan $100$ m?
  antwoord: |-
    ongeveer $10{,}9$ minuten
  uitwerking: |-
    $-60\cos\frac{\pi t}{15} + 75 > 100 \iff \cos\frac{\pi t}{15} < -\frac{25}{60} = -\frac{5}{12}$. Gelijkheid, met $0 \leqslant \frac{\pi t}{15} \leqslant 2\pi$: $\frac{\pi t}{15} = \bgcos\bigl(-\frac{5}{12}\bigr) \approx 2{,}0006$ of $2\pi - 2{,}0006 \approx 4{,}2826$. Vermenigvuldig met $\frac{15}{\pi}$: $t \approx 9{,}55$ of $t \approx 20{,}45$. Daartussen ligt de top ($t = 15$): je bent ongeveer $20{,}45 - 9{,}55 \approx 10{,}9$ minuten hoger dan 100 m.

- id: h4-o5
  soort: opdracht
  niveau: 2
  thema: |-
    ontbinden
  opgave: |-
    Los op in $[0, 2\pi]$: $\sin 2x = \sin x$.
  antwoord: |-
    $0$, $\frac{\pi}{3}$, $\pi$, $\frac{5\pi}{3}$, $2\pi$
  uitwerking: |-
    $2\sin x\cos x - \sin x = \sin x\,(2\cos x - 1) = 0$. $\sin x = 0$: $0$, $\pi$, $2\pi$. $\cos x = \frac12$: $\frac{\pi}{3}$, $\frac{5\pi}{3}$. Let op: het interval is gesloten, dus ook $2\pi$ hoort erbij.

- id: h4-o23
  soort: opdracht
  niveau: 2
  thema: |-
    een waterstraal
  opgave: |-
    Een brandweerman spuit water met een snelheid van $20$ m/s, onder een hoek $\theta$ met de grond. Zonder luchtweerstand komt het water (op dezelfde hoogte) neer op een afstand
    \[R = \frac{400\sin 2\theta}{9{,}81} \text{ m}, \qquad 0 < \theta < \tfrac{\pi}{2}.\]
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe ver komt het water bij $\theta = \frac{\pi}{6}$?
      antwoord: |-
        $\approx 35{,}3$ m
      uitwerking: |-
        $R = \frac{400\sin\frac{\pi}{3}}{9{,}81} = \frac{200\sqrt3}{9{,}81} \approx 35{,}3$ m.
    - opgave: |-
        Bij welke hoeken komt het water $30$ m ver? Geef ze in radialen en in graden.
      antwoord: |-
        $\approx 0{,}413$ rad $\approx 23{,}7^\circ$ en $\approx 1{,}157$ rad $\approx 66{,}3^\circ$
      uitwerking: |-
        $\sin 2\theta = \frac{30 \cdot 9{,}81}{400} = 0{,}73575$. Met $0 < 2\theta < \pi$: $2\theta = \bgsin 0{,}73575 \approx 0{,}8268$ of $2\theta \approx \pi - 0{,}8268 \approx 2{,}3148$. Dus $\theta \approx 0{,}413$ rad $\approx 23{,}7^\circ$ of $\theta \approx 1{,}157$ rad $\approx 66{,}3^\circ$.
    - opgave: |-
        Toon aan dat de twee hoeken uit b samen $\frac{\pi}{2}$ zijn.
      antwoord: |-
        bewijs
      uitwerking: |-
        De tweede oplossing van $\sin 2\theta = a$ is $2\theta_2 = \pi - 2\theta_1$ (supplementaire hoeken). Delen door 2: $\theta_2 = \frac{\pi}{2} - \theta_1$, dus $\theta_1 + \theta_2 = \frac{\pi}{2}$. Een lage en een hoge straal komen even ver.
    - opgave: |-
        Wat is de grootste afstand, en bij welke hoek?
      antwoord: |-
        $\approx 40{,}8$ m bij $\theta = \frac{\pi}{4}$
      uitwerking: |-
        $R$ is het grootst als $\sin 2\theta = 1$, dus $2\theta = \frac{\pi}{2}$ en $\theta = \frac{\pi}{4}$. Dan is $R = \frac{400}{9{,}81} \approx 40{,}8$ m.

- id: h4-o6
  soort: opdracht
  niveau: 2
  thema: |-
    ongelijkheid
  opgave: |-
    Voor welke $x$ in $[0, 2\pi]$ is $\cos x \leqslant -\frac12$? Gebruik de eenheidscirkel of de grafiek.
  antwoord: |-
    $\bigl[\frac{2\pi}{3}, \frac{4\pi}{3}\bigr]$
  uitwerking: |-
    Gelijkheid in $\frac{2\pi}{3}$ en $\frac{4\pi}{3}$. Daartussen ligt $\pi$, waar $\cos x = -1$: daar is de ongelijkheid voldaan. Op de eenheidscirkel: de punten links van de verticale rechte $x = -\frac12$. Oplossing $\bigl[\frac{2\pi}{3}, \frac{4\pi}{3}\bigr]$.

- id: h4-o21
  soort: opdracht
  niveau: 2
  thema: |-
    de daglengte
  opgave: |-
    In hoofdstuk 3 vond je een model voor de daglengte in Brussel, in uur, met $t$ het nummer van de dag in het jaar:
    \[L(t) = 4{,}15\cos\bigl(\tfrac{2\pi}{365}(t - 172)\bigr) + 12{,}25.\]
  lijst: enumerate
  delen:
    - opgave: |-
        Op welke dagen zijn dag en nacht volgens het model even lang?
      antwoord: |-
        dag 77 en dag 267 (18 maart en 24 september)
      uitwerking: |-
        $L(t) = 12 \iff \cos\bigl(\frac{2\pi}{365}(t - 172)\bigr) = -\frac{0{,}25}{4{,}15} \approx -0{,}0602$. Dan $\frac{2\pi}{365}(t - 172) = \pm\bgcos(-0{,}0602) \approx \pm 1{,}6311$, dus $t - 172 \approx \pm 94{,}75$ en $t \approx 77{,}2$ of $t \approx 266{,}8$. Dat is rond 18 maart en 24 september. (In werkelijkheid valt dat enkele dagen later: het model is een benadering.)
    - opgave: |-
        Tussen welke dagen is de dag langer dan $14$ uur? Hoe lang duurt die periode ongeveer?
      antwoord: |-
        van dag 106 tot dag 238; ongeveer 132 dagen
      uitwerking: |-
        $L(t) > 14 \iff \cos\bigl(\frac{2\pi}{365}(t - 172)\bigr) > \frac{1{,}75}{4{,}15} \approx 0{,}4217$. Gelijkheid: $\frac{2\pi}{365}(t - 172) \approx \pm 1{,}1355$, dus $t - 172 \approx \pm 65{,}96$: $t \approx 106{,}0$ of $t \approx 238{,}0$. Daartussen ligt de top (dag 172): ongeveer $2 \cdot 65{,}96 \approx 132$ dagen.
    - opgave: |-
        Een plant bloeit alleen als de dag langer is dan $15$ uur. Van welke dag tot welke dag kan dat?
      antwoord: |-
        van dag 123 tot dag 221 (3 mei tot 9 augustus)
      uitwerking: |-
        $\cos\bigl(\frac{2\pi}{365}(t - 172)\bigr) > \frac{2{,}75}{4{,}15} \approx 0{,}6627$, met gelijkheid bij $\frac{2\pi}{365}(t - 172) \approx \pm 0{,}8464$, dus $t - 172 \approx \pm 49{,}2$. Van $t \approx 122{,}8$ tot $t \approx 221{,}2$: van dag 123 (3 mei) tot dag 221 (9 augustus).

- id: h4-o24
  soort: opdracht
  niveau: 3
  thema: |-
    aantal oplossingen met een parameter
  opgave: |-
    Neem $f(x) = \sin x + \sqrt3\cos x$, het linkerlid uit het voorbeeld bij samenvoegen, en een reëel getal $a$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke waarden van $a$ heeft $f(x) = a$ oplossingen?
      antwoord: |-
        $-2 \leqslant a \leqslant 2$
      uitwerking: |-
        $f(x) = 2\sin\bigl(x + \frac{\pi}{3}\bigr)$ neemt alle waarden tussen $-2$ en $2$ aan, en geen andere. Dus $f(x) = a$ heeft oplossingen als en slechts als $-2 \leqslant a \leqslant 2$.
    - opgave: |-
        Hoeveel oplossingen heeft $f(x) = a$ in $[0, 2\pi[$ voor $a = 2$, $a = \sqrt3$ en $a = 3$? Geef ze.
      antwoord: |-
        1: $\frac{\pi}{6}$; 2: $0$ en $\frac{\pi}{3}$; geen
      uitwerking: |-
        $a = 2$: $\sin\bigl(x + \frac{\pi}{3}\bigr) = 1$, $x = \frac{\pi}{6} + k \cdot 2\pi$: één oplossing $\frac{\pi}{6}$. $a = \sqrt3$: $\sin\bigl(x + \frac{\pi}{3}\bigr) = \frac{\sqrt3}{2}$, $x + \frac{\pi}{3} = \frac{\pi}{3}$ of $\frac{2\pi}{3}$ (plus $k \cdot 2\pi$), dus $x = 0$ of $x = \frac{\pi}{3}$: twee oplossingen. $a = 3 > 2$: geen.
    - opgave: |-
        Voor welke $a$ heeft $f(x) = a$ precies één oplossing in $[0, 2\pi[$? Verklaar.
      antwoord: |-
        $a = 2$ en $a = -2$
      uitwerking: |-
        Het interval $[0, 2\pi[$ is precies één periode. Daarin neemt $f$ de grootste en de kleinste waarde elk één keer aan (de top en het dal), en elke waarde ertussen twee keer: één keer op de stijgende en één keer op de dalende helft. Dus precies één oplossing alleen voor $a = 2$ en $a = -2$.

- id: h4-o9
  soort: opdracht
  niveau: 3
  thema: |-
    gelijke sinussen en cosinussen
  opgave: |-
    Uit $\sin A = \sin B$ volgt $A = B + k \cdot 2\pi$ of $A = \pi - B + k \cdot 2\pi$.
  lijst: enumerate
  delen:
    - opgave: |-
        Los zo op: $\sin 3x = \sin x$, en geef de oplossingen in $[0, \pi]$.
      antwoord: |-
        $0$, $\frac{\pi}{4}$, $\frac{3\pi}{4}$, $\pi$
      uitwerking: |-
        $3x = x + k \cdot 2\pi$ geeft $x = k\pi$. $3x = \pi - x + k \cdot 2\pi$ geeft $4x = \pi + k \cdot 2\pi$, dus $x = \frac{\pi}{4} + k\frac{\pi}{2}$. In $[0, \pi]$: $0$, $\frac{\pi}{4}$, $\frac{3\pi}{4}$, $\pi$.
    - opgave: |-
        Wat volgt uit $\cos A = \cos B$? Los daarmee op: $\cos 3x = \cos x$, en geef de oplossingen in $[0, \pi]$.
      antwoord: |-
        $A = \pm B + k \cdot 2\pi$; $0$, $\frac{\pi}{2}$, $\pi$
      uitwerking: |-
        Twee hoeken met dezelfde cosinus zijn gelijk of tegengesteld, op een veelvoud van $2\pi$ na: $A = \pm B + k \cdot 2\pi$. $3x = x + k \cdot 2\pi$ geeft $x = k\pi$. $3x = -x + k \cdot 2\pi$ geeft $x = k\frac{\pi}{2}$. De eerste reeks zit in de tweede: $x = k\frac{\pi}{2}$, en in $[0, \pi]$: $0$, $\frac{\pi}{2}$, $\pi$.

- id: h4-o25
  soort: opdracht
  niveau: 3
  thema: |-
    homogene vergelijkingen
  opgave: |-
    In elke term staan samen twee factoren $\sin x$ of $\cos x$. Zo'n vergelijking kun je soms omzetten naar een vergelijking in $\tan x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Los op: $\sin^2 x - 3\sin x\cos x + 2\cos^2 x = 0$. Deel door $\cos^2 x$, maar ga eerst na dat dat mag.
      antwoord: |-
        $\frac{\pi}{4} + k\pi$ of $\bgtan 2 + k\pi \approx 1{,}107 + k\pi$
      uitwerking: |-
        Als $\cos x = 0$, dan is $\sin^2 x = 1$ en wordt het linkerlid $1 \neq 0$: zulke $x$ zijn geen oplossing. Delen door $\cos^2 x$ mag dus: $\tan^2 x - 3\tan x + 2 = 0$, of $(\tan x - 1)(\tan x - 2) = 0$. Dus $x = \frac{\pi}{4} + k\pi$ of $x = \bgtan 2 + k\pi \approx 1{,}107 + k\pi$.
    - opgave: |-
        Los op: $\sin^2 x + \sin x\cos x = 1$. Tip: schrijf $1 = \sin^2 x + \cos^2 x$. Mag je hier door $\cos^2 x$ delen?
      antwoord: |-
        $\frac{\pi}{2} + k\pi$ of $\frac{\pi}{4} + k\pi$; nee
      uitwerking: |-
        $\sin^2 x + \sin x\cos x = \sin^2 x + \cos^2 x \iff \sin x\cos x - \cos^2 x = 0 \iff \cos x\,(\sin x - \cos x) = 0$. Hier is $\cos x = 0$ wel een oplossing, dus delen door $\cos^2 x$ zou oplossingen doen verliezen. $\cos x = 0$: $x = \frac{\pi}{2} + k\pi$. $\sin x = \cos x$: $\tan x = 1$, $x = \frac{\pi}{4} + k\pi$.

- id: h4-o8
  soort: opdracht
  niveau: 3
  thema: |-
    samenvoegen
  opgave: |-
    Los op: $\sqrt3\sin x - \cos x = \sqrt2$.
  antwoord: |-
    $\frac{5\pi}{12} + k \cdot 2\pi$ of $\frac{11\pi}{12} + k \cdot 2\pi$
  uitwerking: |-
    Samenvoegen: $R = \sqrt{3 + 1} = 2$, $\cos\varphi = \frac{\sqrt3}{2}$ en $\sin\varphi = -\frac12$, dus $\varphi = -\frac{\pi}{6}$ en $\sqrt3\sin x - \cos x = 2\sin\bigl(x - \frac{\pi}{6}\bigr)$. Dus $\sin\bigl(x - \frac{\pi}{6}\bigr) = \frac{\sqrt2}{2}$. Dan $x - \frac{\pi}{6} = \frac{\pi}{4} + k \cdot 2\pi$ of $\frac{3\pi}{4} + k \cdot 2\pi$, dus $x = \frac{5\pi}{12} + k \cdot 2\pi$ of $x = \frac{11\pi}{12} + k \cdot 2\pi$.

- id: h4-o27
  soort: opdracht
  niveau: 3
  thema: |-
    ongelijkheid met een tekentabel
  opgave: |-
    Los op in $[0, 2\pi]$: $\sin 2x > \cos x$. Breng alles naar één lid, ontbind, en maak een tekentabel.
  antwoord: |-
    $\bigl]\frac{\pi}{6}, \frac{\pi}{2}\bigr[ \cup \bigl]\frac{5\pi}{6}, \frac{3\pi}{2}\bigr[$
  uitwerking: |-
    $\sin 2x - \cos x = \cos x\,(2\sin x - 1) > 0$. Nulwaarden in $[0, 2\pi]$: $\cos x = 0$ in $\frac{\pi}{2}$ en $\frac{3\pi}{2}$; $\sin x = \frac12$ in $\frac{\pi}{6}$ en $\frac{5\pi}{6}$. Het teken van elke factor volgt uit de eenheidscirkel:

    \smallskip
    {\small\tekentabel{ccccccccccc}{x & 0 & & \frac{\pi}{6} & & \frac{\pi}{2} & & \frac{5\pi}{6} & & \frac{3\pi}{2} & & 2\pi}{\cos x & + & + & + & + & 0 & - & - & - & 0 & + & + \\ 2\sin x - 1 & - & - & 0 & + & + & + & 0 & - & - & - & - \\ \hline \text{product} & - & - & 0 & + & 0 & - & 0 & + & 0 & - & -}}
    \smallskip

    Het product is positief voor $x \in \bigl]\frac{\pi}{6}, \frac{\pi}{2}\bigr[ \cup \bigl]\frac{5\pi}{6}, \frac{3\pi}{2}\bigr[$.

- id: h4-o26
  soort: opdracht
  niveau: 3
  thema: |-
    twee aanpakken vergelijken
  opgave: |-
    Los op: $\tan x + \dfrac{1}{\tan x} = 4$, op twee manieren.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel $t = \tan x$. Geef de oplossingen met $\bgtan$.
      antwoord: |-
        $x = \bgtan(2 \pm \sqrt3) + k\pi$
      uitwerking: |-
        Vermenigvuldig met $t \neq 0$: $t^2 - 4t + 1 = 0$, dus $t = \frac{4 \pm \sqrt{12}}{2} = 2 \pm \sqrt3$. Beide zijn niet nul. Dus $x = \bgtan(2 - \sqrt3) + k\pi$ of $x = \bgtan(2 + \sqrt3) + k\pi$.
    - opgave: |-
        Schrijf het linkerlid met $\sin x$ en $\cos x$, zet op één noemer, en gebruik een verdubbelingsformule.
      antwoord: |-
        $x = \frac{\pi}{12} + k\pi$ of $x = \frac{5\pi}{12} + k\pi$
      uitwerking: |-
        $\frac{\sin x}{\cos x} + \frac{\cos x}{\sin x} = \frac{\sin^2 x + \cos^2 x}{\sin x\cos x} = \frac{1}{\sin x\cos x} = \frac{2}{\sin 2x}$. Dus $\frac{2}{\sin 2x} = 4$, of $\sin 2x = \frac12$: $2x = \frac{\pi}{6} + k \cdot 2\pi$ of $2x = \frac{5\pi}{6} + k \cdot 2\pi$, en $x = \frac{\pi}{12} + k\pi$ of $x = \frac{5\pi}{12} + k\pi$. (Daar zijn $\sin x$ en $\cos x$ niet nul, dus bestaan beide termen.)
    - opgave: |-
        Wat leer je uit de twee antwoorden over $\tan\frac{\pi}{12}$ en $\tan\frac{5\pi}{12}$?
      antwoord: |-
        $\tan\frac{\pi}{12} = 2 - \sqrt3$ en $\tan\frac{5\pi}{12} = 2 + \sqrt3$
      uitwerking: |-
        Beide antwoorden beschrijven dezelfde verzameling. In $\bigl]0, \frac{\pi}{2}\bigr[$ is de kleinste oplossing $\frac{\pi}{12}$ en de grootste $\frac{5\pi}{12}$; de tangens stijgt, dus de kleinste hoort bij $2 - \sqrt3$. Zo is $\tan\frac{\pi}{12} = 2 - \sqrt3$ en $\tan\frac{5\pi}{12} = 2 + \sqrt3$, zonder somformule.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h4-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Algemene functies
  thema: |-
    een inverse terugdraaien
  opgave: |-
    Voor elke $x \in [-1, 1]$ is $\sin(\bgsin x) = x$. Is ook $\bgsin(\sin x) = x$ voor elke $x$? Bereken $\bgsin(\sin 2)$ en leg uit.
  antwoord: |-
    nee; $\pi - 2 \approx 1{,}14$
  uitwerking: |-
    Nee: $\bgsin$ geeft altijd een hoek in $\bigl[-\frac{\pi}{2}, \frac{\pi}{2}\bigr]$, en $2 > \frac{\pi}{2}$. De hoek in dat interval met dezelfde sinus als $2$ is $\pi - 2 \approx 1{,}14$.

- id: h4-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Integralen
  thema: |-
    pi als oppervlakte
  opgave: |-
    Een primitieve van $\frac{1}{1 + x^2}$ is $\bgtan x$. Bereken $\int_0^1 \frac{1}{1 + x^2}\,\mathrm{d}x$. Welk bekend getal vind je zo met vier keer die oppervlakte?
  antwoord: |-
    $\frac{\pi}{4}$; $\pi$
  uitwerking: |-
    $\bgtan 1 - \bgtan 0 = \frac{\pi}{4}$; vier keer is $\pi$.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h4-t1
  soort: test
  niveau: 1
  thema: |-
    cyclometrische functies
  opgave: |-
    Bepaal exact $\bgsin\bigl(-\frac{\sqrt2}{2}\bigr)$ en $\bgtan\sqrt3$.
  antwoord: |-
    $-\frac{\pi}{4}$; $\frac{\pi}{3}$
  uitwerking: |-
    $\sin\bigl(-\frac{\pi}{4}\bigr) = -\frac{\sqrt2}{2}$ en $-\frac{\pi}{4} \in \bigl[-\frac{\pi}{2}, \frac{\pi}{2}\bigr]$, dus $\bgsin\bigl(-\frac{\sqrt2}{2}\bigr) = -\frac{\pi}{4}$. $\tan\frac{\pi}{3} = \sqrt3$ en $\frac{\pi}{3} \in \bigl]-\frac{\pi}{2}, \frac{\pi}{2}\bigr[$, dus $\bgtan\sqrt3 = \frac{\pi}{3}$.

- id: h4-t2
  soort: test
  niveau: 1
  thema: |-
    elementaire vergelijking
  opgave: |-
    Los op in $[0, 2\pi[$: $\cos x = -\frac12$.
  antwoord: |-
    $\frac{2\pi}{3}$, $\frac{4\pi}{3}$
  uitwerking: |-
    $\bgcos\bigl(-\frac12\bigr) = \frac{2\pi}{3}$, dus $x = \pm\frac{2\pi}{3} + k \cdot 2\pi$. In $[0, 2\pi[$: $\frac{2\pi}{3}$ en $-\frac{2\pi}{3} + 2\pi = \frac{4\pi}{3}$.

- id: h4-t3
  soort: test
  niveau: 2
  thema: |-
    veelvoud van x
  opgave: |-
    Los op: $\sin 2x = \frac{\sqrt3}{2}$. Geef de algemene oplossing en de oplossingen in $[0, 2\pi[$.
  antwoord: |-
    $\frac{\pi}{6} + k\pi$ of $\frac{\pi}{3} + k\pi$; $\frac{\pi}{6}, \frac{\pi}{3}, \frac{7\pi}{6}, \frac{4\pi}{3}$
  uitwerking: |-
    $2x = \frac{\pi}{3} + k \cdot 2\pi$ of $2x = \frac{2\pi}{3} + k \cdot 2\pi$, dus $x = \frac{\pi}{6} + k\pi$ of $x = \frac{\pi}{3} + k\pi$. In $[0, 2\pi[$: $\frac{\pi}{6}$, $\frac{\pi}{3}$, $\frac{7\pi}{6}$, $\frac{4\pi}{3}$.

- id: h4-t4
  soort: test
  niveau: 2
  thema: |-
    ontbinden
  opgave: |-
    Los op: $2\sin^2 x + \sin x = 0$.
  antwoord: |-
    $k\pi$; $-\frac{\pi}{6} + k \cdot 2\pi$; $\frac{7\pi}{6} + k \cdot 2\pi$
  uitwerking: |-
    $\sin x\,(2\sin x + 1) = 0$. $\sin x = 0$: $x = k\pi$. $\sin x = -\frac12$: $x = -\frac{\pi}{6} + k \cdot 2\pi$ of $x = \frac{7\pi}{6} + k \cdot 2\pi$.

- id: h4-t6
  soort: test
  niveau: 2
  thema: |-
    substitutie na de grondformule
  opgave: |-
    Los op: $2\sin^2 x = 3\cos x$.
  antwoord: |-
    $\pm\frac{\pi}{3} + k \cdot 2\pi$
  uitwerking: |-
    $\sin^2 x = 1 - \cos^2 x$: $2 - 2\cos^2 x = 3\cos x$, of $2t^2 + 3t - 2 = 0$ met $t = \cos x$. Dus $t = \frac12$ of $t = -2$ (kan niet). Uit $\cos x = \frac12$: $x = \pm\frac{\pi}{3} + k \cdot 2\pi$.

- id: h4-t7
  soort: test
  niveau: 2
  thema: |-
    samenvoegen
  opgave: |-
    Los op in $[0, 2\pi[$: $\sin x - \sqrt3\cos x = 1$.
  antwoord: |-
    $\frac{\pi}{2}$, $\frac{7\pi}{6}$
  uitwerking: |-
    $R = 2$, $\cos\varphi = \frac12$ en $\sin\varphi = -\frac{\sqrt3}{2}$, dus $\varphi = -\frac{\pi}{3}$: $2\sin\bigl(x - \frac{\pi}{3}\bigr) = 1$. Dan $x - \frac{\pi}{3} = \frac{\pi}{6} + k \cdot 2\pi$ of $\frac{5\pi}{6} + k \cdot 2\pi$, dus $x = \frac{\pi}{2} + k \cdot 2\pi$ of $x = \frac{7\pi}{6} + k \cdot 2\pi$. In $[0, 2\pi[$: $\frac{\pi}{2}$ en $\frac{7\pi}{6}$.

- id: h4-t5
  soort: test
  niveau: 2
  thema: |-
    context
  opgave: |-
    De temperatuur in een serre is $T(t) = 4\sin\frac{\pi(t - 9)}{12} + 20$ (in $^\circ$C, $t$ in uur). Wanneer is het warmer dan $22\,^\circ$C?
  antwoord: |-
    tussen 11 en 19 uur
  uitwerking: |-
    $4\sin\frac{\pi(t - 9)}{12} + 20 > 22 \iff \sin\frac{\pi(t - 9)}{12} > \frac12$. Gelijkheid: $\frac{\pi(t - 9)}{12} = \frac{\pi}{6}$ of $\frac{5\pi}{6}$, dus $t - 9 = 2$ of $t - 9 = 10$: $t = 11$ of $t = 19$. Daartussen ligt de top (om 15 uur): warmer dan $22\,^\circ$C tussen 11 en 19 uur.
