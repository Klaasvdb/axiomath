# Oefeningen van hoofdstuk 2. Zie oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Geef de richtingscoëfficiënt van de rechte door $(1, 1)$ en $(3, 9)$.
      antwoord: |-
        4
      uitwerking: |-
        $\frac{9 - 1}{3 - 1} = 4$.
    - opgave: |-
        Geef de rechte door $(2, 5)$ met richtingscoëfficiënt $3$.
      antwoord: |-
        $y = 3x - 1$
      uitwerking: |-
        $y - 5 = 3(x - 2)$.
    - opgave: |-
        Werk uit: $(x + h)^2$ en $(x + h)^3$.
      antwoord: |-
        $x^2 + 2xh + h^2$; $x^3 + 3x^2h + 3xh^2 + h^3$
      uitwerking: |-
        Merkwaardig product: $(x + h)^2 = x^2 + 2xh + h^2$. Binomium van Newton met de coëfficiënten $1, 3, 3, 1$: $(x + h)^3 = x^3 + 3x^2h + 3xh^2 + h^3$.
    - opgave: |-
        Schrijf als macht van $x$: $\sqrt x$, $\frac{1}{x^2}$, $\frac{1}{\sqrt x}$.
      antwoord: |-
        $x^{\frac12}$; $x^{-2}$; $x^{-\frac12}$
      uitwerking: |-
        $x^{\frac12}$, $x^{-2}$, $x^{-\frac12}$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Een steen valt; na $t$ seconden heeft hij $s(t) = 5t^2$ meter afgelegd.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de gemiddelde snelheid tussen $t = 2$ en $t = 3$, tussen $2$ en $2{,}1$, en tussen $2$ en $2{,}01$.
      antwoord: |-
        $25$; $20{,}5$; $20{,}05$ m/s
      uitwerking: |-
        $\frac{45 - 20}{1} = 25$, $\frac{22{,}05 - 20}{0{,}1} = 20{,}5$ en $\frac{20{,}2005 - 20}{0{,}01} = 20{,}05$ m/s.
    - opgave: |-
        Welke snelheid heeft de steen op het ogenblik $t = 2$, denk je?
      antwoord: |-
        20 m/s
      uitwerking: |-
        De gemiddelde snelheden naderen $20$ m/s.

- id: h2-defpunt
  soort: kort
  opgave: |-
    Bereken met de definitie $f'(1)$, en geef de raaklijn in het punt met $x = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = x^2 - 4x$
      antwoord: |-
        $f'(1) = -2$; $y = -2x - 1$
      uitwerking: |-
        $f(1) = -3$. Het differentiequotiënt is $\dfrac{(1 + h)^2 - 4(1 + h) + 3}{h} = \dfrac{1 + 2h + h^2 - 4 - 4h + 3}{h} = \dfrac{h^2 - 2h}{h} = h - 2$ voor $h \neq 0$. Dus $f'(1) = \lim_{h \to 0}(h - 2) = -2$. Raaklijn: $y = -3 - 2(x - 1) = -2x - 1$.
    - opgave: |-
        $f(x) = x^3$
      antwoord: |-
        $f'(1) = 3$; $y = 3x - 2$
      uitwerking: |-
        $f(1) = 1$. Met het binomium is $(1 + h)^3 - 1 = 3h + 3h^2 + h^3$, dus het differentiequotiënt is $3 + 3h + h^2$ voor $h \neq 0$. Dan $f'(1) = 3$. Raaklijn: $y = 1 + 3(x - 1) = 3x - 2$.

- id: h2-definitie
  soort: kort
  opgave: |-
    Met de definitie.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $f'(1)$ voor $f(x) = x^2 + 3x$, en geef de raaklijn in $(1, 4)$.
      antwoord: |-
        $5$; $y = 5x - 1$
      uitwerking: |-
        $\frac{(1 + h)^2 + 3(1 + h) - 4}{h} = \frac{5h + h^2}{h} = 5 + h \to 5$. Raaklijn $y = 4 + 5(x - 1) = 5x - 1$.
    - opgave: |-
        Een bal heeft na $t$ seconden een hoogte $s(t) = 20t - 5t^2$ meter. Bereken $s'(1)$. Wat betekent het?
      antwoord: |-
        $10$ m/s
      uitwerking: |-
        $s(1) = 15$ en $\frac{20(1 + h) - 5(1 + h)^2 - 15}{h} = \frac{10h - 5h^2}{h} = 10 - 5h \to 10$. Na 1 s stijgt de bal met een snelheid van 10 m/s.

- id: h2-deffunctie
  soort: kort
  opgave: |-
    Bereken de afgeleide functie met de definitie.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = 3x^2 - x$
      antwoord: |-
        $6x - 1$
      uitwerking: |-
        $f(x + h) - f(x) = 3(x^2 + 2xh + h^2) - x - h - 3x^2 + x = 6xh + 3h^2 - h$. Delen door $h$: $6x + 3h - 1 \to 6x - 1$.
    - opgave: |-
        $f(x) = \dfrac{1}{x + 2}$
      antwoord: |-
        $-\frac{1}{(x + 2)^2}$
      uitwerking: |-
        Op één noemer: $\dfrac{1}{x + h + 2} - \dfrac{1}{x + 2} = \dfrac{-h}{(x + h + 2)(x + 2)}$. Delen door $h$ en $h \to 0$: $\dfrac{-1}{(x + 2)^2}$.
    - opgave: |-
        $f(x) = \dfrac{1}{x^2}$
      antwoord: |-
        $-\frac{2}{x^3}$
      uitwerking: |-
        $\dfrac{1}{(x + h)^2} - \dfrac{1}{x^2} = \dfrac{x^2 - (x + h)^2}{x^2(x + h)^2} = \dfrac{-2xh - h^2}{x^2(x + h)^2}$. Delen door $h$: $\dfrac{-2x - h}{x^2(x + h)^2} \to \dfrac{-2x}{x^4} = -\dfrac{2}{x^3}$.

- id: h2-functie
  soort: kort
  opgave: |-
    Bereken met de regel voor machten.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $x^7$
      antwoord: |-
        $7x^6$
      uitwerking: |-
        $7x^6$.
    - opgave: |-
        $\dfrac{1}{x^3}$
      antwoord: |-
        $-\frac{3}{x^4}$
      uitwerking: |-
        $(x^{-3})' = -3x^{-4}$.
    - opgave: |-
        $\sqrt[3]{x}$
      antwoord: |-
        $\frac{1}{3\sqrt[3]{x^2}}$
      uitwerking: |-
        $\bigl(x^{\frac13}\bigr)' = \frac13 x^{-\frac23}$.
    - opgave: |-
        $x\sqrt{x}$
      antwoord: |-
        $\frac32\sqrt x$
      uitwerking: |-
        $\bigl(x^{\frac32}\bigr)' = \frac32 x^{\frac12}$.

- id: h2-som
  soort: kort
  opgave: |-
    Bereken de afgeleide.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2x^5 - 4x^3 + x - 9$
      antwoord: |-
        $10x^4 - 12x^2 + 1$
      uitwerking: |-
        Term per term: $2 \cdot 5x^4 - 4 \cdot 3x^2 + 1 - 0 = 10x^4 - 12x^2 + 1$.
    - opgave: |-
        $6\sqrt{x} - \dfrac{2}{x^3}$
      antwoord: |-
        $\frac{3}{\sqrt x} + \frac{6}{x^4}$
      uitwerking: |-
        $6x^{\frac12} - 2x^{-3}$ geeft $3x^{-\frac12} + 6x^{-4} = \dfrac{3}{\sqrt x} + \dfrac{6}{x^4}$.
    - opgave: |-
        $\dfrac{x^2}{4} + \dfrac{4}{x^2}$
      antwoord: |-
        $\frac{x}{2} - \frac{8}{x^3}$
      uitwerking: |-
        $\frac14 x^2 + 4x^{-2}$ geeft $\frac12 x - 8x^{-3}$.
    - opgave: |-
        $\dfrac{2x + 1}{\sqrt{x}}$
      antwoord: |-
        $\frac{1}{\sqrt x} - \frac{1}{2x\sqrt x}$
      uitwerking: |-
        Splits de breuk: $2x^{\frac12} + x^{-\frac12}$. Afgeleide: $x^{-\frac12} - \frac12 x^{-\frac32} = \dfrac{1}{\sqrt x} - \dfrac{1}{2x\sqrt x}$.

- id: h2-product
  soort: kort
  opgave: |-
    Bereken de afgeleide met de productregel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(x^3 + 2)(x^2 - x)$
      antwoord: |-
        $5x^4 - 4x^3 + 4x - 2$
      uitwerking: |-
        $3x^2(x^2 - x) + (x^3 + 2)(2x - 1) = 3x^4 - 3x^3 + 2x^4 - x^3 + 4x - 2 = 5x^4 - 4x^3 + 4x - 2$.
    - opgave: |-
        $(x + 1)\sqrt{x}$
      antwoord: |-
        $\frac{3x + 1}{2\sqrt x}$
      uitwerking: |-
        $1 \cdot \sqrt x + (x + 1) \cdot \dfrac{1}{2\sqrt x} = \dfrac{2x + x + 1}{2\sqrt x} = \dfrac{3x + 1}{2\sqrt x}$.
    - opgave: |-
        $(1 - x^2)(1 + x^2)$
      antwoord: |-
        $-4x^3$
      uitwerking: |-
        $-2x(1 + x^2) + (1 - x^2) \cdot 2x = -2x - 2x^3 + 2x - 2x^3 = -4x^3$. Controle: $f(x) = 1 - x^4$.

- id: h2-quotient
  soort: kort
  opgave: |-
    Bereken de afgeleide met de quotiëntregel.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{x - 4}{x + 1}$
      antwoord: |-
        $\frac{5}{(x + 1)^2}$
      uitwerking: |-
        $\dfrac{1 \cdot (x + 1) - (x - 4) \cdot 1}{(x + 1)^2} = \dfrac{5}{(x + 1)^2}$.
    - opgave: |-
        $\dfrac{3x}{2 - x}$
      antwoord: |-
        $\frac{6}{(2 - x)^2}$
      uitwerking: |-
        De afgeleide van de noemer is $-1$: $\dfrac{3(2 - x) - 3x \cdot (-1)}{(2 - x)^2} = \dfrac{6}{(2 - x)^2}$.
    - opgave: |-
        $\dfrac{x^2 + 1}{x - 2}$
      antwoord: |-
        $\frac{x^2 - 4x - 1}{(x - 2)^2}$
      uitwerking: |-
        $\dfrac{2x(x - 2) - (x^2 + 1)}{(x - 2)^2} = \dfrac{x^2 - 4x - 1}{(x - 2)^2}$.

- id: h2-rekenregels
  soort: kort
  opgave: |-
    Bereken de afgeleide.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^5 - 3x^2 + 7$
      antwoord: |-
        $5x^4 - 6x$
      uitwerking: |-
        $5x^4 - 6x$.
    - opgave: |-
        $(2x - 1)(x^2 + 3)$
      antwoord: |-
        $6x^2 - 2x + 6$
      uitwerking: |-
        $2(x^2 + 3) + (2x - 1) \cdot 2x = 6x^2 - 2x + 6$.
    - opgave: |-
        $\dfrac{x^2}{x + 1}$
      antwoord: |-
        $\frac{x^2 + 2x}{(x + 1)^2}$
      uitwerking: |-
        $\frac{2x(x + 1) - x^2}{(x + 1)^2} = \frac{x^2 + 2x}{(x + 1)^2}$.

- id: h2-knik
  soort: kort
  opgave: |-
    Is $f$ afleidbaar in $a$? Gebruik het differentiequotiënt.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = |x - 2|$, $a = 2$. Is $f$ continu in $2$?
      antwoord: |-
        niet afleidbaar; wel continu
      uitwerking: |-
        $\dfrac{f(2 + h) - f(2)}{h} = \dfrac{|h|}{h}$: dat is $-1$ voor $h < 0$ en $1$ voor $h > 0$. De limiet bestaat niet: een knik in $(2, 0)$. Wel is $\lim_{x \to 2}|x - 2| = 0 = f(2)$, dus $f$ is continu.
    - opgave: |-
        $f(x) = x^2$ voor $x \leqslant 1$ en $f(x) = 2x$ voor $x > 1$, $a = 1$.
      antwoord: |-
        niet afleidbaar: niet continu
      uitwerking: |-
        $\liml{x}{1} f(x) = 1$ en $\limr{x}{1} f(x) = 2$: de grafiek maakt een sprong, dus $f$ is niet continu in $1$ en zeker niet afleidbaar.
    - opgave: |-
        $f(x) = x\,|x|$, $a = 0$.
      antwoord: |-
        afleidbaar, $f'(0) = 0$
      uitwerking: |-
        $\dfrac{f(h) - f(0)}{h} = \dfrac{h\,|h|}{h} = |h| \to 0$, langs links en langs rechts. Dus $f'(0) = 0$: geen knik, de raaklijn in $(0, 0)$ is de $x$-as.

- id: h2-dq
  soort: kort
  opgave: |-
    Het differentiequotiënt.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het differentiequotiënt van $f(x) = x^2 + 2x$ tussen $2$ en $2 + h$. Wat is het voor $h = 1$ en voor $h = -0{,}5$? Welk getal nadert het als $h$ naar $0$ gaat?
      antwoord: |-
        $6 + h$; $7$; $5{,}5$; $6$
      uitwerking: |-
        $f(2) = 8$ en $f(2 + h) = (2 + h)^2 + 2(2 + h) = 4 + 4h + h^2 + 4 + 2h = h^2 + 6h + 8$. Het differentiequotiënt is $\dfrac{h^2 + 6h + 8 - 8}{h} = \dfrac{h^2 + 6h}{h} = 6 + h$. Voor $h = 1$ is dat $7$, voor $h = -0{,}5$ is het $5{,}5$. Het nadert $6$.
    - opgave: |-
        De temperatuur in een oven is $T(t) = 20 + 30t$ graden na $t$ minuten (voor $0 \leqslant t \leqslant 6$). Bereken het differentiequotiënt tussen $t = 1$ en $t = 4$. Wat betekent het?
      antwoord: |-
        $30$ graden per minuut
      uitwerking: |-
        $\dfrac{T(4) - T(1)}{4 - 1} = \dfrac{140 - 50}{3} = 30$. Tussen de eerste en de vierde minuut stijgt de temperatuur gemiddeld $30$ graden per minuut. Omdat $T$ een eerstegraadsfunctie is, is dat op elk interval zo.

- id: h2-afgpunt
  soort: kort
  opgave: |-
    Bereken met de definitie.
  lijst: enumerate
  delen:
    - opgave: |-
        $f'(2)$ voor $f(x) = x^2 + x$
      antwoord: |-
        $5$
      uitwerking: |-
        $f(2) = 6$. $\dfrac{(2 + h)^2 + (2 + h) - 6}{h} = \dfrac{4h + h^2 + h}{h} = 5 + h \to 5$.
    - opgave: |-
        $f'(-1)$ voor $f(x) = 3x^2$
      antwoord: |-
        $-6$
      uitwerking: |-
        $f(-1) = 3$. $\dfrac{3(-1 + h)^2 - 3}{h} = \dfrac{3 - 6h + 3h^2 - 3}{h} = -6 + 3h \to -6$.
    - opgave: |-
        $f'(4)$ voor $f(x) = \dfrac{1}{x}$
      antwoord: |-
        $-\frac{1}{16}$
      uitwerking: |-
        $\dfrac{\frac{1}{4 + h} - \frac14}{h} = \dfrac{4 - (4 + h)}{4h(4 + h)} = \dfrac{-1}{4(4 + h)} \to -\dfrac{1}{16}$.

- id: h2-afgfunctie
  soort: kort
  opgave: |-
    Bereken de afgeleide functie met de definitie.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^2 - 5x$
      antwoord: |-
        $2x - 5$
      uitwerking: |-
        $f(x + h) - f(x) = x^2 + 2xh + h^2 - 5x - 5h - x^2 + 5x = 2xh + h^2 - 5h$. Delen door $h$: $2x + h - 5 \to 2x - 5$.
    - opgave: |-
        $f(x) = 4 - 3x^2$
      antwoord: |-
        $-6x$
      uitwerking: |-
        $f(x + h) - f(x) = 4 - 3x^2 - 6xh - 3h^2 - 4 + 3x^2 = -6xh - 3h^2$. Delen door $h$: $-6x - 3h \to -6x$.

- id: h2-machtn
  soort: kort
  opgave: |-
    Machten met een natuurlijke exponent.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de afgeleide van $x^9$ en van $x^{20}$.
      antwoord: |-
        $9x^8$; $20x^{19}$
      uitwerking: |-
        De exponent komt ervoor, en de nieuwe exponent is één kleiner: $9x^8$ en $20x^{19}$.
    - opgave: |-
        Bereken de richtingscoëfficiënt van de raaklijn aan de grafiek van $f(x) = x^5$ in het punt met $x = -1$.
      antwoord: |-
        $5$
      uitwerking: |-
        $f'(x) = 5x^4$, dus $f'(-1) = 5 \cdot 1 = 5$.
    - opgave: |-
        In welke punten van de grafiek van $f(x) = x^3$ heeft de raaklijn richtingscoëfficiënt $12$?
      antwoord: |-
        $(2, 8)$ en $(-2, -8)$
      uitwerking: |-
        $f'(x) = 3x^2 = 12 \iff x^2 = 4 \iff x = 2$ of $x = -2$. De punten zijn $(2, 8)$ en $(-2, -8)$.

- id: h2-veelvoud
  soort: kort
  opgave: |-
    Bereken de afgeleide.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $7x^3$
      antwoord: |-
        $21x^2$
      uitwerking: |-
        $7 \cdot 3x^2 = 21x^2$.
    - opgave: |-
        $\dfrac{x^4}{2}$
      antwoord: |-
        $2x^3$
      uitwerking: |-
        $\frac12 x^4$ geeft $\frac12 \cdot 4x^3 = 2x^3$.
    - opgave: |-
        $-\dfrac{3}{x^2}$
      antwoord: |-
        $\frac{6}{x^3}$
      uitwerking: |-
        $-3x^{-2}$ geeft $-3 \cdot (-2)x^{-3} = \dfrac{6}{x^3}$.
    - opgave: |-
        $6\sqrt[3]{x}$
      antwoord: |-
        $\frac{2}{\sqrt[3]{x^2}}$
      uitwerking: |-
        $6x^{\frac13}$ geeft $6 \cdot \frac13 x^{-\frac23} = 2x^{-\frac23} = \dfrac{2}{\sqrt[3]{x^2}}$.

- id: h2-negmacht
  soort: kort
  opgave: |-
    De afgeleide van $\dfrac{1}{g}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon met de quotiëntregel aan dat $\Bigl(\dfrac{1}{g}\Bigr)' = -\dfrac{g'}{g^2}$ als $g$ afleidbaar is en $g(x) \neq 0$.
      antwoord: |-
        teller $1$, met afgeleide $0$
      uitwerking: |-
        Quotiëntregel met teller $1$ en noemer $g$: $\Bigl(\dfrac{1}{g}\Bigr)' = \dfrac{0 \cdot g - 1 \cdot g'}{g^2} = -\dfrac{g'}{g^2}$.
    - opgave: |-
        Bereken daarmee de afgeleide van $\dfrac{1}{x^2 + 1}$ en van $\dfrac{1}{x^3 - 2x}$.
      antwoord: |-
        $-\frac{2x}{(x^2 + 1)^2}$; $-\frac{3x^2 - 2}{(x^3 - 2x)^2}$
      uitwerking: |-
        Met $g(x) = x^2 + 1$ en $g'(x) = 2x$: $-\dfrac{2x}{(x^2 + 1)^2}$. Met $g(x) = x^3 - 2x$ en $g'(x) = 3x^2 - 2$: $-\dfrac{3x^2 - 2}{(x^3 - 2x)^2}$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h2-o10
  soort: opdracht
  niveau: 1
  thema: |-
    drill: machten, som, product en quotiënt door elkaar
  opgave: |-
    Bereken de afgeleide.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^8 - 4x^2$
      antwoord: |-
        $8x^7 - 8x$
      uitwerking: |-
        Term per term: $8x^7 - 8x$.
    - opgave: |-
        $5x^3 - \dfrac{x^2}{2} + 3$
      antwoord: |-
        $15x^2 - x$
      uitwerking: |-
        $15x^2 - \frac12 \cdot 2x + 0 = 15x^2 - x$.
    - opgave: |-
        $\dfrac{2}{x} + 3\sqrt{x}$
      antwoord: |-
        $-\frac{2}{x^2} + \frac{3}{2\sqrt x}$
      uitwerking: |-
        $2x^{-1} + 3x^{\frac12}$ geeft $-2x^{-2} + \frac32 x^{-\frac12}$.
    - opgave: |-
        $\sqrt[4]{x^3}$
      antwoord: |-
        $\frac{3}{4\sqrt[4]{x}}$
      uitwerking: |-
        $\bigl(x^{\frac34}\bigr)' = \frac34 x^{-\frac14} = \dfrac{3}{4\sqrt[4]{x}}$.
    - opgave: |-
        $\dfrac{1}{2x^4}$
      antwoord: |-
        $-\frac{2}{x^5}$
      uitwerking: |-
        $\frac12 x^{-4}$ geeft $\frac12 \cdot (-4)x^{-5} = -2x^{-5}$.
    - opgave: |-
        $x^2(x^3 - 1)$
      antwoord: |-
        $5x^4 - 2x$
      uitwerking: |-
        Uitwerken: $x^5 - x^2$, dus $5x^4 - 2x$. Of met de productregel: $2x(x^3 - 1) + x^2 \cdot 3x^2$.
    - opgave: |-
        $(3x + 2)(x - 4)$
      antwoord: |-
        $6x - 10$
      uitwerking: |-
        Productregel: $3(x - 4) + (3x + 2) \cdot 1 = 6x - 10$.
    - opgave: |-
        $\dfrac{x}{x + 5}$
      antwoord: |-
        $\frac{5}{(x + 5)^2}$
      uitwerking: |-
        $\dfrac{1 \cdot (x + 5) - x \cdot 1}{(x + 5)^2} = \dfrac{5}{(x + 5)^2}$.
    - opgave: |-
        $\dfrac{1 - x}{1 + x}$
      antwoord: |-
        $-\frac{2}{(1 + x)^2}$
      uitwerking: |-
        $\dfrac{-1 \cdot (1 + x) - (1 - x) \cdot 1}{(1 + x)^2} = \dfrac{-2}{(1 + x)^2}$.
    - opgave: |-
        $\pi x^2 + \sqrt{2}\,x$
      antwoord: |-
        $2\pi x + \sqrt2$
      uitwerking: |-
        $\pi$ en $\sqrt 2$ zijn constanten: $2\pi x + \sqrt 2$.
    - opgave: |-
        $\dfrac{x^2 - 3}{x}$
      antwoord: |-
        $1 + \frac{3}{x^2}$
      uitwerking: |-
        Splitsen: $x - 3x^{-1}$, afgeleide $1 + 3x^{-2}$.
    - opgave: |-
        $(x^2 + 1)(x^2 - 1)$
      antwoord: |-
        $4x^3$
      uitwerking: |-
        Het product is $x^4 - 1$, dus $4x^3$.

- id: h2-o13
  soort: opdracht
  niveau: 1
  thema: |-
    differentiequotiënt en afgeleide in een punt
  figuur:
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.6cm,font=\scriptsize]
        \rooster{-1}{1}{4}{-1}{1}{4}
        \kromme{-.8}{3.2}{(\x)^2-2*\x}
        \draw[grijs] (1,-1) -- (3.5,4);
        \vol{(1,-1)} \vol{(3,3)}
        \node[below right] at (1,-1) {$P$};
        \node[right] at (3,3) {$Q$};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f(x) = x^2 - 2x$ met de koorde $PQ$ tussen $x = 1$ en $x = 3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het differentiequotiënt van $f$ tussen $1$ en $1 + h$ voor $h = 2$, $h = 0{,}5$ en $h = 0{,}1$.
      antwoord: |-
        $2$; $0{,}5$; $0{,}1$
      uitwerking: |-
        $f(1) = -1$. $\dfrac{f(3) - f(1)}{2} = \dfrac{3 + 1}{2} = 2$; $\dfrac{f(1{,}5) - f(1)}{0{,}5} = \dfrac{-0{,}75 + 1}{0{,}5} = 0{,}5$; $\dfrac{f(1{,}1) - f(1)}{0{,}1} = \dfrac{-0{,}99 + 1}{0{,}1} = 0{,}1$.
    - opgave: |-
        Welk getal is $f'(1)$, denk je? Wat zegt dat over de raaklijn in $P$?
      antwoord: |-
        $0$; de raaklijn is horizontaal
      uitwerking: |-
        De differentiequotiënten zijn telkens gelijk aan $h$, en naderen $0$. De raaklijn in $P(1, -1)$ is horizontaal: $y = -1$. $P$ is de top van de parabool.
    - opgave: |-
        Bewijs je vermoeden met de definitie.
      antwoord: |-
        $f'(1) = \lim_{h \to 0} h = 0$
      uitwerking: |-
        $f(1 + h) - f(1) = 1 + 2h + h^2 - 2 - 2h + 1 = h^2$, dus het differentiequotiënt is $\dfrac{h^2}{h} = h$ voor $h \neq 0$, en $f'(1) = \lim_{h \to 0} h = 0$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    raaklijn
  opgave: |-
    Geef de raaklijn aan de grafiek van $f$ in het punt met de gegeven $x$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^3 - 2x$, $x = 1$
      antwoord: |-
        $y = x - 2$
      uitwerking: |-
        $f(1) = -1$, $f'(x) = 3x^2 - 2$ en $f'(1) = 1$: $y = -1 + 1(x - 1) = x - 2$.
    - opgave: |-
        $f(x) = \sqrt{x}$, $x = 9$
      antwoord: |-
        $y = \frac16 x + \frac32$
      uitwerking: |-
        $f(9) = 3$, $f'(x) = \dfrac{1}{2\sqrt x}$ en $f'(9) = \frac16$: $y = 3 + \frac16(x - 9) = \frac16 x + \frac32$.
    - opgave: |-
        $f(x) = \dfrac{x}{x + 1}$, $x = 1$
      antwoord: |-
        $y = \frac14 x + \frac14$
      uitwerking: |-
        $f(1) = \frac12$, $f'(x) = \dfrac{(x + 1) - x}{(x + 1)^2} = \dfrac{1}{(x + 1)^2}$ en $f'(1) = \frac14$: $y = \frac12 + \frac14(x - 1) = \frac14 x + \frac14$.
    - opgave: |-
        $f(x) = (x^2 - 1)(x + 2)$, $x = 0$
      antwoord: |-
        $y = -x - 2$
      uitwerking: |-
        $f(0) = -2$, $f'(x) = 2x(x + 2) + (x^2 - 1)$ en $f'(0) = -1$: $y = -2 - x$.

- id: h2-o16
  soort: opdracht
  niveau: 1
  thema: |-
    betekenis van de afgeleide in een context
  opgave: |-
    Wat betekent het gegeven getal? Geef ook de eenheid.
  lijst: enumerate
  delen:
    - opgave: |-
        Een fles water koelt af in de koelkast. $T(t)$ is de temperatuur in °C na $t$ minuten, en $T'(10) = -0{,}8$.
      antwoord: |-
        na 10 min daalt de temperatuur met ongeveer 0,8 °C per minuut
      uitwerking: |-
        De eenheid is °C per minuut. Op het ogenblik $t = 10$ verandert de temperatuur met $-0{,}8$ °C per minuut: in de volgende minuut daalt ze met ongeveer $0{,}8$ °C. Het teken is negatief, want het water koelt af.
    - opgave: |-
        Een theater verkoopt $V(p)$ tickets bij een prijs van $p$ euro, en $V'(20) = -15$.
      antwoord: |-
        bij 20 euro: ongeveer 15 tickets minder per euro duurder
      uitwerking: |-
        De eenheid is tickets per euro. Bij een prijs van 20 euro verkoopt het theater ongeveer 15 tickets minder als de prijs met 1 euro stijgt.
    - opgave: |-
        $L(t)$ is de lengte van een kind in cm op de leeftijd van $t$ jaar, en $L'(8) = 6$.
      antwoord: |-
        op 8 jaar groeit het kind ongeveer 6 cm per jaar
      uitwerking: |-
        De eenheid is cm per jaar. Op 8 jaar groeit het kind met een snelheid van ongeveer 6 cm per jaar.

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    eerst herschrijven, dan afleiden
  opgave: |-
    Werk eerst uit of schrijf als een som van machten van $x$. Bereken dan de afgeleide.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{4}{x^3} - 2x$
      antwoord: |-
        $-\frac{12}{x^4} - 2$
      uitwerking: |-
        $4x^{-3} - 2x$ geeft $-12x^{-4} - 2$.
    - opgave: |-
        $\sqrt[3]{x^2}$
      antwoord: |-
        $\frac{2}{3\sqrt[3]{x}}$
      uitwerking: |-
        $\bigl(x^{\frac23}\bigr)' = \frac23 x^{-\frac13}$.
    - opgave: |-
        $(x - 1)^2$
      antwoord: |-
        $2x - 2$
      uitwerking: |-
        $x^2 - 2x + 1$ afleiden: $2x - 2$.
    - opgave: |-
        $\dfrac{x^3 + 1}{x}$
      antwoord: |-
        $2x - \frac{1}{x^2}$
      uitwerking: |-
        $x^2 + x^{-1}$ afleiden: $2x - x^{-2}$.
    - opgave: |-
        $\dfrac{x^2 - 2x}{\sqrt x}$
      antwoord: |-
        $\frac32\sqrt x - \frac{1}{\sqrt x}$
      uitwerking: |-
        $x^{\frac32} - 2x^{\frac12}$ afleiden: $\frac32 x^{\frac12} - x^{-\frac12}$.
    - opgave: |-
        $(2x + 1)^3$
      antwoord: |-
        $24x^2 + 24x + 6$
      uitwerking: |-
        Binomium: $8x^3 + 12x^2 + 6x + 1$, afgeleide $24x^2 + 24x + 6$.
    - opgave: |-
        $\dfrac{(x + 1)^2}{x^2}$
      antwoord: |-
        $-\frac{2}{x^2} - \frac{2}{x^3}$
      uitwerking: |-
        $\dfrac{x^2 + 2x + 1}{x^2} = 1 + 2x^{-1} + x^{-2}$, afgeleide $-2x^{-2} - 2x^{-3}$.
    - opgave: |-
        $\sqrt{x} \cdot \sqrt[3]{x}$
      antwoord: |-
        $\frac56 x^{-\frac16}$
      uitwerking: |-
        $x^{\frac12} \cdot x^{\frac13} = x^{\frac56}$, afgeleide $\frac56 x^{-\frac16} = \dfrac{5}{6\sqrt[6]{x}}$.

- id: h2-o14
  soort: opdracht
  niveau: 1
  thema: |-
    afgeleide en raaklijn aflezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
        \rooster{0}{1}{6}{0}{1}{6}
        \kromme{0}{6}{-(\x)^2/2+3*\x}
        \draw[grijs,thick] (0,2) -- (4,6);
        \draw[grijs,thick,dashed] (2,6) -- (6,2);
        \vol{(2,4)} \vol{(4,4)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f$ met de raaklijnen in de punten met $x = 2$ (volle lijn) en $x = 4$ (streepjeslijn).
  lijst: enumerate
  delen:
    - opgave: |-
        Lees $f(2)$ en $f(4)$ af.
      antwoord: |-
        $4$; $4$
      uitwerking: |-
        Beide punten liggen op hoogte $4$.
    - opgave: |-
        Lees $f'(2)$ en $f'(4)$ af.
      antwoord: |-
        $1$; $-1$
      uitwerking: |-
        $f'(2)$ is de richtingscoëfficiënt van de raaklijn in $(2, 4)$: die gaat door $(0, 2)$ en $(4, 6)$, dus $\frac{6 - 2}{4 - 0} = 1$. De raaklijn in $(4, 4)$ gaat door $(2, 6)$ en $(6, 2)$: $\frac{2 - 6}{6 - 2} = -1$.
    - opgave: |-
        Geef de vergelijking van beide raaklijnen.
      antwoord: |-
        $y = x + 2$; $y = -x + 8$
      uitwerking: |-
        $y = 4 + 1(x - 2) = x + 2$ en $y = 4 - (x - 4) = -x + 8$.
    - opgave: |-
        Voor welke $x$ is $f'(x) = 0$, denk je? Waarom?
      antwoord: |-
        $x = 3$
      uitwerking: |-
        In de top, bij $x = 3$, is de raaklijn horizontaal. Dat past bij de symmetrie: de raaklijnen in $x = 2$ en $x = 4$ hebben tegengestelde richtingscoëfficiënten.

- id: h2-o12
  soort: opdracht
  niveau: 1
  thema: |-
    afgeleide in een punt met de definitie
  opgave: |-
    Bereken $f'(a)$ met de definitie.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = 5 - 2x^2$, $a = 2$
      antwoord: |-
        $-8$
      uitwerking: |-
        $f(2) = -3$ en $f(2 + h) = 5 - 2(4 + 4h + h^2) = -3 - 8h - 2h^2$. Het differentiequotiënt is $\dfrac{-8h - 2h^2}{h} = -8 - 2h \to -8$.
    - opgave: |-
        $f(x) = x^3 + x$, $a = 0$
      antwoord: |-
        $1$
      uitwerking: |-
        $\dfrac{f(h) - f(0)}{h} = \dfrac{h^3 + h}{h} = h^2 + 1 \to 1$.
    - opgave: |-
        $f(x) = \dfrac1x$, $a = 2$
      antwoord: |-
        $-\frac14$
      uitwerking: |-
        $\dfrac{1}{2 + h} - \dfrac12 = \dfrac{2 - (2 + h)}{2(2 + h)} = \dfrac{-h}{2(2 + h)}$. Delen door $h$: $\dfrac{-1}{2(2 + h)} \to -\dfrac14$.
    - opgave: |-
        $f(x) = mx + q$, $a$ willekeurig
      antwoord: |-
        $m$
      uitwerking: |-
        $\dfrac{m(a + h) + q - ma - q}{h} = \dfrac{mh}{h} = m$. De raaklijn aan een rechte is de rechte zelf.

- id: h2-o15
  soort: opdracht
  niveau: 1
  thema: |-
    gemiddelde en ogenblikkelijke snelheid
  opgave: |-
    Een fietser vertrekt aan een verkeerslicht. Na $t$ seconden heeft ze $s(t) = 0{,}5t^2 + 4t$ meter afgelegd.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken haar gemiddelde snelheid in de eerste 4 seconden.
      antwoord: |-
        6 m/s
      uitwerking: |-
        $s(4) = 8 + 16 = 24$ en $s(0) = 0$: $\dfrac{24 - 0}{4 - 0} = 6$ m/s.
    - opgave: |-
        Geef de snelheid $v(t) = s'(t)$. Hoe snel rijdt ze na 4 seconden?
      antwoord: |-
        $v(t) = t + 4$; 8 m/s
      uitwerking: |-
        $v(t) = 0{,}5 \cdot 2t + 4 = t + 4$, dus $v(4) = 8$ m/s. Dat is meer dan het gemiddelde, want ze versnelt.
    - opgave: |-
        Wanneer rijdt ze 10 m/s (36 km/h)?
      antwoord: |-
        na 6 s
      uitwerking: |-
        $t + 4 = 10$ geeft $t = 6$ s.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    quotiëntregel
  opgave: |-
    Bereken de afgeleide met de quotiëntregel.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x^2 - 1}{x^2 + 1}$
      antwoord: |-
        $\frac{4x}{(x^2 + 1)^2}$
      uitwerking: |-
        $\frac{2x(x^2 + 1) - (x^2 - 1)2x}{(x^2 + 1)^2} = \frac{4x}{(x^2 + 1)^2}$.
    - opgave: |-
        $\dfrac{1}{x^2 + 4}$
      antwoord: |-
        $-\frac{2x}{(x^2 + 4)^2}$
      uitwerking: |-
        $\frac{0 \cdot (x^2 + 4) - 1 \cdot 2x}{(x^2 + 4)^2} = -\frac{2x}{(x^2 + 4)^2}$.
    - opgave: |-
        $\dfrac{5x}{x^2 - 1}$
      antwoord: |-
        $-\frac{5x^2 + 5}{(x^2 - 1)^2}$
      uitwerking: |-
        $\dfrac{5(x^2 - 1) - 5x \cdot 2x}{(x^2 - 1)^2} = \dfrac{-5x^2 - 5}{(x^2 - 1)^2}$.
    - opgave: |-
        $\dfrac{x^2 + x}{2x - 1}$
      antwoord: |-
        $\frac{2x^2 - 2x - 1}{(2x - 1)^2}$
      uitwerking: |-
        $\dfrac{(2x + 1)(2x - 1) - (x^2 + x) \cdot 2}{(2x - 1)^2} = \dfrac{4x^2 - 1 - 2x^2 - 2x}{(2x - 1)^2} = \dfrac{2x^2 - 2x - 1}{(2x - 1)^2}$.

- id: h2-o4
  soort: opdracht
  niveau: 2
  thema: |-
    met de definitie
  opgave: |-
    Bereken met de definitie.
  lijst: enumerate
  delen:
    - opgave: |-
        De afgeleide functie van $f(x) = x^2 - 3x$.
      antwoord: |-
        $2x - 3$
      uitwerking: |-
        $\frac{(x + h)^2 - 3(x + h) - x^2 + 3x}{h} = \frac{2xh + h^2 - 3h}{h} = 2x + h - 3 \to 2x - 3$.
    - opgave: |-
        De afgeleide functie van $g(x) = \sqrt x$ (gebruik de toegevoegde).
      antwoord: |-
        $\frac{1}{2\sqrt x}$
      uitwerking: |-
        $\frac{\sqrt{x + h} - \sqrt x}{h} = \frac{x + h - x}{h(\sqrt{x + h} + \sqrt x)} = \frac{1}{\sqrt{x + h} + \sqrt x} \to \frac{1}{2\sqrt x}$ (voor $x > 0$).
    - opgave: |-
        De afgeleide functie van $k(x) = x^3$.
      antwoord: |-
        $3x^2$
      uitwerking: |-
        $(x + h)^3 - x^3 = 3x^2h + 3xh^2 + h^3$. Delen door $h$: $3x^2 + 3xh + h^2 \to 3x^2$.
    - opgave: |-
        De afgeleide functie van $m(x) = \dfrac{1}{\sqrt x}$. Controleer met de regel voor machten.
      antwoord: |-
        $-\frac{1}{2x\sqrt x}$
      uitwerking: |-
        Op één noemer: $\dfrac{1}{\sqrt{x + h}} - \dfrac{1}{\sqrt x} = \dfrac{\sqrt x - \sqrt{x + h}}{\sqrt x\sqrt{x + h}}$. Met de toegevoegde wordt de teller $\dfrac{x - (x + h)}{\sqrt x + \sqrt{x + h}} = \dfrac{-h}{\sqrt x + \sqrt{x + h}}$. Delen door $h$: $\dfrac{-1}{\sqrt x\sqrt{x + h}\,(\sqrt x + \sqrt{x + h})} \to \dfrac{-1}{x \cdot 2\sqrt x}$. Controle: $\bigl(x^{-\frac12}\bigr)' = -\frac12 x^{-\frac32}$.

- id: h2-o23
  soort: opdracht
  niveau: 2
  thema: |-
    rekenregels met gegeven waarden
  opgave: |-
    Van twee afleidbare functies weet je: $f(1) = 2$, $f'(1) = -1$, $g(1) = 3$ en $g'(1) = 4$. Bereken de afgeleide in $1$ van
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f + g$
      antwoord: |-
        $3$
      uitwerking: |-
        $f'(1) + g'(1) = -1 + 4 = 3$.
    - opgave: |-
        $f \cdot g$
      antwoord: |-
        $5$
      uitwerking: |-
        $f'(1)g(1) + f(1)g'(1) = -3 + 8 = 5$.
    - opgave: |-
        $\dfrac{f}{g}$
      antwoord: |-
        $-\frac{11}{9}$
      uitwerking: |-
        $\dfrac{f'(1)g(1) - f(1)g'(1)}{g(1)^2} = \dfrac{-3 - 8}{9} = -\dfrac{11}{9}$.
    - opgave: |-
        $3f - g^2$
      antwoord: |-
        $-27$
      uitwerking: |-
        $g^2 = g \cdot g$ heeft als afgeleide $g'g + gg' = 2gg'$. Dus $3f'(1) - 2g(1)g'(1) = -3 - 24 = -27$.
    - opgave: |-
        $x^2 f(x)$
      antwoord: |-
        $3$
      uitwerking: |-
        $2x f(x) + x^2 f'(x)$ in $1$: $2 \cdot 2 + 1 \cdot (-1) = 3$.
    - opgave: |-
        $\dfrac{1}{f}$
      antwoord: |-
        $\frac14$
      uitwerking: |-
        Quotiëntregel met teller $1$: $\dfrac{0 \cdot f(1) - 1 \cdot f'(1)}{f(1)^2} = \dfrac{1}{4}$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    grafiek van de afgeleide kiezen
  opgave: |-
    De eerste figuur toont de grafiek van $f$. Welke van de grafieken A, B of C is de grafiek van $f'$? Reken niet.

    \figuren{\begin{tikzpicture}[x=.5cm,y=.4cm,font=\scriptsize]
      \rooster{-1}{1}{3}{-3}{1}{2}
      \kromme{-1}{3}{-(\x)^3/3+(\x)^2}
      \node[above,text=accent] at (2.4,2) {$f$};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.5cm,y=.4cm,font=\scriptsize]
      \rooster{-1}{1}{3}{-3}{1}{2}
      \kromme{-.7}{2.7}{(\x)^2-2*\x}
      \node[above,text=accent] at (2.4,2) {A};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.5cm,y=.4cm,font=\scriptsize]
      \rooster{-1}{1}{3}{-3}{1}{2}
      \kromme{0}{2.5}{2-2*\x}
      \node[above,text=accent] at (2.4,2) {B};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.5cm,y=.4cm,font=\scriptsize]
      \rooster{-1}{1}{3}{-3}{1}{2}
      \kromme{-1}{3}{-(\x)^2+2*\x}
      \node[above,text=accent] at (2.4,2) {C};
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        In welke punten is de raaklijn aan de grafiek van $f$ horizontaal? Wat betekent dat voor de grafiek van $f'$?
      antwoord: |-
        bij $x = 0$ en $x = 2$; daar snijdt $f'$ de $x$-as
      uitwerking: |-
        In het dal bij $x = 0$ en in de top bij $x = 2$ is de raaklijn horizontaal. Daar is $f'(x) = 0$: de grafiek van $f'$ snijdt de $x$-as in $0$ en $2$.
    - opgave: |-
        Kies de grafiek van $f'$ en verklaar je keuze.
      antwoord: |-
        C
      uitwerking: |-
        Tussen $0$ en $2$ stijgt $f$: de raaklijnen hebben een positieve richtingscoëfficiënt, dus $f'$ is daar positief. Links van $0$ en rechts van $2$ daalt $f$, dus is $f'$ negatief. Dat is grafiek C. Grafiek A heeft de juiste nulwaarden maar het verkeerde teken, en grafiek B is $0$ in $x = 1$, waar $f$ zeker geen horizontale raaklijn heeft.

- id: h2-o5
  soort: opdracht
  niveau: 2
  thema: |-
    horizontale raaklijnen
  opgave: |-
    In welke punten heeft de grafiek van $f(x) = x^3 - 3x^2 + 1$ een horizontale raaklijn?
  antwoord: |-
    $(0, 1)$ en $(2, -3)$
  uitwerking: |-
    Een horizontale raaklijn heeft richtingscoëfficiënt $0$. $f'(x) = 3x^2 - 6x = 3x(x - 2) = 0$ voor $x = 0$ en $x = 2$. $f(0) = 1$, $f(2) = 8 - 12 + 1 = -3$.

- id: h2-o20
  soort: opdracht
  niveau: 2
  thema: |-
    marginale kost
  opgave: |-
    Een bakkerij maakt $q$ taarten per week. De kosten zijn $K(q) = 0{,}01q^2 + 5q + 200$ euro. De afgeleide $K'(q)$ heet de \textit{marginale kost}.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $K'(q)$ en $K'(100)$.
      antwoord: |-
        $K'(q) = 0{,}02q + 5$; $K'(100) = 7$ euro per taart
      uitwerking: |-
        $K'(q) = 0{,}02q + 5$, dus $K'(100) = 2 + 5 = 7$ euro per taart.
    - opgave: |-
        Bereken $K(101) - K(100)$, wat de 101ste taart extra kost. Vergelijk met $K'(100)$.
      antwoord: |-
        $7{,}01$ euro: bijna $K'(100)$
      uitwerking: |-
        $K(101) - K(100) = 0{,}01(10\,201 - 10\,000) + 5 = 2{,}01 + 5 = 7{,}01$ euro. Dat is het differentiequotiënt met $h = 1$, en ligt dus dicht bij $K'(100) = 7$.
    - opgave: |-
        Bereken de gemiddelde kost per taart bij $q = 100$. Waarom verschilt die van $K'(100)$?
      antwoord: |-
        8 euro
      uitwerking: |-
        $\dfrac{K(100)}{100} = \dfrac{100 + 500 + 200}{100} = 8$ euro. Daarin zitten ook de vaste kosten van 200 euro, verdeeld over alle taarten. De marginale kost zegt alleen wat één taart extra kost.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    drill: rekenregels door elkaar, vereenvoudigen
  opgave: |-
    Bereken de afgeleide en vereenvoudig zo ver mogelijk. Kijk eerst of je het voorschrift kunt vereenvoudigen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(x^2 - 3x)(2x^3 + x)$
      antwoord: |-
        $10x^4 - 24x^3 + 3x^2 - 6x$
      uitwerking: |-
        Uitwerken: $2x^5 - 6x^4 + x^3 - 3x^2$, afgeleide $10x^4 - 24x^3 + 3x^2 - 6x$.
    - opgave: |-
        $\dfrac{x^2 + 3}{x^2 - 3}$
      antwoord: |-
        $\frac{-12x}{(x^2 - 3)^2}$
      uitwerking: |-
        $\dfrac{2x(x^2 - 3) - (x^2 + 3)2x}{(x^2 - 3)^2} = \dfrac{-12x}{(x^2 - 3)^2}$.
    - opgave: |-
        $\sqrt{x}\,(x - 2)$
      antwoord: |-
        $\frac{3x - 2}{2\sqrt x}$
      uitwerking: |-
        $x^{\frac32} - 2x^{\frac12}$ geeft $\frac32\sqrt x - \dfrac{1}{\sqrt x} = \dfrac{3x - 2}{2\sqrt x}$.
    - opgave: |-
        $\dfrac{\sqrt{x}}{x + 1}$
      antwoord: |-
        $\frac{1 - x}{2\sqrt x\,(x + 1)^2}$
      uitwerking: |-
        $\dfrac{\frac{1}{2\sqrt x}(x + 1) - \sqrt x}{(x + 1)^2}$. Maal $2\sqrt x$ boven en onder: $\dfrac{x + 1 - 2x}{2\sqrt x\,(x + 1)^2} = \dfrac{1 - x}{2\sqrt x\,(x + 1)^2}$.
    - opgave: |-
        $\dfrac{x^3}{x^2 + 1}$
      antwoord: |-
        $\frac{x^4 + 3x^2}{(x^2 + 1)^2}$
      uitwerking: |-
        $\dfrac{3x^2(x^2 + 1) - x^3 \cdot 2x}{(x^2 + 1)^2} = \dfrac{x^4 + 3x^2}{(x^2 + 1)^2}$.
    - opgave: |-
        $\dfrac{2x - 1}{x^2 + x + 1}$
      antwoord: |-
        $\frac{-2x^2 + 2x + 3}{(x^2 + x + 1)^2}$
      uitwerking: |-
        $\dfrac{2(x^2 + x + 1) - (2x - 1)(2x + 1)}{(x^2 + x + 1)^2} = \dfrac{2x^2 + 2x + 2 - 4x^2 + 1}{(x^2 + x + 1)^2} = \dfrac{-2x^2 + 2x + 3}{(x^2 + x + 1)^2}$.
    - opgave: |-
        $x(x + 1)(x + 2)$
      antwoord: |-
        $3x^2 + 6x + 2$
      uitwerking: |-
        Uitwerken: $x^3 + 3x^2 + 2x$, afgeleide $3x^2 + 6x + 2$.
    - opgave: |-
        $\dfrac{1}{x^3 - x}$
      antwoord: |-
        $\frac{1 - 3x^2}{(x^3 - x)^2}$
      uitwerking: |-
        Teller $1$: $\dfrac{0 - 1 \cdot (3x^2 - 1)}{(x^3 - x)^2} = \dfrac{1 - 3x^2}{(x^3 - x)^2}$.
    - opgave: |-
        $\Bigl(x + \dfrac1x\Bigr)^2$
      antwoord: |-
        $2x - \frac{2}{x^3}$
      uitwerking: |-
        Uitwerken: $x^2 + 2 + x^{-2}$, afgeleide $2x - 2x^{-3}$.
    - opgave: |-
        $\dfrac{x^2 - 4}{x + 2}$
      antwoord: |-
        $1$ (voor $x \neq -2$)
      uitwerking: |-
        Eerst vereenvoudigen: $\dfrac{(x - 2)(x + 2)}{x + 2} = x - 2$ voor $x \neq -2$. De afgeleide is $1$. Met de quotiëntregel kom je er ook, maar langer.
    - opgave: |-
        $\dfrac{ax + b}{cx + d}$
      antwoord: |-
        $\frac{ad - bc}{(cx + d)^2}$
      uitwerking: |-
        $\dfrac{a(cx + d) - (ax + b)c}{(cx + d)^2} = \dfrac{ad - bc}{(cx + d)^2}$.
    - opgave: |-
        $\dfrac{x^2 + \sqrt x}{x}$
      antwoord: |-
        $1 - \frac{1}{2x\sqrt x}$
      uitwerking: |-
        Splitsen: $x + x^{-\frac12}$, afgeleide $1 - \frac12 x^{-\frac32} = 1 - \dfrac{1}{2x\sqrt x}$.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    waar zit de fout? klassieke fouten met de rekenregels
  opgave: |-
    Elke berekening bevat een fout. Waar zit de fout? Geef de juiste afgeleide.
  lijst: enumerate
  delen:
    - opgave: |-
        $\bigl(x^2 \cdot x^3\bigr)' = 2x \cdot 3x^2 = 6x^3$
      antwoord: |-
        $5x^4$
      uitwerking: |-
        De afgeleide van een product is niet het product van de afgeleiden. Productregel: $2x \cdot x^3 + x^2 \cdot 3x^2 = 5x^4$. Of eenvoudiger: $x^2 \cdot x^3 = x^5$.
    - opgave: |-
        $\Bigl(\dfrac{x}{x + 1}\Bigr)' = \dfrac{x \cdot 1 - (x + 1) \cdot 1}{(x + 1)^2} = \dfrac{-1}{(x + 1)^2}$
      antwoord: |-
        $\frac{1}{(x + 1)^2}$
      uitwerking: |-
        De termen in de teller staan in de verkeerde volgorde. Het is teller afgeleid maal noemer min teller maal noemer afgeleid: $\dfrac{1 \cdot (x + 1) - x \cdot 1}{(x + 1)^2} = \dfrac{1}{(x + 1)^2}$. De functie stijgt dus, en dat zie je ook als je $x = 0$ en $x = 1$ invult.
    - opgave: |-
        $\Bigl(\dfrac{1}{x^2}\Bigr)' = \dfrac{1}{2x}$
      antwoord: |-
        $-\frac{2}{x^3}$
      uitwerking: |-
        Je mag de noemer niet apart afleiden. Schrijf $x^{-2}$: de afgeleide is $-2x^{-3} = -\dfrac{2}{x^3}$.
    - opgave: |-
        $\bigl((x^2 + 1)^2\bigr)' = 2(x^2 + 1)$
      antwoord: |-
        $4x^3 + 4x$
      uitwerking: |-
        De regel voor machten geldt voor $x^r$, niet voor een macht van een andere functie. Werk uit: $x^4 + 2x^2 + 1$, met afgeleide $4x^3 + 4x$. Of met de productregel op $(x^2 + 1)(x^2 + 1)$: $2 \cdot 2x(x^2 + 1)$. In hoofdstuk 3 leer je hiervoor de kettingregel.

- id: h2-o6
  soort: opdracht
  niveau: 2
  thema: |-
    evenwijdige raaklijn
  opgave: |-
    In welk punt is de raaklijn aan de parabool $y = x^2$ evenwijdig met de rechte $y = 4x - 1$? Geef die raaklijn.
  antwoord: |-
    $(2, 4)$; $y = 4x - 4$
  uitwerking: |-
    Evenwijdig: richtingscoëfficiënt $4$. $2x = 4$ geeft $x = 2$, het punt $(2, 4)$. Raaklijn $y = 4 + 4(x - 2) = 4x - 4$.

- id: h2-o24
  soort: opdracht
  niveau: 2
  thema: |-
    afgeleide schatten uit een tabel
  opgave: |-
    Een kop thee koelt af. Om de 5 minuten meet je de temperatuur.

    \medskip
    {\renewcommand{\arraystretch}{1.2}\begin{tabular}{c|ccccc}
    $t$ (min) & 0 & 5 & 10 & 15 & 20 \\ \hline
    $T$ (°C) & 90 & 74 & 62 & 53 & 46
    \end{tabular}}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de gemiddelde verandering van de temperatuur in de eerste 20 minuten.
      antwoord: |-
        $-2{,}2$ °C per minuut
      uitwerking: |-
        $\dfrac{T(20) - T(0)}{20 - 0} = \dfrac{46 - 90}{20} = -2{,}2$ °C per minuut.
    - opgave: |-
        Schat $T'(10)$ met de metingen op 5 en 15 minuten. Wat betekent het getal?
      antwoord: |-
        $\approx -2{,}1$ °C per minuut
      uitwerking: |-
        $T'(10) \approx \dfrac{T(15) - T(5)}{15 - 5} = \dfrac{53 - 74}{10} = -2{,}1$. Na 10 minuten daalt de temperatuur met ongeveer $2{,}1$ °C per minuut.
    - opgave: |-
        Wanneer koelt de thee het snelst af, denk je? Waarom?
      antwoord: |-
        bij het begin
      uitwerking: |-
        De dalingen per 5 minuten zijn $16$, $12$, $9$ en $7$ °C: ze worden kleiner. De thee koelt het snelst af bij het begin, als ze het warmst is.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    grafiek van de afgeleide tekenen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
        \rooster{-3}{1}{4}{-2}{1}{3}
        \draw[accent,thick] (-3,1) -- (-1,3) -- (2,3) -- (4,-1);
        \vol{(-3,1)} \vol{(4,-1)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van een functie $f$ op $[-3, 4]$, opgebouwd uit lijnstukken.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de grafiek van $f'$.
      antwoord: |-
        $1$ op $\left]-3, -1\right[$, $0$ op $\left]-1, 2\right[$, $-2$ op $\left]2, 4\right[$
      uitwerking: |-
        Op elk lijnstuk is de afgeleide de richtingscoëfficiënt: $\frac{3 - 1}{-1 + 3} = 1$, dan $0$, dan $\frac{-1 - 3}{4 - 2} = -2$. De grafiek van $f'$ bestaat uit drie horizontale lijnstukken, zonder de eindpunten.
        \figuren{\begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
          \rooster{-3}{1}{4}{-2}{1}{3}
          \draw[accent,thick] (-3,1) -- (-1,1) (-1,0) -- (2,0) (2,-2) -- (4,-2);
          \open{(-1,1)} \open{(-1,0)} \open{(2,0)} \open{(2,-2)}
          \node[above,text=accent] at (-2,1) {$f'$};
        \end{tikzpicture}}
    - opgave: |-
        In welke punten van $\left]-3, 4\right[$ is $f$ niet afleidbaar? Is $f$ daar continu?
      antwoord: |-
        in $-1$ en $2$; wel continu
      uitwerking: |-
        In $x = -1$ en $x = 2$ heeft de grafiek een knik: de richtingscoëfficiënt links en rechts verschilt ($1$ en $0$, en $0$ en $-2$), dus het differentiequotiënt heeft geen limiet. De grafiek maakt er geen sprong, dus $f$ is er wel continu.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    een worp omhoog
  opgave: |-
    Een bal wordt omhoog gegooid; zijn hoogte is $s(t) = -5t^2 + 20t + 2$ meter na $t$ seconden.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de snelheid $v(t) = s'(t)$. Hoe snel gaat de bal na 1 s? En na 3 s?
      antwoord: |-
        $v(t) = -10t + 20$; $10$ m/s; $-10$ m/s
      uitwerking: |-
        $v(t) = -10t + 20$, dus $v(1) = 10$ m/s (omhoog) en $v(3) = -10$ m/s (omlaag): het teken geeft de richting.
    - opgave: |-
        Wanneer is de bal op zijn hoogste punt, en hoe hoog is dat?
      antwoord: |-
        na 2 s, 22 m
      uitwerking: |-
        Op het hoogste punt is de snelheid $0$: $-10t + 20 = 0$ geeft $t = 2$, en $s(2) = -20 + 40 + 2 = 22$ m.

- id: h2-o21
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijnen met een gegeven richting
  opgave: |-
    Zoek de raaklijnen.
  lijst: enumerate
  delen:
    - opgave: |-
        De raaklijnen aan de grafiek van $f(x) = x^3 - 3x$ die evenwijdig zijn met de rechte \mbox{$y = 9x$}.
      antwoord: |-
        $y = 9x - 16$ en $y = 9x + 16$
      uitwerking: |-
        Richtingscoëfficiënt $9$: $3x^2 - 3 = 9$, dus $x^2 = 4$ en $x = \pm 2$. $f(2) = 2$ geeft $y = 2 + 9(x - 2) = 9x - 16$; $f(-2) = -2$ geeft $y = -2 + 9(x + 2) = 9x + 16$.
    - opgave: |-
        De raaklijnen aan de grafiek van $f(x) = \dfrac1x$ die loodrecht staan op de rechte $y = 4x$.
      antwoord: |-
        $y = -\frac14 x + 1$ en $y = -\frac14 x - 1$
      uitwerking: |-
        Loodrecht op een rechte met richtingscoëfficiënt $4$: richtingscoëfficiënt $-\frac14$. Dus $-\dfrac{1}{x^2} = -\dfrac14$, en dat geeft $x = \pm 2$. In $\bigl(2, \frac12\bigr)$: $y = \frac12 - \frac14(x - 2) = -\frac14 x + 1$. In $\bigl(-2, -\frac12\bigr)$: $y = -\frac12 - \frac14(x + 2) = -\frac14 x - 1$.

- id: h2-o27
  soort: opdracht
  niveau: 3
  thema: |-
    rekenregels en machtregel bewijzen
  opgave: |-
    Bewijs, zonder de quotiëntregel te gebruiken waar het niet mag.
  lijst: enumerate
  delen:
    - opgave: |-
        De quotiëntregel, uit de productregel. Stel $q = \dfrac{f}{g}$, zodat $f = q \cdot g$, en neem aan dat $q$ afleidbaar is.
      antwoord: |-
        bewijs
      uitwerking: |-
        Leid $f = q \cdot g$ af met de productregel: $f' = q'g + qg'$. Dus $q' = \dfrac{f' - qg'}{g} = \dfrac{f' - \frac{f}{g}g'}{g} = \dfrac{f'g - fg'}{g^2}$.
    - opgave: |-
        De regel voor machten met een negatieve gehele exponent: $(x^{-n})' = -n\,x^{-n-1}$ voor $n \in \mathbb{N}$, als je hem al kent voor $x^n$.
      antwoord: |-
        bewijs
      uitwerking: |-
        $x^{-n} = \dfrac{1}{x^n}$. Quotiëntregel: $\dfrac{0 \cdot x^n - 1 \cdot nx^{n-1}}{x^{2n}} = -n\,x^{n - 1 - 2n} = -n\,x^{-n-1}$.
    - opgave: |-
        De regel voor $\sqrt x$: leid $\sqrt x \cdot \sqrt x = x$ af met de productregel (neem aan dat $\sqrt x$ afleidbaar is voor $x > 0$).
      antwoord: |-
        $(\sqrt x)' = \frac{1}{2\sqrt x}$
      uitwerking: |-
        Productregel links, afgeleide van $x$ rechts: $(\sqrt x)'\sqrt x + \sqrt x(\sqrt x)' = 1$, dus $2\sqrt x\,(\sqrt x)' = 1$ en $(\sqrt x)' = \dfrac{1}{2\sqrt x} = \frac12 x^{-\frac12}$.

- id: h2-o8
  soort: opdracht
  niveau: 3
  thema: |-
    raaklijn door een punt
  opgave: |-
    Zoek de raaklijnen aan de parabool $y = x^2$ die door het punt $(1, -3)$ gaan. Tip: neem een raakpunt $(a, a^2)$.
  antwoord: |-
    $y = 6x - 9$ en $y = -2x - 1$
  uitwerking: |-
    De raaklijn in $(a, a^2)$ is $y = a^2 + 2a(x - a) = 2ax - a^2$. Ze gaat door $(1, -3)$ als $-3 = 2a - a^2$, dus $a^2 - 2a - 3 = 0$ en $a = 3$ of $a = -1$. Raaklijnen $y = 6x - 9$ en $y = -2x - 1$. Het punt $(1, -3)$ ligt onder de parabool, daarom zijn er twee.

- id: h2-o28
  soort: opdracht
  niveau: 3
  thema: |-
    continu maar niet afleidbaar
  opgave: |-
    Afleidbaar of niet?
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $f(x) = \sqrt[3]{x}$ continu is in $0$, maar niet afleidbaar. Hoe ziet de raaklijn in de oorsprong eruit?
      antwoord: |-
        het differentiequotiënt gaat naar $+\infty$; verticale raaklijn
      uitwerking: |-
        $\lim_{x \to 0} \sqrt[3]{x} = 0 = f(0)$: continu. $\dfrac{f(h) - f(0)}{h} = \dfrac{h^{\frac13}}{h} = \dfrac{1}{h^{\frac23}} = \dfrac{1}{\sqrt[3]{h^2}}$, en dat gaat naar $+\infty$ voor $h \to 0$, langs beide kanten. Er is geen afgeleide, maar de koorden worden steeds steiler: de raaklijn is de verticale rechte $x = 0$.
    - opgave: |-
        Is $g(x) = x^2\,|x|$ afleidbaar in $0$? En $k(x) = |x^2 - 1|$ in $1$?
      antwoord: |-
        $g$: ja, $g'(0) = 0$; $k$: nee
      uitwerking: |-
        $\dfrac{g(h) - g(0)}{h} = h\,|h| \to 0$: afleidbaar met $g'(0) = 0$. Voor $k$: $k(1 + h) = |2h + h^2| = |h|\,|2 + h|$, dus $\dfrac{k(1 + h) - k(1)}{h} = \dfrac{|h|}{h}\,|2 + h|$. Dat nadert $-2$ langs links en $2$ langs rechts: niet afleidbaar, er is een knik.
    - opgave: |-
        Geef een voorschrift van een functie die overal continu is, maar niet afleidbaar in $1$ en in $3$.
      antwoord: |-
        bv. $|x - 1| + |x - 3|$
      uitwerking: |-
        Bijvoorbeeld $f(x) = |x - 1| + |x - 3|$. Die is continu als som van continue functies. In $1$ is $|x - 3|$ afleidbaar, maar $|x - 1|$ niet: de som is dan niet afleidbaar (anders was $|x - 1| = f(x) - |x - 3|$ het wel). Net zo in $3$. De grafiek heeft knikken in $(1, 2)$ en $(3, 2)$.

- id: h2-o26
  soort: opdracht
  niveau: 3
  thema: |-
    raaklijnen aan een hyperbool: een constante oppervlakte
  figuur:
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.55cm,font=\scriptsize]
        \rooster{0}{1}{5}{0}{1}{3}
        \kromme{.34}{5}{1/\x}
        \draw[grijs,thick] (0,2) -- (2,0);
        \draw[grijs,thick,dashed] (0,1) -- (4,0);
        \vol{(1,1)} \vol{(2,.5)}
      \end{tikzpicture}
  opgave: |-
    Neem de grafiek van $f(x) = \dfrac1x$ voor $x > 0$, en een punt $P\bigl(a, \frac1a\bigr)$ erop. De figuur toont de raaklijnen voor $a = 1$ en $a = 2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de raaklijn in $P$ de vergelijking $y = -\dfrac{x}{a^2} + \dfrac2a$ heeft.
      antwoord: |-
        $y = \frac1a - \frac{1}{a^2}(x - a)$
      uitwerking: |-
        $f'(x) = -\dfrac{1}{x^2}$, dus $f'(a) = -\dfrac{1}{a^2}$. Raaklijn: $y = \dfrac1a - \dfrac{1}{a^2}(x - a) = -\dfrac{x}{a^2} + \dfrac1a + \dfrac1a$.
    - opgave: |-
        De raaklijn snijdt de assen in $A$ en $B$. Toon aan dat de driehoek $OAB$ altijd dezelfde oppervlakte heeft.
      antwoord: |-
        $A(2a, 0)$, $B\bigl(0, \frac2a\bigr)$; oppervlakte 2
      uitwerking: |-
        $y = 0$ geeft $x = 2a$, dus $A(2a, 0)$. $x = 0$ geeft $B\bigl(0, \frac2a\bigr)$. De oppervlakte is $\frac12 \cdot 2a \cdot \frac2a = 2$, onafhankelijk van $a$.
    - opgave: |-
        Toon aan dat $P$ het midden is van $[AB]$.
      antwoord: |-
        midden $\bigl(a, \frac1a\bigr)$
      uitwerking: |-
        Het midden van $A(2a, 0)$ en $B\bigl(0, \frac2a\bigr)$ is $\Bigl(\frac{2a}{2}, \frac{2/a}{2}\Bigr) = \bigl(a, \frac1a\bigr) = P$.

- id: h2-o9
  soort: opdracht
  niveau: 3
  thema: |-
    afleidbaar maken
  opgave: |-
    $f(x) = x^2$ voor $x \leqslant 1$ en $f(x) = ax + b$ voor $x > 1$. Bepaal $a$ en $b$ zodat $f$ afleidbaar is in $1$ (de grafiek heeft dan geen knik).
  antwoord: |-
    $a = 2$, $b = -1$
  uitwerking: |-
    Een afleidbare functie is continu, dus de linker- en rechterlimiet in $1$ zijn gelijk: $1 = a + b$. Het differentiequotiënt heeft links de limiet $2 \cdot 1 = 2$ (de afgeleide van $x^2$) en rechts $a$, dus $a = 2$. Dan is $b = -1$: de rechte $y = 2x - 1$ is de raaklijn aan de parabool in $(1, 1)$.

- id: h2-o29
  soort: opdracht
  niveau: 3
  thema: |-
    gemeenschappelijke raaklijn van twee parabolen
  opgave: |-
    Zoek alle rechten die raken aan de parabool $y = x^2$ én aan de parabool $y = -x^2 - 8$. Tip: neem een raakpunt $(a, a^2)$ op de eerste en $(b, -b^2 - 8)$ op de tweede, en stel de twee raaklijnen gelijk.
  antwoord: |-
    $y = 4x - 4$ en $y = -4x - 4$
  uitwerking: |-
    De raaklijn aan $y = x^2$ in $(a, a^2)$ is $y = 2ax - a^2$. De raaklijn aan $y = -x^2 - 8$ in $(b, -b^2 - 8)$ is $y = -b^2 - 8 - 2b(x - b) = -2bx + b^2 - 8$. Gelijke rechten: $2a = -2b$ en $-a^2 = b^2 - 8$. Dus $b = -a$ en $-a^2 = a^2 - 8$, zodat $a^2 = 4$ en $a = \pm 2$. Voor $a = 2$: $y = 4x - 4$ (raakt de tweede in $(-2, -12)$). Voor $a = -2$: $y = -4x - 4$ (raakt de tweede in $(2, -12)$).

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 1
  koppel:
    rubriek: analyse
    onderwerp: Integralen
  thema: |-
    een primitieve controleren
  opgave: |-
    Een primitieve van $f$ is een functie $F$ met $F' = f$. Controleer dat $F(x) = \frac{x^3}{3} - x + 5$ een primitieve is van $f(x) = x^2 - 1$. Geef nog een andere primitieve.
  antwoord: |-
    $F'(x) = x^2 - 1$; bv. $\frac{x^3}{3} - x$
  uitwerking: |-
    $F'(x) = x^2 - 1$. Elke constante mag je veranderen: $\frac{x^3}{3} - x$ is ook een primitieve.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Rationale functies
  thema: |-
    toppen van een rationale functie
  opgave: |-
    Waar heeft de grafiek van $f(x) = \dfrac{x^2 + 1}{x}$ een horizontale raaklijn?
  antwoord: |-
    $(1, 2)$ en $(-1, -2)$
  uitwerking: |-
    $f(x) = x + \frac1x$, $f'(x) = 1 - \frac{1}{x^2} = 0$ voor $x = \pm 1$. Punten $(1, 2)$ en $(-1, -2)$.

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    definitie
  opgave: |-
    Bereken met de definitie $f'(1)$ voor $f(x) = 2x^2$.
  antwoord: |-
    4
  uitwerking: |-
    $f(1) = 2$ en $f(1 + h) = 2 + 4h + 2h^2$. Het differentiequotiënt is $\frac{4h + 2h^2}{h} = 4 + 2h$ voor $h \neq 0$, en $f'(1) = \lim_{h \to 0}(4 + 2h) = 4$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    raaklijn
  opgave: |-
    Geef de raaklijn aan de grafiek van $f(x) = x^3$ in het punt met $x = 2$.
  antwoord: |-
    $y = 12x - 16$
  uitwerking: |-
    $f(2) = 8$, $f'(x) = 3x^2$ en $f'(2) = 12$: $y = 8 + 12(x - 2) = 12x - 16$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    machten
  opgave: |-
    Bereken de afgeleide van $f(x) = 5x^3 - 4\sqrt x + \dfrac2x$.
  antwoord: |-
    $15x^2 - \frac{2}{\sqrt x} - \frac{2}{x^2}$
  uitwerking: |-
    Als machten: $5x^3 - 4x^{\frac12} + 2x^{-1}$. Afgeleide: $15x^2 - 4 \cdot \frac{1}{2\sqrt x} - 2x^{-2} = 15x^2 - \frac{2}{\sqrt x} - \frac{2}{x^2}$.

- id: h2-t4
  soort: test
  niveau: 1
  thema: |-
    productregel
  opgave: |-
    Bereken de afgeleide van $f(x) = (x^2 - 2)(3x + 1)$ met de productregel.
  antwoord: |-
    $9x^2 + 2x - 6$
  uitwerking: |-
    $2x(3x + 1) + (x^2 - 2) \cdot 3 = 6x^2 + 2x + 3x^2 - 6 = 9x^2 + 2x - 6$.

- id: h2-t5
  soort: test
  niveau: 2
  thema: |-
    quotiëntregel
  opgave: |-
    Bereken de afgeleide van $f(x) = \dfrac{3x}{x^2 + 1}$.
  antwoord: |-
    $\frac{3 - 3x^2}{(x^2 + 1)^2}$
  uitwerking: |-
    $\frac{3(x^2 + 1) - 3x \cdot 2x}{(x^2 + 1)^2} = \frac{3 - 3x^2}{(x^2 + 1)^2}$.

- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    snelheid
  opgave: |-
    Een auto remt af. Na $t$ seconden heeft hij $s(t) = 20t - 2t^2$ meter afgelegd, tot hij stilstaat.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de gemiddelde snelheid in de eerste 2 seconden.
      antwoord: |-
        16 m/s
      uitwerking: |-
        $s(2) = 40 - 8 = 32$, dus $\dfrac{32 - 0}{2} = 16$ m/s.
    - opgave: |-
        Bereken de snelheid na 2 seconden.
      antwoord: |-
        12 m/s
      uitwerking: |-
        $v(t) = s'(t) = 20 - 4t$, dus $v(2) = 12$ m/s.
    - opgave: |-
        Na hoeveel seconden staat de auto stil? Hoeveel meter heeft hij dan afgelegd?
      antwoord: |-
        na 5 s; 50 m
      uitwerking: |-
        $20 - 4t = 0$ geeft $t = 5$ s, en $s(5) = 100 - 50 = 50$ m.

- id: h2-t7
  soort: test
  niveau: 2
  thema: |-
    afgeleide functie met de definitie
  opgave: |-
    Bereken met de definitie de afgeleide functie van $f(x) = \dfrac{3}{x}$.
  antwoord: |-
    $-\frac{3}{x^2}$
  uitwerking: |-
    $\dfrac{3}{x + h} - \dfrac3x = \dfrac{3x - 3(x + h)}{x(x + h)} = \dfrac{-3h}{x(x + h)}$. Delen door $h$: $\dfrac{-3}{x(x + h)} \to -\dfrac{3}{x^2}$.

- id: h2-t8
  soort: test
  niveau: 2
  thema: |-
    afleidbaar en continu
  opgave: |-
    Is $f(x) = |x + 1|$ continu in $-1$? Is $f$ afleidbaar in $-1$? Verklaar met het differentiequotiënt.
  antwoord: |-
    continu, niet afleidbaar
  uitwerking: |-
    $\lim_{x \to -1}|x + 1| = 0 = f(-1)$: continu. $\dfrac{f(-1 + h) - f(-1)}{h} = \dfrac{|h|}{h}$ is $-1$ voor $h < 0$ en $1$ voor $h > 0$: geen limiet, dus niet afleidbaar. De grafiek heeft een knik in $(-1, 0)$.
