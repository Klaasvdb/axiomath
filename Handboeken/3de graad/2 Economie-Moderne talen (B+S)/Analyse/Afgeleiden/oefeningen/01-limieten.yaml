- id: h1-t6
  soort: test
  niveau: 1
  thema: |-
    limieten en continuïteit op een grafiek
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
        \rooster{-2}{1}{4}{-1}{1}{4}
        \draw[accent,thick] (-2,0) -- (2,4);
        \draw[accent,thick] (2,2) -- (4,3);
        \open{(2,4)} \open{(2,2)} \vol{(2,1)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af: $\liml{x}{2} f(x)$, $\limr{x}{2} f(x)$ en $f(2)$.
      antwoord: |-
        $4$; $2$; $1$
      uitwerking: |-
        Links nadert de grafiek het open bolletje $(2, 4)$, rechts het open bolletje $(2, 2)$. Het volle bolletje geeft $f(2) = 1$.
    - opgave: |-
        Bestaat $\lim_{x \to 2} f(x)$? Is $f$ continu in $2$? En in $0$?
      antwoord: |-
        nee; nee; ja
      uitwerking: |-
        De eenzijdige limieten verschillen, dus de limiet in $2$ bestaat niet en $f$ is daar niet continu. In $0$ is $\lim_{x \to 0} f(x) = 2 = f(0)$: continu.

- id: h1-t7
  soort: test
  niveau: 2
  thema: |-
    epsilon en delta
  opgave: |-
    Bewijs met de definitie: $\lim_{x \to -1} (5x + 2) = -3$.
  antwoord: |-
    $\delta = \frac{\varepsilon}{5}$
  uitwerking: |-
    Neem $\varepsilon > 0$. $|(5x + 2) - (-3)| = |5x + 5| = 5|x + 1|$. Dat is kleiner dan $\varepsilon$ als $|x + 1| < \frac{\varepsilon}{5}$. Neem $\delta = \frac{\varepsilon}{5}$: als $0 < |x + 1| < \delta$, dan is $|f(x) + 3| < 5\delta = \varepsilon$.

- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    ontbinden
  opgave: |-
    Bereken $\lim_{x \to -2} \dfrac{x^2 + x - 2}{x + 2}$.
  antwoord: |-
    $-3$
  uitwerking: |-
    Invullen geeft $\frac00$: ontbinden. $\frac{(x + 2)(x - 1)}{x + 2} = x - 1 \to -3$.

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    toegevoegde
  opgave: |-
    Bereken $\lim_{x \to 0} \dfrac{\sqrt{9 + x} - 3}{x}$.
  antwoord: |-
    $\frac16$
  uitwerking: |-
    Invullen geeft $\frac00$ en er staat een wortel: maal teller en noemer met $\sqrt{9 + x} + 3$. $\frac{9 + x - 9}{x(\sqrt{9 + x} + 3)} = \frac{1}{\sqrt{9 + x} + 3} \to \frac16$.

- id: h1-t3
  soort: test
  niveau: 1
  thema: |-
    oneindige limiet
  opgave: |-
    Bereken $\liml{x}{1} \dfrac{2x}{x - 1}$ en $\limr{x}{1} \dfrac{2x}{x - 1}$.
  antwoord: |-
    $-\infty$; $+\infty$
  uitwerking: |-
    De teller nadert $2$, de noemer $0$. Links van $1$ is de noemer negatief: $-\infty$. Rechts is hij positief: $+\infty$. De rechte $x = 1$ is een verticale asymptoot.

- id: h1-t4
  soort: test
  niveau: 1
  thema: |-
    limiet in oneindig
  opgave: |-
    Bereken $\lim_{x \to -\infty} \dfrac{4x^2 + 3}{2x^2 - x}$.
  antwoord: |-
    2
  uitwerking: |-
    Delen door $x^2$: $\frac{4 + 3/x^2}{2 - 1/x} \to \frac42 = 2$. De grafiek heeft links de horizontale asymptoot $y = 2$.

- id: h1-t5
  soort: test
  niveau: 2
  thema: |-
    continuïteit
  opgave: |-
    Bepaal $k$ zodat $f$ continu is: $f(x) = x^2 + k$ voor $x < 3$ en $f(x) = 2x$ voor $x \geqslant 3$.
  antwoord: |-
    $k = -3$
  uitwerking: |-
    Beide voorschriften zijn veeltermen; alleen $3$ telt. Linkerlimiet $9 + k$, rechterlimiet en $f(3)$: $6$. $9 + k = 6$, dus $k = -3$.

- id: h1-t8
  soort: test
  niveau: 2
  thema: |-
    tussenwaardestelling
  opgave: |-
    Toon aan dat $x^3 - 3x + 1 = 0$ een oplossing heeft tussen $0$ en $1$. Zoek ze op één decimaal.
  antwoord: |-
    $x \approx 0{,}3$
  uitwerking: |-
    $f(x) = x^3 - 3x + 1$ is een veelterm, dus continu. $f(0) = 1 > 0$ en $f(1) = -1 < 0$: een nulwaarde in $\left]0, 1\right[$. Halveren: $f(0{,}5) = -0{,}375$, $f(0{,}25) \approx 0{,}27$, $f(0{,}3) = 0{,}127$, $f(0{,}35) \approx -0{,}007$. De oplossing ligt in $\left]0{,}3;\ 0{,}35\right[$: $x \approx 0{,}3$ (preciezer $0{,}347$).
