# Oefeningen van hoofdstuk 1. Zie oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Ontbind: $x^3 - 8$.
      antwoord: |-
        $(x - 2)(x^2 + 2x + 4)$
      uitwerking: |-
        $2$ is een nulwaarde, want $2^3 - 8 = 0$. Horner met $2$ geeft de coëfficiënten $1, 2, 4$ en rest $0$, dus $x^3 - 8 = (x - 2)(x^2 + 2x + 4)$.
    - opgave: |-
        Werk uit: $(\sqrt{a} - b)(\sqrt{a} + b)$.
      antwoord: |-
        $a - b^2$
      uitwerking: |-
        Merkwaardig product: $(\sqrt a)^2 - b^2 = a - b^2$.
    - opgave: |-
        Bereken $\frac{1}{x}$ voor $x = 0{,}001$ en $x = 10^6$.
      antwoord: |-
        $1000$; $10^{-6}$
      uitwerking: |-
        $\frac{1}{0{,}001} = 1000$ en $\frac{1}{10^6} = 0{,}000\,001$: een kleine noemer geeft een groot quotiënt, en omgekeerd.
    - opgave: |-
        Los op: $|x - 2| < 0{,}1$.
      antwoord: |-
        $1{,}9 < x < 2{,}1$
      uitwerking: |-
        De afstand van $x$ tot $2$ is kleiner dan $0{,}1$: $-0{,}1 < x - 2 < 0{,}1$, dus $1{,}9 < x < 2{,}1$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Neem $g(x) = \dfrac{x^3 - 8}{x - 2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom kun je $g(2)$ niet berekenen?
      antwoord: |-
        de noemer is nul
      uitwerking: |-
        Invullen geeft $\frac00$: $2$ ligt niet in het domein.
    - opgave: |-
        Bereken $g(x)$ voor $x = 1{,}9$, $1{,}99$, $2{,}01$ en $2{,}1$. Naar welk getal gaan de waarden?
      antwoord: |-
        $11{,}41$; $11{,}94$; $12{,}06$; $12{,}61$; naar 12
      uitwerking: |-
        $11{,}41$, $11{,}9401$, $12{,}0601$ en $12{,}61$: ze naderen $12$.
    - opgave: |-
        Vereenvoudig $g(x)$ voor $x \neq 2$ met de opwarmer. Verklaar het getal.
      antwoord: |-
        $x^2 + 2x + 4$; $4 + 4 + 4 = 12$
      uitwerking: |-
        $g(x) = x^2 + 2x + 4$ voor $x \neq 2$, en dat is $12$ voor $x = 2$.

- id: h1-begrip
  soort: kort
  opgave: |-
    Bewijs met de definitie.
  lijst: enumerate
  delen:
    - opgave: |-
        $\lim_{x \to 1} (2x + 3) = 5$
      antwoord: |-
        $\delta = \frac{\varepsilon}{2}$
      uitwerking: |-
        Neem $\varepsilon > 0$. $|(2x + 3) - 5| = 2|x - 1|$. Neem $\delta = \frac{\varepsilon}{2}$: als $0 < |x - 1| < \delta$, dan is $|f(x) - 5| = 2|x - 1| < 2\delta = \varepsilon$.
    - opgave: |-
        $\lim_{x \to -1} (4 - 3x) = 7$
      antwoord: |-
        $\delta = \frac{\varepsilon}{3}$
      uitwerking: |-
        Neem $\varepsilon > 0$. $|(4 - 3x) - 7| = |-3x - 3| = 3|x + 1|$, want $|-3| = 3$. Neem $\delta = \frac{\varepsilon}{3}$: als $0 < |x + 1| < \delta$, dan is $|f(x) - 7| = 3|x + 1| < 3\delta = \varepsilon$.

- id: h1-ontbinden
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to -4} \dfrac{x^2 + 4x}{x + 4}$
      antwoord: |-
        $-4$
      uitwerking: |-
        Invullen geeft $\frac00$. $\dfrac{x(x + 4)}{x + 4} = x \to -4$.
    - opgave: |-
        $\displaystyle\lim_{x \to 1} \dfrac{x^2 - 1}{x^2 + x - 2}$
      antwoord: |-
        $\frac23$
      uitwerking: |-
        Invullen geeft $\frac00$. $\dfrac{(x - 1)(x + 1)}{(x - 1)(x + 2)} = \dfrac{x + 1}{x + 2} \to \dfrac23$.
    - opgave: |-
        $\displaystyle\lim_{x \to 3} \dfrac{x^3 - 27}{x - 3}$
      antwoord: |-
        27
      uitwerking: |-
        Invullen geeft $\frac00$. Horner met $3$: $x^3 - 27 = (x - 3)(x^2 + 3x + 9)$, dus de limiet is $9 + 9 + 9 = 27$.

- id: h1-wortel
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to 0} \dfrac{\sqrt{x + 1} - 1}{x}$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        Maal de toegevoegde $\sqrt{x + 1} + 1$: $\dfrac{x + 1 - 1}{x(\sqrt{x + 1} + 1)} = \dfrac{1}{\sqrt{x + 1} + 1} \to \dfrac12$.
    - opgave: |-
        $\displaystyle\lim_{x \to 5} \dfrac{x - 5}{\sqrt{x + 4} - 3}$
      antwoord: |-
        6
      uitwerking: |-
        Nu staat de wortel in de noemer: maal $\sqrt{x + 4} + 3$. $\dfrac{(x - 5)(\sqrt{x + 4} + 3)}{x + 4 - 9} = \sqrt{x + 4} + 3 \to 3 + 3 = 6$.

- id: h1-berekenen
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to 2} \dfrac{x^2 - 3x + 2}{x - 2}$
      antwoord: |-
        1
      uitwerking: |-
        $\frac{(x - 1)(x - 2)}{x - 2} = x - 1 \to 1$.
    - opgave: |-
        $\displaystyle\lim_{x \to -1} \dfrac{x^3 + 1}{x + 1}$
      antwoord: |-
        3
      uitwerking: |-
        $x^2 - x + 1 \to 1 + 1 + 1 = 3$.
    - opgave: |-
        $\displaystyle\lim_{x \to 9} \dfrac{\sqrt{x} - 3}{x - 9}$
      antwoord: |-
        $\frac16$
      uitwerking: |-
        $x - 9 = (\sqrt x - 3)(\sqrt x + 3)$, dus $\frac{1}{\sqrt x + 3} \to \frac16$.
    - opgave: |-
        $\displaystyle\lim_{x \to 4} \dfrac{x^2 + 1}{x - 2}$
      antwoord: |-
        $\frac{17}{2}$
      uitwerking: |-
        Invullen: $\frac{17}{2}$. Geen onbepaalde vorm.

- id: h1-eenzijdig
  soort: kort
  opgave: |-
    Eenzijdige limieten.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\liml{x}{-3} \dfrac{2x}{x + 3}$ en $\limr{x}{-3} \dfrac{2x}{x + 3}$. Welke asymptoot volgt daaruit?
      antwoord: |-
        $+\infty$; $-\infty$; VA $x = -3$
      uitwerking: |-
        De teller nadert $-6$. Links van $-3$ is $x + 3 < 0$: negatief gedeeld door negatief geeft $+\infty$. Rechts is $x + 3 > 0$: $-\infty$. De rechte $x = -3$ is een verticale asymptoot.
    - opgave: |-
        Bereken $\liml{x}{1} \dfrac{1}{(x - 1)^2}$ en $\limr{x}{1} \dfrac{1}{(x - 1)^2}$. Bestaat $\lim_{x \to 1} \dfrac{1}{(x - 1)^2}$?
      antwoord: |-
        $+\infty$; $+\infty$; ja, $+\infty$
      uitwerking: |-
        Het kwadraat is aan beide kanten positief en nadert $0$, dus beide eenzijdige limieten zijn $+\infty$. Ze zijn gelijk: $\lim_{x \to 1} \frac{1}{(x - 1)^2} = +\infty$, en $x = 1$ is een verticale asymptoot.

- id: h1-oneindig
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{5x - 2}{x + 7}$
      antwoord: |-
        5
      uitwerking: |-
        $\frac{5 - 2/x}{1 + 7/x} \to 5$.
    - opgave: |-
        $\displaystyle\lim_{x \to -\infty} \dfrac{x^2 + 1}{x^3 - x}$
      antwoord: |-
        0
      uitwerking: |-
        Delen door $x^3$: $\frac{1/x + 1/x^3}{1 - 1/x^2} \to 0$.
    - opgave: |-
        $\limr{x}{3} \dfrac{2}{3 - x}$
      antwoord: |-
        $-\infty$
      uitwerking: |-
        Voor $x > 3$ is $3 - x < 0$ en dicht bij $0$: $-\infty$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{x^2 + 1}{x - 1}$
      antwoord: |-
        $+\infty$
      uitwerking: |-
        $\frac{x + 1/x}{1 - 1/x}$: de teller wordt onbeperkt groot, de noemer nadert 1.

- id: h1-asymptoten
  soort: kort
  opgave: |-
    Bepaal met limieten de asymptoten van de grafiek van $f(x) = \dfrac{4x + 1}{2x - 6}$.
  antwoord: |-
    VA $x = 3$, HA $y = 2$
  uitwerking: |-
    De noemer is nul voor $x = 3$ en de teller is daar $13$. $\liml{x}{3} f(x) = -\infty$ en $\limr{x}{3} f(x) = +\infty$: VA $x = 3$.\\
    $\displaystyle\lim_{x \to \pm\infty} \frac{4 + 1/x}{2 - 6/x} = \frac42 = 2$: HA $y = 2$.

- id: h1-continuk
  soort: kort
  opgave: |-
    Bepaal $k$ zodat $f$ continu is.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = 3x + k$ voor $x < 2$ en $f(x) = x^2 + 1$ voor $x \geqslant 2$.
      antwoord: |-
        $k = -1$
      uitwerking: |-
        Linkerlimiet: $6 + k$. Rechterlimiet en $f(2)$: $4 + 1 = 5$. $6 + k = 5$ geeft $k = -1$.
    - opgave: |-
        $f(x) = kx^2$ voor $x \leqslant -1$ en $f(x) = 2x + 5$ voor $x > -1$.
      antwoord: |-
        $k = 3$
      uitwerking: |-
        Linkerlimiet en $f(-1)$: $k \cdot (-1)^2 = k$. Rechterlimiet: $-2 + 5 = 3$. Dus $k = 3$.

- id: h1-continu
  soort: kort
  opgave: |-
    Continuïteit.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = \dfrac{x^2 - 4}{x - 2}$ voor $x \neq 2$ en $f(2) = 3$. Is $f$ continu in $2$?
      antwoord: |-
        nee: de limiet is $4 \neq 3$
      uitwerking: |-
        $\displaystyle\lim_{x \to 2} f(x) = \lim_{x \to 2}(x + 2) = 4 \neq f(2)$.
    - opgave: |-
        Toon aan dat $\cos x = x$ een oplossing heeft in $\bigl[0, \frac{\pi}{2}\bigr]$.
      antwoord: |-
        tussenwaardestelling met $\cos x - x$
      uitwerking: |-
        $g(x) = \cos x - x$ is continu, $g(0) = 1 > 0$ en $g\bigl(\frac{\pi}{2}\bigr) = -\frac{\pi}{2} < 0$.
    - opgave: |-
        Zoek die oplossing op één decimaal door het interval te halveren. Reken in radialen.
      antwoord: |-
        $x \approx 0{,}7$
      uitwerking: |-
        $g(0{,}5) \approx 0{,}38 > 0$ en $g(0{,}75) \approx -0{,}02 < 0$: de oplossing ligt in $\left]0{,}5;\ 0{,}75\right[$. $g(0{,}7) \approx 0{,}06 > 0$: ze ligt in $\left]0{,}7;\ 0{,}75\right[$, dus $x \approx 0{,}7$ (preciezer $0{,}739$).

- id: h1-aflezen
  soort: kort
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.6cm,font=\scriptsize]
        \rooster{-2}{1}{3}{-2}{1}{3}
        \kromme{-2}{3.4}{3-.5*(\x-1)^2}
        \open{(-1,1)} \vol{(-1,-1)} \open{(1,3)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van een functie $f$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af: $\lim_{x \to -1} f(x)$ en $f(-1)$.
      antwoord: |-
        $1$; $-1$
      uitwerking: |-
        Langs beide kanten nadert de grafiek de hoogte van het open bolletje: $\lim_{x \to -1} f(x) = 1$. Het volle bolletje geeft $f(-1) = -1$. Limiet en functiewaarde verschillen.
    - opgave: |-
        Lees af: $\lim_{x \to 1} f(x)$ en $f(1)$.
      antwoord: |-
        $3$; bestaat niet
      uitwerking: |-
        De grafiek nadert $3$ van links en van rechts, dus $\lim_{x \to 1} f(x) = 3$. Boven $x = 1$ staat alleen een open bolletje en geen vol: $f(1)$ bestaat niet.
    - opgave: |-
        Lees af: $\lim_{x \to 3} f(x)$ en $f(3)$.
      antwoord: |-
        $1$; $1$
      uitwerking: |-
        Hier loopt de grafiek gewoon door: $\lim_{x \to 3} f(x) = 1 = f(3)$.

- id: h1-links-rechts
  soort: kort
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.55cm,font=\scriptsize]
        \rooster{-2}{1}{3}{-2}{1}{3}
        \draw[accent,thick] (-2,-1) -- (1,2);
        \draw[accent,thick] (1,-1) -- (3,1);
        \open{(1,2)} \vol{(1,-1)}
      \end{tikzpicture}
  opgave: |-
    Linker- en rechterlimiet.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af op de grafiek: $\liml{x}{1} f(x)$, $\limr{x}{1} f(x)$, $f(1)$. Bestaat $\lim_{x \to 1} f(x)$?
      antwoord: |-
        $2$; $-1$; $-1$; nee
      uitwerking: |-
        Linkerlimiet $2$, rechterlimiet $-1$, $f(1) = -1$ (het volle bolletje). De limiet bestaat niet: links en rechts verschillen.
    - opgave: |-
        $g(x) = x^2 + 1$ voor $x < 1$ en $g(x) = 3x - 1$ voor $x \geqslant 1$. Bereken $\liml{x}{1} g(x)$ en $\limr{x}{1} g(x)$. Bestaat $\lim_{x \to 1} g(x)$?
      antwoord: |-
        $2$; $2$; ja, $2$
      uitwerking: |-
        Links van $1$ geldt het eerste voorschrift: $\liml{x}{1} (x^2 + 1) = 2$. Rechts het tweede: $\limr{x}{1} (3x - 1) = 2$. Beide eenzijdige limieten zijn $2$, dus $\lim_{x \to 1} g(x) = 2$.
    - opgave: |-
        $h(x) = \dfrac{x^2 + 3x}{|x + 3|}$. Bereken $\liml{x}{-3} h(x)$ en $\limr{x}{-3} h(x)$. Bestaat $\lim_{x \to -3} h(x)$?
      antwoord: |-
        $3$; $-3$; nee
      uitwerking: |-
        $h(x) = \dfrac{x(x + 3)}{|x + 3|}$. Voor $x < -3$ is $|x + 3| = -(x + 3)$, dus $h(x) = -x \to 3$. Voor $x > -3$ is $|x + 3| = x + 3$, dus $h(x) = x \to -3$. Links en rechts verschillen: de limiet bestaat niet.

- id: h1-somregel
  soort: kort
  opgave: |-
    Gegeven: $\lim_{x \to 3} f(x) = 2$ en $\lim_{x \to 3} g(x) = -5$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\lim_{x \to 3} \bigl(f(x) + g(x)\bigr)$ en $\lim_{x \to 3} \bigl(g(x) - f(x) + 4\bigr)$.
      antwoord: |-
        $-3$; $-3$
      uitwerking: |-
        Somregel: $2 + (-5) = -3$. Somregel en de basislimiet van de constante $4$: $-5 - 2 + 4 = -3$.
    - opgave: |-
        Bereken $\lim_{x \to 3} \bigl(x - f(x)\bigr)$.
      antwoord: |-
        $1$
      uitwerking: |-
        Basislimiet $\lim_{x \to 3} x = 3$ en somregel: $3 - 2 = 1$.
    - opgave: |-
        Bedenk twee functies $u$ en $v$ zodat $\lim_{x \to 0} \bigl(u(x) + v(x)\bigr)$ bestaat, maar $\lim_{x \to 0} u(x)$ niet. Waarom is dat geen tegenspraak met de somregel?
      antwoord: |-
        bv. $u(x) = \frac{1}{x^2}$, $v(x) = 1 - \frac{1}{x^2}$
      uitwerking: |-
        Neem $u(x) = \frac{1}{x^2}$ en $v(x) = 1 - \frac{1}{x^2}$. Dan is $u(x) + v(x) = 1$, met limiet $1$, maar $\lim_{x \to 0} \frac{1}{x^2}$ bestaat niet (de functie wordt onbeperkt groot). De somregel zegt alleen iets als beide limieten bestaan; dat is hier niet zo.

- id: h1-productregel
  soort: kort
  opgave: |-
    Gegeven: $\lim_{x \to 3} f(x) = 2$ en $\lim_{x \to 3} g(x) = -5$. Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\lim_{x \to 3} 3f(x)$
      antwoord: |-
        $6$
      uitwerking: |-
        Een constante factor mag voor de limiet: $3 \cdot 2 = 6$.
    - opgave: |-
        $\lim_{x \to 3} f(x)\,g(x)$
      antwoord: |-
        $-10$
      uitwerking: |-
        Productregel: $2 \cdot (-5) = -10$.
    - opgave: |-
        $\lim_{x \to 3} x^2 g(x)$
      antwoord: |-
        $-45$
      uitwerking: |-
        Productregel met $\lim_{x \to 3} x^2 = 9$: $9 \cdot (-5) = -45$.
    - opgave: |-
        $\lim_{x \to 3} \bigl(f(x)\bigr)^3$
      antwoord: |-
        $8$
      uitwerking: |-
        $\bigl(f(x)\bigr)^3 = f(x) \cdot f(x) \cdot f(x)$, dus de productregel geeft $2^3 = 8$.

- id: h1-quotientregel
  soort: kort
  opgave: |-
    Gegeven: $\lim_{x \to 3} f(x) = 2$ en $\lim_{x \to 3} g(x) = -5$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\displaystyle\lim_{x \to 3} \dfrac{f(x)}{g(x)}$ en $\displaystyle\lim_{x \to 3} \dfrac{g(x) + x}{f(x)}$.
      antwoord: |-
        $-\frac25$; $-1$
      uitwerking: |-
        De noemer heeft telkens een limiet verschillend van $0$. Quotiëntregel: $\frac{2}{-5} = -\frac25$, en $\frac{-5 + 3}{2} = -1$.
    - opgave: |-
        Kun je $\displaystyle\lim_{x \to 3} \dfrac{f(x)}{g(x) + 5}$ berekenen met de quotiëntregel? Leg uit.
      antwoord: |-
        nee: de noemer gaat naar $0$
      uitwerking: |-
        De noemer heeft limiet $-5 + 5 = 0$, en dan geldt de quotiëntregel niet. De teller gaat naar $2$: een getal gedeeld door nul. Zonder meer gegevens over het teken van de noemer weet je niet of het $+\infty$ of $-\infty$ wordt.

- id: h1-invullen
  soort: kort
  opgave: |-
    Bereken door in te vullen. Controleer eerst dat het mag.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to 2} (x^3 - 4x + 1)$
      antwoord: |-
        $1$
      uitwerking: |-
        Een veelterm: invullen mag altijd. $8 - 8 + 1 = 1$.
    - opgave: |-
        $\displaystyle\lim_{x \to -1} \dfrac{2x^2 + x}{x - 3}$
      antwoord: |-
        $-\frac14$
      uitwerking: |-
        De noemer is $-4 \neq 0$, dus invullen mag: $\frac{2 - 1}{-4} = -\frac14$.
    - opgave: |-
        $\displaystyle\lim_{x \to 0} \dfrac{x^2 + 5}{x^4 + x + 1}$
      antwoord: |-
        $5$
      uitwerking: |-
        De noemer is $1 \neq 0$: $\frac{5}{1} = 5$.

- id: h1-va
  soort: kort
  opgave: |-
    Bepaal de verticale asymptoten en de perforaties van de grafiek.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac{x + 2}{x^2 - 4}$
      antwoord: |-
        VA $x = 2$; perforatie in $\bigl(-2, -\frac14\bigr)$
      uitwerking: |-
        $f(x) = \dfrac{x + 2}{(x - 2)(x + 2)}$. In $2$ geeft invullen $\frac40$: verticale asymptoot $x = 2$. In $-2$ geeft het $\frac00$. Schrappen: $\frac{1}{x - 2} \to -\frac14$. Daar is een perforatie in $\bigl(-2, -\frac14\bigr)$.
    - opgave: |-
        $g(x) = \dfrac{x^2 + 1}{x^2 - 3x}$
      antwoord: |-
        VA $x = 0$ en $x = 3$
      uitwerking: |-
        $x^2 - 3x = x(x - 3)$ is nul in $0$ en $3$. De teller $x^2 + 1$ is nooit nul: in $0$ geeft invullen $\frac10$ en in $3$ geeft het $\frac{10}{0}$. Twee verticale asymptoten: $x = 0$ en $x = 3$.

- id: h1-graad
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{3x - 1}{x^2 + 2}$
      antwoord: |-
        $0$
      uitwerking: |-
        Delen door $x^2$: $\dfrac{\frac3x - \frac{1}{x^2}}{1 + \frac{2}{x^2}} \to \frac01 = 0$. De graad van de teller is kleiner.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{4x^3 + x}{2x^3 - 7}$
      antwoord: |-
        $2$
      uitwerking: |-
        Gelijke graad. Delen door $x^3$: $\dfrac{4 + \frac{1}{x^2}}{2 - \frac{7}{x^3}} \to \frac42 = 2$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{x^3 - 1}{5x^2 + x}$
      antwoord: |-
        $+\infty$
      uitwerking: |-
        Delen door $x^2$: $\dfrac{x - \frac{1}{x^2}}{5 + \frac1x}$. De teller wordt onbeperkt groot, de noemer gaat naar $5$: $+\infty$.
    - opgave: |-
        $\displaystyle\lim_{x \to -\infty} \dfrac{x^3 - 1}{5x^2 + x}$
      antwoord: |-
        $-\infty$
      uitwerking: |-
        Dezelfde breuk: $\dfrac{x - \frac{1}{x^2}}{5 + \frac1x}$. Nu gaat de teller naar $-\infty$ en de noemer naar $5$: $-\infty$.

- id: h1-continupunt
  soort: kort
  opgave: |-
    Is $f$ continu in $a$? Controleer de drie voorwaarden.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = \dfrac{x^2 + x - 2}{x - 1}$ voor $x \neq 1$ en $f(1) = 3$, \ $a = 1$.
      antwoord: |-
        ja
      uitwerking: |-
        $f(1) = 3$ bestaat. $\lim_{x \to 1} \dfrac{(x - 1)(x + 2)}{x - 1} = \lim_{x \to 1} (x + 2) = 3$. De limiet is gelijk aan $f(1)$: continu.
    - opgave: |-
        $f(x) = x^2$ voor $x < 0$ en $f(x) = x + 1$ voor $x \geqslant 0$, \ $a = 0$.
      antwoord: |-
        nee: sprong
      uitwerking: |-
        $f(0) = 1$. De linkerlimiet is $0$, de rechterlimiet is $1$: de limiet bestaat niet. Niet continu in $0$.
    - opgave: |-
        $f(x) = |x|$, \ $a = 0$.
      antwoord: |-
        ja
      uitwerking: |-
        $f(0) = 0$. Links is $f(x) = -x \to 0$, rechts is $f(x) = x \to 0$, dus $\lim_{x \to 0} |x| = 0 = f(0)$: continu.

- id: h1-tws
  soort: kort
  opgave: |-
    De tussenwaardestelling.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = \frac{1}{x - 1}$ heeft $f(0) = -1$ en $f(2) = 1$. Heeft $f$ een nulwaarde in $\left]0, 2\right[$? Is dat in tegenspraak met de tussenwaardestelling?
      antwoord: |-
        nee; geen tegenspraak: $f$ is niet continu op $[0, 2]$
      uitwerking: |-
        $\frac{1}{x - 1} = 0$ heeft geen oplossing, want de teller is nooit nul. Er is geen tegenspraak: $f$ bestaat niet in $1$, dus $f$ is niet continu op $[0, 2]$ en de stelling is niet van toepassing. De grafiek springt over de $x$-as, bij de verticale asymptoot $x = 1$.
    - opgave: |-
        Toon aan dat $x^5 + 2x = 1$ een oplossing heeft in $\left]0, 1\right[$.
      antwoord: |-
        $g(x) = x^5 + 2x - 1$: $g(0) = -1$, $g(1) = 2$
      uitwerking: |-
        Neem $g(x) = x^5 + 2x - 1$, een veelterm en dus continu. $g(0) = -1 < 0$ en $g(1) = 2 > 0$. Volgens de tussenwaardestelling heeft $g$ een nulwaarde in $\left]0, 1\right[$, en die is een oplossing van de vergelijking.
    - opgave: |-
        Toon aan dat de grafiek van $f(x) = \e^x$ de rechte $y = 3 - x$ snijdt voor een $x$ in $\left]0, 1\right[$.
      antwoord: |-
        $g(x) = \e^x + x - 3$: $g(0) = -2$, $g(1) = \e - 2 > 0$
      uitwerking: |-
        Snijden betekent $\e^x = 3 - x$, dus $g(x) = \e^x + x - 3 = 0$. De functie $g$ is continu, $g(0) = 1 - 3 = -2 < 0$ en $g(1) = \e - 2 \approx 0{,}72 > 0$. Er is dus een nulwaarde in $\left]0, 1\right[$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    invullen
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to 2} (x^3 - 2x)$
      antwoord: |-
        4
      uitwerking: |-
        Een veelterm: invullen. $8 - 4 = 4$.
    - opgave: |-
        $\displaystyle\lim_{x \to \pi} \sin\frac{x}{2}$
      antwoord: |-
        1
      uitwerking: |-
        De sinus is continu: invullen. $\sin\frac{\pi}{2} = 1$.
    - opgave: |-
        $\displaystyle\lim_{x \to 0} \dfrac{\e^x}{x + 1}$
      antwoord: |-
        1
      uitwerking: |-
        De noemer is $1 \neq 0$: invullen. $\frac{\e^0}{1} = 1$.
    - opgave: |-
        $\displaystyle\lim_{x \to \e} \ln x$
      antwoord: |-
        1
      uitwerking: |-
        $\e$ ligt in het domein: $\ln \e = 1$.

- id: h1-o10
  soort: opdracht
  niveau: 1
  thema: |-
    limieten aflezen op een grafiek
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
        \rooster{-4}{1}{4}{-2}{1}{4}
        \draw[accent,thick] (-4,0) -- (-1,3);
        \draw[accent,thick] (-1,-1) -- (2,2) -- (4,0);
        \open{(-1,3)} \open{(-1,-1)} \vol{(-1,1)}
        \open{(1,1)} \vol{(1,3)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van een functie $f$ op $[-4, 4]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af: $\liml{x}{-1} f(x)$, $\limr{x}{-1} f(x)$ en $f(-1)$.
      antwoord: |-
        $3$; $-1$; $1$
      uitwerking: |-
        Links van $-1$ nadert de grafiek het open bolletje in $(-1, 3)$, rechts het open bolletje in $(-1, -1)$. Het volle bolletje geeft $f(-1) = 1$.
    - opgave: |-
        Lees af: $\lim_{x \to 1} f(x)$ en $f(1)$.
      antwoord: |-
        $1$; $3$
      uitwerking: |-
        Van beide kanten nadert de grafiek het gat in $(1, 1)$: de limiet is $1$. De functiewaarde is het volle bolletje: $f(1) = 3$.
    - opgave: |-
        Lees af: $\lim_{x \to -3} f(x)$ en $\lim_{x \to 2} f(x)$.
      antwoord: |-
        $1$; $2$
      uitwerking: |-
        Daar is de grafiek één doorlopende lijn: de limiet is de functiewaarde, $f(-3) = 1$ en $f(2) = 2$.
    - opgave: |-
        In welke punten van $\left]-4, 4\right[$ is $f$ niet continu? Zeg telkens welke voorwaarde niet voldaan is.
      antwoord: |-
        in $-1$ en in $1$
      uitwerking: |-
        In $-1$ bestaat de limiet niet: links $3$, rechts $-1$. In $1$ bestaat de limiet wel, maar ze is niet gelijk aan $f(1)$: $1 \neq 3$. Overal elders teken je de grafiek zonder je pen op te heffen.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: onbepaalde vorm 0/0, ontbinden
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to 1} \dfrac{x^2 + 2x - 3}{x^2 - 1}$
      antwoord: |-
        2
      uitwerking: |-
        $\frac{(x + 3)(x - 1)}{(x + 1)(x - 1)} = \frac{x + 3}{x + 1} \to 2$.
    - opgave: |-
        $\displaystyle\lim_{h \to 0} \dfrac{(2 + h)^2 - 4}{h}$
      antwoord: |-
        4
      uitwerking: |-
        $\frac{4h + h^2}{h} = 4 + h \to 4$.
    - opgave: |-
        $\displaystyle\lim_{x \to 0} \dfrac{x^2 + 5x}{x}$
      antwoord: |-
        5
      uitwerking: |-
        $x + 5 \to 5$.
    - opgave: |-
        $\displaystyle\lim_{x \to 4} \dfrac{x^2 - 16}{x - 4}$
      antwoord: |-
        8
      uitwerking: |-
        $\frac{(x - 4)(x + 4)}{x - 4} = x + 4 \to 8$.
    - opgave: |-
        $\displaystyle\lim_{x \to -3} \dfrac{x^2 + 3x}{x + 3}$
      antwoord: |-
        $-3$
      uitwerking: |-
        $\frac{x(x + 3)}{x + 3} = x \to -3$.
    - opgave: |-
        $\displaystyle\lim_{x \to 5} \dfrac{x - 5}{x^2 - 25}$
      antwoord: |-
        $\frac{1}{10}$
      uitwerking: |-
        $\frac{x - 5}{(x - 5)(x + 5)} = \frac{1}{x + 5} \to \frac{1}{10}$.
    - opgave: |-
        $\displaystyle\lim_{x \to 2} \dfrac{x^2 - 5x + 6}{x^2 - 4}$
      antwoord: |-
        $-\frac14$
      uitwerking: |-
        $\frac{(x - 2)(x - 3)}{(x - 2)(x + 2)} = \frac{x - 3}{x + 2} \to -\frac14$.
    - opgave: |-
        $\displaystyle\lim_{x \to 1} \dfrac{x^3 - x}{x - 1}$
      antwoord: |-
        2
      uitwerking: |-
        $x^3 - x = x(x - 1)(x + 1)$, dus $x(x + 1) \to 2$.
    - opgave: |-
        $\displaystyle\lim_{x \to -1} \dfrac{2x^2 + x - 1}{x + 1}$
      antwoord: |-
        $-3$
      uitwerking: |-
        $2x^2 + x - 1 = (x + 1)(2x - 1)$, dus $2x - 1 \to -3$.
    - opgave: |-
        $\displaystyle\lim_{h \to 0} \dfrac{(1 + h)^3 - 1}{h}$
      antwoord: |-
        3
      uitwerking: |-
        $(1 + h)^3 - 1 = 3h + 3h^2 + h^3$, dus $3 + 3h + h^2 \to 3$.
    - opgave: |-
        $\displaystyle\lim_{x \to 2} \dfrac{x^3 - 8}{x^2 - 4}$
      antwoord: |-
        3
      uitwerking: |-
        $\frac{(x - 2)(x^2 + 2x + 4)}{(x - 2)(x + 2)} = \frac{x^2 + 2x + 4}{x + 2} \to \frac{12}{4} = 3$.
    - opgave: |-
        $\displaystyle\lim_{x \to \frac12} \dfrac{2x^2 - x}{4x^2 - 1}$
      antwoord: |-
        $\frac14$
      uitwerking: |-
        $\frac{x(2x - 1)}{(2x - 1)(2x + 1)} = \frac{x}{2x + 1} \to \frac{1/2}{2} = \frac14$.

- id: h1-o11
  soort: opdracht
  niveau: 1
  thema: |-
    drill: eenzijdige limieten, teken van de noemer
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\liml{x}{3} \dfrac{1}{x - 3}$
      antwoord: |-
        $-\infty$
      uitwerking: |-
        Teller $1$, noemer $\to 0$ en negatief: $-\infty$.
    - opgave: |-
        $\limr{x}{3} \dfrac{x + 1}{x - 3}$
      antwoord: |-
        $+\infty$
      uitwerking: |-
        Teller $\to 4$, noemer $\to 0$ en positief: $+\infty$.
    - opgave: |-
        $\liml{x}{-2} \dfrac{x}{x + 2}$
      antwoord: |-
        $+\infty$
      uitwerking: |-
        Teller $\to -2$, noemer $\to 0$ en negatief: negatief gedeeld door negatief, $+\infty$.
    - opgave: |-
        $\limr{x}{0} \dfrac{x - 1}{x^2}$
      antwoord: |-
        $-\infty$
      uitwerking: |-
        Teller $\to -1$, noemer $\to 0$ en positief: $-\infty$.
    - opgave: |-
        $\liml{x}{1} \dfrac{2x}{(1 - x)^2}$
      antwoord: |-
        $+\infty$
      uitwerking: |-
        Teller $\to 2$, het kwadraat is positief: $+\infty$.
    - opgave: |-
        $\limr{x}{4} \dfrac{x^2 - 16}{x - 4}$
      antwoord: |-
        8
      uitwerking: |-
        Opgelet, invullen geeft $\frac00$ en geen getal gedeeld door $0$: $x + 4 \to 8$. Hier is geen asymptoot.
    - opgave: |-
        $\liml{x}{0} \dfrac{x + 1}{x^2 - x}$
      antwoord: |-
        $+\infty$
      uitwerking: |-
        $x^2 - x = x(x - 1)$: voor $x < 0$ dicht bij $0$ zijn beide factoren negatief, dus de noemer is positief. Teller $\to 1$: $+\infty$.
    - opgave: |-
        $\limr{x}{-1} \dfrac{3}{x^2 - 1}$
      antwoord: |-
        $-\infty$
      uitwerking: |-
        Voor $x$ net rechts van $-1$ is $|x| < 1$, dus $x^2 - 1 < 0$: $-\infty$.

- id: h1-o14
  soort: opdracht
  niveau: 1
  thema: |-
    een limiet schatten met een tabel
  opgave: |-
    Vul een tabel in met je rekenmachine voor $x = 0{,}1$, $0{,}01$ en $0{,}001$, en schat de limiet op drie decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to 0} \dfrac{\sin x}{x}$ (in radialen)
      antwoord: |-
        $0{,}998$; $1{,}000$; $1{,}000$; limiet $1$
      uitwerking: |-
        $0{,}998\,33$; $0{,}999\,98$; $0{,}999\,999\,8$. De waarden naderen $1$. Invullen kan niet: dat geeft $\frac00$.
    - opgave: |-
        $\displaystyle\lim_{x \to 0} (1 + x)^{1/x}$
      antwoord: |-
        $2{,}594$; $2{,}705$; $2{,}717$; limiet $\e \approx 2{,}718$
      uitwerking: |-
        $2{,}593\,7$; $2{,}704\,8$; $2{,}716\,9$. De waarden stijgen naar $2{,}718\ldots = \e$. Je hebt een kleinere $x$ nodig om drie decimalen zeker te zijn: $x = 0{,}000\,01$ geeft $2{,}718\,27$.
    - opgave: |-
        $\displaystyle\lim_{x \to 0} \dfrac{2^x - 1}{x}$
      antwoord: |-
        $0{,}718$; $0{,}696$; $0{,}693$; limiet $\approx 0{,}693$
      uitwerking: |-
        $0{,}717\,7$; $0{,}695\,6$; $0{,}693\,4$. De limiet is ongeveer $0{,}693$. In hoofdstuk 3 blijkt dat dit $\ln 2$ is.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    drill: limieten in oneindig
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{2x^3 - x}{4x^3 + 1}$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        Delen door $x^3$: $\frac{2 - 1/x^2}{4 + 1/x^3} \to \frac12$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{x + 1}{x^2 + 1}$
      antwoord: |-
        0
      uitwerking: |-
        Delen door $x^2$: $\frac{1/x + 1/x^2}{1 + 1/x^2} \to 0$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{1 - x^2}{x + 3}$
      antwoord: |-
        $-\infty$
      uitwerking: |-
        $\frac{1/x - x}{1 + 3/x}$: de teller gaat naar $-\infty$, de noemer naar 1.
    - opgave: |-
        $\displaystyle\lim_{x \to -\infty} \dfrac{6x + 1}{3 - 2x}$
      antwoord: |-
        $-3$
      uitwerking: |-
        Delen door $x$: $\frac{6 + 1/x}{3/x - 2} \to \frac{6}{-2} = -3$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{x^2 - 3x}{5x^2 + 2}$
      antwoord: |-
        $\frac15$
      uitwerking: |-
        Delen door $x^2$: $\frac{1 - 3/x}{5 + 2/x^2} \to \frac15$.
    - opgave: |-
        $\displaystyle\lim_{x \to -\infty} \dfrac{x^3 + 2}{x^2 + 1}$
      antwoord: |-
        $-\infty$
      uitwerking: |-
        Delen door $x^2$: $\frac{x + 2/x^2}{1 + 1/x^2}$. De teller gaat naar $-\infty$, de noemer naar $1$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{4 - x}{x^2 + x}$
      antwoord: |-
        0
      uitwerking: |-
        Delen door $x^2$: $\frac{4/x^2 - 1/x}{1 + 1/x} \to \frac01 = 0$.
    - opgave: |-
        $\displaystyle\lim_{x \to -\infty} \dfrac{2x^2 - 1}{x + 1}$
      antwoord: |-
        $-\infty$
      uitwerking: |-
        Delen door $x$: $\frac{2x - 1/x}{1 + 1/x}$. De teller gaat naar $-\infty$, de noemer naar $1$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{(3x - 2)^2}{x^2 + 1}$
      antwoord: |-
        9
      uitwerking: |-
        $\frac{9x^2 - 12x + 4}{x^2 + 1}$, delen door $x^2$: $\to 9$.
    - opgave: |-
        $\displaystyle\lim_{x \to -\infty} \dfrac{x^4 - x}{1 - 2x^4}$
      antwoord: |-
        $-\frac12$
      uitwerking: |-
        Delen door $x^4$: $\frac{1 - 1/x^3}{1/x^4 - 2} \to -\frac12$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \Bigl(\dfrac{x^2 + 1}{x + 1} - x\Bigr)$
      antwoord: |-
        $-1$
      uitwerking: |-
        Eerst op één noemer: $\frac{x^2 + 1 - x^2 - x}{x + 1} = \frac{1 - x}{x + 1} \to -1$.
    - opgave: |-
        $\displaystyle\lim_{x \to -\infty} \dfrac{7x^2 - 1}{2x^2 + x}$
      antwoord: |-
        $\frac72$
      uitwerking: |-
        Delen door $x^2$: $\frac{7 - 1/x^2}{2 + 1/x} \to \frac72$.

- id: h1-o15
  soort: opdracht
  niveau: 1
  thema: |-
    de grafiek kiezen bij gegeven limieten
  opgave: |-
    Welke grafiek hoort bij een functie met
    \[\liml{x}{1} f(x) = +\infty, \qquad \limr{x}{1} f(x) = -\infty \qquad\text{en}\qquad \lim_{x \to \pm\infty} f(x) = 2\,?\]
    Wat is er mis met de twee andere?

    \figuren{\begin{tikzpicture}[x=.45cm,y=.36cm,font=\scriptsize]
      \rooster{-3}{1}{4}{-3}{1}{5}
      \draw[grijs,dashed] (1,-3) -- (1,5) (-3,2) -- (4,2);
      \kromme{-3}{.75}{2+1/(1-\x)}
      \kromme{1.25}{4}{2+1/(1-\x)}
      \node[above,text=accent] at (3,5) {\small A};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.45cm,y=.36cm,font=\scriptsize]
      \rooster{-3}{1}{4}{-3}{1}{5}
      \draw[grijs,dashed] (1,-3) -- (1,5) (-3,2) -- (4,2);
      \kromme{-3}{.75}{2+1/(\x-1)}
      \kromme{1.34}{4}{2+1/(\x-1)}
      \node[above,text=accent] at (3,5) {\small B};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.45cm,y=.36cm,font=\scriptsize]
      \rooster{-3}{1}{4}{-3}{1}{5}
      \draw[grijs,dashed] (1,-3) -- (1,5);
      \kromme{-3}{.8}{1/(1-\x)}
      \kromme{1.34}{4}{1/(1-\x)}
      \node[above,text=accent] at (3,5) {\small C};
    \end{tikzpicture}}
  antwoord: |-
    A
  uitwerking: |-
    A klopt: links van $x = 1$ gaat de grafiek omhoog, rechts omlaag, en ver naar links en naar rechts nadert ze $y = 2$. Bij B is het net omgekeerd: links $-\infty$ en rechts $+\infty$. Bij C kloppen de limieten in $1$, maar de horizontale asymptoot is $y = 0$ en niet $y = 2$.

- id: h1-o12
  soort: opdracht
  niveau: 1
  thema: |-
    asymptoten met limieten
  opgave: |-
    Bepaal de verticale en horizontale asymptoten van de grafiek. Schrijf telkens de limieten op die ze aantonen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac{3x - 1}{x + 2}$
      antwoord: |-
        VA $x = -2$, HA $y = 3$
      uitwerking: |-
        Teller in $-2$: $-7 \neq 0$. $\liml{x}{-2} f(x) = +\infty$ en $\limr{x}{-2} f(x) = -\infty$: VA $x = -2$. $\lim_{x \to \pm\infty} \frac{3 - 1/x}{1 + 2/x} = 3$: HA $y = 3$.
    - opgave: |-
        $f(x) = \dfrac{5}{x^2 - 9}$
      antwoord: |-
        VA $x = -3$ en $x = 3$, HA $y = 0$
      uitwerking: |-
        $x^2 - 9 = (x - 3)(x + 3)$. $\liml{x}{3} f(x) = -\infty$, $\limr{x}{3} f(x) = +\infty$, $\liml{x}{-3} f(x) = +\infty$, $\limr{x}{-3} f(x) = -\infty$: VA $x = 3$ en $x = -3$. $\lim_{x \to \pm\infty} f(x) = 0$: HA $y = 0$.
    - opgave: |-
        $f(x) = \dfrac{x^2 - 1}{x^2 + 1}$
      antwoord: |-
        geen VA, HA $y = 1$
      uitwerking: |-
        $x^2 + 1 > 0$ voor elke $x$: geen verticale asymptoot. $\lim_{x \to \pm\infty} \frac{1 - 1/x^2}{1 + 1/x^2} = 1$: HA $y = 1$.
    - opgave: |-
        $f(x) = \dfrac{x^2 - 4}{x^2 - x - 2}$
      antwoord: |-
        VA $x = -1$, HA $y = 1$, perforatie in $x = 2$
      uitwerking: |-
        $f(x) = \frac{(x - 2)(x + 2)}{(x - 2)(x + 1)} = \frac{x + 2}{x + 1}$ voor $x \neq 2$. In $2$: limiet $\frac43$, een perforatie. $\liml{x}{-1} f(x) = -\infty$, $\limr{x}{-1} f(x) = +\infty$: VA $x = -1$. In $\pm\infty$: $1$, HA $y = 1$.

- id: h1-o13
  soort: opdracht
  niveau: 1
  thema: |-
    continu in een punt: drie voorwaarden
  opgave: |-
    Is $f$ continu in het gegeven punt? Controleer de drie voorwaarden.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = \dfrac{x^2 - 9}{x - 3}$ voor $x \neq 3$ en $f(3) = 6$, in $3$.
      antwoord: |-
        ja
      uitwerking: |-
        $f(3) = 6$ bestaat. $\lim_{x \to 3} (x + 3) = 6$ bestaat. Ze zijn gelijk: continu.
    - opgave: |-
        $f(x) = x + 1$ voor $x < 2$ en $f(x) = x^2 - 1$ voor $x \geqslant 2$, in $2$.
      antwoord: |-
        ja
      uitwerking: |-
        $f(2) = 3$. Linkerlimiet $2 + 1 = 3$, rechterlimiet $4 - 1 = 3$: de limiet is $3 = f(2)$. Continu, al ziet het voorschrift er gebroken uit.
    - opgave: |-
        $f(x) = \dfrac{1}{x^2}$ voor $x \neq 0$ en $f(0) = 0$, in $0$.
      antwoord: |-
        nee
      uitwerking: |-
        $f(0) = 0$ bestaat, maar $\lim_{x \to 0} \frac{1}{x^2} = +\infty$: de limiet is geen getal.
    - opgave: |-
        $f(x) = \dfrac{|x - 1|}{x - 1}$ voor $x \neq 1$ en $f(1) = 1$, in $1$.
      antwoord: |-
        nee
      uitwerking: |-
        Links van $1$ is $f(x) = -1$, rechts $1$. De linkerlimiet $-1$ en de rechterlimiet $1$ verschillen: de limiet bestaat niet.

#---------------------------------------- niveau 2

- id: h1-o4
  soort: opdracht
  niveau: 2
  thema: |-
    asymptoot of perforatie
  opgave: |-
    Neem $f(x) = \dfrac{2x^2 - 2}{x^2 - x - 2}$. Bereken de limieten in $-1$, in $2$ (links en rechts) en in $\pm\infty$. Welke asymptoten heeft de grafiek?
  antwoord: |-
    $\frac43$; $-\infty$ en $+\infty$; $2$; VA $x = 2$, HA $y = 2$
  uitwerking: |-
    $f(x) = \frac{2(x - 1)(x + 1)}{(x - 2)(x + 1)} = \frac{2(x - 1)}{x - 2}$ voor $x \neq -1$. In $-1$: $\frac{2 \cdot (-2)}{-3} = \frac43$: een perforatie, geen asymptoot. In $2$: de teller nadert $2$, de noemer $0$; links negatief, dus $-\infty$, rechts $+\infty$: VA $x = 2$. In $\pm\infty$: $\frac{2 - 2/x}{1 - 2/x} \to 2$, HA $y = 2$.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    drill: gemengd, zelf de methode herkennen
  opgave: |-
    Bereken. Herken eerst de vorm: invullen, ontbinden, toegevoegde, delen door de hoogste macht, of eerst op één noemer.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to 1} \dfrac{x^3 - 1}{x^2 - 1}$
      antwoord: |-
        $\frac32$
      uitwerking: |-
        $\frac00$: ontbinden. $\frac{(x - 1)(x^2 + x + 1)}{(x - 1)(x + 1)} = \frac{x^2 + x + 1}{x + 1} \to \frac32$.
    - opgave: |-
        $\displaystyle\lim_{x \to 0} \dfrac{\sqrt{1 + x} - \sqrt{1 - x}}{x}$
      antwoord: |-
        1
      uitwerking: |-
        $\frac00$ met wortels: maal $\sqrt{1 + x} + \sqrt{1 - x}$. $\frac{(1 + x) - (1 - x)}{x(\sqrt{1 + x} + \sqrt{1 - x})} = \frac{2}{\sqrt{1 + x} + \sqrt{1 - x}} \to \frac22 = 1$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{\sqrt{4x^2 + 1}}{x + 3}$
      antwoord: |-
        2
      uitwerking: |-
        Voor $x > 0$ is $\sqrt{4x^2 + 1} = x\sqrt{4 + 1/x^2}$. Delen door $x$: $\frac{\sqrt{4 + 1/x^2}}{1 + 3/x} \to 2$.
    - opgave: |-
        $\displaystyle\lim_{x \to -\infty} \dfrac{\sqrt{4x^2 + 1}}{x + 3}$
      antwoord: |-
        $-2$
      uitwerking: |-
        Voor $x < 0$ is $\sqrt{x^2} = |x| = -x$, dus $\sqrt{4x^2 + 1} = -x\sqrt{4 + 1/x^2}$. Delen door $x$: $\frac{-\sqrt{4 + 1/x^2}}{1 + 3/x} \to -2$.
    - opgave: |-
        $\displaystyle\lim_{x \to 2} \Bigl(\dfrac{1}{x - 2} - \dfrac{4}{x^2 - 4}\Bigr)$
      antwoord: |-
        $\frac14$
      uitwerking: |-
        $\infty - \infty$: eerst op één noemer. $\frac{x + 2 - 4}{(x - 2)(x + 2)} = \frac{1}{x + 2} \to \frac14$.
    - opgave: |-
        $\displaystyle\lim_{x \to 0} \dfrac{(x + 3)^2 - 9}{x}$
      antwoord: |-
        6
      uitwerking: |-
        $\frac{x^2 + 6x}{x} = x + 6 \to 6$.
    - opgave: |-
        $\displaystyle\lim_{x \to 3} \dfrac{x - 3}{\sqrt{x + 1} - 2}$
      antwoord: |-
        4
      uitwerking: |-
        Maal $\sqrt{x + 1} + 2$: $\frac{(x - 3)(\sqrt{x + 1} + 2)}{x + 1 - 4} = \sqrt{x + 1} + 2 \to 4$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \bigl(x - \sqrt{x^2 - 6x}\bigr)$
      antwoord: |-
        3
      uitwerking: |-
        $\infty - \infty$ met een wortel: maal $\frac{x + \sqrt{x^2 - 6x}}{x + \sqrt{x^2 - 6x}}$. $\frac{6x}{x + \sqrt{x^2 - 6x}} = \frac{6}{1 + \sqrt{1 - 6/x}} \to 3$.
    - opgave: |-
        $\displaystyle\lim_{x \to -2} \dfrac{x^3 + 8}{x^2 + 5x + 6}$
      antwoord: |-
        12
      uitwerking: |-
        $\frac{(x + 2)(x^2 - 2x + 4)}{(x + 2)(x + 3)} = \frac{x^2 - 2x + 4}{x + 3} \to \frac{12}{1} = 12$.
    - opgave: |-
        $\displaystyle\lim_{x \to 1} \dfrac{x^2 - 1}{|x - 1|}$
      antwoord: |-
        bestaat niet
      uitwerking: |-
        Rechts van $1$: $\frac{(x - 1)(x + 1)}{x - 1} = x + 1 \to 2$. Links: $\frac{(x - 1)(x + 1)}{-(x - 1)} = -(x + 1) \to -2$. Ze verschillen.
    - opgave: |-
        $\displaystyle\lim_{x \to 0} \dfrac{1}{x}\Bigl(\dfrac{1}{x + 2} - \dfrac12\Bigr)$
      antwoord: |-
        $-\frac14$
      uitwerking: |-
        $\frac{1}{x + 2} - \frac12 = \frac{2 - x - 2}{2(x + 2)} = \frac{-x}{2(x + 2)}$. Delen door $x$: $\frac{-1}{2(x + 2)} \to -\frac14$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{(2x - 1)^3}{x^3 + x}$
      antwoord: |-
        8
      uitwerking: |-
        Hoogste macht in de teller: $8x^3$. Delen door $x^3$: $\frac{(2 - 1/x)^3}{1 + 1/x^2} \to 8$.

- id: h1-o5
  soort: opdracht
  niveau: 2
  thema: |-
    eenzijdige limieten
  opgave: |-
    Bereken $\liml{x}{0} \dfrac{|x|}{x}$ en $\limr{x}{0} \dfrac{|x|}{x}$. Bestaat $\lim_{x \to 0} \dfrac{|x|}{x}$? Schets de grafiek.
  antwoord: |-
    $-1$; $1$; nee
  uitwerking: |-
    Voor $x < 0$ is $|x| = -x$, dus $\frac{|x|}{x} = -1$. Voor $x > 0$ is het $1$. De linkerlimiet is $-1$ en de rechterlimiet $1$: ze verschillen, de limiet bestaat niet. De grafiek bestaat uit twee horizontale halve rechten, met open bolletjes in $(0, -1)$ en $(0, 1)$.
    \figuren{\begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
      \rooster{-3}{1}{3}{-2}{1}{2}
      \draw[accent,thick] (-3,-1) -- (0,-1) (0,1) -- (3,1);
      \open{(0,-1)} \open{(0,1)}
    \end{tikzpicture}}

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    Waar zit de fout? Klassieke fouten bij limieten
  opgave: |-
    Elke redenering bevat een fout. Waar zit de fout? Geef het juiste antwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to 2} \dfrac{x^2 - 4}{x - 2} = \dfrac00 = 1$
      antwoord: |-
        $\frac00$ is onbepaald; de limiet is $4$
      uitwerking: |-
        $\frac00$ is geen getal maar een onbepaalde vorm: het zegt alleen dat je moet vereenvoudigen. $\frac{(x - 2)(x + 2)}{x - 2} = x + 2 \to 4$.
    - opgave: |-
        $\displaystyle\lim_{x \to 3} \dfrac{x + 3}{x - 3} = +\infty$
      antwoord: |-
        links $-\infty$, rechts $+\infty$; de limiet bestaat niet
      uitwerking: |-
        Dat geldt alleen rechts van $3$. Links is de noemer negatief: $\liml{x}{3} \frac{x + 3}{x - 3} = -\infty$. De eenzijdige limieten verschillen, dus de limiet bestaat niet.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \bigl(\sqrt{x^2 + 4x} - x\bigr) = \infty - \infty = 0$
      antwoord: |-
        $\infty - \infty$ is onbepaald; de limiet is $2$
      uitwerking: |-
        Ook $\infty - \infty$ is een onbepaalde vorm. Met de toegevoegde: $\frac{4x}{\sqrt{x^2 + 4x} + x} = \frac{4}{\sqrt{1 + 4/x} + 1} \to 2$.
    - opgave: |-
        $\displaystyle\lim_{x \to -\infty} \dfrac{\sqrt{x^2 + 1}}{x} = \lim_{x \to -\infty} \dfrac{x\sqrt{1 + 1/x^2}}{x} = 1$
      antwoord: |-
        $\sqrt{x^2} = -x$ voor $x < 0$; de limiet is $-1$
      uitwerking: |-
        $\sqrt{x^2} = |x|$, en voor $x < 0$ is dat $-x$. Dus $\sqrt{x^2 + 1} = -x\sqrt{1 + 1/x^2}$ en de limiet is $-1$. Logisch: de teller is positief en de noemer negatief.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \dfrac{2x^2 + 1}{x^3} = 2$, want de coëfficiënten van de hoogste machten zijn $2$ en $1$.
      antwoord: |-
        de graden verschillen; de limiet is $0$
      uitwerking: |-
        Dat werkt alleen als teller en noemer dezelfde graad hebben. Delen door $x^3$: $\frac{2/x + 1/x^3}{1} \to 0$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    context: gemiddelde kost per stuk
  opgave: |-
    Een kleine brouwerij heeft per maand $1500$ euro vaste kosten, en elke fles kost $0{,}80$ euro aan grondstoffen. Bij $q$ flessen is de gemiddelde kost per fles $K(q) = \dfrac{1500 + 0{,}8q}{q}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $K(100)$ en $K(1000)$.
      antwoord: |-
        $15{,}80$ euro; $2{,}30$ euro
      uitwerking: |-
        $K(100) = \frac{1500 + 80}{100} = 15{,}80$ en $K(1000) = \frac{1500 + 800}{1000} = 2{,}30$ euro.
    - opgave: |-
        Bereken $\lim_{q \to +\infty} K(q)$. Wat betekent dat getal voor de brouwerij?
      antwoord: |-
        $0{,}80$ euro
      uitwerking: |-
        $K(q) = \frac{1500}{q} + 0{,}8 \to 0{,}8$. Bij heel veel flessen worden de vaste kosten over zoveel flessen verdeeld dat alleen de grondstoffen overblijven. De gemiddelde kost zakt nooit onder $0{,}80$ euro.
    - opgave: |-
        Vanaf hoeveel flessen is de gemiddelde kost lager dan $1$ euro?
      antwoord: |-
        meer dan $7500$ flessen
      uitwerking: |-
        $\frac{1500}{q} + 0{,}8 < 1 \iff \frac{1500}{q} < 0{,}2 \iff q > 7500$.
    - opgave: |-
        Bereken $\limr{q}{0} K(q)$. Waarom heeft dat in de praktijk weinig zin?
      antwoord: |-
        $+\infty$
      uitwerking: |-
        $\frac{1500}{q} \to +\infty$. Wiskundig is $q = 0$ een verticale asymptoot, maar $q$ is een natuurlijk getal: de kleinste zinvolle waarde is $q = 1$, met $K(1) = 1500{,}80$ euro.

- id: h1-o6
  soort: opdracht
  niveau: 2
  thema: |-
    met de toegevoegde
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\lim_{x \to 1} \dfrac{\sqrt{x} - 1}{x - 1}$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        $\frac{\sqrt x - 1}{(\sqrt x - 1)(\sqrt x + 1)} = \frac{1}{\sqrt x + 1} \to \frac12$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \bigl(\sqrt{x^2 + x} - x\bigr)$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        Maal $\frac{\sqrt{x^2 + x} + x}{\sqrt{x^2 + x} + x}$: $\frac{x}{\sqrt{x^2 + x} + x} = \frac{1}{\sqrt{1 + 1/x} + 1} \to \frac12$.
    - opgave: |-
        $\displaystyle\lim_{x \to 0} \dfrac{x}{\sqrt{x + 9} - 3}$
      antwoord: |-
        6
      uitwerking: |-
        Maal $\sqrt{x + 9} + 3$: $\frac{x(\sqrt{x + 9} + 3)}{x + 9 - 9} = \sqrt{x + 9} + 3 \to 6$.
    - opgave: |-
        $\displaystyle\lim_{x \to 4} \dfrac{\sqrt{x + 5} - 3}{x - 4}$
      antwoord: |-
        $\frac16$
      uitwerking: |-
        Maal $\sqrt{x + 5} + 3$: $\frac{x + 5 - 9}{(x - 4)(\sqrt{x + 5} + 3)} = \frac{1}{\sqrt{x + 5} + 3} \to \frac16$.
    - opgave: |-
        $\displaystyle\lim_{x \to +\infty} \bigl(\sqrt{x^2 + 1} - \sqrt{x^2 - 1}\bigr)$
      antwoord: |-
        0
      uitwerking: |-
        Maal met de toegevoegde: $\frac{(x^2 + 1) - (x^2 - 1)}{\sqrt{x^2 + 1} + \sqrt{x^2 - 1}} = \frac{2}{\sqrt{x^2 + 1} + \sqrt{x^2 - 1}}$. De noemer wordt onbeperkt groot: $0$.
    - opgave: |-
        $\displaystyle\lim_{x \to 1} \dfrac{\sqrt{x + 3} - 2}{\sqrt{x} - 1}$
      antwoord: |-
        $\frac12$
      uitwerking: |-
        Twee wortels: maal met beide toegevoegden. $\frac{(x + 3 - 4)(\sqrt x + 1)}{(x - 1)(\sqrt{x + 3} + 2)} = \frac{\sqrt x + 1}{\sqrt{x + 3} + 2} \to \frac24 = \frac12$.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    context: concentratie in een reservoir
  figuur:
    code: |-
      \begin{tikzpicture}[x=.035cm,y=.06cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=20,ystep=10] (0,0) grid (120,50);
        \draw[->,grijs] (0,0) -- (128,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,56) node[above,text=black] {$c$};
        \foreach \t in {20,40,...,120} \node[below,inner sep=1.5pt] at (\t,0) {$\t$};
        \foreach \t in {10,20,...,50} \node[left,inner sep=1.5pt] at (0,\t) {$\t$};
        \draw[grijs,dashed] (0,50) -- (120,50);
        \kromme{0}{120}{50*\x/(20+\x)}
      \end{tikzpicture}
  opgave: |-
    In een groot reservoir zit $200$ liter zuiver water. Vanaf $t = 0$ loopt er elke minuut $10$ liter suikerwater bij met $50$ gram suiker per liter. Er loopt niets weg.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de concentratie na $t$ minuten gelijk is aan $c(t) = \tfrac{50t}{20 + t}$, in gram per liter.
      antwoord: |-
        $\frac{500t}{200 + 10t}$
      uitwerking: |-
        Na $t$ minuten zit er $50 \cdot 10t = 500t$ gram suiker in $200 + 10t$ liter. $c(t) = \frac{500t}{200 + 10t} = \frac{50t}{20 + t}$, na delen door $10$.
    - opgave: |-
        Bereken $c(10)$ en $c(60)$.
      antwoord: |-
        $\approx 16{,}7$ en $37{,}5$ g/l
      uitwerking: |-
        $c(10) = \frac{500}{30} \approx 16{,}7$ g/l en $c(60) = \frac{3000}{80} = 37{,}5$ g/l.
    - opgave: |-
        Bereken $\lim_{t \to +\infty} c(t)$ en verklaar de uitkomst zonder te rekenen.
      antwoord: |-
        $50$ g/l
      uitwerking: |-
        $\frac{50}{20/t + 1} \to 50$. Na lange tijd is het oorspronkelijke water verwaarloosbaar tegenover het toegevoegde suikerwater, dat $50$ g/l bevat. De concentratie haalt die waarde nooit: $y = 50$ is een horizontale asymptoot.

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    continu maken
  opgave: |-
    Bepaal $a$ zodat $f$ continu is: $f(x) = ax + 1$ voor $x < 2$ en $f(x) = x^2 - a$ voor $x \geqslant 2$.
  antwoord: |-
    $a = 1$
  uitwerking: |-
    Beide voorschriften zijn veeltermen, dus alleen in $2$ kan het mislopen. Linkerlimiet $2a + 1$, rechterlimiet en $f(2)$: $4 - a$. $2a + 1 = 4 - a$ geeft $a = 1$.

- id: h1-o21
  soort: opdracht
  niveau: 2
  thema: |-
    een parameter zodat de limiet bestaat
  opgave: |-
    Neem $f(x) = \dfrac{x^2 + ax - 6}{x - 2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $a$ zodat $\lim_{x \to 2} f(x)$ een getal is, en bereken dan die limiet.
      antwoord: |-
        $a = 1$; limiet $5$
      uitwerking: |-
        De noemer nadert $0$. Is de teller in $2$ niet nul, dan krijg je $\pm\infty$. Dus moet $4 + 2a - 6 = 0$, of $a = 1$. Dan is $\frac{x^2 + x - 6}{x - 2} = \frac{(x - 2)(x + 3)}{x - 2} = x + 3 \to 5$.
    - opgave: |-
        Wat gebeurt er in $2$ voor $a = 3$?
      antwoord: |-
        links $-\infty$, rechts $+\infty$
      uitwerking: |-
        De teller nadert $4 + 6 - 6 = 4 > 0$. Links is de noemer negatief: $-\infty$; rechts positief: $+\infty$. De grafiek heeft dan een verticale asymptoot $x = 2$.

- id: h1-o22
  soort: opdracht
  niveau: 2
  thema: |-
    de tussenwaardestelling toepassen
  opgave: |-
    De tussenwaardestelling.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $x^5 + x = 3$ een oplossing heeft tussen $1$ en $2$.
      antwoord: |-
        $g(1) = -1$, $g(2) = 31$
      uitwerking: |-
        $g(x) = x^5 + x - 3$ is een veelterm, dus continu. $g(1) = -1 < 0$ en $g(2) = 31 > 0$: er is een nulwaarde in $\left]1, 2\right[$.
    - opgave: |-
        Toon aan dat $\ln x = 2 - x$ een oplossing heeft, en geef een interval met lengte $0{,}1$ dat ze bevat.
      antwoord: |-
        in $\left]1{,}5;\ 1{,}6\right[$
      uitwerking: |-
        $g(x) = \ln x + x - 2$ is continu op $\left]0, +\infty\right[$. $g(1) = -1$ en $g(2) = \ln 2 > 0$. Verder $g(1{,}5) \approx -0{,}095$ en $g(1{,}6) \approx 0{,}070$: een oplossing in $\left]1{,}5;\ 1{,}6\right[$.
    - opgave: |-
        $f(x) = \dfrac1x$ heeft $f(-1) = -1 < 0$ en $f(1) = 1 > 0$, maar geen nulwaarde. Is dat in strijd met de tussenwaardestelling?
      antwoord: |-
        nee: $f$ is niet continu op $[-1, 1]$
      uitwerking: |-
        Nee. De stelling vraagt een functie die continu is op het hele interval $[-1, 1]$, en $\frac1x$ bestaat niet in $0$. De grafiek springt daar van $-\infty$ naar $+\infty$ zonder de as te snijden.

- id: h1-o20
  soort: opdracht
  niveau: 2
  thema: |-
    twee parameters, continu op R
  opgave: |-
    Bepaal $a$ en $b$ zodat $f$ continu is op $\R$, en schets dan de grafiek.
    \[f(x) = \begin{cases} x^2 + a & \text{als } x < -1 \\ bx + 1 & \text{als } -1 \leqslant x \leqslant 2 \\ 7 - x & \text{als } x > 2 \end{cases}\]
  antwoord: |-
    $a = -2$, $b = 2$
  uitwerking: |-
    Elk voorschrift is een veelterm, dus alleen $-1$ en $2$ zijn gevaarlijk. Begin in $2$, want daar komt maar één onbekende voor: $2b + 1 = 7 - 2 = 5$, dus $b = 2$. In $-1$: linkerlimiet $1 + a$, rechterlimiet en $f(-1)$: $-b + 1 = -1$. Dus $a = -2$.
    \figuren{\begin{tikzpicture}[x=.45cm,y=.4cm,font=\scriptsize]
      \rooster{-3}{1}{5}{-2}{1}{6}
      \kromme{-2.8}{-1}{(\x)^2-2}
      \draw[accent,thick] (-1,-1) -- (2,5) -- (5,2);
    \end{tikzpicture}}

- id: h1-o23
  soort: opdracht
  niveau: 2
  thema: |-
    zelf een grafiek en een voorschrift bedenken
  opgave: |-
    Bedenk zelf.
  lijst: enumerate
  delen:
    - opgave: |-
        Schets de grafiek van een functie $f$ met $\dom f = \R \setminus \{2\}$, $f(0) = 0$, $\liml{x}{2} f(x) = -\infty$, $\limr{x}{2} f(x) = +\infty$ en $\lim_{x \to \pm\infty} f(x) = 1$.
      antwoord: |-
        bijvoorbeeld $f(x) = \frac{x}{x - 2}$
      uitwerking: |-
        Teken eerst de asymptoten $x = 2$ en $y = 1$, en het punt $(0, 0)$. Links van $2$ daalt de grafiek naar $-\infty$, rechts komt ze van $+\infty$. Een voorbeeld is $f(x) = \frac{x}{x - 2}$, met de grafiek hieronder.
        \figuren{\begin{tikzpicture}[x=.5cm,y=.36cm,font=\scriptsize]
          \rooster{-4}{1}{6}{-4}{1}{6}
          \draw[grijs,dashed] (2,-4) -- (2,6) (-4,1) -- (6,1);
          \kromme{-4}{1.2}{\x/(\x-2)}
          \kromme{2.4}{6}{\x/(\x-2)}
          \vol{(0,0)}
        \end{tikzpicture}}
    - opgave: |-
        Geef een voorschrift van een rationale functie met verticale asymptoot $x = 3$, horizontale asymptoot $y = 2$ en een perforatie in $x = -1$.
      antwoord: |-
        bijvoorbeeld $\frac{2x(x + 1)}{(x - 3)(x + 1)}$
      uitwerking: |-
        Begin met $\frac{2x}{x - 3}$: noemer nul in $3$, teller daar $6 \neq 0$, en in $\pm\infty$ de limiet $2$. Vermenigvuldig teller en noemer met $x + 1$: dan ligt $-1$ niet meer in het domein, maar de limiet in $-1$ bestaat ($\frac{-2}{-4} = \frac12$). Dat is een perforatie. Ook andere antwoorden zijn juist.

- id: h1-o24
  soort: opdracht
  niveau: 2
  thema: |-
    continuïteit in een context: een tarief
  opgave: |-
    Een pakjesdienst rekent $5$ euro voor een pakje tot en met $2$ kg, en daarboven $5 + 1{,}5(m - 2)$ euro, met $m$ de massa in kg. Een concurrent rekent $4 + 0{,}5m$ euro tot en met $2$ kg, en $3m$ euro daarboven.
  lijst: enumerate
  delen:
    - opgave: |-
        Is de prijs bij elk bedrijf een continue functie van $m$ in $m = 2$? Gebruik linker- en rechterlimiet.
      antwoord: |-
        eerste: ja; concurrent: nee
      uitwerking: |-
        Eerste bedrijf: links $5$, rechts $5 + 1{,}5 \cdot 0 = 5$, en de prijs in $2$ is $5$: continu. Concurrent: links en in $2$ is het $4 + 1 = 5$, rechts $3 \cdot 2 = 6$: een sprong van $1$ euro, dus niet continu.
    - opgave: |-
        Waarom is een sprong in het tarief vervelend voor de klant?
      antwoord: |-
        net boven 2 kg betaal je meteen 1 euro meer
      uitwerking: |-
        Bij de concurrent kost een pakje van $2$ kg $5$ euro, maar een pakje van $2{,}01$ kg al $6{,}03$ euro. Een paar gram meer kost dus meer dan een euro.

#---------------------------------------- niveau 3

- id: h1-o8
  soort: opdracht
  niveau: 3
  thema: |-
    epsilon en delta
  opgave: |-
    Bewijs met de definitie: $\lim_{x \to 3} x^2 = 9$. Tip: $|x^2 - 9| = |x - 3| \cdot |x + 3|$; neem eerst $\delta \leqslant 1$ en schat $|x + 3|$ af.
  antwoord: |-
    $\delta = \min\bigl(1, \frac{\varepsilon}{7}\bigr)$
  uitwerking: |-
    Neem $\varepsilon > 0$. Als $|x - 3| < 1$, dan $2 < x < 4$ en dus $5 < x + 3 < 7$, zodat $|x + 3| < 7$. Neem $\delta = \min\bigl(1, \frac{\varepsilon}{7}\bigr)$. Als $0 < |x - 3| < \delta$, dan geldt allebei, en $|x^2 - 9| = |x - 3| \cdot |x + 3| < \frac{\varepsilon}{7} \cdot 7 = \varepsilon$.

- id: h1-o25
  soort: opdracht
  niveau: 3
  thema: |-
    epsilon en delta: een wortel, en een limiet die niet bestaat
  opgave: |-
    Bewijzen met de definitie.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs: $\lim_{x \to 4} \sqrt{x} = 2$. Tip: $|\sqrt x - 2| = \dfrac{|x - 4|}{\sqrt x + 2}$.
      antwoord: |-
        $\delta = \min(4, 2\varepsilon)$
      uitwerking: |-
        Neem $\varepsilon > 0$. Kies $\delta \leqslant 4$, zodat $x > 0$ en de wortel bestaat. Omdat $\sqrt x + 2 \geqslant 2$, is $|\sqrt x - 2| = \frac{|x - 4|}{\sqrt x + 2} \leqslant \frac{|x - 4|}{2}$. Neem $\delta = \min(4, 2\varepsilon)$. Als $0 < |x - 4| < \delta$, dan is $|\sqrt x - 2| \leqslant \frac{|x - 4|}{2} < \frac{2\varepsilon}{2} = \varepsilon$.
    - opgave: |-
        Bewijs dat $\lim_{x \to 0} \dfrac{|x|}{x}$ niet bestaat. Tip: stel dat de limiet $L$ is, en neem $\varepsilon = 1$.
      antwoord: |-
        $2 = |1 - (-1)| < 1 + 1$ is onmogelijk
      uitwerking: |-
        Stel dat de limiet $L$ is. Bij $\varepsilon = 1$ hoort dan een $\delta > 0$ met $\bigl|\frac{|x|}{x} - L\bigr| < 1$ als $0 < |x| < \delta$. Neem $x = \frac{\delta}{2}$: $|1 - L| < 1$. Neem $x = -\frac{\delta}{2}$: $|-1 - L| < 1$. Dan is $2 = |1 - L + L + 1| \leqslant |1 - L| + |L + 1| < 2$, een tegenspraak. Dus bestaat er geen limiet.

- id: h1-o9
  soort: opdracht
  niveau: 3
  thema: |-
    snijpunten zoeken
  opgave: |-
    Toon aan dat $2^x = 3x$ een oplossing heeft tussen $0$ en $1$, en een tussen $3$ en $4$. Zoek de eerste op twee decimalen door het interval te halveren.
  antwoord: |-
    $x \approx 0{,}46$
  uitwerking: |-
    $g(x) = 2^x - 3x$ is continu. $g(0) = 1$, $g(1) = -1$; $g(3) = -1$, $g(4) = 4$: twee tekenwissels. $g(0{,}5) \approx -0{,}09$, $g(0{,}25) \approx 0{,}44$, $g(0{,}45) \approx 0{,}016$, $g(0{,}46) \approx -0{,}004$: $x \approx 0{,}46$.

- id: h1-o26
  soort: opdracht
  niveau: 3
  thema: |-
    insluiten: een limiet tussen twee grafieken
  figuur:
    code: |-
      \begin{tikzpicture}[x=1.8cm,y=1.8cm,font=\scriptsize]
        \draw[black!14,very thin,step=.5] (-1,-1) grid (1,1);
        \draw[->,grijs] (-1,0) -- (1.15,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,-1) -- (0,1.15) node[above,text=black] {$y$};
        \node[below] at (1,0) {$1$}; \node[left] at (0,1) {$1$};
        \draw[grijs,dashed] (-1,1) -- (1,-1) (-1,-1) -- (1,1);
        \draw[accent,thick] plot[domain=.03:1,samples=300] (\x,{\x*sin(deg(1/\x))});
        \draw[accent,thick] plot[domain=-1:-.03,samples=300] (\x,{\x*sin(deg(1/\x))});
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f(x) = x\sin\dfrac1x$, tussen de stippellijnen $y = |x|$ en $y = -|x|$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $-|x| \leqslant x\sin\dfrac1x \leqslant |x|$ voor $x \neq 0$. Leid daaruit $\lim_{x \to 0} x\sin\dfrac1x$ af.
      antwoord: |-
        $0$
      uitwerking: |-
        $\bigl|\sin\frac1x\bigr| \leqslant 1$, dus $\bigl|x\sin\frac1x\bigr| = |x| \cdot \bigl|\sin\frac1x\bigr| \leqslant |x|$. Dat is de dubbele ongelijkheid. De grafiek zit dus ingesloten tussen $-|x|$ en $|x|$, en die naderen allebei $0$. Daarom is de limiet $0$. Met de definitie: neem $\delta = \varepsilon$, dan is $|f(x) - 0| \leqslant |x| < \varepsilon$. Deze redenering heet de insluitstelling.
    - opgave: |-
        Waarom bestaat $\lim_{x \to 0} \sin\dfrac1x$ niet? Tip: zoek getallen $x$ dicht bij $0$ met $\sin\frac1x = 1$, en andere met $\sin\frac1x = -1$.
      antwoord: |-
        de waarden $1$ en $-1$ komen willekeurig dicht bij $0$ voor
      uitwerking: |-
        $\sin\frac1x = 1$ voor $\frac1x = \frac{\pi}{2} + 2k\pi$, dus $x = \frac{1}{\pi/2 + 2k\pi}$, en $\sin\frac1x = -1$ voor $x = \frac{1}{3\pi/2 + 2k\pi}$. Voor grote $k$ liggen beide soorten getallen zo dicht bij $0$ als je wilt. De functiewaarden blijven dus tussen $-1$ en $1$ schommelen en naderen geen enkel getal.

- id: h1-o27
  soort: opdracht
  niveau: 3
  thema: |-
    een vast punt met de tussenwaardestelling
  opgave: |-
    Neem een functie $f$ die continu is op $[0, 1]$, met $0 \leqslant f(x) \leqslant 1$ voor alle $x$ in $[0, 1]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat er een $c$ in $[0, 1]$ bestaat met $f(c) = c$. Tip: bekijk $g(x) = f(x) - x$. Wat betekent dat voor de grafiek?
      antwoord: |-
        $g(0) \geqslant 0$ en $g(1) \leqslant 0$
      uitwerking: |-
        $g$ is continu als verschil van continue functies. $g(0) = f(0) \geqslant 0$ en $g(1) = f(1) - 1 \leqslant 0$. Is een van beide nul, dan is $c = 0$ of $c = 1$. Anders is $g(0) > 0 > g(1)$, en de tussenwaardestelling geeft een $c$ in $\left]0, 1\right[$ met $g(c) = 0$, dus $f(c) = c$. Meetkundig: de grafiek van $f$ snijdt de rechte $y = x$ minstens één keer.
    - opgave: |-
        Geldt dat ook voor een continue functie op $\left]0, 1\right[$ met waarden in $\left]0, 1\right[$? Zoek een tegenvoorbeeld.
      antwoord: |-
        nee, bijvoorbeeld $f(x) = \frac{x}{2}$
      uitwerking: |-
        Nee. $f(x) = \frac{x}{2}$ is continu op $\left]0, 1\right[$ met waarden in $\left]0, \frac12\right[$. Maar $\frac{x}{2} = x$ alleen voor $x = 0$, en dat ligt niet in het interval. De eindpunten zijn in a nodig om de tussenwaardestelling te kunnen gebruiken.

- id: h1-o28
  soort: opdracht
  niveau: 3
  thema: |-
    parameters in een limiet met een wortel
  opgave: |-
    Limieten met een parameter.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $a$ zodat $\lim_{x \to +\infty} \bigl(\sqrt{x^2 + ax} - x\bigr) = 3$.
      antwoord: |-
        $a = 6$
      uitwerking: |-
        Met de toegevoegde: $\frac{ax}{\sqrt{x^2 + ax} + x} = \frac{a}{\sqrt{1 + a/x} + 1} \to \frac{a}{2}$. Dus $\frac{a}{2} = 3$ en $a = 6$.
    - opgave: |-
        Bereken voor die $a$ ook $\lim_{x \to -\infty} \bigl(\sqrt{x^2 + ax} - x\bigr)$.
      antwoord: |-
        $+\infty$
      uitwerking: |-
        Voor $x \to -\infty$ is $\sqrt{x^2 + 6x} \to +\infty$ en $-x \to +\infty$: geen onbepaalde vorm, de som gaat naar $+\infty$.
    - opgave: |-
        Bepaal $p$ en $q$ zodat $\lim_{x \to +\infty} \bigl(\sqrt{4x^2 + x} - px - q\bigr) = 0$. Wat betekent dat voor de grafiek van $y = \sqrt{4x^2 + x}$?
      antwoord: |-
        $p = 2$, $q = \frac14$; schuine asymptoot $y = 2x + \frac14$
      uitwerking: |-
        $\sqrt{4x^2 + x} = x\sqrt{4 + 1/x}$, dus $\sqrt{4x^2 + x} - px = x\bigl(\sqrt{4 + 1/x} - p\bigr)$. Dat blijft alleen eindig als $p = 2$. Dan is $\sqrt{4x^2 + x} - 2x = \frac{x}{\sqrt{4x^2 + x} + 2x} = \frac{1}{\sqrt{4 + 1/x} + 2} \to \frac14$, dus $q = \frac14$. De grafiek nadert rechts de rechte $y = 2x + \frac14$: een schuine asymptoot.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Rationale functies
  thema: |-
    schuine asymptoot met limieten
  opgave: |-
    Een schuine asymptoot $y = mx + q$ vind je ook met $m = \lim_{x \to \infty} \frac{f(x)}{x}$ en $q = \lim_{x \to \infty} \bigl(f(x) - mx\bigr)$. Doe dat voor $f(x) = \dfrac{x^2 + x - 1}{x - 1}$, en vergelijk met de deling.
  antwoord: |-
    $m = 1$, $q = 2$: $y = x + 2$
  uitwerking: |-
    $\frac{f(x)}{x} = \frac{x^2 + x - 1}{x^2 - x} \to 1$. $f(x) - x = \frac{x^2 + x - 1 - x^2 + x}{x - 1} = \frac{2x - 1}{x - 1} \to 2$. Dus $y = x + 2$, zoals met de deling: $f(x) = x + 2 + \frac{1}{x - 1}$.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: discreet
    onderwerp: Rijen
  thema: |-
    een meetkundige reeks
  opgave: |-
    De som $1 + \frac12 + \frac14 + \cdots + \bigl(\frac12\bigr)^{n-1}$ is $S_n = \dfrac{1 - \bigl(\frac12\bigr)^n}{1 - \frac12}$. Bereken $\lim_{n \to +\infty} S_n$.
  antwoord: |-
    2
  uitwerking: |-
    $\bigl(\frac12\bigr)^n \to 0$, dus $S_n \to \frac{1}{1/2} = 2$.

- id: h1-koppel-3
  soort: koppel
  niveau: 1
  koppel:
    rubriek: analyse
    onderwerp: Exponentiële en logaritmische functies
  thema: |-
    asymptoten van exp en ln
  opgave: |-
    Schrijf met limieten waarom $y = 0$ een horizontale asymptoot is van $\e^x$, en $x = 0$ een verticale asymptoot van $\ln x$.
  antwoord: |-
    $\lim_{x \to -\infty} \e^x = 0$; $\limr{x}{0} \ln x = -\infty$
  uitwerking: |-
    $\lim_{x \to -\infty} \e^x = 0$ en $\limr{x}{0} \ln x = -\infty$. De grafieken zijn elkaars spiegelbeeld om $y = x$, en de asymptoten ook.

