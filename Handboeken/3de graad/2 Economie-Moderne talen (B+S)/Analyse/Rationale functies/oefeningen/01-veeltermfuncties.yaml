- id: h1-t6
  soort: test
  niveau: 2
  thema: |-
    voorschrift uit nulwaarden
  opgave: |-
    Een veeltermfunctie van graad 4 raakt de $x$-as in $1$, snijdt ze in $-2$ en in $3$, en $f(0) = 3$. Geef het voorschrift. Hoe gedraagt de grafiek zich aan de uiteinden?
  antwoord: |-
    $f(x) = -\frac12(x - 1)^2(x + 2)(x - 3)$; links en rechts onder
  uitwerking: |-
    Raken in $1$: factor $(x - 1)^2$. Snijden in $-2$ en $3$: factoren $x + 2$ en $x - 3$. Samen graad 4, dus $f(x) = a(x - 1)^2(x + 2)(x - 3)$. Uit $f(0) = a \cdot 1 \cdot 2 \cdot (-3) = -6a = 3$ volgt $a = -\frac12$. Hoogstegraadsterm $-\frac12 x^4$: aan beide kanten onder.
