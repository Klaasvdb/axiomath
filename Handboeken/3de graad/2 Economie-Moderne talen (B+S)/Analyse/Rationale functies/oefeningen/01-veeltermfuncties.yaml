# Oefeningen van hoofdstuk 1. Zie oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Werk uit: $(x - 2)(x^2 + x + 1)$.
      antwoord: |-
        $x^3 - x^2 - x - 2$
      uitwerking: |-
        $x^3 + x^2 + x - 2x^2 - 2x - 2 = x^3 - x^2 - x - 2$.
    - opgave: |-
        Ontbind: $x^2 - 5x + 6$.
      antwoord: |-
        $(x - 2)(x - 3)$
      uitwerking: |-
        Som $5$, product $6$.
    - opgave: |-
        Ontbind: $x^3 - 4x$.
      antwoord: |-
        $x(x - 2)(x + 2)$
      uitwerking: |-
        $x(x^2 - 4)$.
    - opgave: |-
        Geef alle gehele delers van $12$.
      antwoord: |-
        $\pm 1, \pm 2, \pm 3, \pm 4, \pm 6, \pm 12$
      uitwerking: |-
        $\pm 1$, $\pm 2$, $\pm 3$, $\pm 4$, $\pm 6$, $\pm 12$.
    - opgave: |-
        Deel $147$ door $12$: quotiënt en rest?
      antwoord: |-
        12, rest 3
      uitwerking: |-
        $147 = 12 \cdot 12 + 3$.
    - opgave: |-
        Bereken $f(-1)$ als $f(x) = x^3 + 2x^2 - 3$.
      antwoord: |-
        $-2$
      uitwerking: |-
        $-1 + 2 - 3 = -2$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken} Neem $A(x) = x^3 - 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Werk uit: $(x - 1)(x^2 + x + 1)$. Wat valt op?
      antwoord: |-
        $x^3 - 1$
      uitwerking: |-
        $x^3 + x^2 + x - x^2 - x - 1 = x^3 - 1$: $x - 1$ is een deler van $A(x)$.
    - opgave: |-
        Bereken $A(1)$.
      antwoord: |-
        0
      uitwerking: |-
        $1 - 1 = 0$.
    - opgave: |-
        Is $x - 2$ een deler van $A(x)$? Bereken $A(2)$. Welk verband vermoed je?
      antwoord: |-
        nee; $A(2) = 7$
      uitwerking: |-
        $A(2) = 7 \neq 0$. Vermoeden: $x - a$ is een deler als en slechts als $A(a) = 0$.

- id: h1-horner
  soort: kort
  opgave: |-
    Bepaal quotiënt en rest met Horner, en controleer de rest met de reststelling.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x^3 - 4x^2 + x + 5) : (x - 3)$
      antwoord: |-
        $Q = x^2 - x - 2$, $R = -1$
      uitwerking: |-
        $a = 3$, coëfficiënten $1, -4, 1, 5$. Onderste rij $1, -1, -2, -1$. Controle: $A(3) = 27 - 36 + 3 + 5 = -1$.
    - opgave: |-
        $(2x^4 + x^3 - 7x + 1) : (x + 2)$
      antwoord: |-
        $Q = 2x^3 - 3x^2 + 6x - 19$, $R = 39$
      uitwerking: |-
        $a = -2$, coëfficiënten $2, 1, 0, -7, 1$ (de $0$ voor $x^2$ niet vergeten). Onderste rij $2, -3, 6, -19, 39$. Controle: $A(-2) = 32 - 8 + 14 + 1 = 39$.
    - opgave: |-
        $(x^3 + 8) : (x + 2)$
      antwoord: |-
        $Q = x^2 - 2x + 4$, $R = 0$
      uitwerking: |-
        $a = -2$, coëfficiënten $1, 0, 0, 8$. Onderste rij $1, -2, 4, 0$. Controle: $A(-2) = -8 + 8 = 0$, dus $x + 2$ is een deler.

- id: h1-delen
  soort: kort
  opgave: |-
    Bepaal quotiënt en rest.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x^3 + 4x^2 - 7) : (x + 3)$, met Horner
      antwoord: |-
        $Q = x^2 + x - 3$, $R = 2$
      uitwerking: |-
        $a = -3$, coëfficiënten $1, 4, 0, -7$: onderste rij $1, 1, -3, 2$. Controle: $A(-3) = -27 + 36 - 7 = 2$.
    - opgave: |-
        $(2x^3 + x^2 - 3x + 1) : (x^2 - 1)$
      antwoord: |-
        $Q = 2x + 1$, $R = -x + 2$
      uitwerking: |-
        Eerste term van $Q$: $2x$. $2x^3 + x^2 - 3x + 1 - 2x(x^2 - 1) = x^2 - x + 1$. Tweede term: $1$. $x^2 - x + 1 - 1 \cdot (x^2 - 1) = -x + 2$, van graad $1 < 2$: stop.

- id: h1-rest
  soort: kort
  opgave: |-
    Bepaal de rest zonder te delen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(x^4 - 3x^2 + 5) : (x - 2)$
      antwoord: |-
        $9$
      uitwerking: |-
        Reststelling met $a = 2$: $A(2) = 16 - 12 + 5 = 9$.
    - opgave: |-
        $(2x^3 + x - 4) : (x + 1)$
      antwoord: |-
        $-7$
      uitwerking: |-
        $x + 1 = x - (-1)$, dus $a = -1$: $A(-1) = -2 - 1 - 4 = -7$.
    - opgave: |-
        $(8x^3 - 2x + 1) : (2x - 1)$
      antwoord: |-
        $1$
      uitwerking: |-
        De deler is nul voor $x = \frac12$. Uit $A(x) = (2x - 1)Q(x) + r$ volgt dan $r = A\bigl(\frac12\bigr) = 8 \cdot \frac18 - 2 \cdot \frac12 + 1 = 1$.

- id: h1-ontbinden
  soort: kort
  opgave: |-
    Ontbind volledig en geef de nulwaarden.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^3 - 7x + 6$
      antwoord: |-
        $(x - 1)(x - 2)(x + 3)$
      uitwerking: |-
        $f(1) = 0$; Horner geeft $x^2 + x - 6 = (x - 2)(x + 3)$. Nulwaarden $-3$, $1$, $2$.
    - opgave: |-
        $2x^3 - 3x^2 - 3x + 2$
      antwoord: |-
        $(x + 1)(2x - 1)(x - 2)$
      uitwerking: |-
        $f(-1) = 0$; Horner geeft $2x^2 - 5x + 2 = (2x - 1)(x - 2)$. Nulwaarden $-1$, $\frac12$, $2$.

- id: h1-factor
  soort: kort
  opgave: |-
    Gebruik de factorstelling.
  lijst: enumerate
  delen:
    - opgave: |-
        Is $x + 2$ een deler van $x^3 + 3x^2 - 4$?
      antwoord: |-
        ja
      uitwerking: |-
        $a = -2$: $(-2)^3 + 3 \cdot 4 - 4 = -8 + 12 - 4 = 0$. Dus $x + 2$ is een deler.
    - opgave: |-
        Is $x - 1$ een deler van $x^4 + x^3 - x - 2$?
      antwoord: |-
        nee
      uitwerking: |-
        $a = 1$: $1 + 1 - 1 - 2 = -1 \neq 0$. Dus $x - 1$ is geen deler; de rest is $-1$.
    - opgave: |-
        Bepaal $k$ zodat $x - 3$ een deler is van $x^3 - kx + 6$.
      antwoord: |-
        $k = 11$
      uitwerking: |-
        $x - 3$ is een deler als de waarde in $3$ nul is: $27 - 3k + 6 = 0$, dus $3k = 33$ en $k = 11$.

- id: h1-multipliciteit
  soort: kort
  opgave: |-
    Ontbind en geef de nulwaarden met hun multipliciteit.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^4 - 6x^3 + 9x^2$
      antwoord: |-
        $0$ (2), $3$ (2)
      uitwerking: |-
        $x^2(x^2 - 6x + 9) = x^2(x - 3)^2$: $0$ en $3$, elk met multipliciteit $2$.
    - opgave: |-
        $x^3 - 3x + 2$
      antwoord: |-
        $1$ (2), $-2$ (1)
      uitwerking: |-
        Deler van $2$ proberen: $f(1) = 0$. Horner geeft $x^2 + x - 2 = (x - 1)(x + 2)$. Dus $(x - 1)^2(x + 2)$: $1$ met multipliciteit $2$, $-2$ met multipliciteit $1$.
    - opgave: |-
        $(x^2 - 4)^3$
      antwoord: |-
        $2$ (3), $-2$ (3)
      uitwerking: |-
        $(x^2 - 4)^3 = \bigl((x - 2)(x + 2)\bigr)^3 = (x - 2)^3(x + 2)^3$: beide met multipliciteit $3$.

- id: h1-schets
  soort: kort
  opgave: |-
    Geef de nulwaarden met multipliciteit, de tekentabel en het gedrag aan de uiteinden van $f(x) = x(x - 3)^2$. Schets de grafiek.
  antwoord: |-
    \tekentabel{cccccc}{x & & 0 & & 3 & }{f(x) & - & 0 & + & 0 & +}
  uitwerking: |-
    $0$ enkel (snijdt), $3$ dubbel (raakt). Hoogstegraadsterm $x^3$: links onder, rechts boven. \tekentabel{cccccc}{x & & 0 & & 3 & }{f(x) & - & 0 & + & 0 & +}
    \figuren{\begin{tikzpicture}[x=.55cm,y=.3cm,font=\scriptsize]
      \rooster{-1}{1}{4}{-3}{1}{5}
      \kromme{-.25}{4.1}{\x*(\x-3)^2}
      \vol{(0,0)} \vol{(3,0)}
    \end{tikzpicture}}

- id: h1-uiteinden
  soort: kort
  opgave: |-
    Geef de hoogstegraadsterm en het gedrag van de grafiek aan de uiteinden.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = 2x - x^3$
      antwoord: |-
        $-x^3$: links boven, rechts onder
      uitwerking: |-
        De hoogste macht is $x^3$, met coëfficiënt $-1$. Voor grote positieve $x$ is $-x^3$ sterk negatief (rechts onder), voor grote negatieve $x$ sterk positief (links boven).
    - opgave: |-
        $f(x) = (x - 1)^2(3 - x)^2$
      antwoord: |-
        $x^4$: links en rechts boven
      uitwerking: |-
        Vermenigvuldig de hoogste termen van de factoren: $x^2 \cdot (-x)^2 = x^4$. Een even macht met positieve coëfficiënt: aan beide kanten boven.
    - opgave: |-
        $f(x) = x^5 - 2x^4$
      antwoord: |-
        $x^5$: links onder, rechts boven
      uitwerking: |-
        De hoogste macht is $x^5$ (niet de term met de grootste coëfficiënt). Oneven, positief: links onder, rechts boven.

- id: h1-graad
  soort: kort
  opgave: |-
    Bepaal de graad, de hoogstegraadsterm en de constante term, zonder uit te werken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(3x - 1)^2(x^3 + 2)$
      antwoord: |-
        graad $5$; $9x^5$; $2$
      uitwerking: |-
        Hoogstegraadsterm $(3x)^2 \cdot x^3 = 9x^5$, dus graad $5$. Constante term $(-1)^2 \cdot 2 = 2$.
    - opgave: |-
        $(2 - x)^4(x + 5)$
      antwoord: |-
        graad $5$; $x^5$; $80$
      uitwerking: |-
        De hoogste term van $2 - x$ is $-x$: $(-x)^4 \cdot x = x^5$, want bij een even macht verdwijnt het minteken. Constante term $2^4 \cdot 5 = 80$.
    - opgave: |-
        $(x^2 + 1)^2 - x^4$
      antwoord: |-
        graad $2$; $2x^2$; $1$
      uitwerking: |-
        Een verschil, geen product: de regel geldt niet, want de termen in $x^4$ vallen weg. Uitwerken: $x^4 + 2x^2 + 1 - x^4 = 2x^2 + 1$.

- id: h1-staart
  soort: kort
  opgave: |-
    Bepaal quotiënt en rest met een staartdeling, en controleer.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x^3 - 2x^2 + 4x - 1) : (x^2 + 2)$
      antwoord: |-
        $Q = x - 2$, $R = 2x + 3$
      uitwerking: |-
        Eerste term $x$: $x^3 - 2x^2 + 4x - 1 - x(x^2 + 2) = -2x^2 + 2x - 1$. Tweede term $-2$: $-2x^2 + 2x - 1 + 2(x^2 + 2) = 2x + 3$, van graad $1 < 2$: stop. Controle: $(x^2 + 2)(x - 2) + 2x + 3 = x^3 - 2x^2 + 4x - 1$.
    - opgave: |-
        $(6x^3 + x^2 + 1) : (2x^2 - x)$
      antwoord: |-
        $Q = 3x + 2$, $R = 2x + 1$
      uitwerking: |-
        $6x^3 : 2x^2 = 3x$: $6x^3 + x^2 + 1 - 3x(2x^2 - x) = 4x^2 + 1$. $4x^2 : 2x^2 = 2$: $4x^2 + 1 - 2(2x^2 - x) = 2x + 1$: stop. Controle: $(2x^2 - x)(3x + 2) + 2x + 1 = 6x^3 + x^2 + 1$.

- id: h1-kandidaat
  soort: kort
  opgave: |-
    Gebruik de delers van de constante term.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de kandidaat-nulwaarden van $f(x) = x^3 + x^2 - 4x + 6$, en bepaal alle nulwaarden.
      antwoord: |-
        $\pm 1, \pm 2, \pm 3, \pm 6$; enige nulwaarde $-3$
      uitwerking: |-
        Kandidaten: de delers van $6$, dus $\pm 1, \pm 2, \pm 3, \pm 6$. Proberen: $f(1) = 4$, $f(-1) = 10$, $f(2) = 10$, $f(-2) = 10$, $f(-3) = -27 + 9 + 12 + 6 = 0$. Horner met $a = -3$ op $1, 1, -4, 6$ geeft $1, -2, 2$ en rest $0$: $f(x) = (x + 3)(x^2 - 2x + 2)$. De discriminant van $x^2 - 2x + 2$ is $4 - 8 < 0$, dus $-3$ is de enige nulwaarde. De andere kandidaten hoef je niet meer te proberen.
    - opgave: |-
        Toon aan dat $g(x) = 3x^3 + x^2 + 6x + 2$ geen gehele nulwaarde heeft. Ga na dat $-\frac13$ wel een nulwaarde is.
      antwoord: |-
        $g(\pm 1) \neq 0$, $g(\pm 2) \neq 0$; $g\bigl(-\frac13\bigr) = 0$
      uitwerking: |-
        De kandidaten zijn de delers van $2$: $g(1) = 12$, $g(-1) = -6$, $g(2) = 42$, $g(-2) = -30$. Geen enkele is nul. Maar $g\bigl(-\frac13\bigr) = -\frac19 + \frac19 - 2 + 2 = 0$. De stelling vindt alleen gehele nulwaarden; hier is $g(x) = (3x + 1)(x^2 + 2)$.

- id: h1-voorschrift
  soort: kort
  opgave: |-
    Gebruik het aantal nulwaarden.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de veeltermfunctie $f$ van graad 3 met nulwaarden $0$, $1$ en $4$, en $f(2) = 8$.
      antwoord: |-
        $f(x) = -2x(x - 1)(x - 4)$
      uitwerking: |-
        Drie nulwaarden bij graad 3: $f(x) = c\,x(x - 1)(x - 4)$. Dan is $f(2) = c \cdot 2 \cdot 1 \cdot (-2) = -4c = 8$, dus $c = -2$.
    - opgave: |-
        Bepaal de veeltermfunctie $f$ van graad 4 met dubbele nulwaarden $1$ en $-1$, en $f(0) = 3$.
      antwoord: |-
        $f(x) = 3(x - 1)^2(x + 1)^2$
      uitwerking: |-
        De multipliciteiten zijn samen $4$: $f(x) = c\,(x - 1)^2(x + 1)^2$. Dan is $f(0) = c \cdot 1 \cdot 1 = c = 3$.
    - opgave: |-
        Kan een veeltermfunctie van graad 3 de nulwaarden $1$ en $5$ en een dubbele nulwaarde $2$ hebben?
      antwoord: |-
        nee
      uitwerking: |-
        Geteld met multipliciteit zijn dat $1 + 1 + 2 = 4$ nulwaarden, en een veelterm van graad 3 heeft er hoogstens $3$.

- id: h1-teken
  soort: kort
  opgave: |-
    Stel de tekentabel op zonder getallen in te vullen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x^2(x - 4)(x + 1)^3$
      antwoord: |-
        \tekentabel{cccccccc}{x & & -1 & & 0 & & 4 & }{f(x) & + & 0 & - & 0 & - & 0 & +}
      uitwerking: |-
        Hoogstegraadsterm $x^2 \cdot x \cdot x^3 = x^6$: rechts positief. In $4$ (enkel) wisselt het teken, in $0$ (dubbel) niet, in $-1$ (multipliciteit 3) wel. \tekentabel{cccccccc}{x & & -1 & & 0 & & 4 & }{f(x) & + & 0 & - & 0 & - & 0 & +}
    - opgave: |-
        $f(x) = -(x - 2)^2(x + 3)$
      antwoord: |-
        \tekentabel{cccccc}{x & & -3 & & 2 & }{f(x) & + & 0 & - & 0 & -}
      uitwerking: |-
        Hoogstegraadsterm $-x^3$: rechts negatief. In $2$ (dubbel) blijft het teken, in $-3$ (enkel) wisselt het. \tekentabel{cccccc}{x & & -3 & & 2 & }{f(x) & + & 0 & - & 0 & -}
    - opgave: |-
        $f(x) = (x^2 + 1)(1 - x)^3$
      antwoord: |-
        \tekentabel{cccc}{x & & 1 & }{f(x) & + & 0 & -}
      uitwerking: |-
        Hoogstegraadsterm $x^2 \cdot (-x)^3 = -x^5$: rechts negatief. De factor $x^2 + 1$ is nooit nul. In $1$ (multipliciteit 3) wisselt het teken. \tekentabel{cccc}{x & & 1 & }{f(x) & + & 0 & -}

- id: h1-schets2
  soort: kort
  opgave: |-
    Ontbind en schets de grafiek van $f(x) = x^3 + x^2 - 5x + 3$.
  antwoord: |-
    $(x - 1)^2(x + 3)$: snijdt in $-3$, raakt in $1$
  uitwerking: |-
    Delers van $3$: $f(1) = 1 + 1 - 5 + 3 = 0$. Horner met $a = 1$ op $1, 1, -5, 3$ geeft $1, 2, -3$: $f(x) = (x - 1)(x^2 + 2x - 3) = (x - 1)^2(x + 3)$. Nulwaarden $1$ (dubbel: raakt) en $-3$ (enkel: snijdt). Hoogstegraadsterm $x^3$: links onder, rechts boven. $f(0) = 3$. \tekentabel{cccccc}{x & & -3 & & 1 & }{f(x) & - & 0 & + & 0 & +}
    \figuren{\begin{tikzpicture}[x=.55cm,y=.2cm,font=\scriptsize]
      \rooster{-4}{1}{2}{-6}{2}{10}
      \kromme{-3.3}{2.1}{(\x-1)^2*(\x+3)}
      \vol{(-3,0)} \vol{(1,0)} \vol{(0,3)}
    \end{tikzpicture}}

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: delen met Horner of een staartdeling
  opgave: |-
    Bepaal quotiënt en rest. Deel door $x - a$ met Horner, en door een veelterm van hogere graad met een staartdeling.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x^4 - 2x^2 + 3x - 1) : (x - 1)$
      antwoord: |-
        $Q = x^3 + x^2 - x + 2$, $R = 1$
      uitwerking: |-
        Horner met $a = 1$, coëfficiënten $1, 0, -2, 3, -1$: onderste rij $1, 1, -1, 2, 1$.
    - opgave: |-
        $(3x^3 - 2x + 4) : (x + 2)$
      antwoord: |-
        $Q = 3x^2 - 6x + 10$, $R = -16$
      uitwerking: |-
        Horner met $a = -2$, coëfficiënten $3, 0, -2, 4$: onderste rij $3, -6, 10, -16$.
    - opgave: |-
        $(x^3 - 6x^2 + 11x - 6) : (x - 3)$
      antwoord: |-
        $Q = x^2 - 3x + 2$, $R = 0$
      uitwerking: |-
        Horner met $a = 3$, coëfficiënten $1, -6, 11, -6$: onderste rij $1, -3, 2, 0$.
    - opgave: |-
        $(x^4 - 1) : (x + 1)$
      antwoord: |-
        $Q = x^3 - x^2 + x - 1$, $R = 0$
      uitwerking: |-
        Horner met $a = -1$, coëfficiënten $1, 0, 0, 0, -1$: onderste rij $1, -1, 1, -1, 0$.
    - opgave: |-
        $(2x^3 + 3x^2 - 5) : (x^2 + x - 1)$
      antwoord: |-
        $Q = 2x + 1$, $R = x - 4$
      uitwerking: |-
        Staartdeling. Eerste term $2x$: $2x^3 + 3x^2 - 5 - 2x(x^2 + x - 1) = x^2 + 2x - 5$. Tweede term $1$: $x^2 + 2x - 5 - (x^2 + x - 1) = x - 4$.
    - opgave: |-
        $(x^3 + 27) : (x + 3)$
      antwoord: |-
        $Q = x^2 - 3x + 9$, $R = 0$
      uitwerking: |-
        Horner met $a = -3$, coëfficiënten $1, 0, 0, 27$: onderste rij $1, -3, 9, 0$.
    - opgave: |-
        $(3x^4 + 2x^3 - x + 7) : (x^2 + 2)$
      antwoord: |-
        $Q = 3x^2 + 2x - 6$, $R = -5x + 19$
      uitwerking: |-
        Staartdeling. $3x^2$: rest $2x^3 - 6x^2 - x + 7$. $2x$: rest $-6x^2 - 5x + 7$. $-6$: rest $-5x + 19$, van graad $1 < 2$.
    - opgave: |-
        $(4x^3 - 2x^2 + x + 3) : \bigl(x + \tfrac12\bigr)$
      antwoord: |-
        $Q = 4x^2 - 4x + 3$, $R = \tfrac32$
      uitwerking: |-
        Horner met $a = -\frac12$, coëfficiënten $4, -2, 1, 3$: onderste rij $4, -4, 3, \frac32$.
    - opgave: |-
        $(x^5 - 2x^3 + x) : (x^2 - 1)$
      antwoord: |-
        $Q = x^3 - x$, $R = 0$
      uitwerking: |-
        Staartdeling. $x^3$: rest $-x^3 + x$. $-x$: rest $0$. Inderdaad is $x^5 - 2x^3 + x = x(x^2 - 1)^2$.
    - opgave: |-
        $(6x^3 - 7x^2 + 4) : (2x - 1)$
      antwoord: |-
        $Q = 3x^2 - 2x - 1$, $R = 3$
      uitwerking: |-
        Staartdeling. $3x^2$: rest $-4x^2 + 4$. $-2x$: rest $-2x + 4$. $-1$: rest $3$. Controle met de reststelling: $A\bigl(\frac12\bigr) = \frac34 - \frac74 + 4 = 3$.

- id: h1-o13
  soort: opdracht
  niveau: 1
  thema: |-
    gedrag aan de uiteinden
  opgave: |-
    Geef de hoogstegraadsterm. Ligt de grafiek links boven of onder? En rechts?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $5 - x^2 + 2x^3$
      antwoord: |-
        $2x^3$: links onder, rechts boven
      uitwerking: |-
        Oneven graad, positieve coëfficiënt: zoals $x^3$.
    - opgave: |-
        $-x^4 + 100x^3$
      antwoord: |-
        $-x^4$: links en rechts onder
      uitwerking: |-
        Even graad, negatieve coëfficiënt. De grote coëfficiënt $100$ maakt niets uit voor grote $|x|$.
    - opgave: |-
        $(2 - x)^3$
      antwoord: |-
        $-x^3$: links boven, rechts onder
      uitwerking: |-
        $(-x)^3 = -x^3$.
    - opgave: |-
        $x(x - 1)(3 - 2x)$
      antwoord: |-
        $-2x^3$: links boven, rechts onder
      uitwerking: |-
        $x \cdot x \cdot (-2x) = -2x^3$.
    - opgave: |-
        $(1 - x^2)^2$
      antwoord: |-
        $x^4$: links en rechts boven
      uitwerking: |-
        $(-x^2)^2 = x^4$.
    - opgave: |-
        $1 - x - x^5$
      antwoord: |-
        $-x^5$: links boven, rechts onder
      uitwerking: |-
        Oneven graad, negatieve coëfficiënt: zoals $-x^5$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    drill: ontbinden
  opgave: |-
    Ontbind volledig.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^3 - x^2 - 4x + 4$
      antwoord: |-
        $(x - 1)(x - 2)(x + 2)$
      uitwerking: |-
        Groeperen: $x^2(x - 1) - 4(x - 1) = (x - 1)(x^2 - 4) = (x - 1)(x - 2)(x + 2)$.
    - opgave: |-
        $x^4 - 5x^2 + 4$
      antwoord: |-
        $(x - 1)(x + 1)(x - 2)(x + 2)$
      uitwerking: |-
        Stel $t = x^2$: $t^2 - 5t + 4 = (t - 1)(t - 4)$, dus $(x^2 - 1)(x^2 - 4) = (x - 1)(x + 1)(x - 2)(x + 2)$.
    - opgave: |-
        $2x^3 - 8x$
      antwoord: |-
        $2x(x - 2)(x + 2)$
      uitwerking: |-
        Gemeenschappelijke factor: $2x(x^2 - 4) = 2x(x - 2)(x + 2)$.
    - opgave: |-
        $x^3 - 6x^2 + 9x$
      antwoord: |-
        $x(x - 3)^2$
      uitwerking: |-
        $x(x^2 - 6x + 9) = x(x - 3)^2$: een merkwaardig product.
    - opgave: |-
        $x^3 + x^2 - 5x + 3$
      antwoord: |-
        $(x - 1)^2(x + 3)$
      uitwerking: |-
        $f(1) = 1 + 1 - 5 + 3 = 0$. Horner: $x^2 + 2x - 3 = (x - 1)(x + 3)$. Samen $(x - 1)^2(x + 3)$.
    - opgave: |-
        $x^3 - 8$
      antwoord: |-
        $(x - 2)(x^2 + 2x + 4)$
      uitwerking: |-
        $f(2) = 0$. Horner met coëfficiënten $1, 0, 0, -8$: $x^2 + 2x + 4$, met discriminant $4 - 16 < 0$.
    - opgave: |-
        $x^3 + 2x^2 - x - 2$
      antwoord: |-
        $(x + 2)(x - 1)(x + 1)$
      uitwerking: |-
        Groeperen: $x^2(x + 2) - (x + 2) = (x + 2)(x^2 - 1) = (x + 2)(x - 1)(x + 1)$.
    - opgave: |-
        $x^4 - 16$
      antwoord: |-
        $(x - 2)(x + 2)(x^2 + 4)$
      uitwerking: |-
        Tweemaal een verschil van kwadraten: $(x^2 - 4)(x^2 + 4) = (x - 2)(x + 2)(x^2 + 4)$. De factor $x^2 + 4$ is nooit nul.
    - opgave: |-
        $2x^3 - x^2 - 7x + 6$
      antwoord: |-
        $(x - 1)(x + 2)(2x - 3)$
      uitwerking: |-
        $f(1) = 2 - 1 - 7 + 6 = 0$. Horner: $2x^2 + x - 6$, discriminant $49$, nulwaarden $-2$ en $\frac32$: $2x^2 + x - 6 = (x + 2)(2x - 3)$.
    - opgave: |-
        $x^4 + x^3 - 3x^2 - x + 2$
      antwoord: |-
        $(x - 1)^2(x + 1)(x + 2)$
      uitwerking: |-
        $f(1) = 0$: Horner geeft $x^3 + 2x^2 - x - 2$. Dat is $(x + 2)(x - 1)(x + 1)$ (groeperen). Samen $(x - 1)^2(x + 1)(x + 2)$.
    - opgave: |-
        $x^5 - x$
      antwoord: |-
        $x(x - 1)(x + 1)(x^2 + 1)$
      uitwerking: |-
        $x(x^4 - 1) = x(x^2 - 1)(x^2 + 1) = x(x - 1)(x + 1)(x^2 + 1)$.
    - opgave: |-
        $-x^3 + 7x - 6$
      antwoord: |-
        $-(x - 1)(x - 2)(x + 3)$
      uitwerking: |-
        Zonder $-1$ af: $-(x^3 - 7x + 6)$. $f(1) = 0$; Horner geeft $x^2 + x - 6 = (x - 2)(x + 3)$.

- id: h1-o10
  soort: opdracht
  niveau: 1
  thema: |-
    factorstelling
  opgave: |-
    Is de tweeterm een deler van de veelterm? Beslis zonder te delen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x - 2$ en $x^4 - 3x^3 + 8$
      antwoord: |-
        ja
      uitwerking: |-
        $16 - 24 + 8 = 0$: ja, volgens de factorstelling.
    - opgave: |-
        $x + 1$ en $x^5 + 1$
      antwoord: |-
        ja
      uitwerking: |-
        $a = -1$: $(-1)^5 + 1 = 0$: ja.
    - opgave: |-
        $x + 3$ en $x^3 + 2x^2 - 9$
      antwoord: |-
        nee
      uitwerking: |-
        $a = -3$: $-27 + 18 - 9 = -18 \neq 0$: nee, de rest is $-18$.
    - opgave: |-
        $x - 1$ en $3x^4 - 2x^2 + x + 1$
      antwoord: |-
        nee
      uitwerking: |-
        $3 - 2 + 1 + 1 = 3 \neq 0$: nee, de rest is $3$.

- id: h1-o15
  soort: opdracht
  niveau: 1
  thema: |-
    grafiek kiezen
  opgave: |-
    Welke grafiek hoort bij welk voorschrift? Let op snijden of raken en op de uiteinden.

    \figuren{\begin{tikzpicture}[x=.5cm,y=.38cm,font=\scriptsize]
      \rooster{-1}{1}{3}{-3}{1}{3}
      \kromme{-1}{2.48}{(\x)^2*(\x-2)}
      \node[text=accent] at (1,-4.1) {\textbf{A}};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.5cm,y=.38cm,font=\scriptsize]
      \rooster{-1}{1}{3}{-3}{1}{3}
      \kromme{-.45}{3}{\x*(\x-2)^2}
      \node[text=accent] at (1,-4.1) {\textbf{B}};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.5cm,y=.38cm,font=\scriptsize]
      \rooster{-1}{1}{3}{-3}{1}{3}
      \kromme{-.62}{2.62}{(\x)^2*(\x-2)^2}
      \node[text=accent] at (1,-4.1) {\textbf{C}};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.5cm,y=.38cm,font=\scriptsize]
      \rooster{-1}{1}{3}{-3}{1}{3}
      \kromme{-.45}{3}{-\x*(\x-2)^2}
      \node[text=accent] at (1,-4.1) {\textbf{D}};
    \end{tikzpicture}}
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $x(x - 2)^2$
      antwoord: |-
        B
      uitwerking: |-
        Snijdt in $0$, raakt in $2$, hoogstegraadsterm $x^3$: rechts boven. Grafiek B.
    - opgave: |-
        $x^2(x - 2)$
      antwoord: |-
        A
      uitwerking: |-
        Raakt in $0$, snijdt in $2$: grafiek A.
    - opgave: |-
        $-x(x - 2)^2$
      antwoord: |-
        D
      uitwerking: |-
        Zoals de eerste, maar met $-x^3$: rechts onder. Grafiek D, het spiegelbeeld van B om de $x$-as.
    - opgave: |-
        $x^2(x - 2)^2$
      antwoord: |-
        C
      uitwerking: |-
        Raakt in $0$ en in $2$, graad 4 en positief: aan beide kanten boven. Grafiek C.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    reststelling
  opgave: |-
    Bepaal de rest zonder te delen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(x^5 - 3x + 1) : (x - 2)$
      antwoord: |-
        27
      uitwerking: |-
        Reststelling met $a = 2$: $2^5 - 6 + 1 = 27$.
    - opgave: |-
        $(x^{100} + 1) : (x + 1)$
      antwoord: |-
        2
      uitwerking: |-
        Reststelling met $a = -1$: $(-1)^{100} + 1 = 1 + 1 = 2$, want een even macht van $-1$ is $1$.
    - opgave: |-
        $(x^3 + 4x^2 - x - 1) : (x + 3)$
      antwoord: |-
        11
      uitwerking: |-
        $a = -3$: $-27 + 36 + 3 - 1 = 11$.
    - opgave: |-
        $(x^{25} + x^{24} + 3) : (x + 1)$
      antwoord: |-
        3
      uitwerking: |-
        $a = -1$: $(-1)^{25} + (-1)^{24} + 3 = -1 + 1 + 3 = 3$.

- id: h1-o12
  soort: opdracht
  niveau: 1
  thema: |-
    multipliciteit: snijden of raken
  opgave: |-
    Geef de nulwaarden met hun multipliciteit. Snijdt of raakt de grafiek de $x$-as in elke nulwaarde?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(x - 4)^2(x + 1)$
      antwoord: |-
        $4$ (2, raakt); $-1$ (1, snijdt)
      uitwerking: |-
        Even multipliciteit: raakt. Oneven: snijdt.
    - opgave: |-
        $x^3(x - 2)$
      antwoord: |-
        $0$ (3, snijdt); $2$ (1, snijdt)
      uitwerking: |-
        Multipliciteit $3$ is oneven: de grafiek snijdt in $0$, en is daar vlak.
    - opgave: |-
        $-3(x + 5)^4$
      antwoord: |-
        $-5$ (4, raakt)
      uitwerking: |-
        Eén nulwaarde met even multipliciteit: raakt. De factor $-3$ geeft geen nulwaarde.
    - opgave: |-
        $x^4 - x^2$
      antwoord: |-
        $0$ (2, raakt); $\pm 1$ (1, snijdt)
      uitwerking: |-
        $x^2(x^2 - 1) = x^2(x - 1)(x + 1)$.
    - opgave: |-
        $x^3 + 4x^2 + 4x$
      antwoord: |-
        $0$ (1, snijdt); $-2$ (2, raakt)
      uitwerking: |-
        $x(x^2 + 4x + 4) = x(x + 2)^2$.
    - opgave: |-
        $(x^2 - 9)^2$
      antwoord: |-
        $\pm 3$ (2, raakt)
      uitwerking: |-
        $\bigl((x - 3)(x + 3)\bigr)^2 = (x - 3)^2(x + 3)^2$: beide even.

- id: h1-o14
  soort: opdracht
  niveau: 1
  thema: |-
    fouten: Horner en reststelling
  opgave: |-
    Waar zit de fout? Verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Iemand deelt $x^3 - 5x + 2$ door $x - 2$ met Horner. Hij zet de coëfficiënten $1, -5, 2$ op een rij en vindt quotiënt $x - 3$ en rest $-4$.
      antwoord: |-
        de $0$ voor $x^2$ ontbreekt; $Q = x^2 + 2x - 1$, $R = 0$
      uitwerking: |-
        De veelterm heeft geen term in $x^2$: de coëfficiënten zijn $1, 0, -5, 2$. Met $a = 2$ is de onderste rij $1, 2, -1, 0$, dus $Q = x^2 + 2x - 1$ en $R = 0$. Controle: $A(2) = 8 - 10 + 2 = 0$.
    - opgave: |-
        Iemand zoekt de rest bij deling van $x^3 + 2x^2 - 4$ door $x + 2$ en schrijft: de rest is $A(2) = 8 + 8 - 4 = 12$.
      antwoord: |-
        de rest is $A(-2) = -4$
      uitwerking: |-
        $x + 2 = x - (-2)$, dus $a = -2$: de rest is $A(-2) = -8 + 8 - 4 = -4$.

- id: h1-o11
  soort: opdracht
  niveau: 1
  thema: |-
    tekentabel
  opgave: |-
    Stel de tekentabel op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = x(x + 3)(x - 2)$
      antwoord: |-
        \tekentabel{cccccccc}{x & & -3 & & 0 & & 2 & }{f(x) & - & 0 & + & 0 & - & 0 & +}
      uitwerking: |-
        Drie enkelvoudige nulwaarden: het teken wisselt in elk. Rechts positief, want $x^3$. \tekentabel{cccccccc}{x & & -3 & & 0 & & 2 & }{f(x) & - & 0 & + & 0 & - & 0 & +}
    - opgave: |-
        $f(x) = -(x - 1)^2(x + 2)$
      antwoord: |-
        \tekentabel{cccccc}{x & & -2 & & 1 & }{f(x) & + & 0 & - & 0 & -}
      uitwerking: |-
        Rechts negatief, want $-x^3$. In $1$ (dubbel) wisselt het teken niet, in $-2$ (enkel) wel. \tekentabel{cccccc}{x & & -2 & & 1 & }{f(x) & + & 0 & - & 0 & -}
    - opgave: |-
        $f(x) = x^2(4 - x)$
      antwoord: |-
        \tekentabel{cccccc}{x & & 0 & & 4 & }{f(x) & + & 0 & + & 0 & -}
      uitwerking: |-
        Rechts negatief, want $-x^3$. In $4$ wisselt het teken, in $0$ (dubbel) niet. \tekentabel{cccccc}{x & & 0 & & 4 & }{f(x) & + & 0 & + & 0 & -}
    - opgave: |-
        $f(x) = (x^2 + 1)(x - 3)^3$
      antwoord: |-
        \tekentabel{cccc}{x & & 3 & }{f(x) & - & 0 & +}
      uitwerking: |-
        $x^2 + 1 > 0$ voor elke $x$, dus het teken is dat van $(x - 3)^3$: negatief voor $x < 3$, positief voor $x > 3$. \tekentabel{cccc}{x & & 3 & }{f(x) & - & 0 & +}

- id: h1-o4
  soort: opdracht
  niveau: 2
  thema: |-
    een parameter
  opgave: |-
    Bepaal $k$ zodat $x - 2$ een deler is van $x^3 + kx^2 - 4$. Ontbind dan volledig.
  antwoord: |-
    $k = -1$; $(x - 2)(x^2 + x + 2)$
  uitwerking: |-
    Factorstelling: de waarde in $2$ moet nul zijn. $8 + 4k - 4 = 0$, dus $k = -1$. Horner met coëfficiënten $1, -1, 0, -4$ en $a = 2$ geeft de onderste rij $1, 1, 2, 0$: $x^3 - x^2 - 4 = (x - 2)(x^2 + x + 2)$. De discriminant van $x^2 + x + 2$ is $-7 < 0$, dus verder ontbinden kan niet.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    schetsen met de werkwijze
  opgave: |-
    Schets de grafiek. Ontbind eerst, en geef de nulwaarden met multipliciteit, de tekentabel, het gedrag aan de uiteinden en $f(0)$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = x^3 - 3x^2 + 4$
      antwoord: |-
        $(x + 1)(x - 2)^2$; \tekentabel{cccccc}{x & & -1 & & 2 & }{f(x) & - & 0 & + & 0 & +}
      uitwerking: |-
        $f(-1) = -1 - 3 + 4 = 0$, Horner: $x^2 - 4x + 4 = (x - 2)^2$. Dus $f(x) = (x + 1)(x - 2)^2$: snijdt in $-1$, raakt in $2$. Hoogstegraadsterm $x^3$: links onder, rechts boven. $f(0) = 4$. \tekentabel{cccccc}{x & & -1 & & 2 & }{f(x) & - & 0 & + & 0 & +}
        \figuren{\begin{tikzpicture}[x=.55cm,y=.3cm,font=\scriptsize]
          \rooster{-2}{1}{3}{-4}{1}{5}
          \kromme{-1.3}{3.1}{(\x+1)*(\x-2)^2}
          \vol{(-1,0)} \vol{(2,0)} \vol{(0,4)}
        \end{tikzpicture}}
    - opgave: |-
        $f(x) = -x^4 + 2x^3$
      antwoord: |-
        $-x^3(x - 2)$; \tekentabel{cccccc}{x & & 0 & & 2 & }{f(x) & - & 0 & + & 0 & -}
      uitwerking: |-
        $f(x) = -x^3(x - 2)$: $0$ met multipliciteit $3$ (snijdt, vlak), $2$ enkel (snijdt). Hoogstegraadsterm $-x^4$: aan beide kanten onder. $f(0) = 0$. \tekentabel{cccccc}{x & & 0 & & 2 & }{f(x) & - & 0 & + & 0 & -}
        \figuren{\begin{tikzpicture}[x=.55cm,y=.3cm,font=\scriptsize]
          \rooster{-1}{1}{3}{-4}{1}{2}
          \kromme{-1}{2.3}{-(\x)^4+2*(\x)^3}
          \vol{(0,0)} \vol{(2,0)}
        \end{tikzpicture}}
    - opgave: |-
        $f(x) = x^4 - x^3 - 2x^2$
      antwoord: |-
        $x^2(x - 2)(x + 1)$; \tekentabel{cccccccc}{x & & -1 & & 0 & & 2 & }{f(x) & + & 0 & - & 0 & - & 0 & +}
      uitwerking: |-
        $f(x) = x^2(x^2 - x - 2) = x^2(x - 2)(x + 1)$: raakt in $0$, snijdt in $-1$ en $2$. Hoogstegraadsterm $x^4$: aan beide kanten boven. $f(0) = 0$. \tekentabel{cccccccc}{x & & -1 & & 0 & & 2 & }{f(x) & + & 0 & - & 0 & - & 0 & +}
        \figuren{\begin{tikzpicture}[x=.55cm,y=.3cm,font=\scriptsize]
          \rooster{-2}{1}{3}{-3}{1}{4}
          \kromme{-1.4}{2.22}{(\x)^4-(\x)^3-2*(\x)^2}
          \vol{(-1,0)} \vol{(0,0)} \vol{(2,0)}
        \end{tikzpicture}}

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    winst
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.45cm,y=.045cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=1,ystep=10] (0,-30) grid (9,40);
        \draw[->,grijs] (0,0) -- (9.5,0) node[right,text=black] {$q$};
        \draw[->,grijs] (0,-30) -- (0,44) node[above,text=black] {$W$};
        \foreach \t in {2,4,6,8}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {-20,20,40}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \kromme{0}{8.6}{-(\x)^3+11*(\x)^2-24*\x}
      \end{tikzpicture}
  opgave: |-
    Een bedrijf maakt $q$ duizend stuks van een product ($0 \leqslant q \leqslant 9$). De winst is dan $W(q) = -q^3 + 11q^2 - 24q$ duizend euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Bij welke productie is de winst nul?
      antwoord: |-
        $q = 0$, $3$ of $8$
      uitwerking: |-
        $W(q) = -q(q^2 - 11q + 24) = -q(q - 3)(q - 8)$, dus $q = 0$, $q = 3$ of $q = 8$.
    - opgave: |-
        Bij welke productie maakt het bedrijf winst? Gebruik een tekentabel.
      antwoord: |-
        $3 < q < 8$
      uitwerking: |-
        \tekentabel{cccccccc}{q & 0 & & 3 & & 8 & & 9}{W(q) & 0 & - & 0 & + & 0 & - & } Winst voor $3 < q < 8$, dus tussen $3000$ en $8000$ stuks.
    - opgave: |-
        Toon aan dat de winst $30$ duizend euro is bij $q = 5$. Bij welke andere productie is ze ook $30$ duizend euro?
      antwoord: |-
        $q = 3 + \sqrt{15} \approx 6{,}87$
      uitwerking: |-
        $W(5) = -125 + 275 - 120 = 30$. Dus $5$ is een nulwaarde van $-q^3 + 11q^2 - 24q - 30$. Horner met coëfficiënten $-1, 11, -24, -30$ en $a = 5$: onderste rij $-1, 6, 6, 0$. Los $-q^2 + 6q + 6 = 0$ op: $q = 3 \pm \sqrt{15}$. Alleen $3 + \sqrt{15} \approx 6{,}87$ ligt in $[0, 9]$: ongeveer $6870$ stuks.

- id: h1-o20
  soort: opdracht
  niveau: 2
  thema: |-
    gehele nulwaarden zoeken
  opgave: |-
    Gehele nulwaarden vind je bij de delers van de constante term.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $x^3 + 2x + 5$ geen gehele nulwaarde heeft.
      antwoord: |-
        $\pm 1$ en $\pm 5$ zijn geen nulwaarden
      uitwerking: |-
        Een gehele nulwaarde moet een deler van $5$ zijn: $\pm 1$ of $\pm 5$. Maar $f(1) = 8$, $f(-1) = 2$, $f(5) = 140$ en $f(-5) = -130$: geen enkele is nul.
    - opgave: |-
        Bereken $f(-2)$, $f(-1)$, $f(0)$, $f(1)$ en $f(2)$ voor $f(x) = x^3 - 3x - 1$. Hoeveel nulwaarden heeft $f$? Kun je ze vinden met de werkwijze?
      antwoord: |-
        $-3$, $1$, $-1$, $-3$, $1$; drie; nee
      uitwerking: |-
        $f(-2) = -3$, $f(-1) = 1$, $f(0) = -1$, $f(1) = -3$, $f(2) = 1$. Het teken wisselt drie keer, en de grafiek heeft geen sprongen: er ligt een nulwaarde tussen $-2$ en $-1$, tussen $-1$ en $0$, en tussen $1$ en $2$. Meer kan niet bij graad 3. Geen enkele is geheel (de kandidaten $\pm 1$ geven geen nul), dus de werkwijze vindt ze niet. Je kunt ze alleen benaderen, bijvoorbeeld met het rekentoestel.

- id: h1-o6
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift uit een grafiek
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.3cm,font=\scriptsize]
        \rooster{-3}{1}{2}{-5}{1}{4}
        \kromme{-3.1}{1.3}{(\x+2)^2*(\x-1)}
        \vol{(-2,0)} \vol{(1,0)} \vol{(0,-4)}
      \end{tikzpicture}
  opgave: |-
    De grafiek van een veeltermfunctie van graad 3 raakt de $x$-as in $-2$, snijdt ze in $1$, en gaat door $(0, -4)$. Geef het voorschrift.
  antwoord: |-
    $f(x) = (x + 2)^2(x - 1)$
  uitwerking: |-
    Raken in $-2$ geeft de factor $(x + 2)^2$, snijden in $1$ de factor $x - 1$. Samen al graad 3, dus $f(x) = a(x + 2)^2(x - 1)$. Uit $f(0) = a \cdot 4 \cdot (-1) = -4$ volgt $a = 1$.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    parameters met de reststelling
  opgave: |-
    Bepaal de onbekende coëfficiënten.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $k$ zodat de rest bij deling van $2x^3 - x^2 + kx + 3$ door $x + 1$ gelijk is aan $4$.
      antwoord: |-
        $k = -4$
      uitwerking: |-
        Reststelling met $a = -1$: $-2 - 1 - k + 3 = -k$. Uit $-k = 4$ volgt $k = -4$.
    - opgave: |-
        Bepaal $a$ en $b$ zodat $x^3 + ax^2 + bx - 6$ deelbaar is door $x - 1$ en door $x + 2$. Ontbind dan volledig.
      antwoord: |-
        $a = 4$, $b = 1$; $(x - 1)(x + 2)(x + 3)$
      uitwerking: |-
        Factorstelling in $1$: $1 + a + b - 6 = 0$, dus $a + b = 5$. In $-2$: $-8 + 4a - 2b - 6 = 0$, dus $2a - b = 7$. Optellen: $3a = 12$, dus $a = 4$ en $b = 1$. Horner op $x^3 + 4x^2 + x - 6$ met $a = 1$ geeft $x^2 + 5x + 6 = (x + 2)(x + 3)$, dus $(x - 1)(x + 2)(x + 3)$.

- id: h1-o23
  soort: opdracht
  niveau: 2
  thema: |-
    fouten: multipliciteit, uiteinden, rest
  opgave: |-
    Waar zit de fout? Verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        `De grafiek van $f(x) = x^2(x - 1)^3$ raakt de $x$-as in $1$, want daar is de multipliciteit het grootst.'
      antwoord: |-
        snijdt in $1$, raakt in $0$
      uitwerking: |-
        Niet de grootte telt, maar of de multipliciteit even of oneven is. In $1$ is ze $3$, oneven: de grafiek snijdt. In $0$ is ze $2$, even: daar raakt ze.
    - opgave: |-
        `$f(x) = 3x^2 - x^4 + 1$ gedraagt zich aan de uiteinden zoals $3x^2$, de eerste term: links en rechts boven.'
      antwoord: |-
        zoals $-x^4$: links en rechts onder
      uitwerking: |-
        Het gaat om de hoogste macht, waar die ook staat: $-x^4$. Voor grote $|x|$ is $x^4$ veel groter dan $3x^2$. Aan beide kanten onder.
    - opgave: |-
        `De rest bij deling van $A(x)$ door $x^2 - 1$ is $A(1)$.'
      antwoord: |-
        de rest is een veelterm van graad hoogstens 1
      uitwerking: |-
        De reststelling geldt alleen voor een deler $x - a$. Bij een deler van graad 2 is de rest van de vorm $px + q$, geen getal. Bijvoorbeeld $x^3 : (x^2 - 1)$ geeft quotiënt $x$ en rest $x$, terwijl $A(1) = 1$.

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    een doos
  opgave: |-
    Uit een karton van $20$ cm op $12$ cm knip je in elke hoek een vierkant met zijde $x$ weg. De doos heeft inhoud $V(x) = x(20 - 2x)(12 - 2x)$. Voor welke $x$ in $\left]0, 6\right[$ is de inhoud $256$ cm$^3$? Tip: probeer $x = 2$.
  antwoord: |-
    $x = 2$ of $x = 7 - \sqrt{17} \approx 2{,}88$
  uitwerking: |-
    $V(x) = 4x^3 - 64x^2 + 240x$. Uit $V(x) = 256$ volgt $4x^3 - 64x^2 + 240x - 256 = 0$, of gedeeld door 4: $x^3 - 16x^2 + 60x - 64 = 0$. $x = 2$ is een nulwaarde ($8 - 64 + 120 - 64 = 0$); Horner geeft $x^2 - 14x + 32$, met nulwaarden $7 \pm \sqrt{17}$. Alleen $7 - \sqrt{17} \approx 2{,}88$ ligt in $\left]0, 6\right[$.

- id: h1-o21
  soort: opdracht
  niveau: 2
  thema: |-
    een dubbele nulwaarde
  opgave: |-
    Neem $A(x) = x^4 - 3x^3 + x^2 + 4$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon met tweemaal Horner aan dat $2$ een nulwaarde is met multipliciteit $2$.
      antwoord: |-
        $A(x) = (x - 2)^2(x^2 + x + 1)$
      uitwerking: |-
        Horner met $a = 2$ op $1, -3, 1, 0, 4$: onderste rij $1, -1, -1, -2, 0$. Dus $A(x) = (x - 2)(x^3 - x^2 - x - 2)$. Nog eens Horner met $a = 2$ op $1, -1, -1, -2$: onderste rij $1, 1, 1, 0$. Dus $A(x) = (x - 2)^2(x^2 + x + 1)$, en $2$ is geen nulwaarde van $x^2 + x + 1$ ($4 + 2 + 1 = 7$): multipliciteit precies $2$.
    - opgave: |-
        Heeft $A$ nog andere nulwaarden? Snijdt of raakt de grafiek de $x$-as?
      antwoord: |-
        nee; raakt in $2$
      uitwerking: |-
        De discriminant van $x^2 + x + 1$ is $1 - 4 = -3 < 0$: geen nulwaarden. De grafiek raakt de $x$-as alleen in $2$, en ligt verder overal boven de as.

- id: h1-o5
  soort: opdracht
  niveau: 2
  thema: |-
    schetsen
  opgave: |-
    Schets de grafiek van $f(x) = x^4 - 4x^2$. Geef de nulwaarden met multipliciteit en de tekentabel. Welke symmetrie heeft de grafiek?
  antwoord: |-
    \tekentabel{cccccccc}{x & & -2 & & 0 & & 2 & }{f(x) & + & 0 & - & 0 & - & 0 & +}
  uitwerking: |-
    $f(x) = x^2(x - 2)(x + 2)$: $0$ dubbel (raakt), $\pm 2$ enkel. Hoogstegraadsterm $x^4$: aan beide uiteinden boven. $f$ is even: symmetrisch om de $y$-as. \tekentabel{cccccccc}{x & & -2 & & 0 & & 2 & }{f(x) & + & 0 & - & 0 & - & 0 & +}
    \figuren{\begin{tikzpicture}[x=.5cm,y=.25cm,font=\scriptsize]
      \rooster{-3}{1}{3}{-4}{1}{4}
      \kromme{-2.19}{2.19}{(\x)^4-4*(\x)^2}
      \vol{(-2,0)} \vol{(0,0)} \vol{(2,0)}
    \end{tikzpicture}}

- id: h1-o22
  soort: opdracht
  niveau: 2
  thema: |-
    een balk
  opgave: |-
    Een balk heeft hoogte $x$, breedte $x + 2$ en lengte $2x - 1$, in dm, met $x > \frac12$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de inhoud $75$ dm$^3$ is voor $x = 3$, en voor geen enkele andere $x$.
      antwoord: |-
        $x(x + 2)(2x - 1) - 75 = (x - 3)(2x^2 + 9x + 25)$
      uitwerking: |-
        $3 \cdot 5 \cdot 5 = 75$. Uitwerken: $x(x + 2)(2x - 1) = 2x^3 + 3x^2 - 2x$, dus de vergelijking is $2x^3 + 3x^2 - 2x - 75 = 0$. Horner met $a = 3$ op $2, 3, -2, -75$: onderste rij $2, 9, 25, 0$. De discriminant van $2x^2 + 9x + 25$ is $81 - 200 < 0$: geen andere oplossingen.
    - opgave: |-
        Voor welke $x$ is de inhoud kleiner dan $75$ dm$^3$?
      antwoord: |-
        $\frac12 < x < 3$
      uitwerking: |-
        $(x - 3)(2x^2 + 9x + 25) < 0$. De tweede factor is altijd positief, dus het teken is dat van $x - 3$: $x < 3$. Met $x > \frac12$: $\frac12 < x < 3$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    grafiek van graad 4 lezen
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.38cm,font=\scriptsize]
        \rooster{-3}{1}{4}{-3}{1}{5}
        \kromme{-2.2}{3.35}{-.25*(\x+2)*(\x-1)^2*(\x-3)}
        \vol{(-1,4)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van een veeltermfunctie $f$ van graad 4.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees de nulwaarden af. Welke multipliciteit hebben ze?
      antwoord: |-
        $-2$ (1), $1$ (2), $3$ (1)
      uitwerking: |-
        In $-2$ en $3$ snijdt de grafiek: oneven multipliciteit. In $1$ raakt ze: even. De graad is 4, dus $1 + 2 + 1$: enkel, dubbel, enkel.
    - opgave: |-
        Geef het voorschrift. Gebruik het punt $(-1, 4)$.
      antwoord: |-
        $f(x) = -\frac14(x + 2)(x - 1)^2(x - 3)$
      uitwerking: |-
        $f(x) = a(x + 2)(x - 1)^2(x - 3)$. Uit $f(-1) = a \cdot 1 \cdot 4 \cdot (-4) = -16a = 4$ volgt $a = -\frac14$. Dat klopt met de uiteinden: beide onder, dus $a < 0$.
    - opgave: |-
        Voor welke $x$ is $f(x) > 0$?
      antwoord: |-
        $\left]-2, 1\right[ \cup \left]1, 3\right[$
      uitwerking: |-
        De grafiek ligt boven de $x$-as tussen $-2$ en $3$, behalve in $1$ waar ze de as raakt: $\left]-2, 1\right[ \cup \left]1, 3\right[$.

- id: h1-o8
  soort: opdracht
  niveau: 3
  thema: |-
    een veelterm opstellen
  opgave: |-
    Geef de veeltermfunctie van graad 3 met nulwaarden $1$, $2$ en $3$, waarvoor $f(0) = 12$. Is er maar één?
  antwoord: |-
    $f(x) = -2(x - 1)(x - 2)(x - 3)$; ja
  uitwerking: |-
    Volgens de factorstelling zijn $x - 1$, $x - 2$ en $x - 3$ delers. Samen hebben ze graad 3, dus wat overblijft is een getal: $f(x) = a(x - 1)(x - 2)(x - 3)$. Uit $f(0) = -6a = 12$ volgt $a = -2$: $f(x) = -2x^3 + 12x^2 - 22x + 12$. Elke veelterm van graad 3 met die nulwaarden heeft die vorm, en $a$ ligt vast door $f(0)$, dus er is er maar één.

- id: h1-o24
  soort: opdracht
  niveau: 3
  thema: |-
    rest bij een deler van graad 2
  opgave: |-
    Bij deling door een veelterm van graad 2 is de rest van de vorm $px + q$. Vul in $A(x) = B(x) \cdot Q(x) + px + q$ de nulwaarden van $B(x)$ in.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de rest bij deling van $x^5$ door $(x - 1)(x - 2)$ zonder de deling uit te voeren.
      antwoord: |-
        $31x - 30$
      uitwerking: |-
        $x^5 = (x - 1)(x - 2)Q(x) + px + q$. Voor $x = 1$: $1 = p + q$. Voor $x = 2$: $32 = 2p + q$. Aftrekken: $p = 31$, en dan $q = -30$. De rest is $31x - 30$.
    - opgave: |-
        Een veelterm $A(x)$ geeft rest $3$ bij deling door $x - 1$ en rest $5$ bij deling door $x + 1$. Wat is de rest bij deling door $x^2 - 1$?
      antwoord: |-
        $-x + 4$
      uitwerking: |-
        Reststelling: $A(1) = 3$ en $A(-1) = 5$. Uit $A(x) = (x^2 - 1)Q(x) + px + q$ volgt $A(1) = p + q = 3$ en $A(-1) = -p + q = 5$. Optellen: $2q = 8$, dus $q = 4$ en $p = -1$. De rest is $-x + 4$, welke veelterm $A(x)$ het ook is.

- id: h1-o25
  soort: opdracht
  niveau: 3
  thema: |-
    redeneren over nulwaarden
  opgave: |-
    Kan dat? Leg uit, of geef een voorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        Een veeltermfunctie van graad 3 zonder nulwaarden.
      antwoord: |-
        nee
      uitwerking: |-
        Bij oneven graad ligt de grafiek aan het ene uiteinde onder en aan het andere boven de $x$-as. Een veeltermfunctie maakt geen sprongen, dus de grafiek moet de $x$-as ergens snijden.
    - opgave: |-
        Een veeltermfunctie van graad 4 met precies drie verschillende nulwaarden.
      antwoord: |-
        ja, bv.\ $x^2(x - 1)(x + 1)$
      uitwerking: |-
        Ja, als één nulwaarde multipliciteit 2 heeft: $f(x) = x^2(x - 1)(x + 1)$ heeft nulwaarden $-1$, $0$ en $1$.
    - opgave: |-
        Een veeltermfunctie van graad 5 met precies vier verschillende nulwaarden, die allemaal multipliciteit 1 hebben.
      antwoord: |-
        nee
      uitwerking: |-
        Volgens de factorstelling is $f(x) = (x - a)(x - b)(x - c)(x - d) \cdot Q(x)$, met $Q$ van graad 1. Een veelterm van graad 1 heeft altijd een nulwaarde $e$. Is $e$ een vijfde nulwaarde, dan zijn er vijf; is $e$ gelijk aan $a$, $b$, $c$ of $d$, dan heeft die multipliciteit 2. Beide zijn in strijd met de opgave.

- id: h1-o27
  soort: opdracht
  niveau: 3
  thema: |-
    puntsymmetrie
  opgave: |-
    Neem $f(x) = x^3 - 6x^2 + 9x - 2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $f(2 + h) = h^3 - 3h$.
      antwoord: |-
        uitwerken
      uitwerking: |-
        $(2 + h)^3 - 6(2 + h)^2 + 9(2 + h) - 2 = (8 + 12h + 6h^2 + h^3) - (24 + 24h + 6h^2) + (18 + 9h) - 2 = h^3 - 3h$.
    - opgave: |-
        Leid af dat de grafiek puntsymmetrisch is om $(2, 0)$.
      antwoord: |-
        $f(2 - h) = -f(2 + h)$
      uitwerking: |-
        $f(2 - h) = (-h)^3 - 3(-h) = -(h^3 - 3h) = -f(2 + h)$. De punten $(2 + h, f(2 + h))$ en $(2 - h, -f(2 + h))$ liggen symmetrisch om $(2, 0)$, voor elke $h$.
    - opgave: |-
        Bepaal de nulwaarden van $f$ exact.
      antwoord: |-
        $2$, $2 - \sqrt3$, $2 + \sqrt3$
      uitwerking: |-
        Stel $x = 2 + h$: $h^3 - 3h = h(h^2 - 3) = 0$ geeft $h = 0$ of $h = \pm\sqrt3$. Dus $x = 2$ en $x = 2 \pm \sqrt3$. Controle: Horner met $a = 2$ geeft $x^2 - 4x + 1$, met nulwaarden $2 \pm \sqrt3$.

- id: h1-o26
  soort: opdracht
  niveau: 3
  thema: |-
    een dubbele nulwaarde met een parameter
  opgave: |-
    Voor welke $k$ heeft $f(x) = x^3 - 3x + k$ een dubbele nulwaarde?
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $x^3 - 3x + k = (x - a)^2(x - b)$, werk uit en vergelijk de coëfficiënten.
      antwoord: |-
        $k = 2$ of $k = -2$
      uitwerking: |-
        $(x - a)^2(x - b) = x^3 - (2a + b)x^2 + (a^2 + 2ab)x - a^2b$. Vergelijken: $2a + b = 0$, $a^2 + 2ab = -3$ en $-a^2b = k$. Uit $b = -2a$ volgt $a^2 - 4a^2 = -3$, dus $a = \pm 1$. Voor $a = 1$: $b = -2$ en $k = 2$, en $x^3 - 3x + 2 = (x - 1)^2(x + 2)$. Voor $a = -1$: $b = 2$ en $k = -2$, en $x^3 - 3x - 2 = (x + 1)^2(x - 2)$.
    - opgave: |-
        De grafieken van $f$ zijn verticale verschuivingen van de grafiek van $x^3 - 3x$. Leg met een schets uit waarom er precies twee zulke $k$ zijn.
      antwoord: |-
        de $x$-as raakt de grafiek in een top
      uitwerking: |-
        Een dubbele nulwaarde betekent dat de grafiek de $x$-as raakt. De grafiek van $x^3 - 3x$ heeft twee toppen, $(-1, 2)$ en $(1, -2)$. Schuif je ze $2$ omlaag ($k = -2$), dan raakt de top $(-1, 2)$ de $x$-as; schuif je ze $2$ omhoog ($k = 2$), dan raakt de top $(1, -2)$ de as. Bij elke andere verschuiving snijdt de grafiek de as alleen.
        \figuren{\begin{tikzpicture}[x=.5cm,y=.32cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-4}{1}{4}
          \kromme[dashed]{-2.15}{2.15}{(\x)^3-3*\x}
          \kromme{-2.35}{1.9}{(\x)^3-3*\x+2}
          \vol{(1,0)} \vol{(-2,0)}
        \end{tikzpicture}\qquad
        \begin{tikzpicture}[x=.5cm,y=.32cm,font=\scriptsize]
          \rooster{-3}{1}{3}{-4}{1}{4}
          \kromme[dashed]{-2.15}{2.15}{(\x)^3-3*\x}
          \kromme{-1.9}{2.35}{(\x)^3-3*\x-2}
          \vol{(-1,0)} \vol{(2,0)}
        \end{tikzpicture}}

- id: h1-o9
  soort: opdracht
  niveau: 3
  thema: |-
    een deelbaarheid
  opgave: |-
    Neem $y$ als een vast getal en bekijk $A(x) = x^n - y^n$ als veelterm in $x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $x - y$ een deler is van $A(x)$.
      antwoord: |-
        $A(y) = 0$
      uitwerking: |-
        $A(y) = y^n - y^n = 0$, dus volgens de factorstelling is $x - y$ een deler.
    - opgave: |-
        Leid af dat $7^n - 1$ deelbaar is door $6$ voor elk natuurlijk getal $n \geqslant 1$.
      antwoord: |-
        neem $x = 7$, $y = 1$
      uitwerking: |-
        $x^n - 1 = (x - 1) \cdot Q(x)$ met $Q(x) = x^{n-1} + \cdots + x + 1$, een veelterm met gehele coëfficiënten. Voor $x = 7$: $7^n - 1 = 6 \cdot Q(7)$, en $Q(7)$ is een geheel getal.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h1-koppel-3
  soort: koppel
  niveau: 1
  koppel:
    rubriek: analyse
    onderwerp: Algemene functies
  thema: |-
    even veeltermen
  opgave: |-
    Toon aan: een veeltermfunctie met alleen even machten van $x$, zoals $f(x) = x^4 - 3x^2 + 1$, is een even functie. Wat kun je zeggen als er alleen oneven machten in staan?
  antwoord: |-
    $f(-x) = f(x)$; dan oneven
  uitwerking: |-
    $(-x)^{2k} = x^{2k}$, dus $f(-x) = f(x)$. Met alleen oneven machten is $(-x)^{2k+1} = -x^{2k+1}$, dus $f(-x) = -f(x)$: oneven.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  thema: |-
    Horner
  opgave: |-
    Bepaal quotiënt en rest van $(2x^3 + 5x^2 - x + 4) : (x + 3)$, en controleer met de reststelling.
  antwoord: |-
    $Q = 2x^2 - x + 2$, $R = -2$
  uitwerking: |-
    Coëfficiënten $2, 5, -1, 4$, $a = -3$: onderste rij $2, -1, 2, -2$. Controle: $A(-3) = -54 + 45 + 3 + 4 = -2$.

- id: h1-t2
  soort: test
  niveau: 1
  thema: |-
    staartdeling
  opgave: |-
    Bepaal quotiënt en rest van $(x^3 + 2x^2 + 3) : (x^2 + x)$.
  antwoord: |-
    $Q = x + 1$, $R = -x + 3$
  uitwerking: |-
    Eerste term $x$: $x^3 + 2x^2 + 3 - x(x^2 + x) = x^2 + 3$. Tweede term $1$: $x^2 + 3 - 1 \cdot (x^2 + x) = -x + 3$, van graad $1 < 2$.

- id: h1-t5
  soort: test
  niveau: 1
  thema: |-
    factorstelling met een parameter
  opgave: |-
    Bepaal $k$ zodat $x + 2$ een deler is van $x^3 + kx^2 + x + 6$. Ontbind dan volledig.
  antwoord: |-
    $k = 1$; $(x + 2)(x^2 - x + 3)$
  uitwerking: |-
    Factorstelling met $a = -2$: $-8 + 4k - 2 + 6 = 4k - 4 = 0$, dus $k = 1$. Horner op $1, 1, 1, 6$ met $a = -2$: onderste rij $1, -1, 3, 0$. De discriminant van $x^2 - x + 3$ is $1 - 12 < 0$: $(x + 2)(x^2 - x + 3)$.

- id: h1-t3
  soort: test
  niveau: 2
  thema: |-
    ontbinden
  opgave: |-
    Ontbind $x^3 + 2x^2 - 5x - 6$ volledig.
  antwoord: |-
    $(x + 1)(x - 2)(x + 3)$
  uitwerking: |-
    Delers van $-6$ proberen: $f(-1) = -1 + 2 + 5 - 6 = 0$. Horner met $a = -1$ geeft $x^2 + x - 6 = (x - 2)(x + 3)$.

