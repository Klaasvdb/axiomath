# Oefeningen van hoofdstuk 2. Zie oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Hoeveel standaardafwijkingen ligt 86 boven 70 als $\sigma = 8$?
      antwoord: |-
        2
      uitwerking: |-
        $\frac{86 - 70}{8} = 2$.
    - opgave: |-
        Wat is de oppervlakte van een rechthoek met breedte 5 en hoogte 0,04?
      antwoord: |-
        $0{,}2$
      uitwerking: |-
        $5 \cdot 0{,}04 = 0{,}2$.
    - opgave: |-
        Van 200 metingen liggen er 48 in een klasse van 5 cm breed. Wat is de relatieve frequentie? En per cm?
      antwoord: |-
        $0{,}24$; \ $0{,}048$
      uitwerking: |-
        $\frac{48}{200} = 0{,}24$, en per cm $\frac{0{,}24}{5} = 0{,}048$.
    - opgave: |-
        Een kromme is symmetrisch om $x = 10$. De oppervlakte rechts van 10 is 0,5. Wat is de oppervlakte links van 10?
      antwoord: |-
        $0{,}5$
      uitwerking: |-
        Door de symmetrie ook 0,5.
    - opgave: |-
        Is 0,04 meer of minder dan 5~\%? En 0,048?
      antwoord: |-
        minder; minder
      uitwerking: |-
        $0{,}04 = 4$~\% en $0{,}048 = 4{,}8$~\%: allebei minder dan 5~\%.
    - opgave: |-
        Waar ligt het buigpunt van een functie? Hoe vind je het?
      antwoord: |-
        waar de kromming verandert; $f''(x) = 0$ met tekenwissel
      uitwerking: |-
        Waar de grafiek overgaat van hol naar bol of omgekeerd: een nulpunt van $f''$ waar $f''$ van teken wisselt.

- id: h2-verken
  soort: start
  figuur:
    code: |-
      \begin{tikzpicture}[x=.13cm,y=.035cm,font=\scriptsize]
        \foreach \a/\n in {160/6,165/22,170/48,175/62,180/42,185/16,190/4}{\draw[accent,fill=accent!20] (\a,0) rectangle (\a+5,\n); \node[above] at (\a+2.5,\n) {\n};}
        \draw[->,grijs] (158,0) -- (198,0) node[right,text=black] {cm};
        \foreach \t in {160,170,180,190}{\node[below] at (\t,0) {\t};}
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken}\quad Het histogram toont de lengte van 200 jongens van 18 jaar, in klassen van 5 cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Beschrijf de vorm van het histogram.
      antwoord: |-
        klokvormig, bijna symmetrisch
      uitwerking: |-
        Een klok: veel waarden in het midden (rond 175 tot 180 cm), minder naar de randen, bijna symmetrisch.
    - opgave: |-
        Welk percentage van de jongens is tussen 170 en 185 cm?
      antwoord: |-
        76~\%
      uitwerking: |-
        $\frac{48 + 62 + 42}{200} = \frac{152}{200} = 76$~\%.
    - opgave: |-
        Teken het histogram opnieuw met als hoogte de relatieve frequentie per cm. Wat is dan de totale oppervlakte van de staven? En de oppervlakte van de drie staven uit b?
      antwoord: |-
        1; \ $0{,}76$
      uitwerking: |-
        Elke staaf krijgt hoogte $\frac{n}{200 \cdot 5}$, en oppervlakte $\frac{n}{200}$: de relatieve frequentie. Samen 1. De drie staven samen: 0,76.

- id: h2-dichtheid
  soort: kort
  opgave: |-
    De reistijd van 500 pendelaars is ingedeeld in klassen van 10 minuten: 50 pendelaars reizen 0 tot 10 minuten, 150 reizen 10 tot 20, 200 reizen 20 tot 30, 75 reizen 30 tot 40 en 25 reizen 40 tot 50 minuten.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken voor elke klasse de hoogte van de staaf als relatieve frequentie per minuut.
      antwoord: |-
        $0{,}01$; $0{,}03$; $0{,}04$; $0{,}015$; $0{,}005$
      uitwerking: |-
        Deel de relatieve frequentie door de klassebreedte 10: $\frac{50}{500 \cdot 10} = 0{,}01$, $\frac{150}{5000} = 0{,}03$, $\frac{200}{5000} = 0{,}04$, $\frac{75}{5000} = 0{,}015$ en $\frac{25}{5000} = 0{,}005$.
    - opgave: |-
        Wat is de oppervlakte van de staaf van 10 tot 20 minuten, en wat betekent ze?
      antwoord: |-
        $0{,}3$: 30~\% reist 10 tot 20 minuten
      uitwerking: |-
        $10 \cdot 0{,}03 = 0{,}3$: de relatieve frequentie van die klasse. 30~\% van de pendelaars reist 10 tot 20 minuten.
    - opgave: |-
        Beschrijf je de reistijd met een dichtheidsfunctie, wat is dan de kans dat iemand precies 20 minuten reist?
      antwoord: |-
        0
      uitwerking: |-
        0: de oppervlakte boven één punt is 0. Alleen een interval, zoals van 19,5 tot 20,5 minuten, heeft een kans groter dan 0.

- id: h2-gauss
  soort: kort
  figuur:
    code: |-
      \begin{tikzpicture}[x=.16cm,y=15cm,font=\scriptsize]
        \draw[black!15] (5,0) grid[xstep=2.5,ystep=.02] (40,.17);
        \draw[->,grijs] (5,0) -- (41,0) node[right,text=black] {$x$};
        \foreach \t in {5,10,...,40}{\node[below] at (\t,0) {\t};}
        \draw[accent,thick] plot[domain=5:35,samples=80,smooth] (\x,{gauss(\x,20,5)});
        \draw[fel!80!black,thick] plot[domain=21:39,samples=80,smooth] (\x,{gauss(\x,30,2.5)});
        \fill[black] (15,{gauss(15,20,5)}) circle (1.3pt) (25,{gauss(25,20,5)}) circle (1.3pt);
        \fill[black] (27.5,{gauss(27.5,30,2.5)}) circle (1.3pt) (32.5,{gauss(32.5,30,2.5)}) circle (1.3pt);
        \node[text=accent] at (12,.075) {A};
        \node[text=fel!80!black] at (35,.13) {B};
      \end{tikzpicture}
  opgave: |-
    De figuur toont twee Gausskrommen, met hun buigpunten als stip.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees $\mu$ en $\sigma$ af voor kromme A.
      antwoord: |-
        $\mu = 20$, $\sigma = 5$
      uitwerking: |-
        De top ligt bij 20, dus $\mu = 20$. De buigpunten liggen bij 15 en 25, dus $\sigma = 25 - 20 = 5$.
    - opgave: |-
        Lees $\mu$ en $\sigma$ af voor kromme B.
      antwoord: |-
        $\mu = 30$, $\sigma = 2{,}5$
      uitwerking: |-
        De top ligt bij 30. De buigpunten liggen bij 27,5 en 32,5, dus $\sigma = 2{,}5$.
    - opgave: |-
        Waarom is de top van B twee keer zo hoog als die van A?
      antwoord: |-
        oppervlakte 1, half zo breed
      uitwerking: |-
        Beide oppervlakten zijn 1. B is half zo breed ($\sigma$ is de helft), dus twee keer zo hoog.

- id: h2-vuistregel
  soort: kort
  opgave: |-
    De scores op een grote toets zijn normaal verdeeld met $\mu = 70$ en $\sigma = 8$. Gebruik de 68-95-99,7-regel.
  lijst: enumerate
  delen:
    - opgave: |-
        Tussen welke scores ligt het middelste 68~\%? En het middelste 95~\%?
      antwoord: |-
        $[62, 78]$; \ $[54, 86]$
      uitwerking: |-
        $70 \pm 8 = [62, 78]$ en $70 \pm 16 = [54, 86]$.
    - opgave: |-
        Welk percentage scoort meer dan 78? Minder dan 46?
      antwoord: |-
        16~\%; \ 0,15~\%
      uitwerking: |-
        Boven 78 ligt de helft van wat buiten $[62, 78]$ valt: $\frac{32}{2} = 16$~\%. 46 is $70 - 3 \cdot 8$: daaronder ligt $\frac{0{,}3}{2} = 0{,}15$~\%.

- id: h2-zscore
  soort: kort
  opgave: |-
    De lengte van volwassen mannen is (in dit model) $N(176, 8)$, die van volwassen vrouwen $N(165;\, 6{,}5)$, in cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de z-score van een man van 188~cm, en daarmee $P(Z > z)$.
      antwoord: |-
        $z = 1{,}5$; $\approx 0{,}067$
      uitwerking: |-
        $z = \frac{188 - 176}{8} = 1{,}5$. \texttt{normalcdf(1.5,1E99,0,1)} $\approx 0{,}067$: evenveel als $P(X > 188)$.
    - opgave: |-
        Welke lengte van een man hoort bij $z = -1{,}25$?
      antwoord: |-
        166~cm
      uitwerking: |-
        Uit $z = \frac{x - \mu}{\sigma}$ volgt $x = \mu + z\sigma = 176 - 1{,}25 \cdot 8 = 166$~cm.
    - opgave: |-
        Wie is uitzonderlijker groot: een man van 196~cm of een vrouw van 182~cm?
      antwoord: |-
        de vrouw
      uitwerking: |-
        Man: $z = \frac{196 - 176}{8} = 2{,}5$. Vrouw: $z = \frac{182 - 165}{6{,}5} \approx 2{,}62$. De vrouw ligt verder boven het gemiddelde van haar groep.

- id: h2-normalcdf
  soort: kort
  opgave: |-
    De scores zijn normaal verdeeld met $\mu = 70$ en $\sigma = 8$. Bereken met je rekentoestel het percentage dat
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        meer dan 85 scoort;
      antwoord: |-
        $\approx 3{,}0$~\%
      uitwerking: |-
        \texttt{normalcdf(85,1E99,70,8)} $\approx 0{,}030$.
    - opgave: |-
        minder dan 55 scoort;
      antwoord: |-
        $\approx 3{,}0$~\%
      uitwerking: |-
        \texttt{normalcdf(-1E99,55,70,8)} $\approx 0{,}030$: door de symmetrie gelijk aan a.
    - opgave: |-
        tussen 60 en 75 scoort.
      antwoord: |-
        $\approx 62{,}8$~\%
      uitwerking: |-
        \texttt{normalcdf(60,75,70,8)} $\approx 0{,}628$.

- id: h2-invnorm
  soort: kort
  opgave: |-
    De scores zijn normaal verdeeld met $\mu = 70$ en $\sigma = 8$.
  lijst: enumerate
  delen:
    - opgave: |-
        Vanaf welke score hoor je bij de beste 5~\%?
      antwoord: |-
        $\approx 83{,}2$
      uitwerking: |-
        Links van de grens ligt 95~\%: \texttt{invNorm(0.95,70,8)} $\approx 83{,}2$.
    - opgave: |-
        Tussen welke scores ligt het middelste 50~\%?
      antwoord: |-
        $\approx 64{,}6$ en $75{,}4$
      uitwerking: |-
        \texttt{invNorm(0.25,70,8)} $\approx 64{,}6$ en \texttt{invNorm(0.75,70,8)} $\approx 75{,}4$.

- id: h2-model
  soort: kort
  opgave: |-
    Welke variabelen zijn waarschijnlijk (ongeveer) normaal verdeeld? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        de massa van eieren van één kippenras
      antwoord: |-
        ja
      uitwerking: |-
        Waarschijnlijk wel: veel eieren rond een gemiddelde, symmetrisch afnemend naar lichter en zwaarder.
    - opgave: |-
        het maandloon van alle werknemers van een land
      antwoord: |-
        nee
      uitwerking: |-
        Nee: lonen zijn scheef, met een lange staart naar hoge lonen, en het gemiddelde ligt boven de mediaan.
    - opgave: |-
        de tijd tussen twee bussen bij een halte waar ze om de 10 minuten rijden
      antwoord: |-
        nee
      uitwerking: |-
        Waarschijnlijk niet: de wachttijd ligt tussen 0 en ongeveer 10 minuten, en is eerder gelijkmatig dan klokvormig.

- id: h2-model-2
  soort: kort
  opgave: |-
    Een fabriek weegt 200 pakken suiker: $\xbar = 1002$~g en $s = 4$~g. Er wegen 46 pakken meer dan 1005~g en 9 pakken minder dan 995~g. Vergelijk met het normale model $N(1002, 4)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk percentage weegt meer dan 1005~g, in de data en in het model?
      antwoord: |-
        23~\% en $\approx 22{,}7$~\%
      uitwerking: |-
        Data: $\frac{46}{200} = 23$~\%. Model: \texttt{normalcdf(1005,1E99,1002,4)} $\approx 0{,}227$.
    - opgave: |-
        Welk percentage weegt minder dan 995~g, in de data en in het model?
      antwoord: |-
        $4{,}5$~\% en $\approx 4{,}0$~\%
      uitwerking: |-
        Data: $\frac{9}{200} = 4{,}5$~\%. Model: \texttt{normalcdf(-1E99,995,1002,4)} $\approx 0{,}040$.
    - opgave: |-
        Geen enkel pak weegt minder dan 990~g. Klopt dat met het model? Is het model bruikbaar?
      antwoord: |-
        ja; ja
      uitwerking: |-
        Het model verwacht $200 \cdot {}$\texttt{normalcdf(-1E99,990,1002,4)} $\approx 200 \cdot 0{,}0013 \approx 0{,}3$ pakken, dus ook geen. De percentages liggen telkens dicht bij die van het model: het is bruikbaar.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h2-mu
  soort: kort
  opgave: |-
    De punten op een groot examen zijn normaal verdeeld met $\sigma = 12$. De examencommissie wil dat hoogstens 15~\% van de deelnemers minder dan 50 haalt.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe hoog moet het gemiddelde dan minstens zijn?
      antwoord: |-
        $\mu \approx 62{,}4$
      uitwerking: |-
        Links van 50 ligt 15~\%: $z = {}$\texttt{invNorm(0.15,0,1)} $\approx -1{,}036$. Uit $50 = \mu - 1{,}036 \cdot 12$ volgt $\mu \approx 62{,}4$.
    - opgave: |-
        Een ander examen heeft $\mu = 60$. Hoe groot mag $\sigma$ hoogstens zijn?
      antwoord: |-
        $\sigma \approx 9{,}65$
      uitwerking: |-
        Nu is $\mu$ bekend en $\sigma$ niet: $50 = 60 - 1{,}036\,\sigma$, dus $\sigma = \frac{10}{1{,}036} \approx 9{,}65$. Bij een grotere spreiding haalt meer dan 15~\% minder dan 50.

- id: h2-scheef
  soort: kort
  opgave: |-
    De verkoopprijzen van 500 woningen in een regio hebben gemiddelde 280\,000~euro en standaardafwijking 150\,000~euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken met het model $N(280\,000;\ 150\,000)$ het percentage woningen met een negatieve prijs.
      antwoord: |-
        $\approx 3{,}1$~\%
      uitwerking: |-
        $z = \frac{0 - 280\,000}{150\,000} \approx -1{,}87$, en \texttt{normalcdf(-1E99,0,280000,150000)} $\approx 0{,}031$.
    - opgave: |-
        Is het normale model hier bruikbaar? Verklaar.
      antwoord: |-
        nee
      uitwerking: |-
        Nee. Een negatieve prijs bestaat niet, en toch geeft het model daar 3~\%. Woningprijzen zijn scheef, met een lange staart naar de dure woningen: de standaardafwijking is groot in vergelijking met het gemiddelde.

- id: h2-d1
  soort: opdracht
  niveau: 1
  thema: |-
    drill: vuistregels zonder rekentoestel
  opgave: |-
    $X \sim N(100, 15)$. Bereken zonder rekentoestel, met de 68-95-99,7-regel en de symmetrie. Maak telkens een kleine schets.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $P(85 < X < 115)$
      antwoord: |-
        $0{,}68$
      uitwerking: |-
        $85$ en $115$ zijn $\mu \pm \sigma$: $0{,}68$.
    - opgave: |-
        $P(70 < X < 130)$
      antwoord: |-
        $0{,}95$
      uitwerking: |-
        $70$ en $130$ zijn $\mu \pm 2\sigma$: $0{,}95$.
    - opgave: |-
        $P(X > 115)$
      antwoord: |-
        $0{,}16$
      uitwerking: |-
        Buiten $[85, 115]$ ligt $0{,}32$, in twee gelijke staarten: $\frac{0{,}32}{2} = 0{,}16$.
    - opgave: |-
        $P(X < 70)$
      antwoord: |-
        $0{,}025$
      uitwerking: |-
        Buiten $[70, 130]$ ligt $0{,}05$: links de helft, $0{,}025$.
    - opgave: |-
        $P(X > 145)$
      antwoord: |-
        $0{,}0015$
      uitwerking: |-
        $145 = \mu + 3\sigma$: buiten $[55, 145]$ ligt $0{,}003$, rechts de helft, $0{,}0015$.
    - opgave: |-
        $P(100 < X < 130)$
      antwoord: |-
        $0{,}475$
      uitwerking: |-
        De helft van $[70, 130]$: $\frac{0{,}95}{2} = 0{,}475$.
    - opgave: |-
        $P(85 < X < 130)$
      antwoord: |-
        $0{,}815$
      uitwerking: |-
        Splits bij $\mu$: $P(85 < X < 100) + P(100 < X < 130) = 0{,}34 + 0{,}475 = 0{,}815$.
    - opgave: |-
        $P(X > 85)$
      antwoord: |-
        $0{,}84$
      uitwerking: |-
        Complement van $P(X < 85) = 0{,}16$: $1 - 0{,}16 = 0{,}84$.
    - opgave: |-
        $P(X > 70)$
      antwoord: |-
        $0{,}975$
      uitwerking: |-
        $1 - P(X < 70) = 1 - 0{,}025 = 0{,}975$.
    - opgave: |-
        $P(55 < X < 115)$
      antwoord: |-
        $0{,}8385$
      uitwerking: |-
        $P(55 < X < 100) + P(100 < X < 115) = \frac{0{,}997}{2} + \frac{0{,}68}{2} = 0{,}4985 + 0{,}34 = 0{,}8385$.
    - opgave: |-
        $P(115 < X < 130)$
      antwoord: |-
        $0{,}135$
      uitwerking: |-
        $P(100 < X < 130) - P(100 < X < 115) = 0{,}475 - 0{,}34 = 0{,}135$.
    - opgave: |-
        $P(X < 145)$
      antwoord: |-
        $0{,}9985$
      uitwerking: |-
        $1 - P(X > 145) = 1 - 0{,}0015 = 0{,}9985$.

- id: h2-o13
  soort: opdracht
  niveau: 1
  thema: |-
    histogram met dichtheid
  figuur:
    code: |-
      \begin{tikzpicture}[x=.45cm,y=20cm,font=\scriptsize]
        \draw[black!15] (0,0) grid[xstep=2,ystep=.025] (12,.16);
        \foreach \a/\h in {0/.10,2/.15,4/.10,6/.075,8/.05,10/.025}{\draw[accent,fill=accent!20] (\a,0) rectangle (\a+2,\h);}
        \draw[->,grijs] (0,0) -- (12.8,0) node[right,text=black] {min};
        \draw[->,grijs] (0,0) -- (0,.17);
        \foreach \t in {0,2,...,12}{\node[below] at (\t,0) {\t};}
        \foreach \t/\l in {.05/{0,05},.10/{0,10},.15/{0,15}}{\node[left] at (0,\t) {\l};}
      \end{tikzpicture}
  opgave: |-
    Een helpdesk noteert de duur van 400 telefoongesprekken, in klassen van 2 minuten. De hoogte van een staaf is de relatieve frequentie \textit{per minuut}.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke fractie van de gesprekken duurt tussen 2 en 4 minuten?
      antwoord: |-
        $0{,}30$
      uitwerking: |-
        De oppervlakte van de staaf is de relatieve frequentie: $2 \cdot 0{,}15 = 0{,}30$.
    - opgave: |-
        Hoeveel gesprekken duren tussen 4 en 8 minuten?
      antwoord: |-
        140
      uitwerking: |-
        Oppervlakte $2 \cdot 0{,}10 + 2 \cdot 0{,}075 = 0{,}35$, dus $0{,}35 \cdot 400 = 140$ gesprekken.
    - opgave: |-
        Controleer dat de totale oppervlakte van de staven 1 is. Waarom moet dat zo zijn?
      antwoord: |-
        $1$
      uitwerking: |-
        $2 \cdot (0{,}10 + 0{,}15 + 0{,}10 + 0{,}075 + 0{,}05 + 0{,}025) = 2 \cdot 0{,}5 = 1$. Elk gesprek ligt in een klasse, dus de relatieve frequenties tellen op tot 1.
    - opgave: |-
        Is de duur van de gesprekken ongeveer normaal verdeeld? Verklaar.
      antwoord: |-
        nee
      uitwerking: |-
        Nee: het histogram is scheef, met een lange staart naar rechts, en het begint bij 0. Een Gausskromme is symmetrisch.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    kansen met het rekentoestel
  opgave: |-
    Het geboortegewicht van baby's is normaal verdeeld met $\mu = 3400$~g en $\sigma = 450$~g. Welk percentage weegt
  lijst: enumerate
  delen:
    - opgave: |-
        tussen 3000 en 4000~g?
      antwoord: |-
        $\approx 72$~\%
      uitwerking: |-
        Schets: een gebied rond $\mu$, iets meer links dan rechts. \texttt{normalcdf(3000,4000,3400,450)} $\approx 0{,}722$: ongeveer 72~\%.
    - opgave: |-
        minder dan 2500~g?
      antwoord: |-
        $\approx 2{,}3$~\%
      uitwerking: |-
        \texttt{normalcdf(-1E99,2500,3400,450)} $\approx 0{,}023$. Controle: 2500 ligt precies $2\sigma$ onder $\mu$, en de vuistregel geeft 2,5~\%.

- id: h2-o11
  soort: opdracht
  niveau: 1
  thema: |-
    krommen bij $\mu$ en $\sigma$ kiezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.3cm,y=6cm,font=\scriptsize]
        \draw[black!15] (0,0) grid[xstep=2,ystep=.1] (20,.42);
        \draw[->,grijs] (0,0) -- (20.8,0) node[right,text=black] {$x$};
        \foreach \t in {0,4,...,20}{\node[below] at (\t,0) {\t};}
        \draw[accent,thick] plot[domain=6:20,samples=80,smooth] (\x,{gauss(\x,14,2)});
        \draw[fel!80!black,thick] plot[domain=3.5:12.5,samples=80,smooth] (\x,{gauss(\x,8,1)});
        \draw[black,thick,dashed] plot[domain=0:17,samples=80,smooth] (\x,{gauss(\x,8,3)});
        \node[text=accent] at (16.6,.17) {A};
        \node[text=fel!80!black] at (9.4,.38) {B};
        \node at (3,.12) {C};
      \end{tikzpicture}
  opgave: |-
    De figuur toont drie Gausskrommen.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke kromme heeft het grootste gemiddelde?
      antwoord: |-
        A
      uitwerking: |-
        De top van A ligt het meest rechts, bij $x = 14$.
    - opgave: |-
        Welke kromme hoort bij $N(8, 1)$, bij $N(8, 3)$ en bij $N(14, 2)$?
      antwoord: |-
        B, C, A
      uitwerking: |-
        B en C hebben hun top bij 8. B is het smalst, dus $\sigma = 1$; C is het breedst, dus $\sigma = 3$. A is $N(14, 2)$.
    - opgave: |-
        Waarom is de top van B ongeveer drie keer zo hoog als die van C?
      antwoord: |-
        oppervlakte 1, drie keer zo smal
      uitwerking: |-
        Beide krommen hebben oppervlakte 1. B is drie keer zo smal als C ($\sigma = 1$ tegenover $\sigma = 3$), dus moet ze ongeveer drie keer zo hoog zijn.
    - opgave: |-
        Tussen welke twee waarden ligt ongeveer 68~\% van de waarden van A?
      antwoord: |-
        12 en 16
      uitwerking: |-
        $\mu \pm \sigma = 14 \pm 2$: tussen 12 en 16.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    z-scores vergelijken
  opgave: |-
    Lena haalt 78 op een toets met gemiddelde 65 en standaardafwijking 8. Jonas haalt 81 op een andere toets met gemiddelde 70 en standaardafwijking 6. Wie presteerde relatief beter?
  antwoord: |-
    Jonas
  uitwerking: |-
    Vergelijk de z-scores, want de toetsen hebben een ander gemiddelde en een andere spreiding. Lena: $z = \frac{78 - 65}{8} \approx 1{,}63$. Jonas: $z = \frac{81 - 70}{6} \approx 1{,}83$. Jonas ligt meer standaardafwijkingen boven het gemiddelde van zijn groep, dus hij presteerde relatief beter, ook al is zijn voorsprong in punten (11) kleiner dan die van Lena (13).

- id: h2-d2
  soort: opdracht
  niveau: 1
  thema: |-
    drill: kansen met normalcdf
  opgave: |-
    \emergencystretch=2em Bereken met je rekentoestel, op drie decimalen. In a tot c is ${X \sim N(20, 3)}$, in d tot f is ${X \sim N(500, 40)}$, in g en h is ${X \sim N(1{,}75;\, 0{,}08)}$, en in i tot l is ${Z \sim N(0, 1)}$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $P(X < 25)$
      antwoord: |-
        $0{,}952$
      uitwerking: |-
        \texttt{normalcdf(-1E99,25,20,3)} $\approx 0{,}952$.
    - opgave: |-
        $P(X > 18)$
      antwoord: |-
        $0{,}748$
      uitwerking: |-
        \texttt{normalcdf(18,1E99,20,3)} $\approx 0{,}748$.
    - opgave: |-
        $P(17 < X < 22)$
      antwoord: |-
        $0{,}589$
      uitwerking: |-
        \texttt{normalcdf(17,22,20,3)} $\approx 0{,}589$.
    - opgave: |-
        $P(X > 560)$
      antwoord: |-
        $0{,}067$
      uitwerking: |-
        \texttt{normalcdf(560,1E99,500,40)} $\approx 0{,}067$.
    - opgave: |-
        $P(450 < X < 520)$
      antwoord: |-
        $0{,}586$
      uitwerking: |-
        \texttt{normalcdf(450,520,500,40)} $\approx 0{,}586$.
    - opgave: |-
        $P(X < 430)$
      antwoord: |-
        $0{,}040$
      uitwerking: |-
        \texttt{normalcdf(-1E99,430,500,40)} $\approx 0{,}040$.
    - opgave: |-
        $P(X > 1{,}90)$
      antwoord: |-
        $0{,}030$
      uitwerking: |-
        \texttt{normalcdf(1.9,1E99,1.75,0.08)} $\approx 0{,}030$.
    - opgave: |-
        $P(1{,}60 < X < 1{,}80)$
      antwoord: |-
        $0{,}704$
      uitwerking: |-
        \texttt{normalcdf(1.6,1.8,1.75,0.08)} $\approx 0{,}704$.
    - opgave: |-
        $P(Z < 1{,}5)$
      antwoord: |-
        $0{,}933$
      uitwerking: |-
        \texttt{normalcdf(-1E99,1.5,0,1)} $\approx 0{,}933$.
    - opgave: |-
        $P(Z > -0{,}8)$
      antwoord: |-
        $0{,}788$
      uitwerking: |-
        \texttt{normalcdf(-0.8,1E99,0,1)} $\approx 0{,}788$.
    - opgave: |-
        $P(-1{,}2 < Z < 2{,}1)$
      antwoord: |-
        $0{,}867$
      uitwerking: |-
        \texttt{normalcdf(-1.2,2.1,0,1)} $\approx 0{,}867$.
    - opgave: |-
        $P(\lvert Z \rvert > 1{,}7)$
      antwoord: |-
        $0{,}089$
      uitwerking: |-
        $Z < -1{,}7$ of $Z > 1{,}7$: twee gelijke staarten, $2 \cdot {}$\texttt{normalcdf(1.7,1E99,0,1)} $\approx 2 \cdot 0{,}0446 \approx 0{,}089$.

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    vuistregels
  opgave: |-
    De lengte van pasgeboren baby's is normaal verdeeld met $\mu = 50$~cm en $\sigma = 2$~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Tussen welke grenzen ligt de lengte van 95~\% van de baby's?
      antwoord: |-
        $[46, 54]$
      uitwerking: |-
        95~\% ligt binnen twee standaardafwijkingen: $50 \pm 2 \cdot 2 = [46, 54]$.
    - opgave: |-
        Welk percentage is langer dan 52~cm?
      antwoord: |-
        16~\%
      uitwerking: |-
        52 is $\mu + \sigma$. Buiten $[48, 52]$ ligt $100 - 68 = 32$~\%, in twee gelijke staarten: boven 52 ligt $\frac{32}{2} = 16$~\%.

- id: h2-o14
  soort: opdracht
  niveau: 1
  thema: |-
    een gebied bij een kans kiezen
  opgave: |-
    $X \sim N(50, 10)$. Bij elke figuur hoort een kans: het gekleurde gebied.
    \figuren{\begin{tikzpicture}[x=.05cm,y=28cm,font=\scriptsize]
      \fill[accent!30] plot[domain=20:40,samples=30] (\x,{gauss(\x,50,10)}) -- (40,0) -- (20,0) -- cycle;
      \draw[->,grijs] (18,0) -- (84,0);
      \draw[accent,thick] plot[domain=20:80,samples=60,smooth] (\x,{gauss(\x,50,10)});
      \foreach \t in {40,50}{\node[below] at (\t,0) {\t};}
      \node[font=\small\bfseries] at (24,.04) {A};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.05cm,y=28cm,font=\scriptsize]
      \fill[accent!30] plot[domain=65:80,samples=30] (\x,{gauss(\x,50,10)}) -- (80,0) -- (65,0) -- cycle;
      \draw[->,grijs] (18,0) -- (84,0);
      \draw[accent,thick] plot[domain=20:80,samples=60,smooth] (\x,{gauss(\x,50,10)});
      \foreach \t in {50,65}{\node[below] at (\t,0) {\t};}
      \node[font=\small\bfseries] at (24,.04) {B};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.05cm,y=28cm,font=\scriptsize]
      \fill[accent!30] plot[domain=40:65,samples=30] (\x,{gauss(\x,50,10)}) -- (65,0) -- (40,0) -- cycle;
      \draw[->,grijs] (18,0) -- (84,0);
      \draw[accent,thick] plot[domain=20:80,samples=60,smooth] (\x,{gauss(\x,50,10)});
      \foreach \t in {40,50,65}{\node[below] at (\t,0) {\t};}
      \node[font=\small\bfseries] at (24,.04) {C};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.05cm,y=28cm,font=\scriptsize]
      \fill[accent!30] plot[domain=20:40,samples=30] (\x,{gauss(\x,50,10)}) -- (40,0) -- (20,0) -- cycle;
      \fill[accent!30] plot[domain=60:80,samples=30] (\x,{gauss(\x,50,10)}) -- (80,0) -- (60,0) -- cycle;
      \draw[->,grijs] (18,0) -- (84,0);
      \draw[accent,thick] plot[domain=20:80,samples=60,smooth] (\x,{gauss(\x,50,10)});
      \foreach \t in {40,50,60}{\node[below] at (\t,0) {\t};}
      \node[font=\small\bfseries] at (24,.04) {D};
    \end{tikzpicture}}
    Schrijf bij elke figuur de kans met $P(\ldots)$ en de opdracht voor het rekentoestel, en bereken de kans op drie decimalen.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        figuur A
      antwoord: |-
        $P(X < 40) \approx 0{,}159$
      uitwerking: |-
        $P(X < 40)$: \texttt{normalcdf(-1E99,40,50,10)} $\approx 0{,}159$. Controle: 40 is $\mu - \sigma$, de vuistregel geeft 16~\%.
    - opgave: |-
        figuur B
      antwoord: |-
        $P(X > 65) \approx 0{,}067$
      uitwerking: |-
        $P(X > 65)$: \texttt{normalcdf(65,1E99,50,10)} $\approx 0{,}067$.
    - opgave: |-
        figuur C
      antwoord: |-
        $P(40 < X < 65) \approx 0{,}775$
      uitwerking: |-
        $P(40 < X < 65)$: \texttt{normalcdf(40,65,50,10)} $\approx 0{,}775$.
    - opgave: |-
        figuur D
      antwoord: |-
        $P(X < 40 \text{ of } X > 60) \approx 0{,}317$
      uitwerking: |-
        Het complement van het middelste stuk: $1 - {}$\texttt{normalcdf(40,60,50,10)} $\approx 1 - 0{,}683 = 0{,}317$. Controle: buiten $\mu \pm \sigma$ ligt ongeveer 32~\%.

- id: h2-o12
  soort: opdracht
  niveau: 1
  thema: |-
    z-scores berekenen
  opgave: |-
    Bereken de z-score op twee decimalen. Is de waarde uitzonderlijk, dus meer dan twee standaardafwijkingen van het gemiddelde?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        184 als $X \sim N(176, 7)$
      antwoord: |-
        $1{,}14$; nee
      uitwerking: |-
        $z = \frac{184 - 176}{7} \approx 1{,}14$: niet uitzonderlijk.
    - opgave: |-
        $2{,}9$ als $X \sim N(3{,}4;\, 0{,}45)$
      antwoord: |-
        $-1{,}11$; nee
      uitwerking: |-
        $z = \frac{2{,}9 - 3{,}4}{0{,}45} \approx -1{,}11$: onder het gemiddelde, maar niet uitzonderlijk.
    - opgave: |-
        58 als $X \sim N(65, 4)$
      antwoord: |-
        $-1{,}75$; nee
      uitwerking: |-
        $z = \frac{58 - 65}{4} = -1{,}75$: niet uitzonderlijk.
    - opgave: |-
        131 als $X \sim N(100, 15)$
      antwoord: |-
        $2{,}07$; ja
      uitwerking: |-
        $z = \frac{131 - 100}{15} \approx 2{,}07 > 2$: uitzonderlijk.
    - opgave: |-
        $12{,}5$ als $X \sim N(12;\, 0{,}2)$
      antwoord: |-
        $2{,}50$; ja
      uitwerking: |-
        $z = \frac{12{,}5 - 12}{0{,}2} = 2{,}5$: uitzonderlijk, al is het verschil maar 0,5. Bij een kleine $\sigma$ is een klein verschil al veel.
    - opgave: |-
        41 als $X \sim N(50, 6)$
      antwoord: |-
        $-1{,}50$; nee
      uitwerking: |-
        $z = \frac{41 - 50}{6} = -1{,}5$: niet uitzonderlijk.

- id: h2-o4
  soort: opdracht
  niveau: 2
  thema: |-
    context: vulmachine
  opgave: |-
    Een machine vult flessen met een hoeveelheid die normaal verdeeld is met $\mu = 500$~ml en $\sigma = 2$~ml. Op het etiket staat 497~ml.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk percentage van de flessen bevat minder dan 497~ml?
      antwoord: |-
        $\approx 6{,}7$~\%
      uitwerking: |-
        \texttt{normalcdf(-1E99,497,500,2)} $\approx 0{,}067$: ongeveer 6,7~\%.
    - opgave: |-
        Op welk gemiddelde moet men de machine instellen zodat maar 1~\% onder 497~ml valt (met dezelfde $\sigma$)?
      antwoord: |-
        $\approx 501{,}7$~ml
      uitwerking: |-
        Het onbekende is $\mu$, dus werk met de standaardnormale verdeling. Links van $z = {}$\texttt{invNorm(0.01,0,1)} $\approx -2{,}33$ ligt 1~\%. De grens 497 moet dus $2{,}33\,\sigma$ onder $\mu$ liggen: $497 = \mu - 2{,}33 \cdot 2$, zodat $\mu \approx 501{,}7$~ml. Controle: \texttt{normalcdf(-1E99,497,501.7,2)} $\approx 0{,}009$, ongeveer 1~\%.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    Waar zit de fout?
  opgave: |-
    Waar zit de fout? Verbeter, en geef het juiste antwoord. Telkens is $X \sim N(70, 8)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Sara berekent $P(X > 80)$ met \texttt{normalcdf(-1E99,80,70,8)} en vindt $0{,}894$.
      antwoord: |-
        $\approx 0{,}106$
      uitwerking: |-
        Ze berekent de oppervlakte links van 80, niet rechts. Juist: \texttt{normalcdf(80,1E99,70,8)} $\approx 0{,}106$. Een schets toont meteen dat de kans kleiner dan $0{,}5$ moet zijn.
    - opgave: |-
        Tom weet dat de variantie 64 is en tikt \texttt{normalcdf(60,80,70,64)}.
      antwoord: |-
        $\approx 0{,}789$
      uitwerking: |-
        Het rekentoestel verwacht de standaardafwijking $\sigma = \sqrt{64} = 8$, niet de variantie. Juist: \texttt{normalcdf(60,80,70,8)} $\approx 0{,}789$ (Tom vindt $0{,}124$).
    - opgave: |-
        Lien zoekt de grens van de beste 10~\% en tikt \texttt{invNorm(0.1,70,8)}.
      antwoord: |-
        $\approx 80{,}3$
      uitwerking: |-
        \texttt{invNorm} gebruikt de oppervlakte links van de grens. Rechts ligt 10~\%, links dus 90~\%: \texttt{invNorm(0.9,70,8)} $\approx 80{,}3$. Lien vindt $59{,}7$, de grens van de zwakste 10~\%.
    - opgave: |-
        Arne zegt: $P(X \geqslant 80)$ is groter dan $P(X > 80)$, want 80 telt mee.
      antwoord: |-
        ze zijn gelijk
      uitwerking: |-
        Bij een continue variabele is $P(X = 80) = 0$: de oppervlakte boven één punt is 0. Dus $P(X \geqslant 80) = P(X > 80) \approx 0{,}106$.
    - opgave: |-
        Mila berekent de z-score van 62 als $\frac{70 - 62}{8} = 1$.
      antwoord: |-
        $z = -1$
      uitwerking: |-
        De formule is $z = \frac{x - \mu}{\sigma} = \frac{62 - 70}{8} = -1$. Het teken zegt dat 62 onder het gemiddelde ligt.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    context: eieren sorteren
  opgave: |-
    Een kippenkweker sorteert eieren in klassen: S onder 53~g, M van 53 tot 63~g, L van 63 tot 73~g en XL vanaf 73~g. De massa van zijn eieren is normaal verdeeld met ${\mu = 61}$~g en ${\sigma = 5}$~g.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk percentage van de eieren is van klasse M? En van klasse S?
      antwoord: |-
        $\approx 60{,}1$~\%; \ $\approx 5{,}5$~\%
      uitwerking: |-
        M: \texttt{normalcdf(53,63,61,5)} $\approx 0{,}601$. S: \texttt{normalcdf(-1E99,53,61,5)} $\approx 0{,}055$.
    - opgave: |-
        De kweker raapt 2400 eieren per dag. Hoeveel XL-eieren verwacht hij?
      antwoord: |-
        $\approx 20$
      uitwerking: |-
        $P(X > 73) = {}$\texttt{normalcdf(73,1E99,61,5)} $\approx 0{,}0082$, en $0{,}0082 \cdot 2400 \approx 20$ eieren.
    - opgave: |-
        Controleer: tellen de vier percentages op tot 100~\%?
      antwoord: |-
        ja
      uitwerking: |-
        L: \texttt{normalcdf(63,73,61,5)} $\approx 0{,}336$. Samen $0{,}055 + 0{,}601 + 0{,}336 + 0{,}008 = 1{,}000$: de klassen sluiten op elkaar aan.
    - opgave: |-
        Vanaf welke massa hoort een ei bij de zwaarste 5~\%?
      antwoord: |-
        $\approx 69{,}2$~g
      uitwerking: |-
        Links van de grens ligt 95~\%: \texttt{invNorm(0.95,61,5)} $\approx 69{,}2$~g.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    een model beoordelen
  opgave: |-
    Van 500 appels is het gemiddelde 182~g en de standaardafwijking 11~g. Er wegen 330 appels tussen 171 en 193~g, en 480 tussen 160 en 204~g. Past een normaal model? Gebruik de vuistregels.
  antwoord: |-
    ja
  uitwerking: |-
    Schat $\mu \approx 182$ en $\sigma \approx 11$, en kijk waar de grenzen liggen. 171 en 193 zijn $\mu \pm \sigma$: in de data $\frac{330}{500} = 66$~\%, dicht bij de 68~\% van het model. 160 en 204 zijn $\mu \pm 2\sigma$: $\frac{480}{500} = 96$~\%, dicht bij 95~\%. Het normale model past goed (al kun je dat beter ook met een histogram nagaan: de vuistregels zeggen niets over de symmetrie).

- id: h2-d3
  soort: opdracht
  niveau: 2
  thema: |-
    drill: grenzen met invNorm
  opgave: |-
    Bepaal $a$ (en $b$) met je rekentoestel. Maak eerst een schets: welke oppervlakte ligt links van de grens? In a tot d is ${X \sim N(60, 5)}$, in e en f is ${X \sim N(250, 12)}$, in g tot i is ${Z \sim N(0, 1)}$. In d ligt het interval symmetrisch rond $\mu$. Rond af op één decimaal, en bij $Z$ op twee.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $P(X < a) = 0{,}80$
      antwoord: |-
        $64{,}2$
      uitwerking: |-
        \texttt{invNorm(0.8,60,5)} $\approx 64{,}2$.
    - opgave: |-
        $P(X > a) = 0{,}05$
      antwoord: |-
        $68{,}2$
      uitwerking: |-
        Links ligt 95~\%: \texttt{invNorm(0.95,60,5)} $\approx 68{,}2$.
    - opgave: |-
        $P(X > a) = 0{,}75$
      antwoord: |-
        $56{,}6$
      uitwerking: |-
        Links ligt 25~\%: \texttt{invNorm(0.25,60,5)} $\approx 56{,}6$, onder $\mu$, zoals de schets voorspelt.
    - opgave: |-
        $P(a < X < b) = 0{,}90$
      antwoord: |-
        $51{,}8$ en $68{,}2$
      uitwerking: |-
        In elke staart 5~\%: \texttt{invNorm(0.05,60,5)} $\approx 51{,}8$ en \texttt{invNorm(0.95,60,5)} $\approx 68{,}2$.
    - opgave: |-
        $P(X < a) = 0{,}01$
      antwoord: |-
        $222{,}1$
      uitwerking: |-
        \texttt{invNorm(0.01,250,12)} $\approx 222{,}1$.
    - opgave: |-
        $P(X > a) = 0{,}30$
      antwoord: |-
        $256{,}3$
      uitwerking: |-
        Links ligt 70~\%: \texttt{invNorm(0.7,250,12)} $\approx 256{,}3$.
    - opgave: |-
        $P(Z < a) = 0{,}975$
      antwoord: |-
        $1{,}96$
      uitwerking: |-
        \texttt{invNorm(0.975,0,1)} $\approx 1{,}96$.
    - opgave: |-
        $P(Z > a) = 0{,}10$
      antwoord: |-
        $1{,}28$
      uitwerking: |-
        Links ligt 90~\%: \texttt{invNorm(0.9,0,1)} $\approx 1{,}28$.
    - opgave: |-
        $P(-a < Z < a) = 0{,}80$
      antwoord: |-
        $1{,}28$
      uitwerking: |-
        Buiten $[-a, a]$ ligt 20~\%, in elke staart 10~\%. Links van $a$ ligt dus 90~\%: $a \approx 1{,}28$, net als in h.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    $\mu$ en $\sigma$ aflezen uit een Gausskromme
  figuur:
    code: |-
      \begin{tikzpicture}[x=.22cm,y=30cm,font=\scriptsize]
        \draw[black!15] (26,0) grid[xstep=2,ystep=.02] (54,.11);
        \draw[->,grijs] (26,0) -- (55,0) node[right,text=black] {$x$};
        \foreach \t in {28,32,...,52}{\node[below] at (\t,0) {\t};}
        \draw[accent,thick] plot[domain=26:54,samples=100,smooth] (\x,{gauss(\x,40,4)});
        \fill[fel!80!black] (36,{gauss(36,40,4)}) circle (1.5pt) (44,{gauss(44,40,4)}) circle (1.5pt);
      \end{tikzpicture}
  opgave: |-
    De figuur toont de dichtheid van een normaal verdeelde $X$. De twee stippen zijn de buigpunten.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees $\mu$ en $\sigma$ af.
      antwoord: |-
        $\mu = 40$, $\sigma = 4$
      uitwerking: |-
        De top en de symmetrieas liggen bij $x = 40$, dus $\mu = 40$. De buigpunten liggen bij $\mu \pm \sigma = 36$ en $44$, dus $\sigma = 4$.
    - opgave: |-
        Schat ${P(32 < X < 48)}$ zonder rekentoestel.
      antwoord: |-
        $\approx 0{,}95$
      uitwerking: |-
        32 en 48 zijn $\mu \pm 2\sigma$: ongeveer 95~\%.
    - opgave: |-
        Bereken $P(X > 46)$ en kleur het gebied in een schets.
      antwoord: |-
        $\approx 0{,}067$
      uitwerking: |-
        \texttt{normalcdf(46,1E99,40,4)} $\approx 0{,}067$. Het gebied is de rechterstaart vanaf 46, anderhalve $\sigma$ rechts van de top.

- id: h2-o6
  soort: opdracht
  niveau: 2
  thema: |-
    misvattingen
  opgave: |-
    Waar of vals? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Bij een normale verdeling is $P(X = \mu)$ ongeveer 0,4.
      antwoord: |-
        vals
      uitwerking: |-
        Vals: bij een continue variabele is de kans op één waarde 0. De hoogte van de kromme is geen kans: alleen een oppervlakte is een kans.
    - opgave: |-
        Een groter $\sigma$ maakt de Gausskromme breder en lager.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: de oppervlakte blijft 1, dus breder betekent lager.
    - opgave: |-
        Bij elke normale verdeling ligt ongeveer 95~\% tussen $\mu - 2\sigma$ en $\mu + 2\sigma$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: dat is de vuistregel, voor elke $\mu$ en $\sigma$.
    - opgave: |-
        Elke variabele met veel metingen is normaal verdeeld.
      antwoord: |-
        vals
      uitwerking: |-
        Vals: lonen of wachttijden blijven scheef, hoeveel metingen je ook hebt. Meer metingen geven alleen een beter beeld van de echte vorm.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    context: $\sigma$ terugvinden
  opgave: |-
    Een fabrikant meldt dat zijn batterijen gemiddeld 450 uur meegaan, en dat 90~\% minstens 400 uur meegaat. Neem aan dat de levensduur normaal verdeeld is.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\sigma$.
      antwoord: |-
        $\sigma \approx 39{,}0$ uur
      uitwerking: |-
        Onder 400 ligt 10~\%. Voor $N(0, 1)$ ligt 10~\% links van \texttt{invNorm(0.1,0,1)} $\approx -1{,}2816$. Dus $\frac{400 - 450}{\sigma} = -1{,}2816$, en $\sigma = \frac{50}{1{,}2816} \approx 39{,}0$ uur.
    - opgave: |-
        Welk percentage gaat langer dan 500 uur mee? Kun je dat zonder rekentoestel?
      antwoord: |-
        10~\%
      uitwerking: |-
        500 ligt even ver boven $\mu$ als 400 eronder. Door de symmetrie is $P(X > 500) = P(X < 400) = 0{,}10$.
    - opgave: |-
        De fabrikant vervangt gratis elke batterij die minder dan $T$ uur meegaat, en wil dat voor hoogstens 2~\% van de batterijen doen. Bepaal $T$.
      antwoord: |-
        $\approx 370$ uur
      uitwerking: |-
        Links van $T$ ligt 2~\%: \texttt{invNorm(0.02,450,39)} $\approx 369{,}9$. Hij kiest $T = 369$ of $T = 370$ uur; met $T = 370$ is het net iets meer dan 2~\%, dus voorzichtig is 369 uur.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    context: vertraging
  opgave: |-
    De vertraging van een trein is in een model normaal verdeeld met ${\mu = 2}$ minuten en ${\sigma = 1{,}5}$ minuten.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de kans op meer dan 5 minuten vertraging.
      antwoord: |-
        $\approx 0{,}023$
      uitwerking: |-
        \texttt{normalcdf(5,1E99,2,1.5)} $\approx 0{,}023$. Controle: 5 is $\mu + 2\sigma$, de vuistregel geeft 2,5~\%.
    - opgave: |-
        Bereken $P(X < 0)$. Waarom is het model bij kleine vertragingen niet goed?
      antwoord: |-
        $\approx 0{,}09$
      uitwerking: |-
        \texttt{normalcdf(-1E99,0,2,1.5)} $\approx 0{,}091$: volgens het model zou 9~\% van de treinen te vroeg vertrekken. Treinen vertrekken niet te vroeg: de echte verdeling is scheef, met een grens bij 0.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    context: twee machines vergelijken
  opgave: |-
    Een bout is goed als zijn diameter tussen 19,92 en 20,08~mm ligt. Machine A maakt bouten met diameter $N(20{,}00;\, 0{,}04)$, machine B met diameter $N(20{,}03;\, 0{,}025)$, in mm.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk percentage van de bouten van A is goed?
      antwoord: |-
        $\approx 95{,}4$~\%
      uitwerking: |-
        \texttt{normalcdf(19.92,20.08,20,0.04)} $\approx 0{,}954$. De grenzen liggen precies op $\mu \pm 2\sigma$.
    - opgave: |-
        Welk percentage van de bouten van B is goed?
      antwoord: |-
        $\approx 97{,}7$~\%
      uitwerking: |-
        \texttt{normalcdf(19.92,20.08,20.03,0.025)} $\approx 0{,}977$.
    - opgave: |-
        Machine B zit niet in het midden van het interval, en toch doet ze het beter. Verklaar. Wat zou je aan B laten bijstellen?
      antwoord: |-
        kleinere $\sigma$; $\mu$ naar 20,00
      uitwerking: |-
        B heeft een veel kleinere spreiding: de ondergrens ligt $\frac{20{,}03 - 19{,}92}{0{,}025} = 4{,}4$ standaardafwijkingen lager en de bovengrens maar 2 hoger. Bijna alle afgekeurde bouten van B zijn te dik. Stel je $\mu$ van B in op 20,00, dan liggen beide grenzen $3{,}2\,\sigma$ van $\mu$ en is \texttt{normalcdf(19.92,20.08,20,0.025)} $\approx 0{,}999$.

- id: h2-o21
  soort: opdracht
  niveau: 2
  thema: |-
    een model afwijzen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.33cm,y=.045cm,font=\scriptsize]
        \draw[black!15] (0,0) grid[xstep=2,ystep=10] (16,62);
        \foreach \a/\n in {0/58,2/52,4/36,6/22,8/14,10/9,12/6,14/3}{\draw[accent,fill=accent!20] (\a,0) rectangle (\a+2,\n); \node[above] at (\a+1,\n) {\n};}
        \draw[->,grijs] (0,0) -- (17,0) node[right,text=black] {min};
        \foreach \t in {0,4,...,16}{\node[below] at (\t,0) {\t};}
      \end{tikzpicture}
  opgave: |-
    Het histogram toont de wachttijd van 200 klanten aan een loket, in klassen van 2 minuten. Het gemiddelde is 4,5~min en de standaardafwijking 3,5~min.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $P(X < 0)$ in een normaal model met dezelfde $\mu$ en $\sigma$. Hoeveel klanten van de 200 zouden dan negatief wachten?
      antwoord: |-
        $\approx 0{,}099$; ongeveer 20
      uitwerking: |-
        \texttt{normalcdf(-1E99,0,4.5,3.5)} $\approx 0{,}099$, dus ongeveer $0{,}099 \cdot 200 \approx 20$ klanten. In werkelijkheid zijn dat er 0.
    - opgave: |-
        In de data wachten 18 klanten langer dan 10 minuten. Wat voorspelt het model?
      antwoord: |-
        $\approx 5{,}8$~\% tegenover 9~\%
      uitwerking: |-
        Data: $\frac{18}{200} = 9$~\%. Model: \texttt{normalcdf(10,1E99,4.5,3.5)} $\approx 0{,}058$. Het model onderschat de lange wachttijden.
    - opgave: |-
        Past een normaal model? Verklaar met de vorm van het histogram.
      antwoord: |-
        nee
      uitwerking: |-
        Nee: het histogram is scheef naar rechts, met de hoogste staaf bij 0 en een lange staart. Het model zet te veel kans links van 0 en te weinig in de rechterstaart.

- id: h2-o5
  soort: opdracht
  niveau: 2
  thema: |-
    een grens bepalen
  opgave: |-
    De slaapduur van jongeren is (in dit verhaal) normaal verdeeld met $\mu = 7{,}6$ uur en $\sigma = 0{,}9$ uur.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk percentage slaapt minder dan 6 uur?
      antwoord: |-
        $\approx 3{,}8$~\%
      uitwerking: |-
        \texttt{normalcdf(-1E99,6,7.6,0.9)} $\approx 0{,}038$: ongeveer 3,8~\%.
    - opgave: |-
        Hoe lang slaapt iemand minstens om bij de 10~\% langste slapers te horen?
      antwoord: |-
        $\approx 8{,}75$ uur
      uitwerking: |-
        Rechts van de grens ligt 10~\%, links dus 90~\%: \texttt{invNorm(0.9,7.6,0.9)} $\approx 8{,}75$ uur, ongeveer 8 uur en 45 minuten.

- id: h2-o9
  soort: opdracht
  niveau: 3
  thema: |-
    gemiddelde en standaardafwijking terugvinden
  opgave: |-
    Een variabele is normaal verdeeld. 10~\% van de waarden ligt onder 40, en 20~\% boven 70. Bepaal $\mu$ en $\sigma$. Gebruik de z-scores van de standaardnormale verdeling.
  antwoord: |-
    $\mu \approx 58{,}1$; \ $\sigma \approx 14{,}1$
  uitwerking: |-
    Beide grenzen geven een vergelijking in $\mu$ en $\sigma$. \texttt{invNorm(0.1,0,1)} $\approx -1{,}2816$ en \texttt{invNorm(0.8,0,1)} $\approx 0{,}8416$. Dus
    \[ 40 = \mu - 1{,}2816\,\sigma \quad\text{en}\quad 70 = \mu + 0{,}8416\,\sigma. \]
    Aftrekken: $30 = 2{,}1232\,\sigma$, dus $\sigma \approx 14{,}13$. Dan is $\mu = 40 + 1{,}2816 \cdot 14{,}13 \approx 58{,}1$. Controle: \texttt{normalcdf(-1E99,40,58.1,14.13)} $\approx 0{,}10$ en \texttt{normalcdf(70,1E99,58.1,14.13)} $\approx 0{,}20$.

- id: h2-o23
  soort: opdracht
  niveau: 3
  thema: |-
    twee groepen samen
  opgave: |-
    In een school zijn evenveel jongens als meisjes in het zesde jaar. De lengte van de jongens is $N(178, 7)$, die van de meisjes $N(166, 6)$, in cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de kans dat een willekeurige leerling van het zesde jaar langer is dan 180~cm?
      antwoord: |-
        $\approx 0{,}199$
      uitwerking: |-
        Splits volgens de groep (wet van de totale kans): $P(J) = P(M) = 0{,}5$.
        \[ P(X > 180) = 0{,}5 \cdot P(X_J > 180) + 0{,}5 \cdot P(X_M > 180) \approx 0{,}5 \cdot 0{,}3875 + 0{,}5 \cdot 0{,}0098 \approx 0{,}199 \]
        met \texttt{normalcdf(180,1E99,178,7)} en \texttt{normalcdf(180,1E99,166,6)}.
    - opgave: |-
        Alle lengtes samen hebben gemiddelde 172~cm en standaardafwijking 8,9~cm. Wat geeft het model $N(172;\, 8{,}9)$ voor $P(X > 180)$?
      antwoord: |-
        $\approx 0{,}184$
      uitwerking: |-
        \texttt{normalcdf(180,1E99,172,8.9)} $\approx 0{,}184$, iets minder dan de juiste $0{,}199$.
    - opgave: |-
        Elke groep is normaal verdeeld. Is de lengte van alle leerlingen samen ook normaal verdeeld? Verklaar met een schets.
      antwoord: |-
        nee
      uitwerking: |-
        Nee. De dichtheid van het geheel is de helft van de som van de twee Gausskrommen: een brede, afgeplatte bult (bij een groter verschil tussen de groepen zelfs met twee toppen). Het samengevoegde histogram is daardoor vlakker dan een Gausskromme met dezelfde $\mu$ en $\sigma$, en dat zie je in b: het model met één klok geeft een andere kans.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    hoeveel $\sigma$ voor 90 en 99~\%
  opgave: |-
    De vuistregels zeggen hoeveel er binnen 1, 2 of 3 standaardafwijkingen ligt. Hier keer je de vraag om.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $P(\mu - k\sigma < X < \mu + k\sigma) = P(-k < Z < k)$ voor $X \sim N(\mu, \sigma)$. Waarom hangt het antwoord dus niet af van $\mu$ en $\sigma$?
      antwoord: |-
        met $Z = \frac{X - \mu}{\sigma}$
      uitwerking: |-
        Trek $\mu$ af en deel door $\sigma > 0$ (de ongelijkheden blijven gelijk):
        \[ \mu - k\sigma < X < \mu + k\sigma \iff -k < \frac{X - \mu}{\sigma} < k \iff -k < Z < k. \]
        En $Z \sim N(0, 1)$, voor elke $\mu$ en $\sigma$. De kans hangt dus alleen van $k$ af.
    - opgave: |-
        Bepaal $k$ zodat 90~\% binnen $k$ standaardafwijkingen van $\mu$ ligt. Doe hetzelfde voor 99~\%.
      antwoord: |-
        $k \approx 1{,}645$; \ $k \approx 2{,}576$
      uitwerking: |-
        Bij 90~\% ligt 5~\% in elke staart, dus links van $k$ ligt 95~\%: \texttt{invNorm(0.95,0,1)} $\approx 1{,}645$. Bij 99~\%: \texttt{invNorm(0.995,0,1)} $\approx 2{,}576$.
    - opgave: |-
        Hoe nauwkeurig is de vuistregel van 95~\%? Bereken $P(-2 < Z < 2)$, en het juiste $k$ voor 95~\%.
      antwoord: |-
        $\approx 0{,}954$; \ $k \approx 1{,}96$
      uitwerking: |-
        \texttt{normalcdf(-2,2,0,1)} $\approx 0{,}954$, iets meer dan 95~\%. Precies 95~\% ligt binnen $k = {}$\texttt{invNorm(0.975,0,1)} $\approx 1{,}96$ standaardafwijkingen. De vuistregel rondt 1,96 af naar 2.

- id: h2-o10
  soort: opdracht
  niveau: 3
  thema: |-
    een som van normale variabelen
  opgave: |-
    Een lift mag 630~kg dragen. Volwassenen wegen (in dit model) $N(75, 12)$, onafhankelijk van elkaar. Voor de som van 8 personen geldt: gemiddelde $8 \cdot 75$ en standaardafwijking $12\sqrt8$, en ze is ook normaal verdeeld. Wat is de kans dat 8 willekeurige volwassenen samen te zwaar zijn?
  antwoord: |-
    $\approx 0{,}19$
  uitwerking: |-
    De som $S$ heeft gemiddelde $8 \cdot 75 = 600$~kg en standaardafwijking $12\sqrt8 \approx 33{,}9$~kg. Dan is $P(S > 630) = {}$\texttt{normalcdf(630,1E99,600,33.94)} $\approx 0{,}19$. Merk op: de standaardafwijking groeit met $\sqrt8$, niet met 8, omdat zware en lichte personen elkaar deels compenseren. Met $\sigma = 8 \cdot 12 = 96$ zou je $0{,}38$ vinden.

- id: h2-o24
  soort: opdracht
  niveau: 3
  thema: |-
    uitschieters bij normale data
  opgave: |-
    Bij een boxplot noem je een waarde een uitschieter als ze meer dan $1{,}5 \cdot \text{IKA}$ buiten de kwartielen ligt; IKA is de interkwartielafstand $Q_3 - Q_1$. Neem $Z \sim N(0, 1)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $Q_1$, $Q_3$ en de IKA van $Z$.
      antwoord: |-
        $Q_1 \approx -0{,}674$, $Q_3 \approx 0{,}674$, IKA $\approx 1{,}349$
      uitwerking: |-
        Links van $Q_3$ ligt 75~\%: \texttt{invNorm(0.75,0,1)} $\approx 0{,}674$. Door de symmetrie is $Q_1 \approx -0{,}674$, en IKA $\approx 1{,}349$.
    - opgave: |-
        Vanaf welke waarde is een waarde van $Z$ een uitschieter naar boven?
      antwoord: |-
        $\approx 2{,}698$
      uitwerking: |-
        $Q_3 + 1{,}5 \cdot \text{IKA} \approx 0{,}674 + 1{,}5 \cdot 1{,}349 \approx 2{,}698$: ongeveer 2,7 standaardafwijkingen.
    - opgave: |-
        Welk percentage van normaal verdeelde data is volgens deze regel een uitschieter? Hoeveel uitschieters verwacht je bij 1000 metingen? Geldt dat voor elke $\mu$ en $\sigma$?
      antwoord: |-
        $\approx 0{,}7$~\%; ongeveer 7; ja
      uitwerking: |-
        $2 \cdot {}$\texttt{normalcdf(2.698,1E99,0,1)} $\approx 2 \cdot 0{,}0035 = 0{,}007$: ongeveer 0,7~\%, dus ongeveer 7 bij 1000 metingen. Dat geldt voor elke normale verdeling: kwartielen en grenzen liggen altijd evenveel standaardafwijkingen van $\mu$. Een paar uitschieters in een grote dataset zijn dus geen reden om aan het model te twijfelen.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 3
  koppel:
    rubriek: analyse
    onderwerp: Afgeleiden
  thema: |-
    buigpunten van de Gausskromme
  opgave: |-
    Neem de standaardnormale dichtheid $f(x) = \frac{1}{\sqrt{2\pi}}\mathrm{e}^{-x^2/2}$. Bereken $f'(x)$ en $f''(x)$, en toon aan dat de top bij $x = 0$ ligt en de buigpunten bij $x = \pm 1$.
  antwoord: |-
    $f''(x) = \frac{1}{\sqrt{2\pi}}(x^2 - 1)\mathrm{e}^{-x^2/2}$
  uitwerking: |-
    $f'(x) = \frac{1}{\sqrt{2\pi}}(-x)\mathrm{e}^{-x^2/2}$: nul bij $x = 0$, positief links en negatief rechts: een maximum. $f''(x) = \frac{1}{\sqrt{2\pi}}(x^2 - 1)\mathrm{e}^{-x^2/2}$: nul bij $x = \pm 1$ met tekenwissel: buigpunten op afstand $\sigma = 1$ van de top.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: Kansrekenen
  thema: |-
    binomiaal en normaal
  opgave: |-
    Je gooit 100 keer met een eerlijke munt. Het aantal keer kop is $B(100;\, 0{,}5)$, met $\mu = 50$ en $\sigma = 5$. Vergelijk $P(45 \leqslant X \leqslant 55)$ binomiaal (met \texttt{binomcdf}) en met de normale verdeling tussen 44,5 en 55,5.
  antwoord: |-
    beide $\approx 0{,}729$
  uitwerking: |-
    Binomiaal: $P(X \leqslant 55) - P(X \leqslant 44) \approx 0{,}729$. Normaal: \texttt{normalcdf(44.5,55.5,50,5)} $\approx 0{,}729$. De normale verdeling benadert de binomiale goed; de grenzen 44,5 en 55,5 vangen de staven van 45 tot 55 helemaal.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    vuistregels
  opgave: |-
    $X \sim N(160, 6)$. Tussen welke waarden ligt het middelste 95~\%? Welk percentage ligt boven 166?
  antwoord: |-
    $[148, 172]$; \ 16~\%
  uitwerking: |-
    $160 \pm 12 = [148, 172]$. 166 is $\mu + \sigma$: $\frac{32}{2} = 16$~\%.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    kansen met het rekentoestel
  opgave: |-
    $X \sim N(160, 6)$. Bereken $P(150 < X < 170)$ en $P(X > 172)$.
  antwoord: |-
    $\approx 0{,}904$; \ $\approx 0{,}023$
  uitwerking: |-
    \texttt{normalcdf(150,170,160,6)} $\approx 0{,}904$ en \texttt{normalcdf(172,1E99,160,6)} $\approx 0{,}023$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    een grens zoeken
  opgave: |-
    $X \sim N(160, 6)$. Bepaal de waarde $a$ waarvoor $P(X > a) = 0{,}10$.
  antwoord: |-
    $\approx 167{,}7$
  uitwerking: |-
    Links van $a$ ligt 90~\%: \texttt{invNorm(0.9,160,6)} $\approx 167{,}7$.

- id: h2-t4
  soort: test
  niveau: 1
  thema: |-
    z-score
  opgave: |-
    Bereken de z-score van 175 als $X \sim N(160, 6)$. Is 175 uitzonderlijk?
  antwoord: |-
    $2{,}5$; ja
  uitwerking: |-
    $z = \frac{175 - 160}{6} = 2{,}5$: meer dan twee standaardafwijkingen boven het gemiddelde, dus uitzonderlijk.

- id: h2-t5
  soort: test
  niveau: 2
  thema: |-
    model beoordelen
  opgave: |-
    Van 400 metingen is $\xbar = 50$ en $s = 5$. Er liggen 340 metingen tussen 45 en 55. Past een normaal model? Verklaar.
  antwoord: |-
    niet goed: 85~\% in plaats van 68~\%
  uitwerking: |-
    $\frac{340}{400} = 85$~\%, terwijl een normaal model 68~\% voorspelt tussen $\mu - \sigma$ en $\mu + \sigma$. De data zijn sterker rond het gemiddelde geconcentreerd: het model past niet goed.

- id: h2-t6
  soort: test
  niveau: 2
  thema: |-
    dichtheid en kans als oppervlakte
  figuur:
    code: |-
      \begin{tikzpicture}[x=1cm,y=4cm,font=\scriptsize]
        \draw[black!15] (0,0) grid[xstep=1,ystep=.125] (4.5,.6);
        \fill[accent!25] (0,.5) -- (2,.25) -- (2,0) -- (0,0) -- cycle;
        \draw[->,grijs] (-.2,0) -- (4.7,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,-.03) -- (0,.62);
        \draw[accent,thick] (0,.5) -- (4,0);
        \foreach \t in {1,2,3,4}{\node[below] at (\t,0) {\t};}
        \foreach \t/\l in {.25/{0,25},.5/{0,5}}{\node[left] at (0,\t) {\l};}
      \end{tikzpicture}
  opgave: |-
    De dichtheidsfunctie van $X$ is 0 buiten $[0, 4]$, en op $[0, 4]$ de rechte uit de figuur.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de totale oppervlakte 1 is.
      antwoord: |-
        $\frac{4 \cdot 0{,}5}{2} = 1$
      uitwerking: |-
        Het gebied is een driehoek met basis 4 en hoogte 0,5: $\frac{4 \cdot 0{,}5}{2} = 1$.
    - opgave: |-
        Bereken $P(X < 2)$, het gekleurde gebied.
      antwoord: |-
        $0{,}75$
      uitwerking: |-
        Een trapezium met evenwijdige zijden 0,5 en 0,25 en breedte 2: $\frac{0{,}5 + 0{,}25}{2} \cdot 2 = 0{,}75$. (Of: 1 min de driehoek rechts, $1 - \frac{2 \cdot 0{,}25}{2} = 0{,}75$.)
    - opgave: |-
        Wat is $P(X = 1)$?
      antwoord: |-
        0
      uitwerking: |-
        0: bij een continue variabele is de oppervlakte boven één punt 0.

- id: h2-t7
  soort: test
  niveau: 1
  thema: |-
    een Gausskromme aflezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.12cm,y=50cm,font=\scriptsize]
        \draw[black!15] (36,0) grid[xstep=4,ystep=.01] (84,.055);
        \draw[->,grijs] (36,0) -- (86,0) node[right,text=black] {$x$};
        \foreach \t in {36,44,...,84}{\node[below] at (\t,0) {\t};}
        \draw[accent,thick] plot[domain=36:84,samples=100,smooth] (\x,{gauss(\x,60,8)});
        \fill[fel!80!black] (52,{gauss(52,60,8)}) circle (1.5pt) (68,{gauss(68,60,8)}) circle (1.5pt);
      \end{tikzpicture}
  opgave: |-
    De figuur toont de dichtheid van $X \sim N(\mu, \sigma)$, met de buigpunten als stip.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees $\mu$ en $\sigma$ af.
      antwoord: |-
        $\mu = 60$, $\sigma = 8$
      uitwerking: |-
        De top ligt bij 60. De buigpunten liggen bij 52 en 68, dus $\sigma = 8$.
    - opgave: |-
        Schat zonder rekentoestel $P(X > 76)$.
      antwoord: |-
        $\approx 0{,}025$
      uitwerking: |-
        $76 = \mu + 2\sigma$: rechts daarvan ligt de helft van 5~\%, dus ongeveer 0,025.

- id: h2-t8
  soort: test
  niveau: 2
  thema: |-
    het gemiddelde terugvinden
  opgave: |-
    De duur van een busrit is normaal verdeeld met $\sigma = 6$ minuten. 5~\% van de ritten duurt langer dan 50 minuten. Bereken $\mu$.
  antwoord: |-
    $\mu \approx 40{,}1$ minuten
  uitwerking: |-
    Voor $N(0, 1)$ ligt 5~\% rechts van \texttt{invNorm(0.95,0,1)} $\approx 1{,}645$. Dus ligt 50 op $1{,}645\,\sigma$ boven $\mu$: $\mu = 50 - 1{,}645 \cdot 6 \approx 40{,}1$ minuten.
