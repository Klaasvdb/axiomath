# Oefeningen van hoofdstuk 3. Zie oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken het gemiddelde van 2, 4, 4 en 6.
      antwoord: |-
        4
      uitwerking: |-
        $\frac{2 + 4 + 4 + 6}{4} = 4$.
    - opgave: |-
        Bereken de standaardafwijking van 2, 4, 4 en 6 (gedeeld door 4).
      antwoord: |-
        $\sqrt2$
      uitwerking: |-
        $\sqrt{\frac{4 + 0 + 0 + 4}{4}} = \sqrt2 \approx 1{,}41$.
    - opgave: |-
        In 40 gezinnen zijn er 5 zonder kinderen, 10 met één kind, 15 met twee en 10 met drie. Hoeveel kinderen hebben ze gemiddeld?
      antwoord: |-
        $1{,}75$
      uitwerking: |-
        $\frac{0 \cdot 5 + 1 \cdot 10 + 2 \cdot 15 + 3 \cdot 10}{40} = \frac{70}{40} = 1{,}75$.
    - opgave: |-
        Schrijf dat gemiddelde met relatieve frequenties: $0 \cdot \ldots + 1 \cdot \ldots + 2 \cdot \ldots + 3 \cdot \ldots$
      antwoord: |-
        $0 \cdot 0{,}125 + 1 \cdot 0{,}25 + 2 \cdot 0{,}375 + 3 \cdot 0{,}25$
      uitwerking: |-
        $0 \cdot \frac{5}{40} + 1 \cdot \frac{10}{40} + 2 \cdot \frac{15}{40} + 3 \cdot \frac{10}{40} = 1{,}75$.
    - opgave: |-
        Bereken $\sqrt{0{,}81}$.
      antwoord: |-
        $0{,}9$
      uitwerking: |-
        $0{,}9^2 = 0{,}81$.
    - opgave: |-
        Je gooit drie keer met een munt. Wat is de kans op precies één keer kop?
      antwoord: |-
        $\tfrac38$
      uitwerking: |-
        KMM, MKM, MMK: $\frac38$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Een spel kost 1 euro. Je gooit twee munten. Bij twee keer kop krijg je 3 euro, bij één keer kop 1 euro, bij geen kop niets.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de kans op 0, 1 en 2 keer kop?
      antwoord: |-
        $\tfrac14$, $\tfrac12$, $\tfrac14$
      uitwerking: |-
        MM: $\frac14$. KM of MK: $\frac12$. KK: $\frac14$.
    - opgave: |-
        Hoeveel win je in elk geval, als je de inzet aftrekt?
      antwoord: |-
        $-1$, $0$, $2$ euro
      uitwerking: |-
        Geen kop: $0 - 1 = -1$. Eén kop: $1 - 1 = 0$. Twee keer kop: $3 - 1 = 2$.
    - opgave: |-
        Je speelt 400 keer. Hoe vaak verwacht je elk geval? Hoeveel win je dan gemiddeld per spel?
      antwoord: |-
        100, 200, 100 keer; $0{,}25$ euro
      uitwerking: |-
        Ongeveer 100 keer geen kop, 200 keer één kop en 100 keer twee keer kop. Totale winst: $100 \cdot (-1) + 200 \cdot 0 + 100 \cdot 2 = 100$ euro, gemiddeld $\frac{100}{400} = 0{,}25$ euro per spel. Dat is $(-1) \cdot \frac14 + 0 \cdot \frac12 + 2 \cdot \frac14$.
    - opgave: |-
        Welke inzet maakt het spel eerlijk, zodat je op lange termijn niets wint of verliest?
      antwoord: |-
        $1{,}25$ euro
      uitwerking: |-
        De gemiddelde uitbetaling is $3 \cdot \frac14 + 1 \cdot \frac12 + 0 = 1{,}25$ euro. Met die inzet win je gemiddeld niets.

- id: h3-verdeling
  soort: kort
  opgave: |-
    Een gezin heeft drie kinderen. Neem aan dat elk kind met kans $\frac12$ een meisje is, onafhankelijk van de andere. $X$ is het aantal meisjes. Geef de kansverdeling van $X$ en teken een staafdiagram.
  antwoord: |-
    $\tfrac18$, $\tfrac38$, $\tfrac38$, $\tfrac18$ voor $x = 0, 1, 2, 3$
  uitwerking: |-
    Er zijn 8 even waarschijnlijke rijtjes. Geen meisje: 1. Eén meisje: 3 (op welke plaats). Twee: 3. Drie: 1. Dus $P(X = 0) = \frac18$, $P(X = 1) = \frac38$, $P(X = 2) = \frac38$, $P(X = 3) = \frac18$.\par
    \begin{tikzpicture}[x=.9cm,y=3.2cm,font=\scriptsize]
      \foreach \x/\h in {0/.125,1/.375,2/.375,3/.125}{\staaf{\x}{\h}{.5}}
      \draw[->,grijs] (-.5,0) -- (3.6,0) node[right,text=black] {$x$};
      \draw[->,grijs] (-.5,0) -- (-.5,.47);
      \foreach \x in {0,1,2,3}{\node[below] at (\x,0) {\x};}
      \foreach \t/\l in {.125/{\frac18},.375/{\frac38}}{\node[left] at (-.5,\t) {$\l$};}
    \end{tikzpicture}

- id: h3-verwachting
  soort: kort
  opgave: |-
    Een jeugdclub verkoopt 1000 loten aan 2 euro. Er is één prijs van 500 euro, tien prijzen van 20 euro en honderd prijzen van 2 euro. Wat is de verwachte winst voor iemand die één lot koopt? Wat verdient de club?
  antwoord: |-
    $-1{,}10$ euro; 1100 euro
  uitwerking: |-
    De verwachte uitbetaling per lot is $\frac{500 + 10 \cdot 20 + 100 \cdot 2}{1000} = \frac{900}{1000} = 0{,}90$ euro. De verwachte winst is $0{,}90 - 2 = -1{,}10$ euro. De club ontvangt 2000 euro en keert 900 euro uit: 1100 euro.

- id: h3-sigma
  soort: kort
  opgave: |-
    Bereken de verwachtingswaarde en de standaardafwijking van het aantal meisjes $X$ in een gezin met drie kinderen (oefening \ref{oef:h3-verdeling}).
  antwoord: |-
    $\mu = 1{,}5$; \ $\sigma = \sqrt{0{,}75} \approx 0{,}87$
  uitwerking: |-
    $\mu = \frac{0 + 3 + 6 + 3}{8} = 1{,}5$. $\E(X^2) = \frac{0 + 3 + 12 + 9}{8} = 3$. $\Var(X) = 3 - 2{,}25 = 0{,}75$ en $\sigma = \sqrt{0{,}75} \approx 0{,}87$.

- id: h3-cumulatief
  soort: kort
  opgave: |-
    Gebruik de kansverdeling van het aantal meisjes $X$ in een gezin met drie kinderen. Bereken $F(1)$, $P(X \geqslant 2)$ en $P(X \leqslant 2)$, en teken de grafiek van $F$.
  antwoord: |-
    $\tfrac12$; \ $\tfrac12$; \ $\tfrac78$
  uitwerking: |-
    $F(1) = \frac18 + \frac38 = \frac12$. $P(X \geqslant 2) = 1 - F(1) = \frac12$. $P(X \leqslant 2) = 1 - \frac18 = \frac78$. De grafiek is een trap met sprongen van $\frac18$, $\frac38$, $\frac38$ en $\frac18$ bij $x = 0, 1, 2, 3$.

- id: h3-verdeling-2
  soort: kort
  opgave: |-
    Je gooit met twee dobbelstenen. $X$ is het verschil tussen het grootste en het kleinste getal (0 bij een dubbel).
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de kansverdeling van $X$. Gebruik een rooster.
      antwoord: |-
        $\tfrac{6}{36}$, $\tfrac{10}{36}$, $\tfrac{8}{36}$, $\tfrac{6}{36}$, $\tfrac{4}{36}$, $\tfrac{2}{36}$ voor $x = 0, \ldots, 5$
      uitwerking: |-
        Schrijf in elk vakje van het rooster het verschil en tel. Verschil 0: de 6 dubbels. Verschil 1: $(1, 2), \ldots, (5, 6)$ en omgekeerd, 10 koppels. Verschil 2: 8, verschil 3: 6, verschil 4: 4, verschil 5: $(1, 6)$ en $(6, 1)$, 2 koppels.\par
        $P(X = 0) = \frac{6}{36}$, $P(X = 1) = \frac{10}{36}$, $P(X = 2) = \frac{8}{36}$, $P(X = 3) = \frac{6}{36}$, $P(X = 4) = \frac{4}{36}$, $P(X = 5) = \frac{2}{36}$. Controle: $6 + 10 + 8 + 6 + 4 + 2 = 36$.
    - opgave: |-
        Teken het staafdiagram. Welke waarde is het meest waarschijnlijk?
      antwoord: |-
        1
      uitwerking: |-
        \begin{tikzpicture}[x=.75cm,y=9cm,font=\scriptsize]
          \foreach \x/\h in {0/6,1/10,2/8,3/6,4/4,5/2}{\staaf{\x}{\h/36}{.5}}
          \draw[->,grijs] (-.5,0) -- (5.6,0) node[right,text=black] {$x$};
          \draw[->,grijs] (-.5,0) -- (-.5,.32);
          \foreach \x in {0,...,5}{\node[below] at (\x,0) {\x};}
          \foreach \t/\l in {.1667/{\frac{6}{36}},.2778/{\frac{10}{36}}}{\node[left] at (-.5,\t) {$\l$};}
        \end{tikzpicture}\par
        Het verschil 1 heeft de hoogste staaf: $\frac{10}{36}$.

- id: h3-verwachting-2
  soort: kort
  opgave: |-
    Bereken de verwachtingswaarde.
  lijst: enumerate
  delen:
    - opgave: |-
        $X$ neemt de waarden 1, 2 en 4 aan met kansen $0{,}5$; $0{,}3$ en $0{,}2$.
      antwoord: |-
        $1{,}9$
      uitwerking: |-
        $\E(X) = 1 \cdot 0{,}5 + 2 \cdot 0{,}3 + 4 \cdot 0{,}2 = 0{,}5 + 0{,}6 + 0{,}8 = 1{,}9$.
    - opgave: |-
        $X$ is het aantal ogen van een dobbelsteen met de getallen 1, 1, 1, 2, 2 en 6.
      antwoord: |-
        $\tfrac{13}{6} \approx 2{,}17$
      uitwerking: |-
        $P(X = 1) = \frac36$, $P(X = 2) = \frac26$, $P(X = 6) = \frac16$. $\E(X) = \frac{3 + 4 + 6}{6} = \frac{13}{6} \approx 2{,}17$.
    - opgave: |-
        Bij een kraam gooi je een dobbelsteen. Bij een zes krijg je 5 euro, bij een vijf 2 euro, anders niets. Welke inzet maakt het spel eerlijk?
      antwoord: |-
        $\tfrac76 \approx 1{,}17$ euro
      uitwerking: |-
        De verwachte uitbetaling is $5 \cdot \frac16 + 2 \cdot \frac16 = \frac76$ euro. Met een inzet van $\frac76 \approx 1{,}17$ euro is de verwachte winst 0.

- id: h3-sigma-2
  soort: kort
  opgave: |-
    Bereken $\mu$ en $\sigma$.
  lijst: enumerate
  delen:
    - opgave: |-
        $X$ neemt de waarden 1, 2 en 5 aan met kansen $0{,}5$; $0{,}3$ en $0{,}2$. Gebruik de rekenformule.
      antwoord: |-
        $\mu = 2{,}1$; \ $\sigma \approx 1{,}51$
      uitwerking: |-
        $\mu = 0{,}5 + 0{,}6 + 1 = 2{,}1$. $\E(X^2) = 1 \cdot 0{,}5 + 4 \cdot 0{,}3 + 25 \cdot 0{,}2 = 6{,}7$. $\Var(X) = 6{,}7 - 2{,}1^2 = 2{,}29$, dus $\sigma = \sqrt{2{,}29} \approx 1{,}51$.
    - opgave: |-
        $X$ neemt de waarden 0, 2 en 4 aan met kansen $\frac14$, $\frac12$ en $\frac14$. Gebruik de definitie van de variantie.
      antwoord: |-
        $\mu = 2$; \ $\sigma = \sqrt2 \approx 1{,}41$
      uitwerking: |-
        Het staafdiagram is symmetrisch rond 2, dus $\mu = 2$. De afwijkingen zijn $-2$, 0 en 2: $\Var(X) = 4 \cdot \frac14 + 0 \cdot \frac12 + 4 \cdot \frac14 = 2$, dus $\sigma = \sqrt2 \approx 1{,}41$.

- id: h3-cumulatief-2
  soort: kort
  figuur:
    code: |-
      \begin{tikzpicture}[x=.7cm,y=3cm,font=\scriptsize]
        \draw[black!14,very thin] (0,0) grid[xstep=1,ystep=.1] (6,1);
        \draw[->,grijs] (0,0) -- (6.3,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,0) -- (0,1.12) node[above,text=black] {$F(x)$};
        \foreach \x in {1,...,5}{\node[below] at (\x,0) {\x};}
        \foreach \t/\l in {.2/{0,2},.5/{0,5},.9/{0,9},1/1}{\node[left] at (0,\t) {\l};}
        \draw[accent,very thick] (0,0) -- (1,0) (1,.2) -- (2,.2) (2,.5) -- (4,.5) (4,.9) -- (5,.9) (5,1) -- (6,1);
        \foreach \x/\y in {1/.2,2/.5,4/.9,5/1}{\fill[accent] (\x,\y) circle (1.6pt);}
        \foreach \x/\y in {1/0,2/.2,4/.5,5/.9}{\draw[accent,fill=white] (\x,\y) circle (1.6pt);}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de cumulatieve verdelingsfunctie $F$ van een toevalsvariabele $X$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke waarden neemt $X$ aan? Geef de kansverdeling.
      antwoord: |-
        1, 2, 4, 5 met kansen $0{,}2$; $0{,}3$; $0{,}4$; $0{,}1$
      uitwerking: |-
        $F$ springt alleen bij 1, 2, 4 en 5: dat zijn de waarden. De sprong is de kans: $P(X = 1) = 0{,}2$, $P(X = 2) = 0{,}5 - 0{,}2 = 0{,}3$, $P(X = 4) = 0{,}9 - 0{,}5 = 0{,}4$, $P(X = 5) = 1 - 0{,}9 = 0{,}1$.
    - opgave: |-
        Bereken $P(X \leqslant 3)$ en $P(X > 2)$.
      antwoord: |-
        $0{,}5$; \ $0{,}5$
      uitwerking: |-
        $P(X \leqslant 3) = F(3) = 0{,}5$: tussen 2 en 4 blijft de grafiek vlak. $P(X > 2) = 1 - F(2) = 1 - 0{,}5 = 0{,}5$.
    - opgave: |-
        Bereken $P(2 \leqslant X \leqslant 4)$.
      antwoord: |-
        $0{,}7$
      uitwerking: |-
        $P(X \leqslant 4) - P(X \leqslant 1) = F(4) - F(1) = 0{,}9 - 0{,}2 = 0{,}7$. Let op: je trekt $F(1)$ af en niet $F(2)$, want 2 hoort erbij.

- id: h3-spreiding
  soort: kort
  opgave: |-
    Twee toevalsvariabelen hebben deze kansverdelingen.
    \figuren{\small\renewcommand{\arraystretch}{1.2}\begin{tabular}{c|ccc} $x$ & ${-2}$ & $0$ & $2$ \\ \hline $P(X = x)$ & $0{,}3$ & $0{,}4$ & $0{,}3$ \end{tabular}\qquad\qquad\begin{tabular}{c|ccc} $y$ & ${-4}$ & $0$ & $4$ \\ \hline $P(Y = y)$ & $0{,}1$ & $0{,}8$ & $0{,}1$ \end{tabular}}
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $X$ en $Y$ dezelfde verwachtingswaarde hebben.
      antwoord: |-
        beide 0
      uitwerking: |-
        $\E(X) = -2 \cdot 0{,}3 + 0 + 2 \cdot 0{,}3 = 0$ en $\E(Y) = -4 \cdot 0{,}1 + 0 + 4 \cdot 0{,}1 = 0$. Beide staafdiagrammen zijn symmetrisch rond 0.
    - opgave: |-
        Bereken de standaardafwijking van $X$ en van $Y$ met de definitie. Welke spreidt het meest?
      antwoord: |-
        $\sigma_X \approx 1{,}55$; \ $\sigma_Y \approx 1{,}79$; $Y$
      uitwerking: |-
        $\Var(X) = 4 \cdot 0{,}3 + 0 \cdot 0{,}4 + 4 \cdot 0{,}3 = 2{,}4$, dus $\sigma_X = \sqrt{2{,}4} \approx 1{,}55$.\par
        $\Var(Y) = 16 \cdot 0{,}1 + 0 \cdot 0{,}8 + 16 \cdot 0{,}1 = 3{,}2$, dus $\sigma_Y = \sqrt{3{,}2} \approx 1{,}79$.\par
        $Y$ spreidt het meest: ze is meestal 0, maar als ze afwijkt, dan ver.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    kansverdeling herkennen
  opgave: |-
    Is de tabel een kansverdeling? Bepaal in c het getal $a$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $0{,}2 \quad 0{,}5 \quad 0{,}4$
      antwoord: |-
        nee
      uitwerking: |-
        De som is $1{,}1 \neq 1$.
    - opgave: |-
        $0{,}1 \quad 0{,}6 \quad 0{,}3$
      antwoord: |-
        ja
      uitwerking: |-
        Alle kansen liggen tussen 0 en 1, en de som is 1.
    - opgave: |-
        $a \quad 2a \quad 0{,}4$
      antwoord: |-
        $a = 0{,}2$
      uitwerking: |-
        $3a + 0{,}4 = 1$, dus $a = 0{,}2$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    een dobbelsteen
  opgave: |-
    $X$ is het aantal ogen bij een worp met een eerlijke dobbelsteen. Bereken $\E(X)$ en $\sigma$.
  antwoord: |-
    $3{,}5$; \ $\approx 1{,}71$
  uitwerking: |-
    $\E(X) = \frac{1 + 2 + \cdots + 6}{6} = 3{,}5$. $\E(X^2) = \frac{1 + 4 + 9 + 16 + 25 + 36}{6} = \frac{91}{6}$, dus $\Var(X) = \frac{91}{6} - 12{,}25 = \frac{35}{12}$ en $\sigma \approx 1{,}71$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    som van twee dobbelstenen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.42cm,y=16cm,font=\scriptsize]
        \foreach \s/\n in {2/1,3/2,4/3,5/4,6/5,7/6,8/5,9/4,10/3,11/2,12/1}{\staaf{\s}{\n/36}{.7}}
        \draw[->,grijs] (1,0) -- (13,0);
        \foreach \s in {2,4,...,12}{\node[below] at (\s,0) {\s};}
      \end{tikzpicture}
  opgave: |-
    $X$ is de som van de ogen van twee dobbelstenen. Geef de kansverdeling, en bereken $\E(X)$ en $\sigma$ met je rekentoestel. Waarom kon je $\E(X)$ ook zonder rekenen voorspellen?
  antwoord: |-
    $\E(X) = 7$; \ $\sigma \approx 2{,}42$
  uitwerking: |-
    $P(X = s) = \frac{6 - |s - 7|}{36}$ voor $s = 2, \ldots, 12$. $\E(X) = 7$ en $\sigma = \sqrt{\frac{35}{6}} \approx 2{,}42$. Het staafdiagram is symmetrisch rond 7, dus het evenwichtspunt ligt in 7.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    context: verzekering
  opgave: |-
    Een verzekeraar schat dat een klant per jaar met kans 0,01 een schade van 15\,000 euro heeft, met kans 0,05 een schade van 1000 euro, en anders geen schade. Hoeveel moet de jaarpremie minstens zijn opdat de verzekeraar op lange termijn geen verlies maakt?
  antwoord: |-
    200 euro
  uitwerking: |-
    De verwachte uitbetaling is $0{,}01 \cdot 15\,000 + 0{,}05 \cdot 1000 = 150 + 50 = 200$ euro per klant. De premie moet minstens 200 euro zijn; in werkelijkheid ligt ze hoger, voor de kosten en de winst.

- id: h3-o5
  soort: opdracht
  niveau: 2
  thema: |-
    het maximum van twee dobbelstenen
  opgave: |-
    Je gooit met twee dobbelstenen. $X$ is het grootste van de twee getallen. Toon aan dat $P(X = k) = \frac{2k - 1}{36}$, en bereken $\E(X)$.
  antwoord: |-
    $\E(X) = \tfrac{161}{36} \approx 4{,}47$
  uitwerking: |-
    $X = k$ als beide getallen hoogstens $k$ zijn, maar niet beide hoogstens $k - 1$: $\frac{k^2 - (k - 1)^2}{36} = \frac{2k - 1}{36}$.\par
    $\E(X) = \frac{1 \cdot 1 + 2 \cdot 3 + 3 \cdot 5 + 4 \cdot 7 + 5 \cdot 9 + 6 \cdot 11}{36} = \frac{161}{36} \approx 4{,}47$.

- id: h3-o6
  soort: opdracht
  niveau: 2
  thema: |-
    gokken op een meerkeuzetoets
  opgave: |-
    Bij een meerkeuzevraag met 4 antwoorden krijg je 1 punt voor het juiste antwoord. Voor een fout antwoord wordt $\frac13$ punt afgetrokken. Een leerling gokt. Wat is zijn verwachte score per vraag? Waarom gebruiken sommige examens zo'n aftrek?
  antwoord: |-
    0
  uitwerking: |-
    $1 \cdot \frac14 + \bigl(-\frac13\bigr) \cdot \frac34 = \frac14 - \frac14 = 0$. Met die aftrek levert gokken gemiddeld niets op, zodat een score toont wat de leerling echt weet.

- id: h3-o7
  soort: opdracht
  niveau: 2
  thema: |-
    lineaire transformatie
  opgave: |-
    Neem een discrete toevalsvariabele $X$ en getallen $a$ en $b$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\E(aX + b) = a\E(X) + b$ en dat $\sigma(aX + b) = |a|\,\sigma(X)$.
      antwoord: |-
        bewijs
      uitwerking: |-
        $\E(aX + b) = \sum (ax_i + b)p_i = a\sum x_i p_i + b\sum p_i = a\mu + b$. De afwijkingen van het nieuwe gemiddelde zijn $(ax_i + b) - (a\mu + b) = a(x_i - \mu)$, dus $\Var(aX + b) = \sum a^2(x_i - \mu)^2 p_i = a^2\Var(X)$ en $\sigma(aX + b) = |a|\sigma(X)$.
    - opgave: |-
        Bij een spel krijg je 5 euro per meisje uit oefening \ref{oef:h3-verdeling}, en je betaalt 8 euro inzet. Bereken de verwachtingswaarde en de standaardafwijking van je winst.
      antwoord: |-
        $-0{,}50$ euro; \ $\approx 4{,}33$ euro
      uitwerking: |-
        De winst is $5X - 8$: $\E = 5 \cdot 1{,}5 - 8 = -0{,}5$ euro en $\sigma = 5 \cdot 0{,}866 \approx 4{,}33$ euro.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    misvattingen
  opgave: |-
    Waar of vals? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        De verwachtingswaarde is altijd een van de mogelijke waarden.
      antwoord: |-
        vals
      uitwerking: |-
        Vals: bij een dobbelsteen is $\E(X) = 3{,}5$.
    - opgave: |-
        Heeft $X$ maar één mogelijke waarde, dan is $\sigma = 0$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: dan is elke afwijking van $\mu$ gelijk aan 0.
    - opgave: |-
        $\Var(2X) = 2\Var(X)$
      antwoord: |-
        vals
      uitwerking: |-
        Vals: $\Var(2X) = 4\Var(X)$, want de afwijkingen worden verdubbeld en dan gekwadrateerd.
    - opgave: |-
        Bij een eerlijk spel win je nooit en verlies je nooit.
      antwoord: |-
        vals
      uitwerking: |-
        Vals: je wint en verliest wel, maar op lange termijn is je gemiddelde winst 0.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    een eerlijk spel ontwerpen
  opgave: |-
    Je betaalt 1 euro en gooit met een dobbelsteen. Bij een zes krijg je $a$ euro, anders niets. Voor welke $a$ is het spel eerlijk? Bereken dan de standaardafwijking van de winst.
  antwoord: |-
    $a = 6$; \ $\sigma = \sqrt5 \approx 2{,}24$
  uitwerking: |-
    $\E(\text{winst}) = \frac{a}{6} - 1 = 0$ als $a = 6$. Dan is de winst 5 met kans $\frac16$ en $-1$ met kans $\frac56$: $\E(X^2) = \frac{25}{6} + \frac56 = 5$, dus $\sigma = \sqrt5 \approx 2{,}24$ euro.

- id: h3-o10
  soort: opdracht
  niveau: 3
  thema: |-
    kansverdeling met een parameter
  opgave: |-
    Een toevalsvariabele $X$ heeft de waarden 0, 1 en 2 met kansen $p$, $2p$ en $1 - 3p$. Bepaal $p$ zodat $\E(X) = 1$, en bereken dan $\sigma$.
  antwoord: |-
    $p = \tfrac14$; \ $\sigma = \sqrt{0{,}5}$
  uitwerking: |-
    $\E(X) = 2p + 2(1 - 3p) = 2 - 4p = 1$, dus $p = \frac14$, met kansen $\frac14$, $\frac12$, $\frac14$. $\E(X^2) = \frac12 + 4 \cdot \frac14 = 1{,}5$, dus $\Var(X) = 0{,}5$ en $\sigma = \sqrt{0{,}5} \approx 0{,}71$.

- id: h3-o11
  soort: opdracht
  niveau: 3
  thema: |-
    stoppen na kop
  opgave: |-
    Je gooit met een munt tot je kop hebt, maar hoogstens drie keer. $X$ is het aantal worpen. Geef de kansverdeling en $\E(X)$.
  antwoord: |-
    $\tfrac12$, $\tfrac14$, $\tfrac14$; \ $\E(X) = 1{,}75$
  uitwerking: |-
    $X = 1$ bij meteen kop: $\frac12$. $X = 2$ bij munt-kop: $\frac14$. $X = 3$ bij munt-munt (dan stop je, wat de derde worp ook is): $\frac14$. $\E(X) = \frac12 + \frac24 + \frac34 = 1{,}75$.

- id: h3-o12
  soort: opdracht
  niveau: 1
  thema: |-
    drill: verwachtingswaarde en standaardafwijking
  opgave: |-
    Bereken $\E(X)$ en $\sigma$. Rond $\sigma$ af op twee decimalen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\begin{array}{c|ccc} x_i & 0 & 1 & 2 \\ \hline p_i & 0{,}3 & 0{,}4 & 0{,}3 \end{array}$
      antwoord: |-
        $1$; \ $0{,}77$
      uitwerking: |-
        $\mu = 0{,}4 + 0{,}6 = 1$. $\E(X^2) = 0{,}4 + 4 \cdot 0{,}3 = 1{,}6$. $\Var(X) = 1{,}6 - 1 = 0{,}6$, $\sigma = \sqrt{0{,}6} \approx 0{,}77$.
    - opgave: |-
        $\begin{array}{c|ccc} x_i & 1 & 3 & 5 \\ \hline p_i & 0{,}5 & 0{,}25 & 0{,}25 \end{array}$
      antwoord: |-
        $2{,}5$; \ $1{,}66$
      uitwerking: |-
        $\mu = 0{,}5 + 0{,}75 + 1{,}25 = 2{,}5$. $\E(X^2) = 0{,}5 + 9 \cdot 0{,}25 + 25 \cdot 0{,}25 = 9$. $\Var(X) = 9 - 6{,}25 = 2{,}75$, $\sigma \approx 1{,}66$.
    - opgave: |-
        $\begin{array}{c|ccc} x_i & -2 & 0 & 4 \\ \hline p_i & 0{,}25 & 0{,}5 & 0{,}25 \end{array}$
      antwoord: |-
        $0{,}5$; \ $2{,}18$
      uitwerking: |-
        $\mu = -0{,}5 + 0 + 1 = 0{,}5$. $\E(X^2) = 4 \cdot 0{,}25 + 16 \cdot 0{,}25 = 5$. $\Var(X) = 5 - 0{,}25 = 4{,}75$, $\sigma \approx 2{,}18$.
    - opgave: |-
        $\begin{array}{c|cc} x_i & 10 & 20 \\ \hline p_i & 0{,}9 & 0{,}1 \end{array}$
      antwoord: |-
        $11$; \ $3$
      uitwerking: |-
        $\mu = 9 + 2 = 11$. $\E(X^2) = 100 \cdot 0{,}9 + 400 \cdot 0{,}1 = 130$. $\Var(X) = 130 - 121 = 9$, $\sigma = 3$.
    - opgave: |-
        $\begin{array}{c|cccc} x_i & 1 & 2 & 3 & 4 \\ \hline p_i & 0{,}1 & 0{,}2 & 0{,}3 & 0{,}4 \end{array}$
      antwoord: |-
        $3$; \ $1$
      uitwerking: |-
        $\mu = 0{,}1 + 0{,}4 + 0{,}9 + 1{,}6 = 3$. $\E(X^2) = 0{,}1 + 0{,}8 + 2{,}7 + 6{,}4 = 10$. $\Var(X) = 10 - 9 = 1$, $\sigma = 1$.
    - opgave: |-
        $\begin{array}{c|ccc} x_i & -1 & 1 & 3 \\ \hline p_i & \frac13 & \frac13 & \frac13 \end{array}$
      antwoord: |-
        $1$; \ $1{,}63$
      uitwerking: |-
        $\mu = \frac{-1 + 1 + 3}{3} = 1$. $\E(X^2) = \frac{1 + 1 + 9}{3} = \frac{11}{3}$. $\Var(X) = \frac{11}{3} - 1 = \frac83$, $\sigma = \sqrt{\tfrac83} \approx 1{,}63$.
    - opgave: |-
        $\begin{array}{c|ccc} x_i & 0 & 5 & 10 \\ \hline p_i & 0{,}6 & 0{,}3 & 0{,}1 \end{array}$
      antwoord: |-
        $2{,}5$; \ $3{,}35$
      uitwerking: |-
        $\mu = 1{,}5 + 1 = 2{,}5$. $\E(X^2) = 25 \cdot 0{,}3 + 100 \cdot 0{,}1 = 17{,}5$. $\Var(X) = 17{,}5 - 6{,}25 = 11{,}25$, $\sigma \approx 3{,}35$.
    - opgave: |-
        $\begin{array}{c|cccc} x_i & 2 & 4 & 6 & 8 \\ \hline p_i & 0{,}25 & 0{,}25 & 0{,}25 & 0{,}25 \end{array}$
      antwoord: |-
        $5$; \ $2{,}24$
      uitwerking: |-
        $\mu = \frac{2 + 4 + 6 + 8}{4} = 5$. $\E(X^2) = \frac{4 + 16 + 36 + 64}{4} = 30$. $\Var(X) = 30 - 25 = 5$, $\sigma = \sqrt5 \approx 2{,}24$.

- id: h3-o13
  soort: opdracht
  niveau: 1
  thema: |-
    drill: een kansverdeling opstellen
  opgave: |-
    Geef de kansverdeling van $X$, en controleer dat de kansen samen 1 zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        Je gooit met twee dobbelstenen. $X$ is het kleinste van de twee getallen.
      antwoord: |-
        $\tfrac{11}{36}$, $\tfrac{9}{36}$, $\tfrac{7}{36}$, $\tfrac{5}{36}$, $\tfrac{3}{36}$, $\tfrac{1}{36}$ voor $x = 1, \ldots, 6$
      uitwerking: |-
        Tel in het rooster. $X = 6$ alleen bij $(6, 6)$. $X = 5$ bij $(5, 5), (5, 6), (6, 5)$: 3 koppels. Telkens komen er twee bij: $X = 4$: 5, $X = 3$: 7, $X = 2$: 9, $X = 1$: 11 koppels. Controle: $11 + 9 + 7 + 5 + 3 + 1 = 36$.
    - opgave: |-
        Je gooit met twee dobbelstenen. $X$ is het aantal even getallen.
      antwoord: |-
        $\tfrac14$, $\tfrac12$, $\tfrac14$ voor $x = 0, 1, 2$
      uitwerking: |-
        Elk getal is even met kans $\frac12$, onafhankelijk van het andere. $P(X = 0) = \frac12 \cdot \frac12 = \frac14$, $P(X = 2) = \frac14$ en $P(X = 1) = 2 \cdot \frac12 \cdot \frac12 = \frac12$.
    - opgave: |-
        Je draait twee keer aan een rad met drie gelijke vakken 1, 2 en 3. $X$ is de som.
      antwoord: |-
        $\tfrac19$, $\tfrac29$, $\tfrac39$, $\tfrac29$, $\tfrac19$ voor $x = 2, \ldots, 6$
      uitwerking: |-
        Het rooster heeft 9 even waarschijnlijke koppels. Som 2: 1 koppel, 3: 2, 4: 3, 5: 2, 6: 1. Dus $\frac19$, $\frac29$, $\frac39$, $\frac29$, $\frac19$.
    - opgave: |-
        In een vaas zitten 3 rode en 2 witte knikkers. Je trekt er twee zonder teruglegging. $X$ is het aantal rode.
      antwoord: |-
        $\tfrac{1}{10}$, $\tfrac{6}{10}$, $\tfrac{3}{10}$ voor $x = 0, 1, 2$
      uitwerking: |-
        Met een boomdiagram: $P(X = 0) = \frac25 \cdot \frac14 = \frac{1}{10}$, $P(X = 2) = \frac35 \cdot \frac24 = \frac{3}{10}$ en $P(X = 1) = \frac35 \cdot \frac24 + \frac25 \cdot \frac34 = \frac{6}{10}$.

- id: h3-o14
  soort: opdracht
  niveau: 1
  thema: |-
    een staafdiagram aflezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.75cm,y=6cm,font=\scriptsize]
        \draw[black!14,very thin] (-.5,0) grid[xstep=5,ystep=.1] (4.5,.4);
        \foreach \x/\h in {0/.1,1/.2,2/.4,3/.2,4/.1}{\staaf{\x}{\h}{.5}}
        \draw[->,grijs] (-.5,0) -- (4.8,0) node[right,text=black] {$x$};
        \draw[->,grijs] (-.5,0) -- (-.5,.47) node[above,text=black] {$P(X = x)$};
        \foreach \x in {0,...,4}{\node[below] at (\x,0) {\x};}
        \foreach \t/\l in {.1/{0,1},.2/{0,2},.3/{0,3},.4/{0,4}}{\node[left] at (-.5,\t) {\l};}
      \end{tikzpicture}
  opgave: |-
    Het staafdiagram toont de kansverdeling van een toevalsvariabele $X$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $P(X = 3)$ en $P(X \geqslant 2)$.
      antwoord: |-
        $0{,}2$; \ $0{,}7$
      uitwerking: |-
        Lees de hoogtes af: $0{,}1$; $0{,}2$; $0{,}4$; $0{,}2$; $0{,}1$. $P(X = 3) = 0{,}2$ en $P(X \geqslant 2) = 0{,}4 + 0{,}2 + 0{,}1 = 0{,}7$.
    - opgave: |-
        Bereken $F(1)$.
      antwoord: |-
        $0{,}3$
      uitwerking: |-
        $F(1) = P(X \leqslant 1) = 0{,}1 + 0{,}2 = 0{,}3$.
    - opgave: |-
        Bepaal $\E(X)$ zonder te rekenen. Leg uit.
      antwoord: |-
        2
      uitwerking: |-
        Het staafdiagram is symmetrisch rond 2, en de verwachtingswaarde is het evenwichtspunt: $\E(X) = 2$.
    - opgave: |-
        Bereken $\sigma$ met de definitie.
      antwoord: |-
        $\sqrt{1{,}2} \approx 1{,}10$
      uitwerking: |-
        De afwijkingen van $\mu = 2$ zijn $-2, -1, 0, 1, 2$. $\Var(X) = 4 \cdot 0{,}1 + 1 \cdot 0{,}2 + 0 + 1 \cdot 0{,}2 + 4 \cdot 0{,}1 = 1{,}2$, dus $\sigma = \sqrt{1{,}2} \approx 1{,}10$.

- id: h3-o15
  soort: opdracht
  niveau: 1
  thema: |-
    context: een kansverdeling uit frequenties
  opgave: |-
    Een bakker noteerde 200 dagen hoeveel bestelde taarten er werden afgehaald: 0 taarten op 10 dagen, 1 op 30 dagen, 2 op 70 dagen, 3 op 60 dagen en 4 op 30 dagen. $X$ is het aantal taarten op een willekeurige dag.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel met de relatieve frequenties een kansverdeling voor $X$ op.
      antwoord: |-
        $0{,}05$; $0{,}15$; $0{,}35$; $0{,}30$; $0{,}15$
      uitwerking: |-
        Deel door 200: $P(X = 0) = 0{,}05$, $P(X = 1) = 0{,}15$, $P(X = 2) = 0{,}35$, $P(X = 3) = 0{,}30$, $P(X = 4) = 0{,}15$.
    - opgave: |-
        Bereken $\E(X)$.
      antwoord: |-
        $2{,}35$
      uitwerking: |-
        $\E(X) = 0 + 0{,}15 + 0{,}70 + 0{,}90 + 0{,}60 = 2{,}35$ taarten per dag.
    - opgave: |-
        Wat is de kans dat er op een dag minstens 3 taarten afgehaald worden?
      antwoord: |-
        $0{,}45$
      uitwerking: |-
        $P(X \geqslant 3) = 0{,}30 + 0{,}15 = 0{,}45$.
    - opgave: |-
        Bereken $\sigma$.
      antwoord: |-
        $\approx 1{,}06$
      uitwerking: |-
        $\E(X^2) = 0{,}15 + 4 \cdot 0{,}35 + 9 \cdot 0{,}30 + 16 \cdot 0{,}15 = 6{,}65$. $\Var(X) = 6{,}65 - 2{,}35^2 = 1{,}1275$, dus $\sigma \approx 1{,}06$.

- id: h3-o16
  soort: opdracht
  niveau: 1
  thema: |-
    eerlijk spel of niet
  opgave: |-
    Is het spel eerlijk? Zo niet, voor wie is het voordelig: de speler of de organisator?
  lijst: enumerate
  delen:
    - opgave: |-
        Je betaalt 2 euro en gooit een dobbelsteen. Bij een zes krijg je 10 euro, bij een vijf 2 euro, anders niets.
      antwoord: |-
        eerlijk
      uitwerking: |-
        De winst is 8, 0 of $-2$ euro met kansen $\frac16$, $\frac16$ en $\frac46$. $\E(X) = \frac{8 + 0 - 8}{6} = 0$: eerlijk.
    - opgave: |-
        Je betaalt 1 euro en gooit twee munten. Bij twee keer kop krijg je 3 euro, anders niets.
      antwoord: |-
        $-0{,}25$ euro: voordelig voor de organisator
      uitwerking: |-
        De winst is 2 euro met kans $\frac14$ en $-1$ euro met kans $\frac34$. $\E(X) = \frac24 - \frac34 = -0{,}25$ euro: in het voordeel van de organisator.
    - opgave: |-
        Je betaalt 5 euro en trekt een kaart uit een spel van 52. Bij een aas krijg je 30 euro, bij een prentkaart 10 euro, anders niets.
      antwoord: |-
        $\approx -0{,}38$ euro: voordelig voor de organisator
      uitwerking: |-
        De verwachte uitbetaling is $30 \cdot \frac{4}{52} + 10 \cdot \frac{12}{52} = \frac{240}{52} \approx 4{,}62$ euro. De verwachte winst is $4{,}62 - 5 \approx -0{,}38$ euro: in het voordeel van de organisator.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    Waar zit de fout?
  opgave: |-
    Elke redenering bevat een fout. Zoek de fout en geef, waar het kan, het juiste antwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{$X$ neemt de waarden 1, 2 en 3 aan met kansen $0{,}2$; $0{,}5$ en $0{,}3$. Dus $\E(X) = \frac{1 + 2 + 3}{3} = 2$.}
      antwoord: |-
        $\E(X) = 2{,}1$
      uitwerking: |-
        De waarden zijn niet even waarschijnlijk: je moet met de kansen wegen. $\E(X) = 0{,}2 + 1{,}0 + 0{,}9 = 2{,}1$.
    - opgave: |-
        \textit{Voor diezelfde $X$ is $\E(X^2) = 4{,}9$, dus $\Var(X) = 4{,}9 - 2{,}1 = 2{,}8$.}
      antwoord: |-
        $\Var(X) = 0{,}49$
      uitwerking: |-
        Je moet $\mu^2$ aftrekken, niet $\mu$: $\Var(X) = 4{,}9 - 2{,}1^2 = 4{,}9 - 4{,}41 = 0{,}49$, en $\sigma = 0{,}7$.
    - opgave: |-
        \textit{$X$ is $-3$ of $3$, elk met kans $\frac12$. De afwijkingen van $\mu = 0$ zijn $-3$ en $3$, en die heffen elkaar op, dus $\sigma = 0$.}
      antwoord: |-
        $\sigma = 3$
      uitwerking: |-
        De afwijkingen worden eerst gekwadrateerd, zodat ze elkaar niet opheffen: $\Var(X) = 9 \cdot \frac12 + 9 \cdot \frac12 = 9$ en $\sigma = 3$. Elke waarde ligt op afstand 3 van $\mu$.
    - opgave: |-
        \textit{$X$ neemt alleen gehele waarden aan, dus $F(2{,}5)$ bestaat niet.}
      antwoord: |-
        $F(2{,}5) = F(2)$
      uitwerking: |-
        $F(x) = P(X \leqslant x)$ bestaat voor elk reëel getal. Omdat $X$ niet tussen 2 en 3 ligt, is $F(2{,}5) = P(X \leqslant 2) = F(2)$: de trap is daar vlak.
    - opgave: |-
        \textit{De tabel met waarden 0, 1, 2 en kansen $0{,}5$; $0{,}4$; $0{,}3$ is een kansverdeling, want alle kansen liggen tussen 0 en 1.}
      antwoord: |-
        geen kansverdeling
      uitwerking: |-
        De kansen moeten ook samen 1 zijn, en $0{,}5 + 0{,}4 + 0{,}3 = 1{,}2$.

- id: h3-o18
  soort: opdracht
  niveau: 2
  thema: |-
    spreiding herkennen in een staafdiagram
  opgave: |-
    De drie staafdiagrammen tonen toevalsvariabelen met de waarden 1 tot 5.
    \figuren{\begin{tikzpicture}[x=.5cm,y=4cm,font=\scriptsize]
      \draw[black!14,very thin] (.5,0) grid[xstep=5,ystep=.1] (5.5,.6);
      \foreach \x/\h in {1/.1,2/.1,3/.6,4/.1,5/.1}{\staaf{\x}{\h}{.55}}
      \draw[->,grijs] (.5,0) -- (5.8,0); \draw[->,grijs] (.5,0) -- (.5,.66);
      \foreach \x in {1,...,5}{\node[below] at (\x,0) {\x};}
      \foreach \t/\l in {.2/{0,2},.4/{0,4},.6/{0,6}}{\node[left] at (.5,\t) {\l};}
      \node[above] at (3,.62) {$A$};
    \end{tikzpicture}\hspace{8mm}%
    \begin{tikzpicture}[x=.5cm,y=4cm,font=\scriptsize]
      \draw[black!14,very thin] (.5,0) grid[xstep=5,ystep=.1] (5.5,.6);
      \foreach \x in {1,...,5}{\staaf{\x}{.2}{.55}}
      \draw[->,grijs] (.5,0) -- (5.8,0); \draw[->,grijs] (.5,0) -- (.5,.66);
      \foreach \x in {1,...,5}{\node[below] at (\x,0) {\x};}
      \foreach \t/\l in {.2/{0,2},.4/{0,4},.6/{0,6}}{\node[left] at (.5,\t) {\l};}
      \node[above] at (3,.62) {$B$};
    \end{tikzpicture}\hspace{8mm}%
    \begin{tikzpicture}[x=.5cm,y=4cm,font=\scriptsize]
      \draw[black!14,very thin] (.5,0) grid[xstep=5,ystep=.1] (5.5,.6);
      \foreach \x/\h in {1/.4,2/.05,3/.1,4/.05,5/.4}{\staaf{\x}{\h}{.55}}
      \draw[->,grijs] (.5,0) -- (5.8,0); \draw[->,grijs] (.5,0) -- (.5,.66);
      \foreach \x in {1,...,5}{\node[below] at (\x,0) {\x};}
      \foreach \t/\l in {.2/{0,2},.4/{0,4},.6/{0,6}}{\node[left] at (.5,\t) {\l};}
      \node[above] at (3,.62) {$C$};
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de verwachtingswaarde van elke toevalsvariabele? Hoe zie je dat zonder te rekenen?
      antwoord: |-
        telkens 3
      uitwerking: |-
        De drie staafdiagrammen zijn symmetrisch rond 3, dus het evenwichtspunt ligt telkens in 3.
    - opgave: |-
        Rangschik de drie volgens hun standaardafwijking, zonder te rekenen.
      antwoord: |-
        $A$, $B$, $C$
      uitwerking: |-
        Bij $A$ ligt de meeste kans op $\mu$ zelf, bij $C$ ligt de meeste kans ver van $\mu$ (op 1 en 5). Dus $\sigma_A < \sigma_B < \sigma_C$.
    - opgave: |-
        Bereken de drie standaardafwijkingen ter controle.
      antwoord: |-
        $1$; \ $\sqrt2 \approx 1{,}41$; \ $\sqrt{3{,}3} \approx 1{,}82$
      uitwerking: |-
        De afwijkingen van 3 zijn $-2, -1, 0, 1, 2$, met kwadraten 4, 1, 0, 1, 4.\par
        $A$: $\Var = 4 \cdot 0{,}1 + 1 \cdot 0{,}1 + 0 + 1 \cdot 0{,}1 + 4 \cdot 0{,}1 = 1$, dus $\sigma = 1$.\par
        $B$: $\Var = (4 + 1 + 0 + 1 + 4) \cdot 0{,}2 = 2$, dus $\sigma \approx 1{,}41$.\par
        $C$: $\Var = 4 \cdot 0{,}4 + 1 \cdot 0{,}05 + 0 + 1 \cdot 0{,}05 + 4 \cdot 0{,}4 = 3{,}3$, dus $\sigma \approx 1{,}82$.

- id: h3-o19
  soort: opdracht
  niveau: 2
  thema: |-
    context: verlengde garantie
  opgave: |-
    Een winkel verkoopt bij een wasmachine een verlengde garantie voor 30 euro. Tijdens die garantie is er met kans $0{,}08$ een herstelling die de winkel 150 euro kost, en met kans $0{,}03$ een vervanging die 300 euro kost. Anders kost het niets. $X$ is de winst van de winkel op één garantie.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de kansverdeling van $X$.
      antwoord: |-
        $30$; $-120$; $-270$ euro met kansen $0{,}89$; $0{,}08$; $0{,}03$
      uitwerking: |-
        Zonder kosten: $X = 30$, met kans $1 - 0{,}08 - 0{,}03 = 0{,}89$. Herstelling: $X = 30 - 150 = -120$, kans $0{,}08$. Vervanging: $X = 30 - 300 = -270$, kans $0{,}03$.
    - opgave: |-
        Bereken $\E(X)$. Wat betekent dat getal voor de winkel?
      antwoord: |-
        9 euro
      uitwerking: |-
        $\E(X) = 30 \cdot 0{,}89 - 120 \cdot 0{,}08 - 270 \cdot 0{,}03 = 26{,}7 - 9{,}6 - 8{,}1 = 9$ euro. Op lange termijn verdient de winkel gemiddeld 9 euro per verkochte garantie.
    - opgave: |-
        Bereken $\sigma$.
      antwoord: |-
        $\approx 63{,}7$ euro
      uitwerking: |-
        $\E(X^2) = 900 \cdot 0{,}89 + 14\,400 \cdot 0{,}08 + 72\,900 \cdot 0{,}03 = 801 + 1152 + 2187 = 4140$. $\Var(X) = 4140 - 81 = 4059$, dus $\sigma \approx 63{,}7$ euro.
    - opgave: |-
        Waarom koopt een klant zo'n garantie, hoewel zijn verwachte winst negatief is?
      antwoord: |-
        zekerheid
      uitwerking: |-
        Voor de klant is de verwachte winst $-9$ euro, maar hij ruilt een klein zeker verlies in voor bescherming tegen een grote, onverwachte kost. De grote $\sigma$ toont dat risico. De winkel verkoopt veel garanties, en daar middelen de schommelingen uit.

- id: h3-o20
  soort: opdracht
  niveau: 2
  thema: |-
    kansverdeling met twee onbekenden
  opgave: |-
    $X$ neemt de waarden 0, 1, 2 en 3 aan met kansen $0{,}1$, $a$, $b$ en $0{,}2$. Bovendien is $\E(X) = 1{,}7$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $a$ en $b$.
      antwoord: |-
        $a = 0{,}3$; \ $b = 0{,}4$
      uitwerking: |-
        De kansen zijn samen 1: $0{,}1 + a + b + 0{,}2 = 1$, dus $a + b = 0{,}7$. De verwachtingswaarde: $a + 2b + 0{,}6 = 1{,}7$, dus $a + 2b = 1{,}1$. Trek af: $b = 0{,}4$ en $a = 0{,}3$.
    - opgave: |-
        Bereken $\sigma$.
      antwoord: |-
        $0{,}9$
      uitwerking: |-
        $\E(X^2) = 0{,}3 + 4 \cdot 0{,}4 + 9 \cdot 0{,}2 = 3{,}7$. $\Var(X) = 3{,}7 - 1{,}7^2 = 0{,}81$, dus $\sigma = 0{,}9$.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    van cumulatieve verdelingsfunctie naar kansverdeling
  opgave: |-
    Van een toevalsvariabele $X$ met de waarden 0 tot 4 is $F(0) = 0{,}1$, $F(1) = 0{,}3$, $F(2) = 0{,}65$, $F(3) = 0{,}9$ en $F(4) = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de kansverdeling van $X$.
      antwoord: |-
        $0{,}1$; $0{,}2$; $0{,}35$; $0{,}25$; $0{,}1$
      uitwerking: |-
        De kans op een waarde is de sprong van $F$: $P(X = 0) = 0{,}1$, $P(X = 1) = 0{,}3 - 0{,}1 = 0{,}2$, $P(X = 2) = 0{,}35$, $P(X = 3) = 0{,}25$, $P(X = 4) = 0{,}1$.
    - opgave: |-
        Bereken $P(X > 1)$, $P(X < 3)$ en $P(1 \leqslant X \leqslant 3)$.
      antwoord: |-
        $0{,}7$; \ $0{,}65$; \ $0{,}8$
      uitwerking: |-
        $P(X > 1) = 1 - F(1) = 0{,}7$. $P(X < 3) = P(X \leqslant 2) = F(2) = 0{,}65$. $P(1 \leqslant X \leqslant 3) = F(3) - F(0) = 0{,}9 - 0{,}1 = 0{,}8$.
    - opgave: |-
        Teken de grafiek van $F$.
      antwoord: |-
        een trap met sprongen in 0, 1, 2, 3, 4
      uitwerking: |-
        \begin{tikzpicture}[x=.8cm,y=2.4cm,font=\scriptsize]
          \draw[black!14,very thin] (-1,0) grid[xstep=1,ystep=.1] (5,1);
          \draw[->,grijs] (-1.2,0) -- (5.3,0) node[right,text=black] {$x$};
          \draw[->,grijs] (0,0) -- (0,1.12) node[above,text=black] {$F(x)$};
          \foreach \x in {1,...,4}{\node[below] at (\x,0) {\x};}
          \foreach \t/\l in {.1/{0,1},.3/{0,3},.65/{0,65},.9/{0,9},1/1}{\node[left] at (0,\t) {\l};}
          \draw[accent,very thick] (-1,0) -- (0,0) (0,.1) -- (1,.1) (1,.3) -- (2,.3) (2,.65) -- (3,.65) (3,.9) -- (4,.9) (4,1) -- (5,1);
          \foreach \x/\y in {0/.1,1/.3,2/.65,3/.9,4/1}{\fill[accent] (\x,\y) circle (1.6pt);}
          \foreach \x/\y in {0/0,1/.1,2/.3,3/.65,4/.9}{\draw[accent,fill=white] (\x,\y) circle (1.6pt);}
        \end{tikzpicture}

- id: h3-o22
  soort: opdracht
  niveau: 2
  thema: |-
    eenheden omrekenen
  opgave: |-
    Als je elke waarde van $X$ met $a$ vermenigvuldigt en er $b$ bij telt, dan wordt de verwachtingswaarde $a\E(X) + b$ en de standaardafwijking $|a|\,\sigma$ (zie opdracht \ref{oef:h3-o7}). Gebruik dat.
  lijst: enumerate
  delen:
    - opgave: |-
        Een taxirit kost 3 euro instap en 2 euro per kilometer. De lengte $X$ van een rit (in km) heeft $\E(X) = 8$ en $\sigma = 2{,}5$. Bereken de verwachtingswaarde en de standaardafwijking van de prijs.
      antwoord: |-
        19 euro; 5 euro
      uitwerking: |-
        De prijs is $2X + 3$. Verwachte prijs: $2 \cdot 8 + 3 = 19$ euro. Standaardafwijking: $2 \cdot 2{,}5 = 5$ euro: de instap verschuift alles en verandert de spreiding niet.
    - opgave: |-
        De middagtemperatuur in een stad heeft in juli verwachtingswaarde $24\,^\circ$C en standaardafwijking $3\,^\circ$C. In graden Fahrenheit is de temperatuur $1{,}8 \cdot C + 32$. Bereken $\mu$ en $\sigma$ in graden Fahrenheit.
      antwoord: |-
        $75{,}2\,^\circ$F; \ $5{,}4\,^\circ$F
      uitwerking: |-
        $\mu = 1{,}8 \cdot 24 + 32 = 75{,}2\,^\circ$F en $\sigma = 1{,}8 \cdot 3 = 5{,}4\,^\circ$F.

- id: h3-o23
  soort: opdracht
  niveau: 2
  thema: |-
    het product van twee dobbelstenen
  opgave: |-
    Bij een spel gooi je twee dobbelstenen en krijg je het product van de ogen in euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken met een rooster de verwachte uitbetaling. Welke inzet maakt het spel eerlijk?
      antwoord: |-
        $12{,}25$ euro
      uitwerking: |-
        Tel alle 36 producten in het rooster op. De rij van de eerste dobbelsteen $a$ bevat $a \cdot 1 + a \cdot 2 + \cdots + a \cdot 6 = 21a$, samen $21 \cdot (1 + 2 + \cdots + 6) = 21 \cdot 21 = 441$. $\E(X) = \frac{441}{36} = 12{,}25$ euro, en dat is ook de eerlijke inzet.
    - opgave: |-
        Is de kans dat je minstens 12,25 euro krijgt groter of kleiner dan $\frac12$?
      antwoord: |-
        kleiner: $\tfrac{13}{36}$
      uitwerking: |-
        Een product van minstens 13: $(3, 5), (3, 6), (4, 4), (4, 5), (4, 6), (5, 3), (5, 4), (5, 5), (5, 6), (6, 3), (6, 4), (6, 5), (6, 6)$, samen 13 koppels. De kans is $\frac{13}{36} \approx 0{,}36$. De verwachtingswaarde hoeft niet in het midden van de verdeling te liggen: enkele grote producten (25, 30, 36) trekken ze omhoog.

- id: h3-o24
  soort: opdracht
  niveau: 3
  thema: |-
    de verwachtingswaarde als beste schatting
  opgave: |-
    $X$ is een discrete toevalsvariabele met verwachtingswaarde $\mu$, en $c$ is een getal.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\E\bigl((X - c)^2\bigr) = \Var(X) + (\mu - c)^2$. Schrijf daarvoor $x_i - c$ als $(x_i - \mu) + (\mu - c)$.
      antwoord: |-
        bewijs
      uitwerking: |-
        Met $p_i = P(X = x_i)$:
        \[ \sum_i (x_i - c)^2 p_i = \sum_i (x_i - \mu)^2 p_i + 2(\mu - c)\sum_i (x_i - \mu) p_i + (\mu - c)^2 \sum_i p_i . \]
        De eerste som is $\Var(X)$, de laatste som is 1, en $\sum_i (x_i - \mu)p_i = \mu - \mu = 0$. Dus $\E\bigl((X - c)^2\bigr) = \Var(X) + (\mu - c)^2$.
    - opgave: |-
        Voor welke $c$ is $\E\bigl((X - c)^2\bigr)$ zo klein mogelijk? Wat betekent dat?
      antwoord: |-
        $c = \mu$
      uitwerking: |-
        $\Var(X)$ hangt niet van $c$ af, en $(\mu - c)^2 \geqslant 0$ is het kleinst voor $c = \mu$. Moet je de uitkomst van $X$ voorspellen met één getal, en tel je de gekwadrateerde fout, dan is $\mu$ de beste keuze.
    - opgave: |-
        $X$ neemt alleen waarden in $[0, 4]$ aan. Toon aan dat $\sigma \leqslant 2$, en geef een kansverdeling met $\sigma = 2$.
      antwoord: |-
        bv. 0 en 4 elk met kans $\tfrac12$
      uitwerking: |-
        Neem $c = 2$. Voor elke waarde is $|x_i - 2| \leqslant 2$, dus $\E\bigl((X - 2)^2\bigr) \leqslant 4$. Uit a: $\Var(X) \leqslant \Var(X) + (\mu - 2)^2 = \E\bigl((X - 2)^2\bigr) \leqslant 4$, dus $\sigma \leqslant 2$.\par
        Gelijkheid vraagt $\mu = 2$ en alle waarden op afstand 2 van 2: $X$ is 0 of 4, elk met kans $\frac12$. Dan is $\sigma = 2$.

- id: h3-o25
  soort: opdracht
  niveau: 3
  thema: |-
    een spel met verdubbelende prijzen
  opgave: |-
    Je gooit met een munt tot je kop hebt, maar hoogstens 5 keer. Valt de eerste kop bij worp $k$, dan krijg je $2^k$ euro. Heb je na 5 worpen geen kop, dan krijg je niets. $X$ is de uitbetaling.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de kansverdeling van $X$.
      antwoord: |-
        $2, 4, 8, 16, 32$ euro met kansen $\tfrac12, \tfrac14, \tfrac18, \tfrac{1}{16}, \tfrac{1}{32}$; 0 euro met kans $\tfrac{1}{32}$
      uitwerking: |-
        De eerste kop valt bij worp $k$ als je eerst $k - 1$ keer munt gooit en dan kop: kans $\bigl(\frac12\bigr)^k$. Dus $P(X = 2^k) = \frac{1}{2^k}$ voor $k = 1, \ldots, 5$, en $P(X = 0) = \frac{1}{32}$ (vijf keer munt). Controle: $\frac{16 + 8 + 4 + 2 + 1 + 1}{32} = 1$.
    - opgave: |-
        Bereken $\E(X)$. Hoe groot is $\E(X)$ als je hoogstens $n$ keer mag gooien?
      antwoord: |-
        5 euro; $n$ euro
      uitwerking: |-
        Elke $k$ geeft $2^k \cdot \frac{1}{2^k} = 1$ euro bij de verwachtingswaarde, dus $\E(X) = 1 + 1 + 1 + 1 + 1 = 5$ euro. Met hoogstens $n$ worpen is $\E(X) = n$ euro.
    - opgave: |-
        Iemand biedt het spel aan zonder grens op het aantal worpen. Welke inzet zou het spel eerlijk maken? Zou jij 100 euro inzetten? Bereken daarvoor de kans dat je meer dan 100 euro terugkrijgt.
      antwoord: |-
        geen eindige inzet; $P(X > 100) = \tfrac{1}{64}$
      uitwerking: |-
        Zonder grens wordt $\E(X)$ groter dan elk getal $n$: geen enkele eindige inzet maakt het spel eerlijk. Toch krijg je meer dan 100 euro alleen als de eerste kop pas bij worp 7 of later valt ($2^7 = 128$): dat is zes keer munt na elkaar, kans $\frac{1}{64}$. De verwachtingswaarde wordt gedragen door zeer grote prijzen met zeer kleine kansen, en daarom zet bijna niemand veel in. Dit staat bekend als de paradox van Sint-Petersburg.

- id: h3-o26
  soort: opdracht
  niveau: 3
  thema: |-
    het verwachte aantal juiste brieven
  opgave: |-
    Een aantal brieven wordt willekeurig in de geadresseerde enveloppen gestoken. $X$ is het aantal brieven in de juiste envelop.
  lijst: enumerate
  delen:
    - opgave: |-
        Neem 3 brieven. Schrijf de 6 mogelijke rangschikkingen op, geef de kansverdeling van $X$, en bereken $\E(X)$.
      antwoord: |-
        $\tfrac26$, $\tfrac36$, $\tfrac16$ voor $x = 0, 1, 3$; \ $\E(X) = 1$
      uitwerking: |-
        Schrijf een rangschikking als de enveloppen van brief 1, 2, 3: 123 (3 juist), 132, 213, 321 (elk 1 juist), 231 en 312 (0 juist). Twee juist kan niet: dan zit ook de derde juist. $P(X = 0) = \frac26$, $P(X = 1) = \frac36$, $P(X = 3) = \frac16$, en $\E(X) = \frac{3 + 3}{6} = 1$.
    - opgave: |-
        Neem 4 brieven. In opdracht \ref{oef:h1-o11} vond je 9 rangschikkingen zonder juiste brief. Toon aan dat er 8 zijn met precies één en 6 met precies twee juiste brieven, en bereken $\E(X)$. Wat valt op?
      antwoord: |-
        $\E(X) = 1$
      uitwerking: |-
        Precies één juist: kies welke brief juist zit (4 manieren); de andere 3 zitten allemaal fout, en dat kan op 2 manieren (zie a). Dus $4 \cdot 2 = 8$. Precies twee juist: kies de twee juiste ($\binom42 = 6$); de andere twee moeten wisselen. Drie juist kan niet, vier juist op 1 manier. Controle: $9 + 8 + 6 + 1 = 24 = 4!$.\par
        $\E(X) = \frac{1 \cdot 8 + 2 \cdot 6 + 4 \cdot 1}{24} = \frac{24}{24} = 1$. Opnieuw 1: elke brief zit met kans $\frac14$ juist, en 4 brieven geven samen gemiddeld $4 \cdot \frac14 = 1$ juiste. Zo is $\E(X) = 1$ voor elk aantal brieven.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 1
  koppel:
    rubriek: data
    onderwerp: Statistiek
  thema: |-
    gemiddelde van data en verwachtingswaarde
  opgave: |-
    Een dobbelsteen wordt 50 keer geworpen. De ogen 1 tot 6 komen 7, 9, 8, 6, 10 en 10 keer voor. Bereken het gemiddelde aantal ogen van deze 50 worpen, en vergelijk met de verwachtingswaarde 3,5. Wat verwacht je na 5000 worpen?
  antwoord: |-
    $3{,}66$
  uitwerking: |-
    $\frac{7 + 18 + 24 + 24 + 50 + 60}{50} = \frac{183}{50} = 3{,}66$. Dat ligt dicht bij 3,5, maar niet erop. Na 5000 worpen liggen de relatieve frequenties dichter bij $\frac16$, en dus het gemiddelde dichter bij 3,5 (wet van de grote aantallen).

- id: h3-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: discreet
    onderwerp: Recursie
  thema: |-
    wachten op een zes
  opgave: |-
    Je gooit met een dobbelsteen tot je een zes hebt. $X$ is het aantal worpen. Noem $m = \E(X)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit: na de eerste worp ben je met kans $\frac16$ klaar, en met kans $\frac56$ begin je eigenlijk opnieuw, met al één worp gebruikt. Dus $m = 1 + \frac56 m$. Bepaal $m$.
      antwoord: |-
        $m = 6$
      uitwerking: |-
        Na één worp is het verwachte aantal extra worpen 0 (met kans $\frac16$) of opnieuw $m$ (met kans $\frac56$). Dus $m = 1 + \frac56 m$, en $\frac16 m = 1$ geeft $m = 6$.
    - opgave: |-
        Toon met dezelfde redenering aan dat je gemiddeld $\frac1p$ keer moet proberen bij een kans $p$ op succes.
      antwoord: |-
        $m = 1 + (1 - p)m$
      uitwerking: |-
        $m = 1 + (1 - p)m$ geeft $pm = 1$, dus $m = \frac1p$.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    kansverdeling
  opgave: |-
    Een toevalsvariabele $X$ neemt de waarden 0, 1, 2 en 3 aan met kansen 0,2; 0,4; 0,3 en $a$. Bepaal $a$ en $P(X \geqslant 2)$.
  antwoord: |-
    $a = 0{,}1$; \ $0{,}4$
  uitwerking: |-
    $0{,}2 + 0{,}4 + 0{,}3 + a = 1$, dus $a = 0{,}1$. $P(X \geqslant 2) = 0{,}3 + 0{,}1 = 0{,}4$.

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    verwachtingswaarde en eerlijk spel
  opgave: |-
    Op een kermis betaal je 3 euro, je gooit een dobbelsteen, en je krijgt evenveel euro als het aantal ogen. Wat is je verwachte winst? Is het spel eerlijk?
  antwoord: |-
    $0{,}50$ euro; nee
  uitwerking: |-
    De verwachte uitbetaling is 3,5 euro, de winst $3{,}5 - 3 = 0{,}5$ euro. Niet eerlijk: in het voordeel van de speler.

- id: h3-t3
  soort: test
  niveau: 2
  thema: |-
    verwachtingswaarde en standaardafwijking
  opgave: |-
    Bereken $\E(X)$ en $\sigma$ voor de toevalsvariabele uit opgave \ref{oef:h3-t1}.
  antwoord: |-
    $1{,}3$; \ $0{,}9$
  uitwerking: |-
    $\E(X) = 0 + 0{,}4 + 0{,}6 + 0{,}3 = 1{,}3$. $\E(X^2) = 0 + 0{,}4 + 1{,}2 + 0{,}9 = 2{,}5$. $\Var(X) = 2{,}5 - 1{,}69 = 0{,}81$, dus $\sigma = 0{,}9$.

- id: h3-t4
  soort: test
  niveau: 1
  thema: |-
    cumulatieve verdelingsfunctie
  opgave: |-
    Bereken voor de toevalsvariabele uit opgave \ref{oef:h3-t1} de waarden $F(0)$, $F(1)$, $F(2)$ en $F(3)$.
  antwoord: |-
    $0{,}2$; $0{,}6$; $0{,}9$; $1$
  uitwerking: |-
    Tel de kansen op: $F(0) = 0{,}2$, $F(1) = 0{,}6$, $F(2) = 0{,}9$, $F(3) = 1$.

- id: h3-t5
  soort: test
  niveau: 1
  thema: |-
    kansverdeling opstellen
  opgave: |-
    In een vaas zitten 2 rode en 3 witte knikkers. Je trekt er twee zonder teruglegging. $X$ is het aantal rode. Geef de kansverdeling van $X$ en bereken $\E(X)$.
  antwoord: |-
    $\tfrac{3}{10}$, $\tfrac{6}{10}$, $\tfrac{1}{10}$ voor $x = 0, 1, 2$; \ $\E(X) = 0{,}8$
  uitwerking: |-
    Met een boomdiagram: $P(X = 0) = \frac35 \cdot \frac24 = \frac{3}{10}$, $P(X = 2) = \frac25 \cdot \frac14 = \frac{1}{10}$ en $P(X = 1) = 1 - \frac{3}{10} - \frac{1}{10} = \frac{6}{10}$. $\E(X) = 0 + 0{,}6 + 2 \cdot 0{,}1 = 0{,}8$.

- id: h3-t6
  soort: test
  niveau: 2
  thema: |-
    eerlijke inzet en spreiding
  opgave: |-
    Een rad heeft vier gelijke vakken. Twee vakken betalen niets uit, één vak 2 euro en één vak 6 euro. Welke inzet maakt het spel eerlijk? Bereken de standaardafwijking van de uitbetaling.
  antwoord: |-
    2 euro; \ $\sqrt6 \approx 2{,}45$ euro
  uitwerking: |-
    De verwachte uitbetaling is $\frac{0 + 0 + 2 + 6}{4} = 2$ euro: met die inzet is het spel eerlijk. $\E(X^2) = \frac{0 + 0 + 4 + 36}{4} = 10$, dus $\Var(X) = 10 - 4 = 6$ en $\sigma = \sqrt6 \approx 2{,}45$ euro.
