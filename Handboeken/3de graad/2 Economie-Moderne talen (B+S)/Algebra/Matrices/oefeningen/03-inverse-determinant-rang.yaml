# KOPPEL
#----------------------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: Oppervlakte
  thema: |-
    determinant als oppervlakte
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm,font=\scriptsize]
        \draw[black!14,very thin] (0,0) grid (6,5);
        \draw[->,grijs] (0,0) -- (6.4,0); \draw[->,grijs] (0,0) -- (0,5.4);
        \fill[accent!20] (1,1) -- (5,2) -- (2,4) -- cycle;
        \draw[accent,thick] (1,1) node[below left,text=black] {$A$} -- (5,2) node[right,text=black] {$B$} -- (2,4) node[above,text=black] {$C$} -- cycle;
      \end{tikzpicture}
  opgave: |-
    Het parallellogram met zijden de vectoren $\km{a \\ c}$ en $\km{b \\ d}$ vanuit de oorsprong heeft oppervlakte $\left|\begin{vmatrix} a & b \\ c & d \end{vmatrix}\right|$, de absolute waarde van de determinant.
  lijst: enumerate
  delen:
    - opgave: |-
        Controleer dat met het parallellogram uit de Opwarmer.
      antwoord: |-
        $\left|\begin{vmatrix} 3 & 1 \\ 0 & 2 \end{vmatrix}\right| = 6$
      uitwerking: |-
        De zijden zijn $\km{3 \\ 0}$ en $\km{1 \\ 2}$: $|3 \cdot 2 - 1 \cdot 0| = 6$, zoals basis maal hoogte.
    - opgave: |-
        Bereken zo de oppervlakte van driehoek $ABC$ met $A(1, 1)$, $B(5, 2)$ en $C(2, 4)$.
      antwoord: |-
        $\tfrac{11}{2}$
      uitwerking: |-
        De zijden vanuit $A$ zijn $\overrightarrow{AB} = \km{4 \\ 1}$ en $\overrightarrow{AC} = \km{1 \\ 3}$. Het parallellogram heeft oppervlakte $|12 - 1| = 11$, de driehoek de helft: $\frac{11}{2}$.
    - opgave: |-
        Wat betekent determinant 0 voor de twee vectoren?
      antwoord: |-
        ze liggen op één rechte
      uitwerking: |-
        Het parallellogram is plat: de twee vectoren liggen op één rechte door de oorsprong, en de ene is een veelvoud van de andere.

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    inverse van een 2x2-matrix
  opgave: |-
    Bepaal de inverse van $\begin{bmatrix} 5 & 3 \\ 3 & 2 \end{bmatrix}$.
  antwoord: |-
    $\km{2 & -3 \\ -3 & 5}$
  uitwerking: |-
    $\det = 10 - 9 = 1$, dus de inverse is $\km{2 & -3 \\ -3 & 5}$.

- id: h3-t2
  soort: test
  niveau: 2
  thema: |-
    inverse van een 3x3-matrix
  opgave: |-
    Bereken de inverse van $T = \begin{bmatrix} 1 & 1 & 0 \\ 0 & 1 & 2 \\ 1 & 1 & 1 \end{bmatrix}$ met $[T \,|\, I]$.
  antwoord: |-
    $\km{-1 & -1 & 2 \\ 2 & 1 & -2 \\ -1 & 0 & 1}$
  uitwerking: |-
    $R_3 - R_1$ geeft $[0 \ 0 \ 1 \,|\, {-1} \ 0 \ 1]$. Dan $R_2 - 2R_3$: $[0 \ 1 \ 0 \,|\, 2 \ 1 \ {-2}]$, en $R_1 - R_2$: $[1 \ 0 \ 0 \,|\, {-1} \ {-1} \ 2]$. Dus $T^{-1} = \km{-1 & -1 & 2 \\ 2 & 1 & -2 \\ -1 & 0 & 1}$.

- id: h3-t3
  soort: test
  niveau: 1
  thema: |-
    determinant van een 3x3-matrix
  opgave: |-
    Bereken $\begin{vmatrix} 1 & 2 & 0 \\ 3 & -1 & 4 \\ 2 & 0 & 1 \end{vmatrix}$.
  antwoord: |-
    $9$
  uitwerking: |-
    Naar de eerste rij: $1 \cdot (-1 - 0) - 2 \cdot (3 - 8) + 0 = -1 + 10 = 9$.

- id: h3-t4
  soort: test
  niveau: 1
  thema: |-
    regel van Cramer
  opgave: |-
    Los op met de regel van Cramer: $\begin{cases} 2x - y = 3 \\ 3x + 2y = 8 \end{cases}$
  antwoord: |-
    $x = 2$, $y = 1$
  uitwerking: |-
    $\det A = 4 + 3 = 7$. \ $x = \frac{1}{7}\begin{vmatrix} 3 & -1 \\ 8 & 2 \end{vmatrix} = \frac{6 + 8}{7} = 2$ en $y = \frac17\begin{vmatrix} 2 & 3 \\ 3 & 8 \end{vmatrix} = \frac{16 - 9}{7} = 1$.

- id: h3-t5
  soort: test
  niveau: 1
  thema: |-
    rang
  opgave: |-
    Bepaal de rang van $\begin{bmatrix} 1 & 2 & 1 \\ 2 & 4 & 3 \\ 3 & 6 & 4 \end{bmatrix}$.
  antwoord: |-
    2
  uitwerking: |-
    $R_2 - 2R_1$ en $R_3 - 3R_1$: $\km{1 & 2 & 1 \\ 0 & 0 & 1 \\ 0 & 0 & 1}$, dan $R_3 - R_2$: een nulrij. Twee spillen: rang 2.

- id: h3-t6
  soort: test
  niveau: 2
  thema: |-
    inverteerbaar met een parameter
  opgave: |-
    Voor welke reële $k$ is $\begin{bmatrix} k & 1 & 0 \\ 1 & k & 0 \\ 0 & 0 & 2 \end{bmatrix}$ inverteerbaar?
  antwoord: |-
    $k \neq 1$ en $k \neq -1$
  uitwerking: |-
    Naar de derde rij: $\det = 2(k^2 - 1)$. Dat is 0 als $k = \pm 1$, dus inverteerbaar voor alle andere $k$.

- id: h3-t7
  soort: test
  niveau: 1
  thema: |-
    matrixvergelijking
  opgave: |-
    Los op: $\begin{bmatrix} 3 & 1 \\ 5 & 2 \end{bmatrix} X = \begin{bmatrix} 4 & 1 \\ 7 & 3 \end{bmatrix}$.
  antwoord: |-
    $X = \km{1 & -1 \\ 1 & 4}$
  uitwerking: |-
    $\det A = 6 - 5 = 1$, dus $A^{-1} = \km{2 & -1 \\ -5 & 3}$. Omdat $A$ links staat: $X = A^{-1}B = \km{8 - 7 & 2 - 3 \\ -20 + 21 & -5 + 9} = \km{1 & -1 \\ 1 & 4}$. Controle: $AX = \km{3 + 1 & -3 + 4 \\ 5 + 2 & -5 + 8} = \km{4 & 1 \\ 7 & 3}$.

- id: h3-t8
  soort: test
  niveau: 2
  thema: |-
    rang en stelsels
  opgave: |-
    Bepaal de rang van de coëfficiëntenmatrix en van de uitgebreide matrix van het stelsel \[ \begin{cases} x + 2y - z = 1 \\ 2x + 4y + z = 5 \\ x + 2y + 2z = 4 \end{cases} \] Hoeveel oplossingen heeft het stelsel? Geef ze.
  antwoord: |-
    beide rang 2; 1 parameter: $(2 - 2t, t, 1)$
  uitwerking: |-
    $R_2 - 2R_1$ en $R_3 - R_1$ geven twee keer de rij $[0 \ 0 \ 3 \,|\, 3]$. Dan $\frac13 R_2$, $R_1 + R_2$ en $R_3 - 3R_2$: $\um{ccc|c}{1 & 2 & 0 & 2 \\ 0 & 0 & 1 & 1 \\ 0 & 0 & 0 & 0}$.\par
    Zowel $A$ als $[A \,|\, B]$ hebben rang 2: niet strijdig, met $3 - 2 = 1$ parameter. Kolom 2 heeft geen spil: $y = t$, $x = 2 - 2t$ en $z = 1$.
