# Oefeningen van hoofdstuk 3. Zie oefeningenbank.py voor de velden.
# D_n is de symmetriegroep van de regelmatige n-hoek; r is de draaiing over 360/n graden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken zonder rekentoestel: $\log 2 + \log 5$ en $\log 8 - \log 2$, als $\log 4 \approx 0{,}602$.
      antwoord: |-
        $1$ en $\approx 0{,}602$
      uitwerking: |-
        $\log(2 \cdot 5) = \log 10 = 1$ en $\log \frac82 = \log 4$.
    - opgave: |-
        Schrijf als één macht: $2^3 \cdot 2^4$ en $(2^3)^4$.
      antwoord: |-
        $2^7$ en $2^{12}$
      uitwerking: |-
        Exponenten optellen, respectievelijk vermenigvuldigen.
    - opgave: |-
        Neem $A = \begin{bmatrix} 1 & 2 \\ 3 & 4 \end{bmatrix}$ en $B = \begin{bmatrix} 2 & 0 \\ 1 & 1 \end{bmatrix}$. Bereken $\det A$, $\det B$ en $\det(AB)$.
      antwoord: |-
        $-2$, $2$ en $-4$
      uitwerking: |-
        $AB = \begin{bmatrix} 4 & 2 \\ 10 & 4 \end{bmatrix}$ en $16 - 20 = -4 = (-2) \cdot 2$.
    - opgave: |-
        Wat is de orde van 3 in $\Zs{8}$?
      antwoord: |-
        $2$
      uitwerking: |-
        $3 \cdot 3 = 9$ heeft rest 1.
    - opgave: |-
        Welke elementen van $(\Zn{6}, \plusn)$ hebben orde 3?
      antwoord: |-
        $2$ en $4$
      uitwerking: |-
        $6 : \ggd(k, 6) = 3$ voor $k = 2$ en $k = 4$.
    - opgave: |-
        Bereken $(\cos 30^\circ + i \sin 30^\circ)^3$.
      antwoord: |-
        $i$
      uitwerking: |-
        De Moivre: $\cos 90^\circ + i \sin 90^\circ = i$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Je maakt zelf een rekenlat. Teken een lijnstuk van 10 cm en zet het getal $x$ op afstand $10 \log x$ cm van het linkse eindpunt.
  lijst: enumerate
  delen:
    - opgave: |-
        Op welke afstand staan $1, 2, 3, \ldots, 10$? Rond af op een millimeter en duid ze aan.
      antwoord: |-
        $0;\ 3{,}0;\ 4{,}8;\ 6{,}0;\ 7{,}0;\ 7{,}8;\ 8{,}5;\ 9{,}0;\ 9{,}5;\ 10{,}0$ cm
      uitwerking: |-
        Bijvoorbeeld $10 \log 2 \approx 3{,}01$ en $10 \log 3 \approx 4{,}77$.
    - opgave: |-
        Tel de afstanden van 2 en 4 op. Bij welk getal kom je uit? En met 2 en 3?
      antwoord: |-
        bij 8; bij 6
      uitwerking: |-
        $3{,}0 + 6{,}0 = 9{,}0$, de plaats van 8. $3{,}0 + 4{,}8 = 7{,}8$, de plaats van 6.
    - opgave: |-
        Verklaar met een rekenregel van logaritmen.
      antwoord: |-
        $\log(ab) = \log a + \log b$
      uitwerking: |-
        De afstand van $ab$ is $10 \log(ab) = 10 \log a + 10 \log b$.
    - opgave: |-
        Waar zou het getal $\frac12$ staan als je de lat naar links verlengt? En 0?
      antwoord: |-
        op $3{,}0$ cm links van 1; 0 heeft geen plaats
      uitwerking: |-
        $10 \log \frac12 = -10 \log 2 \approx -3{,}0$. $\log 0$ bestaat niet: hoe verder naar links, hoe dichter bij 0, maar 0 bereik je nooit.

- id: h3-morfisme
  soort: kort
  opgave: |-
    Is $f$ een groepsmorfisme? Bewijs het, of geef een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        $f \colon (\Z, +) \to (\Z, +)$, \ $f(x) = 3x$
      antwoord: |-
        ja
      uitwerking: |-
        $f(a + b) = 3a + 3b = f(a) + f(b)$.
    - opgave: |-
        $f \colon (\Z, +) \to (\Z, +)$, \ $f(x) = x + 1$
      antwoord: |-
        nee
      uitwerking: |-
        $f(0 + 0) = 1$, maar $f(0) + f(0) = 2$.
    - opgave: |-
        $f \colon (\R_0, \cdot) \to (\R_0, \cdot)$, \ $f(x) = x^2$
      antwoord: |-
        ja
      uitwerking: |-
        $(ab)^2 = a^2 b^2$.
    - opgave: |-
        $f \colon (\Z, +) \to \bigl(\{1, -1\}, \cdot\bigr)$, \ $f(k) = (-1)^k$
      antwoord: |-
        ja
      uitwerking: |-
        $(-1)^{a + b} = (-1)^a (-1)^b$. Even getallen gaan naar 1, oneven naar $-1$.
    - opgave: |-
        $f \colon (\C_0, \cdot) \to (\R^+_0, \cdot)$, \ $f(z) = |z|$
      antwoord: |-
        ja
      uitwerking: |-
        De modulus van een product is het product van de moduli.

- id: h3-beeld
  soort: kort
  opgave: |-
    $f \colon (\Z, +) \to \bigl(\Zs{7}, \maaln\bigr)$ is een groepsmorfisme met $f(1) = 2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $f(0)$, $f(3)$, $f(-1)$ en $f(10)$.
      antwoord: |-
        $1$, $1$, $4$, $2$
      uitwerking: |-
        $f(k) = 2^k$, en $2^3 = 8 \to 1$, dus $\ord(2) = 3$. $f(-1) = 2^{-1} = 2^2 = 4$. $10 = 3 \cdot 3 + 1$, dus $f(10) = 2$.
    - opgave: |-
        Welke gehele getallen hebben als beeld 1?
      antwoord: |-
        de veelvouden van 3
      uitwerking: |-
        $2^k = 1 \iff 3 \mid k$.

- id: h3-kern
  soort: kort
  opgave: |-
    Bepaal de kern van het morfisme. Is het injectief?
  lijst: enumerate
  delen:
    - opgave: |-
        $f \colon (\Z, +) \to (\Zn{8}, \plusn)$, $f(k)$ is de rest van $k$ bij deling door 8
      antwoord: |-
        $8\Z$; niet injectief
      uitwerking: |-
        De rest is 0 voor de veelvouden van 8.
    - opgave: |-
        $f \colon (\Zn{10}, \plusn) \to (\Zn{5}, \plusn)$, $f(k)$ is de rest van $k$ bij deling door 5
      antwoord: |-
        $\{0, 5\}$; niet injectief
      uitwerking: |-
        $f(0) = f(5) = 0$.
    - opgave: |-
        $f \colon (\R_0, \cdot) \to \bigl(\{1, -1\}, \cdot\bigr)$, $f(x)$ is het teken van $x$ (1 als $x > 0$, $-1$ als $x < 0$)
      antwoord: |-
        $\R^+_0$; niet injectief
      uitwerking: |-
        De positieve getallen hebben teken 1.
    - opgave: |-
        $f \colon (\Z, +) \to (\Z, +)$, $f(x) = 3x$
      antwoord: |-
        $\{0\}$; injectief
      uitwerking: |-
        $3x = 0 \iff x = 0$.

- id: h3-iso
  soort: kort
  opgave: |-
    Toon aan dat $f$ een isomorfisme is.
  lijst: enumerate
  delen:
    - opgave: |-
        $f \colon (\Zn{4}, \plusn) \to \bigl(\Zs{5}, \maaln\bigr)$, \ $f(k) = 2^k$
      antwoord: |-
        $f(0), \ldots, f(3) = 1, 2, 4, 3$
      uitwerking: |-
        Vier verschillende beelden: een bijectie naar $\{1, 2, 3, 4\}$. Omdat $2^4 = 16 \to 1$, verschillen $2^{k + l}$ en $2^{k \plusn l}$ niet: $f(k) \maaln f(l) = f(k \plusn l)$.
    - opgave: |-
        $f \colon (\Z, +) \to (2\Z, +)$, \ $f(k) = 2k$
      antwoord: |-
        morfisme en bijectie
      uitwerking: |-
        $2(a + b) = 2a + 2b$. Elk even getal is $2k$ voor precies één $k$.

- id: h3-nietiso
  soort: kort
  opgave: |-
    Zijn de groepen isomorf? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        $(\Zn{8}, \plusn)$ en $D_4$, de symmetriegroep van het vierkant
      antwoord: |-
        nee
      uitwerking: |-
        $D_4$ is niet commutatief, $\Zn{8}$ wel.
    - opgave: |-
        $(\Zn{4}, \plusn)$ en $\bigl(\Zs{12}, \maaln\bigr)$
      antwoord: |-
        nee
      uitwerking: |-
        In $\Zs{12} = \{1, 5, 7, 11\}$ heeft elk element orde 1 of 2; in $\Zn{4}$ heeft 1 orde 4.
    - opgave: |-
        $(\Zn{6}, \plusn)$ en $\bigl(\Zs{9}, \maaln\bigr)$
      antwoord: |-
        ja
      uitwerking: |-
        $\Zs{9}$ heeft 6 elementen en is cyclisch met voortbrenger 2. Elke cyclische groep met 6 elementen is isomorf met $\Zn{6}$.
    - opgave: |-
        $(\Zn{5}, \plusn)$ en de draaiingen van de regelmatige vijfhoek
      antwoord: |-
        ja
      uitwerking: |-
        Beide zijn cyclisch met 5 elementen; $k \mapsto r^k$ is een isomorfisme.

- id: h3-cyclisch
  soort: kort
  opgave: |-
    Geef een isomorfisme.
  lijst: enumerate
  delen:
    - opgave: |-
        van $(\Zn{10}, \plusn)$ naar $\bigl(\Zs{11}, \maaln\bigr)$. Wat is het beeld van 3?
      antwoord: |-
        $f(k) = 2^k$; $f(3) = 8$
      uitwerking: |-
        2 is een voortbrenger van $\Zs{11}$ (hoofdstuk 1). Ook $6$, $7$ en $8$ zijn voortbrengers en geven andere isomorfismen.
    - opgave: |-
        van de draaiingen van de regelmatige achthoek naar $(\Zn{8}, \plusn)$
      antwoord: |-
        $r^k \mapsto k$
      uitwerking: |-
        Met $r$ de draaiing over $45^\circ$: $r^k \circ r^l = r^{k \plusn l}$ omdat $r^8 = e$.

- id: h3-product
  soort: kort
  opgave: |-
    Rekenen in een product van groepen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\Zn{2} \times \Zn{4}$ niet cyclisch is.
      antwoord: |-
        geen element van orde 8
      uitwerking: |-
        Voor elk koppel is $4 \cdot (a, b) = (4a, 4b) = (0, 0)$: elke orde deelt 4.
    - opgave: |-
        Is $\Zn{3} \times \Zn{4}$ cyclisch?
      antwoord: |-
        ja, isomorf met $\Zn{12}$
      uitwerking: |-
        $k \cdot (1, 1) = (0, 0)$ als $3 \mid k$ en $4 \mid k$, dus voor het eerst bij $k = 12$.
    - opgave: |-
        Bepaal de orde van $(2, 3)$ in $\Zn{4} \times \Zn{6}$.
      antwoord: |-
        $2$
      uitwerking: |-
        $\ord(2) = 2$ in $\Zn{4}$ en $\ord(3) = 2$ in $\Zn{6}$: het kgv is 2.

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    morfisme of niet
  opgave: |-
    Is $f$ een groepsmorfisme? Verklaar kort.
  lijst: enumerate
  delen:
    - opgave: |-
        $f \colon (\R, +) \to (\R, +)$, \ $f(x) = -x$
      antwoord: |-
        ja
      uitwerking: |-
        $-(a + b) = (-a) + (-b)$.
    - opgave: |-
        $f \colon (\R, +) \to (\R, +)$, \ $f(x) = 2x + 3$
      antwoord: |-
        nee
      uitwerking: |-
        $f(0) = 3 \neq 0$: het neutraal element gaat niet naar het neutraal element.
    - opgave: |-
        $f \colon (\R_0, \cdot) \to (\R_0, \cdot)$, \ $f(x) = \tfrac1x$
      antwoord: |-
        ja
      uitwerking: |-
        $\frac{1}{ab} = \frac1a \cdot \frac1b$.
    - opgave: |-
        $f \colon (\R_0, \cdot) \to (\R_0, \cdot)$, \ $f(x) = 2x$
      antwoord: |-
        nee
      uitwerking: |-
        $f(1) = 2 \neq 1$.
    - opgave: |-
        $f \colon (\Zn{6}, \plusn) \to (\Zn{3}, \plusn)$, $f(k)$ is de rest van $k$ bij deling door 3
      antwoord: |-
        ja
      uitwerking: |-
        $k \plusn l$ verschilt 0 of 6 van $k + l$, en 6 is een veelvoud van 3: de rest bij deling door 3 is dezelfde.
    - opgave: |-
        $f \colon (\Zn{6}, \plusn) \to (\Zn{4}, \plusn)$, $f(k)$ is de rest van $k$ bij deling door 4
      antwoord: |-
        nee
      uitwerking: |-
        $f(3 \plusn 3) = f(0) = 0$, maar $f(3) \plusn f(3) = 3 \plusn 3 = 2$.
    - opgave: |-
        $f \colon (\R, +) \to (\C_0, \cdot)$, \ $f(x) = \cos x + i \sin x$
      antwoord: |-
        ja
      uitwerking: |-
        Bij een product van complexe getallen in goniometrische vorm tel je de argumenten op: $f(a) \cdot f(b) = \cos(a + b) + i \sin(a + b)$.
    - opgave: |-
        $f \colon S_3 \to \bigl(\{1, -1\}, \cdot\bigr)$, \ $f(\sigma) = 1$ voor elke $\sigma$
      antwoord: |-
        ja
      uitwerking: |-
        $1 = 1 \cdot 1$. Elk element gaat naar het neutraal element: de kern is de hele groep.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    beelden en kern met een voortbrenger
  opgave: |-
    Een morfisme vanuit $(\Z, +)$ ligt vast door het beeld van 1.
  lijst: enumerate
  delen:
    - opgave: |-
        $f \colon (\Z, +) \to (\Zn{12}, \plusn)$ met $f(1) = 8$. Bereken $f(3)$, $f(-1)$ en $f(5)$, en bepaal de kern en de verzameling van de beelden.
      antwoord: |-
        $0$, $4$, $4$; \ $\ker f = 3\Z$; beelden $\{0, 4, 8\}$
      uitwerking: |-
        $f(k)$ is de rest van $8k$: $24 \to 0$, $-8 \to 4$, $40 \to 4$. $8k$ is een veelvoud van 12 als $3 \mid k$.
    - opgave: |-
        $g \colon (\Z, +) \to D_4$ met $g(1) = r$, de kwartdraai. Bereken $g(6)$ en $g(-3)$, en bepaal de kern.
      antwoord: |-
        $r^2$, $r$; \ $\ker g = 4\Z$
      uitwerking: |-
        $g(k) = r^k$ en $\ord(r) = 4$: $r^6 = r^2$ en $r^{-3} = r$.
    - opgave: |-
        Toon aan: voor elk morfisme is $f(e) = e'$ en $f(a^{-1}) = f(a)^{-1}$. Leid er de rekenregels $\log 1 = 0$ en $\log \frac1x = -\log x$ uit af.
      antwoord: |-
        $\log$ is een morfisme van $(\R^+_0, \cdot)$ naar $(\R, +)$
      uitwerking: |-
        Zie de stellingen over het neutraal element en de inverse. Het neutraal element 1 gaat naar 0, de inverse $\frac1x$ naar de tegengestelde $-\log x$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    isomorf of niet
  opgave: |-
    Zijn de groepen isomorf? Geef een isomorfisme of een reden waarom niet.
  lijst: enumerate
  delen:
    - opgave: |-
        $\bigl(\Zs{10}, \maaln\bigr)$ en $(\Zn{4}, \plusn)$
      antwoord: |-
        ja, $k \mapsto 3^k$
      uitwerking: |-
        $3^0, 3^1, 3^2, 3^3 = 1, 3, 9, 7$: 3 is een voortbrenger.
    - opgave: |-
        $\bigl(\Zs{8}, \maaln\bigr)$ en de symmetriegroep van de rechthoek
      antwoord: |-
        ja
      uitwerking: |-
        In beide is elk element zijn eigen inverse en geeft het product van twee verschillende elementen ($\neq e$) het derde: $3 \mapsto h$, $5 \mapsto v$, $7 \mapsto d$ (want $3 \maaln 5 = 7$).
    - opgave: |-
        $\bigl(\Zs{9}, \maaln\bigr)$ en $S_3$
      antwoord: |-
        nee
      uitwerking: |-
        $\Zs{9}$ is commutatief, $S_3$ niet.
    - opgave: |-
        $(\Z, +)$ en $(3\Z, +)$
      antwoord: |-
        ja, $k \mapsto 3k$
      uitwerking: |-
        Een morfisme en een bijectie.
    - opgave: |-
        $\bigl(\Zs{15}, \maaln\bigr)$ en $(\Zn{8}, \plusn)$
      antwoord: |-
        nee
      uitwerking: |-
        $\Zs{15}$ heeft geen element van orde 8 (de ordes zijn 1, 2 en 4).
    - opgave: |-
        $\Zn{2} \times \Zn{3}$ en $\Zn{6}$
      antwoord: |-
        ja
      uitwerking: |-
        $(1, 1)$ heeft orde 6: de groep is cyclisch met 6 elementen.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    kern en beelden
  opgave: |-
    Bepaal de kern en de verzameling van de beelden.
  lijst: enumerate
  delen:
    - opgave: |-
        $f \colon (\Zn{12}, \plusn) \to (\Zn{12}, \plusn)$, \ $f(k) = 3 \cdot k$
      antwoord: |-
        $\ker f = \{0, 4, 8\}$; beelden $\{0, 3, 6, 9\}$
      uitwerking: |-
        $3k$ is een veelvoud van 12 als $4 \mid k$. De beelden zijn de veelvouden van 3. Merk op: $12 = 3 \cdot 4$.
    - opgave: |-
        $f \colon (\Zn{8}, \plusn) \to (\Zn{8}, \plusn)$, \ $f(k) = 3 \cdot k$
      antwoord: |-
        $\ker f = \{0\}$; beelden: heel $\Zn{8}$
      uitwerking: |-
        $3k$ is alleen een veelvoud van 8 als $8 \mid k$. Injectief, dus ook bijectief: een isomorfisme van $\Zn{8}$ naar zichzelf.
    - opgave: |-
        $\det$, van de inverteerbare $2 \times 2$-matrices naar $(\R_0, \cdot)$
      antwoord: |-
        de matrices met determinant 1; beelden: heel $\R_0$
      uitwerking: |-
        $\det \begin{bmatrix} t & 0 \\ 0 & 1 \end{bmatrix} = t$, dus elk getal verschillend van 0 is een beeld.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    een isomorfisme opstellen met een voortbrenger
  opgave: |-
    Geef een isomorfisme vanuit $(\Zn{6}, \plusn)$, met de beelden van $0, 1, \ldots, 5$.
  lijst: enumerate
  delen:
    - opgave: |-
        naar $\bigl(\Zs{9}, \maaln\bigr)$
      antwoord: |-
        $k \mapsto 2^k$: $\ 1, 2, 4, 8, 7, 5$
      uitwerking: |-
        2 is een voortbrenger van $\Zs{9}$.
    - opgave: |-
        naar $\bigl(\Zs{14}, \maaln\bigr)$
      antwoord: |-
        $k \mapsto 3^k$: $\ 1, 3, 9, 13, 11, 5$
      uitwerking: |-
        3 is een voortbrenger van $\Zs{14}$ (hoofdstuk 1).
    - opgave: |-
        Hoeveel isomorfismen zijn er van $\Zn{6}$ naar $\Zs{9}$?
      antwoord: |-
        $2$
      uitwerking: |-
        Een isomorfisme stuurt de voortbrenger 1 naar een element van orde 6: 2 of 5. Daarmee ligt het vast.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    product van groepen
  opgave: |-
    Rekenen in een product van groepen.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de orde van elk element van $\Zn{2} \times \Zn{3}$.
      antwoord: |-
        $(0, 0)$: 1; $(1, 0)$: 2; $(0, 1), (0, 2)$: 3; $(1, 1), (1, 2)$: 6
      uitwerking: |-
        De orde van $(a, b)$ is het kgv van de ordes van $a$ en $b$.
    - opgave: |-
        Geef de orde van elk element van $\Zn{2} \times \Zn{4}$.
      antwoord: |-
        één van orde 1, drie van orde 2, vier van orde 4
      uitwerking: |-
        Orde 2: $(1, 0)$, $(0, 2)$, $(1, 2)$. Orde 4: $(0, 1)$, $(0, 3)$, $(1, 1)$, $(1, 3)$.
    - opgave: |-
        Toon aan dat $f(a, b) = 2^a \maaln 14^b$ een isomorfisme is van $\Zn{4} \times \Zn{2}$ naar $\bigl(\Zs{15}, \maaln\bigr)$.
      antwoord: |-
        morfisme en acht verschillende beelden
      uitwerking: |-
        $2^4 = 16 \to 1$ en $14^2 = 196 \to 1$, dus $f$ respecteert de optelling in elke plaats, en de groep is commutatief. De beelden zijn $1, 2, 4, 8$ en $14, 13, 11, 7$: alle acht elementen.

- id: h3-o7
  soort: opdracht
  niveau: 1
  thema: |-
    de rekenlat aflezen
  opgave: |-
    Op de rekenlat hieronder staat de 1 van de bovenste lat boven de 3 van de onderste.
    \figuren{\begin{tikzpicture}[x=.95cm,font=\scriptsize]
      \logschaal{0}{0}{8}{-1}
      \logschaal{3.817}{0}{8}{1}
      \draw[fel!85!black,thick] (3.817,-.7) -- (3.817,.7);
    \end{tikzpicture}}
  lijst: enumerate
  delen:
    - opgave: |-
        Welke getallen staan onder de 2 en onder de 3 van de bovenste lat?
      antwoord: |-
        $6$ en $9$
      uitwerking: |-
        Onder $x$ staat $3x$.
    - opgave: |-
        Waarom kun je met deze stand $3 \cdot 4$ niet aflezen? Hoe kan het wel, als je weet dat je nadien met 10 vermenigvuldigt?
      antwoord: |-
        12 valt buiten de lat; lees $1{,}2$ af
      uitwerking: |-
        Zet de 10 van de bovenste lat boven de 3: onder de 4 staat dan $\frac{3 \cdot 4}{10} = 1{,}2$, want $\log 3 + \log 4 - \log 10 = \log 1{,}2$.
    - opgave: |-
        Hoe deel je 8 door 2 met de rekenlat?
      antwoord: |-
        zet de 2 boven de 8 en lees onder de 1
      uitwerking: |-
        Afstanden aftrekken: $\log 8 - \log 2 = \log 4$.
    - opgave: |-
        Een rekenlat is 25 cm lang. Op welke afstand van het begin staan 2 en 7? Rond af op een tiende millimeter.
      antwoord: |-
        $7{,}53$ cm en $21{,}13$ cm
      uitwerking: |-
        $25 \log 2 \approx 7{,}526$ en $25 \log 7 \approx 21{,}127$.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten
  opgave: |-
    Wat is er fout? Verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        ``$f(x) = x + 1$ is een morfisme van $(\Z, +)$ naar $(\Z, +)$, want $f(a + b) = a + b + 1$.''
      antwoord: |-
        $f(a) + f(b) = a + b + 2$
      uitwerking: |-
        Je moet $f(a + b)$ vergelijken met $f(a) + f(b)$, en die verschillen 1.
    - opgave: |-
        ``$(\Zn{4}, \plusn)$ en de symmetriegroep van de rechthoek zijn isomorf, want ze hebben allebei 4 elementen en zijn allebei commutatief.''
      antwoord: |-
        niet isomorf: andere ordes
      uitwerking: |-
        $\Zn{4}$ heeft een element van orde 4, de rechthoek niet. Gelijke eigenschappen bewijzen niets; één verschil volstaat om het tegendeel te bewijzen.
    - opgave: |-
        ``$f \colon \Z \to \Zn{12}$, de rest bij deling door 12, is een isomorfisme, want elk element van $\Zn{12}$ is een beeld.''
      antwoord: |-
        niet injectief
      uitwerking: |-
        $\ker f = 12\Z \neq \{0\}$, bijvoorbeeld $f(0) = f(12)$.
    - opgave: |-
        ``Voor $f(x) = |x|$ op $(\R, +)$ is $f(1 + 2) = 3 = f(1) + f(2)$, dus $f$ is een morfisme.''
      antwoord: |-
        $f(1 + (-1)) = 0 \neq 2$
      uitwerking: |-
        De gelijkheid moet gelden voor alle koppels, niet voor één.
    - opgave: |-
        ``Een morfisme beeldt een element van orde 4 af op een element van orde 4.''
      antwoord: |-
        alleen bij een isomorfisme
      uitwerking: |-
        De rest bij deling door 2 is een morfisme van $\Zn{4}$ naar $\Zn{2}$, en 1 (orde 4) gaat naar 1 (orde 2).

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    morfismen tussen Zm en Zn
  opgave: |-
    Een morfisme $f$ vanuit $(\Zn{m}, \plusn)$ ligt vast door $x = f(1)$, want $f(k) = k \cdot x$.
  lijst: enumerate
  delen:
    - opgave: |-
        $f \colon \Zn{6} \to \Zn{4}$ is een morfisme. Toon aan dat $6x$ een veelvoud is van 4. Welke $x$ kunnen? Hoeveel morfismen zijn er?
      antwoord: |-
        $x = 0$ of $x = 2$; twee morfismen
      uitwerking: |-
        $0 = f(0) = f(6 \cdot 1) = 6 \cdot x$ in $\Zn{4}$. Van $0, 1, 2, 3$ geven alleen 0 en 2 een veelvoud van 4. (Omgekeerd geven ze ook echt een morfisme.)
    - opgave: |-
        Hoeveel morfismen zijn er van $\Zn{3}$ naar $\Zn{4}$?
      antwoord: |-
        één: $f(k) = 0$
      uitwerking: |-
        $3x$ moet een veelvoud zijn van 4, dus $x = 0$.
    - opgave: |-
        Hoeveel morfismen zijn er van $\Zn{4}$ naar zichzelf? Welke zijn isomorfismen?
      antwoord: |-
        vier; $x = 1$ en $x = 3$
      uitwerking: |-
        Elke $x$ werkt, want $4x$ is altijd een veelvoud van 4. Een isomorfisme stuurt 1 naar een voortbrenger.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    decibel
  opgave: |-
    In de geluidstechniek drukt men de versterking van een vermogen uit in decibel (dB): vermenigvuldigt een toestel het vermogen met de factor $x$, dan is de versterking $D(x) = 10 \log x$ dB.
  lijst: enumerate
  delen:
    - opgave: |-
        Een versterker vermenigvuldigt het vermogen met 100. Hoeveel dB is dat? En een kabel die het vermogen halveert?
      antwoord: |-
        $20$ dB en $-3{,}0$ dB
      uitwerking: |-
        $10 \log 100 = 20$ en $10 \log 0{,}5 \approx -3{,}01$.
    - opgave: |-
        Het signaal gaat door de versterker en daarna door twee zulke kabels. Bereken de totale factor en de versterking in dB, op twee manieren.
      antwoord: |-
        factor 25; ongeveer $14{,}0$ dB
      uitwerking: |-
        $100 \cdot 0{,}5 \cdot 0{,}5 = 25$ en $10 \log 25 \approx 13{,}98$. Of: $20 - 3{,}01 - 3{,}01 = 13{,}98$.
    - opgave: |-
        Tussen welke groepen is $D$ een isomorfisme? Waarom rekenen technici liever in dB?
      antwoord: |-
        van $(\R^+_0, \cdot)$ naar $(\R, +)$
      uitwerking: |-
        $D(xy) = D(x) + D(y)$, en $D$ is bijectief. Factoren vermenigvuldigen is moeilijker dan dB optellen, zoals bij de rekenlat.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    morfismen naar de eenheidswortels
  opgave: |-
    Neem $\omega = \cos 30^\circ + i \sin 30^\circ$, met $\omega^{12} = 1$, en $f \colon (\Zn{12}, \plusn) \to (\C_0, \cdot)$ met $f(k) = \omega^k$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom is $f$ een morfisme?
      antwoord: |-
        $\omega^{12} = 1$
      uitwerking: |-
        $k + l$ en $k \plusn l$ verschillen 0 of 12, en $\omega^{12} = 1$, dus $\omega^k \omega^l = \omega^{k \plusn l}$.
    - opgave: |-
        Bereken $f(4)$ in algebraïsche vorm. Bepaal de kern en de beelden.
      antwoord: |-
        $-\frac12 + \frac{\sqrt3}{2} i$; \ $\ker f = \{0\}$; de 12 twaalfde eenheidswortels
      uitwerking: |-
        $\omega^4 = \cos 120^\circ + i \sin 120^\circ$. $\ord(\omega) = 12$, dus alleen $k = 0$ geeft 1.
    - opgave: |-
        Doe hetzelfde voor $g(k) = i^k$. Waarom is $g$ een morfisme van $\Zn{12}$, maar geen morfisme van $\Zn{10}$?
      antwoord: |-
        $\ker g = \{0, 4, 8\}$; beelden $\{1, i, -1, -i\}$; $i^{10} \neq 1$
      uitwerking: |-
        $i^{12} = 1$, maar $i^{10} = -1$: in $\Zn{10}$ zou $g(9 \plusn 1) = g(0) = 1$ en $g(9) g(1) = i^{10} = -1$.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    isomorfismen tussen symmetriegroepen
  opgave: |-
    Geef telkens een isomorfisme.
  lijst: enumerate
  delen:
    - opgave: |-
        Van de draaiingen van het vierkant naar $\bigl(\{1, i, -1, -i\}, \cdot\bigr)$.
      antwoord: |-
        $r^k \mapsto i^k$
      uitwerking: |-
        Beide cyclisch met 4 elementen; de kwartdraai $r$ gaat naar $i$. Meetkundig: vermenigvuldigen met $i$ is een kwartdraai in het complexe vlak.
    - opgave: |-
        Van de symmetriegroep van de gelijkzijdige driehoek naar $S_3$. Geef het beeld van $r$ en van $s_1$.
      antwoord: |-
        $r \mapsto \cyc{1 & 2 & 3}$, $s_1 \mapsto \cyc{2 & 3}$
      uitwerking: |-
        Stuur elke symmetrie naar de permutatie van de plaatsen van de hoeken, zoals in Groepen, hoofdstuk 3: de hoek boven (1) gaat bij $r$ naar linksonder (2).
    - opgave: |-
        Van de symmetriegroep van een ruit (geen vierkant) naar $\Zn{2} \times \Zn{2}$.
      antwoord: |-
        $e \mapsto (0, 0)$, de twee spiegelingen naar $(1, 0)$ en $(0, 1)$, de halve draai naar $(1, 1)$
      uitwerking: |-
        De twee spiegelingen na elkaar geven de halve draai, en elk element is zijn eigen inverse, zoals bij de rechthoek.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    oneindige groepen
  opgave: |-
    Bij oneindige groepen gebeuren vreemde dingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $(\Z, +)$ isomorf is met zijn deelgroep $(5\Z, +)$.
      antwoord: |-
        $k \mapsto 5k$
      uitwerking: |-
        Een morfisme, injectief, en elk veelvoud van 5 is een beeld.
    - opgave: |-
        Waarom kan een eindige groep niet isomorf zijn met een deelgroep die kleiner is?
      antwoord: |-
        een bijectie bewaart het aantal elementen
      uitwerking: |-
        Een kleinere deelgroep heeft minder elementen.
    - opgave: |-
        Toon aan dat $(\Z, +)$ en $(\Q, +)$ niet isomorf zijn.
      antwoord: |-
        $\Z$ is cyclisch, $\Q$ niet
      uitwerking: |-
        Een isomorfisme stuurt een voortbrenger naar een voortbrenger (beeld van een macht), en $(\Q, +)$ heeft er geen (hoofdstuk 1, de opdracht over groepen die niet cyclisch zijn).

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    elementen van orde 2 tellen
  opgave: |-
    Een isomorfisme bewaart het aantal elementen van orde 2.
  lijst: enumerate
  delen:
    - opgave: |-
        Tel de elementen van orde 2 in $\Zs{5}$, $\Zs{8}$, $\Zs{10}$ en $\Zs{12}$.
      antwoord: |-
        $1$, $3$, $1$, $3$
      uitwerking: |-
        $\Zs{5}$: alleen 4. $\Zs{8}$: 3, 5, 7. $\Zs{10}$: alleen 9. $\Zs{12}$: 5, 7, 11.
    - opgave: |-
        Welke van deze vier groepen zijn isomorf? Geef telkens een isomorfisme.
      antwoord: |-
        $\Zs{5} \isom \Zs{10}$ en $\Zs{8} \isom \Zs{12}$
      uitwerking: |-
        $\Zs{5}$ en $\Zs{10}$ zijn cyclisch met 4 elementen: $2^k \mapsto 3^k$. In $\Zs{8}$ en $\Zs{12}$ heeft elk element ($\neq 1$) orde 2: $3 \mapsto 5$, $5 \mapsto 7$, $7 \mapsto 11$ (want $3 \maaln 5 = 7$ en $5 \maaln 7 = 11$).

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    wanneer is een product cyclisch?
  opgave: |-
    We onderzoeken wanneer $\Zn{m} \times \Zn{n}$ cyclisch is.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de orde van $(1, 1)$ in $\Zn{10} \times \Zn{12}$. Is de groep cyclisch? (Vergelijk met de Chinese kalender in hoofdstuk 1.)
      antwoord: |-
        $60$; niet cyclisch
      uitwerking: |-
        $k(1, 1) = (0, 0)$ als $10 \mid k$ en $12 \mid k$: $\kgv(10, 12) = 60 < 120$. Elk element $(a, b)$ heeft $60 (a, b) = (0, 0)$, dus geen orde 120.
    - opgave: |-
        Toon aan: als $\ggd(m, n) = 1$, dan is $\Zn{m} \times \Zn{n} \isom \Zn{mn}$.
      antwoord: |-
        $\ord(1, 1) = \kgv(m, n) = mn$
      uitwerking: |-
        Zonder gemeenschappelijke deler is $\kgv(m, n) = mn$. De groep heeft $mn$ elementen en is dus cyclisch.
    - opgave: |-
        Is $\Zn{2} \times \Zn{2} \times \Zn{2}$ isomorf met $\Zn{4} \times \Zn{2}$?
      antwoord: |-
        nee
      uitwerking: |-
        In $\Zn{2} \times \Zn{2} \times \Zn{2}$ heeft elk element orde 1 of 2, in $\Zn{4} \times \Zn{2}$ heeft $(1, 0)$ orde 4.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    de beelden van een morfisme
  opgave: |-
    $f \colon G \to H$ is een groepsmorfisme. Noem $f(G) = \{f(a) \mid a \in G\}$ de verzameling van de beelden.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat $f(G)$ een deelgroep is van $H$.
      antwoord: |-
        met het kenmerk
      uitwerking: |-
        $e' = f(e) \in f(G)$. $f(a) \circ f(b) = f(a \ast b) \in f(G)$ en $f(a)^{-1} = f(a^{-1}) \in f(G)$.
    - opgave: |-
        $f$ is een morfisme van $(\Zn{8}, \plusn)$ naar $S_3$. Toon aan dat $f(G) = \vb{f(1)}$, en dat $f(G)$ 1 of 2 elementen heeft.
      antwoord: |-
        $|f(G)| = \ord\bigl(f(1)\bigr)$ deelt 8 en 6
      uitwerking: |-
        $f(k) = f(1)^k$, dus $f(G) = \vb{f(1)}$, met $\ord\bigl(f(1)\bigr)$ elementen. Uit $8 \cdot 1 = 0$ volgt $f(1)^8 = e$, dus de orde deelt 8. Ze deelt ook $|S_3| = 6$ (Lagrange). Gemeenschappelijke delers: 1 en 2.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    een morfisme kan de orde alleen kleiner maken
  opgave: |-
    $f \colon G \to H$ is een groepsmorfisme en $\ord(a) = n$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat $\ord\bigl(f(a)\bigr)$ een deler is van $n$.
      antwoord: |-
        $f(a)^n = f(a^n) = e'$
      uitwerking: |-
        Volgens hoofdstuk 1 deelt de orde van $f(a)$ elke $k$ met $f(a)^k = e'$, dus ook $n$.
    - opgave: |-
        Leid af dat er geen morfisme is van $\Zn{5}$ naar $S_3$ behalve $f(k) = e$.
      antwoord: |-
        $\ord(f(1))$ deelt 5 en 6
      uitwerking: |-
        De orde van $f(1)$ deelt 5 en (Lagrange) ook 6, dus is ze 1: $f(1) = e$ en $f(k) = e^k = e$.

- id: h3-o18
  soort: opdracht
  niveau: 3
  thema: |-
    het teken van een permutatie en de vijftienpuzzel
  opgave: |-
    Er bestaat een morfisme $\operatorname{sgn} \colon (S_n, \circ) \to \bigl(\{1, -1\}, \cdot\bigr)$, het \textit{teken}, met $\operatorname{sgn}(\tau) = -1$ voor elke verwisseling $\tau$ van twee getallen. Dat mag je aannemen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\cyc{1 & 2 & 3} = \cyc{1 & 3} \circ \cyc{1 & 2}$. Wat is het teken van een 3-cykel?
      antwoord: |-
        $+1$
      uitwerking: |-
        Eerst $\cyc{1 & 2}$: $1 \to 2 \to 2$, $2 \to 1 \to 3$, $3 \to 3 \to 1$. Teken: $(-1) \cdot (-1) = 1$.
    - opgave: |-
        De kern van $\operatorname{sgn}$ heet $A_n$, de groep van de even permutaties. Hoeveel elementen heeft $A_n$ voor $n \geqslant 2$?
      antwoord: |-
        $\frac{n!}{2}$
      uitwerking: |-
        Neem $\tau = \cyc{1 & 2}$. De functie $\sigma \mapsto \sigma \circ \tau$ stuurt elke even permutatie naar een oneven, en omgekeerd, en is een bijectie (ze is haar eigen inverse, want $\tau \circ \tau = e$). Er zijn dus evenveel even als oneven permutaties: $\frac{n!}{2}$. Bij de tetraëder van hoofdstuk 2 waren de 12 draaiingen precies $A_4$.
    - opgave: |-
        In de vijftienpuzzel schuif je telkens een tegel naar het lege vak. Zo'n zet verwisselt de tegel en het lege vak. Leg uit waarom je na een even aantal zetten het lege vak terug rechtsonder hebt, als het daar begon.
      antwoord: |-
        elke zet beweegt het lege vak één vak horizontaal of verticaal
      uitwerking: |-
        Kleur de vakjes als een schaakbord: elke zet brengt het lege vak naar een vakje van de andere kleur. Terug op het begin is dus na een even aantal zetten.
    - opgave: |-
        Leid af dat je vanuit de beginstand met de tegels 14 en 15 verwisseld (en het lege vak rechtsonder) nooit de beginstand bereikt.
      antwoord: |-
        teken $-1$ tegenover teken $+1$
      uitwerking: |-
        Een reeks zetten met het lege vak terug op zijn plaats is een product van een even aantal verwisselingen: teken $+1$. De verwisseling van 14 en 15 heeft teken $-1$. Dat bewees men al in 1879, toen de puzzel een rage was.

- id: h3-o19
  soort: opdracht
  niveau: 3
  thema: |-
    de groepen met 6 elementen
  opgave: |-
    $G$ is een groep met 6 elementen die niet cyclisch is. We bewijzen dat $G \isom S_3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $G$ een element $a$ van orde 3 heeft. Stel dat niet: elk element $\neq e$ heeft dan orde 2 (waarom?). Kies $x \neq y$, allebei $\neq e$, en toon dat $\{e, x, y, x \ast y\}$ een deelgroep is.
      antwoord: |-
        een deelgroep met 4 elementen kan niet (Lagrange)
      uitwerking: |-
        De ordes delen 6 en zijn niet 6: 1, 2 of 3. Hebben alle elementen $\neq e$ orde 2, dan is $G$ commutatief (zoals in hoofdstuk 2, bij de groepen met 4 elementen), en $\{e, x, y, xy\}$ is gesloten. Maar 4 deelt 6 niet.
    - opgave: |-
        $G$ heeft ook een element $b$ van orde 2 (opdracht \ref{oef:h2-o19}). Toon aan dat $G = \{e, a, a^2, b, a \ast b, a^2 \ast b\}$.
      antwoord: |-
        zes verschillende elementen
      uitwerking: |-
        $\vb{a} = \{e, a, a^2\}$, en $b \notin \vb{a}$, want de elementen van $\vb{a}$ hebben orde 1 of 3. Uit $a^i \ast b = a^j$ volgt $b = a^{j - i} \in \vb{a}$, en uit $a^i \ast b = a^j \ast b$ volgt $a^i = a^j$ (schrappen). De zes elementen zijn dus verschillend, en $G$ heeft er maar zes.
    - opgave: |-
        Toon aan dat $b \ast a = a^2 \ast b$. Bekijk welke van de zes elementen $b \ast a$ kan zijn, en sluit $b \ast a = a \ast b$ uit.
      antwoord: |-
        anders is $a \ast b$ van orde 6
      uitwerking: |-
        $b \ast a$ is niet $e, a, a^2$ (dan was $b \in \vb{a}$) en niet $b$ (dan was $a = e$). Is $b \ast a = a \ast b$, dan heeft $a \ast b$ orde $3 \cdot 2 = 6$ (zie hoofdstuk 1, de orde van een product van wisselende elementen), en dan is $G$ cyclisch. Dus $b \ast a = a^2 \ast b$.
    - opgave: |-
        Besluit: met $a \mapsto r$ en $b \mapsto s_1$ krijg je een isomorfisme naar de symmetriegroep van de driehoek, dus naar $S_3$.
      antwoord: |-
        dezelfde rekenregels
      uitwerking: |-
        In de driehoek is $r^3 = e$, $s_1^2 = e$ en $s_1 \circ r = r^2 \circ s_1$. Met deze drie regels kun je elk product in beide groepen herleiden tot de vorm $a^i b^j$: de tabellen zijn gelijk.

- id: h3-o20
  soort: opdracht
  niveau: 3
  thema: |-
    de isomorfismen van Zn naar zichzelf
  opgave: |-
    We zoeken alle isomorfismen van $(\Zn{n}, \plusn)$ naar zichzelf.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $f(k) = m \cdot k$ (vermenigvuldigen modulo $n$) een morfisme is voor elke $m \in \Zn{n}$, en dat elk morfisme van die vorm is.
      antwoord: |-
        $m = f(1)$
      uitwerking: |-
        $m(k + l) = mk + ml$, en de rest nemen mag op het einde. Omgekeerd is $f(k) = f(k \cdot 1) = k \cdot f(1)$.
    - opgave: |-
        Wanneer is $f$ een isomorfisme? Hoeveel zijn er?
      antwoord: |-
        als $\ggd(m, n) = 1$; er zijn er $\varphi(n)$
      uitwerking: |-
        $f$ is bijectief als 1 naar een voortbrenger gaat: $f(G) = \vb{m}$ is dan heel $\Zn{n}$.
    - opgave: |-
        Geef alle isomorfismen van $\Zn{8}$ naar zichzelf. Toon aan dat ze met de samenstelling een groep vormen die isomorf is met $\Zs{8}$.
      antwoord: |-
        $k \mapsto k, \ 3k, \ 5k, \ 7k$
      uitwerking: |-
        Samenstellen van $k \mapsto mk$ en $k \mapsto m'k$ geeft $k \mapsto mm'k$: de factoren vermenigvuldigen zich modulo 8, zoals in $\Zs{8}$.

- id: h3-o21
  soort: opdracht
  niveau: 3
  thema: |-
    twee groepen van rationale getallen
  opgave: |-
    Zijn $(\Q, +)$ en $(\Q^+_0, \cdot)$ isomorf, zoals $(\R, +)$ en $(\R^+_0, \cdot)$?
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: in $(\Q, +)$ is elk element van de vorm $y + y$.
      antwoord: |-
        $x = \tfrac x2 + \tfrac x2$
      uitwerking: |-
        $\frac x2$ is rationaal.
    - opgave: |-
        Stel dat $f \colon (\Q, +) \to (\Q^+_0, \cdot)$ een isomorfisme is, en $f(x) = 2$. Toon aan dat 2 dan het kwadraat is van een positief rationaal getal. Besluit.
      antwoord: |-
        $2 = f(\tfrac x2)^2$, maar $\sqrt2$ is irrationaal
      uitwerking: |-
        $2 = f\bigl(\frac x2 + \frac x2\bigr) = f\bigl(\frac x2\bigr)^2$. Dan is $\sqrt2 = f\bigl(\frac x2\bigr)$ rationaal: tegenspraak. De groepen zijn niet isomorf.

- id: h3-o22
  soort: opdracht
  niveau: 3
  thema: |-
    kern en nevenklassen
  opgave: |-
    $f \colon G \to H$ is een groepsmorfisme, $G$ is eindig en $K = \ker f$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs: $f(a) = f(b) \iff b \in a \ast K$.
      antwoord: |-
        $f(a^{-1} \ast b) = e'$
      uitwerking: |-
        $f(a) = f(b) \iff f(a)^{-1} \circ f(b) = e' \iff f(a^{-1} \ast b) = e' \iff a^{-1} \ast b \in K \iff b \in a \ast K$.
    - opgave: |-
        Leid af dat $|G| = |K| \cdot |f(G)|$.
      antwoord: |-
        één nevenklasse per beeld
      uitwerking: |-
        De elementen met hetzelfde beeld vormen één nevenklasse van $K$. Er zijn dus evenveel nevenklassen als beelden, en volgens Lagrange is $|G| = [G : K] \cdot |K|$.
    - opgave: |-
        Controleer met $f \colon \Zn{12} \to \Zn{4}$ (de rest bij deling door 4) en met $\operatorname{sgn} \colon S_3 \to \{1, -1\}$.
      antwoord: |-
        $12 = 3 \cdot 4$ en $6 = 3 \cdot 2$
      uitwerking: |-
        $\ker f = \{0, 4, 8\}$ en vier beelden. De kern van $\operatorname{sgn}$ bevat $e$ en de twee 3-cykels, met twee beelden.

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  thema: |-
    exponentiële functies als isomorfisme
  koppel:
    rubriek: analyse
    onderwerp: |-
      Exponentiële en logaritmische functies
  figuur:
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.3cm,font=\scriptsize]
        \draw[black!14,very thin] (-2,0) grid (3,8);
        \draw[->,grijs] (-2.3,0) -- (3.5,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,-.3) -- (0,8.6) node[above,text=black] {$y$};
        \foreach \t in {-2,-1,1,2,3}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {2,4,6,8}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \draw[accent,thick] plot[domain=-2.2:3,samples=60,smooth] (\x,{2^\x});
        \fill[fel!85!black] (1,2) circle (2pt) (2,4) circle (2pt) (3,8) circle (2pt);
      \end{tikzpicture}
  opgave: |-
    De grafiek toont $f(x) = 2^x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af en controleer: $f(1 + 2) = f(1) \cdot f(2)$. Tussen welke groepen is $f$ een morfisme?
      antwoord: |-
        $8 = 2 \cdot 4$; van $(\R, +)$ naar $(\R^+_0, \cdot)$
      uitwerking: |-
        $2^{a + b} = 2^a \cdot 2^b$.
    - opgave: |-
        Waarom is $f$ een isomorfisme? Wat is het inverse isomorfisme?
      antwoord: |-
        $f$ is bijectief; $\log_2$
      uitwerking: |-
        Elke horizontale rechte $y = c$ met $c > 0$ snijdt de grafiek precies één keer. Het inverse isomorfisme is $\log_2$, met $\log_2(xy) = \log_2 x + \log_2 y$.
    - opgave: |-
        Toon aan dat $b^x$ een isomorfisme is van $(\R, +)$ naar $(\R^+_0, \cdot)$ voor elke $b > 0$ met $b \neq 1$. Waarom niet voor $b = 1$?
      antwoord: |-
        voor $b = 1$ niet injectief
      uitwerking: |-
        $b^{x + y} = b^x b^y$, en $b^x$ is strikt monotoon met alle positieve waarden. Voor $b = 1$ is $1^x = 1$: de kern is heel $\R$.
    - opgave: |-
        Op een rekenlat van 25 cm staat 2 op $7{,}53$ cm en 7 op $21{,}13$ cm. Kun je $2 \cdot 7$ aflezen?
      antwoord: |-
        nee, $28{,}66 > 25$
      uitwerking: |-
        De som van de afstanden valt buiten de lat. Gebruik de 10 van de bovenste lat: je leest $1{,}4$ af.

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  thema: |-
    draaien in het complexe vlak
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    Neem $f \colon (\R, +) \to (\C_0, \cdot)$ met $f(\theta) = \cos \theta + i \sin \theta$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon met de regel voor het product in goniometrische vorm aan dat $f$ een morfisme is.
      antwoord: |-
        argumenten optellen
      uitwerking: |-
        Bij een product vermenigvuldig je de moduli (hier 1) en tel je de argumenten op: $f(\alpha) f(\beta) = f(\alpha + \beta)$.
    - opgave: |-
        Bepaal de kern en de verzameling van de beelden.
      antwoord: |-
        $\ker f = \{2k\pi \mid k \in \Z\}$; de eenheidscirkel
      uitwerking: |-
        $\cos \theta + i \sin \theta = 1 \iff \theta$ is een veelvoud van $2\pi$. De beelden hebben modulus 1.
    - opgave: |-
        Bereken $f\bigl(\frac{\pi}{3}\bigr)^6$ met de eigenschappen van een morfisme.
      antwoord: |-
        $1$
      uitwerking: |-
        $f\bigl(\frac\pi3\bigr)^6 = f(2\pi) = 1$.

- id: h3-koppel-3
  soort: koppel
  niveau: 3
  thema: |-
    complexe getallen als matrices
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Bij $z = a + bi$ hoort de matrix $M(z) = \begin{bmatrix} a & -b \\ b & a \end{bmatrix}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $M(z) \cdot M(w) = M(zw)$, met $w = c + di$.
      antwoord: |-
        beide geven $\begin{bmatrix} ac - bd & -(ad + bc) \\ ad + bc & ac - bd \end{bmatrix}$
      uitwerking: |-
        $zw = (ac - bd) + (ad + bc)i$, en het matrixproduct geeft dezelfde elementen.
    - opgave: |-
        Bereken $\det M(z)$. Leid af dat $M$ een injectief morfisme is van $(\C_0, \cdot)$ naar de inverteerbare $2 \times 2$-matrices.
      antwoord: |-
        $\det M(z) = a^2 + b^2 = |z|^2$
      uitwerking: |-
        Voor $z \neq 0$ is de determinant niet 0, dus $M(z)$ is inverteerbaar. De kern bevat alleen $z$ met $M(z) = I$, dus $a = 1$, $b = 0$: $z = 1$.
    - opgave: |-
        Bereken $M(i)$ en $M(i)^2$. Welke transformatie van het vlak is $M(i)$?
      antwoord: |-
        $\begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$; $M(i)^2 = -I$; een kwartdraai
      uitwerking: |-
        $M(i)^2 = M(i^2) = M(-1) = -I$. De matrix stuurt $(1, 0)$ naar $(0, 1)$: de draaiing over $90^\circ$, net als vermenigvuldigen met $i$.

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    morfisme of niet
  opgave: |-
    Is $f$ een groepsmorfisme?
  lijst: enumerate
  delen:
    - opgave: |-
        $f \colon (\Z, +) \to (\Z, +)$, \ $f(x) = 4x$
      antwoord: |-
        ja
      uitwerking: |-
        $4(a + b) = 4a + 4b$.
    - opgave: |-
        $f \colon (\R, +) \to (\R, +)$, \ $f(x) = x^3$
      antwoord: |-
        nee
      uitwerking: |-
        $f(1 + 1) = 8 \neq 2 = f(1) + f(1)$.
    - opgave: |-
        $f \colon (\R_0, \cdot) \to (\R_0, \cdot)$, \ $f(x) = x^3$
      antwoord: |-
        ja
      uitwerking: |-
        $(ab)^3 = a^3 b^3$.

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    beelden van een morfisme
  opgave: |-
    $f \colon (\Z, +) \to \bigl(\Zs{5}, \maaln\bigr)$ is een morfisme met $f(1) = 2$. Bereken $f(0)$, $f(3)$ en $f(-1)$, en bepaal de kern.
  antwoord: |-
    $1$, $3$, $3$; \ $\ker f = 4\Z$
  uitwerking: |-
    $f(k) = 2^k$ en $\ord(2) = 4$: $2^3 = 8 \to 3$ en $2^{-1} = 2^3 = 3$.

- id: h3-t3
  soort: test
  niveau: 1
  thema: |-
    kern
  opgave: |-
    Bepaal de kern van $f \colon (\Zn{10}, \plusn) \to (\Zn{2}, \plusn)$, met $f(k)$ de rest van $k$ bij deling door 2. Is $f$ injectief?
  antwoord: |-
    $\{0, 2, 4, 6, 8\}$; nee
  uitwerking: |-
    De even getallen hebben rest 0. De kern is niet $\{0\}$.

- id: h3-t4
  soort: test
  niveau: 1
  thema: |-
    een isomorfisme
  opgave: |-
    Toon aan dat $f \colon (\Zn{4}, \plusn) \to \bigl(\Zs{10}, \maaln\bigr)$ met $f(k) = 3^k$ een isomorfisme is.
  antwoord: |-
    $f(0), \ldots, f(3) = 1, 3, 9, 7$
  uitwerking: |-
    Vier verschillende beelden: bijectief. $3^4 = 81 \to 1$, dus $3^{k + l} = 3^{k \plusn l}$: een morfisme.

- id: h3-t5
  soort: test
  niveau: 1
  thema: |-
    isomorf of niet
  opgave: |-
    Zijn de groepen isomorf? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        $(\Zn{4}, \plusn)$ en $\bigl(\Zs{8}, \maaln\bigr)$
      antwoord: |-
        nee
      uitwerking: |-
        $\Zs{8}$ heeft geen element van orde 4.
    - opgave: |-
        $(\Zn{6}, \plusn)$ en $D_3$
      antwoord: |-
        nee
      uitwerking: |-
        $D_3$ is niet commutatief.
    - opgave: |-
        $(\Zn{6}, \plusn)$ en $\bigl(\Zs{14}, \maaln\bigr)$
      antwoord: |-
        ja
      uitwerking: |-
        $\Zs{14}$ is cyclisch met 6 elementen (voortbrenger 3).

- id: h3-t6
  soort: test
  niveau: 1
  thema: |-
    eigenschappen van een morfisme
  opgave: |-
    Leid uit de eigenschappen van een groepsmorfisme af dat $\log 1 = 0$, $\log \frac1x = -\log x$ en $\log x^5 = 5 \log x$.
  antwoord: |-
    beeld van $e$, van een inverse en van een macht
  uitwerking: |-
    $\log$ is een morfisme van $(\R^+_0, \cdot)$ naar $(\R, +)$. Het neutraal element 1 gaat naar 0, de inverse $\frac1x$ naar $-\log x$, en de macht $x^5$ naar $5 \cdot \log x$ (in additieve schrijfwijze).

- id: h3-t7
  soort: test
  niveau: 2
  thema: |-
    groepen van priemorde
  opgave: |-
    Waarom is elke groep met 7 elementen isomorf met $(\Zn{7}, \plusn)$? Geef een isomorfisme van $\Zn{7}$ naar de draaiingen van de regelmatige zevenhoek.
  antwoord: |-
    cyclisch, want 7 is priem; $k \mapsto r^k$
  uitwerking: |-
    Elk element $a \neq e$ heeft orde 7 (Lagrange), dus de groep is cyclisch, en elke cyclische groep met 7 elementen is isomorf met $\Zn{7}$. Met $r$ de draaiing over $\frac{360^\circ}{7}$.
