# Oefeningen van hoofdstuk 3. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        $\displaystyle\sum_{k=1}^{+\infty} \Bigl(\frac12\Bigr)^{\!k}$ en $\displaystyle\sum_{k=0}^{+\infty} 5 \cdot \Bigl(\frac{2}{5}\Bigr)^{\!k}$
      antwoord: |-
        1 en $\tfrac{25}{3}$
      uitwerking: |-
        Meetkundige reeksen: $\tfrac{1/2}{1 - 1/2} = 1$ en $\tfrac{5}{1 - 2/5} = \tfrac{25}{3}$.
    - opgave: |-
        de oppervlakte van een gelijkzijdige driehoek met zijde 4
      antwoord: |-
        $4\sqrt3 \approx 6{,}93$
      uitwerking: |-
        $\tfrac{\sqrt3}{4} \cdot 16 = 4\sqrt3$.
    - opgave: |-
        de oppervlakte van een figuur die je met factor 3 verkleint, als ze eerst oppervlakte 45 had
      antwoord: |-
        5
      uitwerking: |-
        Oppervlaktes worden met het kwadraat van de factor vermenigvuldigd: $\tfrac{45}{9} = 5$.
    - opgave: |-
        $x$ als $3^x = 10$
      antwoord: |-
        $x = \tfrac{\log 10}{\log 3} \approx 2{,}096$
      uitwerking: |-
        Neem de logaritme van beide leden: $x \log 3 = \log 10 = 1$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem een lijnstuk van 9 cm. Verdeel het in drie gelijke stukken, haal het middelste stuk weg en vervang het door twee lijnstukken van 3 cm die met het weggehaalde stuk een gelijkzijdige driehoek vormen.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken het resultaat. Hoeveel lijnstukken zijn er, hoe lang is elk, en hoe lang is de figuur?
      antwoord: |-
        4 lijnstukken van 3 cm: 12 cm
      uitwerking: |-
        Een lijnstuk met een puntige bult in het midden: $4 \cdot 3 = 12$ cm.
    - opgave: |-
        Doe hetzelfde met elk van de vier lijnstukken. Hoe lang is de figuur nu?
      antwoord: |-
        16 lijnstukken van 1 cm: 16 cm
      uitwerking: |-
        Elk lijnstuk van 3 cm wordt 4 cm: $4 \cdot 4 = 16$ cm.
    - opgave: |-
        Met welke factor wordt de lengte bij elke stap vermenigvuldigd? Hoe lang wordt de figuur na tien stappen?
      antwoord: |-
        $\tfrac43$; ongeveer 160 cm
      uitwerking: |-
        $9 \cdot \bigl(\tfrac43\bigr)^{10} \approx 159{,}8$ cm, terwijl de figuur nog altijd minder dan 9 cm breed is.

- id: h3-koch
  soort: kort
  opgave: |-
    Een Koch-kromme vertrekt van een lijnstuk van 81 mm.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel lijnstukken heeft de figuur na 4 stappen, hoe lang is elk, en hoe lang is de figuur?
      antwoord: |-
        256 lijnstukken van 1 mm: 256 mm
      uitwerking: |-
        $4^4 = 256$ lijnstukken van $\tfrac{81}{3^4} = 1$ mm.
    - opgave: |-
        Na hoeveel stappen is de figuur langer dan 10 m?
      antwoord: |-
        na 17 stappen
      uitwerking: |-
        $81 \cdot \bigl(\tfrac43\bigr)^n > 10\,000$ geeft $n > \tfrac{\ln(10\,000/81)}{\ln(4/3)} \approx 16{,}7$.

- id: h3-sneeuwvlok
  soort: kort
  opgave: |-
    De eerste driehoek van een sneeuwvlok van Koch heeft zijde 3 cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de omtrek na 1, 2 en 3 stappen.
      antwoord: |-
        12 cm; 16 cm; $\tfrac{64}{3} \approx 21{,}3$ cm
      uitwerking: |-
        De omtrek begint bij 9 cm en wordt bij elke stap met $\tfrac43$ vermenigvuldigd.
    - opgave: |-
        Welke oppervlakte nadert de sneeuwvlok?
      antwoord: |-
        $\tfrac{18\sqrt3}{5} \approx 6{,}24$ cm\textsuperscript{2}
      uitwerking: |-
        $A_0 = \tfrac{\sqrt3}{4} \cdot 9 \approx 3{,}90$ cm\textsuperscript{2}, en $\tfrac85 A_0 = \tfrac{18\sqrt3}{5} \approx 6{,}24$ cm\textsuperscript{2}.

- id: h3-sierpinski
  soort: kort
  opgave: |-
    Een driehoek met zijde 16 cm wordt uitgehold tot een driehoek van Sierpiński. Hoeveel driehoekjes zijn er na 4 stappen, hoe groot is hun zijde, en welk deel van de oppervlakte blijft over?
  antwoord: |-
    81 driehoekjes met zijde 1 cm; $\bigl(\tfrac34\bigr)^4 \approx 0{,}316$
  uitwerking: |-
    $3^4 = 81$ driehoekjes met zijde $\tfrac{16}{2^4} = 1$ cm. Er blijft $\tfrac{81}{256} \approx 31{,}6\,\%$ over.

- id: h3-cantor
  soort: kort
  opgave: |-
    Bekijk de Cantorverzameling.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang zijn de stukken die in stap 3 weggehaald worden, samen?
      antwoord: |-
        $\tfrac{4}{27}$
      uitwerking: |-
        In stap 3 zijn er $2^2 = 4$ intervallen met lengte $\tfrac19$, en uit elk gaat $\tfrac{1}{27}$ weg.
    - opgave: |-
        Ligt $\tfrac{2}{9}$ in de Cantorverzameling? En $\tfrac{1}{2}$?
      antwoord: |-
        $\tfrac29$ wel; $\tfrac12$ niet
      uitwerking: |-
        $\tfrac29$ is een eindpunt van het interval $[\tfrac29, \tfrac13]$ na stap 2, en wordt nooit weggehaald. $\tfrac12$ ligt in het middelste derde $\left]\tfrac13, \tfrac23\right[$, dat in stap 1 weggaat.

- id: h3-dimensie
  soort: kort
  opgave: |-
    Een zelfgelijkvormige figuur bestaat uit $N$ kopieën van zichzelf, elk $s$ keer kleiner. Bereken de dimensie.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $N = 5$, $s = 3$
      antwoord: |-
        $1{,}465$
      uitwerking: |-
        $\tfrac{\log 5}{\log 3}$.
    - opgave: |-
        $N = 20$, $s = 3$
      antwoord: |-
        $2{,}727$
      uitwerking: |-
        $\tfrac{\log 20}{\log 3}$.
    - opgave: |-
        $N = 8$, $s = 4$
      antwoord: |-
        $1{,}5$
      uitwerking: |-
        $\tfrac{\log 8}{\log 4} = \tfrac{3\log 2}{2\log 2} = \tfrac32$.
    - opgave: |-
        $N = 16$, $s = 4$
      antwoord: |-
        2
      uitwerking: |-
        $16 = 4^2$: zoals een vierkant.

- id: h3-meten
  soort: kort
  opgave: |-
    Een kustlijn heeft dimensie $D = 1{,}3$, zodat $L(\varepsilon) = C\,\varepsilon^{\,1 - D}$. Met een lat van 1 km meet je 200 km. Wat meet je met een lat van 100 m?
  antwoord: |-
    ongeveer 399 km
  uitwerking: |-
    De lat wordt 10 keer korter, dus de lengte wordt $10^{D - 1} = 10^{0{,}3} \approx 1{,}995$ keer groter: ongeveer 399 km.

- id: h3-transformaties
  soort: kort
  opgave: |-
    Neem $A_1(0, 0)$, $A_2(8, 0)$, $A_3(0, 8)$ en $T_i(P) = \tfrac12(P + A_i)$. Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $T_2(4, 2)$
      antwoord: |-
        $(6, 1)$
      uitwerking: |-
        $\tfrac12(4 + 8, 2 + 0)$.
    - opgave: |-
        $T_3(T_1(4, 2))$
      antwoord: |-
        $(1, 4{,}5)$
      uitwerking: |-
        $T_1(4, 2) = (2, 1)$ en $T_3(2, 1) = (1;\ 4{,}5)$.
    - opgave: |-
        het dekpunt van $T_2$
      antwoord: |-
        $(8, 0)$
      uitwerking: |-
        $\tfrac12(P + A_2) = P$ geeft $P = A_2$: het hoekpunt zelf.

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    Koch-kromme: aantal, lengte
  opgave: |-
    Een Koch-kromme vertrekt van een lijnstuk van 27 cm. Neem de tabel over en vul ze aan voor $n = 0$ tot 4.
    \begin{center}\begin{tabular}{|c|c|c|c|}\hline $n$ & aantal lijnstukken & lengte van een lijnstuk & lengte van de figuur \\ \hline 0 & 1 & 27 cm & 27 cm \\ \hline\end{tabular}\end{center}
  antwoord: |-
    $n = 1$: 4, 9 cm, 36 cm; $n = 2$: 16, 3 cm, 48 cm; $n = 3$: 64, 1 cm, 64 cm; $n = 4$: 256, $\tfrac13$ cm, $85\tfrac13$ cm
  uitwerking: |-
    Het aantal wordt telkens met 4 vermenigvuldigd, de lengte van een lijnstuk met $\tfrac13$, de lengte van de figuur met $\tfrac43$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    driehoek van Sierpinski: aantal, oppervlakte
  opgave: |-
    Een gelijkzijdige driehoek met zijde 6 cm wordt uitgehold tot een driehoek van Sierpiński.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de oppervlakte van de driehoek waarmee je begint.
      antwoord: |-
        $9\sqrt3 \approx 15{,}59$ cm\textsuperscript{2}
      uitwerking: |-
        $\tfrac{\sqrt3}{4} \cdot 36 = 9\sqrt3$.
    - opgave: |-
        Hoeveel driehoekjes zijn er na 4 stappen, en hoe groot is hun zijde?
      antwoord: |-
        81 met zijde $0{,}375$ cm
      uitwerking: |-
        $3^4 = 81$ en $\tfrac{6}{16} = 0{,}375$.
    - opgave: |-
        Hoeveel oppervlakte blijft er na 4 stappen over?
      antwoord: |-
        $\approx 4{,}93$ cm\textsuperscript{2}
      uitwerking: |-
        $\bigl(\tfrac34\bigr)^4 \cdot 9\sqrt3 \approx 0{,}3164 \cdot 15{,}59 \approx 4{,}93$.
    - opgave: |-
        Na hoeveel stappen blijft er minder dan 1 cm\textsuperscript{2} over?
      antwoord: |-
        na 10 stappen
      uitwerking: |-
        $\bigl(\tfrac34\bigr)^n \cdot 15{,}59 < 1$ geeft $n > \tfrac{\ln(1/15{,}59)}{\ln 0{,}75} \approx 9{,}55$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    gelijkvormigheidsdimensie
  opgave: |-
    Bepaal $N$ en $s$, en bereken de gelijkvormigheidsdimensie.
  lijst: enumerate
  delen:
    - opgave: |-
        Het tapijt van Sierpiński: verdeel een vierkant in 9 gelijke vierkanten, haal het middelste weg, en herhaal.
      antwoord: |-
        $N = 8$, $s = 3$, $D \approx 1{,}893$
      uitwerking: |-
        $\tfrac{\log 8}{\log 3} \approx 1{,}893$.
    - opgave: |-
        De Vicsek-fractaal: verdeel een vierkant in 9 gelijke vierkanten, houd alleen het middelste en de vier hoekvierkanten, en herhaal.
      antwoord: |-
        $N = 5$, $s = 3$, $D \approx 1{,}465$
      uitwerking: |-
        $\tfrac{\log 5}{\log 3} \approx 1{,}465$.
    - opgave: |-
        De spons van Menger: verdeel een kubus in 27 gelijke kubussen, haal de middelste en de zes kubussen in het midden van de zijvlakken weg, en herhaal.
      antwoord: |-
        $N = 20$, $s = 3$, $D \approx 2{,}727$
      uitwerking: |-
        Er blijven $27 - 7 = 20$ kubussen over: $\tfrac{\log 20}{\log 3} \approx 2{,}727$.
    - opgave: |-
        Een rechthoekige driehoek die je verdeelt in 4 gelijkvormige driehoeken met halve zijden (en die je allemaal houdt).
      antwoord: |-
        $N = 4$, $s = 2$, $D = 2$
      uitwerking: |-
        $\tfrac{\log 4}{\log 2} = 2$: een gewone vlakke figuur, geen fractaal.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    Cantorverzameling
  opgave: |-
    Bekijk de Cantorverzameling, die ontstaat uit $[0, 1]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de intervallen die na 2 stappen overblijven.
      antwoord: |-
        $[0, \tfrac19]$, $[\tfrac29, \tfrac13]$, $[\tfrac23, \tfrac79]$, $[\tfrac89, 1]$
      uitwerking: |-
        Uit $[0, \tfrac13]$ gaat $\left]\tfrac19, \tfrac29\right[$ weg, uit $[\tfrac23, 1]$ gaat $\left]\tfrac79, \tfrac89\right[$ weg.
    - opgave: |-
        Na hoeveel stappen is de totale lengte kleiner dan 0,01?
      antwoord: |-
        na 12 stappen
      uitwerking: |-
        $\bigl(\tfrac23\bigr)^n < 0{,}01$ geeft $n > \tfrac{\ln 0{,}01}{\ln(2/3)} \approx 11{,}36$.
    - opgave: |-
        Welke van deze getallen liggen in de Cantorverzameling: $\tfrac19$, $\tfrac{5}{9}$, $\tfrac{7}{27}$, $\tfrac{8}{9}$?
      antwoord: |-
        $\tfrac19$, $\tfrac{7}{27}$ en $\tfrac89$
      uitwerking: |-
        $\tfrac19$ en $\tfrac89$ zijn eindpunten na stap 2. $\tfrac59$ ligt in $\left]\tfrac13, \tfrac23\right[$. $\tfrac{7}{27}$: na stap 2 blijft $[\tfrac29, \tfrac13] = [\tfrac{6}{27}, \tfrac{9}{27}]$ over, en in stap 3 gaat daaruit $\left]\tfrac{7}{27}, \tfrac{8}{27}\right[$ weg: $\tfrac{7}{27}$ is een eindpunt dat blijft.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    begrippen, klassieke fouten
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Een figuur met een oneindig lange rand heeft een oneindig grote oppervlakte.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: de sneeuwvlok van Koch heeft een oneindig lange rand en oppervlakte $\tfrac85 A_0$.
    - opgave: |-
        Verklein je een vierkant met factor 2, dan heb je 2 kopieën nodig om het terug te vullen.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: 4, want de oppervlakte wordt 4 keer kleiner.
    - opgave: |-
        De driehoek van Sierpiński heeft oppervlakte 0, dus er blijft niets van over.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: alle hoekpunten en zijden van de driehoekjes blijven over.
    - opgave: |-
        Bij de gelijkvormigheidsdimensie mag je $\log$ of $\ln$ gebruiken.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $\tfrac{\ln N}{\ln s} = \tfrac{\log N}{\log s}$, want beide zijn $\log_s N$.
    - opgave: |-
        Bij de sneeuwvlok van Koch wordt de oppervlakte bij elke stap met $\tfrac43$ vermenigvuldigd.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: dat geldt voor de omtrek. Bij de oppervlakte komt er telkens iets bij, steeds minder.
    - opgave: |-
        Een figuur met dimensie 1,26 is groter dan een figuur met dimensie 1,1.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: de dimensie zegt niets over de grootte, wel over hoe snel het aantal details toeneemt als je inzoomt.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    tapijt van Sierpinski tekenen
  opgave: |-
    Het \textit{tapijt van Sierpiński} ontstaat uit een vierkant met zijde 1: verdeel het in 9 gelijke vierkanten en haal het middelste weg, en herhaal dat met elk overblijvend vierkant.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de figuur na 2 stappen op een rooster van $9 \times 9$ hokjes.
      antwoord: |-
        64 hokjes blijven gekleurd
      uitwerking: |-
        Het middelste blok van $3 \times 3$ hokjes en het middelste hokje van elk van de acht andere blokken zijn wit.

        \begin{tikzpicture}[scale=.3]
          \fill[accent] (0,0) rectangle (9,9);
          \fill[white] (3,3) rectangle (6,6);
          \foreach \a in {0,3,6}{\foreach \b in {0,3,6}{\fill[white] (\a+1,\b+1) rectangle (\a+2,\b+2);}}
          \draw[black!25,very thin] (0,0) grid (9,9);
        \end{tikzpicture}
    - opgave: |-
        Hoeveel vierkantjes zijn er na $n$ stappen, en welke oppervlakte hebben ze samen?
      antwoord: |-
        $8^n$, samen $\bigl(\tfrac89\bigr)^n$
      uitwerking: |-
        Elk vierkant wordt vervangen door 8 vierkanten met een negende van de oppervlakte.
    - opgave: |-
        Na hoeveel stappen is meer dan de helft van de oppervlakte weggehaald?
      antwoord: |-
        na 6 stappen
      uitwerking: |-
        $\bigl(\tfrac89\bigr)^n < \tfrac12$ geeft $n > \tfrac{\ln 0{,}5}{\ln(8/9)} \approx 5{,}88$.

- id: h3-o7
  soort: opdracht
  niveau: 1
  thema: |-
    omtrek van de sneeuwvlok
  opgave: |-
    De eerste driehoek van een sneeuwvlok van Koch heeft zijde 1 m.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel zijden heeft de sneeuwvlok na $n$ stappen, en hoe lang is elke zijde?
      antwoord: |-
        $3 \cdot 4^n$ zijden met lengte $\tfrac{1}{3^n}$ m
      uitwerking: |-
        Elke zijde wordt vervangen door 4 zijden die 3 keer korter zijn.
    - opgave: |-
        Na hoeveel stappen is de omtrek groter dan 100 m?
      antwoord: |-
        na 13 stappen
      uitwerking: |-
        $3\bigl(\tfrac43\bigr)^n > 100$ geeft $n > \tfrac{\ln(100/3)}{\ln(4/3)} \approx 12{,}2$.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    de sneeuwvlok naar binnen
  opgave: |-
    Maak een sneeuwvlok zoals die van Koch, maar zet de driehoekjes telkens naar binnen in plaats van naar buiten: je haalt ze weg. De eerste driehoek heeft oppervlakte $A_0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de omtrek dezelfde is als bij de gewone sneeuwvlok.
      antwoord: |-
        elke zijde wordt vervangen door 4 zijden van een derde
      uitwerking: |-
        Het driehoekje staat aan de andere kant, maar de vier lijnstukken zijn even lang: de omtrek wordt ook met $\tfrac43$ vermenigvuldigd.
    - opgave: |-
        Welke oppervlakte nadert de figuur?
      antwoord: |-
        $\tfrac25 A_0$
      uitwerking: |-
        Er gaat telkens evenveel af als er bij de gewone sneeuwvlok bijkomt: $A_0 - \tfrac13 \cdot \tfrac95 A_0 = \tfrac25 A_0$.
    - opgave: |-
        Hoeveel keer groter is de gewone sneeuwvlok dan deze?
      antwoord: |-
        4 keer
      uitwerking: |-
        $\tfrac{8/5}{2/5} = 4$.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    Koch-kromme met vierkante bulten
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \draw[accent,thick] (0,0) -- (3,0) -- (3,3) -- (6,3) -- (6,0) -- (9,0);
        \draw[grijs,dashed] (3,0) -- (6,0);
        \node[below] at (1.5,0) {$\tfrac13$};
      \end{tikzpicture}
  opgave: |-
    Een variant van de Koch-kromme vervangt elk lijnstuk door vijf lijnstukken van een derde zo lang, met een vierkante bult in het midden (figuur).
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de figuur na $n$ stappen, als het lijnstuk lengte 1 heeft?
      antwoord: |-
        $\bigl(\tfrac53\bigr)^n$
      uitwerking: |-
        5 lijnstukken van een derde: de lengte wordt met $\tfrac53$ vermenigvuldigd.
    - opgave: |-
        Na hoeveel stappen is de figuur 10 keer zo lang?
      antwoord: |-
        na 5 stappen
      uitwerking: |-
        $\bigl(\tfrac53\bigr)^n > 10$ geeft $n > \tfrac{\ln 10}{\ln(5/3)} \approx 4{,}5$.
    - opgave: |-
        Bereken de dimensie, en vergelijk met de gewone Koch-kromme.
      antwoord: |-
        $\tfrac{\log 5}{\log 3} \approx 1{,}465$, meer dan 1,262
      uitwerking: |-
        5 kopieën op een derde. De figuur vult het vlak meer dan de gewone Koch-kromme: bij elke stap komt er meer lengte bij.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    spons van Menger
  opgave: |-
    De spons van Menger ontstaat uit een kubus met ribbe 1: verdeel hem in 27 gelijke kubussen, haal de middelste en de zes kubussen in het midden van de zijvlakken weg, en herhaal met elke overblijvende kubus.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel kubusjes zijn er na $n$ stappen, en welk volume hebben ze samen?
      antwoord: |-
        $20^n$, volume $\bigl(\tfrac{20}{27}\bigr)^n$
      uitwerking: |-
        Elke kubus wordt vervangen door 20 kubussen met $\tfrac{1}{27}$ van het volume.
    - opgave: |-
        Na hoeveel stappen is er minder dan 1\,\% van het volume over?
      antwoord: |-
        na 16 stappen
      uitwerking: |-
        $\bigl(\tfrac{20}{27}\bigr)^n < 0{,}01$ geeft $n > \tfrac{\ln 0{,}01}{\ln(20/27)} \approx 15{,}3$.
    - opgave: |-
        Waarom is de dimensie, ongeveer 2,73, kleiner dan 3?
      antwoord: |-
        het volume gaat naar 0
      uitwerking: |-
        Met 27 kopieën op een derde zou je een volle kubus hebben ($D = 3$). Er gaan er telkens 7 weg: de spons is minder dan een lichaam, maar door alle gaatjes meer dan een oppervlak.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    een vertakkende boom: totale lengte
  opgave: |-
    Een tekenprogramma tekent een boom: een stam van 1 m, die zich splitst in twee takken die elk $r$ keer zo lang zijn. Elke tak splitst zich weer in twee takken, $r$ keer zo lang, en zo verder.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de totale lengte na $n$ splitsingen $1 + 2r + (2r)^2 + \cdots + (2r)^n$ is.
      antwoord: |-
        na $k$ splitsingen komen er $2^k$ takken met lengte $r^k$ bij
      uitwerking: |-
        Bij splitsing $k$ zijn er $2^k$ nieuwe takken met lengte $r^k$, samen $(2r)^k$.
    - opgave: |-
        Hoe lang is de hele boom (oneindig veel splitsingen) als $r = 0{,}45$?
      antwoord: |-
        10 m
      uitwerking: |-
        Een meetkundige reeks met reden 0,9: $\tfrac{1}{1 - 0{,}9} = 10$.
    - opgave: |-
        Voor welke $r$ is de hele boom oneindig lang?
      antwoord: |-
        $r \geqslant \tfrac12$
      uitwerking: |-
        De reeks convergeert alleen als $2r < 1$.
    - opgave: |-
        Ook een bloemkool, een rivierdelta of de longen hebben vertakkingen op steeds kleinere schaal. Waarom is zo'n vertakking handig voor de longen?
      antwoord: |-
        een heel groot oppervlak in een klein volume
      uitwerking: |-
        De vertakkingen geven een heel groot contactoppervlak met de lucht (bij een volwassene vele tientallen vierkante meter) in een borstkas van enkele liters.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    lengte van een kustlijn
  opgave: |-
    Voor een kustlijn geldt $L(\varepsilon) = C\,\varepsilon^{\,1 - D}$. Met een lat van 2 km meet je 300 km, met een lat van 500 m meet je 420 km.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de dimensie $D$.
      antwoord: |-
        $D \approx 1{,}24$
      uitwerking: |-
        De lat wordt 4 keer korter, dus $4^{D - 1} = \tfrac{420}{300} = 1{,}4$, en $D = 1 + \tfrac{\ln 1{,}4}{\ln 4} \approx 1{,}243$.
    - opgave: |-
        Wat meet je met een lat van 125 m?
      antwoord: |-
        588 km
      uitwerking: |-
        Weer 4 keer korter: $420 \cdot 1{,}4 = 588$ km.
    - opgave: |-
        Een andere kust heeft $D = 1{,}02$. Wat zegt dat over die kust?
      antwoord: |-
        bijna glad
      uitwerking: |-
        De gemeten lengte hangt nauwelijks van de lat af: de kust is bijna een gewone kromme, zoals een lange zandkust.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    het chaosspel uitvoeren
  opgave: |-
    Speel het chaosspel met de hoekpunten $A_1(0, 0)$, $A_2(8, 0)$, $A_3(4, 8)$ en het startpunt $P_0(4, 3)$. Bij een worp van 1 of 2 neem je $T_1$, bij 3 of 4 $T_2$, bij 5 of 6 $T_3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Je gooit 3, 6, 1. Bereken $P_1$, $P_2$ en $P_3$.
      antwoord: |-
        $(6;\ 1{,}5)$, $(5;\ 4{,}75)$, $(2{,}5;\ 2{,}375)$
      uitwerking: |-
        $P_1 = \tfrac12\bigl((4, 3) + (8, 0)\bigr) = (6;\ 1{,}5)$, $P_2 = \tfrac12\bigl((6;\ 1{,}5) + (4, 8)\bigr) = (5;\ 4{,}75)$, $P_3 = \tfrac12\bigl((5;\ 4{,}75) + (0, 0)\bigr) = (2{,}5;\ 2{,}375)$.
    - opgave: |-
        Het startpunt ligt in de witte middelste driehoek, die weggehaald wordt. Toon aan dat $P_1$ in een van de drie overblijvende driehoeken ligt.
      antwoord: |-
        $T_2$ beeldt de grote driehoek af op de driehoek bij $A_2$
      uitwerking: |-
        $T_2$ beeldt de hele driehoek $A_1A_2A_3$ af op de driehoek met hoekpunten $(4, 0)$, $(8, 0)$, $(6, 4)$, en daarin ligt $(6;\ 1{,}5)$. Elk beeldpunt ligt in een van de drie kopieën.
    - opgave: |-
        Waarom heeft het geen belang waar je begint, als je de eerste twintig punten niet tekent?
      antwoord: |-
        de afstand tot de figuur halveert bij elke stap
      uitwerking: |-
        Na twintig stappen is de afstand tot de driehoek van Sierpiński $2^{20} \approx 10^6$ keer kleiner geworden: veel minder dan de dikte van een stip.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    een vierkant itereren tot de driehoek van Sierpinski
  opgave: |-
    Begin met een vierkant $F_0$ met zijde 1, en neem telkens $F_n = T_1(F_{n-1}) \cup T_2(F_{n-1}) \cup T_3(F_{n-1})$, zoals in sectie 3.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel vierkantjes heeft $F_n$, en wat is hun zijde?
      antwoord: |-
        $3^n$ vierkantjes met zijde $\tfrac{1}{2^n}$
      uitwerking: |-
        Elke $T_i$ maakt van een vierkant een vierkant met halve zijde, en er zijn er drie.
    - opgave: |-
        Toon aan dat de oppervlakte van $F_n$ naar 0 gaat, zoals bij de driehoek van Sierpiński.
      antwoord: |-
        $\bigl(\tfrac34\bigr)^n$, als de vierkantjes niet overlappen
      uitwerking: |-
        Samen hoogstens $3^n \cdot \tfrac{1}{4^n} = \bigl(\tfrac34\bigr)^n$, en dat gaat naar 0.
    - opgave: |-
        Welke figuur verandert niet als je ze itereert, en waarom?
      antwoord: |-
        de driehoek van Sierpiński: $S = T_1(S) \cup T_2(S) \cup T_3(S)$
      uitwerking: |-
        Dat is het dekpunt van de iteratie: $S$ bestaat precies uit de drie verkleinde kopieën van zichzelf.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    dimensie 2, toch geen vlak stuk
  opgave: |-
    De \textit{C-kromme van Lévy} ontstaat zo: vervang een lijnstuk door de twee rechthoekszijden van een gelijkbenige rechthoekige driehoek met dat lijnstuk als schuine zijde, en herhaal met elk lijnstuk.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel keer korter zijn de nieuwe lijnstukken?
      antwoord: |-
        $\sqrt2$ keer
      uitwerking: |-
        Een rechthoekszijde is $\tfrac{1}{\sqrt2}$ keer de schuine zijde.
    - opgave: |-
        Bereken de gelijkvormigheidsdimensie.
      antwoord: |-
        2
      uitwerking: |-
        $N = 2$ en $s = \sqrt2$: $D = \tfrac{\log 2}{\log\sqrt2} = \tfrac{\log 2}{\frac12 \log 2} = 2$.
    - opgave: |-
        Hoe lang is de kromme na 10 stappen, als het lijnstuk lengte 1 heeft?
      antwoord: |-
        32
      uitwerking: |-
        Elke stap vermenigvuldigt de lengte met $\tfrac{2}{\sqrt2} = \sqrt2$, dus $\sqrt2^{\,10} = 32$.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    alles wat uit de driehoek van Sierpinski weggaat
  opgave: |-
    Een driehoek heeft oppervlakte $A_0$. Toon aan dat alle driehoeken die je weghaalt om de driehoek van Sierpiński te maken, samen oppervlakte $A_0$ hebben.
  antwoord: |-
    $\sum_{k \geqslant 1} 3^{k-1} \cdot \tfrac{A_0}{4^k} = A_0$
  uitwerking: |-
    In stap $k$ haal je uit elk van de $3^{k-1}$ driehoeken het middelste vierde weg: $3^{k-1} \cdot \tfrac{A_0}{4^k} = \tfrac{A_0}{4}\bigl(\tfrac34\bigr)^{k-1}$. De meetkundige reeks geeft $\tfrac{A_0}{4} \cdot \tfrac{1}{1 - 3/4} = A_0$.

- id: h3-o17
  soort: opdracht
  niveau: 3
  thema: |-
    een punt van de Cantorverzameling dat geen eindpunt is
  opgave: |-
    Neem de functie $g(x) = 3x$ voor $0 \leqslant x \leqslant \tfrac13$ en $g(x) = 3x - 2$ voor $\tfrac23 \leqslant x \leqslant 1$. Ze rekt elk van de twee intervallen na stap 1 uit tot $[0, 1]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\tfrac14 \to \tfrac34 \to \tfrac14$ onder $g$.
      antwoord: |-
        $g(\tfrac14) = \tfrac34$ en $g(\tfrac34) = \tfrac14$
      uitwerking: |-
        $3 \cdot \tfrac14 = \tfrac34$ en $3 \cdot \tfrac34 - 2 = \tfrac14$.
    - opgave: |-
        Verklaar: een punt ligt in de Cantorverzameling als zijn baan onder $g$ altijd in $[0, \tfrac13] \cup [\tfrac23, 1]$ blijft.
      antwoord: |-
        $g$ beeldt de overblijvende stukken af op de vorige stap
      uitwerking: |-
        Na stap $n$ liggen de overblijvende stukken in $[0, \tfrac13]$ of $[\tfrac23, 1]$, en $g$ rekt ze uit tot de stukken na stap $n - 1$. Een punt dat nooit weggehaald wordt, komt dus nooit in een middelste derde, en omgekeerd.
    - opgave: |-
        Besluit dat $\tfrac14$ in de Cantorverzameling ligt. Is $\tfrac14$ een eindpunt van een interval?
      antwoord: |-
        ja; nee
      uitwerking: |-
        De baan $\tfrac14, \tfrac34, \tfrac14, \ldots$ blijft in $[0, \tfrac13] \cup [\tfrac23, 1]$. Eindpunten hebben een noemer die een macht van 3 is, en 4 is dat niet. Er zijn dus punten in de Cantorverzameling die nooit een eindpunt zijn.

- id: h3-o18
  soort: opdracht
  niveau: 3
  thema: |-
    formule voor de oppervlakte van de sneeuwvlok na n stappen
  opgave: |-
    Toon aan dat de oppervlakte van de sneeuwvlok van Koch na $n$ stappen gelijk is aan $A_n = A_0\Bigl(\dfrac85 - \dfrac35\Bigl(\dfrac49\Bigr)^{\!n}\Bigr)$. Na hoeveel stappen verschilt ze minder dan 1\,\% van de grenswaarde?
  antwoord: |-
    met de somformule van een meetkundige rij; na 5 stappen
  uitwerking: |-
    $\sum_{k=1}^n \bigl(\tfrac49\bigr)^{k-1} = \dfrac{1 - (4/9)^n}{1 - 4/9} = \tfrac95\bigl(1 - (\tfrac49)^n\bigr)$, dus $A_n = A_0\bigl(1 + \tfrac35 - \tfrac35(\tfrac49)^n\bigr)$. Het verschil met $\tfrac85 A_0$ is $\tfrac35(\tfrac49)^n A_0$, en dat is minder dan $0{,}01 \cdot \tfrac85 A_0$ als $(\tfrac49)^n < \tfrac{0{,}016}{0{,}6}$, dus $n > \tfrac{\ln(0{,}02\overline{6})}{\ln(4/9)} \approx 4{,}47$: na 5 stappen. (Controle: $\tfrac35(\tfrac49)^5 \approx 0{,}0104$ tegenover $0{,}016$.)

- id: h3-o19
  soort: opdracht
  niveau: 3
  thema: |-
    dimensie door hokjes te tellen
  opgave: |-
    Een fractaal die niet zelfgelijkvormig is, zoals een echte kust, heeft geen $N$ en $s$. Je kunt de dimensie dan schatten door hokjes te tellen: leg een rooster met hokjes van zijde $\varepsilon$ over de figuur, tel de hokjes $N(\varepsilon)$ die de figuur raken, en neem $D \approx \tfrac{\log N(\varepsilon)}{\log(1/\varepsilon)}$ voor kleine $\varepsilon$.
  lijst: enumerate
  delen:
    - opgave: |-
        Een lijnstuk met lengte 1 raakt met hokjes van zijde $\tfrac{1}{10^k}$ ongeveer $10^k$ hokjes. Welke $D$ geeft de formule?
      antwoord: |-
        1
      uitwerking: |-
        $\tfrac{\log 10^k}{\log 10^k} = 1$.
    - opgave: |-
        De driehoek van Sierpiński, opgebouwd uit $3^n$ driehoekjes met zijde $\tfrac{1}{2^n}$, raakt met hokjes van zijde $\tfrac{1}{2^n}$ ongeveer $c \cdot 3^n$ hokjes, met $c$ een vast getal. Toon aan dat de formule voor grote $n$ de gelijkvormigheidsdimensie geeft.
      antwoord: |-
        $\tfrac{\log c + n \log 3}{n \log 2} \to \tfrac{\log 3}{\log 2}$
      uitwerking: |-
        $\dfrac{\log(c \cdot 3^n)}{\log 2^n} = \dfrac{\log c}{n\log 2} + \dfrac{\log 3}{\log 2}$, en de eerste term gaat naar 0.
    - opgave: |-
        Iemand telt op een kaart 120 hokjes van 10 km die de kust raken, en 1700 hokjes van 1 km. Schat de dimensie met de verhouding van die twee tellingen.
      antwoord: |-
        $D \approx 1{,}15$
      uitwerking: |-
        Als $N(\varepsilon) \approx C\varepsilon^{-D}$, dan is $\tfrac{N(1)}{N(10)} = 10^D$, dus $D = \log\tfrac{1700}{120} \approx 1{,}15$.

- id: h3-o20
  soort: opdracht
  niveau: 3
  thema: |-
    dimensie met verschillende verkleiningsfactoren
  opgave: |-
    Bestaat een figuur uit kopieën die met verschillende factoren verkleind zijn, met factoren $r_1, r_2, \ldots$ (elk kleiner dan 1), dan is haar dimensie het getal $D$ met $r_1^D + r_2^D + \cdots = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat dat de gewone formule geeft als alle $N$ factoren gelijk zijn aan $\tfrac1s$.
      antwoord: |-
        $N \cdot s^{-D} = 1$, dus $N = s^D$
      uitwerking: |-
        $N\bigl(\tfrac1s\bigr)^D = 1$ geeft $s^D = N$.
    - opgave: |-
        Een figuur bestaat uit twee kopieën met factor $\tfrac12$ en één kopie met factor $\tfrac14$. Bereken haar dimensie. Stel $u = 2^{-D}$.
      antwoord: |-
        $D = -\log_2(\sqrt2 - 1) \approx 1{,}272$
      uitwerking: |-
        $2u + u^2 = 1$ geeft $u = \sqrt2 - 1$ (de positieve oplossing). Dan $2^{-D} = \sqrt2 - 1$, dus $D = -\tfrac{\ln(\sqrt2 - 1)}{\ln 2} \approx 1{,}272$.

- id: h3-o21
  soort: opdracht
  niveau: 3
  thema: |-
    zelf een fractaal ontwerpen
  opgave: |-
    Ontwerp een kromme zoals de Koch-kromme: vervang een lijnstuk door $N$ lijnstukken die $s$ keer korter zijn, op een rooster van hokjes.
  lijst: enumerate
  delen:
    - opgave: |-
        Kies $N$ en $s$ zodat de dimensie precies 1,5 is. Geef twee mogelijkheden.
      antwoord: |-
        bijvoorbeeld $N = 8$, $s = 4$ of $N = 27$, $s = 9$
      uitwerking: |-
        $N = s^{1{,}5}$ vraagt een kwadraat als $s$: $s = 4$ geeft $N = 8$, $s = 9$ geeft $N = 27$.
    - opgave: |-
        Teken een regel met $N = 8$ en $s = 4$: een gebroken lijn van 8 hokjes die van $(0, 0)$ naar $(4, 0)$ gaat, zonder zichzelf te overlappen.
      antwoord: |-
        bijvoorbeeld met een bult naar boven en een bult naar beneden
      uitwerking: |-
        Een mogelijkheid: $(0,0) \to (1,0) \to (1,1) \to (2,1) \to (2,0) \to (2,-1) \to (3,-1) \to (3,0) \to (4,0)$: acht lijnstukken van $\tfrac14$ van de breedte.

        \begin{tikzpicture}[scale=.5]
          \draw[black!14,very thin] (0,-1) grid (4,1);
          \draw[accent,thick] (0,0) -- (1,0) -- (1,1) -- (2,1) -- (2,0) -- (2,-1) -- (3,-1) -- (3,0) -- (4,0);
        \end{tikzpicture}
    - opgave: |-
        Met welke factor wordt de lengte bij elke stap vermenigvuldigd?
      antwoord: |-
        2
      uitwerking: |-
        $\tfrac{N}{s} = \tfrac84 = 2$: na $n$ stappen is de kromme $2^n$ keer zo lang.

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: discreet
    onderwerp: |-
      Telproblemen
  opgave: |-
    Schrijf de driehoek van Pascal op tot rij 7 (de rij met $\binom{7}{0}, \ldots, \binom77$), en kleur elk oneven getal.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke figuur zie je?
      antwoord: |-
        de driehoek van Sierpiński na drie stappen
      uitwerking: |-
        De oneven getallen vormen drie driehoeken van vier rijen, met een lege driehoek ertussen, en elk van die drie weer zo: de driehoek van Sierpiński.
    - opgave: |-
        Hoeveel oneven getallen staan er in de rijen 0 tot 3? En in de rijen 0 tot 7?
      antwoord: |-
        9 en 27
      uitwerking: |-
        Rij 0 tot 3: $1 + 2 + 2 + 4 = 9$. Rij 0 tot 7: $9 + 2 + 4 + 4 + 8 = 27$.
    - opgave: |-
        Hoeveel oneven getallen verwacht je in de rijen 0 tot $2^n - 1$? Verklaar met de driehoek van Sierpiński.
      antwoord: |-
        $3^n$
      uitwerking: |-
        Het patroon van $2^n$ rijen bestaat uit drie kopieën van het patroon van $2^{n-1}$ rijen: bij elke verdubbeling van het aantal rijen wordt het aantal oneven getallen met 3 vermenigvuldigd.

- id: h3-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Een van de vier transformaties van de varen van Barnsley is $T(P) = AP + b$ met $A = \begin{pmatrix} 0{,}85 & 0{,}04 \\ -0{,}04 & 0{,}85 \end{pmatrix}$ en $b = \begin{pmatrix} 0 \\ 1{,}6 \end{pmatrix}$. Ze beeldt de hele varen af op de varen zonder de twee onderste blaadjes.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $T(0, 0)$ en $T(T(0, 0))$.
      antwoord: |-
        $(0;\ 1{,}6)$ en $(0{,}064;\ 2{,}96)$
      uitwerking: |-
        $T(0, 0) = b$. $A\,b = (0{,}064;\ 1{,}36)$, plus $b$ geeft $(0{,}064;\ 2{,}96)$.
    - opgave: |-
        Bepaal het dekpunt van $T$ door $(I - A)\,P = b$ op te lossen. Waar ligt het op de varen?
      antwoord: |-
        $\approx (2{,}66;\ 9{,}96)$: de top
      uitwerking: |-
        $I - A = \begin{pmatrix} 0{,}15 & -0{,}04 \\ 0{,}04 & 0{,}15 \end{pmatrix}$ met determinant $0{,}0241$. Dan $P = \tfrac{1}{0{,}0241}\begin{pmatrix} 0{,}15 & 0{,}04 \\ -0{,}04 & 0{,}15 \end{pmatrix} b = \tfrac{1}{0{,}0241}(0{,}064;\ 0{,}24) \approx (2{,}66;\ 9{,}96)$: het topje van de varen, waar alle banen van $T$ naartoe gaan.
    - opgave: |-
        Bereken $\det A$. Wat zegt dat over oppervlaktes en lengtes?
      antwoord: |-
        $\det A = 0{,}7241$
      uitwerking: |-
        $0{,}85^2 + 0{,}04^2 = 0{,}7241$: oppervlaktes worden met ongeveer 0,72 vermenigvuldigd, lengtes met ongeveer $\sqrt{0{,}7241} \approx 0{,}85$. De kleine getallen 0,04 draaien een beetje: daardoor buigt de varen.

- id: h3-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Ruimtemeetkunde
  opgave: |-
    De \textit{tetraëder van Sierpiński} ontstaat uit een regelmatig viervlak: verbind de middens van de ribben, houd de vier viervlakken bij de hoekpunten (met halve ribbe) en haal de rest weg. Herhaal.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk deel van het volume blijft er na één stap over? En na $n$ stappen?
      antwoord: |-
        $\tfrac12$; $\bigl(\tfrac12\bigr)^n$
      uitwerking: |-
        Vier viervlakken met halve ribbe hebben elk $\tfrac18$ van het volume: samen $\tfrac48 = \tfrac12$.
    - opgave: |-
        Wat gebeurt er met de totale oppervlakte van alle zijvlakken?
      antwoord: |-
        ze blijft gelijk
      uitwerking: |-
        Elk viervlak wordt vervangen door 4 viervlakken met een vierde van de oppervlakte: samen evenveel.
    - opgave: |-
        Bereken de dimensie.
      antwoord: |-
        2
      uitwerking: |-
        $N = 4$, $s = 2$: $D = 2$. Een ruimtelijke figuur met dimensie 2, en een oppervlakte die gelijk blijft: ze gedraagt zich als een oppervlak.

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Een Koch-kromme vertrekt van een lijnstuk van 9 cm. Hoeveel lijnstukken heeft ze na 5 stappen, hoe lang is elk, en hoe lang is de figuur?
  antwoord: |-
    1024 lijnstukken van $\tfrac{1}{27}$ cm: ongeveer 37,9 cm
  uitwerking: |-
    $4^5 = 1024$, $\tfrac{9}{243} = \tfrac1{27}$ cm, en $9 \cdot \bigl(\tfrac43\bigr)^5 \approx 37{,}93$ cm.

- id: h3-t2
  soort: test
  niveau: 2
  opgave: |-
    Een sneeuwvlok van Koch begint met een gelijkzijdige driehoek met zijde 6 cm. Bereken de omtrek na 3 stappen en de oppervlakte die de sneeuwvlok nadert.
  antwoord: |-
    $\tfrac{128}{3} \approx 42{,}7$ cm; $\tfrac{72\sqrt3}{5} \approx 24{,}9$ cm\textsuperscript{2}
  uitwerking: |-
    Omtrek: $18 \cdot \bigl(\tfrac43\bigr)^3 = \tfrac{128}{3}$. Oppervlakte: $A_0 = 9\sqrt3$, en $\tfrac85 \cdot 9\sqrt3 = \tfrac{72\sqrt3}{5}$.

- id: h3-t3
  soort: test
  niveau: 1
  opgave: |-
    Een driehoek met zijde 10 cm wordt drie stappen lang uitgehold tot een driehoek van Sierpiński. Hoeveel driehoekjes zijn er, hoe groot is hun zijde, en welk deel van de oppervlakte blijft over?
  antwoord: |-
    27 met zijde 1,25 cm; $\tfrac{27}{64} \approx 42\,\%$
  uitwerking: |-
    $3^3 = 27$, $\tfrac{10}{8} = 1{,}25$ cm, en $\bigl(\tfrac34\bigr)^3 = \tfrac{27}{64}$.

- id: h3-t4
  soort: test
  niveau: 2
  opgave: |-
    Hoeveel intervallen van de Cantorverzameling blijven er na 4 stappen over, en hoe lang zijn ze samen? Liggen $\tfrac19$ en $\tfrac12$ in de Cantorverzameling?
  antwoord: |-
    16 intervallen, samen $\tfrac{16}{81}$; $\tfrac19$ wel, $\tfrac12$ niet
  uitwerking: |-
    $2^4 = 16$ intervallen met lengte $\tfrac{1}{81}$. $\tfrac19$ is een eindpunt, $\tfrac12$ gaat in stap 1 weg.

- id: h3-t5
  soort: test
  niveau: 1
  opgave: |-
    Een zelfgelijkvormige figuur bestaat uit 6 kopieën van zichzelf, elk 3 keer kleiner. Bereken haar dimensie. Is het een fractaal?
  antwoord: |-
    $\tfrac{\log 6}{\log 3} \approx 1{,}631$; ja
  uitwerking: |-
    $D = \tfrac{\log 6}{\log 3} \approx 1{,}631$, geen geheel getal.

- id: h3-t6
  soort: test
  niveau: 2
  opgave: |-
    Met een lat van 1 km meet je een kust van 50 km, met een lat van 100 m meet je 70 km. Bepaal de dimensie, en voorspel wat je met een lat van 10 m meet.
  antwoord: |-
    $D \approx 1{,}15$; 98 km
  uitwerking: |-
    $10^{D - 1} = 1{,}4$, dus $D = 1 + \log 1{,}4 \approx 1{,}146$. Met een lat van 10 m: $70 \cdot 1{,}4 = 98$ km.

- id: h3-t7
  soort: test
  niveau: 1
  opgave: |-
    Neem $A_1(0, 0)$, $A_2(6, 0)$, $A_3(0, 6)$, $T_i(P) = \tfrac12(P + A_i)$ en $P(2, 2)$. Bereken $T_1(P)$, $T_2(P)$, $T_3(P)$ en $T_1(T_1(P))$.
  antwoord: |-
    $(1, 1)$, $(4, 1)$, $(1, 4)$, $(0{,}5;\ 0{,}5)$
  uitwerking: |-
    Telkens het midden van $P$ en het hoekpunt. $T_1$ halveert de coördinaten: $(2, 2) \to (1, 1) \to (0{,}5;\ 0{,}5)$.
