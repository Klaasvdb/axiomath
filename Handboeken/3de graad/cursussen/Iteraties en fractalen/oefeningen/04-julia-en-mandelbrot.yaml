# Oefeningen van hoofdstuk 4. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h4-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(2 - i)^2$
      antwoord: |-
        $3 - 4i$
      uitwerking: |-
        $4 - 4i + i^2 = 3 - 4i$.
    - opgave: |-
        $|3 - 4i|$
      antwoord: |-
        5
      uitwerking: |-
        $\sqrt{9 + 16} = 5$.
    - opgave: |-
        $(1 + i)^8$
      antwoord: |-
        16
      uitwerking: |-
        $1 + i = \sqrt2\,(\cos 45^\circ + i\sin 45^\circ)$, dus $(1 + i)^8 = 16\,(\cos 360^\circ + i \sin 360^\circ) = 16$.
    - opgave: |-
        de vierkantswortels van $-3 - 4i$
      antwoord: |-
        $\pm(1 - 2i)$
      uitwerking: |-
        $(1 - 2i)^2 = 1 - 4i - 4 = -3 - 4i$.
    - opgave: |-
        de oplossingen van $z^2 + 9 = 0$
      antwoord: |-
        $\pm 3i$
      uitwerking: |-
        $z^2 = -9 = (3i)^2$.
    - opgave: |-
        het argument van $z^2$ als $\arg z = 70^\circ$
      antwoord: |-
        $140^\circ$
      uitwerking: |-
        Bij een product tel je de argumenten op.

- id: h4-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Bereken telkens de baan van $z_0 = 0$ onder $f(z) = z^2 + c$, tot je ziet wat er gebeurt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $c = -1$
      antwoord: |-
        $0, -1, 0, -1, \ldots$: begrensd
      uitwerking: |-
        Een 2-cyclus.
    - opgave: |-
        $c = 1$
      antwoord: |-
        $0, 1, 2, 5, 26, \ldots$: loopt weg
      uitwerking: |-
        Elke term is meer dan het kwadraat van de vorige.
    - opgave: |-
        $c = i$
      antwoord: |-
        $0, i, -1 + i, -i, -1 + i, \ldots$: begrensd
      uitwerking: |-
        $(-1 + i)^2 + i = -2i + i = -i$ en $(-i)^2 + i = -1 + i$: een 2-cyclus vanaf $z_2$.
    - opgave: |-
        $c = 2i$
      antwoord: |-
        $0, 2i, -4 + 2i, 12 - 14i, \ldots$: loopt weg
      uitwerking: |-
        $(2i)^2 + 2i = -4 + 2i$ en $(-4 + 2i)^2 + 2i = 12 - 16i + 2i$.

- id: h4-kwadraat
  soort: kort
  opgave: |-
    Bereken de baan onder $f(z) = z^2$ tot $z_4$, en zeg wat er op lange termijn gebeurt.
  lijst: enumerate
  delen:
    - opgave: |-
        $z_0 = \tfrac12 + \tfrac12 i$
      antwoord: |-
        $\tfrac12 i$, $-\tfrac14$, $\tfrac1{16}$, $\tfrac1{256}$; naar 0
      uitwerking: |-
        $\bigl(\tfrac12 + \tfrac12 i\bigr)^2 = \tfrac14 + \tfrac12 i - \tfrac14 = \tfrac12 i$. De modulus $\tfrac{\sqrt2}{2} < 1$ wordt telkens gekwadrateerd.
    - opgave: |-
        $z_0 = \cos 72^\circ + i\sin 72^\circ$
      antwoord: |-
        argumenten $144^\circ$, $288^\circ$, $216^\circ$, $72^\circ$: periode 4
      uitwerking: |-
        Het argument verdubbelt: $144^\circ$, $288^\circ$, $576^\circ = 216^\circ$, $432^\circ = 72^\circ$. Na vier stappen is de baan terug: een 4-cyclus op de eenheidscirkel.

- id: h4-dekpunt
  soort: kort
  opgave: |-
    Bepaal de dekpunten van $f(z) = z^2 + c$ en zeg of ze aantrekkend of afstotend zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        $c = \tfrac{3}{16}$
      antwoord: |-
        $\tfrac34$ afstotend, $\tfrac14$ aantrekkend
      uitwerking: |-
        $z^2 - z + \tfrac3{16} = 0$ heeft discriminant $\tfrac14$: $z = \tfrac{1 \pm 1/2}{2}$. $|2 \cdot \tfrac34| = 1{,}5$ en $|2 \cdot \tfrac14| = 0{,}5$.
    - opgave: |-
        $c = 0{,}18 - 0{,}24i$ (gebruik dat $(0{,}8 + 0{,}6i)^2 = 0{,}28 + 0{,}96i$)
      antwoord: |-
        $0{,}9 + 0{,}3i$ afstotend, $0{,}1 - 0{,}3i$ aantrekkend
      uitwerking: |-
        De discriminant is $1 - 4c = 0{,}28 + 0{,}96i = (0{,}8 + 0{,}6i)^2$, dus $p = \tfrac{1 \pm (0{,}8 + 0{,}6i)}{2}$. $|2p_1| = |1{,}8 + 0{,}6i| \approx 1{,}90$ en $|2p_2| = |0{,}2 - 0{,}6i| \approx 0{,}63$.

- id: h4-cyclus
  soort: kort
  opgave: |-
    Is de 2-cyclus van $z^2 + c$ aantrekkend?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $c = -1 + 0{,}1i$
      antwoord: |-
        ja
      uitwerking: |-
        $|4(c + 1)| = |0{,}4i| = 0{,}4 < 1$.
    - opgave: |-
        $c = -1{,}3$
      antwoord: |-
        nee
      uitwerking: |-
        $|4(c + 1)| = |{-1{,}2}| = 1{,}2 > 1$.
    - opgave: |-
        $c = -0{,}9 - 0{,}2i$
      antwoord: |-
        ja
      uitwerking: |-
        $|4(0{,}1 - 0{,}2i)| = 4\sqrt{0{,}05} \approx 0{,}89 < 1$.

- id: h4-ontsnappen
  soort: kort
  opgave: |-
    Toon aan dat de baan van 0 onder $z^2 + c$ ontsnapt, en dus dat $c$ niet in de Mandelbrotverzameling ligt.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $c = 1 + i$
      antwoord: |-
        $|z_2| = |1 + 3i| > 2$
      uitwerking: |-
        $0 \to 1 + i \to 2i + 1 + i = 1 + 3i$, met $|1 + 3i| = \sqrt{10} > 2$, en $|c| = \sqrt2 \leqslant 2$.
    - opgave: |-
        $c = 0{,}5$
      antwoord: |-
        $|z_4| \approx 1{,}63$, $|z_5| \approx 3{,}15 > 2$
      uitwerking: |-
        $0;\ 0{,}5;\ 0{,}75;\ 1{,}0625;\ 1{,}6289;\ 3{,}1533$.
    - opgave: |-
        $c = -2{,}5$
      antwoord: |-
        $|c| > 2$
      uitwerking: |-
        $z_1 = c$ met $|z_1| = 2{,}5 > 2$ en $|z_1| \geqslant |c|$.

- id: h4-julia
  soort: kort
  opgave: |-
    Ligt $z_0$ in de gevulde Julia-verzameling $K_c$?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $c = -1$, $z_0 = 1 + i$
      antwoord: |-
        nee
      uitwerking: |-
        $1 + i \to 2i - 1 \to (-1 + 2i)^2 - 1 = -4 - 4i$, en $|-4 - 4i| > 2$.
    - opgave: |-
        $c = 0$, $z_0 = 0{,}6 + 0{,}8i$
      antwoord: |-
        ja
      uitwerking: |-
        $|z_0| = 1$: de baan blijft op de eenheidscirkel.
    - opgave: |-
        $c = i$, $z_0 = -i$
      antwoord: |-
        ja
      uitwerking: |-
        $-i \to -1 + i \to -i$: een 2-cyclus.

- id: h4-mandelbrot
  soort: kort
  opgave: |-
    Ligt $c$ in de Mandelbrotverzameling? Itereer vanaf 0.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $c = -2$
      antwoord: |-
        ja
      uitwerking: |-
        $0 \to -2 \to 2 \to 2$: de baan komt in het dekpunt 2.
    - opgave: |-
        $c = -i$
      antwoord: |-
        ja
      uitwerking: |-
        $0 \to -i \to -1 - i \to i \to -1 - i$: na twee stappen in een 2-cyclus.
    - opgave: |-
        $c = 2i$
      antwoord: |-
        nee
      uitwerking: |-
        $0 \to 2i \to -4 + 2i$, met $|-4 + 2i| > 2$.

- id: h4-cardioide
  soort: kort
  opgave: |-
    Beantwoord met de hoofdcardioïde of de schijf met periode 2.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke $c$ geeft het aantrekkende dekpunt $p = 0{,}3$? En $p = -0{,}4i$?
      antwoord: |-
        $c = 0{,}21$; $c = 0{,}16 - 0{,}4i$
      uitwerking: |-
        $c = p - p^2$: $0{,}3 - 0{,}09 = 0{,}21$ en $-0{,}4i - (-0{,}16) = 0{,}16 - 0{,}4i$. Beide dekpunten hebben $|2p| < 1$ (0,6 en 0,8).
    - opgave: |-
        Heeft $z^2 - 0{,}9 + 0{,}1i$ een aantrekkende 2-cyclus?
      antwoord: |-
        ja: $|c + 1| \approx 0{,}14 < \tfrac14$
      uitwerking: |-
        $|c + 1| = |0{,}1 + 0{,}1i| = \tfrac{\sqrt2}{10} \approx 0{,}141$.

- id: h4-o1
  soort: opdracht
  niveau: 1
  thema: |-
    baan van 0 berekenen
  opgave: |-
    Bereken de baan van 0 onder $z^2 + c$ tot $z_4$. Is ze begrensd?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $c = -i$
      antwoord: |-
        $-i$, $-1 - i$, $i$, $-1 - i$: begrensd
      uitwerking: |-
        $(-i)^2 - i = -1 - i$, $(-1 - i)^2 - i = 2i - i = i$, $i^2 - i = -1 - i$: een 2-cyclus $\{-1 - i, i\}$.
    - opgave: |-
        $c = -0{,}75$
      antwoord: |-
        $-0{,}75$; $-0{,}1875$; $-0{,}7148$; $-0{,}2390$: begrensd
      uitwerking: |-
        Reëel en in $[-2, \tfrac14]$: de baan blijft in $[-1, 0]$ en gaat traag naar het dekpunt $-\tfrac12$.
    - opgave: |-
        $c = 0{,}5 + 0{,}5i$
      antwoord: |-
        $0{,}5 + 0{,}5i$; $0{,}5 + i$; $-0{,}25 + 1{,}5i$; $-1{,}6875 - 0{,}25i$; ontsnapt daarna
      uitwerking: |-
        $z_5 \approx 3{,}29 + 1{,}34i$, met modulus groter dan 2.
    - opgave: |-
        $c = -1{,}2$
      antwoord: |-
        $-1{,}2$; $0{,}24$; $-1{,}1424$; $0{,}1051$: begrensd
      uitwerking: |-
        Reëel en in $[-2, \tfrac14]$. De baan gaat naar de 2-cyclus $\tfrac{-1 \pm \sqrt{1{,}8}}{2}$, die aantrekt ($|c + 1| = 0{,}2 < \tfrac14$).

- id: h4-o2
  soort: opdracht
  niveau: 1
  thema: |-
    begrippen, klassieke fouten
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Elke $c$ met $|c| \leqslant 2$ ligt in de Mandelbrotverzameling.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $c = 1$ heeft $|c| \leqslant 2$, maar de baan van 0 ontsnapt. Omgekeerd ligt wel elke $c$ van $M$ in de schijf met straal 2.
    - opgave: |-
        De Mandelbrotverzameling bestaat uit startwaarden $z_0$, de Julia-verzameling uit parameters $c$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Net omgekeerd: $M$ bevat parameters $c$ (met startwaarde 0), $K_c$ bevat startwaarden $z_0$ (bij een vaste $c$).
    - opgave: |-
        Is $|z_n| > 2$ voor een term van de baan, dan loopt de baan altijd weg naar oneindig.
      antwoord: |-
        niet waar
      uitwerking: |-
        Alleen als ook $|z_n| \geqslant |c|$. Bij $c = -5$ is $2{,}2^2 - 5 = -0{,}16$: de baan komt terug.
    - opgave: |-
        Kwadrateren verdubbelt de modulus van een complex getal.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: de modulus wordt gekwadrateerd, het argument verdubbelt.
    - opgave: |-
        Een computer die 200 stappen itereert, tekent de Mandelbrotverzameling exact.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: een $c$ die pas na meer dan 200 stappen ontsnapt, wordt toch zwart getekend. De figuur is een benadering van buitenaf.

- id: h4-o3
  soort: opdracht
  niveau: 1
  thema: |-
    dekpunten van $z^2 + c$ met reële $c$
  opgave: |-
    Bepaal de dekpunten van $z^2 + c$, en $|2p|$ voor elk dekpunt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $c = -2$
      antwoord: |-
        2 en $-1$: $|2p| = 4$ en $2$
      uitwerking: |-
        $z^2 - z - 2 = (z - 2)(z + 1)$. Beide stoten af.
    - opgave: |-
        $c = -\tfrac34$
      antwoord: |-
        $\tfrac32$ en $-\tfrac12$: $|2p| = 3$ en $1$
      uitwerking: |-
        $z^2 - z - \tfrac34 = (z - \tfrac32)(z + \tfrac12)$. Het criterium beslist niet voor $-\tfrac12$: $c = -\tfrac34$ ligt op de rand van de hoofdcardioïde.
    - opgave: |-
        $c = 2$
      antwoord: |-
        $\tfrac{1 \pm i\sqrt7}{2}$: $|2p| = 2\sqrt2$
      uitwerking: |-
        De discriminant is $1 - 8 = -7$. $|1 \pm i\sqrt7| = \sqrt{8}$: beide stoten af.
    - opgave: |-
        $c = \tfrac14$
      antwoord: |-
        $\tfrac12$ (dubbel): $|2p| = 1$
      uitwerking: |-
        $z^2 - z + \tfrac14 = (z - \tfrac12)^2$: de inkeping van de cardioïde.

- id: h4-o4
  soort: opdracht
  niveau: 1
  thema: |-
    ligt $c$ in $M$
  opgave: |-
    Ligt $c$ in de Mandelbrotverzameling? Verklaar.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $c = 0{,}3$
      antwoord: |-
        nee
      uitwerking: |-
        $c > \tfrac14$: er is geen reëel dekpunt, en $x^2 + 0{,}3 > x$, zodat de baan blijft stijgen. Na 12 stappen is ze groter dan 2.
    - opgave: |-
        $c = -1{,}9$
      antwoord: |-
        ja
      uitwerking: |-
        Reëel in $[-2, \tfrac14]$: de baan van 0 blijft begrensd.
    - opgave: |-
        $c = -0{,}5 + 0{,}5i$ (gebruik $p \approx -0{,}409 + 0{,}275i$)
      antwoord: |-
        ja
      uitwerking: |-
        $p$ is bij benadering een dekpunt met $|2p| \approx 0{,}985 < 1$: $c$ ligt (net) in de hoofdcardioïde.
    - opgave: |-
        $c = -2 + i$
      antwoord: |-
        nee
      uitwerking: |-
        $|c| = \sqrt5 > 2$.

- id: h4-o5
  soort: opdracht
  niveau: 1
  thema: |-
    de figuur van de Mandelbrotverzameling lezen
  opgave: |-
    Gebruik de figuur van de Mandelbrotverzameling met de cardioïde en de schijf in sectie 3.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke zijn het meest linkse en het meest rechtse punt van $M$ op de reële as?
      antwoord: |-
        $-2$ en $\tfrac14$
      uitwerking: |-
        $c = -2$ ligt in $M$ (de baan $0, -2, 2, 2, \ldots$), en $c = \tfrac14$ is de inkeping van de cardioïde.
    - opgave: |-
        Waarom is de figuur symmetrisch ten opzichte van de reële as?
      antwoord: |-
        de baan van $\bar c$ is de toegevoegde van die van $c$
      uitwerking: |-
        $\overline{z^2 + c} = \bar z^2 + \bar c$: de baan van 0 voor $\bar c$ is de toegevoegde van die voor $c$, met dezelfde moduli.
    - opgave: |-
        Waar raakt de schijf met periode 2 de cardioïde?
      antwoord: |-
        in $c = -\tfrac34$
      uitwerking: |-
        De schijf $|c + 1| \leqslant \tfrac14$ raakt de reële as in $-\tfrac54$ en $-\tfrac34$, en de cardioïde gaat door $-\tfrac34$ (met $w = -1$).
    - opgave: |-
        Welke soort Julia-verzameling hoort bij $c = 0{,}5$? En bij $c = -1$?
      antwoord: |-
        stof; uit één stuk
      uitwerking: |-
        $0{,}5$ ligt niet in $M$, dus $K_{0{,}5}$ is stof. $-1$ ligt in $M$: $K_{-1}$ is uit één stuk (de basiliek).

- id: h4-o6
  soort: opdracht
  niveau: 1
  thema: |-
    kwadrateren in goniometrische vorm
  opgave: |-
    Neem $f(z) = z^2$ en $z_0 = 2\,(\cos 10^\circ + i \sin 10^\circ)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $z_1$, $z_2$ en $z_3$ in goniometrische vorm.
      antwoord: |-
        $4\,\mathrm{cis}\,20^\circ$, $16\,\mathrm{cis}\,40^\circ$, $256\,\mathrm{cis}\,80^\circ$
      uitwerking: |-
        De modulus wordt gekwadrateerd: 4, 16, 256. Het argument verdubbelt: $20^\circ$, $40^\circ$, $80^\circ$. (Met $\mathrm{cis}\,\alpha = \cos\alpha + i\sin\alpha$.)
    - opgave: |-
        Geef een formule voor $z_n$.
      antwoord: |-
        $z_n = 2^{2^n}\bigl(\cos(2^n \cdot 10^\circ) + i\sin(2^n \cdot 10^\circ)\bigr)$
      uitwerking: |-
        Na $n$ stappen is $z_n = z_0^{\,2^n}$; De Moivre geeft de modulus en het argument.
    - opgave: |-
        Na hoeveel stappen ligt $z_n$ voor het eerst op de negatieve reële as?
      antwoord: |-
        nooit
      uitwerking: |-
        Dan moet $2^n \cdot 10^\circ$ een oneven veelvoud van $180^\circ$ zijn, dus $2^n$ een oneven veelvoud van 18. Maar $2^n$ is nooit deelbaar door 9.

- id: h4-o7
  soort: opdracht
  niveau: 1
  thema: |-
    de gevulde Julia-verzameling van $c = 0$
  opgave: |-
    Neem $c = 0$, dus $f(z) = z^2$. Ligt $z_0$ in $K_0$? En in $J_0$?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $0{,}7 + 0{,}7i$
      antwoord: |-
        in $K_0$, niet in $J_0$
      uitwerking: |-
        $|z_0| = 0{,}7\sqrt2 \approx 0{,}99 < 1$.
    - opgave: |-
        $0{,}8 - 0{,}6i$
      antwoord: |-
        in $K_0$ en in $J_0$
      uitwerking: |-
        $|z_0| = 1$: op de eenheidscirkel.
    - opgave: |-
        $0{,}75 + 0{,}7i$
      antwoord: |-
        in geen van beide
      uitwerking: |-
        $|z_0| = \sqrt{1{,}0525} \approx 1{,}026 > 1$: de baan loopt weg.

- id: h4-o8
  soort: opdracht
  niveau: 2
  thema: |-
    de Julia-verzameling van $c = -2$
  opgave: |-
    Neem $f(z) = z^2 - 2$, en een reëel getal $x_0 = 2\cos\theta$ in $[-2, 2]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $f(2\cos\theta) = 2\cos 2\theta$.
      antwoord: |-
        $4\cos^2\theta - 2 = 2(2\cos^2\theta - 1)$
      uitwerking: |-
        $(2\cos\theta)^2 - 2 = 2(2\cos^2\theta - 1) = 2\cos 2\theta$.
    - opgave: |-
        Leid af dat het interval $[-2, 2]$ in $K_{-2}$ ligt.
      antwoord: |-
        $x_n = 2\cos(2^n\theta)$ blijft in $[-2, 2]$
      uitwerking: |-
        Elke stap verdubbelt de hoek, en $|2\cos(2^n\theta)| \leqslant 2$. (Men kan bewijzen dat $K_{-2}$ precies dat interval is.)
    - opgave: |-
        Toon aan dat $2\cos\tfrac{2\pi}{5}$ een punt met periode 2 is. Vergelijk met de 2-cyclus van $x^2 - 2$ uit hoofdstuk 2.
      antwoord: |-
        $2\cos\tfrac{8\pi}{5} = 2\cos\tfrac{2\pi}{5}$; de cyclus $\tfrac{-1 \pm \sqrt5}{2}$
      uitwerking: |-
        $\tfrac{2\pi}{5} \to \tfrac{4\pi}{5} \to \tfrac{8\pi}{5}$, en $\cos\tfrac{8\pi}{5} = \cos\bigl(2\pi - \tfrac{2\pi}{5}\bigr) = \cos\tfrac{2\pi}5$. Met $\cos\tfrac{2\pi}{5} = \tfrac{\sqrt5 - 1}{4}$ is $2\cos\tfrac{2\pi}{5} = \tfrac{-1 + \sqrt5}{2}$.

- id: h4-o9
  soort: opdracht
  niveau: 2
  thema: |-
    $c = i$: de baan van 0 landt op een afstotende cyclus
  opgave: |-
    Neem $c = i$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de baan van 0 na twee stappen in een 2-cyclus komt.
      antwoord: |-
        $0 \to i \to -1 + i \to -i \to -1 + i$
      uitwerking: |-
        $i^2 + i = -1 + i$, $(-1 + i)^2 + i = -i$, $(-i)^2 + i = -1 + i$.
    - opgave: |-
        Is die 2-cyclus aantrekkend?
      antwoord: |-
        nee: $|4(c + 1)| = 4\sqrt2$
      uitwerking: |-
        $f'(p)f'(q) = 4pq = 4(-1 + i)(-i) = 4(1 + i)$, met modulus $4\sqrt2 > 1$.
    - opgave: |-
        Ligt $i$ in $M$? Ligt $i$ in de hoofdcardioïde of in de schijf met periode 2?
      antwoord: |-
        in $M$, maar in geen van beide
      uitwerking: |-
        De baan van 0 is begrensd, dus $i \in M$. Maar er is geen aantrekkend dekpunt of aantrekkende 2-cyclus: $|i + 1| = \sqrt2 > \tfrac14$. De punten van $M$ zonder aantrekkende cyclus liggen op de rand: $K_i$ heeft geen binnenste (de dendriet).

- id: h4-o10
  soort: opdracht
  prent:
    naam: slak
  niveau: 2
  thema: |-
    een spiraal: vermenigvuldigen met een complex getal
  opgave: |-
    Een tekenprogramma itereert $f(z) = \lambda z$ met $\lambda = 0{,}9\,(\cos 30^\circ + i\sin 30^\circ)$, vanaf $z_0 = 10$. De punten liggen op een spiraal, zoals een slakkenhuis.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef $z_n$ in goniometrische vorm.
      antwoord: |-
        $10 \cdot 0{,}9^n\,\bigl(\cos(30^\circ n) + i\sin(30^\circ n)\bigr)$
      uitwerking: |-
        Elke stap vermenigvuldigt de modulus met 0,9 en draait $30^\circ$.
    - opgave: |-
        Na hoeveel stappen ligt het punt weer op de positieve reële as? Hoe ver is het dan van 0?
      antwoord: |-
        na 12 stappen, op afstand $\approx 2{,}82$
      uitwerking: |-
        $30^\circ \cdot 12 = 360^\circ$, en $10 \cdot 0{,}9^{12} \approx 2{,}82$.
    - opgave: |-
        Na hoeveel stappen is het punt dichter dan 1 bij 0?
      antwoord: |-
        na 22 stappen
      uitwerking: |-
        $10 \cdot 0{,}9^n < 1$ geeft $n > \tfrac{\ln 0{,}1}{\ln 0{,}9} \approx 21{,}9$.
    - opgave: |-
        Waarom is 0 een aantrekkend dekpunt? Welke $\lambda$ geeft een spiraal naar buiten?
      antwoord: |-
        $|\lambda| < 1$; $|\lambda| > 1$
      uitwerking: |-
        $|z_n| = |\lambda|^n |z_0| \to 0$ als $|\lambda| < 1$. Is $|\lambda| > 1$ (en $\lambda$ niet reëel), dan draait de spiraal naar buiten.

- id: h4-o11
  soort: opdracht
  niveau: 2
  thema: |-
    punten van de hoofdcardioide
  opgave: |-
    De rand van de hoofdcardioïde bestaat uit de punten $c = \tfrac w2 - \tfrac{w^2}{4}$ met $|w| = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $c$ voor $w = 1$, $w = -1$, $w = i$ en $w = -i$.
      antwoord: |-
        $\tfrac14$, $-\tfrac34$, $\tfrac14 + \tfrac12 i$, $\tfrac14 - \tfrac12 i$
      uitwerking: |-
        $w = i$: $\tfrac i2 - \tfrac{-1}{4} = \tfrac14 + \tfrac12 i$. $w = -i$ geeft het toegevoegde.
    - opgave: |-
        Toon aan dat bij $w$ en $\bar w$ toegevoegde getallen $c$ horen. Wat zegt dat over de figuur?
      antwoord: |-
        $c(\bar w) = \overline{c(w)}$: symmetrisch ten opzichte van de reële as
      uitwerking: |-
        $\tfrac{\bar w}{2} - \tfrac{\bar w^2}{4} = \overline{\tfrac w2 - \tfrac{w^2}{4}}$.
    - opgave: |-
        Voor $c = \tfrac14 + \tfrac12 i$ is $p = \tfrac w2 = \tfrac i2$ een dekpunt. Controleer, en bereken $|2p|$.
      antwoord: |-
        $\bigl(\tfrac i2\bigr)^2 + \tfrac14 + \tfrac12 i = \tfrac i2$; $|2p| = 1$
      uitwerking: |-
        $-\tfrac14 + \tfrac14 + \tfrac12 i = \tfrac12 i$. Op de rand is het dekpunt aantrekkend noch afstotend volgens het criterium.

- id: h4-o12
  soort: opdracht
  niveau: 2
  thema: |-
    de schijf met periode 2
  opgave: |-
    Heeft $z^2 + c$ een aantrekkende 2-cyclus?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $c = -1 + 0{,}2i$
      antwoord: |-
        ja
      uitwerking: |-
        $|c + 1| = 0{,}2 < \tfrac14$.
    - opgave: |-
        $c = -1{,}2$
      antwoord: |-
        ja
      uitwerking: |-
        $|c + 1| = 0{,}2$.
    - opgave: |-
        $c = -0{,}8 + 0{,}1i$
      antwoord: |-
        ja
      uitwerking: |-
        $|0{,}2 + 0{,}1i| \approx 0{,}224$.
    - opgave: |-
        $c = -1 + 0{,}3i$
      antwoord: |-
        nee
      uitwerking: |-
        $|c + 1| = 0{,}3 > \tfrac14$.

- id: h4-o13
  soort: opdracht
  niveau: 2
  thema: |-
    de voorwaarde $|z| \geqslant |c|$ in de ontsnappingsstraal
  opgave: |-
    De ontsnappingsstraal vraagt $|z| > 2$ én $|z| \geqslant |c|$.
  lijst: enumerate
  delen:
    - opgave: |-
        Neem $c = -5$ en $z = 2{,}2$. Bereken $f(z)$. Waarom is dat geen tegenvoorbeeld voor de stelling?
      antwoord: |-
        $f(2{,}2) = -0{,}16$; want $|z| < |c|$
      uitwerking: |-
        $4{,}84 - 5 = -0{,}16$: de baan komt terug binnen de cirkel. De stelling geldt niet, want $2{,}2 < 5 = |c|$.
    - opgave: |-
        Neem $c = 3i$ en $z_0 = 0$. Toon aan dat de baan ontsnapt.
      antwoord: |-
        $z_1 = 3i$ met $|z_1| = 3 = |c|$
      uitwerking: |-
        $|z_1| = 3 > 2$ en $|z_1| \geqslant |c|$, met $\lambda = 2$: $|z_n| \geqslant 2^{n-1} \cdot 3$.
    - opgave: |-
        Hoeveel stappen zijn er hoogstens nodig tot $|z_n| > 10^6$, als $|z_1| = 3$ en $|c| \leqslant 3$?
      antwoord: |-
        hoogstens 20
      uitwerking: |-
        $|z_{n}| \geqslant 2^{n-1} \cdot 3 > 10^6$ als $2^{n-1} > 333\,334$, dus $n - 1 \geqslant 19$, of $n \geqslant 20$.

- id: h4-o14
  soort: opdracht
  niveau: 2
  thema: |-
    symmetrie van $K_c$ en van $M$
  opgave: |-
    Bewijs de symmetrieën van de figuren.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $z_0$ en $-z_0$ dezelfde baan hebben vanaf $z_1$. Waarom is $K_c$ dus puntsymmetrisch ten opzichte van 0?
      antwoord: |-
        $(-z)^2 + c = z^2 + c$
      uitwerking: |-
        Vanaf $z_1$ zijn de banen gelijk, dus beide zijn begrensd of beide niet.
    - opgave: |-
        Toon aan dat $K_{\bar c}$ het spiegelbeeld is van $K_c$ ten opzichte van de reële as.
      antwoord: |-
        de baan van $\bar z_0$ onder $z^2 + \bar c$ is de toegevoegde van die van $z_0$
      uitwerking: |-
        $\overline{z^2 + c} = \bar z^2 + \bar c$: de toegevoegde baan heeft dezelfde moduli.
    - opgave: |-
        Ligt $c$ op de reële as, wat weet je dan over $K_c$?
      antwoord: |-
        symmetrisch ten opzichte van beide assen
      uitwerking: |-
        Dan is $K_{\bar c} = K_c$ zijn eigen spiegelbeeld ten opzichte van de reële as, en het is puntsymmetrisch: dus ook symmetrisch ten opzichte van de imaginaire as. Zie de basiliek ($c = -1$).

- id: h4-o15
  soort: opdracht
  niveau: 3
  thema: |-
    de reële punten van $M$: $[-2, \tfrac14]$
  opgave: |-
    Toon aan dat een reëel getal $c$ in $M$ ligt als en slechts als $-2 \leqslant c \leqslant \tfrac14$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom ligt $c$ niet in $M$ als $c < -2$, en ook niet als $c > \tfrac14$?
      antwoord: |-
        $|c| > 2$; geen dekpunt en $x^2 + c - x \geqslant c - \tfrac14 > 0$
      uitwerking: |-
        Voor $c < -2$ is $|c| > 2$. Voor $c > \tfrac14$ is $x^2 + c - x = (x - \tfrac12)^2 + c - \tfrac14 \geqslant c - \tfrac14$: elke stap komt er minstens $c - \tfrac14$ bij, en de baan gaat naar $+\infty$.
    - opgave: |-
        Neem $-2 \leqslant c \leqslant \tfrac14$ en $\beta = \tfrac{1 + \sqrt{1 - 4c}}{2}$, het grootste dekpunt. Toon aan: is $|x| \leqslant \beta$, dan is $c \leqslant x^2 + c \leqslant \beta$.
      antwoord: |-
        $x^2 \leqslant \beta^2$ en $\beta^2 + c = \beta$
      uitwerking: |-
        $0 \leqslant x^2 \leqslant \beta^2$, dus $c \leqslant x^2 + c \leqslant \beta^2 + c = \beta$.
    - opgave: |-
        Toon aan dat $-\beta \leqslant c$, en besluit dat de baan van 0 in $[-\beta, \beta]$ blijft.
      antwoord: |-
        $-c \leqslant \beta$ voor $-2 \leqslant c \leqslant \tfrac14$
      uitwerking: |-
        Voor $0 \leqslant c \leqslant \tfrac14$ is $c \geqslant 0 \geqslant -\beta$. Voor $-2 \leqslant c < 0$: $-c \leqslant \beta$ betekent $-2c - 1 \leqslant \sqrt{1 - 4c}$; is $-2c - 1 \leqslant 0$, dan is dat zeker zo, anders kwadrateren: $4c^2 + 4c + 1 \leqslant 1 - 4c$, of $c(c + 2) \leqslant 0$, en dat klopt. Dus $x \in [-\beta, \beta]$ geeft $x^2 + c \in [c, \beta] \subset [-\beta, \beta]$, en de baan van $0 \in [-\beta, \beta]$ blijft erin.

- id: h4-o16
  soort: opdracht
  niveau: 2
  thema: |-
    langzaam ontsnappen bij de inkeping
  opgave: |-
    Voor $c = \tfrac14$ is de baan van 0 begrensd (ze stijgt naar $\tfrac12$), maar voor $c$ net groter dan $\tfrac14$ ontsnapt ze.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel stappen duurt het tot $|z_n| > 2$ voor $c = 0{,}3$? Voor $c = 0{,}26$? Gebruik je rekentoestel of een rekenblad.
      antwoord: |-
        12; 30
      uitwerking: |-
        Bij $0{,}3$ is $z_{12}$ de eerste term boven 2, bij $0{,}26$ is dat $z_{30}$. (Bij $c = 0{,}251$ duurt het 97 stappen.)
    - opgave: |-
        Verklaar waarom het zo lang duurt: wat doet de baan in de buurt van $\tfrac12$?
      antwoord: |-
        de stappen $x^2 + c - x$ zijn daar heel klein
      uitwerking: |-
        Bij $x = \tfrac12$ is $x^2 + c - x = c - \tfrac14$: voor $c = 0{,}26$ is dat maar $0{,}01$. De baan kruipt langs $\tfrac12$, waar bij $c = \tfrac14$ het dekpunt lag.
    - opgave: |-
        Waarom is de rand van $M$ daardoor moeilijk te tekenen?
      antwoord: |-
        punten net buiten $M$ ontsnappen pas na heel veel stappen
      uitwerking: |-
        Met een vast aantal stappen kleurt de computer zulke punten zwart, alsof ze in $M$ liggen. Hoe meer stappen, hoe scherper de rand.

- id: h4-o17
  soort: opdracht
  niveau: 3
  thema: |-
    $K_c$ ligt in de schijf met straal 2
  opgave: |-
    Neem $|c| \leqslant 2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $K_c$ in de schijf $|z| \leqslant 2$ ligt.
      antwoord: |-
        $|z_0| > 2 \geqslant |c|$ ontsnapt
      uitwerking: |-
        Is $|z_0| > 2$, dan is ook $|z_0| \geqslant |c|$, en volgens de ontsnappingsstraal loopt de baan weg: $z_0$ ligt niet in $K_c$.
    - opgave: |-
        Toon met $c = -2$ aan dat je de straal 2 niet kleiner kunt nemen.
      antwoord: |-
        $2 \in K_{-2}$
      uitwerking: |-
        $2^2 - 2 = 2$: een dekpunt met modulus 2, dus 2 ligt in $K_{-2}$.
    - opgave: |-
        Kan een baan die buiten de schijf met straal 2 start toch begrensd zijn als $|c| > 2$? Geef een voorbeeld.
      antwoord: |-
        ja, bijvoorbeeld $c = -6$ en $z_0 = 3$
      uitwerking: |-
        $3^2 - 6 = 3$: het dekpunt 3 van $z^2 - 6$. Voor $|c| > 2$ ligt $K_c$ niet in de schijf met straal 2 (maar dan is $K_c$ stof).

- id: h4-o18
  soort: opdracht
  niveau: 3
  thema: |-
    het konijn: $c$ waarvoor 0 periode 3 heeft
  opgave: |-
    In hoofdstuk 2 zag je dat 0 periode 3 heeft onder $z^2 + c$ als $c^3 + 2c^2 + c + 1 = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat die vergelijking één reële oplossing heeft, en benader ze.
      antwoord: |-
        $c \approx -1{,}7549$
      uitwerking: |-
        $g(c) = c^3 + 2c^2 + c + 1$ heeft $g'(c) = 3c^2 + 4c + 1 = (3c + 1)(c + 1)$, met een lokaal maximum $g(-1) = 1 > 0$ en een minimum $g(-\tfrac13) = \tfrac{23}{27} > 0$. Er is dus maar één nulwaarde, links van $-1$: $c \approx -1{,}7549$.
    - opgave: |-
        De twee andere oplossingen zijn toegevoegd. Bepaal ze met de som van de drie oplossingen, als je weet dat hun reëel deel ongeveer $-0{,}1226$ is. Zoek hun imaginair deel met het product.
      antwoord: |-
        $c \approx -0{,}1226 \pm 0{,}7449i$
      uitwerking: |-
        Som: $-2 = -1{,}7549 + 2a$, dus $a \approx -0{,}1226$. Product: $-1 = -1{,}7549\,(a^2 + b^2)$, dus $a^2 + b^2 \approx 0{,}5698$ en $b \approx 0{,}7449$.
    - opgave: |-
        Controleer met $c = -0{,}1226 + 0{,}7449i$ dat de baan van 0 na drie stappen (bij benadering) terug in 0 is. Welke Julia-verzameling hoort erbij?
      antwoord: |-
        $0 \to c \to -0{,}662 + 0{,}562i \to \approx 0$; het konijn
      uitwerking: |-
        $c^2 \approx -0{,}5399 - 0{,}1827i$, plus $c$ geeft $-0{,}6625 + 0{,}5622i$. Kwadrateren geeft ongeveer $0{,}1229 - 0{,}7449i$, plus $c$ ongeveer 0. Het is (bijna) de $c$ van het konijn in de figuur.

- id: h4-o19
  soort: opdracht
  niveau: 3
  thema: |-
    de cardioide en de schijf raken elkaar
  opgave: |-
    De hoofdcardioïde is $c(t) = \tfrac{\cos t}{2} - \tfrac{\cos 2t}{4} + i\bigl(\tfrac{\sin t}{2} - \tfrac{\sin 2t}{4}\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $c(\pi) = -\tfrac34$ op de rand van de schijf $|c + 1| \leqslant \tfrac14$ ligt.
      antwoord: |-
        $|-\tfrac34 + 1| = \tfrac14$
      uitwerking: |-
        $c(\pi) = -\tfrac12 - \tfrac14 = -\tfrac34$.
    - opgave: |-
        Wat gebeurt er met de baan van 0 voor $c = -\tfrac34$? Gebruik hoofdstuk 2.
      antwoord: |-
        ze gaat heel traag naar $-\tfrac12$
      uitwerking: |-
        Het dekpunt $-\tfrac12$ heeft $f'(-\tfrac12) = -1$: daar ontstaat de 2-cyclus uit het dekpunt ($c = -\tfrac34$ in hoofdstuk 2). De baan $-0{,}75$; $-0{,}1875$; $-0{,}7148$; $-0{,}2390$; \ldots{} springt om $-\tfrac12$ heen en nadert het heel traag.
    - opgave: |-
        Toon aan dat $c(t)$ voor $t = \tfrac{2\pi}{3}$ het punt geeft waar een bolletje met periode 3 de cardioïde raakt, als je weet dat daar $w^3 = 1$.
      antwoord: |-
        $c = -\tfrac18 + \tfrac{3\sqrt3}{8} i \approx -0{,}125 + 0{,}650i$
      uitwerking: |-
        $w = \cos 120^\circ + i\sin 120^\circ = -\tfrac12 + \tfrac{\sqrt3}{2}i$ en $w^2 = -\tfrac12 - \tfrac{\sqrt3}2 i$. Dan $c = \tfrac w2 - \tfrac{w^2}{4} = -\tfrac14 + \tfrac{\sqrt3}{4}i + \tfrac18 + \tfrac{\sqrt3}{8}i = -\tfrac18 + \tfrac{3\sqrt3}{8}i$. Het konijn ($c \approx -0{,}12 + 0{,}75i$) ligt in dat bolletje, er net boven.

- id: h4-o20
  soort: opdracht
  niveau: 3
  thema: |-
    afstotend dekpunt in $\C$
  opgave: |-
    Neem een dekpunt $p$ van $z^2 + c$ met $|2p| > 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat er een $k > 1$ en een $\delta > 0$ zijn zodat $|f(z) - p| \geqslant k\,|z - p|$ voor $|z - p| < \delta$.
      antwoord: |-
        $|z + p| \geqslant |2p| - |z - p|$
      uitwerking: |-
        Kies $1 < k < |2p|$ en $\delta = |2p| - k$. Uit $2p = (z + p) - (z - p)$ volgt $|z + p| \geqslant |2p| - |z - p| > |2p| - \delta = k$, dus $|f(z) - p| = |z + p|\,|z - p| \geqslant k\,|z - p|$.
    - opgave: |-
        Besluit dat $p$ afstotend is.
      antwoord: |-
        zoals in hoofdstuk 1
      uitwerking: |-
        Bleef een baan met $z_0 \neq p$ in de schijf, dan was $\delta > |z_n - p| \geqslant k^n|z_0 - p| \to +\infty$: strijdig.

- id: h4-o21
  soort: opdracht
  niveau: 3
  thema: |-
    periodieke punten van $z^2$ op de eenheidscirkel
  opgave: |-
    Neem $f(z) = z^2$ op de eenheidscirkel, met $z = \cos\theta + i\sin\theta$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\iter fk(z) = z$ als $z^{2^k - 1} = 1$ (voor $z \neq 0$).
      antwoord: |-
        $z^{2^k} = z$
      uitwerking: |-
        $\iter fk(z) = z^{2^k}$, en $z^{2^k} = z$ met $z \neq 0$ geeft $z^{2^k - 1} = 1$.
    - opgave: |-
        Hoeveel punten met periode 2 zijn er? Geef ze.
      antwoord: |-
        2: $\cos 120^\circ \pm i\sin 120^\circ$
      uitwerking: |-
        $z^3 = 1$ en $z \neq 1$: de twee andere derde eenheidswortels. Ze vormen één 2-cyclus.
    - opgave: |-
        Hoeveel punten met periode 3 zijn er, en hoeveel 3-cycli?
      antwoord: |-
        6 punten, 2 cycli
      uitwerking: |-
        $z^7 = 1$ met $z \neq 1$: zes zevende eenheidswortels. Met $\omega = \cos\tfrac{2\pi}7 + i\sin\tfrac{2\pi}{7}$ zijn de cycli $\{\omega, \omega^2, \omega^4\}$ en $\{\omega^3, \omega^6, \omega^5\}$ (want $\omega^8 = \omega$).
    - opgave: |-
        Waarom liggen de periodieke punten overal dicht op de cirkel, en wat betekent dat voor de Julia-verzameling $J_0$?
      antwoord: |-
        er zijn $2^k - 1$ eenheidswortels voor elke $k$
      uitwerking: |-
        De $(2^k - 1)$-de eenheidswortels liggen op gelijke afstand, en die afstand gaat naar 0. Elk punt van de cirkel ligt dus dicht bij een periodiek punt, en al die periodieke punten stoten af: het product van de afgeleiden $2z$ langs een $k$-cyclus heeft modulus $2^k > 1$. Dat is typisch voor een Julia-verzameling: ze is de rand waar de afstotende cycli dicht liggen.

- id: h4-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    De punten met periode 2 van $z^2 + c$ zijn de oplossingen van $z^2 + z + c + 1 = 0$, ook als $c$ complex is. Neem $c = -1 + 0{,}25i$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de 2-cyclus. Gebruik dat $\sqrt{1 - i} \approx 1{,}0987 - 0{,}4551i$.
      antwoord: |-
        $\approx 0{,}0493 - 0{,}2275i$ en $-1{,}0493 + 0{,}2275i$
      uitwerking: |-
        De discriminant is $1 - 4(c + 1) = 1 - i$, dus $z = \tfrac{-1 \pm (1{,}0987 - 0{,}4551i)}{2}$.
    - opgave: |-
        Is de cyclus aantrekkend? Waar ligt $c$ ten opzichte van de schijf met periode 2?
      antwoord: |-
        het criterium beslist niet: $|4(c + 1)| = 1$; op de rand
      uitwerking: |-
        $4(c + 1) = i$, met modulus 1: $c$ ligt op de rand van de schijf $|c + 1| \leqslant \tfrac14$.
    - opgave: |-
        Controleer met $|z_1|$ en $|z_2|$ dat $z_2 = z_0$ voor $z_0 = 0{,}0493 - 0{,}2275i$ (op twee decimalen).
      antwoord: |-
        $z_1 \approx -1{,}05 + 0{,}23i$, $z_2 \approx 0{,}05 - 0{,}23i$
      uitwerking: |-
        $z_0^2 \approx 0{,}0024 - 0{,}0518 - 0{,}0224i = -0{,}0493 - 0{,}0224i$, plus $c$: $-1{,}0493 + 0{,}2276i$. Opnieuw kwadrateren: $1{,}1010 - 0{,}0518 - 0{,}4776i$, plus $c$: $0{,}0492 - 0{,}2276i$.

- id: h4-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: discreet
    onderwerp: |-
      Logica en bewijzen
  opgave: |-
    Bewijs met volledige inductie de ongelijkheid uit de ontsnappingsstraal: is $|z_0| > 2$, $|z_0| \geqslant |c|$ en $\lambda = |z_0| - 1$, dan is $|z_n| \geqslant \lambda^n\,|z_0|$ voor elke $n \in \mathbb{N}$.
  antwoord: |-
    basisstap $n = 0$; inductiestap met $|f(z)| \geqslant (|z| - 1)|z|$
  uitwerking: |-
    Voor $n = 0$ staat er $|z_0| \geqslant |z_0|$. Stel dat $|z_n| \geqslant \lambda^n|z_0|$. Dan is $|z_n| \geqslant |z_0| > 2$ en $|z_n| \geqslant |c|$, dus $|z_{n+1}| \geqslant (|z_n| - 1)\,|z_n| \geqslant (|z_0| - 1)\,|z_n| = \lambda|z_n| \geqslant \lambda^{n+1}|z_0|$. Volgens het principe van volledige inductie geldt de ongelijkheid voor elke $n$.

- id: h4-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Vermenigvuldigen met $\lambda = a + bi$ is in het vlak de lineaire transformatie met matrix $A = \begin{pmatrix} a & -b \\ b & a \end{pmatrix}$: het punt $(x, y)$ hoort bij $x + yi$.
  lijst: enumerate
  delen:
    - opgave: |-
        Controleer dat $A\begin{pmatrix} x \\ y \end{pmatrix}$ hoort bij $(a + bi)(x + yi)$.
      antwoord: |-
        $(ax - by) + (bx + ay)i$
      uitwerking: |-
        $(a + bi)(x + yi) = ax - by + (bx + ay)i$, en $A\begin{pmatrix} x \\ y \end{pmatrix} = \begin{pmatrix} ax - by \\ bx + ay \end{pmatrix}$.
    - opgave: |-
        Neem $\lambda = \tfrac12 + \tfrac12 i$. Bereken $A^2$ en $A^8$ zonder matrices te vermenigvuldigen.
      antwoord: |-
        $A^2 = \begin{pmatrix} 0 & -\frac12 \\ \frac12 & 0 \end{pmatrix}$, $A^8 = \tfrac1{16} I$
      uitwerking: |-
        $\lambda^2 = \tfrac12 i$ en $\lambda^8 = \bigl(\tfrac12 i\bigr)^4 = \tfrac1{16}$. Dus $A^8 = \tfrac1{16} I$: na acht stappen heeft elk punt precies één volle draai gemaakt ($8 \cdot 45^\circ$) en is het 16 keer dichter bij de oorsprong.

- id: h4-t1
  soort: test
  niveau: 1
  opgave: |-
    Bereken de baan van $z_0 = 0{,}5 + 0{,}5i$ onder $f(z) = z^2$ tot $z_3$. Wat gebeurt er met de modulus en het argument?
  antwoord: |-
    $0{,}5i$; $-0{,}25$; $0{,}0625$: de modulus wordt gekwadrateerd, het argument verdubbelt
  uitwerking: |-
    $(0{,}5 + 0{,}5i)^2 = 0{,}25 - 0{,}25 + 0{,}5i = 0{,}5i$. Moduli $0{,}71$; $0{,}5$; $0{,}25$; $0{,}0625$, argumenten $45^\circ$, $90^\circ$, $180^\circ$, $360^\circ$. De baan gaat naar 0.

- id: h4-t2
  soort: test
  niveau: 1
  opgave: |-
    Bepaal de dekpunten van $f(z) = z^2 + 0{,}2 - 0{,}12i$, als je weet dat $(0{,}6 + 0{,}4i)^2 = 0{,}2 + 0{,}48i$. Zijn ze aantrekkend?
  antwoord: |-
    $0{,}8 + 0{,}2i$ afstotend, $0{,}2 - 0{,}2i$ aantrekkend
  uitwerking: |-
    De discriminant is $1 - 4c = 0{,}2 + 0{,}48i = (0{,}6 + 0{,}4i)^2$, dus $p = \tfrac{1 \pm (0{,}6 + 0{,}4i)}{2}$. $|2p_1| = |1{,}6 + 0{,}4i| \approx 1{,}65$ en $|2p_2| = |0{,}4 - 0{,}4i| \approx 0{,}57$.

- id: h4-t3
  soort: test
  niveau: 2
  opgave: |-
    Toon aan dat $c = 0{,}5 + 0{,}5i$ niet in de Mandelbrotverzameling ligt.
  antwoord: |-
    $|z_5| > 2$
  uitwerking: |-
    $0 \to 0{,}5 + 0{,}5i \to 0{,}5 + i \to -0{,}25 + 1{,}5i \to -1{,}6875 - 0{,}25i \to 3{,}2852 + 1{,}3438i$, en $|z_5| > 2 \geqslant |c|$: de baan ontsnapt.

- id: h4-t4
  soort: test
  niveau: 1
  opgave: |-
    Ligt $z_0 = 1$ in de gevulde Julia-verzameling van $c = -1$? En $z_0 = 2$?
  antwoord: |-
    1 wel; 2 niet
  uitwerking: |-
    $1 \to 0 \to -1 \to 0$: begrensd. $2 \to 3$, met $|3| > 2$: de baan ontsnapt.

- id: h4-t5
  soort: test
  niveau: 2
  opgave: |-
    Toon aan dat $p = 0{,}2 - 0{,}2i$ een dekpunt is van $z^2 + c$ met $c = 0{,}2 - 0{,}12i$. Waarom ligt $c$ in de Mandelbrotverzameling?
  antwoord: |-
    $p^2 + c = p$ en $|2p| < 1$: $c$ ligt in de hoofdcardioïde
  uitwerking: |-
    $p^2 = 0{,}04 - 0{,}08i - 0{,}04 = -0{,}08i$, en $-0{,}08i + 0{,}2 - 0{,}12i = 0{,}2 - 0{,}2i$. $|2p| = |0{,}4 - 0{,}4i| \approx 0{,}57 < 1$: een aantrekkend dekpunt, dus $c$ ligt in de hoofdcardioïde en in $M$.

- id: h4-t6
  soort: test
  niveau: 1
  opgave: |-
    Welke $c$ geeft het aantrekkende dekpunt $p = 0{,}3i$?
  antwoord: |-
    $c = 0{,}09 + 0{,}3i$
  uitwerking: |-
    $c = p - p^2 = 0{,}3i + 0{,}09$, en $|2p| = 0{,}6 < 1$.

- id: h4-t7
  soort: test
  niveau: 2
  opgave: |-
    Heeft $z^2 + c$ een aantrekkende 2-cyclus voor $c = -1{,}15 + 0{,}1i$? En voor $c = -1{,}2 + 0{,}2i$?
  antwoord: |-
    ja ($0{,}18$); nee ($0{,}28$)
  uitwerking: |-
    $|c + 1| = |-0{,}15 + 0{,}1i| \approx 0{,}180 < \tfrac14$ en $|-0{,}2 + 0{,}2i| \approx 0{,}283 > \tfrac14$.
