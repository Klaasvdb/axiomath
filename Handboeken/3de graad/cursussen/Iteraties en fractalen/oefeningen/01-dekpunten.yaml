# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(f(2))$ als $f(x) = x^2 - 3$
      antwoord: |-
        $-2$
      uitwerking: |-
        $f(2) = 1$ en $f(1) = -2$.
    - opgave: |-
        $f(f(x))$ als $f(x) = 2x + 1$
      antwoord: |-
        $4x + 3$
      uitwerking: |-
        $f(2x + 1) = 2(2x + 1) + 1 = 4x + 3$.
    - opgave: |-
        de oplossingen van $x^2 - 2 = x$
      antwoord: |-
        $2$ en $-1$
      uitwerking: |-
        $x^2 - x - 2 = (x - 2)(x + 1) = 0$.
    - opgave: |-
        $f'(4)$ als $f(x) = \sqrt{x}$
      antwoord: |-
        $\tfrac14$
      uitwerking: |-
        $f'(x) = \dfrac{1}{2\sqrt x}$, dus $f'(4) = \tfrac14$.
    - opgave: |-
        $\displaystyle\lim_{n \to +\infty} 0{,}6^{\,n}$ en $\displaystyle\lim_{n \to +\infty} (-1{,}2)^n$
      antwoord: |-
        0; bestaat niet
      uitwerking: |-
        $|0{,}6| < 1$, dus de limiet is 0. Bij $-1{,}2$ wisselt het teken en groeit de absolute waarde: geen limiet.
    - opgave: |-
        $\cos 0{,}5$ (in radialen, op vier decimalen)
      antwoord: |-
        $0{,}8776$
      uitwerking: |-
        Zet het rekentoestel in radialen: $\cos 0{,}5 \approx 0{,}8776$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Gebruik je rekentoestel en druk telkens opnieuw op dezelfde toets.
  lijst: enumerate
  delen:
    - opgave: |-
        Tik 16 in en druk vijf keer op $\sqrt{\ }$. Doe hetzelfde met 0,01. Wat stel je vast?
      antwoord: |-
        beide banen gaan naar 1
      uitwerking: |-
        Vanuit 16: 4; 2; 1,414; 1,189; 1,091. Vanuit 0,01: 0,1; 0,316; 0,562; 0,750; 0,866. De ene daalt, de andere stijgt, maar beide gaan naar 1.
    - opgave: |-
        Welke startwaarde verandert helemaal niet bij $\sqrt{\ }$? Zijn er meer?
      antwoord: |-
        0 en 1
      uitwerking: |-
        $\sqrt x = x$ geeft $x = x^2$, dus $x = 0$ of $x = 1$.
    - opgave: |-
        Tik 0,9 in en druk vijf keer op $x^2$. Doe hetzelfde met 1,1. Wat stel je vast?
      antwoord: |-
        vanuit 0,9 naar 0, vanuit 1,1 naar oneindig
      uitwerking: |-
        Vanuit 0,9: 0,81; 0,656; 0,430; 0,185; 0,034. Vanuit 1,1: 1,21; 1,464; 2,144; 4,595; 21,11.
    - opgave: |-
        Bij $\sqrt{\ }$ komen beide startwaarden bij hetzelfde getal uit, bij $x^2$ niet, hoewel ook daar 1 niet verandert. Welk verschil tussen de twee grafieken bij $x = 1$ zou dat kunnen verklaren?
      antwoord: |-
        $\sqrt x$ is in 1 minder steil dan $y = x$, $x^2$ steiler
      uitwerking: |-
        De raaklijn aan $y = \sqrt x$ in $(1, 1)$ heeft richtingscoëfficiënt $\tfrac12$, die aan $y = x^2$ heeft richtingscoëfficiënt 2. Je vermoeden wordt bevestigd in sectie 3.

- id: h1-baan
  soort: kort
  opgave: |-
    Bereken de baan tot $x_4$ (op vier decimalen, of als breuk waar het kan).
  lijst: reeks
  kolommen: 1
  delen:
    - opgave: |-
        $f(x) = x^2 - 2$, \ $x_0 = 0{,}5$
      antwoord: |-
        $-1{,}75$; $1{,}0625$; $-0{,}8711$; $-1{,}2412$
      uitwerking: |-
        $x_1 = 0{,}25 - 2 = -1{,}75$, $x_2 = 3{,}0625 - 2 = 1{,}0625$, $x_3 \approx -0{,}8711$, $x_4 \approx -1{,}2412$. De baan lijkt geen richting te kiezen.
    - opgave: |-
        $f(x) = \dfrac{3}{1 + x}$, \ $x_0 = 0$
      antwoord: |-
        $3$; $\tfrac34$; $\tfrac{12}7$; $\tfrac{21}{19}$
      uitwerking: |-
        $x_1 = 3$, $x_2 = \tfrac34$, $x_3 = \tfrac{3}{7/4} = \tfrac{12}{7}$, $x_4 = \tfrac{3}{19/7} = \tfrac{21}{19}$. De baan springt heen en weer, met steeds kleinere sprongen.
    - opgave: |-
        $f(x) = \sqrt{x + 1}$, \ $x_0 = 0$
      antwoord: |-
        $1$; $1{,}4142$; $1{,}5538$; $1{,}5981$
      uitwerking: |-
        $x_1 = 1$, $x_2 = \sqrt2$, $x_3 = \sqrt{1 + \sqrt 2} \approx 1{,}5538$, $x_4 \approx 1{,}5981$. De baan stijgt, en lijkt naar ongeveer 1,62 te gaan.

- id: h1-spinnenweb
  soort: kort
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[scale=.6,font=\scriptsize]
        \rooster{0}{1}{7}{0}{1}{7}
        \eerstebissectrice{0}{7.2}
        \kromme{0}{7.2}{2*sqrt(\x)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f(x) = 2\sqrt x$ en de rechte $y = x$. Neem ze over en teken het spinnenwebdiagram.
  lijst: enumerate
  delen:
    - opgave: |-
        voor $x_0 = 0{,}5$ (vier stappen)
      antwoord: |-
        een trap naar boven, naar 4
      uitwerking: |-
        $x_1 \approx 1{,}41$, $x_2 \approx 2{,}38$, $x_3 \approx 3{,}08$, $x_4 \approx 3{,}51$: een trap omhoog naar het snijpunt $(4, 4)$. Zie de figuur bij b.
    - opgave: |-
        voor $x_0 = 6{,}5$ (drie stappen)
      antwoord: |-
        een trap naar beneden, naar 4
      uitwerking: |-
        $x_1 \approx 5{,}10$, $x_2 \approx 4{,}52$, $x_3 \approx 4{,}25$: een trap omlaag naar $(4, 4)$.

        \begin{tikzpicture}[scale=.5,font=\scriptsize]
          \rooster{0}{1}{7}{0}{1}{7}
          \eerstebissectrice{0}{7.2}
          \kromme{0}{7.2}{2*sqrt(\x)}
          \spinnenweb{2*sqrt(\x)}{.5}{4}
          \spinnenweb{2*sqrt(\x)}{6.5}{3}
          \fill[accent] (4,4) circle (3pt);
        \end{tikzpicture}

- id: h1-startwaarde
  soort: kort
  opgave: |-
    Geef een formule voor $x_n$ en beschrijf de baan van $x_0$ voor elke startwaarde.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = \sqrt x$, met $x_0 \geqslant 0$
      antwoord: |-
        $x_n = x_0^{\,1/2^n}$; naar 1 als $x_0 > 0$, constant 0 als $x_0 = 0$
      uitwerking: |-
        Elke stap neemt een vierkantswortel: $x_n = x_0^{\,1/2^n}$. De exponent gaat naar 0, dus voor $x_0 > 0$ gaat $x_n$ naar $x_0^{\,0} = 1$ (stijgend als $x_0 < 1$, dalend als $x_0 > 1$). De baan van 0 blijft 0.
    - opgave: |-
        $f(x) = -x^3$
      antwoord: |-
        $x_n = (-1)^n x_0^{\,3^n}$; naar 0 als $|x_0| < 1$, afwisselend $1$ en $-1$ als $|x_0| = 1$, wegspringend als $|x_0| > 1$
      uitwerking: |-
        $x_1 = -x_0^3$, $x_2 = -(-x_0^3)^3 = x_0^9$, en zo verder: $x_n = (-1)^n x_0^{\,3^n}$. Is $|x_0| < 1$, dan gaat de baan naar 0, met wisselend teken. Is $x_0 = 1$, dan is de baan $1, -1, 1, -1, \ldots$ (en zo ook bij $-1$). Is $|x_0| > 1$, dan groeit $|x_n|$ naar oneindig, met wisselend teken.

- id: h1-dekpunten
  soort: kort
  opgave: |-
    Bepaal de dekpunten.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $x^2 - 4x + 6$
      antwoord: |-
        2 en 3
      uitwerking: |-
        $x^2 - 5x + 6 = (x - 2)(x - 3) = 0$.
    - opgave: |-
        $\sqrt{5x - 4}$
      antwoord: |-
        1 en 4
      uitwerking: |-
        Kwadrateren: $x^2 - 5x + 4 = 0$, dus $x = 1$ of $x = 4$. Controle: $\sqrt1 = 1$ en $\sqrt{16} = 4$: beide voldoen.
    - opgave: |-
        $\dfrac4x$
      antwoord: |-
        $2$ en $-2$
      uitwerking: |-
        $\tfrac4x = x$ geeft $x^2 = 4$.
    - opgave: |-
        $x^3 + x$
      antwoord: |-
        0
      uitwerking: |-
        $x^3 + x = x$ geeft $x^3 = 0$.

- id: h1-criterium
  soort: kort
  opgave: |-
    Is elk dekpunt (uit de vorige oefening) aantrekkend, afstotend, of beslist het criterium niet?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 - 4x + 6$
      antwoord: |-
        2 aantrekkend, 3 afstotend
      uitwerking: |-
        $f'(x) = 2x - 4$: $f'(2) = 0$ en $f'(3) = 2$.
    - opgave: |-
        $\sqrt{5x - 4}$
      antwoord: |-
        1 afstotend, 4 aantrekkend
      uitwerking: |-
        $f'(x) = \dfrac{5}{2\sqrt{5x - 4}}$: $f'(1) = \tfrac52$ en $f'(4) = \tfrac58$.
    - opgave: |-
        $\dfrac4x$
      antwoord: |-
        het criterium beslist niet
      uitwerking: |-
        $f'(x) = -\tfrac{4}{x^2}$, dus $f'(\pm 2) = -1$. Inderdaad: $f(f(x)) = x$, zodat elke baan heen en weer springt tussen $x_0$ en $\tfrac{4}{x_0}$. Het dekpunt trekt niet aan en stoot niet af.

- id: h1-grensgeval
  soort: kort
  opgave: |-
    Het getal 0 is een dekpunt met $f'(0) = 1$. Onderzoek de baan van een startwaarde $x_0$ met $0 < x_0 < 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = x - x^3$
      antwoord: |-
        ze daalt naar 0
      uitwerking: |-
        Voor $0 < x < 1$ is $x^3 > 0$ en $x - x^3 = x(1 - x^2) > 0$, dus $0 < f(x) < x$. De baan daalt en blijft positief: ze convergeert naar een dekpunt in $[0, x_0[$, en het enige is 0 ($x - x^3 = x$ geeft $x = 0$). Vanuit 0,5: 0,375; 0,322; 0,289: heel traag.
    - opgave: |-
        $f(x) = x + x^3$
      antwoord: |-
        ze stijgt en verlaat elk interval rond 0
      uitwerking: |-
        Voor $x > 0$ is $f(x) > x$, dus de baan stijgt. Bleef ze begrensd, dan ging ze naar een dekpunt groter dan $x_0 > 0$, maar het enige dekpunt is 0. Dus $x_n \to +\infty$.

- id: h1-gebied
  soort: kort
  opgave: |-
    Bepaal het aantrekkingsgebied van het dekpunt 0 van $f(x) = \tfrac12 x^2$.
  antwoord: |-
    $]-2, 2[$
  uitwerking: |-
    De dekpunten zijn 0 en 2, en $f(x) - x = \tfrac12 x(x - 2)$. Voor $0 < x < 2$ is $0 < f(x) < x$: de baan daalt naar een dekpunt in $[0, x_0[$, dus naar 0. Voor $-2 < x_0 < 0$ is $x_1 = f(-x_0)$, en dat is weer het vorige geval. Voor $|x_0| > 2$ is $x_1 > 2$ en $f(x) > x$ daarboven: de baan stijgt naar $+\infty$. De startwaarden $\pm 2$ gaan naar het dekpunt 2.

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    een baan berekenen
  opgave: |-
    Bereken de baan tot $x_4$ en zeg wat je verwacht voor grote $n$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = 2x(1 - x)$, \ $x_0 = 0{,}1$
      antwoord: |-
        $0{,}18$; $0{,}2952$; $0{,}4161$; $0{,}4859$; naar $\tfrac12$
      uitwerking: |-
        De baan stijgt en nadert het dekpunt $\tfrac12$: $2x(1 - x) = x$ geeft $x = 0$ of $x = \tfrac12$.
    - opgave: |-
        $f(x) = \sqrt x + 2$, \ $x_0 = 0$
      antwoord: |-
        $2$; $3{,}4142$; $3{,}8478$; $3{,}9616$; naar 4
      uitwerking: |-
        $\sqrt x + 2 = x$ geeft $\sqrt x = x - 2$; met $x \geqslant 2$ en kwadrateren: $x = 4$. De baan stijgt naar 4.
    - opgave: |-
        $f(x) = \dfrac{1}{2 - x}$, \ $x_0 = 0$
      antwoord: |-
        $\tfrac12$; $\tfrac23$; $\tfrac34$; $\tfrac45$; naar 1
      uitwerking: |-
        Het patroon is $x_n = \tfrac{n}{n + 1}$, want $\dfrac{1}{2 - \frac{n}{n+1}} = \dfrac{n + 1}{n + 2}$. Dus $x_n \to 1$, maar traag: het dekpunt 1 heeft $f'(1) = 1$.
    - opgave: |-
        $f(x) = |x - 4|$, \ $x_0 = 1$
      antwoord: |-
        $3$; $1$; $3$; $1$; blijft springen
      uitwerking: |-
        $|1 - 4| = 3$ en $|3 - 4| = 1$: de baan herhaalt zich met periode 2 en komt nooit tot rust.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    dekpunten bepalen
  opgave: |-
    Bepaal de dekpunten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 - 6$
      antwoord: |-
        3 en $-2$
      uitwerking: |-
        $x^2 - x - 6 = (x - 3)(x + 2) = 0$.
    - opgave: |-
        $\sqrt{x + 6}$
      antwoord: |-
        3
      uitwerking: |-
        Kwadrateren geeft dezelfde vergelijking als bij a, maar $\sqrt{4} = 2 \neq -2$: alleen 3 voldoet.
    - opgave: |-
        $\dfrac{6}{x + 1}$
      antwoord: |-
        2 en $-3$
      uitwerking: |-
        $6 = x^2 + x$, dus $(x - 2)(x + 3) = 0$.
    - opgave: |-
        $x^3 - 3x$
      antwoord: |-
        $0$, $2$ en $-2$
      uitwerking: |-
        $x^3 - 4x = x(x - 2)(x + 2) = 0$.
    - opgave: |-
        $1 + \dfrac1x$
      antwoord: |-
        $\tfrac{1 \pm \sqrt5}{2}$
      uitwerking: |-
        $x + 1 = x^2$, dus $x^2 - x - 1 = 0$.
    - opgave: |-
        $\e^x$
      antwoord: |-
        geen
      uitwerking: |-
        $h(x) = \e^x - x$ heeft $h'(x) = \e^x - 1$, met een minimum $h(0) = 1 > 0$. Dus $\e^x > x$ voor elke $x$: de grafiek ligt boven $y = x$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    dekpunten en het criterium
  opgave: |-
    Bepaal de dekpunten en zeg van elk of het aantrekkend of afstotend is.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \tfrac12 x^2$
      antwoord: |-
        0 aantrekkend, 2 afstotend
      uitwerking: |-
        $f'(x) = x$: $f'(0) = 0$, $f'(2) = 2$.
    - opgave: |-
        $f(x) = \dfrac{3}{x + 2}$
      antwoord: |-
        1 aantrekkend, $-3$ afstotend
      uitwerking: |-
        $x^2 + 2x - 3 = 0$ geeft 1 en $-3$. $f'(x) = -\tfrac{3}{(x+2)^2}$: $f'(1) = -\tfrac13$, $f'(-3) = -3$.
    - opgave: |-
        $f(x) = x^3$
      antwoord: |-
        0 aantrekkend, 1 en $-1$ afstotend
      uitwerking: |-
        $f'(x) = 3x^2$: $f'(0) = 0$, $f'(\pm1) = 3$.
    - opgave: |-
        $f(x) = \sqrt{3x - 2}$
      antwoord: |-
        1 afstotend, 2 aantrekkend
      uitwerking: |-
        $x^2 - 3x + 2 = 0$ geeft 1 en 2, en beide voldoen. $f'(x) = \dfrac{3}{2\sqrt{3x - 2}}$: $f'(1) = \tfrac32$, $f'(2) = \tfrac34$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    spinnenwebdiagram aflezen
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[scale=.85,font=\scriptsize]
        \rooster{-1}{1}{4}{0}{1}{4}
        \eerstebissectrice{0}{4.2}
        \kromme{-1}{3.6}{(\x*\x+3)/4}
        \node[accent,right] at (3.6,3.99) {$f$};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van een functie $f$ en de rechte $y = x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees de dekpunten af.
      antwoord: |-
        1 en 3
      uitwerking: |-
        De grafiek snijdt $y = x$ in $(1, 1)$ en $(3, 3)$.
    - opgave: |-
        Welk dekpunt is aantrekkend? Hoe zie je dat zonder te rekenen?
      antwoord: |-
        1: daar is de grafiek minder steil dan $y = x$
      uitwerking: |-
        In $(1, 1)$ stijgt de grafiek minder steil dan $y = x$, dus $0 < f'(1) < 1$. In $(3, 3)$ stijgt ze steiler, dus $f'(3) > 1$: afstotend.
    - opgave: |-
        Neem de figuur over en teken het spinnenwebdiagram van $x_0 = 2{,}5$. Waar gaat de baan heen?
      antwoord: |-
        een trap naar beneden, naar 1
      uitwerking: |-
        Tussen 1 en 3 ligt de grafiek onder $y = x$: elke stap gaat naar links, en de trap daalt naar $(1, 1)$.
    - opgave: |-
        Waar gaat de baan van $x_0 = -1$ heen?
      antwoord: |-
        naar 1
      uitwerking: |-
        $f(-1) = 1$ (de grafiek is symmetrisch ten opzichte van de $y$-as, met $f(x) = \tfrac14(x^2 + 3)$): de baan staat na één stap in het dekpunt.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    begrippen, klassieke fouten
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Een dekpunt van $f$ vind je als snijpunt van de grafiek van $f$ met de $x$-as.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: een dekpunt is een oplossing van $f(x) = x$, dus een snijpunt met de rechte $y = x$. Het snijpunt met de $x$-as is een nulwaarde.
    - opgave: |-
        Is $f'(p) = -2$ in een dekpunt $p$, dan is $p$ aantrekkend, want de afgeleide is negatief.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: het gaat om $|f'(p)| = 2 > 1$, dus $p$ is afstotend. Het teken zegt alleen of de baan springt.
    - opgave: |-
        Als de baan van $x_0$ onder een continue functie $f$ convergeert, dan is haar limiet een dekpunt van $f$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: dat is de stelling uit sectie 2.
    - opgave: |-
        Is $|f'(p)| = 1$, dan is het dekpunt $p$ aantrekkend noch afstotend.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: het criterium beslist dan niet, maar het dekpunt kan aantrekkend zijn (zoals 0 bij $\sin x$) of afstotend (zoals 0 bij $x + x^3$).
    - opgave: |-
        $\iter{f}{2}(x) = \bigl(f(x)\bigr)^2$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $\iter{f}{2}(x) = f(f(x))$. Bij $f(x) = x + 1$ is $f(f(x)) = x + 2$, maar $(f(x))^2 = x^2 + 2x + 1$.
    - opgave: |-
        Is $p$ een aantrekkend dekpunt, dan convergeert elke baan naar $p$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: alleen de banen die dicht genoeg bij $p$ starten. Bij $x^2$ is 0 aantrekkend, maar de baan van 2 gaat naar oneindig.

- id: h1-o6
  soort: opdracht
  prent:
    naam: bever
  niveau: 2
  thema: |-
    populatiemodel, dekpunten in een context
  opgave: |-
    In een rivierdal leven 100 bevers. Een bioloog voorspelt het aantal na $n$ jaar met
    \[
    N_n = \frac{3\,N_{n-1}}{1 + N_{n-1}/500} .
    \]
    Zonder beperking zou de populatie elk jaar verdrievoudigen; de noemer remt de groei als het dal vol raakt.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $N_1$ tot $N_4$.
      antwoord: |-
        250; 500; 750; 900
      uitwerking: |-
        $N_1 = \tfrac{300}{1{,}2} = 250$, $N_2 = \tfrac{750}{1{,}5} = 500$, $N_3 = \tfrac{1500}{2} = 750$, $N_4 = \tfrac{2250}{2{,}5} = 900$.
    - opgave: |-
        Bepaal de dekpunten.
      antwoord: |-
        0 en 1000
      uitwerking: |-
        $N = \dfrac{3N}{1 + N/500}$ geeft $N = 0$ of $1 + \tfrac{N}{500} = 3$, dus $N = 1000$.
    - opgave: |-
        Zijn ze aantrekkend of afstotend? Wat betekent dat voor de bevers?
      antwoord: |-
        0 afstotend, 1000 aantrekkend
      uitwerking: |-
        $f(N) = \dfrac{1500N}{500 + N}$ heeft $f'(N) = \dfrac{750\,000}{(500 + N)^2}$, dus $f'(0) = 3$ en $f'(1000) = \tfrac13$. Een kleine populatie groeit weg van 0, en elke populatie in de buurt van 1000 stabiliseert op 1000 bevers.
    - opgave: |-
        Een overstroming halveert de populatie van 1000 bevers. Hoeveel jaar duurt het tot er weer meer dan 990 zijn?
      antwoord: |-
        5 jaar
      uitwerking: |-
        Vanuit 500: 750; 900; $\approx 964{,}3$; $\approx 987{,}8$; $\approx 995{,}9$. Na 5 jaar zijn er meer dan 990.

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    spinnenwebdiagram tekenen en verklaren
  opgave: |-
    Neem $f(x) = 2 - \tfrac14 x^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de grafiek van $f$ op $[0, 3]$ en de rechte $y = x$, en teken het spinnenwebdiagram van $x_0 = 0$ (vijf stappen).
      antwoord: |-
        een spinnenweb rond $(1{,}46; 1{,}46)$
      uitwerking: |-
        De baan is $0$; $2$; $1$; $1{,}75$; $1{,}234$; $1{,}619$. Ze springt om het snijpunt heen, met steeds kleinere sprongen.

        \begin{tikzpicture}[scale=1.2,font=\scriptsize]
          \rooster{0}{1}{3}{0}{1}{3}
          \eerstebissectrice{0}{2.4}
          \kromme{0}{2.8}{2-\x*\x/4}
          \spinnenweb{2-\x*\x/4}{0}{5}
          \fill[accent] (1.464,1.464) circle (1.6pt);
        \end{tikzpicture}
    - opgave: |-
        Bepaal het dekpunt in $[0, 3]$ exact.
      antwoord: |-
        $p = 2\sqrt3 - 2 \approx 1{,}464$
      uitwerking: |-
        $2 - \tfrac14 x^2 = x$ geeft $x^2 + 4x - 8 = 0$, dus $x = -2 \pm 2\sqrt 3$. In $[0, 3]$ ligt $2\sqrt3 - 2$.
    - opgave: |-
        Verklaar de vorm van het diagram met $f'(p)$.
      antwoord: |-
        $f'(p) = 1 - \sqrt3 \approx -0{,}73$
      uitwerking: |-
        $f'(x) = -\tfrac12 x$, dus $f'(p) = 1 - \sqrt 3 \approx -0{,}73$. Omdat $|f'(p)| < 1$, trekt het dekpunt aan; omdat $f'(p) < 0$, springt de baan om $p$ heen: een spinnenweb dat zich toesnoert.

- id: h1-o8
  soort: opdracht
  niveau: 1
  thema: |-
    lineaire functies
  opgave: |-
    Voor een lineaire functie $f(x) = ax + b$ is de baan een rij met $x_n = a\,x_{n-1} + b$, zoals in de cursus Rijen. Bepaal het dekpunt, en zeg of het aantrekkend of afstotend is.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $f(x) = 0{,}5x + 3$
      antwoord: |-
        6, aantrekkend
      uitwerking: |-
        $0{,}5x + 3 = x$ geeft $x = 6$; $f'(6) = 0{,}5$.
    - opgave: |-
        $f(x) = -2x + 9$
      antwoord: |-
        3, afstotend
      uitwerking: |-
        $3x = 9$; $f'(3) = -2$.
    - opgave: |-
        $f(x) = -0{,}8x + 18$
      antwoord: |-
        10, aantrekkend
      uitwerking: |-
        $1{,}8x = 18$; $f'(10) = -0{,}8$.
  slot: |-
    Waarom is bij een lineaire functie een aantrekkend dekpunt meteen aantrekkend voor elke startwaarde?
  antwoord: |-
    Bij een lineaire functie is $f(x) - p = a\,(x - p)$ voor elke $x$, niet alleen dicht bij $p$: de afstand tot $p$ wordt bij elke stap precies $|a|$ keer zo groot, waar je ook begint.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    aantrekkingsgebied, expliciete baan
  opgave: |-
    Neem $f(x) = 2x - x^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de dekpunten en hun soort.
      antwoord: |-
        0 afstotend, 1 aantrekkend
      uitwerking: |-
        $2x - x^2 = x$ geeft $x = 0$ of $x = 1$. $f'(x) = 2 - 2x$: $f'(0) = 2$ en $f'(1) = 0$.
    - opgave: |-
        Toon aan dat $1 - f(x) = (1 - x)^2$, en leid af dat $1 - x_n = (1 - x_0)^{2^n}$.
      antwoord: |-
        $1 - 2x + x^2 = (1 - x)^2$
      uitwerking: |-
        $1 - (2x - x^2) = 1 - 2x + x^2 = (1 - x)^2$. Dus $1 - x_1 = (1 - x_0)^2$, $1 - x_2 = (1 - x_1)^2 = (1 - x_0)^4$, en zo verder: de exponent verdubbelt bij elke stap.
    - opgave: |-
        Bepaal het aantrekkingsgebied van 1.
      antwoord: |-
        $]0, 2[$
      uitwerking: |-
        $x_n \to 1$ als $(1 - x_0)^{2^n} \to 0$, dus als $|1 - x_0| < 1$, of $0 < x_0 < 2$. Bij $x_0 = 0$ of $x_0 = 2$ is $1 - x_n = 1$ vanaf $n = 1$, dus $x_n = 0$. Daarbuiten gaat $1 - x_n \to +\infty$, dus $x_n \to -\infty$.
    - opgave: |-
        Bereken $x_5$ voor $x_0 = 1{,}9$, zonder de tussenstappen.
      antwoord: |-
        $x_5 \approx 0{,}9657$
      uitwerking: |-
        $1 - x_5 = (-0{,}9)^{32} = 0{,}9^{32} \approx 0{,}0343$, dus $x_5 \approx 0{,}9657$.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    een oneindige wortel
  opgave: |-
    Wat betekent $\sqrt{2 + \sqrt{2 + \sqrt{2 + \cdots}}}$? Je kunt het zien als de limiet van de baan van $x_0 = 0$ onder $f(x) = \sqrt{2 + x}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $x_1$ tot $x_4$ op vijf decimalen.
      antwoord: |-
        $1{,}41421$; $1{,}84776$; $1{,}96157$; $1{,}99037$
      uitwerking: |-
        $x_1 = \sqrt2$, $x_2 = \sqrt{2 + \sqrt 2}$, en zo verder.
    - opgave: |-
        Bepaal het dekpunt, en toon aan dat het aantrekkend is.
      antwoord: |-
        2, met $f'(2) = \tfrac14$
      uitwerking: |-
        $\sqrt{2 + x} = x$ geeft $x^2 - x - 2 = 0$, dus 2 (want $-1$ voldoet niet: $\sqrt1 \neq -1$). $f'(x) = \dfrac{1}{2\sqrt{2 + x}}$, dus $f'(2) = \tfrac14 < 1$.
    - opgave: |-
        De baan stijgt en blijft onder 2 (dat mag je aannemen). Waarom is de oneindige wortel dan gelijk aan 2?
      antwoord: |-
        een stijgende, begrensde rij convergeert, naar een dekpunt
      uitwerking: |-
        Een stijgende, naar boven begrensde rij convergeert (Rijen). Omdat $f$ continu is, is de limiet een dekpunt, en het enige dekpunt is 2.
    - opgave: |-
        Welk getal is $\sqrt{6 + \sqrt{6 + \sqrt{6 + \cdots}}}$? En $\sqrt{a + \sqrt{a + \cdots}}$ voor $a > 0$?
      antwoord: |-
        3; $\tfrac{1 + \sqrt{1 + 4a}}{2}$
      uitwerking: |-
        $x^2 - x - 6 = 0$ geeft 3. In het algemeen $x^2 - x - a = 0$, met de positieve oplossing $\tfrac{1 + \sqrt{1 + 4a}}{2}$.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    een kettingbreuk, springend naar het dekpunt
  opgave: |-
    De kettingbreuk $1 + \cfrac{1}{1 + \cfrac{1}{1 + \cdots}}$ is de limiet van de baan van $x_0 = 1$ onder $f(x) = 1 + \tfrac1x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $x_1$ tot $x_5$ als breuk.
      antwoord: |-
        $2$; $\tfrac32$; $\tfrac53$; $\tfrac85$; $\tfrac{13}8$
      uitwerking: |-
        $1 + \tfrac11 = 2$, $1 + \tfrac12 = \tfrac32$, $1 + \tfrac23 = \tfrac53$, $1 + \tfrac35 = \tfrac85$, $1 + \tfrac58 = \tfrac{13}{8}$: quotiënten van opeenvolgende getallen van Fibonacci.
    - opgave: |-
        Bepaal het positieve dekpunt $\varphi$ en $f'(\varphi)$.
      antwoord: |-
        $\varphi = \tfrac{1 + \sqrt5}{2} \approx 1{,}618$, $f'(\varphi) \approx -0{,}382$
      uitwerking: |-
        $x^2 - x - 1 = 0$. $f'(x) = -\tfrac1{x^2}$, dus $f'(\varphi) = -\tfrac{1}{\varphi^2} \approx -0{,}382$.
    - opgave: |-
        Verklaar met $f'(\varphi)$ waarom de breuken afwisselend groter en kleiner zijn dan $\varphi$, en ongeveer hoeveel keer dichter elke stap komt.
      antwoord: |-
        $f'(\varphi) < 0$: springend; ongeveer 2,6 keer dichter per stap
      uitwerking: |-
        Omdat $-1 < f'(\varphi) < 0$, trekt $\varphi$ aan en springt de baan om $\varphi$ heen. De afstand wordt per stap ongeveer met $0{,}382$ vermenigvuldigd, dus ongeveer $1/0{,}382 \approx 2{,}6$ keer kleiner.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    een afstotend dekpunt in de praktijk
  opgave: |-
    Zet je rekentoestel in radialen en itereer $f(x) = 2\cos x$ vanaf $x_0 = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $x_1$ tot $x_6$. Komt de baan tot rust?
      antwoord: |-
        $1{,}0806$; $0{,}9416$; $1{,}1770$; $0{,}7674$; $1{,}4395$; $0{,}2619$; nee
      uitwerking: |-
        De sprongen worden groter in plaats van kleiner. Ook na honderden stappen blijft de baan heen en weer springen tussen ongeveer $-0{,}8$ en $2$.
    - opgave: |-
        Toon aan dat $f$ een dekpunt heeft tussen 1 en 1,1, en benader het op drie decimalen.
      antwoord: |-
        $p \approx 1{,}030$
      uitwerking: |-
        $h(x) = 2\cos x - x$ is continu met $h(1) \approx 0{,}081 > 0$ en $h(1{,}1) \approx -0{,}192 < 0$: volgens de tussenwaardestelling is er een nulwaarde. Door insluiten: $p \approx 1{,}0299$.
    - opgave: |-
        Verklaar waarom de iteratie het dekpunt niet vindt, hoewel ze er vlakbij begint.
      antwoord: |-
        $f'(p) = -2\sin p \approx -1{,}71$: afstotend
      uitwerking: |-
        $|f'(p)| \approx 1{,}71 > 1$, dus het dekpunt stoot af: de afstand tot $p$ wordt per stap ongeveer 1,7 keer groter, en de baan springt om $p$ heen weg.

- id: h1-o13
  soort: opdracht
  niveau: 1
  thema: |-
    de vorm van het diagram uit $f'(p)$
  opgave: |-
    In een dekpunt $p$ van $f$ is de afgeleide gegeven. Beschrijf de baan van een startwaarde vlak bij $p$: gaat ze naar $p$ of ervan weg, en als trap of als spinnenweb?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $f'(p) = 0{,}9$
      antwoord: |-
        naar $p$, trap
      uitwerking: |-
        $0 < f'(p) < 1$. Traag: de afstand krimpt maar met 10\,\% per stap.
    - opgave: |-
        $f'(p) = -0{,}5$
      antwoord: |-
        naar $p$, spinnenweb
      uitwerking: |-
        $-1 < f'(p) < 0$.
    - opgave: |-
        $f'(p) = -1{,}5$
      antwoord: |-
        weg, spinnenweb
      uitwerking: |-
        $f'(p) < -1$.
    - opgave: |-
        $f'(p) = 1{,}2$
      antwoord: |-
        weg, trap
      uitwerking: |-
        $f'(p) > 1$.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    het dekpunt van $\e^{-x}$
  opgave: |-
    Itereer $f(x) = \e^{-x}$ vanaf $x_0 = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $x_1$ tot $x_6$ op vier decimalen.
      antwoord: |-
        $1$; $0{,}3679$; $0{,}6922$; $0{,}5005$; $0{,}6062$; $0{,}5454$
      uitwerking: |-
        Telkens $\e^{-\mathrm{Ans}}$.
    - opgave: |-
        Waarom heeft $f$ precies één dekpunt? Benader het op vier decimalen.
      antwoord: |-
        $p \approx 0{,}5671$
      uitwerking: |-
        $h(x) = \e^{-x} - x$ is strikt dalend ($h'(x) = -\e^{-x} - 1 < 0$), met $h(0) = 1$ en $h(1) < 0$: precies één nulwaarde. Verder itereren geeft $p \approx 0{,}5671$.
    - opgave: |-
        Toon aan dat $f'(p) = -p$, en verklaar daarmee het verloop van de baan.
      antwoord: |-
        $f'(p) = -\e^{-p} = -p \approx -0{,}567$
      uitwerking: |-
        $f'(x) = -\e^{-x}$, en in het dekpunt is $\e^{-p} = p$. Dus $f'(p) = -p \approx -0{,}567$: aantrekkend en springend, zoals de baan, die afwisselend boven en onder 0,567 ligt.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    populatiemodel van Ricker, stabiliteit hangt af van een parameter
  opgave: |-
    Visbiologen gebruiken het model van Ricker: $N_n = N_{n-1}\,\e^{r(1 - N_{n-1}/1000)}$, met $N_n$ het aantal vissen na $n$ jaar en $r > 0$ de groeiparameter.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat 1000 een dekpunt is, voor elke $r$.
      antwoord: |-
        $1000 \cdot \e^{0} = 1000$
      uitwerking: |-
        Voor $N = 1000$ is de exponent $r(1 - 1) = 0$, dus $f(1000) = 1000 \cdot 1$.
    - opgave: |-
        Toon aan dat $f'(1000) = 1 - r$.
      antwoord: |-
        $f'(N) = \e^{r(1 - N/1000)}\bigl(1 - \tfrac{rN}{1000}\bigr)$
      uitwerking: |-
        Met de productregel en de kettingregel: $f'(N) = \e^{r(1 - N/1000)} + N\,\e^{r(1 - N/1000)} \cdot \bigl(-\tfrac{r}{1000}\bigr)$. In $N = 1000$: $1 \cdot (1 - r) = 1 - r$.
    - opgave: |-
        Voor welke $r$ is 1000 aantrekkend? Wanneer nadert de populatie als een trap, wanneer springend?
      antwoord: |-
        $0 < r < 2$; trap als $r < 1$, springend als $1 < r < 2$
      uitwerking: |-
        $|1 - r| < 1$ geeft $0 < r < 2$. Voor $0 < r < 1$ is $f'(1000) > 0$ (trap), voor $1 < r < 2$ is $f'(1000) < 0$ (springend). Bij $r = 1$ is $f'(1000) = 0$.
    - opgave: |-
        Bereken voor $r = 2{,}5$ de aantallen na 1 tot 4 jaar, vanaf 900 vissen. Wat zie je?
      antwoord: |-
        $\approx 1156$; $783$; $1347$; $566$
      uitwerking: |-
        De aantallen springen om 1000 heen, steeds verder ervan weg: $f'(1000) = -1{,}5$, dus 1000 stoot af.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    snelheid van convergentie
  opgave: |-
    Dicht bij een aantrekkend dekpunt is $|x_n - p| \approx |f'(p)| \cdot |x_{n-1} - p|$. Itereer je $f(x) = \cos x$ (in radialen) vanaf $x_0 = 1$, dan is $x_{10} \approx 0{,}744237$, $x_{20} \approx 0{,}739184$ en $x_{30} \approx 0{,}739087$. Het dekpunt is $p \approx 0{,}7390851$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $|x_{10} - p|$, $|x_{20} - p|$ en $|x_{30} - p|$.
      antwoord: |-
        $\approx 0{,}0052$; $0{,}000099$; $0{,}0000019$
      uitwerking: |-
        $|0{,}744237 - 0{,}739085| \approx 0{,}0052$, $|0{,}739184 - 0{,}739085| \approx 0{,}000099$, $|0{,}739087 - 0{,}739085| \approx 0{,}0000019$ (met $p$ op zeven decimalen).
    - opgave: |-
        Met welke factor wordt de afstand per tien stappen kleiner? Vergelijk met $|f'(p)|^{10}$.
      antwoord: |-
        ongeveer $0{,}019$; $0{,}674^{10} \approx 0{,}019$
      uitwerking: |-
        $\tfrac{0{,}000099}{0{,}0052} \approx 0{,}019$ en $\tfrac{0{,}0000019}{0{,}000099} \approx 0{,}019$. En $|f'(p)| = \sin p \approx 0{,}674$, met $0{,}674^{10} \approx 0{,}019$.
    - opgave: |-
        Hoeveel stappen kost één extra juiste decimaal ongeveer?
      antwoord: |-
        ongeveer 6
      uitwerking: |-
        $0{,}674^k = 0{,}1$ geeft $k = \tfrac{\ln 0{,}1}{\ln 0{,}674} \approx 5{,}8$.

- id: h1-o17
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: een stijgende functie geeft een monotone baan
  opgave: |-
    Neem een functie $f$ die stijgend is op een interval $I$, en waarvoor $f(x) \in I$ als $x \in I$. Neem $x_0 \in I$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: is $x_1 \geqslant x_0$, dan is $x_{n} \geqslant x_{n-1}$ voor elke $n \geqslant 1$.
      antwoord: |-
        stap voor stap met $f$ stijgend
      uitwerking: |-
        Is $x_{n} \geqslant x_{n-1}$, dan is $f(x_{n}) \geqslant f(x_{n-1})$ omdat $f$ stijgt, dus $x_{n+1} \geqslant x_{n}$. Begin bij $x_1 \geqslant x_0$ en herhaal: elke stap geeft de volgende ongelijkheid.
    - opgave: |-
        Wat volgt er als $x_1 \leqslant x_0$?
      antwoord: |-
        de baan daalt
      uitwerking: |-
        Op dezelfde manier is dan $x_n \leqslant x_{n-1}$ voor elke $n$: de baan daalt.
    - opgave: |-
        Leid af: is $I = [a, b]$ en $f$ ook continu, dan convergeert elke baan in $I$ naar een dekpunt.
      antwoord: |-
        monotoon en begrensd, dus convergent; de limiet is een dekpunt
      uitwerking: |-
        De baan is monotoon en ligt in $[a, b]$, dus ze convergeert (een stijgende, naar boven begrensde rij convergeert, en zo ook een dalende, naar onder begrensde). De limiet ligt in $[a, b]$, en omdat $f$ daar continu is, is ze een dekpunt.
    - opgave: |-
        Kan een stijgende functie een baan geven die om een dekpunt heen springt? Verklaar met deze opdracht en met sectie 3.
      antwoord: |-
        nee
      uitwerking: |-
        Nee: de baan is monotoon, dus ze blijft aan één kant van elk dekpunt (een spinnenweb vraagt $f'(p) < 0$, en een stijgende functie heeft $f' \geqslant 0$).

- id: h1-o18
  soort: opdracht
  niveau: 3
  thema: |-
    als $|f'(p)| = 1$
  opgave: |-
    Telkens is 0 een dekpunt met $|f'(0)| = 1$. Is het aantrekkend, afstotend of geen van beide? Bewijs.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = x - x^3$ (bekijk $0 < |x_0| < 1$)
      antwoord: |-
        aantrekkend
      uitwerking: |-
        Voor $0 < x < 1$ is $0 < x - x^3 < x$: de baan daalt naar een dekpunt in $[0, x_0[$, en dat is 0. De functie is oneven, dus voor $-1 < x_0 < 0$ is de baan het tegengestelde. Elke baan in $]-1, 1[$ gaat naar 0.
    - opgave: |-
        $f(x) = \tan x$
      antwoord: |-
        afstotend
      uitwerking: |-
        Voor $0 < x < \tfrac\pi2$ is $\tan x > x$. Bleef de baan van $x_0 \in \left]0, \tfrac\pi4\right[$ in dat interval, dan zou ze stijgen en convergeren naar een dekpunt groter dan $x_0$; in $\left]0, \tfrac\pi4\right]$ is er geen. Ze verlaat het interval dus (en zo ook links, want $\tan$ is oneven).
    - opgave: |-
        $f(x) = -x$
      antwoord: |-
        geen van beide
      uitwerking: |-
        $f'(0) = -1$. De baan van $x_0$ is $x_0, -x_0, x_0, \ldots$: ze gaat niet naar 0 en verlaat geen interval $]-\delta, \delta[$ waarin ze start.
    - opgave: |-
        $f(x) = -x + x^2$ (vergelijk $x_2$ met $x_0$ voor kleine $x_0$)
      antwoord: |-
        aantrekkend
      uitwerking: |-
        $f(f(x)) = (x^2 - x)^2 - (x^2 - x) = x - 2x^3 + x^4$. Voor kleine $x_0 > 0$ is $0 < x_2 < x_0$, en voor kleine $x_0 < 0$ is $x_0 < x_2 < 0$ ($-2x^3 + x^4 > 0$). De even termen vormen dus een monotone, begrensde rij, die naar een dekpunt van $\iter f2$ gaat; $x^4 - 2x^3 = 0$ geeft 0 of 2, dus naar 0. De oneven termen ook, want $x_{2k+1} = f(x_{2k}) \to f(0) = 0$. Het dekpunt is aantrekkend, maar traag.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    dekpunten met een parameter
  opgave: |-
    Neem $f(x) = x^2 + c$, met $c$ een reële parameter.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $c$ heeft $f$ een dekpunt?
      antwoord: |-
        $c \leqslant \tfrac14$
      uitwerking: |-
        $x^2 - x + c = 0$ heeft discriminant $1 - 4c \geqslant 0$.
    - opgave: |-
        Toon aan dat alleen $p = \tfrac{1 - \sqrt{1 - 4c}}{2}$ aantrekkend kan zijn.
      antwoord: |-
        het andere dekpunt heeft $f'(p) \geqslant 1$
      uitwerking: |-
        $f'(p) = 2p$. Voor $p = \tfrac{1 + \sqrt{1 - 4c}}{2}$ is $2p = 1 + \sqrt{1 - 4c} \geqslant 1$: nooit aantrekkend volgens het criterium (en bij gelijkheid, $c = \tfrac14$, valt het samen met het andere).
    - opgave: |-
        Voor welke $c$ is dat dekpunt aantrekkend volgens het criterium?
      antwoord: |-
        $-\tfrac34 < c < \tfrac14$
      uitwerking: |-
        $f'(p) = 1 - \sqrt{1 - 4c}$, en $|1 - \sqrt{1 - 4c}| < 1$ geeft $0 < \sqrt{1 - 4c} < 2$, dus $0 < 1 - 4c < 4$, of $-\tfrac34 < c < \tfrac14$.
    - opgave: |-
        Wat gebeurt er met de baan van 0 voor $c = 0{,}3$, en voor $c = -1$?
      antwoord: |-
        naar oneindig; springt tussen 0 en $-1$
      uitwerking: |-
        Bij $c = 0{,}3$ is er geen dekpunt, en $x^2 + 0{,}3 > x$: de baan stijgt naar oneindig (0; 0,3; 0,39; 0,452; \ldots). Bij $c = -1$ is de baan $0, -1, 0, -1, \ldots$: beide dekpunten stoten af ($f'(p) = 1 \pm \sqrt5$), en de baan is periodiek.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: elke continue functie van $[a, b]$ naar $[a, b]$ heeft een dekpunt
  opgave: |-
    Neem een continue functie $f$ op $[a, b]$ met $a \leqslant f(x) \leqslant b$ voor elke $x$ in $[a, b]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $f$ een dekpunt heeft. Gebruik $h(x) = f(x) - x$.
      antwoord: |-
        $h(a) \geqslant 0 \geqslant h(b)$, tussenwaardestelling
      uitwerking: |-
        $h$ is continu, met $h(a) = f(a) - a \geqslant 0$ en $h(b) = f(b) - b \leqslant 0$. Volgens de tussenwaardestelling is er een $p$ in $[a, b]$ met $h(p) = 0$, dus $f(p) = p$.
    - opgave: |-
        Teken een figuur die laat zien waarom dat meetkundig klopt.
      antwoord: |-
        de grafiek loopt in het vierkant van de linkerzijde naar de rechterzijde en moet de diagonaal kruisen
      uitwerking: |-
        De grafiek ligt in het vierkant $[a, b] \times [a, b]$, begint op de linkerzijde en eindigt op de rechterzijde. De diagonaal $y = x$ verbindt de hoeken linksonder en rechtsboven: een doorlopende grafiek moet haar kruisen.
    - opgave: |-
        Toon met een voorbeeld aan dat de voorwaarde \textit{continu} nodig is.
      antwoord: |-
        bijvoorbeeld $f(x) = 1$ op $[0, \tfrac12]$ en $f(x) = 0$ op $]\tfrac12, 1]$
      uitwerking: |-
        Deze functie beeldt $[0, 1]$ af in $[0, 1]$, maar $f(x) = x$ heeft geen oplossing: op $[0, \tfrac12]$ zou $x = 1$ moeten zijn, op $]\tfrac12, 1]$ zou $x = 0$ moeten zijn.
    - opgave: |-
        Pas toe: toon aan dat $\cos x = x$ een oplossing heeft in $[0, 1]$.
      antwoord: |-
        $\cos$ beeldt $[0, 1]$ af in $[\cos 1, 1] \subset [0, 1]$
      uitwerking: |-
        $\cos$ is continu en dalend op $[0, 1]$, met waarden tussen $\cos 1 \approx 0{,}54$ en 1. Dus is er een dekpunt in $[0, 1]$.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    dekpunt van een samenstelling, periode 2 als voorbereiding
  opgave: |-
    Neem $f(x) = 3{,}2\,x(1 - x)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de dekpunten en hun soort.
      antwoord: |-
        0 en $\tfrac{11}{16}$, beide afstotend
      uitwerking: |-
        $3{,}2\,x(1 - x) = x$ geeft $x = 0$ of $1 - x = \tfrac{1}{3{,}2}$, dus $x = \tfrac{11}{16} = 0{,}6875$. $f'(x) = 3{,}2 - 6{,}4x$: $f'(0) = 3{,}2$ en $f'(\tfrac{11}{16}) = -1{,}2$.
    - opgave: |-
        Itereer vanaf $x_0 = 0{,}5$ tot je een patroon ziet.
      antwoord: |-
        afwisselend ongeveer 0,5130 en 0,7995
      uitwerking: |-
        $0{,}8$; $0{,}512$; $0{,}7995$; $0{,}5130$; $0{,}7995$; $0{,}5130$; \ldots: de baan springt tussen twee waarden.
    - opgave: |-
        Toon aan: elk dekpunt van $f$ is een dekpunt van $\iter{f}{2}$. Is het omgekeerde ook waar?
      antwoord: |-
        $f(f(p)) = f(p) = p$; nee
      uitwerking: |-
        Is $f(p) = p$, dan is $f(f(p)) = f(p) = p$. Het omgekeerde geldt niet: $0{,}5130$ is (bij benadering) een dekpunt van $\iter f2$, want twee stappen brengen het terug, maar geen dekpunt van $f$. Daarover gaat hoofdstuk 2.

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Numerieke methodes
  opgave: |-
    Om $\sqrt 5$ te berekenen, gebruikten de Babyloniërs al de iteratie $x_n = \tfrac12\bigl(x_{n-1} + \tfrac{5}{x_{n-1}}\bigr)$: het gemiddelde van een benadering en 5 gedeeld door die benadering.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\sqrt 5$ een dekpunt is, en bereken $f'(\sqrt 5)$.
      antwoord: |-
        $f'(\sqrt5) = 0$
      uitwerking: |-
        $\tfrac12(x + \tfrac5x) = x$ geeft $x^2 = 5$. $f'(x) = \tfrac12\bigl(1 - \tfrac{5}{x^2}\bigr)$, en dat is 0 in $\sqrt 5$.
    - opgave: |-
        Bereken $x_1$, $x_2$ en $x_3$ vanaf $x_0 = 2$, en tel telkens het aantal juiste decimalen ($\sqrt5 = 2{,}2360679\ldots$).
      antwoord: |-
        $2{,}25$; $2{,}2361111$; $2{,}2360680$; 1, 4 en 9 juiste decimalen
      uitwerking: |-
        $x_1 = 2{,}25$ (een decimaal juist), $x_2 = 2{,}236111\ldots$ (vier), $x_3 = 2{,}23606797791\ldots$ (negen). Het aantal juiste decimalen verdubbelt ongeveer.
    - opgave: |-
        Waarom gaat dit zoveel sneller dan bij het itereren van $\cos x$, waar zes juiste decimalen een dertigtal stappen vragen?
      antwoord: |-
        de afstand krimpt niet met een vaste factor, want $f'(\sqrt5) = 0$
      uitwerking: |-
        Bij $\cos$ krimpt de afstand per stap met ongeveer 0,674. Hier is $f'(p) = 0$: de factor gaat zelf naar 0, en de afstand wordt telkens ongeveer evenredig met het kwadraat van de vorige. Dat is de methode van Newton voor $x^2 - 5 = 0$.

- id: h1-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: analyse
    onderwerp: |-
      Exponentiële functies
  opgave: |-
    Wat is de toren $\sqrt2^{\sqrt2^{\sqrt2^{\cdots}}}$? Bekijk de baan van $x_0 = 1$ onder $f(x) = \sqrt2^{\,x}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $x_1$ tot $x_4$ op vier decimalen.
      antwoord: |-
        $1{,}4142$; $1{,}6325$; $1{,}7608$; $1{,}8409$
      uitwerking: |-
        Telkens $\sqrt2^{\,\mathrm{Ans}}$.
    - opgave: |-
        Toon aan dat 2 en 4 dekpunten zijn.
      antwoord: |-
        $\sqrt2^{\,2} = 2$ en $\sqrt2^{\,4} = 4$
      uitwerking: |-
        $\sqrt2^{\,2} = 2$ en $\sqrt2^{\,4} = (\sqrt2^{\,2})^2 = 4$.
    - opgave: |-
        Welk van de twee is aantrekkend? Wat is dus de waarde van de toren?
      antwoord: |-
        2 (met $f'(2) = \ln 2 \approx 0{,}69$); de toren is 2
      uitwerking: |-
        $f'(x) = \sqrt2^{\,x} \ln\sqrt2$, dus $f'(2) = 2 \cdot \tfrac12 \ln 2 = \ln 2 \approx 0{,}693$ en $f'(4) = 4 \cdot \tfrac12 \ln 2 = 2\ln 2 \approx 1{,}386$. Het dekpunt 2 trekt aan, 4 stoot af. De baan stijgt en blijft onder 2 ($f$ stijgt en $f(2) = 2$), dus ze gaat naar 2.

- id: h1-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: discreet
    onderwerp: |-
      Rijen
  opgave: |-
    De rij $(u_n)$ heeft $u_0 = 0$ en $u_n = \sqrt{12 + u_{n-1}}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: is $0 \leqslant u_{n-1} < 4$, dan is $u_{n-1} < u_n < 4$.
      antwoord: |-
        $\sqrt{12 + u} < \sqrt{16}$ en $12 + u > u^2$
      uitwerking: |-
        $u_n = \sqrt{12 + u_{n-1}} < \sqrt{16} = 4$. En $u_n > u_{n-1}$ omdat $12 + u > u^2$ voor $0 \leqslant u < 4$: $u^2 - u - 12 = (u - 4)(u + 3) < 0$.
    - opgave: |-
        Besluit dat de rij convergeert, en bepaal haar limiet.
      antwoord: |-
        stijgend en begrensd; limiet 4
      uitwerking: |-
        Omdat $u_0 = 0$, geldt de eigenschap stap na stap voor elke term: de rij stijgt en blijft onder 4, dus ze convergeert. De limiet is een dekpunt van $\sqrt{12 + x}$, dus een oplossing van $x^2 - x - 12 = 0$ met $x \geqslant 0$: 4.

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Bereken de baan van $x_0 = 0$ onder $f(x) = \dfrac{2}{1 + x}$ tot $x_4$ (als breuk). Wat verwacht je voor grote $n$?
  antwoord: |-
    $2$; $\tfrac23$; $\tfrac65$; $\tfrac{10}{11}$; naar 1
  uitwerking: |-
    $x_1 = 2$, $x_2 = \tfrac23$, $x_3 = \tfrac{2}{5/3} = \tfrac65$, $x_4 = \tfrac{2}{11/5} = \tfrac{10}{11}$. De baan springt om 1 heen met steeds kleinere sprongen: 1 is een dekpunt ($x^2 + x - 2 = 0$).

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Teken de grafiek van $f(x) = \tfrac12 x + 2$ en de rechte $y = x$, en het spinnenwebdiagram van $x_0 = 0$ (vier stappen). Waar gaat de baan heen?
  antwoord: |-
    een trap naar het dekpunt 4
  uitwerking: |-
    $x_1 = 2$, $x_2 = 3$, $x_3 = 3{,}5$, $x_4 = 3{,}75$: een trap naar boven naar het snijpunt $(4, 4)$.

    \begin{tikzpicture}[scale=.5,font=\scriptsize]
      \rooster{0}{1}{5}{0}{1}{5}
      \eerstebissectrice{0}{5.2}
      \kromme{0}{5.2}{\x/2+2}
      \spinnenweb{\x/2+2}{0}{4}
      \fill[accent] (4,4) circle (3pt);
    \end{tikzpicture}

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Bepaal de dekpunten van $f(x) = \sqrt{x + 2}$ en van $g(x) = x^2 - 2x$.
  antwoord: |-
    $f$: 2; $g$: 0 en 3
  uitwerking: |-
    $\sqrt{x + 2} = x$ geeft $x^2 - x - 2 = 0$, dus 2 of $-1$; alleen 2 voldoet ($\sqrt1 \neq -1$). $x^2 - 2x = x$ geeft $x(x - 3) = 0$.

- id: h1-t4
  soort: test
  niveau: 2
  opgave: |-
    Zijn de dekpunten van $g(x) = x^2 - 2x$ aantrekkend of afstotend? Zegt het criterium ook iets over de vorm van het diagram?
  antwoord: |-
    0 afstotend, 3 afstotend; bij 0 springend, bij 3 een trap
  uitwerking: |-
    $g'(x) = 2x - 2$: $g'(0) = -2$ (afstotend, springend) en $g'(3) = 4$ (afstotend, trap).

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    Beschrijf de baan van $x_0$ onder $f(x) = 3x^2$ voor elke startwaarde. Toon eerst aan dat $3\,x_n = (3\,x_0)^{2^n}$.
  antwoord: |-
    naar 0 als $|x_0| < \tfrac13$; constant $\tfrac13$ vanaf $x_1$ als $|x_0| = \tfrac13$; naar $+\infty$ als $|x_0| > \tfrac13$
  uitwerking: |-
    $3\,x_n = 9\,x_{n-1}^2 = (3\,x_{n-1})^2$, dus de exponent verdubbelt: $3\,x_n = (3\,x_0)^{2^n}$. Dat gaat naar 0 als $|3x_0| < 1$, is 1 vanaf $n = 1$ als $|3x_0| = 1$, en gaat naar $+\infty$ als $|3x_0| > 1$.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Bepaal het aantrekkingsgebied van het dekpunt 2 van $f(x) = \tfrac12 x^2 - 2x + 4$. Stel daarvoor $y_n = x_n - 2$.
  antwoord: |-
    $]0, 4[$
  uitwerking: |-
    $f(x) - 2 = \tfrac12(x^2 - 4x + 4) = \tfrac12(x - 2)^2$, dus $y_n = \tfrac12 y_{n-1}^2$: dezelfde iteratie als $\tfrac12 x^2$, met $y$ in plaats van $x$. Het dekpunt 2 hoort bij $y = 0$, en daarvan is het aantrekkingsgebied $]-2, 2[$. Dus $|x_0 - 2| < 2$, of $0 < x_0 < 4$.

- id: h1-t7
  soort: test
  niveau: 3
  opgave: |-
    Het getal 0 is een dekpunt van $f(x) = \dfrac{x}{1 + x^2}$. Bereken $f'(0)$, en toon aan dat elke baan met $x_0 > 0$ naar 0 gaat.
  antwoord: |-
    $f'(0) = 1$; de baan daalt en blijft positief
  uitwerking: |-
    $f'(x) = \dfrac{1 - x^2}{(1 + x^2)^2}$, dus $f'(0) = 1$: het criterium beslist niet. Voor $x > 0$ is $0 < \dfrac{x}{1 + x^2} < x$. De baan daalt en blijft positief, dus ze convergeert naar een dekpunt; $\tfrac{x}{1 + x^2} = x$ geeft $x^3 = 0$, dus 0.
