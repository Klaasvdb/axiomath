# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of geef.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de afstand tussen $(1, 2)$ en $(4, 6)$
      antwoord: |-
        5
      uitwerking: |-
        $\sqrt{9+16}$.
    - opgave: |-
        het midden van $[AB]$ met $A(-2, 5)$ en $B(4, 1)$
      antwoord: |-
        $(1, 3)$
      uitwerking: |-
        Het gemiddelde van de coördinaten.
    - opgave: |-
        middelpunt en straal van $x^2 + y^2 - 6x + 2y = 6$
      antwoord: |-
        $(3, -1)$ en 4
      uitwerking: |-
        $(x-3)^2+(y+1)^2=6+9+1=16$.
    - opgave: |-
        het scalair product $(2, -1) \cdot (3, 6)$
      antwoord: |-
        $0$
      uitwerking: |-
        $6-6=0$: de vectoren staan loodrecht op elkaar.
    - opgave: |-
        de vergelijking van $x = 2\cos t$, $y = 3\sin t$
      antwoord: |-
        $\tfrac{x^2}{4} + \tfrac{y^2}{9} = 1$
      uitwerking: |-
        Met $\cos^2t+\sin^2t=1$.
    - opgave: |-
        $(x + 3)^2 - (x - 3)^2$
      antwoord: |-
        $12x$
      uitwerking: |-
        $(x^2+6x+9)-(x^2-6x+9)$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem $A(-3, 0)$ en $B(3, 0)$. We zoeken de punten $P$ die twee keer zo ver van $A$ als van $B$ liggen: $|PA| = 2\,|PB|$.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek de twee punten op de $x$-as.
      antwoord: |-
        $(1, 0)$ en $(9, 0)$
      uitwerking: |-
        $|x+3|=2|x-3|$: $x+3=2x-6$ geeft $x=9$, en $x+3=-2x+6$ geeft $x=1$.
    - opgave: |-
        Zoek de punten op de rechte $x = 5$.
      antwoord: |-
        $(5, 4)$ en $(5, -4)$
      uitwerking: |-
        $64+y^2=4(4+y^2)$, dus $y^2=16$.
    - opgave: |-
        Teken de vier punten. Welke kromme vermoed je?
      antwoord: |-
        een cirkel met middelpunt $(5, 0)$ en straal 4
      uitwerking: |-
        De vier punten liggen op afstand 4 van $(5,0)$.

- id: h2-mp
  soort: kort
  opgave: |-
    Zoek een vergelijking van de meetkundige plaats, en herken de figuur.
  lijst: enumerate
  delen:
    - opgave: |-
        de punten die even ver van $A(1, 3)$ als van $B(5, -1)$ liggen
      antwoord: |-
        $y = x - 2$
      uitwerking: |-
        $(x-1)^2+(y-3)^2=(x-5)^2+(y+1)^2$ geeft $8x-8y-16=0$: de middelloodlijn van $[AB]$.
    - opgave: |-
        de punten die even ver van $(2, 0)$ als van de $y$-as liggen
      antwoord: |-
        $y^2 = 4x - 4$, een parabool
      uitwerking: |-
        $(x-2)^2+y^2=x^2$ geeft $y^2=4x-4=4(x-1)$: top $(1,0)$, brandpunt $(2,0)$.

- id: h2-apol
  soort: kort
  opgave: |-
    Zoek de meetkundige plaats van de punten $P$ met $|PA| = 3\,|PB|$, met $A(0, 0)$ en $B(8, 0)$. Geef het middelpunt en de straal.
  antwoord: |-
    $(x - 9)^2 + y^2 = 9$: middelpunt $(9, 0)$, straal 3
  uitwerking: |-
    $x^2+y^2=9(x-8)^2+9y^2$ geeft $8x^2+8y^2-144x+576=0$, of $x^2+y^2-18x+72=0$, dus $(x-9)^2+y^2=9$.

- id: h2-assen
  soort: kort
  opgave: |-
    Twee punten $A$ en $B$ liggen 4 uit elkaar. Kies een handig assenstelsel en zoek de meetkundige plaats van de punten $P$ met:
  lijst: enumerate
  delen:
    - opgave: |-
        $|PA|^2 - |PB|^2 = 8$;
      antwoord: |-
        met $A(-2, 0)$, $B(2, 0)$: de rechte $x = 1$
      uitwerking: |-
        $(x+2)^2-(x-2)^2=8x=8$. Een rechte loodrecht op $AB$, op afstand 1 van het midden, aan de kant van $B$.
    - opgave: |-
        $|PA|^2 + |PB|^2 = 40$.
      antwoord: |-
        $x^2 + y^2 = 16$
      uitwerking: |-
        $2x^2+2y^2+8=40$: de cirkel met het midden van $[AB]$ als middelpunt en straal 4.

- id: h2-midden
  soort: kort
  opgave: |-
    Welke kromme beschrijft het punt $M$?
  lijst: enumerate
  delen:
    - opgave: |-
        $Q$ loopt over de parabool $y = x^2$, en $M$ is het midden van $[AQ]$ met $A(0, -2)$.
      antwoord: |-
        $y = 2x^2 - 1$
      uitwerking: |-
        Terugrekenen: $Q=(2x,\ 2y+2)$ ligt op $y=x^2$, dus $2y+2=4x^2$.
    - opgave: |-
        $Q$ loopt over de cirkel $(x - 4)^2 + y^2 = 4$, en $M$ is het midden van $[OQ]$.
      antwoord: |-
        $(x - 2)^2 + y^2 = 1$
      uitwerking: |-
        $Q=(2x,2y)$: $(2x-4)^2+4y^2=4$. Deel door 4.

- id: h2-schuif
  soort: kort
  opgave: |-
    Een staaf van 6~dm schuift met één uiteinde $B$ over de $x$-as en met het andere $T$ over de $y$-as. Welke kromme beschrijft het punt $P$ van de staaf:
  lijst: enumerate
  delen:
    - opgave: |-
        op 2~dm van $B$?
      antwoord: |-
        $\tfrac{x^2}{16} + \tfrac{y^2}{4} = 1$
      uitwerking: |-
        $p=|PT|=4$ en $q=|PB|=2$.
    - opgave: |-
        op 1~dm van $B$?
      antwoord: |-
        $\tfrac{x^2}{25} + y^2 = 1$
      uitwerking: |-
        $p=5$ en $q=1$: een heel platte ellips.

- id: h2-lemnis
  soort: kort
  opgave: |-
    Neem de lemniscaat met brandpunten $(-3, 0)$ en $(3, 0)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef haar vergelijking en haar snijpunten met de $x$-as.
      antwoord: |-
        $(x^2 + y^2)^2 = 18(x^2 - y^2)$; $(0,0)$ en $(\pm3\sqrt2, 0)$
      uitwerking: |-
        $c=3$, $2c^2=18$. Met $y=0$: $x^4=18x^2$.
    - opgave: |-
        Zoek de punten met $x = 3$.
      antwoord: |-
        $(3;\ \pm1{,}46)$
      uitwerking: |-
        $(9+y^2)^2=18(9-y^2)$ geeft $y^4+36y^2-81=0$, dus $y^2=-18+\sqrt{405}\approx2{,}125$ en $y\approx\pm1{,}46$.

- id: h2-lezen
  soort: kort
  opgave: |-
    Zoek de symmetrie en de snijpunten met de assen.
  lijst: enumerate
  delen:
    - opgave: |-
        $y^2 = x^2(4 - x^2)$
      antwoord: |-
        symmetrisch t.o.v. beide assen; $(0,0)$, $(\pm2, 0)$
      uitwerking: |-
        Alleen even machten van $x$ en $y$. Met $y=0$: $x=0$ of $x=\pm2$; met $x=0$: $y=0$. De kromme ligt in $-2\leqslant x\leqslant2$, want $4-x^2\geqslant0$.
    - opgave: |-
        $x^3 + y^3 = 3xy$
      antwoord: |-
        symmetrisch t.o.v. de rechte $y = x$; alleen $(0, 0)$
      uitwerking: |-
        $x$ en $y$ wisselen verandert de vergelijking niet: spiegelen in $y=x$. Met $y=0$: $x^3=0$. Dit is het blad van Descartes.

- id: h2-cissoide
  soort: kort
  opgave: |-
    Neem de cissoïde $y^2(6 - x) = x^3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke $a$ hoort erbij? Geef de asymptoot.
      antwoord: |-
        $a = 3$; $x = 6$
      uitwerking: |-
        $2a=6$.
    - opgave: |-
        Bereken de punten met $x = 3$, en ga na of $(4, 4\sqrt2)$ op de kromme ligt.
      antwoord: |-
        $(3, \pm3)$; ja
      uitwerking: |-
        $3y^2=27$, $y=\pm3$. Voor $(4,4\sqrt2)$: $32\cdot2=64=4^3$.

# --- Opdrachten ------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    meetkundige plaats opstellen
  opgave: |-
    Zoek een vergelijking van de meetkundige plaats en herken de figuur.
  lijst: enumerate
  delen:
    - opgave: |-
        de punten die even ver van $(-1, 4)$ als van $(3, 2)$ liggen
      antwoord: |-
        $y = 2x + 1$
      uitwerking: |-
        $(x+1)^2+(y-4)^2=(x-3)^2+(y-2)^2$ geeft $8x-4y+4=0$: de middelloodlijn.
    - opgave: |-
        de punten op afstand 3 van $(2, -1)$
      antwoord: |-
        $(x - 2)^2 + (y + 1)^2 = 9$
      uitwerking: |-
        Een cirkel.
    - opgave: |-
        de punten die even ver van $(0, 2)$ als van de $x$-as liggen
      antwoord: |-
        $y = \tfrac14x^2 + 1$
      uitwerking: |-
        $x^2+(y-2)^2=y^2$ geeft $x^2=4y-4$: een parabool.
    - opgave: |-
        de punten die drie keer zo ver van $(0, 0)$ als van $(4, 0)$ liggen
      antwoord: |-
        $(x - 4{,}5)^2 + y^2 = 2{,}25$
      uitwerking: |-
        $x^2+y^2=9(x-4)^2+9y^2$ geeft $8x^2+8y^2-72x+144=0$, of $x^2+y^2-9x+18=0$: een cirkel van Apollonius.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    cirkel van Apollonius
  opgave: |-
    Neem $A(-4, 0)$ en $B(4, 0)$, en zoek de meetkundige plaats van de punten $P$ met $|PA| = 3\,|PB|$.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek de vergelijking door de werkwijze te volgen.
      antwoord: |-
        $(x - 5)^2 + y^2 = 9$
      uitwerking: |-
        $(x+4)^2+y^2=9(x-4)^2+9y^2$ geeft $8x^2+8y^2-80x+128=0$, of $x^2+y^2-10x+16=0$.
    - opgave: |-
        Controleer het middelpunt en de straal met de formules uit het bewijs van de stelling.
      antwoord: |-
        $x_0 = 5$, straal 3
      uitwerking: |-
        $a=4$, $k=3$: $x_0=4\cdot\tfrac{10}{8}=5$ en de straal is $\tfrac{2\cdot4\cdot3}{8}=3$.
    - opgave: |-
        Controleer de eigenschap voor het punt van de cirkel met de grootste $y$.
      antwoord: |-
        $(5, 3)$: $\sqrt{90} = 3\sqrt{10}$
      uitwerking: |-
        $|PA|=\sqrt{81+9}=\sqrt{90}$ en $|PB|=\sqrt{1+9}=\sqrt{10}$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    cirkel van Thales met het scalair product
  opgave: |-
    Zoek de meetkundige plaats van de punten $P$ waarvoor $\overrightarrow{PA} \cdot \overrightarrow{PB} = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        $A(-3, 0)$ en $B(3, 0)$
      antwoord: |-
        $x^2 + y^2 = 9$
      uitwerking: |-
        $(x+3)(x-3)+y^2=0$. Zonder $A$ en $B$ zelf: daar is een van de vectoren de nulvector, en is er geen hoek.
    - opgave: |-
        $A(1, 1)$ en $B(5, 3)$
      antwoord: |-
        $(x - 3)^2 + (y - 2)^2 = 5$
      uitwerking: |-
        $(x-1)(x-5)+(y-1)(y-3)=0$ geeft $x^2-6x+y^2-4y+8=0$.
    - opgave: |-
        Wat is telkens het middelpunt en de straal? Welke stelling uit de meetkunde herken je?
      antwoord: |-
        het midden van $[AB]$, straal $\tfrac12|AB|$; de stelling van Thales
      uitwerking: |-
        $(3,2)$ is het midden van $[AB]$, en $\sqrt5=\tfrac12\sqrt{20}$. Een hoek die op een middellijn staat, is recht.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    verschil van kwadraten van afstanden
  opgave: |-
    Zoek de meetkundige plaats van de punten $P$ met $|PA|^2 - |PB|^2 = k$.
  lijst: enumerate
  delen:
    - opgave: |-
        $A(-2, 0)$, $B(2, 0)$ en $k = 12$
      antwoord: |-
        $x = \tfrac32$
      uitwerking: |-
        $(x+2)^2-(x-2)^2=8x=12$.
    - opgave: |-
        $A(0, 0)$, $B(4, 2)$ en $k = 10$
      antwoord: |-
        $4x + 2y = 15$
      uitwerking: |-
        $x^2+y^2-(x-4)^2-(y-2)^2=8x+4y-20=10$.
    - opgave: |-
        Toon aan dat de meetkundige plaats in b loodrecht staat op $AB$.
      antwoord: |-
        de normaalvector $(4, 2)$ is $\overrightarrow{AB}$
      uitwerking: |-
        De rechte $4x+2y=15$ heeft normaalvector $(4,2)=\overrightarrow{AB}$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    middens, terugrekenen
  opgave: |-
    Welke kromme beschrijven de middens $M$?
  lijst: enumerate
  delen:
    - opgave: |-
        $M$ is het midden van $[OQ]$, en $Q$ loopt over de rechte $y = 2x + 4$.
      antwoord: |-
        $y = 2x + 2$
      uitwerking: |-
        $Q=(2x,2y)$: $2y=4x+4$. Een evenwijdige rechte, half zo ver van $O$.
    - opgave: |-
        $M$ is het midden van $[AQ]$ met $A(6, 0)$, en $Q$ loopt over de cirkel $x^2 + y^2 = 16$.
      antwoord: |-
        $(x - 3)^2 + y^2 = 4$
      uitwerking: |-
        $Q=(2x-6,\ 2y)$: $(2x-6)^2+4y^2=16$. Deel door 4.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    punten van een lemniscaat
  opgave: |-
    Neem de lemniscaat $(x^2 + y^2)^2 = 2(x^2 - y^2)$. Ligt het punt erop?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $(\sqrt2, 0)$
      antwoord: |-
        ja
      uitwerking: |-
        $4=2\cdot2$.
    - opgave: |-
        $(0, 1)$
      antwoord: |-
        nee
      uitwerking: |-
        $1\neq-2$.
    - opgave: |-
        $\bigl(\tfrac{\sqrt3}{2}, -\tfrac12\bigr)$
      antwoord: |-
        ja
      uitwerking: |-
        $1^2=2\bigl(\tfrac34-\tfrac14\bigr)$.
    - opgave: |-
        $(1, 1)$
      antwoord: |-
        nee
      uitwerking: |-
        $4\neq0$.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    symmetrie aflezen
  opgave: |-
    Is de kromme symmetrisch ten opzichte van de $x$-as, de $y$-as, de oorsprong of de rechte $y = x$?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y(x^2 + 1) = 1$
      antwoord: |-
        de $y$-as
      uitwerking: |-
        $x\to-x$ verandert niets; $y\to-y$ wel.
    - opgave: |-
        $y^2 = x^3$
      antwoord: |-
        de $x$-as
      uitwerking: |-
        Alleen $y^2$.
    - opgave: |-
        $xy = 4$
      antwoord: |-
        de oorsprong en $y = x$
      uitwerking: |-
        $(-x)(-y)=xy$, en $x$ en $y$ wisselen verandert niets.
    - opgave: |-
        $x^4 + y^4 = 1$
      antwoord: |-
        alle vier
      uitwerking: |-
        Alleen even machten, en $x$ en $y$ spelen dezelfde rol.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    cirkel van Apollonius, context
  opgave: |-
    Twee luidsprekers $A$ en $B$ staan 300~m uit elkaar op een festivalterrein. $A$ is vier keer zo krachtig als $B$. De sterkte van het geluid neemt af met het kwadraat van de afstand.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit waarom je beide luidsprekers even luid hoort waar $|PA| = 2\,|PB|$.
      antwoord: |-
        $\tfrac{4}{|PA|^2} = \tfrac{1}{|PB|^2}$
      uitwerking: |-
        Even luid als $\tfrac{4P}{|PA|^2}=\tfrac{P}{|PB|^2}$, met $P$ het vermogen van $B$. Dus $|PA|^2=4|PB|^2$.
    - opgave: |-
        Kies een assenstelsel en geef een vergelijking van die meetkundige plaats.
      antwoord: |-
        met $A(-150, 0)$, $B(150, 0)$: $(x - 250)^2 + y^2 = 200^2$
      uitwerking: |-
        $(x+150)^2+y^2=4(x-150)^2+4y^2$ geeft $3x^2+3y^2-1500x+67\,500=0$, of $x^2+y^2-500x+22\,500=0$.
    - opgave: |-
        Beschrijf de figuur in woorden, zonder coördinaten.
      antwoord: |-
        een cirkel met straal 200~m, met middelpunt 100~m voorbij $B$
      uitwerking: |-
        Het middelpunt ligt op de rechte $AB$, aan de kant van $B$, op 250~m van het midden.
    - opgave: |-
        Waar hoor je $B$ het luidst: binnen of buiten de cirkel?
      antwoord: |-
        binnen
      uitwerking: |-
        In $B$ zelf, binnen de cirkel, is $|PB|=0$. Binnen de cirkel is $|PA|>2|PB|$.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    ellipsograaf, context
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=.55,font=\scriptsize]
        \fill[black!10] (-.3,-.3) rectangle (0,4.3);
        \fill[black!10] (-.3,-.3) rectangle (3.6,0);
        \draw[grijs,thick] (0,4.3) -- (0,0) -- (3.6,0);
        \draw[lijngrijs,line width=1.5pt] ({4*cos(55)},0) -- (0,{4*sin(55)});
        \fill[accent] ({cos(55)},{3*sin(55)}) circle (3pt);
      \end{tikzpicture}
  opgave: |-
    Een ladder van 4~m glijdt langs een muur naar beneden. Op 1~m van de top hangt een pot verf.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking van de baan van de pot.
      antwoord: |-
        $x^2 + \tfrac{y^2}{9} = 1$, met $x, y \geqslant 0$
      uitwerking: |-
        $p=|PT|=1$ en $q=|PB|=3$.
    - opgave: |-
        Hoe hoog hangt de pot als de ladder tegen de muur staat, en waar komt hij als de ladder plat ligt?
      antwoord: |-
        op 3~m; op 1~m van de muur
      uitwerking: |-
        $\alpha=90^\circ$: $(0,3)$. $\alpha=0^\circ$: $(1,0)$.
    - opgave: |-
        Waar is de pot als de ladder een hoek van $30^\circ$ maakt met de vloer?
      antwoord: |-
        $(0{,}87;\ 1{,}5)$
      uitwerking: |-
        $(p\cos\alpha,\ q\sin\alpha)=(\cos30^\circ,\ 3\sin30^\circ)$.
    - opgave: |-
        Op welke plaats moet de pot hangen om een kwart cirkel te beschrijven?
      antwoord: |-
        in het midden
      uitwerking: |-
        Alleen als $p=q$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    middelpunten van raakcirkels
  opgave: |-
    Welke kromme vormen de middelpunten van alle cirkels die door $F(0, 2)$ gaan en de $x$-as raken?
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat een middelpunt $(x, y)$ voldoet aan $x^2 + (y - 2)^2 = y^2$, en vereenvoudig.
      antwoord: |-
        $y = \tfrac14x^2 + 1$
      uitwerking: |-
        De straal is de afstand tot $F$ en ook de afstand $y$ tot de $x$-as ($y>0$). Uitwerken: $x^2-4y+4=0$.
    - opgave: |-
        Verklaar zonder rekenen waarom dat een parabool is. Wat zijn haar brandpunt en richtlijn?
      antwoord: |-
        brandpunt $F$, richtlijn de $x$-as
      uitwerking: |-
        Elk middelpunt ligt even ver van $F$ als van de $x$-as: de definitie van een parabool.
    - opgave: |-
        Geef de cirkel met middelpunt op die parabool bij $x = 4$.
      antwoord: |-
        $(x - 4)^2 + (y - 5)^2 = 25$
      uitwerking: |-
        $y=5$, straal 5. Controle: door $(0,2)$, want $16+9=25$.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    voetpunten, hulpparameter
  opgave: |-
    Door $A(2, 0)$ gaan alle rechten $y = m(x - 2)$. Uit de oorsprong laat je telkens de loodlijn neer op zo'n rechte, met voetpunt $V$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $V = \Bigl(\dfrac{2m^2}{1 + m^2},\ \dfrac{-2m}{1 + m^2}\Bigr)$.
      antwoord: |-
        snijpunt met de loodlijn $y = -\tfrac1m x$
      uitwerking: |-
        $m(x-2)=-\tfrac xm$ geeft $m^2x-2m^2=-x$, dus $x=\tfrac{2m^2}{1+m^2}$ en $y=-\tfrac xm=\tfrac{-2m}{1+m^2}$.
    - opgave: |-
        Toon aan dat $V$ op de cirkel $x^2 + y^2 = 2x$ ligt.
      antwoord: |-
        invullen
      uitwerking: |-
        $x^2+y^2=\tfrac{4m^4+4m^2}{(1+m^2)^2}=\tfrac{4m^2}{1+m^2}=2x$.
    - opgave: |-
        Verklaar met een figuur waarom het een cirkel is, en welke.
      antwoord: |-
        de cirkel met middellijn $[OA]$
      uitwerking: |-
        De hoek $OVA$ is recht, dus $V$ ligt op de cirkel van Thales boven $[OA]$: middelpunt $(1,0)$, straal 1.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    cissoïde onderzoeken
  opgave: |-
    Neem de cissoïde $y^2(2 - x) = x^3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de punten met $x = 0{,}5$, $x = 1$, $x = 1{,}5$ en $x = 1{,}8$, en teken de kromme.
      antwoord: |-
        $y \approx \pm0{,}29$; $\pm1$; $\pm2{,}60$; $\pm5{,}40$
      uitwerking: |-
        $y^2=\tfrac{x^3}{2-x}$: $\tfrac{0{,}125}{1{,}5}$, $1$, $\tfrac{3{,}375}{0{,}5}=6{,}75$ en $\tfrac{5{,}832}{0{,}2}=29{,}16$.
    - opgave: |-
        Voor welke $x$ bestaat er een punt? Wat gebeurt er dicht bij $x = 2$?
      antwoord: |-
        $0 \leqslant x < 2$; een verticale asymptoot $x = 2$
      uitwerking: |-
        $\tfrac{x^3}{2-x}\geqslant0$ als $0\leqslant x<2$. Voor $x\to2$ gaat $y^2$ naar $+\infty$.
    - opgave: |-
        Geef een parametervoorstelling met $m$, de richtingscoëfficiënt van $OP$.
      antwoord: |-
        $x = \tfrac{2m^2}{1 + m^2}$, $y = \tfrac{2m^3}{1 + m^2}$
      uitwerking: |-
        Uit het bewijs, met $a=1$, en $y=mx$.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    ovalen van Cassini
  opgave: |-
    Giovanni Cassini dacht in 1680 dat planeten geen ellips beschrijven, maar een kromme met een constant \textit{product} van de afstanden tot twee vaste punten. Neem $F_1(-1, 0)$, $F_2(1, 0)$ en de punten $P$ met $|PF_1| \cdot |PF_2| = b^2$, met $b > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $(x^2 + y^2)^2 - 2(x^2 - y^2) = b^4 - 1$.
      antwoord: |-
        zoals bij de lemniscaat, met $c = 1$
      uitwerking: |-
        $\bigl((x^2+y^2+1)+2x\bigr)\bigl((x^2+y^2+1)-2x\bigr)=b^4$ geeft $(x^2+y^2+1)^2-4x^2=b^4$, en uitwerken geeft de vergelijking.
    - opgave: |-
        Toon aan dat de snijpunten met de $x$-as voldoen aan $(x^2 - 1)^2 = b^4$.
      antwoord: |-
        $y = 0$
      uitwerking: |-
        $x^4-2x^2+1=b^4$.
    - opgave: |-
        Bereken die snijpunten voor $b = 0{,}8$ en voor $b = 1{,}2$.
      antwoord: |-
        $\pm0{,}6$ en $\pm1{,}28$; alleen $\pm1{,}56$
      uitwerking: |-
        $x^2=1\pm b^2$. Bij $b=0{,}8$: $x^2=1{,}64$ of $0{,}36$. Bij $b=1{,}2$: $x^2=2{,}44$, want $1-1{,}44<0$.
    - opgave: |-
        Leid af: bij $b < 1$ bestaat de kromme uit twee ovalen, bij $b > 1$ uit één. Welke kromme krijg je bij $b = 1$?
      antwoord: |-
        de lemniscaat
      uitwerking: |-
        Bij $b<1$ snijden twee ovalen, een rond elk brandpunt, de $x$-as elk twee keer. Bij $b>1$ is er één ovaal rond beide. Bij $b=1$ raken de twee ovalen elkaar in $O$: de lemniscaat.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    zwaartepunt, terugrekenen
  opgave: |-
    Neem $A(-3, 0)$ en $B(3, 0)$. Het punt $C$ loopt over de cirkel $x^2 + y^2 = 36$. Welke kromme beschrijft het zwaartepunt $G$ van driehoek $ABC$?
  antwoord: |-
    de cirkel $x^2 + y^2 = 4$, zonder $(\pm2, 0)$
  uitwerking: |-
    $G=\bigl(\tfrac{-3+3+x_C}{3},\tfrac{y_C}{3}\bigr)$, dus $C=(3x,3y)$. Invullen: $9x^2+9y^2=36$. Ligt $C$ op de $x$-as, dan is er geen driehoek: de punten $(\pm2,0)$ vallen weg.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    assenstelsel kiezen in een vierkant
  opgave: |-
    $ABCD$ is een vierkant met zijde 4. Kies een assenstelsel, en zoek de meetkundige plaats van de punten $P$ met:
  lijst: enumerate
  delen:
    - opgave: |-
        $|PA|^2 + |PB|^2 = |PC|^2 + |PD|^2$;
      antwoord: |-
        de rechte door de middens van $[AD]$ en $[BC]$
      uitwerking: |-
        Met $A(0,0)$, $B(4,0)$, $C(4,4)$, $D(0,4)$: $x^2+y^2+(x-4)^2+y^2=(x-4)^2+(y-4)^2+x^2+(y-4)^2$ geeft $2y^2=2(y-4)^2$, dus $y=2$.
    - opgave: |-
        $|PA|^2 + |PC|^2 = |PB|^2 + |PD|^2$.
      antwoord: |-
        elk punt van het vlak
      uitwerking: |-
        Beide leden zijn $2x^2+2y^2-8x-8y+32$. De gelijkheid geldt voor elk punt: een verrassende eigenschap die voor elke rechthoek geldt.

- id: h2-o21
  soort: opdracht
  niveau: 2
  thema: |-
    ellipsograaf, punt op het verlengde
  opgave: |-
    Een staaf $[BT]$ van 6~cm schuift met $B$ over de $x$-as en met $T$ over de $y$-as. Bij een hoek $\alpha$ met de $x$-as is $B = (6\cos\alpha, 0)$ en $T = (0, 6\sin\alpha)$. Het punt $P$ ligt op het verlengde van $[TB]$, 2~cm voorbij $B$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $P = (8\cos\alpha,\ -2\sin\alpha)$.
      antwoord: |-
        $P = B + \tfrac13\,\overrightarrow{TB}$
      uitwerking: |-
        $\overrightarrow{TB}=(6\cos\alpha,\ -6\sin\alpha)$, en een derde daarvan bij $B$ optellen.
    - opgave: |-
        Welke kromme beschrijft $P$? Klopt dat met de ellipsograaf, als je kijkt naar $|PT|$ en $|PB|$?
      antwoord: |-
        $\tfrac{x^2}{64} + \tfrac{y^2}{4} = 1$; ja: $|PT| = 8$, $|PB| = 2$
      uitwerking: |-
        De halve assen zijn weer de afstanden tot de uiteinden. Alleen ligt $P$ nu onder de $x$-as als $T$ erboven ligt.

- id: h2-o22
  soort: opdracht
  niveau: 2
  thema: |-
    twee lemniscaten vergelijken
  opgave: |-
    In hoofdstuk 1 tekende je de Lissajousfiguur $x = \sin t$, $y = \sin 2t$, een liggende acht. Ze heet ook de \textit{lemniscaat van Gerono}.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat ze voldoet aan $y^2 = 4x^2(1 - x^2)$.
      antwoord: |-
        $y = 2\sin t\cos t$
      uitwerking: |-
        $y^2=4\sin^2t\cos^2t=4x^2(1-x^2)$.
    - opgave: |-
        De lemniscaat van Bernoulli met $c = \tfrac{\sqrt2}{2}$ gaat ook door $(\pm1, 0)$. Geef haar vergelijking.
      antwoord: |-
        $(x^2 + y^2)^2 = x^2 - y^2$
      uitwerking: |-
        $2c^2=1$, en $c\sqrt2=1$.
    - opgave: |-
        Bereken voor beide krommen de positieve $y$ bij $x = 0{,}5$. Zijn ze dezelfde kromme?
      antwoord: |-
        $0{,}87$ en $0{,}34$; nee
      uitwerking: |-
        Gerono: $y^2=4\cdot0{,}25\cdot0{,}75=0{,}75$. Bernoulli: $(0{,}25+u)^2=0{,}25-u$ met $u=y^2$ geeft $u^2+1{,}5u-0{,}1875=0$, $u\approx0{,}116$, $y\approx0{,}34$. De acht van Gerono is veel boller.

- id: h2-o13
  soort: opdracht
  niveau: 3
  thema: |-
    strofoïde
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=1.05,font=\scriptsize]
        \draw[->,lijngrijs] (-1.3,0) -- (1.5,0) node[right,text=black] {$x$};
        \draw[->,lijngrijs] (0,-1.6) -- (0,1.7) node[above,text=black] {$l$};
        \draw[grijs,dashed] (1,-1.6) -- (1,1.7);
        \begin{scope}\clip (-1.3,-1.6) rectangle (1.4,1.7);
        \pkromme{-2.6}{2.6}{(\t*\t-1)/(1+\t*\t)}{\t*(\t*\t-1)/(1+\t*\t)}
        \end{scope}
        \draw[grijs] (-1,0) -- (1.1,1.47);
        \fill (-1,0) circle (1.3pt) node[below,inner sep=2pt] {$A$};
        \fill (0,.7) circle (1.3pt) node[left,inner sep=2pt] {$Q$};
        \fill[accent] (.573,1.101) circle (1.6pt) node[left,text=black,inner sep=2pt] {$P$};
      \end{tikzpicture}
  opgave: |-
    Neem de rechte $l$: de $y$-as, en het punt $A(-a, 0)$ met $a > 0$. Een rechte door $A$ snijdt $l$ in $Q$. Op die rechte neem je de punten $P$ met $|QP| = |QO|$. Die punten vormen een \textit{strofoïde}.
  lijst: enumerate
  delen:
    - opgave: |-
        Neem de rechte $y = m(x + a)$. Toon aan dat $Q(0, am)$, en dat $P(x, y)$ voldoet aan $x^2 + (y - am)^2 = a^2m^2$.
      antwoord: |-
        $|QP|^2 = |QO|^2$
      uitwerking: |-
        $x=0$ geeft $y=am$. En $|QO|=|am|$.
    - opgave: |-
        Elimineer $m = \tfrac{y}{x + a}$ en toon aan dat $x^2(x + a)^2 + x^2y^2 = a^2y^2$.
      antwoord: |-
        maal $(x + a)^2$
      uitwerking: |-
        $y-am=y-\tfrac{ay}{x+a}=\tfrac{xy}{x+a}$. Dus $x^2+\tfrac{x^2y^2}{(x+a)^2}=\tfrac{a^2y^2}{(x+a)^2}$, en vermenigvuldig met $(x+a)^2$.
    - opgave: |-
        Leid af dat $y^2(a - x) = x^2(a + x)$, voor $x \neq -a$.
      antwoord: |-
        deel door $x + a$
      uitwerking: |-
        $x^2(x+a)^2=y^2(a^2-x^2)=y^2(a-x)(a+x)$. Deel door $a+x$.
    - opgave: |-
        Onderzoek de vergelijking: symmetrie, snijpunten met de assen, asymptoot. Wat gebeurt er in $O$?
      antwoord: |-
        symmetrisch t.o.v. de $x$-as; $(-a, 0)$ en $(0,0)$; asymptoot $x = a$; $O$ is een dubbelpunt
      uitwerking: |-
        Alleen $y^2$. Met $y=0$: $x=0$ of $x=-a$, zodat de kromme door $A$ gaat. $y^2=\tfrac{x^2(a+x)}{a-x}$ gaat naar oneindig voor $x\to a$. Dicht bij $O$ is $y^2\approx x^2$: twee takken met raaklijnen $y=\pm x$ snijden elkaar in $O$.

- id: h2-o17
  soort: opdracht
  niveau: 3
  thema: |-
    cissoïde en de verdubbeling van de kubus
  opgave: |-
    Neem de cissoïde $y^2(1 - x) = x^3$ en de rechte $r$ door $(1, 0)$ en $(0, 2)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat een snijpunt voldoet aan $4(1 - x)^3 = x^3$.
      antwoord: |-
        $r \leftrightarrow y = 2 - 2x$
      uitwerking: |-
        $4(1-x)^2(1-x)=x^3$.
    - opgave: |-
        Leid daaruit af dat $\tfrac yx = \sqrt[3]{2}$.
      antwoord: |-
        $\tfrac{1 - x}{x} = \tfrac{1}{\sqrt[3]{4}}$
      uitwerking: |-
        $\bigl(\tfrac{1-x}{x}\bigr)^3=\tfrac14$, dus $\tfrac yx=\tfrac{2(1-x)}{x}=\tfrac{2}{\sqrt[3]4}=\sqrt[3]{\tfrac{8}{4}}=\sqrt[3]2$.
    - opgave: |-
        Bereken het snijpunt op twee decimalen en controleer.
      antwoord: |-
        $(0{,}61;\ 0{,}77)$
      uitwerking: |-
        $\tfrac{1-x}{x}=4^{-1/3}\approx0{,}630$ geeft $x\approx0{,}6135$ en $y\approx0{,}773$, met $\tfrac yx\approx1{,}260\approx\sqrt[3]2$.
    - opgave: |-
        Waarom lost dat het probleem van de verdubbeling van de kubus op?
      antwoord: |-
        een kubus met ribbe $\sqrt[3]2\,z$ heeft volume $2z^3$
      uitwerking: |-
        Heb je de verhouding $\sqrt[3]2$ getekend, dan kun je bij elke ribbe $z$ de ribbe van de dubbele kubus construeren met gelijkvormige driehoeken.

- id: h2-o18
  soort: opdracht
  niveau: 3
  thema: |-
    geïsoleerd punt
  opgave: |-
    Neem de krommen $k_1 \leftrightarrow y^2 = x^2(x - 1)$ en $k_2 \leftrightarrow y^2 = x^2(x + 1)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $x$ heeft $k_1$ punten? Toon aan dat $O$ op $k_1$ ligt, maar dat er geen andere punten van $k_1$ in de buurt liggen.
      antwoord: |-
        $x = 0$ of $x \geqslant 1$
      uitwerking: |-
        $x^2(x-1)\geqslant0$ als $x=0$ of $x\geqslant1$. Tussen $x=0$ en $x=1$ ligt geen enkel punt: $O$ is een geïsoleerd punt.
    - opgave: |-
        Voor welke $x$ heeft $k_2$ punten? Teken $k_2$ met een paar punten.
      antwoord: |-
        $x \geqslant -1$; een lus tussen $x = -1$ en $x = 0$
      uitwerking: |-
        $y=\pm x\sqrt{x+1}$. Bij $x=-0{,}5$: $y\approx\pm0{,}35$. Bij $x=1$: $y=\pm\sqrt2$.
    - opgave: |-
        Wat is $O$ voor $k_2$? Geef de raaklijnen daar.
      antwoord: |-
        een dubbelpunt, met raaklijnen $y = \pm x$
      uitwerking: |-
        Dicht bij $O$ is $\sqrt{x+1}\approx1$, dus $y\approx\pm x$: twee takken snijden elkaar.
    - opgave: |-
        Waarom kan een vergelijking een punt hebben dat je bij het tekenen met een paar punten nooit vindt?
      antwoord: |-
        het ligt los van de rest
      uitwerking: |-
        Een tabel met $x$-waarden zoals $0{,}5$ of $-0{,}5$ vindt bij $k_1$ geen punten, en $x=0$ lijkt niets bijzonders. Lees de vergelijking dus altijd, en teken niet alleen.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    som van kwadraten bij een gelijkzijdige driehoek
  opgave: |-
    $ABC$ is een gelijkzijdige driehoek met zwaartepunt $O$ en $|OA| = |OB| = |OC| = 2$. Gebruik vectoren vanuit $O$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom is $\vec a + \vec b + \vec c = \vec 0$?
      antwoord: |-
        $O$ is het zwaartepunt
      uitwerking: |-
        Het zwaartepunt is $\tfrac13(\vec a+\vec b+\vec c)$, en dat is $O$.
    - opgave: |-
        Toon aan dat $|PA|^2 + |PB|^2 + |PC|^2 = 3\,|OP|^2 + 12$.
      antwoord: |-
        $|\vec p - \vec a|^2 = |\vec p|^2 - 2\vec p\cdot\vec a + 4$
      uitwerking: |-
        Tel de drie op: $3|\vec p|^2-2\vec p\cdot(\vec a+\vec b+\vec c)+12=3|\vec p|^2+12$.
    - opgave: |-
        Zoek de meetkundige plaats van de punten met $|PA|^2 + |PB|^2 + |PC|^2 = 21$.
      antwoord: |-
        de cirkel met middelpunt $O$ en straal $\sqrt3$
      uitwerking: |-
        $3|OP|^2=9$.
    - opgave: |-
        Voor welke waarden van de som is de meetkundige plaats leeg?
      antwoord: |-
        als de som kleiner is dan 12
      uitwerking: |-
        $3|OP|^2\geqslant0$, dus de som is minstens 12, en die waarde neemt ze alleen aan in $O$.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    cirkel van Apollonius, eigenschappen
  opgave: |-
    Neem $A(-a, 0)$ en $B(a, 0)$, en de cirkel van Apollonius van $|PA| = k\,|PB|$, met middelpunt $M(x_0, 0)$, $x_0 = a\,\tfrac{k^2 + 1}{k^2 - 1}$, en straal $r = \tfrac{2ak}{|k^2 - 1|}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $|MA| \cdot |MB| = r^2$.
      antwoord: |-
        $(x_0 + a)(x_0 - a) = x_0^2 - a^2$
      uitwerking: |-
        Voor $k>1$ ligt $M$ rechts van $B$, en $|MA|\cdot|MB|=(x_0+a)(x_0-a)=x_0^2-a^2=r^2$, zoals in het bewijs. Voor $k<1$ net zo, met $-x_0$.
    - opgave: |-
        Wat gebeurt er met $x_0$ en $r$ als $k$ naar 1 gaat? Welke figuur krijg je bij $k = 1$?
      antwoord: |-
        beide naar oneindig; de middelloodlijn
      uitwerking: |-
        De noemer $k^2-1$ gaat naar 0. De cirkel wordt steeds groter en vlakker bij de $y$-as.
    - opgave: |-
        Wat gebeurt er als $k$ naar 0 gaat? Verklaar.
      antwoord: |-
        de cirkel krimpt tot het punt $A$
      uitwerking: |-
        $x_0\to-a$ en $r\to0$. Bij een heel kleine $k$ moet $P$ heel dicht bij $A$ liggen.
    - opgave: |-
        Toon aan dat de cirkels bij $k$ en bij $\tfrac1k$ elkaars spiegelbeeld zijn ten opzichte van de $y$-as.
      antwoord: |-
        $x_0$ wisselt van teken, $r$ blijft
      uitwerking: |-
        $\tfrac{1/k^2+1}{1/k^2-1}=\tfrac{1+k^2}{1-k^2}$: het tegengestelde. En $\tfrac{2a/k}{|1/k^2-1|}=\tfrac{2ak}{|1-k^2|}$. Dat klopt: $|PA|=\tfrac1k|PB|$ is $|PB|=k|PA|$, met de rollen van $A$ en $B$ gewisseld.

# --- Koppel ------------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    In het vlak van Gauss is $|z - w|$ de afstand tussen de beeldpunten van $z$ en $w$. Teken de verzameling van de complexe getallen $z = x + y\,\mathrm{i}$ met:
  lijst: enumerate
  delen:
    - opgave: |-
        $|z - \mathrm{i}| = |z + 1|$;
      antwoord: |-
        de rechte $y = -x$
      uitwerking: |-
        Even ver van $\mathrm{i}$ als van $-1$: $x^2+(y-1)^2=(x+1)^2+y^2$ geeft $-2y=2x$. De middelloodlijn.
    - opgave: |-
        $|z - 2| = 2\,|z + 1|$.
      antwoord: |-
        de cirkel $(x + 2)^2 + y^2 = 4$
      uitwerking: |-
        $(x-2)^2+y^2=4(x+1)^2+4y^2$ geeft $3x^2+3y^2+12x=0$: een cirkel van Apollonius met middelpunt $-2$ en straal 2.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Kegelsneden
  opgave: |-
    De parabool $y^2 = 4x$ heeft brandpunt $F(1, 0)$. Welke kromme beschrijven de middens van de koorden door $F$?
  lijst: enumerate
  delen:
    - opgave: |-
        Snijd de parabool met $y = m(x - 1)$. Toon aan dat de $x$-coördinaten voldoen aan $m^2x^2 - (2m^2 + 4)x + m^2 = 0$.
      antwoord: |-
        invullen
      uitwerking: |-
        $m^2(x-1)^2=4x$ geeft $m^2x^2-2m^2x+m^2-4x=0$.
    - opgave: |-
        Toon aan dat het midden $M$ van de koorde de coördinaten $\bigl(1 + \tfrac{2}{m^2},\ \tfrac2m\bigr)$ heeft.
      antwoord: |-
        de som van de wortels is $\tfrac{2m^2 + 4}{m^2}$
      uitwerking: |-
        $x_M=\tfrac12\cdot\tfrac{2m^2+4}{m^2}=1+\tfrac{2}{m^2}$, en $y_M=m(x_M-1)=\tfrac2m$.
    - opgave: |-
        Elimineer $m$. Welke kromme krijg je?
      antwoord: |-
        de parabool $y^2 = 2(x - 1)$
      uitwerking: |-
        $\tfrac1m=\tfrac{y}{2}$ geeft $x-1=\tfrac{2y^2}{4}$. Een parabool met top in $F$.

- id: h2-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Draai de lemniscaat $(x^2 + y^2)^2 = 2(x^2 - y^2)$ over $45^\circ$ rond de oorsprong.
  lijst: enumerate
  delen:
    - opgave: |-
        De draaiing stuurt $(x, y)$ naar $(u, v)$. Toon met de draaiingsmatrix aan dat $x = \tfrac{u + v}{\sqrt2}$ en $y = \tfrac{v - u}{\sqrt2}$.
      antwoord: |-
        terugdraaien over $-45^\circ$
      uitwerking: |-
        $\begin{pmatrix}x\\y\end{pmatrix}=\dfrac{1}{\sqrt2}\begin{pmatrix}1&1\\-1&1\end{pmatrix}\begin{pmatrix}u\\v\end{pmatrix}$, de inverse van de draaiing over $45^\circ$.
    - opgave: |-
        Toon aan dat $x^2 + y^2 = u^2 + v^2$ en $x^2 - y^2 = 2uv$.
      antwoord: |-
        uitwerken
      uitwerking: |-
        $\tfrac{(u+v)^2+(v-u)^2}{2}=u^2+v^2$ en $\tfrac{(u+v)^2-(v-u)^2}{2}=2uv$.
    - opgave: |-
        Geef de vergelijking van de gedraaide lemniscaat. Waar liggen haar brandpunten?
      antwoord: |-
        $(x^2 + y^2)^2 = 4xy$; in $\pm\bigl(\tfrac{\sqrt2}{2}, \tfrac{\sqrt2}{2}\bigr)$
      uitwerking: |-
        In de nieuwe letters $(u^2+v^2)^2=4uv$. De brandpunten $(\pm1,0)$ draaien mee naar de bissectrice $y=x$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Zoek een vergelijking van de meetkundige plaats van de punten die even ver van $(0, 4)$ als van de $x$-as liggen. Welke figuur is het?
  antwoord: |-
    $y = \tfrac18x^2 + 2$, een parabool
  uitwerking: |-
    $x^2+(y-4)^2=y^2$ geeft $x^2-8y+16=0$.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Zoek de meetkundige plaats van de punten $P$ met $|PA| = 2\,|PB|$, met $A(0, 0)$ en $B(3, 0)$. Geef middelpunt en straal.
  antwoord: |-
    $(x - 4)^2 + y^2 = 4$: middelpunt $(4, 0)$, straal 2
  uitwerking: |-
    $x^2+y^2=4(x-3)^2+4y^2$ geeft $3x^2+3y^2-24x+36=0$, of $x^2+y^2-8x+12=0$.

- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    Twee punten $A$ en $B$ liggen 10 uit elkaar. Kies een handig assenstelsel en zoek de meetkundige plaats van de punten $P$ met $|PA|^2 + |PB|^2 = 68$. Beschrijf de figuur in woorden.
  antwoord: |-
    met $A(-5, 0)$, $B(5, 0)$: $x^2 + y^2 = 9$; de cirkel met middelpunt het midden van $[AB]$ en straal 3
  uitwerking: |-
    $2x^2+2y^2+50=68$.

- id: h2-t4
  soort: test
  niveau: 2
  opgave: |-
    Het punt $Q$ loopt over de cirkel $(x - 6)^2 + y^2 = 4$. Welke kromme beschrijft het midden $M$ van $[OQ]$?
  antwoord: |-
    $(x - 3)^2 + y^2 = 1$
  uitwerking: |-
    $Q=(2x,2y)$: $(2x-6)^2+4y^2=4$. Deel door 4.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Een staaf van 10~cm schuift met één uiteinde $B$ over de $x$-as en met het andere $T$ over de $y$-as. Welke kromme beschrijft het punt op 3~cm van $B$? Waar is het als de staaf een hoek van $60^\circ$ maakt met de $x$-as?
  antwoord: |-
    $\tfrac{x^2}{49} + \tfrac{y^2}{9} = 1$; $(3{,}5;\ 2{,}60)$
  uitwerking: |-
    $p=7$, $q=3$. $(7\cos60^\circ,\ 3\sin60^\circ)=\bigl(3{,}5;\ \tfrac{3\sqrt3}{2}\bigr)$.

- id: h2-t6
  soort: test
  niveau: 1
  opgave: |-
    Geef een vergelijking van de lemniscaat met brandpunten $(-2, 0)$ en $(2, 0)$, haar snijpunten met de $x$-as en haar symmetrieën.
  antwoord: |-
    $(x^2 + y^2)^2 = 8(x^2 - y^2)$; $(0,0)$ en $(\pm2\sqrt2, 0)$; beide assen en de oorsprong
  uitwerking: |-
    $c=2$. Alleen even machten van $x$ en $y$.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Neem de cissoïde $y^2(8 - x) = x^3$. Voor welke $x$ heeft ze punten? Geef de asymptoot en de punten met $x = 4$.
  antwoord: |-
    $0 \leqslant x < 8$; $x = 8$; $(4, \pm4)$
  uitwerking: |-
    $a=4$. $y^2=\tfrac{x^3}{8-x}\geqslant0$. Bij $x=4$: $4y^2=64$.
