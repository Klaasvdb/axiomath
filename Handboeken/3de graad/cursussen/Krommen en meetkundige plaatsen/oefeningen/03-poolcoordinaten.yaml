# Oefeningen van hoofdstuk 3. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of geef.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        modulus en argument van $-1 + \mathrm{i}$
      antwoord: |-
        $\sqrt2$ en $\tfrac{3\pi}{4}$
      uitwerking: |-
        Het beeldpunt $(-1,1)$ ligt in het tweede kwadrant.
    - opgave: |-
        $\cos\tfrac{5\pi}{4}$ en $\sin\tfrac{5\pi}{4}$
      antwoord: |-
        $-\tfrac{\sqrt2}{2}$ en $-\tfrac{\sqrt2}{2}$
      uitwerking: |-
        Derde kwadrant.
    - opgave: |-
        de goniometrische vorm van $-2\mathrm{i}$
      antwoord: |-
        $2\bigl(\cos\tfrac{3\pi}{2} + \mathrm{i}\sin\tfrac{3\pi}{2}\bigr)$
      uitwerking: |-
        Het beeldpunt ligt op de negatieve imaginaire as.
    - opgave: |-
        $\cos^2\theta - \sin^2\theta$
      antwoord: |-
        $\cos 2\theta$
      uitwerking: |-
        Verdubbelingsformule.
    - opgave: |-
        $2\sin\theta\cos\theta$
      antwoord: |-
        $\sin 2\theta$
      uitwerking: |-
        Verdubbelingsformule.
    - opgave: |-
        $(1 + \mathrm{i})^2$
      antwoord: |-
        $2\mathrm{i}$
      uitwerking: |-
        $1+2\mathrm{i}-1$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Een mier vertrekt in het midden van een draaiende schijf en wandelt over een straal naar buiten. Als de schijf over een hoek $\theta$ gedraaid is, staat de mier op afstand $r = \tfrac{\theta}{\pi}$ van het midden, in de richting $\theta$.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de plaats van de mier bij $\theta = 0$, $\tfrac{\pi}{2}$, $\pi$, $\tfrac{3\pi}{2}$, $2\pi$, $\tfrac{5\pi}{2}$ en $3\pi$, en verbind de punten.
      antwoord: |-
        een spiraal
      uitwerking: |-
        Afstanden $0$, $\tfrac12$, $1$, $\tfrac32$, $2$, $\tfrac52$, $3$, telkens een kwart toer verder.
    - opgave: |-
        Geef de cartesische coördinaten bij $\theta = \tfrac{\pi}{2}$ en bij $\theta = \pi$.
      antwoord: |-
        $\bigl(0, \tfrac12\bigr)$ en $(-1, 0)$
      uitwerking: |-
        $x=r\cos\theta$, $y=r\sin\theta$.
    - opgave: |-
        Probeer een vergelijking in $x$ en $y$ te vinden. Waarom lukt dat niet zomaar?
      antwoord: |-
        de hoek is niet eenvoudig uit te drukken in $x$ en $y$
      uitwerking: |-
        $\sqrt{x^2+y^2}=\tfrac{\theta}{\pi}$, maar $\theta$ is niet gewoon $\arctan\tfrac yx$: na elke toer komt er $2\pi$ bij. In $r$ en $\theta$ is de beschrijving net heel eenvoudig.

- id: h3-omzet
  soort: kort
  opgave: |-
    Zet om naar cartesische coördinaten of naar poolcoördinaten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\bigl[6, \tfrac{\pi}{6}\bigr]$
      antwoord: |-
        $(3\sqrt3, 3)$
      uitwerking: |-
        $6\cdot\tfrac{\sqrt3}{2}$ en $6\cdot\tfrac12$.
    - opgave: |-
        $\bigl[2, \tfrac{3\pi}{2}\bigr]$
      antwoord: |-
        $(0, -2)$
      uitwerking: |-
        Recht naar onder.
    - opgave: |-
        $(-5, 5)$
      antwoord: |-
        $\bigl[5\sqrt2, \tfrac{3\pi}{4}\bigr]$
      uitwerking: |-
        $\tan\theta=-1$, tweede kwadrant.
    - opgave: |-
        $(1, -\sqrt3)$
      antwoord: |-
        $\bigl[2, \tfrac{5\pi}{3}\bigr]$
      uitwerking: |-
        $\tan\theta=-\sqrt3$, vierde kwadrant.
    - opgave: |-
        $(-4, -3)$
      antwoord: |-
        $[5;\ 3{,}79]$
      uitwerking: |-
        $\tan\theta=\tfrac34$, derde kwadrant: $\theta=\pi+0{,}64\approx3{,}79$.

- id: h3-namen
  soort: kort
  opgave: |-
    Poolcoördinaten met meer dan één naam.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef drie andere paren poolcoördinaten van $\bigl[3, \tfrac{\pi}{2}\bigr]$, waarvan één met een negatieve $r$.
      antwoord: |-
        bv. $\bigl[3, \tfrac{5\pi}{2}\bigr]$, $\bigl[3, -\tfrac{3\pi}{2}\bigr]$, $\bigl[-3, \tfrac{3\pi}{2}\bigr]$
      uitwerking: |-
        Een volle toer erbij of eraf; of de tegengestelde richting met $-3$.
    - opgave: |-
        Geef de cartesische coördinaten van $\bigl[-4, \tfrac{\pi}{3}\bigr]$.
      antwoord: |-
        $(-2, -2\sqrt3)$
      uitwerking: |-
        $-4\cdot\tfrac12$ en $-4\cdot\tfrac{\sqrt3}{2}$: het punt ligt in de richting $\tfrac{4\pi}{3}$.

- id: h3-tekenen
  soort: kort
  opgave: |-
    Teken de kromme met een tabel.
  lijst: enumerate
  delen:
    - opgave: |-
        $r = 3\sin\theta$ voor $\theta \in [0, \pi]$
      antwoord: |-
        de cirkel met middelpunt $(0;\ 1{,}5)$ en straal 1,5
      uitwerking: |-
        $r$: $0$; $1{,}5$; $2{,}6$; $3$; $2{,}6$; $1{,}5$; $0$ bij $\theta=0,\tfrac{\pi}{6},\ldots,\pi$. Het punt start in de pool, gaat naar $(0,3)$ en komt terug: een cirkel boven de poolas.
    - opgave: |-
        $r = 2 + \cos\theta$ voor $\theta \in [0, 2\pi]$
      antwoord: |-
        een ovale kromme rond de pool, van $(3, 0)$ tot $(-1, 0)$
      uitwerking: |-
        $r$ ligt tussen 1 (bij $\theta=\pi$) en 3 (bij $\theta=0$); bij $\theta=\pm\tfrac{\pi}{2}$ is $r=2$. Een gesloten kromme, links wat platter, symmetrisch ten opzichte van de poolas.

- id: h3-naarcart
  soort: kort
  opgave: |-
    Zet om naar een cartesische vergelijking en herken de kromme.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $r = 6\sin\theta$
      antwoord: |-
        $x^2 + (y - 3)^2 = 9$
      uitwerking: |-
        $r^2=6r\sin\theta$: $x^2+y^2=6y$. Een cirkel.
    - opgave: |-
        $r = \dfrac{5}{\sin\theta}$
      antwoord: |-
        $y = 5$
      uitwerking: |-
        $r\sin\theta=5$. Een horizontale rechte.
    - opgave: |-
        $r = \dfrac{4}{1 + \cos\theta}$
      antwoord: |-
        $y^2 = 16 - 8x$
      uitwerking: |-
        $r=4-x$, kwadrateren: $x^2+y^2=16-8x+x^2$. Een parabool die naar links opent.

- id: h3-naarpool
  soort: kort
  opgave: |-
    Geef een poolvergelijking.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 + y^2 = 25$
      antwoord: |-
        $r = 5$
      uitwerking: |-
        $r^2=25$.
    - opgave: |-
        $y = -x$
      antwoord: |-
        $\theta = \tfrac{3\pi}{4}$
      uitwerking: |-
        Met negatieve $r$ hoort ook de andere halfrechte erbij.
    - opgave: |-
        $x^2 + y^2 = 8x$
      antwoord: |-
        $r = 8\cos\theta$
      uitwerking: |-
        $r^2=8r\cos\theta$. De pool zit erin bij $\theta=\tfrac{\pi}{2}$.
    - opgave: |-
        $x^2 - y^2 = 1$
      antwoord: |-
        $r^2 = \dfrac{1}{\cos 2\theta}$
      uitwerking: |-
        $r^2(\cos^2\theta-\sin^2\theta)=1$.

- id: h3-spiraal
  soort: kort
  opgave: |-
    Neem de spiraal van Archimedes $r = 2\theta$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe ver liggen twee windingen uit elkaar?
      antwoord: |-
        $4\pi \approx 12{,}6$
      uitwerking: |-
        $2\pi a$ met $a=2$.
    - opgave: |-
        Waar snijdt ze de positieve $x$-as en de positieve $y$-as?
      antwoord: |-
        in $x = 4k\pi$ en in $y = \pi + 4k\pi$, met $k \in \N$
      uitwerking: |-
        Positieve $x$-as: $\theta=2k\pi$, $r=4k\pi$. Positieve $y$-as: $\theta=\tfrac{\pi}{2}+2k\pi$, $r=\pi+4k\pi$.

- id: h3-roos
  soort: kort
  opgave: |-
    Neem de roos $r = 2\sin3\theta$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel bladen heeft ze, en hoe lang zijn ze?
      antwoord: |-
        3 bladen met lengte 2
      uitwerking: |-
        $n=3$ is oneven. Met $\sin3\theta=\cos\bigl(3\theta-\tfrac{\pi}{2}\bigr)$ is het een gedraaide roos uit de stelling.
    - opgave: |-
        Bij welke hoeken in $[0, \pi]$ is $r = 0$, en in welke richtingen wijzen de toppen?
      antwoord: |-
        $0$, $\tfrac{\pi}{3}$, $\tfrac{2\pi}{3}$, $\pi$; toppen bij $\tfrac{\pi}{6}$, $\tfrac{5\pi}{6}$ en $\tfrac{3\pi}{2}$
      uitwerking: |-
        $3\theta=k\pi$. De toppen: $r=2$ bij $\tfrac{\pi}{6}$ en $\tfrac{5\pi}{6}$, en $r=-2$ bij $\tfrac{\pi}{2}$, dus in de richting $\tfrac{3\pi}{2}$.

- id: h3-conch
  soort: kort
  opgave: |-
    Neem de conchoïde $r = \dfrac{2}{\cos\theta} + 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke rechte is de asymptoot, en hoe groot is $b$?
      antwoord: |-
        $x = 2$; $b = 1$
      uitwerking: |-
        $a=2$, $b=1$.
    - opgave: |-
        Bereken de punten bij $\theta = 0$ en $\theta = \pi$. Gaat de kromme door de pool?
      antwoord: |-
        $(3, 0)$ en $(1, 0)$; nee
      uitwerking: |-
        $r(0)=3$; $r(\pi)=-2+1=-1$, en $[-1,\pi]=(1,0)$. $r=0$ zou $\cos\theta=-2$ geven: onmogelijk, want $b<a$. Er is geen lus.

- id: h3-terug
  soort: kort
  opgave: |-
    Een munt met straal 1~cm rolt rond een even grote munt, zoals in het probleem.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar is $P$ als het middelpunt van de rollende munt een kwart toer rond de vaste munt gedraaid is? Geef de poolcoördinaten vanuit $A$, en de cartesische coördinaten.
      antwoord: |-
        $\bigl[2, \tfrac{\pi}{2}\bigr]$; $(1, 2)$
      uitwerking: |-
        $r=2(1-\cos\tfrac{\pi}{2})=2$ in de richting $\tfrac{\pi}{2}$ vanuit $A(1,0)$. Controle met de parametervoorstelling: $x=2\cos\tfrac{\pi}{2}-\cos\pi=1$, $y=2\sin\tfrac{\pi}{2}-\sin\pi=2$.
    - opgave: |-
        Hoe ver komt $P$ van $A$ als de munten een straal van 2~cm hebben?
      antwoord: |-
        8~cm
      uitwerking: |-
        $4a$ met $a=2$.

# --- Opdrachten ------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    van pool naar cartesisch
  opgave: |-
    Geef de cartesische coördinaten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\bigl[2, \tfrac{\pi}{6}\bigr]$
      antwoord: |-
        $(\sqrt3, 1)$
      uitwerking: |-
        $2\cos\tfrac{\pi}{6}$, $2\sin\tfrac{\pi}{6}$.
    - opgave: |-
        $[4, \pi]$
      antwoord: |-
        $(-4, 0)$
      uitwerking: |-
        Op de negatieve $x$-as.
    - opgave: |-
        $\bigl[3, -\tfrac{\pi}{2}\bigr]$
      antwoord: |-
        $(0, -3)$
      uitwerking: |-
        Recht naar onder.
    - opgave: |-
        $\bigl[\sqrt2, \tfrac{3\pi}{4}\bigr]$
      antwoord: |-
        $(-1, 1)$
      uitwerking: |-
        $\sqrt2\cdot\bigl(-\tfrac{\sqrt2}{2}\bigr)=-1$.
    - opgave: |-
        $\bigl[10, \tfrac{5\pi}{3}\bigr]$
      antwoord: |-
        $(5, -5\sqrt3)$
      uitwerking: |-
        Vierde kwadrant.
    - opgave: |-
        $\bigl[-2, \tfrac{\pi}{3}\bigr]$
      antwoord: |-
        $(-1, -\sqrt3)$
      uitwerking: |-
        Negatieve $r$: de tegengestelde richting.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    van cartesisch naar pool
  opgave: |-
    Geef poolcoördinaten $[r, \theta]$ met $r > 0$ en $\theta \in [0, 2\pi[$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(3, 3)$
      antwoord: |-
        $\bigl[3\sqrt2, \tfrac{\pi}{4}\bigr]$
      uitwerking: |-
        Eerste kwadrant, $\tan\theta=1$.
    - opgave: |-
        $(0, -5)$
      antwoord: |-
        $\bigl[5, \tfrac{3\pi}{2}\bigr]$
      uitwerking: |-
        Op de negatieve $y$-as.
    - opgave: |-
        $(-1, \sqrt3)$
      antwoord: |-
        $\bigl[2, \tfrac{2\pi}{3}\bigr]$
      uitwerking: |-
        Tweede kwadrant, $\tan\theta=-\sqrt3$.
    - opgave: |-
        $(-4, 0)$
      antwoord: |-
        $[4, \pi]$
      uitwerking: |-
        Op de negatieve $x$-as.
    - opgave: |-
        $(2, -2\sqrt3)$
      antwoord: |-
        $\bigl[4, \tfrac{5\pi}{3}\bigr]$
      uitwerking: |-
        Vierde kwadrant.
    - opgave: |-
        $(-3, -4)$
      antwoord: |-
        $[5;\ 4{,}07]$
      uitwerking: |-
        $\tan\theta=\tfrac43$ in het derde kwadrant: $\theta=\pi+0{,}93\approx4{,}07$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    eenvoudige poolvergelijkingen herkennen
  opgave: |-
    Welke kromme is het? Zet om naar een cartesische vergelijking.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $r = 5$
      antwoord: |-
        $x^2 + y^2 = 25$
      uitwerking: |-
        Een cirkel rond de pool.
    - opgave: |-
        $\theta = \tfrac{\pi}{3}$
      antwoord: |-
        $y = \sqrt3\,x$
      uitwerking: |-
        Een rechte door de pool, met $\tan\tfrac{\pi}{3}=\sqrt3$.
    - opgave: |-
        $r = 6\cos\theta$
      antwoord: |-
        $(x - 3)^2 + y^2 = 9$
      uitwerking: |-
        $x^2+y^2=6x$.
    - opgave: |-
        $r = \dfrac{2}{\sin\theta}$
      antwoord: |-
        $y = 2$
      uitwerking: |-
        $r\sin\theta=2$.
    - opgave: |-
        $r = -3\sin\theta$
      antwoord: |-
        $x^2 + \bigl(y + \tfrac32\bigr)^2 = \tfrac94$
      uitwerking: |-
        $x^2+y^2=-3y$: een cirkel onder de poolas.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    poolkromme tekenen
  opgave: |-
    Teken de kromme met een tabel.
  lijst: enumerate
  delen:
    - opgave: |-
        $r = 2 + 2\cos\theta$ voor $\theta \in [0, 2\pi]$
      antwoord: |-
        een hartvorm met de spits in de pool, wijzend naar links
      uitwerking: |-
        $r$: 4 bij $\theta=0$; 2 bij $\pm\tfrac{\pi}{2}$; 0 bij $\pi$. Een cardioïde.
    - opgave: |-
        $r = \theta$ voor $\theta \in [0, 2\pi]$
      antwoord: |-
        één winding van een spiraal van Archimedes
      uitwerking: |-
        Van de pool tot $(2\pi, 0)\approx(6{,}28;\ 0)$, door $\bigl(0,\tfrac{\pi}{2}\bigr)$ en $(-\pi,0)$.
    - opgave: |-
        $r = 3$ voor $\theta \in [0, \pi]$
      antwoord: |-
        een halve cirkel boven de poolas
      uitwerking: |-
        Van $(3,0)$ tegen de klok in naar $(-3,0)$.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    van cartesisch naar pool, vergelijkingen
  opgave: |-
    Geef een poolvergelijking.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 + y^2 = 9$
      antwoord: |-
        $r = 3$
      uitwerking: |-
        $r^2=9$.
    - opgave: |-
        $y = x$
      antwoord: |-
        $\theta = \tfrac{\pi}{4}$
      uitwerking: |-
        Met negatieve $r$ de hele rechte.
    - opgave: |-
        $x^2 + y^2 = 4x$
      antwoord: |-
        $r = 4\cos\theta$
      uitwerking: |-
        $r^2=4r\cos\theta$.
    - opgave: |-
        $y = 2$
      antwoord: |-
        $r = \dfrac{2}{\sin\theta}$
      uitwerking: |-
        $r\sin\theta=2$.
    - opgave: |-
        $xy = 1$
      antwoord: |-
        $r^2 = \dfrac{2}{\sin2\theta}$
      uitwerking: |-
        $r^2\sin\theta\cos\theta=1$, en $\sin\theta\cos\theta=\tfrac12\sin2\theta$.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    van pool naar cartesisch, vergelijkingen
  opgave: |-
    Geef een cartesische vergelijking.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $r = 3\sin\theta$
      antwoord: |-
        $x^2 + \bigl(y - \tfrac32\bigr)^2 = \tfrac94$
      uitwerking: |-
        $x^2+y^2=3y$.
    - opgave: |-
        $r\cos\theta = -2$
      antwoord: |-
        $x = -2$
      uitwerking: |-
        Rechtstreeks.
    - opgave: |-
        $r = \dfrac{2}{\cos\theta + \sin\theta}$
      antwoord: |-
        $x + y = 2$
      uitwerking: |-
        $r\cos\theta+r\sin\theta=2$.
    - opgave: |-
        $r^2 = 4\sin2\theta$
      antwoord: |-
        $(x^2 + y^2)^2 = 8xy$
      uitwerking: |-
        $r^4=4r^2\cdot2\sin\theta\cos\theta=8xy$.
    - opgave: |-
        $r = \dfrac{1}{1 - \cos\theta}$
      antwoord: |-
        $y^2 = 2x + 1$
      uitwerking: |-
        $r=1+x$, kwadrateren: $x^2+y^2=1+2x+x^2$.

- id: h3-o7
  soort: opdracht
  niveau: 1
  thema: |-
    rozen
  opgave: |-
    Hoeveel bladen heeft de roos, en hoe lang zijn ze?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $r = \cos4\theta$
      antwoord: |-
        8, lengte 1
      uitwerking: |-
        $n=4$ even: $2n$.
    - opgave: |-
        $r = 3\sin5\theta$
      antwoord: |-
        5, lengte 3
      uitwerking: |-
        $n=5$ oneven.
    - opgave: |-
        $r = 2\cos2\theta$
      antwoord: |-
        4, lengte 2
      uitwerking: |-
        $n=2$ even.
    - opgave: |-
        $r = 4\cos7\theta$
      antwoord: |-
        7, lengte 4
      uitwerking: |-
        $n=7$ oneven.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    kegelsnede in poolcoördinaten
  opgave: |-
    Neem de kromme $r = \dfrac{6}{2 + \cos\theta}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Breng ze in de vorm $r = \dfrac{p}{1 + e\cos\theta}$ uit Kegelsneden. Welke kegelsnede is het?
      antwoord: |-
        $r = \dfrac{3}{1 + \tfrac12\cos\theta}$; een ellips
      uitwerking: |-
        Deel teller en noemer door 2: $e=\tfrac12<1$.
    - opgave: |-
        Zet om naar een cartesische vergelijking.
      antwoord: |-
        $\tfrac{(x + 2)^2}{16} + \tfrac{y^2}{12} = 1$
      uitwerking: |-
        $2r+x=6$, dus $4(x^2+y^2)=(6-x)^2$, of $3x^2+12x+4y^2=36$, en $3(x+2)^2+4y^2=48$.
    - opgave: |-
        Controleer dat de pool een brandpunt is.
      antwoord: |-
        $c = 2$, brandpunten $(0, 0)$ en $(-4, 0)$
      uitwerking: |-
        Middelpunt $(-2,0)$, $a=4$, $b^2=12$, $c=\sqrt{16-12}=2$.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    cardioïde, context
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=1.1,font=\scriptsize]
        \poolrooster{1.1}{.25}
        \poolkromme{0}{360}{.5*(1+cos(\t))}
        \node[below,inner sep=2pt] at (1.2,0) {vooraan};
      \end{tikzpicture}
  opgave: |-
    Een cardioïde microfoon vangt geluid van voren goed op, en van achteren bijna niet. Voor geluid dat binnenkomt onder een hoek $\theta$ met de voorkant is de gevoeligheid $g(\theta) = \tfrac12(1 + \cos\theta)$. Fabrikanten tekenen $g$ in een pooldiagram: de kromme $r = g(\theta)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe gevoelig is de microfoon voor geluid van voren, van opzij en van achteren?
      antwoord: |-
        1; $\tfrac12$; 0
      uitwerking: |-
        $\theta=0$, $\tfrac{\pi}{2}$ en $\pi$.
    - opgave: |-
        Voor welke hoeken is de gevoeligheid minstens $0{,}75$?
      antwoord: |-
        $\theta \in \bigl[-\tfrac{\pi}{3}, \tfrac{\pi}{3}\bigr]$
      uitwerking: |-
        $\tfrac12(1+\cos\theta)\geqslant\tfrac34$ als $\cos\theta\geqslant\tfrac12$.
    - opgave: |-
        Waarom heet de microfoon cardioïde? Waar ligt de spits?
      antwoord: |-
        het pooldiagram is een cardioïde; de spits ligt in de pool, langs achteren
      uitwerking: |-
        $r=c(1+\cos\theta)$ met $c=\tfrac12$: een gedraaide cardioïde, met $r=0$ bij $\theta=\pi$.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    conchoïde
  opgave: |-
    Neem de conchoïde $r = \dfrac{a}{\cos\theta} + b$ met $a > 0$ en $b > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat elk punt voldoet aan $(x - a)^2(x^2 + y^2) = b^2x^2$.
      antwoord: |-
        $r\cos\theta - a = b\cos\theta$
      uitwerking: |-
        Vermenigvuldig met $\cos\theta$: $x-a=b\cos\theta=\tfrac{bx}{r}$. Kwadrateer en vermenigvuldig met $r^2=x^2+y^2$.
    - opgave: |-
        Voor welke $b$ gaat de kromme door de pool? Hoe zie je dat aan de cartesische vergelijking?
      antwoord: |-
        voor elke $b$, want $(0, 0)$ voldoet; maar met een lus pas als $b > a$
      uitwerking: |-
        $(0,0)$ voldoet altijd aan de cartesische vergelijking. In poolcoördinaten is $r=0$ als $\cos\theta=-\tfrac ab$, wat alleen kan als $b\geqslant a$. Bij $b<a$ is de pool een geïsoleerd punt van de cartesische vergelijking, zoals de geïsoleerde punten in de opdrachten van hoofdstuk 2.
    - opgave: |-
        Teken de kromme voor $a = 1$ en $b = \tfrac12$, en voor $a = 1$ en $b = 2$.
      antwoord: |-
        zonder lus; met lus door de pool
      uitwerking: |-
        Bij $b=\tfrac12$ ligt de binnenste tak tussen de pool en $l$, zonder de pool te raken. Bij $b=2$ maakt hij een lus door de pool, tot in $(-1,0)$.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    symmetrie in poolcoördinaten
  opgave: |-
    Neem een kromme $r = f(\theta)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: is $f(-\theta) = f(\theta)$, dan is de kromme symmetrisch ten opzichte van de $x$-as.
      antwoord: |-
        $[r, -\theta]$ is het spiegelbeeld van $[r, \theta]$
      uitwerking: |-
        $\bigl(r\cos(-\theta),\ r\sin(-\theta)\bigr)=(x,{-}y)$.
    - opgave: |-
        Toon aan: is $f(\pi - \theta) = f(\theta)$, dan is ze symmetrisch ten opzichte van de $y$-as.
      antwoord: |-
        $[r, \pi - \theta]$ is $(-x, y)$
      uitwerking: |-
        $\cos(\pi-\theta)=-\cos\theta$ en $\sin(\pi-\theta)=\sin\theta$.
    - opgave: |-
        Pas toe op $r = 1 + \cos\theta$ en op $r = 1 + \sin\theta$.
      antwoord: |-
        $x$-as; $y$-as
      uitwerking: |-
        $\cos(-\theta)=\cos\theta$ en $\sin(\pi-\theta)=\sin\theta$.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    snijpunten van poolkrommen
  opgave: |-
    Zoek de snijpunten van de cirkels $r = 2\cos\theta$ en $r = 2\sin\theta$.
  lijst: enumerate
  delen:
    - opgave: |-
        Los $2\cos\theta = 2\sin\theta$ op. Welk snijpunt vind je?
      antwoord: |-
        $\bigl[\sqrt2, \tfrac{\pi}{4}\bigr] = (1, 1)$
      uitwerking: |-
        $\tan\theta=1$; bij $\theta=\tfrac{5\pi}{4}$ krijg je $\bigl[-\sqrt2,\tfrac{5\pi}{4}\bigr]$, hetzelfde punt.
    - opgave: |-
        Zet beide om naar cartesisch en zoek alle snijpunten.
      antwoord: |-
        $(0, 0)$ en $(1, 1)$
      uitwerking: |-
        $x^2+y^2=2x$ en $x^2+y^2=2y$ geven $x=y$ en $2x^2=2x$.
    - opgave: |-
        Waarom vond je de pool niet in a?
      antwoord: |-
        de krommen gaan er bij een andere $\theta$ door
      uitwerking: |-
        De eerste bij $\theta=\tfrac{\pi}{2}$, de tweede bij $\theta=0$. Een snijpunt moet niet bij dezelfde $\theta$ op beide liggen: zoek de pool altijd apart.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    limaçon met lus
  opgave: |-
    Neem de kromme $r = 1 + 2\cos\theta$, een \textit{slakkenlijn}.
  lijst: enumerate
  delen:
    - opgave: |-
        Bij welke $\theta \in [0, 2\pi[$ is $r = 0$? Waar is $r$ negatief?
      antwoord: |-
        $\tfrac{2\pi}{3}$ en $\tfrac{4\pi}{3}$; daartussen
      uitwerking: |-
        $\cos\theta=-\tfrac12$.
    - opgave: |-
        Maak een tabel om de $\tfrac{\pi}{6}$ en teken de kromme.
      antwoord: |-
        een grote lus met een kleine lus erin
      uitwerking: |-
        $r$: $3$; $2{,}73$; $2$; $1$; $0$; $-0{,}73$; $-1$ bij $\theta=0,\tfrac{\pi}{6},\ldots,\pi$, en symmetrisch. De negatieve waarden geven punten rechts van de pool: de kleine lus, met $[-1,\pi]=(1,0)$.
    - opgave: |-
        Hoe ver ligt het verste punt van de pool?
      antwoord: |-
        3, in $(3, 0)$
      uitwerking: |-
        $|r|$ is het grootst bij $\theta=0$.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    trifolium, cartesische vergelijking
  opgave: |-
    Neem het trifolium $r = 2\cos3\theta$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $(x^2 + y^2)^2 = 2(x^3 - 3xy^2)$.
      antwoord: |-
        zoals in het voorbeeld, maal $r^3$
      uitwerking: |-
        $r^4=2r^3\cos3\theta$ en $r^3\cos3\theta=x^3-3xy^2$.
    - opgave: |-
        Controleer met de top van het blad op de poolas.
      antwoord: |-
        $(2, 0)$: $16 = 2 \cdot 8$
      uitwerking: |-
        $\theta=0$ geeft $r=2$.
    - opgave: |-
        Toon aan de cartesische vergelijking aan dat de kromme symmetrisch is ten opzichte van de $x$-as.
      antwoord: |-
        $y$ komt alleen als $y^2$ voor
      uitwerking: |-
        $y\to-y$ verandert niets.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    rechte in poolcoördinaten
  opgave: |-
    Neem de rechte $x + y = 4$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een poolvergelijking.
      antwoord: |-
        $r = \dfrac{4}{\cos\theta + \sin\theta}$
      uitwerking: |-
        $r(\cos\theta+\sin\theta)=4$.
    - opgave: |-
        Toon aan dat $\cos\theta + \sin\theta = \sqrt2\cos\bigl(\theta - \tfrac{\pi}{4}\bigr)$, en schrijf de vergelijking als $r = \dfrac{d}{\cos(\theta - \alpha)}$.
      antwoord: |-
        $r = \dfrac{2\sqrt2}{\cos\bigl(\theta - \tfrac{\pi}{4}\bigr)}$
      uitwerking: |-
        Verschilformule: $\sqrt2\bigl(\cos\theta\cdot\tfrac{\sqrt2}{2}+\sin\theta\cdot\tfrac{\sqrt2}{2}\bigr)$.
    - opgave: |-
        Wat betekenen $d$ en $\alpha$ meetkundig?
      antwoord: |-
        de afstand van de pool tot de rechte, en de richting van de loodlijn
      uitwerking: |-
        $r$ is het kleinst, $r=d=2\sqrt2$, bij $\theta=\alpha=\tfrac{\pi}{4}$: het voetpunt $(2,2)$ van de loodlijn uit de pool.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    lemniscaat in poolcoördinaten
  opgave: |-
    Neem de lemniscaat $(x^2 + y^2)^2 = 2c^2(x^2 - y^2)$ uit hoofdstuk 2.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $r^2 = 2c^2\cos2\theta$.
      antwoord: |-
        zoals in het voorbeeld
      uitwerking: |-
        $r^4=2c^2r^2(\cos^2\theta-\sin^2\theta)$.
    - opgave: |-
        Toon aan dat $y^2 = 2c^2(1 - 2u)u$ met $u = \sin^2\theta$.
      antwoord: |-
        $y^2 = r^2\sin^2\theta$
      uitwerking: |-
        $\cos2\theta=1-2\sin^2\theta$.
    - opgave: |-
        Zoek het hoogste punt van de lemniscaat.
      antwoord: |-
        $y = \tfrac c2$, bij $\theta = \tfrac{\pi}{6}$, in $\bigl(\tfrac{c\sqrt3}{2}, \tfrac c2\bigr)$
      uitwerking: |-
        $(1-2u)u$ is maximaal bij $u=\tfrac14$: $y^2=2c^2\cdot\tfrac12\cdot\tfrac14=\tfrac{c^2}{4}$. Dan is $\sin\theta=\tfrac12$ en $r^2=2c^2\cdot\tfrac12=c^2$.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    cirkels door de pool
  opgave: |-
    Neem de kromme $r = a\cos\theta + b\sin\theta$, met $a$ en $b$ niet allebei 0.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het een cirkel door de pool is. Geef het middelpunt en de straal.
      antwoord: |-
        middelpunt $\bigl(\tfrac a2, \tfrac b2\bigr)$, straal $\tfrac12\sqrt{a^2 + b^2}$
      uitwerking: |-
        $x^2+y^2=ax+by$, dus $\bigl(x-\tfrac a2\bigr)^2+\bigl(y-\tfrac b2\bigr)^2=\tfrac{a^2+b^2}{4}$. De oorsprong voldoet.
    - opgave: |-
        Geef een poolvergelijking van de cirkel met middelpunt $(3, -4)$ door de oorsprong.
      antwoord: |-
        $r = 6\cos\theta - 8\sin\theta$
      uitwerking: |-
        $a=6$, $b=-8$.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    cardioïde, cartesische vergelijking
  opgave: |-
    Neem de cardioïde $r = a(1 + \cos\theta)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $(x^2 + y^2 - ax)^2 = a^2(x^2 + y^2)$.
      antwoord: |-
        $r^2 = ar + ax$
      uitwerking: |-
        Vermenigvuldig met $r$: $r^2=ar+ar\cos\theta$, dus $r^2-ax=ar$. Kwadrateer.
    - opgave: |-
        Waar snijdt ze de assen?
      antwoord: |-
        $(0, 0)$, $(2a, 0)$, $(0, \pm a)$
      uitwerking: |-
        $\theta=0$: $r=2a$; $\theta=\pm\tfrac{\pi}{2}$: $r=a$; $\theta=\pi$: de pool.
    - opgave: |-
        Vergelijk met de cardioïde uit de stelling. Hoe is ze gedraaid?
      antwoord: |-
        een halve toer, en met $c = a$ in plaats van $2a$
      uitwerking: |-
        $r=2a(1-\cos\theta)$ heeft de spits in de pool en het hart naar links; hier wijst het hart naar rechts, want $1+\cos\theta=1-\cos(\theta+\pi)$.

- id: h3-o18
  soort: opdracht
  niveau: 3
  thema: |-
    logaritmische spiraal
  opgave: |-
    De schelp van een nautilus groeit volgens een \textit{logaritmische spiraal} $r = \e^{b\theta}$, met $b > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $r$ bij elke toer met dezelfde factor vermenigvuldigd wordt. Welke factor?
      antwoord: |-
        $\e^{2\pi b}$
      uitwerking: |-
        $\tfrac{r(\theta+2\pi)}{r(\theta)}=\e^{2\pi b}$. Bij een spiraal van Archimedes komt er telkens hetzelfde bij, hier wordt het telkens hetzelfde keer zo groot.
    - opgave: |-
        Bij een nautilus is de schelp na een toer ongeveer 3 keer zo breed. Bereken $b$.
      antwoord: |-
        $b = \tfrac{\ln3}{2\pi} \approx 0{,}175$
      uitwerking: |-
        $\e^{2\pi b}=3$.
    - opgave: |-
        Met de parametervoorstelling $x = \e^{b\theta}\cos\theta$, $y = \e^{b\theta}\sin\theta$: toon aan dat de snelheidsvector een constante hoek $\psi$ maakt met de richting $(\cos\theta, \sin\theta)$: $\cos\psi = \tfrac{b}{\sqrt{b^2 + 1}}$.
      antwoord: |-
        $\vec v = \e^{b\theta}(b\cos\theta - \sin\theta,\ b\sin\theta + \cos\theta)$
      uitwerking: |-
        $\vec v\cdot(\cos\theta,\sin\theta)=\e^{b\theta}b$ en $|\vec v|=\e^{b\theta}\sqrt{b^2+1}$. Daarom heet de kromme ook de hoekgetrouwe spiraal.
    - opgave: |-
        Hoe groot is die hoek bij de nautilus?
      antwoord: |-
        ongeveer $80^\circ$
      uitwerking: |-
        $\cos\psi=\tfrac{0{,}175}{\sqrt{1{,}0306}}\approx0{,}172$, dus $\psi\approx80^\circ$.

- id: h3-o19
  soort: opdracht
  niveau: 3
  thema: |-
    hoek in drie delen met de conchoïde
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[scale=.75,font=\scriptsize]
        \draw[->,lijngrijs] (-.3,0) -- (5.3,0) node[right,text=black] {$x$};
        \draw[grijs,thick] (1,-.4) -- (1,2.6) node[above,text=black] {$l$};
        \begin{scope}\clip (-.3,-.4) rectangle (5.2,2.6);
        \poolkromme{-60}{60}{1/cos(\t)+4}
        \end{scope}
        \draw[grijs] (0,0) -- (1,1.732);
        \draw[grijs] (0,0) -- (4.759,1.732);
        \draw[grijs,dashed] (1,1.732) -- (4.759,1.732);
        \fill (0,0) circle (1.5pt) node[below left,inner sep=1pt] {$O$};
        \fill (1,1.732) circle (1.5pt) node[above left,inner sep=1pt] {$P$};
        \fill (1,.364) circle (1.5pt) node[below right,inner sep=1pt] {$Q$};
        \fill (2.879,1.048) circle (1.5pt) node[below right,inner sep=1pt] {$M$};
        \fill[accent] (4.759,1.732) circle (2pt) node[above,text=black,inner sep=2pt] {$R$};
        \draw[grijs] (1,1.732) -- (2.879,1.048);
      \end{tikzpicture}
  opgave: |-
    Zo verdeelde Nicomedes een hoek $\varphi = \angle POX$ in drie. Neem $l \leftrightarrow x = 1$ en $P$ op $l$. Teken de conchoïde met pool $O$, rechte $l$ en $b = 2\,|OP|$. De horizontale rechte door $P$ snijdt de buitenste tak in $R$, en $OR$ snijdt $l$ in $Q$. Noem $M$ het midden van $[QR]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom is $|QR| = 2\,|OP|$, en waarom is driehoek $PQR$ rechthoekig in $P$?
      antwoord: |-
        de definitie van de conchoïde; $PQ$ is verticaal en $PR$ horizontaal
      uitwerking: |-
        $R$ ligt op de conchoïde, op afstand $b$ van $Q$ op de rechte $OQ$.
    - opgave: |-
        Leg uit waarom $|MP| = |MQ| = |MR| = |OP|$.
      antwoord: |-
        het midden van de schuine zijde
      uitwerking: |-
        In een rechthoekige driehoek ligt het midden van de schuine zijde even ver van de drie hoekpunten (de cirkel van Thales), en $|MQ|=\tfrac12|QR|=|OP|$.
    - opgave: |-
        Noem $\psi = \angle ROX$. Toon aan dat $\angle PRM = \psi$ en $\angle PMO = 2\psi$.
      antwoord: |-
        verwisselende hoeken; buitenhoek van de gelijkbenige driehoek $PMR$
      uitwerking: |-
        $PR$ is evenwijdig met de $x$-as. In de gelijkbenige driehoek $PMR$ is de buitenhoek bij $M$ de som van twee gelijke hoeken $\psi$.
    - opgave: |-
        Leid af dat $\varphi = 3\psi$. Controleer met $\varphi = 60^\circ$: welke $\psi$ geeft de figuur?
      antwoord: |-
        $\psi = 20^\circ$
      uitwerking: |-
        Driehoek $OPM$ is gelijkbenig met $|OP|=|MP|$, dus $\angle POM=\angle PMO=2\psi$, en $\varphi=\angle POM+\angle MOX=2\psi+\psi$. In de figuur is $P(1,\sqrt3)$, $b=4$ en $R\approx(4{,}76;\ 1{,}73)$, met $\tan\psi=\tfrac{1{,}73}{4{,}76}\approx0{,}364=\tan20^\circ$.

- id: h3-o22
  soort: opdracht
  niveau: 3
  thema: |-
    rozen met sinus, draaien
  opgave: |-
    Vergelijk de rozen $r = a\cos(n\theta)$ en $r = a\sin(n\theta)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\sin(n\theta) = \cos\Bigl(n\bigl(\theta - \tfrac{\pi}{2n}\bigr)\Bigr)$.
      antwoord: |-
        $\cos\bigl(n\theta - \tfrac{\pi}{2}\bigr) = \sin(n\theta)$
      uitwerking: |-
        Verwante hoeken.
    - opgave: |-
        Toon aan: als $r = f(\theta)$ een kromme is, dan is $r = f(\theta - \alpha)$ dezelfde kromme, gedraaid over $\alpha$ rond de pool.
      antwoord: |-
        $[f(\theta), \theta] \mapsto [f(\theta), \theta + \alpha]$
      uitwerking: |-
        Het punt $\bigl[f(\varphi),\varphi\bigr]$ van de eerste kromme gaat bij de draaiing naar $\bigl[f(\varphi),\varphi+\alpha\bigr]$. Met $\theta=\varphi+\alpha$ is dat $\bigl[f(\theta-\alpha),\theta\bigr]$.
    - opgave: |-
        Over welke hoek is $r = \sin3\theta$ gedraaid ten opzichte van $r = \cos3\theta$? In welke richtingen wijzen de bladen?
      antwoord: |-
        over $\tfrac{\pi}{6}$; naar $\tfrac{\pi}{6}$, $\tfrac{5\pi}{6}$ en $\tfrac{3\pi}{2}$
      uitwerking: |-
        De bladen van $\cos3\theta$ wijzen naar $0$, $\tfrac{2\pi}{3}$, $\tfrac{4\pi}{3}$. Tel er $\tfrac{\pi}{6}$ bij.

- id: h3-o20
  soort: opdracht
  niveau: 3
  thema: |-
    rollende munten, aantal draaiingen
  opgave: |-
    Een munt met straal $\rho$ rolt zonder glijden één keer rond een vaste munt met straal $R$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke afstand legt het middelpunt van de rollende munt af?
      antwoord: |-
        $2\pi(R + \rho)$
      uitwerking: |-
        Het middelpunt beschrijft een cirkel met straal $R+\rho$.
    - opgave: |-
        Een munt die rolt zonder glijden, draait over een hoek $\tfrac{s}{\rho}$ als haar middelpunt een afstand $s$ aflegt. Hoeveel toeren maakt de rollende munt?
      antwoord: |-
        $\dfrac{R + \rho}{\rho} = \dfrac{R}{\rho} + 1$
      uitwerking: |-
        $\tfrac{2\pi(R+\rho)}{\rho}$ radialen.
    - opgave: |-
        Controleer met het probleem van de twee munten, en bereken het aantal toeren als de vaste munt dubbel zo groot is.
      antwoord: |-
        2; 3
      uitwerking: |-
        $R=\rho$ geeft 2. $R=2\rho$ geeft 3.
    - opgave: |-
        Rolt de munt aan de binnenkant van een ring met straal $R = 4\rho$, zoals bij de astroïde van hoofdstuk 1, dan is het aantal toeren $\tfrac{R}{\rho} - 1$. Verklaar en bereken.
      antwoord: |-
        3
      uitwerking: |-
        Het middelpunt beschrijft nu een cirkel met straal $R-\rho$, en de munt draait in tegengestelde zin rond. $\tfrac{2\pi(R-\rho)}{\rho}$ radialen is 3 toeren.

# --- Koppel ------------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    Het trifolium $r = \cos3\theta$ en de derdemachtswortels van 1.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek de toppen van de bladen: de punten met $|r| = 1$. Geef ze in poolcoördinaten met $r = 1$.
      antwoord: |-
        $[1, 0]$, $\bigl[1, \tfrac{2\pi}{3}\bigr]$, $\bigl[1, \tfrac{4\pi}{3}\bigr]$
      uitwerking: |-
        $|\cos3\theta|=1$ bij $\theta=\tfrac{k\pi}{3}$. Bij $\theta=\tfrac{\pi}{3}$ is $r=-1$: dat is $\bigl[1,\tfrac{4\pi}{3}\bigr]$. Zo vind je drie verschillende punten.
    - opgave: |-
        Toon aan dat de complexe getallen met die beeldpunten de oplossingen zijn van $z^3 = 1$.
      antwoord: |-
        De Moivre
      uitwerking: |-
        $\bigl(\cos\tfrac{2k\pi}{3}+\mathrm{i}\sin\tfrac{2k\pi}{3}\bigr)^3=\cos2k\pi+\mathrm{i}\sin2k\pi=1$.
    - opgave: |-
        Vermenigvuldigen met $\cos\alpha + \mathrm{i}\sin\alpha$ draait het vlak over $\alpha$. Welke poolvergelijking krijgt het trifolium na vermenigvuldiging met $\mathrm{i}$?
      antwoord: |-
        $r = \cos\Bigl(3\bigl(\theta - \tfrac{\pi}{2}\bigr)\Bigr) = -\sin3\theta$
      uitwerking: |-
        Een draaiing over $\tfrac{\pi}{2}$: vervang $\theta$ door $\theta-\tfrac{\pi}{2}$, en $\cos\bigl(3\theta-\tfrac{3\pi}{2}\bigr)=-\sin3\theta$.

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Goniometrische functies
  opgave: |-
    Zet de roos om naar een cartesische vergelijking. Gebruik de verdubbelingsformules.
  lijst: enumerate
  delen:
    - opgave: |-
        $r = \sin2\theta$
      antwoord: |-
        $(x^2 + y^2)^3 = 4x^2y^2$
      uitwerking: |-
        $r=2\sin\theta\cos\theta$, maal $r^2$: $r^3=2xy$. Kwadrateer: $r^6=4x^2y^2$.
    - opgave: |-
        $r = \cos2\theta$
      antwoord: |-
        $(x^2 + y^2)^3 = (x^2 - y^2)^2$
      uitwerking: |-
        $r=\cos^2\theta-\sin^2\theta$, maal $r^2$: $r^3=x^2-y^2$. Kwadrateer.
    - opgave: |-
        Waarom moet je kwadrateren, en wat zegt dat over het teken van $r$?
      antwoord: |-
        $r^3 = \sqrt{x^2 + y^2}^{\,3}$ bevat een wortel
      uitwerking: |-
        Na het kwadrateren voldoen ook de punten met $r^3=-2xy$, maar die zijn er al: $[r,\theta]$ en $[-r,\theta+\pi]$ zijn hetzelfde punt.

- id: h3-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: analyse
    onderwerp: |-
      Integralen
  opgave: |-
    Hoe groot is de oppervlakte binnen een poolkromme $r = f(\theta)$? Verdeel ze in smalle sectoren rond de pool.
  lijst: enumerate
  delen:
    - opgave: |-
        Een cirkelsector met straal $r$ en hoek $\Delta\theta$ heeft oppervlakte $\tfrac12 r^2\Delta\theta$. Leg uit waarom de oppervlakte binnen de kromme $A = \tfrac12\int_0^{2\pi} f(\theta)^2\,\mathrm{d}\theta$ is.
      antwoord: |-
        een riemannsom van sectoren
      uitwerking: |-
        Op een klein interval $[\theta_k,\theta_k+\Delta\theta]$ is het stuk bijna een sector met straal $f(\theta_k)$. De som $\sum\tfrac12f(\theta_k)^2\Delta\theta$ gaat naar de integraal.
    - opgave: |-
        Controleer met de cirkel $r = R$.
      antwoord: |-
        $\pi R^2$
      uitwerking: |-
        $\tfrac12R^2\cdot2\pi$.
    - opgave: |-
        Bereken de oppervlakte binnen de cardioïde $r = 2a(1 - \cos\theta)$. Hoeveel keer is dat de oppervlakte van een munt?
      antwoord: |-
        $6\pi a^2$; zes keer
      uitwerking: |-
        $\tfrac12\cdot4a^2\int_0^{2\pi}(1-2\cos\theta+\cos^2\theta)\,\mathrm{d}\theta=2a^2(2\pi+\pi)=6\pi a^2$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Zet om.
  lijst: enumerate
  delen:
    - opgave: |-
        $\bigl[6, \tfrac{5\pi}{6}\bigr]$ naar cartesische coördinaten
      antwoord: |-
        $(-3\sqrt3, 3)$
      uitwerking: |-
        $6\cdot\bigl(-\tfrac{\sqrt3}{2}\bigr)$ en $6\cdot\tfrac12$.
    - opgave: |-
        $(-2, -2)$ naar poolcoördinaten
      antwoord: |-
        $\bigl[2\sqrt2, \tfrac{5\pi}{4}\bigr]$
      uitwerking: |-
        Derde kwadrant, $\tan\theta=1$.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Teken $r = 4\sin\theta$ voor $\theta \in [0, \pi]$ met een tabel, en herken de kromme.
  antwoord: |-
    de cirkel met middelpunt $(0, 2)$ en straal 2
  uitwerking: |-
    $r$: $0$; $2$; $3{,}46$; $4$; $3{,}46$; $2$; $0$ bij $\theta=0,\tfrac{\pi}{6},\ldots,\pi$. Of: $x^2+y^2=4y$.

- id: h3-t3
  soort: test
  niveau: 1
  opgave: |-
    Geef een cartesische vergelijking en herken de kromme.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $r = -4\sin\theta$
      antwoord: |-
        $x^2 + (y + 2)^2 = 4$
      uitwerking: |-
        $x^2+y^2=-4y$: een cirkel onder de poolas.
    - opgave: |-
        $r\cos\theta = 5$
      antwoord: |-
        $x = 5$
      uitwerking: |-
        Een verticale rechte.

- id: h3-t4
  soort: test
  niveau: 2
  opgave: |-
    Geef een poolvergelijking.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 + y^2 = 10x$
      antwoord: |-
        $r = 10\cos\theta$
      uitwerking: |-
        $r^2=10r\cos\theta$.
    - opgave: |-
        $(x^2 + y^2)^2 = 4xy$
      antwoord: |-
        $r^2 = 2\sin2\theta$
      uitwerking: |-
        $r^4=4r^2\sin\theta\cos\theta=2r^2\sin2\theta$.

- id: h3-t5
  soort: test
  niveau: 1
  opgave: |-
    Neem de spiraal van Archimedes $r = \tfrac12\theta$. Hoe ver liggen twee windingen uit elkaar? Waar snijdt ze de positieve $x$-as?
  antwoord: |-
    $\pi$; in $x = k\pi$ met $k \in \N$
  uitwerking: |-
    $2\pi\cdot\tfrac12=\pi$. Bij $\theta=2k\pi$ is $r=k\pi$.

- id: h3-t6
  soort: test
  niveau: 2
  opgave: |-
    Neem de roos $r = 4\cos2\theta$. Hoeveel bladen heeft ze, hoe lang zijn ze, en bij welke $\theta \in [0, 2\pi[$ gaat ze door de pool? Teken ze.
  antwoord: |-
    4 bladen met lengte 4; $\theta = \tfrac{\pi}{4}, \tfrac{3\pi}{4}, \tfrac{5\pi}{4}, \tfrac{7\pi}{4}$
  uitwerking: |-
    $n=2$ even, dus $2n=4$. $\cos2\theta=0$ bij $2\theta=\tfrac{\pi}{2}+k\pi$. De bladen wijzen naar $0$, $\tfrac{\pi}{2}$, $\pi$ en $\tfrac{3\pi}{2}$.

- id: h3-t7
  soort: test
  niveau: 2
  opgave: |-
    Een munt met straal 3~cm rolt zonder glijden rond een even grote munt. Geef de poolvergelijking van de baan van het punt $P$ dat in het begin de vaste munt raakt, met de pool in dat beginpunt. Hoe ver komt $P$ van zijn beginpunt? Waar is $P$ als de rollende munt een kwart ronde gemaakt heeft?
  antwoord: |-
    $r = 6(1 - \cos\theta)$; 12~cm; $\bigl[6, \tfrac{\pi}{2}\bigr]$, 6~cm recht boven het beginpunt
  uitwerking: |-
    $2a=6$. Het verste punt bij $\theta=\pi$: $r=12$. Bij $\theta=\tfrac{\pi}{2}$ is $r=6$.
