# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of geef.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\cos\tfrac{2\pi}{3}$ en $\sin\tfrac{2\pi}{3}$
      antwoord: |-
        $-\tfrac12$ en $\tfrac{\sqrt3}{2}$
      uitwerking: |-
        $\tfrac{2\pi}{3} = 120^\circ$, in het tweede kwadrant.
    - opgave: |-
        $t$ als $x = 3t - 2$ en $x = 7$
      antwoord: |-
        $t = 3$
      uitwerking: |-
        $3t = 9$.
    - opgave: |-
        $\cos^2 t + \sin^2 t$
      antwoord: |-
        $1$
      uitwerking: |-
        De grondformule.
    - opgave: |-
        de afgeleide van $\sin 3t$
      antwoord: |-
        $3\cos 3t$
      uitwerking: |-
        Kettingregel.
    - opgave: |-
        een vergelijking van de cirkel met middelpunt $(2, -1)$ en straal 3
      antwoord: |-
        $(x-2)^2+(y+1)^2=9$
      uitwerking: |-
        Middelpuntsvergelijking.
    - opgave: |-
        een richtingsvector van de rechte door $(1, 4)$ en $(3, 0)$
      antwoord: |-
        $(2, -4)$, of $(1, -2)$
      uitwerking: |-
        Het verschil van de twee punten.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Een mier loopt over een blad papier met een assenstelsel. Na $t$ seconden is ze in het punt met $x = t^2 - 1$ en $y = t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar is de mier na $-2$, $-1$, $0$, $1$ en $2$ seconden? Zet de punten in een assenstelsel.
      antwoord: |-
        $(3, {-}2)$, $(0, {-}1)$, $(-1, 0)$, $(0, 1)$, $(3, 2)$
      uitwerking: |-
        Vul $t$ in in beide formules.
    - opgave: |-
        Verbind de punten in de volgorde van de tijd. Welke vorm herken je?
      antwoord: |-
        een parabool die op haar zij ligt
      uitwerking: |-
        Een parabool met de top in $(-1, 0)$, die naar rechts opent.
    - opgave: |-
        Is die kromme de grafiek van een functie $y = f(x)$? Waarom niet?
      antwoord: |-
        nee
      uitwerking: |-
        Bij $x = 3$ horen twee punten, $(3, -2)$ en $(3, 2)$.
    - opgave: |-
        Druk $x$ uit in $y$ alleen.
      antwoord: |-
        $x = y^2 - 1$
      uitwerking: |-
        Omdat $t = y$.

- id: h1-bal
  soort: kort
  opgave: |-
    Een bal wordt opgegooid. Na $t$ seconden is hij op $x = 6t$ meter horizontaal van de werper en op $y = 2 + 8t - 5t^2$ meter hoogte.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar is de bal na 1 seconde?
      antwoord: |-
        $(6, 5)$
      uitwerking: |-
        $x=6$, $y=2+8-5=5$.
    - opgave: |-
        Wanneer is de bal op zijn hoogst, en hoe hoog is hij dan?
      antwoord: |-
        na $0{,}8$~s, op $5{,}2$~m
      uitwerking: |-
        De top van $y(t)$ ligt bij $t=\tfrac{8}{10}=0{,}8$: $y=2+6{,}4-3{,}2=5{,}2$, bij $x=4{,}8$.
    - opgave: |-
        Waar komt de bal op de grond?
      antwoord: |-
        op ongeveer $10{,}9$~m
      uitwerking: |-
        $5t^2-8t-2=0$ geeft $t=\tfrac{8+\sqrt{104}}{10}\approx1{,}82$, en $x\approx6\cdot1{,}82\approx10{,}9$.

- id: h1-tekenen
  soort: kort
  opgave: |-
    Teken de kromme met een tabel.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = t + 1$, $y = t^2 - 2t$ voor $t \in [-1, 3]$
      antwoord: |-
        een stuk van de dalparabool met top $(2, -1)$, van $(0, 3)$ tot $(4, 3)$
      uitwerking: |-
        Punten: $(0, 3)$, $(1, 0)$, $(2, {-}1)$, $(3, 0)$, $(4, 3)$.
    - opgave: |-
        $x = t^3 - t$, $y = 1 - t^2$ voor $t \in [-1{,}5;\ 1{,}5]$. Door welk punt gaat de kromme twee keer?
      antwoord: |-
        een lus, met dubbelpunt $(0, 0)$
      uitwerking: |-
        Punten: $t=-1{,}5$: $(-1{,}88;\ -1{,}25)$; $t=-1$: $(0, 0)$; $t=-0{,}5$: $(0{,}38;\ 0{,}75)$; $t=0$: $(0, 1)$; $t=0{,}5$: $(-0{,}38;\ 0{,}75)$; $t=1$: $(0, 0)$; $t=1{,}5$: $(1{,}88;\ -1{,}25)$. Dezelfde $y$ geeft $t_2=-t_1$, en dan dezelfde $x$ als $t^3-t=0$, dus $t=\pm1$: het dubbelpunt is $(0, 0)$.

- id: h1-cirkel
  soort: kort
  opgave: |-
    Geef een parametervoorstelling van de beweging over de cirkel met middelpunt $(3, -1)$ en straal 2.
  lijst: enumerate
  delen:
    - opgave: |-
        Het punt start helemaal rechts en draait tegen de klok in, met $t$ de draaihoek.
      antwoord: |-
        $x = 3 + 2\cos t$, $y = -1 + 2\sin t$
      uitwerking: |-
        De stelling met $a=3$, $b=-1$, $r=2$.
    - opgave: |-
        Het punt start bovenaan en draait met de klok mee, één toer in 6 seconden, met $t$ in seconden.
      antwoord: |-
        $x = 3 + 2\sin\tfrac{\pi t}{3}$, $y = -1 + 2\cos\tfrac{\pi t}{3}$
      uitwerking: |-
        De hoek is $\tfrac{\pi}{2}-\tfrac{2\pi}{6}t$. Met $\cos\bigl(\tfrac{\pi}{2}-\alpha\bigr)=\sin\alpha$ en $\sin\bigl(\tfrac{\pi}{2}-\alpha\bigr)=\cos\alpha$ volgt de formule. Controle: bij $t=1{,}5$ is het punt $(5, {-}1)$, helemaal rechts.

- id: h1-elim
  soort: kort
  opgave: |-
    Elimineer de parameter. Welke kromme is het?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x = 2t - 1$, $y = 4t + 3$
      antwoord: |-
        $y = 2x + 5$, een rechte
      uitwerking: |-
        $t=\tfrac{x+1}{2}$, dus $y=2(x+1)+3$.
    - opgave: |-
        $x = t^2$, $y = t^4 + 1$
      antwoord: |-
        $y = x^2 + 1$ met $x \geqslant 0$
      uitwerking: |-
        $t^4=x^2$, en $x=t^2$ is nooit negatief: alleen de rechterhelft van de parabool.
    - opgave: |-
        $x = 3\cos t$, $y = 3\sin t + 1$
      antwoord: |-
        $x^2 + (y-1)^2 = 9$, een cirkel
      uitwerking: |-
        $\cos t=\tfrac x3$, $\sin t=\tfrac{y-1}{3}$: middelpunt $(0, 1)$, straal 3.
    - opgave: |-
        $x = 2 + 5\cos t$, $y = 4\sin t$
      antwoord: |-
        $\tfrac{(x-2)^2}{25} + \tfrac{y^2}{16} = 1$, een ellips
      uitwerking: |-
        $\cos t=\tfrac{x-2}{5}$, $\sin t=\tfrac y4$.

- id: h1-bereik
  soort: kort
  opgave: |-
    Zoek een vergelijking in $x$ en $y$, en zeg welk deel van die figuur de kromme is.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = \cos t$, $y = \cos 2t$
      antwoord: |-
        $y = 2x^2 - 1$ met $-1 \leqslant x \leqslant 1$
      uitwerking: |-
        $\cos 2t=2\cos^2t-1$. De cosinus blijft in $[-1, 1]$: het stuk van de parabool tussen $(-1, 1)$ en $(1, 1)$, heen en weer doorlopen.
    - opgave: |-
        $x = \sin^2 t$, $y = \cos^2 t$
      antwoord: |-
        $x + y = 1$ met $0 \leqslant x \leqslant 1$
      uitwerking: |-
        De grondformule. Een kwadraat ligt in $[0, 1]$: alleen het lijnstuk van $(1, 0)$ tot $(0, 1)$.

- id: h1-lissa
  soort: kort
  opgave: |-
    Neem de Lissajousfiguur $x = \sin 2t$, $y = \cos t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $y$ in de vorm $\sin(bt + \varphi)$. Wat zijn $a$, $b$ en $\varphi$?
      antwoord: |-
        $y = \sin\bigl(t + \tfrac{\pi}{2}\bigr)$: $a = 2$, $b = 1$, $\varphi = \tfrac{\pi}{2}$
      uitwerking: |-
        $\cos t=\sin\bigl(t+\tfrac{\pi}{2}\bigr)$.
    - opgave: |-
        Teken de figuur met een tabel om de $\tfrac{\pi}{4}$.
      antwoord: |-
        een staande acht
      uitwerking: |-
        Punten: $(0, 1)$, $(1;\ 0{,}71)$, $(0, 0)$, $(-1;\ -0{,}71)$, $(0, {-}1)$, $(1;\ -0{,}71)$, $(0, 0)$, $(-1;\ 0{,}71)$. Een acht die rechtop staat, met de knoop in de oorsprong.
    - opgave: |-
        Controleer de stelling: hoeveel keer raakt de figuur de bovenzijde en de rechterzijde van het vierkant?
      antwoord: |-
        bovenaan 1 keer, rechts 2 keer
      uitwerking: |-
        $y=1$ alleen bij $t=0$; $x=1$ bij $t=\tfrac{\pi}{4}$ en $t=\tfrac{5\pi}{4}$, in $(1;\ 0{,}71)$ en $(1;\ -0{,}71)$.

- id: h1-cycl
  soort: kort
  opgave: |-
    Een wiel met straal 40~cm rolt over de grond. Een punt op de rand raakt bij de start de grond.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar is dat punt, ten opzichte van zijn beginpunt, na een zesde toer?
      antwoord: |-
        $(0{,}072;\ 0{,}2)$, in meter
      uitwerking: |-
        $t=\tfrac{\pi}{3}$: $x=0{,}4\bigl(\tfrac{\pi}{3}-\tfrac{\sqrt3}{2}\bigr)\approx0{,}072$ en $y=0{,}4\cdot\tfrac12=0{,}2$.
    - opgave: |-
        Waar is het na anderhalve toer?
      antwoord: |-
        $(1{,}2\pi;\ 0{,}8) \approx (3{,}77;\ 0{,}8)$
      uitwerking: |-
        $t=3\pi$: $\sin t=0$ en $\cos t=-1$, dus bovenaan.

- id: h1-snel
  soort: kort
  opgave: |-
    Geef de snelheidsvector en de snelheid.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = 2t$, $y = 4t - t^2$, op de tijdstippen $t = 0$, $t = 1$ en $t = 2$
      antwoord: |-
        $(2, 4)$, $(2, 2)$, $(2, 0)$; $\sqrt{20}$, $\sqrt8$, $2$
      uitwerking: |-
        $\vec v(t)=(2,\ 4-2t)$. Bij $t=2$ is het punt in de top van de parabool.
    - opgave: |-
        $x = 5\cos 2t$, $y = 5\sin 2t$, op een willekeurig tijdstip
      antwoord: |-
        $(-10\sin 2t,\ 10\cos 2t)$; snelheid 10
      uitwerking: |-
        $|\vec v|=\sqrt{100\sin^2 2t+100\cos^2 2t}=10$: een eenparige cirkelbeweging.

- id: h1-raak
  soort: kort
  opgave: |-
    Neem de kromme $x = 2\cos t$, $y = \sin 2t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking van de raaklijn in het punt met $t = \tfrac{\pi}{6}$.
      antwoord: |-
        $y = -x + \tfrac{3\sqrt3}{2}$
      uitwerking: |-
        $P\bigl(\sqrt3, \tfrac{\sqrt3}{2}\bigr)$ en $\vec v=(-2\sin t,\ 2\cos 2t)=(-1, 1)$, dus $m=-1$ en $y-\tfrac{\sqrt3}{2}=-(x-\sqrt3)$.
    - opgave: |-
        In welke punten is de raaklijn horizontaal? En verticaal?
      antwoord: |-
        horizontaal in $(\pm\sqrt2, \pm1)$; verticaal in $(\pm2, 0)$
      uitwerking: |-
        $\cos 2t=0$ bij $t=\tfrac{\pi}{4}+k\tfrac{\pi}{2}$: de vier punten $(\pm\sqrt2, \pm1)$, waar $x'=-2\sin t\neq0$. $\sin t=0$ bij $t=0$ en $t=\pi$: $(2, 0)$ en $(-2, 0)$, waar $y'=\pm2\neq0$.

- id: h1-terug
  soort: kort
  opgave: |-
    Een auto rijdt aan 90~km/h. Zijn banden hebben een straal van 30~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe snel gaat het bovenste punt van een band?
      antwoord: |-
        180~km/h
      uitwerking: |-
        Zoals in het voorbeeld: $|\vec v|=2v\,\bigl|\sin\tfrac{\omega\tau}{2}\bigr|$ met $v=90$~km/h, en bovenaan is de sinus 1.
    - opgave: |-
        Hoe snel gaat een punt van de band dat even hoog is als de as, vooraan?
      antwoord: |-
        $90\sqrt2 \approx 127$~km/h
      uitwerking: |-
        Op hoogte $R$ vooraan is $\omega\tau=\tfrac{3\pi}{2}$ (het punt komt naar beneden), en $2\cdot90\cdot\sin\tfrac{3\pi}{4}=90\sqrt2$. Achteraan, bij $\omega\tau=\tfrac{\pi}{2}$, net zo. De straal speelt geen rol.

# --- Opdrachten ------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    tekenen met een tabel
  opgave: |-
    Teken de kromme met een tabel, en zet een pijl in de zin van stijgende $t$.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = 2t - 1$, $y = t^2$ voor $t \in [-2, 2]$
      antwoord: |-
        een stuk van een dalparabool, van $(-5, 4)$ tot $(3, 4)$
      uitwerking: |-
        Punten: $(-5, 4)$, $(-3, 1)$, $(-1, 0)$, $(1, 1)$, $(3, 4)$. Met $t=\tfrac{x+1}{2}$: $y=\tfrac14(x+1)^2$.
    - opgave: |-
        $x = 3\cos t$, $y = 2\sin t$ voor $t \in [0, \pi]$
      antwoord: |-
        de bovenste helft van een ellips, van $(3, 0)$ naar $(-3, 0)$
      uitwerking: |-
        Punten: $(3, 0)$, $(2{,}12;\ 1{,}41)$, $(0, 2)$, $(-2{,}12;\ 1{,}41)$, $(-3, 0)$. Op $[0, \pi]$ is $\sin t\geqslant0$: alleen de bovenste helft, tegen de klok in.
    - opgave: |-
        $x = 2^t$, $y = 2^{-t}$ voor $t \in [-2, 2]$
      antwoord: |-
        een stuk van de hyperbool $y = \tfrac1x$, van $(\tfrac14, 4)$ naar $(4, \tfrac14)$
      uitwerking: |-
        Punten: $(\tfrac14, 4)$, $(\tfrac12, 2)$, $(1, 1)$, $(2, \tfrac12)$, $(4, \tfrac14)$. Want $xy=2^t\cdot2^{-t}=1$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    parametervoorstelling opstellen
  opgave: |-
    Geef een parametervoorstelling.
  lijst: enumerate
  delen:
    - opgave: |-
        de rechte door $(1, 2)$ en $(4, -1)$
      antwoord: |-
        $x = 1 + 3t$, $y = 2 - 3t$, $t \in \R$
      uitwerking: |-
        Richtingsvector $(3, {-}3)$. Andere keuzes zijn ook goed, zoals $(1, {-}1)$.
    - opgave: |-
        het lijnstuk van $A(0, 1)$ tot $B(4, 3)$
      antwoord: |-
        $x = 4t$, $y = 1 + 2t$, $t \in [0, 1]$
      uitwerking: |-
        $P=A+t\,\overrightarrow{AB}$, met $t=0$ in $A$ en $t=1$ in $B$.
    - opgave: |-
        de cirkel met middelpunt $(-1, 3)$ en straal 2
      antwoord: |-
        $x = -1 + 2\cos t$, $y = 3 + 2\sin t$
      uitwerking: |-
        De stelling, met $t\in[0, 2\pi[$.
    - opgave: |-
        de ellips $\dfrac{x^2}{25} + \dfrac{y^2}{9} = 1$
      antwoord: |-
        $x = 5\cos t$, $y = 3\sin t$
      uitwerking: |-
        Zoals in Kegelsneden: $\bigl(\tfrac x5\bigr)^2+\bigl(\tfrac y3\bigr)^2=1$.
    - opgave: |-
        de grafiek van $y = x^3 - x$
      antwoord: |-
        $x = t$, $y = t^3 - t$
      uitwerking: |-
        Elke grafiek met $x=t$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    parameter elimineren
  opgave: |-
    Elimineer de parameter en herken de kromme. Let op het bereik.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x = 3t + 1$, $y = 2 - t$
      antwoord: |-
        $x + 3y = 7$
      uitwerking: |-
        $t=2-y$, dus $x=3(2-y)+1$.
    - opgave: |-
        $x = t^2$, $y = 2t$
      antwoord: |-
        $y^2 = 4x$
      uitwerking: |-
        $t=\tfrac y2$. Een parabool die naar rechts opent, helemaal doorlopen.
    - opgave: |-
        $x = 4\cos t$, $y = 4\sin t$
      antwoord: |-
        $x^2 + y^2 = 16$
      uitwerking: |-
        Een cirkel met straal 4.
    - opgave: |-
        $x = 3 + \cos t$, $y = \sin t - 2$
      antwoord: |-
        $(x-3)^2 + (y+2)^2 = 1$
      uitwerking: |-
        Een cirkel met middelpunt $(3, {-}2)$ en straal 1.
    - opgave: |-
        $x = \sqrt t$, $y = t - 1$
      antwoord: |-
        $y = x^2 - 1$ met $x \geqslant 0$
      uitwerking: |-
        $t=x^2$, en een wortel is nooit negatief: de rechterhelft.
    - opgave: |-
        $x = \dfrac1t$, $y = t + 1$, $t \neq 0$
      antwoord: |-
        $y = \tfrac1x + 1$
      uitwerking: |-
        $t=\tfrac1x$. Een hyperbool met asymptoten $x=0$ en $y=1$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    punt op een kromme
  opgave: |-
    Ligt het punt op de kromme $x = t^2 + 1$, $y = 2t - 1$? Geef zo ja de waarde van $t$.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $(5, 3)$
      antwoord: |-
        ja, $t = 2$
      uitwerking: |-
        $y=3$ geeft $t=2$, en dan is $x=5$.
    - opgave: |-
        $(5, -5)$
      antwoord: |-
        ja, $t = -2$
      uitwerking: |-
        $y=-5$ geeft $t=-2$, en $x=5$.
    - opgave: |-
        $(2, 3)$
      antwoord: |-
        nee
      uitwerking: |-
        $y=3$ geeft $t=2$, maar dan is $x=5\neq2$.
    - opgave: |-
        $(10, 5)$
      antwoord: |-
        ja, $t = 3$
      uitwerking: |-
        $y=5$ geeft $t=3$, en $x=10$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    Lissajousfiguren aflezen
  opgave: |-
    Drie Lissajousfiguren $x = \sin(at)$, $y = \sin(bt + \varphi)$ met natuurlijke getallen $a$ en $b$ zonder gemeenschappelijke deler. Lees $a$ en $b$ af.

    \figuren{\begin{tikzpicture}[scale=.9,font=\scriptsize]
      \draw[lijngrijs] (-1,-1) rectangle (1,1);
      \pkromme{0}{360}{sin(\t)}{cos(3*\t)}
      \node at (0,-1.35) {a};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[scale=.9,font=\scriptsize]
      \draw[lijngrijs] (-1,-1) rectangle (1,1);
      \draw[accent,thick] plot[domain=0:360,samples=300,smooth,variable=\t] ({sin(4*\t)},{sin(3*\t+45)});
      \node at (0,-1.35) {b};
    \end{tikzpicture}\qquad
    \begin{tikzpicture}[scale=.9,font=\scriptsize]
      \draw[lijngrijs] (-1,-1) rectangle (1,1);
      \draw[accent,thick] plot[domain=0:360,samples=300,smooth,variable=\t] ({sin(3*\t)},{sin(5*\t+20)});
      \node at (0,-1.35) {c};
    \end{tikzpicture}}
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        figuur a
      antwoord: |-
        $a = 1$, $b = 3$
      uitwerking: |-
        Eén raakpunt rechts, drie bovenaan. (Het is $x=\sin t$, $y=\cos3t$.)
    - opgave: |-
        figuur b
      antwoord: |-
        $a = 4$, $b = 3$
      uitwerking: |-
        Vier raakpunten rechts, drie bovenaan.
    - opgave: |-
        figuur c
      antwoord: |-
        $a = 3$, $b = 5$
      uitwerking: |-
        Drie raakpunten rechts, vijf bovenaan.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    cycloïde
  opgave: |-
    Een cirkel met straal 2 rolt over de $x$-as. Een punt van de cirkel vertrekt in de oorsprong.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een parametervoorstelling van zijn baan.
      antwoord: |-
        $x = 2(t - \sin t)$, $y = 2(1 - \cos t)$
      uitwerking: |-
        De stelling met $R=2$.
    - opgave: |-
        Bereken de coördinaten bij $t = \tfrac{\pi}{2}$, $\pi$ en $\tfrac{3\pi}{2}$, en teken de baan voor $t \in [0, 2\pi]$.
      antwoord: |-
        $(\pi - 2, 2)$, $(2\pi, 4)$, $(3\pi + 2, 2)$
      uitwerking: |-
        Bij $\tfrac{\pi}{2}$: $\sin t=1$, $\cos t=0$. Bij $\pi$: $\sin t=0$, $\cos t=-1$. Bij $\tfrac{3\pi}{2}$: $\sin t=-1$, $\cos t=0$. Eén boog van $(0, 0)$ tot $(4\pi, 0)$, symmetrisch rond $x=2\pi$.
    - opgave: |-
        Hoe hoog komt het punt? Hoe ver liggen twee spitsen uit elkaar?
      antwoord: |-
        4; $4\pi \approx 12{,}6$
      uitwerking: |-
        De hoogte is $2R$, de afstand tussen twee spitsen de omtrek $2\pi R$.
    - opgave: |-
        Waar is het middelpunt van de cirkel als het punt voor de tweede keer de grond raakt?
      antwoord: |-
        $(8\pi, 2)$
      uitwerking: |-
        Na twee toeren, $t=4\pi$: het middelpunt is $(Rt, R)=(8\pi, 2)$.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    beweging lezen
  opgave: |-
    Een punt beweegt over een cirkel, met $t$ in seconden. Geef het middelpunt en de straal, het beginpunt, de zin (met of tegen de klok) en de tijd voor één toer.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = \cos 2\pi t$, $y = \sin 2\pi t$
      antwoord: |-
        $(0, 0)$, 1; start $(1, 0)$; tegen de klok; 1~s
      uitwerking: |-
        De hoek $2\pi t$ stijgt met $2\pi$ per seconde.
    - opgave: |-
        $x = 3\sin \pi t$, $y = 3\cos \pi t$
      antwoord: |-
        $(0, 0)$, 3; start $(0, 3)$; met de klok; 2~s
      uitwerking: |-
        Bij $t=0$ is het punt $(0, 3)$. Bij $t=\tfrac12$ is het $(3, 0)$: van boven naar rechts, dus met de klok mee. De hoek $\pi t$ is $2\pi$ na 2~s.
    - opgave: |-
        $x = 2\cos\tfrac t2$, $y = -2\sin\tfrac t2$
      antwoord: |-
        $(0, 0)$, 2; start $(2, 0)$; met de klok; $4\pi \approx 12{,}6$~s
      uitwerking: |-
        Het minteken bij $y$ keert de zin om. $\tfrac t2=2\pi$ bij $t=4\pi$.
    - opgave: |-
        $x = 1 + \cos 4t$, $y = \sin 4t$
      antwoord: |-
        $(1, 0)$, 1; start $(2, 0)$; tegen de klok; $\tfrac{\pi}{2} \approx 1{,}57$~s
      uitwerking: |-
        $4t=2\pi$ bij $t=\tfrac{\pi}{2}$.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    baan van een bal, context
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[x=.21cm,y=.6cm,font=\scriptsize]
        \draw[grijs,line width=1.2pt] (-1,0) -- (21.5,0);
        \fill[lijngrijs] (9.15,0) rectangle (9.65,1.9);
        \draw[grijs,line width=1.4pt] (20,0) -- (20,2.44) -- (21.5,2.44);
        \pkromme{0}{1}{20*\t}{7*\t-4.9*\t*\t}
        \fill (0,0) circle (2pt);
        \node[below] at (9.4,0) {muur};
        \node[below] at (20,0) {doel};
      \end{tikzpicture}
  opgave: |-
    Een vrije trap. De bal vertrekt van de grond en is na $t$ seconden op $x = 20t$ meter van de plaats van de trap en $y = 7t - 4{,}9t^2$ meter hoog. Op 9,15~m staat een muur van spelers van 1,90~m hoog. Het doel staat op 20~m, en de lat hangt op 2,44~m.
  lijst: enumerate
  delen:
    - opgave: |-
        Gaat de bal over de muur?
      antwoord: |-
        ja, op ongeveer 2,18~m hoogte
      uitwerking: |-
        Bij $x=9{,}15$ is $t=0{,}4575$, en $y=7\cdot0{,}4575-4{,}9\cdot0{,}4575^2\approx2{,}18>1{,}90$.
    - opgave: |-
        Gaat de bal onder de lat?
      antwoord: |-
        ja, op 2,10~m hoogte
      uitwerking: |-
        Bij $x=20$ is $t=1$, en $y=7-4{,}9=2{,}1<2{,}44$.
    - opgave: |-
        Waar ligt het hoogste punt van de baan?
      antwoord: |-
        $(14{,}3;\ 2{,}5)$
      uitwerking: |-
        $y'(t)=7-9{,}8t=0$ bij $t=\tfrac{5}{7}$: $x=\tfrac{100}{7}\approx14{,}3$ en $y=2{,}5$.
    - opgave: |-
        Geef een vergelijking van de baan in $x$ en $y$.
      antwoord: |-
        $y = 0{,}35x - 0{,}01225x^2$
      uitwerking: |-
        $t=\tfrac{x}{20}$, dus $y=\tfrac{7x}{20}-\tfrac{4{,}9x^2}{400}$.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    baan en beweging, botsing
  opgave: |-
    Twee drones vliegen op dezelfde hoogte. Na $t$ minuten is drone A in $(2 + t,\ 1 + 2t)$ en drone B in $(8 - t,\ 3 + t)$, in hectometer.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de twee banen. Snijden ze elkaar? Waar?
      antwoord: |-
        ja, in $\bigl(\tfrac{14}{3}, \tfrac{19}{3}\bigr)$
      uitwerking: |-
        Zoek $t$ en $s$ met $2+t=8-s$ en $1+2t=3+s$: $t=\tfrac83$ en $s=\tfrac{10}{3}$. Het snijpunt is $\bigl(\tfrac{14}{3}, \tfrac{19}{3}\bigr)$.
    - opgave: |-
        Botsen de drones?
      antwoord: |-
        nee
      uitwerking: |-
        A is in het snijpunt na $\tfrac83$ minuten, B pas na $\tfrac{10}{3}$ minuten.
    - opgave: |-
        Toon aan dat het kwadraat van hun afstand op tijdstip $t$ gelijk is aan $5t^2 - 28t + 40$.
      antwoord: |-
        $(2t-6)^2 + (t-2)^2$
      uitwerking: |-
        $A-B=(2t-6,\ t-2)$, en $(2t-6)^2+(t-2)^2=5t^2-28t+40$.
    - opgave: |-
        Hoe dicht komen ze bij elkaar, en wanneer?
      antwoord: |-
        ongeveer 89~m, na 2,8 minuten
      uitwerking: |-
        De top van $5t^2-28t+40$ ligt bij $t=2{,}8$, met waarde $0{,}8$. De afstand is $\sqrt{0{,}8}\approx0{,}89$~hm.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijnen
  opgave: |-
    Neem de kromme $x = t^2 - 2t$, $y = t^3 - 12t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking van de raaklijn in de oorsprong ($t = 0$).
      antwoord: |-
        $y = 6x$
      uitwerking: |-
        $\vec v(t)=(2t-2,\ 3t^2-12)$, $\vec v(0)=(-2, {-}12)$, dus $m=6$.
    - opgave: |-
        Geef een vergelijking van de raaklijn in het punt met $t = 3$.
      antwoord: |-
        $y + 9 = \tfrac{15}{4}(x - 3)$
      uitwerking: |-
        $P(3, {-}9)$ en $\vec v(3)=(4, 15)$.
    - opgave: |-
        In welke punten is de raaklijn horizontaal?
      antwoord: |-
        $(0, -16)$ en $(8, 16)$
      uitwerking: |-
        $3t^2-12=0$ bij $t=\pm2$, en daar is $x'=2t-2\neq0$.
    - opgave: |-
        In welk punt is de raaklijn verticaal?
      antwoord: |-
        $(-1, -11)$
      uitwerking: |-
        $2t-2=0$ bij $t=1$, en $y'(1)=-9\neq0$.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijn aan een cycloïde
  opgave: |-
    Neem de cycloïde $x = t - \sin t$, $y = 1 - \cos t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de richtingscoëfficiënt van de raaklijn $m = \dfrac{\sin t}{1 - \cos t}$ is, als $\cos t \neq 1$.
      antwoord: |-
        $\vec v = (1 - \cos t,\ \sin t)$
      uitwerking: |-
        Afleiden: $x'=1-\cos t$ en $y'=\sin t$.
    - opgave: |-
        Geef een vergelijking van de raaklijn bij $t = \tfrac{\pi}{2}$ en bij $t = \pi$.
      antwoord: |-
        $y = x + 2 - \tfrac{\pi}{2}$; $y = 2$
      uitwerking: |-
        Bij $\tfrac{\pi}{2}$: $P\bigl(\tfrac{\pi}{2}-1, 1\bigr)$ en $m=1$. Bij $\pi$: $P(\pi, 2)$ en $m=0$, de top van de boog.
    - opgave: |-
        Wat gebeurt er met $m$ als $t$ naar 0 gaat, langs rechts en langs links? Wat zegt dat over de vorm in de spits?
      antwoord: |-
        $+\infty$ en $-\infty$: een verticale raaklijn
      uitwerking: |-
        Teller naar 0, noemer positief naar 0. Met $\sin t\approx t$ en $1-\cos t\approx\tfrac{t^2}{2}$ is $m\approx\tfrac2t$. Langs rechts $+\infty$, langs links $-\infty$: beide bogen komen verticaal in de spits.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    trochoïde, context
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.7,font=\scriptsize]
        \draw[grijs,line width=1.2pt] (-1.4,0) -- (5,0);
        \draw[lijngrijs,thick] (0,1.2) circle (1.2);
        \draw[lijngrijs] (0,1.2) -- (0,.34);
        \pkromme{0}{4.3}{1.2*\t-.86*sin(\t r)}{1.2-.86*cos(\t r)}
        \fill[fel] (-.14,.27) rectangle (.14,.41);
        \fill (0,1.2) circle (1.5pt);
      \end{tikzpicture}
  opgave: |-
    Een fietswiel met straal 35~cm draagt een reflector op 25~cm van de as. De fiets rijdt aan 5~m/s. Neem de oorsprong op de grond onder de as bij de start, als de reflector recht onder de as zit.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de reflector de baan $x = 0{,}35t - 0{,}25\sin t$, $y = 0{,}35 - 0{,}25\cos t$ volgt, met $t$ de draaihoek.
      antwoord: |-
        middelpunt $(0{,}35t;\ 0{,}35)$ plus $0{,}25(-\sin t, -\cos t)$
      uitwerking: |-
        Zoals in het bewijs van de cycloïde, maar met een straal van 0,25 in plaats van 0,35 voor de reflector.
    - opgave: |-
        Tussen welke hoogtes beweegt de reflector?
      antwoord: |-
        tussen 10~cm en 60~cm
      uitwerking: |-
        $y=0{,}35-0{,}25\cos t$ ligt tussen $0{,}10$ en $0{,}60$.
    - opgave: |-
        Heeft deze baan spitsen? Teken een stuk van de baan.
      antwoord: |-
        nee
      uitwerking: |-
        $\vec v=(0{,}35-0{,}25\cos t,\ 0{,}25\sin t)$ is nooit nul, want de eerste coördinaat is minstens $0{,}10$. Een golvende kromme zonder spitsen en zonder lussen.
    - opgave: |-
        Toon aan dat de snelheid van de reflector $\omega\sqrt{0{,}185 - 0{,}175\cos t}$ is, met $\omega = \tfrac{5}{0{,}35}$ de draaisnelheid.
      antwoord: |-
        $|\vec v|^2 = \omega^2(0{,}35^2 - 2\cdot0{,}35\cdot0{,}25\cos t + 0{,}25^2)$
      uitwerking: |-
        Met $t=\omega\tau$ komt er een factor $\omega$ bij elke afgeleide. Kwadrateer en gebruik $\cos^2+\sin^2=1$: $0{,}1225+0{,}0625=0{,}185$ en $2\cdot0{,}35\cdot0{,}25=0{,}175$.
    - opgave: |-
        Wat zijn de kleinste en de grootste snelheid?
      antwoord: |-
        ongeveer 1,43~m/s en 8,57~m/s
      uitwerking: |-
        Bij $\cos t=1$ is het $\omega\sqrt{0{,}01}=\omega\cdot0{,}10=\tfrac{5}{0{,}35}\cdot0{,}10\approx1{,}43$. Bij $\cos t=-1$ is het $\omega\cdot0{,}60\approx8{,}57$.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    Lissajousfiguren met $a = b$
  opgave: |-
    Neem $x = \sin t$, $y = \sin(t + \varphi)$. Teken de figuur en herken ze.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\varphi = 0$
      antwoord: |-
        het lijnstuk $y = x$
      uitwerking: |-
        $y=x$ met $x\in[-1, 1]$, heen en weer doorlopen.
    - opgave: |-
        $\varphi = \tfrac{\pi}{2}$
      antwoord: |-
        de eenheidscirkel
      uitwerking: |-
        $y=\cos t$, dus $x^2+y^2=1$.
    - opgave: |-
        $\varphi = \pi$
      antwoord: |-
        het lijnstuk $y = -x$
      uitwerking: |-
        $\sin(t+\pi)=-\sin t$.
    - opgave: |-
        $\varphi = \tfrac{\pi}{4}$
      antwoord: |-
        een schuine ellips
      uitwerking: |-
        Een ellips in het vierkant, met de lange as langs $y=x$. Zie ook de Koppel.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    dubbelpunt en raaklijnen
  opgave: |-
    Neem de kromme $x = t^2 - 1$, $y = t^3 - t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de kromme voor $t \in [-1{,}6;\ 1{,}6]$.
      antwoord: |-
        een lus links van de $y$-as, met twee takken naar rechts
      uitwerking: |-
        Punten: $(-1, 0)$ bij $t=0$, $(0, 0)$ bij $t=\pm1$, $(1{,}56;\ \pm2{,}50)$ bij $t=\pm1{,}6$, $(-0{,}75;\ \pm0{,}38)$ bij $t=\pm0{,}5$. De kromme is symmetrisch ten opzichte van de $x$-as.
    - opgave: |-
        Toon aan dat de kromme symmetrisch is ten opzichte van de $x$-as.
      antwoord: |-
        $t \to -t$ geeft $(x, -y)$
      uitwerking: |-
        $x(-t)=x(t)$ en $y(-t)=-y(t)$.
    - opgave: |-
        Zoek het dubbelpunt en de twee raaklijnen erin.
      antwoord: |-
        $(0, 0)$; $y = x$ en $y = -x$
      uitwerking: |-
        $x(t_1)=x(t_2)$ met $t_1\neq t_2$ geeft $t_2=-t_1$, en dan $y$ gelijk als $t^3-t=0$: $t=\pm1$. $\vec v=(2t,\ 3t^2-1)$: bij $t=1$ is $m=\tfrac22=1$, bij $t=-1$ is $m=\tfrac{2}{-2}=-1$.
    - opgave: |-
        Welke hoek maken die raaklijnen?
      antwoord: |-
        $90^\circ$
      uitwerking: |-
        $m_1m_2=-1$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    snelheid op een ellips
  opgave: |-
    Een punt doorloopt de ellips $x = 4\cos t$, $y = 2\sin t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de snelheid $\sqrt{4 + 12\sin^2 t}$ is.
      antwoord: |-
        $|\vec v|^2 = 16\sin^2 t + 4\cos^2 t$
      uitwerking: |-
        $\vec v=(-4\sin t,\ 2\cos t)$, en $4\cos^2t=4-4\sin^2t$.
    - opgave: |-
        Waar gaat het punt het traagst, en waar het snelst? Hoe snel?
      antwoord: |-
        traagst in $(\pm4, 0)$ met 2; snelst in $(0, \pm2)$ met 4
      uitwerking: |-
        $\sin^2t$ is 0 bij $t=0, \pi$ en 1 bij $t=\tfrac{\pi}{2}, \tfrac{3\pi}{2}$.
    - opgave: |-
        Een planeet gaat het snelst als ze het dichtst bij de zon staat, in een top van de lange as. Kan deze parametervoorstelling dus de beweging van een planeet beschrijven, met $t$ als tijd?
      antwoord: |-
        nee
      uitwerking: |-
        Hier is het punt in de toppen van de lange as net het traagst. De baan is wel een ellips, maar de beweging niet die van een planeet.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    baan uit de grafieken van x(t) en y(t)
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[scale=.62,font=\scriptsize]
        \begin{scope}[yshift=3.7cm]
          \draw[black!14,very thin] (0,0) grid (4,2);
          \draw[->,grijs] (0,0) -- (4.5,0) node[right,text=black] {$t$};
          \draw[->,grijs] (0,0) -- (0,2.5) node[above,text=black] {$x$};
          \foreach \t in {1,2,3,4}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
          \foreach \t in {1,2}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
          \draw[accent,thick] (0,0) -- (1,2) -- (2,2) -- (3,0) -- (4,0);
        \end{scope}
        \draw[black!14,very thin] (0,0) grid (4,2);
        \draw[->,grijs] (0,0) -- (4.5,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,2.5) node[above,text=black] {$y$};
        \foreach \t in {1,2,3,4}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {1,2}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \draw[accent,thick] (0,0) -- (1,0) -- (2,2) -- (3,2) -- (4,0);
      \end{tikzpicture}
  opgave: |-
    Een robotje rijdt over een vloer. De grafieken tonen zijn coördinaten $x$ en $y$ (in meter) als functie van de tijd $t$ (in minuten).
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de baan van het robotje in het $xy$-vlak.
      antwoord: |-
        de omtrek van het vierkant met hoekpunten $(0, 0)$, $(2, 0)$, $(2, 2)$, $(0, 2)$
      uitwerking: |-
        Van $t=0$ tot 1: van $(0, 0)$ naar $(2, 0)$. Dan naar $(2, 2)$, dan naar $(0, 2)$, dan terug naar $(0, 0)$.
    - opgave: |-
        Rijdt het met of tegen de klok?
      antwoord: |-
        tegen de klok
      uitwerking: |-
        Eerst naar rechts, dan omhoog.
    - opgave: |-
        Hoe snel rijdt het? Is de snelheid constant?
      antwoord: |-
        2~m per minuut, constant
      uitwerking: |-
        Op elk stuk verandert één coördinaat met 2 per minuut en de andere niet.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    astroïde
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.7,font=\scriptsize]
        \assen{-2.4}{2.5}{-2.4}{2.5}
        \pkromme{0}{360}{2*cos(\t)^3}{2*sin(\t)^3}
        \node[below left,inner sep=1pt] at (2,0) {$2$};
      \end{tikzpicture}
  opgave: |-
    De kromme $x = 2\cos^3 t$, $y = 2\sin^3 t$ heet een \textit{astroïde}, naar het Griekse woord voor ster.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken enkele punten en controleer de figuur.
      antwoord: |-
        bv. $(2, 0)$, $(0{,}71;\ 0{,}71)$, $(0, 2)$
      uitwerking: |-
        $t=0$: $(2, 0)$. $t=\tfrac{\pi}{4}$: $2\bigl(\tfrac{\sqrt2}{2}\bigr)^3=\tfrac{\sqrt2}{2}\approx0{,}71$. $t=\tfrac{\pi}{2}$: $(0, 2)$.
    - opgave: |-
        Toon aan dat $x^{2/3} + y^{2/3} = 2^{2/3}$.
      antwoord: |-
        $x^{2/3} = 2^{2/3}\cos^2 t$
      uitwerking: |-
        $x^{2/3}=2^{2/3}\cos^2t$ en $y^{2/3}=2^{2/3}\sin^2t$. Tel op.
    - opgave: |-
        Bereken de snelheidsvector. Waar staat het punt stil?
      antwoord: |-
        $(-6\cos^2 t\sin t,\ 6\sin^2 t\cos t)$; in $(\pm2, 0)$ en $(0, \pm2)$
      uitwerking: |-
        Beide coördinaten zijn 0 als $\sin t=0$ of $\cos t=0$: bij $t=0$, $\tfrac{\pi}{2}$, $\pi$, $\tfrac{3\pi}{2}$.
    - opgave: |-
        Wat zie je in die punten op de figuur?
      antwoord: |-
        spitsen
      uitwerking: |-
        Het punt staat er even stil en keert van richting: vier spitsen, de punten van de ster.

- id: h1-o23
  soort: opdracht
  niveau: 2
  thema: |-
    dezelfde kromme, andere parameter
  opgave: |-
    Welk deel van de parabool $y = x^2$ beschrijft de parametervoorstelling, met $t \in \R$? Wordt het een of meer keer doorlopen?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x = t^3$, $y = t^6$
      antwoord: |-
        de hele parabool, één keer
      uitwerking: |-
        $t^3$ neemt elke reële waarde precies één keer aan.
    - opgave: |-
        $x = \sin t$, $y = \sin^2 t$
      antwoord: |-
        het stuk boven $[-1, 1]$, oneindig vaak heen en weer
      uitwerking: |-
        $\sin t$ blijft in $[-1, 1]$ en schommelt.
    - opgave: |-
        $x = \e^t$, $y = \e^{2t}$
      antwoord: |-
        de rechterhelft zonder de top, één keer
      uitwerking: |-
        $\e^t$ neemt elke positieve waarde één keer aan.
    - opgave: |-
        $x = t^2$, $y = t^4$
      antwoord: |-
        de rechterhelft met de top, twee keer
      uitwerking: |-
        $t$ en $-t$ geven hetzelfde punt: het punt komt van rechts naar de top en gaat terug.

- id: h1-o18
  soort: opdracht
  niveau: 3
  thema: |-
    worp onder een hoek
  opgave: |-
    Een kogel wordt vanaf de grond weggeschoten met snelheid $v_0$ onder een hoek $\alpha$ met de grond. Met $g = 10$~m/s$^2$ is zijn baan $x = v_0\cos\alpha \cdot t$, $y = v_0\sin\alpha \cdot t - 5t^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Controleer dat de beginsnelheid $v_0$ is, onder de hoek $\alpha$.
      antwoord: |-
        $\vec v(0) = (v_0\cos\alpha,\ v_0\sin\alpha)$
      uitwerking: |-
        Die vector heeft lengte $v_0$ en maakt een hoek $\alpha$ met de $x$-as.
    - opgave: |-
        Toon aan dat de kogel landt op de afstand $\dfrac{v_0^2 \sin 2\alpha}{10}$.
      antwoord: |-
        $t = \tfrac{v_0\sin\alpha}{5}$
      uitwerking: |-
        $y=0$ geeft $t=0$ of $t=\tfrac{v_0\sin\alpha}{5}$. Dan is $x=\tfrac{v_0^2\sin\alpha\cos\alpha}{5}=\tfrac{v_0^2\sin2\alpha}{10}$.
    - opgave: |-
        Onder welke hoek komt de kogel het verst?
      antwoord: |-
        $45^\circ$
      uitwerking: |-
        $\sin2\alpha$ is maximaal 1, bij $2\alpha=90^\circ$.
    - opgave: |-
        Toon aan dat twee hoeken die samen $90^\circ$ zijn, even ver dragen. Wat is het verschil tussen de twee banen?
      antwoord: |-
        $\sin 2\alpha = \sin(180^\circ - 2\alpha)$
      uitwerking: |-
        $\sin2(90^\circ-\alpha)=\sin(180^\circ-2\alpha)=\sin2\alpha$. De steilste baan gaat hoger en duurt langer.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    raaklijn aan een cycloïde, bewijs
  opgave: |-
    Een cirkel met straal 1 rolt over de $x$-as, en $P$ beschrijft de cycloïde $x = t - \sin t$, $y = 1 - \cos t$. Op het ogenblik $t$ raakt de cirkel de $x$-as in $C(t, 0)$, en het hoogste punt van de cirkel is $T(t, 2)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\overrightarrow{PT}$ evenwijdig is met de snelheidsvector $\vec v(t)$. Wat betekent dat voor de raaklijn?
      antwoord: |-
        de raaklijn in $P$ gaat door $T$
      uitwerking: |-
        $\overrightarrow{PT}=(\sin t,\ 1+\cos t)$ en $\vec v=(1-\cos t,\ \sin t)$. Ze zijn evenwijdig als $\sin t\cdot\sin t-(1+\cos t)(1-\cos t)=0$, en dat is $\sin^2t-(1-\cos^2t)=0$.
    - opgave: |-
        Toon aan dat $\overrightarrow{PC}$ loodrecht staat op $\vec v(t)$.
      antwoord: |-
        het scalair product is 0
      uitwerking: |-
        $\overrightarrow{PC}=(\sin t,\ \cos t-1)$, en $\sin t(1-\cos t)+(\cos t-1)\sin t=0$.
    - opgave: |-
        Leg uit met een figuur: op elk ogenblik draait het wiel rond zijn raakpunt met de grond.
      antwoord: |-
        $\vec v \perp \overrightarrow{CP}$
      uitwerking: |-
        Elk punt van het wiel beweegt loodrecht op de verbinding met $C$, zoals bij een draaiing rond $C$. Daarom staat $C$ even stil, en gaat $T$, het verst van $C$, het snelst.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    trochoïde, achteruit
  opgave: |-
    Een treinwiel rolt met straal $R$ over de rail, maar de flens aan de binnenkant steekt verder uit, tot op afstand $d > R$ van de as. Een punt van de rand van de flens beschrijft $x = Rt - d\sin t$, $y = R - d\cos t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat dat punt achteruit beweegt ($x' < 0$) als $\cos t > \tfrac Rd$.
      antwoord: |-
        $x' = R - d\cos t$
      uitwerking: |-
        $x'<0\iff d\cos t>R\iff\cos t>\tfrac Rd$, en $\tfrac Rd<1$, dus dat gebeurt echt.
    - opgave: |-
        Waar is dat punt op dat ogenblik: boven of onder de rail?
      antwoord: |-
        onder de rail
      uitwerking: |-
        $\cos t>\tfrac Rd$ geeft $y=R-d\cos t<0$: het punt zit lager dan het raakpunt met de rail.
    - opgave: |-
        Teken de baan voor $R = 1$ en $d = 1{,}5$. Welke vorm heeft ze bij de rail?
      antwoord: |-
        een lus onder de rail
      uitwerking: |-
        Telkens als het punt onderaan zit, maakt het een kleine lus achteruit. Een rijdende trein heeft dus altijd een paar punten die achteruit gaan.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    rationale parametervoorstelling van een cirkel
  opgave: |-
    Neem de kromme $x = \dfrac{1 - t^2}{1 + t^2}$, $y = \dfrac{2t}{1 + t^2}$ met $t \in \R$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat elk punt op de eenheidscirkel ligt.
      antwoord: |-
        $x^2 + y^2 = 1$
      uitwerking: |-
        $(1-t^2)^2+4t^2=(1+t^2)^2$, dus $x^2+y^2=\tfrac{(1+t^2)^2}{(1+t^2)^2}=1$.
    - opgave: |-
        Welk punt van de cirkel krijg je nooit? Wat gebeurt er als $t$ naar $\pm\infty$ gaat?
      antwoord: |-
        $(-1, 0)$
      uitwerking: |-
        $x=-1$ zou $1-t^2=-1-t^2$ geven, onmogelijk. Voor $t\to\pm\infty$ gaat het punt naar $(-1, 0)$.
    - opgave: |-
        Toon aan dat $t$ de richtingscoëfficiënt is van de rechte door $(-1, 0)$ en het punt.
      antwoord: |-
        $\tfrac{y}{x + 1} = t$
      uitwerking: |-
        $x+1=\tfrac{2}{1+t^2}$, dus $\tfrac{y}{x+1}=\tfrac{2t}{2}=t$.
    - opgave: |-
        Kies $t = \tfrac23$. Welk punt krijg je? Leid er een rechthoekige driehoek met gehele zijden uit af.
      antwoord: |-
        $\bigl(\tfrac{5}{13}, \tfrac{12}{13}\bigr)$; de driehoek $5, 12, 13$
      uitwerking: |-
        $x=\tfrac{1-4/9}{1+4/9}=\tfrac{5}{13}$, $y=\tfrac{4/3}{13/9}=\tfrac{12}{13}$. Uit $x^2+y^2=1$ volgt $5^2+12^2=13^2$. Elke rationale $t$ geeft zo een Pythagorees drietal.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    hypocycloïde
  opgave: |-
    Een cirkel met straal 1 rolt aan de binnenkant van een cirkel met straal 4 en middelpunt $O$. Een punt $P$ van de kleine cirkel vertrekt in $(4, 0)$. Je kunt aantonen dat $P$ de baan $x = 3\cos t + \cos 3t$, $y = 3\sin t - \sin 3t$ volgt.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke baan volgt het middelpunt van de kleine cirkel? Leg uit.
      antwoord: |-
        de cirkel met middelpunt $O$ en straal 3
      uitwerking: |-
        Het middelpunt blijft op afstand $4-1=3$ van $O$. In de formule is dat $(3\cos t,\ 3\sin t)$.
    - opgave: |-
        Toon aan dat $\cos 3t = 4\cos^3 t - 3\cos t$ en $\sin 3t = 3\sin t - 4\sin^3 t$. Schrijf daarvoor $3t = 2t + t$.
      antwoord: |-
        met de somformules en de verdubbelingsformules
      uitwerking: |-
        $\cos3t=\cos2t\cos t-\sin2t\sin t=(2\cos^2t-1)\cos t-2\sin^2t\cos t=4\cos^3t-3\cos t$. Net zo $\sin3t=\sin2t\cos t+\cos2t\sin t=3\sin t-4\sin^3t$.
    - opgave: |-
        Leid af dat $x = 4\cos^3 t$ en $y = 4\sin^3 t$. Welke kromme is dat?
      antwoord: |-
        een astroïde
      uitwerking: |-
        $3\cos t+4\cos^3t-3\cos t=4\cos^3t$ en $3\sin t-3\sin t+4\sin^3t=4\sin^3t$. Dat is een astroïde, zoals $x=2\cos^3t$, $y=2\sin^3t$, maar met 4 in plaats van 2.
    - opgave: |-
        Hoeveel spitsen heeft de baan? Waarom is dat zo, als je kijkt naar de omtrek van de twee cirkels?
      antwoord: |-
        vier
      uitwerking: |-
        De grote omtrek is 4 keer de kleine: de kleine cirkel raakt de grote 4 keer met hetzelfde punt tijdens één rondgang, en telkens is er een spits.

# --- Koppel ------------------------------------------------------------------------------

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Goniometrische functies
  opgave: |-
    Neem de Lissajousfiguur $x = \sin t$, $y = \sin\bigl(t + \tfrac{\pi}{3}\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon met een somformule aan dat $y - \tfrac12 x = \tfrac{\sqrt3}{2}\cos t$.
      antwoord: |-
        $\sin\bigl(t + \tfrac{\pi}{3}\bigr) = \tfrac12\sin t + \tfrac{\sqrt3}{2}\cos t$
      uitwerking: |-
        $\sin(t+\tfrac{\pi}{3})=\sin t\cos\tfrac{\pi}{3}+\cos t\sin\tfrac{\pi}{3}$.
    - opgave: |-
        Kwadrateer en gebruik $\cos^2 t = 1 - x^2$ om aan te tonen dat $x^2 - xy + y^2 = \tfrac34$.
      antwoord: |-
        $\bigl(y - \tfrac x2\bigr)^2 = \tfrac34(1 - x^2)$
      uitwerking: |-
        $y^2-xy+\tfrac{x^2}{4}=\tfrac34-\tfrac34x^2$, dus $x^2-xy+y^2=\tfrac34$.
    - opgave: |-
        Ligt het punt $\bigl(\tfrac{\sqrt3}{2}, \tfrac{\sqrt3}{2}\bigr)$ op de figuur? Bij welke $t$?
      antwoord: |-
        ja, bij $t = \tfrac{\pi}{3}$
      uitwerking: |-
        $\tfrac34-\tfrac34+\tfrac34=\tfrac34$. En $\sin\tfrac{\pi}{3}=\tfrac{\sqrt3}{2}=\sin\tfrac{2\pi}{3}$.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Kegelsneden
  opgave: |-
    Neem $x = \dfrac{2}{\cos t}$, $y = 3\tan t$ met $t \in \bigl]-\tfrac{\pi}{2}, \tfrac{\pi}{2}\bigr[ \cup \bigl]\tfrac{\pi}{2}, \tfrac{3\pi}{2}\bigr[$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{1}{\cos^2 t} - \tan^2 t = 1$, en leid af dat de kromme een hyperbool is.
      antwoord: |-
        $\tfrac{x^2}{4} - \tfrac{y^2}{9} = 1$
      uitwerking: |-
        $\tfrac{1-\sin^2t}{\cos^2t}=1$. Dus $\bigl(\tfrac x2\bigr)^2-\bigl(\tfrac y3\bigr)^2=1$.
    - opgave: |-
        Welke waarden van $t$ geven de rechtertak, en welke de linker?
      antwoord: |-
        rechts $\bigl]-\tfrac{\pi}{2}, \tfrac{\pi}{2}\bigr[$, links $\bigl]\tfrac{\pi}{2}, \tfrac{3\pi}{2}\bigr[$
      uitwerking: |-
        Het teken van $x$ is dat van $\cos t$.
    - opgave: |-
        Toon aan dat $\tfrac yx = \tfrac32\sin t$, en leid de asymptoten af.
      antwoord: |-
        $y = \pm\tfrac32 x$
      uitwerking: |-
        $\tfrac yx=\tfrac{3\sin t/\cos t}{2/\cos t}=\tfrac32\sin t$. Als $t\to\tfrac{\pi}{2}$ gaat het punt naar het oneindige, en $\tfrac yx\to\pm\tfrac32$.

- id: h1-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: analyse
    onderwerp: |-
      Integralen
  opgave: |-
    Galilei probeerde de oppervlakte onder een boog van de cycloïde te bepalen door stukken metaal te wegen. Bereken ze met een integraal, voor de cycloïde $x = R(t - \sin t)$, $y = R(1 - \cos t)$.
  lijst: enumerate
  delen:
    - opgave: |-
        De oppervlakte is $A = \int_0^{2\pi R} y \dx$. Substitueer $x = R(t - \sin t)$: toon aan dat $A = R^2\int_0^{2\pi}(1 - \cos t)^2 \dt$.
      antwoord: |-
        $\mathrm{d}x = R(1 - \cos t)\dt$
      uitwerking: |-
        Bij $x=0$ is $t=0$, bij $x=2\pi R$ is $t=2\pi$, en $y=R(1-\cos t)$.
    - opgave: |-
        Bereken die integraal. Gebruik $\cos^2 t = \tfrac{1 + \cos 2t}{2}$.
      antwoord: |-
        $3\pi R^2$
      uitwerking: |-
        $(1-\cos t)^2=1-2\cos t+\tfrac12+\tfrac12\cos2t$. Over $[0, 2\pi]$ geven de cosinussen 0, en blijft $\tfrac32\cdot2\pi=3\pi$.
    - opgave: |-
        Vergelijk met de oppervlakte van het rollende wiel.
      antwoord: |-
        precies drie keer zo groot
      uitwerking: |-
        Het wiel heeft oppervlakte $\pi R^2$. Galilei vond met zijn weegschaal ongeveer 3, maar dacht dat het geen geheel getal was. Roberval bewees het in 1634.

# --- Test jezelf ------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Teken de kromme $x = t^2$, $y = t^3 - 4t$ voor $t \in [-2{,}5;\ 2{,}5]$ met een tabel. Zoek het dubbelpunt.
  antwoord: |-
    een lus rechts van de oorsprong; dubbelpunt $(4, 0)$
  uitwerking: |-
    Punten: $(0, 0)$, $(1, \mp3)$ bij $t=\pm1$, $(4, 0)$ bij $t=\pm2$, $(6{,}25;\ \pm5{,}63)$ bij $t=\pm2{,}5$. Dezelfde $x$ geeft $t_2=-t_1$, dezelfde $y$ dan $t^3-4t=0$, met $t\neq0$: $t=\pm2$.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Een punt draait tegen de klok in over de cirkel met middelpunt $(-1, 2)$ en straal 4. Het start in het laagste punt en doet één toer in 2 seconden. Geef een parametervoorstelling met $t$ in seconden.
  antwoord: |-
    $x = -1 + 4\sin\pi t$, $y = 2 - 4\cos\pi t$
  uitwerking: |-
    De hoek is $-\tfrac{\pi}{2}+\pi t$. Met $\cos\bigl(\pi t-\tfrac{\pi}{2}\bigr)=\sin\pi t$ en $\sin\bigl(\pi t-\tfrac{\pi}{2}\bigr)=-\cos\pi t$. Controle: $t=0$ geeft $(-1, {-}2)$, $t=\tfrac12$ geeft $(3, 2)$.

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Elimineer de parameter en herken de kromme.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = 3\cos t - 1$, $y = 2\sin t$
      antwoord: |-
        $\tfrac{(x+1)^2}{9} + \tfrac{y^2}{4} = 1$, een ellips
      uitwerking: |-
        $\cos t=\tfrac{x+1}{3}$, $\sin t=\tfrac y2$.
    - opgave: |-
        $x = \e^t$, $y = \e^{2t} + 1$
      antwoord: |-
        $y = x^2 + 1$ met $x > 0$
      uitwerking: |-
        $\e^{2t}=x^2$, en $\e^t>0$: alleen de rechterhelft, zonder de top.

- id: h1-t4
  soort: test
  niveau: 1
  opgave: |-
    Neem de Lissajousfiguur $x = \sin 2t$, $y = \sin 3t$. Hoeveel keer raakt ze de bovenzijde en de rechterzijde van het vierkant? Bereken de raakpunten met de rechterzijde.
  antwoord: |-
    bovenaan 3, rechts 2; $\bigl(1, \tfrac{\sqrt2}{2}\bigr)$ en $\bigl(1, -\tfrac{\sqrt2}{2}\bigr)$
  uitwerking: |-
    $\sin2t=1$ bij $t=\tfrac{\pi}{4}$ en $\tfrac{5\pi}{4}$. Daar is $y=\sin\tfrac{3\pi}{4}=\tfrac{\sqrt2}{2}$ en $y=\sin\tfrac{15\pi}{4}=-\tfrac{\sqrt2}{2}$.

- id: h1-t5
  soort: test
  niveau: 1
  opgave: |-
    Een wiel met straal 30~cm rolt over de grond. Een punt op de rand raakt bij de start de grond. Waar is het na een kwart toer, ten opzichte van zijn beginpunt? Hoe ver ligt het van de grond als het op zijn hoogst is?
  antwoord: |-
    ongeveer $(0{,}17;\ 0{,}30)$; 60~cm
  uitwerking: |-
    $t=\tfrac{\pi}{2}$: $x=0{,}3\bigl(\tfrac{\pi}{2}-1\bigr)\approx0{,}17$ en $y=0{,}3$. Het hoogste punt is $2R=0{,}6$.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Neem de kromme $x = t^2$, $y = t^3 - 3t$. Geef een vergelijking van de raaklijn in het punt met $t = 2$, en zoek de punten met een horizontale raaklijn.
  antwoord: |-
    $y - 2 = \tfrac94(x - 4)$; $(1, -2)$ en $(1, 2)$
  uitwerking: |-
    $\vec v=(2t,\ 3t^2-3)$. Bij $t=2$: $P(4, 2)$, $\vec v=(4, 9)$. Horizontaal: $3t^2-3=0$ bij $t=\pm1$, met $x'=\pm2\neq0$: $t=1$ geeft $(1, {-}2)$ en $t=-1$ geeft $(1, 2)$.

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Een punt beweegt volgens $x = 3\cos 2t$, $y = 2\sin 2t$. Geef de snelheidsvector en de snelheid bij $t = 0$ en bij $t = \tfrac{\pi}{4}$. Waar gaat het punt sneller?
  antwoord: |-
    $(0, 4)$ en snelheid 4; $(-6, 0)$ en snelheid 6; bij $t = \tfrac{\pi}{4}$
  uitwerking: |-
    $\vec v=(-6\sin2t,\ 4\cos2t)$. Bij $t=0$ is het punt $(3, 0)$, bij $t=\tfrac{\pi}{4}$ is het $(0, 2)$.
