# Wat uit de feedback van leerkrachten verwerkt is. Op axiomath.be staat bij elke plek een stippellijn naar rechts,
# met een kader "Verwerkt: <tekst>". Website/leerkrachten/maak.py zoekt de plek in elke PDF met `zoek` (een stukje
# gewone tekst uit de nieuwe versie, zonder formules; hoofdletters tellen niet; is het een lijst, dan de eerste die
# gevonden wordt) en neemt de eerste pagina waarop het staat. Staat het in een pakket niet, dan krijgt dat pakket
# geen kader. Houd dit bij voor elke verwerkte opmerking: nieuwste onderaan.
#   feedback: de nummers op de site (#id)       datum: wanneer verwerkt
#   tekst:    kort, voor de leerkracht: wat er veranderd is

- feedback: [27]
  datum: 2026-11-16
  zoek: 'eindig, met maar een paar elementen'
  tekst: "de opgave zegt nu eerst dat V eindig is, met maar een paar elementen."

- feedback: [28]
  datum: 2026-11-16
  zoek: 'met lege vakjes'
  tekst: "het voorbeeld toont eerst de gegeven tabel met de lege vakjes, en daarna de ingevulde tabel."

- feedback: [29]
  datum: 2026-11-16
  zoek: 'Is dit de tabel van een groep'
  tekst: "nieuwe opdracht met vijf tabellen: is dit de tabel van een groep? Ook een tabel die er bijna een is, maar niet associatief."

- feedback: [30]
  datum: 2026-11-16
  zoek: 'Elke groep is een groep van symmetrie'
  tekst: "nieuw deel: elke groep is een groep van symmetrieën, met voorbeelden bij de basisgroepen en de stelling van Cayley."
