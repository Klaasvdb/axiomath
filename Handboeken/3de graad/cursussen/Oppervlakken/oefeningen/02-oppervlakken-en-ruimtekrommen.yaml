# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of bepaal.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        een vergelijking van de kromme $x = 3\cos t$, $y = 3\sin t$
      antwoord: |-
        $x^2+y^2=9$
      uitwerking: |-
        $x^2+y^2=9\cos^2t+9\sin^2t=9$.
    - opgave: |-
        een vergelijking zonder $t$ van de rechte $x = 1 + 2t$, $y = 3 - t$
      antwoord: |-
        $x+2y=7$
      uitwerking: |-
        $t=3-y$, dus $x=1+6-2y$.
    - opgave: |-
        de doorsnede van de bol $x^2 + y^2 + z^2 = 25$ met het vlak $z = 3$
      antwoord: |-
        de cirkel $x^2+y^2=16$ op hoogte 3
      uitwerking: |-
        $x^2+y^2=25-9=16$: straal 4.
    - opgave: |-
        $\cos^2 2t + \sin^2 2t$
      antwoord: |-
        1
      uitwerking: |-
        De grondformule, met $2t$ in plaats van $t$.
    - opgave: |-
        de scherpe hoek $\alpha$ met $\tan\alpha = \tfrac{1}{\sqrt3}$
      antwoord: |-
        $30^\circ$
      uitwerking: |-
        $\tan30^\circ=\tfrac{\sqrt3}{3}=\tfrac1{\sqrt3}$.
    - opgave: |-
        de omtrek van een cirkel met straal 1,5
      antwoord: |-
        $3\pi\approx9{,}42$
      uitwerking: |-
        $2\pi\cdot1{,}5$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Een punt beweegt: op het tijdstip $t$ is het in $P(t) = \bigl(2\cos t,\ 2\sin t,\ \tfrac{t}{\pi}\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $P(0)$, $P\bigl(\tfrac\pi2\bigr)$, $P(\pi)$ en $P(2\pi)$.
      antwoord: |-
        $(2,0,0)$, $\bigl(0,2,\tfrac12\bigr)$, $(-2,0,1)$, $(2,0,2)$
      uitwerking: |-
        Invullen.
    - opgave: |-
        Toon aan dat het punt altijd op het oppervlak $x^2 + y^2 = 4$ ligt. Welk oppervlak is dat in de ruimte?
      antwoord: |-
        een cilinder rond de $z$-as met straal 2
      uitwerking: |-
        $4\cos^2t+4\sin^2t=4$. De vergelijking legt $z$ niet vast: alle hoogtes zijn toegelaten.
    - opgave: |-
        Hoeveel stijgt het punt bij één volle draai rond de $z$-as?
      antwoord: |-
        2
      uitwerking: |-
        Van $t=0$ tot $t=2\pi$ stijgt $z$ van 0 tot 2.
    - opgave: |-
        Beschrijf de baan in woorden.
      antwoord: |-
        een schroeflijn, zoals een veer
      uitwerking: |-
        Het punt draait rond de cilinder en stijgt gelijkmatig: zoals de draad van een veer of de leuning van een wenteltrap.

- id: h2-doorsneden
  soort: kort
  opgave: |-
    Beschrijf het oppervlak met niveaukrommen en een profiel.
  lijst: enumerate
  delen:
    - opgave: |-
        $z = 4 - x^2 - y^2$
      antwoord: |-
        cirkels met straal $\sqrt{4-c}$ voor $c\leqslant4$; profiel $z=4-y^2$: een omgekeerde kom met top $(0,0,4)$
      uitwerking: |-
        $z=c$ geeft $x^2+y^2=4-c$: een cirkel als $c<4$, de top als $c=4$, niets als $c>4$. Met $x=0$: de bergparabool $z=4-y^2$.
    - opgave: |-
        $z = x^2 + 4y^2$
      antwoord: |-
        ellipsen met halve assen $\sqrt c$ en $\tfrac12\sqrt c$; profielen $z=x^2$ en $z=4y^2$
      uitwerking: |-
        $z=c>0$ geeft $\dfrac{x^2}{c}+\dfrac{y^2}{c/4}=1$. Met $y=0$: $z=x^2$, met $x=0$: de smallere parabool $z=4y^2$. Een kom die in de $y$-richting steiler is.

- id: h2-cilinder
  soort: kort
  opgave: |-
    Welk oppervlak stelt de vergelijking voor? Geef de richtkromme en de richting van de beschrijvenden.
  lijst: enumerate
  delen:
    - opgave: |-
        $y^2 + z^2 = 9$
      antwoord: |-
        een cilinder rond de $x$-as met straal 3
      uitwerking: |-
        Er staat geen $x$: richtkromme de cirkel $y^2+z^2=9$ in het $yz$-vlak, beschrijvenden evenwijdig met de $x$-as.
    - opgave: |-
        $z = \sin x$
      antwoord: |-
        een golfplaat
      uitwerking: |-
        Er staat geen $y$: richtkromme de sinusgrafiek in het $xz$-vlak, beschrijvenden evenwijdig met de $y$-as.
    - opgave: |-
        $\dfrac{x^2}{4} + y^2 = 1$
      antwoord: |-
        een elliptische cilinder
      uitwerking: |-
        Er staat geen $z$: richtkromme de ellips met halve assen 2 en 1 in het $xy$-vlak, verticale beschrijvenden.

- id: h2-omwenteling
  soort: kort
  opgave: |-
    Omwentelingsoppervlakken om de $z$-as.
  lijst: enumerate
  delen:
    - opgave: |-
        Wentel het lijnstuk $z = 3 - y$ ($0 \leqslant y \leqslant 3$) om de $z$-as. Geef een vergelijking en beschrijf het oppervlak.
      antwoord: |-
        $z=3-\sqrt{x^2+y^2}$: een kegelmantel met top $(0,0,3)$
      uitwerking: |-
        Vervang $y$ door $\sqrt{x^2+y^2}$. De grondcirkel heeft straal 3 in het $xy$-vlak.
    - opgave: |-
        Toon aan dat $z = \dfrac{1}{x^2 + y^2}$ een omwentelingsoppervlak is, en geef het profiel.
      antwoord: |-
        profiel $z=\dfrac1{y^2}$ ($y>0$)
      uitwerking: |-
        $x$ en $y$ komen alleen voor als $x^2+y^2$. Vervang $\sqrt{x^2+y^2}$ door $y$: $z=\tfrac1{y^2}$.
    - opgave: |-
        Is $x^2 + y^2 - z^2 = 1$ een omwentelingsoppervlak? Welk profiel?
      antwoord: |-
        ja: de hyperbool $y^2-z^2=1$
      uitwerking: |-
        Met $\sqrt{x^2+y^2}=y$: $y^2-z^2=1$, de tak met $y>0$. In hoofdstuk 3 heet dit oppervlak een hyperboloïde.

- id: h2-bol
  soort: kort
  opgave: |-
    Neem een bol met middelpunt $O$ en straal $R$, met lengte en breedte zoals in de stelling.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke punten horen bij breedte $0^\circ$ en lengte $90^\circ$, en bij breedte $90^\circ$?
      antwoord: |-
        $(0,R,0)$; $(0,0,R)$
      uitwerking: |-
        $\cos0=1$, $\cos90^\circ=0$ en $\sin90^\circ=1$. Bij breedte $90^\circ$ is $\cos\varphi=0$, voor elke lengte: de noordpool.
    - opgave: |-
        Bepaal de breedte en de lengte van het punt $(0, -3, 3\sqrt3)$ van de bol met straal 6.
      antwoord: |-
        $60^\circ$ N en $90^\circ$ W
      uitwerking: |-
        $6\sin\varphi=3\sqrt3$ geeft $\varphi=60^\circ$. Dan is $6\cos\varphi=3$, dus $\cos\lambda=0$ en $\sin\lambda=-1$: $\lambda=-90^\circ$.

- id: h2-param
  soort: kort
  opgave: |-
    Parametervoorstellingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een parametervoorstelling van het oppervlak dat ontstaat als je de parabool $z = y^2$ ($y \geqslant 0$) om de $z$-as wentelt.
      antwoord: |-
        $x=v\cos u$, $y=v\sin u$, $z=v^2$
      uitwerking: |-
        Het profiel is $y=v$, $z=v^2$ met $v\geqslant0$. Draai het rond met $u\in[0,2\pi[$.
    - opgave: |-
        Zoek een cartesiaanse vergelijking van $x = v\cos u$, $y = v\sin u$, $z = 2v$ ($v \geqslant 0$).
      antwoord: |-
        $z=2\sqrt{x^2+y^2}$
      uitwerking: |-
        $x^2+y^2=v^2$, dus $v=\sqrt{x^2+y^2}$ en $z=2v$. Een halve kegel.
    - opgave: |-
        Zoek een cartesiaanse vergelijking van $x = \cos u$, $y = 2\sin u$, $z = v$.
      antwoord: |-
        $x^2+\dfrac{y^2}{4}=1$
      uitwerking: |-
        $x^2+\bigl(\tfrac y2\bigr)^2=\cos^2u+\sin^2u=1$, en $z$ is vrij: een elliptische cilinder.

- id: h2-kromme
  soort: kort
  opgave: |-
    Toon aan dat de kromme $x = \cos t$, $y = \sin t$, $z = \cos 2t$ op de cilinder $x^2 + y^2 = 1$ en op het oppervlak $z = x^2 - y^2$ ligt.
  antwoord: |-
    $\cos^2t+\sin^2t=1$ en $\cos^2t-\sin^2t=\cos2t$
  uitwerking: |-
    De eerste is de grondformule, de tweede de verdubbelingsformule voor de cosinus. De kromme is dus de snijlijn van een cilinder en een zadel: ze gaat twee keer op en neer per toer.

- id: h2-kubisch
  soort: kort
  opgave: |-
    Bepaal de snijpunten van de kubische schroeflijn $(t, t^2, t^3)$ met het vlak.
  lijst: enumerate
  delen:
    - opgave: |-
        $x + y + z = 3$
      antwoord: |-
        alleen $(1,1,1)$
      uitwerking: |-
        $t^3+t^2+t-3=(t-1)(t^2+2t+3)=0$, en $t^2+2t+3$ heeft discriminant $-8<0$.
    - opgave: |-
        $x + 2y - z = 2$
      antwoord: |-
        $(1,1,1)$, $(-1,1,-1)$, $(2,4,8)$
      uitwerking: |-
        $t+2t^2-t^3=2$, of $t^3-2t^2-t+2=(t-1)(t+1)(t-2)=0$.

- id: h2-schroef
  soort: kort
  opgave: |-
    De draad van een veer is een schroeflijn met straal 1 cm. De veer is 12 cm lang en telt 20 windingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een parametervoorstelling.
      antwoord: |-
        $\bigl(\cos t,\sin t,\tfrac{0{,}6}{2\pi}t\bigr)$, $t\in[0,40\pi]$
      uitwerking: |-
        De spoed is $\tfrac{12}{20}=0{,}6$ cm, dus $c=\tfrac{0{,}6}{2\pi}\approx0{,}0955$. Twintig windingen: $t$ van 0 tot $40\pi$.
    - opgave: |-
        Hoe lang is de draad?
      antwoord: |-
        ongeveer 126 cm
      uitwerking: |-
        $20\sqrt{(2\pi)^2+0{,}6^2}\approx20\cdot6{,}312\approx126{,}2$ cm.

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    oppervlak herkennen
  opgave: |-
    Welk oppervlak stelt de vergelijking in de ruimte voor?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 + y^2 = 9$
      antwoord: |-
        cilinder rond de $z$-as
      uitwerking: |-
        Geen $z$: verticale beschrijvenden door de cirkel met straal 3.
    - opgave: |-
        $z = \sqrt{x^2 + y^2}$
      antwoord: |-
        halve kegel
      uitwerking: |-
        Omwentelingsoppervlak van $z=y$: een kegel met top $O$, naar boven open.
    - opgave: |-
        $x^2 + y^2 + z^2 = 9$
      antwoord: |-
        bol
      uitwerking: |-
        Middelpunt $O$, straal 3.
    - opgave: |-
        $z = 5$
      antwoord: |-
        horizontaal vlak
      uitwerking: |-
        Alle punten op hoogte 5.
    - opgave: |-
        $x^2 + z^2 = 9$
      antwoord: |-
        cilinder rond de $y$-as
      uitwerking: |-
        Geen $y$: beschrijvenden evenwijdig met de $y$-as.
    - opgave: |-
        $y = z^2$
      antwoord: |-
        paraboolcilinder
      uitwerking: |-
        Geen $x$: de parabool $y=z^2$ in het $yz$-vlak, met beschrijvenden evenwijdig met de $x$-as.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    niveaukrommen
  opgave: |-
    Welke niveaukrommen heeft het oppervlak? Teken er een paar in het $xy$-vlak.
  lijst: enumerate
  delen:
    - opgave: |-
        $z = 2x - y + 1$
      antwoord: |-
        evenwijdige rechten $2x-y=c-1$: een vlak
      uitwerking: |-
        Alle niveaukrommen hebben richtingscoëfficiënt 2 en liggen even ver uit elkaar als $c$ gelijke stappen zet.
    - opgave: |-
        $z = x^2 + y^2 - 4x$
      antwoord: |-
        cirkels met middelpunt $(2,0)$ en straal $\sqrt{c+4}$
      uitwerking: |-
        $(x-2)^2+y^2=c+4$, voor $c\geqslant-4$. Een kom met de laagste plaats in $(2,0,-4)$.
    - opgave: |-
        $z = xy$
      antwoord: |-
        hyperbolen $xy=c$, en de assen voor $c=0$
      uitwerking: |-
        Voor $c\neq0$ gelijkzijdige hyperbolen, in het eerste en derde kwadrant als $c>0$, in het tweede en vierde als $c<0$. Voor $c=0$: $x=0$ of $y=0$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    helicoïde
  opgave: |-
    Ligt het punt op de helicoïde $x = u\cos v$, $y = u\sin v$, $z = v$? Geef zo ja de parameters.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\bigl(0, 2, \tfrac\pi2\bigr)$
      antwoord: |-
        ja: $u=2$, $v=\tfrac\pi2$
      uitwerking: |-
        $v=z=\tfrac\pi2$, dan $x=u\cdot0=0$ en $y=u=2$.
    - opgave: |-
        $(-3, 0, \pi)$
      antwoord: |-
        ja: $u=3$, $v=\pi$
      uitwerking: |-
        $v=\pi$: $x=-u=-3$ en $y=0$.
    - opgave: |-
        $(1, 1, 0)$
      antwoord: |-
        nee
      uitwerking: |-
        $v=0$ geeft $y=u\sin0=0\neq1$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    parametervoorstelling van een cilinder
  opgave: |-
    Geef een parametervoorstelling.
  lijst: enumerate
  delen:
    - opgave: |-
        de cilinder $x^2 + y^2 = 9$
      antwoord: |-
        $(3\cos u,3\sin u,v)$
      uitwerking: |-
        De cirkel met straal 3, en $z=v$ vrij.
    - opgave: |-
        de cilinder $y^2 + z^2 = 1$
      antwoord: |-
        $(v,\cos u,\sin u)$
      uitwerking: |-
        Nu is $x$ vrij.
    - opgave: |-
        de elliptische cilinder $\dfrac{x^2}{4} + \dfrac{y^2}{9} = 1$
      antwoord: |-
        $(2\cos u,3\sin u,v)$
      uitwerking: |-
        $\bigl(\tfrac x2\bigr)^2+\bigl(\tfrac y3\bigr)^2=\cos^2u+\sin^2u=1$, zoals bij de ellips in Kegelsneden.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    redeneren
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Een vergelijking in $x$ en $y$ zonder $z$ stelt in de ruimte een cilinder voor.
      antwoord: |-
        waar
      uitwerking: |-
        Waar, met verticale beschrijvenden; de richtkromme mag ook een rechte zijn (dan is het een vlak).
    - opgave: |-
        De vergelijking $x^2 + y^2 = 0$ stelt in de ruimte de $z$-as voor.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $x=y=0$ en $z$ is vrij. De richtkromme is één punt.
    - opgave: |-
        Een oppervlak heeft maar één parametervoorstelling.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $(2\cos u,2\sin u,v)$ en $(2\cos 2u,2\sin 2u,v^3)$ geven allebei de cilinder $x^2+y^2=4$.
    - opgave: |-
        Het oppervlak $z = x^2 + y^2$ is een omwentelingsoppervlak om de $x$-as.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: om de $z$-as. Om de $x$-as zouden $y$ en $z$ alleen als $y^2+z^2$ voorkomen.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    schroeflijn snijden
  opgave: |-
    Neem de schroeflijn $(\cos t, \sin t, t)$. Bepaal de gemeenschappelijke punten met
  lijst: enumerate
  delen:
    - opgave: |-
        het vlak $z = 2\pi$
      antwoord: |-
        $(1,0,2\pi)$
      uitwerking: |-
        $t=2\pi$.
    - opgave: |-
        het vlak $y = 0$
      antwoord: |-
        oneindig veel: $\bigl((-1)^k,0,k\pi\bigr)$ met $k\in\mathbb Z$
      uitwerking: |-
        $\sin t=0$ geeft $t=k\pi$.
    - opgave: |-
        de bol $x^2 + y^2 + z^2 = 5$
      antwoord: |-
        $(\cos2,\sin2,2)$ en $(\cos2,-\sin2,-2)$
      uitwerking: |-
        $1+t^2=5$ geeft $t=\pm2$. Met $\cos(-2)=\cos2$ en $\sin(-2)=-\sin2$.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    omwentelingsoppervlak herkennen
  opgave: |-
    Toon aan dat het een omwentelingsoppervlak om de $z$-as is, geef het profiel in het $yz$-vlak en beschrijf de vorm.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + y^2 = (z - 1)^2$
      antwoord: |-
        profiel $y=|z-1|$: een dubbelkegel met top $(0,0,1)$
      uitwerking: |-
        $\sqrt{x^2+y^2}=|z-1|$: twee halve rechten vanuit $(0,0,1)$, gewenteld.
    - opgave: |-
        $z = \e^{-(x^2 + y^2)}$
      antwoord: |-
        profiel $z=\e^{-y^2}$: een klok
      uitwerking: |-
        Het profiel is de klokvormige grafiek die je kent van de normale verdeling. Het hoogste punt is $(0,0,1)$.
    - opgave: |-
        $z = \ln(x^2 + y^2)$
      antwoord: |-
        profiel $z=2\ln y$: een trechter
      uitwerking: |-
        $\ln(y^2)=2\ln y$ voor $y>0$. Bij de $z$-as gaat het oppervlak naar $-\infty$.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    torus
  opgave: |-
    Een torus ontstaat als je de cirkel met middelpunt $(0, R, 0)$ en straal $a$ (met $0 < a < R$) in het $yz$-vlak om de $z$-as wentelt.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking en een parametervoorstelling.
      antwoord: |-
        $\bigl(\sqrt{x^2+y^2}-R\bigr)^2+z^2=a^2$; $\bigl((R+a\cos v)\cos u,(R+a\cos v)\sin u,a\sin v\bigr)$
      uitwerking: |-
        Zoals in de voorbeelden met $R=2$ en $a=1$.
    - opgave: |-
        Toon aan dat je de vergelijking zonder wortel kunt schrijven als $(x^2 + y^2 + z^2 + R^2 - a^2)^2 = 4R^2(x^2 + y^2)$. Van welke graad is ze?
      antwoord: |-
        graad 4
      uitwerking: |-
        Werk uit: $x^2+y^2+z^2+R^2-a^2=2R\sqrt{x^2+y^2}$. Kwadrateer. Omdat de linkerkant hier positief is ($\sqrt{x^2+y^2}\geqslant R-a>0$), verandert kwadrateren niets. Een torus is dus geen kwadriek.
    - opgave: |-
        Waar snijdt de torus met $R = 3$ en $a = 1$ de $x$-as? En de $z$-as?
      antwoord: |-
        in $(\pm2,0,0)$ en $(\pm4,0,0)$; de $z$-as niet
      uitwerking: |-
        $(|x|-3)^2=1$ geeft $|x|=2$ of $|x|=4$. Op de $z$-as is $(0-3)^2+z^2=9+z^2>1$.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    helicoïde in een context
  opgave: |-
    De oprit van een parkeergarage draait rond een open schacht. De rijbaan begint op 4 m van de as en eindigt op 10 m, en stijgt 3 m per volle draai.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe steil is de rijbaan aan de binnenrand en aan de buitenrand, in graden?
      antwoord: |-
        $6{,}8^\circ$ en $2{,}7^\circ$
      uitwerking: |-
        $\tan\alpha=\dfrac{3}{2\pi\cdot4}\approx0{,}119$ en $\dfrac{3}{2\pi\cdot10}\approx0{,}048$.
    - opgave: |-
        Hoe lang is de weg per draai langs de middellijn, op 7 m van de as?
      antwoord: |-
        ongeveer 44,1 m
      uitwerking: |-
        $\sqrt{(14\pi)^2+9}\approx44{,}08$ m.
    - opgave: |-
        Een helling mag hoogstens 15~\% zijn. Hoe dicht bij de as mag de binnenrand dan liggen?
      antwoord: |-
        op ongeveer 3,2 m
      uitwerking: |-
        $\dfrac{3}{2\pi R}\leqslant0{,}15$ geeft $R\geqslant\dfrac{3}{0{,}3\pi}\approx3{,}18$ m.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    vlakke of scheve kromme
  opgave: |-
    Ligt de kromme in een vlak? Zo ja, welk vlak, en welke kromme is het?
  lijst: enumerate
  delen:
    - opgave: |-
        $x = t$, $y = t$, $z = t^2$
      antwoord: |-
        ja, in $x=y$: een parabool
      uitwerking: |-
        Elk punt voldoet aan $x-y=0$. In dat vlak is $z$ het kwadraat van $x$.
    - opgave: |-
        $x = \cos t$, $y = \sin t$, $z = \cos t$
      antwoord: |-
        ja, in $z=x$: een ellips
      uitwerking: |-
        $z-x=0$. Het is de doorsnede van de cilinder $x^2+y^2=1$ met een schuin vlak: een ellips.
    - opgave: |-
        $x = t$, $y = t^2$, $z = t^4$
      antwoord: |-
        nee
      uitwerking: |-
        Een vlak $ax+by+cz=d$ geeft $ct^4+bt^2+at-d=0$, met hoogstens vier oplossingen tenzij $a=b=c=0$. Een vlak bevat dus hoogstens vier punten van de kromme.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    kubische schroeflijn
  opgave: |-
    Neem de kubische schroeflijn $(t, t^2, t^3)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Het vlak door de punten met $t = 0$, $t = 1$ en $t = 2$ geeft een veelterm met die drie nulwaarden. Bepaal zo het vlak.
      antwoord: |-
        $2x-3y+z=0$
      uitwerking: |-
        $t(t-1)(t-2)=t^3-3t^2+2t$, dus $c=1$, $b=-3$, $a=2$ en $d=0$. Controle: $(1,1,1)$ en $(2,4,8)$ voldoen.
    - opgave: |-
        Toon aan dat het punt met $t = 3$ niet in dat vlak ligt, zoals de stelling voorspelt.
      antwoord: |-
        $6-27+27=6\neq0$
      uitwerking: |-
        $(3,9,27)$ invullen geeft 6.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    lengte en breedte in een context
  opgave: |-
    Neem voor de aarde een bol met straal 6371 km.
  lijst: enumerate
  delen:
    - opgave: |-
        Quito ligt op de evenaar op $78{,}5^\circ$ W, Kampala bijna op de evenaar op $32{,}6^\circ$ O. Hoe ver liggen ze langs de evenaar van elkaar?
      antwoord: |-
        ongeveer 12\,354 km
      uitwerking: |-
        Het lengteverschil is $111{,}1^\circ$: $6371\cdot111{,}1\cdot\tfrac{\pi}{180}\approx12\,354$ km.
    - opgave: |-
        Twee plaatsen op $60^\circ$ N hebben een lengteverschil van $180^\circ$. Hoe ver is het langs de breedtecirkel, en hoe ver over de noordpool?
      antwoord: |-
        ongeveer 10\,008 km en 6672 km
      uitwerking: |-
        De breedtecirkel heeft straal $6371\cos60^\circ=3185{,}5$, de halve cirkel is $\pi\cdot3185{,}5\approx10\,008$ km. Over de pool loop je over een meridiaan: twee keer $30^\circ$, dus $6371\cdot\tfrac\pi3\approx6672$ km. Een breedtecirkel is geen kortste weg.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    van parametervoorstelling naar vergelijking
  opgave: |-
    Zoek een cartesiaanse vergelijking.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = u + v$, $y = u - v$, $z = uv$
      antwoord: |-
        $z=\dfrac{x^2-y^2}{4}$
      uitwerking: |-
        $x^2-y^2=(x+y)(x-y)=2u\cdot2v=4uv$.
    - opgave: |-
        $x = u\cos v$, $y = u\sin v$, $z = u^2$
      antwoord: |-
        $z=x^2+y^2$
      uitwerking: |-
        $x^2+y^2=u^2$.
    - opgave: |-
        $x = 2\cos u\cos v$, $y = 2\cos u\sin v$, $z = 3\sin u$
      antwoord: |-
        $\dfrac{x^2+y^2}{4}+\dfrac{z^2}{9}=1$
      uitwerking: |-
        $\dfrac{x^2+y^2}{4}=\cos^2u$ en $\dfrac{z^2}{9}=\sin^2u$. Een afgeplatte bol: een ellipsoïde (hoofdstuk 3).

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    snijkromme van twee oppervlakken
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[zicht=.75,font=\scriptsize]
        \cirkelzicht[accent!50]{.75}{0}{0}{0}{1}
        \draw[accent!50] ([xshift=-.75cm]0,0,0) -- ([xshift=-.75cm]0,0,4) ([xshift=.75cm]0,0,0) -- ([xshift=.75cm]0,0,4);
        \fill[accent!15,opacity=.6] (1.15,-1.15,2) -- (1.15,1.15,-.3) -- (-1.15,1.15,2) -- (-1.15,-1.15,4.3) -- cycle;
        \draw[accent,very thick] plot[domain=0:360,samples=60,smooth,variable=\t] ({cos(\t)},{sin(\t)},{2-cos(\t)-sin(\t)});
      \end{tikzpicture}
  opgave: |-
    Een dak is het vlak $z = 2 - x - y$, en het staat op een cilindervormige muur $x^2 + y^2 = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een parametervoorstelling van de snijkromme.
      antwoord: |-
        $(\cos t,\sin t,2-\cos t-\sin t)$
      uitwerking: |-
        Op de cilinder is $x=\cos t$ en $y=\sin t$; het vlak geeft dan $z$.
    - opgave: |-
        Bepaal het hoogste en het laagste punt van die kromme.
      antwoord: |-
        hoogste $\bigl(-\tfrac{\sqrt2}2,-\tfrac{\sqrt2}2,2+\sqrt2\bigr)$, laagste $\bigl(\tfrac{\sqrt2}2,\tfrac{\sqrt2}2,2-\sqrt2\bigr)$
      uitwerking: |-
        $z'(t)=\sin t-\cos t=0$ geeft $t=\tfrac\pi4$ of $t=\tfrac{5\pi}4$. Daar is $z=2-\sqrt2$ en $z=2+\sqrt2$.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    schroeflijn in een context
  opgave: |-
    Een streng van het DNA is ongeveer een schroeflijn met straal 1 nm en spoed 3,4 nm (1 nm = $10^{-9}$ m). Een winding telt 10 baseparen.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is één winding van de streng?
      antwoord: |-
        ongeveer 7,1 nm
      uitwerking: |-
        $\sqrt{(2\pi)^2+3{,}4^2}\approx7{,}14$ nm.
    - opgave: |-
        Chromosoom 1 telt ongeveer 249 miljoen baseparen. Hoe lang is de as van de schroeflijn, en hoe lang de streng zelf?
      antwoord: |-
        ongeveer 8,5 cm en 17,8 cm
      uitwerking: |-
        24,9 miljoen windingen: de as $24{,}9\cdot10^6\cdot3{,}4$ nm $\approx8{,}5$ cm, de streng $24{,}9\cdot10^6\cdot7{,}14$ nm $\approx17{,}8$ cm. In een cel is ze nog veel verder opgerold.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    helicoïde en schroeflijnen
  opgave: |-
    Neem de helicoïde $x = u\cos v$, $y = u\sin v$, $z = cv$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de parameterlijn met $u = 2$ een schroeflijn is. Wat zijn haar straal en spoed?
      antwoord: |-
        straal 2, spoed $2\pi c$
      uitwerking: |-
        $(2\cos v,2\sin v,cv)$: de schroeflijn met $R=2$ en dezelfde $c$.
    - opgave: |-
        Toon aan dat de hellingshoek van de parameterlijn met $u \neq 0$ voldoet aan $\tan\alpha = \dfrac{c}{|u|}$. Wat betekent dat voor de helicoïde?
      antwoord: |-
        hoe dichter bij de as, hoe steiler
      uitwerking: |-
        $\tan\alpha=\dfrac{2\pi c}{2\pi|u|}$. Bij de as ($u\to0$) wordt de helling verticaal: daar is de helicoïde het steilst.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    omwentelingsoppervlak in een context
  figuur:
    opties: |-
      2.2cm
    code: |-
      \begin{tikzpicture}[zicht=.6,font=\scriptsize]
        \beeld{vaas.png}{-.860}{-1.252}{1.720}
      \end{tikzpicture}
  opgave: |-
    Een pottenbakker draait een vaas. Het profiel ligt op afstand $\rho = 1 + 0{,}35\sin(1{,}6z)$ van de as, voor $z$ van $-1{,}8$ tot $1{,}8$ (in dm).
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een parametervoorstelling van de vaas.
      antwoord: |-
        $\bigl((1+0{,}35\sin1{,}6v)\cos u,(1+0{,}35\sin1{,}6v)\sin u,v\bigr)$
      uitwerking: |-
        Het profiel is $y=1+0{,}35\sin(1{,}6v)$, $z=v$.
    - opgave: |-
        Geef een cartesiaanse vergelijking.
      antwoord: |-
        $\sqrt{x^2+y^2}=1+0{,}35\sin(1{,}6z)$
      uitwerking: |-
        De afstand tot de as is $\sqrt{x^2+y^2}$.
    - opgave: |-
        Op welke hoogte is de vaas het breedst, en waar het smalst? Hoe breed is ze daar?
      antwoord: |-
        breedst op $z\approx0{,}98$ (2,7 dm), smalst op $z\approx-0{,}98$ (1,3 dm)
      uitwerking: |-
        $\sin(1{,}6z)=1$ voor $1{,}6z=\tfrac\pi2$: $z\approx0{,}98$, $\rho=1{,}35$. $\sin(1{,}6z)=-1$ voor $z\approx-0{,}98$, $\rho=0{,}65$. De breedte is $2\rho$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    doorsneden van een torus
  opgave: |-
    Bepaal de doorsnede van de torus $\bigl(\sqrt{x^2 + y^2} - 2\bigr)^2 + z^2 = 1$ met het vlak.
  lijst: enumerate
  delen:
    - opgave: |-
        $z = 0$
      antwoord: |-
        twee cirkels rond $O$ met straal 1 en 3
      uitwerking: |-
        $\bigl(\sqrt{x^2+y^2}-2\bigr)^2=1$ geeft $\sqrt{x^2+y^2}=1$ of $3$.
    - opgave: |-
        $y = 0$
      antwoord: |-
        twee cirkels $(x\pm2)^2+z^2=1$
      uitwerking: |-
        $(|x|-2)^2+z^2=1$: de twee doorsneden van de buis.
    - opgave: |-
        $z = 1$
      antwoord: |-
        één cirkel met straal 2
      uitwerking: |-
        $\bigl(\sqrt{x^2+y^2}-2\bigr)^2=0$: de bovenkant van de buis.
    - opgave: |-
        $z = 2$
      antwoord: |-
        leeg
      uitwerking: |-
        $\bigl(\sqrt{x^2+y^2}-2\bigr)^2=-3$ kan niet.

- id: h2-o19
  soort: opdracht
  niveau: 2
  thema: |-
    uitrollen, in een context
  opgave: |-
    Een kegelvormig feesthoedje heeft een grondcirkel met straal 5 cm en een hoogte van 12 cm. Je knipt de mantel open langs een rechte van de top naar de rand, en legt hem plat.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de platte mantel een cirkelsector met straal 13 cm is.
      antwoord: |-
        de beschrijvenden zijn 13 cm lang
      uitwerking: |-
        Elk punt van de rand ligt op $\sqrt{5^2+12^2}=13$ cm van de top, en uitrollen verandert lengtes niet.
    - opgave: |-
        Hoe groot is de middelpuntshoek van die sector, in graden?
      antwoord: |-
        ongeveer $138{,}5^\circ$
      uitwerking: |-
        De boog is de omtrek van de grondcirkel, $10\pi$. De hele cirkel met straal 13 heeft omtrek $26\pi$: de hoek is $\tfrac{10}{26}\cdot360^\circ\approx138{,}5^\circ$.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    kubische schroeflijn, bewijs
  opgave: |-
    Neem de kubische schroeflijn $(t, t^2, t^3)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat geen drie punten van de kromme op één rechte liggen.
      antwoord: |-
        anders lagen vier punten in één vlak
      uitwerking: |-
        Liggen drie punten op een rechte $l$, neem dan een vierde punt van de kromme. Er is een vlak door $l$ en dat punt, en dat bevat vier punten van de kromme. Dat kan niet volgens de stelling.
    - opgave: |-
        Toon aan dat de projectie op het $yz$-vlak de kromme $z^2 = y^3$ is. Teken ze. Wat gebeurt er in de oorsprong?
      antwoord: |-
        $z^2=t^6=y^3$; een punt (keerpunt) in $O$
      uitwerking: |-
        De projectie is $(t^2,t^3)$. Voor $t$ en $-t$ is $y$ gelijk en $z$ tegengesteld: de kromme is symmetrisch om de $y$-as en komt in $O$ samen in een scherpe punt.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    kromme van Viviani
  opgave: |-
    Neem de kromme van Viviani $x = 1 + \cos t$, $y = \sin t$, $z = 2\sin\tfrac t2$ met $t \in [0, 4\pi]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat ze ook op de paraboolcilinder $z^2 = 4 - 2x$ ligt. Welke kromme is haar projectie op het $xz$-vlak?
      antwoord: |-
        $z^2=4\sin^2\tfrac t2=2(1-\cos t)=4-2x$; een stuk van een parabool
      uitwerking: |-
        Met $2\sin^2\tfrac t2=1-\cos t$. De projectie $(x,z)$ ligt op de parabool $z^2=4-2x$, voor $0\leqslant x\leqslant2$.
    - opgave: |-
        Toon aan dat de kromme zichzelf snijdt in $(2, 0, 0)$.
      antwoord: |-
        $t=0$ en $t=2\pi$ geven hetzelfde punt
      uitwerking: |-
        $t=0$ geeft $(2,0,0)$, en $t=2\pi$ geeft $(2,0,2\sin\pi)=(2,0,0)$. Het hoogste en laagste punt zijn $(0,0,\pm2)$, voor $t=\pi$ en $t=3\pi$.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    schroeflijn en vlak
  opgave: |-
    Neem de schroeflijn $(\cos t, \sin t, t)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het vlak $z = x$ de schroeflijn in precies één punt snijdt, en benader dat punt.
      antwoord: |-
        $t=\cos t$, $t\approx0{,}739$: $(0{,}739;\ 0{,}674;\ 0{,}739)$
      uitwerking: |-
        $g(t)=t-\cos t$ heeft afgeleide $1+\sin t\geqslant0$, nul in geïsoleerde punten: $g$ is strikt stijgend en heeft hoogstens één nulwaarde. $g(0)<0<g(1)$, dus er is er één, $t\approx0{,}739$.
    - opgave: |-
        De schroeflijn snijdt het vlak $y = 0$ in oneindig veel punten. Waarom kan ze dan geen kromme van een vaste graad zijn, zoals de kubische schroeflijn?
      antwoord: |-
        een vlak snijdt een kromme van graad $n$ hoogstens $n$ keer
      uitwerking: |-
        Zou de schroeflijn een parametervoorstelling met veeltermen van graad hoogstens $n$ hebben, dan gaf een vlak een veeltermvergelijking met hoogstens $n$ oplossingen. Hier zijn er oneindig veel, en het vlak bevat de kromme niet.

- id: h2-o23
  soort: opdracht
  niveau: 3
  thema: |-
    raakvector van een schroeflijn
  opgave: |-
    De raakvector van een kromme $(x(t), y(t), z(t))$ in het punt met parameter $t$ is de vector met coördinaten $x'(t)$, $y'(t)$ en $z'(t)$: de snelheid van het bewegende punt.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de raakvector van de schroeflijn $(R\cos t, R\sin t, ct)$ en zijn norm.
      antwoord: |-
        $(-R\sin t,R\cos t,c)$, norm $\sqrt{R^2+c^2}$
      uitwerking: |-
        Afleiden per coördinaat. De norm hangt niet af van $t$: het punt beweegt met constante snelheid.
    - opgave: |-
        Toon aan dat de raakvector overal dezelfde hoek maakt met de $z$-as, en vergelijk met de hoek $\alpha$ uit de stelling.
      antwoord: |-
        $\cos\theta=\dfrac{c}{\sqrt{R^2+c^2}}$; $\theta=90^\circ-\alpha$
      uitwerking: |-
        Met $\vec e_z=(0,0,1)$: $\cos\theta=\dfrac{c}{\sqrt{R^2+c^2}}$, constant. De hoek met het horizontale vlak is $\alpha=90^\circ-\theta$, met $\tan\alpha=\dfrac cR=\dfrac{2\pi c}{2\pi R}=\dfrac{h}{2\pi R}$.

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Integralen
  opgave: |-
    In Integralen bereken je de lengte van een grafiek. Voor een ruimtekromme $(x(t), y(t), z(t))$ met $t \in [a, b]$ geldt op dezelfde manier \[L = \int_a^b \sqrt{x'(t)^2 + y'(t)^2 + z'(t)^2}\,\mathrm{d}t .\]
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken zo de lengte van één winding van de schroeflijn $(R\cos t, R\sin t, ct)$, en vergelijk met de stelling.
      antwoord: |-
        $2\pi\sqrt{R^2+c^2}$
      uitwerking: |-
        De integrand is $\sqrt{R^2\sin^2t+R^2\cos^2t+c^2}=\sqrt{R^2+c^2}$, constant. Over $[0,2\pi]$: $2\pi\sqrt{R^2+c^2}=\sqrt{(2\pi R)^2+(2\pi c)^2}$, met $h=2\pi c$.
    - opgave: |-
        Bereken de lengte van de kromme $\bigl(t, t^2, \tfrac23 t^3\bigr)$ van $t = 0$ tot $t = 1$.
      antwoord: |-
        $\tfrac53$
      uitwerking: |-
        $1+4t^2+4t^4=(1+2t^2)^2$, dus $L=\displaystyle\int_0^1(1+2t^2)\,\mathrm dt=1+\tfrac23=\tfrac53$.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Integralen
  opgave: |-
    De torus $\bigl(\sqrt{x^2 + y^2} - 2\bigr)^2 + z^2 = 1$ omsluit een lichaam: een donut.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de horizontale doorsnede op hoogte $z$ (met $|z| \leqslant 1$) een ring is tussen cirkels met straal $2 - \sqrt{1 - z^2}$ en $2 + \sqrt{1 - z^2}$, met oppervlakte $8\pi\sqrt{1 - z^2}$.
      antwoord: |-
        $\pi\bigl((2+w)^2-(2-w)^2\bigr)=8\pi w$ met $w=\sqrt{1-z^2}$
      uitwerking: |-
        $\sqrt{x^2+y^2}=2\pm\sqrt{1-z^2}$. De oppervlakte van de ring is het verschil van twee schijven.
    - opgave: |-
        Bereken het volume met de methode van de doorsneden.
      antwoord: |-
        $4\pi^2\approx39{,}5$
      uitwerking: |-
        $V=\displaystyle\int_{-1}^{1}8\pi\sqrt{1-z^2}\,\mathrm dz=8\pi\cdot\tfrac\pi2=4\pi^2$: de integraal is de oppervlakte van een halve schijf met straal 1. Dat is $2\pi R\cdot\pi a^2$, de omtrek van de middelste cirkel maal de doorsnede van de buis.

- id: h2-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    Schrijf de eerste twee coördinaten van een punt als één complex getal $w = x + y\,\mathrm i$. Een draaiing om de $z$-as over een hoek $\alpha$ is dan een vermenigvuldiging van $w$ met $\cos\alpha + \mathrm i\sin\alpha$.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit waarom een omwentelingsoppervlak $F\bigl(|w|, z\bigr) = 0$ niet verandert bij zo'n draaiing.
      antwoord: |-
        $|w(\cos\alpha+\mathrm i\sin\alpha)|=|w|$
      uitwerking: |-
        De modulus van een product is het product van de moduli, en $|\cos\alpha+\mathrm i\sin\alpha|=1$. De afstand tot de as $|w|=\sqrt{x^2+y^2}$ blijft dus gelijk, en $z$ ook.
    - opgave: |-
        Toon aan dat de helicoïde $w = u(\cos v + \mathrm i\sin v)$, $z = cv$ niet verandert als je draait over $\alpha$ en tegelijk $c\alpha$ omhoog schuift.
      antwoord: |-
        het punt met $(u,v)$ gaat naar het punt met $(u,v+\alpha)$
      uitwerking: |-
        Na de draaiing is $w=u(\cos(v+\alpha)+\mathrm i\sin(v+\alpha))$, met de formule van De Moivre voor een product, en $z=cv+c\alpha=c(v+\alpha)$: weer een punt van de helicoïde. Zo'n schroefbeweging schuift de schroef in haar moer.

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Beschrijf het oppervlak $z = 9 - x^2 - y^2$ met niveaukrommen en een profiel.
  antwoord: |-
    cirkels met straal $\sqrt{9-c}$; profiel $z=9-y^2$
  uitwerking: |-
    $x^2+y^2=9-c$ voor $c\leqslant9$: cirkels die kleiner worden naar boven. Een omgekeerde kom met top $(0,0,9)$, die het $xy$-vlak snijdt in de cirkel met straal 3.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Welk oppervlak stelt $x^2 + z^2 = 4$ voor in de ruimte?
  antwoord: |-
    een cilinder rond de $y$-as met straal 2
  uitwerking: |-
    Er staat geen $y$ in de vergelijking: beschrijvenden evenwijdig met de $y$-as, door de cirkel $x^2+z^2=4$ in het $xz$-vlak.

- id: h2-t3
  soort: test
  niveau: 2
  opgave: |-
    Geef een vergelijking van het oppervlak dat ontstaat als je de cirkel $(y - 3)^2 + z^2 = 4$ in het $yz$-vlak om de $z$-as wentelt.
  antwoord: |-
    $\bigl(\sqrt{x^2+y^2}-3\bigr)^2+z^2=4$
  uitwerking: |-
    Vervang $y$ door $\sqrt{x^2+y^2}$. Een torus.

- id: h2-t4
  soort: test
  niveau: 2
  opgave: |-
    Zoek een cartesiaanse vergelijking van het oppervlak $x = v\cos u$, $y = v\sin u$, $z = 4 - v^2$.
  antwoord: |-
    $z=4-x^2-y^2$
  uitwerking: |-
    $x^2+y^2=v^2$.

- id: h2-t5
  soort: test
  niveau: 1
  opgave: |-
    Bereken de coördinaten van het punt met breedte $30^\circ$ Z en lengte $60^\circ$ O op de bol met middelpunt $O$ en straal 10.
  antwoord: |-
    $\bigl(\tfrac{5\sqrt3}{2},\tfrac{15}{2},-5\bigr)\approx(4{,}33;\ 7{,}5;\ -5)$
  uitwerking: |-
    $\varphi=-30^\circ$, $\lambda=60^\circ$: $x=10\cdot\tfrac{\sqrt3}2\cdot\tfrac12$, $y=10\cdot\tfrac{\sqrt3}2\cdot\tfrac{\sqrt3}2$, $z=10\cdot\bigl(-\tfrac12\bigr)$.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Bepaal de snijpunten van de kubische schroeflijn $(t, t^2, t^3)$ met het vlak $5x + 2y - z = 6$.
  antwoord: |-
    $(1,1,1)$, $(-2,4,-8)$, $(3,9,27)$
  uitwerking: |-
    $t^3-2t^2-5t+6=0$. $t=1$ is een nulwaarde, Horner geeft $t^2-t-6=(t+2)(t-3)$.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Een schroeflijn heeft straal 2 cm en spoed 5 cm. Hoe lang is één winding, en onder welke hoek stijgt ze?
  antwoord: |-
    ongeveer 13,5 cm; $21{,}7^\circ$
  uitwerking: |-
    $\sqrt{(4\pi)^2+5^2}\approx13{,}52$ cm en $\tan\alpha=\dfrac{5}{4\pi}\approx0{,}398$.
