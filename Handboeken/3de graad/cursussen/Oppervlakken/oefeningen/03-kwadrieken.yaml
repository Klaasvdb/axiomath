# Oefeningen van hoofdstuk 3. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bepaal.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        welke kromme $\dfrac{x^2}{9} + \dfrac{y^2}{4} = 1$ is
      antwoord: |-
        een ellips met halve assen 3 en 2
      uitwerking: |-
        De standaardvorm uit Kegelsneden.
    - opgave: |-
        welke kromme $\dfrac{x^2}{9} - \dfrac{y^2}{4} = 1$ is
      antwoord: |-
        een hyperbool met toppen $(\pm3, 0)$
      uitwerking: |-
        Het minteken staat bij $y$: de toppen liggen op de $x$-as.
    - opgave: |-
        welke punten voldoen aan $x^2 - y^2 = 0$
      antwoord: |-
        de rechten $y=x$ en $y=-x$
      uitwerking: |-
        $(x-y)(x+y)=0$.
    - opgave: |-
        $4x^2 - 8x$ als $4(\ldots)^2$ min een getal
      antwoord: |-
        $4(x-1)^2-4$
      uitwerking: |-
        $4(x^2-2x)=4\bigl((x-1)^2-1\bigr)$.
    - opgave: |-
        het oppervlak als je $\dfrac{y^2}{4} + z^2 = 1$ om de $z$-as wentelt
      antwoord: |-
        $\dfrac{x^2+y^2}{4}+z^2=1$
      uitwerking: |-
        Vervang $y$ door $\sqrt{x^2+y^2}$ (hoofdstuk 2).
    - opgave: |-
        de doorsnede van de kegel $x^2 + y^2 = z^2$ met het vlak $z = 3$
      antwoord: |-
        een cirkel met straal 3
      uitwerking: |-
        $x^2+y^2=9$ op hoogte 3.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem het oppervlak $x^2 + y^2 - z^2 = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de doorsneden met de vlakken $z = 0$, $z = 1$ en $z = 2$.
      antwoord: |-
        cirkels met straal 1, $\sqrt2$ en $\sqrt5$
      uitwerking: |-
        $x^2+y^2=1+k^2$.
    - opgave: |-
        Bepaal de doorsnede met het vlak $x = 0$.
      antwoord: |-
        de hyperbool $y^2-z^2=1$
      uitwerking: |-
        Met toppen $(0, \pm1, 0)$.
    - opgave: |-
        Toon aan dat de rechte $(1, t, t)$ volledig op het oppervlak ligt.
      antwoord: |-
        $1+t^2-t^2=1$
      uitwerking: |-
        Voor elke $t$.
    - opgave: |-
        Het oppervlak is gebogen, en toch ligt er een rechte op. Probeer dat met een tekening te verklaren.
      antwoord: |-
        de rechte raakt de keelcirkel en loopt schuin omhoog
      uitwerking: |-
        De rechte gaat door $(1, 0, 0)$ op de kleinste cirkel. Ze staat loodrecht op de straal naar dat punt en stijgt onder $45^\circ$: hoe hoger, hoe verder van de as, net zoals het oppervlak breder wordt.

- id: h3-ellipsoide
  soort: kort
  opgave: |-
    Neem de ellipsoïde $\dfrac{x^2}{16} + \dfrac{y^2}{4} + \dfrac{z^2}{9} = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar snijdt ze de assen?
      antwoord: |-
        $(\pm4, 0, 0)$, $(0, \pm2, 0)$, $(0, 0, \pm3)$
      uitwerking: |-
        Stel telkens twee coördinaten gelijk aan 0.
    - opgave: |-
        Bepaal de doorsneden met de vlakken $z = 0$ en $z = 2$.
      antwoord: |-
        ellipsen met halve assen 4 en 2, en $\tfrac{4\sqrt5}{3}\approx2{,}98$ en $\tfrac{2\sqrt5}{3}\approx1{,}49$
      uitwerking: |-
        $z=2$: $\dfrac{x^2}{16}+\dfrac{y^2}{4}=1-\dfrac49=\dfrac59$. Deel door $\tfrac59$: halve assen $4\sqrt{\tfrac59}$ en $2\sqrt{\tfrac59}$.

- id: h3-ellpar
  soort: kort
  opgave: |-
    Parametervoorstellingen van ellipsoïden.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een parametervoorstelling van $\dfrac{x^2}{16} + \dfrac{y^2}{4} + \dfrac{z^2}{9} = 1$. Welk punt hoort bij $\varphi = 0$ en $\lambda = \tfrac\pi2$?
      antwoord: |-
        $(4\cos\varphi\cos\lambda, 2\cos\varphi\sin\lambda, 3\sin\varphi)$; $(0, 2, 0)$
      uitwerking: |-
        Met $a=4$, $b=2$, $c=3$. Invullen: $(4\cdot0, 2\cdot1, 0)$.
    - opgave: |-
        Welk oppervlak heeft de parametervoorstelling $(5\cos\varphi\cos\lambda,\ 5\cos\varphi\sin\lambda,\ 2\sin\varphi)$?
      antwoord: |-
        $\dfrac{x^2+y^2}{25}+\dfrac{z^2}{4}=1$
      uitwerking: |-
        Een afgeplatte omwentelingsellipsoïde rond de $z$-as, zoals een schijf.

- id: h3-hyperboloide
  soort: kort
  opgave: |-
    Hyperboloïden.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de keelellips van $\dfrac{x^2}{4} + \dfrac{y^2}{9} - z^2 = 1$ en de doorsnede met $z = 1$.
      antwoord: |-
        halve assen 2 en 3; op hoogte 1 halve assen $2\sqrt2$ en $3\sqrt2$
      uitwerking: |-
        $z=1$: $\dfrac{x^2}{4}+\dfrac{y^2}{9}=2$, of $\dfrac{x^2}{8}+\dfrac{y^2}{18}=1$.
    - opgave: |-
        Welke van de vlakken $z = 0$, $z = 2$ en $z = 4$ snijden $\dfrac{z^2}{4} - x^2 - y^2 = 1$, en volgens welke kromme?
      antwoord: |-
        $z=0$ niet; $z=2$ in het punt $(0, 0, 2)$; $z=4$ in een cirkel met straal $\sqrt3$
      uitwerking: |-
        $x^2+y^2=\tfrac{k^2}{4}-1$. Een tweebladige hyperboloïde met toppen $(0, 0, \pm2)$.

- id: h3-paraboloide
  soort: kort
  opgave: |-
    Paraboloïden.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de niveaukromme $z = 4$ van $z = x^2 + 4y^2$.
      antwoord: |-
        de ellips $\dfrac{x^2}{4}+y^2=1$
      uitwerking: |-
        $x^2+4y^2=4$, gedeeld door 4.
    - opgave: |-
        Bepaal de doorsneden van $z = y^2 - x^2$ met de vlakken $x = 0$, $y = 0$ en $z = 0$. Welke kwadriek is het?
      antwoord: |-
        $z=y^2$, $z=-x^2$ en $y=\pm x$; een hyperbolische paraboloïde
      uitwerking: |-
        Een dalparabool, een bergparabool en twee rechten: een zadel, met de rollen van $x$ en $y$ gewisseld ten opzichte van de tabel.
    - opgave: |-
        Welke kwadriek is $z = -x^2 - y^2$?
      antwoord: |-
        een omwentelingsparaboloïde die naar onder opent
      uitwerking: |-
        Het spiegelbeeld van $z=x^2+y^2$ ten opzichte van het $xy$-vlak.

- id: h3-herken
  soort: kort
  opgave: |-
    Welke kwadriek is het? Geef het middelpunt of de top, en de richting van de as.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + y^2 - z^2 - 4x + 2z = 0$
      antwoord: |-
        eenbladige hyperboloïde, middelpunt $(2, 0, 1)$, as evenwijdig met de $z$-as
      uitwerking: |-
        $(x-2)^2+y^2-(z-1)^2=4-1=3$, of $\dfrac{(x-2)^2+y^2}{3}-\dfrac{(z-1)^2}{3}=1$.
    - opgave: |-
        $x^2 + y^2 + 2z^2 - 2y + 4z + 3 = 0$
      antwoord: |-
        één punt: $(0, 1, -1)$
      uitwerking: |-
        $x^2+(y-1)^2+2(z+1)^2=-3+1+2=0$: alleen het punt waar de drie kwadraten nul zijn.
    - opgave: |-
        $z = 2x^2 - y^2 + 4x + 2y$
      antwoord: |-
        hyperbolische paraboloïde, zadelpunt $(-1, 1, -1)$
      uitwerking: |-
        $z=2(x+1)^2-2-(y-1)^2+1$, dus $z+1=2(x+1)^2-(y-1)^2$.

- id: h3-rechten
  soort: kort
  opgave: |-
    Geef de twee rechten op de hyperboloïde $\dfrac{x^2}{4} + y^2 - z^2 = 1$ door het punt $(2, 0, 0)$, en controleer.
  antwoord: |-
    $(2, v, v)$ en $(2, -v, v)$
  uitwerking: |-
    $a=2$, $b=c=1$, en $v=z=0$ geeft $\cos u=1$: $u=0$. Eerste familie: $(2, v, v)$; tweede: $(2, -v, v)$. Controle: $\tfrac44+v^2-v^2=1$.

- id: h3-zadelrechten
  soort: kort
  opgave: |-
    Geef de twee rechten op $z = xy$ door het punt $(-1, 4, -4)$.
  antwoord: |-
    $(-1, t, -t)$ en $(t, 4, 4t)$
  uitwerking: |-
    Het punt ligt op het oppervlak: $-1\cdot4=-4$. Met $x=-1$ vast is $z=-y$, met $y=4$ vast is $z=4x$.

- id: h3-toren
  soort: kort
  opgave: |-
    Een toren in de stijl van Sjoechov heeft ringen met straal 4~m op 0~m en 10~m hoogte, en elke staaf verbindt een punt van de onderste ring met het punt van de bovenste ring dat $90^\circ$ verder ligt.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe smal is de toren in het midden?
      antwoord: |-
        straal $2\sqrt2\approx2{,}83$ m
      uitwerking: |-
        Het midden van een staaf ligt halfweg tussen twee punten die $90^\circ$ uit elkaar liggen: op $4\cos45^\circ=2\sqrt2$ van de as.
    - opgave: |-
        Toon aan dat de staven op de hyperboloïde $\dfrac{x^2 + y^2}{8} - \dfrac{(z - 5)^2}{25} = 1$ liggen (oorsprong onderaan op de as).
      antwoord: |-
        $(4-4s, 4s, 10s)$ voldoet voor elke $s$
      uitwerking: |-
        De staaf van $(4, 0, 0)$ naar $(0, 4, 10)$: $x^2+y^2=16-32s+32s^2$ en $(z-5)^2=100s^2-100s+25$. Dan is $\tfrac{x^2+y^2}{8}-\tfrac{(z-5)^2}{25}=2-4s+4s^2-4s^2+4s-1=1$.

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    kwadriek herkennen
  opgave: |-
    Welke kwadriek is het?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x^2}{4} + \dfrac{y^2}{9} + \dfrac{z^2}{16} = 1$
      antwoord: |-
        ellipsoïde
      uitwerking: |-
        Drie plustekens, rechterlid 1.
    - opgave: |-
        $x^2 + y^2 - z^2 = 1$
      antwoord: |-
        eenbladige hyperboloïde
      uitwerking: |-
        Een omwentelingshyperboloïde rond de $z$-as.
    - opgave: |-
        $x^2 + y^2 - z^2 = -1$
      antwoord: |-
        tweebladige hyperboloïde
      uitwerking: |-
        Rechterlid $-1$: tussen $z=-1$ en $z=1$ ligt niets.
    - opgave: |-
        $x^2 + y^2 - z^2 = 0$
      antwoord: |-
        kegel
      uitwerking: |-
        Rechterlid 0, top in $O$.
    - opgave: |-
        $z = x^2 + 2y^2$
      antwoord: |-
        elliptische paraboloïde
      uitwerking: |-
        $z$ in de eerste graad, twee plustekens.
    - opgave: |-
        $z = y^2 - x^2$
      antwoord: |-
        hyperbolische paraboloïde
      uitwerking: |-
        Een plus- en een minteken: een zadel.
    - opgave: |-
        $x^2 - y^2 = 1$
      antwoord: |-
        hyperbolische cilinder
      uitwerking: |-
        Geen $z$: verticale rechten door een hyperbool.
    - opgave: |-
        $x^2 + 2y^2 = 4$
      antwoord: |-
        elliptische cilinder
      uitwerking: |-
        Geen $z$: verticale rechten door een ellips.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    doorsneden van een ellipsoïde
  opgave: |-
    Bepaal de doorsnede van de ellipsoïde $\dfrac{x^2}{9} + \dfrac{y^2}{4} + z^2 = 1$ met het vlak.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $z = 0$
      antwoord: |-
        ellips, halve assen 3 en 2
      uitwerking: |-
        $\dfrac{x^2}{9}+\dfrac{y^2}{4}=1$.
    - opgave: |-
        $z = 0{,}6$
      antwoord: |-
        ellips, halve assen 2,4 en 1,6
      uitwerking: |-
        Rechterlid $1-0{,}36=0{,}64$, en $\sqrt{0{,}64}=0{,}8$: alles $0{,}8$ keer zo groot.
    - opgave: |-
        $z = 1$
      antwoord: |-
        het punt $(0, 0, 1)$
      uitwerking: |-
        Rechterlid 0.
    - opgave: |-
        $z = 2$
      antwoord: |-
        leeg
      uitwerking: |-
        Rechterlid $1-4<0$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    doorsneden van een hyperboloïde
  opgave: |-
    Bepaal de doorsnede van $\dfrac{x^2 + y^2}{4} - \dfrac{z^2}{9} = 1$ met het vlak.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $z = 0$
      antwoord: |-
        cirkel met straal 2
      uitwerking: |-
        De keelcirkel.
    - opgave: |-
        $z = 3$
      antwoord: |-
        cirkel met straal $2\sqrt2$
      uitwerking: |-
        $x^2+y^2=4\cdot2=8$.
    - opgave: |-
        $x = 0$
      antwoord: |-
        hyperbool $\dfrac{y^2}{4}-\dfrac{z^2}{9}=1$
      uitwerking: |-
        Toppen $(0, \pm2, 0)$.
    - opgave: |-
        $x = 2$
      antwoord: |-
        de rechten $y=\pm\tfrac23z$ door $(2, 0, 0)$
      uitwerking: |-
        $\dfrac{y^2}{4}=\dfrac{z^2}{9}$: een ontaarde kegelsnede. Het vlak raakt de keelcirkel.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    eigenschappen, redeneren
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Elk horizontaal vlak snijdt een tweebladige hyperboloïde $\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} - \dfrac{z^2}{c^2} = -1$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: voor $|k|<c$ is $\tfrac{x^2}{a^2}+\tfrac{y^2}{b^2}=\tfrac{k^2}{c^2}-1<0$.
    - opgave: |-
        Een hyperbolische paraboloïde heeft een hoogste of een laagste punt.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: in het zadelpunt stijgt ze in de ene richting en daalt ze in de andere, en elders stijgt of daalt ze ook verder.
    - opgave: |-
        Een omwentelingsellipsoïde met $a = b = c$ is een bol.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: vermenigvuldig met $a^2$, dan staat er $x^2+y^2+z^2=a^2$.
    - opgave: |-
        Een eenbladige hyperboloïde is een regeloppervlak, een ellipsoïde niet.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: door elk punt van de hyperboloïde gaan twee rechten. Een ellipsoïde is begrensd, en een rechte niet.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    parametervoorstelling
  opgave: |-
    Geef een parametervoorstelling.
  lijst: enumerate
  delen:
    - opgave: |-
        de ellipsoïde $\dfrac{x^2}{4} + \dfrac{y^2}{9} + \dfrac{z^2}{16} = 1$
      antwoord: |-
        $(2\cos\varphi\cos\lambda, 3\cos\varphi\sin\lambda, 4\sin\varphi)$
      uitwerking: |-
        De stelling met $a=2$, $b=3$, $c=4$.
    - opgave: |-
        de paraboloïde $z = x^2 + \dfrac{y^2}{4}$
      antwoord: |-
        $(v\cos u, 2v\sin u, v^2)$
      uitwerking: |-
        $x^2+\tfrac{y^2}{4}=v^2\cos^2u+v^2\sin^2u=v^2=z$.
    - opgave: |-
        de kegel $x^2 + y^2 = 4z^2$
      antwoord: |-
        $(2v\cos u, 2v\sin u, v)$
      uitwerking: |-
        $x^2+y^2=4v^2=4z^2$, met $v\in\R$ voor beide helften.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    omwentelingsellipsoïde
  opgave: |-
    Wentel de ellips $\dfrac{y^2}{9} + \dfrac{z^2}{4} = 1$ in het $yz$-vlak om een as. Geef een vergelijking van het oppervlak, en zeg of het afgeplat is zoals een schijf of langgerekt zoals een sigaar.
  lijst: enumerate
  delen:
    - opgave: |-
        om de $z$-as
      antwoord: |-
        $\dfrac{x^2+y^2}{9}+\dfrac{z^2}{4}=1$, afgeplat
      uitwerking: |-
        De lange as draait rond: twee halve assen 3 en één van 2.
    - opgave: |-
        om de $y$-as
      antwoord: |-
        $\dfrac{y^2}{9}+\dfrac{x^2+z^2}{4}=1$, langgerekt
      uitwerking: |-
        Nu speelt $\sqrt{x^2+z^2}$ de rol van $z$: één halve as 3 en twee van 2.

- id: h3-o7
  soort: opdracht
  niveau: 1
  thema: |-
    doorsneden van een zadel
  opgave: |-
    Bepaal de doorsnede van $z = \dfrac{y^2}{4} - x^2$ met het vlak.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $z = 1$
      antwoord: |-
        hyperbool, toppen $(0, \pm2)$
      uitwerking: |-
        $\dfrac{y^2}{4}-x^2=1$.
    - opgave: |-
        $z = -4$
      antwoord: |-
        hyperbool, toppen $(\pm2, 0)$
      uitwerking: |-
        $x^2-\dfrac{y^2}{4}=4$, of $\dfrac{x^2}{4}-\dfrac{y^2}{16}=1$.
    - opgave: |-
        $z = 0$
      antwoord: |-
        de rechten $y=\pm2x$
      uitwerking: |-
        $y^2=4x^2$.
    - opgave: |-
        $x = 0$
      antwoord: |-
        dalparabool $z=\tfrac{y^2}{4}$
      uitwerking: |-
        Opening naar boven.
    - opgave: |-
        $y = 0$
      antwoord: |-
        bergparabool $z=-x^2$
      uitwerking: |-
        Opening naar onder.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    kwadriek herkennen met afsplitsen
  opgave: |-
    Welke kwadriek is het? Geef het middelpunt, de top of het zadelpunt, en de richting van de as.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + y^2 + 4z^2 - 2x + 4y = 11$
      antwoord: |-
        omwentelingsellipsoïde, middelpunt $(1, -2, 0)$, halve assen 4, 4 en 2, as evenwijdig met de $z$-as
      uitwerking: |-
        $(x-1)^2+(y+2)^2+4z^2=11+1+4=16$, gedeeld door 16: $\dfrac{(x-1)^2+(y+2)^2}{16}+\dfrac{z^2}{4}=1$.
    - opgave: |-
        $x^2 - y^2 + z^2 - 6x + 2y + 8 = 0$
      antwoord: |-
        kegel met top $(3, 1, 0)$, as evenwijdig met de $y$-as
      uitwerking: |-
        $(x-3)^2-9-(y-1)^2+1+z^2+8=0$, dus $(x-3)^2+z^2-(y-1)^2=0$.
    - opgave: |-
        $z = x^2 + y^2 - 4x + 6y$
      antwoord: |-
        omwentelingsparaboloïde, top $(2, -3, -13)$, as evenwijdig met de $z$-as
      uitwerking: |-
        $z=(x-2)^2+(y+3)^2-4-9$, dus $z+13=(x-2)^2+(y+3)^2$.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    ellipsoïde in een context
  opgave: |-
    Neem voor de aarde de omwentelingsellipsoïde met $a = 6378{,}137$~km en $c = 6356{,}752$~km, zoals in voorbeeld~\ref{vb:h3-aarde}.
  lijst: enumerate
  delen:
    - opgave: |-
        De \textit{afplatting} is $\dfrac{a - c}{a}$. Bereken ze, en schrijf ze als $\dfrac1n$.
      antwoord: |-
        $\approx0{,}00335\approx\dfrac{1}{298}$
      uitwerking: |-
        $\dfrac{21{,}385}{6378{,}137}\approx0{,}003353$, en $\dfrac{1}{0{,}003353}\approx298{,}3$.
    - opgave: |-
        Is een meridiaan een cirkel? Welke kromme is het?
      antwoord: |-
        nee: een ellips met halve assen $a$ en $c$
      uitwerking: |-
        Een meridiaan ligt in een verticaal vlak door de as. Met $y=0$: $\dfrac{x^2}{a^2}+\dfrac{z^2}{c^2}=1$.
    - opgave: |-
        Teken je een meridiaan op schaal als een ellips met een halve lange as van 10 cm, hoeveel korter is dan de halve korte as?
      antwoord: |-
        ongeveer 0,34 mm (de halve as)
      uitwerking: |-
        $10\cdot\dfrac{a-c}{a}\approx0{,}0335$ cm. Op papier zie je dat niet: de figuur ziet eruit als een cirkel.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    ellipsoïde in een context
  opgave: |-
    Een rugbybal is 28 cm lang en heeft in het midden een omtrek van 60 cm. Neem een omwentelingsellipsoïde met de lange as langs de $x$-as.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking.
      antwoord: |-
        $\dfrac{x^2}{14^2}+\dfrac{y^2+z^2}{9{,}55^2}=1$
      uitwerking: |-
        $a=14$, en $2\pi b=60$ geeft $b=c=\tfrac{30}{\pi}\approx9{,}55$ cm.
    - opgave: |-
        Hoe dik is de bal op 7 cm van het midden?
      antwoord: |-
        ongeveer 16,5 cm
      uitwerking: |-
        Op $x=7$: $y^2+z^2=9{,}55^2\bigl(1-\tfrac{49}{196}\bigr)$, dus de straal is $9{,}55\cdot\sqrt{0{,}75}\approx8{,}27$ cm en de dikte $16{,}5$ cm.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    paraboloïde in een context
  opgave: |-
    De schotelantenne uit Kegelsneden (hoofdstuk 2) is 80 cm breed en 12 cm diep. Haar oppervlak is een omwentelingsparaboloïde.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking, met de top in de oorsprong en de as langs de $z$-as.
      antwoord: |-
        $z=\dfrac{3(x^2+y^2)}{400}$
      uitwerking: |-
        $z=k(x^2+y^2)$ door de rand: $12=k\cdot1600$, dus $k=\tfrac{3}{400}$.
    - opgave: |-
        Waar ligt het brandpunt?
      antwoord: |-
        in $\bigl(0, 0, \tfrac{100}{3}\bigr)$, 33,3 cm boven de bodem
      uitwerking: |-
        Elke doorsnede door de as is de parabool $z=\tfrac{3}{400}y^2$, met brandpunt op $\tfrac{1}{4k}=\tfrac{100}{3}$ boven de top. Alle doorsneden hebben hetzelfde brandpunt.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    snijpunten van een rechte en een kwadriek
  opgave: |-
    Bepaal de gemeenschappelijke punten van de rechte en de kwadriek.
  lijst: enumerate
  delen:
    - opgave: |-
        de rechte $(2t, 3t, t)$ en de ellipsoïde $\dfrac{x^2}{4} + \dfrac{y^2}{9} + z^2 = 1$
      antwoord: |-
        $\pm\tfrac{1}{\sqrt3}(2, 3, 1)$
      uitwerking: |-
        $t^2+t^2+t^2=1$ geeft $t=\pm\tfrac{1}{\sqrt3}$.
    - opgave: |-
        de rechte $(2, t, t)$ en dezelfde ellipsoïde
      antwoord: |-
        alleen $(2, 0, 0)$: een raaklijn
      uitwerking: |-
        $1+\tfrac{t^2}{9}+t^2=1$ geeft alleen $t=0$.
    - opgave: |-
        de rechte $(t, t, 1)$ en het zadel $z = xy$
      antwoord: |-
        $(1, 1, 1)$ en $(-1, -1, 1)$
      uitwerking: |-
        $1=t^2$.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    rechten op een hyperboloïde
  opgave: |-
    We zoeken de rechten op $x^2 + y^2 - z^2 = 1$ door het punt $P(1, 2, 2)$, zonder de stelling.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $P + s\,(p, q, r)$ voor elke $s$ op het oppervlak ligt als en slechts als $p + 2q - 2r = 0$ en $p^2 + q^2 - r^2 = 0$.
      antwoord: |-
        de coëfficiënten van $s$ en $s^2$ moeten nul zijn
      uitwerking: |-
        $(1+sp)^2+(2+sq)^2-(2+sr)^2=1+2s(p+2q-2r)+s^2(p^2+q^2-r^2)$. Dat is 1 voor elke $s$ als en slechts als beide haakjes nul zijn.
    - opgave: |-
        Los op met $r = 1$, en geef de twee rechten.
      antwoord: |-
        richtingen $(0, 1, 1)$ en $\bigl(\tfrac45, \tfrac35, 1\bigr)$
      uitwerking: |-
        $p=2-2q$ in $p^2+q^2=1$: $5q^2-8q+3=0$, dus $q=1$ of $q=\tfrac35$. De rechten $(1, 2+s, 2+s)$ en $(1, 2, 2)+s(4, 3, 5)$.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    rechten op een zadel
  opgave: |-
    Geef de twee rechten op $z = x^2 - y^2$ door het punt $(3, 1, 8)$. Ontbind het rechterlid zoals in het bewijs.
  antwoord: |-
    $(t+2, t, 4t+4)$ en $(t, 4-t, 8t-16)$
  uitwerking: |-
    $z=(x-y)(x+y)$. In $(3, 1, 8)$ is $x-y=2$ en $x+y=4$.\\
    Eerste familie: $x-y=2$ en $z=2(x+y)$. Met $y=t$: $(t+2, t, 4t+4)$, het punt voor $t=1$.\\
    Tweede familie: $x+y=4$ en $z=4(x-y)$. Met $x=t$: $(t, 4-t, 8t-16)$, het punt voor $t=3$.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    parametervoorstelling van een tweebladige hyperboloïde
  opgave: |-
    Neem de tweebladige hyperboloïde $z^2 - x^2 - y^2 = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $x = v\cos u$, $y = v\sin u$, $z = \sqrt{1 + v^2}$ ($v \geqslant 0$) het bovenste blad beschrijft.
      antwoord: |-
        $z^2-x^2-y^2=1+v^2-v^2=1$, met $z\geqslant1$
      uitwerking: |-
        Elk punt ligt op het oppervlak, en $z>0$. Omgekeerd: een punt van het bovenste blad heeft $z=\sqrt{1+x^2+y^2}$, en $(x, y)$ ligt op een cirkel met straal $v=\sqrt{x^2+y^2}$.
    - opgave: |-
        Geef een parametervoorstelling van het onderste blad.
      antwoord: |-
        $\bigl(v\cos u, v\sin u, -\sqrt{1+v^2}\bigr)$
      uitwerking: |-
        Spiegel om het $xy$-vlak.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    hyperbolische paraboloïde in een context
  figuur:
    opties: |-
      2.6cm
    code: |-
      \begin{tikzpicture}[zicht=.6,font=\scriptsize]
        \beeld{regels-zadel.png}{-1.089}{-1.383}{2.178}
      \end{tikzpicture}
  opgave: |-
    Een dak boven een vierkant grondplan van 8~m bij 8~m heeft de vorm $z = 3 + \dfrac{xy}{8}$, met $-4 \leqslant x \leqslant 4$ en $-4 \leqslant y \leqslant 4$ (in meter).
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe hoog liggen de vier hoeken?
      antwoord: |-
        5 m in $(\pm4, \pm4)$ met hetzelfde teken, 1 m in de twee andere
      uitwerking: |-
        $3+\tfrac{16}{8}=5$ en $3-\tfrac{16}{8}=1$.
    - opgave: |-
        Toon aan dat de vier randen van het dak recht zijn.
      antwoord: |-
        bijvoorbeeld $x=4$: $z=3+\tfrac y2$
      uitwerking: |-
        Boven $x=\pm4$ is $z=3\pm\tfrac y2$, boven $y=\pm4$ is $z=3\pm\tfrac x2$: telkens een rechte.
    - opgave: |-
        Toon aan dat je het dak kunt bekisten met rechte planken evenwijdig met de zijden.
      antwoord: |-
        boven $x=k$ is $z=3+\tfrac{k}{8}y$, een rechte
      uitwerking: |-
        Het dak is een hyperbolische paraboloïde: boven elke rechte $x=k$ of $y=k$ van het grondplan ligt een rechte van het dak.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijking opstellen
  opgave: |-
    Geef een vergelijking van de kwadriek.
  lijst: enumerate
  delen:
    - opgave: |-
        de ellipsoïde met middelpunt $(1, 2, 3)$ en halve assen 1, 2 en 3, evenwijdig met de $x$-, de $y$- en de $z$-as
      antwoord: |-
        $(x-1)^2+\dfrac{(y-2)^2}{4}+\dfrac{(z-3)^2}{9}=1$
      uitwerking: |-
        De standaardvorm, verschoven.
    - opgave: |-
        de omwentelingsparaboloïde met top $O$ en als as de $y$-as, door het punt $(2, 1, 0)$
      antwoord: |-
        $y=\dfrac{x^2+z^2}{4}$
      uitwerking: |-
        $y=k(x^2+z^2)$ met $1=4k$.
    - opgave: |-
        de kegel met top $(0, 0, 2)$, als as de $z$-as en een halve tophoek van $45^\circ$
      antwoord: |-
        $x^2+y^2=(z-2)^2$
      uitwerking: |-
        Op hoogte $z$ is de straal $|z-2|\tan45^\circ=|z-2|$.

- id: h3-o18
  soort: opdracht
  niveau: 3
  thema: |-
    raakvlak aan een kwadriek
  opgave: |-
    Het raakvlak in een punt $P(x_1, y_1, z_1)$ van een kwadriek in standaardvorm vind je door te ontdubbelen, zoals bij de bol: $x^2 \to x_1x$, $y^2 \to y_1y$, $z^2 \to z_1z$, $z \to \tfrac{z + z_1}{2}$ en $xy \to \tfrac{x_1y + xy_1}{2}$. (Dat dit altijd het raakvlak geeft, bewijs je met afgeleiden; dat valt buiten dit boek.)
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal het raakvlak aan $x^2 + 2y^2 + 3z^2 = 6$ in $(1, 1, 1)$.
      antwoord: |-
        $x+2y+3z=6$
      uitwerking: |-
        $1+2+3=6$: het punt ligt op de ellipsoïde. Ontdubbelen: $x+2y+3z=6$.
    - opgave: |-
        Bepaal het raakvlak aan $x^2 + y^2 - z^2 = 1$ in $(1, 1, 1)$.
      antwoord: |-
        $x+y-z=1$
      uitwerking: |-
        $1+1-1=1$. Ontdubbelen: $x+y-z=1$.
    - opgave: |-
        Toon aan dat het raakvlak van b de hyperboloïde snijdt volgens de twee rechten $(1, t, t)$ en $(t, 1, t)$ van voorbeeld~\ref{vb:h3-rechten}.
      antwoord: |-
        $(x-1)(y-1)=0$
      uitwerking: |-
        Vul $z=x+y-1$ in: $x^2+y^2-(x+y-1)^2=1$ geeft $-2xy+2x+2y-1=1$, of $(x-1)(y-1)=0$. Dus $x=1$ (en dan $z=y$) of $y=1$ (en dan $z=x$).
    - opgave: |-
        Bepaal het raakvlak aan $z = xy$ in $(2, 3, 6)$, en vergelijk met voorbeeld~\ref{vb:h3-zadelrechten}.
      antwoord: |-
        $3x+2y-z=6$
      uitwerking: |-
        $\dfrac{z+6}{2}=\dfrac{2y+3x}{2}$, dus $z=3x+2y-6$: het vlak door de twee rechten.

- id: h3-o19
  soort: opdracht
  niveau: 3
  thema: |-
    de toren van Sjoechov veralgemeend
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[zicht=.14,font=\scriptsize]
        \foreach \d/\th in {0/0,8/90,16/180}{%
          \begin{scope}[shift={(0,\d,0)}]
            \foreach \t in {0,30,...,330}{\draw[accent!75] ({3*cos(\t)},{3*sin(\t)},0) -- ({3*cos(\t+\th)},{3*sin(\t+\th)},12);}
            \node at (0,0,-3) {$\th^\circ$};
          \end{scope}}
      \end{tikzpicture}
  opgave: |-
    Neem twee horizontale ringen met straal 3~m, op 0~m en op 12~m hoogte, en verbind elk punt van de onderste ring met het punt van de bovenste ring dat een hoek $\theta$ verder ligt ($0^\circ \leqslant \theta \leqslant 180^\circ$).
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de toren in het midden een straal $3\cos\tfrac\theta2$ heeft. Bereken ze voor $\theta = 90^\circ$.
      antwoord: |-
        $3\cos45^\circ\approx2{,}12$ m
      uitwerking: |-
        Het midden van een staaf is het midden van een koorde van de cirkel met straal 3 en middelpuntshoek $\theta$. Dat ligt op $3\cos\tfrac\theta2$ van het middelpunt.
    - opgave: |-
        Welk oppervlak vormen de staven als $\theta = 0^\circ$?
      antwoord: |-
        een cilinder
      uitwerking: |-
        Alle staven zijn verticaal: de cilinder $x^2+y^2=9$.
    - opgave: |-
        En als $\theta = 180^\circ$?
      antwoord: |-
        een dubbelkegel met top $(0, 0, 6)$
      uitwerking: |-
        Elke staaf verbindt twee tegenoverliggende punten en gaat door het midden van de as: $3\cos90^\circ=0$. Alle staven gaan door $(0, 0, 6)$: een kegel. Cilinder, hyperboloïde en kegel horen zo bij één familie.

- id: h3-o20
  soort: opdracht
  niveau: 3
  thema: |-
    cirkels op een ellipsoïde
  opgave: |-
    De ellipsoïde $\dfrac{x^2}{9} + \dfrac{y^2}{4} + z^2 = 1$ heeft drie verschillende halve assen, en toch liggen er cirkels op.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: een punt van de ellipsoïde ligt op de bol $x^2 + y^2 + z^2 = 4$ als en slechts als $5x^2 = 27z^2$.
      antwoord: |-
        trek 4 keer de vergelijking van de ellipsoïde af van die van de bol
      uitwerking: |-
        Voor een punt van de ellipsoïde is $\tfrac{4x^2}{9}+y^2+4z^2=4$. Het ligt op de bol als en slechts als $x^2+y^2+z^2=\tfrac{4x^2}{9}+y^2+4z^2$, of $\tfrac59x^2=3z^2$, of $5x^2=27z^2$.
    - opgave: |-
        Besluit dat de vlakken $z = \pm\sqrt{\tfrac{5}{27}}\,x$ de ellipsoïde snijden volgens cirkels met straal 2.
      antwoord: |-
        de doorsnede ligt op een bol met straal 2 en in een vlak door het middelpunt
      uitwerking: |-
        In die vlakken is $5x^2=27z^2$. De doorsnede met de ellipsoïde ligt dus ook op de bol met straal 2. Een vlak door het middelpunt van die bol snijdt hem volgens een grootcirkel met straal 2 (hoofdstuk 1), en zo'n cirkel ligt hier volledig op de ellipsoïde.

- id: h3-o21
  soort: opdracht
  niveau: 3
  thema: |-
    ligging van de rechten op een hyperboloïde
  opgave: |-
    Op $x^2 + y^2 - z^2 = 1$ liggen de rechten $l_1 = (1, t, t)$, $l_2 = (-1, t, -t)$, $l_3 = (t, 1, t)$ en $l_4 = (-1, t, t)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de vier rechten op het oppervlak liggen. Tot welke familie van de stelling hoort elk?
      antwoord: |-
        $l_1$ en $l_2$ de eerste ($u=0$ en $u=\pi$), $l_3$ en $l_4$ de tweede ($u=\tfrac\pi2$ en $u=\pi$)
      uitwerking: |-
        Telkens $1+t^2-t^2=1$. Met $a=b=c=1$: de eerste familie geeft voor $u=0$ de rechte $(1, v, v)$ en voor $u=\pi$ de rechte $(-1, -v, v)$; de tweede voor $u=\tfrac\pi2$ de rechte $(v, 1, v)$ en voor $u=\pi$ de rechte $(-1, v, v)$.
    - opgave: |-
        Bepaal de onderlinge ligging van $l_1$ en $l_2$, van $l_1$ en $l_3$, en van $l_1$ en $l_4$.
      antwoord: |-
        kruisend; snijdend in $(1, 1, 1)$; evenwijdig
      uitwerking: |-
        $l_1$ en $l_2$: richtingen $(0, 1, 1)$ en $(0, 1, -1)$ niet evenwijdig, en $x=1$ tegenover $x=-1$: geen snijpunt, dus kruisend. $l_1$ en $l_3$ hebben $(1, 1, 1)$ gemeen. $l_1$ en $l_4$ hebben dezelfde richting $(0, 1, 1)$ en zijn verschillend.
    - opgave: |-
        Wat vermoed je over twee rechten van dezelfde familie, en over twee rechten van verschillende families?
      antwoord: |-
        dezelfde familie: kruisend; verschillende families: snijdend of evenwijdig
      uitwerking: |-
        Dat klopt in het algemeen. Daarom vormen de staven van Sjoechov twee lagen: binnen een laag raken ze elkaar niet, en elke staaf kruist de staven van de andere laag.

- id: h3-o22
  soort: opdracht
  niveau: 3
  thema: |-
    rechte en kwadriek, bewijs
  opgave: |-
    Neem een kwadriek en een rechte $A + t\,\vec u$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de rechte de kwadriek in hoogstens twee punten snijdt, of er volledig op ligt.
      antwoord: |-
        invullen geeft een vergelijking van hoogstens graad 2 in $t$
      uitwerking: |-
        Elke coördinaat is van de eerste graad in $t$, dus een term van de tweede graad in $x$, $y$, $z$ wordt hoogstens van graad 2 in $t$. Is die veelterm niet de nulveelterm, dan heeft hij hoogstens twee nulwaarden. Is hij de nulveelterm, dan ligt elk punt van de rechte op de kwadriek.
    - opgave: |-
        Besluit dat er op een bol geen enkele rechte ligt.
      antwoord: |-
        een bol is begrensd
      uitwerking: |-
        Een rechte op de bol zou punten op willekeurig grote afstand van het middelpunt hebben, maar alle punten van de bol liggen op afstand $r$. Of: een rechte snijdt de bol in hoogstens twee punten (hoofdstuk 1).

- id: h3-koppel-1
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Schrijf $X$ voor de kolommatrix met $x$, $y$ en $z$, en $X^{\mathrm T}$ voor haar getransponeerde (een rijmatrix). Een kwadriek zonder termen van de eerste graad kun je dan schrijven als $X^{\mathrm T} A X = c$, met $A$ een symmetrische $3 \times 3$-matrix.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $X^{\mathrm T} A X$ voor de diagonaalmatrix $A$ met $\tfrac14$, $\tfrac19$ en $1$ op de diagonaal. Welke kwadriek is $X^{\mathrm T} A X = 1$?
      antwoord: |-
        $\tfrac{x^2}{4}+\tfrac{y^2}{9}+z^2$; een ellipsoïde
      uitwerking: |-
        $AX$ is de kolom $\tfrac x4$, $\tfrac y9$, $z$, en $X^{\mathrm T}(AX)=\tfrac{x^2}{4}+\tfrac{y^2}{9}+z^2$.
    - opgave: |-
        Bereken $X^{\mathrm T} B X$ voor $B = \begin{pmatrix} 0 & \tfrac12 & 0 \\ \tfrac12 & 0 & 0 \\ 0 & 0 & 0 \end{pmatrix}$.
      antwoord: |-
        $xy$
      uitwerking: |-
        $BX$ is de kolom $\tfrac y2$, $\tfrac x2$, $0$, en $X^{\mathrm T}BX=\tfrac{xy}{2}+\tfrac{xy}{2}=xy$.
    - opgave: |-
        Neem $R = \dfrac{1}{\sqrt2}\begin{pmatrix} 1 & -1 & 0 \\ 1 & 1 & 0 \\ 0 & 0 & \sqrt2 \end{pmatrix}$, de draaiing over $45^\circ$ om de $z$-as. Toon aan dat $R^{\mathrm T} B R$ de diagonaalmatrix met $\tfrac12$, $-\tfrac12$ en $0$ is. Besluit dat $z = xy$ in gedraaide coördinaten $z = \tfrac{x'^2 - y'^2}{2}$ wordt.
      antwoord: |-
        $R^{\mathrm T}BR=\mathrm{diag}\bigl(\tfrac12, -\tfrac12, 0\bigr)$
      uitwerking: |-
        $BR=\dfrac{1}{\sqrt2}\begin{pmatrix}\tfrac12&\tfrac12&0\\ \tfrac12&-\tfrac12&0\\0&0&0\end{pmatrix}$ en $R^{\mathrm T}BR=\begin{pmatrix}\tfrac12&0&0\\0&-\tfrac12&0\\0&0&0\end{pmatrix}$. Met $X=RX'$ is $X^{\mathrm T}BX=X'^{\mathrm T}(R^{\mathrm T}BR)X'=\tfrac{x'^2-y'^2}{2}$, en $z$ verandert niet.

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Integralen
  opgave: |-
    Het volume van een ellipsoïde vind je met de methode van de doorsneden, en de oppervlakte $\pi ab$ van een ellips uit Kegelsneden.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de doorsnede van $\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} + \dfrac{z^2}{c^2} = 1$ op hoogte $z$ een oppervlakte $\pi ab\bigl(1 - \tfrac{z^2}{c^2}\bigr)$ heeft, en bereken het volume.
      antwoord: |-
        $V=\tfrac43\pi abc$
      uitwerking: |-
        De halve assen op hoogte $z$ zijn $a\sqrt{1-\tfrac{z^2}{c^2}}$ en $b\sqrt{1-\tfrac{z^2}{c^2}}$. $V=\displaystyle\int_{-c}^{c}\pi ab\Bigl(1-\frac{z^2}{c^2}\Bigr)\mathrm dz=\pi ab\Bigl(2c-\frac{2c}{3}\Bigr)=\tfrac43\pi abc$.
    - opgave: |-
        Hoeveel lucht zit er in de rugbybal van opdracht~\ref{oef:h3-o10}?
      antwoord: |-
        ongeveer 5,3 liter
      uitwerking: |-
        $\tfrac43\pi\cdot14\cdot9{,}55^2\approx5348$ cm³.

- id: h3-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Kegelsneden
  opgave: |-
    Snijd de kegel $x^2 + y^2 = z^2$ (halve tophoek $45^\circ$) met het vlak $z = mx + 1$, met $m \geqslant 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de loodrechte projectie van de doorsnede op het $xy$-vlak de kromme $(1 - m^2)x^2 - 2mx + y^2 = 1$ is.
      antwoord: |-
        vul $z=mx+1$ in
      uitwerking: |-
        $x^2+y^2=(mx+1)^2=m^2x^2+2mx+1$.
    - opgave: |-
        Voor welke $m$ is dat een ellips, een parabool en een hyperbool? Verklaar met de hoek tussen het vlak en de as uit Kegelsneden, hoofdstuk 1.
      antwoord: |-
        ellips als $m<1$, parabool als $m=1$, hyperbool als $m>1$
      uitwerking: |-
        Het teken van $1-m^2$ beslist. Het vlak maakt met de horizontale een hoek met tangens $m$; bij $m=1$ is het evenwijdig met een beschrijvende (hoek $45^\circ$ met de as, gelijk aan de halve tophoek). Een loodrechte projectie op een vlak verandert de soort niet: ze rekt alleen in één richting.

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Bepaal de doorsnede van de ellipsoïde $\dfrac{x^2}{9} + \dfrac{y^2}{4} + z^2 = 1$ met het vlak $z = 0{,}8$.
  antwoord: |-
    een ellips met halve assen 1,8 en 1,2
  uitwerking: |-
    $\dfrac{x^2}{9}+\dfrac{y^2}{4}=0{,}36$, en $\sqrt{0{,}36}=0{,}6$: de halve assen $3\cdot0{,}6$ en $2\cdot0{,}6$.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Welke kwadriek is $y^2 + z^2 - x^2 = 4$? Wat is haar as, en welke doorsnede heeft ze met het vlak $x = 0$?
  antwoord: |-
    eenbladige hyperboloïde, as de $x$-as, keelcirkel met straal 2
  uitwerking: |-
    Twee plustekens, één minteken bij $x$ en rechterlid positief. Met $x=0$: $y^2+z^2=4$.

- id: h3-t3
  soort: test
  niveau: 2
  opgave: |-
    Toon aan dat $x^2 + y^2 - z^2 + 2z = 0$ een tweebladige hyperboloïde is, en bepaal de toppen.
  antwoord: |-
    $x^2+y^2-(z-1)^2=-1$; toppen $(0, 0, 0)$ en $(0, 0, 2)$
  uitwerking: |-
    $-(z^2-2z)=-(z-1)^2+1$. De toppen liggen op de as $x=y=0$ op afstand 1 van het middelpunt $(0, 0, 1)$.

- id: h3-t4
  soort: test
  niveau: 2
  opgave: |-
    Welke kwadriek is $x^2 + 4y^2 + 4z^2 - 4x - 8z = 0$? Geef het middelpunt en de halve assen.
  antwoord: |-
    omwentelingsellipsoïde, middelpunt $(2, 0, 1)$, halve assen $2\sqrt2$, $\sqrt2$, $\sqrt2$
  uitwerking: |-
    $(x-2)^2+4y^2+4(z-1)^2=4+4=8$, dus $\dfrac{(x-2)^2}{8}+\dfrac{y^2}{2}+\dfrac{(z-1)^2}{2}=1$. De as is evenwijdig met de $x$-as.

- id: h3-t5
  soort: test
  niveau: 1
  opgave: |-
    Welke kwadriek is $z = x^2 - y^2$? Bepaal de niveaukromme $z = -4$.
  antwoord: |-
    hyperbolische paraboloïde; de hyperbool $y^2-x^2=4$ met toppen $(0, \pm2)$
  uitwerking: |-
    $x^2-y^2=-4$, of $\dfrac{y^2}{4}-\dfrac{x^2}{4}=1$.

- id: h3-t6
  soort: test
  niveau: 2
  opgave: |-
    Geef de twee rechten op $z = xy$ door het punt $(3, -1, -3)$.
  antwoord: |-
    $(3, t, 3t)$ en $(t, -1, -t)$
  uitwerking: |-
    Het punt ligt erop: $3\cdot(-1)=-3$. Met $x=3$ vast is $z=3y$, met $y=-1$ vast is $z=-x$.

- id: h3-t7
  soort: test
  niveau: 1
  opgave: |-
    Geef een parametervoorstelling van de ellipsoïde $\dfrac{x^2 + y^2}{4} + \dfrac{z^2}{25} = 1$. Is ze afgeplat of langgerekt?
  antwoord: |-
    $(2\cos\varphi\cos\lambda, 2\cos\varphi\sin\lambda, 5\sin\varphi)$; langgerekt
  uitwerking: |-
    $a=b=2$ en $c=5$: de as door de polen is de langste.
