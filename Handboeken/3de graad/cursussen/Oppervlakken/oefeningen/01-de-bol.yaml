# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de afstand tussen $(1, 2, 3)$ en $(3, -1, 9)$
      antwoord: |-
        7
      uitwerking: |-
        $\sqrt{2^2+3^2+6^2}=\sqrt{49}=7$.
    - opgave: |-
        de cirkel met middelpunt $(2, -1)$ en straal 3
      antwoord: |-
        $(x-2)^2+(y+1)^2=9$
      uitwerking: |-
        De vergelijking van een cirkel uit Kegelsneden.
    - opgave: |-
        $x^2 - 6x$ als kwadraat min een getal
      antwoord: |-
        $(x-3)^2-9$
      uitwerking: |-
        De helft van $-6$ is $-3$, en $(x-3)^2=x^2-6x+9$.
    - opgave: |-
        de afstand van $(1, 1, 1)$ tot het vlak $2x - y + 2z = 10$
      antwoord: |-
        $\tfrac73$
      uitwerking: |-
        $\dfrac{|2-1+2-10|}{\sqrt{4+1+4}}=\dfrac73$.
    - opgave: |-
        het vlak door $(1, 0, 2)$ met normaalvector $(2, -1, 3)$
      antwoord: |-
        $2x-y+3z=8$
      uitwerking: |-
        $2x-y+3z=2\cdot1-0+3\cdot2=8$.
    - opgave: |-
        het snijpunt van de rechte $(1 + t, 2t, 3 - t)$ met het vlak $x + y + z = 10$
      antwoord: |-
        $(4, 6, 0)$
      uitwerking: |-
        $1+t+2t+3-t=10$ geeft $2t=6$, dus $t=3$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad We zoeken alle punten op afstand 3 van de oorsprong $O$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de zes punten op de assen die op afstand 3 van $O$ liggen.
      antwoord: |-
        $(\pm3, 0, 0)$, $(0, \pm3, 0)$, $(0, 0, \pm3)$
      uitwerking: |-
        Op elke as drie eenheden in beide zinnen.
    - opgave: |-
        Ligt $(1, 2, 2)$ op afstand 3 van $O$? En $(2, 2, 2)$?
      antwoord: |-
        ja; nee
      uitwerking: |-
        $\sqrt{1+4+4}=3$, maar $\sqrt{4+4+4}=\sqrt{12}\neq3$.
    - opgave: |-
        Voor welke $z$ ligt $(2, 1, z)$ op afstand 3 van $O$?
      antwoord: |-
        $z=\pm2$
      uitwerking: |-
        $4+1+z^2=9$ geeft $z^2=4$.
    - opgave: |-
        Aan welke vergelijking voldoen de coördinaten van elk punt op afstand 3 van $O$? Welke vorm hebben al die punten samen?
      antwoord: |-
        $x^2+y^2+z^2=9$; een bol
      uitwerking: |-
        $\sqrt{x^2+y^2+z^2}=3$, gekwadrateerd. Samen vormen ze een bol met middelpunt $O$ en straal 3.

- id: h1-mpvgl
  soort: kort
  opgave: |-
    Geef een vergelijking van de bol.
  lijst: enumerate
  delen:
    - opgave: |-
        met middelpunt $(3, -1, 0)$ en straal 4
      antwoord: |-
        $(x-3)^2+(y+1)^2+z^2=16$
      uitwerking: |-
        Rechtstreeks met de middelpuntsvergelijking.
    - opgave: |-
        met middelpunt $M(-2, 0, 1)$ door $P(0, 3, 7)$. Ligt $(1, 1, 1)$ binnen of buiten die bol?
      antwoord: |-
        $(x+2)^2+y^2+(z-1)^2=49$; binnen
      uitwerking: |-
        $r^2=|MP|^2=4+9+36=49$. Voor $(1, 1, 1)$: $9+1+0=10<49$, dus binnen.

- id: h1-alg
  soort: kort
  opgave: |-
    Bepaal het middelpunt en de straal, of toon aan dat de vergelijking geen bol voorstelt.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + y^2 + z^2 - 2x + 6y - 8z + 1 = 0$
      antwoord: |-
        $M(1, -3, 4)$, $r=5$
      uitwerking: |-
        $(x-1)^2+(y+3)^2+(z-4)^2=1+9+16-1=25$.
    - opgave: |-
        $x^2 + y^2 + z^2 + 4x - 4y + 2z + 10 = 0$
      antwoord: |-
        geen bol
      uitwerking: |-
        $(x+2)^2+(y-2)^2+(z+1)^2=4+4+1-10=-1<0$: geen enkel punt.
    - opgave: |-
        $4x^2 + 4y^2 + 4z^2 - 4x - 3 = 0$
      antwoord: |-
        $M\bigl(\tfrac12, 0, 0\bigr)$, $r=1$
      uitwerking: |-
        Deel door 4: $x^2+y^2+z^2-x-\tfrac34=0$, dus $\bigl(x-\tfrac12\bigr)^2+y^2+z^2=\tfrac34+\tfrac14=1$.

- id: h1-middellijn
  soort: kort
  opgave: |-
    Geef met Thales een vergelijking van de bol met middellijn $[AB]$, met $A(-1, 2, 0)$ en $B(3, 0, 4)$. Bepaal het middelpunt en de straal, en controleer met het midden van $[AB]$.
  antwoord: |-
    $x^2+y^2+z^2-2x-2y-4z-3=0$; $M(1, 1, 2)$, $r=3$
  uitwerking: |-
    $(x+1)(x-3)+(y-2)y+z(z-4)=0$ geeft $x^2+y^2+z^2-2x-2y-4z-3=0$, of $(x-1)^2+(y-1)^2+(z-2)^2=9$.\\
    Controle: het midden van $[AB]$ is $(1, 1, 2)$, en $|AB|=\sqrt{16+4+16}=6=2r$.

- id: h1-snijcirkel
  soort: kort
  opgave: |-
    Neem de bol $(x - 2)^2 + y^2 + (z - 1)^2 = 25$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal het middelpunt en de straal van de doorsnede met het vlak $x - 2y + 2z = 13$.
      antwoord: |-
        middelpunt $(3, -2, 3)$, straal 4
      uitwerking: |-
        $d=\dfrac{|2+2-13|}{3}=3<5$, dus $\rho=\sqrt{25-9}=4$. Loodlijn $(2+t, -2t, 1+2t)$ in het vlak: $4+9t=13$, $t=1$.
    - opgave: |-
        Snijdt het vlak $z = 7$ de bol?
      antwoord: |-
        nee
      uitwerking: |-
        De afstand van $M(2, 0, 1)$ tot $z=7$ is $6>5$.

- id: h1-raakvlak
  soort: kort
  opgave: |-
    Bepaal het raakvlak aan de bol in het gegeven punt.
  lijst: enumerate
  delen:
    - opgave: |-
        $(x + 1)^2 + (y - 2)^2 + (z - 1)^2 = 9$ in $(1, 4, 0)$
      antwoord: |-
        $2x+2y-z=10$
      uitwerking: |-
        $4+4+1=9$ klopt. Ontdubbelen: $2(x+1)+2(y-2)-(z-1)=9$, dus $2x+2y-z=10$.
    - opgave: |-
        $x^2 + y^2 + z^2 = 14$ in $(3, -1, 2)$
      antwoord: |-
        $3x-y+2z=14$
      uitwerking: |-
        $9+1+4=14$ klopt. Ontdubbelen: $3x-y+2z=14$.

- id: h1-raakbol
  soort: kort
  opgave: |-
    Geef een vergelijking van de bol met middelpunt $(0, 1, 2)$ die het vlak $2x + 2y + z = 13$ raakt, en bepaal het raakpunt.
  antwoord: |-
    $x^2+(y-1)^2+(z-2)^2=9$; raakpunt $(2, 3, 3)$
  uitwerking: |-
    $r=\dfrac{|0+2+2-13|}{3}=3$. Loodlijn $(2t, 1+2t, 2+t)$ in het vlak: $4+9t=13$, $t=1$.

- id: h1-rechte
  soort: kort
  opgave: |-
    Bepaal de gemeenschappelijke punten van de bol $(x - 1)^2 + (y + 1)^2 + z^2 = 9$ en de rechte.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = 1 + t,\ y = -1 + 2t,\ z = 2t$
      antwoord: |-
        $(2, 1, 2)$ en $(0, -3, -2)$
      uitwerking: |-
        $t^2+4t^2+4t^2=9$ geeft $t=\pm1$. De rechte gaat door het middelpunt.
    - opgave: |-
        $x = 4,\ y = t,\ z = t$
      antwoord: |-
        geen
      uitwerking: |-
        $9+(t+1)^2+t^2=9$ geeft $(t+1)^2+t^2=0$, en dat kan niet: de twee kwadraten zijn niet tegelijk nul.

- id: h1-horizon
  soort: kort
  opgave: |-
    Hoe ver is de horizon? Neem voor de aarde een bol met straal 6371~km.
  lijst: enumerate
  delen:
    - opgave: |-
        vanaf de top van een berg van 2~km hoog
      antwoord: |-
        ongeveer 160 km
      uitwerking: |-
        $\sqrt{6373^2-6371^2}=\sqrt{2\cdot12\,744}\approx159{,}6$ km.
    - opgave: |-
        vanuit het internationale ruimtestation, op 400~km hoogte
      antwoord: |-
        ongeveer 2293 km
      uitwerking: |-
        $\sqrt{6771^2-6371^2}=\sqrt{400\cdot13\,142}\approx2292{,}8$ km.

- id: h1-tweebollen
  soort: kort
  opgave: |-
    Bepaal het machtvlak en de snijcirkel (middelpunt en straal) van de bollen $x^2 + y^2 + z^2 = 16$ en $(x - 2)^2 + (y - 2)^2 + (z - 1)^2 = 13$.
  antwoord: |-
    $2x+2y+z=6$; middelpunt $\bigl(\tfrac43, \tfrac43, \tfrac23\bigr)$, straal $2\sqrt3$
  uitwerking: |-
    De tweede bol: $x^2+y^2+z^2-4x-4y-2z-4=0$. Aftrekken: $4x+4y+2z+4=16$, of $2x+2y+z=6$.\\
    $d=\tfrac63=2$, $\rho=\sqrt{16-4}=2\sqrt3$. Voetpunt $t(2, 2, 1)$ met $9t=6$: $\bigl(\tfrac43, \tfrac43, \tfrac23\bigr)$.

- id: h1-drie
  soort: kort
  opgave: |-
    Bepaal de punten die op afstand 3 liggen van $O(0, 0, 0)$, van $A(4, 0, 0)$ en van $B(0, 4, 0)$. Waarom zijn ze elkaars spiegelbeeld ten opzichte van het $xy$-vlak?
  antwoord: |-
    $(2, 2, 1)$ en $(2, 2, -1)$
  uitwerking: |-
    De bol rond $O$ min die rond $A$: $8x-16=0$, dus $x=2$. Zo ook $y=2$. Dan $4+4+z^2=9$, dus $z=\pm1$.\\
    De drie middelpunten liggen in het $xy$-vlak, en een spiegeling om dat vlak verandert de afstand tot die punten niet.

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    middelpuntsvergelijking
  opgave: |-
    Geef een vergelijking van de bol.
  lijst: enumerate
  delen:
    - opgave: |-
        met middelpunt $O$ en straal 6
      antwoord: |-
        $x^2+y^2+z^2=36$
      uitwerking: |-
        Middelpunt $(0, 0, 0)$.
    - opgave: |-
        met middelpunt $(1, -2, 4)$ en straal $\sqrt5$
      antwoord: |-
        $(x-1)^2+(y+2)^2+(z-4)^2=5$
      uitwerking: |-
        $r^2=5$.
    - opgave: |-
        met middelpunt $(3, 0, -1)$ door de oorsprong
      antwoord: |-
        $(x-3)^2+y^2+(z+1)^2=10$
      uitwerking: |-
        $r^2=9+0+1=10$.
    - opgave: |-
        met middellijn $[AB]$, met $A(2, 1, 0)$ en $B(4, -3, 2)$
      antwoord: |-
        $(x-3)^2+(y+1)^2+(z-1)^2=6$
      uitwerking: |-
        Middelpunt: het midden $(3, -1, 1)$. $r^2=\tfrac14|AB|^2=\tfrac14(4+16+4)=6$. Of met Thales: $(x-2)(x-4)+(y-1)(y+3)+z(z-2)=0$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    algemene vergelijking
  opgave: |-
    Bepaal het middelpunt en de straal. Stelt de vergelijking geen bol voor, zeg dan wat ze wel voorstelt.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + y^2 + z^2 - 8z = 0$
      antwoord: |-
        $M(0, 0, 4)$, $r=4$
      uitwerking: |-
        $x^2+y^2+(z-4)^2=16$.
    - opgave: |-
        $x^2 + y^2 + z^2 + 2x - 6y + 4z + 5 = 0$
      antwoord: |-
        $M(-1, 3, -2)$, $r=3$
      uitwerking: |-
        $(x+1)^2+(y-3)^2+(z+2)^2=1+9+4-5=9$.
    - opgave: |-
        $3x^2 + 3y^2 + 3z^2 - 6x + 12y - 3 = 0$
      antwoord: |-
        $M(1, -2, 0)$, $r=\sqrt6$
      uitwerking: |-
        Deel door 3: $x^2+y^2+z^2-2x+4y-1=0$, dus $(x-1)^2+(y+2)^2+z^2=1+4+1=6$.
    - opgave: |-
        $x^2 + y^2 + z^2 - 2x + 2y + 2z + 3 = 0$
      antwoord: |-
        één punt: $(1, -1, -1)$
      uitwerking: |-
        $(x-1)^2+(y+1)^2+(z+1)^2=1+1+1-3=0$.
    - opgave: |-
        $x^2 + y^2 + z^2 + 4x + 5 = 0$
      antwoord: |-
        geen enkel punt
      uitwerking: |-
        $(x+2)^2+y^2+z^2=4-5=-1<0$.
    - opgave: |-
        $x^2 + y^2 + 2z^2 = 4$
      antwoord: |-
        geen bol
      uitwerking: |-
        De coëfficiënten van $x^2$, $y^2$ en $z^2$ zijn niet gelijk. Het is een afgeplatte vorm: een ellipsoïde (hoofdstuk 3).

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    ligging van een punt
  opgave: |-
    Ligt het punt binnen, op of buiten de bol $(x - 2)^2 + (y + 1)^2 + z^2 = 14$?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(5, 1, 1)$
      antwoord: |-
        op
      uitwerking: |-
        $9+4+1=14$.
    - opgave: |-
        $(0, 0, 2)$
      antwoord: |-
        binnen
      uitwerking: |-
        $4+1+4=9<14$.
    - opgave: |-
        $(-1, 2, 3)$
      antwoord: |-
        buiten
      uitwerking: |-
        $9+9+9=27>14$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    eigenschappen, redeneren
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Elke bol snijdt het $xy$-vlak.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $x^2+y^2+(z-5)^2=1$ ligt volledig boven het $xy$-vlak, want $d=5>1$.
    - opgave: |-
        Twee bollen met hetzelfde middelpunt en een verschillende straal hebben geen gemeenschappelijk punt.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: een punt kan niet tegelijk op afstand $r_1$ en $r_2\neq r_1$ van $M$ liggen. Het verschil van de vergelijkingen is $0=r_2^2-r_1^2$: er is geen machtvlak.
    - opgave: |-
        De bol $x^2 + y^2 + z^2 = r^2$ raakt het vlak $z = r$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: de afstand van $O$ tot $z=r$ is $r$. Het raakpunt is $(0, 0, r)$.
    - opgave: |-
        Een rechte door het middelpunt snijdt de bol in twee punten.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $d=0<r$. De twee punten liggen op afstand $r$ aan weerszijden van $M$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    doorsnede met een vlak
  opgave: |-
    Bepaal de doorsnede (middelpunt en straal) van de bol $x^2 + y^2 + z^2 - 4x + 2y - 2z - 3 = 0$ met elk coördinaatvlak.
  lijst: enumerate
  delen:
    - opgave: |-
        het $xy$-vlak
      antwoord: |-
        middelpunt $(2, -1, 0)$, straal $2\sqrt2$
      uitwerking: |-
        De bol: $(x-2)^2+(y+1)^2+(z-1)^2=9$. Met $z=0$: $(x-2)^2+(y+1)^2=8$.
    - opgave: |-
        het $xz$-vlak
      antwoord: |-
        middelpunt $(2, 0, 1)$, straal $2\sqrt2$
      uitwerking: |-
        Met $y=0$: $(x-2)^2+(z-1)^2=8$.
    - opgave: |-
        het $yz$-vlak
      antwoord: |-
        middelpunt $(0, -1, 1)$, straal $\sqrt5$
      uitwerking: |-
        Met $x=0$: $(y+1)^2+(z-1)^2=5$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    raakvlak
  opgave: |-
    Bepaal het raakvlak aan de bol in het gegeven punt. Controleer eerst of het punt op de bol ligt.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + y^2 + z^2 = 9$ in $(1, 2, 2)$
      antwoord: |-
        $x+2y+2z=9$
      uitwerking: |-
        $1+4+4=9$. Ontdubbelen.
    - opgave: |-
        $(x - 1)^2 + (y - 1)^2 + (z + 2)^2 = 6$ in $(2, 3, -3)$
      antwoord: |-
        $x+2y-z=11$
      uitwerking: |-
        $1+4+1=6$. $(x-1)+2(y-1)-(z+2)=6$, dus $x+2y-z=11$.
    - opgave: |-
        $x^2 + y^2 + z^2 - 2x + 4z = 0$ in de oorsprong
      antwoord: |-
        $x=2z$
      uitwerking: |-
        $(x-1)^2+y^2+(z+2)^2=5$ en $1+0+4=5$. Ontdubbelen: $-(x-1)+2(z+2)=5$, dus $-x+2z=0$.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    snijpunten met een rechte
  opgave: |-
    Bepaal de gemeenschappelijke punten van de bol $x^2 + y^2 + z^2 = 9$ en de rechte.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = 1 + t,\ y = 2 - 3t,\ z = 2$
      antwoord: |-
        $(1, 2, 2)$ en $(2, -1, 2)$
      uitwerking: |-
        $(1+t)^2+(2-3t)^2+4=9$ geeft $10t^2-10t=0$, dus $t=0$ of $t=1$.
    - opgave: |-
        $x = 3,\ y = t,\ z = t$
      antwoord: |-
        raakpunt $(3, 0, 0)$
      uitwerking: |-
        $9+2t^2=9$ geeft alleen $t=0$: een raaklijn.
    - opgave: |-
        $x = t,\ y = t,\ z = 4$
      antwoord: |-
        geen
      uitwerking: |-
        $2t^2+16=9$ heeft geen oplossing.

- id: h1-o8
  soort: opdracht
  niveau: 1
  thema: |-
    raakvlak, bol die raakt
  opgave: |-
    Geef een vergelijking van de bol met middelpunt $M(1, -1, 2)$ die raakt aan
  lijst: enumerate
  delen:
    - opgave: |-
        het vlak $2x + 2y - z = 7$
      antwoord: |-
        $(x-1)^2+(y+1)^2+(z-2)^2=9$
      uitwerking: |-
        $r=\dfrac{|2-2-2-7|}{3}=3$.
    - opgave: |-
        het $xy$-vlak
      antwoord: |-
        $(x-1)^2+(y+1)^2+(z-2)^2=4$
      uitwerking: |-
        De afstand tot $z=0$ is $|2|$.
    - opgave: |-
        de $x$-as
      antwoord: |-
        $(x-1)^2+(y+1)^2+(z-2)^2=5$
      uitwerking: |-
        Het voetpunt op de $x$-as is $(1, 0, 0)$, op afstand $\sqrt{1+4}=\sqrt5$. Een rechte raakt als ze op afstand $r$ van $M$ ligt.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    doorsnede met een vlak in een context
  opgave: |-
    Neem voor de aarde een bol met straal 6371~km, het middelpunt in de oorsprong en de noordpool op de positieve $z$-as. Brussel ligt op ongeveer 51° noorderbreedte: de straal naar Brussel maakt een hoek van 51° met het vlak van de evenaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking van de aarde, en van het vlak van de breedtecirkel van Brussel.
      antwoord: |-
        $x^2+y^2+z^2=6371^2$; $z\approx4951$
      uitwerking: |-
        Het vlak is horizontaal, op hoogte $6371\sin51^\circ\approx4951$ km.
    - opgave: |-
        Bereken de straal en de lengte van die breedtecirkel.
      antwoord: |-
        straal $\approx4009$ km, lengte $\approx25\,192$ km
      uitwerking: |-
        $\rho=\sqrt{r^2-d^2}=6371\cos51^\circ\approx4009$ km, en $2\pi\rho\approx25\,192$ km.
    - opgave: |-
        Op welke breedte is de breedtecirkel half zo lang als de evenaar?
      antwoord: |-
        $60^\circ$
      uitwerking: |-
        $2\pi R\cos\varphi=\tfrac12\cdot2\pi R$ geeft $\cos\varphi=\tfrac12$.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    ligging van twee bollen
  opgave: |-
    Snijden de bollen elkaar, raken ze, of hebben ze geen gemeenschappelijk punt? Vergelijk de afstand $e$ tussen de middelpunten met $r_1 + r_2$ en $|r_1 - r_2|$. Geef het raakpunt als ze raken.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + y^2 + z^2 = 4$ en $(x - 3)^2 + y^2 + z^2 = 1$
      antwoord: |-
        raken (uitwendig) in $(2, 0, 0)$
      uitwerking: |-
        $e=3=2+1$. Machtvlak: $6x-9=3$, dus $x=2$, en dan $y=z=0$.
    - opgave: |-
        $x^2 + y^2 + z^2 = 25$ en $x^2 + y^2 + (z - 2)^2 = 4$
      antwoord: |-
        geen: de kleine bol ligt binnen de grote
      uitwerking: |-
        $e=2<5-2=3$. Controle: het machtvlak $4z-4=21$ geeft $z=\tfrac{25}{4}>5$, buiten de grote bol.
    - opgave: |-
        $x^2 + y^2 + z^2 = 9$ en $(x - 2)^2 + (y - 2)^2 + (z - 1)^2 = 4$
      antwoord: |-
        snijden
      uitwerking: |-
        $e=\sqrt{4+4+1}=3$ en $1<3<5$.
    - opgave: |-
        $x^2 + y^2 + z^2 = 9$ en $(x - 1)^2 + y^2 + z^2 = 4$
      antwoord: |-
        raken (inwendig) in $(3, 0, 0)$
      uitwerking: |-
        $e=1=3-2$. Machtvlak: $2x-1=5$, dus $x=3$ en $y=z=0$.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    bol door vier punten
  opgave: |-
    Een bol gaat door de oorsprong en door $(2, 0, 0)$, $(0, 4, 0)$ en $(0, 0, 6)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Vul de vier punten in de algemene vergelijking in, en bepaal $D$, $E$, $F$ en $G$.
      antwoord: |-
        $x^2+y^2+z^2-2x-4y-6z=0$
      uitwerking: |-
        $O$ geeft $G=0$. Dan $4+2D=0$, $16+4E=0$ en $36+6F=0$.
    - opgave: |-
        Bepaal het middelpunt en de straal.
      antwoord: |-
        $M(1, 2, 3)$, $r=\sqrt{14}$
      uitwerking: |-
        $(x-1)^2+(y-2)^2+(z-3)^2=14$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijn, horizon
  opgave: |-
    Neem voor de aarde een bol met straal 6371~km.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe ver is de horizon vanaf een uitkijktoren van 50 m hoog?
      antwoord: |-
        ongeveer 25,2 km
      uitwerking: |-
        $\sqrt{6371{,}05^2-6371^2}\approx25{,}2$ km.
    - opgave: |-
        Hoe hoog moet je zijn om de horizon op 100 km te zien?
      antwoord: |-
        ongeveer 785 m
      uitwerking: |-
        $(6371+h)^2-6371^2=100^2$ geeft $h^2+12\,742h-10\,000=0$, dus $h\approx0{,}785$ km.
    - opgave: |-
        Toon aan dat de afstand tot de horizon ongeveer $\sqrt{2Rh}$ is, met $R$ de straal van de aarde en $h$ de hoogte. Waarom mag je dat benaderen?
      antwoord: |-
        $\sqrt{2Rh+h^2}\approx\sqrt{2Rh}$
      uitwerking: |-
        $(R+h)^2-R^2=2Rh+h^2$. Voor een hoogte van enkele km is $h^2$ verwaarloosbaar tegenover $2Rh$: bij $h=1$ is het $1$ tegenover $12\,742$.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    bol die raakt aan vlakken
  opgave: |-
    Een bol ligt in het gebied met $x, y, z > 0$, raakt de drie coördinaatvlakken en gaat door het punt $(2, 1, 1)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit waarom het middelpunt $(r, r, r)$ is.
      antwoord: |-
        de afstand tot elk coördinaatvlak is $r$
      uitwerking: |-
        De afstand van $(a, b, c)$ tot het $yz$-vlak is $|a|$, en die moet $r$ zijn; zo ook voor $b$ en $c$, en ze zijn positief.
    - opgave: |-
        Er zijn twee zulke bollen. Geef hun vergelijkingen.
      antwoord: |-
        $(x-1)^2+(y-1)^2+(z-1)^2=1$ en $(x-3)^2+(y-3)^2+(z-3)^2=9$
      uitwerking: |-
        $(2-r)^2+2(1-r)^2=r^2$ geeft $2r^2-8r+6=0$, dus $r=1$ of $r=3$.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    machtvlak, middelloodvlak
  opgave: |-
    Neem $A(1, 2, 3)$ en $B(3, -2, 1)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de punten die even ver van $A$ als van $B$ liggen, het vlak $x - 2y - z = 0$ vormen.
      antwoord: |-
        $|PA|^2=|PB|^2$ geeft $x-2y-z=0$
      uitwerking: |-
        $(x-1)^2+(y-2)^2+(z-3)^2=(x-3)^2+(y+2)^2+(z-1)^2$. De kwadraten vallen weg: $-2x-4y-6z+14=-6x+4y-2z+14$, dus $4x-8y-4z=0$.
    - opgave: |-
        Leg uit waarom dit het machtvlak is van twee bollen met middelpunten $A$ en $B$ en dezelfde straal. Controleer dat het door het midden van $[AB]$ gaat en loodrecht staat op $AB$.
      antwoord: |-
        het midden $(2, 0, 2)$ ligt erin; $(1, -2, -1)\parallel\overrightarrow{AB}$
      uitwerking: |-
        Met dezelfde straal valt $r^2$ weg bij het aftrekken, en blijft hetzelfde vlak over. $2-0-2=0$, en $\overrightarrow{AB}=(2, -4, -2)=2(1, -2, -1)$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    twee bollen
  opgave: |-
    Neem de bollen $(x - 1)^2 + y^2 + z^2 = 9$ en $x^2 + (y - 2)^2 + (z - 2)^2 = 12$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal het machtvlak.
      antwoord: |-
        $-x+2y+2z=2$
      uitwerking: |-
        $x^2+y^2+z^2-2x-8=0$ en $x^2+y^2+z^2-4y-4z-4=0$. Aftrekken: $-2x+4y+4z-4=0$.
    - opgave: |-
        Bepaal het middelpunt en de straal van de snijcirkel.
      antwoord: |-
        middelpunt $\bigl(\tfrac23, \tfrac23, \tfrac23\bigr)$, straal $2\sqrt2$
      uitwerking: |-
        Afstand van $(1, 0, 0)$ tot het vlak: $\tfrac{|-1-2|}{3}=1$, dus $\rho=\sqrt{9-1}=2\sqrt2$. Loodlijn $(1-t, 2t, 2t)$: $-1+t+4t+4t=2$, $t=\tfrac13$.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijn met een parameter
  opgave: |-
    Uit het punt $Q(0, 0, 5)$ vertrekt een rechte met richtingsvector $(1, 0, m)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke waarden van $m$ raakt die rechte de bol $x^2 + y^2 + z^2 = 9$?
      antwoord: |-
        $m=\pm\tfrac43$
      uitwerking: |-
        $t^2+(5+mt)^2=9$ geeft $(1+m^2)t^2+10mt+16=0$. Discriminant: $100m^2-64(1+m^2)=36m^2-64=0$.
    - opgave: |-
        Bepaal de raakpunten. Hoe ver liggen ze van $Q$?
      antwoord: |-
        $\bigl(\mp\tfrac{12}5, 0, \tfrac95\bigr)$; op afstand 4
      uitwerking: |-
        $t=-\dfrac{5m}{1+m^2}=\mp\dfrac{12}{5}$, dus $z=5+mt=5-\tfrac{16}{5}=\tfrac95$. Afstand: $\sqrt{|QO|^2-r^2}=\sqrt{25-9}=4$.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    doorsnede met een vlak in een context
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.12,font=\scriptsize]
        \fill[accent!12] (-14,-12) rectangle (14,4);
        \draw[accent,thick] (0,0) circle (11);
        \draw[grijs,thick] (-14,4) -- (14,4);
        \fill (0,0) circle (6pt);
        \draw[grijs] (0,0) -- (0,4) node[midway,left] {7};
        \draw[grijs] (0,0) -- (8.49,4) node[midway,below right=-2pt] {11};
        \draw[accent!80!black,very thick] (0,4) -- (8.49,4) node[midway,above] {$\rho$};
      \end{tikzpicture}
  opgave: |-
    Een strandbal met straal 11 cm drijft in een zwembad.
  lijst: enumerate
  delen:
    - opgave: |-
        De bal steekt 4 cm boven het water uit. Wat is de straal van de cirkel waar het wateroppervlak de bal raakt?
      antwoord: |-
        $6\sqrt2\approx8{,}49$ cm
      uitwerking: |-
        Het middelpunt ligt $11-4=7$ cm onder het water: $\rho=\sqrt{121-49}=\sqrt{72}$.
    - opgave: |-
        Een kind duwt de bal dieper, tot hij nog 6 cm boven het water uitsteekt. Wordt die cirkel groter of kleiner?
      antwoord: |-
        groter: $\sqrt{96}\approx9{,}80$ cm
      uitwerking: |-
        Nu ligt het middelpunt 5 cm onder het water: $\rho=\sqrt{121-25}$. Dichter bij het middelpunt is de doorsnede groter.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    bol met voorwaarden
  opgave: |-
    Geef een vergelijking van de bol met het middelpunt op de $z$-as die door $A(2, 1, 3)$ en $B(1, -2, 1)$ gaat.
  antwoord: |-
    $x^2+y^2+(z-2)^2=6$
  uitwerking: |-
    Neem $M(0, 0, c)$. $|MA|^2=|MB|^2$: $5+(3-c)^2=5+(1-c)^2$, dus $9-6c=1-2c$ en $c=2$. Dan $r^2=5+1=6$.

- id: h1-o19
  soort: opdracht
  niveau: 2
  thema: |-
    raakvlak met de algemene vergelijking
  opgave: |-
    Het raakvlak kun je ook vinden door de algemene vergelijking te ontdubbelen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het raakvlak in het punt $P(x_1, y_1, z_1)$ van de bol $x^2 + y^2 + z^2 + Dx + Ey + Fz + G = 0$ gelijk is aan \[x_1x + y_1y + z_1z + D\,\frac{x + x_1}{2} + E\,\frac{y + y_1}{2} + F\,\frac{z + z_1}{2} + G = 0 .\]
      antwoord: |-
        ontdubbel de middelpuntsvorm en werk uit
      uitwerking: |-
        Met $a=-\tfrac D2$: $(x_1-a)(x-a)=x_1x+\tfrac D2(x+x_1)+\tfrac{D^2}{4}$, en zo ook voor $y$ en $z$. Het raakvlak $\sum(x_1-a)(x-a)=r^2$ met $r^2=\tfrac{D^2+E^2+F^2}{4}-G$ wordt dan $x_1x+y_1y+z_1z+\tfrac D2(x+x_1)+\tfrac E2(y+y_1)+\tfrac F2(z+z_1)+G=0$.
    - opgave: |-
        Pas toe op de bol $x^2 + y^2 + z^2 - 4x + 2y - 6z + 5 = 0$ in het punt $(4, 1, 4)$.
      antwoord: |-
        $2x+2y+z=14$
      uitwerking: |-
        $16+1+16-16+2-24+5=0$: het punt ligt op de bol. $4x+y+4z-2(x+4)+(y+1)-3(z+4)+5=0$, dus $2x+2y+z=14$. Controle: $M(2, -1, 3)$ en $\overrightarrow{MP}=(2, 2, 1)$.

- id: h1-o20
  soort: opdracht
  niveau: 2
  thema: |-
    bollen die raken, in een context
  opgave: |-
    Een fruitverkoper stapelt vier sinaasappels met een straal van 4 cm: drie liggen op de toonbank en raken elkaar, de vierde ligt erop en raakt de drie andere. Leg het $xy$-vlak op de toonbank.
  lijst: enumerate
  delen:
    - opgave: |-
        Op welke hoogte liggen de middelpunten van de onderste drie, en hoe ver liggen ze van elkaar?
      antwoord: |-
        op 4 cm hoogte, 8 cm van elkaar
      uitwerking: |-
        Een bol die het vlak raakt, heeft zijn middelpunt op afstand $r$. Twee bollen die uitwendig raken, hebben $e=r_1+r_2=8$.
    - opgave: |-
        Hoe hoog boven de toonbank ligt de top van de stapel?
      antwoord: |-
        $8+8\sqrt{\tfrac23}\approx14{,}5$ cm
      uitwerking: |-
        De vier middelpunten vormen een regelmatig viervlak met ribbe 8. Het middelpunt van de bovenste ligt boven het zwaartepunt van de driehoek, op afstand $\tfrac{8}{\sqrt3}$ van elk hoekpunt, dus $\sqrt{64-\tfrac{64}{3}}=8\sqrt{\tfrac23}\approx6{,}53$ hoger. De top: $4+6{,}53+4\approx14{,}5$ cm.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    bollen die raken, in een context
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[zicht=.075,font=\scriptsize]
        \draw[lijngrijs] (0,0,0) -- (30,0,0) (0,0,0) -- (0,30,0) (0,0,0) -- (0,0,30);
        \fill[accent!10] (0,0,0) -- (0,30,0) -- (0,30,30) -- (0,0,30) -- cycle;
        \fill[accent!6] (0,0,0) -- (30,0,0) -- (30,0,30) -- (0,0,30) -- cycle;
        \bolzicht{.075}{11}{11}{11}{11}
        \fill (0,0,0) circle (1.2pt);
      \end{tikzpicture}
  opgave: |-
    Een voetbal met een diameter van 22 cm ligt in de hoek van een kamer: hij raakt de vloer en de twee muren. Leg de oorsprong in de hoek.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking van de bal.
      antwoord: |-
        $(x-11)^2+(y-11)^2+(z-11)^2=121$
      uitwerking: |-
        Het middelpunt ligt op afstand 11 van de drie vlakken, dus in $(11, 11, 11)$.
    - opgave: |-
        Hoe ver ligt de bal van de hoek?
      antwoord: |-
        $11(\sqrt3-1)\approx8{,}05$ cm
      uitwerking: |-
        Het middelpunt ligt op $11\sqrt3\approx19{,}05$ cm van de hoek. Trek de straal af.
    - opgave: |-
        Past een knikker met een diameter van 4 cm in de hoek achter de bal, tegen de vloer en de muren? Bereken de grootste bol die daar past.
      antwoord: |-
        ja: straal $11(2-\sqrt3)\approx2{,}95$ cm
      uitwerking: |-
        Een bol met middelpunt $(s, s, s)$ raakt de drie vlakken. Hij raakt de bal als $\sqrt3\,(11-s)=11+s$, dus $s=11\dfrac{\sqrt3-1}{\sqrt3+1}=11(2-\sqrt3)\approx2{,}95$. Een diameter tot $5{,}9$ cm past.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    bol door vier punten, bewijs
  opgave: |-
    Vier punten $A$, $B$, $C$ en $D$ liggen niet in één vlak.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat er precies één bol door de vier punten gaat. Gebruik de middelloodvlakken van $[AB]$, $[AC]$ en $[AD]$ (zie opdracht~\ref{oef:h1-o14}).
      antwoord: |-
        het middelpunt is het enige snijpunt van drie middelloodvlakken
      uitwerking: |-
        Het middelpunt ligt even ver van $A$ als van $B$, $C$ en $D$: op de drie middelloodvlakken. Hun normaalvectoren $\overrightarrow{AB}$, $\overrightarrow{AC}$ en $\overrightarrow{AD}$ zijn niet coplanair, want de punten liggen niet in één vlak. Drie vlakken met niet-coplanaire normaalvectoren snijden elkaar in precies één punt. Dat punt is het middelpunt, en $r$ is de afstand tot $A$.
    - opgave: |-
        Bepaal de bol door $(1, 0, 0)$, $(0, 1, 0)$, $(0, 0, 1)$ en $(1, 1, 1)$.
      antwoord: |-
        $\bigl(x-\tfrac12\bigr)^2+\bigl(y-\tfrac12\bigr)^2+\bigl(z-\tfrac12\bigr)^2=\tfrac34$
      uitwerking: |-
        Het zijn vier hoekpunten van de kubus met ribbe 1 en hoekpunt $O$. De bol door alle hoekpunten van die kubus heeft het centrum $\bigl(\tfrac12, \tfrac12, \tfrac12\bigr)$ als middelpunt en $r^2=\tfrac34$. Controle: $\tfrac14+\tfrac14+\tfrac14=\tfrac34$ voor elk van de vier punten.

- id: h1-o23
  soort: opdracht
  niveau: 3
  thema: |-
    drie bollen, bewijs
  opgave: |-
    Drie bollen hebben als middelpunt $A(-7, 2, 21)$, $B(3, -6, 22)$ en $C(3, 18, 14)$, en als straal 17, 18 en 18. Ze hebben twee gemeenschappelijke punten: $P(1, 2, 6)$ en $Q(5, 10, 30)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de middelpunten $A$, $B$ en $C$ in het vlak $x + 2y + 6z = 123$ liggen, en dat $Q$ het spiegelbeeld van $P$ is ten opzichte van dat vlak.
      antwoord: |-
        $A$, $B$, $C$ en het midden $(3, 6, 18)$ voldoen; $\overrightarrow{PQ}\parallel(1, 2, 6)$
      uitwerking: |-
        $-7+4+126=3-12+132=3+36+84=123$. Het midden van $[PQ]$ is $(3, 6, 18)$, en $3+12+108=123$. $\overrightarrow{PQ}=(4, 8, 24)=4(1, 2, 6)$ staat loodrecht op het vlak.
    - opgave: |-
        Toon in het algemeen aan: liggen twee punten op drie bollen waarvan de middelpunten niet op één rechte liggen, dan zijn ze elkaars spiegelbeeld ten opzichte van het vlak door de drie middelpunten.
      antwoord: |-
        beide liggen op de snijlijn van twee machtvlakken, die loodrecht staat op het vlak van de middelpunten
      uitwerking: |-
        Het machtvlak van twee bollen staat loodrecht op de verbindingslijn van hun middelpunten. De snijlijn $l$ van twee machtvlakken staat dus loodrecht op twee niet-evenwijdige vectoren in het vlak $\pi$ van de middelpunten: $l\perp\pi$. Spiegelen om $\pi$ verandert de afstand tot de middelpunten niet, dus het spiegelbeeld van een punt op de drie bollen ligt er ook op, en ook op $l$. Op $l$ liggen hoogstens twee punten van een bol: het spiegelbeeld van het ene is het andere (of het punt zelf, als het in $\pi$ ligt).

- id: h1-o24
  soort: opdracht
  niveau: 3
  thema: |-
    raaklijnen uit een punt, horizon
  opgave: |-
    Neem een bol met middelpunt $M$ en een punt $Q$ buiten de bol.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: een punt $P$ van de bol is het raakpunt van een raaklijn uit $Q$ als en slechts als $P$ op de bol met middellijn $[MQ]$ ligt.
      antwoord: |-
        $QP$ raakt in $P$ $\iff$ $\overrightarrow{PM}\cdot\overrightarrow{PQ}=0$ $\iff$ Thales
      uitwerking: |-
        De rechte $QP$ raakt in $P$ als ze in het raakvlak ligt, dus als ze loodrecht staat op $MP$. Volgens Thales in de ruimte is dat zo als en slechts als $P$ op de bol met middellijn $[MQ]$ ligt.
    - opgave: |-
        Besluit dat alle raakpunten op een cirkel liggen: de horizon vanuit $Q$.
      antwoord: |-
        de doorsnede van twee bollen
      uitwerking: |-
        De raakpunten liggen op twee bollen met verschillende middelpunten. Hun gemeenschappelijke punten liggen in het machtvlak, en vormen een cirkel.
    - opgave: |-
        Bepaal die cirkel voor de bol $x^2 + y^2 + z^2 = 9$ en $Q(0, 0, 5)$. Vergelijk met opdracht~\ref{oef:h1-o16}.
      antwoord: |-
        middelpunt $\bigl(0, 0, \tfrac95\bigr)$, straal $\tfrac{12}{5}$, in het vlak $z=\tfrac95$
      uitwerking: |-
        De bol met middellijn $[OQ]$: $x^2+y^2+z(z-5)=0$. Aftrekken van $x^2+y^2+z^2=9$: $5z=9$. Dan $\rho=\sqrt{9-\tfrac{81}{25}}=\tfrac{12}{5}$. De raakpunten met $z=\tfrac95$ en $|x|=\tfrac{12}{5}$ liggen op die cirkel.

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Een bol gaat door de punten $(1, 2, 2)$, $(4, 2, -1)$, $(1, -1, -1)$ en $(3, 4, 0)$. Vul ze in de algemene vergelijking in: dat geeft een stelsel van vier vergelijkingen in $D$, $E$, $F$ en $G$. Los het op met de methode van Gauss-Jordan, en bepaal het middelpunt en de straal.
  antwoord: |-
    $x^2+y^2+z^2-2x-4y+2z-3=0$; $M(1, 2, -1)$, $r=3$
  uitwerking: |-
    Het stelsel: $D+2E+2F+G=-9$, $4D+2E-F+G=-21$, $D-E-F+G=-3$ en $3D+4E+G=-25$. Gauss-Jordan op de uitgebreide matrix geeft $D=-2$, $E=-4$, $F=2$ en $G=-3$.\\
    $(x-1)^2+(y-2)^2+(z+1)^2=1+4+1+3=9$.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Integralen
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \fill[accent!25] (1,0) -- plot[domain=1:3,samples=30] (\x,{sqrt(9-(\x)^2)}) -- cycle;
        \fill[accent!25] (1,0) -- plot[domain=1:3,samples=30] (\x,{-sqrt(9-(\x)^2)}) -- cycle;
        \draw[->,lijngrijs] (-3.4,0) -- (3.7,0) node[right,text=black] {$x$};
        \draw[->,lijngrijs] (0,-3.3) -- (0,3.6) node[above,text=black] {$y$};
        \draw[accent,thick] (0,0) circle (3);
        \draw[grijs,dashed] (1,-2.83) -- (1,2.83);
        \draw[decorate,decoration={brace,amplitude=2pt}] (1,3.05) -- (3,3.05) node[midway,above=1pt] {$h$};
        \node[below left] at (3,0) {$r$};
      \end{tikzpicture}
  opgave: |-
    Een \textit{bolkap} met hoogte $h$ ontstaat als je het stuk van de cirkel $x^2 + y^2 = r^2$ met $x \geqslant r - h$ om de $x$-as wentelt.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het volume van de bolkap $\pi h^2\bigl(r - \tfrac h3\bigr)$ is.
      antwoord: |-
        $\pi\displaystyle\int_{r-h}^{r}(r^2-x^2)\dx=\pi h^2\bigl(r-\tfrac h3\bigr)$
      uitwerking: |-
        $V=\pi\displaystyle\int_{r-h}^{r}(r^2-x^2)\dx=\pi\Bigl[r^2x-\tfrac{x^3}{3}\Bigr]_{r-h}^{r}=\pi\Bigl(r^2h-\tfrac{r^3-(r-h)^3}{3}\Bigr)$. Met $r^3-(r-h)^3=3r^2h-3rh^2+h^3$ blijft $\pi\bigl(rh^2-\tfrac{h^3}{3}\bigr)$.
    - opgave: |-
        Controleer de formule voor $h = 2r$.
      antwoord: |-
        $\tfrac43\pi r^3$
      uitwerking: |-
        $\pi\cdot4r^2\bigl(r-\tfrac{2r}{3}\bigr)=\tfrac43\pi r^3$, het volume van de volle bol.
    - opgave: |-
        Een bolvormige vaas heeft een binnenstraal van 10 cm. Hoeveel water zit erin als het water 6 cm hoog staat?
      antwoord: |-
        $288\pi\approx905$ cm³
      uitwerking: |-
        $\pi\cdot36\cdot(10-2)=288\pi\approx904{,}8$ cm³, ongeveer 0,9 liter.

- id: h1-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Ruimtemeetkunde
  opgave: |-
    Een punt op de aarde (straal $R$) met breedte $\varphi$ en lengte $\lambda$ heeft de coördinaten $(R\cos\varphi\cos\lambda,\ R\cos\varphi\sin\lambda,\ R\sin\varphi)$; in hoofdstuk 2 zie je waarom. Brussel ligt op $50{,}85^\circ$ N en $4{,}35^\circ$ O, New York op $40{,}71^\circ$ N en $74{,}01^\circ$ W (dus $\lambda = -74{,}01^\circ$). Het kortste pad over het aardoppervlak volgt de grootcirkel door beide steden.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken met het scalair product de hoek $\theta$ tussen de vectoren van het middelpunt van de aarde naar beide steden.
      antwoord: |-
        $\theta\approx52{,}96^\circ$
      uitwerking: |-
        $\cos\theta=\cos\varphi_1\cos\varphi_2\cos(\lambda_1-\lambda_2)+\sin\varphi_1\sin\varphi_2\approx0{,}6022$, want de lengtes $R$ vallen weg.
    - opgave: |-
        Hoe lang is de vlucht langs de grootcirkel, met $R = 6371$ km?
      antwoord: |-
        ongeveer 5890 km
      uitwerking: |-
        De booglengte is $R\theta$ met $\theta$ in radialen: $6371\cdot0{,}9243\approx5889$ km.

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Geef een vergelijking van de bol met middelpunt $(-1, 2, 0)$ door het punt $(1, 1, 2)$.
  antwoord: |-
    $(x+1)^2+(y-2)^2+z^2=9$
  uitwerking: |-
    $r^2=4+1+4=9$.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Bepaal het middelpunt en de straal van $x^2 + y^2 + z^2 + 4x - 2y - 6z + 5 = 0$.
  antwoord: |-
    $M(-2, 1, 3)$, $r=3$
  uitwerking: |-
    $(x+2)^2+(y-1)^2+(z-3)^2=4+1+9-5=9$.

- id: h1-t3
  soort: test
  niveau: 2
  opgave: |-
    Bepaal het middelpunt en de straal van de doorsnede van de bol $x^2 + y^2 + z^2 = 25$ met het vlak $x + 2y + 2z = 9$.
  antwoord: |-
    middelpunt $(1, 2, 2)$, straal 4
  uitwerking: |-
    $d=\tfrac93=3$, $\rho=\sqrt{25-9}=4$. Voetpunt $t(1, 2, 2)$ met $9t=9$.

- id: h1-t4
  soort: test
  niveau: 1
  opgave: |-
    Bepaal het raakvlak in $(1, -3, 1)$ aan de bol $(x - 1)^2 + (y + 1)^2 + z^2 = 5$.
  antwoord: |-
    $-2y+z=7$
  uitwerking: |-
    $0+4+1=5$ klopt. Ontdubbelen: $0\cdot(x-1)-2(y+1)+z=5$, dus $-2y+z=7$.

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    Bepaal de snijpunten van de rechte $x = 3 - t,\ y = -2 + t,\ z = 2$ met de bol $x^2 + y^2 + z^2 = 9$.
  antwoord: |-
    $(2, -1, 2)$ en $(-1, 2, 2)$
  uitwerking: |-
    $(3-t)^2+(t-2)^2+4=9$ geeft $2t^2-10t+8=0$, dus $t=1$ of $t=4$.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Bepaal het machtvlak van de bollen $x^2 + y^2 + z^2 = 9$ en $(x - 2)^2 + (y - 1)^2 + (z + 2)^2 = 6$, en de straal van hun snijcirkel.
  antwoord: |-
    $2x+y-2z=6$; straal $\sqrt5$
  uitwerking: |-
    De tweede: $x^2+y^2+z^2-4x-2y+4z+3=0$. Aftrekken: $4x+2y-4z-3=9$, dus $2x+y-2z=6$. $d=2$ en $\rho=\sqrt{9-4}=\sqrt5$.

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Geef een vergelijking van de bol met middelpunt $(1, 0, -2)$ die het vlak $2x - y + 2z = 7$ raakt, en bepaal het raakpunt.
  antwoord: |-
    $(x-1)^2+y^2+(z+2)^2=9$; raakpunt $(3, -1, 0)$
  uitwerking: |-
    $r=\dfrac{|2-0-4-7|}{3}=3$. Loodlijn $(1+2t, -t, -2+2t)$: $-2+9t=7$, dus $t=1$.
