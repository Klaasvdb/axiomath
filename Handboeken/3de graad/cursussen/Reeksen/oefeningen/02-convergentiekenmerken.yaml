# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\int_1^{+\infty} \frac{1}{x^2}\dx$
      antwoord: |-
        1
      uitwerking: |-
        $\displaystyle\lim_{b\to+\infty} \Bigl(1 - \frac1b\Bigr) = 1$.
    - opgave: |-
        $\displaystyle\int_1^{+\infty} \frac{1}{x}\dx$
      antwoord: |-
        divergent
      uitwerking: |-
        $\displaystyle\lim_{b\to+\infty} \ln b = +\infty$.
    - opgave: |-
        $\displaystyle\frac{(n+1)!}{n!}$
      antwoord: |-
        $n + 1$
      uitwerking: |-
        $(n+1)! = (n+1) \cdot n!$.
    - opgave: |-
        $\displaystyle\frac{3^{n+1}}{n+1} \cdot \frac{n}{3^n}$
      antwoord: |-
        $\tfrac{3n}{n+1}$
      uitwerking: |-
        $\tfrac{3^{n+1}}{3^n} = 3$.
    - opgave: |-
        $\displaystyle\lim_{n\to+\infty} \Bigl(\frac{n}{n+1}\Bigr)^2$
      antwoord: |-
        1
      uitwerking: |-
        $\tfrac{n}{n+1} \to 1$.
    - opgave: |-
        $\sqrt[n]{5^n}$
      antwoord: |-
        5
      uitwerking: |-
        $(5^n)^{1/n} = 5$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Bestaat de som $1 + \tfrac14 + \tfrac19 + \cdots$? Vergelijk met een reeks die je kunt uitrekenen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{1}{n^2} < \dfrac{1}{n(n-1)}$ voor $n \geqslant 2$.
      antwoord: |-
        $n^2 > n(n-1)$
      uitwerking: |-
        $n(n-1) = n^2 - n < n^2$, en een kleinere positieve noemer geeft een grotere breuk.
    - opgave: |-
        Bereken $\dfrac{1}{2 \cdot 1} + \dfrac{1}{3 \cdot 2} + \cdots + \dfrac{1}{N(N-1)}$. Splits elke breuk zoals in hoofdstuk 1.
      antwoord: |-
        $1 - \tfrac1N$
      uitwerking: |-
        $\dfrac{1}{n(n-1)} = \dfrac{1}{n-1} - \dfrac1n$: de som telescopeert tot $1 - \tfrac1N$.
    - opgave: |-
        Toon aan dat $1 + \tfrac14 + \cdots + \tfrac1{N^2} < 2$ voor elke $N$.
      antwoord: |-
        $< 1 + \bigl(1 - \tfrac1N\bigr)$
      uitwerking: |-
        De eerste term is 1, de andere zijn samen kleiner dan $1 - \tfrac1N < 1$.
    - opgave: |-
        Waarom bestaat de som dan? Gebruik een stelling uit de cursus Rijen.
      antwoord: |-
        stijgend en begrensd
      uitwerking: |-
        Alle termen zijn positief, dus de partieelsommen stijgen. Ze zijn naar boven begrensd door 2, dus ze convergeren.

- id: h2-verg
  soort: kort
  opgave: |-
    Convergent of divergent? Gebruik het vergelijkingskenmerk.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{n^3 + n}$
      antwoord: |-
        convergent
      uitwerking: |-
        $\tfrac{1}{n^3 + n} \leqslant \tfrac{1}{n^3}$, en $\sum \tfrac1{n^3}$ convergeert (hyperharmonisch, of zoals $\sum \tfrac1{n^2}$).
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n + 1}{n^2}$
      antwoord: |-
        divergent
      uitwerking: |-
        $\tfrac{n+1}{n^2} \geqslant \tfrac{n}{n^2} = \tfrac1n$, en de harmonische reeks divergeert.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{|\cos n|}{2^n}$
      antwoord: |-
        convergent
      uitwerking: |-
        $0 \leqslant \tfrac{|\cos n|}{2^n} \leqslant \tfrac{1}{2^n}$, een convergente meetkundige reeks.

- id: h2-limverg
  soort: kort
  opgave: |-
    Convergent of divergent? Gebruik het limietvergelijkingskenmerk.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n + 2}{n^3 - n + 1}$
      antwoord: |-
        convergent
      uitwerking: |-
        Vergelijk met $\tfrac1{n^2}$: $\dfrac{n^3 + 2n^2}{n^3 - n + 1} \to 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{3n - 1}$
      antwoord: |-
        divergent
      uitwerking: |-
        Vergelijk met $\tfrac1n$: $\dfrac{n}{3n - 1} \to \tfrac13$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{\sqrt n}{n + 4}$
      antwoord: |-
        divergent
      uitwerking: |-
        Vergelijk met $\tfrac1{\sqrt n}$: $\dfrac{\sqrt n \cdot \sqrt n}{n + 4} = \dfrac{n}{n + 4} \to 1$, en $\sum \tfrac{1}{\sqrt n}$ divergeert.

- id: h2-int
  soort: kort
  opgave: |-
    Onderzoek met het integraalkenmerk.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{(2n+1)^2}$
      antwoord: |-
        convergent
      uitwerking: |-
        $\displaystyle\int_1^{+\infty} \frac{\mathrm{d}x}{(2x+1)^2} = \lim_{b\to+\infty} \Bigl(\frac16 - \frac{1}{2(2b+1)}\Bigr) = \frac16$.
    - opgave: |-
        $\displaystyle\sominf{n=1} n\,\e^{-n^2}$
      antwoord: |-
        convergent
      uitwerking: |-
        $f(x) = x\e^{-x^2}$ daalt voor $x \geqslant 1$ (want $f'(x) = (1 - 2x^2)\e^{-x^2} < 0$). $\displaystyle\int_1^{+\infty} x\e^{-x^2}\dx = \lim_{b\to+\infty} \tfrac12\bigl(\e^{-1} - \e^{-b^2}\bigr) = \frac{1}{2\e}$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{n + 2}$
      antwoord: |-
        divergent
      uitwerking: |-
        $\displaystyle\int_1^{b} \frac{\mathrm{d}x}{x + 2} = \ln(b + 2) - \ln 3 \to +\infty$.

- id: h2-hyper
  soort: kort
  opgave: |-
    Convergent of divergent?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{n^2\sqrt n}$
      antwoord: |-
        convergent
      uitwerking: |-
        $p = \tfrac52 > 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{\sqrt[4]{n}}{n}$
      antwoord: |-
        divergent
      uitwerking: |-
        $\tfrac{n^{1/4}}{n} = \tfrac{1}{n^{3/4}}$, $p = \tfrac34 \leqslant 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} n^{-1{,}1}$
      antwoord: |-
        convergent
      uitwerking: |-
        $p = 1{,}1 > 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n}{n^{1{,}9}}$
      antwoord: |-
        divergent
      uitwerking: |-
        $\tfrac{n}{n^{1{,}9}} = \tfrac{1}{n^{0{,}9}}$, $p = 0{,}9 \leqslant 1$.

- id: h2-rest
  soort: kort
  opgave: |-
    Neem de reeks $\displaystyle\sominf{n=1} \frac{1}{n^4}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de rest na $N$ termen hoogstens $\dfrac{1}{3N^3}$ is.
      antwoord: |-
        $\int_N^{+\infty} x^{-4}\dx$
      uitwerking: |-
        $\displaystyle\int_N^{+\infty} \frac{\mathrm{d}x}{x^4} = \lim_{b\to+\infty} \Bigl(\frac{1}{3N^3} - \frac{1}{3b^3}\Bigr) = \frac{1}{3N^3}$.
    - opgave: |-
        Hoeveel termen volstaan voor een fout kleiner dan $0{,}0001$?
      antwoord: |-
        15
      uitwerking: |-
        $\tfrac{1}{3N^3} \leqslant 0{,}0001 \iff N^3 \geqslant 3333{,}3$. $14^3 = 2744$ is te weinig, $15^3 = 3375$ volstaat.

- id: h2-quot
  soort: kort
  opgave: |-
    Onderzoek met het quotiëntkenmerk.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n}{4^n}$
      antwoord: |-
        $L = \tfrac14$, convergent
      uitwerking: |-
        $\dfrac{u_{n+1}}{u_n} = \dfrac{n+1}{4n} \to \tfrac14$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{2^n}{n^2}$
      antwoord: |-
        $L = 2$, divergent
      uitwerking: |-
        $\dfrac{u_{n+1}}{u_n} = 2 \cdot \dfrac{n^2}{(n+1)^2} \to 2$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n!}{3^n}$
      antwoord: |-
        $L = +\infty$, divergent
      uitwerking: |-
        $\dfrac{u_{n+1}}{u_n} = \dfrac{n+1}{3} \to +\infty$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{10^n}{n!}$
      antwoord: |-
        $L = 0$, convergent
      uitwerking: |-
        $\dfrac{u_{n+1}}{u_n} = \dfrac{10}{n+1} \to 0$.

- id: h2-wortel
  soort: kort
  opgave: |-
    Onderzoek met het wortelkenmerk.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac{3n + 2}{5n}\Bigr)^n$
      antwoord: |-
        $L = \tfrac35$, convergent
      uitwerking: |-
        $\sqrt[n]{u_n} = \tfrac{3n+2}{5n} \to \tfrac35$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(2 + \frac1n\Bigr)^n$
      antwoord: |-
        $L = 2$, divergent
      uitwerking: |-
        $\sqrt[n]{u_n} = 2 + \tfrac1n \to 2$. (De termen gaan ook niet naar 0.)
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{\bigl(\ln(n+1)\bigr)^n}$
      antwoord: |-
        $L = 0$, convergent
      uitwerking: |-
        $\sqrt[n]{u_n} = \tfrac{1}{\ln(n+1)} \to 0$.

- id: h2-leib
  soort: kort
  opgave: |-
    Onderzoek de alternerende reeks.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $1 - \tfrac13 + \tfrac15 - \tfrac17 + \cdots$ convergeert. Hoeveel termen geven een fout kleiner dan $0{,}01$?
      antwoord: |-
        convergent; 50 termen
      uitwerking: |-
        $u_n = \tfrac{1}{2n-1}$ is positief, dalend en gaat naar 0. De fout is hoogstens $\tfrac{1}{2n+1} \leqslant 0{,}01 \iff 2n + 1 \geqslant 100 \iff n \geqslant 49{,}5$. (In hoofdstuk 3 blijkt de som $\tfrac\pi4$.)
    - opgave: |-
        Convergeert $\displaystyle\sominf{n=1} (-1)^{n+1} \frac{n}{n+1}$?
      antwoord: |-
        nee
      uitwerking: |-
        De termen gaan niet naar 0: $\tfrac{n}{n+1} \to 1$. De voorwaarde $u_n \to 0$ van Leibniz ontbreekt, en de test met de termen geeft divergentie.

- id: h2-abs
  soort: kort
  opgave: |-
    Absoluut convergent, voorwaardelijk convergent of divergent?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{(-1)^n}{n^2 + 1}$
      antwoord: |-
        absoluut convergent
      uitwerking: |-
        $\tfrac{1}{n^2 + 1} \leqslant \tfrac1{n^2}$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{(-1)^n}{2n + 3}$
      antwoord: |-
        voorwaardelijk convergent
      uitwerking: |-
        Leibniz: $\tfrac{1}{2n+3}$ daalt naar 0. Maar $\sum \tfrac{1}{2n+3}$ divergeert (limietvergelijking met $\tfrac1n$, $L = \tfrac12$).
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{\cos(n\pi/3)}{n^2}$
      antwoord: |-
        absoluut convergent
      uitwerking: |-
        $\bigl|\tfrac{\cos(n\pi/3)}{n^2}\bigr| \leqslant \tfrac{1}{n^2}$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    hyperharmonische reeks
  opgave: |-
    Convergent of divergent?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{n^3}$
      antwoord: |-
        convergent
      uitwerking: |-
        $p = 3 > 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{\sqrt n}$
      antwoord: |-
        divergent
      uitwerking: |-
        $p = \tfrac12$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{n^{1{,}01}}$
      antwoord: |-
        convergent
      uitwerking: |-
        $p = 1{,}01 > 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} n^{-0{,}9}$
      antwoord: |-
        divergent
      uitwerking: |-
        $p = 0{,}9$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{n\sqrt n}$
      antwoord: |-
        convergent
      uitwerking: |-
        $p = \tfrac32$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{\sqrt[3]{n^2}}$
      antwoord: |-
        divergent
      uitwerking: |-
        $p = \tfrac23$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    quotiëntkenmerk
  opgave: |-
    Onderzoek met het quotiëntkenmerk.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n}{3^n}$
      antwoord: |-
        $L = \tfrac13$, convergent
      uitwerking: |-
        $\dfrac{n+1}{3n} \to \tfrac13$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{2^n}{n!}$
      antwoord: |-
        $L = 0$, convergent
      uitwerking: |-
        $\dfrac{2}{n+1} \to 0$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n!}{10^n}$
      antwoord: |-
        $L = +\infty$, divergent
      uitwerking: |-
        $\dfrac{n+1}{10} \to +\infty$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n^3}{2^n}$
      antwoord: |-
        $L = \tfrac12$, convergent
      uitwerking: |-
        $\dfrac12\Bigl(\dfrac{n+1}{n}\Bigr)^3 \to \tfrac12$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{3^n}{n \cdot 2^n}$
      antwoord: |-
        $L = \tfrac32$, divergent
      uitwerking: |-
        $\dfrac32 \cdot \dfrac{n}{n+1} \to \tfrac32$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{(n!)^2}{(2n)!}$
      antwoord: |-
        $L = \tfrac14$, convergent
      uitwerking: |-
        $\dfrac{(n+1)^2}{(2n+2)(2n+1)} = \dfrac{n+1}{2(2n+1)} \to \tfrac14$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijkingskenmerk
  opgave: |-
    Onderzoek met het vergelijkingskenmerk.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{n^2 + 3}$
      antwoord: |-
        convergent
      uitwerking: |-
        $\leqslant \tfrac{1}{n^2}$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{3^n + 1}$
      antwoord: |-
        convergent
      uitwerking: |-
        $\leqslant \tfrac{1}{3^n}$, meetkundig.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{\sin^2 n}{n^2}$
      antwoord: |-
        convergent
      uitwerking: |-
        $0 \leqslant \tfrac{\sin^2 n}{n^2} \leqslant \tfrac{1}{n^2}$.
    - opgave: |-
        $\displaystyle\sominf{n=2} \frac{1}{\ln n}$
      antwoord: |-
        divergent
      uitwerking: |-
        $\ln n < n$, dus $\tfrac{1}{\ln n} > \tfrac1n$, en de harmonische reeks divergeert.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{2 + \cos n}{n}$
      antwoord: |-
        divergent
      uitwerking: |-
        $2 + \cos n \geqslant 1$, dus de term is minstens $\tfrac1n$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    kenmerk van Leibniz
  opgave: |-
    Convergeert de reeks? Ga de voorwaarden van Leibniz na.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{(-1)^n}{2n + 1}$
      antwoord: |-
        convergent
      uitwerking: |-
        $\tfrac{1}{2n+1}$ is positief, dalend en gaat naar 0.
    - opgave: |-
        $\displaystyle\sominf{n=1} (-1)^n \frac{n}{n + 1}$
      antwoord: |-
        divergent
      uitwerking: |-
        De termen gaan niet naar 0: $\tfrac{n}{n+1} \to 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{(-1)^n}{\ln(n + 1)}$
      antwoord: |-
        convergent
      uitwerking: |-
        $\ln(n+1)$ stijgt naar $+\infty$, dus $\tfrac{1}{\ln(n+1)}$ daalt naar 0.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{(-1)^{n+1}}{n^2 + 1}$
      antwoord: |-
        convergent
      uitwerking: |-
        $\tfrac{1}{n^2 + 1}$ daalt naar 0. (Ze is zelfs absoluut convergent.)

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    wortelkenmerk
  opgave: |-
    Onderzoek met het wortelkenmerk.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac{2n}{3n + 1}\Bigr)^n$
      antwoord: |-
        $L = \tfrac23$, convergent
      uitwerking: |-
        $\sqrt[n]{u_n} = \tfrac{2n}{3n+1} \to \tfrac23$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac{n}{n + 1}\Bigr)^{n^2}$
      antwoord: |-
        $L = \tfrac1\e$, convergent
      uitwerking: |-
        $\sqrt[n]{u_n} = \Bigl(\dfrac{n}{n+1}\Bigr)^n = \dfrac{1}{(1 + 1/n)^n} \to \dfrac1\e < 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n^n}{3^{n^2}}$
      antwoord: |-
        $L = 0$, convergent
      uitwerking: |-
        $\sqrt[n]{u_n} = \tfrac{n}{3^n} \to 0$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(1 + \frac1n\Bigr)^{n^2}$
      antwoord: |-
        $L = \e$, divergent
      uitwerking: |-
        $\sqrt[n]{u_n} = \bigl(1 + \tfrac1n\bigr)^n \to \e > 1$.

- id: h2-o6
  soort: opdracht
  niveau: 2
  thema: |-
    limietvergelijkingskenmerk
  opgave: |-
    Onderzoek met het limietvergelijkingskenmerk. Zeg telkens met welke reeks je vergelijkt.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n + 1}{n^3 + 2}$
      antwoord: |-
        convergent
      uitwerking: |-
        Met $\tfrac1{n^2}$: $L = 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{2n + 1}{n^2 + 5}$
      antwoord: |-
        divergent
      uitwerking: |-
        Met $\tfrac1n$: $L = 2$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{\sqrt n}{n^2 + 1}$
      antwoord: |-
        convergent
      uitwerking: |-
        Met $\tfrac{1}{n^{3/2}}$: $\dfrac{n^2}{n^2 + 1} \to 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{\sqrt{n^2 + n}}$
      antwoord: |-
        divergent
      uitwerking: |-
        Met $\tfrac1n$: $\dfrac{n}{\sqrt{n^2 + n}} = \dfrac{1}{\sqrt{1 + 1/n}} \to 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{3n^2 - 1}{n^4 + n}$
      antwoord: |-
        convergent
      uitwerking: |-
        Met $\tfrac{1}{n^2}$: $L = 3$.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    kenmerk kiezen
  opgave: |-
    Convergent of divergent? Kies zelf een kenmerk.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n^2}{2^n}$
      antwoord: |-
        convergent
      uitwerking: |-
        Quotiëntkenmerk: $L = \tfrac12$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n}{n^2 + 1}$
      antwoord: |-
        divergent
      uitwerking: |-
        Limietvergelijking met $\tfrac1n$: $L = 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{(-1)^n}{n^3}$
      antwoord: |-
        convergent
      uitwerking: |-
        Absoluut convergent: $\sum \tfrac1{n^3}$ convergeert.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n^{100}}{1{,}01^n}$
      antwoord: |-
        convergent
      uitwerking: |-
        Quotiëntkenmerk: $\dfrac{1}{1{,}01}\Bigl(\dfrac{n+1}{n}\Bigr)^{100} \to \dfrac{1}{1{,}01} < 1$. De eerste termen zijn wel gigantisch.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n!}{n^n}$
      antwoord: |-
        convergent
      uitwerking: |-
        Quotiëntkenmerk: $\dfrac{(n+1)!}{(n+1)^{n+1}} \cdot \dfrac{n^n}{n!} = \Bigl(\dfrac{n}{n+1}\Bigr)^n \to \dfrac1\e$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(1 + \frac1n\Bigr)^n$
      antwoord: |-
        divergent
      uitwerking: |-
        De termen gaan naar $\e \neq 0$.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    rest afschatten
  opgave: |-
    Neem de reeks $\displaystyle\sominf{n=1} \frac{1}{n^3}$, met som $S$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{1}{2(N+1)^2} \leqslant S - s_N \leqslant \dfrac{1}{2N^2}$.
      antwoord: |-
        $\int_N^{+\infty} x^{-3}\dx = \tfrac{1}{2N^2}$
      uitwerking: |-
        $\displaystyle\int_N^{+\infty} \frac{\mathrm{d}x}{x^3} = \lim_{b\to+\infty} \Bigl(\frac{1}{2N^2} - \frac{1}{2b^2}\Bigr) = \frac{1}{2N^2}$, en zo ook met $N + 1$.
    - opgave: |-
        Met een rekentoestel is $s_{10} \approx 1{,}197\,532$. Tussen welke grenzen ligt $S$?
      antwoord: |-
        $1{,}201\,664 \leqslant S \leqslant 1{,}202\,532$
      uitwerking: |-
        $s_{10} + \tfrac{1}{242}$ en $s_{10} + \tfrac{1}{200}$. (De som is $1{,}202\,057\ldots$)
    - opgave: |-
        Hoeveel termen heb je nodig opdat $s_N$ zelf hoogstens $10^{-6}$ van $S$ afwijkt?
      antwoord: |-
        708
      uitwerking: |-
        $\tfrac{1}{2N^2} \leqslant 10^{-6} \iff N^2 \geqslant 500\,000 \iff N \geqslant 707{,}1$.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    absolute en voorwaardelijke convergentie
  opgave: |-
    Absoluut convergent, voorwaardelijk convergent of divergent?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{(-1)^n}{n}$
      antwoord: |-
        voorwaardelijk
      uitwerking: |-
        Leibniz, maar $\sum \tfrac1n$ divergeert.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{(-1)^n}{n^2}$
      antwoord: |-
        absoluut
      uitwerking: |-
        $\sum \tfrac1{n^2}$ convergeert.
    - opgave: |-
        $\displaystyle\sominf{n=1} (-1)^n \frac{n}{n^2 + 1}$
      antwoord: |-
        voorwaardelijk
      uitwerking: |-
        $f(x) = \tfrac{x}{x^2 + 1}$ daalt voor $x \geqslant 1$ (want $f'(x) = \tfrac{1 - x^2}{(x^2+1)^2}$) en gaat naar 0: Leibniz. De absolute waarden gedragen zich als $\tfrac1n$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{\cos n}{2^n}$
      antwoord: |-
        absoluut
      uitwerking: |-
        $\bigl|\tfrac{\cos n}{2^n}\bigr| \leqslant \tfrac{1}{2^n}$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{(-2)^n}{n!}$
      antwoord: |-
        absoluut
      uitwerking: |-
        Quotiëntkenmerk op $\tfrac{2^n}{n!}$: $L = 0$.
    - opgave: |-
        $\displaystyle\sominf{n=1} (-1)^n \frac{2^n}{n^2}$
      antwoord: |-
        divergent
      uitwerking: |-
        $\tfrac{2^n}{n^2} \to +\infty$: de termen gaan niet naar 0.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    harmonische reeks en integraal
  opgave: |-
    Gebruik $\ln(n+1) \leqslant s_n \leqslant 1 + \ln n$ voor de partieelsommen van de harmonische reeks (voorbeeld \ref{vb:h2-ln}).
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel termen heb je minstens nodig om boven 100 te komen?
      antwoord: |-
        meer dan $\e^{99} \approx 9{,}9 \cdot 10^{42}$
      uitwerking: |-
        $s_n > 100$ vraagt $1 + \ln n > 100$, dus $n > \e^{99}$.
    - opgave: |-
        Bij de boeken uit hoofdstuk 1 moet $s_n \geqslant 10$ zijn. Tussen welke grenzen ligt het nodige aantal boeken? Klopt dat met de 12\,367 boeken uit voorbeeld \ref{vb:h1-terug}?
      antwoord: |-
        tussen 8104 en 22\,026; ja
      uitwerking: |-
        Nodig: $1 + \ln n \geqslant 10$, dus $n \geqslant \e^9 \approx 8103{,}1$. Voldoende: $\ln(n+1) \geqslant 10$, dus $n \geqslant \e^{10} - 1 \approx 22\,025{,}5$.
    - opgave: |-
        Een slak kruipt de eerste minuut 1 m, de tweede $\tfrac12$ m, de $n$-de $\tfrac1n$ m. Hoe ver is ze na een dag, ongeveer?
      antwoord: |-
        tussen $7{,}27$ en $8{,}27$ m
      uitwerking: |-
        Een dag is 1440 minuten: $\ln 1441 \approx 7{,}27 \leqslant s_{1440} \leqslant 1 + \ln 1440 \approx 8{,}27$. (In werkelijkheid $7{,}85$ m.)

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    kenmerk van Leibniz, foutafschatting
  opgave: |-
    Neem de reeks $1 - \tfrac14 + \tfrac19 - \tfrac1{16} + \cdots$
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel termen heb je nodig voor een fout kleiner dan $0{,}001$?
      antwoord: |-
        31
      uitwerking: |-
        $\tfrac{1}{(n+1)^2} \leqslant 0{,}001 \iff (n+1)^2 \geqslant 1000 \iff n + 1 \geqslant 31{,}6$.
    - opgave: |-
        Bereken $s_4$ en $s_5$. Tussen welke grenzen ligt de som?
      antwoord: |-
        $0{,}7986 \leqslant S \leqslant 0{,}8386$
      uitwerking: |-
        $s_4 = \tfrac{115}{144} \approx 0{,}7986$ en $s_5 = s_4 + \tfrac{1}{25} \approx 0{,}8386$. De som ligt tussen twee opeenvolgende partieelsommen. (Ze is $\tfrac{\pi^2}{12} \approx 0{,}8225$.)

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    alternerende reeks, context
  figuur:
    code: |-
      \begin{tikzpicture}[x=3.6cm,y=.3cm,font=\scriptsize]
        \draw[grijs,thick] (-.05,0) -- (1.08,0);
        \foreach \x/\t in {0/0,.5/{0{,}5},1/1}{\draw[grijs] (\x,.25) -- (\x,-.25) node[below] {$\t$};}
        \draw[->,accent,thick] (0,1) -- (1,1);
        \draw[->,accent,thick] (1,1.8) -- (.5,1.8);
        \draw[->,accent,thick] (.5,2.6) -- (.8333,2.6);
        \draw[->,accent,thick] (.8333,3.4) -- (.5833,3.4);
        \draw[->,accent,thick] (.5833,4.2) -- (.7833,4.2);
        \draw[grijs,dashed] (.6931,0) -- (.6931,4.8);
      \end{tikzpicture}
  opgave: |-
    Een wandelaar stapt 1 km naar het oosten, dan $\tfrac12$ km naar het westen, dan $\tfrac13$ km naar het oosten, en zo verder.
  lijst: enumerate
  delen:
    - opgave: |-
        Komt de wandelaar ergens aan? Leg uit.
      antwoord: |-
        ja, volgens Leibniz
      uitwerking: |-
        Zijn positie is de partieelsom van $1 - \tfrac12 + \tfrac13 - \cdots$, en die reeks convergeert.
    - opgave: |-
        Bereken zijn positie na 4 en na 5 stappen. Tussen welke grenzen ligt het eindpunt?
      antwoord: |-
        tussen $\tfrac7{12}$ en $\tfrac{47}{60}$ km
      uitwerking: |-
        $s_4 = 1 - \tfrac12 + \tfrac13 - \tfrac14 = \tfrac7{12} \approx 0{,}583$ en $s_5 = \tfrac{47}{60} \approx 0{,}783$. (Het eindpunt ligt op $\ln 2 \approx 0{,}693$ km.)
    - opgave: |-
        Hoeveel kilometer stapt hij in totaal?
      antwoord: |-
        oneindig veel
      uitwerking: |-
        De afgelegde weg is $1 + \tfrac12 + \tfrac13 + \cdots$, de harmonische reeks. Hij komt aan op een eindige afstand, na een oneindig lange wandeling.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    reeksen met een parameter
  opgave: |-
    Voor welke $p > 0$ convergeert de reeks?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{n^{2p}}$
      antwoord: |-
        $p > \tfrac12$
      uitwerking: |-
        Hyperharmonisch met exponent $2p > 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{p^n}{n}$
      antwoord: |-
        $0 < p < 1$
      uitwerking: |-
        Quotiëntkenmerk: $p \cdot \tfrac{n}{n+1} \to p$. Bij $p = 1$ is het de harmonische reeks: divergent.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n^p}{2^n}$
      antwoord: |-
        voor elke $p$
      uitwerking: |-
        Quotiëntkenmerk: $\tfrac12\bigl(\tfrac{n+1}{n}\bigr)^p \to \tfrac12$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{(-1)^n}{n^p}$
      antwoord: |-
        voor elke $p > 0$; absoluut als $p > 1$
      uitwerking: |-
        Leibniz: $\tfrac{1}{n^p}$ daalt naar 0. De absolute waarden vormen een hyperharmonische reeks.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    rest afschatten, reeks van Mengoli
  opgave: |-
    Schat de som van Mengoli $\sominf{n=1} \tfrac1{n^2}$ met maar 10 termen.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $s_{10}$ met je rekentoestel.
      antwoord: |-
        $1{,}549\,768$
      uitwerking: |-
        $1 + \tfrac14 + \cdots + \tfrac1{100} \approx 1{,}549\,768$.
    - opgave: |-
        Gebruik $\tfrac{1}{N+1} \leqslant S - s_N \leqslant \tfrac1N$ voor een onder- en een bovengrens van $S$.
      antwoord: |-
        $1{,}640\,677 \leqslant S \leqslant 1{,}649\,768$
      uitwerking: |-
        $s_{10} + \tfrac1{11}$ en $s_{10} + \tfrac1{10}$.
    - opgave: |-
        Neem het midden van die grenzen als schatting. Hoe ver ligt het van $\tfrac{\pi^2}{6}$?
      antwoord: |-
        $1{,}645\,222$; $0{,}000\,29$
      uitwerking: |-
        $\tfrac{\pi^2}{6} \approx 1{,}644\,934$. Met 10 termen al drie juiste decimalen, tegenover één voor $s_{10}$ zelf.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    kenmerk van Leibniz, foutafschatting
  opgave: |-
    Neem de reeks $\displaystyle\sominf{n=1} \frac{(-1)^{n+1}}{n!} = 1 - \frac12 + \frac16 - \frac1{24} + \cdots$
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel termen heb je nodig om de som tot op $0{,}000\,05$ te kennen?
      antwoord: |-
        7
      uitwerking: |-
        $\tfrac{1}{(n+1)!} \leqslant 0{,}000\,05 \iff (n+1)! \geqslant 20\,000$. $7! = 5040$ is te weinig, $8! = 40\,320$ volstaat: $n + 1 = 8$.
    - opgave: |-
        Bereken die partieelsom.
      antwoord: |-
        $0{,}632\,14$
      uitwerking: |-
        $s_7 = 1 - \tfrac12 + \tfrac16 - \tfrac1{24} + \tfrac1{120} - \tfrac1{720} + \tfrac1{5040} \approx 0{,}632\,143$. (De som is $1 - \tfrac1\e \approx 0{,}632\,121$, zie hoofdstuk 3.)

- id: h2-o16
  soort: opdracht
  niveau: 3
  thema: |-
    voorwaardelijke convergentie, herschikken
  opgave: |-
    Noem $S = 1 - \tfrac12 + \tfrac13 - \tfrac14 + \cdots$ Herschik de termen: na elke positieve term komen er twee negatieve.
    \[ 1 - \frac12 - \frac14 + \frac13 - \frac16 - \frac18 + \frac15 - \frac1{10} - \frac1{12} + \cdots \]
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat elk groepje van drie termen $\dfrac{1}{2k-1} - \dfrac{1}{4k-2} - \dfrac{1}{4k}$ gelijk is aan $\dfrac12\Bigl(\dfrac{1}{2k-1} - \dfrac{1}{2k}\Bigr)$.
      antwoord: |-
        $\tfrac{1}{2k-1} - \tfrac{1}{4k-2} = \tfrac{1}{4k-2}$
      uitwerking: |-
        $\dfrac{1}{2k-1} - \dfrac{1}{2(2k-1)} = \dfrac{1}{2(2k-1)}$, en $\dfrac{1}{2(2k-1)} - \dfrac{1}{4k} = \dfrac12\Bigl(\dfrac{1}{2k-1} - \dfrac{1}{2k}\Bigr)$.
    - opgave: |-
        Wat is de som van de herschikte reeks?
      antwoord: |-
        $\tfrac12 S$
      uitwerking: |-
        De partieelsom na $m$ groepjes is $\tfrac12 s_{2m}$, en dat gaat naar $\tfrac12 S$. De andere partieelsommen verschillen daarvan hoogstens een term, en de termen gaan naar 0.
    - opgave: |-
        Dezelfde termen, een andere volgorde, en een andere som. Waarom kan dat niet bij een absoluut convergente reeks, zoals $1 - \tfrac14 + \tfrac19 - \cdots$?
      antwoord: |-
        de positieve en de negatieve termen convergeren apart
      uitwerking: |-
        Bij een absoluut convergente reeks hebben de positieve termen samen een eindige som, en de negatieve ook. Elke herschikking telt uiteindelijk dezelfde positieve en dezelfde negatieve termen op, met dezelfde sommen. Bij de alternerende harmonische reeks divergeren beide delen, en dan hangt het resultaat af van hoe snel je ze afwisselt. Riemann bewees zelfs dat je zo elke som kunt krijgen.

- id: h2-o17
  soort: opdracht
  niveau: 3
  thema: |-
    integraalkenmerk
  opgave: |-
    Onderzoek met het integraalkenmerk. Stel $u = \ln x$.
  lijst: enumerate
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=2} \frac{1}{n \ln n}$
      antwoord: |-
        divergent
      uitwerking: |-
        $\displaystyle\int_2^{b} \frac{\mathrm{d}x}{x \ln x} = \ln(\ln b) - \ln(\ln 2) \to +\infty$. Nog trager dan de harmonische reeks, maar toch divergent.
    - opgave: |-
        $\displaystyle\sominf{n=2} \frac{1}{n (\ln n)^2}$
      antwoord: |-
        convergent
      uitwerking: |-
        $\displaystyle\int_2^{b} \frac{\mathrm{d}x}{x (\ln x)^2} = \frac{1}{\ln 2} - \frac{1}{\ln b} \to \frac{1}{\ln 2}$.

- id: h2-o18
  soort: opdracht
  niveau: 3
  thema: |-
    grenzen van het quotiënt- en wortelkenmerk
  opgave: |-
    Neem de hyperharmonische reeks $\sum \tfrac{1}{n^p}$, met $p > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat zowel het quotiëntkenmerk als het wortelkenmerk $L = 1$ geven, voor elke $p$.
      antwoord: |-
        $\bigl(\tfrac{n}{n+1}\bigr)^p \to 1$ en $\bigl(\sqrt[n]{n}\bigr)^{-p} \to 1$
      uitwerking: |-
        Het quotiënt is $\bigl(\tfrac{n}{n+1}\bigr)^p \to 1$. De wortel is $\bigl(\sqrt[n]{n}\bigr)^{-p}$, met $\sqrt[n]{n} = \e^{\ln n / n} \to \e^0 = 1$.
    - opgave: |-
        Verklaar: beide kenmerken vergelijken met een meetkundige reeks. Waarom kan zo'n vergelijking nooit beslissen bij $\sum \tfrac1{n^p}$?
      antwoord: |-
        $\tfrac{1}{n^p}$ daalt trager dan elke $r^n$
      uitwerking: |-
        Voor elke $r$ met $0 < r < 1$ is $\tfrac{1/n^p}{r^n} = \tfrac{(1/r)^n}{n^p} \to +\infty$: de termen zijn uiteindelijk groter dan die van elke convergente meetkundige reeks. Ze zijn ook kleiner dan die van elke reeks $\sum r^n$ met $r \geqslant 1$. Er is dus geen meetkundige reeks om mee te vergelijken.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    kenmerk van Leibniz, voorwaarden
  opgave: |-
    Neem de reeks $1 - \tfrac14 + \tfrac13 - \tfrac1{16} + \tfrac15 - \tfrac1{36} + \cdots$: op de oneven plaatsen staat $\tfrac1n$, op de even plaatsen $\tfrac{1}{n^2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        De tekens wisselen en de termen gaan naar 0. Toon toch aan dat de reeks divergeert.
      antwoord: |-
        $s_{2m} \to +\infty$
      uitwerking: |-
        $s_{2m} = \Bigl(1 + \tfrac13 + \cdots + \tfrac{1}{2m-1}\Bigr) - \Bigl(\tfrac14 + \tfrac1{16} + \cdots + \tfrac{1}{(2m)^2}\Bigr)$. Het eerste deel is minstens $\tfrac12\bigl(1 + \tfrac12 + \cdots + \tfrac1m\bigr)$ en groeit boven elke grens, het tweede blijft onder $\sum \tfrac1{n^2} \leqslant 2$.
    - opgave: |-
        Welke voorwaarde van Leibniz is niet voldaan?
      antwoord: |-
        de rij $u_n$ daalt niet
      uitwerking: |-
        $u_2 = \tfrac14 < u_3 = \tfrac13$: de rij van de absolute waarden daalt niet.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    absolute convergentie, bewijzen
  opgave: |-
    Bewijs of weerleg.
  lijst: enumerate
  delen:
    - opgave: |-
        Als $\sum u_n$ absoluut convergeert, dan convergeert ook $\sum u_n^2$.
      antwoord: |-
        waar
      uitwerking: |-
        Omdat $|u_n| \to 0$, is vanaf een zekere $n$ ook $|u_n| \leqslant 1$, en dan $u_n^2 = |u_n| \cdot |u_n| \leqslant |u_n|$. Vergelijkingskenmerk.
    - opgave: |-
        Als $\sum u_n$ convergeert, dan convergeert ook $\sum u_n^2$.
      antwoord: |-
        fout
      uitwerking: |-
        Tegenvoorbeeld: $u_n = \tfrac{(-1)^n}{\sqrt n}$. De reeks convergeert (Leibniz), maar $\sum u_n^2 = \sum \tfrac1n$ divergeert.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    vergelijkingskenmerk, een bijzonder getal
  opgave: |-
    Neem de reeks $\displaystyle\sominf{n=0} \frac{1}{n!} = 1 + 1 + \frac12 + \frac16 + \cdots$
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{1}{n!} \leqslant \dfrac{1}{2^{n-1}}$ voor $n \geqslant 1$.
      antwoord: |-
        $n! \geqslant 2^{n-1}$
      uitwerking: |-
        $n! = 1 \cdot 2 \cdot 3 \cdots n$: elke factor vanaf de tweede is minstens 2, dus $n! \geqslant 2^{n-1}$.
    - opgave: |-
        Besluit dat de reeks convergeert, met een som tussen 2 en 3.
      antwoord: |-
        $2 \leqslant S \leqslant 3$
      uitwerking: |-
        $S = 1 + \sominf{n=1} \frac{1}{n!} \leqslant 1 + \sominf{n=1} \frac{1}{2^{n-1}} = 1 + 2 = 3$. De eerste twee termen geven al 2.
    - opgave: |-
        Bereken de som van de eerste zes termen. Welk getal herken je?
      antwoord: |-
        $2{,}7167$, bijna $\e$
      uitwerking: |-
        $1 + 1 + \tfrac12 + \tfrac16 + \tfrac1{24} + \tfrac1{120} \approx 2{,}716\,67$. In hoofdstuk 3 blijkt de som $\e \approx 2{,}718\,28$.

# --- Koppel -----------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: |-
      Kansrekenen
  opgave: |-
    Je gooit met een dobbelsteen tot je een zes gooit. De kans dat dat bij worp $n$ gebeurt, is $\tfrac16 \bigl(\tfrac56\bigr)^{n-1}$. De verwachtingswaarde van het aantal worpen is $E = \sominf{n=1} n \cdot \frac16 \Bigl(\frac56\Bigr)^{n-1}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de reeks convergeert.
      antwoord: |-
        $L = \tfrac56$
      uitwerking: |-
        Quotiëntkenmerk: $\dfrac{n+1}{n} \cdot \dfrac56 \to \dfrac56 < 1$.
    - opgave: |-
        Voor $|q| < 1$ is $\sominf{n=1} n\,q^{n-1} = \dfrac{1}{(1-q)^2}$. Bereken $E$.
      antwoord: |-
        6
      uitwerking: |-
        $E = \dfrac16 \cdot \dfrac{1}{(1/6)^2} = 6$.
    - opgave: |-
        Wat is de verwachtingswaarde als de kans op succes per poging $p$ is?
      antwoord: |-
        $\tfrac1p$
      uitwerking: |-
        $E = p \cdot \dfrac{1}{p^2} = \dfrac1p$. Bij een kans van $1\,\%$ wacht je gemiddeld 100 pogingen.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Exponentiële functies
  opgave: |-
    Een reeks kan een limiet bewijzen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\displaystyle\sominf{n=1} \frac{n^5}{1{,}05^n}$ convergeert.
      antwoord: |-
        $L = \tfrac{1}{1{,}05}$
      uitwerking: |-
        Quotiëntkenmerk: $\dfrac{1}{1{,}05}\Bigl(\dfrac{n+1}{n}\Bigr)^5 \to \dfrac{1}{1{,}05} < 1$.
    - opgave: |-
        Besluit dat $\displaystyle\lim_{n\to+\infty} \frac{n^5}{1{,}05^n} = 0$.
      antwoord: |-
        termen van een convergente reeks
      uitwerking: |-
        De termen van een convergente reeks gaan naar 0.
    - opgave: |-
        Toon op dezelfde manier aan dat $\tfrac{n^k}{a^n} \to 0$ voor elke $k$ en elke $a > 1$. Wat betekent dat voor de groei van een exponentiële functie?
      antwoord: |-
        $L = \tfrac1a < 1$
      uitwerking: |-
        Het quotiënt is $\tfrac1a\bigl(\tfrac{n+1}{n}\bigr)^k \to \tfrac1a$. Een exponentiële functie met grondtal groter dan 1 groeit uiteindelijk sneller dan elke macht.

- id: h2-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: analyse
    onderwerp: |-
      Goniometrische functies
  opgave: |-
    Gebruik de limieten $\displaystyle\lim_{h\to0} \frac{\sin h}{h} = 1$ en $\displaystyle\lim_{h\to0} \frac{1 - \cos h}{h^2} = \frac12$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon de tweede limiet aan. Vermenigvuldig teller en noemer met $1 + \cos h$.
      antwoord: |-
        $\dfrac{\sin^2 h}{h^2(1 + \cos h)}$
      uitwerking: |-
        $\dfrac{1 - \cos h}{h^2} = \dfrac{1 - \cos^2 h}{h^2(1 + \cos h)} = \Bigl(\dfrac{\sin h}{h}\Bigr)^2 \cdot \dfrac{1}{1 + \cos h} \to 1 \cdot \dfrac12$.
    - opgave: |-
        Toon aan dat $\displaystyle\sominf{n=1} \sin\frac1n$ divergeert.
      antwoord: |-
        limietvergelijking met $\tfrac1n$
      uitwerking: |-
        $\dfrac{\sin(1/n)}{1/n} \to 1$ (neem $h = \tfrac1n \to 0$), en $\sum \tfrac1n$ divergeert.
    - opgave: |-
        Toon aan dat $\displaystyle\sominf{n=1} \Bigl(1 - \cos\frac1n\Bigr)$ convergeert.
      antwoord: |-
        limietvergelijking met $\tfrac1{n^2}$
      uitwerking: |-
        $\dfrac{1 - \cos(1/n)}{1/n^2} \to \dfrac12$, en $\sum \tfrac1{n^2}$ convergeert.

- id: h2-koppel-4
  soort: koppel
  niveau: 3
  koppel:
    rubriek: discreet
    onderwerp: |-
      Telproblemen
  opgave: |-
    Onderzoek reeksen met de combinaties $\binom{2n}{n}$, het aantal kortste wegen van $(0, 0)$ naar $(n, n)$ op een rooster.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dbinom{2n+2}{n+1} \Big/ \dbinom{2n}{n} = \dfrac{2(2n+1)}{n+1}$.
      antwoord: |-
        met faculteiten
      uitwerking: |-
        $\dfrac{(2n+2)!}{(n+1)!\,(n+1)!} \cdot \dfrac{n!\,n!}{(2n)!} = \dfrac{(2n+2)(2n+1)}{(n+1)^2} = \dfrac{2(2n+1)}{n+1}$.
    - opgave: |-
        Convergeert $\displaystyle\sominf{n=1} \binom{2n}{n} \frac{1}{5^n}$? En wat zegt het quotiëntkenmerk over $\displaystyle\sominf{n=1} \binom{2n}{n} \frac{1}{4^n}$?
      antwoord: |-
        ja ($L = \tfrac45$); niets ($L = 1$)
      uitwerking: |-
        Het quotiënt is $\dfrac{2(2n+1)}{5(n+1)} \to \dfrac45$, en bij de tweede reeks $\dfrac{2(2n+1)}{4(n+1)} \to 1$.
    - opgave: |-
        Noem $a_n = \binom{2n}{n} \tfrac{1}{4^n}$. Toon aan dat $a_n = \tfrac12 \cdot \tfrac34 \cdot \tfrac56 \cdots \tfrac{2n-1}{2n} \geqslant \tfrac{1}{2n}$, en besluit dat $\sum a_n$ divergeert.
      antwoord: |-
        groter dan $\tfrac12 \cdot \tfrac1n$
      uitwerking: |-
        Volgens a is $\tfrac{a_{n+1}}{a_n} = \tfrac{2n+1}{2n+2}$, en $a_1 = \tfrac12$: dat geeft het product. Vervang elke factor $\tfrac{2k-1}{2k}$ vanaf $k = 2$ door de kleinere $\tfrac{2k-2}{2k} = \tfrac{k-1}{k}$: het product $\tfrac12 \cdot \tfrac12 \cdot \tfrac23 \cdots \tfrac{n-1}{n} = \tfrac{1}{2n}$. Vergelijk met de harmonische reeks.

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Convergeren $\displaystyle\sominf{n=1} \frac{1}{n\sqrt n}$ en $\displaystyle\sominf{n=1} \frac{1}{\sqrt[3]{n^2}}$?
  antwoord: |-
    de eerste wel, de tweede niet
  uitwerking: |-
    Hyperharmonisch met $p = \tfrac32 > 1$ en $p = \tfrac23 \leqslant 1$.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Toon met het vergelijkingskenmerk aan dat $\displaystyle\sominf{n=1} \frac{1}{n^2 + n + 1}$ convergeert.
  antwoord: |-
    kleiner dan $\tfrac{1}{n^2}$
  uitwerking: |-
    $\tfrac{1}{n^2 + n + 1} \leqslant \tfrac{1}{n^2}$, en $\sum \tfrac1{n^2}$ convergeert.

- id: h2-t3
  soort: test
  niveau: 2
  opgave: |-
    Convergeert $\displaystyle\sominf{n=1} \frac{3n + 1}{n^3 + 2}$?
  antwoord: |-
    ja
  uitwerking: |-
    Limietvergelijking met $\tfrac1{n^2}$: $\dfrac{3n^3 + n^2}{n^3 + 2} \to 3$.

- id: h2-t4
  soort: test
  niveau: 1
  opgave: |-
    Onderzoek $\displaystyle\sominf{n=1} \frac{n^3}{4^n}$ met het quotiëntkenmerk.
  antwoord: |-
    $L = \tfrac14$, convergent
  uitwerking: |-
    $\dfrac14\Bigl(\dfrac{n+1}{n}\Bigr)^3 \to \dfrac14$.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Onderzoek $\displaystyle\sominf{n=1} \Bigl(\frac{n+1}{3n}\Bigr)^n$.
  antwoord: |-
    $L = \tfrac13$, convergent
  uitwerking: |-
    Wortelkenmerk: $\sqrt[n]{u_n} = \tfrac{n+1}{3n} \to \tfrac13$.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Toon aan dat $\displaystyle\sominf{n=1} \frac{(-1)^{n+1}}{n^3}$ convergeert. Hoeveel termen geven een fout kleiner dan $0{,}001$?
  antwoord: |-
    9 termen
  uitwerking: |-
    Leibniz: $\tfrac1{n^3}$ daalt naar 0. De fout is hoogstens $\tfrac{1}{(n+1)^3} \leqslant 0{,}001 \iff n + 1 \geqslant 10$.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Is $\displaystyle\sominf{n=1} \frac{(-1)^n}{n + 5}$ absoluut convergent, voorwaardelijk convergent of divergent?
  antwoord: |-
    voorwaardelijk convergent
  uitwerking: |-
    Leibniz: $\tfrac{1}{n+5}$ daalt naar 0. Maar $\sum \tfrac{1}{n+5}$ is de harmonische reeks zonder de eerste vijf termen: divergent.

- id: h2-t8
  soort: test
  niveau: 2
  opgave: |-
    Hoeveel termen van $\displaystyle\sominf{n=1} \frac{1}{n^5}$ volstaan om de som tot op $0{,}0001$ te kennen? Gebruik de afschatting van de rest.
  antwoord: |-
    8
  uitwerking: |-
    $\displaystyle\int_N^{+\infty} \frac{\mathrm{d}x}{x^5} = \frac{1}{4N^4} \leqslant 0{,}0001 \iff N^4 \geqslant 2500$. $7^4 = 2401$ is te weinig, $8^4 = 4096$ volstaat.
