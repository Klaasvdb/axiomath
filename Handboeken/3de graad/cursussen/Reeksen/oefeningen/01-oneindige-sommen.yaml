# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sum_{i=1}^{5} 2^i$
      antwoord: |-
        62
      uitwerking: |-
        $2 + 4 + 8 + 16 + 32 = 62$, of met de somformule $2 \cdot \tfrac{2^5 - 1}{2 - 1} = 62$.
    - opgave: |-
        $1 + \tfrac13 + \tfrac19 + \tfrac1{27}$
      antwoord: |-
        $\tfrac{40}{27}$
      uitwerking: |-
        $\tfrac{27 + 9 + 3 + 1}{27} = \tfrac{40}{27}$.
    - opgave: |-
        $\displaystyle\sum_{k=1}^{4} \frac1k$
      antwoord: |-
        $\tfrac{25}{12}$
      uitwerking: |-
        $\tfrac{12 + 6 + 4 + 3}{12} = \tfrac{25}{12}$.
    - opgave: |-
        $\displaystyle\lim_{n\to+\infty} \frac{3n + 1}{2n - 5}$
      antwoord: |-
        $\tfrac32$
      uitwerking: |-
        Teller en noemer van dezelfde graad: de verhouding van de hoogstegraadscoëfficiënten.
    - opgave: |-
        $\displaystyle\lim_{n\to+\infty} (1 - 0{,}9^n)$
      antwoord: |-
        1
      uitwerking: |-
        $0{,}9^n \to 0$, want $|0{,}9| < 1$.
    - opgave: |-
        $\tfrac13 - \tfrac14$
      antwoord: |-
        $\tfrac1{12}$
      uitwerking: |-
        $\tfrac{4 - 3}{12} = \tfrac1{12}$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem een vierkant met zijde 1. Kleur de helft, dan de helft van wat overblijft, dan weer de helft van wat overblijft, en zo verder.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk deel van het vierkant is gekleurd na 1, 2, 3 en 4 stappen?
      antwoord: |-
        $\tfrac12$, $\tfrac34$, $\tfrac78$, $\tfrac{15}{16}$
      uitwerking: |-
        Na elke stap blijft de helft van het ongekleurde deel over: $\tfrac12$, $\tfrac14$, $\tfrac18$, $\tfrac1{16}$. Gekleurd is telkens 1 min dat deel.
    - opgave: |-
        Toon aan dat na $n$ stappen precies $\tfrac12 + \tfrac14 + \cdots + \tfrac{1}{2^n} = 1 - \tfrac{1}{2^n}$ gekleurd is.
      antwoord: |-
        er blijft $\tfrac1{2^n}$ over
      uitwerking: |-
        Na $n$ stappen is het ongekleurde deel $n$ keer gehalveerd: $\tfrac{1}{2^n}$. Of met de somformule: $\tfrac12 \cdot \tfrac{1 - (1/2)^n}{1 - 1/2} = 1 - \tfrac{1}{2^n}$.
    - opgave: |-
        Welk getal benaderen die sommen? Kan de som ooit groter worden dan 1?
      antwoord: |-
        1; nee
      uitwerking: |-
        $\tfrac{1}{2^n} \to 0$, dus de sommen naderen 1. Ze blijven kleiner dan 1, want het gekleurde deel ligt in het vierkant.
    - opgave: |-
        Tel nu $\tfrac12 + \tfrac13 + \tfrac14 + \cdots$ op met je rekentoestel. Hoeveel termen heb je nodig om boven 2 te komen?
      antwoord: |-
        10 termen, tot $\tfrac1{11}$
      uitwerking: |-
        $\tfrac12 + \cdots + \tfrac1{10} \approx 1{,}929$ en $\tfrac12 + \cdots + \tfrac1{11} \approx 2{,}020$.
    - opgave: |-
        Om boven 3 te komen, heb je 30 termen nodig. Denk je dat deze som onder een plafond blijft, zoals de eerste? Waarom?
      antwoord: |-
        open vraag
      uitwerking: |-
        De som groeit steeds trager, dus een plafond lijkt aannemelijk. In sectie 3 blijkt dat ze toch boven elke grens groeit.

- id: h1-ps
  soort: kort
  opgave: |-
    Bereken $s_1$, $s_2$, $s_3$ en een formule voor $s_n$. Is de reeks convergent? Geef dan de som.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{9}{10^n}$
      antwoord: |-
        $s_n = 1 - \tfrac{1}{10^n}$, som 1
      uitwerking: |-
        $s_1 = 0{,}9$, $s_2 = 0{,}99$, $s_3 = 0{,}999$. De somformule met $u_1 = \tfrac9{10}$ en $q = \tfrac1{10}$ geeft $s_n = 1 - \tfrac{1}{10^n} \to 1$. Dus $0{,}999\ldots = 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} 2 \cdot (-1)^{n+1}$
      antwoord: |-
        divergent
      uitwerking: |-
        $s_1 = 2$, $s_2 = 0$, $s_3 = 2$: $s_n = 2$ als $n$ oneven is en $s_n = 0$ als $n$ even is. De limiet bestaat niet.
    - opgave: |-
        $\displaystyle\sominf{n=1} n$
      antwoord: |-
        $s_n = \tfrac{n(n+1)}{2}$, divergent
      uitwerking: |-
        $s_1 = 1$, $s_2 = 3$, $s_3 = 6$. Rekenkundige som: $s_n = \tfrac{n(n+1)}{2} \to +\infty$.

- id: h1-mr
  soort: kort
  opgave: |-
    Bereken de som, als ze bestaat.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=0} \Bigl(\frac25\Bigr)^n$
      antwoord: |-
        $\tfrac53$
      uitwerking: |-
        $\dfrac{1}{1 - 2/5} = \tfrac53$.
    - opgave: |-
        $\displaystyle\sominf{n=1} 3\Bigl(-\frac12\Bigr)^n$
      antwoord: |-
        $-1$
      uitwerking: |-
        Eerste term $-\tfrac32$, $q = -\tfrac12$: $\dfrac{-3/2}{3/2} = -1$.
    - opgave: |-
        $\displaystyle\sominf{n=3} \frac{1}{2^n}$
      antwoord: |-
        $\tfrac14$
      uitwerking: |-
        Eerste term $\tfrac18$: $\dfrac{1/8}{1/2} = \tfrac14$.
    - opgave: |-
        $\displaystyle\sominf{n=0} \Bigl(\frac54\Bigr)^n$
      antwoord: |-
        divergent
      uitwerking: |-
        $q = \tfrac54$ en $|q| \geqslant 1$.

- id: h1-mrx
  soort: kort
  opgave: |-
    Voor welke $x$ convergeert de reeks? Geef dan de som.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=0} \Bigl(\frac x2\Bigr)^n$
      antwoord: |-
        $-2 < x < 2$, som $\tfrac{2}{2 - x}$
      uitwerking: |-
        $\bigl|\tfrac x2\bigr| < 1$. De som is $\dfrac{1}{1 - x/2} = \dfrac{2}{2 - x}$.
    - opgave: |-
        $\displaystyle\sominf{n=0} (1 - x)^n$
      antwoord: |-
        $0 < x < 2$, som $\tfrac1x$
      uitwerking: |-
        $|1 - x| < 1 \iff 0 < x < 2$. De som is $\dfrac{1}{1 - (1 - x)} = \dfrac1x$.

- id: h1-tel
  soort: kort
  opgave: |-
    Bereken de som.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{n(n+2)}$
      antwoord: |-
        $\tfrac34$
      uitwerking: |-
        $\dfrac{1}{n(n+2)} = \dfrac12\Bigl(\dfrac1n - \dfrac1{n+2}\Bigr)$. Elke tweede breuk valt weg; er blijven $1$ en $\tfrac12$ over: $s_n = \tfrac12\bigl(1 + \tfrac12 - \tfrac1{n+1} - \tfrac1{n+2}\bigr) \to \tfrac34$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac{1}{2n-1} - \frac{1}{2n+1}\Bigr)$
      antwoord: |-
        1
      uitwerking: |-
        $b_n = \tfrac{1}{2n-1}$ en $b_{n+1} = \tfrac{1}{2n+1}$: $s_n = 1 - \tfrac{1}{2n+1} \to 1$.

- id: h1-reg
  soort: kort
  opgave: |-
    Bereken met de rekenregels.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac{6}{n(n+1)} - \frac{2}{3^n}\Bigr)$
      antwoord: |-
        5
      uitwerking: |-
        $6 \cdot 1 - 2 \cdot \tfrac12 = 5$, want $\sum \tfrac1{n(n+1)} = 1$ en $\sum_{n=1}^{+\infty} \tfrac1{3^n} = \tfrac{1/3}{2/3} = \tfrac12$.
    - opgave: |-
        $\displaystyle\sominf{n=0} \bigl(5 \cdot 0{,}2^n + 0{,}5^n\bigr)$
      antwoord: |-
        $\tfrac{33}{4}$
      uitwerking: |-
        $\dfrac{5}{0{,}8} + \dfrac{1}{0{,}5} = \tfrac{25}{4} + 2 = \tfrac{33}{4}$.

- id: h1-term
  soort: kort
  opgave: |-
    Wat zegt de test met de termen over de reeks: divergent, of niets?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n^2}{n^2 + 1}$
      antwoord: |-
        divergent
      uitwerking: |-
        De termen gaan naar $1 \neq 0$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{n^2}$
      antwoord: |-
        niets
      uitwerking: |-
        De termen gaan naar 0. (In hoofdstuk 2 blijkt de reeks te convergeren.)
    - opgave: |-
        $\displaystyle\sominf{n=1} (-1)^n$
      antwoord: |-
        divergent
      uitwerking: |-
        De termen zijn afwisselend $-1$ en $1$: geen limiet, dus zeker niet 0.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{\sqrt n}{n + 1}$
      antwoord: |-
        niets
      uitwerking: |-
        $\dfrac{\sqrt n}{n + 1} = \dfrac{1/\sqrt n}{1 + 1/n} \to 0$. (In hoofdstuk 2 blijkt de reeks te divergeren.)

- id: h1-harm
  soort: kort
  opgave: |-
    Werk met de harmonische reeks.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\tfrac19 + \tfrac1{10} + \cdots + \tfrac1{16} \geqslant \tfrac12$.
      antwoord: |-
        8 termen, elk $\geqslant \tfrac1{16}$
      uitwerking: |-
        Er zijn 8 termen, en de kleinste is $\tfrac1{16}$: de som is minstens $8 \cdot \tfrac1{16} = \tfrac12$.
    - opgave: |-
        Toon aan dat $s_{32} \geqslant \tfrac72$.
      antwoord: |-
        $1 + \tfrac52$
      uitwerking: |-
        $32 = 2^5$, dus $s_{32} \geqslant 1 + \tfrac52 = \tfrac72$. (In werkelijkheid is $s_{32} \approx 4{,}06$.)
    - opgave: |-
        Divergeert de reeks $\displaystyle\sominf{n=1} \frac{1}{3n}$? Leg uit.
      antwoord: |-
        ja
      uitwerking: |-
        Stel dat ze convergeert. Dan convergeert ook $\sum 3 \cdot \tfrac{1}{3n} = \sum \tfrac1n$ (veelvoud van een reeks), en dat is niet zo.

- id: h1-boek
  soort: kort
  opgave: |-
    Een stapel boeken van 20 cm lang ligt aan de rand van een tafel, zoals in voorbeeld \ref{vb:h1-terug}.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe ver steekt het bovenste boek uit bij een stapel van 10 boeken?
      antwoord: |-
        $29{,}3$ cm
      uitwerking: |-
        $\tfrac12 s_{10} \approx \tfrac12 \cdot 2{,}929 = 1{,}464$ boeklengtes, of $29{,}3$ cm.
    - opgave: |-
        Hoeveel boeken heb je minstens nodig opdat het bovenste boek $1{,}5$ boeklengtes uitsteekt?
      antwoord: |-
        11
      uitwerking: |-
        $\tfrac12 s_n \geqslant 1{,}5 \iff s_n \geqslant 3$. Met het rekentoestel: $s_{10} \approx 2{,}929$ en $s_{11} \approx 3{,}020$.

- id: h1-proc
  soort: kort
  opgave: |-
    Los op met een meetkundige reeks.
  lijst: enumerate
  delen:
    - opgave: |-
        Een kantige spiraal begint met een stuk van 6 cm, en elk volgend stuk is $\tfrac23$ van het vorige. Hoe lang is de spiraal?
      antwoord: |-
        18 cm
      uitwerking: |-
        $\dfrac{6}{1 - 2/3} = 18$ cm.
    - opgave: |-
        Uit een lijnstuk van 1 m neem je het middelste derde weg. Uit elk van de twee stukken die overblijven, neem je opnieuw het middelste derde weg, en zo verder. Hoeveel lengte neem je in totaal weg?
      antwoord: |-
        1 m
      uitwerking: |-
        Je neemt $\tfrac13$ weg, dan $2 \cdot \tfrac19$, dan $4 \cdot \tfrac1{27}$: eerste term $\tfrac13$, $q = \tfrac23$, som $\dfrac{1/3}{1/3} = 1$. Toch blijven er punten over, zoals de eindpunten 0 en 1.

# --- Opdrachten -------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    partieelsommen
  opgave: |-
    Bereken $s_1$ tot $s_4$ en een formule voor $s_n$. Is de reeks convergent?
  lijst: enumerate
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{4}{5^n}$
      antwoord: |-
        $s_n = 1 - \tfrac1{5^n}$, convergent met som 1
      uitwerking: |-
        $s_1 = \tfrac45$, $s_2 = \tfrac{24}{25}$, $s_3 = \tfrac{124}{125}$, $s_4 = \tfrac{624}{625}$. De somformule: $s_n = \tfrac45 \cdot \tfrac{1 - (1/5)^n}{4/5} = 1 - \tfrac{1}{5^n} \to 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} (2n - 1)$
      antwoord: |-
        $s_n = n^2$, divergent
      uitwerking: |-
        $s_1 = 1$, $s_2 = 4$, $s_3 = 9$, $s_4 = 16$. Rekenkundig: $s_n = n \cdot \tfrac{1 + (2n - 1)}{2} = n^2 \to +\infty$.
    - opgave: |-
        $\displaystyle\sominf{n=1} (-1)^n \, n$
      antwoord: |-
        $s_n = \tfrac n2$ ($n$ even), $s_n = -\tfrac{n+1}{2}$ ($n$ oneven); divergent
      uitwerking: |-
        $s_1 = -1$, $s_2 = 1$, $s_3 = -2$, $s_4 = 2$. Elk paar $-(2m-1) + 2m$ levert 1 op. De partieelsommen springen tussen steeds grotere positieve en negatieve getallen: geen limiet.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    meetkundige reeks
  opgave: |-
    Bereken de som, als ze bestaat.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=0} \Bigl(\frac34\Bigr)^n$
      antwoord: |-
        4
      uitwerking: |-
        $\dfrac{1}{1 - 3/4} = 4$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{5}{2^n}$
      antwoord: |-
        5
      uitwerking: |-
        Eerste term $\tfrac52$: $\dfrac{5/2}{1/2} = 5$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(-\frac13\Bigr)^n$
      antwoord: |-
        $-\tfrac14$
      uitwerking: |-
        $\dfrac{-1/3}{4/3} = -\tfrac14$.
    - opgave: |-
        $\displaystyle\sominf{n=0} \frac{3^n}{2^{n+1}}$
      antwoord: |-
        divergent
      uitwerking: |-
        $q = \tfrac32$, en $|q| \geqslant 1$.
    - opgave: |-
        $\displaystyle\sominf{n=2} \frac{4}{5^n}$
      antwoord: |-
        $\tfrac15$
      uitwerking: |-
        Eerste term $\tfrac4{25}$: $\dfrac{4/25}{4/5} = \tfrac15$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{2^n}{3^{n+1}}$
      antwoord: |-
        $\tfrac23$
      uitwerking: |-
        Eerste term $\tfrac29$, $q = \tfrac23$: $\dfrac{2/9}{1/3} = \tfrac23$.
    - opgave: |-
        $12 - 8 + \tfrac{16}{3} - \cdots$
      antwoord: |-
        $\tfrac{36}{5}$
      uitwerking: |-
        $q = -\tfrac23$: $\dfrac{12}{5/3} = \tfrac{36}{5}$.
    - opgave: |-
        $\displaystyle\sominf{n=1} (-1{,}1)^n$
      antwoord: |-
        divergent
      uitwerking: |-
        $|q| = 1{,}1 \geqslant 1$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    termen naar nul
  opgave: |-
    Toon aan dat de reeks divergeert.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n}{n + 1}$
      antwoord: |-
        termen $\to 1$
      uitwerking: |-
        $\lim \tfrac{n}{n+1} = 1 \neq 0$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{2n^2 - 1}{3n^2 + n}$
      antwoord: |-
        termen $\to \tfrac23$
      uitwerking: |-
        Zelfde graad: de limiet is $\tfrac23 \neq 0$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \cos(n\pi)$
      antwoord: |-
        termen $\pm 1$
      uitwerking: |-
        $\cos(n\pi) = (-1)^n$: de termen hebben geen limiet.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(1 + \frac1n\Bigr)^n$
      antwoord: |-
        termen $\to \e$
      uitwerking: |-
        $\lim \bigl(1 + \tfrac1n\bigr)^n = \e \neq 0$.
    - opgave: |-
        $\displaystyle\sominf{n=1} 1{,}01^n$
      antwoord: |-
        termen $\to +\infty$
      uitwerking: |-
        $1{,}01^n \to +\infty$. (Ook: meetkundig met $q = 1{,}01$.)

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    meetkundige reeks, repeterende decimalen
  opgave: |-
    Schrijf als een breuk, met een meetkundige reeks.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $0{,}444\ldots$
      antwoord: |-
        $\tfrac49$
      uitwerking: |-
        $0{,}4 + 0{,}04 + \cdots = \dfrac{0{,}4}{0{,}9} = \tfrac49$.
    - opgave: |-
        $0{,}363636\ldots$
      antwoord: |-
        $\tfrac4{11}$
      uitwerking: |-
        $0{,}36 + 0{,}0036 + \cdots = \dfrac{0{,}36}{0{,}99} = \tfrac{36}{99} = \tfrac4{11}$.
    - opgave: |-
        $2{,}1555\ldots$
      antwoord: |-
        $\tfrac{97}{45}$
      uitwerking: |-
        $2{,}1 + (0{,}05 + 0{,}005 + \cdots) = \tfrac{21}{10} + \dfrac{0{,}05}{0{,}9} = \tfrac{21}{10} + \tfrac1{18} = \tfrac{194}{90} = \tfrac{97}{45}$.
    - opgave: |-
        $0{,}999\ldots$
      antwoord: |-
        1
      uitwerking: |-
        $\dfrac{0{,}9}{0{,}9} = 1$. Het zijn twee schrijfwijzen van hetzelfde getal.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    telescoperende reeks
  opgave: |-
    Bereken de som.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{(n+1)(n+2)}$
      antwoord: |-
        $\tfrac12$
      uitwerking: |-
        $\dfrac{1}{n+1} - \dfrac{1}{n+2}$: $s_n = \tfrac12 - \tfrac{1}{n+2} \to \tfrac12$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac{1}{\sqrt n} - \frac{1}{\sqrt{n+1}}\Bigr)$
      antwoord: |-
        1
      uitwerking: |-
        $s_n = 1 - \tfrac{1}{\sqrt{n+1}} \to 1$.
    - opgave: |-
        $\displaystyle\sominf{n=2} \frac{2}{n^2 - 1}$
      antwoord: |-
        $\tfrac32$
      uitwerking: |-
        $\dfrac{2}{(n-1)(n+1)} = \dfrac{1}{n-1} - \dfrac{1}{n+1}$. Elke tweede breuk valt weg: er blijven $1 + \tfrac12$ over, min twee breuken die naar 0 gaan.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac{1}{(n+1)^2} - \frac{1}{n^2}\Bigr)$
      antwoord: |-
        $-1$
      uitwerking: |-
        $b_n = -\tfrac{1}{n^2}$: $s_n = -1 + \tfrac{1}{(n+1)^2} \to -1$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    rekenregels
  opgave: |-
    Bereken met de rekenregels.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac{1}{2^n} + \frac{1}{5^n}\Bigr)$
      antwoord: |-
        $\tfrac54$
      uitwerking: |-
        $1 + \dfrac{1/5}{4/5} = 1 + \tfrac14 = \tfrac54$.
    - opgave: |-
        $\displaystyle\sominf{n=0} \frac{2^n + 3^n}{6^n}$
      antwoord: |-
        $\tfrac72$
      uitwerking: |-
        $\sum \bigl(\tfrac13\bigr)^n + \sum \bigl(\tfrac12\bigr)^n = \tfrac32 + 2 = \tfrac72$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac{3}{n(n+1)} - \frac{1}{2^n}\Bigr)$
      antwoord: |-
        2
      uitwerking: |-
        $3 \cdot 1 - 1 = 2$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{2^{n+1} - 1}{4^n}$
      antwoord: |-
        $\tfrac53$
      uitwerking: |-
        $\sum 2 \cdot \bigl(\tfrac12\bigr)^n - \sum \bigl(\tfrac14\bigr)^n = 2 - \tfrac13 = \tfrac53$.

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    convergentie herkennen
  opgave: |-
    Convergent of divergent? Geef de som als ze bestaat.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} 0{,}99^n$
      antwoord: |-
        convergent, 99
      uitwerking: |-
        Meetkundig: $\dfrac{0{,}99}{0{,}01} = 99$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{n + 1}{n}$
      antwoord: |-
        divergent
      uitwerking: |-
        De termen gaan naar 1.
    - opgave: |-
        $\displaystyle\sominf{n=1} \ln\frac{n}{n+1}$
      antwoord: |-
        divergent
      uitwerking: |-
        Telescopeert: $s_n = \ln 1 - \ln(n+1) = -\ln(n+1) \to -\infty$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac1n - \frac1{n+1}\Bigr)$
      antwoord: |-
        convergent, 1
      uitwerking: |-
        Telescopeert: $s_n = 1 - \tfrac1{n+1} \to 1$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac{\e}{3}\Bigr)^n$
      antwoord: |-
        convergent, $\tfrac{\e}{3 - \e}$
      uitwerking: |-
        $q = \tfrac\e3 \approx 0{,}91$: $\dfrac{\e/3}{1 - \e/3} = \dfrac{\e}{3 - \e} \approx 9{,}65$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac{\pi}{3}\Bigr)^n$
      antwoord: |-
        divergent
      uitwerking: |-
        $q = \tfrac\pi3 \approx 1{,}05 \geqslant 1$.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    oneindig proces, stuiterende bal
  figuur:
    code: |-
      \begin{tikzpicture}[x=.9cm,y=.9cm,font=\scriptsize]
        \draw[grijs,thick] (-.2,0) -- (4.5,0);
        \draw[accent,thick] (0,2) parabola (0.636,0) parabola bend (1.129,1.200) (1.622,0) parabola bend (2.004,0.720) (2.386,0) parabola bend (2.682,0.432) (2.978,0) parabola bend (3.207,0.259) (3.436,0) parabola bend (3.613,0.156) (3.791,0) parabola bend (3.928,0.093) (4.066,0) parabola bend (4.172,0.056) (4.279,0);
        \fill[accent] (0,2) circle (2.5pt);
        \node[left] at (0,2) {2 m};
        \node[above] at (1.129,1.2) {1,2 m};
      \end{tikzpicture}
  opgave: |-
    Een bal valt van 2 m hoog op de grond. Na elke bots komt hij tot $60\,\%$ van de vorige hoogte.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke afstand legt de bal in totaal af?
      antwoord: |-
        8 m
      uitwerking: |-
        Eerst 2 m naar beneden. Daarna telkens op en neer: $2 \cdot (1{,}2 + 0{,}72 + \cdots) = 2 \cdot \dfrac{1{,}2}{0{,}4} = 6$ m. Samen 8 m.
    - opgave: |-
        Na hoeveel botsen komt de bal voor het eerst minder dan 1 cm hoog?
      antwoord: |-
        na 11 botsen
      uitwerking: |-
        $2 \cdot 0{,}6^n < 0{,}01 \iff 0{,}6^n < 0{,}005 \iff n > \dfrac{\ln 0{,}005}{\ln 0{,}6} \approx 10{,}4$.
    - opgave: |-
        Een val van $h$ meter duurt $\sqrt{2h/g}$ seconden, met $g = 9{,}81$ m/s², en opstijgen tot $h$ duurt even lang. Hoe lang stuitert de bal in totaal?
      antwoord: |-
        $5{,}03$ s
      uitwerking: |-
        De eerste val duurt $t_0 = \sqrt{4/9{,}81} \approx 0{,}639$ s. Na de $n$-de bots is de hoogte $2 \cdot 0{,}6^n$, dus op en neer duurt $2 t_0 \cdot \sqrt{0{,}6}^{\,n}$. Samen: $t_0\Bigl(1 + 2 \cdot \dfrac{\sqrt{0{,}6}}{1 - \sqrt{0{,}6}}\Bigr) \approx 0{,}639 \cdot 7{,}873 \approx 5{,}03$ s. Oneindig veel botsen, in een eindige tijd.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    oneindig proces, eindpunt van een spiraal
  opgave: |-
    De spin uit voorbeeld \ref{vb:h1-spiraal} vertrekt in de oorsprong en loopt eerst 4 cm naar rechts, dan 3 cm naar boven, dan $\tfrac94$ cm naar links, en zo verder.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de horizontale verplaatsingen de reeks $4 - 4\bigl(\tfrac34\bigr)^2 + 4\bigl(\tfrac34\bigr)^4 - \cdots$ vormen, en bereken haar som.
      antwoord: |-
        $\tfrac{64}{25}$
      uitwerking: |-
        Elk tweede stuk is horizontaal, afwisselend naar rechts en naar links: quotiënt $-\bigl(\tfrac34\bigr)^2 = -\tfrac9{16}$. De som is $\dfrac{4}{1 + 9/16} = \tfrac{64}{25}$.
    - opgave: |-
        Bereken op dezelfde manier de verticale verplaatsing.
      antwoord: |-
        $\tfrac{48}{25}$
      uitwerking: |-
        $3 - 3 \cdot \tfrac9{16} + \cdots = \dfrac{3}{1 + 9/16} = \tfrac{48}{25}$.
    - opgave: |-
        Hoe ver ligt het eindpunt van de oorsprong? Vergelijk met de lengte van de spiraal.
      antwoord: |-
        $3{,}2$ cm, tegenover 16 cm
      uitwerking: |-
        $\sqrt{\bigl(\tfrac{64}{25}\bigr)^2 + \bigl(\tfrac{48}{25}\bigr)^2} = \tfrac{80}{25} = 3{,}2$ cm. De spin loopt 16 cm om $3{,}2$ cm op te schieten.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundige reeks met een letter
  opgave: |-
    Voor welke $x$ convergeert de reeks? Geef dan de som.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=0} (2x)^n$
      antwoord: |-
        $-\tfrac12 < x < \tfrac12$, som $\tfrac{1}{1 - 2x}$
      uitwerking: |-
        $|2x| < 1$.
    - opgave: |-
        $\displaystyle\sominf{n=0} (x - 3)^n$
      antwoord: |-
        $2 < x < 4$, som $\tfrac{1}{4 - x}$
      uitwerking: |-
        $|x - 3| < 1$, en $\dfrac{1}{1 - (x - 3)} = \dfrac{1}{4 - x}$.
    - opgave: |-
        $\displaystyle\sominf{n=1} x^{2n}$
      antwoord: |-
        $-1 < x < 1$, som $\tfrac{x^2}{1 - x^2}$
      uitwerking: |-
        Quotiënt $x^2$, eerste term $x^2$: $|x^2| < 1 \iff |x| < 1$.
    - opgave: |-
        $\displaystyle\sominf{n=0} \frac{1}{(1 + x^2)^n}$
      antwoord: |-
        $x \neq 0$, som $\tfrac{1 + x^2}{x^2}$
      uitwerking: |-
        Quotiënt $\tfrac{1}{1 + x^2}$, en dat is kleiner dan 1 precies als $x \neq 0$. De som is $\dfrac{1}{1 - \frac{1}{1 + x^2}} = \dfrac{1 + x^2}{x^2}$.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    oneindig proces, vierkanten in een vierkant
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.3]
        \foreach \k in {0,...,6}{%
          \pgfmathsetmacro{\r}{4*sqrt(2)/(sqrt(2))^\k}
          \pgfmathsetmacro{\h}{45+45*\k}
          \draw[accent,thick] (\h:\r) -- (\h+90:\r) -- (\h+180:\r) -- (\h+270:\r) -- cycle;}
      \end{tikzpicture}
  opgave: |-
    In een vierkant met zijde 8 verbind je de middens van de zijden. Dat geeft een nieuw vierkant, waarin je opnieuw de middens verbindt, en zo verder.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de zijde van het tweede en het derde vierkant.
      antwoord: |-
        $4\sqrt2$ en 4
      uitwerking: |-
        De nieuwe zijde is de schuine zijde van een driehoek met rechthoekszijden $4$ en $4$: $4\sqrt2 = \tfrac{8}{\sqrt2}$. Telkens delen door $\sqrt2$: daarna 4.
    - opgave: |-
        Bereken de totale omtrek van alle vierkanten.
      antwoord: |-
        $64 + 32\sqrt2 \approx 109{,}25$
      uitwerking: |-
        $\dfrac{32}{1 - 1/\sqrt2} = \dfrac{32\sqrt2}{\sqrt2 - 1} = 32\sqrt2(\sqrt2 + 1) = 64 + 32\sqrt2$.
    - opgave: |-
        Bereken de totale oppervlakte van alle vierkanten.
      antwoord: |-
        128
      uitwerking: |-
        De oppervlakte halveert telkens: $\dfrac{64}{1 - 1/2} = 128$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    oneindig proces, Achilles en de schildpad
  prent:
    naam: schildpad
  opgave: |-
    Achilles loopt 10 m/s, een schildpad 1 m/s. De schildpad krijgt 100 m voorsprong. Zeno redeneerde zo: Achilles moet eerst de plaats bereiken waar de schildpad vertrok, maar dan is ze al verder. Dan moet hij die nieuwe plaats bereiken, en zo verder, oneindig veel keer.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang duren de eerste drie etappes van Achilles?
      antwoord: |-
        10 s, 1 s en $0{,}1$ s
      uitwerking: |-
        100 m duurt 10 s; de schildpad is dan 10 m verder. Die 10 m duren 1 s, en de schildpad loopt 1 m. Die meter duurt $0{,}1$ s.
    - opgave: |-
        Hoe lang duren alle etappes samen?
      antwoord: |-
        $\tfrac{100}{9} \approx 11{,}1$ s
      uitwerking: |-
        $10 + 1 + 0{,}1 + \cdots = \dfrac{10}{1 - 0{,}1} = \tfrac{100}{9}$ s.
    - opgave: |-
        Controleer met een vergelijking: wanneer heeft Achilles de schildpad ingehaald?
      antwoord: |-
        $t = \tfrac{100}{9}$ s
      uitwerking: |-
        $10t = 100 + t \iff t = \tfrac{100}{9}$.
    - opgave: |-
        Welke afstand heeft Achilles dan afgelegd? Wat was de fout van Zeno?
      antwoord: |-
        $\tfrac{1000}{9} \approx 111{,}1$ m
      uitwerking: |-
        $10 \cdot \tfrac{100}{9}$ m. Zeno nam aan dat oneindig veel etappes samen oneindig lang duren. Maar hun duur is een convergente reeks.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    partieelsommen, van $s_n$ naar $u_n$
  opgave: |-
    De partieelsommen van een reeks $\sominf{n=1} u_n$ zijn $s_n = \dfrac{3n}{n + 2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $u_1$ en $u_2$.
      antwoord: |-
        $u_1 = 1$, $u_2 = \tfrac12$
      uitwerking: |-
        $u_1 = s_1 = 1$ en $u_2 = s_2 - s_1 = \tfrac32 - 1 = \tfrac12$.
    - opgave: |-
        Toon aan dat $u_n = \dfrac{6}{(n+1)(n+2)}$.
      antwoord: |-
        $u_n = s_n - s_{n-1}$
      uitwerking: |-
        $\dfrac{3n}{n+2} - \dfrac{3(n-1)}{n+1} = \dfrac{3n(n+1) - 3(n-1)(n+2)}{(n+1)(n+2)} = \dfrac{3n^2 + 3n - 3n^2 - 3n + 6}{(n+1)(n+2)}$. De formule geldt ook voor $n = 1$.
    - opgave: |-
        Wat is de som van de reeks?
      antwoord: |-
        3
      uitwerking: |-
        $\lim \tfrac{3n}{n+2} = 3$.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    harmonische reeks, rekenregels
  opgave: |-
    Toon aan dat de reeks divergeert. Gebruik de harmonische reeks.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{n + 5}$
      antwoord: |-
        $\sum_{n=6}^{+\infty} \tfrac1n$
      uitwerking: |-
        Dit is de harmonische reeks zonder haar eerste vijf termen. Eerste termen weglaten verandert de convergentie niet.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{5}{n}$
      antwoord: |-
        veelvoud
      uitwerking: |-
        Convergeerde ze, dan ook $\sum \tfrac15 \cdot \tfrac5n = \sum \tfrac1n$.
    - opgave: |-
        $\displaystyle\sominf{n=1} \frac{1}{2n - 1}$
      antwoord: |-
        $s_n \geqslant \tfrac12 \bigl(1 + \tfrac12 + \cdots + \tfrac1n\bigr)$
      uitwerking: |-
        Elke term is minstens $\tfrac{1}{2n} = \tfrac12 \cdot \tfrac1n$. Dus is de partieelsom minstens de helft van die van de harmonische reeks, en die groeit boven elke grens.
    - opgave: |-
        $\displaystyle\sominf{n=1} \Bigl(\frac1n + \frac1{2^n}\Bigr)$
      antwoord: |-
        uit het ongerijmde
      uitwerking: |-
        Stel dat ze convergeert. $\sum \tfrac1{2^n}$ convergeert ook, dus dan convergeert het verschil $\sum \tfrac1n$: strijdig.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    oneindig proces, eeuwigdurende beurs
  opgave: |-
    Een fonds wil voor altijd elk jaar een studiebeurs van 1000 euro uitkeren, de eerste over één jaar. Het geld staat op een rekening met $4\,\%$ rente per jaar. Om over $n$ jaar 1000 euro te hebben, moet het fonds vandaag $\dfrac{1000}{1{,}04^n}$ euro opzijzetten.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel moet het fonds vandaag opzijzetten voor de eerste beurs? En voor de tiende?
      antwoord: |-
        $961{,}54$ en $675{,}56$ euro
      uitwerking: |-
        $\tfrac{1000}{1{,}04} \approx 961{,}54$ en $\tfrac{1000}{1{,}04^{10}} \approx 675{,}56$.
    - opgave: |-
        Hoeveel geld heeft het fonds vandaag nodig voor alle beurzen samen?
      antwoord: |-
        25\,000 euro
      uitwerking: |-
        $\sominf{n=1} \dfrac{1000}{1{,}04^n} = \dfrac{1000/1{,}04}{1 - 1/1{,}04} = \dfrac{1000}{0{,}04} = 25\,000$. De rente van 1000 euro per jaar is precies de beurs.
    - opgave: |-
        De beurs stijgt elk jaar met $2\,\%$, om de prijzen te volgen. Hoeveel is nu nodig?
      antwoord: |-
        50\,000 euro
      uitwerking: |-
        $\sominf{n=1} \dfrac{1000 \cdot 1{,}02^{n-1}}{1{,}04^n}$: eerste term $\tfrac{1000}{1{,}04}$, $q = \tfrac{1{,}02}{1{,}04}$. Som $\dfrac{1000/1{,}04}{0{,}02/1{,}04} = 50\,000$.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    oneindig proces, zigzag in een hoek
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.36,font=\scriptsize]
        \draw[grijs,thick] (0,0) -- (7,0);
        \draw[grijs,thick] (0,0) -- (60:10.5);
        \draw[accent,thick] (5,8.660) -- (5,0) -- (1.25,2.165) -- (1.25,0) -- (.3125,.541) -- (.3125,0) -- (.078,.135);
        \fill (5,8.660) circle (4pt) node[left] {$P_0$};
        \fill (5,0) circle (4pt) node[below] {$P_1$};
        \fill (1.25,2.165) circle (4pt) node[left] {$P_2$};
        \node[below left] at (0,0) {$O$};
        \draw[grijs] (.9,0) arc[start angle=0,end angle=60,radius=.9];
      \end{tikzpicture}
  opgave: |-
    Een hoek met top $O$ is $60^\circ$. Het punt $P_0$ ligt op het ene been, op 10 cm van $O$. Uit $P_0$ trek je de loodlijn naar het andere been, met voetpunt $P_1$. Uit $P_1$ trek je de loodlijn terug naar het eerste been, met voetpunt $P_2$, en zo verder.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $|P_0P_1|$, $|OP_1|$ en $|P_1P_2|$.
      antwoord: |-
        $5\sqrt3$, 5 en $\tfrac52\sqrt3$
      uitwerking: |-
        In de rechthoekige driehoek $OP_1P_0$ is $|P_0P_1| = 10 \sin 60^\circ = 5\sqrt3$ en $|OP_1| = 10 \cos 60^\circ = 5$. Dezelfde redenering met 5 in plaats van 10 geeft $|P_1P_2| = \tfrac52\sqrt3$.
    - opgave: |-
        Hoe lang is de hele zigzaglijn?
      antwoord: |-
        $10\sqrt3 \approx 17{,}32$ cm
      uitwerking: |-
        Elk stuk is de helft van het vorige: $\dfrac{5\sqrt3}{1 - 1/2} = 10\sqrt3$.
    - opgave: |-
        Naar welk punt gaan de punten $P_n$? Geef $|OP_n|$.
      antwoord: |-
        naar $O$; $|OP_n| = \tfrac{10}{2^n}$
      uitwerking: |-
        Elke keer halveert de afstand tot $O$, want $\cos 60^\circ = \tfrac12$.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    oneindig proces, een vierkant opvullen
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.75]
        \draw[grijs,thick] (0,0) rectangle (4,4);
        \foreach \k in {0,...,6}{%
          \pgfmathsetmacro{\a}{4-4/2^\k}
          \pgfmathsetmacro{\m}{4-2/2^\k}
          \draw[grijs] (\a,\m) -- (4,\m) (\m,\a) -- (\m,4);
          \fill[accent!45] (\a,\a) rectangle (\m,\m);}
      \end{tikzpicture}
  opgave: |-
    Verdeel een vierkant met zijde 1 in vier gelijke vierkantjes, en kleur het vierkantje linksonder. Verdeel het vierkantje rechtsboven opnieuw in vier, kleur daarvan het vierkantje linksonder, en zo verder.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk deel van het vierkant is gekleurd na oneindig veel stappen? Gebruik een reeks.
      antwoord: |-
        $\tfrac13$
      uitwerking: |-
        $\tfrac14 + \tfrac1{16} + \cdots = \dfrac{1/4}{1 - 1/4} = \tfrac13$.
    - opgave: |-
        Verklaar hetzelfde resultaat zonder reeks, met de figuur.
      antwoord: |-
        één op drie gelijke stukken
      uitwerking: |-
        Op elk niveau zijn er drie vierkantjes van dezelfde grootte die niet verder verdeeld worden: linksonder (gekleurd), linksboven en rechtsonder. Samen vullen die het hele vierkant, en van elke drie is er één gekleurd.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    divergente reeksen, fouten
  opgave: |-
    Elk van deze redeneringen bevat een fout, of net niet.
  lijst: enumerate
  delen:
    - opgave: |-
        Noem $S = 1 + 2 + 4 + 8 + \cdots$ Dan is $2S = 2 + 4 + 8 + \cdots = S - 1$, dus $S = -1$. Wat is er fout?
      antwoord: |-
        $S$ bestaat niet
      uitwerking: |-
        De reeks divergeert ($q = 2$): $S$ is geen getal, en je mag er niet mee rekenen alsof het er een is.
    - opgave: |-
        Noem $S = 1 - 1 + 1 - 1 + \cdots$ Dan is $S = 1 - (1 - 1 + 1 - \cdots) = 1 - S$, dus $S = \tfrac12$. Wat is er fout?
      antwoord: |-
        $S$ bestaat niet
      uitwerking: |-
        Dezelfde fout: de reeks divergeert, want de partieelsommen schommelen tussen 1 en 0.
    - opgave: |-
        Noem $S = 1 + \tfrac12 + \tfrac14 + \cdots$ Dan is $S = 1 + \tfrac12 S$, dus $S = 2$. Waarom is dat wel correct?
      antwoord: |-
        de reeks convergeert
      uitwerking: |-
        De reeks is meetkundig met $q = \tfrac12$, dus ze convergeert. Dan mag je de eerste term apart nemen en de rekenregel voor een veelvoud gebruiken: $\sum_{n=1}^{+\infty} \tfrac1{2^n} = \tfrac12 \sum_{n=0}^{+\infty} \tfrac1{2^n}$.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    harmonische reeks, afschattingen
  opgave: |-
    Noem $s_n$ de partieelsommen van de harmonische reeks.
  lijst: enumerate
  delen:
    - opgave: |-
        Groepeer $1$, $\bigl(\tfrac12 + \tfrac13\bigr)$, $\bigl(\tfrac14 + \cdots + \tfrac17\bigr)$, \ldots\ en toon aan dat $s_{2^k - 1} \leqslant k$.
      antwoord: |-
        elk groepje $\leqslant 1$
      uitwerking: |-
        Het groepje van $\tfrac1{2^j}$ tot $\tfrac1{2^{j+1} - 1}$ telt $2^j$ termen, elk hoogstens $\tfrac1{2^j}$: samen hoogstens 1. Er zijn $k$ groepjes ($j = 0, \ldots, k - 1$).
    - opgave: |-
        Hoeveel termen heb je volgens a minstens nodig om boven 10 te komen?
      antwoord: |-
        1024
      uitwerking: |-
        Voor $n \leqslant 1023 = 2^{10} - 1$ is $s_n \leqslant s_{1023} \leqslant 10$. Dus minstens 1024 termen.
    - opgave: |-
        Hoeveel termen volstaan volgens de ondergrens $s_{2^k} \geqslant 1 + \tfrac k2$? Vergelijk met de 12\,367 termen uit voorbeeld \ref{vb:h1-terug}.
      antwoord: |-
        $2^{18} = 262\,144$
      uitwerking: |-
        $1 + \tfrac k2 \geqslant 10 \iff k \geqslant 18$. Het echte aantal ligt tussen beide grenzen: $1024 \leqslant 12\,367 \leqslant 262\,144$.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    telescoperende reeks
  opgave: |-
    Bereken $\displaystyle\sominf{n=1} \frac{1}{n(n+1)(n+2)}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{1}{n(n+1)(n+2)} = \dfrac12 \Bigl(\dfrac{1}{n(n+1)} - \dfrac{1}{(n+1)(n+2)}\Bigr)$.
      antwoord: |-
        gelijke noemer
      uitwerking: |-
        $\dfrac{1}{n(n+1)} - \dfrac{1}{(n+1)(n+2)} = \dfrac{(n+2) - n}{n(n+1)(n+2)} = \dfrac{2}{n(n+1)(n+2)}$.
    - opgave: |-
        Bereken de som.
      antwoord: |-
        $\tfrac14$
      uitwerking: |-
        Telescopeert met $b_n = \tfrac{1}{2n(n+1)}$: de som is $b_1 - 0 = \tfrac14$.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    rekenregels, bewijzen
  opgave: |-
    Bewijs of weerleg.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs: als $\sum u_n$ convergeert en $\sum w_n$ divergeert, dan divergeert $\sum (u_n + w_n)$.
      antwoord: |-
        uit het ongerijmde
      uitwerking: |-
        Stel dat $\sum (u_n + w_n)$ convergeert. Dan convergeert ook het verschil $\sum \bigl((u_n + w_n) - u_n\bigr) = \sum w_n$: strijdig.
    - opgave: |-
        Geef twee divergente reeksen $\sum u_n$ en $\sum w_n$ waarvoor $\sum (u_n + w_n)$ convergeert.
      antwoord: |-
        bv. $u_n = \tfrac1n$ en $w_n = -\tfrac1{n+1}$
      uitwerking: |-
        Beide divergeren (harmonisch), maar $\sum \bigl(\tfrac1n - \tfrac1{n+1}\bigr) = 1$. Eenvoudiger: $u_n = 1$ en $w_n = -1$.
    - opgave: |-
        Bewijs: als $\sum u_n = S$, dan is ook $(u_1 + u_2) + (u_3 + u_4) + \cdots = S$.
      antwoord: |-
        de partieelsommen zijn $s_2, s_4, \ldots$
      uitwerking: |-
        De $m$-de partieelsom van de nieuwe reeks is $s_{2m}$. Komen alle $s_n$ willekeurig dicht bij $S$ (vanaf een zekere index), dan ook de $s_{2m}$.
    - opgave: |-
        Waarom is c geen tegenspraak met de reeks $1 - 1 + 1 - \cdots$, die met haakjes 0 of 1 lijkt?
      antwoord: |-
        die reeks divergeert
      uitwerking: |-
        Bij c moet de reeks eerst convergeren. Bij een divergente reeks kan $s_2, s_4, \ldots$ wel convergeren (naar 0) terwijl $s_n$ dat niet doet.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    oneindig proces, sneeuwvlok van Koch
  figuur:
    code: |-
      \begin{tikzpicture}[scale=1.05]
        \fill[accent!20,draw=accent,thick] (0.000,0.000) -- (0.333,0.000) -- (0.500,0.289) -- (0.667,0.000) -- (1.000,0.000) -- (1.167,0.289) -- (1.000,0.577) -- (1.333,0.577) -- (1.500,0.866) -- (1.667,0.577) -- (2.000,0.577) -- (1.833,0.289) -- (2.000,0.000) -- (2.333,0.000) -- (2.500,0.289) -- (2.667,0.000) -- (3.000,0.000) -- (2.833,-0.289) -- (3.000,-0.577) -- (2.667,-0.577) -- (2.500,-0.866) -- (2.333,-0.577) -- (2.000,-0.577) -- (2.167,-0.866) -- (2.000,-1.155) -- (2.333,-1.155) -- (2.500,-1.443) -- (2.333,-1.732) -- (2.000,-1.732) -- (1.833,-2.021) -- (1.667,-1.732) -- (1.500,-2.021) -- (1.333,-1.732) -- (1.167,-2.021) -- (1.000,-1.732) -- (0.667,-1.732) -- (0.500,-1.443) -- (0.667,-1.155) -- (1.000,-1.155) -- (0.833,-0.866) -- (1.000,-0.577) -- (0.667,-0.577) -- (0.500,-0.866) -- (0.333,-0.577) -- (0.000,-0.577) -- (0.167,-0.289) -- cycle;
      \end{tikzpicture}
  opgave: |-
    Vertrek van een gelijkzijdige driehoek met zijde 1. Verdeel elke zijde in drie gelijke stukken, en zet op het middelste stuk naar buiten een gelijkzijdige driehoek. Herhaal dat met elke zijde van de nieuwe figuur, en zo verder. De figuur na twee stappen staat hiernaast.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel zijden heeft de figuur na $k$ stappen, en hoe lang is elke zijde? Toon aan dat de omtrek boven elke grens groeit.
      antwoord: |-
        $3 \cdot 4^k$ zijden van $\tfrac1{3^k}$; omtrek $3\bigl(\tfrac43\bigr)^k \to +\infty$
      uitwerking: |-
        Elke zijde wordt vier zijden van een derde zo lang. De omtrek wordt telkens $\tfrac43$ keer zo groot.
    - opgave: |-
        Hoeveel driehoekjes komen er bij in stap $k$, en wat is de oppervlakte van elk? Noem $A$ de oppervlakte van de eerste driehoek.
      antwoord: |-
        $3 \cdot 4^{k-1}$ driehoekjes van $\tfrac{A}{9^k}$
      uitwerking: |-
        Op elke zijde van de vorige figuur komt er één bij: $3 \cdot 4^{k-1}$. Hun zijde is $\tfrac1{3^k}$, dus hun oppervlakte is $\bigl(\tfrac1{3^k}\bigr)^2 A = \tfrac{A}{9^k}$.
    - opgave: |-
        Toon aan dat de oppervlakte van de sneeuwvlok $\tfrac85 A$ is.
      antwoord: |-
        $\tfrac85 A = \tfrac{2\sqrt3}{5} \approx 0{,}693$
      uitwerking: |-
        $A + \sominf{k=1} 3 \cdot 4^{k-1} \cdot \dfrac{A}{9^k} = A + A \cdot \dfrac{3/9}{1 - 4/9} = A + \tfrac35 A = \tfrac85 A$, met $A = \tfrac{\sqrt3}{4}$. Een oneindige omtrek rond een eindige oppervlakte.

# --- Koppel -----------------------------------------------------------------------------

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: |-
      Kansrekenen
  prent:
    naam: dobbelstenen
  opgave: |-
    Anna en Bart gooien om beurten met een dobbelsteen. Anna begint. Wie het eerst een zes gooit, wint.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de kans dat Anna wint bij haar eerste worp? En bij haar tweede worp?
      antwoord: |-
        $\tfrac16$ en $\tfrac{25}{216}$
      uitwerking: |-
        Bij de tweede worp van Anna hebben eerst Anna en Bart allebei geen zes gegooid: $\bigl(\tfrac56\bigr)^2 \cdot \tfrac16 = \tfrac{25}{216}$.
    - opgave: |-
        Wat is de kans dat Anna wint bij haar $n$-de worp?
      antwoord: |-
        $\bigl(\tfrac{25}{36}\bigr)^{n-1} \cdot \tfrac16$
      uitwerking: |-
        Er gaan $n - 1$ rondes zonder zes vooraf, elk met kans $\tfrac{25}{36}$.
    - opgave: |-
        Wat is de kans dat Anna wint? En dat Bart wint?
      antwoord: |-
        $\tfrac6{11}$ en $\tfrac5{11}$
      uitwerking: |-
        $\sominf{n=1} \tfrac16 \bigl(\tfrac{25}{36}\bigr)^{n-1} = \dfrac{1/6}{1 - 25/36} = \dfrac{1/6}{11/36} = \tfrac6{11}$. Het spel eindigt met kans 1 (zie d), dus Bart wint met kans $\tfrac5{11}$.
    - opgave: |-
        Toon aan dat de kans dat niemand ooit een zes gooit, 0 is.
      antwoord: |-
        $\bigl(\tfrac56\bigr)^n \to 0$
      uitwerking: |-
        De kans op geen zes in de eerste $n$ worpen is $\bigl(\tfrac56\bigr)^n$, en die gaat naar 0.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: discreet
    onderwerp: |-
      Logica en bewijzen
  opgave: |-
    Bewijs met volledige inductie, en bereken daarna de som van de reeks.
  lijst: enumerate
  delen:
    - opgave: |-
        $\displaystyle\sum_{k=1}^{n} \frac{1}{k(k+1)} = \frac{n}{n+1}$
      antwoord: |-
        som 1
      uitwerking: |-
        Voor $n = 1$: $\tfrac12 = \tfrac12$. Stel dat het geldt voor $n$. Dan is de som tot $n + 1$ gelijk aan $\dfrac{n}{n+1} + \dfrac{1}{(n+1)(n+2)} = \dfrac{n(n+2) + 1}{(n+1)(n+2)} = \dfrac{(n+1)^2}{(n+1)(n+2)} = \dfrac{n+1}{n+2}$. De som van de reeks is $\lim \tfrac{n}{n+1} = 1$.
    - opgave: |-
        $\displaystyle\sum_{k=1}^{n} \frac{k}{2^k} = 2 - \frac{n+2}{2^n}$
      antwoord: |-
        som 2
      uitwerking: |-
        Voor $n = 1$: $\tfrac12 = 2 - \tfrac32$. Stel dat het geldt voor $n$. Dan is de som tot $n + 1$ gelijk aan $2 - \dfrac{n+2}{2^n} + \dfrac{n+1}{2^{n+1}} = 2 - \dfrac{2n + 4 - n - 1}{2^{n+1}} = 2 - \dfrac{n+3}{2^{n+1}}$. Omdat $\tfrac{n+2}{2^n} \to 0$, is de som van de reeks 2.

- id: h1-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    De spin uit voorbeeld \ref{vb:h1-spiraal} loopt in het complexe vlak. Haar eerste stap is het complexe getal 4. Elke volgende stap is $\tfrac34$ zo lang en een kwartslag naar links gedraaid.
  lijst: enumerate
  delen:
    - opgave: |-
        Met welk complex getal $q$ vermenigvuldig je een stap om de volgende te krijgen?
      antwoord: |-
        $q = \tfrac34 \mathrm{i}$
      uitwerking: |-
        Een kwartslag naar links is vermenigvuldigen met $\mathrm{i}$, korter maken met $\tfrac34$.
    - opgave: |-
        De formule voor de meetkundige reeks geldt ook voor complexe $q$ met $|q| < 1$. Bereken het eindpunt $\sominf{n=0} 4q^n$.
      antwoord: |-
        $\tfrac{64}{25} + \tfrac{48}{25}\mathrm{i}$
      uitwerking: |-
        $\dfrac{4}{1 - \frac34\mathrm{i}} = \dfrac{16}{4 - 3\mathrm{i}} = \dfrac{16(4 + 3\mathrm{i})}{25}$. Hetzelfde eindpunt als met de horizontale en de verticale verplaatsingen apart, maar in één keer.
    - opgave: |-
        Bereken de lengte van de spiraal als $\sominf{n=0} |4q^n|$, en de afstand van het eindpunt tot de oorsprong.
      antwoord: |-
        16 en $3{,}2$
      uitwerking: |-
        $\sum 4 \bigl(\tfrac34\bigr)^n = 16$. De afstand is $\bigl|\tfrac{4}{1 - q}\bigr| = \tfrac{4}{|1 - \frac34\mathrm{i}|} = \tfrac{4}{5/4} = 3{,}2$.

- id: h1-koppel-4
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Ook voor matrices bestaat een meetkundige reeks: $I + A + A^2 + \cdots$ Neem $A = \begin{pmatrix} 0 & \frac12 \\ \frac12 & 0 \end{pmatrix}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $(I - A)(I + A + A^2 + \cdots + A^n) = I - A^{n+1}$.
      antwoord: |-
        telescopeert
      uitwerking: |-
        Werk de haakjes uit: $I + A + \cdots + A^n - A - A^2 - \cdots - A^{n+1}$. Alles valt weg behalve $I - A^{n+1}$.
    - opgave: |-
        Bereken $A^2$, en toon aan dat alle elementen van $A^n$ naar 0 gaan.
      antwoord: |-
        $A^2 = \tfrac14 I$
      uitwerking: |-
        $A^2 = \begin{pmatrix} \frac14 & 0 \\ 0 & \frac14 \end{pmatrix}$, dus $A^{2m} = \bigl(\tfrac14\bigr)^m I$ en $A^{2m+1} = \bigl(\tfrac14\bigr)^m A$. Alle elementen gaan naar 0.
    - opgave: |-
        Besluit dat $I + A + A^2 + \cdots = (I - A)^{-1}$, en bereken die matrix op twee manieren.
      antwoord: |-
        $\begin{pmatrix} \frac43 & \frac23 \\ \frac23 & \frac43 \end{pmatrix}$
      uitwerking: |-
        Uit a: $I + \cdots + A^n = (I - A)^{-1}(I - A^{n+1}) \to (I - A)^{-1}$. De inverse: $\det(I - A) = 1 - \tfrac14 = \tfrac34$, dus $(I - A)^{-1} = \tfrac43 \begin{pmatrix} 1 & \frac12 \\ \frac12 & 1 \end{pmatrix}$. Met de reeks: $\sum A^{2m} + \sum A^{2m+1} = \tfrac43 I + \tfrac43 A$, hetzelfde.

# --- Test jezelf ------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Bereken $s_n$ en de som van $\displaystyle\sominf{n=1} \frac{1}{4^n}$.
  antwoord: |-
    $s_n = \tfrac13\bigl(1 - \tfrac1{4^n}\bigr)$, som $\tfrac13$
  uitwerking: |-
    $s_n = \tfrac14 \cdot \dfrac{1 - (1/4)^n}{3/4} = \tfrac13\bigl(1 - \tfrac1{4^n}\bigr) \to \tfrac13$.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Bereken $\displaystyle\sominf{n=2} 3\Bigl(-\frac12\Bigr)^n$.
  antwoord: |-
    $\tfrac12$
  uitwerking: |-
    Eerste term $3 \cdot \tfrac14 = \tfrac34$, $q = -\tfrac12$: $\dfrac{3/4}{3/2} = \tfrac12$.

- id: h1-t3
  soort: test
  niveau: 2
  opgave: |-
    Voor welke $x$ convergeert $\displaystyle\sominf{n=0} \Bigl(\frac{x+1}{3}\Bigr)^n$? Wat is dan de som?
  antwoord: |-
    $-4 < x < 2$, som $\tfrac{3}{2 - x}$
  uitwerking: |-
    $|x + 1| < 3 \iff -4 < x < 2$. De som is $\dfrac{1}{1 - \frac{x+1}{3}} = \dfrac{3}{2 - x}$.

- id: h1-t4
  soort: test
  niveau: 2
  opgave: |-
    Bereken $\displaystyle\sominf{n=1} \frac{4}{(2n-1)(2n+1)}$.
  antwoord: |-
    2
  uitwerking: |-
    $\dfrac{4}{(2n-1)(2n+1)} = 2\Bigl(\dfrac{1}{2n-1} - \dfrac{1}{2n+1}\Bigr)$, dus $s_n = 2\bigl(1 - \tfrac{1}{2n+1}\bigr) \to 2$.

- id: h1-t5
  soort: test
  niveau: 1
  opgave: |-
    Toon aan dat $\displaystyle\sominf{n=1} \frac{3n - 1}{n + 4}$ divergeert.
  antwoord: |-
    de termen gaan naar 3
  uitwerking: |-
    $\lim \tfrac{3n - 1}{n + 4} = 3 \neq 0$.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Waar of fout? Als de termen van een reeks naar 0 gaan, dan convergeert de reeks. Verklaar met een voorbeeld.
  antwoord: |-
    fout
  uitwerking: |-
    De harmonische reeks $\sum \tfrac1n$ heeft termen die naar 0 gaan, maar divergeert. Ook $\sum \ln\bigl(1 + \tfrac1n\bigr)$, met $s_n = \ln(n+1)$.

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Een kantige spiraal bestaat uit stukken van 10 cm, 8 cm, $6{,}4$ cm, \ldots\ Hoe lang is de spiraal?
  antwoord: |-
    50 cm
  uitwerking: |-
    $q = 0{,}8$: $\dfrac{10}{1 - 0{,}8} = 50$ cm.
