# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken, of beantwoord.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(2, -1, 3) + 3\,(1, 0, -2)$
      antwoord: |-
        $(5, -1, -3)$
      uitwerking: |-
        $(2 + 3,\ -1 + 0,\ 3 - 6) = (5, -1, -3)$.
    - opgave: |-
        $2\km{1 & 0 \\ -1 & 3} - \km{0 & 4 \\ 2 & 1}$
      antwoord: |-
        $\km{2 & -4 \\ -4 & 5}$
      uitwerking: |-
        Plaats per plaats: $2 - 0$, $0 - 4$, $-2 - 2$ en $6 - 1$.
    - opgave: |-
        $(x^2 + 3x) + 2(x^2 - x + 1)$
      antwoord: |-
        $3x^2 + x + 2$
      uitwerking: |-
        $x^2 + 3x + 2x^2 - 2x + 2 = 3x^2 + x + 2$.
    - opgave: |-
        het neutraal element van $(\R^3, +)$
      antwoord: |-
        $(0, 0, 0)$
      uitwerking: |-
        $(x, y, z) + (0, 0, 0) = (x, y, z)$.
    - opgave: |-
        is $(\Z, +)$ een commutatieve groep?
      antwoord: |-
        ja
      uitwerking: |-
        Associatief en commutatief, neutraal element 0, en de inverse van $a$ is $-a \in \Z$.
    - opgave: |-
        los op: $\begin{cases} x + 2y = 0 \\ 3x + 6y = 0 \end{cases}$
      antwoord: |-
        $(x, y) = (-2t, t)$, $t \in \R$
      uitwerking: |-
        De tweede vergelijking is drie keer de eerste. Neem $y = t$, dan is $x = -2t$: oneindig veel oplossingen.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad We bekijken rijen $(u_0, u_1, u_2, \ldots)$ met $u_{n+2} = u_{n+1} + u_n$, zoals de rij van Fibonacci $0, 1, 1, 2, 3, 5, \ldots$
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf de eerste zes termen van zo'n rij die begint met $2$ en $1$.
      antwoord: |-
        $2, 1, 3, 4, 7, 11$
      uitwerking: |-
        $2 + 1 = 3$, $1 + 3 = 4$, $3 + 4 = 7$, $4 + 7 = 11$.
    - opgave: |-
        Tel die rij term per term op bij de rij van Fibonacci. Voldoet de som ook aan $u_{n+2} = u_{n+1} + u_n$?
      antwoord: |-
        $2, 2, 4, 6, 10, 16$: ja
      uitwerking: |-
        $2 + 2 = 4$, $2 + 4 = 6$, $4 + 6 = 10$, $6 + 10 = 16$. Dat geldt altijd: $(u_{n+1} + v_{n+1}) + (u_n + v_n) = u_{n+2} + v_{n+2}$.
    - opgave: |-
        Voldoet ook drie keer de rij van Fibonacci aan de recursie?
      antwoord: |-
        $0, 3, 3, 6, 9, 15$: ja
      uitwerking: |-
        $3u_{n+1} + 3u_n = 3u_{n+2}$.
    - opgave: |-
        Voor welke getallen $q$ voldoet de meetkundige rij $1, q, q^2, q^3, \ldots$ aan de recursie?
      antwoord: |-
        $q = \frac{1 + \sqrt5}{2}$ of $q = \frac{1 - \sqrt5}{2}$
      uitwerking: |-
        $q^{n+2} = q^{n+1} + q^n$, en delen door $q^n$ (met $q \neq 0$) geeft $q^2 = q + 1$, met de discriminant $D = 5$.

# --- Korte oefeningen ---------------------------------------------------------------

- id: h1-axioma
  soort: kort
  opgave: |-
    Is het een vectorruimte? Zo niet, welke voorwaarde faalt?
  lijst: enumerate
  delen:
    - opgave: |-
        $\R^2$ met de gewone optelling en $r \odot (x, y) = (2rx, 2ry)$
      antwoord: |-
        nee: de regels 3 en 4 falen
      uitwerking: |-
        $1 \odot (1, 0) = (2, 0) \neq (1, 0)$. Ook $2 \odot (1 \odot (1, 0)) = (8, 0)$, maar $2 \odot (1, 0) = (4, 0)$. De regels 1 en 2 gelden wel.
    - opgave: |-
        $\R^2$ met de gewone optelling en $r \odot (x, y) = (ry, rx)$
      antwoord: |-
        nee: de regels 3 en 4 falen
      uitwerking: |-
        $1 \odot (1, 0) = (0, 1) \neq (1, 0)$. En $1 \odot (1 \odot (1, 0)) = 1 \odot (0, 1) = (1, 0)$, terwijl $(1 \cdot 1) \odot (1, 0) = (0, 1)$.
    - opgave: |-
        de veeltermen van graad precies 2, met de gewone bewerkingen
      antwoord: |-
        nee: de optelling is geen bewerking
      uitwerking: |-
        $(x^2 + x) + (-x^2) = x$ heeft graad 1. Er is ook geen nulvector: de nulveelterm heeft geen graad 2.

- id: h1-vergelijking
  soort: kort
  opgave: |-
    Los op naar $\vec x$ in een vectorruimte. Zeg bij elke stap welke regel je gebruikt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $5\vec x - 2\vec u = 3\vec x + 4\vec v$
      antwoord: |-
        $\vec x = \vec u + 2\vec v$
      uitwerking: |-
        Tel $-3\vec x + 2\vec u$ op bij beide leden: $(5 - 3)\vec x = 2\vec u + 4\vec v$ (regel 2). Vermenigvuldig met $\frac12$: $\vec x = \vec u + 2\vec v$ (regels 1, 3 en 4).
    - opgave: |-
        $3(\vec x + \vec v) = 2(\vec u - \vec x)$
      antwoord: |-
        $\vec x = \frac25\vec u - \frac35\vec v$
      uitwerking: |-
        Regel 1: $3\vec x + 3\vec v = 2\vec u - 2\vec x$. Dus $5\vec x = 2\vec u - 3\vec v$, en met $\frac15$: $\vec x = \frac25\vec u - \frac35\vec v$.

- id: h1-deel
  soort: kort
  opgave: |-
    Is $W$ een deelruimte van $\R^3$?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $W = \bigl\{(x, y, z) \bigm| 2x + y = 0\bigr\}$
      antwoord: |-
        ja
      uitwerking: |-
        $(0, 0, 0) \in W$. Uit $2x_1 + y_1 = 0$ en $2x_2 + y_2 = 0$ volgt $2(x_1 + x_2) + (y_1 + y_2) = 0$, en $2rx + ry = r(2x + y) = 0$.
    - opgave: |-
        $W = \bigl\{(x, y, z) \bigm| x + y + z = 3\bigr\}$
      antwoord: |-
        nee
      uitwerking: |-
        $0 + 0 + 0 \neq 3$: de nulvector ligt niet in $W$.
    - opgave: |-
        $W = \bigl\{(x, y, z) \bigm| z = xy\bigr\}$
      antwoord: |-
        nee
      uitwerking: |-
        $(1, 1, 1) \in W$, maar $2\,(1, 1, 1) = (2, 2, 2) \notin W$, want $2 \neq 2 \cdot 2$.
    - opgave: |-
        $W = \bigl\{(t, -t, 2t) \bigm| t \in \R\bigr\}$
      antwoord: |-
        ja
      uitwerking: |-
        $t = 0$ geeft de nulvector. $(t, -t, 2t) + (s, -s, 2s) = (t + s, -(t + s), 2(t + s))$ en $r(t, -t, 2t) = (rt, -rt, 2rt)$ zijn weer van die vorm. Het is $\vb{(1, -1, 2)}$.

- id: h1-deelander
  soort: kort
  opgave: |-
    Is $W$ een deelruimte?
  lijst: enumerate
  delen:
    - opgave: |-
        $W = \bigl\{\km{a & 0 \\ c & d} \bigm| a, c, d \in \R\bigr\}$ in $\Rmn{2}{2}$
      antwoord: |-
        ja
      uitwerking: |-
        De nulmatrix heeft een 0 rechtsboven. Een som en een veelvoud van zulke matrices hebben rechtsboven $0 + 0 = 0$ en $r \cdot 0 = 0$.
    - opgave: |-
        $W = \bigl\{p \in \Rx{2} \bigm| p(1) = 0\bigr\}$ in $\Rx{2}$
      antwoord: |-
        ja
      uitwerking: |-
        De nulveelterm is 0 in 1. Uit $p(1) = q(1) = 0$ volgt $(p + q)(1) = 0$ en $(rp)(1) = r \cdot 0 = 0$.
    - opgave: |-
        $W = \bigl\{f \colon \R \to \R \bigm| f(0) = f(1) + 1\bigr\}$ in de functies
      antwoord: |-
        nee
      uitwerking: |-
        De nulfunctie voldoet niet: $0 \neq 0 + 1$.

- id: h1-homogeen
  soort: kort
  opgave: |-
    Bekijk de stelsels.
  lijst: enumerate
  delen:
    - opgave: |-
        Los op en beschrijf de oplossingen meetkundig: $\begin{cases} x - y + 2z = 0 \\ 2x + y + z = 0 \end{cases}$
      antwoord: |-
        $t\,(-1, 1, 1)$: een rechte door de oorsprong
      uitwerking: |-
        $R_2 - 2R_1$ geeft $3y - 3z = 0$, dus $y = z = t$ en $x = y - 2z = -t$. Controle: $-1 - 1 + 2 = 0$ en $-2 + 1 + 1 = 0$.
    - opgave: |-
        Waarom vormen de oplossingen van $\begin{cases} x - y + 2z = 1 \\ 2x + y + z = 0 \end{cases}$ geen deelruimte van $\R^3$?
      antwoord: |-
        $(0, 0, 0)$ is geen oplossing
      uitwerking: |-
        In de eerste vergelijking geeft $(0, 0, 0)$ de uitkomst $0 \neq 1$.

- id: h1-combinatie
  soort: kort
  opgave: |-
    Is de eerste vector een lineaire combinatie van de andere? Geef zo ja de coëfficiënten.
  lijst: enumerate
  delen:
    - opgave: |-
        $(1, 5, 4)$; \ $(1, 1, 1)$ en $(0, 2, 1)$
      antwoord: |-
        nee
      uitwerking: |-
        $a = 1$, $a + 2b = 5$ geeft $b = 2$, maar dan is de derde coördinaat $a + b = 3 \neq 4$.
    - opgave: |-
        $(2, 1, -1)$; \ $(1, 1, 0)$, $(0, 1, 1)$ en $(1, 0, 1)$
      antwoord: |-
        ja: $2\,(1, 1, 0) - (0, 1, 1) + 0\,(1, 0, 1)$
      uitwerking: |-
        $a + c = 2$, $a + b = 1$, $b + c = -1$. Optellen: $a + b + c = 1$, dus $a = 2$, $b = -1$, $c = 0$.
    - opgave: |-
        $\km{1 & 2 \\ 3 & 4}$; \ $\km{1 & 0 \\ 0 & 1}$, $\km{0 & 1 \\ 1 & 0}$ en $\km{1 & 1 \\ 0 & 0}$
      antwoord: |-
        nee
      uitwerking: |-
        Per plaats: $a + c = 1$, $b + c = 2$, $b = 3$, $a = 4$. Dan $c = -3$ en $b + c = 0 \neq 2$: strijdig.

- id: h1-span
  soort: kort
  opgave: |-
    Geef een vergelijking (of vergelijkingen) van de deelruimte van $\R^3$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\vb{(2, 1, 0), (0, 1, 3)}$
      antwoord: |-
        $3x - 6y + 2z = 0$
      uitwerking: |-
        $(x, y, z) = (2a,\ a + b,\ 3b)$. Dan $a = \frac x2$, $b = \frac z3$ en $y = \frac x2 + \frac z3$, of $3x - 6y + 2z = 0$.
    - opgave: |-
        $\vb{(1, -2, 3)}$
      antwoord: |-
        $y = -2x$ en $z = 3x$
      uitwerking: |-
        $(x, y, z) = (t, -2t, 3t)$: met $t = x$ volgt $y = -2x$ en $z = 3x$. Een rechte heeft twee vergelijkingen.

- id: h1-voortbrengend
  soort: kort
  opgave: |-
    Brengen de vectoren $\R^2$ voort? Schrijf zo ja $(x, y)$ als lineaire combinatie.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(1, 2)$ en $(3, 4)$
      antwoord: |-
        ja: $(x, y) = \bigl(-2x + \frac32 y\bigr)(1, 2) + \bigl(x - \frac12 y\bigr)(3, 4)$
      uitwerking: |-
        $a + 3b = x$ en $2a + 4b = y$. Uit de eerste $a = x - 3b$; invullen: $2x - 2b = y$, dus $b = x - \frac y2$ en $a = -2x + \frac32 y$.
    - opgave: |-
        $(1, 2)$ en $(-2, -4)$
      antwoord: |-
        nee
      uitwerking: |-
        $(-2, -4) = -2\,(1, 2)$: elke combinatie is een veelvoud van $(1, 2)$. Zo is $(1, 0)$ geen combinatie.

- id: h1-recursie
  soort: kort
  opgave: |-
    Zoek een formule voor $u_n$ als $u_0 = 0$, $u_1 = 5$ en $u_{n+2} = u_{n+1} + 6u_n$. Controleer met $u_2$ en $u_3$.
  antwoord: |-
    $u_n = 3^n - (-2)^n$
  uitwerking: |-
    $q^2 = q + 6$ geeft $q = 3$ of $q = -2$. Stel $u_n = a \cdot 3^n + b\,(-2)^n$: $a + b = 0$ en $3a - 2b = 5$, dus $a = 1$ en $b = -1$. Controle: $u_2 = 9 - 4 = 5 = 5 + 6 \cdot 0$ en $u_3 = 27 + 8 = 35 = 5 + 6 \cdot 5$.

# --- Opdrachten -----------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    rekenen in vectorruimten
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2\,(1, -1, 0, 3) - 3\,(0, 2, 1, -1)$ in $\R^4$
      antwoord: |-
        $(2, -8, -3, 9)$
      uitwerking: |-
        $(2, -2, 0, 6) - (0, 6, 3, -3) = (2, -8, -3, 9)$.
    - opgave: |-
        $3\km{1 & 0 & 2 \\ -1 & 1 & 0} + \km{0 & 2 & -1 \\ 4 & 0 & 1}$
      antwoord: |-
        $\km{3 & 2 & 5 \\ 1 & 3 & 1}$
      uitwerking: |-
        $\km{3 & 0 & 6 \\ -3 & 3 & 0} + \km{0 & 2 & -1 \\ 4 & 0 & 1}$.
    - opgave: |-
        $(2x^3 - x + 1) - 2(x^3 + x^2 - 3)$ in $\Rx{3}$
      antwoord: |-
        $-2x^2 - x + 7$
      uitwerking: |-
        $2x^3 - x + 1 - 2x^3 - 2x^2 + 6$.
    - opgave: |-
        $(2f - g)(\pi)$ met $f(x) = \sin x$ en $g(x) = x^2$
      antwoord: |-
        $-\pi^2$
      uitwerking: |-
        $2\sin\pi - \pi^2 = 0 - \pi^2$.
    - opgave: |-
        de eerste vier termen van $(1, 2, 4, 8, \ldots) - 3\,(1, 1, 1, 1, \ldots)$
      antwoord: |-
        $-2, -1, 1, 5$
      uitwerking: |-
        Term per term: $1 - 3$, $2 - 3$, $4 - 3$, $8 - 3$.
    - opgave: |-
        de vector $\vec x \in \R^2$ met $2\vec x + (1, 4) = (5, -2)$
      antwoord: |-
        $(2, -3)$
      uitwerking: |-
        $2\vec x = (4, -6)$, dus $\vec x = (2, -3)$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    deelruimte van het vlak of de ruimte
  opgave: |-
    Is $W$ een deelruimte? Bewijs het, of geef een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        $W = \bigl\{(x, y) \in \R^2 \bigm| y = -2x\bigr\}$
      antwoord: |-
        ja
      uitwerking: |-
        $(0, 0) \in W$. Uit $y_1 = -2x_1$ en $y_2 = -2x_2$ volgt $y_1 + y_2 = -2(x_1 + x_2)$, en $ry = -2(rx)$.
    - opgave: |-
        $W = \bigl\{(x, y) \in \R^2 \bigm| y = -2x + 3\bigr\}$
      antwoord: |-
        nee
      uitwerking: |-
        $0 \neq -2 \cdot 0 + 3$: de nulvector ligt er niet in.
    - opgave: |-
        $W = \bigl\{(x, y) \in \R^2 \bigm| x = 0 \text{ of } y = 0\bigr\}$
      antwoord: |-
        nee
      uitwerking: |-
        $(1, 0)$ en $(0, 1)$ liggen in $W$, maar $(1, 1)$ niet.
    - opgave: |-
        $W = \bigl\{(x, y, z) \in \R^3 \bigm| x + y + z = 0 \text{ en } z = 2y\bigr\}$
      antwoord: |-
        ja
      uitwerking: |-
        Het zijn de oplossingen van een homogeen stelsel ($x + y + z = 0$, $2y - z = 0$), dus een deelruimte. Het is de rechte $\vb{(-3, 1, 2)}$.
    - opgave: |-
        $W = \bigl\{(x, y, z) \in \R^3 \bigm| x \geqslant 0\bigr\}$
      antwoord: |-
        nee
      uitwerking: |-
        $(1, 0, 0) \in W$, maar $(-1)(1, 0, 0) = (-1, 0, 0) \notin W$.
    - opgave: |-
        $W = \bigl\{(x, y, z) \in \R^3 \bigm| x^2 = y^2\bigr\}$
      antwoord: |-
        nee
      uitwerking: |-
        $(1, 1, 0)$ en $(1, -1, 0)$ liggen in $W$, hun som $(2, 0, 0)$ niet: $4 \neq 0$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    nulvector en tegengestelde
  opgave: |-
    Geef de nulvector, en het tegengestelde van de gegeven vector.
  lijst: enumerate
  delen:
    - opgave: |-
        in $\Rmn{2}{3}$: \ $A = \km{1 & 0 & -2 \\ 3 & -1 & 0}$
      antwoord: |-
        de nulmatrix $\km{0 & 0 & 0 \\ 0 & 0 & 0}$; \ $-A = \km{-1 & 0 & 2 \\ -3 & 1 & 0}$
      uitwerking: |-
        Alle getallen van $-A$ zijn tegengesteld aan die van $A$, zodat $A + (-A)$ de nulmatrix is.
    - opgave: |-
        in $\Rx{3}$: \ $p(x) = x^3 - 2x + 5$
      antwoord: |-
        de nulveelterm $0$; \ $-p(x) = -x^3 + 2x - 5$
      uitwerking: |-
        $p + (-p)$ heeft alle coëfficiënten 0.
    - opgave: |-
        in de functies $\R \to \R$: \ $f(x) = \e^x$
      antwoord: |-
        de nulfunctie $x \mapsto 0$; \ $(-f)(x) = -\e^x$
      uitwerking: |-
        Het tegengestelde is de functie waarvan de grafiek het spiegelbeeld is om de $x$-as.
    - opgave: |-
        in de rijen: \ $\bigl(1, \frac12, \frac14, \frac18, \ldots\bigr)$
      antwoord: |-
        de nulrij $(0, 0, 0, \ldots)$; \ $\bigl(-1, -\frac12, -\frac14, -\frac18, \ldots\bigr)$
      uitwerking: |-
        Term per term het tegengestelde.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    lineaire combinatie
  opgave: |-
    Is de eerste vector een lineaire combinatie van de andere? Geef zo ja de coëfficiënten.
  lijst: enumerate
  delen:
    - opgave: |-
        $(5, 1)$; \ $(1, 2)$ en $(2, -1)$
      antwoord: |-
        ja: $\frac75\,(1, 2) + \frac95\,(2, -1)$
      uitwerking: |-
        $a + 2b = 5$ en $2a - b = 1$. Uit de tweede $b = 2a - 1$, invullen: $5a - 2 = 5$, dus $a = \frac75$ en $b = \frac95$.
    - opgave: |-
        $(3, 6)$; \ $(1, 2)$ en $(-2, -4)$
      antwoord: |-
        ja, bijvoorbeeld $3\,(1, 2) + 0\,(-2, -4)$
      uitwerking: |-
        $(3, 6) = 3\,(1, 2)$. Er zijn hier oneindig veel keuzes, want $(-2, -4) = -2\,(1, 2)$.
    - opgave: |-
        $(1, 0)$; \ $(1, 2)$ en $(-2, -4)$
      antwoord: |-
        nee
      uitwerking: |-
        Elke combinatie is een veelvoud van $(1, 2)$, dus heeft tweede coördinaat het dubbel van de eerste.
    - opgave: |-
        $(2, 3, 1)$; \ $(1, 1, 0)$ en $(0, 1, 1)$
      antwoord: |-
        ja: $2\,(1, 1, 0) + (0, 1, 1)$
      uitwerking: |-
        $a = 2$, $a + b = 3$ en $b = 1$: dat klopt.
    - opgave: |-
        $(1, 2, 4)$; \ $(1, 1, 0)$ en $(0, 1, 1)$
      antwoord: |-
        nee
      uitwerking: |-
        $a = 1$ en $a + b = 2$ geven $b = 1$, maar de derde coördinaat moet dan $1$ zijn, niet $4$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    deelruimte herkennen in een figuur
  opgave: |-
    Welke van de verzamelingen in de figuren zijn een deelruimte van $\R^2$? Leg uit waarom niet.
    \figuren{\begin{tikzpicture}[scale=.38,font=\scriptsize]
      \assen{-2.5}{2.8}{-2.5}{2.8}
      \draw[accent,very thick] (-2.4,-1.2) -- (2.4,1.2);
      \node[font=\small] at (0,-3.3) {a};
    \end{tikzpicture}
    \qquad
    \begin{tikzpicture}[scale=.38,font=\scriptsize]
      \assen{-2.5}{2.8}{-2.5}{2.8}
      \draw[accent,very thick] plot[domain=-1.6:1.6,samples=40,smooth] (\x,{(\x)^2});
      \node[font=\small] at (0,-3.3) {b};
    \end{tikzpicture}
    \qquad
    \begin{tikzpicture}[scale=.38,font=\scriptsize]
      \assen{-2.5}{2.8}{-2.5}{2.8}
      \draw[accent,very thick] (-2.2,-2.2) -- (2.4,2.4) (-2.2,2.2) -- (2.2,-2.2);
      \node[font=\small] at (0,-3.3) {c};
    \end{tikzpicture}
    \qquad
    \begin{tikzpicture}[scale=.38,font=\scriptsize]
      \assen{-2.5}{2.8}{-2.5}{2.8}
      \fill[accent] (0,0) circle (5pt);
      \node[font=\small] at (0,-3.3) {d};
    \end{tikzpicture}}
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        een rechte door $O$
      antwoord: |-
        ja
      uitwerking: |-
        Een rechte door de oorsprong is $\vb{\vec v}$, met $\vec v$ een richtingsvector.
    - opgave: |-
        de parabool $y = x^2$
      antwoord: |-
        nee
      uitwerking: |-
        $(1, 1)$ ligt erop, $2\,(1, 1) = (2, 2)$ niet.
    - opgave: |-
        twee rechten door $O$
      antwoord: |-
        nee
      uitwerking: |-
        $(1, 1) + (1, -1) = (2, 0)$ ligt op geen van beide.
    - opgave: |-
        alleen de oorsprong
      antwoord: |-
        ja
      uitwerking: |-
        $\{\nulv\}$: $\nulv + \nulv = \nulv$ en $r\nulv = \nulv$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijking van een voortgebrachte deelruimte
  opgave: |-
    Geef vergelijkingen van de deelruimte van $\R^3$. Is het een rechte of een vlak?
  lijst: enumerate
  delen:
    - opgave: |-
        $\vb{(1, 2, -1)}$
      antwoord: |-
        $y = 2x$ en $z = -x$: een rechte
      uitwerking: |-
        $(x, y, z) = (t, 2t, -t)$, met $t = x$.
    - opgave: |-
        $\vb{(1, 1, 0), (2, 0, 1)}$
      antwoord: |-
        $x - y - 2z = 0$: een vlak
      uitwerking: |-
        $(x, y, z) = (a + 2b,\ a,\ b)$: $a = y$ en $b = z$, dus $x = y + 2z$.
    - opgave: |-
        $\vb{(1, -1, 2), (-2, 2, -4)}$
      antwoord: |-
        $y = -x$ en $z = 2x$: een rechte
      uitwerking: |-
        $(-2, 2, -4) = -2\,(1, -1, 2)$: de tweede vector voegt niets toe, en $\vb{(1, -1, 2), (-2, 2, -4)} = \vb{(1, -1, 2)}$.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    rechten en vlakken als deelruimte
  opgave: |-
    Is de rechte of het vlak een deelruimte van $\R^3$?
  lijst: enumerate
  delen:
    - opgave: |-
        de rechte $(x, y, z) = (1, 2, 3) + t\,(2, 4, 6)$
      antwoord: |-
        ja
      uitwerking: |-
        Met $t = -\frac12$ krijg je $(0, 0, 0)$: de rechte gaat door de oorsprong, en is $\vb{(1, 2, 3)}$.
    - opgave: |-
        de rechte $(x, y, z) = (1, 0, 0) + t\,(0, 1, 0)$
      antwoord: |-
        nee
      uitwerking: |-
        De eerste coördinaat is altijd 1: de oorsprong ligt er niet op.
    - opgave: |-
        het vlak $3x - y + 2z = 0$
      antwoord: |-
        ja
      uitwerking: |-
        De oplossingen van een homogene vergelijking.
    - opgave: |-
        het vlak door $(1, 0, 0)$, $(0, 1, 0)$ en $(0, 0, 1)$
      antwoord: |-
        nee
      uitwerking: |-
        Het vlak heeft vergelijking $x + y + z = 1$, en $(0, 0, 0)$ voldoet niet.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    deelruimten van matrices
  opgave: |-
    Is $W$ een deelruimte van $\Rmn{2}{2}$?
  lijst: enumerate
  delen:
    - opgave: |-
        de matrices $\km{a & b \\ c & d}$ met $a + d = 0$
      antwoord: |-
        ja
      uitwerking: |-
        De nulmatrix voldoet. $(a + a') + (d + d') = 0 + 0$ en $ra + rd = r \cdot 0$.
    - opgave: |-
        de inverteerbare matrices
      antwoord: |-
        nee
      uitwerking: |-
        De nulmatrix is niet inverteerbaar.
    - opgave: |-
        de matrices met determinant 0
      antwoord: |-
        nee
      uitwerking: |-
        $\km{1 & 0 \\ 0 & 0}$ en $\km{0 & 0 \\ 0 & 1}$ hebben determinant 0, hun som $I$ heeft determinant 1.
    - opgave: |-
        de bovendriehoeksmatrices $\km{a & b \\ 0 & d}$
      antwoord: |-
        ja
      uitwerking: |-
        Linksonder staat bij een som $0 + 0$ en bij een veelvoud $r \cdot 0$.
    - opgave: |-
        de matrices $A$ met $AB = BA$, voor $B = \km{1 & 1 \\ 0 & 1}$
      antwoord: |-
        ja
      uitwerking: |-
        $OB = O = BO$. Uit $AB = BA$ en $A'B = BA'$ volgt $(A + A')B = AB + A'B = BA + BA' = B(A + A')$, en $(rA)B = r(AB) = r(BA) = B(rA)$.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijkingen met vectoren
  opgave: |-
    Los op in een vectorruimte $V$, met $\vec u, \vec v \in V$ gegeven.
  lijst: enumerate
  delen:
    - opgave: |-
        $4\vec x - \vec u = 2(\vec x + \vec v)$
      antwoord: |-
        $\vec x = \frac12\vec u + \vec v$
      uitwerking: |-
        $4\vec x - \vec u = 2\vec x + 2\vec v$, dus $2\vec x = \vec u + 2\vec v$.
    - opgave: |-
        het stelsel $\vec x + \vec y = \vec u$ en $\vec x - \vec y = \vec v$, naar $\vec x$ en $\vec y$
      antwoord: |-
        $\vec x = \frac12(\vec u + \vec v)$, \ $\vec y = \frac12(\vec u - \vec v)$
      uitwerking: |-
        Tel de vergelijkingen op: $2\vec x = \vec u + \vec v$. Trek ze af: $2\vec y = \vec u - \vec v$.
    - opgave: |-
        $r(\vec x - \vec u) = \nulv$, met $r \neq 0$
      antwoord: |-
        $\vec x = \vec u$
      uitwerking: |-
        Volgens de stelling over een product nul is $\vec x - \vec u = \nulv$, want $r \neq 0$. Tel $\vec u$ op bij beide leden.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    deelruimten van veeltermen
  opgave: |-
    Is $W$ een deelruimte van $\Rx{3}$?
  lijst: enumerate
  delen:
    - opgave: |-
        de veeltermen met $p(2) = 0$
      antwoord: |-
        ja
      uitwerking: |-
        $(p + q)(2) = 0 + 0$ en $(rp)(2) = r \cdot 0$; de nulveelterm voldoet.
    - opgave: |-
        de veeltermen met $p(0) = p(1)$
      antwoord: |-
        ja
      uitwerking: |-
        $(p + q)(0) = p(0) + q(0) = p(1) + q(1) = (p + q)(1)$, net zo met $rp$, en de nulveelterm voldoet.
    - opgave: |-
        de veeltermen van graad precies 2
      antwoord: |-
        nee
      uitwerking: |-
        De nulveelterm heeft geen graad 2.
    - opgave: |-
        de even veeltermen: $p(-x) = p(x)$ voor elke $x$
      antwoord: |-
        ja
      uitwerking: |-
        Het zijn de veeltermen $a + bx^2$. Een som en een veelvoud zijn weer even: $(p + q)(-x) = p(x) + q(x)$.
    - opgave: |-
        de veeltermen met $p(1) \geqslant 0$
      antwoord: |-
        nee
      uitwerking: |-
        $p(x) = 1$ voldoet, $-p$ niet.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    een parameter in een lineaire combinatie
  opgave: |-
    Bepaal $k$.
  lijst: enumerate
  delen:
    - opgave: |-
        $(1, k, 5) \in \vb{(1, 2, 3), (2, 1, 4)}$
      antwoord: |-
        $k = 5$
      uitwerking: |-
        $a + 2b = 1$ en $3a + 4b = 5$ geven $b = -1$ en $a = 3$. De tweede coördinaat is dan $2a + b = 5$.
    - opgave: |-
        $x^2 + kx + 3 \in \vb{x^2 + 1, x + 2}$ in $\Rx{2}$
      antwoord: |-
        $k = 1$
      uitwerking: |-
        $a(x^2 + 1) + b(x + 2) = ax^2 + bx + (a + 2b)$, dus $a = 1$, $b = k$ en $1 + 2k = 3$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    deelruimten van functies
  opgave: |-
    Is $W$ een deelruimte van de functies $\R \to \R$?
  lijst: enumerate
  delen:
    - opgave: |-
        de functies met $f(1) = 2f(0)$
      antwoord: |-
        ja
      uitwerking: |-
        $(f + g)(1) = 2f(0) + 2g(0) = 2(f + g)(0)$, net zo met $rf$, en de nulfunctie voldoet.
    - opgave: |-
        de functies met $f(x) \geqslant 0$ voor elke $x$
      antwoord: |-
        nee
      uitwerking: |-
        $f(x) = x^2$ voldoet, $-f$ niet.
    - opgave: |-
        de functies met periode $2\pi$: $f(x + 2\pi) = f(x)$ voor elke $x$
      antwoord: |-
        ja
      uitwerking: |-
        $(f + g)(x + 2\pi) = f(x) + g(x)$ en $(rf)(x + 2\pi) = rf(x)$; de nulfunctie is periodiek.
    - opgave: |-
        de functies met $f(0) = 1$
      antwoord: |-
        nee
      uitwerking: |-
        De nulfunctie heeft $f(0) = 0$.
    - opgave: |-
        de functies die 0 zijn op het interval $[0, 1]$
      antwoord: |-
        ja
      uitwerking: |-
        Op $[0, 1]$ is $f(x) + g(x) = 0 + 0$ en $rf(x) = r \cdot 0$.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    lineaire combinatie in een context
  opgave: |-
    Een sapfabriek mengt drie sappen. Sap $A$ bevat $60\,\%$ appel, $30\,\%$ sinaasappel en $10\,\%$ druif, of kort $A = (60, 30, 10)$. Verder is $B = (20, 60, 20)$ en $C = (40, 0, 60)$. Een mengsel van $a$ liter $A$, $b$ liter $B$ en $c$ liter $C$ heeft samenstelling $\frac{1}{a + b + c}(aA + bB + cC)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat je $(40, 30, 30)$ kunt mengen. In welke verhouding?
      antwoord: |-
        gelijke delen: $\frac13 A + \frac13 B + \frac13 C$
      uitwerking: |-
        Los $aA + bB + cC = (40, 30, 30)$ op, met $a + b + c = 1$: $60a + 20b + 40c = 40$, $30a + 60b = 30$, $10a + 20b + 60c = 30$. Dat geeft $a = b = c = \frac13$. De som $a + b + c = 1$ volgt vanzelf, omdat alle vectoren coördinaten met som 100 hebben.
    - opgave: |-
        Schrijf $(100, 0, 0)$ als lineaire combinatie van $A$, $B$ en $C$. Kan de fabriek zuiver appelsap mengen?
      antwoord: |-
        $2A - B + 0C$; nee
      uitwerking: |-
        Het stelsel geeft $a = 2$, $b = -1$, $c = 0$: controleer $2\,(60, 30, 10) - (20, 60, 20) = (100, 0, 0)$. Een negatieve hoeveelheid kun je niet mengen: als vector lukt het, als mengsel niet.
    - opgave: |-
        Kan ze $(50, 50, 0)$ mengen?
      antwoord: |-
        nee
      uitwerking: |-
        De enige combinatie is $\frac89 A + \frac{7}{18} B - \frac{5}{18} C$, met een negatieve coëfficiënt. Dat moest wel: zonder druif is $10a + 20b + 60c = 0$, en met $a, b, c \geqslant 0$ kan dat alleen als ze alle drie 0 zijn.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    deelruimten van rijen
  opgave: |-
    Is $W$ een deelruimte van de vectorruimte van alle rijen?
  lijst: enumerate
  delen:
    - opgave: |-
        de rekenkundige rijen
      antwoord: |-
        ja
      uitwerking: |-
        Heeft $u$ verschil $v$ en $u'$ verschil $v'$, dan heeft $u + u'$ verschil $v + v'$ en $ru$ verschil $rv$. De nulrij is rekenkundig met verschil 0.
    - opgave: |-
        de meetkundige rijen
      antwoord: |-
        nee
      uitwerking: |-
        $(1, 2, 4, \ldots) + (1, 3, 9, \ldots) = (2, 5, 13, \ldots)$, en $\frac52 \neq \frac{13}{5}$.
    - opgave: |-
        de rijen met limiet 0
      antwoord: |-
        ja
      uitwerking: |-
        Met de rekenregels voor limieten (Rijen): $\lim(u_n + v_n) = 0 + 0$ en $\lim ru_n = r \cdot 0$. De nulrij heeft limiet 0.
    - opgave: |-
        de rijen met limiet 1
      antwoord: |-
        nee
      uitwerking: |-
        De nulrij heeft limiet 0. Ook heeft de som van twee zulke rijen limiet 2.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    lineaire combinaties van functies
  figuur:
    opties: |-
      5.2cm
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.7cm,font=\scriptsize]
        \assen{-.3}{7}{-1.4}{1.6}
        \foreach \t in {2,4,6}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \kromme[grijs]{0}{6.6}{sin(\x r)}
        \kromme[accent!60]{0}{6.6}{cos(\x r)}
        \kromme[fel!80!black]{0}{6.6}{sin(\x r+60)}
        \node[right] at (6.6,{sin(6.6 r+60)}) {$h$};
      \end{tikzpicture}
  opgave: |-
    $W = \vb{\sin x, \cos x}$ is een deelruimte van de functies. In de figuur staan $\sin x$ (grijs), $\cos x$ en $h(x) = \sin\bigl(x + \frac\pi3\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $h \in W$.
      antwoord: |-
        $h(x) = \frac12 \sin x + \frac{\sqrt3}{2} \cos x$
      uitwerking: |-
        Met de somformule: $\sin\bigl(x + \frac\pi3\bigr) = \sin x \cos\frac\pi3 + \cos x \sin\frac\pi3$.
    - opgave: |-
        Ligt $\cos\bigl(x - \frac\pi4\bigr)$ in $W$?
      antwoord: |-
        ja: $\frac{\sqrt2}{2}\cos x + \frac{\sqrt2}{2}\sin x$
      uitwerking: |-
        $\cos(x - \frac\pi4) = \cos x \cos\frac\pi4 + \sin x \sin\frac\pi4$.
    - opgave: |-
        Ligt $\sin 2x$ in $W$?
      antwoord: |-
        nee
      uitwerking: |-
        Stel $\sin 2x = a\sin x + b\cos x$ voor elke $x$. Met $x = 0$: $0 = b$. Met $x = \frac\pi2$: $0 = a$. Maar dan is $\sin 2x = 0$ voor elke $x$, en $\sin\frac\pi2 = 1$.
    - opgave: |-
        Ligt $\sin^2 x$ in $W$?
      antwoord: |-
        nee
      uitwerking: |-
        Met $x = 0$: $0 = b$. Met $x = \frac\pi2$: $1 = a$. Met $x = -\frac\pi2$: $1 = -a$. Strijdig.

- id: h1-o16
  soort: opdracht
  niveau: 3
  thema: |-
    een vreemde vectorruimte
  opgave: |-
    Op $\R^+_0$, de strikt positieve getallen, definiëren we een ``optelling'' $u \oplus v = uv$ en een ``vermenigvuldiging met een getal'' $r \odot v = v^r$. Met die bewerkingen is $\R^+_0$ een vectorruimte.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de nulvector? Wat is het tegengestelde van $v$?
      antwoord: |-
        de nulvector is $1$, het tegengestelde is $\frac1v$
      uitwerking: |-
        $v \oplus 1 = v \cdot 1 = v$ en $v \oplus \frac1v = 1$. $(\R^+_0, \cdot)$ is een commutatieve groep (Groepen).
    - opgave: |-
        Toon de regels 1 en 2 aan.
      antwoord: |-
        $(uv)^r = u^r v^r$ en $v^{r+s} = v^r v^s$
      uitwerking: |-
        Regel 1: $r \odot (u \oplus v) = (uv)^r = u^r v^r = (r \odot u) \oplus (r \odot v)$. Regel 2: $(r + s) \odot v = v^{r+s} = v^r v^s = (r \odot v) \oplus (s \odot v)$.
    - opgave: |-
        Toon de regels 3 en 4 aan.
      antwoord: |-
        $(v^s)^r = v^{rs}$ en $v^1 = v$
      uitwerking: |-
        Regel 3: $r \odot (s \odot v) = (v^s)^r = v^{sr} = (rs) \odot v$. Regel 4: $1 \odot v = v^1 = v$.
    - opgave: |-
        Wat zegt de stelling ``nul maal een vector'' in deze vectorruimte? En de stelling over het tegengestelde?
      antwoord: |-
        $v^0 = 1$ en $v^{-1} = \frac1v$
      uitwerking: |-
        $0 \odot v$ is de nulvector: $v^0 = 1$. En $(-1) \odot v$ is het tegengestelde: $v^{-1} = \frac1v$. Twee bekende rekenregels voor machten volgen dus uit de axioma's.

- id: h1-o17
  soort: opdracht
  niveau: 3
  thema: |-
    rekenregels bewijzen
  opgave: |-
    Bewijs met de regels uit de definitie en de stellingen uit sectie 1. Hier zijn $\vec u$ en $\vec v$ vectoren en $r$ en $s$ getallen.
  lijst: enumerate
  delen:
    - opgave: |-
        $(-r)\vec v = -(r\vec v)$
      antwoord: |-
        $(-r)\vec v$ is een tegengestelde van $r\vec v$
      uitwerking: |-
        $r\vec v + (-r)\vec v = (r + (-r))\vec v = 0\vec v = \nulv$ (regel 2 en nul maal een vector). Het tegengestelde is uniek.
    - opgave: |-
        $r(\vec u - \vec v) = r\vec u - r\vec v$
      antwoord: |-
        regel 1 met $-\vec v = (-1)\vec v$
      uitwerking: |-
        $r(\vec u + (-1)\vec v) = r\vec u + r((-1)\vec v) = r\vec u + (-r)\vec v = r\vec u - r\vec v$, met regel 1, regel 3 en vraag a.
    - opgave: |-
        Uit $r\vec v = s\vec v$ en $\vec v \neq \nulv$ volgt $r = s$.
      antwoord: |-
        $(r - s)\vec v = \nulv$, en dan product nul
      uitwerking: |-
        Tel $-(s\vec v) = (-s)\vec v$ op bij beide leden: $r\vec v + (-s)\vec v = \nulv$, dus $(r - s)\vec v = \nulv$ (regel 2). Omdat $\vec v \neq \nulv$, is $r - s = 0$.

- id: h1-o18
  soort: opdracht
  niveau: 3
  thema: |-
    doorsnede en unie van deelruimten
  opgave: |-
    Neem twee deelruimten $W_1$ en $W_2$ van een vectorruimte $V$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat de doorsnede $W_1 \cap W_2$ een deelruimte is.
      antwoord: |-
        de drie voorwaarden gelden in $W_1$ en in $W_2$
      uitwerking: |-
        $\nulv$ ligt in beide. Liggen $\vec u$ en $\vec v$ in beide, dan ligt $\vec u + \vec v$ in $W_1$ en in $W_2$, want beide zijn deelruimten. Net zo met $r\vec v$.
    - opgave: |-
        Bereken $W_1 \cap W_2$ voor de vlakken $W_1 \colon x + y - z = 0$ en $W_2 \colon 2x - y + z = 0$ in $\R^3$.
      antwoord: |-
        de rechte $\vb{(0, 1, 1)}$
      uitwerking: |-
        Optellen geeft $3x = 0$, dus $x = 0$ en $y = z$.
    - opgave: |-
        Toon met dezelfde vlakken dat $W_1 \cup W_2$ geen deelruimte is.
      antwoord: |-
        $(1, 0, 1) + (1, 2, 0) = (2, 2, 1)$ ligt in geen van beide
      uitwerking: |-
        $(1, 0, 1) \in W_1$ en $(1, 2, 0) \in W_2$. Voor $(2, 2, 1)$: $2 + 2 - 1 = 3 \neq 0$ en $4 - 2 + 1 = 3 \neq 0$.
    - opgave: |-
        Bewijs: $W_1 \cup W_2$ is een deelruimte als en slechts als $W_1 \subseteq W_2$ of $W_2 \subseteq W_1$.
      antwoord: |-
        neem anders $\vec u \in W_1 \setminus W_2$ en $\vec v \in W_2 \setminus W_1$
      uitwerking: |-
        Is $W_1 \subseteq W_2$, dan is de unie $W_2$, een deelruimte. Stel omgekeerd dat geen van beide in de andere ligt: neem $\vec u \in W_1$ niet in $W_2$, en $\vec v \in W_2$ niet in $W_1$. Lag $\vec u + \vec v$ in $W_1$, dan ook $\vec v = (\vec u + \vec v) - \vec u$; lag het in $W_2$, dan ook $\vec u$. Dus ligt $\vec u + \vec v$ niet in de unie.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    een lineaire recursie
  opgave: |-
    We bekijken de rijen met $u_{n+2} = u_{n+1} + 2u_n$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke meetkundige rijen $1, q, q^2, \ldots$ voldoen?
      antwoord: |-
        $q = 2$ en $q = -1$
      uitwerking: |-
        $q^2 = q + 2$, of $(q - 2)(q + 1) = 0$.
    - opgave: |-
        Geef een formule voor de rij met $u_0 = 0$ en $u_1 = 1$.
      antwoord: |-
        $u_n = \frac13\bigl(2^n - (-1)^n\bigr)$
      uitwerking: |-
        $u_n = a \cdot 2^n + b\,(-1)^n$ met $a + b = 0$ en $2a - b = 1$: $a = \frac13$, $b = -\frac13$. De rij is $0, 1, 1, 3, 5, 11, \ldots$
    - opgave: |-
        Geef een formule voor de rij met $u_0 = 3$ en $u_1 = 0$.
      antwoord: |-
        $u_n = 2^n + 2\,(-1)^n$
      uitwerking: |-
        $a + b = 3$ en $2a - b = 0$: $a = 1$ en $b = 2$. De rij is $3, 0, 6, 6, 18, 30, \ldots$
    - opgave: |-
        Vormen de rijen met $u_{n+2} = u_{n+1} + 2u_n + 1$ een deelruimte?
      antwoord: |-
        nee
      uitwerking: |-
        De nulrij voldoet niet: $0 \neq 0 + 0 + 1$.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    vectorruimte met andere bewerkingen
  opgave: |-
    Op $\R$ nemen we de bewerking $x \oplus y = x + y + 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $(\R, \oplus)$ een commutatieve groep is. Wat is de nulvector, en het tegengestelde van $x$?
      antwoord: |-
        nulvector $-1$, tegengestelde $-2 - x$
      uitwerking: |-
        Associatief: beide kanten zijn $x + y + z + 2$. Commutatief is duidelijk. $x \oplus (-1) = x$, en $x \oplus (-2 - x) = -1$.
    - opgave: |-
        Toon aan dat het met $r \odot x = rx$ geen vectorruimte is.
      antwoord: |-
        regel 1 faalt
      uitwerking: |-
        $2 \odot (0 \oplus 0) = 2 \cdot 1 = 2$, maar $(2 \odot 0) \oplus (2 \odot 0) = 0 + 0 + 1 = 1$.
    - opgave: |-
        Toon aan dat het met $r \odot x = rx + r - 1$ wel een vectorruimte is.
      antwoord: |-
        de vier regels gelden
      uitwerking: |-
        Regel 1: $r(x + y + 1) + r - 1 = rx + ry + 2r - 1 = (rx + r - 1) + (ry + r - 1) + 1$. Regel 2: $(r + s)x + r + s - 1 = (rx + r - 1) + (sx + s - 1) + 1$. Regel 3: $r(sx + s - 1) + r - 1 = rsx + rs - 1$. Regel 4: $1x + 1 - 1 = x$. Wie $x + 1$ schrijft als $y$, krijgt de gewone bewerkingen terug.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    kenmerk van een deelruimte in één regel
  opgave: |-
    Neem een deelverzameling $W$ van een vectorruimte $V$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs: $W$ is een deelruimte als en slechts als $W$ niet leeg is en $r\vec u + s\vec v \in W$ voor alle $\vec u, \vec v \in W$ en $r, s \in \R$.
      antwoord: |-
        neem $r = s = 1$, $s = 0$, en $r = s = 0$
      uitwerking: |-
        Een deelruimte bevat $\nulv$, en $r\vec u$, $s\vec v$ en hun som. Omgekeerd: neem $\vec u \in W$; met $r = s = 0$ is $\nulv = 0\vec u + 0\vec u \in W$. Met $r = s = 1$ is $\vec u + \vec v \in W$, en met $s = 0$ is $r\vec u + 0\vec v = r\vec u \in W$.
    - opgave: |-
        Toon zo aan dat $W = \bigl\{(x, y, z) \bigm| x = 2y = 3z\bigr\}$ een deelruimte is van $\R^3$.
      antwoord: |-
        $W = \vb{(6, 3, 2)}$
      uitwerking: |-
        $(0, 0, 0) \in W$. Zijn $(x, y, z)$ en $(x', y', z')$ in $W$, dan is $rx + sx' = 2(ry + sy') = 3(rz + sz')$. Stel $z = t$: $W$ bevat de vectoren $(3t, \frac32 t, t)$, de rechte door $(6, 3, 2)$.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    gelijke voortgebrachte deelruimten
  opgave: |-
    Neem twee vectoren $\vec u$ en $\vec v$ in een vectorruimte.
  lijst: enumerate
  delen:
    - opgave: |-
        Bewijs dat $\vb{\vec u, \vec v} = \vb{\vec u + \vec v, \vec u - \vec v}$.
      antwoord: |-
        elk voortbrengend paar ligt in de deelruimte van het andere
      uitwerking: |-
        $\vec u + \vec v$ en $\vec u - \vec v$ liggen in $\vb{\vec u, \vec v}$, dus de kleinste deelruimte die ze bevat, ligt erin: $\vb{\vec u + \vec v, \vec u - \vec v} \subseteq \vb{\vec u, \vec v}$. Omgekeerd is $\vec u = \frac12(\vec u + \vec v) + \frac12(\vec u - \vec v)$ en $\vec v = \frac12(\vec u + \vec v) - \frac12(\vec u - \vec v)$.
    - opgave: |-
        Is ook altijd $\vb{\vec u, \vec v} = \vb{\vec u + \vec v, 2\vec u + 2\vec v}$?
      antwoord: |-
        nee
      uitwerking: |-
        Met $\vec u = (1, 0)$ en $\vec v = (0, 1)$ is links $\R^2$, maar rechts alleen de rechte $\vb{(1, 1)}$, want $2\vec u + 2\vec v = 2(\vec u + \vec v)$.

# --- Koppel ----------------------------------------------------------------------------

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Differentiaalvergelijkingen
  opgave: |-
    We bekijken de differentiaalvergelijking $y'' + 4y = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\cos 2x$ en $\sin 2x$ oplossingen zijn.
      antwoord: |-
        $y'' = -4y$
      uitwerking: |-
        $(\cos 2x)'' = -4\cos 2x$ en $(\sin 2x)'' = -4\sin 2x$.
    - opgave: |-
        Toon aan dat de oplossingen een deelruimte vormen van de functies.
      antwoord: |-
        afleiden is lineair
      uitwerking: |-
        De nulfunctie is een oplossing. Zijn $y_1$ en $y_2$ oplossingen, dan is $(y_1 + y_2)'' + 4(y_1 + y_2) = 0 + 0$ en $(ry_1)'' + 4ry_1 = r \cdot 0$.
    - opgave: |-
        Is $3\cos 2x - \sin 2x$ een oplossing? Moet je daarvoor nog afleiden?
      antwoord: |-
        ja; nee
      uitwerking: |-
        Het is een lineaire combinatie van twee oplossingen, dus ligt het in de deelruimte.
    - opgave: |-
        Waarom vormen de oplossingen van $y'' + 4y = 8$ geen deelruimte? Geef wel een oplossing.
      antwoord: |-
        de nulfunctie is geen oplossing; $y = 2$
      uitwerking: |-
        $0 + 0 \neq 8$. De constante $y = 2$ geeft $0 + 8 = 8$.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    De complexe getallen vormen een vectorruimte, met de gewone optelling en de vermenigvuldiging met een reëel getal. Een complex getal $a + bi$ gedraagt zich zo als de vector $(a, b)$ van $\R^2$. Is $W$ een deelruimte?
  lijst: enumerate
  delen:
    - opgave: |-
        $W = \{z \mid \operatorname{Re} z = 0\}$
      antwoord: |-
        ja
      uitwerking: |-
        De zuiver imaginaire getallen $bi$: $bi + b'i = (b + b')i$ en $r \cdot bi = (rb)i$. In het complexe vlak is het de imaginaire as.
    - opgave: |-
        $W = \{z \mid |z| = 1\}$
      antwoord: |-
        nee
      uitwerking: |-
        $0$ ligt niet op de eenheidscirkel.
    - opgave: |-
        $W = \{z \mid \operatorname{Im} z = 2\operatorname{Re} z\}$
      antwoord: |-
        ja
      uitwerking: |-
        De getallen $a + 2ai$: een rechte door 0 in het complexe vlak, $\vb{1 + 2i}$.
    - opgave: |-
        $W = \{z \mid z^2 \in \R\}$
      antwoord: |-
        nee
      uitwerking: |-
        $(a + bi)^2 = a^2 - b^2 + 2abi$ is reëel als $a = 0$ of $b = 0$: de twee assen. $1$ en $i$ liggen in $W$, maar $(1 + i)^2 = 2i$ niet.

- id: h1-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Ruimtemeetkunde
  opgave: |-
    Gegeven zijn de vlakken $\alpha \colon x + 2y - z = 0$ en $\beta \colon x + 2y - z = 4$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\alpha = \vb{(1, 0, 1), (0, 1, 2)}$.
      antwoord: |-
        $(x, y, x + 2y) = x(1, 0, 1) + y(0, 1, 2)$
      uitwerking: |-
        Een punt van $\alpha$ heeft $z = x + 2y$, en is dus $x(1, 0, 1) + y(0, 1, 2)$. Omgekeerd voldoet $(a,\ b,\ a + 2b)$ aan $a + 2b - (a + 2b) = 0$.
    - opgave: |-
        Waarom is $\beta$ geen deelruimte?
      antwoord: |-
        $(0, 0, 0) \notin \beta$
      uitwerking: |-
        $0 \neq 4$. Het vlak $\beta$ is evenwijdig met $\alpha$ en gaat niet door de oorsprong.
    - opgave: |-
        Geef een parametervoorstelling van $\beta$ met dezelfde richtingsvectoren.
      antwoord: |-
        $(x, y, z) = (4, 0, 0) + r(1, 0, 1) + s(0, 1, 2)$
      uitwerking: |-
        $(4, 0, 0)$ ligt in $\beta$. Een vlak is een punt plus een deelruimte van dimensie 2: daarop komen we in hoofdstuk 3 terug.

# --- Test jezelf ------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Op $\R^2$ nemen we de gewone optelling en $r \odot (x, y) = (rx, y)$. Welke van de vier regels geldt niet? Geef een tegenvoorbeeld.
  antwoord: |-
    regel 2
  uitwerking: |-
    $(1 + 1) \odot (0, 1) = (0, 1)$, maar $1 \odot (0, 1) + 1 \odot (0, 1) = (0, 2)$. De regels 1, 3 en 4 gelden: $(r(x + x'), y + y')$, $(rsx, y)$ en $(x, y)$.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Los op naar $\vec x$ in een vectorruimte: \ $2\vec x - \vec u = 5\vec x + 2\vec v$.
  antwoord: |-
    $\vec x = -\frac13\vec u - \frac23\vec v$
  uitwerking: |-
    $-3\vec x = \vec u + 2\vec v$, en vermenigvuldig met $-\frac13$.

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Is $W = \bigl\{(x, y, z) \in \R^3 \bigm| 2x - y = 0 \text{ en } z = x + y\bigr\}$ een deelruimte van $\R^3$? Bewijs.
  antwoord: |-
    ja, de rechte $\vb{(1, 2, 3)}$
  uitwerking: |-
    $(0, 0, 0)$ voldoet. Een som en een veelvoud voldoen aan beide vergelijkingen, want ze zijn homogeen: $2(x + x') - (y + y') = 0 + 0$ en $z + z' = (x + x') + (y + y')$, en net zo met $r$. Met $x = t$ is $y = 2t$ en $z = 3t$.

- id: h1-t4
  soort: test
  niveau: 1
  opgave: |-
    Is $W = \bigl\{p \in \Rx{2} \bigm| p(1) = 2\bigr\}$ een deelruimte van $\Rx{2}$?
  antwoord: |-
    nee
  uitwerking: |-
    De nulveelterm heeft waarde 0 in 1, niet 2.

- id: h1-t5
  soort: test
  niveau: 1
  opgave: |-
    Is $(1, 5, -1)$ een lineaire combinatie van $(1, 1, 1)$ en $(0, 2, -1)$?
  antwoord: |-
    ja: $(1, 1, 1) + 2\,(0, 2, -1)$
  uitwerking: |-
    $a = 1$, $a + 2b = 5$ geeft $b = 2$, en de derde coördinaat $a - b = -1$ klopt.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Geef een vergelijking van $\vb{(1, 1, 0), (0, 1, 2)}$ in $\R^3$.
  antwoord: |-
    $2x - 2y + z = 0$
  uitwerking: |-
    $(x, y, z) = (a,\ a + b,\ 2b)$: $a = x$, $b = \frac z2$, dus $y = x + \frac z2$. Controle: $2 - 2 + 0 = 0$ en $0 - 2 + 2 = 0$.

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Zoek een formule voor $u_n$ als $u_0 = 1$, $u_1 = 4$ en $u_{n+2} = 5u_{n+1} - 6u_n$.
  antwoord: |-
    $u_n = 2 \cdot 3^n - 2^n$
  uitwerking: |-
    $q^2 = 5q - 6$ geeft $q = 2$ of $q = 3$. Uit $a + b = 1$ en $2a + 3b = 4$ volgt $b = 2$ en $a = -1$. Controle: $u_2 = 18 - 4 = 14 = 5 \cdot 4 - 6 \cdot 1$.
