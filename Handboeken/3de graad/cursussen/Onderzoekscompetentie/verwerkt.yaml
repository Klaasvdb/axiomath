# Wat uit de feedback van leerkrachten verwerkt is. Op axiomath.be staat bij elke plek een stippellijn naar rechts,
# met een kader "Verwerkt: <tekst>". Website/leerkrachten/maak.py zoekt de plek in elke PDF met `zoek` (een stukje
# gewone tekst uit de nieuwe versie, zonder formules; hoofdletters tellen niet; is het een lijst, dan de eerste die
# gevonden wordt) en neemt de eerste pagina waarop het staat. Staat het in een pakket niet, dan krijgt dat pakket
# geen kader. Houd dit bij voor elke verwerkte opmerking: nieuwste onderaan.
#   feedback: de nummers op de site (#id)       datum: wanneer verwerkt
#   tekst:    kort, voor de leerkracht: wat er veranderd is

- feedback: [44]
  datum: 2026-11-25
  zoek: 'Wat na de diagonalen overblijft'
  tekst: "de stap legt nu uit waarom je het verschil neemt: elk lijnstuk tussen twee hoekpunten is een zijde of een diagonaal."

- feedback: [45]
  datum: 2026-11-25
  zoek: 'Een patroon zoeken met verschillen'
  tekst: "de paragraaf heet nu 'Een patroon zoeken met verschillen' en begint met wat een heuristiek is."

- feedback: [46]
  datum: 2026-11-25
  zoek: 'De tweede verschillen van'
  tekst: "de berekening van de tweede verschillen staat nu in het bewijs zelf, en de formule erachter."

- feedback: [47]
  datum: 2026-11-25
  zoek: 'Het schema van onderuit verder'
  tekst: "het voorbeeld, de werkwijze en de oplossingen bouwen het schema van onderuit verder om de volgende waarde te vinden."
