# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $|AB|$ met $A(1, 2)$ en $B(4, 6)$
      antwoord: |-
        5
      uitwerking: |-
        $\sqrt{3^2+4^2}=5$.
    - opgave: |-
        $|AB|$ met $A(-2, 3)$ en $B(3, -9)$
      antwoord: |-
        13
      uitwerking: |-
        $\sqrt{5^2+12^2}=\sqrt{169}=13$.
    - opgave: |-
        de afstand van $P(3, -2)$ tot de rechte $y = 4$
      antwoord: |-
        6
      uitwerking: |-
        Het hoogteverschil: $|-2-4|=6$.
    - opgave: |-
        de afstand van $P(-5, 1)$ tot de rechte $x = 2$
      antwoord: |-
        7
      uitwerking: |-
        Het verschil in $x$: $|-5-2|=7$.
    - opgave: |-
        het kwadraat afsplitsen: $x^2 - 6x$
      antwoord: |-
        $(x-3)^2-9$
      uitwerking: |-
        De helft van $-6$ is $-3$: $x^2-6x=(x-3)^2-9$.
    - opgave: |-
        het kwadraat afsplitsen: $x^2 + 5x$
      antwoord: |-
        $\bigl(x+\tfrac52\bigr)^2-\tfrac{25}{4}$
      uitwerking: |-
        De helft van 5 is $\tfrac52$: $x^2+5x=\bigl(x+\tfrac52\bigr)^2-\tfrac{25}{4}$.

- id: h1-verken
  soort: start
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[scale=.68,font=\scriptsize]
        \fill[accent!12] (-1.5,2.5) -- (0,0) -- (1.5,2.5) -- cycle;
        \fill[accent!12] (-1.5,-2.5) -- (0,0) -- (1.5,-2.5) -- cycle;
        \draw[lijngrijs,thick] (-1.5,2.5) -- (1.5,-2.5) (1.5,2.5) -- (-1.5,-2.5);
        \draw[lijngrijs,densely dotted] (0,-2.8) -- (0,2.8);
        \fill (0,0) circle (1.5pt) node[left] {$T$};
        \draw[accent,thick] (-2,1.5) -- (2,1.5) node[right,text=black] {$a$};
        \draw[accent,thick] (-1.6,1) -- (1.8,2.2) node[right,text=black] {$b$};
        \draw[accent,thick] (.3,2.5) -- (1.8,0) node[right,text=black] {$c$};
        \draw[accent,thick] (.5,2.6) -- (.9,-2.6) node[right,text=black] {$d$};
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken}\quad De figuur toont een dubbelkegel van opzij. De lijnen $a$, $b$, $c$ en $d$ zijn vlakken die loodrecht op het blad staan, ook van opzij gezien.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke vlakken snijden beide helften van de kegel?
      antwoord: |-
        $d$
      uitwerking: |-
        Alleen $d$ loopt door de bovenste en de onderste helft.
    - opgave: |-
        Bij welke vlakken is de doorsnede een gesloten kromme? Waarom?
      antwoord: |-
        $a$ en $b$
      uitwerking: |-
        $a$ en $b$ snijden beide randen van de bovenste helft: ze snijden elke beschrijvende, en de doorsnede sluit.
    - opgave: |-
        Welk vlak loopt evenwijdig met een rand van de kegel? Wat betekent dat voor de doorsnede?
      antwoord: |-
        $c$; ze sluit niet
      uitwerking: |-
        $c$ loopt evenwijdig met de rand van linksboven naar rechtsonder. Die beschrijvende snijdt het vlak nooit, dus de doorsnede loopt in die richting eindeloos door.
    - opgave: |-
        Welke vorm verwacht je bij $a$?
      antwoord: |-
        een cirkel
      uitwerking: |-
        $a$ staat loodrecht op de as: alle punten van de doorsnede liggen even ver van de as. Een cirkel.

- id: h1-soort
  soort: kort
  opgave: |-
    Een vlak dat niet door de top gaat, maakt een hoek $\beta$ met de as van een dubbelkegel met halve tophoek $\alpha$. Welke kegelsnede ontstaat?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\alpha = 30^\circ$, $\beta = 45^\circ$
      antwoord: |-
        ellips
      uitwerking: |-
        $\beta>\alpha$ en $\beta\neq 90^\circ$: een ellips.
    - opgave: |-
        $\alpha = 30^\circ$, $\beta = 30^\circ$
      antwoord: |-
        parabool
      uitwerking: |-
        $\beta=\alpha$: een parabool.
    - opgave: |-
        $\alpha = 40^\circ$, $\beta = 25^\circ$
      antwoord: |-
        hyperbool
      uitwerking: |-
        $\beta<\alpha$: een hyperbool.
    - opgave: |-
        $\alpha = 25^\circ$, $\beta = 90^\circ$
      antwoord: |-
        cirkel
      uitwerking: |-
        Het vlak staat loodrecht op de as: een cirkel.
    - opgave: |-
        $\alpha = 50^\circ$, $\beta = 0^\circ$
      antwoord: |-
        hyperbool
      uitwerking: |-
        Een vlak evenwijdig met de as: $0^\circ<50^\circ$, een hyperbool.
    - opgave: |-
        $\alpha = 10^\circ$, $\beta = 12^\circ$
      antwoord: |-
        ellips
      uitwerking: |-
        $12^\circ>10^\circ$: een ellips, wel een zeer langgerekte.

- id: h1-mp
  soort: kort
  opgave: |-
    Zoek een vergelijking van de meetkundige plaats.
  lijst: enumerate
  delen:
    - opgave: |-
        De punten die even ver liggen van $A(-1, 2)$ als van $B(3, 0)$.
      antwoord: |-
        $y=2x-1$
      uitwerking: |-
        $(x+1)^2+(y-2)^2=(x-3)^2+y^2 \ \Rightarrow\ 2x+1-4y+4=-6x+9 \ \Rightarrow\ 8x-4y-4=0$, dus $y=2x-1$. Controle: het midden $(1, 1)$ ligt erop.
    - opgave: |-
        De punten op afstand 5 van $M(2, -3)$.
      antwoord: |-
        $(x-2)^2+(y+3)^2=25$
      uitwerking: |-
        $|PM|=5 \ \Rightarrow\ (x-2)^2+(y+3)^2=25$, een cirkel.

- id: h1-cirkel
  soort: kort
  opgave: |-
    Bepaal het middelpunt en de straal van de cirkel.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 + y^2 - 4x + 6y - 3 = 0$
      antwoord: |-
        $M(2,-3)$, $r=4$
      uitwerking: |-
        $(x-2)^2-4+(y+3)^2-9-3=0$, dus $(x-2)^2+(y+3)^2=16$.
    - opgave: |-
        $x^2 + y^2 + x - y = 0$
      antwoord: |-
        $M\bigl(-\tfrac12,\tfrac12\bigr)$, $r=\tfrac{\sqrt2}{2}$
      uitwerking: |-
        $\bigl(x+\tfrac12\bigr)^2-\tfrac14+\bigl(y-\tfrac12\bigr)^2-\tfrac14=0$, dus $r^2=\tfrac12$ en $r=\tfrac{\sqrt2}{2}$.
    - opgave: |-
        $2x^2 + 2y^2 - 12x + 10 = 0$
      antwoord: |-
        $M(3,0)$, $r=2$
      uitwerking: |-
        Deel eerst door 2: $x^2+y^2-6x+5=0$, dus $(x-3)^2+y^2=4$.

- id: h1-touw
  soort: kort
  opgave: |-
    Een ellips heeft brandpunten $F_1(-4, 0)$ en $F_2(4, 0)$, en voor elk punt $P$ van de ellips is $|PF_1| + |PF_2| = 10$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken de snijpunten met de assen.
      antwoord: |-
        $(\pm5, 0)$ en $(0, \pm3)$
      uitwerking: |-
        Op de $x$-as: $(x+4)+(x-4)=10$ geeft $x=5$, en symmetrisch $x=-5$. Op de $y$-as ligt $P$ even ver van beide brandpunten: $|PF_1|=5$, en $y=\pm\sqrt{25-16}=\pm3$.
    - opgave: |-
        Ligt het punt $(3;\ 2{,}4)$ op de ellips?
      antwoord: |-
        ja
      uitwerking: |-
        $|PF_1|=\sqrt{49+5{,}76}=7{,}4$ en $|PF_2|=\sqrt{1+5{,}76}=2{,}6$. De som is 10, dus ja.

- id: h1-pf
  soort: kort
  opgave: |-
    Zoek een vergelijking van de meetkundige plaats van de punten die even ver liggen van $F(0, -1)$ als van de rechte $l \leftrightarrow y = 3$. Welke kromme is het?
  antwoord: |-
    $y=1-\tfrac18x^2$, een parabool
  uitwerking: |-
    $x^2+(y+1)^2=(y-3)^2 \ \Rightarrow\ x^2+2y+1=-6y+9$, dus $x^2=8-8y$ en $y=1-\tfrac18x^2$: een parabool met de opening naar onder en top $(0, 1)$, midden tussen $F$ en $l$.

- id: h1-def
  soort: kort
  opgave: |-
    Neem $F_1(-3, 0)$ en $F_2(3, 0)$. Welke figuur vormen de punten $P$ met:
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $|PF_1| + |PF_2| = 10$
      antwoord: |-
        een ellips
      uitwerking: |-
        $10>|F_1F_2|=6$: een ellips met $2a=10$.
    - opgave: |-
        $\bigl||PF_1| - |PF_2|\bigr| = 4$
      antwoord: |-
        een hyperbool
      uitwerking: |-
        $4<6$: een hyperbool met $2a=4$.
    - opgave: |-
        $|PF_1| + |PF_2| = 6$
      antwoord: |-
        het lijnstuk $[F_1F_2]$
      uitwerking: |-
        De som is precies $|F_1F_2|$: alleen de punten van het lijnstuk $[F_1F_2]$, door de driehoeksongelijkheid.
    - opgave: |-
        $|PF_1| + |PF_2| = 4$
      antwoord: |-
        geen enkel punt
      uitwerking: |-
        De som is altijd minstens $|F_1F_2|=6$: geen enkel punt.

- id: h1-terug
  soort: kort
  opgave: |-
    Een lamp hangt 1 meter van een muur. De lichtbundel heeft een halve tophoek van $15^\circ$, en de as maakt een hoek van $70^\circ$ met de muur. Hoe ver boven het punt $H$ van de muur het dichtst bij de lamp raakt de as de muur? Waar ligt het midden van de lichtvlek?
  antwoord: |-
    36,4 cm en 39,4 cm boven $H$
  uitwerking: |-
    De as: $\tfrac{1}{\tan70^\circ}\approx0{,}364$. De randen: $\tfrac{1}{\tan85^\circ}\approx0{,}087$ en $\tfrac{1}{\tan55^\circ}\approx0{,}700$, met als midden $\tfrac{0{,}087+0{,}700}{2}\approx0{,}394$. Het midden ligt dus 3 cm boven het punt van de as.

# --- Opdrachten -------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijking van een cirkel
  opgave: |-
    Geef een vergelijking van de cirkel.
  lijst: enumerate
  delen:
    - opgave: |-
        Met middelpunt $(-2, 5)$ en straal 3.
      antwoord: |-
        $(x+2)^2+(y-5)^2=9$
      uitwerking: |-
        Rechtstreeks: $(x+2)^2+(y-5)^2=9$.
    - opgave: |-
        Met middelpunt de oorsprong, door het punt $(6, -8)$.
      antwoord: |-
        $x^2+y^2=100$
      uitwerking: |-
        $r=\sqrt{36+64}=10$, dus $x^2+y^2=100$.
    - opgave: |-
        Met middelpunt $(1, -1)$, door het punt $(4, 3)$.
      antwoord: |-
        $(x-1)^2+(y+1)^2=25$
      uitwerking: |-
        $r=\sqrt{3^2+4^2}=5$.
    - opgave: |-
        Met middellijn $[AB]$, waarbij $A(-3, 2)$ en $B(5, 8)$.
      antwoord: |-
        $(x-1)^2+(y-5)^2=25$
      uitwerking: |-
        Het middelpunt is het midden $(1, 5)$, en $r=\tfrac12|AB|=\tfrac12\sqrt{64+36}=5$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    soort kegelsnede in een context
  opgave: |-
    Welke kegelsnede zie je? Leg uit met de hoek tussen het vlak en de as.
  lijst: enumerate
  delen:
    - opgave: |-
        De rand van het water in een kegelvormig cocktailglas dat je een beetje schuin houdt.
      antwoord: |-
        een ellips
      uitwerking: |-
        Het wateroppervlak is een vlak. Het staat bijna loodrecht op de as van het glas, dus $\beta$ is groter dan de halve tophoek: een ellips.
    - opgave: |-
        De lichtvlek op de muur naast een staande lamp met een kap die boven en onder open is.
      antwoord: |-
        een hyperbool (twee takken)
      uitwerking: |-
        De lichtbundels naar boven en naar onder vormen een dubbelkegel met een verticale as. De muur is evenwijdig met de as: $\beta=0^\circ$, een hyperbool. Je ziet beide takken, een boven en een onder de lamp.
    - opgave: |-
        De lichtvlek op het plafond recht boven dezelfde lamp.
      antwoord: |-
        een cirkel
      uitwerking: |-
        Het plafond staat loodrecht op de as: een cirkel.
    - opgave: |-
        De lichtvlek van een zaklamp met halve tophoek $30^\circ$, als de as een hoek van $30^\circ$ maakt met de muur.
      antwoord: |-
        een parabool
      uitwerking: |-
        $\beta=\alpha$: een parabool. De bovenste rand van de bundel loopt evenwijdig met de muur.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    meetkundige plaats in woorden
  opgave: |-
    Beschrijf de meetkundige plaats in woorden, en geef een vergelijking.
  lijst: enumerate
  delen:
    - opgave: |-
        De punten op afstand 2 van de rechte $y = 3$.
      antwoord: |-
        twee rechten: $y=1$ en $y=5$
      uitwerking: |-
        $|y-3|=2$ geeft $y=1$ of $y=5$: twee evenwijdige rechten.
    - opgave: |-
        De punten die even ver liggen van de rechten $x = 1$ en $x = 7$.
      antwoord: |-
        de rechte $x=4$
      uitwerking: |-
        $|x-1|=|x-7|$ geeft $x=4$: de rechte midden tussen beide.
    - opgave: |-
        De punten die even ver liggen van de $x$-as als van de $y$-as.
      antwoord: |-
        $y=x$ en $y=-x$
      uitwerking: |-
        $|y|=|x|$: de twee bissectrices van de assen.
    - opgave: |-
        De punten $P$ met $|PO| = 4$, met $O$ de oorsprong.
      antwoord: |-
        $x^2+y^2=16$
      uitwerking: |-
        De cirkel met middelpunt $O$ en straal 4.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    ellips als meetkundige plaats
  opgave: |-
    De brandpunten $F_1$ en $F_2$ van een ellips liggen 10 cm van elkaar. Voor elk punt $P$ van de ellips is $|PF_1| + |PF_2| = 26$ cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de ellips?
      antwoord: |-
        26 cm
      uitwerking: |-
        De lengte is de som van de afstanden: 26 cm (zie het voorbeeld van de tuinier).
    - opgave: |-
        Hoe breed is de ellips?
      antwoord: |-
        24 cm
      uitwerking: |-
        Een punt op de middelloodlijn ligt 13 cm van elk brandpunt, en 5 cm is de halve afstand tussen de brandpunten: $\sqrt{13^2-5^2}=12$. De breedte is 24 cm.
    - opgave: |-
        Een punt $P$ van de ellips ligt 8 cm van $F_1$. Hoe ver ligt het van $F_2$?
      antwoord: |-
        18 cm
      uitwerking: |-
        $26-8=18$ cm.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    cirkel herkennen
  opgave: |-
    Bepaal het middelpunt en de straal, of leg uit waarom de vergelijking geen cirkel is.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 + y^2 + 10x - 4y + 20 = 0$
      antwoord: |-
        $M(-5,2)$, $r=3$
      uitwerking: |-
        $(x+5)^2-25+(y-2)^2-4+20=0$, dus $(x+5)^2+(y-2)^2=9$.
    - opgave: |-
        $x^2 + y^2 - 2x + 6y + 10 = 0$
      antwoord: |-
        enkel het punt $(1,-3)$
      uitwerking: |-
        $(x-1)^2+(y+3)^2=0$: dat kan alleen als beide kwadraten 0 zijn. Enkel het punt $(1, -3)$.
    - opgave: |-
        $x^2 + y^2 + 4y + 7 = 0$
      antwoord: |-
        geen enkel punt
      uitwerking: |-
        $x^2+(y+2)^2=-3$: een som van kwadraten is nooit negatief.
    - opgave: |-
        $x^2 + 2y^2 - 4x = 0$
      antwoord: |-
        geen cirkel
      uitwerking: |-
        De coëfficiënten van $x^2$ en $y^2$ verschillen. Het is een ellips (hoofdstuk 3).
    - opgave: |-
        $3x^2 + 3y^2 - 6x + 12y = 0$
      antwoord: |-
        $M(1,-2)$, $r=\sqrt5$
      uitwerking: |-
        Deel door 3: $x^2+y^2-2x+4y=0$, dus $(x-1)^2+(y+2)^2=5$.
    - opgave: |-
        $x^2 - y^2 + 2x = 0$
      antwoord: |-
        geen cirkel
      uitwerking: |-
        $y^2$ staat met een minteken. Het is een hyperbool (hoofdstuk 4).

- id: h1-o6
  soort: opdracht
  niveau: 2
  thema: |-
    ontaarde kegelsneden
  opgave: |-
    Een vlak gaat door de top van een dubbelkegel met halve tophoek $30^\circ$. Wat is de doorsnede als het vlak deze hoek met de as maakt? Maak telkens een schets van opzij.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\beta = 60^\circ$
      antwoord: |-
        enkel de top
      uitwerking: |-
        Het vlak zou een ellips geven, maar door de top krimpt die tot één punt: de top.
    - opgave: |-
        $\beta = 30^\circ$
      antwoord: |-
        één beschrijvende
      uitwerking: |-
        Het vlak raakt de kegel langs één beschrijvende: een rechte.
    - opgave: |-
        $\beta = 10^\circ$
      antwoord: |-
        twee snijdende rechten
      uitwerking: |-
        Het vlak snijdt beide helften, langs twee beschrijvenden die elkaar in de top snijden.

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundige plaats wordt een cirkel
  opgave: |-
    Neem $A(0, 0)$ en $B(3, 0)$. Zoek de meetkundige plaats van de punten $P$ die twee keer zo ver van $A$ als van $B$ liggen, dus met $|PA| = 2\,|PB|$. Controleer je antwoord met de twee punten op de $x$-as.
  antwoord: |-
    de cirkel $(x-4)^2+y^2=4$
  uitwerking: |-
    $x^2+y^2=4\bigl((x-3)^2+y^2\bigr) \ \Rightarrow\ 3x^2+3y^2-24x+36=0 \ \Rightarrow\ x^2+y^2-8x+12=0$, dus $(x-4)^2+y^2=4$: een cirkel met middelpunt $(4, 0)$ en straal 2.\\
    Controle: $(2, 0)$ ligt 2 van $A$ en 1 van $B$; $(6, 0)$ ligt 6 van $A$ en 3 van $B$.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    bollen van Dandelin
  opgave: |-
    Twee bollen van Dandelin raken een kegel langs twee cirkels. Langs elke beschrijvende liggen die cirkels 12 cm van elkaar. De bollen raken het snijvlak in $F_1$ en $F_2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Een punt $P$ van de doorsnede ligt 4,5 cm van $F_1$. Hoe ver ligt het van $F_2$?
      antwoord: |-
        7,5 cm
      uitwerking: |-
        $|PF_1|+|PF_2|=|Q_1Q_2|=12$, dus $|PF_2|=7{,}5$ cm.
    - opgave: |-
        Hoe lang is de ellips?
      antwoord: |-
        12 cm
      uitwerking: |-
        De lengte is de som van de afstanden: 12 cm.
    - opgave: |-
        $F_1$ en $F_2$ liggen 8 cm van elkaar. Hoe breed is de ellips?
      antwoord: |-
        $4\sqrt5\approx 8{,}94$ cm
      uitwerking: |-
        Een punt op de middelloodlijn ligt 6 cm van elk brandpunt: de halve breedte is $\sqrt{36-16}=\sqrt{20}$. De breedte is $2\sqrt{20}=4\sqrt5\approx 8{,}94$ cm.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    cirkel en rechte snijden
  opgave: |-
    Hoeveel snijpunten hebben de cirkel $x^2 + y^2 = 25$ en de rechte? Bereken ze.
  lijst: enumerate
  delen:
    - opgave: |-
        $y = x + 1$
      antwoord: |-
        $(3, 4)$ en $(-4, -3)$
      uitwerking: |-
        $x^2+(x+1)^2=25 \ \Rightarrow\ 2x^2+2x-24=0 \ \Rightarrow\ x^2+x-12=0$, dus $x=3$ of $x=-4$.
    - opgave: |-
        $y = 5$
      antwoord: |-
        één: $(0, 5)$
      uitwerking: |-
        $x^2=0$: één snijpunt. De rechte raakt de cirkel.
    - opgave: |-
        $x + y = 10$
      antwoord: |-
        geen
      uitwerking: |-
        $x^2+(10-x)^2=25 \ \Rightarrow\ 2x^2-20x+75=0$, met discriminant $400-600<0$: geen snijpunten.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundige plaats in een context
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.55,font=\scriptsize]
        \draw[grijs,line width=2pt] (0,0) -- (0,4.4);
        \draw[grijs,line width=2pt] (0,0) -- (4.4,0);
        \draw[lijngrijs,dashed] (2,0) arc[start angle=0,end angle=90,radius=2];
        \draw[accent,very thick] (2.4,0) -- (0,3.2);
        \fill (1.2,1.6) circle (2pt) node[right] {$M$};
        \node[below] at (2.4,0) {$A$};
        \node[left] at (0,3.2) {$B$};
      \end{tikzpicture}
  opgave: |-
    Een ladder van 4 m staat tegen een muur en glijdt weg: de voet $A$ schuift over de vloer, de top $B$ langs de muur. Neem de vloer als $x$-as en de muur als $y$-as.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel $A(a, 0)$ en $B(0, b)$. Welk verband is er tussen $a$ en $b$?
      antwoord: |-
        $a^2+b^2=16$
      uitwerking: |-
        Pythagoras: $a^2+b^2=|AB|^2=16$.
    - opgave: |-
        Toon aan dat het midden $M$ van de ladder op een cirkel ligt. Welke?
      antwoord: |-
        $x^2+y^2=4$
      uitwerking: |-
        $M\bigl(\tfrac a2, \tfrac b2\bigr)$, dus $x^2+y^2=\tfrac{a^2+b^2}{4}=4$: een kwart van de cirkel met middelpunt $O$ en straal 2.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    soorten kegelsneden, redeneren
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Een vlak evenwijdig met de as snijdt een dubbelkegel altijd volgens een hyperbool.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: gaat het vlak door de as, dan gaat het door de top, en is de doorsnede twee snijdende rechten.
    - opgave: |-
        Een ellips ligt altijd volledig in één helft van de dubbelkegel.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: het vlak snijdt elke beschrijvende in dezelfde helft. Zou het beide helften raken, dan ging het tussen die helften door, langs de top, en zou $\beta<\alpha$ zijn.
    - opgave: |-
        Een vlak loodrecht op een beschrijvende geeft altijd een ellips.
      antwoord: |-
        niet waar
      uitwerking: |-
        Dat vlak maakt een hoek $90^\circ-\alpha$ met de as. Een ellips enkel als $90^\circ-\alpha>\alpha$, dus als $\alpha<45^\circ$. Bij $\alpha=45^\circ$ is het een parabool, daarboven een hyperbool.
    - opgave: |-
        Twee evenwijdige vlakken die niet door de top gaan, snijden een kegel volgens dezelfde soort kegelsnede.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: de soort hangt alleen af van de hoek $\beta$, en die is voor beide vlakken gelijk.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    parabool als meetkundige plaats
  opgave: |-
    Zoek de meetkundige plaats van de punten die even ver liggen van $F(2, 0)$ als van de rechte $l \leftrightarrow x = -2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking en teken de kromme.
      antwoord: |-
        $y^2=8x$
      uitwerking: |-
        $(x-2)^2+y^2=(x+2)^2 \ \Rightarrow\ -4x+y^2=4x$, dus $y^2=8x$.
        \figuren{\begin{tikzpicture}[scale=.4,font=\scriptsize]
          \rooster{-3}{1}{6}{-6}{2}{6}
          \draw[grijs,thick] (-2,-6) -- (-2,6);
          \parabool{0}{0}{4}{-6}{6}
          \brandpunt{2}{0}{F}
        \end{tikzpicture}}
    - opgave: |-
        Is de kromme de grafiek van een functie van $x$? En van $y$?
      antwoord: |-
        niet van $x$, wel van $y$
      uitwerking: |-
        Bij $x=2$ horen twee waarden $y=\pm4$, dus geen functie van $x$. Wel is $x=\tfrac{y^2}{8}$ een functie van $y$: de bekende parabool, gekanteld.
    - opgave: |-
        Controleer met een punt van de kromme met $x = 2$.
      antwoord: |-
        $(2,\pm4)$: beide afstanden 4
      uitwerking: |-
        $P(2, 4)$: $|PF|=4$ en de afstand tot $x=-2$ is ook 4.

- id: h1-o13
  soort: opdracht
  prent:
    naam: beker
  niveau: 2
  thema: |-
    doorsnede van een cilinder
  opgave: |-
    Je houdt een cilindrische beker water met een diameter van 6 cm schuin, zodat de as een hoek van $30^\circ$ maakt met de verticale. Het wateroppervlak blijft horizontaal.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de kortste middellijn van het wateroppervlak? En de langste?
      antwoord: |-
        6 cm en $4\sqrt3\approx 6{,}93$ cm
      uitwerking: |-
        Loodrecht op de kantelrichting verandert er niets: 6 cm. In de kantelrichting maakt het wateroppervlak een hoek van $60^\circ$ met de as: de langste middellijn is $\dfrac{6}{\sin 60^\circ}=4\sqrt3\approx 6{,}93$ cm.
    - opgave: |-
        Een cilinder is een kegel met halve tophoek $0^\circ$, waarvan de top oneindig ver ligt. Welke doorsneden kun je uit een cilinder snijden?
      antwoord: |-
        cirkel, ellips, één of twee evenwijdige rechten, of niets
      uitwerking: |-
        Loodrecht op de as een cirkel, schuin een ellips. Een vlak evenwijdig met de as geeft twee evenwijdige rechten, één rechte (raken) of niets. Een parabool of een hyperbool kan niet: daarvoor moet $\beta\leqslant\alpha=0^\circ$, en een vlak met $\beta=0^\circ$ is evenwijdig met de as.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    cirkel door drie punten
  opgave: |-
    Zoek een vergelijking van de cirkel door $A(0, 0)$, $B(6, 0)$ en $C(0, 4)$. Gebruik dat het middelpunt even ver van de drie punten ligt.
  antwoord: |-
    $(x-3)^2+(y-2)^2=13$
  uitwerking: |-
    Het middelpunt ligt op de middelloodlijn van $[AB]$, dus $x=3$, en op die van $[AC]$, dus $y=2$. De straal is $|MA|=\sqrt{9+4}=\sqrt{13}$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    hyperbool op een muur
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.75,font=\scriptsize]
        \fill[accent!15] plot[domain=-1.1:1.1,samples=40,smooth] (\x,{sqrt((\x)^2+.25)}) -- (1.1,2.3) -- (-1.1,2.3) -- cycle;
        \draw[black!14,very thin,step=.5] (-2,0) grid (2,2.5);
        \draw[->,grijs] (-2,0) -- (2.2,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,0) -- (0,2.7) node[above,text=black] {$z$};
        \draw[accent,thick] plot[domain=-2:2,samples=60,smooth] (\x,{sqrt((\x)^2+.25)});
        \fill (0,0) circle (2pt);
        \node[below] at (0,0) {lamp};
        \node[left] at (0,.5) {$0{,}5$};
      \end{tikzpicture}
  opgave: |-
    Een lamp staat 0,5 m van een muur en schijnt naar boven, in een kegel met halve tophoek $45^\circ$. Neem de lamp als oorsprong, de $z$-as verticaal en de muur als het vlak $y = 0{,}5$. De lichtkegel is dan $x^2 + y^2 = z^2$ met $z \geqslant 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke kegelsnede vormt de rand van de lichtvlek op de muur? Waarom?
      antwoord: |-
        een tak van een hyperbool
      uitwerking: |-
        De muur is evenwijdig met de as van de kegel: $\beta=0^\circ$. Een hyperbool, waarvan je enkel de bovenste tak ziet.
    - opgave: |-
        Geef een vergelijking van die rand, met $x$ en $z$ als coördinaten in de muur.
      antwoord: |-
        $z^2-x^2=0{,}25$
      uitwerking: |-
        Vul $y=0{,}5$ in: $x^2+0{,}25=z^2$.
    - opgave: |-
        Hoe hoog boven de lamp begint de lichtvlek? Hoe breed is ze 1,3 m boven de lamp?
      antwoord: |-
        0,5 m; 2,4 m
      uitwerking: |-
        Bij $x=0$ is $z=0{,}5$. Bij $z=1{,}3$ is $x^2=1{,}69-0{,}25=1{,}44$, dus $x=\pm1{,}2$: 2,4 m breed.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundige plaats wordt een parabool
  opgave: |-
    Zoek de meetkundige plaats van de middelpunten van alle cirkels die door $A(0, 2)$ gaan en de $x$-as raken. Teken er enkele, en vergelijk met de definitie van een parabool.
  antwoord: |-
    de parabool $y=\tfrac14x^2+1$
  uitwerking: |-
    Een cirkel boven de $x$-as die de as raakt, heeft als straal de hoogte $y$ van het middelpunt $M(x, y)$. Hij gaat door $A$ als $|MA|=y$:
    $x^2+(y-2)^2=y^2 \ \Rightarrow\ x^2-4y+4=0$, dus $y=\tfrac14x^2+1$.\\
    Elk middelpunt ligt even ver van $A$ als van de $x$-as: een parabool met brandpunt $A$ en richtlijn de $x$-as.

- id: h1-o17
  soort: opdracht
  niveau: 3
  thema: |-
    meetkundige plaats wordt een ellips
  opgave: |-
    Neem de ladder van opdracht \ref{oef:h1-o10} opnieuw. Er zit een vlek op de ladder, 1 m onder de top $B$. Welke kromme beschrijft die vlek als de ladder wegglijdt? Geef een vergelijking.
  antwoord: |-
    $x^2+\dfrac{y^2}{9}=1$, een kwart van een ellips
  uitwerking: |-
    De vlek $P$ ligt op een kwart van de ladder, gemeten vanaf $B$: $P=B+\tfrac14(A-B)=\bigl(\tfrac a4, \tfrac{3b}{4}\bigr)$. Dus $a=4x$ en $b=\tfrac{4y}{3}$. Met $a^2+b^2=16$:
    $16x^2+\dfrac{16y^2}{9}=16 \ \Rightarrow\ x^2+\dfrac{y^2}{9}=1$.\\
    Geen cirkel meer: een ellips, zoals in hoofdstuk 3.

- id: h1-o18
  soort: opdracht
  niveau: 3
  thema: |-
    Dandelin voor de parabool
  opgave: |-
    Een vlak $\pi$ maakt een hoek $\beta = \alpha$ met de as van een kegel. Eén bol in de kegel raakt $\pi$ in $F$ en de kegel langs een cirkel $c$. Het horizontale vlak door $c$ snijdt $\pi$ volgens een rechte $l$. Neem een punt $P$ van de doorsnede, en $h$ de hoogte van $P$ boven het vlak van $c$.
  lijst: enumerate
  delen:
    - opgave: |-
        De beschrijvende door $P$ snijdt $c$ in $Q$. Waarom is $|PF| = |PQ|$?
      antwoord: |-
        beide raken de bol
      uitwerking: |-
        $PF$ ligt in $\pi$, dat de bol raakt, en $PQ$ op de kegel, die de bol raakt. Twee raaklijnstukken uit $P$ zijn even lang.
    - opgave: |-
        Toon aan dat $|PQ| = \dfrac{h}{\cos\alpha}$.
      antwoord: |-
        $PQ$ maakt een hoek $\alpha$ met de verticale
      uitwerking: |-
        $PQ$ ligt op een beschrijvende, die een hoek $\alpha$ maakt met de verticale as. Het hoogteverschil is $h$, dus $|PQ|\cos\alpha=h$.
    - opgave: |-
        De kortste weg van $P$ naar $l$ binnen $\pi$ maakt een hoek $\beta$ met de verticale. Toon aan dat $|PF| = \afst{P}{l}$.
      antwoord: |-
        $\afst{P}{l}=\dfrac{h}{\cos\beta}=\dfrac{h}{\cos\alpha}=|PQ|=|PF|$
      uitwerking: |-
        Dezelfde redenering: $\afst{P}{l}=\dfrac{h}{\cos\beta}$. Omdat $\beta=\alpha$ is dat $|PQ|$, en dus $|PF|$. De doorsnede is de meetkundige plaats van de punten even ver van $F$ als van $l$: een parabool met brandpunt $F$ en richtlijn $l$.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    cirkel van Apollonius
  opgave: |-
    Neem $A(0, 0)$, $B(1, 0)$ en een getal $k > 0$. Zoek de meetkundige plaats van de punten $P$ met $|PA| = k\,|PB|$. Onderscheid $k = 1$ en $k \neq 1$.
  antwoord: |-
    $k=1$: de rechte $x=\tfrac12$; $k\neq1$: de cirkel met middelpunt $\bigl(\tfrac{k^2}{k^2-1},0\bigr)$ en straal $\tfrac{k}{|k^2-1|}$
  uitwerking: |-
    $x^2+y^2=k^2\bigl((x-1)^2+y^2\bigr) \ \Rightarrow\ (1-k^2)(x^2+y^2)+2k^2x-k^2=0$.\\
    Is $k=1$, dan blijft $2x-1=0$: de middelloodlijn $x=\tfrac12$.\\
    Is $k\neq1$, deel dan door $1-k^2$ en splits het kwadraat af:
    $\Bigl(x-\dfrac{k^2}{k^2-1}\Bigr)^2+y^2=\dfrac{k^4}{(k^2-1)^2}-\dfrac{k^2}{k^2-1}=\dfrac{k^2}{(k^2-1)^2}$.\\
    Controle met $k=2$: middelpunt $\bigl(\tfrac43,0\bigr)$ en straal $\tfrac23$, zoals bij $A(0,0)$ en $B(3,0)$ na schalen met factor $\tfrac13$.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    Dandelin voor de hyperbool
  opgave: |-
    Een vlak snijdt beide helften van een dubbelkegel. In elke helft ligt een bol die de kegel raakt langs een cirkel ($c_1$ boven, $c_2$ onder) en het vlak in een punt ($F_1$ en $F_2$). Neem een punt $P$ van de tak in de bovenste helft. De beschrijvende door $P$ snijdt $c_1$ in $Q_1$ en $c_2$ in $Q_2$, en $Q_1$ ligt tussen $P$ en $Q_2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $|PF_2| - |PF_1| = |Q_1Q_2|$.
      antwoord: |-
        $|PF_2|-|PF_1|=|PQ_2|-|PQ_1|=|Q_1Q_2|$
      uitwerking: |-
        Raaklijnstukken aan dezelfde bol: $|PF_1|=|PQ_1|$ en $|PF_2|=|PQ_2|$. Omdat $Q_1$ tussen $P$ en $Q_2$ ligt, is $|PQ_2|=|PQ_1|+|Q_1Q_2|$. Dus $|PF_2|-|PF_1|=|Q_1Q_2|$.
    - opgave: |-
        Waarom is $|Q_1Q_2|$ voor elk punt $P$ even groot? Wat besluit je over de doorsnede?
      antwoord: |-
        $|Q_1Q_2|$ is de afstand tussen de cirkels langs een beschrijvende; een hyperbool
      uitwerking: |-
        $|Q_1Q_2|=|Q_1T|+|TQ_2|$, en beide stukken zijn voor elke beschrijvende even lang, omdat de cirkels loodrecht op de as staan. Het verschil van de afstanden tot $F_1$ en $F_2$ is dus constant: een hyperbool. Voor de onderste tak geldt hetzelfde, met $F_1$ en $F_2$ van rol gewisseld.

# --- Koppel -----------------------------------------------------------------------------

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Ruimtemeetkunde
  opgave: |-
    In een ruimtelijk assenstelsel is $K \leftrightarrow x^2 + y^2 = z^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $K$ een dubbelkegel is met de $z$-as als as en een halve tophoek van $45^\circ$.
      antwoord: |-
        afstand tot de as $=|z|$
      uitwerking: |-
        $\sqrt{x^2+y^2}$ is de afstand van $(x,y,z)$ tot de $z$-as. Op hoogte $z$ liggen de punten dus op een cirkel met straal $|z|$: een dubbelkegel waarvan de beschrijvenden een hoek van $45^\circ$ maken met de as.
    - opgave: |-
        Snijd $K$ met het vlak $z = 2$, met het vlak $y = 1$ en met het vlak $z = x + 2$. Welke kegelsneden krijg je? Geef telkens een vergelijking.
      antwoord: |-
        cirkel $x^2+y^2=4$; hyperbool $z^2-x^2=1$; parabool, $y^2=4x+4$ in projectie
      uitwerking: |-
        $z=2$: $x^2+y^2=4$, een cirkel.\\
        $y=1$: $z^2-x^2=1$, een hyperbool (het vlak is evenwijdig met de as).\\
        $z=x+2$: $x^2+y^2=x^2+4x+4$, dus $y^2=4x+4$. Het vlak bevat de richting $(1,0,1)$ van een beschrijvende: een parabool. De vergelijking is die van de loodrechte projectie op het $xy$-vlak.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    Teken in het complexe vlak de meetkundige plaats van de getallen $z$ met:
  lijst: enumerate
  delen:
    - opgave: |-
        $|z - 2| = 3$
      antwoord: |-
        de cirkel met middelpunt 2 en straal 3
      uitwerking: |-
        $|z-2|$ is de afstand van $z$ tot het punt 2: een cirkel met middelpunt $(2,0)$ en straal 3.
    - opgave: |-
        $|z - 2| = |z + 2\mathrm{i}|$
      antwoord: |-
        de rechte $y=-x$
      uitwerking: |-
        Even ver van $2$ als van $-2\mathrm{i}$: de middelloodlijn van die punten. Het midden is $1-\mathrm{i}$ en de richting loodrecht op $(2,2)$: de rechte $y=-x$.
    - opgave: |-
        $|z - 3| + |z + 3| = 10$. Bereken de snijpunten met de assen.
      antwoord: |-
        een ellips door $\pm5$ en $\pm4\mathrm{i}$
      uitwerking: |-
        De som van de afstanden tot 3 en $-3$ is 10: een ellips met brandpunten $\pm3$. Op de reële as: $\pm5$. Op de imaginaire as: $\sqrt{25-9}=4$, dus $\pm4\mathrm{i}$.

- id: h1-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Goniometrische functies
  opgave: |-
    Een punt beweegt in de tijd $t$ volgens $P(t) = (3 + 2\cos t,\ -1 + 2\sin t)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $P$ op een cirkel blijft. Geef het middelpunt en de straal.
      antwoord: |-
        $(x-3)^2+(y+1)^2=4$
      uitwerking: |-
        $(x-3)^2+(y+1)^2=4\cos^2t+4\sin^2t=4$: middelpunt $(3,-1)$, straal 2.
    - opgave: |-
        Op welk tijdstip $t \in [0, 2\pi[$ is $P$ het hoogste punt?
      antwoord: |-
        $t=\tfrac{\pi}{2}$
      uitwerking: |-
        $y$ is maximaal als $\sin t=1$: $t=\tfrac{\pi}{2}$, in $(3, 1)$.
    - opgave: |-
        Een ander punt beweegt volgens $Q(t) = (4\cos t,\ 2\sin t)$. Bereken $\dfrac{x^2}{16} + \dfrac{y^2}{4}$. Beschrijft $Q$ een cirkel?
      antwoord: |-
        altijd 1; geen cirkel
      uitwerking: |-
        $\cos^2t+\sin^2t=1$. Geen cirkel: $Q$ komt op afstand 4 van $O$ in $(4,0)$, maar op afstand 2 in $(0,2)$. Het is een ellips (hoofdstuk 3).

# --- Test jezelf ------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Een kegel heeft een halve tophoek van $40^\circ$. Welke kegelsnede krijg je met een vlak dat niet door de top gaat en een hoek $\beta$ maakt met de as?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\beta = 70^\circ$
      antwoord: |-
        ellips
      uitwerking: |-
        $70^\circ>40^\circ$: een ellips.
    - opgave: |-
        $\beta = 40^\circ$
      antwoord: |-
        parabool
      uitwerking: |-
        $\beta=\alpha$: een parabool.
    - opgave: |-
        $\beta = 15^\circ$
      antwoord: |-
        hyperbool
      uitwerking: |-
        $15^\circ<40^\circ$: een hyperbool.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Zoek een vergelijking van de meetkundige plaats van de punten die even ver liggen van $A(2, 1)$ als van $B(-2, 3)$.
  antwoord: |-
    $y=2x+2$
  uitwerking: |-
    $(x-2)^2+(y-1)^2=(x+2)^2+(y-3)^2 \ \Rightarrow\ -4x-2y+5=4x-6y+13 \ \Rightarrow\ 4y=8x+8$, dus $y=2x+2$.

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Bepaal het middelpunt en de straal van de cirkel $x^2 + y^2 - 2x + 8y + 8 = 0$.
  antwoord: |-
    $M(1,-4)$, $r=3$
  uitwerking: |-
    $(x-1)^2-1+(y+4)^2-16+8=0$, dus $(x-1)^2+(y+4)^2=9$.

- id: h1-t4
  soort: test
  niveau: 2
  opgave: |-
    Zoek een vergelijking van de meetkundige plaats van de punten die even ver liggen van $F(0, -2)$ als van de rechte $y = 2$. Welke kromme is het?
  antwoord: |-
    $y=-\tfrac18x^2$, een parabool
  uitwerking: |-
    $x^2+(y+2)^2=(y-2)^2 \ \Rightarrow\ x^2+8y=0$, dus $y=-\tfrac18x^2$: een parabool met de opening naar onder.

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    De brandpunten van een ellips liggen 24 cm van elkaar, en de som van de afstanden tot de brandpunten is 26 cm. Hoe lang en hoe breed is de ellips?
  antwoord: |-
    26 cm lang en 10 cm breed
  uitwerking: |-
    De lengte is de som: 26 cm. Op de middelloodlijn: $\sqrt{13^2-12^2}=5$, dus 10 cm breed.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Een lamp hangt 2 meter van een muur. De lichtbundel heeft een halve tophoek van $10^\circ$, en de as maakt een hoek van $50^\circ$ met de muur. Hoe ver boven het punt $H$ van de muur het dichtst bij de lamp raakt de as de muur? Waar ligt het midden van de lichtvlek?
  antwoord: |-
    1,68 m en 1,77 m boven $H$
  uitwerking: |-
    Een straal onder een hoek $\theta$ met de muur raakt ze op $\tfrac{2}{\tan\theta}$ van $H$. De as: $\tfrac{2}{\tan50^\circ}\approx1{,}678$ m. De randen: $\tfrac{2}{\tan60^\circ}\approx1{,}155$ en $\tfrac{2}{\tan40^\circ}\approx2{,}384$, met als midden $\approx1{,}769$ m: 9 cm boven het punt van de as.
