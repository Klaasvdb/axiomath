# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de top van $y = x^2 - 4x + 1$
      antwoord: |-
        $(2,-3)$
      uitwerking: |-
        $x=\tfrac{4}{2}=2$ en $y=4-8+1=-3$.
    - opgave: |-
        de top van $y = -2x^2 + 8x - 3$
      antwoord: |-
        $(2,5)$
      uitwerking: |-
        $x=\tfrac{-8}{-4}=2$ en $y=-8+16-3=5$.
    - opgave: |-
        de afstand van $(3, 5)$ tot de rechte $x = -1$
      antwoord: |-
        4
      uitwerking: |-
        $|3-(-1)|=4$.
    - opgave: |-
        de afgeleide van $f(x) = \tfrac18 x^2$ in $x = 4$
      antwoord: |-
        1
      uitwerking: |-
        $f'(x)=\tfrac14x$, dus $f'(4)=1$.
    - opgave: |-
        de rechte door $(2, 1)$ met richtingscoëfficiënt 3
      antwoord: |-
        $y=3x-5$
      uitwerking: |-
        $y-1=3(x-2)$, dus $y=3x-5$.
    - opgave: |-
        $x$ als $y^2 = 12x$ en $y = 6$
      antwoord: |-
        3
      uitwerking: |-
        $36=12x$, dus $x=3$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem het punt $F(0, 2)$ en de rechte $l \leftrightarrow y = -2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk punt van de $y$-as ligt even ver van $F$ als van $l$?
      antwoord: |-
        $(0,0)$
      uitwerking: |-
        Het midden tussen $F$ en $l$: de oorsprong.
    - opgave: |-
        Zoek de twee punten op de rechte $y = 2$ die even ver van $F$ als van $l$ liggen.
      antwoord: |-
        $(\pm4, 2)$
      uitwerking: |-
        Op hoogte 2 is de afstand tot $l$ gelijk aan 4. De afstand tot $F$ is daar $|x|$, dus $x=\pm4$.
    - opgave: |-
        Toon aan dat alle punten die even ver van $F$ als van $l$ liggen, op de grafiek van $y = \tfrac18 x^2$ liggen.
      antwoord: |-
        $x^2=8y$
      uitwerking: |-
        $x^2+(y-2)^2=(y+2)^2$ geeft $x^2-4y=4y$, dus $x^2=8y$.
    - opgave: |-
        Hoe ver ligt $F$ van de top? En hoe ver liggen $F$ en $l$ van elkaar?
      antwoord: |-
        2 en 4
      uitwerking: |-
        De top is de oorsprong: $F$ ligt 2 hoger. $F$ en $l$ liggen 4 van elkaar.

- id: h2-std
  soort: kort
  opgave: |-
    Bepaal het brandpunt en de richtlijn.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 = 12y$
      antwoord: |-
        $F(0,3)$, $y=-3$
      uitwerking: |-
        $2p=12$, $p=6$, $\tfrac p2=3$; opening naar boven.
    - opgave: |-
        $y^2 = -2x$
      antwoord: |-
        $F\bigl(-\tfrac12,0\bigr)$, $x=\tfrac12$
      uitwerking: |-
        $2p=2$, $p=1$; opening naar links.
    - opgave: |-
        $x^2 = -y$
      antwoord: |-
        $F\bigl(0,-\tfrac14\bigr)$, $y=\tfrac14$
      uitwerking: |-
        $2p=1$, $\tfrac p2=\tfrac14$; opening naar onder.

- id: h2-graf
  soort: kort
  opgave: |-
    Bepaal het brandpunt en de richtlijn van de grafiek.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = 3x^2$
      antwoord: |-
        $F\bigl(0,\tfrac1{12}\bigr)$, $y=-\tfrac1{12}$
      uitwerking: |-
        $\dfrac{1}{4a}=\dfrac{1}{12}$.
    - opgave: |-
        $y = -\tfrac18 x^2$
      antwoord: |-
        $F(0,-2)$, $y=2$
      uitwerking: |-
        $\dfrac{1}{4a}=\dfrac{1}{-1/2}=-2$. Controle: $x^2=-8y$, $p=4$.

- id: h2-versch
  soort: kort
  opgave: |-
    Bepaal de top, het brandpunt en de richtlijn.
  lijst: enumerate
  delen:
    - opgave: |-
        $y = x^2 + 2x + 3$
      antwoord: |-
        top $(-1,2)$, $F\bigl(-1,\tfrac94\bigr)$, $y=\tfrac74$
      uitwerking: |-
        $(x+1)^2=y-2$: $2p=1$, $\tfrac p2=\tfrac14$, opening naar boven.
    - opgave: |-
        $y^2 - 6y - 4x + 5 = 0$
      antwoord: |-
        top $(-1,3)$, $F(0,3)$, $x=-2$
      uitwerking: |-
        $(y-3)^2-9=4x-5$, dus $(y-3)^2=4(x+1)$: $2p=4$, $\tfrac p2=1$, opening naar rechts.

- id: h2-raak
  soort: kort
  opgave: |-
    Bepaal de raaklijn in het gegeven punt.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 = 8y$ in $(4, 2)$
      antwoord: |-
        $y=x-2$
      uitwerking: |-
        $16=8\cdot2$ klopt. $p=4$: $4x=4(y+2)$, dus $y=x-2$.
    - opgave: |-
        $y^2 = -4x$ in $(-1, 2)$
      antwoord: |-
        $y=-x+1$
      uitwerking: |-
        $4=-4\cdot(-1)$ klopt. Ontdubbelen: $2y=-2(x-1)$, dus $y=-x+1$.

- id: h2-fl
  soort: kort
  opgave: |-
    Geef een vergelijking van de parabool met het gegeven brandpunt en de gegeven richtlijn.
  lijst: enumerate
  delen:
    - opgave: |-
        Brandpunt $(0, 3)$ en richtlijn $y = -1$.
      antwoord: |-
        $x^2=8(y-1)$
      uitwerking: |-
        Top $(0,1)$, midden tussen $F$ en $l$; $p=4$, opening naar boven. Controle: $x^2+(y-3)^2=(y+1)^2$ geeft $x^2=8y-8$.
    - opgave: |-
        Brandpunt $(2, -1)$ en richtlijn $x = 6$.
      antwoord: |-
        $(y+1)^2=-8(x-4)$
      uitwerking: |-
        Top $(4,-1)$; $p=4$, opening naar links, want het brandpunt ligt links van de richtlijn.

- id: h2-spiegel
  soort: kort
  opgave: |-
    Neem de parabool $y^2 = 4x$ en het punt $P(4, 4)$ erop.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef $F$, de projectie $P'$ van $P$ op de richtlijn, en de raaklijn in $P$.
      antwoord: |-
        $F(1,0)$, $P'(-1,4)$, $y=\tfrac12x+2$
      uitwerking: |-
        $p=2$: $F(1,0)$ en richtlijn $x=-1$, dus $P'(-1,4)$. Ontdubbelen: $4y=2(x+4)$, of $y=\tfrac12x+2$.
    - opgave: |-
        Controleer dat de raaklijn de middelloodlijn van $[FP']$ is.
      antwoord: |-
        het midden $(0,2)$ ligt erop en $\overrightarrow{FP'}\perp$ raaklijn
      uitwerking: |-
        Het midden van $[FP']$ is $(0,2)$, en dat ligt op de raaklijn. $\overrightarrow{FP'}=(-2,4)$ en een richtingsvector van de raaklijn is $(2,1)$: het scalair product is $-4+4=0$.

- id: h2-schotel
  soort: kort
  opgave: |-
    Reken met een parabolische schotel.
  lijst: enumerate
  delen:
    - opgave: |-
        Een schotel is 50 cm breed en 5 cm diep. Hoe hoog boven de bodem staat de ontvanger?
      antwoord: |-
        31,25 cm
      uitwerking: |-
        $x^2=2py$ door $(25,5)$: $625=10p$, dus $p=62{,}5$ en $\tfrac p2=31{,}25$ cm.
    - opgave: |-
        Het lampje van een koplamp staat 2 cm boven de bodem van een parabolische spiegel van 12 cm breed. Hoe diep is de spiegel?
      antwoord: |-
        4,5 cm
      uitwerking: |-
        $\tfrac p2=2$, dus $p=4$ en $x^2=8y$. De rand ligt in $x=6$: $y=\tfrac{36}{8}=4{,}5$ cm.

# --- Opdrachten -------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    brandpunt en richtlijn, tekenen
  opgave: |-
    Bepaal het brandpunt en de richtlijn, en teken de parabool met de twee punten naast het brandpunt.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y^2 = 12x$
      antwoord: |-
        $F(3,0)$, $x=-3$
      uitwerking: |-
        $p=6$. Naast $F$: $(3,\pm6)$.
    - opgave: |-
        $x^2 = -4y$
      antwoord: |-
        $F(0,-1)$, $y=1$
      uitwerking: |-
        $p=2$, opening naar onder. Naast $F$: $(\pm2,-1)$.
    - opgave: |-
        $y = 3x^2$
      antwoord: |-
        $F\bigl(0,\tfrac1{12}\bigr)$, $y=-\tfrac1{12}$
      uitwerking: |-
        $x^2=\tfrac13y$: $p=\tfrac16$. Naast $F$: $\bigl(\pm\tfrac16,\tfrac1{12}\bigr)$, een smalle parabool.
    - opgave: |-
        $y^2 = -10x$
      antwoord: |-
        $F\bigl(-\tfrac52,0\bigr)$, $x=\tfrac52$
      uitwerking: |-
        $p=5$, opening naar links. Naast $F$: $\bigl(-\tfrac52,\pm5\bigr)$.
        \figuren{\begin{tikzpicture}[scale=.3,font=\scriptsize]
          \rooster{-6}{2}{4}{-6}{2}{6}
          \draw[grijs,thick] (2.5,-6) -- (2.5,6);
          \parabool{0}{0}{-5}{-6.5}{6.5}
          \brandpunt{-2.5}{0}{F}
          \fill (-2.5,5) circle (5pt) (-2.5,-5) circle (5pt);
        \end{tikzpicture}}

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijking opstellen
  opgave: |-
    Geef een vergelijking van de parabool met de top in de oorsprong en:
  lijst: enumerate
  delen:
    - opgave: |-
        brandpunt $(0, 3)$;
      antwoord: |-
        $x^2=12y$
      uitwerking: |-
        $\tfrac p2=3$, $p=6$, opening naar boven.
    - opgave: |-
        richtlijn $x = 2$;
      antwoord: |-
        $y^2=-8x$
      uitwerking: |-
        De richtlijn ligt rechts, dus het brandpunt links: opening naar links, $\tfrac p2=2$, $p=4$.
    - opgave: |-
        brandpunt $(-1, 0)$;
      antwoord: |-
        $y^2=-4x$
      uitwerking: |-
        $\tfrac p2=1$, $p=2$, opening naar links.
    - opgave: |-
        de $x$-as als as, door het punt $(2, 4)$.
      antwoord: |-
        $y^2=8x$
      uitwerking: |-
        $y^2=2px$ met $16=4p$, dus $p=4$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    parabool herkennen
  opgave: |-
    Welke vergelijkingen stellen een parabool voor? Geef bij een parabool de richting van de as.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $y = 2x^2 - 3$
      antwoord: |-
        ja, verticaal
      uitwerking: |-
        Ja: $x^2=\tfrac12(y+3)$, as $x=0$.
    - opgave: |-
        $x = y^2 + 1$
      antwoord: |-
        ja, horizontaal
      uitwerking: |-
        Ja: $y^2=x-1$, as $y=0$.
    - opgave: |-
        $x^2 + y = 4$
      antwoord: |-
        ja, verticaal
      uitwerking: |-
        Ja: $x^2=-(y-4)$, opening naar onder.
    - opgave: |-
        $x^2 + y^2 = 4$
      antwoord: |-
        nee
      uitwerking: |-
        Nee: een cirkel.
    - opgave: |-
        $xy = 1$
      antwoord: |-
        nee
      uitwerking: |-
        Nee: de grafiek van $\tfrac1x$, een hyperbool (hoofdstuk 4).
    - opgave: |-
        $y^2 - 4y = x$
      antwoord: |-
        ja, horizontaal
      uitwerking: |-
        Ja: $(y-2)^2=x+4$, as $y=2$.

- id: h2-o4
  soort: opdracht
  prent:
    naam: auto
  niveau: 1
  thema: |-
    brandpunt in een context
  opgave: |-
    De spiegel van een koplamp is een parabolische schotel van 16 cm breed en 6 cm diep. Waar moet het lampje staan om een evenwijdige bundel te geven?
  antwoord: |-
    $\tfrac83\approx2{,}67$ cm boven de bodem, op de as
  uitwerking: |-
    $x^2=2py$ door $(8,6)$: $64=12p$, dus $p=\tfrac{16}{3}$. Het brandpunt ligt op $\tfrac p2=\tfrac83\approx 2{,}67$ cm boven de bodem.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    eigenschappen, redeneren
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        De top van een parabool ligt midden tussen het brandpunt en de richtlijn.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: de top ligt op de parabool en op de as, dus even ver van $F$ als van $l$.
    - opgave: |-
        Hoe groter $p$, hoe smaller de parabool.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: bij $x^2=2py$ is $y=\tfrac{x^2}{2p}$ kleiner als $p$ groter is. De parabool wordt breder.
    - opgave: |-
        De parabolen $y = x^2$ en $x = y^2$ zijn even breed.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: ze zijn elkaars spiegelbeeld om $y=x$, met dezelfde $p=\tfrac12$.
    - opgave: |-
        Elke rechte die een parabool in precies één punt snijdt, is een raaklijn.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: een rechte evenwijdig met de as snijdt de parabool in één punt, maar raakt niet. Een straal in de schotel is zo'n rechte.

- id: h2-o6
  soort: opdracht
  niveau: 2
  thema: |-
    verschoven parabool
  opgave: |-
    Bepaal de top, het brandpunt en de richtlijn.
  lijst: enumerate
  delen:
    - opgave: |-
        $(y - 1)^2 = 4(x + 2)$
      antwoord: |-
        top $(-2,1)$, $F(-1,1)$, $x=-3$
      uitwerking: |-
        $2p=4$, $\tfrac p2=1$, opening naar rechts.
    - opgave: |-
        $y = x^2 + 6x + 5$
      antwoord: |-
        top $(-3,-4)$, $F\bigl(-3,-\tfrac{15}4\bigr)$, $y=-\tfrac{17}4$
      uitwerking: |-
        $(x+3)^2=y+4$: $2p=1$, $\tfrac p2=\tfrac14$.
    - opgave: |-
        $x^2 - 2x + 8y + 17 = 0$
      antwoord: |-
        top $(1,-2)$, $F(1,-4)$, $y=0$
      uitwerking: |-
        $(x-1)^2=-8y-16=-8(y+2)$: opening naar onder, $p=4$, $\tfrac p2=2$.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijn
  opgave: |-
    Bepaal de raaklijn aan de parabool in het gegeven punt. Controleer eerst of het punt op de parabool ligt.
  lijst: enumerate
  delen:
    - opgave: |-
        $y^2 = 4x$ in $(1, 2)$
      antwoord: |-
        $y=x+1$
      uitwerking: |-
        $p=2$: $2y=2(x+1)$.
    - opgave: |-
        $x^2 = 6y$ in $(6, 6)$
      antwoord: |-
        $y=2x-6$
      uitwerking: |-
        $p=3$: $6x=3(y+6)$, dus $y=2x-6$.
    - opgave: |-
        $y^2 = -8x$ in $(-2, 4)$
      antwoord: |-
        $y=-x+2$
      uitwerking: |-
        $16=-8\cdot(-2)$ klopt. Ontdubbelen: $4y=-4(x-2)$, dus $y=-x+2$.
    - opgave: |-
        $(x - 1)^2 = 4(y + 3)$ in $(5, 1)$
      antwoord: |-
        $y=2x-9$
      uitwerking: |-
        $16=4\cdot4$ klopt. Ontdubbelen werkt ook verschoven: $(x-1)(5-1)=2\bigl((y+3)+(1+3)\bigr)$, dus $4x-4=2y+14$ en $y=2x-9$. Controle met de afgeleide: $y=\tfrac14(x-1)^2-3$, $y'(5)=2$.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    parabool in een context
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \fill[accent!15] plot[domain=-3:3,samples=40,smooth] (\x,{4.5-(\x)^2/2}) -- cycle;
        \draw[grijs,thick] (-3.6,0) -- (3.6,0);
        \kromme{-3}{3}{4.5-(\x)^2/2}
        \draw[grijs,fill=white] (-1.2,0) rectangle (1.2,3.6);
        \node[below] at (-3,0) {$-3$};
        \node[below] at (3,0) {3};
        \node[above] at (0,4.5) {4,5};
      \end{tikzpicture}
  opgave: |-
    De opening van een stenen poort is een parabool: 6 m breed aan de grond en 4,5 m hoog in het midden.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking, met de grond als $x$-as en de as van de poort als $y$-as.
      antwoord: |-
        $x^2=-2(y-4{,}5)$
      uitwerking: |-
        Top $(0;\ 4{,}5)$, opening naar onder: $x^2=-2p(y-4{,}5)$ door $(3,0)$ geeft $9=9p$, dus $p=1$. Of: $y=4{,}5-\tfrac12x^2$.
    - opgave: |-
        Kan een vrachtwagen van 2,4 m breed en 3,6 m hoog door het midden van de poort?
      antwoord: |-
        ja, met 18 cm marge
      uitwerking: |-
        Bij $x=1{,}2$ is $y=4{,}5-0{,}72=3{,}78>3{,}6$. Ja, met 18 cm marge.
    - opgave: |-
        Waar ligt het brandpunt?
      antwoord: |-
        $(0,4)$
      uitwerking: |-
        $\tfrac p2=\tfrac12$ onder de top: $(0, 4)$.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    verschoven parabool opstellen
  opgave: |-
    Een parabool heeft een horizontale as, haar top in $(1, 2)$, en gaat door $(3, 6)$. Geef een vergelijking, het brandpunt en de richtlijn.
  antwoord: |-
    $(y-2)^2=8(x-1)$, $F(3,2)$, $x=-1$
  uitwerking: |-
    $(y-2)^2=2p(x-1)$ door $(3,6)$: $16=4p$, dus $p=4$ en $\tfrac p2=2$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijn met gegeven richting
  opgave: |-
    Bepaal de raaklijn aan de parabool $y^2 = 12x$ die evenwijdig is met de rechte $y = x + 7$. In welk punt raakt ze?
  antwoord: |-
    $y=x+3$, in $(3,6)$
  uitwerking: |-
    De raaklijn in $(x_1,y_1)$ is $y_1y=6(x+x_1)$, met richtingscoëfficiënt $\tfrac{6}{y_1}$. Die moet 1 zijn: $y_1=6$ en $x_1=\tfrac{36}{12}=3$. De raaklijn is $6y=6(x+3)$, of $y=x+3$.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    parabool in een context
  opgave: |-
    Een tuinslang spuit water horizontaal weg uit een opening op 1,25 m hoogte. Het water raakt de grond 2 m verder. De straal is een parabool met de top in de opening.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking van de straal. Neem de grond als $x$-as, onder de opening de oorsprong.
      antwoord: |-
        $x^2=-3{,}2(y-1{,}25)$
      uitwerking: |-
        $x^2=-2p(y-1{,}25)$ door $(2,0)$: $4=2{,}5p$, dus $p=1{,}6$.
    - opgave: |-
        Hoe hoog is de straal 1 m van de opening?
      antwoord: |-
        ongeveer 0,94 m
      uitwerking: |-
        $1=-3{,}2(y-1{,}25)$, dus $y=1{,}25-0{,}3125=0{,}9375$ m.
    - opgave: |-
        Waar ligt het brandpunt van die parabool?
      antwoord: |-
        $(0;\ 0{,}45)$
      uitwerking: |-
        $\tfrac p2=0{,}8$ onder de top: $(0;\ 0{,}45)$.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    koorde door het brandpunt
  opgave: |-
    De koorde door het brandpunt, loodrecht op de as, heet de \textit{brandpuntskoorde}.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de brandpuntskoorde van $y^2 = 2px$ lengte $2p$ heeft.
      antwoord: |-
        eindpunten $\bigl(\tfrac p2,\pm p\bigr)$
      uitwerking: |-
        In $x=\tfrac p2$ is $y^2=p^2$, dus $y=\pm p$: de lengte is $2p$.
    - opgave: |-
        Waarom is dat zonder rekenen te zien met de definitie van een parabool?
      antwoord: |-
        $|PF|=\afst{P}{l}=p$
      uitwerking: |-
        Een eindpunt $P$ ligt even ver van $l$ als $F$, dus op afstand $p$ van $l$. Dan is ook $|PF|=p$.
    - opgave: |-
        Geef de parabool $x^2 = 2py$ met een brandpuntskoorde van 10.
      antwoord: |-
        $x^2=10y$
      uitwerking: |-
        $2p=10$, dus $x^2=10y$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    van brandpunt en richtlijn naar vergelijking
  opgave: |-
    Geef een vergelijking van de parabool met brandpunt $F(2, 5)$ en richtlijn $y = 1$. Doe het op twee manieren: met de top en $p$, en met de meetkundige plaats.
  antwoord: |-
    $(x-2)^2=8(y-3)$
  uitwerking: |-
    Met de top: midden tussen $F$ en $l$ ligt $(2,3)$, $p=4$, opening naar boven: $(x-2)^2=8(y-3)$.\\
    Met de meetkundige plaats: $(x-2)^2+(y-5)^2=(y-1)^2$, dus $(x-2)^2=8y-24=8(y-3)$.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijnen door een punt buiten de parabool
  opgave: |-
    Bepaal de raaklijnen aan $x^2 = 4y$ die door het punt $A(0, -1)$ gaan. Wat valt op aan hun richtingen? Waar ligt $A$?
  antwoord: |-
    $y=x-1$ en $y=-x-1$; ze staan loodrecht; $A$ ligt op de richtlijn
  uitwerking: |-
    De raaklijn in $(x_1,y_1)$ is $x_1x=2(y+y_1)$. Ze gaat door $A$ als $0=2(-1+y_1)$, dus $y_1=1$ en $x_1=\pm2$. Dat geeft $y=x-1$ en $y=-x-1$.\\
    De richtingscoëfficiënten 1 en $-1$ hebben product $-1$: de raaklijnen staan loodrecht. $A$ ligt op de richtlijn $y=-1$: dat is geen toeval.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    parabool en rechte snijden
  opgave: |-
    Neem de parabool $y^2 = 4x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de snijpunten met de rechte $y = 2x - 4$.
      antwoord: |-
        $(1,-2)$ en $(4,4)$
      uitwerking: |-
        $(2x-4)^2=4x \ \Rightarrow\ 4x^2-20x+16=0 \ \Rightarrow\ x^2-5x+4=0$, dus $x=1$ of $x=4$.
    - opgave: |-
        Voor welke $m$ raakt de rechte $y = mx + 1$ de parabool? Gebruik de discriminant.
      antwoord: |-
        $m=1$
      uitwerking: |-
        $(mx+1)^2=4x \ \Rightarrow\ m^2x^2+(2m-4)x+1=0$. Raken betekent één (dubbel) snijpunt: $D=(2m-4)^2-4m^2=16-16m=0$, dus $m=1$. Voor $m=0$ is er wel één snijpunt, maar dan is de vergelijking van de eerste graad: de rechte $y=1$ is evenwijdig met de as en raakt niet.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    brandpunt in een context, omgekeerd
  opgave: |-
    Een schotelantenne is 90 cm breed. De ontvanger staat in het brandpunt, 30 cm boven de bodem. Hoe diep is de schotel?
  antwoord: |-
    ongeveer 16,9 cm
  uitwerking: |-
    $\tfrac p2=30$, dus $p=60$ en $x^2=120y$. De rand ligt in $x=45$: $y=\tfrac{2025}{120}=16{,}875$ cm.

- id: h2-o17
  soort: opdracht
  niveau: 3
  thema: |-
    holle bolspiegel en parabool
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.28,font=\scriptsize]
        \draw[lijngrijs] (-7,0) -- (7,0) (0,-1) -- (0,11);
        \draw[accent,thick] plot[domain=-6.5:6.5,samples=60,smooth] (\x,{10-sqrt(100-(\x)^2)});
        \draw[grijs,dashed] plot[domain=-6.5:6.5,samples=60,smooth] (\x,{(\x)^2/20});
        \fill (0,10) circle (5pt) node[right] {$M$};
        \fill[accent] (0,5) circle (5pt) node[right] {$F$};
      \end{tikzpicture}
  opgave: |-
    Een holle spiegel is vaak een stuk van een bol, en geen parabool. Neem een doorsnede: de cirkel met middelpunt $M(0, R)$ door de oorsprong, met $R = 10$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het onderste deel van de cirkel de grafiek is van $y = R - \sqrt{R^2 - x^2}$.
      antwoord: |-
        los $x^2+(y-R)^2=R^2$ op naar $y$
      uitwerking: |-
        $(y-R)^2=R^2-x^2$, en onderaan is $y<R$: $y-R=-\sqrt{R^2-x^2}$.
    - opgave: |-
        Vergelijk voor $x = 1$, 2 en 4 de cirkel met de parabool $y = \dfrac{x^2}{2R}$. Wat stel je vast?
      antwoord: |-
        0,0501 / 0,05; 0,2020 / 0,2; 0,8348 / 0,8
      uitwerking: |-
        Cirkel: $10-\sqrt{99}\approx0{,}0501$, $10-\sqrt{96}\approx0{,}2020$, $10-\sqrt{84}\approx0{,}8348$. Parabool: 0,05; 0,2; 0,8. Dicht bij de as vallen ze bijna samen, verder weg wijken ze af.
    - opgave: |-
        Waar ligt het brandpunt van die parabool? Waarom zegt men in de fysica dat een holle spiegel een brandpuntsafstand $\tfrac R2$ heeft, en waarom is dat maar bij benadering?
      antwoord: |-
        $\bigl(0,\tfrac R2\bigr)$
      uitwerking: |-
        $x^2=2Ry$: $p=R$, dus het brandpunt ligt op $\tfrac R2$. Stralen dicht bij de as treffen een spiegel die bijna die parabool is, en gaan bijna door $\bigl(0,\tfrac R2\bigr)$. Stralen ver van de as treffen een stuk dat afwijkt, en snijden de as op een andere plaats: het beeld wordt wazig. Een parabolische spiegel heeft dat probleem niet.

- id: h2-o18
  soort: opdracht
  niveau: 3
  thema: |-
    raaklijn construeren, gelijkbenige driehoek
  opgave: |-
    Neem de parabool $y^2 = 2px$ en een punt $P(x_1, y_1)$ erop, met $y_1 \neq 0$. De raaklijn in $P$ snijdt de as in $T$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $T(-x_1, 0)$.
      antwoord: |-
        $y=0$ in $y_1y=p(x+x_1)$
      uitwerking: |-
        $0=p(x+x_1)$ geeft $x=-x_1$.
    - opgave: |-
        Toon aan dat $|FT| = |FP|$.
      antwoord: |-
        beide zijn $x_1+\tfrac p2$
      uitwerking: |-
        $|FT|=\tfrac p2+x_1$. En $|FP|=\afst{P}{l}=x_1+\tfrac p2$, door de definitie.
    - opgave: |-
        Leid daaruit een eenvoudige constructie van de raaklijn af, en een tweede bewijs van de spiegeleigenschap.
      antwoord: |-
        $T$ op de as met $|FT|=|FP|$; gelijke hoeken in driehoek $FTP$
      uitwerking: |-
        Pas $|FP|$ af vanaf $F$ op de as, naar de kant van de richtlijn: dat geeft $T$, en $PT$ is de raaklijn.\\
        Driehoek $FTP$ is gelijkbenig, dus de hoeken in $T$ en $P$ zijn gelijk. De hoek in $T$ is de hoek tussen de raaklijn en de as, en dus ook tussen de raaklijn en een straal evenwijdig met de as. De hoek in $P$ is de hoek tussen de raaklijn en $PF$. Een straal evenwijdig met de as weerkaatst dus langs $PF$.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    raaklijnen vanuit een punt van de richtlijn
  opgave: |-
    Neem de parabool $x^2 = 2py$ en een punt $A\bigl(a, -\tfrac p2\bigr)$ op de richtlijn. Toon aan dat er twee raaklijnen door $A$ gaan, en dat ze loodrecht op elkaar staan.
  antwoord: |-
    $x_1^2-2ax_1-p^2=0$; product van de richtingscoëfficiënten $-1$
  uitwerking: |-
    De raaklijn in $(x_1,y_1)$ is $x_1x=p(y+y_1)$, met richtingscoëfficiënt $\tfrac{x_1}{p}$. Ze gaat door $A$ als $ax_1=p\bigl(y_1-\tfrac p2\bigr)=\tfrac{x_1^2}{2}-\tfrac{p^2}{2}$, of
    $x_1^2-2ax_1-p^2=0$.\\
    De discriminant $4a^2+4p^2$ is positief: twee oplossingen, dus twee raaklijnen. Het product van de oplossingen is $-p^2$, dus het product van de richtingscoëfficiënten is $\dfrac{x_1x_1'}{p^2}=-1$.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    parabool met een schuine richtlijn
  opgave: |-
    De afstand van $P(x, y)$ tot de rechte $ax + by + c = 0$ is $\dfrac{|ax + by + c|}{\sqrt{a^2 + b^2}}$. Zoek een vergelijking van de parabool met brandpunt de oorsprong en richtlijn $x + y = 2$. Controleer met de top.
  antwoord: |-
    $x^2-2xy+y^2+4x+4y-4=0$
  uitwerking: |-
    $x^2+y^2=\dfrac{(x+y-2)^2}{2} \ \Rightarrow\ 2x^2+2y^2=x^2+2xy+y^2-4x-4y+4$, dus $x^2-2xy+y^2+4x+4y-4=0$.\\
    De as is de loodlijn $y=x$ uit $F$ op $l$, die $l$ snijdt in $(1,1)$. De top ligt in het midden: $\bigl(\tfrac12,\tfrac12\bigr)$. Invullen: $\tfrac14-\tfrac12+\tfrac14+2+2-4=0$. Een gekantelde parabool krijgt een term in $xy$ (hoofdstuk 5).

# --- Koppel -----------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Integralen
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \gebiedtussen{-2}{2}{4}{(\x)^2}
        \draw[accent!70,fill=accent!45] (-2,4) -- (0,0) -- (2,4) -- cycle;
        \rooster{-2}{1}{2}{0}{1}{4}
        \kromme{-2.1}{2.1}{(\x)^2}
        \draw[grijs,thick] (-2.4,4) -- (2.4,4);
      \end{tikzpicture}
  opgave: |-
    Archimedes vond rond 250 voor Christus de oppervlakte van een paraboolsegment, zonder integralen.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de oppervlakte tussen de parabool $y = x^2$ en de rechte $y = 4$, en die van de driehoek met hoekpunten $(-2, 4)$, $(2, 4)$ en de top.
      antwoord: |-
        $\tfrac{32}{3}$ en 8
      uitwerking: |-
        $\displaystyle\int_{-2}^{2}(4-x^2)\dx=16-\tfrac{16}{3}=\tfrac{32}{3}$. De driehoek: $\tfrac12\cdot4\cdot4=8$.
    - opgave: |-
        Doe hetzelfde met de rechte $y = h^2$. Wat vond Archimedes?
      antwoord: |-
        het segment is altijd $\tfrac43$ van de driehoek
      uitwerking: |-
        Segment: $\displaystyle\int_{-h}^{h}(h^2-x^2)\dx=2h^3-\tfrac23h^3=\tfrac43h^3$. Driehoek: $\tfrac12\cdot2h\cdot h^2=h^3$. De verhouding is altijd $\tfrac43$.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Een parabool met een verticale as gaat door $(-1, 6)$, $(1, 2)$ en $(2, 3)$. Stel een stelsel op voor $a$, $b$ en $c$ in $y = ax^2 + bx + c$, los het op met de methode van Gauss-Jordan, en bepaal het brandpunt.
  antwoord: |-
    $y=x^2-2x+3$, $F\bigl(1,\tfrac94\bigr)$
  uitwerking: |-
    $a-b+c=6$, $a+b+c=2$, $4a+2b+c=3$. Gauss-Jordan op de uitgebreide matrix geeft $a=1$, $b=-2$, $c=3$.\\
    $y=x^2-2x+3$, of $(x-1)^2=y-2$: top $(1,2)$ en $\tfrac p2=\tfrac14$, dus $F\bigl(1,\tfrac94\bigr)$.

- id: h2-koppel-3
  soort: koppel
  prent:
    naam: hangbrug
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Exponentiële functies
  opgave: |-
    Een ketting die aan twee punten hangt, vormt de grafiek van $\cosh x = \dfrac{\e^x + \e^{-x}}{2}$. Galilei dacht dat het een parabool was.
  lijst: enumerate
  delen:
    - opgave: |-
        Vergelijk $\cosh x$ met $1 + \tfrac12 x^2$ voor $x = 0{,}5$, 1 en 2.
      antwoord: |-
        1,128 / 1,125; 1,543 / 1,5; 3,762 / 3
      uitwerking: |-
        $\cosh0{,}5\approx1{,}128$, $\cosh1\approx1{,}543$, $\cosh2\approx3{,}762$, tegenover $1{,}125$; $1{,}5$ en $3$. Dicht bij de top lijken ze sterk, verder weg stijgt $\cosh$ sneller.
    - opgave: |-
        Waar ligt het brandpunt van de parabool $y = 1 + \tfrac12 x^2$?
      antwoord: |-
        $\bigl(0,\tfrac32\bigr)$
      uitwerking: |-
        $a=\tfrac12$: $\tfrac{1}{4a}=\tfrac12$ boven de top $(0,1)$.
    - opgave: |-
        De kabel van een hangbrug draagt een brugdek dat gelijkmatig verdeeld is, en vormt wel een parabool. Waarom hangt een ketting dan anders?
      antwoord: |-
        het gewicht zit in de ketting zelf
      uitwerking: |-
        Bij de brug hangt het gewicht gelijk verdeeld per meter in de horizontale richting. Bij een ketting zit het gewicht in de ketting, gelijk verdeeld per meter langs de ketting: waar ze steil hangt, zit per horizontale meter meer gewicht. Daarom stijgt de ketting op het einde sneller dan een parabool.

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Bepaal het brandpunt en de richtlijn van $x^2 = -6y$.
  antwoord: |-
    $F\bigl(0,-\tfrac32\bigr)$, $y=\tfrac32$
  uitwerking: |-
    $2p=6$, $p=3$, opening naar onder.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Geef een vergelijking van de parabool met de top in de oorsprong en brandpunt $(2, 0)$.
  antwoord: |-
    $y^2=8x$
  uitwerking: |-
    $\tfrac p2=2$, $p=4$, opening naar rechts.

- id: h2-t3
  soort: test
  niveau: 2
  opgave: |-
    Bepaal de top, het brandpunt en de richtlijn van de grafiek van $y = x^2 + 2x$.
  antwoord: |-
    top $(-1,-1)$, $F\bigl(-1,-\tfrac34\bigr)$, $y=-\tfrac54$
  uitwerking: |-
    $(x+1)^2=y+1$: $2p=1$, $\tfrac p2=\tfrac14$.

- id: h2-t4
  soort: test
  niveau: 2
  opgave: |-
    Bepaal de raaklijn aan de parabool $y^2 = 6x$ in het punt $(6, 6)$.
  antwoord: |-
    $y=\tfrac12x+3$
  uitwerking: |-
    $36=36$ klopt. $p=3$: $6y=3(x+6)$, dus $y=\tfrac12x+3$.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Een schotelantenne is 60 cm breed en 9 cm diep. Hoe hoog boven de bodem staat de ontvanger?
  antwoord: |-
    25 cm
  uitwerking: |-
    $x^2=2py$ door $(30,9)$: $900=18p$, dus $p=50$ en $\tfrac p2=25$ cm.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Geef een vergelijking van de parabool met brandpunt $(1, 4)$ en richtlijn $y = 0$.
  antwoord: |-
    $(x-1)^2=8(y-2)$
  uitwerking: |-
    Top $(1,2)$, midden tussen $F$ en $l$; $p=4$, opening naar boven. Controle: $(x-1)^2+(y-4)^2=y^2$ geeft $(x-1)^2=8y-16$.
