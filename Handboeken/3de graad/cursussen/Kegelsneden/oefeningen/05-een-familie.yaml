# Oefeningen van hoofdstuk 5. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h5-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de excentriciteit van $\dfrac{x^2}{25} + \dfrac{y^2}{9} = 1$
      antwoord: |-
        $\tfrac45$
      uitwerking: |-
        $c=\sqrt{25-9}=4$, $e=\tfrac45$.
    - opgave: |-
        de excentriciteit van $x^2 - y^2 = 1$
      antwoord: |-
        $\sqrt2$
      uitwerking: |-
        $c=\sqrt2$, $a=1$.
    - opgave: |-
        de afstand van $(3, 5)$ tot de rechte $x = 8$
      antwoord: |-
        5
      uitwerking: |-
        $|3-8|=5$.
    - opgave: |-
        de modulus en het argument van $1 + \sqrt3\,\mathrm{i}$
      antwoord: |-
        2 en $\tfrac{\pi}{3}$
      uitwerking: |-
        $\sqrt{1+3}=2$ en $\tan\theta=\sqrt3$ in het eerste kwadrant.
    - opgave: |-
        het kwadraat afsplitsen in $3x^2 - 12x$
      antwoord: |-
        $3(x-2)^2-12$
      uitwerking: |-
        $3(x^2-4x)=3\bigl((x-2)^2-4\bigr)$.
    - opgave: |-
        $r\cos\theta$ en $r\sin\theta$ voor $r = 4$ en $\theta = \tfrac{3\pi}{4}$
      antwoord: |-
        $-2\sqrt2$ en $2\sqrt2$
      uitwerking: |-
        $4\cdot\bigl(-\tfrac{\sqrt2}{2}\bigr)$ en $4\cdot\tfrac{\sqrt2}{2}$.

- id: h5-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem $F(0, 0)$ en de rechte $l \leftrightarrow x = 3$. Zoek de punten van de $x$-as waarvoor $|PF| = e \cdot \afst{P}{l}$, voor:
  lijst: enumerate
  delen:
    - opgave: |-
        $e = \tfrac12$;
      antwoord: |-
        $x=1$ en $x=-3$
      uitwerking: |-
        $|x|=\tfrac12|3-x|$: $x=1$ of $x=-3$. Beide liggen aan de kant van $F$: de toppen van een ellips.
    - opgave: |-
        $e = 1$;
      antwoord: |-
        $x=\tfrac32$
      uitwerking: |-
        $|x|=|3-x|$ geeft enkel $x=\tfrac32$: de top van een parabool.
    - opgave: |-
        $e = 2$.
      antwoord: |-
        $x=2$ en $x=6$
      uitwerking: |-
        $|x|=2|3-x|$: $x=2$ of $x=6$. Ze liggen aan weerszijden van $l$: de toppen van een hyperbool, één op elke tak.
    - opgave: |-
        Welke kegelsnede verwacht je telkens? Waarom?
      antwoord: |-
        ellips, parabool, hyperbool
      uitwerking: |-
        Bij $e<1$ ligt elk punt dichter bij $F$ dan bij $l$, en blijft de kromme rond $F$: een ellips. Bij $e=1$ een parabool. Bij $e>1$ liggen er ook punten aan de andere kant van $l$: twee takken.

- id: h5-mp
  soort: kort
  opgave: |-
    Zoek de meetkundige plaats van de punten $P$ met $|PF| = \tfrac23\,\afst{P}{l}$, met $F(2, 0)$ en $l \leftrightarrow x = \tfrac92$. Controleer de excentriciteit.
  antwoord: |-
    $\tfrac{x^2}{9}+\tfrac{y^2}{5}=1$, $e=\tfrac23$
  uitwerking: |-
    $(x-2)^2+y^2=\tfrac49\bigl(x-\tfrac92\bigr)^2 \ \Rightarrow\ 9x^2-36x+36+9y^2=4x^2-36x+81$, dus $5x^2+9y^2=45$. $a=3$, $c=\sqrt{9-5}=2$, $e=\tfrac23$.

- id: h5-richt
  soort: kort
  opgave: |-
    Bepaal de excentriciteit en de richtlijnen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x^2}{100} + \dfrac{y^2}{36} = 1$
      antwoord: |-
        $e=0{,}8$; $x=\pm12{,}5$
      uitwerking: |-
        $c=8$, $e=0{,}8$, $\tfrac ae=\tfrac{10}{0{,}8}=12{,}5$.
    - opgave: |-
        $\dfrac{x^2}{16} - \dfrac{y^2}{9} = 1$
      antwoord: |-
        $e=\tfrac54$; $x=\pm\tfrac{16}{5}$
      uitwerking: |-
        $c=5$, $e=\tfrac54$, $\tfrac ae=\tfrac{16}{5}$.

- id: h5-herken
  soort: kort
  opgave: |-
    Welke figuur stelt de vergelijking voor?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2x^2 + 3y^2 - 4x = 0$
      antwoord: |-
        ellips
      uitwerking: |-
        $2(x-1)^2+3y^2=2$: een ellips.
    - opgave: |-
        $x^2 - 6x + 2y = 0$
      antwoord: |-
        parabool
      uitwerking: |-
        $(x-3)^2=-2y+9=-2\bigl(y-\tfrac92\bigr)$.
    - opgave: |-
        $x^2 - y^2 + 4y - 4 = 0$
      antwoord: |-
        twee rechten
      uitwerking: |-
        $x^2-(y-2)^2=0$: $y=2+x$ en $y=2-x$.
    - opgave: |-
        $x^2 + 2y^2 + 2x + 5 = 0$
      antwoord: |-
        niets
      uitwerking: |-
        $(x+1)^2+2y^2=-4$: geen enkel punt.

- id: h5-pool
  soort: kort
  opgave: |-
    Neem de kegelsnede $r = \dfrac{4}{1 + \cos\theta}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke soort is het? Bereken $r$ bij $\theta = 0$ en bij $\theta = \tfrac{\pi}{2}$.
      antwoord: |-
        parabool; 2 en 4
      uitwerking: |-
        $e=1$. $r(0)=2$, dus de top is $(2,0)$, en $r\bigl(\tfrac{\pi}{2}\bigr)=4$: het punt $(0,4)$.
    - opgave: |-
        Zet om naar een vergelijking in $x$ en $y$. Gebruik $r = \sqrt{x^2 + y^2}$ en $r\cos\theta = x$.
      antwoord: |-
        $y^2=-8(x-2)$
      uitwerking: |-
        $r+r\cos\theta=4$, dus $\sqrt{x^2+y^2}=4-x$. Kwadrateer: $x^2+y^2=16-8x+x^2$, dus $y^2=-8(x-2)$: top $(2,0)$, opening naar links, $\tfrac p2=2$, brandpunt de oorsprong.

# --- Opdrachten -------------------------------------------------------------------------

- id: h5-o1
  soort: opdracht
  niveau: 1
  thema: |-
    excentriciteit en richtlijnen
  opgave: |-
    Bepaal de excentriciteit en de richtlijnen.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x^2}{25} + \dfrac{y^2}{9} = 1$
      antwoord: |-
        $\tfrac45$; $x=\pm\tfrac{25}{4}$
      uitwerking: |-
        $c=4$, $\tfrac ae=\tfrac{5}{4/5}=\tfrac{25}{4}$.
    - opgave: |-
        $\dfrac{x^2}{4} - \dfrac{y^2}{12} = 1$
      antwoord: |-
        2; $x=\pm1$
      uitwerking: |-
        $c=4$, $e=2$, $\tfrac ae=1$.
    - opgave: |-
        $y^2 = 8x$
      antwoord: |-
        1; $x=-2$
      uitwerking: |-
        Een parabool: $e=1$ en $p=4$, richtlijn $x=-2$.
    - opgave: |-
        $\dfrac{x^2}{9} + \dfrac{y^2}{25} = 1$
      antwoord: |-
        $\tfrac45$; $y=\pm\tfrac{25}{4}$
      uitwerking: |-
        Rechtop: $c=4$, de richtlijnen zijn horizontaal, $y=\pm\tfrac{25}{4}$.

- id: h5-o2
  soort: opdracht
  niveau: 1
  thema: |-
    soort herkennen
  opgave: |-
    Welke figuur stelt de vergelijking voor? Geef bij een ontaarde kegelsnede de punten of de rechten.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 + y^2 - 4x + 2y = 0$
      antwoord: |-
        cirkel
      uitwerking: |-
        $(x-2)^2+(y+1)^2=5$.
    - opgave: |-
        $4x^2 + 9y^2 - 8x = 32$
      antwoord: |-
        ellips
      uitwerking: |-
        $4(x-1)^2+9y^2=36$.
    - opgave: |-
        $y^2 - 2y - 4x + 9 = 0$
      antwoord: |-
        parabool
      uitwerking: |-
        $(y-1)^2=4(x-2)$.
    - opgave: |-
        $x^2 - 9y^2 = 0$
      antwoord: |-
        twee rechten $y=\pm\tfrac13x$
      uitwerking: |-
        $(x-3y)(x+3y)=0$.
    - opgave: |-
        $25x^2 - 4y^2 + 100 = 0$
      antwoord: |-
        hyperbool
      uitwerking: |-
        $4y^2-25x^2=100$, of $\tfrac{y^2}{25}-\tfrac{x^2}{4}=1$: staand.
    - opgave: |-
        $x^2 + 2y^2 + 3 = 0$
      antwoord: |-
        niets
      uitwerking: |-
        Een som van kwadraten plus 3 is nooit 0.

- id: h5-o3
  soort: opdracht
  niveau: 1
  thema: |-
    poolcoördinaten
  opgave: |-
    Reken om.
  lijst: enumerate
  delen:
    - opgave: |-
        Het punt met poolcoördinaten $r = 2$, $\theta = \tfrac{\pi}{6}$ naar $x$ en $y$.
      antwoord: |-
        $(\sqrt3,1)$
      uitwerking: |-
        $2\cos\tfrac{\pi}{6}=\sqrt3$ en $2\sin\tfrac{\pi}{6}=1$.
    - opgave: |-
        Het punt $(0, -3)$ naar poolcoördinaten.
      antwoord: |-
        $r=3$, $\theta=\tfrac{3\pi}{2}$
      uitwerking: |-
        Op de negatieve $y$-as: $r=3$ en $\theta=\tfrac{3\pi}{2}$ (of $-\tfrac{\pi}{2}$).
    - opgave: |-
        De kromme $r = 3$ naar een vergelijking in $x$ en $y$.
      antwoord: |-
        $x^2+y^2=9$
      uitwerking: |-
        Alle punten op afstand 3 van de oorsprong: een cirkel. Een cirkel is de kegelsnede met $e=0$.

- id: h5-o4
  soort: opdracht
  niveau: 1
  thema: |-
    poolvergelijking, soort
  opgave: |-
    Welke kegelsnede is het? Geef $e$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $r = \dfrac{5}{1 + 0{,}5\cos\theta}$
      antwoord: |-
        ellips, $e=0{,}5$
      uitwerking: |-
        $e<1$.
    - opgave: |-
        $r = \dfrac{3}{1 + \cos\theta}$
      antwoord: |-
        parabool, $e=1$
      uitwerking: |-
        $e=1$.
    - opgave: |-
        $r = \dfrac{2}{1 + 3\cos\theta}$
      antwoord: |-
        hyperbool, $e=3$
      uitwerking: |-
        $e>1$.
    - opgave: |-
        $r = \dfrac{6}{2 + \cos\theta}$
      antwoord: |-
        ellips, $e=\tfrac12$
      uitwerking: |-
        Let op: deel teller en noemer door 2. $r=\dfrac{3}{1+\tfrac12\cos\theta}$, dus $e=\tfrac12$ en niet 1.

- id: h5-o5
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundige plaats met brandpunt en richtlijn
  opgave: |-
    Zoek de meetkundige plaats van de punten waarvan de afstand tot de oorsprong de helft is van de afstand tot de rechte $x = 4$. Bepaal het middelpunt, $a$, $c$ en de brandpunten, en controleer dat de oorsprong een brandpunt is.
  antwoord: |-
    $\dfrac{(x+\frac43)^2}{\frac{64}{9}}+\dfrac{y^2}{\frac{16}{3}}=1$; $M\bigl(-\tfrac43,0\bigr)$, $a=\tfrac83$, $c=\tfrac43$; brandpunten $(0,0)$ en $\bigl(-\tfrac83,0\bigr)$
  uitwerking: |-
    $x^2+y^2=\tfrac14(4-x)^2 \ \Rightarrow\ 3x^2+8x+4y^2=16$. Kwadraat afsplitsen: $3\bigl(x+\tfrac43\bigr)^2+4y^2=\tfrac{64}{3}$.\\
    $a^2=\tfrac{64}{9}$, $b^2=\tfrac{16}{3}=\tfrac{48}{9}$, dus $c^2=\tfrac{16}{9}$ en $c=\tfrac43$. De brandpunten liggen op $\tfrac43$ van $M$: in $(0,0)$ en $\bigl(-\tfrac83,0\bigr)$. En $e=\tfrac{4/3}{8/3}=\tfrac12$.

- id: h5-o6
  soort: opdracht
  niveau: 2
  thema: |-
    richtlijn controleren
  opgave: |-
    Neem de hyperbool $\dfrac{x^2}{9} - \dfrac{y^2}{16} = 1$ en het punt $P\bigl(5, \tfrac{16}{3}\bigr)$ erop. Bereken $|PF_2|$ en de afstand van $P$ tot de richtlijn bij $F_2$. Wat is hun verhouding?
  antwoord: |-
    $\tfrac{16}{3}$ en $\tfrac{16}{5}$; $\tfrac53=e$
  uitwerking: |-
    $F_2(5,0)$, dus $|PF_2|=\tfrac{16}{3}$. De richtlijn is $x=\tfrac ae=\tfrac{3}{5/3}=\tfrac95$, op afstand $5-\tfrac95=\tfrac{16}{5}$. De verhouding is $\tfrac{16/3}{16/5}=\tfrac53$, de excentriciteit.

- id: h5-o7
  soort: opdracht
  niveau: 2
  thema: |-
    poolvergelijking in een context
  opgave: |-
    De aardbaan heeft een excentriciteit van 0,0167, en de aarde komt tot 147,1 miljoen km bij de zon.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de poolvergelijking van de baan.
      antwoord: |-
        $r=\dfrac{149{,}56}{1+0{,}0167\cos\theta}$
      uitwerking: |-
        $p=147{,}1\cdot1{,}0167\approx149{,}56$ (miljoen km).
    - opgave: |-
        Hoe ver staat de aarde van de zon in de richting $\theta = 90^\circ$? En bij $\theta = 180^\circ$?
      antwoord: |-
        ongeveer 149,6 en 152,1 miljoen km
      uitwerking: |-
        $r(90^\circ)=p\approx149{,}6$. $r(180^\circ)=\tfrac{149{,}56}{0{,}9833}\approx152{,}1$: het aphelium, zoals in hoofdstuk 3.

- id: h5-o8
  soort: opdracht
  niveau: 2
  thema: |-
    poolvergelijking in een context
  opgave: |-
    Een komeet komt tot 1 AE bij de zon.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de poolvergelijking als $e = 0{,}8$. Hoe ver gaat de komeet van de zon?
      antwoord: |-
        $r=\dfrac{1{,}8}{1+0{,}8\cos\theta}$; 9 AE
      uitwerking: |-
        $p=1\cdot1{,}8$. $r(180^\circ)=\tfrac{1{,}8}{0{,}2}=9$ AE.
    - opgave: |-
        En als $e = 1{,}2$? In welke richtingen verdwijnt de komeet?
      antwoord: |-
        $r=\dfrac{2{,}2}{1+1{,}2\cos\theta}$; bij $\theta\approx\pm146^\circ$
      uitwerking: |-
        $p=2{,}2$. De noemer is 0 als $\cos\theta=-\tfrac{1}{1{,}2}$, dus $\theta\approx\pm146{,}4^\circ$.

- id: h5-o9
  soort: opdracht
  niveau: 2
  thema: |-
    ontaarde kegelsnede met parameter
  opgave: |-
    Neem de vergelijking $x^2 - 4y^2 + 2x + k = 0$. Voor welke $k$ is het een paar snijdende rechten? Welke figuur krijg je voor de andere waarden van $k$?
  antwoord: |-
    $k=1$; $k<1$ liggende hyperbool, $k>1$ staande hyperbool
  uitwerking: |-
    $(x+1)^2-4y^2=1-k$. Bij $k=1$: $(x+1-2y)(x+1+2y)=0$, twee rechten. Bij $k<1$ is het rechterlid positief: een hyperbool met brandpunten op de horizontale as door $(-1,0)$. Bij $k>1$ is het negatief: maal $-1$ geeft een staande hyperbool. De rechten zijn telkens de asymptoten.

- id: h5-o10
  soort: opdracht
  niveau: 2
  thema: |-
    poolvergelijking omzetten
  opgave: |-
    Zet de poolvergelijking $r = \dfrac{6}{1 + 2\cos\theta}$ om naar een vergelijking in $x$ en $y$. Bepaal het middelpunt, de toppen en de brandpunten.
  antwoord: |-
    $\tfrac{(x-4)^2}{4}-\tfrac{y^2}{12}=1$; $M(4,0)$; toppen $(2,0)$ en $(6,0)$; brandpunten $(0,0)$ en $(8,0)$
  uitwerking: |-
    $r=6-2r\cos\theta=6-2x$. Kwadrateer: $x^2+y^2=36-24x+4x^2$, dus $3x^2-24x+36-y^2=0$ en $3(x-4)^2-y^2=12$.\\
    $a=2$, $b=2\sqrt3$, $c=4$: brandpunten $(0,0)$ en $(8,0)$, en $e=2$. De poolvergelijking met $r>0$ beschrijft enkel de tak bij de oorsprong.

- id: h5-o11
  soort: opdracht
  niveau: 2
  thema: |-
    één brandpunt, één top
  opgave: |-
    De voorkant van dit boek toont drie kegelsneden met hetzelfde brandpunt $F$ en dezelfde top $T$, op afstand 1 van $F$. Neem $F$ als oorsprong en $T$ in de richting $\theta = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat zo'n kegelsnede de poolvergelijking $r = \dfrac{1 + e}{1 + e\cos\theta}$ heeft.
      antwoord: |-
        $r(0)=1$ geeft $p=1+e$
      uitwerking: |-
        $r(0)=\tfrac{p}{1+e}=1$, dus $p=1+e$.
    - opgave: |-
        Bereken $r$ bij $\theta = 90^\circ$ voor $e = \tfrac12$, 1 en 2. Wat zie je?
      antwoord: |-
        1,5; 2; 3
      uitwerking: |-
        $r(90^\circ)=p=1+e$: hoe groter $e$, hoe verder de kromme openstaat.

- id: h5-o12
  soort: opdracht
  niveau: 2
  thema: |-
    term in xy
  opgave: |-
    Gebruik het teken van $B^2 - 4AC$ om de soort te bepalen.
  lijst: enumerate
  delen:
    - opgave: |-
        $xy = 4$
      antwoord: |-
        hyperbool
      uitwerking: |-
        $A=C=0$, $B=1$: $B^2-4AC=1>0$. Inderdaad de grafiek van $\tfrac4x$.
    - opgave: |-
        $x^2 + xy + y^2 = 3$
      antwoord: |-
        ellips
      uitwerking: |-
        $1-4=-3<0$: een gekantelde ellips. Ze gaat door $(\pm\sqrt3,0)$, $(0,\pm\sqrt3)$ en $(1,1)$.
    - opgave: |-
        $x^2 + 2xy + y^2 - x + y = 0$
      antwoord: |-
        parabool
      uitwerking: |-
        $4-4=0$: een gekantelde parabool, met as evenwijdig met $y=-x$.

- id: h5-o13
  soort: opdracht
  niveau: 2
  thema: |-
    kegelsnede door gegeven punten
  opgave: |-
    Zoek $A$ en $C$ zodat de kromme $Ax^2 + Cy^2 = 1$ door de gegeven punten gaat. Welke kegelsnede is het?
  lijst: enumerate
  delen:
    - opgave: |-
        $(2, 1)$ en $(1, 2)$
      antwoord: |-
        $A=C=\tfrac15$: de cirkel $x^2+y^2=5$
      uitwerking: |-
        $4A+C=1$ en $A+4C=1$, dus $A=C=\tfrac15$.
    - opgave: |-
        $(2, 1)$ en $(4, 3)$
      antwoord: |-
        $A=0{,}4$, $C=-0{,}6$: een hyperbool
      uitwerking: |-
        $4A+C=1$ en $16A+9C=1$. Uit de eerste $C=1-4A$, en dan $16A+9-36A=1$, dus $A=0{,}4$ en $C=-0{,}6$. $AC<0$: de hyperbool $\tfrac{x^2}{2{,}5}-\tfrac{y^2}{5/3}=1$.

- id: h5-o14
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: brandpunt en excentriciteit
  opgave: |-
    Werk het bewijs van de stelling over brandpunt en richtlijn af voor $0 < e < 1$. Neem $F(0, 0)$ en $l \leftrightarrow x = -d$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de ellips middelpunt $\Bigl(\dfrac{e^2d}{1 - e^2}, 0\Bigr)$ heeft, met $a^2 = \dfrac{e^2d^2}{(1 - e^2)^2}$ en $b^2 = \dfrac{e^2d^2}{1 - e^2}$.
      antwoord: |-
        deel door het rechterlid
      uitwerking: |-
        Deel $(1-e^2)(x-x_0)^2+y^2=\tfrac{e^2d^2}{1-e^2}$ door het rechterlid. Onder $(x-x_0)^2$ komt $\tfrac{e^2d^2}{(1-e^2)^2}$, onder $y^2$ komt $\tfrac{e^2d^2}{1-e^2}$. Die eerste is de grootste, want $1-e^2<1$: de lange as is horizontaal.
    - opgave: |-
        Toon aan dat $c = \dfrac{e^2d}{1 - e^2}$, dat de oorsprong een brandpunt is en dat $\dfrac ca = e$.
      antwoord: |-
        $c^2=a^2-b^2$
      uitwerking: |-
        $c^2=\dfrac{e^2d^2}{(1-e^2)^2}\bigl(1-(1-e^2)\bigr)=\dfrac{e^4d^2}{(1-e^2)^2}$, dus $c=\dfrac{e^2d}{1-e^2}$. Dat is precies de afstand van het middelpunt tot de oorsprong: de oorsprong is een brandpunt. En $\dfrac ca=\dfrac{e^2d}{ed}=e$.

- id: h5-o15
  soort: opdracht
  niveau: 3
  thema: |-
    de parameter p
  opgave: |-
    In de poolvergelijking $r = \dfrac{p}{1 + e\cos\theta}$ is $p$ de afstand van het brandpunt tot de kromme, loodrecht op de as. Toon aan dat voor een ellips $p = \dfrac{b^2}{a}$. Controleer met de aardbaan uit opdracht \ref{oef:h5-o7}.
  antwoord: |-
    $p=e\,d$ met $d=\tfrac ae-c$
  uitwerking: |-
    De richtlijn bij $F_2(c,0)$ is $x=\tfrac ae$, dus $d=\tfrac ae-c=\tfrac{a^2-c^2}{c}=\tfrac{b^2}{c}$. Dan $p=ed=\tfrac ca\cdot\tfrac{b^2}{c}=\tfrac{b^2}{a}$.\\
    Aardbaan: $\tfrac{149{,}58^2}{149{,}6}\approx149{,}56$. Klopt.

- id: h5-o16
  soort: opdracht
  niveau: 3
  thema: |-
    gelijkvormigheid
  opgave: |-
    Twee figuren zijn gelijkvormig als de ene een vergroting van de andere is.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat elke parabool $x^2 = 2py$ een vergroting is van $x^2 = 2y$. Zijn alle parabolen dus gelijkvormig?
      antwoord: |-
        ja, met factor $p$
      uitwerking: |-
        Vermenigvuldig alle coördinaten van $x^2=2y$ met $p$: een punt $(X,Y)=(px,py)$ voldoet aan $X^2=p^2x^2=2p^2y=2pY$. Elke parabool is dus gelijkvormig met elke andere.
    - opgave: |-
        Zijn alle ellipsen gelijkvormig? Welk getal beslist of twee ellipsen gelijkvormig zijn?
      antwoord: |-
        nee; de excentriciteit
      uitwerking: |-
        Een vergroting verandert $a$ en $b$ met dezelfde factor, dus $\tfrac ba=\sqrt{1-e^2}$ blijft. Twee ellipsen zijn gelijkvormig als en slechts als ze dezelfde $e$ hebben. Een parabool heeft altijd $e=1$: daarom zijn ze allemaal gelijkvormig.

- id: h5-o17
  soort: opdracht
  niveau: 1
  thema: |-
    poolvergelijking opstellen
  opgave: |-
    Geef de poolvergelijking van de kegelsnede met brandpunt de oorsprong, richtlijn $x = d$ en excentriciteit $e$. Welke soort is het, en hoe ver ligt de top bij het brandpunt?
  lijst: enumerate
  delen:
    - opgave: |-
        $d = 6$ en $e = \tfrac13$
      antwoord: |-
        $r=\dfrac{2}{1+\frac13\cos\theta}$; ellips; $\tfrac32$
      uitwerking: |-
        $p=ed=2$. Een ellips, want $e<1$. De top: $r(0)=\tfrac{2}{4/3}=\tfrac32$.
    - opgave: |-
        $d = 4$ en $e = 1$
      antwoord: |-
        $r=\dfrac{4}{1+\cos\theta}$; parabool; 2
      uitwerking: |-
        $p=4$. Een parabool. De top ligt midden tussen het brandpunt en de richtlijn: $r(0)=2$.
    - opgave: |-
        $d = 1$ en $e = 3$
      antwoord: |-
        $r=\dfrac{3}{1+3\cos\theta}$; hyperbool; $\tfrac34$
      uitwerking: |-
        $p=3$. Een hyperbool. De top: $r(0)=\tfrac34$, tussen het brandpunt en de richtlijn.

- id: h5-o18
  soort: opdracht
  niveau: 2
  thema: |-
    soort herkennen met een parameter
  opgave: |-
    Neem de vergelijking $x^2 + k\,y^2 - 4x = 0$. Welke figuur stelt ze voor als:
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $k = 1$
      antwoord: |-
        cirkel
      uitwerking: |-
        $(x-2)^2+y^2=4$: middelpunt $(2,0)$, straal 2.
    - opgave: |-
        $k = 4$
      antwoord: |-
        ellips
      uitwerking: |-
        $(x-2)^2+4y^2=4$, of $\tfrac{(x-2)^2}{4}+y^2=1$.
    - opgave: |-
        $k = 0$
      antwoord: |-
        twee rechten
      uitwerking: |-
        $x^2-4x=0$: de evenwijdige rechten $x=0$ en $x=4$.
    - opgave: |-
        $k = -1$
      antwoord: |-
        hyperbool
      uitwerking: |-
        $(x-2)^2-y^2=4$: een gelijkzijdige hyperbool.

- id: h5-o19
  soort: opdracht
  niveau: 2
  thema: |-
    poolvergelijking in een context
  opgave: |-
    Een satelliet draait in een ellips rond de aarde, met het middelpunt van de aarde in een brandpunt. Hij komt tot 300 km boven het aardoppervlak, en gaat er tot 1500 km boven. De straal van de aarde is 6370 km.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de kleinste en de grootste afstand tot het middelpunt van de aarde, en daaruit $a$, $c$ en $e$.
      antwoord: |-
        6670 en 7870 km; $a=7270$, $c=600$, $e\approx0{,}0825$
      uitwerking: |-
        $a-c=6670$ en $a+c=7870$, dus $a=7270$ km en $c=600$ km. $e=\tfrac{600}{7270}\approx0{,}0825$.
    - opgave: |-
        Geef de poolvergelijking van de baan.
      antwoord: |-
        $r\approx\dfrac{7220}{1+0{,}0825\cos\theta}$
      uitwerking: |-
        $p=6670\cdot(1+e)\approx7220$ km. Controle met $p=\tfrac{b^2}{a}$: $b^2=7270^2-600^2=52\,492\,900$, en $\tfrac{b^2}{a}\approx7220$.
    - opgave: |-
        Hoe hoog boven het aardoppervlak is de satelliet in de richting $\theta = 90^\circ$?
      antwoord: |-
        ongeveer 850 km
      uitwerking: |-
        $r(90^\circ)=p\approx7220$ km, dus $7220-6370\approx850$ km boven het oppervlak.

- id: h5-o20
  soort: opdracht
  niveau: 3
  thema: |-
    koorde door het brandpunt
  opgave: |-
    Een rechte door het brandpunt $F$ van de kegelsnede $r = \dfrac{p}{1 + e\cos\theta}$ snijdt de kromme in $P$ en $Q$, aan weerszijden van $F$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom horen $P$ en $Q$ bij de hoeken $\theta$ en $\theta + \pi$?
      antwoord: |-
        ze liggen op één rechte door $F$, aan weerszijden
      uitwerking: |-
        Vanuit de oorsprong $F$ wijzen ze in tegengestelde richtingen, en die verschillen een halve draai.
    - opgave: |-
        Toon aan dat $\dfrac{1}{|FP|} + \dfrac{1}{|FQ|} = \dfrac{2}{p}$, welke rechte je ook neemt.
      antwoord: |-
        $\dfrac{1+e\cos\theta}{p}+\dfrac{1-e\cos\theta}{p}$
      uitwerking: |-
        $\dfrac{1}{|FP|}=\dfrac{1+e\cos\theta}{p}$ en, omdat $\cos(\theta+\pi)=-\cos\theta$, $\dfrac{1}{|FQ|}=\dfrac{1-e\cos\theta}{p}$. De som is $\dfrac2p$.
    - opgave: |-
        Controleer met de as van de ellips $\dfrac{x^2}{25} + \dfrac{y^2}{16} = 1$: de koorde door $F_2$ op de $x$-as.
      antwoord: |-
        $\tfrac12+\tfrac18=\tfrac58=\tfrac2p$ met $p=\tfrac{16}{5}$
      uitwerking: |-
        $c=3$: vanuit $F_2(3,0)$ liggen de toppen op 2 en op 8. $\tfrac12+\tfrac18=\tfrac58$. En $p=\tfrac{b^2}{a}=\tfrac{16}{5}$, dus $\tfrac2p=\tfrac58$.

# --- Koppel -----------------------------------------------------------------------------

- id: h5-koppel-1
  soort: koppel
  niveau: 3
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Ruimtemeetkunde
  opgave: |-
    Terug naar de kegel van hoofdstuk 1. Een vlak maakt een hoek $\beta$ met de as van een kegel met halve tophoek $\alpha$. In opdracht \ref{oef:h1-o18} van hoofdstuk 1 vond je met een bol van Dandelin voor een punt $P$ van de doorsnede: $|PF| = \dfrac{h}{\cos\alpha}$ en $\afst{P}{l} = \dfrac{h}{\cos\beta}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de excentriciteit van de doorsnede $e = \dfrac{\cos\beta}{\cos\alpha}$ is.
      antwoord: |-
        $\tfrac{|PF|}{\afst{P}{l}}$
      uitwerking: |-
        $e=\dfrac{|PF|}{\afst{P}{l}}=\dfrac{h/\cos\alpha}{h/\cos\beta}=\dfrac{\cos\beta}{\cos\alpha}$. Dat geldt voor elk vlak, niet alleen voor de parabool.
    - opgave: |-
        Leid daaruit de vier soorten uit hoofdstuk 1 af.
      antwoord: |-
        $\beta=90^\circ$: $e=0$; $\beta>\alpha$: $e<1$; $\beta=\alpha$: $e=1$; $\beta<\alpha$: $e>1$
      uitwerking: |-
        De cosinus daalt op $[0^\circ,90^\circ]$. Bij $\beta=90^\circ$ is $e=0$: een cirkel. Bij $\beta>\alpha$ is $\cos\beta<\cos\alpha$: $e<1$, een ellips. Bij $\beta=\alpha$ een parabool, bij $\beta<\alpha$ een hyperbool.

- id: h5-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    De matrix $R = \dfrac{1}{\sqrt2}\begin{pmatrix} 1 & -1 \\ 1 & 1 \end{pmatrix}$ draait elk punt over $45^\circ$ rond de oorsprong.
  lijst: enumerate
  delen:
    - opgave: |-
        Een punt $(u, v)$ wordt gedraaid naar $(x, y)$. Druk $x$ en $y$ uit in $u$ en $v$.
      antwoord: |-
        $x=\tfrac{u-v}{\sqrt2}$, $y=\tfrac{u+v}{\sqrt2}$
      uitwerking: |-
        $R\begin{pmatrix}u\\v\end{pmatrix}=\dfrac{1}{\sqrt2}\begin{pmatrix}u-v\\u+v\end{pmatrix}$.
    - opgave: |-
        Vul in in $xy = 1$. Welke kromme in $u$ en $v$ krijg je? Bevestigt dat de stelling over $xy = k$ uit hoofdstuk 4?
      antwoord: |-
        $\tfrac{u^2}{2}-\tfrac{v^2}{2}=1$; ja
      uitwerking: |-
        $xy=\dfrac{(u-v)(u+v)}{2}=\dfrac{u^2-v^2}{2}=1$: een gelijkzijdige hyperbool met $a=b=\sqrt2$ en $c=2$. Haar brandpunten $(\pm2,0)$ draaien naar $\pm(\sqrt2,\sqrt2)$, zoals de stelling voorspelt met $k=1$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h5-t1
  soort: test
  niveau: 1
  opgave: |-
    Bepaal de excentriciteit en de richtlijnen van de ellips $\dfrac{x^2}{16} + \dfrac{y^2}{12} = 1$.
  antwoord: |-
    $e=\tfrac12$; $x=\pm8$
  uitwerking: |-
    $c=2$, $e=\tfrac12$, $\tfrac ae=8$.

- id: h5-t2
  soort: test
  niveau: 1
  opgave: |-
    Welke figuur stelt de vergelijking voor?
  lijst: enumerate
  delen:
    - opgave: |-
        $9x^2 - 4y^2 - 36x - 8y - 4 = 0$
      antwoord: |-
        hyperbool
      uitwerking: |-
        $9(x-2)^2-36-4(y+1)^2+4-4=0$, dus $9(x-2)^2-4(y+1)^2=36$.
    - opgave: |-
        $x^2 + 4y^2 + 2x + 1 = 0$
      antwoord: |-
        het punt $(-1,0)$
      uitwerking: |-
        $(x+1)^2+4y^2=0$.

- id: h5-t3
  soort: test
  niveau: 2
  opgave: |-
    Zoek de meetkundige plaats van de punten $P$ met $|PF| = \tfrac12\,\afst{P}{l}$, met $F(1, 0)$ en $l \leftrightarrow x = 4$.
  antwoord: |-
    $\tfrac{x^2}{4}+\tfrac{y^2}{3}=1$
  uitwerking: |-
    $(x-1)^2+y^2=\tfrac14(x-4)^2 \ \Rightarrow\ 4x^2-8x+4+4y^2=x^2-8x+16$, dus $3x^2+4y^2=12$.

- id: h5-t4
  soort: test
  niveau: 2
  opgave: |-
    Welke kegelsnede is $r = \dfrac{8}{2 + 2\cos\theta}$? Waar ligt de top?
  antwoord: |-
    parabool; $(2,0)$
  uitwerking: |-
    $r=\dfrac{4}{1+\cos\theta}$: $e=1$. De top bij $\theta=0$: $r=2$.

- id: h5-t5
  soort: test
  niveau: 2
  opgave: |-
    Een komeet komt tot 2 AE bij de zon en heeft een excentriciteit van 1,05. Keert ze terug? Geef de poolvergelijking.
  antwoord: |-
    nee; $r=\dfrac{4{,}1}{1+1{,}05\cos\theta}$
  uitwerking: |-
    $e>1$: een hyperbool, de komeet keert niet terug. $p=2\cdot(1+1{,}05)=4{,}1$.
