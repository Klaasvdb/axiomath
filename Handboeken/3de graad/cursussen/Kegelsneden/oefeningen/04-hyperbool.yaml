# Oefeningen van hoofdstuk 4. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h4-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\lim\limits_{x \to +\infty} \bigl(x - \sqrt{x^2 - 1}\bigr)$
      antwoord: |-
        0
      uitwerking: |-
        Vermenigvuldig met de toegevoegde: $\dfrac{1}{x+\sqrt{x^2-1}}\to0$.
    - opgave: |-
        de asymptoten van $y = \dfrac{3}{x - 2} + 1$
      antwoord: |-
        $x=2$ en $y=1$
      uitwerking: |-
        Een verschoven grafiek van $\tfrac3x$.
    - opgave: |-
        $\sqrt{x^2 - 9} = x - 1$
      antwoord: |-
        $x=5$
      uitwerking: |-
        $x^2-9=x^2-2x+1$, dus $x=5$. Controle: $\sqrt{16}=4$.
    - opgave: |-
        de afgeleide van $\sqrt{x^2 - 4}$
      antwoord: |-
        $\dfrac{x}{\sqrt{x^2-4}}$
      uitwerking: |-
        Kettingregel: $\dfrac{2x}{2\sqrt{x^2-4}}$.
    - opgave: |-
        het kwadraat afsplitsen in $-y^2 - 4y$
      antwoord: |-
        $-(y+2)^2+4$
      uitwerking: |-
        $-(y^2+4y)=-\bigl((y+2)^2-4\bigr)$.
    - opgave: |-
        de afstand die geluid aflegt in 5 s, aan 340 m/s
      antwoord: |-
        1700 m
      uitwerking: |-
        $5\cdot340=1700$ m.

- id: h4-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem $F_1(-5, 0)$ en $F_2(5, 0)$, en de punten $P$ met $\bigl||PF_1| - |PF_2|\bigr| = 6$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke punten van de $x$-as voldoen?
      antwoord: |-
        $(\pm3, 0)$
      uitwerking: |-
        Tussen de brandpunten: $(x+5)-(5-x)=2x=\pm6$. Buiten de brandpunten is het verschil altijd 10.
    - opgave: |-
        Toon aan dat $P\bigl(5, \tfrac{16}{3}\bigr)$ voldoet.
      antwoord: |-
        $\tfrac{34}{3}-\tfrac{16}{3}=6$
      uitwerking: |-
        $|PF_2|=\tfrac{16}{3}$ en $|PF_1|=\sqrt{100+\tfrac{256}{9}}=\tfrac{34}{3}$.
    - opgave: |-
        Bereken $\dfrac{x^2}{9} - \dfrac{y^2}{16}$ voor de punten uit a en b.
      antwoord: |-
        altijd 1
      uitwerking: |-
        $\tfrac99=1$ en $\tfrac{25}{9}-\tfrac{256/9}{16}=\tfrac{25-16}{9}=1$.
    - opgave: |-
        Ligt er een punt van de kromme op de $y$-as? Waarom niet?
      antwoord: |-
        nee
      uitwerking: |-
        Een punt van de $y$-as ligt even ver van beide brandpunten: het verschil is 0, niet 6.

- id: h4-std
  soort: kort
  opgave: |-
    Bepaal de toppen en de brandpunten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{x^2}{36} - \dfrac{y^2}{64} = 1$
      antwoord: |-
        $(\pm6, 0)$, $F(\pm10, 0)$
      uitwerking: |-
        $c=\sqrt{36+64}=10$.
    - opgave: |-
        $\dfrac{y^2}{16} - \dfrac{x^2}{9} = 1$
      antwoord: |-
        $(0, \pm4)$, $F(0, \pm5)$
      uitwerking: |-
        Positieve term bij $y^2$: $a=4$, $c=5$.
    - opgave: |-
        $x^2 - y^2 = 2$
      antwoord: |-
        $(\pm\sqrt2, 0)$, $F(\pm2, 0)$
      uitwerking: |-
        $\tfrac{x^2}{2}-\tfrac{y^2}{2}=1$: $c=\sqrt{2+2}=2$.

- id: h4-asym
  soort: kort
  opgave: |-
    Geef de asymptoten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{x^2}{9} - \dfrac{y^2}{36} = 1$
      antwoord: |-
        $y=\pm2x$
      uitwerking: |-
        $\tfrac ba=\tfrac63=2$.
    - opgave: |-
        $y^2 - 4x^2 = 4$
      antwoord: |-
        $y=\pm2x$
      uitwerking: |-
        Vervang 4 door 0: $y^2=4x^2$. Dezelfde asymptoten als a, maar de brandpunten liggen op de $y$-as.
    - opgave: |-
        $9x^2 - y^2 = 9$
      antwoord: |-
        $y=\pm3x$
      uitwerking: |-
        $y^2=9x^2$.

- id: h4-kx
  soort: kort
  opgave: |-
    Bepaal de toppen en de brandpunten van de grafiek van $y = \dfrac2x$.
  antwoord: |-
    toppen $(\sqrt2, \sqrt2)$ en $(-\sqrt2, -\sqrt2)$, brandpunten $(2, 2)$ en $(-2, -2)$
  uitwerking: |-
    $k=2$: $\sqrt k=\sqrt2$ en $s=\sqrt{4}=2$.

- id: h4-versch
  soort: kort
  opgave: |-
    Bepaal het middelpunt, de brandpunten en de asymptoten van $x^2 - 4y^2 + 4x + 8y - 4 = 0$.
  antwoord: |-
    $M(-2, 1)$, $F(-2\pm\sqrt5, 1)$, $y-1=\pm\tfrac12(x+2)$
  uitwerking: |-
    $(x+2)^2-4-4(y-1)^2+4-4=0$, dus $\dfrac{(x+2)^2}{4}-(y-1)^2=1$: $a=2$, $b=1$, $c=\sqrt5$.

- id: h4-raak
  soort: kort
  opgave: |-
    Bepaal de raaklijn in het gegeven punt.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 - \dfrac{y^2}{4} = 1$ in $(\sqrt2, 2)$
      antwoord: |-
        $y=2\sqrt2x-2$
      uitwerking: |-
        $2-1=1$ klopt. $\sqrt2x-\tfrac{2y}{4}=1$, dus $y=2\sqrt2x-2$.
    - opgave: |-
        $\dfrac{x^2}{9} - \dfrac{y^2}{16} = 1$ in $\bigl(5, \tfrac{16}{3}\bigr)$
      antwoord: |-
        $5x-3y=9$
      uitwerking: |-
        $\tfrac{5x}{9}-\tfrac{16y/3}{16}=1$, dus $\tfrac{5x}{9}-\tfrac y3=1$, of $5x-3y=9$.

- id: h4-opst
  soort: kort
  opgave: |-
    Geef een vergelijking van de hyperbool met middelpunt de oorsprong en:
  lijst: enumerate
  delen:
    - opgave: |-
        toppen $(\pm3, 0)$ en brandpunten $(\pm5, 0)$;
      antwoord: |-
        $\tfrac{x^2}{9}-\tfrac{y^2}{16}=1$
      uitwerking: |-
        $a=3$, $c=5$, $b^2=25-9=16$.
    - opgave: |-
        toppen $(0, \pm1)$ en brandpunten $(0, \pm\sqrt{10})$.
      antwoord: |-
        $y^2-\tfrac{x^2}{9}=1$
      uitwerking: |-
        $a=1$, $c^2=10$, $b^2=9$; de positieve term bij $y^2$.

- id: h4-terug
  soort: kort
  opgave: |-
    Twee waarnemers staan 4 km van elkaar. De ene hoort een donderslag 4 seconden vroeger dan de andere. Geluid legt 340 m/s af. Geef een vergelijking van de mogelijke plaatsen van de inslag (in meter, met de oorsprong midden tussen hen), en de hoek met de lijn tussen hen waaronder een verre inslag ligt.
  antwoord: |-
    $\tfrac{x^2}{462\,400}-\tfrac{y^2}{3\,537\,600}=1$ (één tak); ongeveer $70^\circ$
  uitwerking: |-
    $2a=4\cdot340=1360$, dus $a=680$ en $c=2000$. $b^2=2000^2-680^2=3\,537\,600$, $b\approx1881$. Alleen de tak bij de waarnemer die het eerst hoort. $\tan\theta=\tfrac ba\approx2{,}77$, dus $\theta\approx70^\circ$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h4-o1
  soort: opdracht
  niveau: 1
  thema: |-
    toppen, brandpunten en asymptoten
  opgave: |-
    Bepaal $a$, $b$, $c$, de toppen, de brandpunten en de asymptoten. Teken de hyperbool met de hulprechthoek.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x^2}{9} - \dfrac{y^2}{16} = 1$
      antwoord: |-
        3, 4, 5; $(\pm3, 0)$; $F(\pm5, 0)$; $y=\pm\tfrac43x$
      uitwerking: |-
        $c=\sqrt{9+16}=5$.
    - opgave: |-
        $\dfrac{y^2}{4} - \dfrac{x^2}{5} = 1$
      antwoord: |-
        2, $\sqrt5$, 3; $(0, \pm2)$; $F(0, \pm3)$; $y=\pm\tfrac{2}{\sqrt5}x$
      uitwerking: |-
        Staand: $c=\sqrt{4+5}=3$. Asymptoten: $\tfrac{y^2}{4}=\tfrac{x^2}{5}$.
    - opgave: |-
        $x^2 - y^2 = 9$
      antwoord: |-
        3, 3, $3\sqrt2$; $(\pm3, 0)$; $F(\pm3\sqrt2, 0)$; $y=\pm x$
      uitwerking: |-
        Gelijkzijdig: $c=\sqrt{18}$.
    - opgave: |-
        $4x^2 - 9y^2 = 36$
      antwoord: |-
        3, 2, $\sqrt{13}$; $(\pm3, 0)$; $F(\pm\sqrt{13}, 0)$; $y=\pm\tfrac23x$
      uitwerking: |-
        $\tfrac{x^2}{9}-\tfrac{y^2}{4}=1$.
        \figuren{\begin{tikzpicture}[scale=.36,font=\scriptsize]
          \rooster{-6}{2}{6}{-4}{2}{4}
          \draw[grijs,dashed] (-3,-2) rectangle (3,2);
          \draw[grijs] (-6,-4) -- (6,4) (-6,4) -- (6,-4);
          \hyperbool{0}{0}{3}{2}{1.3}
        \end{tikzpicture}}

- id: h4-o2
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijking opstellen
  opgave: |-
    Geef een vergelijking van de hyperbool met middelpunt de oorsprong en:
  lijst: enumerate
  delen:
    - opgave: |-
        toppen $(\pm2, 0)$ en brandpunten $(\pm3, 0)$;
      antwoord: |-
        $\tfrac{x^2}{4}-\tfrac{y^2}{5}=1$
      uitwerking: |-
        $b^2=9-4=5$.
    - opgave: |-
        brandpunten $(0, \pm10)$ en toppen $(0, \pm6)$;
      antwoord: |-
        $\tfrac{y^2}{36}-\tfrac{x^2}{64}=1$
      uitwerking: |-
        $b^2=100-36=64$, staand.
    - opgave: |-
        toppen $(\pm4, 0)$ en asymptoten $y = \pm\tfrac12 x$.
      antwoord: |-
        $\tfrac{x^2}{16}-\tfrac{y^2}{4}=1$
      uitwerking: |-
        $\tfrac ba=\tfrac12$ met $a=4$: $b=2$.

- id: h4-o3
  soort: opdracht
  niveau: 1
  thema: |-
    kegelsnede herkennen
  opgave: |-
    Is het een cirkel, een ellips, een parabool, een hyperbool of iets anders?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^2 - 4y^2 = 4$
      antwoord: |-
        hyperbool
      uitwerking: |-
        Twee kwadraten met tegengestelde tekens.
    - opgave: |-
        $x^2 + 4y^2 = 4$
      antwoord: |-
        ellips
      uitwerking: |-
        Twee positieve, verschillende coëfficiënten.
    - opgave: |-
        $x^2 - 4y = 4$
      antwoord: |-
        parabool
      uitwerking: |-
        Maar één kwadraat.
    - opgave: |-
        $4y^2 - x^2 = 4$
      antwoord: |-
        hyperbool
      uitwerking: |-
        Staand: $y^2-\tfrac{x^2}{4}=1$.
    - opgave: |-
        $x^2 + y^2 = 4y$
      antwoord: |-
        cirkel
      uitwerking: |-
        $x^2+(y-2)^2=4$.
    - opgave: |-
        $x^2 - y^2 = 0$
      antwoord: |-
        twee rechten
      uitwerking: |-
        $(x-y)(x+y)=0$: de rechten $y=x$ en $y=-x$, een ontaarde kegelsnede.

- id: h4-o4
  soort: opdracht
  niveau: 1
  thema: |-
    meetkundige plaats controleren
  opgave: |-
    Toon aan dat $P\bigl(5, \tfrac94\bigr)$ op de hyperbool $\dfrac{x^2}{16} - \dfrac{y^2}{9} = 1$ ligt. Bereken $|PF_1|$ en $|PF_2|$ en controleer dat hun verschil $2a$ is.
  antwoord: |-
    $\tfrac{41}{4}-\tfrac94=8=2a$
  uitwerking: |-
    $\tfrac{25}{16}-\tfrac{81/16}{9}=\tfrac{25-9}{16}=1$. De brandpunten zijn $(\pm5, 0)$: $|PF_2|=\tfrac94$ en $|PF_1|=\sqrt{100+\tfrac{81}{16}}=\tfrac{41}{4}$. Het verschil is 8, en $2a=8$.

- id: h4-o5
  soort: opdracht
  niveau: 1
  thema: |-
    excentriciteit
  opgave: |-
    Bereken de excentriciteit.
  lijst: enumerate
  delen:
    - opgave: |-
        $\dfrac{x^2}{16} - \dfrac{y^2}{9} = 1$
      antwoord: |-
        $\tfrac54$
      uitwerking: |-
        $c=5$, $a=4$.
    - opgave: |-
        $x^2 - y^2 = 1$
      antwoord: |-
        $\sqrt2$
      uitwerking: |-
        $c=\sqrt2$, $a=1$.
    - opgave: |-
        Een hyperbool met $a = 1$ en $e = 2$. Geef $b$ en de hoek tussen de asymptoten en de as door de brandpunten.
      antwoord: |-
        $b=\sqrt3$; $60^\circ$
      uitwerking: |-
        $c=2$, $b=\sqrt{4-1}=\sqrt3$. $\tan\theta=\sqrt3$, dus $\theta=60^\circ$.

- id: h4-o6
  soort: opdracht
  niveau: 2
  thema: |-
    verschoven hyperbool
  opgave: |-
    Bepaal het middelpunt, de brandpunten en de asymptoten.
  lijst: enumerate
  delen:
    - opgave: |-
        $\dfrac{(x + 1)^2}{4} - \dfrac{(y - 2)^2}{12} = 1$
      antwoord: |-
        $M(-1, 2)$, $F(3, 2)$ en $F(-5, 2)$, $y-2=\pm\sqrt3(x+1)$
      uitwerking: |-
        $a=2$, $b=2\sqrt3$, $c=4$.
    - opgave: |-
        $9x^2 - 4y^2 - 18x - 16y - 43 = 0$
      antwoord: |-
        $M(1, -2)$, $F(1\pm\sqrt{13}, -2)$, $y+2=\pm\tfrac32(x-1)$
      uitwerking: |-
        $9(x-1)^2-9-4(y+2)^2+16-43=0$, dus $9(x-1)^2-4(y+2)^2=36$, of $\tfrac{(x-1)^2}{4}-\tfrac{(y+2)^2}{9}=1$.
    - opgave: |-
        $y^2 - x^2 + 4x - 2y - 4 = 0$
      antwoord: |-
        $M(2, 1)$, $F(2, 1\pm\sqrt2)$, $y-1=\pm(x-2)$
      uitwerking: |-
        $(y-1)^2-1-(x-2)^2+4-4=0$, dus $(y-1)^2-(x-2)^2=1$: staand en gelijkzijdig, $c=\sqrt2$.

- id: h4-o7
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijn
  opgave: |-
    Bepaal de raaklijn. Controleer eerst of het punt op de hyperbool ligt.
  lijst: enumerate
  delen:
    - opgave: |-
        $\dfrac{x^2}{8} - \dfrac{y^2}{4} = 1$ in $(4, -2)$
      antwoord: |-
        $y=-x+2$
      uitwerking: |-
        $2-1=1$ klopt. $\tfrac{4x}{8}+\tfrac{2y}{4}=1$, dus $x+y=2$.
    - opgave: |-
        $x^2 - y^2 = 16$ in $(5, -3)$
      antwoord: |-
        $5x+3y=16$
      uitwerking: |-
        $25-9=16$ klopt. $5x-(-3)y=16$.

- id: h4-o8
  soort: opdracht
  niveau: 2
  thema: |-
    de grafiek van k/x
  opgave: |-
    Neem de grafiek van $y = \dfrac4x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de toppen en de brandpunten.
      antwoord: |-
        $(2, 2)$, $(-2, -2)$; $F(2\sqrt2, 2\sqrt2)$, $F(-2\sqrt2, -2\sqrt2)$
      uitwerking: |-
        $\sqrt k=2$ en $s=\sqrt8=2\sqrt2$.
    - opgave: |-
        Controleer met $P(1, 4)$ dat het verschil van de afstanden tot de brandpunten gelijk is aan de afstand tussen de toppen.
      antwoord: |-
        $4\sqrt2\approx5{,}66$
      uitwerking: |-
        $|PF_1|=\sqrt{(1-2\sqrt2)^2+(4-2\sqrt2)^2}=5-2\sqrt2$ en $|PF_2|=5+2\sqrt2$ (zie het bewijs). Het verschil is $4\sqrt2$, en de toppen liggen $\sqrt{16+16}=4\sqrt2$ uit elkaar.

- id: h4-o9
  soort: opdracht
  niveau: 2
  thema: |-
    hyperbool in een context
  opgave: |-
    Twee meetposten staan 3 km van elkaar. Een knal wordt in de eerste post 5 seconden vroeger gehoord dan in de tweede. Geluid legt 340 m/s af.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking van de mogelijke plaatsen van de knal (in meter, met de oorsprong midden tussen de posten).
      antwoord: |-
        $\tfrac{x^2}{722\,500}-\tfrac{y^2}{1\,527\,500}=1$, de tak bij de eerste post
      uitwerking: |-
        $2a=1700$, $a=850$, $c=1500$, $b^2=1500^2-850^2=1\,527\,500$. Met de eerste post links: de linkertak.
    - opgave: |-
        De knal is ver weg. Onder welke hoek met de lijn tussen de posten moeten ze kijken?
      antwoord: |-
        ongeveer $55^\circ$
      uitwerking: |-
        $\tan\theta=\tfrac ba=\tfrac{1235{,}9}{850}\approx1{,}454$, dus $\theta\approx55{,}5^\circ$, aan de kant van de eerste post.

- id: h4-o10
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijking opstellen door een punt
  opgave: |-
    Een hyperbool heeft brandpunten $(\pm\sqrt{10}, 0)$ en gaat door het punt $(3, \sqrt2)$. Geef een vergelijking. Stel $a^2 = u$.
  antwoord: |-
    $\tfrac{x^2}{6}-\tfrac{y^2}{4}=1$
  uitwerking: |-
    $b^2=10-u$ en $\tfrac9u-\tfrac{2}{10-u}=1 \ \Rightarrow\ 9(10-u)-2u=u(10-u) \ \Rightarrow\ u^2-21u+90=0$, dus $u=6$ of $u=15$. Maar $a<c$, dus $u=a^2<10$: $a^2=6$ en $b^2=4$.

- id: h4-o11
  soort: opdracht
  niveau: 2
  thema: |-
    hyperbool en rechte snijden
  opgave: |-
    Hoeveel snijpunten heeft de hyperbool $x^2 - y^2 = 9$ met de rechte? Bereken ze. Is de rechte een raaklijn?
  lijst: enumerate
  delen:
    - opgave: |-
        $y = x - 1$
      antwoord: |-
        één: $(5, 4)$, geen raaklijn
      uitwerking: |-
        $x^2-(x-1)^2=9 \ \Rightarrow\ 2x-1=9$, dus $x=5$. Eén snijpunt, maar de rechte is evenwijdig met de asymptoot $y=x$: ze snijdt de tak, en raakt niet.
    - opgave: |-
        $y = 2x - 3$
      antwoord: |-
        geen
      uitwerking: |-
        $x^2-(2x-3)^2=9 \ \Rightarrow\ -3x^2+12x-18=0 \ \Rightarrow\ x^2-4x+6=0$, met $D<0$.
    - opgave: |-
        $y = \tfrac12 x + 3$
      antwoord: |-
        twee: $x=2\pm2\sqrt7$, één op elke tak
      uitwerking: |-
        $x^2-\bigl(\tfrac14x^2+3x+9\bigr)=9 \ \Rightarrow\ x^2-4x-24=0$, dus $x=2\pm2\sqrt7\approx7{,}29$ of $-3{,}29$: één punt op elke tak.

- id: h4-o12
  soort: opdracht
  niveau: 2
  thema: |-
    eigenschappen, redeneren
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Bij een hyperbool is $a$ altijd groter dan $b$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: bij $x^2-\tfrac{y^2}{4}=1$ is $a=1$ en $b=2$. Alleen $c$ is altijd de grootste.
    - opgave: |-
        De brandpunten liggen altijd buiten de hulprechthoek.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: de rechthoek reikt tot $a$ op de as, en $c>a$.
    - opgave: |-
        Twee hyperbolen met dezelfde asymptoten zijn gelijk.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $x^2-y^2=1$ en $x^2-y^2=4$ hebben allebei de asymptoten $y=\pm x$.
    - opgave: |-
        Een rechte die een hyperbool in precies één punt snijdt, is een raaklijn.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: een rechte evenwijdig met een asymptoot snijdt één tak in één punt, zoals $y=x-1$ bij $x^2-y^2=9$.

- id: h4-o13
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundige plaats wordt een hyperbool
  opgave: |-
    Zoek de meetkundige plaats van de punten $P$ waarvan de afstand tot $F(4, 0)$ het dubbele is van de afstand tot de rechte $x = 1$. Bereken de excentriciteit. Wat valt op?
  antwoord: |-
    $\tfrac{x^2}{4}-\tfrac{y^2}{12}=1$; $e=2$
  uitwerking: |-
    $(x-4)^2+y^2=4(x-1)^2 \ \Rightarrow\ x^2-8x+16+y^2=4x^2-8x+4$, dus $3x^2-y^2=12$, of $\tfrac{x^2}{4}-\tfrac{y^2}{12}=1$.\\
    $a=2$, $c=\sqrt{4+12}=4$: $F$ is een brandpunt, en $e=2$, de verhouding van de afstanden. Net als bij de ellips in hoofdstuk 3: zie hoofdstuk 5.

- id: h4-o14
  soort: opdracht
  niveau: 2
  thema: |-
    gelijkzijdige hyperbool
  opgave: |-
    Toon aan dat de asymptoten van $\dfrac{x^2}{a^2} - \dfrac{y^2}{b^2} = 1$ loodrecht op elkaar staan als en slechts als $a = b$, en dat dit gebeurt als en slechts als $e = \sqrt2$.
  antwoord: |-
    $-\tfrac{b^2}{a^2}=-1$ en $e^2=1+\tfrac{b^2}{a^2}$
  uitwerking: |-
    De richtingscoëfficiënten $\tfrac ba$ en $-\tfrac ba$ hebben product $-\tfrac{b^2}{a^2}$. Loodrecht: product $-1$, dus $a=b$. En $e^2=\tfrac{c^2}{a^2}=\tfrac{a^2+b^2}{a^2}=1+\tfrac{b^2}{a^2}$: dat is 2 als en slechts als $a=b$.

- id: h4-o15
  soort: opdracht
  niveau: 2
  thema: |-
    parametervergelijking
  opgave: |-
    Neem de punten $P(t) = \Bigl(\dfrac{a}{\cos t},\ b\tan t\Bigr)$ met $t \in \ ]{-\tfrac{\pi}{2}}, \tfrac{\pi}{2}[$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat ze op de hyperbool $\dfrac{x^2}{a^2} - \dfrac{y^2}{b^2} = 1$ liggen.
      antwoord: |-
        $\tfrac{1}{\cos^2t}-\tan^2t=1$
      uitwerking: |-
        $\dfrac{1}{\cos^2t}-\dfrac{\sin^2t}{\cos^2t}=\dfrac{1-\sin^2t}{\cos^2t}=1$.
    - opgave: |-
        Op welke tak liggen ze? Wat gebeurt er als $t$ naar $\tfrac{\pi}{2}$ gaat?
      antwoord: |-
        de rechtertak; naar het oneindige
      uitwerking: |-
        Voor die $t$ is $\cos t>0$, dus $x\geqslant a$: de rechtertak. Als $t\to\tfrac{\pi}{2}$ gaan $x$ en $y$ naar $+\infty$, en $\tfrac yx=\tfrac ba\sin t\to\tfrac ba$: het punt volgt de asymptoot.

- id: h4-o16
  soort: opdracht
  niveau: 2
  thema: |-
    hyperbool in een context
  opgave: |-
    Het profiel van een koeltoren is een hyperbool met een verticale symmetrieas. De toren is 90 m hoog. Op 60 m hoogte is hij het smalst, met een straal van 30 m, en aan de grond is de straal 50 m. Neem de as van de toren als $y$-as en de grond als $x$-as. Hoe groot is de straal bovenaan?
  antwoord: |-
    ongeveer 36,1 m
  uitwerking: |-
    $\dfrac{x^2}{900}-\dfrac{(y-60)^2}{b^2}=1$. Aan de grond: $\tfrac{2500}{900}-\tfrac{3600}{b^2}=1$, dus $\tfrac{3600}{b^2}=\tfrac{16}{9}$ en $b^2=2025$. Bovenaan: $x^2=900\bigl(1+\tfrac{900}{2025}\bigr)=1300$, dus $x\approx36{,}1$ m.

- id: h4-o17
  soort: opdracht
  niveau: 2
  thema: |-
    toegevoegde hyperbolen
  opgave: |-
    Neem de hyperbolen $\dfrac{x^2}{a^2} - \dfrac{y^2}{b^2} = 1$ en $\dfrac{y^2}{b^2} - \dfrac{x^2}{a^2} = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat ze dezelfde asymptoten en dezelfde hulprechthoek hebben.
      antwoord: |-
        $y=\pm\tfrac bax$
      uitwerking: |-
        Vervang 1 door 0: in beide gevallen $\tfrac{x^2}{a^2}=\tfrac{y^2}{b^2}$. De hulprechthoek heeft telkens hoekpunten $(\pm a, \pm b)$.
    - opgave: |-
        Toon aan dat hun vier brandpunten op één cirkel liggen.
      antwoord: |-
        de cirkel met straal $\sqrt{a^2+b^2}$
      uitwerking: |-
        De eerste heeft brandpunten $(\pm c, 0)$, de tweede $(0, \pm c)$, telkens met $c^2=a^2+b^2$.

- id: h4-o18
  soort: opdracht
  niveau: 3
  thema: |-
    spiegeleigenschap van de hyperbool
  opgave: |-
    Neem een punt $P(x_1, y_1)$ van de hyperbool $\dfrac{x^2}{a^2} - \dfrac{y^2}{b^2} = 1$, met $x_1 \geqslant a$. De raaklijn in $P$ snijdt de $x$-as in $T$. Volgens de bissectricestelling deelt de bissectrice uit $P$ in driehoek $F_1PF_2$ de overstaande zijde in de verhouding $|PF_1| : |PF_2|$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $T\Bigl(\dfrac{a^2}{x_1}, 0\Bigr)$.
      antwoord: |-
        $y=0$ in de raaklijn
      uitwerking: |-
        $\tfrac{x_1x}{a^2}=1$ geeft $x=\tfrac{a^2}{x_1}$.
    - opgave: |-
        Toon aan dat $\dfrac{|TF_1|}{|TF_2|} = \dfrac{|PF_1|}{|PF_2|}$, en besluit dat de raaklijn de hoek $F_1PF_2$ middendoor deelt.
      antwoord: |-
        beide zijn $\dfrac{ex_1+a}{ex_1-a}$
      uitwerking: |-
        Omdat $\tfrac{a^2}{x_1}\leqslant a<c$, ligt $T$ tussen de brandpunten: $\dfrac{|TF_1|}{|TF_2|}=\dfrac{c+a^2/x_1}{c-a^2/x_1}=\dfrac{cx_1+a^2}{cx_1-a^2}=\dfrac{ex_1+a}{ex_1-a}$ (deel door $a$). Uit het bewijs van de vergelijking: $|PF_1|=ex_1+a$ en $|PF_2|=ex_1-a$. Dezelfde verhouding, dus $PT$ is de bissectrice.

- id: h4-o19
  soort: opdracht
  niveau: 3
  thema: |-
    plaatsbepaling met drie waarnemers
  opgave: |-
    Drie waarnemers staan in $A(-5, 0)$, $B(5, 0)$ en $C(-5, 8)$, in km. Ze horen een knal. $A$ en $C$ horen hem tegelijk, $B$ hoort hem later: het geluid moest naar $B$ 6 km verder. Waar was de knal?
  antwoord: |-
    $\bigl(-3\sqrt2,\ 4\bigr)\approx(-4{,}24;\ 4)$
  uitwerking: |-
    $|PB|-|PA|=6$: de linkertak van $\tfrac{x^2}{9}-\tfrac{y^2}{16}=1$ ($a=3$, $c=5$, $b=4$).\\
    $|PA|=|PC|$: $P$ ligt op de middelloodlijn van $[AC]$, de rechte $y=4$.\\
    Snijden: $x^2=9\bigl(1+\tfrac{16}{16}\bigr)=18$, en op de linkertak $x=-3\sqrt2$.\\
    Controle: $|PA|=|PC|\approx4{,}07$ en $|PB|\approx10{,}07$.

- id: h4-o20
  soort: opdracht
  niveau: 3
  thema: |-
    afstanden tot de asymptoten
  opgave: |-
    De afstand van $(x, y)$ tot de rechte $px + qy + r = 0$ is $\dfrac{|px + qy + r|}{\sqrt{p^2 + q^2}}$. Toon aan dat voor elk punt van de hyperbool $\dfrac{x^2}{a^2} - \dfrac{y^2}{b^2} = 1$ het product van de afstanden tot de twee asymptoten constant is. Gebruik dat om te verklaren waarom een tak de ene asymptoot nadert.
  antwoord: |-
    $\dfrac{a^2b^2}{a^2+b^2}$
  uitwerking: |-
    De asymptoten zijn $bx-ay=0$ en $bx+ay=0$. Het product van de afstanden is
    $\dfrac{|bx-ay|\cdot|bx+ay|}{a^2+b^2}=\dfrac{|b^2x^2-a^2y^2|}{a^2+b^2}=\dfrac{a^2b^2}{a^2+b^2}$, want $b^2x^2-a^2y^2=a^2b^2$.\\
    Ver weg wordt de afstand tot één asymptoot heel groot. Het product blijft constant, dus de afstand tot de andere gaat naar 0.

# --- Koppel -----------------------------------------------------------------------------

- id: h4-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Rationale functies
  opgave: |-
    Neem de grafiek van $f(x) = \dfrac{2x + 1}{x - 1}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $f(x) = 2 + \dfrac{3}{x - 1}$, en dat de grafiek voldoet aan $(x - 1)(y - 2) = 3$.
      antwoord: |-
        deel uit
      uitwerking: |-
        $2x+1=2(x-1)+3$. Dan is $y-2=\tfrac{3}{x-1}$.
    - opgave: |-
        Het is de grafiek van $XY = 3$, verschoven over $(1, 2)$. Geef de asymptoten, de toppen en de brandpunten.
      antwoord: |-
        $x=1$, $y=2$; toppen $(1\pm\sqrt3, 2\pm\sqrt3)$; brandpunten $(1\pm\sqrt6, 2\pm\sqrt6)$
      uitwerking: |-
        Voor $XY=3$: asymptoten de assen, toppen $\pm(\sqrt3, \sqrt3)$ en brandpunten $\pm(\sqrt6, \sqrt6)$. Verschuif over $(1, 2)$ (telkens beide plustekens of beide mintekens).

- id: h4-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Exponentiële functies
  opgave: |-
    De hyperbolische functies zijn $\cosh u = \dfrac{\e^u + \e^{-u}}{2}$ en $\sinh u = \dfrac{\e^u - \e^{-u}}{2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\cosh^2 u - \sinh^2 u = 1$.
      antwoord: |-
        $\tfrac14(2+2)=1$
      uitwerking: |-
        $\cosh^2u-\sinh^2u=\tfrac14\bigl(\e^{2u}+2+\e^{-2u}\bigr)-\tfrac14\bigl(\e^{2u}-2+\e^{-2u}\bigr)=1$.
    - opgave: |-
        Leg uit waar de naam vandaan komt. Welk deel van $x^2 - y^2 = 1$ beschrijven de punten $(\cosh u, \sinh u)$?
      antwoord: |-
        de rechtertak
      uitwerking: |-
        Zoals $(\cos t, \sin t)$ op de cirkel $x^2+y^2=1$ ligt, ligt $(\cosh u, \sinh u)$ op de hyperbool $x^2-y^2=1$. Omdat $\cosh u\geqslant1$ is het de rechtertak, en $\sinh u$ neemt alle reële waarden aan.

- id: h4-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    Schrijf $z = x + y\mathrm{i}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de punten met $\mathrm{Re}(z^2) = 1$ een hyperbool vormen, en ook de punten met $\mathrm{Im}(z^2) = 2$.
      antwoord: |-
        $x^2-y^2=1$ en $xy=1$
      uitwerking: |-
        $z^2=x^2-y^2+2xy\,\mathrm{i}$. Dus $x^2-y^2=1$ en $2xy=2$: twee gelijkzijdige hyperbolen.
    - opgave: |-
        Welke getallen liggen op beide? Los $z^2 = 1 + 2\mathrm{i}$ op, en controleer met de hyperbolen.
      antwoord: |-
        $z\approx\pm(1{,}272+0{,}786\,\mathrm{i})$
      uitwerking: |-
        Met $y=\tfrac1x$: $x^2-\tfrac{1}{x^2}=1$, dus $x^4-x^2-1=0$ en $x^2=\tfrac{1+\sqrt5}{2}$. Dat geeft $x\approx\pm1{,}272$ en $y=\tfrac1x\approx\pm0{,}786$. Inderdaad is $(1{,}272+0{,}786\,\mathrm{i})^2\approx1+2\mathrm{i}$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h4-t1
  soort: test
  niveau: 1
  opgave: |-
    Bepaal de toppen, de brandpunten en de asymptoten van de hyperbool $16x^2 - 9y^2 = 144$.
  antwoord: |-
    $(\pm3, 0)$, $F(\pm5, 0)$, $y=\pm\tfrac43x$
  uitwerking: |-
    $\tfrac{x^2}{9}-\tfrac{y^2}{16}=1$: $a=3$, $b=4$, $c=5$.

- id: h4-t2
  soort: test
  niveau: 1
  opgave: |-
    Geef een vergelijking van de hyperbool met toppen $(0, \pm4)$ en brandpunten $(0, \pm5)$.
  antwoord: |-
    $\tfrac{y^2}{16}-\tfrac{x^2}{9}=1$
  uitwerking: |-
    $a=4$, $c=5$, $b^2=9$, staand.

- id: h4-t3
  soort: test
  niveau: 1
  opgave: |-
    Geef de asymptoten van $\dfrac{x^2}{25} - \dfrac{y^2}{4} = 1$ en teken de hyperbool met de hulprechthoek.
  antwoord: |-
    $y=\pm\tfrac25x$
  uitwerking: |-
    Hulprechthoek met hoekpunten $(\pm5, \pm2)$; de diagonalen zijn $y=\pm\tfrac25x$.

- id: h4-t4
  soort: test
  niveau: 2
  opgave: |-
    Bepaal het middelpunt en de brandpunten van $x^2 - 4y^2 - 2x - 8y - 7 = 0$.
  antwoord: |-
    $M(1, -1)$, $F(1\pm\sqrt5, -1)$
  uitwerking: |-
    $(x-1)^2-1-4(y+1)^2+4-7=0$, dus $\tfrac{(x-1)^2}{4}-(y+1)^2=1$: $a=2$, $b=1$, $c=\sqrt5$.

- id: h4-t5
  soort: test
  niveau: 2
  opgave: |-
    Bepaal de raaklijn aan de hyperbool $\dfrac{x^2}{8} - \dfrac{y^2}{4} = 1$ in het punt $(4, 2)$.
  antwoord: |-
    $y=x-2$
  uitwerking: |-
    $2-1=1$ klopt. $\tfrac{4x}{8}-\tfrac{2y}{4}=1$, dus $x-y=2$.

- id: h4-t6
  soort: test
  niveau: 2
  opgave: |-
    Bepaal de toppen en de brandpunten van de grafiek van $y = \dfrac{18}{x}$.
  antwoord: |-
    toppen $(3\sqrt2, 3\sqrt2)$ en $(-3\sqrt2, -3\sqrt2)$; brandpunten $(6, 6)$ en $(-6, -6)$
  uitwerking: |-
    $k=18$: $\sqrt k=3\sqrt2$ en $s=\sqrt{2k}=6$.
