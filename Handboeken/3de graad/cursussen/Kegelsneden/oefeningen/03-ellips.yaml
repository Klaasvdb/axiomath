# Oefeningen van hoofdstuk 3. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of los op.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\bigl((x - 3)^2 + y^2\bigr) - \bigl((x + 3)^2 + y^2\bigr)$
      antwoord: |-
        $-12x$
      uitwerking: |-
        $x^2-6x+9-x^2-6x-9=-12x$.
    - opgave: |-
        $\sqrt{x^2 + 9} = x + 1$
      antwoord: |-
        $x=4$
      uitwerking: |-
        Kwadrateer: $x^2+9=x^2+2x+1$, dus $x=4$. Controle: $\sqrt{25}=5$.
    - opgave: |-
        het kwadraat afsplitsen in $4x^2 - 8x$
      antwoord: |-
        $4(x-1)^2-4$
      uitwerking: |-
        $4(x^2-2x)=4\bigl((x-1)^2-1\bigr)=4(x-1)^2-4$.
    - opgave: |-
        de oppervlakte van een cirkel met straal 3
      antwoord: |-
        $9\pi$
      uitwerking: |-
        $\pi r^2=9\pi$.
    - opgave: |-
        de rechthoekszijde als de schuine zijde 5 is en de andere rechthoekszijde 3
      antwoord: |-
        4
      uitwerking: |-
        $\sqrt{25-9}=4$.
    - opgave: |-
        $\cos\tfrac{\pi}{3}$ en $\sin\tfrac{\pi}{3}$
      antwoord: |-
        $\tfrac12$ en $\tfrac{\sqrt3}{2}$
      uitwerking: |-
        De bekende waarden.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Een ellips heeft brandpunten $F_1(-3, 0)$ en $F_2(3, 0)$, en voor elk punt $P$ is $|PF_1| + |PF_2| = 10$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de snijpunten met de assen.
      antwoord: |-
        $(\pm5,0)$ en $(0,\pm4)$
      uitwerking: |-
        Op de $x$-as: $x=\pm5$. Op de $y$-as: afstand 5 tot elk brandpunt, dus $y=\pm\sqrt{25-9}=\pm4$.
    - opgave: |-
        Toon aan dat $P(3;\ 3{,}2)$ op de ellips ligt.
      antwoord: |-
        $6{,}8+3{,}2=10$
      uitwerking: |-
        $|PF_2|=3{,}2$ en $|PF_1|=\sqrt{36+10{,}24}=\sqrt{46{,}24}=6{,}8$.
    - opgave: |-
        Bereken $\dfrac{x^2}{25} + \dfrac{y^2}{16}$ voor de punten uit a en b. Wat valt op?
      antwoord: |-
        altijd 1
      uitwerking: |-
        Voor de snijpunten met de assen is het 1. Voor $P$: $0{,}36+0{,}64=1$.
    - opgave: |-
        Vermoed een vergelijking van de ellips. Waar komen 25 en 16 vandaan?
      antwoord: |-
        $\tfrac{x^2}{25}+\tfrac{y^2}{16}=1$
      uitwerking: |-
        $25=5^2$ en $16=4^2$: de kwadraten van de afstanden van het middelpunt tot de snijpunten met de assen.

- id: h3-std
  soort: kort
  opgave: |-
    Bepaal de toppen en de brandpunten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{x^2}{36} + \dfrac{y^2}{20} = 1$
      antwoord: |-
        $(\pm6,0)$, $(0,\pm2\sqrt5)$, $F(\pm4,0)$
      uitwerking: |-
        $a=6$, $b=\sqrt{20}=2\sqrt5$, $c=\sqrt{36-20}=4$.
    - opgave: |-
        $\dfrac{x^2}{9} + \dfrac{y^2}{25} = 1$
      antwoord: |-
        $(\pm3,0)$, $(0,\pm5)$, $F(0,\pm4)$
      uitwerking: |-
        De grootste noemer onder $y^2$: rechtop. $c=\sqrt{25-9}=4$.
    - opgave: |-
        $x^2 + 2y^2 = 8$
      antwoord: |-
        $(\pm2\sqrt2,0)$, $(0,\pm2)$, $F(\pm2,0)$
      uitwerking: |-
        $\tfrac{x^2}{8}+\tfrac{y^2}{4}=1$: $c=\sqrt{8-4}=2$.

- id: h3-exc
  soort: kort
  opgave: |-
    Bereken de excentriciteit.
  lijst: enumerate
  delen:
    - opgave: |-
        De ellips $\dfrac{x^2}{25} + \dfrac{y^2}{16} = 1$.
      antwoord: |-
        $\tfrac35$
      uitwerking: |-
        $c=3$, dus $e=\tfrac35$.
    - opgave: |-
        De baan van Mercurius, die tussen 46,0 en 69,8 miljoen km van de zon blijft.
      antwoord: |-
        ongeveer 0,21
      uitwerking: |-
        $a=\tfrac{46{,}0+69{,}8}{2}=57{,}9$ en $c=\tfrac{69{,}8-46{,}0}{2}=11{,}9$, dus $e\approx0{,}21$. De platste baan van alle planeten.

- id: h3-param
  soort: kort
  opgave: |-
    Neem de ellips $x = 6\cos t$, $y = 2\sin t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk punt hoort bij $t = \tfrac{3\pi}{4}$?
      antwoord: |-
        $(-3\sqrt2,\sqrt2)$
      uitwerking: |-
        $6\cdot\bigl(-\tfrac{\sqrt2}{2}\bigr)=-3\sqrt2$ en $2\cdot\tfrac{\sqrt2}{2}=\sqrt2$.
    - opgave: |-
        Geef de vergelijking en bereken de oppervlakte.
      antwoord: |-
        $\tfrac{x^2}{36}+\tfrac{y^2}{4}=1$; $12\pi$
      uitwerking: |-
        $a=6$, $b=2$: $A=12\pi$.

- id: h3-versch
  soort: kort
  opgave: |-
    Bepaal het middelpunt en de brandpunten van de ellips $x^2 + 4y^2 - 6x + 8y + 9 = 0$.
  antwoord: |-
    $M(3,-1)$, $F(3\pm\sqrt3,-1)$
  uitwerking: |-
    $(x-3)^2-9+4(y+1)^2-4+9=0$, dus $(x-3)^2+4(y+1)^2=4$, of $\dfrac{(x-3)^2}{4}+(y+1)^2=1$. $a=2$, $b=1$, $c=\sqrt3$, liggend.

- id: h3-raak
  soort: kort
  opgave: |-
    Bepaal de raaklijn in het gegeven punt.
  lijst: enumerate
  delen:
    - opgave: |-
        $\dfrac{x^2}{18} + \dfrac{y^2}{2} = 1$ in $(3, 1)$
      antwoord: |-
        $x+3y=6$
      uitwerking: |-
        $\tfrac{9}{18}+\tfrac12=1$ klopt. $\tfrac{3x}{18}+\tfrac{y}{2}=1$, dus $x+3y=6$.
    - opgave: |-
        $\dfrac{x^2}{4} + \dfrac{y^2}{16} = 1$ in $(1, 2\sqrt3)$
      antwoord: |-
        $2x+\sqrt3y=8$
      uitwerking: |-
        $\tfrac14+\tfrac{12}{16}=1$ klopt. $\tfrac{x}{4}+\tfrac{2\sqrt3y}{16}=1$; maal 8: $2x+\sqrt3y=8$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    toppen en brandpunten
  opgave: |-
    Bepaal $a$, $b$ en $c$, de toppen en de brandpunten. Teken de ellips.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x^2}{16} + \dfrac{y^2}{9} = 1$
      antwoord: |-
        $a=4$, $b=3$, $c=\sqrt7$; $F(\pm\sqrt7,0)$
      uitwerking: |-
        Liggend. Toppen $(\pm4,0)$ en $(0,\pm3)$.
    - opgave: |-
        $\dfrac{x^2}{9} + \dfrac{y^2}{25} = 1$
      antwoord: |-
        $a=5$, $b=3$, $c=4$; $F(0,\pm4)$
      uitwerking: |-
        Rechtop. Toppen $(\pm3,0)$ en $(0,\pm5)$.
    - opgave: |-
        $4x^2 + y^2 = 4$
      antwoord: |-
        $a=2$, $b=1$, $c=\sqrt3$; $F(0,\pm\sqrt3)$
      uitwerking: |-
        $x^2+\tfrac{y^2}{4}=1$: rechtop. Toppen $(\pm1,0)$ en $(0,\pm2)$.
    - opgave: |-
        $x^2 + 3y^2 = 12$
      antwoord: |-
        $a=2\sqrt3$, $b=2$, $c=2\sqrt2$; $F(\pm2\sqrt2,0)$
      uitwerking: |-
        $\tfrac{x^2}{12}+\tfrac{y^2}{4}=1$: liggend, $c=\sqrt{12-4}=\sqrt8$. Toppen $(\pm2\sqrt3,0)$ en $(0,\pm2)$.
        \figuren{\begin{tikzpicture}[scale=.4,font=\scriptsize]
          \rooster{-4}{1}{4}{-2}{1}{2}
          \ellips{0}{0}{3.464}{2}
          \brandpunt{-2.828}{0}{F_1}
          \brandpunt{2.828}{0}{F_2}
        \end{tikzpicture}}

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijking opstellen
  opgave: |-
    Geef een vergelijking van de ellips met middelpunt de oorsprong en:
  lijst: enumerate
  delen:
    - opgave: |-
        toppen $(\pm5, 0)$ en $(0, \pm2)$;
      antwoord: |-
        $\tfrac{x^2}{25}+\tfrac{y^2}{4}=1$
      uitwerking: |-
        $a=5$ en $b=2$, liggend.
    - opgave: |-
        brandpunten $(\pm3, 0)$ en een lange as van 10;
      antwoord: |-
        $\tfrac{x^2}{25}+\tfrac{y^2}{16}=1$
      uitwerking: |-
        $a=5$, $c=3$, dus $b^2=25-9=16$.
    - opgave: |-
        brandpunten $(0, \pm4)$ en een korte as van 6;
      antwoord: |-
        $\tfrac{x^2}{9}+\tfrac{y^2}{25}=1$
      uitwerking: |-
        $b=3$, $c=4$, dus $a^2=9+16=25$, rechtop.
    - opgave: |-
        een top in $(6, 0)$ op de lange as, en door het punt $(3, 2)$.
      antwoord: |-
        $\tfrac{x^2}{36}+\tfrac{3y^2}{16}=1$
      uitwerking: |-
        $\tfrac{x^2}{36}+\tfrac{y^2}{b^2}=1$ door $(3,2)$: $\tfrac14+\tfrac{4}{b^2}=1$, dus $b^2=\tfrac{16}{3}$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    op, binnen of buiten de ellips
  opgave: |-
    Een punt ligt binnen de ellips $\dfrac{x^2}{16} + \dfrac{y^2}{4} = 1$ als $\dfrac{x^2}{16} + \dfrac{y^2}{4} < 1$. Ligt het punt op, binnen of buiten de ellips?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(2, \sqrt3)$
      antwoord: |-
        op
      uitwerking: |-
        $\tfrac4{16}+\tfrac34=1$.
    - opgave: |-
        $(3, 1)$
      antwoord: |-
        binnen
      uitwerking: |-
        $\tfrac9{16}+\tfrac14=\tfrac{13}{16}<1$.
    - opgave: |-
        $(-2, 2)$
      antwoord: |-
        buiten
      uitwerking: |-
        $\tfrac14+1>1$.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    excentriciteit
  opgave: |-
    Bereken de excentriciteit. Welke ellips lijkt het meest op een cirkel?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{x^2}{100} + \dfrac{y^2}{64} = 1$
      antwoord: |-
        0,6
      uitwerking: |-
        $c=6$, $e=\tfrac{6}{10}$.
    - opgave: |-
        $\dfrac{x^2}{100} + \dfrac{y^2}{99} = 1$
      antwoord: |-
        0,1
      uitwerking: |-
        $c=1$, $e=0{,}1$: het meest een cirkel.
    - opgave: |-
        $x^2 + 4y^2 = 4$
      antwoord: |-
        $\tfrac{\sqrt3}{2}\approx0{,}87$
      uitwerking: |-
        $a=2$, $b=1$, $c=\sqrt3$.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    parametervergelijking
  opgave: |-
    Neem de ellips $x = 4\cos t$, $y = 3\sin t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke punten horen bij $t = 0$, $\tfrac{\pi}{2}$, $\pi$ en $\tfrac{\pi}{6}$?
      antwoord: |-
        $(4,0)$, $(0,3)$, $(-4,0)$, $\bigl(2\sqrt3,\tfrac32\bigr)$
      uitwerking: |-
        Invullen. Voor $\tfrac{\pi}{6}$: $4\cdot\tfrac{\sqrt3}{2}=2\sqrt3$ en $3\cdot\tfrac12=\tfrac32$.
    - opgave: |-
        Bij welke $t \in [0, 2\pi[$ hoort het punt $\bigl(-2, -\tfrac{3\sqrt3}{2}\bigr)$?
      antwoord: |-
        $t=\tfrac{4\pi}{3}$
      uitwerking: |-
        $\cos t=-\tfrac12$ en $\sin t=-\tfrac{\sqrt3}{2}$: $t=\tfrac{4\pi}{3}$.

- id: h3-o6
  soort: opdracht
  niveau: 2
  thema: |-
    verschoven ellips
  opgave: |-
    Bepaal het middelpunt, $a$, $b$, $c$ en de brandpunten.
  lijst: enumerate
  delen:
    - opgave: |-
        $\dfrac{(x - 1)^2}{25} + \dfrac{(y + 2)^2}{9} = 1$
      antwoord: |-
        $M(1,-2)$; 5, 3, 4; $F(-3,-2)$ en $F(5,-2)$
      uitwerking: |-
        Liggend: $c=4$, de brandpunten 4 links en rechts van $M$.
    - opgave: |-
        $4x^2 + y^2 + 8x - 6y + 9 = 0$
      antwoord: |-
        $M(-1,3)$; 2, 1, $\sqrt3$; $F(-1,3\pm\sqrt3)$
      uitwerking: |-
        $4(x+1)^2-4+(y-3)^2-9+9=0$, dus $(x+1)^2+\tfrac{(y-3)^2}{4}=1$: rechtop.
    - opgave: |-
        $9x^2 + 4y^2 + 36x - 8y + 4 = 0$
      antwoord: |-
        $M(-2,1)$; 3, 2, $\sqrt5$; $F(-2,1\pm\sqrt5)$
      uitwerking: |-
        $9(x+2)^2-36+4(y-1)^2-4+4=0$, dus $9(x+2)^2+4(y-1)^2=36$, of $\tfrac{(x+2)^2}{4}+\tfrac{(y-1)^2}{9}=1$: rechtop.

- id: h3-o7
  soort: opdracht
  niveau: 2
  thema: |-
    ellips in een context
  opgave: |-
    Een tuinier wil een perk in de vorm van een ellips, 12 m lang en 8 m breed. Hij werkt met twee piketten en een lus touw, zoals in hoofdstuk 1. Hoe ver uit elkaar moeten de piketten staan, en hoe lang moet de lus zijn?
  antwoord: |-
    ongeveer 8,94 m; ongeveer 20,94 m
  uitwerking: |-
    $a=6$, $b=4$, dus $c=\sqrt{36-16}=\sqrt{20}\approx4{,}47$. De piketten staan $2c\approx8{,}94$ m uit elkaar. De lus loopt rond beide piketten en het potlood: $2a+2c\approx20{,}94$ m.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijn
  opgave: |-
    Bepaal de raaklijn. Controleer eerst of het punt op de ellips ligt.
  lijst: enumerate
  delen:
    - opgave: |-
        $\dfrac{x^2}{8} + \dfrac{y^2}{2} = 1$ in $(-2, 1)$
      antwoord: |-
        $y=\tfrac12x+2$
      uitwerking: |-
        $\tfrac48+\tfrac12=1$ klopt. $-\tfrac{2x}{8}+\tfrac{y}{2}=1$, dus $y=\tfrac12x+2$.
    - opgave: |-
        $\dfrac{x^2}{25} + \dfrac{y^2}{9} = 1$ in $\bigl(4, \tfrac95\bigr)$
      antwoord: |-
        $4x+5y=25$
      uitwerking: |-
        $\tfrac{16}{25}+\tfrac{81/25}{9}=\tfrac{16}{25}+\tfrac{9}{25}=1$ klopt. $\tfrac{4x}{25}+\tfrac{9y/5}{9}=1$, dus $\tfrac{4x}{25}+\tfrac{y}{5}=1$, of $4x+5y=25$.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    excentriciteit in een context
  opgave: |-
    De komeet van Halley komt tot 0,59 AE bij de zon, en gaat er tot 35,1 AE vandaan. Een AE (astronomische eenheid) is de gemiddelde afstand van de aarde tot de zon.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $a$, $c$, $b$ en de excentriciteit van de baan.
      antwoord: |-
        $a\approx17{,}85$; $c\approx17{,}26$; $b\approx4{,}55$; $e\approx0{,}967$
      uitwerking: |-
        $a=\tfrac{0{,}59+35{,}1}{2}=17{,}845$ en $c=\tfrac{35{,}1-0{,}59}{2}=17{,}255$. $b=\sqrt{a^2-c^2}=\sqrt{(a-c)(a+c)}=\sqrt{0{,}59\cdot35{,}1}\approx4{,}55$, en $e\approx0{,}967$.
    - opgave: |-
        Teken de baan met een lange as van 10 cm. Waar staat de zon?
      antwoord: |-
        korte as ongeveer 2,55 cm; de zon 0,17 cm van een top
      uitwerking: |-
        Schaal: 1 AE is $\tfrac{10}{35{,}69}\approx0{,}28$ cm. De korte as is dan ongeveer 2,55 cm, en de zon staat $0{,}59\cdot0{,}28\approx0{,}17$ cm van de top. Een sigaarvorm, heel anders dan de aardbaan.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    ellips en rechte snijden
  opgave: |-
    Neem de ellips $\dfrac{x^2}{4} + y^2 = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de snijpunten met de rechte $y = x - 1$.
      antwoord: |-
        $(0,-1)$ en $\bigl(\tfrac85,\tfrac35\bigr)$
      uitwerking: |-
        $\tfrac{x^2}{4}+(x-1)^2=1 \ \Rightarrow\ \tfrac54x^2-2x=0$, dus $x=0$ of $x=\tfrac85$.
    - opgave: |-
        Voor welke $k$ raakt de rechte $y = x + k$ de ellips?
      antwoord: |-
        $k=\pm\sqrt5$
      uitwerking: |-
        $\tfrac{x^2}{4}+(x+k)^2=1 \ \Rightarrow\ \tfrac54x^2+2kx+k^2-1=0$. Raken: $D=4k^2-5(k^2-1)=5-k^2=0$.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    spiegeleigenschap in een context
  opgave: |-
    Een zaal heeft een gewelf in de vorm van een halve ellips, met de vloer langs de lange as. De zaal is 30 m lang en het gewelf is in het midden 10 m hoog. Waar moeten twee mensen staan om elkaar fluisterend te verstaan?
  antwoord: |-
    in de brandpunten, 11,2 m van het midden
  uitwerking: |-
    $a=15$, $b=10$, dus $c=\sqrt{225-100}=\sqrt{125}\approx11{,}2$ m. Ze staan elk 11,2 m van het midden, dus ongeveer 3,8 m van de muur aan het uiteinde. (Hun hoofd zit iets boven de vloer, dus in werkelijkheid is het een benadering.)

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    meetkundige plaats wordt een ellips
  opgave: |-
    Zoek de meetkundige plaats van de punten $P$ waarvan de afstand tot $F(4, 0)$ de helft is van de afstand tot de rechte $x = 16$. Welke kromme is het? Bereken ook de excentriciteit. Wat valt op?
  antwoord: |-
    de ellips $\tfrac{x^2}{64}+\tfrac{y^2}{48}=1$; $e=\tfrac12$
  uitwerking: |-
    $(x-4)^2+y^2=\tfrac14(x-16)^2 \ \Rightarrow\ 4x^2-32x+64+4y^2=x^2-32x+256$, dus $3x^2+4y^2=192$, of $\tfrac{x^2}{64}+\tfrac{y^2}{48}=1$.\\
    $a=8$, $c=\sqrt{64-48}=4$: $F$ is een brandpunt, en $e=\tfrac12$, precies de verhouding van de afstanden. Hoofdstuk 5 legt uit waarom.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte en omtrek
  opgave: |-
    Neem de ellips $\dfrac{x^2}{25} + \dfrac{y^2}{9} = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de oppervlakte.
      antwoord: |-
        $15\pi\approx47{,}1$
      uitwerking: |-
        $\pi\cdot5\cdot3=15\pi$.
    - opgave: |-
        Voor de omtrek bestaat geen eenvoudige formule. De Indiase wiskundige Ramanujan gaf in 1914 een zeer goede benadering: $\pi\bigl(3(a + b) - \sqrt{(3a + b)(a + 3b)}\bigr)$. Bereken ze.
      antwoord: |-
        ongeveer 25,53
      uitwerking: |-
        $\pi\bigl(24-\sqrt{18\cdot14}\bigr)=\pi(24-\sqrt{252})\approx25{,}53$.
    - opgave: |-
        Iemand stelt de formule $2\pi \cdot \dfrac{a + b}{2}$ voor. Wat geeft die? Is ze voor een cirkel juist?
      antwoord: |-
        ongeveer 25,13; ja
      uitwerking: |-
        $8\pi\approx25{,}13$, iets te klein. Voor een cirkel is $a=b=r$ en krijg je $2\pi r$: juist. Ook de formule van Ramanujan geeft dan $\pi(6r-4r)=2\pi r$.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    raaklijn met gegeven richting
  opgave: |-
    Bepaal de raaklijnen aan de ellips $\dfrac{x^2}{12} + \dfrac{y^2}{4} = 1$ die evenwijdig zijn met de rechte $y = -x$.
  antwoord: |-
    $x+y=4$ en $x+y=-4$
  uitwerking: |-
    De raaklijn in $(x_1,y_1)$ is $\tfrac{x_1x}{12}+\tfrac{y_1y}{4}=1$, met richtingscoëfficiënt $-\dfrac{x_1/12}{y_1/4}=-\dfrac{x_1}{3y_1}$. Die is $-1$ als $x_1=3y_1$. Invullen: $\tfrac{9y_1^2}{12}+\tfrac{y_1^2}{4}=y_1^2=1$, dus $(3,1)$ en $(-3,-1)$. Raaklijnen: $\tfrac{3x}{12}+\tfrac y4=1$, of $x+y=4$, en $x+y=-4$.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    ellips in een context
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.32,font=\scriptsize]
        \fill[accent!15] (5,0) arc[start angle=0,end angle=180,x radius=5,y radius=4] -- cycle;
        \draw[grijs,thick] (-6,0) -- (6,0);
        \draw[accent,thick] (5,0) arc[start angle=0,end angle=180,x radius=5,y radius=4];
        \draw[grijs,fill=white] (-1.5,0) rectangle (1.5,3.8);
        \node[below] at (-5,0) {$-5$};
        \node[below] at (5,0) {5};
        \node[above] at (0,4) {4};
      \end{tikzpicture}
  opgave: |-
    De doorsnede van een tunnel is een halve ellips: 10 m breed aan de grond en 4 m hoog in het midden.
  lijst: enumerate
  delen:
    - opgave: |-
        Kan een vrachtwagen van 3 m breed en 3,8 m hoog door de tunnel als hij in het midden rijdt?
      antwoord: |-
        ja, nipt: 1,6 cm marge
      uitwerking: |-
        $\tfrac{x^2}{25}+\tfrac{y^2}{16}=1$. Bij $x=1{,}5$ is $y=4\sqrt{1-0{,}09}\approx3{,}816$ m. Ja, met 1,6 cm marge.
    - opgave: |-
        En als hij 0,5 m naast het midden rijdt?
      antwoord: |-
        nee
      uitwerking: |-
        Dan reikt hij tot $x=2$, waar $y=4\sqrt{1-0{,}16}\approx3{,}67$ m. Te laag.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    ellips construeren met twee cirkels
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \draw[lijngrijs] (-3.3,0) -- (3.3,0) (0,-3.2) -- (0,3.3);
        \draw[lijngrijs] (0,0) circle (3) (0,0) circle (1.8);
        \ellips[dashed]{0}{0}{3}{1.8}
        \draw[grijs] (0,0) -- (1.5,2.598);
        \draw[grijs,dashed] (1.5,2.598) -- (1.5,1.559) (.9,1.559) -- (1.5,1.559);
        \fill (1.5,2.598) circle (2pt) node[above right] {$A$};
        \fill (.9,1.559) circle (2pt) node[left] {$B$};
        \fill[accent] (1.5,1.559) circle (2pt) node[right,text=black] {$P$};
      \end{tikzpicture}
  opgave: |-
    Teken twee cirkels rond de oorsprong, met straal $a$ en $b$. Een halfrechte uit de oorsprong onder een hoek $t$ snijdt ze in $A$ en $B$. Het punt $P$ heeft de $x$-coördinaat van $A$ en de $y$-coördinaat van $B$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $P$ op de ellips $\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1$ ligt.
      antwoord: |-
        $P(a\cos t, b\sin t)$
      uitwerking: |-
        $A(a\cos t,a\sin t)$ en $B(b\cos t,b\sin t)$, dus $P(a\cos t,b\sin t)$: de parametervergelijking.
    - opgave: |-
        Teken zo met passer en lat acht punten van de ellips met $a = 5$ en $b = 3$.
      antwoord: |-
        bijvoorbeeld om de $45^\circ$
      uitwerking: |-
        Neem $t$ om de $45^\circ$. Bij $45^\circ$ krijg je $\bigl(\tfrac{5\sqrt2}{2},\tfrac{3\sqrt2}{2}\bigr)\approx(3{,}54;\ 2{,}12)$.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    spiegeleigenschap in een context
  opgave: |-
    Een niersteenvergruizer heeft een spiegel waarvan de doorsnede een ellips is met een lange as van 30 cm en een korte as van 18 cm. De schokgolf ontstaat in het brandpunt binnen de spiegel.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe ver van de bodem van de spiegel ontstaat de schokgolf?
      antwoord: |-
        3 cm
      uitwerking: |-
        $a=15$, $b=9$, $c=12$. Het brandpunt ligt $a-c=3$ cm van de top.
    - opgave: |-
        Hoe ver van de bron moet de niersteen liggen?
      antwoord: |-
        24 cm
      uitwerking: |-
        In het andere brandpunt: $2c=24$ cm verder.

- id: h3-o18
  soort: opdracht
  niveau: 2
  thema: |-
    ellips tussen twee cirkels
  opgave: |-
    Toon aan dat voor elk punt $P$ van de ellips $\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1$ (met $a > b$) geldt: $b \leqslant |OP| \leqslant a$. Waar is $|OP|$ het kleinst en waar het grootst?
  antwoord: |-
    $|OP|^2=b^2+\tfrac{c^2}{a^2}x^2$; kleinst in $(0,\pm b)$, grootst in $(\pm a,0)$
  uitwerking: |-
    $|OP|^2=x^2+y^2=x^2+b^2-\tfrac{b^2}{a^2}x^2=b^2+\tfrac{a^2-b^2}{a^2}x^2$. Met $0\leqslant x^2\leqslant a^2$ ligt dat tussen $b^2$ en $b^2+(a^2-b^2)=a^2$. Het kleinst bij $x=0$, het grootst bij $x=\pm a$.

- id: h3-o19
  soort: opdracht
  niveau: 3
  thema: |-
    raaklijn met de afgeleide
  opgave: |-
    Het bovenste deel van de ellips $\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1$ is de grafiek van $y = b\sqrt{1 - \dfrac{x^2}{a^2}}$. Toon met de afgeleide aan dat de raaklijn in $P(x_1, y_1)$, met $y_1 > 0$, de formule uit de stelling geeft.
  antwoord: |-
    $y'=-\dfrac{b^2x_1}{a^2y_1}$
  uitwerking: |-
    $y'=b\cdot\dfrac{-2x/a^2}{2\sqrt{1-x^2/a^2}}=-\dfrac{b^2x}{a^2y}$, want $\sqrt{1-x^2/a^2}=\tfrac yb$. De raaklijn: $y-y_1=-\dfrac{b^2x_1}{a^2y_1}(x-x_1)$. Maal $\tfrac{y_1}{b^2}$ en herschik:
    $\dfrac{x_1x}{a^2}+\dfrac{y_1y}{b^2}=\dfrac{x_1^2}{a^2}+\dfrac{y_1^2}{b^2}=1$.

- id: h3-o20
  soort: opdracht
  niveau: 3
  thema: |-
    spiegeleigenschap, redeneren
  opgave: |-
    Een biljarttafel heeft de vorm van de ellips $\dfrac{x^2}{1{,}44} + \dfrac{y^2}{0{,}64} = 1$ (in meter). Je legt een bal in het ene brandpunt en stoot hem in een willekeurige richting weg.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar liggen de brandpunten?
      antwoord: |-
        $(\pm0{,}89;\ 0)$
      uitwerking: |-
        $c=\sqrt{1{,}44-0{,}64}=\sqrt{0{,}8}\approx0{,}89$ m.
    - opgave: |-
        Toon aan dat de bal na één botsing door het andere brandpunt rolt. Hoe lang is die weg van brandpunt tot brandpunt?
      antwoord: |-
        spiegeleigenschap; 2,4 m
      uitwerking: |-
        Een bal kaatst zoals licht: de spiegeleigenschap stuurt hem naar het andere brandpunt. De weg $F_1PF_2$ is $|PF_1|+|PF_2|=2a=2{,}4$ m, in welke richting je ook stoot.
    - opgave: |-
        Waar rolt hij na de tweede botsing heen?
      antwoord: |-
        weer door het eerste brandpunt
      uitwerking: |-
        Hij vertrekt nu uit $F_2$, dus na de volgende botsing gaat hij weer door $F_1$. Zonder wrijving wisselt hij altijd tussen de brandpunten.

- id: h3-o21
  soort: opdracht
  niveau: 3
  thema: |-
    grootste rechthoek in een ellips
  opgave: |-
    Een rechthoek met zijden evenwijdig met de assen heeft zijn hoekpunten op de ellips $\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1$. Gebruik de parametervergelijking om de grootst mogelijke oppervlakte te vinden. Welk deel van de ellips bedekt die rechthoek?
  antwoord: |-
    $2ab$; $\tfrac{2}{\pi}\approx64\,\%$
  uitwerking: |-
    Neem het hoekpunt $(a\cos t,b\sin t)$ met $0<t<\tfrac{\pi}{2}$. De oppervlakte is $4ab\cos t\sin t=2ab\sin2t$, het grootst als $2t=\tfrac{\pi}{2}$: $2ab$, met hoekpunt $\bigl(\tfrac{a}{\sqrt2},\tfrac{b}{\sqrt2}\bigr)$. Dat is $\dfrac{2ab}{\pi ab}=\dfrac2\pi\approx64\,\%$ van de ellips, net als bij een vierkant in een cirkel.

# --- Koppel -----------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Integralen
  opgave: |-
    Bereken de oppervlakte van de ellips $\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1$ met een integraal.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $A = \dfrac{4b}{a}\displaystyle\int_0^a \sqrt{a^2 - x^2}\dx$.
      antwoord: |-
        vier keer het stuk in het eerste kwadrant
      uitwerking: |-
        In het eerste kwadrant is $y=b\sqrt{1-\tfrac{x^2}{a^2}}=\tfrac ba\sqrt{a^2-x^2}$. De ellips is symmetrisch: vier keer die oppervlakte.
    - opgave: |-
        Bereken de integraal met de substitutie $x = a\sin u$, of zonder rekenen: welke figuur is het?
      antwoord: |-
        $\tfrac{\pi a^2}{4}$, dus $A=\pi ab$
      uitwerking: |-
        Zonder rekenen: een kwart van een cirkel met straal $a$, dus $\tfrac{\pi a^2}{4}$. Met de substitutie: $\displaystyle\int_0^{\pi/2}a^2\cos^2u\,\mathrm{d}u=\tfrac{\pi a^2}{4}$. Dus $A=\tfrac{4b}{a}\cdot\tfrac{\pi a^2}{4}=\pi ab$.

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    De matrix $A = \begin{pmatrix} 3 & 0 \\ 0 & 2 \end{pmatrix}$ beeldt het punt $\begin{pmatrix} x \\ y \end{pmatrix}$ af op $A\begin{pmatrix} x \\ y \end{pmatrix}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarop wordt het punt $(\cos t, \sin t)$ van de eenheidscirkel afgebeeld? Welke kromme vormen de beelden?
      antwoord: |-
        $(3\cos t,2\sin t)$; de ellips $\tfrac{x^2}{9}+\tfrac{y^2}{4}=1$
      uitwerking: |-
        $A\begin{pmatrix}\cos t\\ \sin t\end{pmatrix}=\begin{pmatrix}3\cos t\\ 2\sin t\end{pmatrix}$: de parametervergelijking van een ellips met $a=3$ en $b=2$.
    - opgave: |-
        Een lineaire afbeelding vermenigvuldigt elke oppervlakte met $|\det A|$. Leid daaruit de oppervlakte van de ellips af.
      antwoord: |-
        $6\pi$
      uitwerking: |-
        $\det A=6$ en de eenheidscirkel heeft oppervlakte $\pi$: $6\pi=\pi\cdot3\cdot2$.

- id: h3-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Ruimtemeetkunde
  opgave: |-
    De cilinder $x^2 + y^2 = 4$ wordt gesneden door het vlak $z = y$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de punten van de doorsnede met de grootste en de kleinste hoogte.
      antwoord: |-
        $(0,2,2)$ en $(0,-2,-2)$
      uitwerking: |-
        $z=y$ ligt tussen $-2$ en 2: $(0,2,2)$ en $(0,-2,-2)$.
    - opgave: |-
        De doorsnede is een ellips. Bereken de lengte van de lange en de korte as, en de excentriciteit.
      antwoord: |-
        $4\sqrt2$ en 4; $e=\tfrac{\sqrt2}{2}$
      uitwerking: |-
        De lange as verbindt de punten uit a: $\sqrt{0+16+16}=4\sqrt2$, dus $a=2\sqrt2$. De korte as ligt langs de $x$-as, van $(-2,0,0)$ tot $(2,0,0)$: $b=2$. Dan is $c=\sqrt{8-4}=2$ en $e=\tfrac{2}{2\sqrt2}=\tfrac{\sqrt2}{2}$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Bepaal de toppen en de brandpunten van de ellips $16x^2 + 25y^2 = 400$.
  antwoord: |-
    $(\pm5,0)$, $(0,\pm4)$, $F(\pm3,0)$
  uitwerking: |-
    $\tfrac{x^2}{25}+\tfrac{y^2}{16}=1$: $a=5$, $b=4$, $c=3$.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Geef een vergelijking van de ellips met brandpunten $(0, \pm3)$ en een lange as van 10.
  antwoord: |-
    $\tfrac{x^2}{16}+\tfrac{y^2}{25}=1$
  uitwerking: |-
    $a=5$, $c=3$, $b^2=16$, rechtop.

- id: h3-t3
  soort: test
  niveau: 2
  opgave: |-
    Mars blijft tussen 206,6 en 249,2 miljoen km van de zon. Bereken de excentriciteit van haar baan.
  antwoord: |-
    ongeveer 0,093
  uitwerking: |-
    $a=227{,}9$ en $c=21{,}3$, dus $e=\tfrac{21{,}3}{227{,}9}\approx0{,}093$.

- id: h3-t4
  soort: test
  niveau: 2
  opgave: |-
    Bepaal het middelpunt en de brandpunten van de ellips $x^2 + 9y^2 + 4x - 18y + 4 = 0$.
  antwoord: |-
    $M(-2,1)$, $F(-2\pm2\sqrt2,1)$
  uitwerking: |-
    $(x+2)^2-4+9(y-1)^2-9+4=0$, dus $\tfrac{(x+2)^2}{9}+(y-1)^2=1$: $a=3$, $b=1$, $c=\sqrt8=2\sqrt2$, liggend.

- id: h3-t5
  soort: test
  niveau: 2
  opgave: |-
    Bepaal de raaklijn aan de ellips $\dfrac{x^2}{8} + \dfrac{y^2}{2} = 1$ in het punt $(-2, -1)$.
  antwoord: |-
    $y=-\tfrac12x-2$
  uitwerking: |-
    $\tfrac48+\tfrac12=1$ klopt. $-\tfrac{2x}{8}-\tfrac{y}{2}=1$, dus $y=-\tfrac12x-2$.
