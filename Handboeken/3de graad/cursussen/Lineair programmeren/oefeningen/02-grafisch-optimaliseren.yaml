# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3x + 2y$ in het punt $(2, 1)$
      antwoord: |-
        8
      uitwerking: |-
        $6 + 2 = 8$.
    - opgave: |-
        de rico van $4x + 5y = 20$
      antwoord: |-
        $-\tfrac45$
      uitwerking: |-
        $y = -\tfrac45 x + 4$.
    - opgave: |-
        $\begin{cases} 2x + y = 300 \\ 2x + 3y = 360 \end{cases}$
      antwoord: |-
        $(135, 30)$
      uitwerking: |-
        Aftrekken: $2y = 60$, dus $y = 30$ en $2x = 270$.
    - opgave: |-
        zijn $2x + 3y = 6$ en $4x + 6y = 1$ evenwijdig?
      antwoord: |-
        ja
      uitwerking: |-
        Allebei rico $-\tfrac23$, en ze vallen niet samen.
    - opgave: |-
        het midden van $[PQ]$ met $P(0, 4)$ en $Q(6, 0)$
      antwoord: |-
        $(3, 2)$
      uitwerking: |-
        $\bigl(\tfrac{0 + 6}{2}, \tfrac{4 + 0}{2}\bigr)$.
    - opgave: |-
        de hoekpunten van $x \geqslant 0$, $y \geqslant 0$, $x + y \leqslant 4$
      antwoord: |-
        $(0, 0)$, $(4, 0)$, $(0, 4)$
      uitwerking: |-
        Een driehoek in het eerste kwadrant.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Het gebied $G$ is de vierhoek met hoekpunten $(0, 0)$, $(4, 0)$, $(3, 2)$ en $(0, 2)$. Neem $Z = x + 2y$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $Z$ in de vier hoekpunten en in de punten $(1, 1)$ en $(2, 1)$.
      antwoord: |-
        0, 4, 7, 4; 3 en 4
      uitwerking: |-
        $Z(0, 0) = 0$, $Z(4, 0) = 4$, $Z(3, 2) = 7$, $Z(0, 2) = 4$, $Z(1, 1) = 3$, $Z(2, 1) = 4$.
    - opgave: |-
        Teken alle punten van $G$ met $Z = 2$, en alle punten met $Z = 4$. Wat merk je?
      antwoord: |-
        twee evenwijdige lijnstukken
      uitwerking: |-
        $x + 2y = 2$ en $x + 2y = 4$ zijn evenwijdige rechten met rico $-\tfrac12$. Op de tweede liggen $(4, 0)$, $(2, 1)$ en $(0, 2)$.
    - opgave: |-
        Waar in $G$ is $Z$ het grootst, denk je? Verklaar met je tekening.
      antwoord: |-
        in $(3, 2)$, $Z = 7$
      uitwerking: |-
        Hoe hoger de waarde, hoe verder de rechte naar rechts boven ligt. De laatste rechte die $G$ nog raakt, gaat door het hoekpunt $(3, 2)$.

- id: h2-niveau
  soort: kort
  opgave: |-
    Het gebied is de vierhoek met hoekpunten $(0, 0)$, $(6, 0)$, $(4, 3)$ en $(0, 4)$. Teken niveaulijnen en zoek het maximum.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $Z = x + 3y$
      antwoord: |-
        13 in $(4, 3)$
      uitwerking: |-
        De niveaulijnen hebben rico $-\tfrac13$, en $Z$ stijgt naar $(1, 3)$. Laatste hoekpunt: $(4, 3)$, met $4 + 9 = 13$. Ter controle: $Z(0, 4) = 12$.
        \figuren{\begin{tikzpicture}[scale=.35,font=\tiny]
          \path[gebied] (0,0) -- (6,0) -- (4,3) -- (0,4) -- cycle;
          \rooster{-1}{1}{7}{-1}{1}{5}
          \draw[grens] (0,0) -- (6,0) -- (4,3) -- (0,4) -- cycle;
          \begin{scope}\venster{-1}{7}{-1}{5}\grenslijn[niveau]{1}{3}{6}\grenslijn[niveau,very thick]{1}{3}{13}\end{scope}
          \optimum{4}{3}{}
        \end{tikzpicture}}
    - opgave: |-
        $Z = 3x + y$
      antwoord: |-
        18 in $(6, 0)$
      uitwerking: |-
        Rico $-3$: steile niveaulijnen. $Z$ stijgt naar $(3, 1)$, naar rechts. Laatste hoekpunt: $(6, 0)$, met $Z = 18$. Ter controle: $Z(4, 3) = 15$.

- id: h2-hoekpunt
  soort: kort
  opgave: |-
    Het gebied wordt bepaald door $x \geqslant 0$, $y \geqslant 0$, $x + 2y \leqslant 8$ en $3x + y \leqslant 9$. Bepaal met de hoekpuntmethode:
  lijst: enumerate
  delen:
    - opgave: |-
        het maximum van $Z = 5x + 4y$;
      antwoord: |-
        22 in $(2, 3)$
      uitwerking: |-
        Hoekpunten $(0, 0)$, $(3, 0)$, $(2, 3)$, $(0, 4)$ met $Z = 0$, 15, 22, 16.
    - opgave: |-
        het minimum van $Z = 2x - 3y$.
      antwoord: |-
        $-12$ in $(0, 4)$
      uitwerking: |-
        $Z = 0$, 6, $-5$, $-12$ in dezelfde hoekpunten.

- id: h2-niveaulijn
  soort: kort
  opgave: |-
    Neem het gebied van $x \geqslant 0$, $y \geqslant 0$, $3x + 2y \leqslant 12$, $x - 2y \leqslant 2$ en $-x + 3y \leqslant 6$ (opdracht~\ref{oef:h1-o15}). Zoek met niveaulijnen welk hoekpunt optimaal is, en bereken het optimum.
  lijst: enumerate
  delen:
    - opgave: |-
        het maximum van $Z = x + y$
      antwoord: |-
        $\tfrac{54}{11}$ in $\bigl(\tfrac{24}{11}, \tfrac{30}{11}\bigr)$
      uitwerking: |-
        Niveaulijnen met rico $-1$ naar rechts boven: het laatste hoekpunt is het snijpunt van $3x + 2y = 12$ en $-x + 3y = 6$. Ter controle: $Z\bigl(\tfrac72, \tfrac34\bigr) = \tfrac{17}{4} < \tfrac{54}{11}$.
    - opgave: |-
        het maximum van $Z = x - y$
      antwoord: |-
        $\tfrac{11}{4}$ in $\bigl(\tfrac72, \tfrac34\bigr)$
      uitwerking: |-
        $Z$ stijgt naar $(1, -1)$, naar rechts onder: het laatste hoekpunt is $\bigl(\tfrac72, \tfrac34\bigr)$, met $Z = \tfrac{11}{4}$. Ter controle: $Z(2, 0) = 2$.

- id: h2-model
  soort: kort
  opgave: |-
    Een fietsatelier herstelt stadsfietsen, met 30 euro winst per fiets, en racefietsen, met 50 euro winst. Een stadsfiets vraagt 1 uur werk en 20 euro onderdelen, een racefiets 2 uur werk en 10 euro onderdelen. Per week is er 40 uur werk en 500 euro voor onderdelen. Er komen hoogstens 15 racefietsen per week binnen.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel de doelfunctie en de beperkende voorwaarden op.
      antwoord: |-
        $W = 30x + 50y$; $x + 2y \leqslant 40$, $2x + y \leqslant 50$, $y \leqslant 15$, $x, y \geqslant 0$
      uitwerking: |-
        $x$ stadsfietsen, $y$ racefietsen. Onderdelen: $20x + 10y \leqslant 500$, gedeeld door 10.
    - opgave: |-
        Teken het toegestane gebied en bepaal de hoekpunten.
      antwoord: |-
        $(0, 0)$, $(25, 0)$, $(20, 10)$, $(10, 15)$, $(0, 15)$
      uitwerking: |-
        $x + 2y = 40$ en $2x + y = 50$: $x = 40 - 2y$ geeft $80 - 3y = 50$, dus $(20, 10)$. $y = 15$ in $x + 2y = 40$: $(10, 15)$.
        \figuren{\begin{tikzpicture}[scale=.17,font=\tiny]
          \path[gebied] (0,0) -- (25,0) -- (20,10) -- (10,15) -- (0,15) -- cycle;
          \roosterom{0}{5}{10}{40}{0}{5}{10}{25}
          \begin{scope}\venster{0}{41}{0}{26}\grenslijn{1}{2}{40}\grenslijn{2}{1}{50}\grenslijn{0}{1}{15}\end{scope}
          \optimum{20}{10}{}
        \end{tikzpicture}}
    - opgave: |-
        Hoeveel fietsen van elke soort herstelt het atelier best? Wat is de winst?
      antwoord: |-
        20 stadsfietsen en 10 racefietsen: 1100 euro
      uitwerking: |-
        $W = 0$, 750, 1100, 1050, 750 in de hoekpunten. Werktijd en onderdelen zijn dan volledig gebruikt; er hadden nog 5 racefietsen kunnen binnenkomen.

- id: h2-min
  soort: kort
  opgave: |-
    Een student eet een dag lang brood en kaas. Een portie brood geeft 4 g eiwit, 50 mg calcium en 150 kcal, en kost 0,25 euro. Een portie kaas geeft 8 g eiwit, 300 mg calcium en 100 kcal, en kost 0,60 euro. Hij wil minstens 40 g eiwit, 900 mg calcium en 900 kcal.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel het model op, met $x$ porties brood en $y$ porties kaas.
      antwoord: |-
        $K = 0{,}25x + 0{,}6y$ minimaal; $x + 2y \geqslant 10$, $x + 6y \geqslant 18$, $3x + 2y \geqslant 18$
      uitwerking: |-
        Eiwit $4x + 8y \geqslant 40$, calcium $50x + 300y \geqslant 900$, energie $150x + 100y \geqslant 900$, telkens vereenvoudigd. En $x, y \geqslant 0$.
    - opgave: |-
        Wat is het goedkoopste menu?
      antwoord: |-
        6 porties brood en 2 porties kaas: 2,70 euro
      uitwerking: |-
        Hoekpunten $(0, 9)$, $(4, 3)$, $(6, 2)$ en $(18, 0)$, met kost 5,40, 2,80, 2,70 en 4,50 euro. Het gebied is onbegrensd, maar de kost stijgt weg van de oorsprong.

- id: h2-transport
  soort: kort
  opgave: |-
    Twee fruitkwekers leveren appels aan twee veilingen. Kweker A heeft 50 ton, kweker B 40 ton. Veiling 1 vraagt 30 ton, veiling 2 vraagt 45 ton. Het transport kost per ton 8 euro van A naar 1, 6 euro van A naar 2, 5 euro van B naar 1 en 9 euro van B naar 2. Neem $x$ ton van A naar 1 en $y$ ton van A naar 2.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de kost $K = 3x - 3y + 555$ is, en stel de voorwaarden op.
      antwoord: |-
        $0 \leqslant x \leqslant 30$, $0 \leqslant y \leqslant 45$, $35 \leqslant x + y \leqslant 50$
      uitwerking: |-
        B levert $30 - x$ en $45 - y$ ton. $K = 8x + 6y + 5(30 - x) + 9(45 - y) = 3x - 3y + 555$. Voorraad A: $x + y \leqslant 50$; voorraad B: $75 - x - y \leqslant 40$, dus $x + y \geqslant 35$.
    - opgave: |-
        Plan het goedkoopste transport.
      antwoord: |-
        A: 45 ton naar 2; B: 30 ton naar 1; 420 euro
      uitwerking: |-
        Hoekpunten $(0, 35)$, $(0, 45)$, $(5, 45)$, $(30, 20)$, $(30, 5)$ met $K = 450$, 420, 435, 585, 630. Het minimum ligt in $(0, 45)$.

- id: h2-bijzonder
  soort: kort
  opgave: |-
    Zoek het optimum, als het bestaat.
  lijst: enumerate
  delen:
    - opgave: |-
        Het maximum van $Z = 3x + y$ op het gebied van $x \geqslant 0$, $y \geqslant 0$, $x + 2y \leqslant 8$, $3x + y \leqslant 9$.
      antwoord: |-
        9, op de hele zijde van $(3, 0)$ tot $(2, 3)$
      uitwerking: |-
        $Z = 0$, 9, 9, 4 in $(0, 0)$, $(3, 0)$, $(2, 3)$, $(0, 4)$. Twee naburige hoekpunten zijn optimaal: de zijde op $3x + y = 9$ is een niveaulijn.
    - opgave: |-
        Het maximum van $Z = x + y$ op het gebied van $x \geqslant 0$, $y \geqslant 0$, $x - y \leqslant 2$.
      antwoord: |-
        bestaat niet
      uitwerking: |-
        Het gebied bevat alle punten $(0, n)$, met $Z = n$: zo groot als je wilt.
    - opgave: |-
        Het minimum van $Z = x - y$ op hetzelfde gebied.
      antwoord: |-
        bestaat niet
      uitwerking: |-
        In $(0, n)$ is $Z = -n$: zo klein als je wilt. Het maximum van $x - y$ bestaat wel: 2, op de hele halfrechte $x - y = 2$ vanaf $(2, 0)$.

- id: h2-geheel
  soort: kort
  opgave: |-
    Zoek het maximum van $Z = 5x + 4y$ onder $x, y \geqslant 0$, $2x + 3y \leqslant 12$ en $4x + y \leqslant 10$:
  lijst: enumerate
  delen:
    - opgave: |-
        zonder verdere voorwaarde;
      antwoord: |-
        $\tfrac{101}{5}$ in $\bigl(\tfrac95, \tfrac{14}{5}\bigr)$
      uitwerking: |-
        Hoekpunten $(0, 0)$, $\bigl(\tfrac52, 0\bigr)$, $\bigl(\tfrac95, \tfrac{14}{5}\bigr)$, $(0, 4)$ met $Z = 0$; 12,5; 20,2; 16.
    - opgave: |-
        als $x$ en $y$ gehele getallen moeten zijn.
      antwoord: |-
        18 in $(2, 2)$
      uitwerking: |-
        Afronden geeft $(2, 3)$, maar $4 + 9 = 13 > 12$. Roosterpunten in het gebied rond het optimum: $(2, 2)$ met $Z = 18$, $(1, 3)$ met 17, $(0, 4)$ met 16. De niveaulijn raakt $(2, 2)$ het eerst.

# --- Opdrachten -------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    hoekpuntmethode
  figuur:
    opties: |-
      3.2cm
    code: |-
      \begin{tikzpicture}[scale=.42,font=\tiny]
        \path[gebied] (0,0) -- (5,0) -- (5,2) -- (3,4) -- (0,4) -- cycle;
        \rooster{-1}{1}{6}{-1}{1}{5}
        \draw[grens] (0,0) -- (5,0) -- (5,2) -- (3,4) -- (0,4) -- cycle;
      \end{tikzpicture}
  opgave: |-
    Het gebied in de figuur wordt bepaald door $x \geqslant 0$, $y \geqslant 0$, $x \leqslant 5$, $y \leqslant 4$ en $x + y \leqslant 7$. Bepaal:
  lijst: enumerate
  delen:
    - opgave: |-
        het maximum van $Z = 2x + y$;
      antwoord: |-
        12 in $(5, 2)$
      uitwerking: |-
        In $(0, 0)$, $(5, 0)$, $(5, 2)$, $(3, 4)$, $(0, 4)$: $Z = 0$, 10, 12, 10, 4.
    - opgave: |-
        het maximum van $Z = x + 3y$;
      antwoord: |-
        15 in $(3, 4)$
      uitwerking: |-
        $Z = 0$, 5, 11, 15, 12.
    - opgave: |-
        het minimum van $Z = x - 2y$.
      antwoord: |-
        $-8$ in $(0, 4)$
      uitwerking: |-
        $Z = 0$, 5, 1, $-5$, $-8$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    optimaal hoekpunt aflezen
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.45,font=\tiny]
        \path[gebied] (1,0) -- (6,0) -- (7,3) -- (4,6) -- (0,4) -- cycle;
        \rooster{-1}{1}{7}{-1}{1}{6}
        \draw[grens] (1,0) -- (6,0) -- (7,3) -- (4,6) -- (0,4) -- cycle;
        \hoekpunt[below]{1}{0}{$A$}\hoekpunt[below]{6}{0}{$B$}\hoekpunt[right]{7}{3}{$C$}
        \hoekpunt[above]{4}{6}{$D$}\hoekpunt[left]{0}{4}{$E$}
      \end{tikzpicture}
  opgave: |-
    In welk hoekpunt van het gebied is $Z$ maximaal? Lees de coördinaten af in de figuur.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $Z = x$
      antwoord: |-
        $C$
      uitwerking: |-
        $C(7, 3)$ ligt het meest naar rechts.
    - opgave: |-
        $Z = y$
      antwoord: |-
        $D$
      uitwerking: |-
        $D(4, 6)$ ligt het hoogst.
    - opgave: |-
        $Z = x + y$
      antwoord: |-
        $C$ en $D$, en de zijde ertussen
      uitwerking: |-
        $Z(C) = Z(D) = 10$: de zijde $[CD]$ ligt op de niveaulijn $x + y = 10$.
    - opgave: |-
        $Z = y - x$
      antwoord: |-
        $E$
      uitwerking: |-
        $Z(E) = 4$, $Z(D) = 2$, de rest is kleiner.

- id: h2-o3
  soort: opdracht
  prent:
    naam: bakker
  niveau: 1
  thema: |-
    vraagstuk in vijf stappen, winst
  opgave: |-
    Een bakker maakt broden, met 2 euro winst per stuk, en taarten, met 6 euro winst. Een brood vraagt 6 minuten werk en 400 g bloem, een taart 24 minuten werk en 200 g bloem. Per dag is er 8 uur werk en 25 kg bloem, en hij verkoopt hoogstens 12 taarten.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel de doelfunctie en de beperkende voorwaarden op.
      antwoord: |-
        $W = 2x + 6y$; $x + 4y \leqslant 80$, $2x + y \leqslant 125$, $y \leqslant 12$, $x, y \geqslant 0$
      uitwerking: |-
        Werk: $6x + 24y \leqslant 480$, gedeeld door 6. Bloem in g: $400x + 200y \leqslant 25\,000$, gedeeld door 200.
    - opgave: |-
        Teken het toegestane gebied en bepaal de hoekpunten.
      antwoord: |-
        $(0, 0)$, $(62{,}5;\ 0)$, $(60, 5)$, $(32, 12)$, $(0, 12)$
      uitwerking: |-
        $x = 80 - 4y$ in $2x + y = 125$: $160 - 7y = 125$, dus $y = 5$ en $x = 60$. $y = 12$ in $x + 4y = 80$: $x = 32$.
        \figuren{\begin{tikzpicture}[x=.07cm,y=.2cm,font=\tiny]
          \path[gebied] (0,0) -- (62.5,0) -- (60,5) -- (32,12) -- (0,12) -- cycle;
          \roosterom{0}{10}{20}{80}{0}{2}{4}{20}
          \begin{scope}\venster{0}{82}{0}{21}\grenslijn{1}{4}{80}\grenslijn{2}{1}{125}\grenslijn{0}{1}{12}\end{scope}
          \optimum{60}{5}{}
        \end{tikzpicture}}
    - opgave: |-
        Hoeveel broden en taarten bakt hij best? Wat is de winst?
      antwoord: |-
        60 broden en 5 taarten: 150 euro
      uitwerking: |-
        $W = 0$; 125; 150; 136; 72. Hij verkoopt dan minder taarten dan er gevraagd worden, al brengt een taart meer op: een taart kost veel werktijd.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    doelfunctie opstellen
  opgave: |-
    Een atelier maakt $x$ tafels en $y$ stoelen. Schrijf de doelfunctie op, en zeg of ze maximaal of minimaal moet zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        Een tafel brengt 45 euro winst op, een stoel 12 euro. Het atelier wil zoveel mogelijk winst.
      antwoord: |-
        $W = 45x + 12y$, maximaal
      uitwerking: |-
        De winst per stuk maal het aantal.
    - opgave: |-
        Het atelier wil zoveel mogelijk meubels maken.
      antwoord: |-
        $Z = x + y$, maximaal
      uitwerking: |-
        Elk meubel telt even zwaar.
    - opgave: |-
        Een tafel geeft 2,5 kg houtafval, een stoel 0,8 kg. Het atelier wil zo weinig mogelijk afval.
      antwoord: |-
        $A = 2{,}5x + 0{,}8y$, minimaal
      uitwerking: |-
        Het afval in kg.
    - opgave: |-
        Een tafel kost 60 euro aan hout en wordt verkocht voor 150 euro; een stoel kost 15 euro en wordt verkocht voor 40 euro. Het atelier wil de grootste winst.
      antwoord: |-
        $W = 90x + 25y$, maximaal
      uitwerking: |-
        Winst per stuk is verkoopprijs min kost: $150 - 60 = 90$ en $40 - 15 = 25$.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    niveaulijnen en richting
  opgave: |-
    Neem $Z = 2x - 3y$.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de niveaulijnen bij $Z = -6$, $Z = 0$ en $Z = 6$.
      antwoord: |-
        evenwijdige rechten met rico $\tfrac23$
      uitwerking: |-
        $Z = 0$ gaat door $(0, 0)$ en $(3, 2)$; $Z = 6$ door $(3, 0)$ en $(0, -2)$; $Z = -6$ door $(-3, 0)$ en $(0, 2)$.
        \figuren{\begin{tikzpicture}[scale=.3,font=\tiny]
          \rooster{-4}{1}{4}{-3}{1}{3}
          \begin{scope}\venster{-4}{4}{-3}{3}\grenslijn[niveau]{2}{-3}{-6}\grenslijn[niveau]{2}{-3}{0}\grenslijn[niveau]{2}{-3}{6}\end{scope}
          \draw[->,accent,thick] (0,0) -- (2,-3);
        \end{tikzpicture}}
    - opgave: |-
        In welke richting moet je schuiven om $Z$ groter te maken?
      antwoord: |-
        in de richting van $(2, -3)$: naar rechts onder
      uitwerking: |-
        Volgens de stelling over niveaulijnen stijgt $Z$ in de richting van $(2, -3)$.
    - opgave: |-
        Hoeveel stijgt $Z$ als je van $(1, 1)$ naar $(3, -2)$ gaat?
      antwoord: |-
        met 13
      uitwerking: |-
        $(3, -2) = (1, 1) + (2, -3)$: $Z$ stijgt met $2^2 + 3^2 = 13$. Controle: $Z(1, 1) = -1$ en $Z(3, -2) = 12$.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    kost minimaliseren, onbegrensd gebied
  opgave: |-
    Een smoothiebar koopt per dag $x$ kg aardbeien aan 6 euro per kg en $y$ kg bananen aan 2 euro per kg. Ze heeft minstens 30 kg fruit nodig, minstens een derde van het fruit (in gewicht) moeten aardbeien zijn, en meer dan 25 kg bananen raakt niet op.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel het model op.
      antwoord: |-
        $K = 6x + 2y$ minimaal; $x + y \geqslant 30$, $y \leqslant 2x$, $y \leqslant 25$, $x, y \geqslant 0$
      uitwerking: |-
        $x \geqslant \tfrac13(x + y) \iff 2x \geqslant y$.
    - opgave: |-
        Teken het toegestane gebied en bepaal de hoekpunten.
      antwoord: |-
        $(10, 20)$, $(12{,}5;\ 25)$, $(30, 0)$; onbegrensd naar rechts
      uitwerking: |-
        $x + y = 30$ en $y = 2x$: $(10, 20)$. $y = 2x$ en $y = 25$: $(12{,}5;\ 25)$. $x + y = 30$ en $y = 0$: $(30, 0)$.
    - opgave: |-
        Wat is de goedkoopste aankoop?
      antwoord: |-
        10 kg aardbeien en 20 kg bananen: 100 euro
      uitwerking: |-
        $K = 100$, 125 en 180 in de hoekpunten. Een minimum bestaat, want beide prijzen zijn positief.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    eigenschappen, redeneren
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Het optimale punt van een begrensd gebied is altijd een hoekpunt.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: er is altijd een optimaal hoekpunt, maar als een zijde op een niveaulijn ligt, zijn ook de punten van die zijde optimaal.
    - opgave: |-
        Is $Z$ maximaal in $A$, dan is $-Z$ minimaal in $A$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $Z(P) \leqslant Z(A) \iff -Z(P) \geqslant -Z(A)$.
    - opgave: |-
        Op een onbegrensd gebied bestaat nooit een maximum.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $Z = -x - y$ op het eerste kwadrant is maximaal, 0, in de oorsprong.
    - opgave: |-
        Vermenigvuldig je alle coëfficiënten van $Z$ met 3, dan verandert het optimale punt niet.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: de niveaulijnen blijven dezelfde rechten, met dezelfde richting waarin $Z$ stijgt. Alleen de optimale waarde wordt drie keer zo groot.
    - opgave: |-
        Tel je bij $Z$ een constante op, dan verandert het optimale punt niet.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $Z + c$ is overal $c$ groter. Zo is de kost $5x - 15y + 3800$ uit het transportvoorbeeld minimaal waar $5x - 15y$ minimaal is.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    gehele oplossingen, kost minimaliseren
  opgave: |-
    De school uit opdracht~\ref{oef:h1-o17} betaalt 400 euro voor een bus en 150 euro voor een minibusje.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek de goedkoopste combinatie zonder de voorwaarde \textit{geheel}.
      antwoord: |-
        $(3, 4)$: 1800 euro
      uitwerking: |-
        Hoekpunten $\bigl(\tfrac{23}{5}, 0\bigr)$, $(7, 0)$, $(3, 4)$ met $K = 1840$, 2800, 1800.
    - opgave: |-
        Is die oplossing ook geheel? Hoeveel kost het met alleen grote bussen?
      antwoord: |-
        ja; 5 bussen kosten 2000 euro
      uitwerking: |-
        $(3, 4)$ is een roosterpunt, dus het is ook het gehele optimum. Met 5 bussen (het kleinste aantal voertuigen) betaal je 200 euro meer.
    - opgave: |-
        Hoeveel plaatsen blijven leeg bij de goedkoopste combinatie?
      antwoord: |-
        geen
      uitwerking: |-
        $3 \cdot 50 + 4 \cdot 20 = 230$: de voorwaarde op de plaatsen is bindend.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    gevoeligheid voor een prijs (voorsmaak)
  opgave: |-
    De konijnenbrokken uit opdracht~\ref{oef:h1-o16} kosten per kg: soort A 3 euro, soort B 4 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de goedkoopste combinatie?
      antwoord: |-
        3 kg A en 4 kg B: 25 euro
      uitwerking: |-
        $K = 3x + 4y$ in $(0, 10)$, $(3, 4)$, $(15, 0)$: 40, 25, 45.
    - opgave: |-
        Soort A wordt 6 euro per kg. Verandert de beste keuze?
      antwoord: |-
        nee, 34 euro
      uitwerking: |-
        $K = 6x + 4y$: 40, 34, 90. Nog altijd $(3, 4)$.
    - opgave: |-
        En als soort A 9 euro per kg kost?
      antwoord: |-
        ja: 10 kg B, 40 euro
      uitwerking: |-
        $K = 9x + 4y$: 40, 43, 135. Nu is $(0, 10)$ het goedkoopst. Ergens tussen 6 en 9 euro kantelt het optimum. In hoofdstuk 3 leer je precies waar: bij 8 euro.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    transportprobleem
  opgave: |-
    Een bouwbedrijf heeft zand in twee depots: 60 ton in A en 50 ton in B. Werf 1 vraagt 40 ton, werf 2 vraagt 50 ton. Het transport kost per ton 12 euro van A naar 1, 8 euro van A naar 2, 10 euro van B naar 1 en 14 euro van B naar 2.
  lijst: enumerate
  delen:
    - opgave: |-
        Neem $x$ ton van A naar 1 en $y$ ton van A naar 2. Schrijf de kost en de voorwaarden op.
      antwoord: |-
        $K = 2x - 6y + 1100$; $0 \leqslant x \leqslant 40$, $0 \leqslant y \leqslant 50$, $40 \leqslant x + y \leqslant 60$
      uitwerking: |-
        $K = 12x + 8y + 10(40 - x) + 14(50 - y) = 2x - 6y + 1100$. Voorraad A: $x + y \leqslant 60$. Voorraad B: $90 - x - y \leqslant 50$.
    - opgave: |-
        Plan het goedkoopste transport.
      antwoord: |-
        A: 50 ton naar 2; B: 40 ton naar 1; 800 euro
      uitwerking: |-
        Hoekpunten $(0, 40)$, $(0, 50)$, $(10, 50)$, $(40, 20)$, $(40, 0)$ met $K = 860$, 800, 820, 1060, 1180.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    meer dan één optimum in een context
  opgave: |-
    In het probleem van de mini-onderneming stijgt de winst op een doos zeep van 5 naar 6 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is nu de grootste winst?
      antwoord: |-
        720 euro
      uitwerking: |-
        $W = 4x + 6y$ in $(150, 0)$, $(135, 30)$, $(30, 100)$, $(0, 100)$: 600, 720, 720, 600.
    - opgave: |-
        Welke combinaties geven die winst? Hoeveel met gehele aantallen?
      antwoord: |-
        de zijde van $(135, 30)$ tot $(30, 100)$; 36 combinaties
      uitwerking: |-
        $4x + 6y = 2(2x + 3y)$: de niveaulijn valt samen met de grens van de werktijd. De gehele punten op $2x + 3y = 360$ zijn $(30 + 3k,\ 100 - 2k)$ met $k = 0, 1, \ldots, 35$.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    geen optimum, fout in een model
  opgave: |-
    Iemand stelt voor een bedrijf dit model op: maximaliseer $W = 3x + 2y$ onder $x - y \leqslant 10$, $x \geqslant 0$ en $y \geqslant 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat er geen maximum is.
      antwoord: |-
        $(0, n)$ ligt in het gebied, $W = 2n$
      uitwerking: |-
        Voor elke $n \geqslant 0$ voldoet $(0, n)$, met $W = 2n$: zo groot als je wilt.
    - opgave: |-
        Wat is er waarschijnlijk vergeten in het model?
      antwoord: |-
        een bovengrens, zoals werktijd of grondstof
      uitwerking: |-
        In werkelijkheid kan een bedrijf niet onbeperkt produceren: een voorwaarde op werktijd, grondstoffen of verkoop ontbreekt.

- id: h2-o13
  soort: opdracht
  prent:
    naam: koffie
  niveau: 2
  thema: |-
    mengprobleem met een percentage
  opgave: |-
    Een koffiebranderij maakt een melange van $x$ kg arabica, met 5 euro winst per kg, en $y$ kg robusta, met 3 euro winst per kg. Er is 360 kg arabica voorradig, de branderij kan per week 500 kg branden, en de melange moet minstens 60\,\% arabica bevatten.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel het model op.
      antwoord: |-
        $W = 5x + 3y$; $x \leqslant 360$, $x + y \leqslant 500$, $2x \geqslant 3y$, $x, y \geqslant 0$
      uitwerking: |-
        $x \geqslant 0{,}6(x + y) \iff 0{,}4x \geqslant 0{,}6y \iff 2x \geqslant 3y$.
    - opgave: |-
        Zoek de grootste winst.
      antwoord: |-
        360 kg arabica en 140 kg robusta: 2220 euro
      uitwerking: |-
        Hoekpunten $(0, 0)$, $(360, 0)$, $(360, 140)$, $(300, 200)$ met $W = 0$, 1800, 2220, 2100.
    - opgave: |-
        Hoeveel procent arabica zit er dan in de melange?
      antwoord: |-
        72\,\%
      uitwerking: |-
        $\tfrac{360}{500} = 0{,}72$: meer dan de vereiste 60\,\%.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    personeelsplanning, kost minimaliseren
  opgave: |-
    Een pretpark zet op een drukke dag $x$ jobstudenten in, aan 90 euro per dag, en $y$ vaste krachten, aan 150 euro per dag. Er zijn minstens 30 mensen nodig, minstens 8 vaste krachten met een EHBO-diploma, en per vier jobstudenten minstens één vaste kracht.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel het model op en teken het toegestane gebied.
      antwoord: |-
        $K = 90x + 150y$ minimaal; $x + y \geqslant 30$, $y \geqslant 8$, $x \leqslant 4y$, $x \geqslant 0$
      uitwerking: |-
        Hoekpunten $(0, 30)$, $(22, 8)$ en $(32, 8)$; het gebied is onbegrensd naar boven.
        \figuren{\begin{tikzpicture}[scale=.1,font=\tiny]
          \path[gebied] (0,40) -- (0,30) -- (22,8) -- (32,8) -- (40,10) -- (40,40) -- cycle;
          \roosterom{0}{5}{10}{40}{0}{5}{10}{40}
          \begin{scope}\venster{0}{41}{0}{41}\grenslijn{1}{1}{30}\grenslijn{0}{1}{8}\grenslijn{1}{-4}{0}\end{scope}
          \optimum{22}{8}{}
        \end{tikzpicture}}
    - opgave: |-
        Wat is de goedkoopste ploeg?
      antwoord: |-
        22 jobstudenten en 8 vaste krachten: 3180 euro
      uitwerking: |-
        $K = 4500$, 3180, 4080 in de hoekpunten.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    optimum in het gebied van hoofdstuk 1
  opgave: |-
    Neem het gebied van Lotte uit het probleem van hoofdstuk 1, met hoekpunten $(5;\ 5{,}5)$, $(5, 6)$, $(9, 6)$ en $(14, 1)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lotte wil zo weinig mogelijk uren werken. Welke combinatie kiest ze?
      antwoord: |-
        5 uur ijssalon en 5,5 uur bijles
      uitwerking: |-
        $x + y = 10{,}5$, 11, 15 en 15 in de hoekpunten.
    - opgave: |-
        Ze wil zoveel mogelijk verdienen. Wat is haar grootste weekloon?
      antwoord: |-
        210 euro, met 9 uur ijssalon en 6 uur bijles
      uitwerking: |-
        $10x + 20y = 160$, 170, 210 en 160 in de hoekpunten.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    reclamebudget verdelen
  opgave: |-
    Een festival koopt $x$ radiospots aan 200 euro en $y$ online campagnes aan 100 euro. Een radiospot bereikt 5000 mensen, een online campagne 3000. Het budget is 2000 euro, er moeten minstens 3 radiospots komen, en er zijn hoogstens 12 online campagnes te koop. We tellen wie twee keer bereikt wordt, twee keer.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel het model op.
      antwoord: |-
        $B = 5000x + 3000y$ maximaal; $2x + y \leqslant 20$, $x \geqslant 3$, $0 \leqslant y \leqslant 12$
      uitwerking: |-
        Budget: $200x + 100y \leqslant 2000$, gedeeld door 100.
    - opgave: |-
        Hoe bereikt het festival zoveel mogelijk mensen?
      antwoord: |-
        4 radiospots en 12 campagnes: 56\,000 mensen
      uitwerking: |-
        Hoekpunten $(3, 0)$, $(10, 0)$, $(4, 12)$, $(3, 12)$ met $B = 15\,000$, 50\,000, 56\,000, 51\,000.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    geheel optimum, kale opgave
  opgave: |-
    Zoek het maximum van $Z = 2x + 3y$ onder $x, y \geqslant 0$, $x + y \leqslant 7$ en $4x + 9y \leqslant 36$:
  lijst: enumerate
  delen:
    - opgave: |-
        zonder verdere voorwaarde;
      antwoord: |-
        $\tfrac{78}{5}$ in $\bigl(\tfrac{27}{5}, \tfrac85\bigr)$
      uitwerking: |-
        Hoekpunten $(0, 0)$, $(7, 0)$, $\bigl(\tfrac{27}{5}, \tfrac85\bigr)$, $(0, 4)$ met $Z = 0$, 14, 15,6 en 12.
    - opgave: |-
        met gehele $x$ en $y$.
      antwoord: |-
        15 in $(6, 1)$
      uitwerking: |-
        $(5, 2)$ voldoet niet: $20 + 18 = 38 > 36$. $(6, 1)$ voldoet en geeft 15; $(5, 1)$ en $(7, 0)$ geven 13 en 14.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    drie producten herleiden tot twee onbekenden
  opgave: |-
    Een sapbar mengt 100 liter uit appelsap ($x$ liter), sinaasappelsap ($y$ liter) en wortelsap (de rest). Een liter kost 1, 2 en 1,50 euro. Een liter bevat 0, 500 en 100 mg vitamine C, en 100, 80 en 40 g suiker. Het mengsel moet minstens 18\,000 mg vitamine C en hoogstens 7600 g suiker bevatten.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de kost $150 - 0{,}5x + 0{,}5y$ euro is, en stel de voorwaarden op.
      antwoord: |-
        $x + y \leqslant 100$, $4y - x \geqslant 80$, $3x + 2y \leqslant 180$, $x, y \geqslant 0$
      uitwerking: |-
        Wortelsap: $100 - x - y \geqslant 0$. Kost: $x + 2y + 1{,}5(100 - x - y)$. Vitamine C: $500y + 100(100 - x - y) \geqslant 18\,000$, of $4y - x \geqslant 80$. Suiker: $100x + 80y + 40(100 - x - y) \leqslant 7600$, of $3x + 2y \leqslant 180$.
    - opgave: |-
        Wat is het goedkoopste mengsel?
      antwoord: |-
        40 l appel, 30 l sinaasappel, 30 l wortel: 145 euro
      uitwerking: |-
        Hoekpunten $(0, 20)$, $(40, 30)$ en $(0, 90)$, met kost 160, 145 en 195 euro. De voorwaarde $x + y \leqslant 100$ is hier nergens bindend.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    de optimale punten vormen een convexe verzameling
  opgave: |-
    Het maximum van $Z$ op een gebied $G$ is $M$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: liggen $P$ en $Q$ in $G$ met $Z(P) = Z(Q) = M$, dan is $Z = M$ op heel $[PQ]$.
      antwoord: |-
        stelling op een lijnstuk
      uitwerking: |-
        Het lijnstuk ligt in $G$ (convex), en $Z(R) = (1 - t)M + tM = M$.
    - opgave: |-
        Leid af: de optimale punten vormen één punt, een lijnstuk of een halfrechte (of nog meer). Kunnen er precies twee optimale punten zijn?
      antwoord: |-
        nee
      uitwerking: |-
        De optimale punten vormen een convexe verzameling: met twee punten zit ook het hele lijnstuk ertussen erin. Precies twee kan dus niet: het zijn er één of oneindig veel.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    geheel optimum ver van het optimum
  opgave: |-
    Maximaliseer $Z = 10x + 11y$ onder $x, y \geqslant 0$, $x \leqslant 4$ en $10x + 12y \leqslant 59$.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek het optimum zonder de voorwaarde \textit{geheel}.
      antwoord: |-
        $\tfrac{689}{12} \approx 57{,}4$ in $\bigl(4, \tfrac{19}{12}\bigr)$
      uitwerking: |-
        Hoekpunten $(0, 0)$, $(4, 0)$, $\bigl(4, \tfrac{19}{12}\bigr)$, $\bigl(0, \tfrac{59}{12}\bigr)$ met $Z = 0$; 40; 57,4; 54,1.
    - opgave: |-
        Zoek het gehele optimum. Ligt het dicht bij het vorige?
      antwoord: |-
        54 in $(1, 4)$: ver weg
      uitwerking: |-
        Rond $\bigl(4, \tfrac{19}{12}\bigr)$: $(4, 1)$ geeft 51, en $(4, 2)$ voldoet niet. Langs de schuine grens: $(3, 2)$ geeft 52, $(2, 3)$ 53, $(1, 4)$ 54 (met $10 + 48 = 58 \leqslant 59$), $(0, 4)$ 44. Het gehele optimum ligt aan de andere kant van het gebied.
    - opgave: |-
        Waarom liggen de roosterpunten op of vlak onder de schuine grens bijna even goed?
      antwoord: |-
        de niveaulijnen zijn bijna evenwijdig met die grens
      uitwerking: |-
        De niveaulijnen hebben rico $-\tfrac{10}{11} \approx -0{,}91$, de grens $-\tfrac{10}{12} \approx -0{,}83$. Een kleine verschuiving langs de grens verandert $Z$ weinig, en welk roosterpunt het dichtst bij de grens ligt, beslist.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    doelfunctie met een parameter
  opgave: |-
    Neem de vierhoek met hoekpunten $(0, 0)$, $(5, 0)$, $(3, 2)$ en $(0, 3)$, en $Z = x + ky$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $k$ is $(3, 2)$ een optimaal hoekpunt (maximum)?
      antwoord: |-
        $1 \leqslant k \leqslant 3$
      uitwerking: |-
        $Z(3, 2) = 3 + 2k$ moet minstens $Z(5, 0) = 5$, $Z(0, 3) = 3k$ en $Z(0, 0) = 0$ zijn: $k \geqslant 1$, $k \leqslant 3$ en $k \geqslant -\tfrac32$.
    - opgave: |-
        Welk hoekpunt is optimaal voor $k > 3$? En voor $k < 1$?
      antwoord: |-
        $(0, 3)$; $(5, 0)$
      uitwerking: |-
        Voor $k > 3$ is $3k > 3 + 2k$ en $3k > 5$. Voor $k < 1$ is $5 > 3 + 2k$, en $5 > 3k$.
    - opgave: |-
        Verklaar het resultaat met de richting van de niveaulijnen.
      antwoord: |-
        rico $-\tfrac1k$ tussen die van de twee zijden door $(3, 2)$
      uitwerking: |-
        De zijden door $(3, 2)$ hebben rico $-1$ en $-\tfrac13$. Het hoekpunt blijft optimaal zolang de rico $-\tfrac1k$ van de niveaulijnen ertussen ligt: $-1 \leqslant -\tfrac1k \leqslant -\tfrac13$, wat voor $k > 0$ hetzelfde is als $1 \leqslant k \leqslant 3$.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    hoekpuntstelling zonder convexiteit
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=.45,font=\tiny]
        \path[gebied] (0,0) -- (4,0) -- (4,1) -- (1,1) -- (1,4) -- (0,4) -- cycle;
        \rooster{-1}{1}{5}{-1}{1}{5}
        \draw[grens] (0,0) -- (4,0) -- (4,1) -- (1,1) -- (1,4) -- (0,4) -- cycle;
      \end{tikzpicture}
  opgave: |-
    Het L-vormige gebied in de figuur is geen oplossingsgebied van een stelsel, maar je kunt er toch een maximum op zoeken.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek het maximum van $Z = x + y$ op dit gebied. Waar wordt het bereikt?
      antwoord: |-
        5, in $(4, 1)$ en in $(1, 4)$
      uitwerking: |-
        In de zes hoekpunten: $Z = 0$, 4, 5, 2, 5, 4. Het maximum 5 ligt in $(4, 1)$ en $(1, 4)$.
    - opgave: |-
        Toon aan dat het lijnstuk tussen die twee optimale punten niet in het gebied ligt. Welke stap van het bewijs van de hoekpuntstelling gaat hier mis?
      antwoord: |-
        het midden $(2{,}5;\ 2{,}5)$ ligt erbuiten; het gebied is niet convex
      uitwerking: |-
        Het gebied is niet convex. In het bewijs lag $R$ op $[AS]$ omdat het gebied convex is. Hier geldt de stelling toevallig nog, maar de twee optimale punten zijn niet meer verbonden door een lijnstuk vol optimale punten, wat in een convex gebied wel zo is.

# --- Koppel -----------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Afgeleiden
  opgave: |-
    Neem het gebied $x \geqslant 0$, $y \geqslant 0$, $x + 2y \leqslant 8$, en de doelfunctie $Z = xy$. Die is niet van de eerste graad.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $Z$ in de hoekpunten.
      antwoord: |-
        overal 0
      uitwerking: |-
        In $(0, 0)$, $(8, 0)$ en $(0, 4)$ is $xy = 0$.
    - opgave: |-
        Op de schuine zijde is $y = 4 - \tfrac x2$. Zoek met de afgeleide het maximum van $Z$ op die zijde.
      antwoord: |-
        8, in $(4, 2)$
      uitwerking: |-
        $f(x) = x\bigl(4 - \tfrac x2\bigr) = 4x - \tfrac{x^2}{2}$, $f'(x) = 4 - x = 0$ voor $x = 4$: $f(4) = 8$.
    - opgave: |-
        Waarom geldt de hoekpuntstelling hier niet?
      antwoord: |-
        $Z$ is niet van de eerste graad
      uitwerking: |-
        Het bewijs gebruikt dat $Z$ op een lijnstuk tussen de waarden in de eindpunten ligt. Voor $xy$ is dat niet zo: op de schuine zijde is $Z$ een tweedegraadsfunctie met een top in het midden.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Het optimale hoekpunt van het probleem van de mini-onderneming is de oplossing van $\begin{pmatrix} 20 & 30 \\ 10 & 5 \end{pmatrix} \begin{pmatrix} x \\ y \end{pmatrix} = \begin{pmatrix} 3600 \\ 1500 \end{pmatrix}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de inverse van de matrix, en daarmee het hoekpunt.
      antwoord: |-
        $\tfrac{1}{-200}\begin{pmatrix} 5 & -30 \\ -10 & 20 \end{pmatrix}$; $(135, 30)$
      uitwerking: |-
        De determinant is $100 - 300 = -200$. Dan $x = \tfrac{5 \cdot 3600 - 30 \cdot 1500}{-200} = 135$ en $y = \tfrac{-10 \cdot 3600 + 20 \cdot 1500}{-200} = 30$.
    - opgave: |-
        Er komt $b$ ml olie in plaats van 1500 ml. Druk het hoekpunt uit in $b$.
      antwoord: |-
        $x = \tfrac{3b - 1800}{20}$, $y = \tfrac{3600 - 2b}{20}$
      uitwerking: |-
        $x = \tfrac{18\,000 - 30b}{-200} = \tfrac{3b - 1800}{20}$ en $y = \tfrac{-36\,000 + 20b}{-200} = \tfrac{3600 - 2b}{20}$. Controle met $b = 1500$: $(135, 30)$.
    - opgave: |-
        Hoeveel stijgt de winst $4x + 5y$ per extra ml olie, zolang dit hoekpunt optimaal blijft?
      antwoord: |-
        0,10 euro
      uitwerking: |-
        $4x + 5y = \tfrac{12b - 7200 + 18\,000 - 10b}{20} = \tfrac{2b + 10\,800}{20} = 0{,}1b + 540$. Elke ml olie levert 0,10 euro op. Dat getal heet in hoofdstuk 3 de schaduwprijs.

- id: h2-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Ruimtemeetkunde
  opgave: |-
    Teken boven elk punt $(x, y)$ van de vierhoek met hoekpunten $(0, 0)$, $(5, 0)$, $(3, 2)$ en $(0, 3)$ het punt $(x, y, z)$ met $z = 2x + y$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke figuur vormen die punten?
      antwoord: |-
        een vierhoek in het vlak $z = 2x + y$
      uitwerking: |-
        $2x + y - z = 0$ is de vergelijking van een vlak door de oorsprong: een schuin dak boven de vierhoek.
    - opgave: |-
        Geef de vier hoekpunten van dat dak. Welk is het hoogst?
      antwoord: |-
        $(0, 0, 0)$, $(5, 0, 10)$, $(3, 2, 8)$, $(0, 3, 3)$; $(5, 0, 10)$
      uitwerking: |-
        De hoogte boven $(x, y)$ is $2x + y$.
    - opgave: |-
        Verklaar met het dak waarom het maximum van $Z$ in een hoekpunt ligt.
      antwoord: |-
        het hoogste punt van een plat dak ligt op de rand, in een hoek
      uitwerking: |-
        Een vlak heeft geen top: het hoogste punt van een plat stuk vlak boven een veelhoek ligt op de rand, en langs elke zijde loopt de rand van het dak recht, dus het hoogste punt ligt in een hoek. Dat is de hoekpuntstelling in de ruimte gezien.

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Het gebied wordt bepaald door $x \geqslant 0$, $y \geqslant 0$, $x + y \leqslant 6$ en $x + 3y \leqslant 12$. Zoek met niveaulijnen het maximum van $Z = 2x + 3y$ en het minimum van $Z = x - y$.
  antwoord: |-
    15 in $(3, 3)$; $-4$ in $(0, 4)$
  uitwerking: |-
    Hoekpunten $(0, 0)$, $(6, 0)$, $(3, 3)$, $(0, 4)$. $2x + 3y$: 0, 12, 15, 12. $x - y$: 0, 6, 0, $-4$.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Bepaal met de hoekpuntmethode het maximum van $Z = 4x + y$ op het gebied van $y \geqslant 1$, $x \leqslant 5$, $y \leqslant 2x$ en $x + y \leqslant 8$.
  antwoord: |-
    23 in $(5, 3)$
  uitwerking: |-
    Hoekpunten $\bigl(\tfrac12, 1\bigr)$, $(5, 1)$, $(5, 3)$, $\bigl(\tfrac83, \tfrac{16}{3}\bigr)$ met $Z = 3$, 21, 23, 16.

- id: h2-t3
  soort: test
  niveau: 2
  opgave: |-
    Een imker verkoopt potten honing met 3 euro winst en kaarsen van bijenwas met 2 euro winst. Een pot vraagt 5 minuten werk, een kaars 10 minuten, en hij heeft 10 uur. Er zijn 70 potten, en op de markt verkoopt hij hoogstens 100 stuks. Hoeveel van elk verkoopt hij best?
  antwoord: |-
    70 potten en 25 kaarsen: 260 euro
  uitwerking: |-
    $W = 3x + 2y$ onder $x + 2y \leqslant 120$, $x \leqslant 70$, $x + y \leqslant 100$, $x, y \geqslant 0$. Hoekpunten $(0, 0)$, $(70, 0)$, $(70, 25)$, $(0, 60)$ met $W = 0$, 210, 260, 120. De markt is geen grens: $70 + 25 = 95$.

- id: h2-t4
  soort: test
  niveau: 2
  opgave: |-
    Minimaliseer $K = 2x + 3y$ onder $x, y \geqslant 0$, $x + 2y \geqslant 8$ en $3x + y \geqslant 9$.
  antwoord: |-
    13 in $(2, 3)$
  uitwerking: |-
    Hoekpunten $(0, 9)$, $(2, 3)$, $(8, 0)$ met $K = 27$, 13, 16. Het gebied is onbegrensd, maar $K$ stijgt weg van de oorsprong.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Maximaliseer $Z = x + 2y$ onder $x, y \geqslant 0$, $x + 2y \leqslant 8$ en $x \leqslant 4$. Geef alle optimale punten.
  antwoord: |-
    8, op de zijde van $(0, 4)$ tot $(4, 2)$
  uitwerking: |-
    $Z = 0$, 4, 8, 8 in $(0, 0)$, $(4, 0)$, $(4, 2)$, $(0, 4)$. De zijde ligt op de niveaulijn $x + 2y = 8$: de punten $(4t,\ 4 - 2t)$ met $0 \leqslant t \leqslant 1$.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Heeft $Z = x + 2y$ een maximum of een minimum op het gebied $x \geqslant 0$, $y \geqslant 0$, $x + y \geqslant 3$?
  antwoord: |-
    minimum 3 in $(3, 0)$; geen maximum
  uitwerking: |-
    Hoekpunten $(3, 0)$ en $(0, 3)$ met $Z = 3$ en 6. Het gebied loopt naar rechts boven verder, waar $Z$ onbeperkt stijgt.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Maximaliseer $Z = 3x + 2y$ onder $x, y \geqslant 0$, $2x + y \leqslant 9$ en $x + 3y \leqslant 11$: eerst zonder meer, daarna met gehele $x$ en $y$.
  antwoord: |-
    $\tfrac{74}{5}$ in $\bigl(\tfrac{16}{5}, \tfrac{13}{5}\bigr)$; geheel: 14 in $(4, 1)$
  uitwerking: |-
    Hoekpunten $(0, 0)$, $\bigl(\tfrac92, 0\bigr)$, $\bigl(\tfrac{16}{5}, \tfrac{13}{5}\bigr)$, $\bigl(0, \tfrac{11}{3}\bigr)$ met $Z = 0$; 13,5; 14,8; 7,3. Afronden tot $(3, 3)$ kan niet: $3 + 9 = 12 > 11$. Roosterpunten: $(3, 2)$ geeft 13, $(4, 1)$ geeft 14. Het gehele optimum is $(4, 1)$.
