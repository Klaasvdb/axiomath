# Oefeningen van hoofdstuk 3. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Los op, of bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $20c + 500 \geqslant 25c$
      antwoord: |-
        $c \leqslant 100$
      uitwerking: |-
        $500 \geqslant 5c$.
    - opgave: |-
        $3 \leqslant \tfrac{12}{q} \leqslant 6$, met $q > 0$
      antwoord: |-
        $2 \leqslant q \leqslant 4$
      uitwerking: |-
        Neem de omgekeerde: $\tfrac16 \leqslant \tfrac{q}{12} \leqslant \tfrac13$.
    - opgave: |-
        $\begin{cases} x + 2y = 44 \\ 2x + y = 50 \end{cases}$
      antwoord: |-
        $\bigl(\tfrac{56}{3}, \tfrac{38}{3}\bigr)$
      uitwerking: |-
        $x = 44 - 2y$ geeft $88 - 3y = 50$, dus $y = \tfrac{38}{3}$.
    - opgave: |-
        $s$ en $t$ met $(5, -1) = s\,(1, 0) + t\,(1, 1)$
      antwoord: |-
        $s = 6$, $t = -1$
      uitwerking: |-
        Tweede coördinaat: $t = -1$. Eerste: $s + t = 5$.
    - opgave: |-
        $4x + 5y$ in $(135, 30)$
      antwoord: |-
        690
      uitwerking: |-
        $540 + 150$.
    - opgave: |-
        de rico's van $x + 2y = 40$ en $2x + y = 50$
      antwoord: |-
        $-\tfrac12$ en $-2$
      uitwerking: |-
        $y = -\tfrac12 x + 20$ en $y = -2x + 50$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Het fietsatelier van oefening~\ref{oef:h2-model} heeft hoekpunten $A(25, 0)$, $P(20, 10)$ en $B(10, 15)$ (en twee hoekpunten met een kleinere winst). De winst is $W = cx + 50y$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $W$ in $A$, $P$ en $B$ voor $c = 30$, $c = 50$, $c = 120$ en $c = 20$. Welk hoekpunt is telkens het beste?
      antwoord: |-
        $P$, $P$, $A$, $B$
      uitwerking: |-
        $c = 30$: 750, 1100, 1050. $c = 50$: 1250, 1500, 1250. $c = 120$: 3000, 2900, 1950. $c = 20$: 500, 900, 950.
    - opgave: |-
        Ergens tussen 50 en 120 springt het optimum van $P$ naar $A$. Zoek die waarde van $c$.
      antwoord: |-
        $c = 100$
      uitwerking: |-
        $W(A) = W(P) \iff 25c = 20c + 500 \iff c = 100$.
    - opgave: |-
        Wat is er bijzonder aan de niveaulijn bij die waarde?
      antwoord: |-
        evenwijdig met de zijde $[PA]$
      uitwerking: |-
        Bij $c = 100$ is $W = 100x + 50y = 50(2x + y)$: de niveaulijnen zijn evenwijdig met $2x + y = 50$, de zijde van $P$ naar $A$.

- id: h3-bereik
  soort: kort
  opgave: |-
    Bepaal het optimaliteitsbereik.
  lijst: enumerate
  delen:
    - opgave: |-
        De winst $q$ op een racefiets van het fietsatelier, met optimum $(20, 10)$ en buren $(25, 0)$ en $(10, 15)$. Een stadsfiets brengt 30 euro op.
      antwoord: |-
        $15 \leqslant q \leqslant 60$ euro
      uitwerking: |-
        $600 + 10q \geqslant 750$ geeft $q \geqslant 15$. $600 + 10q \geqslant 300 + 15q$ geeft $q \leqslant 60$.
    - opgave: |-
        De prijs $p$ van een portie brood in het menu van oefening~\ref{oef:h2-min}: het goedkoopste menu is $(6, 2)$, met buren $(4, 3)$ en $(18, 0)$, en kaas kost 0,60 euro. Let op: het gaat om een minimum.
      antwoord: |-
        $0{,}10 \leqslant p \leqslant 0{,}30$ euro
      uitwerking: |-
        Nu moet $K(6, 2)$ hoogstens zo groot zijn als bij de buren. $6p + 1{,}2 \leqslant 4p + 1{,}8$ geeft $p \leqslant 0{,}30$. $6p + 1{,}2 \leqslant 18p$ geeft $p \geqslant 0{,}10$.

- id: h3-schaduw
  soort: kort
  opgave: |-
    De konijnenbrokken van opdracht~\ref{oef:h2-o9} kosten 3 en 4 euro per kg. Het goedkoopste is $(3, 4)$, waar $2x + y \geqslant 10$ (vezels) en $x + 3y \geqslant 15$ (eiwit) bindend zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de schaduwprijs van de eiwitvoorwaarde, en het geldigheidsbereik.
      antwoord: |-
        1 euro per eenheid eiwit, voor $5 \leqslant E \leqslant 30$
      uitwerking: |-
        Met $x + 3y = E$: $x = \tfrac{30 - E}{5}$, $y = \tfrac{2E - 10}{5}$, en $K = 3x + 4y = 10 + E$. Uit $x \geqslant 0$ en $y \geqslant 0$: $5 \leqslant E \leqslant 30$.
    - opgave: |-
        Bereken de schaduwprijs van de vezelvoorwaarde.
      antwoord: |-
        1 euro per eenheid vezels
      uitwerking: |-
        Met $2x + y = F$: $x = \tfrac{3F - 15}{5}$, $y = \tfrac{30 - F}{5}$, en $K = F + 15$. Geldig voor $5 \leqslant F \leqslant 30$. Hier betekent de schaduwprijs: elke eenheid die de konijnen meer nodig hebben, kost 1 euro meer.

- id: h3-buur
  soort: kort
  opgave: |-
    Neem de vierhoek met hoekpunten $(0, 0)$, $(5, 0)$, $(3, 2)$ en $(0, 3)$. Ga met de stelling van de buurhoekpunten na of $(3, 2)$ het maximum geeft.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $Z = x + 2y$
      antwoord: |-
        ja
      uitwerking: |-
        $Z(3, 2) = 7$, en de buren geven $Z(5, 0) = 5$ en $Z(0, 3) = 6$.
    - opgave: |-
        $Z = x + 4y$
      antwoord: |-
        nee
      uitwerking: |-
        $Z(3, 2) = 11$, maar de buur $(0, 3)$ geeft 12. Daar zijn beide buren slechter (11 en 0): $(0, 3)$ is het maximum.

- id: h3-speling
  soort: kort
  opgave: |-
    Het fietsatelier herstelt 20 stadsfietsen en 10 racefietsen, met $x + 2y \leqslant 40$ (uren werk), $20x + 10y \leqslant 500$ (euro onderdelen) en $y \leqslant 15$ (racefietsen). Bereken de speling van elke voorwaarde. Welke schaduwprijs is zeker 0?
  antwoord: |-
    0, 0 en 5; die van de racefietsen
  uitwerking: |-
    $40 - 40 = 0$, $500 - 500 = 0$ en $15 - 10 = 5$. Alleen $y \leqslant 15$ is niet bindend, dus haar schaduwprijs is 0.

- id: h3-terug
  soort: kort
  opgave: |-
    De mini-onderneming maakt $x$ geurkaarsen en $y$ dozen zeep, met winst $W = 4x + 5y$ euro en de voorwaarden $20x + 30y \leqslant 3600$ (werktijd in minuten), $10x + 5y \leqslant 1500$ (geurolie in ml), $y \leqslant 100$ (verpakkingen) en $x, y \geqslant 0$. Het optimum is $(135, 30)$, met de buren $(150, 0)$ en $(30, 100)$. De winst per kaars mag tussen $\tfrac{10}{3}$ en 10 euro liggen, en een ml olie heeft een schaduwprijs van 10 cent, voor 800 tot 1800 ml olie.
  lijst: enumerate
  delen:
    - opgave: |-
        Een kaars brengt nog maar 3 euro op. Wat is nu het beste plan?
      antwoord: |-
        30 kaarsen en 100 dozen zeep: 590 euro
      uitwerking: |-
        3 ligt onder het bereik $\bigl[\tfrac{10}{3}, 10\bigr]$: het optimum springt naar de buur $(30, 100)$. Controle: $W = 450$, 555, 590, 500 in $(150, 0)$, $(135, 30)$, $(30, 100)$, $(0, 100)$.
    - opgave: |-
        Hoeveel ml olie kan de onderneming missen zonder dat de schaduwprijs van 10 cent verandert? Wat is dan de winst?
      antwoord: |-
        700 ml; 620 euro
      uitwerking: |-
        Het geldigheidsbereik begint bij 800 ml. Dan is $W = 540 + 0{,}1 \cdot 800 = 620$: het hoekpunt is $(30, 100)$ geworden.
    - opgave: |-
        Wat kost een tekort van 100 ml olie?
      antwoord: |-
        10 euro winst
      uitwerking: |-
        $100 \cdot 0{,}10 = 10$ euro: de winst wordt 680 euro, met het hoekpunt $(120, 40)$.

- id: h3-model
  soort: kort
  opgave: |-
    Een landbouwer verdeelt hoogstens 100 ha over tarwe ($x$ ha), maïs ($y$ ha) en aardappelen ($z$ ha), met 400, 500 en 800 euro winst per ha. Een ha vraagt 2, 3 en 8 uur werk, en 1, 3 en 2 eenheden water. Hij heeft 360 uur en 200 eenheden water.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel het model op, zoals voor een rekenblad.
      antwoord: |-
        $W = 400x + 500y + 800z$; $x + y + z \leqslant 100$, $2x + 3y + 8z \leqslant 360$, $x + 3y + 2z \leqslant 200$, $x, y, z \geqslant 0$
      uitwerking: |-
        Een rij per voorwaarde: grond, werk en water.
    - opgave: |-
        Een oplosser geeft $x = 40$, $y = 40$ en $z = 20$. Controleer dat dit aan alle voorwaarden voldoet, en bereken de winst. Welke voorwaarden zijn bindend?
      antwoord: |-
        52\,000 euro; alle drie bindend
      uitwerking: |-
        Grond $40 + 40 + 20 = 100$, werk $80 + 120 + 160 = 360$, water $40 + 120 + 40 = 200$: alle drie precies op. $W = 16\,000 + 20\,000 + 16\,000 = 52\,000$.

- id: h3-rapport
  soort: kort
  opgave: |-
    Het gevoeligheidsrapport bij de landbouwer van oefening~\ref{oef:h3-model} geeft deze schaduwprijzen (afgerond): grond 254,55 euro per ha, werk 63,64 euro per uur, water 18,18 euro per eenheid.
  lijst: enumerate
  delen:
    - opgave: |-
        De buurman verhuurt een ha grond voor 300 euro per jaar. Loont het om die te huren?
      antwoord: |-
        nee
      uitwerking: |-
        Een extra ha brengt hoogstens 254,55 euro meer winst op, minder dan de huur.
    - opgave: |-
        Een seizoenarbeider kost 15 euro per uur. Loont het?
      antwoord: |-
        ja, zolang het geldigheidsbereik niet overschreden wordt
      uitwerking: |-
        Een uur werk brengt 63,64 euro op, meer dan 15 euro. Hoeveel uren, zegt het geldigheidsbereik in het rapport.
    - opgave: |-
        Een vierde gewas, sojabonen, vraagt per ha 1 ha grond, 4 uur werk en 2 eenheden water, en brengt 500 euro op. Is het de moeite om het te proberen?
      antwoord: |-
        nee
      uitwerking: |-
        Wat soja verbruikt, is elders $254{,}55 + 4 \cdot 63{,}64 + 2 \cdot 18{,}18 = \tfrac{6000}{11} \approx 545{,}45$ euro waard. Soja brengt maar 500 euro op.

# --- Opdrachten -------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    optimaliteitsbereik met de buren
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=.45,font=\tiny]
        \path[gebied] (0,0) -- (5,0) -- (3,2) -- (0,3) -- cycle;
        \rooster{-1}{1}{6}{-1}{1}{4}
        \draw[grens] (0,0) -- (5,0) -- (3,2) -- (0,3) -- cycle;
        \optimum{3}{2}{}
      \end{tikzpicture}
  opgave: |-
    Op de vierhoek met hoekpunten $(0, 0)$, $(5, 0)$, $(3, 2)$ en $(0, 3)$ is $Z = 2x + 3y$ maximaal in $(3, 2)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Tussen welke grenzen mag de coëfficiënt 2 van $x$ liggen?
      antwoord: |-
        tussen 1 en 3
      uitwerking: |-
        $3c + 6 \geqslant 5c$ geeft $c \leqslant 3$; $3c + 6 \geqslant 9$ geeft $c \geqslant 1$.
    - opgave: |-
        Tussen welke grenzen mag de coëfficiënt 3 van $y$ liggen?
      antwoord: |-
        tussen 2 en 6
      uitwerking: |-
        $6 + 2q \geqslant 10$ geeft $q \geqslant 2$; $6 + 2q \geqslant 3q$ geeft $q \leqslant 6$.
    - opgave: |-
        Controleer het eerste antwoord met de richtingscoëfficiënten.
      antwoord: |-
        $-1 \leqslant -\tfrac c3 \leqslant -\tfrac13$
      uitwerking: |-
        De zijden door $(3, 2)$ liggen op $x + y = 5$ (rico $-1$) en $x + 3y = 9$ (rico $-\tfrac13$). De niveaulijnen $cx + 3y = k$ hebben rico $-\tfrac c3$: $1 \leqslant c \leqslant 3$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    bindend en speling
  opgave: |-
    De bakker van opdracht~\ref{oef:h2-o3} bakt best 60 broden en 5 taarten, met $x + 4y \leqslant 80$ (werk), $2x + y \leqslant 125$ (bloem) en $y \leqslant 12$ (taarten).
  lijst: enumerate
  delen:
    - opgave: |-
        Welke voorwaarden zijn bindend?
      antwoord: |-
        werk en bloem
      uitwerking: |-
        $60 + 20 = 80$ en $120 + 5 = 125$: gelijkheid. $5 < 12$.
    - opgave: |-
        Wat is de speling van de voorwaarde op de taarten? Wat betekent dat?
      antwoord: |-
        7 taarten
      uitwerking: |-
        Er worden 7 taarten minder gebakken dan er verkocht kunnen worden.
    - opgave: |-
        Wat is de schaduwprijs van die voorwaarde?
      antwoord: |-
        0
      uitwerking: |-
        Een niet-bindende voorwaarde heeft schaduwprijs 0: meer vraag naar taarten verandert niets.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    schaduwprijs berekenen
  opgave: |-
    Maximaliseer $Z = 2x + 3y$ onder $x, y \geqslant 0$, $x + y \leqslant 5$ en $x + 3y \leqslant 9$. Het optimum is $Z = 12$ in $(3, 2)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de schaduwprijs van $x + y \leqslant 5$ en het geldigheidsbereik.
      antwoord: |-
        $\tfrac32$, voor $3 \leqslant b \leqslant 9$
      uitwerking: |-
        Met $x + y = b$ en $x + 3y = 9$: $y = \tfrac{9 - b}{2}$, $x = \tfrac{3b - 9}{2}$, $Z = \tfrac32 b + \tfrac92$. Uit $x, y \geqslant 0$: $3 \leqslant b \leqslant 9$.
    - opgave: |-
        Bereken de schaduwprijs van $x + 3y \leqslant 9$ en het geldigheidsbereik.
      antwoord: |-
        $\tfrac12$, voor $5 \leqslant c \leqslant 15$
      uitwerking: |-
        Met $x + y = 5$ en $x + 3y = c$: $y = \tfrac{c - 5}{2}$, $x = \tfrac{15 - c}{2}$, $Z = \tfrac12 c + \tfrac{15}{2}$.
    - opgave: |-
        Welke voorwaarde zou je het liefst een eenheid verruimen?
      antwoord: |-
        $x + y \leqslant 5$
      uitwerking: |-
        Die heeft de grootste schaduwprijs: $\tfrac32 > \tfrac12$.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    schaduwprijs interpreteren
  opgave: |-
    Een rapport zegt over het meel van een bakkerij: schaduwprijs 2 euro per kg, geldig tot 80 kg meer dan nu.
  lijst: enumerate
  delen:
    - opgave: |-
        Een molen biedt 10 kg meel aan voor 1,50 euro per kg. Loont dat? Hoeveel levert het op?
      antwoord: |-
        ja, 5 euro
      uitwerking: |-
        $10 \cdot (2 - 1{,}50) = 5$ euro meer winst.
    - opgave: |-
        Kun je zeggen wat 100 kg extra meel oplevert?
      antwoord: |-
        niet helemaal
      uitwerking: |-
        De eerste 80 kg leveren 2 euro per kg op. Daarna verandert het optimale hoekpunt, en is de schaduwprijs anders (meestal kleiner). Dat moet je opnieuw uitrekenen.
    - opgave: |-
        Door een fout gaat 5 kg meel verloren. Hoeveel winst kost dat?
      antwoord: |-
        10 euro
      uitwerking: |-
        Binnen het geldigheidsbereik werkt de schaduwprijs ook naar beneden: $5 \cdot 2 = 10$ euro.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    model voor een rekenblad opstellen
  opgave: |-
    Een fabriek van muesli maakt drie soorten: Basis, Noten en Fruit, in dozen. Een doos Basis bevat 400 g haver en 100 g noten, Noten 250 g haver en 250 g noten, Fruit 300 g haver, 50 g noten en 150 g gedroogd fruit. Er is 600 kg haver, 200 kg noten en 90 kg fruit. De winst per doos is 1,20, 2 en 1,80 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Kies de onbekenden en schrijf de doelfunctie op.
      antwoord: |-
        $W = 1{,}2x + 2y + 1{,}8z$
      uitwerking: |-
        $x$, $y$ en $z$ dozen Basis, Noten en Fruit.
    - opgave: |-
        Schrijf de beperkende voorwaarden op, in gram.
      antwoord: |-
        $400x + 250y + 300z \leqslant 600\,000$, $100x + 250y + 50z \leqslant 200\,000$, $150z \leqslant 90\,000$, $x, y, z \geqslant 0$
      uitwerking: |-
        Een rij per grondstof. Zet alle hoeveelheden in dezelfde eenheid.
    - opgave: |-
        Teken de tabel zoals je ze in een rekenblad zou zetten, met de formules.
      antwoord: |-
        zie uitwerking
      uitwerking: |-
        Rij 2 met de aantallen (de veranderlijke cellen), rij 3 met de winst en in E3 \texttt{=SOMPRODUCT(B2:D2;B3:D3)}, rijen 4 tot 6 met de grondstoffen per doos, in E4 tot E6 het gebruik met \texttt{SOMPRODUCT} en in F4 tot F6 de voorraad.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    eigenschappen, redeneren
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Een voorwaarde die in het optimum niet bindend is, heeft schaduwprijs 0.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: dat is de stelling over niet-bindende voorwaarden.
    - opgave: |-
        Verdubbel je het rechterlid van een bindende voorwaarde, dan verdubbelt de optimale winst.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: de winst stijgt met de schaduwprijs per eenheid, en alleen binnen het geldigheidsbereik. Bij het fietsatelier geeft 80 uur werk geen 2200 euro.
    - opgave: |-
        Verandert de winst per stuk binnen het optimaliteitsbereik, dan blijft de optimale winst dezelfde.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: het optimale plan blijft hetzelfde, maar de winst van dat plan verandert wel.
    - opgave: |-
        In een maximum met alleen voorwaarden van de vorm $\leqslant$ is een schaduwprijs nooit negatief.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: een groter rechterlid maakt het gebied groter (of even groot). Het beste punt van het oude gebied ligt dan in het nieuwe, dus het maximum kan niet dalen.
    - opgave: |-
        Het optimaliteitsbereik van een coëfficiënt bevat altijd de huidige waarde van die coëfficiënt.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: met de huidige waarde is het hoekpunt optimaal.

- id: h3-o7
  soort: opdracht
  niveau: 2
  thema: |-
    niet-bindende voorwaarde die bindend wordt
  opgave: |-
    De mini-onderneming maakt $x$ geurkaarsen en $y$ dozen zeep, met winst $W = 4x + 5y$ euro en de voorwaarden $20x + 30y \leqslant 3600$ (werktijd in minuten), $10x + 5y \leqslant 1500$ (geurolie in ml), $y \leqslant 100$ (verpakkingen) en $x, y \geqslant 0$. Ze heeft 100 verpakkingen voor zeep, maar gebruikt er in het optimum $(135, 30)$ maar 30.
  lijst: enumerate
  delen:
    - opgave: |-
        Tot hoeveel verpakkingen mag de voorraad dalen zonder dat het plan verandert?
      antwoord: |-
        tot 30
      uitwerking: |-
        Zolang de speling niet negatief wordt: de voorraad moet minstens 30 zijn.
    - opgave: |-
        Er zijn maar 20 verpakkingen. Wat is nu het beste plan?
      antwoord: |-
        140 kaarsen en 20 dozen zeep: 660 euro
      uitwerking: |-
        Nu zijn $y \leqslant 20$ en de olie bindend: $10x + 100 = 1500$, dus $x = 140$. Werk: $2800 + 600 = 3400 \leqslant 3600$. $W = 560 + 100 = 660$, meer dan in $(150, 0)$.
    - opgave: |-
        Wat is nu de schaduwprijs van een verpakking?
      antwoord: |-
        3 euro
      uitwerking: |-
        Met olie en verpakkingen bindend: $x = \tfrac{1500 - 5y}{10}$ en $W = 4x + 5y = 600 + 3y$. Elke extra verpakking levert 3 euro op (tot 30 verpakkingen, waar de werktijd weer bindend wordt).

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    schaduwprijs in een minimum
  opgave: |-
    Het goedkoopste menu van brood en kaas (oefening~\ref{oef:h2-min}) is 6 porties brood en 2 porties kaas, voor 2,70 euro. Bindend zijn het eiwit ($x + 2y \geqslant 10$) en het calcium ($x + 6y \geqslant 18$, in eenheden van 50 mg).
  lijst: enumerate
  delen:
    - opgave: |-
        De student wil 100 mg calcium meer. Hoeveel duurder wordt het menu?
      antwoord: |-
        5 cent
      uitwerking: |-
        Met $x + 6y = C$: $y = \tfrac{C - 10}{4}$, $x = 10 - 2y$, $K = 2{,}5 + 0{,}1y = 2{,}25 + 0{,}025\,C$. 100 mg is 2 eenheden: $2 \cdot 0{,}025 = 0{,}05$ euro.
    - opgave: |-
        Tot hoeveel mg calcium geldt die schaduwprijs?
      antwoord: |-
        tot 1100 mg
      uitwerking: |-
        De energievoorwaarde $3x + 2y \geqslant 18$ geeft $30 - 4y \geqslant 18$, dus $y \leqslant 3$ en $C \leqslant 22$: 1100 mg. Daarboven wordt de energie bindend.
    - opgave: |-
        Waarom is de schaduwprijs van de energievoorwaarde 0?
      antwoord: |-
        niet bindend
      uitwerking: |-
        In $(6, 2)$ is $3 \cdot 6 + 2 \cdot 2 = 22 > 18$: er is energie te veel, dus wat meer of minder vragen verandert niets.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    optimaliteitsbereik in een transportprobleem
  opgave: |-
    In het transport van de bakkerijketen (voorbeeld~\ref{vb:h2-transport}) stuurt A 70 paletten naar winkel 2. Stel dat het transport van A naar 2 niet 20 euro kost, maar $a$ euro per palet.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de kost $K = 5x + (a - 35)\,y + 3800$ is.
      antwoord: |-
        uitwerken
      uitwerking: |-
        $30x + ay + 25(40 - x) + 35(80 - y) = 5x + (a - 35)y + 3800$.
    - opgave: |-
        Het optimum $(0, 70)$ heeft de buren $(0, 60)$ en $(40, 30)$. Voor welke $a$ blijft het plan het goedkoopste?
      antwoord: |-
        $a \leqslant 35$
      uitwerking: |-
        $70(a - 35) \leqslant 60(a - 35)$ geeft $a \leqslant 35$. $70(a - 35) \leqslant 200 + 30(a - 35)$ geeft $a \leqslant 40$. Samen: $a \leqslant 35$.
    - opgave: |-
        Verklaar het resultaat zonder te rekenen.
      antwoord: |-
        zolang A naar 2 niet duurder is dan B naar 2
      uitwerking: |-
        Winkel 2 krijgt zijn bloem uit A of uit B. Zolang A goedkoper (of even duur) is dan B, die 35 euro vraagt, stuurt A zoveel mogelijk naar 2.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    een bovengrens verlagen
  opgave: |-
    Bij het fietsatelier komen nog maar 8 racefietsen per week binnen in plaats van 15.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom verandert het plan van 20 stadsfietsen en 10 racefietsen nu wel?
      antwoord: |-
        $y = 10$ voldoet niet meer
      uitwerking: |-
        De speling was 5: de voorraad mocht dalen tot 10. Bij 8 is het oude optimum niet meer toegestaan.
    - opgave: |-
        Zoek het nieuwe beste plan en de winst.
      antwoord: |-
        21 stadsfietsen en 8 racefietsen: 1030 euro
      uitwerking: |-
        Nu zijn $y \leqslant 8$ en de onderdelen bindend: $2x + 8 = 50$, dus $x = 21$. Werk: $21 + 16 = 37 \leqslant 40$. $W = 630 + 400 = 1030$.
    - opgave: |-
        Wat is nu de schaduwprijs van een racefiets meer?
      antwoord: |-
        35 euro
      uitwerking: |-
        Met $2x + y = 50$: $x = \tfrac{50 - y}{2}$ en $W = 15(50 - y) + 50y = 750 + 35y$.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    de simplexmethode op een tekening
  opgave: |-
    De mini-onderneming maakt $x$ geurkaarsen en $y$ dozen zeep, met winst $W = 4x + 5y$ euro en de voorwaarden $20x + 30y \leqslant 3600$ (werktijd in minuten), $10x + 5y \leqslant 1500$ (geurolie in ml), $y \leqslant 100$ (verpakkingen) en $x, y \geqslant 0$. Het toegestane gebied heeft de hoekpunten $(0, 0)$, $(150, 0)$, $(135, 30)$, $(30, 100)$ en $(0, 100)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Begin in $(0, 0)$ en ga telkens naar de beste buur die beter is. Welke weg volg je?
      antwoord: |-
        $(0, 0) \to (150, 0) \to (135, 30)$
      uitwerking: |-
        De buren van $(0, 0)$ geven 600 en 500: naar $(150, 0)$. Daar is de nieuwe buur $(135, 30)$ met 690. Daar zijn beide buren slechter (600 en 620): stop.
    - opgave: |-
        Begin nu in $(0, 100)$. Kom je in hetzelfde punt uit?
      antwoord: |-
        ja: $(0, 100) \to (30, 100) \to (135, 30)$
      uitwerking: |-
        Van 500 naar 620 naar 690. Volgens de stelling van de buurhoekpunten is het eindpunt altijd het optimum, waar je ook begint.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    optimale waarde als functie van een rechterlid
  opgave: |-
    De mini-onderneming maakt $x$ geurkaarsen en $y$ dozen zeep, met winst $W = 4x + 5y$ euro en de voorwaarden $20x + 30y \leqslant 3600$ (werktijd in minuten), $10x + 5y \leqslant 1500$ (geurolie in ml), $y \leqslant 100$ (verpakkingen) en $x, y \geqslant 0$. Met $b$ ml olie in plaats van 1500 ml is de grootste winst $540 + 0{,}1\,b$, voor $800 \leqslant b \leqslant 1800$.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek de beste winst bij $b = 600$ ml, met de hoekpuntmethode.
      antwoord: |-
        540 euro, in $(10, 100)$
      uitwerking: |-
        Nu zijn olie en verpakkingen bindend: $10x + 500 = 600$, dus $x = 10$. Werk: $200 + 3000 \leqslant 3600$. $W = 40 + 500 = 540$.
    - opgave: |-
        En bij $b = 2000$ ml?
      antwoord: |-
        720 euro, in $(180, 0)$
      uitwerking: |-
        De olie is niet meer bindend: alleen werktijd telt, en een kaars geeft meer winst per minuut ($\tfrac{4}{20}$) dan zeep ($\tfrac{5}{30}$). $x = 180$, $W = 720$.
    - opgave: |-
        Wat is de schaduwprijs van de olie bij 600 ml, bij 1500 ml en bij 2000 ml?
      antwoord: |-
        0,40; 0,10; 0 euro per ml
      uitwerking: |-
        Bij 600 ml: $x = \tfrac{b - 500}{10}$, $W = 0{,}4\,b + 300$. Bij 1500 ml: 0,10. Bij 2000 ml is de olie niet bindend: 0. Hoe meer olie, hoe minder een extra ml waard is.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    optimaliteitsbereik in een minimum
  opgave: |-
    Voor de konijnen (opdracht~\ref{oef:h2-o9}) is $(3, 4)$ het goedkoopste, met buren $(0, 10)$ en $(15, 0)$, als A 3 euro en B 4 euro per kg kost.
  lijst: enumerate
  delen:
    - opgave: |-
        Tussen welke prijzen mag soort A liggen?
      antwoord: |-
        tussen $\tfrac43$ en 8 euro
      uitwerking: |-
        $3p + 16 \leqslant 40$ geeft $p \leqslant 8$; $3p + 16 \leqslant 15p$ geeft $p \geqslant \tfrac43$.
    - opgave: |-
        Tussen welke prijzen mag soort B liggen?
      antwoord: |-
        tussen 1,50 en 9 euro
      uitwerking: |-
        $9 + 4q \leqslant 10q$ geeft $q \geqslant 1{,}5$; $9 + 4q \leqslant 45$ geeft $q \leqslant 9$.
    - opgave: |-
        Beide prijzen stijgen met 50\,\%. Verandert de goedkoopste combinatie?
      antwoord: |-
        nee, ze kost 37,50 euro
      uitwerking: |-
        Alle coëfficiënten van $K$ worden met 1,5 vermenigvuldigd: de niveaulijnen blijven dezelfde rechten. Het optimum blijft $(3, 4)$, met $1{,}5 \cdot 25 = 37{,}5$ euro.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    transport met ICT
  opgave: |-
    Twee depots, A met 60 ton en B met 50 ton, leveren aan drie winkels, die 30, 40 en 30 ton vragen. De kost per ton van A naar de winkels is 4, 6 en 9 euro, van B 7, 5 en 3 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel het model op met zes onbekenden. Waarom kan dat niet meer grafisch?
      antwoord: |-
        $K = 4a_1 + 6a_2 + 9a_3 + 7b_1 + 5b_2 + 3b_3$ minimaal; zie uitwerking
      uitwerking: |-
        $a_1 + a_2 + a_3 \leqslant 60$, $b_1 + b_2 + b_3 \leqslant 50$, $a_1 + b_1 = 30$, $a_2 + b_2 = 40$, $a_3 + b_3 = 30$, alle onbekenden $\geqslant 0$. Met de drie gelijkheden blijven er drie vrije onbekenden over: te veel voor een tekening in het vlak.
    - opgave: |-
        Los het op met een rekenblad. Geef het plan en de kost.
      antwoord: |-
        A: 30 naar 1, 20 naar 2; B: 20 naar 2, 30 naar 3; 430 euro
      uitwerking: |-
        $120 + 120 + 100 + 90 = 430$ euro. A houdt 10 ton over. Winkel 3 krijgt alles uit B, de goedkoopste route.
    - opgave: |-
        Winkel 3 vraagt 40 ton in plaats van 30. Los opnieuw op. Hoeveel kosten die 10 ton extra?
      antwoord: |-
        470 euro: 40 euro meer
      uitwerking: |-
        A: 30 naar 1 en 30 naar 2; B: 10 naar 2 en 40 naar 3. B stuurt 10 ton meer naar 3 en 10 minder naar 2, en A vult winkel 2 aan: $30 - 50 + 60 = 40$ euro, 4 euro per ton.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    een nieuw product beoordelen met schaduwprijzen
  opgave: |-
    De mini-onderneming maakt $x$ geurkaarsen en $y$ dozen zeep, met winst $W = 4x + 5y$ euro en de voorwaarden $20x + 30y \leqslant 3600$ (werktijd in minuten), $10x + 5y \leqslant 1500$ (geurolie in ml), $y \leqslant 100$ (verpakkingen) en $x, y \geqslant 0$. Ze heeft schaduwprijzen 0,15 euro per minuut werk en 0,10 euro per ml olie.
  lijst: enumerate
  delen:
    - opgave: |-
        Een theelichtje vraagt 5 minuten werk en 8 ml olie. Hoeveel winst moet het minstens opleveren om het te maken?
      antwoord: |-
        meer dan 1,55 euro
      uitwerking: |-
        $5 \cdot 0{,}15 + 8 \cdot 0{,}10 = 1{,}55$ euro: dat brengen werk en olie elders op.
    - opgave: |-
        Een geurzakje vraagt 10 minuten werk en 5 ml olie, en brengt 1,50 euro op. Loont het? Controleer met een rekenblad.
      antwoord: |-
        nee
      uitwerking: |-
        $10 \cdot 0{,}15 + 5 \cdot 0{,}10 = 2 > 1{,}50$. De oplosser geeft opnieuw 135 kaarsen, 30 dozen zeep en geen zakjes, voor 690 euro.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    dieet met drie producten en ICT
  opgave: |-
    Aan het menu van brood en kaas (oefening~\ref{oef:h2-min}) voegt de student amandelen toe: een portie geeft 6 g eiwit, 80 mg calcium en 170 kcal, en kost 0,40 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel het model op met drie onbekenden.
      antwoord: |-
        $K = 0{,}25x + 0{,}6y + 0{,}4z$ minimaal; $4x + 8y + 6z \geqslant 40$, $50x + 300y + 80z \geqslant 900$, $150x + 100y + 170z \geqslant 900$
      uitwerking: |-
        $x$, $y$ en $z$ porties brood, kaas en amandelen, alle drie $\geqslant 0$.
    - opgave: |-
        Een oplosser geeft opnieuw 6 porties brood, 2 porties kaas en geen amandelen. Verklaar met de schaduwprijzen 0,05625 euro per g eiwit en 0,0005 euro per mg calcium.
      antwoord: |-
        de voedingsstoffen van amandelen zijn maar 0,3775 euro waard
      uitwerking: |-
        $6 \cdot 0{,}05625 + 80 \cdot 0{,}0005 = 0{,}3375 + 0{,}04 = 0{,}3775 < 0{,}40$. Amandelen zijn te duur voor wat ze geven.
    - opgave: |-
        Vanaf welke prijs komen amandelen in het goedkoopste menu?
      antwoord: |-
        onder 0,3775 euro per portie
      uitwerking: |-
        Is een portie goedkoper dan 0,3775 euro, dan vervangen amandelen een deel van het brood en de kaas. Met 0,37 euro geeft de oplosser $\tfrac15$ portie brood, 1,9 portie kaas en 4 porties amandelen, voor 2,67 euro.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    schaduwprijs in de context van hoofdstuk 1
  opgave: |-
    Lotte (hoofdstuk 1) verdient het meest met 9 uur ijssalon en 6 uur bijles: 210 euro. Bindend zijn $x + y \leqslant 15$ en $y \leqslant 6$.
  lijst: enumerate
  delen:
    - opgave: |-
        Ze mag een uur meer werken in totaal. Hoeveel verdient ze meer?
      antwoord: |-
        10 euro
      uitwerking: |-
        Met $x + y = 16$ en $y = 6$: $x = 10$, en het loon wordt $100 + 120 = 220$.
    - opgave: |-
        Ze krijgt een bijlesleerling meer: 7 uur bijles in plaats van 6. Hoeveel verdient ze meer?
      antwoord: |-
        10 euro
      uitwerking: |-
        Met $x + y = 15$ en $y = 7$: $x = 8$, en het loon wordt $80 + 140 = 220$.
    - opgave: |-
        Verklaar waarom een uur bijles meer maar 10 euro oplevert, en geen 20.
      antwoord: |-
        het vervangt een uur ijssalon
      uitwerking: |-
        Het totaal blijft 15 uur: een uur bijles meer is een uur ijssalon minder, dus $20 - 10 = 10$ euro.

- id: h3-o17
  soort: opdracht
  niveau: 3
  thema: |-
    drie grensrechten door het optimum
  opgave: |-
    Het fietsatelier krijgt er een voorwaarde bij: het herstelt hoogstens 30 fietsen per week. De grensrechte $x + y = 30$ gaat ook door het optimum $(20, 10)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat gebeurt er met de winst als de grens 31 wordt? En als ze 29 wordt?
      antwoord: |-
        blijft 1100; daalt tot 1090
      uitwerking: |-
        Bij 31 blijft $(20, 10)$ optimaal: werk en onderdelen beslissen nog. Bij 29 wordt het optimum het snijpunt van $x + y = 29$ en $x + 2y = 40$: $(18, 11)$, met $W = 540 + 550 = 1090$. Het voldoet aan $2x + y = 47 \leqslant 50$.
    - opgave: |-
        Wat betekent dat voor de schaduwprijs van die voorwaarde?
      antwoord: |-
        naar boven 0, naar onder 10 euro per fiets
      uitwerking: |-
        In zo'n ontaard hoekpunt (drie grensrechten door één punt) is de schaduwprijs voor een stijging en voor een daling verschillend. Het geldigheidsbereik is dan maar één getal breed.

- id: h3-o18
  soort: opdracht
  niveau: 3
  thema: |-
    buurhoekpunten zonder convexiteit
  figuur:
    opties: |-
      3cm
    code: |-
      \begin{tikzpicture}[scale=.45,font=\tiny]
        \path[gebied] (0,0) -- (4,0) -- (4,1) -- (1,1) -- (1,4) -- (0,4) -- cycle;
        \rooster{-1}{1}{5}{-1}{1}{5}
        \draw[grens] (0,0) -- (4,0) -- (4,1) -- (1,1) -- (1,4) -- (0,4) -- cycle;
        \fill[accent] (4,1) circle (3pt);
      \end{tikzpicture}
  opgave: |-
    Neem het L-vormige gebied en $Z = x + 2y$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $Z$ in $(4, 1)$ groter is dan in de twee buren.
      antwoord: |-
        $6 > 4$ en $6 > 3$
      uitwerking: |-
        De buren zijn $(4, 0)$ en $(1, 1)$, met $Z = 4$ en $Z = 3$.
    - opgave: |-
        Is $(4, 1)$ het maximum? Welke voorwaarde van de stelling van de buurhoekpunten ontbreekt?
      antwoord: |-
        nee: $Z(1, 4) = 9$; het gebied is niet convex
      uitwerking: |-
        In het bewijs lag het hele gebied in de hoek tussen de twee zijden door $P$. Dat volgt uit convexiteit. Hier ligt de poot met $(1, 4)$ buiten die hoek. Een simplexmethode zou in $(4, 1)$ blijven steken.

- id: h3-o19
  soort: opdracht
  niveau: 3
  thema: |-
    teken van een schaduwprijs bewijzen
  opgave: |-
    Bewijs, zonder te rekenen met hoekpunten:
  lijst: enumerate
  delen:
    - opgave: |-
        In een minimum met alleen voorwaarden van de vorm $\geqslant$ is de schaduwprijs nooit negatief.
      antwoord: |-
        een groter rechterlid maakt het gebied kleiner
      uitwerking: |-
        Een strengere ondergrens maakt het gebied kleiner (of even groot). Het minimum over een kleiner gebied kan niet lager liggen, dus de optimale waarde stijgt of blijft: de schaduwprijs is $\geqslant 0$.
    - opgave: |-
        Een voorwaarde $\geqslant$ in een maximum (zoals \textit{minstens 5 uur in het ijssalon}) heeft een schaduwprijs die nooit positief is.
      antwoord: |-
        een strengere ondergrens maakt het gebied kleiner
      uitwerking: |-
        Een groter rechterlid maakt het gebied kleiner, en het maximum over een kleiner gebied is niet groter. Zo'n voorwaarde kost dus hoogstens winst.

- id: h3-o20
  soort: opdracht
  niveau: 3
  thema: |-
    gevoeligheid van een hoekpunt met drie onbekenden
  opgave: |-
    Neem de mini-onderneming met geurzakjes uit voorbeeld~\ref{vb:h3-rekenblad}, met optimum $(0, 30, 270)$. Daar zijn $x = 0$, de werktijd en de olie bindend.
  lijst: enumerate
  delen:
    - opgave: |-
        Los het stelsel $30y + 10z = 3600$, $5y + 5z = 1500 + h$ op, en schrijf de winst $5y + 3z$ als functie van $h$.
      antwoord: |-
        $y = 30 - \tfrac{h}{10}$, $z = 270 + \tfrac{3h}{10}$, $W = 960 + 0{,}4\,h$
      uitwerking: |-
        Uit de tweede: $z = 300 + \tfrac h5 - y$. Invullen: $20y + 3000 + 2h = 3600$, dus $y = 30 - \tfrac{h}{10}$ en $z = 270 + \tfrac{3h}{10}$. $W = 150 - \tfrac h2 + 810 + \tfrac{9h}{10} = 960 + 0{,}4\,h$.
    - opgave: |-
        Wat is de schaduwprijs van de olie? Tot hoeveel extra olie geldt hij?
      antwoord: |-
        0,40 euro per ml, tot 300 ml extra
      uitwerking: |-
        Zolang $y \geqslant 0$: $h \leqslant 300$. Daarna maakt de onderneming alleen nog zakjes.
    - opgave: |-
        Bereken net zo de schaduwprijs van de werktijd, per minuut en per uur.
      antwoord: |-
        0,10 euro per minuut, 6 euro per uur
      uitwerking: |-
        Met $30y + 10z = 3600 + h$ en $5y + 5z = 1500$: $z = 300 - y$, dus $20y = 600 + h$, $y = 30 + \tfrac{h}{20}$ en $z = 270 - \tfrac{h}{20}$. $W = 960 + \tfrac{h}{10}$. Zonder zakjes was een minuut 0,15 euro waard: de schaduwprijs hangt af van het hele model.

# --- Koppel -----------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Afgeleiden
  opgave: |-
    De mini-onderneming maakt $x$ geurkaarsen en $y$ dozen zeep, met winst $W = 4x + 5y$ euro en de voorwaarden $20x + 30y \leqslant 3600$ (werktijd in minuten), $10x + 5y \leqslant 1500$ (geurolie in ml), $y \leqslant 100$ (verpakkingen) en $x, y \geqslant 0$. Met $b$ ml olie in plaats van 1500 ml is de grootste winst
    \[ W(b) = \begin{cases} b & 0 \leqslant b \leqslant 500 \\ 300 + 0{,}4\,b & 500 \leqslant b \leqslant 800 \\ 540 + 0{,}1\,b & 800 \leqslant b \leqslant 1800 \\ 720 & b \geqslant 1800 \end{cases} \]
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de grafiek van $W$ voor $0 \leqslant b \leqslant 2400$.
      antwoord: |-
        een gebroken lijn die steeds minder steil wordt
      uitwerking: |-
        Door $(0, 0)$, $(500, 500)$, $(800, 620)$, $(1800, 720)$, en daarna horizontaal.
        \figuren{\begin{tikzpicture}[x=.0022cm,y=.0055cm,font=\tiny]
          \draw[black!14,very thin,xstep=400,ystep=200] (0,0) grid (2400,800);
          \draw[->,grijs] (0,0) -- (2500,0) node[right,text=black] {$b$};
          \draw[->,grijs] (0,0) -- (0,850) node[above,text=black] {$W$};
          \foreach \t in {400,800,...,2400}{\node[below] at (\t,0) {\t};}
          \foreach \t in {200,400,600,800}{\node[left] at (0,\t) {\t};}
          \draw[accent,thick] (0,0) -- (500,500) -- (800,620) -- (1800,720) -- (2400,720);
        \end{tikzpicture}}
    - opgave: |-
        Wat is $W'(b)$ op elk stuk? Wat betekent dat getal?
      antwoord: |-
        1; 0,4; 0,1; 0: de schaduwprijs van de olie
      uitwerking: |-
        De afgeleide is de helling van elk stuk: de extra winst per extra ml olie.
    - opgave: |-
        In welke punten is $W$ niet afleidbaar? Wat gebeurt daar in het lineaire probleem?
      antwoord: |-
        in 500, 800 en 1800: het optimale hoekpunt verandert
      uitwerking: |-
        Daar maakt de grafiek een knik: de linker- en rechterafgeleide verschillen. Het zijn de grenzen van de geldigheidsbereiken, waar een andere voorwaarde bindend wordt.

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Het optimum $(40, 40, 20)$ van de landbouwer (oefening~\ref{oef:h3-model}) is de oplossing van een stelsel van drie vergelijkingen: de drie voorwaarden zijn bindend.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf het stelsel als $A\,X = B$, en los het op met de methode van Gauss.
      antwoord: |-
        $(40, 40, 20)$
      uitwerking: |-
        $A = \begin{pmatrix} 1 & 1 & 1 \\ 2 & 3 & 8 \\ 1 & 3 & 2 \end{pmatrix}$, $B = \begin{pmatrix} 100 \\ 360 \\ 200 \end{pmatrix}$. Na eliminatie: $y + 6z = 160$, $2y + z = 100$, dus $11z = 220$, $z = 20$, $y = 40$, $x = 40$.
    - opgave: |-
        Verander de grond in $100 + h$ ha. Toon aan dat het nieuwe hoekpunt $X + h\,C$ is, met $C$ de eerste kolom van $A^{-1}$.
      antwoord: |-
        $A^{-1}(B + h\,E_1) = X + h\,A^{-1}E_1$
      uitwerking: |-
        Met $E_1 = (1, 0, 0)$ is het nieuwe rechterlid $B + hE_1$, en $A^{-1}(B + hE_1) = A^{-1}B + h\,A^{-1}E_1$. Het hoekpunt schuift dus lineair met $h$, zoals in de stelling over de schaduwprijs.
    - opgave: |-
        Bereken die kolom en de schaduwprijs van de grond.
      antwoord: |-
        $C = \tfrac{1}{11}(18, -4, -3)$; $\tfrac{2800}{11} \approx 254{,}55$ euro per ha
      uitwerking: |-
        Los $A\,C = E_1$ op: $C = \tfrac{1}{11}(18, -4, -3)$. Een extra ha geeft dus meer tarwe en minder maïs en aardappelen. De winst verandert met $400 \cdot \tfrac{18}{11} - 500 \cdot \tfrac{4}{11} - 800 \cdot \tfrac{3}{11} = \tfrac{2800}{11}$ per ha.

- id: h3-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Ruimtemeetkunde
  opgave: |-
    Het toegestane gebied van de mini-onderneming met geurzakjes ligt in de ruimte. De werktijd geeft het vlak $\alpha \leftrightarrow 20x + 30y + 10z = 3600$, de olie het vlak $\beta \leftrightarrow 10x + 5y + 5z = 1500$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de snijpunten van $\alpha$ met de drie assen.
      antwoord: |-
        $(180, 0, 0)$, $(0, 120, 0)$, $(0, 0, 360)$
      uitwerking: |-
        Telkens twee coördinaten 0.
    - opgave: |-
        Bepaal een parametervergelijking van de snijlijn van $\alpha$ en $\beta$.
      antwoord: |-
        $(x, y, z) = (t,\ 30,\ 270 - 2t)$
      uitwerking: |-
        Uit $\beta$: $z = 300 - 2x - y$. In $\alpha$: $20x + 30y + 3000 - 20x - 10y = 3600$, dus $y = 30$ en $z = 270 - 2x$.
    - opgave: |-
        Welke ribbe van het veelvlak ligt op die snijlijn?
      antwoord: |-
        van $(0, 30, 270)$ tot $(135, 30, 0)$
      uitwerking: |-
        Voor $t = 0$ is het punt $(0, 30, 270)$, het optimum met zakjes; voor $t = 135$ is het $(135, 30, 0)$, het optimum zonder zakjes. Langs die ribbe zijn werk en olie allebei volledig op.

# --- Test jezelf ------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Op het gebied met hoekpunten $(0, 0)$, $(6, 0)$, $(3, 3)$ en $(0, 4)$ is $Z = 2x + 3y$ maximaal in $(3, 3)$. Bepaal met de buren het optimaliteitsbereik van de coëfficiënt van $x$.
  antwoord: |-
    $1 \leqslant c \leqslant 3$
  uitwerking: |-
    $3c + 9 \geqslant 6c$ geeft $c \leqslant 3$; $3c + 9 \geqslant 12$ geeft $c \geqslant 1$.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Het gebied van vraag 1 wordt begrensd door $x + y \leqslant 6$ en $x + 3y \leqslant 12$. Bepaal met de richtingscoëfficiënten het optimaliteitsbereik van de coëfficiënt van $y$ in $Z = 2x + 3y$.
  antwoord: |-
    $2 \leqslant q \leqslant 6$
  uitwerking: |-
    $-1 \leqslant -\tfrac2q \leqslant -\tfrac13$, dus $\tfrac13 \leqslant \tfrac2q \leqslant 1$, of $2 \leqslant q \leqslant 6$.

- id: h3-t3
  soort: test
  niveau: 2
  opgave: |-
    Bereken voor hetzelfde probleem de schaduwprijs van $x + y \leqslant 6$ en het geldigheidsbereik.
  antwoord: |-
    $\tfrac32$, voor $4 \leqslant b \leqslant 12$
  uitwerking: |-
    Met $x + y = b$ en $x + 3y = 12$: $y = \tfrac{12 - b}{2}$, $x = \tfrac{3b - 12}{2}$, $Z = \tfrac32 b + 6$. Uit $x, y \geqslant 0$: $4 \leqslant b \leqslant 12$.

- id: h3-t4
  soort: test
  niveau: 2
  opgave: |-
    Een rapport zegt: machine-uren schaduwprijs 12 euro, geldig tot 50 uur meer; grondstof niet bindend, speling 30 kg. Een uur extra machinetijd kost 10 euro, een kg grondstof 1 euro. Wat koop je bij?
  antwoord: |-
    hoogstens 50 uur machinetijd; geen grondstof
  uitwerking: |-
    Een uur levert 12 euro op en kost 10: 2 euro winst per uur, tot 50 uur. De grondstof heeft schaduwprijs 0: er is al te veel.

- id: h3-t5
  soort: test
  niveau: 2
  opgave: |-
    Een drukkerij maakt folders, affiches en brochures, met 0,05, 0,40 en 0,90 euro winst per stuk. Een folder vraagt 1 vel papier en 2 s drukken, een affiche 2 vellen en 5 s, een brochure 8 vellen en 20 s. Er zijn 20\,000 vellen en 15 uur drukken. Stel het model op voor een rekenblad.
  antwoord: |-
    $W = 0{,}05x + 0{,}4y + 0{,}9z$; $x + 2y + 8z \leqslant 20\,000$, $2x + 5y + 20z \leqslant 54\,000$, $x, y, z \geqslant 0$
  uitwerking: |-
    15 uur is $15 \cdot 3600 = 54\,000$ s. Drie veranderlijke cellen, een doelcel met \texttt{SOMPRODUCT} en twee voorwaarden.

- id: h3-t6
  soort: test
  niveau: 2
  opgave: |-
    Een rapport geeft schaduwprijzen 12 euro per machine-uur en 0 per kg grondstof. Een nieuw product vraagt 3 machine-uren en 2 kg grondstof. Hoeveel winst moet het opleveren om in het plan te komen?
  antwoord: |-
    meer dan 36 euro
  uitwerking: |-
    $3 \cdot 12 + 2 \cdot 0 = 36$ euro: dat brengen de machine-uren elders op.
