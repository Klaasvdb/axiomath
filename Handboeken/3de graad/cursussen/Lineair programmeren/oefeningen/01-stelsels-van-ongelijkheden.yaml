# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Los op, of bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $3x - 5 \leqslant 7$
      antwoord: |-
        $x \leqslant 4$
      uitwerking: |-
        $3x \leqslant 12$, dus $x \leqslant 4$.
    - opgave: |-
        $-2x < 6$
      antwoord: |-
        $x > -3$
      uitwerking: |-
        Delen door $-2$ keert het teken om: $x > -3$.
    - opgave: |-
        de rechte door $(0, 4)$ en $(2, 0)$
      antwoord: |-
        $y = -2x + 4$
      uitwerking: |-
        Rico $\tfrac{0 - 4}{2 - 0} = -2$ en snijpunt met de $y$-as 4.
    - opgave: |-
        de snijpunten van $3x + 2y = 12$ met de assen
      antwoord: |-
        $(4, 0)$ en $(0, 6)$
      uitwerking: |-
        $y = 0$ geeft $x = 4$, $x = 0$ geeft $y = 6$.
    - opgave: |-
        $\begin{cases} x + y = 7 \\ x - y = 1 \end{cases}$
      antwoord: |-
        $(4, 3)$
      uitwerking: |-
        Optellen: $2x = 8$, dus $x = 4$ en $y = 3$.
    - opgave: |-
        ligt $(2, 3)$ op $2x - y = 1$?
      antwoord: |-
        ja
      uitwerking: |-
        $4 - 3 = 1$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad We zoeken de punten $(x, y)$ met $x + y \leqslant 4$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke van de punten $(1, 2)$, $(2, 3)$, $(4, 0)$ en $(-1, 6)$ voldoen?
      antwoord: |-
        $(1, 2)$ en $(4, 0)$
      uitwerking: |-
        $1 + 2 = 3$ en $4 + 0 = 4$ voldoen; $2 + 3 = 5$ en $-1 + 6 = 5$ niet.
    - opgave: |-
        Kleur in een rooster met $x$ en $y$ van $-1$ tot 5 alle roosterpunten die voldoen. Waar liggen de punten met $x + y = 4$?
      antwoord: |-
        op de rechte $y = 4 - x$, de grens van de gekleurde punten
      uitwerking: |-
        De punten met $x + y = 4$ liggen op de rechte $y = -x + 4$. De gekleurde punten liggen erop of eronder.
    - opgave: |-
        Wat krijg je als ook niet-gehele getallen mogen?
      antwoord: |-
        alles op en onder de rechte
      uitwerking: |-
        Bij elke $x$ voldoen alle $y \leqslant 4 - x$: het hele stuk van het vlak op en onder de rechte.
    - opgave: |-
        Welke vorm krijg je als ook $y \geqslant x$ moet gelden?
      antwoord: |-
        een hoek met top $(2, 2)$
      uitwerking: |-
        De punten onder $y = 4 - x$ en boven $y = x$: een hoek met top in het snijpunt $(2, 2)$, die naar links openligt.

- id: h1-teken
  soort: kort
  opgave: |-
    Teken de oplossingen.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $x + y < 3$
      antwoord: |-
        onder $x + y = 3$, stippellijn
      uitwerking: |-
        Grensrechte door $(3, 0)$ en $(0, 3)$, in stippellijn. Testpunt: $0 < 3$ is waar, dus de kant van de oorsprong.
        \figuren{\halfvlakfig[opengrens]{1}{1}{3}{-2}{5}{-2}{5}}
    - opgave: |-
        $2x - y \geqslant 4$
      antwoord: |-
        onder $y = 2x - 4$, vol
      uitwerking: |-
        Grensrechte door $(2, 0)$ en $(0, -4)$, vol. Testpunt: $0 \geqslant 4$ is vals, dus de kant zonder de oorsprong.
        \figuren{\halfvlakfig{-2}{1}{-4}{-2}{5}{-5}{3}}
    - opgave: |-
        $y \leqslant -1$
      antwoord: |-
        onder $y = -1$, vol
      uitwerking: |-
        Een horizontale grensrechte. Alle punten met $y \leqslant -1$, voor elke $x$.
        \figuren{\halfvlakfig{0}{1}{-1}{-3}{3}{-4}{2}}
    - opgave: |-
        $x > 2y$
      antwoord: |-
        onder $y = \tfrac12 x$, stippellijn
      uitwerking: |-
        De grensrechte $x = 2y$ gaat door de oorsprong: neem testpunt $(1, 0)$. $1 > 0$ is waar, dus de kant van $(1, 0)$.
        \figuren{\halfvlakfig[opengrens]{-1}{2}{0}{-4}{4}{-3}{3}}

- id: h1-punten
  soort: kort
  opgave: |-
    Welke punten liggen in het halfvlak $4x - 3y \leqslant 12$? Welke liggen op de grensrechte?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $(0, 0)$
      antwoord: |-
        erin
      uitwerking: |-
        $0 \leqslant 12$.
    - opgave: |-
        $(3, 0)$
      antwoord: |-
        erin, op de grens
      uitwerking: |-
        $12 \leqslant 12$, met gelijkheid.
    - opgave: |-
        $(3, -1)$
      antwoord: |-
        niet
      uitwerking: |-
        $12 + 3 = 15 > 12$.
    - opgave: |-
        $(-3, -8)$
      antwoord: |-
        erin, op de grens
      uitwerking: |-
        $-12 + 24 = 12$.

- id: h1-stelsel
  soort: kort
  opgave: |-
    Teken het oplossingsgebied en bepaal de hoekpunten.
  lijst: enumerate
  delen:
    - opgave: |-
        $x \geqslant 0$, $y \geqslant 0$, $x + 2y \leqslant 8$, $3x + y \leqslant 9$
      antwoord: |-
        $(0, 0)$, $(3, 0)$, $(2, 3)$, $(0, 4)$
      uitwerking: |-
        $x + 2y = 8$ en $3x + y = 9$: $y = 9 - 3x$ geeft $x + 18 - 6x = 8$, dus $x = 2$ en $y = 3$.
        \figuren{\begin{tikzpicture}[scale=.3,font=\tiny]
          \path[gebied] (0,0) -- (3,0) -- (2,3) -- (0,4) -- cycle;
          \roosterom{0}{1}{2}{8}{0}{1}{2}{9}
          \begin{scope}\venster{0}{8.5}{0}{9.5}\grenslijn{1}{2}{8}\grenslijn{3}{1}{9}\end{scope}
          \hoekpunt[right]{2}{3}{}
        \end{tikzpicture}}
    - opgave: |-
        $y \geqslant 0$, $y \leqslant x$, $x + y \leqslant 6$
      antwoord: |-
        $(0, 0)$, $(6, 0)$, $(3, 3)$
      uitwerking: |-
        $y = x$ en $x + y = 6$ geven $(3, 3)$; $y = 0$ en $x + y = 6$ geven $(6, 0)$; $y = 0$ en $y = x$ geven de oorsprong.
        \figuren{\begin{tikzpicture}[scale=.3,font=\tiny]
          \path[gebied] (0,0) -- (6,0) -- (3,3) -- cycle;
          \roosterom{-1}{1}{2}{7}{-1}{1}{2}{5}
          \begin{scope}\venster{-1}{7.5}{-1}{5.5}\grenslijn{-1}{1}{0}\grenslijn{1}{1}{6}\end{scope}
          \hoekpunt[above]{3}{3}{}
        \end{tikzpicture}}

- id: h1-hoekpunt
  soort: kort
  opgave: |-
    Neem het stelsel $x \geqslant 1$, $y \geqslant 0$, $x + y \leqslant 7$ en $x - y \leqslant 3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken alle snijpunten van twee grensrechten.
      antwoord: |-
        $(1, 0)$, $(1, 6)$, $(1, -2)$, $(7, 0)$, $(3, 0)$, $(5, 2)$
      uitwerking: |-
        $x = 1$ met de andere drie: $(1, 0)$, $(1, 6)$ en $(1, -2)$. $y = 0$ met $x + y = 7$ en met $x - y = 3$: $(7, 0)$ en $(3, 0)$. $x + y = 7$ en $x - y = 3$: optellen geeft $(5, 2)$.
    - opgave: |-
        Welke snijpunten zijn hoekpunten? Teken het gebied.
      antwoord: |-
        $(1, 0)$, $(3, 0)$, $(5, 2)$, $(1, 6)$
      uitwerking: |-
        $(1, -2)$ voldoet niet aan $y \geqslant 0$, en $(7, 0)$ niet aan $x - y \leqslant 3$.
        \figuren{\begin{tikzpicture}[scale=.3,font=\tiny]
          \path[gebied] (1,0) -- (3,0) -- (5,2) -- (1,6) -- cycle;
          \roosterom{0}{1}{2}{8}{-2}{1}{2}{7}
          \begin{scope}\venster{0}{8.5}{-2}{7.5}\grenslijn{1}{0}{1}\grenslijn{1}{1}{7}\grenslijn{1}{-1}{3}\end{scope}
          \hoekpunt{5}{2}{}\hoekpunt{1}{6}{}\hoekpunt{3}{0}{}\hoekpunt{1}{0}{}
          \draw (7,0) circle (5pt) (1,-2) circle (5pt);
        \end{tikzpicture}}

- id: h1-soort
  soort: kort
  opgave: |-
    Is het oplossingsgebied begrensd, onbegrensd of leeg?
  lijst: enumerate
  delen:
    - opgave: |-
        $x \geqslant 0$, $y \geqslant 0$, $x + y \geqslant 2$
      antwoord: |-
        onbegrensd
      uitwerking: |-
        Het eerste kwadrant zonder de driehoek bij de oorsprong: het loopt eindeloos naar rechts en naar boven.
    - opgave: |-
        $x + y \leqslant 1$, $x \geqslant 2$, $y \geqslant 0$
      antwoord: |-
        leeg
      uitwerking: |-
        Uit $x \geqslant 2$ en $y \geqslant 0$ volgt $x + y \geqslant 2 > 1$.
    - opgave: |-
        $0 \leqslant y \leqslant 2$, $x \geqslant y$, $x \leqslant 5$
      antwoord: |-
        begrensd
      uitwerking: |-
        Een vierhoek met hoekpunten $(0, 0)$, $(5, 0)$, $(5, 2)$ en $(2, 2)$.

- id: h1-convex
  soort: kort
  opgave: |-
    Welke gebieden kunnen het oplossingsgebied zijn van een stelsel eerstegraadsongelijkheden? Verklaar. Gebied C loopt naar boven en onder verder.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        \begin{tikzpicture}[scale=.45,baseline=(current bounding box.north)]\path[gebied,draw=grijs,thick] (0,0) -- (3,0) -- (1,2) -- cycle;\end{tikzpicture}
      antwoord: |-
        ja
      uitwerking: |-
        Ja: een driehoek, de doorsnede van drie halfvlakken.
    - opgave: |-
        \begin{tikzpicture}[scale=.45,baseline=(current bounding box.north)]\path[gebied,draw=grijs,thick] (3,0) arc[start angle=0,end angle=180,radius=1.5] -- cycle;\end{tikzpicture}
      antwoord: |-
        nee
      uitwerking: |-
        Nee: ze is wel convex, maar de rand is gebogen. Een grensrechte geeft altijd een rechte rand.
    - opgave: |-
        \begin{tikzpicture}[scale=.45,baseline=(current bounding box.north)]\path[gebied] (0,0) -- (2,2) -- (1,2) -- (0,1) -- cycle;\draw[grijs,thick] (0,0) -- (2,2) (0,1) -- (1,2);\end{tikzpicture}
      antwoord: |-
        ja
      uitwerking: |-
        Ja: een strook tussen twee evenwijdige rechten, zoals $x \leqslant y \leqslant x + 1$, onbegrensd.
    - opgave: |-
        \begin{tikzpicture}[scale=.45,baseline=(current bounding box.north)]\path[gebied,draw=grijs,thick] (0,0) -- (3,0) -- (3,2) -- (1.5,1) -- (0,2) -- cycle;\end{tikzpicture}
      antwoord: |-
        nee
      uitwerking: |-
        Nee: niet convex. Het lijnstuk tussen de twee bovenste hoekpunten ligt erbuiten.

- id: h1-figuur
  soort: kort
  opgave: |-
    Geef een stelsel ongelijkheden met dit oplossingsgebied.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        \begin{tikzpicture}[scale=.4,font=\scriptsize,baseline=(current bounding box.north)]
          \path[gebied] (0,0) -- (4,0) -- (4,2) -- (0,4) -- cycle;
          \rooster{-1}{1}{5}{-1}{1}{5}
          \draw[grens] (0,0) -- (4,0) -- (4,2) -- (0,4) -- cycle;
        \end{tikzpicture}
      antwoord: |-
        $x \geqslant 0$, $y \geqslant 0$, $x \leqslant 4$, $x + 2y \leqslant 8$
      uitwerking: |-
        De schuine zijde gaat door $(0, 4)$ en $(4, 2)$: rico $-\tfrac12$, dus $y = -\tfrac12 x + 4$ of $x + 2y = 8$. Testpunt $(1, 1)$: $3 \leqslant 8$.
    - opgave: |-
        \begin{tikzpicture}[scale=.4,font=\scriptsize,baseline=(current bounding box.north)]
          \path[gebied] (1,1) -- (5,1) -- (1,4) -- cycle;
          \rooster{-1}{1}{6}{-1}{1}{5}
          \draw[grens] (5,1) -- (1,1) -- (1,4);
          \draw[opengrens] (1,4) -- (5,1);
        \end{tikzpicture}
      antwoord: |-
        $x \geqslant 1$, $y \geqslant 1$, $3x + 4y < 19$
      uitwerking: |-
        De schuine zijde door $(5, 1)$ en $(1, 4)$ heeft rico $-\tfrac34$: $y - 1 = -\tfrac34(x - 5)$, of $3x + 4y = 19$. Ze staat in stippellijn, dus strikt. Testpunt $(2, 2)$: $14 < 19$.

- id: h1-vertaal
  soort: kort
  opgave: |-
    Een bakker bakt per dag $x$ broden en $y$ taarten. Schrijf als ongelijkheid.
  lijst: enumerate
  delen:
    - opgave: |-
        Hij bakt minstens drie keer zoveel broden als taarten.
      antwoord: |-
        $x \geqslant 3y$
      uitwerking: |-
        Test: 30 broden en 10 taarten voldoen, en $30 \geqslant 3 \cdot 10$.
    - opgave: |-
        Hij bakt meer dan 40 stuks.
      antwoord: |-
        $x + y > 40$
      uitwerking: |-
        \textit{Meer dan} is strikt.
    - opgave: |-
        Hoogstens 20\,\% van zijn stuks zijn taarten.
      antwoord: |-
        $y \leqslant 0{,}2(x + y)$, of $4y \leqslant x$
      uitwerking: |-
        Van alle stuks: $y \leqslant 0{,}2x + 0{,}2y$, dus $0{,}8y \leqslant 0{,}2x$, of $4y \leqslant x$.
    - opgave: |-
        Een brood vraagt 15 minuten werk, een taart 40 minuten, en hij werkt hoogstens 10 uur.
      antwoord: |-
        $15x + 40y \leqslant 600$
      uitwerking: |-
        In minuten: 10 uur is 600 minuten. Gedeeld door 5: $3x + 8y \leqslant 120$.

- id: h1-model
  soort: kort
  opgave: |-
    Jonas koopt voor een feestje $x$ flessen cola van 2 liter, aan 2 euro, en $y$ flessen water van 1,5 liter, aan 1 euro. Hij wil minstens 15 liter drank, hij heeft hoogstens 20 euro, en hij koopt minstens dubbel zoveel flessen water als cola.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf het stelsel op.
      antwoord: |-
        $x \geqslant 0$, $4x + 3y \geqslant 30$, $2x + y \leqslant 20$, $y \geqslant 2x$
      uitwerking: |-
        Liters: $2x + 1{,}5y \geqslant 15$, maal 2. Geld: $2x + y \leqslant 20$. Water: $y \geqslant 2x$. Uit $y \geqslant 2x$ en $x \geqslant 0$ volgt $y \geqslant 0$.
    - opgave: |-
        Teken het oplossingsgebied en bepaal de hoekpunten.
      antwoord: |-
        $(0, 10)$, $(0, 20)$, $(5, 10)$, $(3, 6)$
      uitwerking: |-
        $y = 2x$ met $4x + 3y = 30$: $10x = 30$, dus $(3, 6)$. $y = 2x$ met $2x + y = 20$: $4x = 20$, dus $(5, 10)$. Op $x = 0$: $y = 10$ en $y = 20$.
        \figuren{\begin{tikzpicture}[scale=.22,font=\tiny]
          \path[gebied] (0,10) -- (3,6) -- (5,10) -- (0,20) -- cycle;
          \roosterom{0}{1}{2}{10}{0}{1}{4}{22}
          \begin{scope}\venster{0}{10.5}{0}{22.5}\grenslijn{4}{3}{30}\grenslijn{2}{1}{20}\grenslijn{-2}{1}{0}\end{scope}
          \hoekpunt{3}{6}{}\hoekpunt{5}{10}{}\hoekpunt{0}{10}{}\hoekpunt{0}{20}{}
        \end{tikzpicture}}
    - opgave: |-
        Kan Jonas 4 flessen cola en 7 flessen water kopen?
      antwoord: |-
        nee, te weinig water
      uitwerking: |-
        Liters en geld kloppen ($37 \geqslant 30$ en $15 \leqslant 20$), maar $7 < 2 \cdot 4$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    halfvlak tekenen
  opgave: |-
    Teken de oplossingen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $y \geqslant 2x - 1$
      antwoord: |-
        boven $y = 2x - 1$, vol
      uitwerking: |-
        Grensrechte door $(0, -1)$ en $(1, 1)$. De vorm $y \geqslant \ldots$: de punten erboven.
        \figuren{\halfvlakfig{2}{-1}{1}{-3}{3}{-3}{5}}
    - opgave: |-
        $x + 3y < 6$
      antwoord: |-
        onder $x + 3y = 6$, stippellijn
      uitwerking: |-
        Grensrechte door $(6, 0)$ en $(0, 2)$. Testpunt: $0 < 6$, de kant van de oorsprong.
        \figuren{\halfvlakfig[opengrens]{1}{3}{6}{-2}{7}{-2}{4}}
    - opgave: |-
        $x \leqslant -2$
      antwoord: |-
        links van $x = -2$, vol
      uitwerking: |-
        Een verticale grensrechte; $y$ is vrij.
        \figuren{\halfvlakfig{1}{0}{-2}{-5}{2}{-3}{3}}
    - opgave: |-
        $5x - 2y \geqslant 10$
      antwoord: |-
        rechts onder $5x - 2y = 10$, vol
      uitwerking: |-
        Grensrechte door $(2, 0)$ en $(0, -5)$. Testpunt: $0 \geqslant 10$ is vals.
        \figuren{\halfvlakfig{-5}{2}{-10}{-2}{5}{-6}{3}}
    - opgave: |-
        $y > -x$
      antwoord: |-
        boven $y = -x$, stippellijn
      uitwerking: |-
        Grensrechte door de oorsprong. Testpunt $(1, 0)$: $0 > -1$ is waar.
        \figuren{\halfvlakfig[opengrens]{-1}{-1}{0}{-3}{3}{-3}{3}}
    - opgave: |-
        $3y - 6 \leqslant 0$
      antwoord: |-
        onder $y = 2$, vol
      uitwerking: |-
        $3y - 6 \leqslant 0 \iff y \leqslant 2$: een horizontale grensrechte.
        \figuren{\halfvlakfig{0}{3}{6}{-3}{3}{-2}{4}}

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    ongelijkheid bij een halfvlak aflezen
  opgave: |-
    Welke ongelijkheid hoort bij elk halfvlak?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        \halfvlakfig{1}{2}{4}{-1}{5}{-1}{4}
      antwoord: |-
        $x + 2y \leqslant 4$
      uitwerking: |-
        Grensrechte door $(4, 0)$ en $(0, 2)$; vol, kant van de oorsprong.
    - opgave: |-
        \halfvlakfig[opengrens]{1}{-1}{0}{-3}{3}{-3}{3}
      antwoord: |-
        $y > x$
      uitwerking: |-
        Grensrechte $y = x$ in stippellijn; de punten erboven.
    - opgave: |-
        \halfvlakfig{-1}{0}{1}{-3}{3}{-3}{3}
      antwoord: |-
        $x \geqslant -1$
      uitwerking: |-
        Verticale grensrechte $x = -1$; de punten rechts ervan.
    - opgave: |-
        \halfvlakfig{2}{-1}{3}{-1}{4}{-4}{3}
      antwoord: |-
        $y \geqslant 2x - 3$
      uitwerking: |-
        Grensrechte door $(0, -3)$ en $(1{,}5;\ 0)$: rico 2. De punten erboven, met de grens.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    oplossingsgebied en hoekpunten
  opgave: |-
    Teken het oplossingsgebied en bepaal de hoekpunten.
  lijst: enumerate
  delen:
    - opgave: |-
        $x \geqslant 0$, $y \geqslant 0$, $2x + 3y \leqslant 12$, $x \leqslant 4$
      antwoord: |-
        $(0, 0)$, $(4, 0)$, $\bigl(4, \tfrac43\bigr)$, $(0, 4)$
      uitwerking: |-
        $x = 4$ in $2x + 3y = 12$: $3y = 4$.
        \figuren{\begin{tikzpicture}[scale=.3,font=\tiny]
          \path[gebied] (0,0) -- (4,0) -- (4,4/3) -- (0,4) -- cycle;
          \roosterom{0}{1}{2}{7}{0}{1}{2}{5}
          \begin{scope}\venster{0}{7}{0}{5}\grenslijn{2}{3}{12}\grenslijn{1}{0}{4}\end{scope}
        \end{tikzpicture}}
    - opgave: |-
        $x \geqslant 0$, $y \geqslant 1$, $x + y \leqslant 6$, $y \leqslant x + 2$
      antwoord: |-
        $(0, 1)$, $(5, 1)$, $(2, 4)$, $(0, 2)$
      uitwerking: |-
        $y = x + 2$ en $x + y = 6$: $2x + 2 = 6$, dus $(2, 4)$. $y = 1$ en $x + y = 6$: $(5, 1)$.
        \figuren{\begin{tikzpicture}[scale=.3,font=\tiny]
          \path[gebied] (0,1) -- (5,1) -- (2,4) -- (0,2) -- cycle;
          \roosterom{0}{1}{2}{7}{0}{1}{2}{6}
          \begin{scope}\venster{0}{7}{0}{6}\grenslijn{0}{1}{1}\grenslijn{1}{1}{6}\grenslijn{-1}{1}{2}\end{scope}
        \end{tikzpicture}}
    - opgave: |-
        $y \geqslant 0$, $2x + y \geqslant 4$, $x + y \leqslant 5$, $x \leqslant 4$
      antwoord: |-
        $(2, 0)$, $(4, 0)$, $(4, 1)$, $(-1, 6)$
      uitwerking: |-
        $2x + y = 4$ en $x + y = 5$: aftrekken geeft $x = -1$, dus $(-1, 6)$. Hier staat geen $x \geqslant 0$: het gebied loopt tot in het tweede kwadrant.
        \figuren{\begin{tikzpicture}[scale=.3,font=\tiny]
          \path[gebied] (2,0) -- (4,0) -- (4,1) -- (-1,6) -- cycle;
          \roosterom{-2}{1}{2}{6}{-1}{1}{2}{7}
          \begin{scope}\venster{-2}{6}{-1}{7}\grenslijn{2}{1}{4}\grenslijn{1}{1}{5}\grenslijn{1}{0}{4}\end{scope}
        \end{tikzpicture}}

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    voorwaarden vertalen
  opgave: |-
    Een jeugdbeweging gaat op kamp met $x$ leiders en $y$ leden. Schrijf als ongelijkheid.
  lijst: enumerate
  delen:
    - opgave: |-
        Per zes leden is er minstens één leider.
      antwoord: |-
        $y \leqslant 6x$
      uitwerking: |-
        Test: 4 leiders mogen hoogstens 24 leden meenemen, en $24 \leqslant 6 \cdot 4$.
    - opgave: |-
        De bus heeft 56 plaatsen.
      antwoord: |-
        $x + y \leqslant 56$
      uitwerking: |-
        Iedereen moet mee in de bus.
    - opgave: |-
        Er gaan minstens 30 leden mee.
      antwoord: |-
        $y \geqslant 30$
      uitwerking: |-
        \textit{Minstens} geeft $\geqslant$.
    - opgave: |-
        Hoogstens een kwart van wie meegaat, is leider.
      antwoord: |-
        $x \leqslant \tfrac14(x + y)$, of $3x \leqslant y$
      uitwerking: |-
        Een kwart van alle deelnemers: $4x \leqslant x + y$, dus $3x \leqslant y$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    stelsel bij een figuur
  opgave: |-
    Geef een stelsel ongelijkheden met dit oplossingsgebied.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        \begin{tikzpicture}[scale=.38,font=\scriptsize,baseline=(current bounding box.north)]
          \path[gebied] (0,0) -- (6,0) -- (6,2) -- (2,4) -- (0,4) -- cycle;
          \rooster{-1}{1}{7}{-1}{1}{5}
          \draw[grens] (0,0) -- (6,0) -- (6,2) -- (2,4) -- (0,4) -- cycle;
        \end{tikzpicture}
      antwoord: |-
        $x \geqslant 0$, $y \geqslant 0$, $x \leqslant 6$, $y \leqslant 4$, $x + 2y \leqslant 10$
      uitwerking: |-
        De schuine zijde door $(6, 2)$ en $(2, 4)$ heeft rico $-\tfrac12$: $y - 2 = -\tfrac12(x - 6)$, of $x + 2y = 10$. Testpunt $(1, 1)$.
    - opgave: |-
        \begin{tikzpicture}[scale=.38,font=\scriptsize,baseline=(current bounding box.north)]
          \path[gebied] (0,0) -- (4,0) -- (6,3) -- (2,3) -- cycle;
          \rooster{-1}{1}{7}{-1}{1}{4}
          \draw[grens] (2,3) -- (0,0) -- (4,0) -- (6,3);
          \draw[opengrens] (6,3) -- (2,3);
        \end{tikzpicture}
      antwoord: |-
        $y \geqslant 0$, $y < 3$, $3x - 2y \geqslant 0$, $3x - 2y \leqslant 12$
      uitwerking: |-
        De linkerzijde door $(0, 0)$ en $(2, 3)$: $y = \tfrac32 x$, of $3x - 2y = 0$. De rechterzijde is evenwijdig, door $(4, 0)$: $3x - 2y = 12$. De bovenkant staat in stippellijn. Testpunt $(3, 1)$: $3x - 2y = 7$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    oplossingsgebied lezen in een context
  figuur:
    opties: |-
      4.6cm
    code: |-
      \begin{tikzpicture}[scale=.075,font=\tiny]
        \path[gebied] (10,0) -- (40,0) -- (40,10) -- (20,30) -- (10,30) -- cycle;
        \roosterom{0}{5}{10}{50}{0}{5}{10}{40}
        \draw[grens] (10,0) -- (40,0) -- (40,10) -- (20,30) -- (10,30) -- cycle;
      \end{tikzpicture}
  opgave: |-
    Een fietsenwinkel verkoopt per maand $x$ stadsfietsen en $y$ elektrische fietsen. De figuur toont alle combinaties die aan de voorwaarden van de winkel voldoen.
  lijst: enumerate
  delen:
    - opgave: |-
        Kan de winkel 30 stadsfietsen en 20 elektrische fietsen verkopen? En 15 en 35?
      antwoord: |-
        ja (op de rand); nee
      uitwerking: |-
        $(30, 20)$ ligt op de schuine zijde, dus net wel. $(15, 35)$ ligt boven $y = 30$.
    - opgave: |-
        Welke ongelijkheid hoort bij de schuine zijde?
      antwoord: |-
        $x + y \leqslant 50$
      uitwerking: |-
        Door $(40, 10)$ en $(20, 30)$: rico $-1$, dus $x + y = 50$. De oorsprong ligt aan de goede kant.
    - opgave: |-
        Lees de andere voorwaarden af.
      antwoord: |-
        $x \geqslant 10$, $y \geqslant 0$, $x \leqslant 40$, $y \leqslant 30$
      uitwerking: |-
        De verticale zijden liggen op $x = 10$ en $x = 40$, de horizontale op $y = 0$ en $y = 30$.
    - opgave: |-
        Hoeveel fietsen verkoopt de winkel hoogstens per maand?
      antwoord: |-
        50
      uitwerking: |-
        $x + y \leqslant 50$, met gelijkheid op de schuine zijde.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    eigenschappen, redeneren
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Als $c \geqslant 0$, dan ligt de oorsprong in het halfvlak $ax + by \leqslant c$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $a \cdot 0 + b \cdot 0 = 0 \leqslant c$.
    - opgave: |-
        De ongelijkheden $x + y \leqslant 4$ en $2x + 2y \leqslant 8$ hebben dezelfde oplossingen.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: vermenigvuldigen met het positieve getal 2 verandert niets.
    - opgave: |-
        De ongelijkheden $-x - y \geqslant -4$ en $x + y \geqslant 4$ hebben dezelfde oplossingen.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: vermenigvuldigen met $-1$ keert het teken om, $-x - y \geqslant -4 \iff x + y \leqslant 4$.
    - opgave: |-
        Een stelsel van drie ongelijkheden heeft hoogstens drie hoekpunten.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: drie rechten hebben hoogstens drie snijpunten (een per paar).
    - opgave: |-
        Elk oplossingsgebied dat niet leeg is, heeft een hoekpunt.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: een halfvlak of een strook tussen twee evenwijdige rechten heeft er geen.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    oplossingsgebied in een context, gewijzigde voorwaarde
  opgave: |-
    Lotte uit het probleem krijgt opslag: in het ijssalon verdient ze nu 12 euro per uur. De andere voorwaarden blijven.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke ongelijkheid verandert, en hoe?
      antwoord: |-
        $12x + 20y \geqslant 160$, of $3x + 5y \geqslant 40$
      uitwerking: |-
        Het loon wordt $12x + 20y$. Gedeeld door 4: $3x + 5y \geqslant 40$.
    - opgave: |-
        Teken het nieuwe oplossingsgebied en bepaal de hoekpunten. Vergeet $y \geqslant 0$ niet.
      antwoord: |-
        $(5, 5)$, $(5, 6)$, $(9, 6)$, $(15, 0)$, $\bigl(\tfrac{40}{3}, 0\bigr)$
      uitwerking: |-
        $x = 5$ in $3x + 5y = 40$ geeft $y = 5$. Op $y = 0$: $x = \tfrac{40}{3}$ en $x = 15$. Nu is $y \geqslant 0$ wel een grens: het gebied is een vijfhoek.
        \figuren{\begin{tikzpicture}[scale=.28,font=\tiny]
          \path[gebied] (5,5) -- (5,6) -- (9,6) -- (15,0) -- (40/3,0) -- cycle;
          \roosterom{0}{1}{2}{16}{0}{1}{2}{8}
          \begin{scope}\venster{0}{16.5}{0}{8.5}\grenslijn{1}{0}{5}\grenslijn{0}{1}{6}\grenslijn{1}{1}{15}\grenslijn{3}{5}{40}\end{scope}
        \end{tikzpicture}}
    - opgave: |-
        Kan Lotte nu ook zonder bijles haar 160 euro verdienen?
      antwoord: |-
        ja, met $13\tfrac13$ tot 15 uur ijssalon
      uitwerking: |-
        Het gebied raakt nu de $x$-as, tussen $x = \tfrac{40}{3}$ en $x = 15$.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    leeg oplossingsgebied
  opgave: |-
    Neem het stelsel $x + y \geqslant 6$, $x \leqslant 2$ en $y \leqslant 3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de grensrechten elkaar twee aan twee snijden, maar dat het stelsel geen oplossingen heeft.
      antwoord: |-
        snijpunten $(2, 4)$, $(3, 3)$, $(2, 3)$; $x + y \leqslant 5$
      uitwerking: |-
        De snijpunten zijn $(2, 4)$, $(3, 3)$ en $(2, 3)$. Uit $x \leqslant 2$ en $y \leqslant 3$ volgt $x + y \leqslant 5 < 6$: geen enkel punt voldoet.
    - opgave: |-
        Verander het getal 6 zo dat het oplossingsgebied precies één punt is.
      antwoord: |-
        5: alleen $(2, 3)$
      uitwerking: |-
        Met $x + y \geqslant 5$ moet $x + y = 5$, $x = 2$ en $y = 3$.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    punt met een parameter in een gebied
  opgave: |-
    Neem het oplossingsgebied van $x + y \leqslant 6$, $y \geqslant x - 1$ en $y \geqslant 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $k$ ligt het punt $(2, k)$ in het gebied?
      antwoord: |-
        $1 \leqslant k \leqslant 4$
      uitwerking: |-
        $2 + k \leqslant 6$, $k \geqslant 1$ en $k \geqslant 0$.
    - opgave: |-
        Voor welke $k$ ligt het punt $(k, k)$ in het gebied?
      antwoord: |-
        $0 \leqslant k \leqslant 3$
      uitwerking: |-
        $2k \leqslant 6$, $k \geqslant k - 1$ (altijd waar) en $k \geqslant 0$.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    model opstellen met een percentage
  opgave: |-
    Een notenwinkel mengt $x$ kg pinda's van 4 euro per kg met $y$ kg cashewnoten van 12 euro per kg. Het mengsel weegt hoogstens 10 kg, bevat minstens 40\,\% cashewnoten, en de noten kosten samen hoogstens 80 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf het stelsel op.
      antwoord: |-
        $x, y \geqslant 0$, $x + y \leqslant 10$, $2x \leqslant 3y$, $x + 3y \leqslant 20$
      uitwerking: |-
        $y \geqslant 0{,}4(x + y) \iff 0{,}6y \geqslant 0{,}4x \iff 2x \leqslant 3y$. Kosten: $4x + 12y \leqslant 80$, gedeeld door 4.
    - opgave: |-
        Teken het oplossingsgebied en bepaal de hoekpunten.
      antwoord: |-
        $(0, 0)$, $(6, 4)$, $(5, 5)$, $\bigl(0, \tfrac{20}{3}\bigr)$
      uitwerking: |-
        $2x = 3y$ en $x + y = 10$: $(6, 4)$. $x + y = 10$ en $x + 3y = 20$: $2y = 10$, dus $(5, 5)$. Op $x = 0$: $y = \tfrac{20}{3}$.
        \figuren{\begin{tikzpicture}[scale=.3,font=\tiny]
          \path[gebied] (0,0) -- (6,4) -- (5,5) -- (0,20/3) -- cycle;
          \roosterom{0}{1}{2}{10}{0}{1}{2}{8}
          \begin{scope}\venster{0}{10.5}{0}{8.5}\grenslijn{1}{1}{10}\grenslijn{2}{-3}{0}\grenslijn{1}{3}{20}\end{scope}
        \end{tikzpicture}}
    - opgave: |-
        Kan de winkel 6 kg pinda's mengen met 4 kg cashewnoten?
      antwoord: |-
        ja, net
      uitwerking: |-
        $(6, 4)$ is een hoekpunt: precies 10 kg, precies 40\,\% cashewnoten, en $24 + 48 = 72 \leqslant 80$ euro.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    stelsel bij een driehoek
  opgave: |-
    Geef een stelsel ongelijkheden met als oplossingsgebied de driehoek met hoekpunten $A(-1, 0)$, $B(3, 2)$ en $C(0, 4)$.
  antwoord: |-
    $x - 2y \leqslant -1$, $2x + 3y \leqslant 12$, $4x - y \geqslant -4$
  uitwerking: |-
    $AB$: rico $\tfrac12$, $y = \tfrac12(x + 1)$, of $x - 2y = -1$. $BC$: rico $-\tfrac23$, $y = -\tfrac23 x + 4$, of $2x + 3y = 12$. $CA$: rico 4, $y = 4x + 4$, of $4x - y = -4$. Testpunt: het zwaartepunt $\bigl(\tfrac23, 2\bigr)$ geeft $x - 2y = -\tfrac{10}{3} \leqslant -1$, $2x + 3y = \tfrac{22}{3} \leqslant 12$ en $4x - y = \tfrac23 \geqslant -4$.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    roosterpunten in een gebied
  opgave: |-
    Hoeveel punten met gehele coördinaten liggen in het oplossingsgebied?
  lijst: enumerate
  delen:
    - opgave: |-
        $x \geqslant 0$, $y \geqslant 0$, $x + 2y \leqslant 6$
      antwoord: |-
        16
      uitwerking: |-
        Tel per $y$: voor $y = 0$ is $x$ van 0 tot 6 (7 punten), voor $y = 1$ van 0 tot 4 (5), voor $y = 2$ van 0 tot 2 (3), voor $y = 3$ alleen 0 (1).
    - opgave: |-
        $x \geqslant 0$, $y \geqslant 0$, $x + 2y < 6$
      antwoord: |-
        12
      uitwerking: |-
        De punten op de grensrechte vallen weg: $(6, 0)$, $(4, 1)$, $(2, 2)$ en $(0, 3)$. Er blijven $16 - 4 = 12$.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    oplossingsgebied in een context
  opgave: |-
    Neem de voorwaarden van het kamp uit opdracht~\ref{oef:h1-o4}.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken het oplossingsgebied, met $x$ horizontaal, en bepaal de hoekpunten.
      antwoord: |-
        $(5, 30)$, $(10, 30)$, $(14, 42)$, $(8, 48)$
      uitwerking: |-
        $y = 30$ met $y = 6x$ en met $y = 3x$: $(5, 30)$ en $(10, 30)$. $x + y = 56$ met $y = 3x$: $4x = 56$, dus $(14, 42)$; met $y = 6x$: $7x = 56$, dus $(8, 48)$.
        \figuren{\begin{tikzpicture}[scale=.08,font=\tiny]
          \path[gebied] (5,30) -- (10,30) -- (14,42) -- (8,48) -- cycle;
          \roosterom{0}{2}{4}{20}{0}{5}{10}{60}
          \begin{scope}\venster{0}{20.5}{0}{60.5}\grenslijn{-6}{1}{0}\grenslijn{1}{1}{56}\grenslijn{0}{1}{30}\grenslijn{3}{-1}{0}\end{scope}
        \end{tikzpicture}}
    - opgave: |-
        Hoeveel leiders kunnen er hoogstens mee? En hoeveel leden?
      antwoord: |-
        14 leiders; 48 leden
      uitwerking: |-
        De grootste $x$ in het gebied is 14, in $(14, 42)$. De grootste $y$ is 48, in $(8, 48)$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    hoekpunten exact berekenen
  opgave: |-
    Neem het stelsel $x \geqslant 0$, $y \geqslant 0$, $3x + 2y \leqslant 12$, $x - 2y \leqslant 2$ en $-x + 3y \leqslant 6$.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken het oplossingsgebied.
      antwoord: |-
        een vijfhoek
      uitwerking: |-
        \figuren{\begin{tikzpicture}[scale=.38,font=\tiny]
          \path[gebied] (0,0) -- (2,0) -- (3.5,.75) -- (24/11,30/11) -- (0,2) -- cycle;
          \roosterom{-1}{1}{1}{5}{-1}{1}{1}{4}
          \begin{scope}\venster{-1}{5.5}{-1}{4.5}\grenslijn{3}{2}{12}\grenslijn{1}{-2}{2}\grenslijn{-1}{3}{6}\end{scope}
        \end{tikzpicture}}
    - opgave: |-
        Bereken de hoekpunten exact.
      antwoord: |-
        $(0, 0)$, $(2, 0)$, $\bigl(\tfrac72, \tfrac34\bigr)$, $\bigl(\tfrac{24}{11}, \tfrac{30}{11}\bigr)$, $(0, 2)$
      uitwerking: |-
        $3x + 2y = 12$ en $x - 2y = 2$: optellen geeft $4x = 14$, dus $x = \tfrac72$ en $y = \tfrac34$. $3x + 2y = 12$ en $-x + 3y = 6$: $x = 3y - 6$ geeft $11y = 30$, dus $y = \tfrac{30}{11}$ en $x = \tfrac{24}{11}$.
    - opgave: |-
        Ligt het punt $(2, 2)$ in het gebied?
      antwoord: |-
        ja
      uitwerking: |-
        $10 \leqslant 12$, $-2 \leqslant 2$ en $4 \leqslant 6$.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    onbegrensd gebied in een context
  opgave: |-
    Een dierenasiel geeft zijn konijnen per week $x$ kg brokken van soort A en $y$ kg van soort B. Een kg A bevat 2 eenheden vezels en 1 eenheid eiwit, een kg B 1 eenheid vezels en 3 eenheden eiwit. De konijnen hebben samen minstens 10 eenheden vezels en 15 eenheden eiwit nodig.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf het stelsel op.
      antwoord: |-
        $x, y \geqslant 0$, $2x + y \geqslant 10$, $x + 3y \geqslant 15$
      uitwerking: |-
        Vezels: $2x + y$, eiwit: $x + 3y$.
    - opgave: |-
        Teken het oplossingsgebied en bepaal de hoekpunten.
      antwoord: |-
        $(0, 10)$, $(3, 4)$, $(15, 0)$; onbegrensd
      uitwerking: |-
        $y = 10 - 2x$ in $x + 3y = 15$: $x + 30 - 6x = 15$, dus $x = 3$ en $y = 4$.
        \figuren{\begin{tikzpicture}[scale=.22,font=\tiny]
          \path[gebied] (0,12) -- (0,10) -- (3,4) -- (15,0) -- (17,0) -- (17,12) -- cycle;
          \roosterom{0}{1}{4}{16}{0}{1}{2}{11}
          \begin{scope}\venster{0}{17}{0}{12}\grenslijn{2}{1}{10}\grenslijn{1}{3}{15}\end{scope}
        \end{tikzpicture}}
    - opgave: |-
        Het gebied is onbegrensd. Waarom is dat hier geen probleem?
      antwoord: |-
        meer voer mag altijd
      uitwerking: |-
        Er staan alleen ondergrenzen: meer voer geven voldoet altijd. In hoofdstuk 2 zoeken we de goedkoopste combinatie, en die ligt niet ver weg.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    gehele oplossingen in een context
  opgave: |-
    Een school huurt $x$ bussen met 50 plaatsen en $y$ minibusjes met 20 plaatsen voor 230 leerlingen. Er zijn maar 7 chauffeurs.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf het stelsel op.
      antwoord: |-
        $x, y \geqslant 0$ en geheel, $5x + 2y \geqslant 23$, $x + y \leqslant 7$
      uitwerking: |-
        Plaatsen: $50x + 20y \geqslant 230$, gedeeld door 10. Chauffeurs: $x + y \leqslant 7$.
    - opgave: |-
        Teken het oplossingsgebied en duid de mogelijke combinaties aan. Hoeveel zijn er?
      antwoord: |-
        9
      uitwerking: |-
        $(3, 4)$, $(4, 2)$, $(4, 3)$, $(5, 0)$, $(5, 1)$, $(5, 2)$, $(6, 0)$, $(6, 1)$, $(7, 0)$.
        \figuren{\begin{tikzpicture}[scale=.35,font=\tiny]
          \path[gebied] (23/5,0) -- (7,0) -- (3,4) -- cycle;
          \rooster{0}{1}{8}{0}{1}{8}
          \begin{scope}\venster{0}{8.5}{0}{8.5}\grenslijn{5}{2}{23}\grenslijn{1}{1}{7}\end{scope}
          \foreach \p in {(3,4),(4,2),(4,3),(5,0),(5,1),(5,2),(6,0),(6,1),(7,0)} \fill[accent] \p circle (5pt);
        \end{tikzpicture}}
    - opgave: |-
        Met hoeveel voertuigen kan het minimaal?
      antwoord: |-
        5 bussen
      uitwerking: |-
        Bij $(5, 0)$ is $x + y = 5$, en elke andere combinatie heeft er meer.

- id: h1-o18
  soort: opdracht
  niveau: 3
  thema: |-
    normaalvector van een halfvlak
  opgave: |-
    Neem de rechte $l \leftrightarrow ax + by = c$, met $a$ en $b$ niet allebei nul.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de vector $(a, b)$ loodrecht staat op $l$.
      antwoord: |-
        $(b, -a)$ is een richtingsvector, en $(a, b) \cdot (b, -a) = 0$
      uitwerking: |-
        Liggen $P$ en $Q$ op $l$, dan is $a(x_Q - x_P) + b(y_Q - y_P) = c - c = 0$: het scalair product van $(a, b)$ met $\overrightarrow{PQ}$ is 0.
    - opgave: |-
        Neem $P$ op $l$ en $t > 0$. Toon aan dat $P + t\,(a, b)$ in het halfvlak $ax + by > c$ ligt.
      antwoord: |-
        $ax + by = c + t(a^2 + b^2) > c$
      uitwerking: |-
        $a(x_P + ta) + b(y_P + tb) = ax_P + by_P + t(a^2 + b^2) = c + t(a^2 + b^2)$, en $a^2 + b^2 > 0$. De vector $(a, b)$ wijst dus naar de kant waar $ax + by > c$.
    - opgave: |-
        Gebruik dat om zonder testpunt te zeggen aan welke kant $3x - 4y > 12$ ligt.
      antwoord: |-
        in de richting van $(3, -4)$: rechts onder
      uitwerking: |-
        De vector $(3, -4)$ wijst naar rechts en naar onder: het halfvlak ligt rechts onder de grensrechte. Controle met $(0, 0)$: $0 > 12$ is vals, en de oorsprong ligt links boven.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    open gebied zonder hoekpunten
  opgave: |-
    Neem het stelsel $x > 0$, $y > 0$ en $x + y < 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken het oplossingsgebied.
      antwoord: |-
        de driehoek met hoekpunten $(0, 0)$, $(1, 0)$, $(0, 1)$, zonder rand
      uitwerking: |-
        Alle drie de zijden staan in stippellijn.
    - opgave: |-
        Heeft het gebied hoekpunten volgens de definitie? Verklaar.
      antwoord: |-
        nee
      uitwerking: |-
        De drie snijpunten $(0, 0)$, $(1, 0)$ en $(0, 1)$ voldoen niet aan alle (strikte) ongelijkheden. Er is dus geen hoekpunt, al zie je een driehoek.
    - opgave: |-
        Bestaat er een punt van het gebied met de grootste $x$? Wat zegt dat over strikte ongelijkheden?
      antwoord: |-
        nee
      uitwerking: |-
        Voor elk punt $(x, y)$ van het gebied ligt ook $\bigl(\tfrac{x + 1 - y}{2}, y\bigr)$ erin, met een grotere $x$. Bij strikte ongelijkheden kan een grootste waarde ontbreken. Daarom gebruikt lineair programmeren alleen $\leqslant$ en $\geqslant$.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    aantal hoekpunten
  opgave: |-
    Een stelsel heeft vier ongelijkheden.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel snijpunten kunnen de vier grensrechten hoogstens hebben?
      antwoord: |-
        6
      uitwerking: |-
        Een snijpunt per paar rechten: $\binom42 = 6$.
    - opgave: |-
        Toon aan dat het oplossingsgebied toch hoogstens vier hoekpunten heeft, als het begrensd is.
      antwoord: |-
        elke zijde ligt op een andere grensrechte
      uitwerking: |-
        Een zijde ligt op een grensrechte. Het gebied is convex, en een rechte snijdt een convex gebied in één lijnstuk: elke grensrechte draagt dus hoogstens één zijde. Er zijn dus hoogstens vier zijden, en een veelhoek heeft evenveel hoekpunten als zijden.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    regelmatige zeshoek als oplossingsgebied
  opgave: |-
    De regelmatige zeshoek met middelpunt $(0, 0)$ heeft hoekpunten $(\pm2, 0)$ en $\bigl(\pm1, \pm\sqrt3\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een stelsel met de zeshoek als oplossingsgebied.
      antwoord: |-
        $|y| \leqslant \sqrt3$, $\sqrt3\,x + y \leqslant 2\sqrt3$, $\sqrt3\,x - y \leqslant 2\sqrt3$, $-\sqrt3\,x + y \leqslant 2\sqrt3$, $-\sqrt3\,x - y \leqslant 2\sqrt3$
      uitwerking: |-
        Bovenkant $y = \sqrt3$ en onderkant $y = -\sqrt3$. De zijde door $(2, 0)$ en $(1, \sqrt3)$ heeft rico $-\sqrt3$: $y = -\sqrt3(x - 2)$, of $\sqrt3\,x + y = 2\sqrt3$. De andere drie volgen door te spiegelen om de assen. De oorsprong voldoet overal.
    - opgave: |-
        Ligt het punt $(1{,}5;\ 1)$ in de zeshoek?
      antwoord: |-
        nee
      uitwerking: |-
        $\sqrt3 \cdot 1{,}5 + 1 \approx 3{,}60$ is groter dan $2\sqrt3 \approx 3{,}46$.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    absolute waarden, convex of niet
  opgave: |-
    Neem de ongelijkheid $|x| + |y| \leqslant 2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf ze als stelsel van vier eerstegraadsongelijkheden.
      antwoord: |-
        $\pm x \pm y \leqslant 2$
      uitwerking: |-
        $|x| + |y|$ is de grootste van $x + y$, $x - y$, $-x + y$ en $-x - y$. Ze is dus $\leqslant 2$ als alle vier $\leqslant 2$ zijn.
    - opgave: |-
        Teken het oplossingsgebied.
      antwoord: |-
        het vierkant met hoekpunten $(\pm2, 0)$, $(0, \pm2)$
      uitwerking: |-
        Een vierkant op zijn punt.
        \figuren{\begin{tikzpicture}[scale=.3,font=\tiny]
          \path[gebied] (2,0) -- (0,2) -- (-2,0) -- (0,-2) -- cycle;
          \rooster{-3}{1}{3}{-3}{1}{3}
          \draw[grens] (2,0) -- (0,2) -- (-2,0) -- (0,-2) -- cycle;
        \end{tikzpicture}}
    - opgave: |-
        Kan $|x| + |y| \geqslant 2$ het oplossingsgebied van een stelsel eerstegraadsongelijkheden zijn?
      antwoord: |-
        nee
      uitwerking: |-
        Nee, het is niet convex: $(2, 0)$ en $(-2, 0)$ voldoen, maar het midden $(0, 0)$ niet.

# --- Koppel -----------------------------------------------------------------------------

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Algemene functies
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.32,font=\tiny]
        \fill[accent!22] plot[domain=-2:3,samples=40] (\x,{(\x)^2-4}) -- cycle;
        \rooster{-3}{1}{4}{-4}{1}{6}
        \kromme{-2.8}{3.3}{(\x)^2-4}
        \begin{scope}\clip (-3,-4) rectangle (4,6);\draw[grens] (-3,-1) -- (4,6);\end{scope}
      \end{tikzpicture}
  opgave: |-
    Het gebied in de figuur bestaat uit de punten met $y \geqslant x^2 - 4$ en $y \leqslant x + 2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de snijpunten van de parabool en de rechte.
      antwoord: |-
        $(-2, 0)$ en $(3, 5)$
      uitwerking: |-
        $x^2 - 4 = x + 2 \iff x^2 - x - 6 = 0 \iff (x - 3)(x + 2) = 0$.
    - opgave: |-
        Is het gebied convex? Verklaar met de figuur.
      antwoord: |-
        ja
      uitwerking: |-
        Ja: de parabool is naar boven gebogen, dus een koorde tussen twee punten boven de parabool blijft erboven. Ook de rechte geeft een convex halfvlak, en de doorsnede is convex.
    - opgave: |-
        Kan het gebied het oplossingsgebied van een stelsel eerstegraadsongelijkheden zijn?
      antwoord: |-
        nee
      uitwerking: |-
        Nee: de rand is gebogen. Een oplossingsgebied van eerstegraadsongelijkheden heeft rechte zijden. Convex is dus nodig, maar niet genoeg.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Ruimtemeetkunde
  opgave: |-
    In de ruimte bekijken we de punten $(x, y, z)$ met $x \geqslant 0$, $y \geqslant 0$, $z \geqslant 0$ en $x + y + 2z \leqslant 4$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom ligt de verzameling punten met $x + y + 2z \leqslant 4$ aan één kant van een vlak?
      antwoord: |-
        $x + y + 2z = 4$ is een vlak
      uitwerking: |-
        $x + y + 2z = 4$ is de vergelijking van een vlak. Net zoals in het vlak liggen de punten met $<$ aan de ene kant en die met $>$ aan de andere: een halfruimte.
    - opgave: |-
        Het gebied is een viervlak. Bepaal de hoekpunten.
      antwoord: |-
        $(0, 0, 0)$, $(4, 0, 0)$, $(0, 4, 0)$, $(0, 0, 2)$
      uitwerking: |-
        Het grensvlak snijdt de assen in $(4, 0, 0)$, $(0, 4, 0)$ en $(0, 0, 2)$.
    - opgave: |-
        Bereken het volume.
      antwoord: |-
        $\tfrac{16}{3}$
      uitwerking: |-
        Grondvlak een rechthoekige driehoek met oppervlakte $\tfrac12 \cdot 4 \cdot 4 = 8$, hoogte 2: $\tfrac13 \cdot 8 \cdot 2 = \tfrac{16}{3}$.

- id: h1-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: |-
      Kansrekenen
  opgave: |-
    Kies twee getallen $x$ en $y$ toevallig en onafhankelijk tussen 0 en 1. Een punt $(x, y)$ ligt dan toevallig in het eenheidsvierkant, en de kans op een gebied is zijn oppervlakte. Bereken de kans.
  lijst: enumerate
  delen:
    - opgave: |-
        $x + 2y \leqslant 1$
      antwoord: |-
        $\tfrac14$
      uitwerking: |-
        De driehoek met hoekpunten $(0, 0)$, $(1, 0)$ en $\bigl(0, \tfrac12\bigr)$: oppervlakte $\tfrac12 \cdot 1 \cdot \tfrac12$.
    - opgave: |-
        $y \leqslant x$ en $x + y \leqslant 1$
      antwoord: |-
        $\tfrac14$
      uitwerking: |-
        De driehoek met hoekpunten $(0, 0)$, $(1, 0)$ en $\bigl(\tfrac12, \tfrac12\bigr)$: oppervlakte $\tfrac12 \cdot 1 \cdot \tfrac12$.
    - opgave: |-
        $x$ en $y$ verschillen hoogstens $\tfrac12$
      antwoord: |-
        $\tfrac34$
      uitwerking: |-
        $-\tfrac12 \leqslant x - y \leqslant \tfrac12$: een strook. Wat wegvalt, zijn twee driehoeken met oppervlakte $\tfrac18$: $1 - \tfrac14 = \tfrac34$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Teken de oplossingen van $2x - 3y > 6$.
  antwoord: |-
    onder de rechte door $(3, 0)$ en $(0, -2)$, stippellijn
  uitwerking: |-
    Testpunt $(0, 0)$: $0 > 6$ is vals, dus de kant zonder de oorsprong.
    \figuren{\halfvlakfig[opengrens]{-2}{3}{-6}{-2}{5}{-4}{3}}

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Bepaal de hoekpunten van het oplossingsgebied van $x \geqslant 0$, $y \geqslant 2$, $x + y \leqslant 8$ en $y \leqslant 2x + 2$.
  antwoord: |-
    $(0, 2)$, $(6, 2)$, $(2, 6)$
  uitwerking: |-
    $y = 2$ met $x + y = 8$: $(6, 2)$; met $y = 2x + 2$: $(0, 2)$. $x + y = 8$ en $y = 2x + 2$: $3x = 6$, dus $(2, 6)$. Het snijpunt $(0, 8)$ van $x = 0$ en $x + y = 8$ voldoet niet aan $y \leqslant 2x + 2$.

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Teken het oplossingsgebied van $x \geqslant 1$, $y \geqslant 0$, $x + y \geqslant 3$. Is het begrensd? Geef de hoekpunten.
  antwoord: |-
    onbegrensd; $(1, 2)$ en $(3, 0)$
  uitwerking: |-
    Het gebied ligt rechts van $x = 1$, boven de $x$-as en boven $x + y = 3$. Het loopt eindeloos naar rechts en naar boven.

- id: h1-t4
  soort: test
  niveau: 1
  opgave: |-
    Geef een stelsel met als oplossingsgebied de driehoek met hoekpunten $(0, 1)$, $(4, 1)$ en $(0, 5)$.
  antwoord: |-
    $x \geqslant 0$, $y \geqslant 1$, $x + y \leqslant 5$
  uitwerking: |-
    De schuine zijde door $(4, 1)$ en $(0, 5)$ heeft rico $-1$. Testpunt $(1, 2)$.

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    Een fruitboer verkoopt $x$ kg appels en $y$ kg peren. Vertaal: hij verkoopt minstens drie keer zoveel appels als peren, en hoogstens 40\,\% van wat hij verkoopt, zijn peren.
  antwoord: |-
    $x \geqslant 3y$ en $3y \leqslant 2x$
  uitwerking: |-
    $y \leqslant 0{,}4(x + y) \iff 0{,}6y \leqslant 0{,}4x \iff 3y \leqslant 2x$. De tweede voorwaarde volgt hier uit de eerste.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Kan het gebied het oplossingsgebied van een stelsel eerstegraadsongelijkheden zijn? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        de punten met $y \geqslant |x|$
      antwoord: |-
        ja
      uitwerking: |-
        Ja: $y \geqslant |x| \iff y \geqslant x$ en $y \geqslant -x$.
    - opgave: |-
        de punten met $y \leqslant |x|$
      antwoord: |-
        nee
      uitwerking: |-
        Nee, niet convex: $(-2, 1)$ en $(2, 1)$ voldoen, maar hun midden $(0, 1)$ niet.

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Sven traint per week $x$ uur lopen en $y$ uur zwemmen: samen hoogstens 8 uur, minstens 2 uur zwemmen, en minstens evenveel lopen als zwemmen. Teken het oplossingsgebied en geef de hoekpunten.
  antwoord: |-
    $(2, 2)$, $(6, 2)$, $(4, 4)$
  uitwerking: |-
    $x + y \leqslant 8$, $y \geqslant 2$, $x \geqslant y$. Snijpunten: $y = 2$ met $x = y$ en met $x + y = 8$, en $x = y$ met $x + y = 8$.
