# Oefeningen van hoofdstuk 3. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        De beginwaarde van \eur 2000 over 3 jaar, aan 4\,\% per jaar.
      antwoord: |-
        $\approx 1777{,}99$ euro
      uitwerking: |-
        $2000 \cdot 1{,}04^{-3} \approx 1777{,}99$ euro.
    - opgave: |-
        $1{,}03^{-1} + 1{,}03^{-2} + 1{,}03^{-3} + 1{,}03^{-4} + 1{,}03^{-5}$, met de somformule van een meetkundige rij.
      antwoord: |-
        $\approx 4{,}5797$
      uitwerking: |-
        Vijf termen, eerste term $1{,}03^{-1}$, quotiënt $1{,}03^{-1}$: $1{,}03^{-1} \cdot \frac{1 - 1{,}03^{-5}}{1 - 1{,}03^{-1}} = \frac{1 - 1{,}03^{-5}}{0{,}03} \approx 4{,}5797$.
    - opgave: |-
        De maandrente die gelijkwaardig is met 5\,\% per jaar.
      antwoord: |-
        $\approx 0{,}4074\,\%$
      uitwerking: |-
        $1{,}05^{\frac1{12}} - 1 \approx 0{,}004\,074$.
    - opgave: |-
        $400 + 320 + 240 + 160 + 80$, met de somformule van een rekenkundige rij.
      antwoord: |-
        1200
      uitwerking: |-
        Vijf termen: $5 \cdot \frac{400 + 80}{2} = 1200$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Je leent \eur 1000 aan 1\,\% per maand. Op het einde van elke maand betaal je \eur 100. De bank rekent eerst de rente op wat je nog schuldig bent; de rest van je betaling gaat van de schuld af.
  lijst: enumerate
  delen:
    - opgave: |-
        Vul aan voor de eerste drie maanden: rente, wat van de schuld afgaat, en de schuld op het einde van de maand.
      antwoord: |-
        10; 90; 910. 9,10; 90,90; 819,10. 8,19; 91,81; 727,29
      uitwerking: |-
        Maand 1: rente $0{,}01 \cdot 1000 = 10$, aflossing $100 - 10 = 90$, schuld 910. Maand 2: rente 9,10, aflossing 90,90, schuld 819,10. Maand 3: rente 8,19, aflossing 91,81, schuld 727,29.
    - opgave: |-
        Waarom wordt het deel dat van de schuld afgaat elke maand groter? Met welke factor?
      antwoord: |-
        de rente daalt; factor 1,01
      uitwerking: |-
        De schuld daalt, dus ook de rente, en van de vaste \eur 100 blijft meer over. $\frac{90{,}90}{90} = 1{,}01$ en $\frac{91{,}81}{90{,}90} = 1{,}01$.
    - opgave: |-
        Na 5 maanden heb je \eur 500 betaald. Is de schuld dan \eur 500?
      antwoord: |-
        nee, $\approx 540{,}91$ euro
      uitwerking: |-
        Een deel van elke betaling was rente. Na 5 maanden is de schuld ongeveer \eur 540,91.

- id: h3-beginwaarde
  soort: kort
  opgave: |-
    Hoeveel kun je lenen? De betalingen vallen op het einde van elke periode.
  lijst: enumerate
  delen:
    - opgave: |-
        \eur 450 per maand, 6 jaar lang, aan 4,2\,\% per jaar.
      antwoord: |-
        $\approx 28\,661{,}52$ euro
      uitwerking: |-
        $\im = 1{,}042^{\frac1{12}} - 1$, $n = 72$: $B = 450 \cdot \frac{1 - \um^{-72}}{\im} \approx 28\,661{,}52$ euro.
    - opgave: |-
        \eur 12\,000 per jaar, 15 jaar lang, aan 3\,\% per jaar.
      antwoord: |-
        $\approx 143\,255{,}22$ euro
      uitwerking: |-
        $B = 12\,000 \cdot \frac{1 - 1{,}03^{-15}}{0{,}03} \approx 143\,255{,}22$ euro.
    - opgave: |-
        \eur 300 per trimester, 5 jaar lang, aan 2,4\,\% per jaar.
      antwoord: |-
        $\approx 5641{,}15$ euro
      uitwerking: |-
        $i_4 = 1{,}024^{\frac14} - 1$, $n = 20$: $B \approx 5641{,}15$ euro.

- id: h3-termijn
  soort: kort
  opgave: |-
    Bereken het termijnbedrag en de totale rente. De betalingen vallen op het einde van elke periode.
  lijst: enumerate
  delen:
    - opgave: |-
        \eur 25\,000 in 5 jaar, maandelijks, aan 4,9\,\% per jaar.
      antwoord: |-
        $\approx 469{,}42$ euro; $\approx 3165$ euro
      uitwerking: |-
        $\im = 1{,}049^{\frac1{12}} - 1$, $n = 60$: $a \approx 469{,}42$ euro; rente $60 \cdot 469{,}42 - 25\,000 \approx 3165$ euro.
    - opgave: |-
        \eur 250\,000 in 25 jaar, maandelijks, aan 3,1\,\% per jaar.
      antwoord: |-
        $\approx 1192{,}93$ euro; $\approx 107\,878$ euro
      uitwerking: |-
        $n = 300$: $a \approx 1192{,}93$ euro; rente $300 \cdot 1192{,}93 - 250\,000 \approx 107\,878$ euro.
    - opgave: |-
        \eur 9000 in 3 jaar, per trimester, aan 6\,\% per jaar.
      antwoord: |-
        $\approx 823{,}44$ euro; $\approx 881$ euro
      uitwerking: |-
        $i_4 = 1{,}06^{\frac14} - 1 \approx 0{,}014\,674$, $n = 12$: $a \approx 823{,}44$ euro; rente $\approx 881$ euro.

- id: h3-looptijd
  soort: kort
  opgave: |-
    Hoeveel maandelijkse betalingen zijn nodig? De betalingen vallen op het einde van de maand.
  lijst: enumerate
  delen:
    - opgave: |-
        \eur 12\,000 lenen aan 5\,\% per jaar, met \eur 300 per maand. Hoeveel is de laatste betaling?
      antwoord: |-
        44 betalingen; de laatste $\approx 225{,}74$ euro
      uitwerking: |-
        $n = -\frac{\log(1 - 12\,000\,\im/300)}{\log \um} \approx 43{,}75$. Na 43 betalingen is de schuld $12\,000\,\um^{43} - 300\,\frac{\um^{43} - 1}{\im} \approx 224{,}83$; een maand later betaal je $224{,}83 \cdot \um \approx 225{,}74$ euro.
    - opgave: |-
        \eur 50\,000 lenen aan 6\,\% per jaar, met \eur 250 per maand.
      antwoord: |-
        748 betalingen (ruim 62 jaar)
      uitwerking: |-
        De rente in de eerste maand is $50\,000 \cdot \im \approx 243{,}38$ euro, net iets minder dan 250. $n \approx 747{,}8$: de lening raakt pas na meer dan 62 jaar afbetaald.
    - opgave: |-
        \eur 50\,000 lenen aan 6\,\% per jaar, met \eur 200 per maand.
      antwoord: |-
        onmogelijk
      uitwerking: |-
        $200 < 50\,000\,\im \approx 243{,}38$: de betaling dekt de rente niet, de schuld groeit elke maand.

- id: h3-tabel
  soort: kort
  opgave: |-
    Een lening van \eur 6000 wordt in 3 jaar afgelost met een vaste annuïteit op het einde van elk jaar, aan 5\,\% per jaar. Stel de aflossingstabel op.
  antwoord: |-
    $a \approx 2203{,}25$; rentedelen 300; 204,84; 104,92; aflossingsdelen 1903,25; 1998,41; 2098,33
  uitwerking: |-
    $a = \frac{6000 \cdot 0{,}05}{1 - 1{,}05^{-3}} \approx 2203{,}25$. Jaar 1: $R_1 = 300$, $A_1 = 1903{,}25$, $S_1 = 4096{,}75$. Jaar 2: $R_2 \approx 204{,}84$, $A_2 \approx 1998{,}41$, $S_2 \approx 2098{,}33$. Jaar 3: $R_3 \approx 104{,}92$, $A_3 \approx 2098{,}33$, $S_3 = 0$.

- id: h3-factor
  soort: kort
  opgave: |-
    Aflossingsdelen bij een vaste annuïteit.
  lijst: enumerate
  delen:
    - opgave: |-
        Een lening van \eur 50\,000 wordt in 10 jaar afgelost met een vaste annuïteit op het einde van elk jaar, aan 3,5\,\% per jaar. Bereken $a$, $A_1$, $A_5$ en $A_{10}$ zonder tabel.
      antwoord: |-
        $a \approx 6012{,}07$; $A_1 \approx 4262{,}07$; $A_5 \approx 4890{,}82$; $A_{10} \approx 5808{,}76$
      uitwerking: |-
        $a = \frac{50\,000 \cdot 0{,}035}{1 - 1{,}035^{-10}} \approx 6012{,}07$. $A_1 = a - 0{,}035 \cdot 50\,000 \approx 4262{,}07$. $A_5 = A_1 \cdot 1{,}035^4 \approx 4890{,}82$ en $A_{10} = A_1 \cdot 1{,}035^9 \approx 5808{,}76$.
    - opgave: |-
        Bij een lening met maandelijkse betalingen is het eerste aflossingsdeel \eur 800 en het tweede \eur 806. Welke maandrente en welke jaarrente hoort daarbij?
      antwoord: |-
        $0{,}75\,\%$ per maand; $\approx 9{,}38\,\%$ per jaar
      uitwerking: |-
        $\um = \frac{806}{800} = 1{,}0075$, dus $\im = 0{,}75\,\%$ en per jaar $1{,}0075^{12} - 1 \approx 9{,}38\,\%$.

- id: h3-rekenblad
  soort: kort
  opgave: |-
    Een lening van \eur 20\,000 over 4 jaar, aan 4\,\% per jaar, wordt maandelijks afgelost. In een rekenblad staan de maandrente in B1 en de maandlast in B2; rij 4 is maand 0, met de restschuld 20\,000 in D4.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de maandrente en de maandlast. Welke formule zet je in B2?
      antwoord: |-
        $\approx 0{,}3274\,\%$; $\approx 450{,}94$ euro; \texttt{=20000*B1/(1-(1+B1)\^{}(-48))}
      uitwerking: |-
        $\im = 1{,}04^{\frac1{12}} - 1 \approx 0{,}003\,274$ en $a = \frac{20\,000\,\im}{1 - \um^{-48}} \approx 450{,}94$ euro.
    - opgave: |-
        Geef de formules op rij 5 voor het rentedeel (B5), het aflossingsdeel (C5) en de restschuld (D5), en de getallen van maand 1 en 2.
      antwoord: |-
        \texttt{=\$B\$1*D4}, \texttt{=\$B\$2-B5}, \texttt{=D4-C5}; 65,47; 385,47; 19\,614,53; 64,21; 386,73; 19\,227,80
      uitwerking: |-
        Maand 1: $R_1 = 20\,000\,\im \approx 65{,}47$, $A_1 \approx 385{,}47$, $S_1 \approx 19\,614{,}53$. Maand 2: $R_2 \approx 64{,}21$, $A_2 \approx 386{,}73$, $S_2 \approx 19\,227{,}80$.
    - opgave: |-
        Na hoeveel maanden is de schuld voor het eerst minder dan de helft? Is dat na de helft van de looptijd?
      antwoord: |-
        na 25 maanden; nee, iets later
      uitwerking: |-
        $S_{24} = a\,\frac{1 - \um^{-24}}{\im} > 10\,000$ en $S_{25} \approx 9975{,}09 < 10\,000$: na 25 maanden, één maand na de helft van de looptijd.

- id: h3-vast
  soort: kort
  opgave: |-
    Een lening van \eur 12\,000 wordt in 4 jaar afgelost aan 3\,\% per jaar, met betalingen op het einde van elk jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken bij een vast aflossingsdeel de vier betalingen en de totale rente.
      antwoord: |-
        3360; 3270; 3180; 3090; rente 900 euro
      uitwerking: |-
        Aflossingsdeel $\frac{12\,000}{4} = 3000$. Rente: 360, 270, 180 en 90. Totaal $0{,}03 \cdot 12\,000 \cdot \frac52 = 900$ euro.
    - opgave: |-
        Bereken de totale rente bij een vaste annuïteit. Welke vorm is goedkoper, en waarom?
      antwoord: |-
        $\approx 913{,}30$ euro; het vaste aflossingsdeel
      uitwerking: |-
        $a = \frac{12\,000 \cdot 0{,}03}{1 - 1{,}03^{-4}} \approx 3228{,}32$, rente $4a - 12\,000 \approx 913{,}30$ euro. Met een vast aflossingsdeel los je in het begin meer af, dus staat er minder schuld open.

- id: h3-vervroegd
  soort: kort
  opgave: |-
    Vervroegd terugbetalen.
  lijst: enumerate
  delen:
    - opgave: |-
        Een hypothecaire lening van \eur 100\,000 over 15 jaar aan 3\,\% per jaar wordt maandelijks afgelost. Na 5 jaar wil je alles terugbetalen, met drie maanden rente als wederbeleggingsvergoeding. Hoeveel betaal je?
      antwoord: |-
        $\approx 71\,983{,}27$ euro
      uitwerking: |-
        $\im = 1{,}03^{\frac1{12}} - 1$, $a = \frac{100\,000\,\im}{1 - \um^{-180}} \approx 688{,}64$. Restschuld na 60 maanden: $a\,\frac{1 - \um^{-120}}{\im} \approx 71\,454{,}59$. Vergoeding $3\,\im \cdot 71\,454{,}59 \approx 528{,}68$. Samen $\approx 71\,983{,}27$ euro.
    - opgave: |-
        De autolening van voorbeeld \ref{vb:h3-termijn} (\eur 15\,000, 48 maanden, 5,9\,\%) wordt na 2 jaar terugbetaald, met een vergoeding van 1\,\% van de restschuld. Hoeveel betaal je?
      antwoord: |-
        $\approx 8008{,}76$ euro
      uitwerking: |-
        Restschuld na 24 maanden: $350{,}53 \cdot \frac{1 - \um^{-24}}{\im} \approx 7929{,}47$. Met 1\,\%: $7929{,}47 \cdot 1{,}01 \approx 8008{,}76$ euro.

