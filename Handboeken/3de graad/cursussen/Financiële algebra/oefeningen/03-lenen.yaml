- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    beginwaarde postnumerando
  opgave: |-
    Bereken de beginwaarde van de postnumerando annuïteit.
  lijst: enumerate
  delen:
    - opgave: |-
        \eur 800 per maand, 20 jaar lang, aan 3,4\,\% per jaar.
      antwoord: |-
        $\approx 139\,814{,}51$ euro
      uitwerking: |-
        $\im = 1{,}034^{\frac1{12}} - 1$, $n = 240$: $B \approx 139\,814{,}51$ euro.
    - opgave: |-
        \eur 2500 per jaar, 8 jaar lang, aan 4,5\,\% per jaar.
      antwoord: |-
        $\approx 16\,489{,}72$ euro
      uitwerking: |-
        $B = 2500 \cdot \frac{1 - 1{,}045^{-8}}{0{,}045} \approx 16\,489{,}72$ euro.
    - opgave: |-
        \eur 150 per maand, 4 jaar lang, aan 6,9\,\% per jaar.
      antwoord: |-
        $\approx 6301{,}69$ euro
      uitwerking: |-
        $\im = 1{,}069^{\frac1{12}} - 1$, $n = 48$: $B \approx 6301{,}69$ euro.
    - opgave: |-
        \eur 1200 per trimester, 10 jaar lang, aan 3\,\% per jaar.
      antwoord: |-
        $\approx 41\,402{,}77$ euro
      uitwerking: |-
        $i_4 = 1{,}03^{\frac14} - 1$, $n = 40$: $B \approx 41\,402{,}77$ euro.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    termijnbedrag en totale rente
  opgave: |-
    Bereken het termijnbedrag (op het einde van elke periode) en de totale rente.
  lijst: enumerate
  delen:
    - opgave: |-
        \eur 30\,000 in 6 jaar, maandelijks, aan 5\,\% per jaar.
      antwoord: |-
        $\approx 481{,}60$ euro; $\approx 4675{,}50$ euro
      uitwerking: |-
        $\im = 1{,}05^{\frac1{12}} - 1$, $n = 72$: $a \approx 481{,}60$; rente $72a - 30\,000 \approx 4675{,}50$ euro.
    - opgave: |-
        \eur 175\,000 in 25 jaar, maandelijks, aan 2,8\,\% per jaar.
      antwoord: |-
        $\approx 808{,}61$ euro; $\approx 67\,583$ euro
      uitwerking: |-
        $n = 300$: $a \approx 808{,}61$; rente $\approx 67\,583$ euro.
    - opgave: |-
        \eur 5000 in 2 jaar, maandelijks, aan 8\,\% per jaar.
      antwoord: |-
        $\approx 225{,}50$ euro; $\approx 412{,}01$ euro
      uitwerking: |-
        $n = 24$: $a \approx 225{,}50$; rente $\approx 412{,}01$ euro.
    - opgave: |-
        \eur 60\,000 in 10 jaar, jaarlijks, aan 4\,\% per jaar.
      antwoord: |-
        $\approx 7397{,}46$ euro; $\approx 13\,974{,}57$ euro
      uitwerking: |-
        $a = \frac{60\,000 \cdot 0{,}04}{1 - 1{,}04^{-10}} \approx 7397{,}46$; rente $\approx 13\,974{,}57$ euro.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    klassieke fouten: waar of vals
  opgave: |-
    Waar of vals? Verbeter wat vals is.
  lijst: enumerate
  delen:
    - opgave: |-
        Wie \eur 100\,000 leent en 20 jaar lang \eur 500 per maand terugbetaalt, betaalt \eur 20\,000 rente.
      antwoord: |-
        waar
      uitwerking: |-
        Alles wat je terugbetaalt boven het geleende is rente: $240 \cdot 500 - 100\,000 = 20\,000$. (Dat hoort bij een maandrente van ongeveer 0,156\,\%, of 1,9\,\% per jaar.)
    - opgave: |-
        Bij een vaste annuïteit is elk rentedeel even groot.
      antwoord: |-
        vals
      uitwerking: |-
        Het rentedeel daalt, want de restschuld daalt. Het termijnbedrag is vast, niet het rentedeel.
    - opgave: |-
        Bij een vaste annuïteit is het laatste aflossingsdeel kleiner dan het termijnbedrag.
      antwoord: |-
        waar
      uitwerking: |-
        Ook in de laatste periode is er nog rente: $A_n = a\,u^{-1} < a$.
    - opgave: |-
        Een lening met een dubbel zo lange looptijd heeft een half zo groot termijnbedrag.
      antwoord: |-
        vals: meer dan de helft
      uitwerking: |-
        $\frac{a_{2n}}{a_n} = \frac{1 - u^{-n}}{1 - u^{-2n}} = \frac{1}{1 + u^{-n}} > \frac12$.
    - opgave: |-
        Na de helft van de looptijd van een lening met vaste annuïteit is meer dan de helft van de schuld afgelost.
      antwoord: |-
        vals
      uitwerking: |-
        In het begin zijn de aflossingsdelen het kleinst. Na de helft is minder dan de helft afgelost.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    aflossingstabel vaste annuïteit
  opgave: |-
    Een lening van \eur 4000 wordt in 4 jaar afgelost met een vaste annuïteit op het einde van elk jaar, aan 6\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het termijnbedrag.
      antwoord: |-
        $\approx 1154{,}37$ euro
      uitwerking: |-
        $a = \frac{4000 \cdot 0{,}06}{1 - 1{,}06^{-4}} \approx 1154{,}37$ euro.
    - opgave: |-
        Stel de aflossingstabel op.
      antwoord: |-
        $R$: 240; 185,14; 126,98; 65,34. $A$: 914,37; 969,23; 1027,38; 1089,02
      uitwerking: |-
        Restschulden: 3085,63; 2116,41; 1089,02; 0.
    - opgave: |-
        Controleer dat de aflossingsdelen samen \eur 4000 zijn, en dat ze telkens met 1,06 vermenigvuldigd worden.
      antwoord: |-
        $914{,}37 + 969{,}23 + 1027{,}38 + 1089{,}02 = 4000$
      uitwerking: |-
        $914{,}37 \cdot 1{,}06 \approx 969{,}23$, $969{,}23 \cdot 1{,}06 \approx 1027{,}38$, $1027{,}38 \cdot 1{,}06 \approx 1089{,}02$.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    grafiek lezen: restschuld
  figuur:
    code: |-
      \begin{tikzpicture}[x=.48cm,y=.04cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=1,ystep=20] (0,0) grid (10,100);
        \draw[->,grijs] (0,0) -- (10.6,0) node[right,text=black] {jaar};
        \draw[->,grijs] (0,0) -- (0,106) node[above,text=black] {euro};
        \foreach \t in {2,4,...,10}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \k in {20,60,100}{\node[left,inner sep=1.5pt] at (0,\k) {$\k\,000$};}
        \draw[dashed,grijs] (0,100) -- (10,0);
        \draw[accent,thick] plot[domain=0:10,samples=50,smooth] (\x,{1.009056/0.0032737*(1-1.04^(-(10-\x)))});
      \end{tikzpicture}
  opgave: |-
    De kromme toont de restschuld van een lening van \eur 100\,000 over 10 jaar aan 4\,\% per jaar, met een vaste maandlast. De stippellijn hoort bij een vast aflossingsdeel.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees af hoeveel schuld er na 5 jaar nog is. Bereken het daarna exact.
      antwoord: |-
        ongeveer 55\,000; $\approx 54\,886{,}94$ euro
      uitwerking: |-
        De maandlast is $a = \frac{100\,000\,\im}{1 - \um^{-120}} \approx 1009{,}06$ met $\im = 1{,}04^{\frac1{12}} - 1$. $S_{60} = a\,\frac{1 - \um^{-60}}{\im} \approx 54\,886{,}94$ euro.
    - opgave: |-
        Waarom ligt de kromme boven de stippellijn?
      antwoord: |-
        in het begin wordt minder afgelost
      uitwerking: |-
        Bij een vaste annuïteit zijn de eerste aflossingsdelen kleiner dan $\frac{B}{n}$ en de laatste groter. De schuld daalt dus eerst trager.
    - opgave: |-
        Waar is de kromme het steilst? Wat betekent dat?
      antwoord: |-
        op het einde; dan wordt het meest afgelost
      uitwerking: |-
        De helling is het aflossingsdeel per maand, en dat groeit met de factor $\um$: aan het einde daalt de schuld het snelst.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    beginwaarde en eindwaarde
  opgave: |-
    Neem tien betalingen van \eur 1000 op het einde van elk jaar, aan 5\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de beginwaarde en de eindwaarde (op het moment van de laatste betaling).
      antwoord: |-
        $\approx 7721{,}73$; $\approx 12\,577{,}89$ euro
      uitwerking: |-
        $B = 1000\,\frac{1 - 1{,}05^{-10}}{0{,}05} \approx 7721{,}73$ en $E = 1000\,\frac{1{,}05^{10} - 1}{0{,}05} \approx 12\,577{,}89$ euro.
    - opgave: |-
        Toon aan dat $B \cdot u^{n} = E$, en controleer met de getallen.
      antwoord: |-
        $7721{,}73 \cdot 1{,}05^{10} \approx 12\,577{,}89$
      uitwerking: |-
        $a\,\frac{1 - u^{-n}}{i} \cdot u^n = a\,\frac{u^n - 1}{i}$. Beide zijn de waarde van dezelfde betalingen, op tijdstip 0 en op tijdstip $n$.
    - opgave: |-
        Wat betekent dat voor een lening van \eur 7721,73 die je met deze betalingen aflost?
      antwoord: |-
        bank en lener staan na 10 jaar quitte
      uitwerking: |-
        Op tijdstip 10 is de lening met rente aangegroeid tot \eur 12\,577,89, en de betalingen ook: ze heffen elkaar op.

- id: h3-o7
  soort: opdracht
  niveau: 1
  thema: |-
    aflossingstabel vast aflossingsdeel
  opgave: |-
    Een lening van \eur 8000 wordt in 4 jaar afgelost met een vast aflossingsdeel, op het einde van elk jaar, aan 5\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel de aflossingstabel op.
      antwoord: |-
        betalingen 2400; 2300; 2200; 2100
      uitwerking: |-
        Aflossingsdeel 2000. Rentedelen 400, 300, 200, 100. Restschulden 6000, 4000, 2000, 0.
    - opgave: |-
        Bereken de totale rente met de formule en controleer met de tabel.
      antwoord: |-
        1000 euro
      uitwerking: |-
        $0{,}05 \cdot 8000 \cdot \frac52 = 1000$, en $400 + 300 + 200 + 100 = 1000$.
    - opgave: |-
        Met hoeveel daalt de betaling elk jaar? Toon aan dat dat in het algemeen $\frac{i\,B}{n}$ is.
      antwoord: |-
        100 euro
      uitwerking: |-
        De schuld daalt elk jaar met $\frac Bn$, dus de rente met $i\,\frac Bn = 0{,}05 \cdot 2000 = 100$. Het aflossingsdeel blijft gelijk.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    leencapaciteit en looptijd
  opgave: |-
    Een koppel kan \eur 900 per maand aan een hypothecaire lening besteden, aan 3,5\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel kunnen ze lenen over 20 jaar? En over 25 jaar?
      antwoord: |-
        $\approx 155\,940{,}96$; $\approx 180\,838{,}04$ euro
      uitwerking: |-
        $\im = 1{,}035^{\frac1{12}} - 1$: $B_{240} \approx 155\,940{,}96$ en $B_{300} \approx 180\,838{,}04$ euro.
    - opgave: |-
        Hoeveel rente betalen ze in elk geval?
      antwoord: |-
        $\approx 60\,059$; $\approx 89\,162$ euro
      uitwerking: |-
        $240 \cdot 900 - 155\,940{,}96 \approx 60\,059$ en $300 \cdot 900 - 180\,838{,}04 \approx 89\,162$ euro.
    - opgave: |-
        Vijf jaar langer afbetalen levert \eur 24\,897 extra leenruimte op. Hoeveel kost dat aan rente?
      antwoord: |-
        $\approx 29\,103$ euro extra rente
      uitwerking: |-
        De extra 60 maandlasten zijn samen \eur 54\,000, voor \eur 24\,897 extra lening: $89\,162 - 60\,059 \approx 29\,103$ euro extra rente.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    autolening vergelijken
  opgave: |-
    Voor een wagen van \eur 18\,000 heb je twee aanbiedingen, allebei in 60 maandelijkse betalingen: de verkoper rekent 0,4\,\% per maand, de bank heeft een JKP van 5,2\,\% (zonder kosten).
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de maandlast bij de verkoper.
      antwoord: |-
        $\approx 338{,}04$ euro
      uitwerking: |-
        $a = \frac{18\,000 \cdot 0{,}004}{1 - 1{,}004^{-60}} \approx 338{,}04$ euro.
    - opgave: |-
        Bereken de maandlast bij de bank.
      antwoord: |-
        $\approx 340{,}34$ euro
      uitwerking: |-
        $\im = 1{,}052^{\frac1{12}} - 1 \approx 0{,}004\,233$: $a \approx 340{,}34$ euro.
    - opgave: |-
        Welke aanbieding is goedkoper? Verklaar met de effectieve rentevoet.
      antwoord: |-
        de verkoper
      uitwerking: |-
        $1{,}004^{12} - 1 \approx 4{,}91\,\%$ effectief, minder dan 5,2\,\%. Over 60 maanden scheelt het ongeveer \eur 138.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    looptijd bij een vaste maandlast
  opgave: |-
    Je leent \eur 30\,000 en betaalt een vast bedrag op het einde van elke maand.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel maanden duurt het bij \eur 500 per maand, aan 4\,\% per jaar?
      antwoord: |-
        67 maanden
      uitwerking: |-
        $n = -\frac{\log(1 - 30\,000\,\im/500)}{\log \um} \approx 66{,}9$, met $\im = 1{,}04^{\frac1{12}} - 1$: 66 volle betalingen en een kleinere 67ste.
    - opgave: |-
        En bij \eur 600 per maand? Hoeveel rente bespaar je ongeveer?
      antwoord: |-
        55 maanden; $\approx 640$ euro
      uitwerking: |-
        $n \approx 54{,}7$. Rente ongeveer $500 \cdot 66{,}9 - 30\,000 \approx 3450$ tegen $600 \cdot 54{,}7 - 30\,000 \approx 2810$ euro: zo'n \eur 640 minder.
    - opgave: |-
        Hoeveel maanden duurt het bij \eur 500 per maand als de rente 6\,\% per jaar is?
      antwoord: |-
        72 maanden
      uitwerking: |-
        $n \approx 71{,}1$, met $\im = 1{,}06^{\frac1{12}} - 1$: 71 volle betalingen en een kleine 72ste.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    aflossingstabel lezen (rekenblad)
  opgave: |-
    Een gezin leent \eur 180\,000 over 240 maanden aan 3,3\,\% per jaar, met een vaste maandlast op het einde van elke maand. Stel met een rekenblad de aflossingstabel op.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel schuld is er nog na 5, 10 en 15 jaar?
      antwoord: |-
        $\approx 145\,299{,}68$; $104\,483{,}23$; $56\,472{,}68$ euro
      uitwerking: |-
        Lees de restschuld op maand 60, 120 en 180, of reken met $S_k = a\,\frac{1 - \um^{-(240 - k)}}{\im}$.
    - opgave: |-
        Hoeveel rente betalen ze in het eerste jaar?
      antwoord: |-
        $\approx 5755{,}77$ euro
      uitwerking: |-
        Tel de eerste twaalf rentedelen op, of: $12\,a - (180\,000 - S_{12}) \approx 5755{,}77$ euro.
    - opgave: |-
        In welk jaar betalen ze voor het eerst minder dan \eur 3000 rente?
      antwoord: |-
        in jaar 12
      uitwerking: |-
        De rente in jaar $j$ is $12\,a - (S_{12(j-1)} - S_{12j})$. In jaar 11 is dat nog meer dan 3000, in jaar 12 ongeveer \eur 2967.
    - opgave: |-
        Maak een grafiek van het rentedeel en het aflossingsdeel per maand. Welke vorm hebben de twee krommen?
      antwoord: |-
        aflossing stijgt exponentieel, rente daalt
      uitwerking: |-
        $A_k = A_1\,\um^{k-1}$ stijgt exponentieel; $R_k = a - A_k$ is het spiegelbeeld ervan ten opzichte van de rechte op hoogte $\frac a2$. Hun som is altijd $a$.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    lening reconstrueren uit twee aflossingsdelen
  opgave: |-
    Van een lening met een vaste annuïteit op het einde van elk jaar, in 8 jaar, ken je $A_3 = 2000$ euro en $A_4 = 2060$ euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de rentevoet en het eerste aflossingsdeel.
      antwoord: |-
        $3\,\%$; $A_1 \approx 1885{,}19$ euro
      uitwerking: |-
        $u = \frac{2060}{2000} = 1{,}03$. $A_1 = \frac{2000}{1{,}03^2} \approx 1885{,}19$ euro.
    - opgave: |-
        Bereken het geleende bedrag en het termijnbedrag.
      antwoord: |-
        $B \approx 16\,763{,}76$; $a \approx 2388{,}10$ euro
      uitwerking: |-
        De aflossingsdelen samen zijn $B$: $B = A_1\,\frac{1{,}03^8 - 1}{0{,}03} \approx 16\,763{,}76$. Dan $a = A_1 + i\,B \approx 1885{,}19 + 502{,}91 = 2388{,}10$ euro. Controle met de formule: $\frac{16\,763{,}76 \cdot 0{,}03}{1 - 1{,}03^{-8}} \approx 2388{,}10$.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    vaste annuïteit tegenover vast aflossingsdeel
  opgave: |-
    Een lening van \eur 200\,000 over 20 jaar aan 3\,\% per jaar wordt maandelijks afgelost.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de maandlast en de totale rente bij een vaste annuïteit.
      antwoord: |-
        $\approx 1105{,}15$ euro; $\approx 65\,235$ euro
      uitwerking: |-
        $\im = 1{,}03^{\frac1{12}} - 1$: $a \approx 1105{,}15$; rente $240\,a - 200\,000 \approx 65\,235$ euro.
    - opgave: |-
        Bereken bij een vast aflossingsdeel de eerste en de laatste maandlast en de totale rente.
      antwoord: |-
        $\approx 1326{,}59$; $\approx 835{,}39$; $\approx 59\,437$ euro
      uitwerking: |-
        Aflossingsdeel $\frac{200\,000}{240} \approx 833{,}33$. Eerste: $833{,}33 + 200\,000\,\im \approx 1326{,}59$. Laatste: $833{,}33 + 833{,}33\,\im \approx 835{,}39$. Rente $\im \cdot 200\,000 \cdot \frac{241}{2} \approx 59\,437$ euro.
    - opgave: |-
        Waarom kiezen de meeste gezinnen toch voor een vaste annuïteit?
      antwoord: |-
        een lagere, vaste maandlast in het begin
      uitwerking: |-
        In het begin is de maandlast \eur 221 lager, precies wanneer een jong gezin het minst ruimte heeft, en hij blijft voorspelbaar. Daar staat \eur 5800 extra rente tegenover.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    gedeeltelijke vervroegde terugbetaling
  opgave: |-
    Een gezin heeft een lening van \eur 180\,000 over 240 maanden aan 3,3\,\% per jaar, met een maandlast van \eur 1021,05 op het einde van elke maand. Na 10 jaar betalen ze niet alles, maar \eur 40\,000 extra terug. De bank rekent drie maanden rente op dat bedrag als vergoeding.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel is de vergoeding, en wat is de nieuwe restschuld?
      antwoord: |-
        $\approx 325{,}11$ euro; $\approx 64\,483{,}23$ euro
      uitwerking: |-
        $3\,\im \cdot 40\,000 \approx 325{,}11$ euro. De restschuld daalt van $104\,483{,}23$ tot $64\,483{,}23$ euro.
    - opgave: |-
        Ze houden de looptijd: nog 120 maanden. Wat is de nieuwe maandlast?
      antwoord: |-
        $\approx 630{,}16$ euro
      uitwerking: |-
        $a = \frac{64\,483{,}23\,\im}{1 - \um^{-120}} \approx 630{,}16$ euro.
    - opgave: |-
        Ze houden de maandlast van \eur 1021,05. Hoeveel maanden duurt het nog? Welke keuze kost minder rente?
      antwoord: |-
        70 maanden; de kortere looptijd
      uitwerking: |-
        $n = -\frac{\log(1 - 64\,483{,}23\,\im/1021{,}05)}{\log \um} \approx 69{,}4$: 69 volle maandlasten en een laatste van ongeveer \eur 366. Ze betalen nog $\approx 70\,819$ euro, tegen $120 \cdot 630{,}16 \approx 75\,619$ euro bij dezelfde looptijd: de kortere looptijd kost ongeveer \eur 4800 minder rente.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    herfinancieren
  opgave: |-
    Een gezin heeft een lening van \eur 180\,000 over 240 maanden aan 3,3\,\% per jaar, met een maandlast van \eur 1021,05 op het einde van elke maand. Na 8 jaar daalt de marktrente. Ze kunnen hun restschuld herfinancieren aan 2,5\,\% per jaar voor de resterende 12 jaar. Ze betalen dan drie maanden rente (aan 3,3\,\%) als vergoeding.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel is de restschuld na 8 jaar, en hoeveel de vergoeding?
      antwoord: |-
        $\approx 121\,608{,}81$ euro; $\approx 988{,}41$ euro
      uitwerking: |-
        $S_{96} = 1021{,}05 \cdot \frac{1 - \um^{-144}}{\im} \approx 121\,608{,}81$ euro; $3\,\im \cdot S_{96} \approx 988{,}41$ euro.
    - opgave: |-
        Wat is de nieuwe maandlast, en hoeveel besparen ze over 12 jaar?
      antwoord: |-
        $\approx 976{,}80$ euro; $\approx 6373$ euro
      uitwerking: |-
        Met $\im' = 1{,}025^{\frac1{12}} - 1$: $a' = \frac{121\,608{,}81\,\im'}{1 - (1 + \im')^{-144}} \approx 976{,}80$. Per maand \eur 44,26 minder, over 144 maanden ongeveer \eur 6373.
    - opgave: |-
        Is herfinancieren de moeite, als er ook nog ongeveer \eur 2500 aan andere kosten bijkomt? Wat besluit je?
      antwoord: |-
        ja, maar met een kleine marge
      uitwerking: |-
        Vergoeding en kosten samen zijn ongeveer \eur 3500, de besparing \eur 6373 (verspreid over 12 jaar, dus vandaag wat minder waard). Het loont, maar niet veel. (De kosten van een nieuwe hypothecaire lening zijn een voorbeeld en niet nagekeken.)

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    uitgestelde aflossing
  opgave: |-
    Een student leent \eur 12\,000 aan 4,5\,\% per jaar. Tijdens de studies betaalt ze niets: de eerste maandlast valt pas 12 maanden na het lenen. Daarna betaalt ze 48 keer hetzelfde bedrag.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel is de schuld 11 maanden na het lenen, een maand voor de eerste betaling?
      antwoord: |-
        $\approx 12\,494{,}09$ euro
      uitwerking: |-
        $12\,000\,\um^{11} \approx 12\,494{,}09$ euro, met $\im = 1{,}045^{\frac1{12}} - 1$.
    - opgave: |-
        Bereken de maandlast. Waarom reken je met de schuld van b en niet met \eur 12\,000?
      antwoord: |-
        $\approx 284{,}40$ euro
      uitwerking: |-
        Vanaf maand 11 is het een gewone postnumerando annuïteit van 48 termijnen: $a = \frac{12\,494{,}09\,\im}{1 - \um^{-48}} \approx 284{,}40$ euro. De lening is in die 11 maanden met rente aangegroeid.
    - opgave: |-
        Hoeveel was de maandlast zonder uitstel, en hoeveel kost het uitstel in totaal?
      antwoord: |-
        $\approx 273{,}15$ euro; $\approx 540$ euro
      uitwerking: |-
        $a = \frac{12\,000\,\im}{1 - \um^{-48}} \approx 273{,}15$ euro. Verschil $48 \cdot (284{,}40 - 273{,}15) \approx 540$ euro.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    totale rente en looptijd
  opgave: |-
    Een lening van \eur 150\,000 aan 3\,\% per jaar wordt maandelijks afgelost. Vul een tabel in met de looptijd (15, 20, 25 en 30 jaar), de maandlast en de totale rente.
  lijst: enumerate
  delen:
    - opgave: |-
        15 jaar
      antwoord: |-
        $\approx 1032{,}95$; $\approx 35\,932$ euro
      uitwerking: |-
        $\im = 1{,}03^{\frac1{12}} - 1$, $n = 180$.
    - opgave: |-
        20 jaar
      antwoord: |-
        $\approx 828{,}86$; $\approx 48\,926$ euro
      uitwerking: |-
        $n = 240$.
    - opgave: |-
        25 jaar
      antwoord: |-
        $\approx 708{,}16$; $\approx 62\,449$ euro
      uitwerking: |-
        $n = 300$.
    - opgave: |-
        30 jaar. Wat merk je als je de looptijd telkens met 5 jaar verlengt?
      antwoord: |-
        $\approx 629{,}14$; $\approx 76\,489$ euro; de maandlast daalt steeds minder, de rente stijgt steeds meer
      uitwerking: |-
        De maandlast daalt met 204, 121 en 79 euro, de rente stijgt met 13\,000, 13\,500 en 14\,000 euro. De maandlast kan nooit onder $150\,000\,\im \approx 370$ euro zakken.

- id: h3-o18
  soort: opdracht
  niveau: 3
  thema: |-
    wanneer is aflossing groter dan rente
  opgave: |-
    Een hypothecaire lening van \eur 250\,000 over 30 jaar aan 4\,\% per jaar wordt maandelijks afgelost met een vaste annuïteit.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de maandlast, het eerste rentedeel en het eerste aflossingsdeel.
      antwoord: |-
        $\approx 1183{,}25$; $\approx 818{,}43$; $\approx 364{,}82$ euro
      uitwerking: |-
        $\im = 1{,}04^{\frac1{12}} - 1$, $n = 360$: $a \approx 1183{,}25$, $R_1 = 250\,000\,\im \approx 818{,}43$, $A_1 \approx 364{,}82$.
    - opgave: |-
        Toon aan dat het aflossingsdeel groter is dan het rentedeel als en slechts als $A_k > \frac a2$, en dat dat gebeurt vanaf $k > 1 + \dfrac{\log \frac{a}{2A_1}}{\log u}$.
      antwoord: |-
        $A_k + R_k = a$
      uitwerking: |-
        $A_k > R_k = a - A_k \iff A_k > \frac a2$. Met $A_k = A_1\,u^{k-1}$: $u^{k-1} > \frac{a}{2A_1}$, en omdat $\log u > 0$: $k - 1 > \frac{\log(a/(2A_1))}{\log u}$.
    - opgave: |-
        In welke maand is het aflossingsdeel voor het eerst groter dan het rentedeel? Na hoeveel jaar is dat?
      antwoord: |-
        maand 149; na ruim 12 jaar
      uitwerking: |-
        $k > 1 + \frac{\log(1183{,}25/729{,}64)}{\log \um} \approx 148{,}9$, dus maand 149: na 12 jaar en 5 maanden, al ruim 40\,\% van de looptijd.

- id: h3-o19
  soort: opdracht
  niveau: 3
  thema: |-
    vaste annuïteit kost meer rente (bewijs)
  opgave: |-
    Vergelijk een lening $B$ in $n$ periodes met vaste annuïteit (aflossingsdelen $A_k$) en met vast aflossingsdeel $\frac Bn$, aan dezelfde rentevoet $i > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $A_1 < \frac Bn < A_n$.
      antwoord: |-
        de $A_k$ stijgen strikt en hun gemiddelde is $\frac Bn$
      uitwerking: |-
        De $A_k$ vormen een strikt stijgende meetkundige rij ($u > 1$) met som $B$. Het gemiddelde $\frac Bn$ ligt dus strikt tussen de kleinste en de grootste.
    - opgave: |-
        Toon aan dat $A_1 + \cdots + A_k \leqslant k\,\frac Bn$ voor elke $k$. (Tip: het gemiddelde van de $k$ kleinste termen is hoogstens het gemiddelde van alle termen.)
      antwoord: |-
        de eerste $k$ termen zijn de kleinste
      uitwerking: |-
        Het gemiddelde van $A_1, \ldots, A_k$ is hoogstens $A_k$, en het gemiddelde van $A_{k+1}, \ldots, A_n$ minstens $A_{k+1} > A_k$. Het totale gemiddelde $\frac Bn$ ligt tussen beide, dus $\frac{A_1 + \cdots + A_k}{k} \leqslant \frac Bn$.
    - opgave: |-
        Leid af dat de restschuld bij een vaste annuïteit nooit kleiner is dan bij een vast aflossingsdeel, en dus dat de totale rente groter is.
      antwoord: |-
        $S_k \geqslant B\,(1 - \frac kn)$, en de rente is $i$ keer de som van de restschulden
      uitwerking: |-
        $S_k = B - (A_1 + \cdots + A_k) \geqslant B - k\,\frac Bn$. De totale rente is $i\,(S_0 + S_1 + \cdots + S_{n-1})$ in beide gevallen, en elke term is bij de annuïteit minstens even groot, voor $k = 1$ zelfs strikt groter.

- id: h3-o20
  soort: opdracht
  niveau: 3
  thema: |-
    na de helft van de looptijd (bewijs)
  opgave: |-
    Een lening met vaste annuïteit heeft een even aantal periodes $n = 2m$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{S_m}{B} = \dfrac{1}{1 + u^{-m}}$.
      antwoord: |-
        deel de twee formules
      uitwerking: |-
        $\frac{S_m}{B} = \frac{1 - u^{-m}}{1 - u^{-2m}} = \frac{1 - u^{-m}}{(1 - u^{-m})(1 + u^{-m})} = \frac{1}{1 + u^{-m}}$.
    - opgave: |-
        Leid af dat na de helft van de looptijd altijd meer dan de helft van de schuld openstaat.
      antwoord: |-
        $u^{-m} < 1$
      uitwerking: |-
        Voor $i > 0$ is $0 < u^{-m} < 1$, dus $1 + u^{-m} < 2$ en $\frac{S_m}{B} > \frac12$.
    - opgave: |-
        Bereken het aandeel voor een lening over 20 jaar aan 3,3\,\% per jaar en voor een lening over 30 jaar aan 6\,\% per jaar.
      antwoord: |-
        $\approx 58\,\%$; $\approx 71\,\%$
      uitwerking: |-
        $\frac{1}{1 + 1{,}033^{-10}} \approx 0{,}580$. Bij 30 jaar aan 6\,\%: $\frac{1}{1 + 1{,}06^{-15}} \approx 0{,}706$: na 15 jaar staat nog 71\,\% open.

- id: h3-o21
  soort: opdracht
  niveau: 3
  thema: |-
    rentedeel en aflossingsdeel van achteren
  opgave: |-
    Bij een lening met vaste annuïteit $a$ in $n$ periodes kun je elke rij van de aflossingstabel rechtstreeks berekenen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $A_k = a\,u^{-(n - k + 1)}$. (Tip: $A_n = a\,u^{-1}$, want de laatste betaling lost de laatste restschuld af met rente.)
      antwoord: |-
        $A_n = a\,u^{-1}$ en $A_k = A_n\,u^{k-n}$
      uitwerking: |-
        Voor de laatste periode is $S_{n-1} = A_n$ en $a = A_n + i\,A_n = u\,A_n$. Dan $A_k = A_n\,u^{-(n-k)} = a\,u^{-(n-k+1)}$.
    - opgave: |-
        Leid af dat $R_k = a\,\bigl(1 - u^{-(n - k + 1)}\bigr)$. Het aflossingsdeel van periode $k$ is de waarde op tijdstip $k - 1$ van één van de betalingen. Van welke?
      antwoord: |-
        $R_k = a - A_k$; van de laatste betaling
      uitwerking: |-
        $R_k = a - A_k = a\,\bigl(1 - u^{-(n-k+1)}\bigr)$. De factor $u^{-(n - (k - 1))}$ brengt een bedrag van tijdstip $n$ naar tijdstip $k - 1$: $A_k$ is de waarde op tijdstip $k - 1$ van de laatste betaling $a$. Hoe verder die nog weg ligt, hoe kleiner het aflossingsdeel.
    - opgave: |-
        Controleer met de tabel van voorbeeld \ref{vb:h3-tabel}: $A_2 = 2246{,}27 \cdot 1{,}04^{-4}$.
      antwoord: |-
        $\approx 1920{,}12$
      uitwerking: |-
        $2246{,}27 \cdot 1{,}04^{-4} \approx 1920{,}12$, zoals in de tabel.

- id: h3-o22
  soort: opdracht
  niveau: 3
  thema: |-
    aflossingsvrij krediet
  opgave: |-
    Bij een \textit{aflossingsvrij krediet} betaal je elke maand alleen de rente, en de hele lening in één keer op het einde. Neem \eur 50\,000 over 10 jaar aan 3\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel is de maandlast, en hoeveel rente betaal je in totaal?
      antwoord: |-
        $\approx 123{,}31$ euro; $\approx 14\,798$ euro
      uitwerking: |-
        $50\,000\,\im \approx 123{,}31$ euro per maand, 120 keer: $\approx 14\,798$ euro rente.
    - opgave: |-
        Vergelijk met een vaste annuïteit over 10 jaar.
      antwoord: |-
        $\approx 7824$ euro rente
      uitwerking: |-
        $a \approx 481{,}87$, rente $120\,a - 50\,000 \approx 7824$ euro: bijna de helft.
    - opgave: |-
        Toon aan dat een aflossingsvrij krediet altijd de meeste rente kost, vergeleken met elke lening die tussendoor iets aflost.
      antwoord: |-
        de restschuld is altijd maximaal
      uitwerking: |-
        De rente per periode is $i$ keer de restschuld. Bij een aflossingsvrij krediet blijft de restschuld de hele looptijd $B$, het maximum; elke lening die tussendoor aflost, heeft een kleinere of gelijke restschuld en dus minder rente.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: discreet
    onderwerp: |-
      Rijen
  opgave: |-
    Wat gebeurt er met de beginwaarde $B_n = a\,\frac{1 - u^{-n}}{i}$ als de looptijd $n$ onbeperkt groeit?
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\lim\limits_{n \to +\infty} B_n = \dfrac{a}{i}$.
      antwoord: |-
        $u^{-n} \to 0$
      uitwerking: |-
        $u^{-n} = (u^{-1})^n$ is een meetkundige rij met quotiënt $0 < u^{-1} < 1$, dus ze gaat naar 0.
    - opgave: |-
        Verklaar: met $\frac ai$ euro op een rekening aan $i$ per periode kun je eeuwig $a$ per periode opnemen.
      antwoord: |-
        de rente is precies $a$
      uitwerking: |-
        De rente per periode op $\frac ai$ is $i \cdot \frac ai = a$. Wie elke periode die rente opneemt, laat het kapitaal onaangeroerd.
    - opgave: |-
        Bereken $\frac ai$ voor $a = 1000$ per maand aan 3,3\,\% per jaar, en vergelijk met de beginwaarde over 20 en 50 jaar. Wat zegt dat over leningen met een heel lange looptijd?
      antwoord: |-
        $\approx 369\,104$; $\approx 176\,288$; $\approx 296\,304$ euro
      uitwerking: |-
        $\frac{1000}{\im} \approx 369\,104$ euro. Over 20 jaar is $B \approx 176\,288$, over 50 jaar $\approx 296\,304$ euro. Hoe lang je ook afbetaalt, je kunt met \eur 1000 per maand nooit meer dan \eur 369\,104 lenen. Zie ook hoofdstuk 1 van de cursus Differentiaalvergelijkingen.

- id: h3-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: analyse
    onderwerp: |-
      Numerieke methodes
  opgave: |-
    Een bank leent \eur 10\,000 uit over 36 maanden aan 6\,\% per jaar (gelijkwaardige maandrente), maar rekent \eur 150 dossierkosten aan bij het begin. Het JKP is de effectieve jaarrente waarbij de maandlasten precies het bedrag waard zijn dat je echt krijgt.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de maandlast.
      antwoord: |-
        $\approx 303{,}50$ euro
      uitwerking: |-
        $\im = 1{,}06^{\frac1{12}} - 1$: $a = \frac{10\,000\,\im}{1 - \um^{-36}} \approx 303{,}50$ euro.
    - opgave: |-
        Je krijgt eigenlijk maar \eur 9850. Zoek met de methode van de intervalmiddens (of een tabel) de maandrente $x$ met $303{,}50 \cdot \frac{1 - (1 + x)^{-36}}{x} = 9850$, op 0,01\,\% nauwkeurig.
      antwoord: |-
        $x \approx 0{,}57\,\%$
      uitwerking: |-
        $B(0{,}005) \approx 9976{,}3$, $B(0{,}006) \approx 9800{,}2$, $B(0{,}0055) \approx 9887{,}7$, $B(0{,}0057) \approx 9852{,}6$: de oplossing ligt bij $x \approx 0{,}0057$ (preciezer 0,5715\,\%), want $B$ daalt als de rente stijgt.
    - opgave: |-
        Wat is het JKP? Waarom is het hoger dan 6\,\%?
      antwoord: |-
        $\approx 7{,}08\,\%$
      uitwerking: |-
        $1{,}005\,715^{12} - 1 \approx 0{,}0708$. Je betaalt hetzelfde terug voor minder geld: de kosten werken als extra rente.

- id: h3-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: analyse
    onderwerp: |-
      Limieten en afgeleiden
  opgave: |-
    Beschouw de restschuld als functie van een reële tijd $t \in [0, n]$: $S(t) = \dfrac{a}{i}\,\bigl(1 - u^{-(n - t)}\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $S'(t)$ en toon aan dat $S$ daalt.
      antwoord: |-
        $S'(t) = -\frac{a}{i}\,u^{-(n - t)} \ln u < 0$
      uitwerking: |-
        $\frac{\mathrm d}{\mathrm dt}\,u^{-(n-t)} = u^{-(n-t)} \ln u$, dus $S'(t) = -\frac ai\,u^{-(n-t)} \ln u$. Alle factoren behalve het minteken zijn positief.
    - opgave: |-
        Bereken $S''(t)$. Is de grafiek hol of bol? Wat betekent dat voor de lener?
      antwoord: |-
        $S'' < 0$: bol
      uitwerking: |-
        $S''(t) = -\frac ai\,u^{-(n-t)} (\ln u)^2 < 0$: de grafiek is bol, en de schuld daalt steeds sneller. In het begin gaat het traag, op het einde snel.
    - opgave: |-
        Toon aan dat $|S'(k)|$ ongeveer het aflossingsdeel is: vergelijk $\frac{a}{i}\,u^{-(n-k)} \ln u$ met $A_{k+1} = a\,u^{-(n-k)}$ voor kleine $i$.
      antwoord: |-
        $\frac{\ln u}{i} \approx 1$
      uitwerking: |-
        $|S'(k)| = A_{k+1} \cdot \frac{\ln(1 + i)}{i}$, en $\ln(1 + i) \approx i$ voor kleine $i$ (de raaklijn aan $\ln(1 + x)$ in 0). Dus $|S'(k)| \approx A_{k+1}$: de helling van de restschuld is het aflossingsdeel.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Je kunt 15 jaar lang op het einde van elke maand \eur 550 aflossen, aan 3,8\,\% per jaar. Hoeveel kun je lenen?
  antwoord: |-
    $\approx 75\,705{,}71$ euro
  uitwerking: |-
    $\im = 1{,}038^{\frac1{12}} - 1$, $n = 180$: $B = 550\,\frac{1 - \um^{-180}}{\im} \approx 75\,705{,}71$ euro.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Je leent \eur 22\,000 voor 6 jaar aan 4,4\,\% per jaar, met maandelijkse betalingen. Bereken de maandlast en de totale rente.
  antwoord: |-
    $\approx 347{,}35$ euro; $\approx 3009$ euro
  uitwerking: |-
    $\im = 1{,}044^{\frac1{12}} - 1$, $n = 72$: $a \approx 347{,}35$; rente $72\,a - 22\,000 \approx 3009$ euro.

- id: h3-t3
  soort: test
  niveau: 2
  opgave: |-
    Je leent \eur 10\,000 aan 4\,\% per jaar en betaalt \eur 250 op het einde van elke maand. Hoeveel betalingen zijn er? Hoeveel is de laatste?
  antwoord: |-
    43; $\approx 235{,}74$ euro
  uitwerking: |-
    $n = -\frac{\log(1 - 10\,000\,\im/250)}{\log \um} \approx 42{,}94$. Na 42 betalingen is de schuld $\approx 234{,}97$; de 43ste betaling is $234{,}97 \cdot \um \approx 235{,}74$ euro.

- id: h3-t4
  soort: test
  niveau: 1
  opgave: |-
    Stel de aflossingstabel op van een lening van \eur 3000 in 3 jaar aan 6\,\% per jaar, met een vaste annuïteit op het einde van elk jaar.
  antwoord: |-
    $a \approx 1122{,}33$; $R$: 180; 123,46; 63,53; $A$: 942,33; 998,87; 1058,80
  uitwerking: |-
    $a = \frac{3000 \cdot 0{,}06}{1 - 1{,}06^{-3}} \approx 1122{,}33$. Restschulden 2057,67; 1058,80; 0.

- id: h3-t5
  soort: test
  niveau: 2
  opgave: |-
    Een lening van \eur 40\,000 wordt in 10 jaar afgelost met een vaste annuïteit op het einde van elk jaar, aan 2,5\,\% per jaar. Bereken het termijnbedrag, het eerste en het zesde aflossingsdeel, zonder tabel.
  antwoord: |-
    $a \approx 4570{,}35$; $A_1 \approx 3570{,}35$; $A_6 \approx 4039{,}52$
  uitwerking: |-
    $a = \frac{40\,000 \cdot 0{,}025}{1 - 1{,}025^{-10}} \approx 4570{,}35$; $A_1 = a - 1000 \approx 3570{,}35$; $A_6 = A_1 \cdot 1{,}025^5 \approx 4039{,}52$.

- id: h3-t6
  soort: test
  niveau: 1
  opgave: |-
    In een rekenblad staat de maandrente in B1, de maandlast in B2, en op rij 4 de restschuld van maand 0 in D4. Geef de formules op rij 5 voor het rentedeel, het aflossingsdeel en de restschuld. Waarom staan er dollartekens in?
  antwoord: |-
    \texttt{=\$B\$1*D4}, \texttt{=\$B\$2-B5}, \texttt{=D4-C5}
  uitwerking: |-
    Rentedeel: maandrente maal de vorige restschuld. Aflossingsdeel: maandlast min rentedeel. Restschuld: vorige restschuld min aflossingsdeel. De dollartekens houden B1 en B2 vast als je de rij naar beneden kopieert.

- id: h3-t7
  soort: test
  niveau: 1
  opgave: |-
    Een lening van \eur 9000 wordt in 3 jaar afgelost met een vast aflossingsdeel, op het einde van elk jaar, aan 4\,\% per jaar. Bereken de drie betalingen en de totale rente.
  antwoord: |-
    3360; 3240; 3120; rente 720 euro
  uitwerking: |-
    Aflossingsdeel 3000; rente 360, 240 en 120. Totaal $0{,}04 \cdot 9000 \cdot \frac42 = 720$ euro.

- id: h3-t8
  soort: test
  niveau: 2
  opgave: |-
    Een hypothecaire lening van \eur 120\,000 over 20 jaar aan 3,6\,\% per jaar wordt maandelijks afgelost. Na 8 jaar wil je alles terugbetalen, met drie maanden rente als vergoeding. Hoeveel betaal je?
  antwoord: |-
    $\approx 82\,573{,}05$ euro
  uitwerking: |-
    $\im = 1{,}036^{\frac1{12}} - 1$, $a \approx 698{,}54$. Na 96 maanden: $S_{96} = a\,\frac{1 - \um^{-144}}{\im} \approx 81\,848{,}29$. Vergoeding $3\,\im\,S_{96} \approx 724{,}75$. Samen $\approx 82\,573{,}05$ euro.
