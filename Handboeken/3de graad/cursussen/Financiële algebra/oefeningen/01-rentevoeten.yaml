# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of beantwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf als decimaal getal: 3,5\,\%, 0,25\,\% en 12\,\%.
      antwoord: |-
        $0{,}035$; $0{,}0025$; $0{,}12$
      uitwerking: |-
        Deel door 100: $3{,}5\,\% = 0{,}035$, $0{,}25\,\% = 0{,}0025$ en $12\,\% = 0{,}12$.
    - opgave: |-
        Hoeveel wordt \eur 2000 na 5 jaar aan 3,5\,\% samengestelde intrest per jaar?
      antwoord: |-
        $\approx 2375{,}37$ euro
      uitwerking: |-
        Elk jaar vermenigvuldigt het kapitaal met $1{,}035$: $2000 \cdot 1{,}035^5 \approx 2375{,}37$ euro.
    - opgave: |-
        Los op: $1{,}04^n = 2$.
      antwoord: |-
        $n \approx 17{,}67$
      uitwerking: |-
        Neem de logaritme van beide leden: $n \log 1{,}04 = \log 2$, dus $n = \frac{\log 2}{\log 1{,}04} \approx 17{,}67$.
    - opgave: |-
        Los op in $\R^+$: $u^{12} = 1{,}05$.
      antwoord: |-
        $u = 1{,}05^{\frac1{12}} \approx 1{,}004\,074$
      uitwerking: |-
        Neem de twaalfdemachtswortel: $u = 1{,}05^{\frac{1}{12}} \approx 1{,}004\,074$.
    - opgave: |-
        Is $1{,}03^{-2}$ groter of kleiner dan 1? Waarom?
      antwoord: |-
        kleiner: $\approx 0{,}9426$
      uitwerking: |-
        $1{,}03^{-2} = \frac{1}{1{,}03^2}$, en $1{,}03^2 > 1$, dus het omgekeerde is kleiner dan 1: ongeveer 0,9426.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Bank A schrijft elke maand 1\,\% rente bij op je spaarrekening. Bank B schrijft op het einde van het jaar 12\,\% rente bij.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel wordt \eur 100 na een jaar bij bank A? En bij bank B?
      antwoord: |-
        A: $\approx 112{,}68$ euro; B: 112 euro
      uitwerking: |-
        Bij A wordt het bedrag twaalf keer met $1{,}01$ vermenigvuldigd: $100 \cdot 1{,}01^{12} \approx 112{,}68$ euro. Bij B: $100 \cdot 1{,}12 = 112$ euro.
    - opgave: |-
        Waarom levert bank A meer op, terwijl twaalf keer 1\,\% toch 12\,\% is?
      antwoord: |-
        rente op rente
      uitwerking: |-
        Bij A wordt de rente van januari al in februari bijgeteld, en levert ze vanaf dan zelf rente op. Bij B brengt de rente pas na het jaar iets op.
    - opgave: |-
        Welke rente per maand moet bank A geven om na een jaar precies evenveel op te leveren als bank B?
      antwoord: |-
        $\approx 0{,}949\,\%$
      uitwerking: |-
        Zoek $\im$ met $(1 + \im)^{12} = 1{,}12$: $\im = 1{,}12^{\frac1{12}} - 1 \approx 0{,}009\,489$, dus ongeveer 0,949\,\% per maand, iets minder dan 1\,\%.

- id: h1-netto
  soort: kort
  opgave: |-
    Je zet \eur 6000 voor 5 jaar op een termijnrekening met een brutorentevoet van 2,2\,\% per jaar. De rente wordt elk jaar bijgeschreven, na 30\,\% roerende voorheffing.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel staat er na 5 jaar op de rekening?
      antwoord: |-
        $\approx 6476{,}45$ euro
      uitwerking: |-
        De nettorentevoet is $0{,}7 \cdot 0{,}022 = 0{,}0154$. Dan is $K_5 = 6000 \cdot 1{,}0154^5 \approx 6476{,}45$ euro.
    - opgave: |-
        Hoeveel was het zonder roerende voorheffing geweest?
      antwoord: |-
        $\approx 6689{,}69$ euro
      uitwerking: |-
        $6000 \cdot 1{,}022^5 \approx 6689{,}69$ euro.
    - opgave: |-
        Welke brutorentevoet geeft een nettorentevoet van 2\,\%?
      antwoord: |-
        $\approx 2{,}857\,\%$
      uitwerking: |-
        $0{,}7\,i = 0{,}02$, dus $i = \frac{0{,}02}{0{,}7} \approx 0{,}028\,57$: ongeveer 2,857\,\%.

- id: h1-beginwaarde
  soort: kort
  opgave: |-
    Bereken of beantwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        De beginwaarde van \eur 5000 dat je over 8 jaar nodig hebt, aan 2,4\,\% per jaar.
      antwoord: |-
        $\approx 4135{,}90$ euro
      uitwerking: |-
        $K_0 = 5000 \cdot 1{,}024^{-8} \approx 4135{,}90$ euro.
    - opgave: |-
        Wat is voordeliger om te ontvangen, aan 3,5\,\% per jaar: \eur 20\,000 nu of \eur 24\,000 over 6 jaar?
      antwoord: |-
        \eur 20\,000 nu
      uitwerking: |-
        De beginwaarde van het latere bedrag is $24\,000 \cdot 1{,}035^{-6} \approx 19\,524{,}02$ euro, minder dan \eur 20\,000.
    - opgave: |-
        Je krijgt over 2 jaar \eur 3000. Hoeveel is dat bedrag waard over 5 jaar, aan 2\,\% per jaar?
      antwoord: |-
        $\approx 3183{,}62$ euro
      uitwerking: |-
        Van tijdstip 2 naar tijdstip 5 zijn 3 jaar: $3000 \cdot 1{,}02^{3} \approx 3183{,}62$ euro.

- id: h1-looptijd
  soort: kort
  opgave: |-
    Bereken. De rente wordt telkens op het einde van het jaar bijgeschreven.
  lijst: enumerate
  delen:
    - opgave: |-
        Na hoeveel jaar groeit \eur 2000 aan 3,2\,\% per jaar aan tot minstens \eur 3000?
      antwoord: |-
        na 13 jaar
      uitwerking: |-
        $1{,}032^n = 1{,}5$ geeft $n = \frac{\log 1{,}5}{\log 1{,}032} \approx 12{,}87$. Controle: $K_{12} \approx 2918{,}68$ en $K_{13} \approx 3012{,}08$, dus na 13 jaar.
    - opgave: |-
        Bij welke rentevoet per jaar verdubbelt een kapitaal in 20 jaar?
      antwoord: |-
        $\approx 3{,}53\,\%$
      uitwerking: |-
        $u^{20} = 2$ geeft $u = 2^{\frac1{20}} \approx 1{,}035\,26$, dus $i \approx 3{,}53\,\%$.
    - opgave: |-
        Een kapitaal van \eur 7500 is na 6 jaar \eur 8400 geworden. Welke rentevoet per jaar hoort daarbij?
      antwoord: |-
        $\approx 1{,}91\,\%$
      uitwerking: |-
        $u = \bigl(\frac{8400}{7500}\bigr)^{\frac16} = 1{,}12^{\frac16} \approx 1{,}019\,07$, dus $i \approx 1{,}91\,\%$.

- id: h1-rentevoet
  soort: kort
  opgave: |-
    Bereken de rentevoet.
  lijst: enumerate
  delen:
    - opgave: |-
        Een spaarbon van \eur 500 betaalt na 3 jaar \eur 540 terug. Welke rentevoet per jaar?
      antwoord: |-
        $\approx 2{,}60\,\%$
      uitwerking: |-
        $u = \bigl(\frac{540}{500}\bigr)^{\frac13} = 1{,}08^{\frac13} \approx 1{,}025\,99$.
    - opgave: |-
        Bij welke maandrente groeit \eur 1000 in 24 maanden tot \eur 1050? Welke jaarrente is dat?
      antwoord: |-
        $\approx 0{,}2035\,\%$; $\approx 2{,}47\,\%$
      uitwerking: |-
        $\um = 1{,}05^{\frac1{24}} \approx 1{,}002\,035$. Per jaar: $\um^{12} - 1 = 1{,}05^{\frac12} - 1 \approx 0{,}0247$.

- id: h1-gelijkwaardig
  soort: kort
  opgave: |-
    Bereken de gelijkwaardige rentevoet. Geef je antwoord in procent op drie decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        Per maand, bij 2,8\,\% per jaar.
      antwoord: |-
        $0{,}230\,\%$
      uitwerking: |-
        $\im = 1{,}028^{\frac1{12}} - 1 \approx 0{,}002\,304$.
    - opgave: |-
        Per jaar, bij 1,1\,\% per semester.
      antwoord: |-
        $2{,}212\,\%$
      uitwerking: |-
        $i = 1{,}011^2 - 1 = 0{,}022\,121$.
    - opgave: |-
        Per trimester, bij 0,3\,\% per maand.
      antwoord: |-
        $0{,}903\,\%$
      uitwerking: |-
        Een trimester is 3 maanden: $i_4 = 1{,}003^3 - 1 \approx 0{,}009\,027$.
    - opgave: |-
        Per trimester, bij 4,5\,\% per jaar.
      antwoord: |-
        $1{,}106\,\%$
      uitwerking: |-
        $i_4 = 1{,}045^{\frac14} - 1 \approx 0{,}011\,065$.
    - opgave: |-
        Per semester, bij 0,6\,\% per trimester.
      antwoord: |-
        $1{,}204\,\%$
      uitwerking: |-
        Een semester is 2 trimesters: $i_2 = 1{,}006^2 - 1 = 0{,}012\,036$.

- id: h1-deel
  soort: kort
  opgave: |-
    Bereken, met samengestelde intrest.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel wordt \eur 4000 na 5 maanden aan 3\,\% per jaar?
      antwoord: |-
        $\approx 4049{,}57$ euro
      uitwerking: |-
        Vijf maanden zijn $\frac{5}{12}$ jaar: $4000 \cdot 1{,}03^{\frac{5}{12}} \approx 4049{,}57$ euro.
    - opgave: |-
        Hoeveel wordt \eur 10\,000 na 18 maanden aan 2,4\,\% per jaar?
      antwoord: |-
        $\approx 10\,362{,}15$ euro
      uitwerking: |-
        $10\,000 \cdot 1{,}024^{1{,}5} \approx 10\,362{,}15$ euro.
    - opgave: |-
        Na hoeveel maanden wordt \eur 1000 aan 0,25\,\% per maand voor het eerst meer dan \eur 1050?
      antwoord: |-
        na 20 maanden
      uitwerking: |-
        $1{,}0025^m = 1{,}05$ geeft $m = \frac{\log 1{,}05}{\log 1{,}0025} \approx 19{,}54$, dus na 20 maanden.

- id: h1-proportioneel
  soort: kort
  opgave: |-
    Nominaal en effectief.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de effectieve rentevoet bij een nominale rentevoet van 9\,\% per jaar, maandelijks aangerekend.
      antwoord: |-
        $\approx 9{,}381\,\%$
      uitwerking: |-
        De proportionele maandrente is $\frac{9\,\%}{12} = 0{,}75\,\%$, dus $i = 1{,}0075^{12} - 1 \approx 0{,}093\,81$.
    - opgave: |-
        Bereken de effectieve rentevoet bij een nominale rentevoet van 4\,\% per jaar, per trimester aangerekend.
      antwoord: |-
        $\approx 4{,}060\,\%$
      uitwerking: |-
        $\frac{4\,\%}{4} = 1\,\%$ per trimester, dus $i = 1{,}01^4 - 1 \approx 0{,}040\,60$.
    - opgave: |-
        Welke nominale rentevoet, maandelijks aangerekend, hoort bij een effectieve rentevoet van 5\,\%?
      antwoord: |-
        $\approx 4{,}889\,\%$
      uitwerking: |-
        De maandrente moet gelijkwaardig zijn met 5\,\% per jaar: $\im = 1{,}05^{\frac1{12}} - 1 \approx 0{,}004\,074$. De nominale rentevoet is twaalf keer zoveel: $j \approx 0{,}048\,89$.
    - opgave: |-
        Rangschik van goedkoop naar duur voor wie leent: 0,4\,\% per maand, 4,9\,\% per jaar, 1,2\,\% per trimester en 2,45\,\% per semester.
      antwoord: |-
        1,2\,\% per trimester, 4,9\,\% per jaar, 0,4\,\% per maand, 2,45\,\% per semester
      uitwerking: |-
        Zet alles om naar een effectieve jaarrente: $1{,}004^{12} - 1 \approx 4{,}907\,\%$, $4{,}9\,\%$, $1{,}012^4 - 1 \approx 4{,}887\,\%$ en $1{,}0245^2 - 1 \approx 4{,}960\,\%$.

- id: h1-jkp
  soort: kort
  opgave: |-
    Drie leningen zonder kosten: A rekent 0,6\,\% per maand, B 1,8\,\% per trimester, C heeft een JKP van 7,5\,\%.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het JKP van A en van B.
      antwoord: |-
        A: $\approx 7{,}44\,\%$; B: $\approx 7{,}40\,\%$
      uitwerking: |-
        Zonder kosten is het JKP de effectieve jaarrente: $1{,}006^{12} - 1 \approx 0{,}0744$ en $1{,}018^4 - 1 \approx 0{,}0740$.
    - opgave: |-
        Welke lening is het goedkoopst?
      antwoord: |-
        B
      uitwerking: |-
        B heeft het kleinste JKP: 7,40\,\% tegen 7,44\,\% en 7,5\,\%.

