- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    beginwaarde
  opgave: |-
    Bereken de beginwaarde.
  lijst: enumerate
  delen:
    - opgave: |-
        \eur 10\,000 over 5 jaar, aan 3\,\% per jaar.
      antwoord: |-
        $\approx 8626{,}09$ euro
      uitwerking: |-
        $10\,000 \cdot 1{,}03^{-5} \approx 8626{,}09$ euro.
    - opgave: |-
        \eur 2500 over 24 maanden, aan 0,35\,\% per maand.
      antwoord: |-
        $\approx 2298{,}92$ euro
      uitwerking: |-
        $2500 \cdot 1{,}0035^{-24} \approx 2298{,}92$ euro.
    - opgave: |-
        \eur 18\,000 over 4 jaar, aan 1,5\,\% per semester.
      antwoord: |-
        $\approx 15\,978{,}80$ euro
      uitwerking: |-
        Vier jaar zijn 8 semesters: $18\,000 \cdot 1{,}015^{-8} \approx 15\,978{,}80$ euro.
    - opgave: |-
        \eur 60\,000 over 20 jaar, aan 2,7\,\% per jaar.
      antwoord: |-
        $\approx 35\,216{,}19$ euro
