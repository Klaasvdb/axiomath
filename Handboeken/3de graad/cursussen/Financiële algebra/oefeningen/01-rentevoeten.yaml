- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    grafiek lezen: eindkapitaal en rentevoet
  figuur:
    code: |-
      \begin{tikzpicture}[x=.48cm,y=.0022cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=1,ystep=250] (0,1500) grid (10,3500);
        \draw[->,grijs] (0,1500) -- (10.6,1500) node[right,text=black] {jaar};
        \draw[->,grijs] (0,1500) -- (0,3650) node[above,text=black] {euro};
        \foreach \t in {0,2,...,10}{\node[below,inner sep=1.5pt] at (\t,1500) {$\t$};}
        \foreach \k in {1500,2000,2500,3000,3500}{\node[left,inner sep=1.5pt] at (0,\k) {$\k$};}
        \foreach \t in {0,...,10}{\fill[accent] (\t,{2000*1.05^\t}) circle (2pt);}
      \end{tikzpicture}
  opgave: |-
    De figuur toont het kapitaal op een spaarrekening op het einde van elk jaar, met samengestelde intrest.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees het beginkapitaal en het kapitaal na 10 jaar af.
      antwoord: |-
        2000 euro; ongeveer 3250 euro
      uitwerking: |-
        Het eerste punt ligt op 2000. Het laatste ligt net boven 3250 (in werkelijkheid 3257,79).
    - opgave: |-
        Bereken de rentevoet per jaar uit je aflezing.
      antwoord: |-
        $\approx 5\,\%$
      uitwerking: |-
        $u = \bigl(\frac{3250}{2000}\bigr)^{\frac1{10}} \approx 1{,}0498$: ongeveer 5\,\% per jaar.
    - opgave: |-
        Waarom liggen de punten niet op een rechte?
      antwoord: |-
        de rente groeit elk jaar mee
      uitwerking: |-
        Bij samengestelde intrest komt er elk jaar 5\,\% van een groter bedrag bij, dus de sprongen worden groter. Bij enkelvoudige intrest zouden de punten op een rechte liggen.
    - opgave: |-
        Na hoeveel jaar is het kapitaal verdubbeld? Kun je dat aflezen?
      antwoord: |-
        na 15 jaar; niet aflezen
      uitwerking: |-
        $1{,}05^n = 2$ geeft $n = \frac{\log 2}{\log 1{,}05} \approx 14{,}2$: na 15 jaar. Dat ligt buiten de figuur.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    klassieke fouten: waar of vals
  opgave: |-
    Waar of vals? Verbeter wat vals is.
  lijst: enumerate
  delen:
    - opgave: |-
        0,5\,\% per maand is gelijkwaardig met 6\,\% per jaar.
      antwoord: |-
        vals: met $6{,}168\,\%$
      uitwerking: |-
        $1{,}005^{12} - 1 \approx 0{,}061\,68$. De proportionele rentevoet is niet gelijkwaardig.
    - opgave: |-
        Na 2 jaar aan 3\,\% per jaar is een kapitaal 6\,\% groter geworden.
      antwoord: |-
        vals: $6{,}09\,\%$
      uitwerking: |-
        $1{,}03^2 = 1{,}0609$: het kapitaal is 6,09\,\% groter.
    - opgave: |-
        De maandrente die gelijkwaardig is met 6\,\% per jaar, is kleiner dan 0,5\,\%.
      antwoord: |-
        waar: $\approx 0{,}487\,\%$
      uitwerking: |-
        $1{,}06^{\frac1{12}} - 1 \approx 0{,}004\,868$. Dat volgt ook uit de stelling \textit{Proportioneel kost meer}.
    - opgave: |-
        1\,\% per trimester is gelijkwaardig met 2\,\% per semester.
      antwoord: |-
        vals: $2{,}01\,\%$
      uitwerking: |-
        $1{,}01^2 - 1 = 0{,}0201$.
    - opgave: |-
        Bij een positieve rentevoet is de beginwaarde van een kapitaal altijd kleiner dan dat kapitaal.
      antwoord: |-
        waar
      uitwerking: |-
        $u > 1$ en $n > 0$ geven $u^{-n} < 1$, dus $K\,u^{-n} < K$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    looptijd berekenen
  opgave: |-
    Bereken de looptijd.
  lijst: enumerate
  delen:
    - opgave: |-
        Na hoeveel jaar is een kapitaal aan 1,8\,\% per jaar verdubbeld, als de rente per jaar wordt bijgeschreven?
      antwoord: |-
        na 39 jaar
      uitwerking: |-
        $n = \frac{\log 2}{\log 1{,}018} \approx 38{,}85$, dus 39 jaar.
    - opgave: |-
        Na hoeveel maanden wordt \eur 3200 aan 0,28\,\% per maand minstens \eur 5000?
      antwoord: |-
        na 160 maanden
      uitwerking: |-
        $1{,}0028^m = \frac{5000}{3200} = 1{,}5625$ geeft $m = \frac{\log 1{,}5625}{\log 1{,}0028} \approx 159{,}6$, dus 160 maanden (13 jaar en 4 maanden).
    - opgave: |-
        Hoeveel jaar duurt het voor een kapitaal aan 0,6\,\% per trimester met een vierde is aangegroeid? Geef een kommagetal.
      antwoord: |-
        $\approx 9{,}33$ jaar
      uitwerking: |-
        Per jaar is de rentefactor $1{,}006^4$. Dan $n = \frac{\log 1{,}25}{4 \log 1{,}006} \approx 9{,}33$ jaar (37,3 trimesters).

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    rentevoet berekenen
  opgave: |-
    Bereken de rentevoet.
  lijst: enumerate
  delen:
    - opgave: |-
        \eur 5000 groeit in 7 jaar tot \eur 5800. Rentevoet per jaar?
      antwoord: |-
        $\approx 2{,}14\,\%$
      uitwerking: |-
        $u = 1{,}16^{\frac17} \approx 1{,}021\,43$.
    - opgave: |-
        \eur 1200 groeit in 18 maanden tot \eur 1340. Rentevoet per maand en per jaar?
      antwoord: |-
        $\approx 0{,}615\,\%$ per maand; $\approx 7{,}63\,\%$ per jaar
      uitwerking: |-
        $\um = \bigl(\frac{1340}{1200}\bigr)^{\frac1{18}} \approx 1{,}006\,149$. Per jaar: $\um^{12} - 1 \approx 0{,}0763$.
    - opgave: |-
        Bij welke rentevoet per jaar verdubbelt een kapitaal in 12 jaar?
      antwoord: |-
        $\approx 5{,}95\,\%$
      uitwerking: |-
        $u = 2^{\frac1{12}} \approx 1{,}059\,46$.

- id: h1-o8
  soort: opdracht
  niveau: 1
  thema: |-
    nominaal en effectief
  opgave: |-
    Nominaal en effectief.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de effectieve rentevoet bij 6\,\% nominaal, per trimester aangerekend.
      antwoord: |-
        $\approx 6{,}136\,\%$
      uitwerking: |-
        $1{,}015^4 - 1 \approx 0{,}061\,36$.
    - opgave: |-
        Bereken de effectieve rentevoet bij 4,8\,\% nominaal, maandelijks aangerekend.
      antwoord: |-
        $\approx 4{,}907\,\%$
      uitwerking: |-
        $1{,}004^{12} - 1 \approx 0{,}049\,07$.
    - opgave: |-
        Welke nominale rentevoet hoort bij een effectieve rentevoet van 4\,\%, aangerekend per semester, per trimester en per maand? Wat merk je?
      antwoord: |-
        $3{,}961\,\%$; $3{,}941\,\%$; $3{,}928\,\%$; daalt
      uitwerking: |-
        $j = k\,\bigl(1{,}04^{\frac1k} - 1\bigr)$: $2 \cdot 0{,}019\,804 \approx 3{,}961\,\%$, $4 \cdot 0{,}009\,853 \approx 3{,}941\,\%$ en $12 \cdot 0{,}003\,274 \approx 3{,}928\,\%$. Hoe vaker de rente wordt aangerekend, hoe kleiner de nominale rentevoet die dezelfde effectieve rente geeft.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    roerende voorheffing en inflatie
  opgave: |-
    Je zet \eur 10\,000 voor 5 jaar op een termijnrekening aan 3\,\% bruto per jaar, met 30\,\% roerende voorheffing op de rente. De prijzen stijgen elk jaar met 2\,\% (de inflatie).
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel staat er na 5 jaar op de rekening?
      antwoord: |-
        $\approx 11\,095{,}04$ euro
      uitwerking: |-
        De nettorentevoet is $0{,}7 \cdot 3\,\% = 2{,}1\,\%$: $10\,000 \cdot 1{,}021^5 \approx 11\,095{,}04$ euro.
    - opgave: |-
        Wat kost na 5 jaar een pakket dat vandaag \eur 10\,000 kost?
      antwoord: |-
        $\approx 11\,040{,}81$ euro
      uitwerking: |-
        $10\,000 \cdot 1{,}02^5 \approx 11\,040{,}81$ euro.
    - opgave: |-
        Met hoeveel procent per jaar stijgt je koopkracht echt? Wat besluit je?
      antwoord: |-
        $\approx 0{,}098\,\%$; bijna niets
      uitwerking: |-
        Per jaar wordt je bedrag met 1,021 vermenigvuldigd en de prijzen met 1,02, dus je koopkracht met $\frac{1{,}021}{1{,}02} \approx 1{,}000\,98$. Na belasting en inflatie blijft er bijna niets van de rente over.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    wisselende rentevoet, gemiddelde rentevoet
  opgave: |-
    Je zet \eur 3000 op een rekening. De eerste 2 jaar krijg je 1,5\,\% per jaar, de 3 jaar daarna 2,5\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel staat er na 5 jaar op?
      antwoord: |-
        $\approx 3328{,}32$ euro
      uitwerking: |-
        $3000 \cdot 1{,}015^2 \cdot 1{,}025^3 \approx 3328{,}32$ euro.
    - opgave: |-
        Welke vaste rentevoet per jaar had na 5 jaar hetzelfde opgeleverd?
      antwoord: |-
        $\approx 2{,}099\,\%$
      uitwerking: |-
        $u^5 = 1{,}015^2 \cdot 1{,}025^3$ geeft $u \approx 1{,}020\,99$.
    - opgave: |-
        Iemand zegt: \textit{gemiddeld is dat $\frac{2 \cdot 1{,}5 + 3 \cdot 2{,}5}{5} = 2{,}1\,\%$}. Klopt dat precies? Welk gemiddelde moet je nemen?
      antwoord: |-
        bijna; het meetkundig gemiddelde van de rentefactoren
      uitwerking: |-
        Het rekenkundig gemiddelde geeft 2,1\,\%, iets meer dan de 2,099\,\% uit b. De juiste vaste rentefactor is het meetkundig gemiddelde $\sqrt[5]{1{,}015^2 \cdot 1{,}025^3}$ van de vijf rentefactoren.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    betalingen vergelijken met de beginwaarde
  opgave: |-
    Voor een verbouwing kun je kiezen: \eur 5000 nu (A), \eur 5300 over 2 jaar (B) of \eur 5600 over 4 jaar (C). Je spaargeld brengt 2,5\,\% per jaar op.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken een tijdlijn met de drie betalingen en bereken hun beginwaarde.
      antwoord: |-
        5000; $\approx 5044{,}62$; $\approx 5073{,}32$ euro
      uitwerking: |-
        B: $5300 \cdot 1{,}025^{-2} \approx 5044{,}62$ euro. C: $5600 \cdot 1{,}025^{-4} \approx 5073{,}32$ euro.
    - opgave: |-
        Welke betaling is het voordeligst?
      antwoord: |-
        A
      uitwerking: |-
        A heeft de kleinste beginwaarde. Je betaalt het best meteen.
    - opgave: |-
        Bij welke rentevoet zijn A en B even voordelig? En A en C?
      antwoord: |-
        $\approx 2{,}96\,\%$; $\approx 2{,}87\,\%$
      uitwerking: |-
        $5000\,u^2 = 5300$ geeft $u = 1{,}06^{\frac12} \approx 1{,}029\,56$. $5000\,u^4 = 5600$ geeft $u = 1{,}12^{\frac14} \approx 1{,}028\,74$. Brengt je geld meer op, dan wordt later betalen voordeliger.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    bedragen naar een ander tijdstip brengen
  opgave: |-
    Je zet vandaag \eur 1000 op een rekening aan 2\,\% per jaar, en over 3 jaar nog eens \eur 2000.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel staat er na 8 jaar op de rekening?
      antwoord: |-
        $\approx 3379{,}82$ euro
      uitwerking: |-
        De eerste storting staat er 8 jaar, de tweede 5 jaar: $1000 \cdot 1{,}02^8 + 2000 \cdot 1{,}02^5 \approx 1171{,}66 + 2208{,}16 = 3379{,}82$ euro.
    - opgave: |-
        Welk bedrag, vandaag in één keer gestort, geeft na 8 jaar hetzelfde?
      antwoord: |-
        $\approx 2884{,}64$ euro
      uitwerking: |-
        De beginwaarde van beide stortingen: $1000 + 2000 \cdot 1{,}02^{-3} \approx 2884{,}64$ euro. Controle: $2884{,}64 \cdot 1{,}02^8 \approx 3379{,}82$.
    - opgave: |-
        Na hoeveel jaar (vanaf vandaag) staat er \eur 4000 op, als je niets meer stort? Geef een kommagetal.
      antwoord: |-
        $\approx 16{,}5$ jaar
      uitwerking: |-
        $2884{,}64 \cdot 1{,}02^t = 4000$ geeft $t = \frac{\log (4000/2884{,}64)}{\log 1{,}02} \approx 16{,}5$ jaar.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    kredietopening, nominaal en effectief
  opgave: |-
    Een kredietopening rekent 11\,\% nominaal per jaar aan, maandelijks.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke rente betaal je per maand, en wat is de effectieve rentevoet?
      antwoord: |-
        $\approx 0{,}917\,\%$; $\approx 11{,}57\,\%$
      uitwerking: |-
        $\frac{11\,\%}{12} \approx 0{,}9167\,\%$ per maand. Effectief: $\bigl(1 + \frac{0{,}11}{12}\bigr)^{12} - 1 \approx 0{,}1157$.
    - opgave: |-
        Je laat \eur 2000 schuld 8 maanden openstaan, zonder af te betalen. Hoeveel rente betaal je?
      antwoord: |-
        $\approx 151{,}46$ euro
      uitwerking: |-
        $2000 \cdot \bigl(1 + \frac{0{,}11}{12}\bigr)^{8} \approx 2151{,}46$ euro, dus \eur 151,46 rente.
    - opgave: |-
        Welke effectieve rentevoet zou je betalen als de 11\,\% een effectieve jaarrente was? Hoeveel scheelt dat op de 8 maanden van b?
      antwoord: |-
        11\,\%; $\approx 7{,}36$ euro
      uitwerking: |-
        Dan is de schuld $2000 \cdot 1{,}11^{\frac8{12}} \approx 2144{,}10$ euro: \eur 144,10 rente, ongeveer \eur 7,36 minder.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    twee rekeningen vergelijken, grafiek
  figuur:
    code: |-
      \begin{tikzpicture}[x=.28cm,y=.0055cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=2,ystep=100] (0,900) grid (20,2200);
        \draw[->,grijs] (0,900) -- (20.8,900) node[right,text=black] {jaar};
        \draw[->,grijs] (0,900) -- (0,2280) node[above,text=black] {euro};
        \foreach \t in {0,4,...,20}{\node[below,inner sep=1.5pt] at (\t,900) {$\t$};}
        \foreach \k in {1000,1400,1800,2200}{\node[left,inner sep=1.5pt] at (0,\k) {$\k$};}
        \kromme{0}{20}{1000*1.04^\x}
        \draw[fel!80!black,thick] plot[domain=0:20,samples=40,smooth] (\x,{1200*1.02^\x});
        \node[above left,text=accent] at (20,2190) {A};
        \node[below left,text=fel!80!black] at (20,1780) {B};
      \end{tikzpicture}
  opgave: |-
    Op rekening A staat \eur 1000 aan 4\,\% per jaar, op rekening B \eur 1200 aan 2\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees op de figuur af na hoeveel jaar beide rekeningen ongeveer hetzelfde bedrag hebben.
      antwoord: |-
        na ongeveer 9 jaar
      uitwerking: |-
        De krommen snijden elkaar tussen 9 en 10 jaar.
    - opgave: |-
        Bereken het snijpunt exact met een logaritme.
      antwoord: |-
        $t \approx 9{,}39$ jaar
      uitwerking: |-
        $1000 \cdot 1{,}04^t = 1200 \cdot 1{,}02^t \iff \bigl(\frac{1{,}04}{1{,}02}\bigr)^t = 1{,}2$, dus $t = \frac{\log 1{,}2}{\log (1{,}04/1{,}02)} \approx 9{,}39$ jaar. Het bedrag is dan ongeveer \eur 1446.
    - opgave: |-
        Waarom haalt A rekening B altijd in, hoe groot het voordeel van B in het begin ook is?
      antwoord: |-
        de verhouding groeit exponentieel
      uitwerking: |-
        De verhouding $\frac{K_A}{K_B} = \frac{1000}{1200}\bigl(\frac{1{,}04}{1{,}02}\bigr)^t$ is exponentieel met grondtal groter dan 1, dus ze wordt ooit groter dan 1.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    kapitalisatiebon, nettorendement
  opgave: |-
    Een kapitalisatiebon van \eur 1000 betaalt na 5 jaar \eur 1120 terug. Op de rente van \eur 120 wordt dan in één keer 30\,\% roerende voorheffing ingehouden.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de brutorentevoet per jaar.
      antwoord: |-
        $\approx 2{,}29\,\%$
      uitwerking: |-
        $u = 1{,}12^{\frac15} \approx 1{,}022\,92$.
    - opgave: |-
        Hoeveel krijg je netto terug, en welke nettorentevoet per jaar is dat?
      antwoord: |-
        1084 euro; $\approx 1{,}63\,\%$
      uitwerking: |-
        $1000 + 0{,}7 \cdot 120 = 1084$ euro. $u = 1{,}084^{\frac15} \approx 1{,}016\,26$.
    - opgave: |-
        Een termijnrekening van 5 jaar geeft 2\,\% bruto per jaar, met 30\,\% voorheffing elk jaar. Welke belegging levert netto het meest op?
      antwoord: |-
        de bon
      uitwerking: |-
        De termijnrekening geeft netto 1,4\,\% per jaar: $1000 \cdot 1{,}014^5 \approx 1071{,}99$ euro, minder dan 1084 euro.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    gelijkwaardigheid tussen korte periodes
  opgave: |-
    Gelijkwaardige rentevoeten zonder de jaarrente.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\im$ en $i_4$ gelijkwaardig zijn als en slechts als $(1 + \im)^3 = 1 + i_4$.
      antwoord: |-
        beide geven na een jaar dezelfde factor
      uitwerking: |-
        Gelijkwaardig betekent: na een jaar dezelfde groei, $(1 + \im)^{12} = (1 + i_4)^4$. Neem de vierdemachtswortel van beide (positieve) leden: $(1 + \im)^3 = 1 + i_4$.
    - opgave: |-
        Welke semesterrente is gelijkwaardig met 0,2\,\% per maand?
      antwoord: |-
        $\approx 1{,}206\,\%$
      uitwerking: |-
        $1{,}002^6 - 1 \approx 0{,}012\,06$.
    - opgave: |-
        Bereken de dagrente die gelijkwaardig is met 3\,\% per jaar (een jaar van 365 dagen). Controleer dat $30{,}4$ dagen (een gemiddelde maand) dezelfde groei geeft als de gelijkwaardige maandrente.
      antwoord: |-
        $\approx 0{,}0081\,\%$; beide $\approx 0{,}2466\,\%$
      uitwerking: |-
        $1{,}03^{\frac1{365}} - 1 \approx 0{,}000\,081$. Na $\frac{365}{12} \approx 30{,}4$ dagen: $1{,}03^{\frac{1}{12}} - 1 \approx 0{,}002\,466$, precies de maandrente.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    inflatie als negatieve rente
  opgave: |-
    De prijzen stijgen elk jaar met 2,5\,\%.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is \eur 100 over 10 jaar vandaag waard, als je kijkt naar wat je ermee kunt kopen?
      antwoord: |-
        $\approx 78{,}12$ euro
      uitwerking: |-
        Dat is de beginwaarde aan 2,5\,\%: $100 \cdot 1{,}025^{-10} \approx 78{,}12$ euro.
    - opgave: |-
        Na hoeveel jaar zijn de prijzen met de helft gestegen?
      antwoord: |-
        na $\approx 16{,}4$ jaar
      uitwerking: |-
        $1{,}025^t = 1{,}5$ geeft $t = \frac{\log 1{,}5}{\log 1{,}025} \approx 16{,}4$ jaar.
    - opgave: |-
        Met hoeveel procent per maand stijgen de prijzen?
      antwoord: |-
        $\approx 0{,}206\,\%$
      uitwerking: |-
        $1{,}025^{\frac1{12}} - 1 \approx 0{,}002\,060$.

- id: h1-o18
  soort: opdracht
  niveau: 2
  thema: |-
    verdubbelen en verdrievoudigen
  opgave: |-
    Een kapitaal groeit aan $i$ per jaar, met samengestelde intrest.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de verdubbelingstijd niet afhangt van het beginkapitaal.
      antwoord: |-
        $K_0$ valt weg
      uitwerking: |-
        $K_0\,u^n = 2K_0 \iff u^n = 2$: het beginkapitaal valt weg, dus $n = \frac{\log 2}{\log u}$.
    - opgave: |-
        Bij welke rentevoet verdubbelt een kapitaal in 10 jaar?
      antwoord: |-
        $\approx 7{,}18\,\%$
      uitwerking: |-
        $u = 2^{\frac1{10}} \approx 1{,}071\,77$.
    - opgave: |-
        Toon aan dat de verdrievoudigingstijd altijd ongeveer 1,585 keer de verdubbelingstijd is. Controleer met 3\,\% per jaar.
      antwoord: |-
        de verhouding is $\frac{\log 3}{\log 2}$
      uitwerking: |-
        De verhouding is $\frac{\log 3 / \log u}{\log 2 / \log u} = \frac{\log 3}{\log 2} \approx 1{,}585$, onafhankelijk van $u$. Bij 3\,\%: $\frac{\log 3}{\log 1{,}03} \approx 37{,}17$ en $\frac{\log 2}{\log 1{,}03} \approx 23{,}45$, en $\frac{37{,}17}{23{,}45} \approx 1{,}585$.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    vaker aanrekenen kost meer (bewijs)
  opgave: |-
    Neem een nominale rentevoet $j > 0$, aangerekend per $k$-de van een jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\bigl(1 + \frac{0{,}12}{k}\bigr)^k$ voor $k = 1$, 2, 4, 8 en 12. Wat merk je?
      antwoord: |-
        $1{,}12$; $1{,}1236$; $1{,}1255$; $1{,}1265$; $1{,}1268$; stijgt
      uitwerking: |-
        De effectieve rente stijgt als de rente vaker wordt aangerekend, maar steeds minder.
    - opgave: |-
        Toon aan dat $\bigl(1 + \frac{j}{2k}\bigr)^{2} > 1 + \frac jk$, en leid daaruit af dat $\bigl(1 + \frac{j}{2k}\bigr)^{2k} > \bigl(1 + \frac jk\bigr)^k$.
      antwoord: |-
        werk het kwadraat uit
      uitwerking: |-
        $\bigl(1 + \frac{j}{2k}\bigr)^2 = 1 + \frac jk + \frac{j^2}{4k^2} > 1 + \frac jk$. Beide leden zijn positief, dus de $k$-de macht behoudt de ongelijkheid: $\bigl(1 + \frac{j}{2k}\bigr)^{2k} > \bigl(1 + \frac jk\bigr)^k$.
    - opgave: |-
        Wat betekent b voor een lening met rente per semester tegenover dezelfde nominale rente per trimester?
      antwoord: |-
        per trimester is duurder
      uitwerking: |-
        Neem $k = 2$: per trimester ($2k = 4$) aangerekend is de effectieve rentevoet groter dan per semester. Elke verdubbeling van het aantal periodes maakt de lening duurder.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    spaarrekening: enkelvoudige intrest binnen het jaar
  figuur:
    code: |-
      \begin{tikzpicture}[x=3.4cm,y=7cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=.25,ystep=.1] (0,1) grid (1,1.4);
        \draw[->,grijs] (0,1) -- (1.1,1) node[right,text=black] {$t$};
        \draw[->,grijs] (0,1) -- (0,1.45);
        \foreach \t in {0,.5,1}{\node[below,inner sep=1.5pt] at (\t,1) {$\t$};}
        \foreach \k in {1,1.2,1.4}{\node[left,inner sep=1.5pt] at (0,\k) {$\k$};}
        \draw[fel!80!black,thick] (0,1) -- (1,1.4) node[right] {$1 + it$};
        \kromme{0}{1}{1.4^\x}
        \node[below right,text=accent] at (.6,1.2) {$u^t$};
      \end{tikzpicture}
  opgave: |-
    Op een gereglementeerde spaarrekening wordt de basisrente per dag berekend met enkelvoudige intrest: een bedrag dat $d$ dagen op de rekening staat, krijgt $i \cdot \frac{d}{365}$ keer dat bedrag aan rente. Die rente wordt één keer per jaar bijgeschreven. Een bedrag dat een vol jaar blijft staan, krijgt daarbovenop een getrouwheidspremie.
  lijst: enumerate
  delen:
    - opgave: |-
        Je stort \eur 3000 die 219 dagen blijft staan. Hoeveel basisrente krijg je aan 0,6\,\% per jaar?
      antwoord: |-
        10,80 euro
      uitwerking: |-
        $3000 \cdot 0{,}006 \cdot \frac{219}{365} = 10{,}80$ euro.
    - opgave: |-
        Blijft de \eur 3000 een vol jaar staan, dan krijg je ook een getrouwheidspremie van 1,2\,\%. Hoeveel rente krijg je in totaal, en welke rentevoet is dat?
      antwoord: |-
        54 euro; 1,8\,\%
      uitwerking: |-
        Basisrente $3000 \cdot 0{,}006 = 18$ euro en premie $3000 \cdot 0{,}012 = 36$ euro: samen \eur 54, of 1,8\,\%.
    - opgave: |-
        Toon met de figuur aan dat enkelvoudige intrest binnen het jaar iets meer oplevert dan samengestelde intrest aan dezelfde jaarrente: $u^t \leqslant 1 + it$ voor $0 \leqslant t \leqslant 1$.
      antwoord: |-
        de grafiek van $u^t$ is hol en ligt onder de koorde
      uitwerking: |-
        De functie $f(t) = u^t$ heeft $f''(t) = u^t (\ln u)^2 > 0$: ze is hol. De rechte $1 + it$ is de koorde door $(0, 1)$ en $(1, u)$, en een holle grafiek ligt tussen de eindpunten onder haar koorde. Dus $u^t \leqslant 1 + it$ op $[0, 1]$.
    - opgave: |-
        Hoeveel scheelt het voor \eur 3000 na een half jaar aan 2\,\% per jaar?
      antwoord: |-
        $\approx 0{,}15$ euro
      uitwerking: |-
        Enkelvoudig: $3000 \cdot 1{,}01 = 3030$ euro. Samengesteld: $3000 \cdot 1{,}02^{0{,}5} \approx 3029{,}85$ euro. Het verschil is ongeveer 15 cent.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    reële rentevoet
  opgave: |-
    De \textit{reële rentevoet} $r$ zegt hoeveel je koopkracht per jaar groeit bij een rentevoet $i$ en een inflatie $\pi$ per jaar: $(1 + r)(1 + \pi) = 1 + i$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $r = \dfrac{i - \pi}{1 + \pi}$.
      antwoord: |-
        los op naar $r$
      uitwerking: |-
        $1 + r = \frac{1 + i}{1 + \pi}$, dus $r = \frac{1 + i - (1 + \pi)}{1 + \pi} = \frac{i - \pi}{1 + \pi}$.
    - opgave: |-
        Bereken $r$ voor $i = 3\,\%$ en $\pi = 4\,\%$. Wat betekent het teken?
      antwoord: |-
        $\approx -0{,}96\,\%$; je koopkracht daalt
      uitwerking: |-
        $r = \frac{-0{,}01}{1{,}04} \approx -0{,}0096$. De rente compenseert de prijsstijging niet: je kunt elk jaar minder kopen.
    - opgave: |-
        Vaak zegt men: \textit{de reële rente is de rente min de inflatie}. Is die vuistregel te hoog of te laag als $i > \pi > 0$? Waarom werkt hij bij kleine percentages toch goed?
      antwoord: |-
        te hoog; de noemer $1 + \pi$ ligt dicht bij 1
      uitwerking: |-
        Voor $i > \pi > 0$ is $r = \frac{i - \pi}{1 + \pi} < i - \pi$: de vuistregel is te hoog. Bij een inflatie van enkele procent is $1 + \pi$ bijna 1, en verschilt $r$ maar weinig van $i - \pi$.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    rentevoet uit twee bedragen, proportioneel tegenover gelijkwaardig
  opgave: |-
    Een bank adverteert een spaarrekening met \textit{3\,\% per jaar, maandelijks bijgeschreven}. Een klant ziet na precies een jaar \eur 2060,83 op een rekening waar hij \eur 2000 op zette.
  lijst: enumerate
  delen:
    - opgave: |-
        Rekent de bank met de gelijkwaardige of met de proportionele maandrente?
      antwoord: |-
        proportioneel
      uitwerking: |-
        Gelijkwaardig zou na een jaar precies $2000 \cdot 1{,}03 = 2060$ euro geven. Proportioneel: $2000 \cdot 1{,}0025^{12} \approx 2060{,}83$ euro. De bank gebruikt de proportionele maandrente.
    - opgave: |-
        Hoeveel zou er na 10 jaar op staan met elk van beide manieren? Hoeveel scheelt het?
      antwoord: |-
        $\approx 2687{,}83$ en $\approx 2698{,}71$ euro; $\approx 10{,}87$ euro
      uitwerking: |-
        Gelijkwaardig: $2000 \cdot 1{,}03^{10} \approx 2687{,}83$ euro. Proportioneel: $2000 \cdot 1{,}0025^{120} \approx 2698{,}71$ euro. Het verschil is ongeveer \eur 10,87.
    - opgave: |-
        Toon aan dat het verschil tussen beide bedragen na $n$ jaar elk jaar groter wordt.
      antwoord: |-
        $2000\,(v^n - u^n)$ met $v > u > 1$ stijgt
      uitwerking: |-
        Met $v = 1{,}0025^{12} > u = 1{,}03$ is het verschil $d_n = 2000\,(v^n - u^n)$, en $d_{n+1} - d_n = 2000\,\bigl(v^n(v - 1) - u^n(u - 1)\bigr) > 0$, want $v^n > u^n > 0$ en $v - 1 > u - 1 > 0$.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Exponentiële en logaritmische functies
  opgave: |-
    Een nominale rentevoet van 5\,\% per jaar wordt $k$ keer per jaar aangerekend.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de effectieve rentevoet voor $k = 12$ (per maand) en $k = 365$ (per dag).
      antwoord: |-
        $\approx 5{,}1162\,\%$; $\approx 5{,}1267\,\%$
      uitwerking: |-
        $\bigl(1 + \frac{0{,}05}{12}\bigr)^{12} - 1 \approx 0{,}051\,162$ en $\bigl(1 + \frac{0{,}05}{365}\bigr)^{365} - 1 \approx 0{,}051\,267$.
    - opgave: |-
        Naar welke effectieve rentevoet gaat dat als $k$ onbeperkt groeit? Gebruik dat $\bigl(1 + \frac jk\bigr)^k$ naar $\e^{j}$ gaat.
      antwoord: |-
        $\e^{0{,}05} - 1 \approx 5{,}1271\,\%$
      uitwerking: |-
        De groeifactor per jaar gaat naar $\e^{0{,}05} \approx 1{,}051\,271$: continue rente.
    - opgave: |-
        Welke continue rentevoet $r$ is gelijkwaardig met 5\,\% per jaar, dus met $\e^{r} = 1{,}05$?
      antwoord: |-
        $r = \ln 1{,}05 \approx 4{,}879\,\%$
      uitwerking: |-
        $r = \ln 1{,}05 \approx 0{,}048\,79$. Ook hier is de rentevoet bij de kortere periode (hier: oneindig kort) kleiner.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: discreet
    onderwerp: |-
      Rijen
  opgave: |-
    Een kapitaal $K_0$ staat $n$ jaar uit aan $i$ per jaar, met samengestelde intrest.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de rente die in jaar $k$ wordt bijgeschreven, $K_0\,i\,u^{k - 1}$ is. Welke soort rij vormen de renten?
      antwoord: |-
        een meetkundige rij met quotiënt $u$
      uitwerking: |-
        In jaar $k$ is de rente $i$ keer het kapitaal aan het begin van dat jaar, $K_{k-1} = K_0\,u^{k-1}$. De renten vormen een meetkundige rij met eerste term $K_0\,i$ en quotiënt $u$.
    - opgave: |-
        Bereken de som van alle renten met de somformule van een meetkundige rij, en verklaar het resultaat.
      antwoord: |-
        $K_0\,(u^n - 1) = K_n - K_0$
      uitwerking: |-
        $K_0\,i \cdot \frac{u^n - 1}{u - 1} = K_0\,(u^n - 1)$, want $u - 1 = i$. Dat is $K_n - K_0$: alle rente samen is wat er bij is gekomen.
    - opgave: |-
        Bereken de rente in jaar 1, 2 en 3, en de totale rente na 10 jaar, voor \eur 1000 aan 3\,\%.
      antwoord: |-
        30; 30,90; 31,83 euro; $\approx 343{,}92$ euro
      uitwerking: |-
        $30$, $30 \cdot 1{,}03 = 30{,}90$ en $30 \cdot 1{,}03^2 \approx 31{,}83$ euro. Totaal: $1000\,(1{,}03^{10} - 1) \approx 343{,}92$ euro.

- id: h1-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: analyse
    onderwerp: |-
      Limieten en afgeleiden
  opgave: |-
    Bankiers schatten de verdubbelingstijd met de \textit{regel van 72}: bij $p\,\%$ per jaar duurt het ongeveer $\frac{72}{p}$ jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de verdubbelingstijd exact $\dfrac{\ln 2}{\ln(1 + i)}$ jaar is.
      antwoord: |-
        $(1 + i)^n = 2$
      uitwerking: |-
        $(1 + i)^n = 2 \iff n \ln(1 + i) = \ln 2$.
    - opgave: |-
        Bepaal de raaklijn aan de grafiek van $f(x) = \ln(1 + x)$ in $x = 0$. Welke benadering van de verdubbelingstijd volgt daaruit, met $i = \frac{p}{100}$?
      antwoord: |-
        $y = x$; $\frac{69{,}3}{p}$
      uitwerking: |-
        $f(0) = 0$ en $f'(x) = \frac{1}{1 + x}$, dus $f'(0) = 1$ en de raaklijn is $y = x$. Met $\ln(1 + i) \approx i$ is de verdubbelingstijd ongeveer $\frac{\ln 2}{i} \approx \frac{0{,}693}{i} = \frac{69{,}3}{p}$.
    - opgave: |-
        Vergelijk de exacte waarde, $\frac{69{,}3}{p}$ en $\frac{72}{p}$ voor 3\,\% en 8\,\%. Waarom is $\frac{69{,}3}{p}$ altijd te klein?
      antwoord: |-
        3\,\%: 23,45; 23,1; 24. 8\,\%: 9,01; 8,66; 9
      uitwerking: |-
        Bij 3\,\%: exact $23{,}45$, $\frac{69{,}3}{3} = 23{,}1$, $\frac{72}{3} = 24$. Bij 8\,\%: exact $9{,}01$, $8{,}66$ en $9$. De grafiek van $\ln(1 + x)$ is bol en ligt onder haar raaklijn, dus $\ln(1 + i) < i$ en $\frac{\ln 2}{\ln(1+i)} > \frac{\ln 2}{i}$. De 72 corrigeert dat, en is bovendien makkelijk deelbaar.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Je zet \eur 4000 voor 6 jaar op een termijnrekening aan 2,4\,\% bruto per jaar, met 30\,\% roerende voorheffing op de jaarlijkse rente. Hoeveel staat er na 6 jaar op?
  antwoord: |-
    $\approx 4420{,}52$ euro
  uitwerking: |-
    Nettorentevoet $0{,}7 \cdot 0{,}024 = 0{,}0168$. $K_6 = 4000 \cdot 1{,}0168^6 \approx 4420{,}52$ euro.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Wat ontvang je liever, aan 2,2\,\% per jaar: \eur 7000 nu of \eur 7700 over 4 jaar? Toon het met een berekening.
  antwoord: |-
    \eur 7700 over 4 jaar
  uitwerking: |-
    De beginwaarde van het latere bedrag is $7700 \cdot 1{,}022^{-4} \approx 7058{,}09$ euro, meer dan \eur 7000.

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Na hoeveel jaar groeit \eur 3000 aan 2,7\,\% per jaar (jaarlijks bijgeschreven) voor het eerst aan tot meer dan \eur 4000?
  antwoord: |-
    na 11 jaar
  uitwerking: |-
    $1{,}027^n = \frac43$ geeft $n = \frac{\log(4/3)}{\log 1{,}027} \approx 10{,}8$. Controle: $K_{10} \approx 3915{,}85$ en $K_{11} \approx 4021{,}57$.

- id: h1-t4
  soort: test
  niveau: 1
  opgave: |-
    Bereken de gelijkwaardige rentevoet.
  lijst: enumerate
  delen:
    - opgave: |-
        Per maand, bij 3,2\,\% per jaar.
      antwoord: |-
        $\approx 0{,}263\,\%$
      uitwerking: |-
        $1{,}032^{\frac1{12}} - 1 \approx 0{,}002\,628$.
    - opgave: |-
        Per jaar, bij 0,8\,\% per trimester.
      antwoord: |-
        $\approx 3{,}239\,\%$
      uitwerking: |-
        $1{,}008^4 - 1 \approx 0{,}032\,386$.

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    Je belegt \eur 6000 gedurende 7 maanden aan 1,8\,\% per jaar, met samengestelde intrest. Hoeveel rente krijg je?
  antwoord: |-
    $\approx 62{,}77$ euro
  uitwerking: |-
    $6000 \cdot 1{,}018^{\frac{7}{12}} \approx 6062{,}77$ euro, dus \eur 62,77 rente.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Lening A rekent 7,2\,\% nominaal per jaar aan, maandelijks. Lening B heeft een effectieve rentevoet van 7,4\,\% per jaar. Welke lening is goedkoper?
  antwoord: |-
    B
  uitwerking: |-
    A: $\bigl(1 + \frac{0{,}072}{12}\bigr)^{12} - 1 = 1{,}006^{12} - 1 \approx 7{,}44\,\%$ effectief, meer dan de 7,4\,\% van B.

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Een winkel biedt een lening aan 0,45\,\% per maand, een bank aan 5,6\,\% per jaar. Welke is goedkoper? Welke maandrente is gelijkwaardig met die van de bank?
  antwoord: |-
    de winkel; $\approx 0{,}455\,\%$
  uitwerking: |-
    $1{,}0045^{12} - 1 \approx 5{,}54\,\%$ per jaar, minder dan 5,6\,\%: hier is de winkel goedkoper. De bank: $1{,}056^{\frac1{12}} - 1 \approx 0{,}004\,551$, meer dan 0,45\,\% per maand.
