- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    eindkapitaal
  opgave: |-
    Bereken het eindkapitaal, met samengestelde intrest.
  lijst: enumerate
  delen:
    - opgave: |-
        \eur 1500 gedurende 7 jaar aan 2\,\% per jaar.
      antwoord: |-
        $\approx 1723{,}03$ euro
      uitwerking: |-
        $1500 \cdot 1{,}02^7 \approx 1723{,}03$ euro.
    - opgave: |-
        \eur 800 gedurende 30 maanden aan 0,4\,\% per maand.
      antwoord: |-
        $\approx 901{,}78$ euro
      uitwerking: |-
        $800 \cdot 1{,}004^{30} \approx 901{,}78$ euro.
    - opgave: |-
        \eur 12\,000 gedurende 3 jaar aan 1,25\,\% per trimester.
      antwoord: |-
        $\approx 13\,929{,}05$ euro
      uitwerking: |-
        Drie jaar zijn 12 trimesters: $12\,000 \cdot 1{,}0125^{12} \approx 13\,929{,}05$ euro.
    - opgave: |-
        \eur 25\,000 gedurende 15 jaar aan 3,1\,\% per jaar.
      antwoord: |-
        $\approx 39\,520{,}28$ euro
      uitwerking: |-
        $25\,000 \cdot 1{,}031^{15} \approx 39\,520{,}28$ euro.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    gelijkwaardige rentevoeten omzetten
  opgave: |-
    Bereken de gelijkwaardige rentevoet, in procent op drie decimalen.
  lijst: enumerate
  delen:
    - opgave: |-
        2,5\,\% per jaar, per maand.
      antwoord: |-
        $0{,}206\,\%$
      uitwerking: |-
        $1{,}025^{\frac1{12}} - 1 \approx 0{,}002\,060$.
    - opgave: |-
        2,5\,\% per jaar, per semester.
      antwoord: |-
        $1{,}242\,\%$
      uitwerking: |-
        $1{,}025^{\frac12} - 1 \approx 0{,}012\,423$.
    - opgave: |-
        0,2\,\% per maand, per jaar.
      antwoord: |-
        $2{,}427\,\%$
      uitwerking: |-
        $1{,}002^{12} - 1 \approx 0{,}024\,266$.
    - opgave: |-
        0,2\,\% per maand, per trimester.
      antwoord: |-
        $0{,}601\,\%$
      uitwerking: |-
        $1{,}002^{3} - 1 \approx 0{,}006\,012$.
    - opgave: |-
        1,5\,\% per trimester, per semester.
      antwoord: |-
        $3{,}023\,\%$
      uitwerking: |-
        $1{,}015^{2} - 1 = 0{,}030\,225$.
    - opgave: |-
        2\,\% per semester, per maand.
      antwoord: |-
        $0{,}331\,\%$
      uitwerking: |-
