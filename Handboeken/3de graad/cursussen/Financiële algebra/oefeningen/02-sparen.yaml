# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of beantwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $1 + 1{,}02 + 1{,}02^2 + \cdots + 1{,}02^9$ met de somformule van een meetkundige rij.
      antwoord: |-
        $\approx 10{,}9497$
      uitwerking: |-
        Tien termen met eerste term 1 en quotiënt $1{,}02$: $\frac{1{,}02^{10} - 1}{1{,}02 - 1} \approx 10{,}9497$.
    - opgave: |-
        Je stort \eur 200 op tijdstip 0, 1 en 2 (in jaar), aan 5\,\% per jaar. Hoeveel is elke storting waard op tijdstip 3? Hoeveel samen?
      antwoord: |-
        231,53; 220,50; 210 euro; samen 662,03 euro
      uitwerking: |-
        De stortingen staan 3, 2 en 1 jaar uit: $200 \cdot 1{,}05^3 \approx 231{,}53$, $200 \cdot 1{,}05^2 = 220{,}50$ en $200 \cdot 1{,}05 = 210$. Samen \eur 662,03.
    - opgave: |-
        Welke maandrente is gelijkwaardig met 3\,\% per jaar?
      antwoord: |-
        $\approx 0{,}2466\,\%$
      uitwerking: |-
        $1{,}03^{\frac1{12}} - 1 \approx 0{,}002\,466$.
    - opgave: |-
        Los op: $1{,}01^n = 1{,}5$.
      antwoord: |-
        $n \approx 40{,}75$
      uitwerking: |-
        $n = \frac{\log 1{,}5}{\log 1{,}01} \approx 40{,}75$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Ann en Bert sparen allebei 3 jaar lang \eur 100 per jaar aan 5\,\% per jaar. Ann stort aan het begin van elk jaar, Bert op het einde.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken beide tijdlijnen. Hoeveel heeft elk op het einde van het derde jaar?
      antwoord: |-
        Ann: $\approx 331{,}01$ euro; Bert: $315{,}25$ euro
      uitwerking: |-
        Ann: $100 \cdot 1{,}05^3 + 100 \cdot 1{,}05^2 + 100 \cdot 1{,}05 \approx 331{,}01$ euro. Bert: $100 \cdot 1{,}05^2 + 100 \cdot 1{,}05 + 100 = 315{,}25$ euro.
    - opgave: |-
        Deel het bedrag van Ann door dat van Bert. Wat merk je, en hoe verklaar je dat?
      antwoord: |-
        $1{,}05$: elke storting van Ann staat een jaar langer uit
      uitwerking: |-
        $\frac{331{,}01}{315{,}25} = 1{,}05$. Elke storting van Ann valt een jaar vroeger dan de overeenkomstige van Bert, en groeit dus één keer meer met de factor 1,05.

- id: h2-soort
  soort: kort
  opgave: |-
    Is de annuïteit prenumerando of postnumerando? Geef de periode, het termijnbedrag en het aantal termijnen.
  lijst: enumerate
  delen:
    - opgave: |-
        Een huurder betaalt een jaar lang aan het begin van elke maand \eur 750 huur.
      antwoord: |-
        prenumerando; een maand; $a = 750$; $n = 12$
      uitwerking: |-
        De huur valt aan het begin van de maand waarvoor ze geldt.
    - opgave: |-
        Een lening wordt in 5 jaar terugbetaald met een vast bedrag van \eur 820 op het einde van elk trimester.
      antwoord: |-
        postnumerando; een trimester; $a = 820$; $n = 20$
      uitwerking: |-
        De eerste betaling valt na het eerste trimester; 4 trimesters per jaar, 5 jaar lang.
    - opgave: |-
        Een student krijgt van 1 september tot en met 1 juni op de eerste van elke maand \eur 400 van zijn ouders.
      antwoord: |-
        prenumerando; een maand; $a = 400$; $n = 10$
      uitwerking: |-
        September tot en met juni zijn 10 maanden, telkens aan het begin.

- id: h2-eind
  soort: kort
  opgave: |-
    Bereken de eindwaarde van de prenumerando annuïteit.
  lijst: enumerate
  delen:
    - opgave: |-
        \eur 75 per maand, 8 jaar lang, aan 2,2\,\% per jaar.
      antwoord: |-
        $\approx 7871{,}87$ euro
      uitwerking: |-
        $\im = 1{,}022^{\frac1{12}} - 1$, $n = 96$: $E = 75\,\um \cdot \frac{\um^{96} - 1}{\im} \approx 7871{,}87$ euro (zelf gestort: \eur 7200).
    - opgave: |-
        \eur 2000 per jaar, 15 jaar lang, aan 3\,\% per jaar.
      antwoord: |-
        $\approx 38\,313{,}76$ euro
      uitwerking: |-
        $E = 2000 \cdot 1{,}03 \cdot \frac{1{,}03^{15} - 1}{0{,}03} \approx 38\,313{,}76$ euro.
    - opgave: |-
        \eur 400 per trimester, 5 jaar lang, aan 1,6\,\% per jaar.
      antwoord: |-
        $\approx 8342{,}57$ euro
      uitwerking: |-
        $i_4 = 1{,}016^{\frac14} - 1 \approx 0{,}003\,976$, $n = 20$: $E = 400\,u_4 \cdot \frac{u_4^{20} - 1}{i_4} \approx 8342{,}57$ euro.

- id: h2-prepost
  soort: kort
  opgave: |-
    Je stort 8 jaar lang \eur 300 per jaar, aan 2,5\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel staat er op het einde van het achtste jaar, als je aan het begin van elk jaar stort?
      antwoord: |-
        $\approx 2686{,}36$ euro
      uitwerking: |-
        Prenumerando: $300 \cdot 1{,}025 \cdot \frac{1{,}025^8 - 1}{0{,}025} \approx 2686{,}36$ euro.
    - opgave: |-
        En als je op het einde van elk jaar stort? Controleer dat het verschil een factor 1,025 is.
      antwoord: |-
        $\approx 2620{,}83$ euro
      uitwerking: |-
        Postnumerando: $300 \cdot \frac{1{,}025^8 - 1}{0{,}025} \approx 2620{,}83$ euro, en $2620{,}83 \cdot 1{,}025 \approx 2686{,}36$.

- id: h2-later
  soort: kort
  opgave: |-
    Stortingen aan het begin van elke maand.
  lijst: enumerate
  delen:
    - opgave: |-
        Je stort 6 jaar lang \eur 120 per maand aan 2\,\% per jaar, en laat het geld daarna nog 4 jaar staan. Hoeveel heb je na 10 jaar?
      antwoord: |-
        $\approx 9938{,}68$ euro
      uitwerking: |-
        Na 6 jaar: $E = 120\,\um \cdot \frac{\um^{72} - 1}{\im} \approx 9181{,}80$ euro, met $\im = 1{,}02^{\frac1{12}} - 1$. Nog 4 jaar: $9181{,}80 \cdot 1{,}02^4 \approx 9938{,}68$ euro.
    - opgave: |-
        Anja stort van haar 25ste tot haar 35ste \eur 100 per maand (120 stortingen) en laat het geld dan staan tot haar 65ste. Bart stort van zijn 35ste tot zijn 65ste \eur 100 per maand (360 stortingen). Wie heeft op 65 jaar het meest, aan 3\,\% per jaar?
      antwoord: |-
        Bart: $\approx 58\,014$ euro tegen $\approx 33\,931$ euro
      uitwerking: |-
        Anja: $100\,\um \cdot \frac{\um^{120} - 1}{\im} \approx 13\,979{,}19$ op 35 jaar, en $13\,979{,}19 \cdot 1{,}03^{30} \approx 33\,931{,}17$ op 65 jaar. Bart: $100\,\um \cdot \frac{\um^{360} - 1}{\im} \approx 58\,014{,}03$. Bart stort drie keer zoveel (\eur 36\,000 tegen \eur 12\,000) en heeft meer, maar Anja haalt met een derde van de inleg meer dan de helft van zijn bedrag.

- id: h2-termijn
  soort: kort
  opgave: |-
    Bereken het termijnbedrag van de prenumerando annuïteit.
  lijst: enumerate
  delen:
    - opgave: |-
        Om na 4 jaar \eur 8000 te hebben, met stortingen per maand aan 2\,\% per jaar.
      antwoord: |-
        $\approx 160{,}02$ euro
      uitwerking: |-
        $\im = 1{,}02^{\frac1{12}} - 1$, $n = 48$: $a = \frac{8000\,\im}{\um\,(\um^{48} - 1)} \approx 160{,}02$ euro.
    - opgave: |-
        Om na 10 jaar \eur 25\,000 te hebben, met stortingen per jaar aan 2,75\,\% per jaar.
      antwoord: |-
        $\approx 2146{,}95$ euro
      uitwerking: |-
        $a = \frac{25\,000 \cdot 0{,}0275}{1{,}0275\,(1{,}0275^{10} - 1)} \approx 2146{,}95$ euro.
    - opgave: |-
        Om na 18 maanden \eur 3000 te hebben, met stortingen per maand aan 1,5\,\% per jaar.
      antwoord: |-
        $\approx 164{,}71$ euro
      uitwerking: |-
        $\im = 1{,}015^{\frac1{12}} - 1$, $n = 18$: $a \approx 164{,}71$ euro.

- id: h2-looptijd
  soort: kort
  opgave: |-
    Hoeveel stortingen (aan het begin van elke periode) zijn nodig?
  lijst: enumerate
  delen:
    - opgave: |-
        \eur 80 per maand aan 2\,\% per jaar, tot er minstens \eur 3000 op staat.
      antwoord: |-
        37 maanden
      uitwerking: |-
        $\um^n = 1 + \frac{3000\,\im}{80\,\um}$ geeft $n \approx 36{,}36$. Controle: $E_{36} \approx 2969{,}72$ en $E_{37} \approx 3054{,}75$.
    - opgave: |-
        \eur 1500 per jaar aan 3,5\,\% per jaar, tot er minstens \eur 20\,000 op staat.
      antwoord: |-
        11 jaar
      uitwerking: |-
        $1{,}035^n = 1 + \frac{20\,000 \cdot 0{,}035}{1500 \cdot 1{,}035}$ geeft $n \approx 10{,}82$. Controle: $E_{10} \approx 18\,212{,}99$ en $E_{11} \approx 20\,402{,}94$.

- id: h2-rentevoet
  soort: kort
  opgave: |-
    Sluit de rentevoet in met een tabel.
  lijst: enumerate
  delen:
    - opgave: |-
        Wie 3 jaar lang aan het begin van elke maand \eur 200 stort, heeft na 3 jaar \eur 7500. Bepaal de maandrente op 0,01\,\% (honderdste van een procent) nauwkeurig en de jaarrente.
      antwoord: |-
        $\im \approx 0{,}22\,\%$; $i \approx 2{,}7\,\%$
      uitwerking: |-
        $E(\im) = 200\,\um \cdot \frac{\um^{36} - 1}{\im}$: $E(0{,}002) \approx 7472{,}72$ en $E(0{,}0025) \approx 7542{,}92$, $E(0{,}0022) \approx 7500{,}8$ en $E(0{,}0021) \approx 7486{,}8$. Dus $\im \approx 0{,}22\,\%$ (preciezer 0,219\,\%), en per jaar $1{,}002\,19^{12} - 1 \approx 2{,}66\,\%$.
    - opgave: |-
        Een spaarplan belooft \eur 12\,000 na 10 jaarlijkse stortingen van \eur 1000 aan het begin van het jaar. Is de rentevoet meer of minder dan 3\,\% per jaar?
      antwoord: |-
        meer: $E(0{,}03) \approx 11\,807{,}80 < 12\,000$
      uitwerking: |-
        Bij 3\,\% is $E = 1000 \cdot 1{,}03 \cdot \frac{1{,}03^{10} - 1}{0{,}03} \approx 11\,807{,}80$, minder dan beloofd. Omdat $E$ stijgt met de rentevoet, is die groter dan 3\,\% (ongeveer 3,29\,\%).

- id: h2-recursie
  soort: kort
  opgave: |-
    Je stort aan het begin van elke maand \eur 40, aan 0,3\,\% per maand. Het saldo op het einde van maand $k$ is $S_k = (S_{k-1} + 40) \cdot 1{,}003$, met $S_0 = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $S_1$, $S_2$ en $S_3$ met de recursie.
      antwoord: |-
        $40{,}12$; $\approx 80{,}36$; $\approx 120{,}72$
      uitwerking: |-
        $S_1 = 40 \cdot 1{,}003 = 40{,}12$, $S_2 = 80{,}12 \cdot 1{,}003 \approx 80{,}36$, $S_3 = 120{,}36 \cdot 1{,}003 \approx 120{,}72$.
    - opgave: |-
        Controleer $S_3$ met de formule van de eindwaarde.
      antwoord: |-
        $\approx 120{,}72$
      uitwerking: |-
        $40 \cdot 1{,}003 \cdot \frac{1{,}003^3 - 1}{0{,}003} \approx 120{,}72$.

