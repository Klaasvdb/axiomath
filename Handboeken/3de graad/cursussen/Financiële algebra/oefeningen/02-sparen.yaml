  lijst: enumerate
  delen:
    - opgave: |-
        \eur 40 per maand, 5 jaar lang, aan 1,8\,\% per jaar.
      antwoord: |-
        $\approx 2512{,}16$ euro
      uitwerking: |-
        $\im = 1{,}018^{\frac1{12}} - 1$, $n = 60$: $E \approx 2512{,}16$ euro.
    - opgave: |-
        \eur 1200 per jaar, 20 jaar lang, aan 2,5\,\% per jaar.
      antwoord: |-
        $\approx 31\,419{,}93$ euro
      uitwerking: |-
        $E = 1200 \cdot 1{,}025 \cdot \frac{1{,}025^{20} - 1}{0{,}025} \approx 31\,419{,}93$ euro.
    - opgave: |-
        \eur 250 per semester, 8 jaar lang, aan 2,1\,\% per jaar.
      antwoord: |-
        $\approx 4374{,}39$ euro
