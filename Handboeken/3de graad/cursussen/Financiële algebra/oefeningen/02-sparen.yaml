        $\im = 1{,}032^{\frac1{12}} - 1$, $n = 180$: $E \approx 20\,735{,}51$ euro.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    termijnbedrag bij kapitaalsvorming
  opgave: |-
    Welk bedrag moet je aan het begin van elke periode storten?
  lijst: enumerate
  delen:
    - opgave: |-
        Per maand, om na 3 jaar \eur 5000 te hebben, aan 2\,\% per jaar.
      antwoord: |-
        $\approx 134{,}69$ euro
      uitwerking: |-
        $n = 36$, $\im = 1{,}02^{\frac1{12}} - 1$: $a \approx 134{,}69$ euro.
    - opgave: |-
        Per jaar, om na 25 jaar \eur 50\,000 te hebben, aan 3\,\% per jaar.
      antwoord: |-
        $\approx 1331{,}45$ euro
      uitwerking: |-
        $a = \frac{50\,000 \cdot 0{,}03}{1{,}03\,(1{,}03^{25} - 1)} \approx 1331{,}45$ euro.
    - opgave: |-
        Per trimester, om na 6 jaar \eur 12\,000 te hebben, aan 2,4\,\% per jaar.
      antwoord: |-
        $\approx 463{,}89$ euro
      uitwerking: |-
        $i_4 = 1{,}024^{\frac14} - 1$, $n = 24$: $a \approx 463{,}89$ euro.
    - opgave: |-
        Per maand, om na 2 jaar \eur 2500 te hebben, aan 1,5\,\% per jaar.
      antwoord: |-
        $\approx 102{,}56$ euro
      uitwerking: |-
        $n = 24$, $\im = 1{,}015^{\frac1{12}} - 1$: $a \approx 102{,}56$ euro.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    annuïteiten herkennen, tijdlijn
  opgave: |-
    Teken een tijdlijn. Is de annuïteit prenumerando of postnumerando, en hoeveel termijnen zijn er?
  lijst: enumerate
  delen:
    - opgave: |-
        Een sportclub int het lidgeld op 1 januari van elk jaar, van 2027 tot en met 2034.
      antwoord: |-
        prenumerando; 8 termijnen
      uitwerking: |-
        Van 2027 tot en met 2034 zijn 8 jaren; het lidgeld geldt voor het jaar dat begint.
    - opgave: |-
        Een werkneemster krijgt drie jaar lang op de laatste dag van elke maand haar loon.
      antwoord: |-
        postnumerando; 36 termijnen
      uitwerking: |-
        Het loon valt op het einde van de maand waarvoor het geldt.
    - opgave: |-
        Iemand leent een bedrag en betaalt 15 jaar lang elk semester af, de eerste keer een half jaar na het lenen.
      antwoord: |-
        postnumerando; 30 termijnen
      uitwerking: |-
        De eerste betaling valt op het einde van het eerste semester.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    grafiek lezen: termijnbedrag en rentevoet uit de saldi
  figuur:
    code: |-
      \begin{tikzpicture}[x=.6cm,y=.0011cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=1,ystep=500] (0,0) grid (6.5,3500);
        \draw[->,grijs] (0,0) -- (7,0) node[right,text=black] {jaar};
        \draw[->,grijs] (0,0) -- (0,3700) node[above,text=black] {euro};
        \foreach \t in {1,...,6}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \k in {1000,2000,3000}{\node[left,inner sep=1.5pt] at (0,\k) {$\k$};}
        \foreach \j/\E in {1/520,2/1060.8,3/1623.23,4/2208.16,5/2816.49,6/3449.15}{%
          \fill[accent!30,draw=accent] (\j-.3,0) rectangle (\j+.3,\E);}
        \node[above,inner sep=1pt] at (1,520) {520};
        \node[above,inner sep=1pt] at (2,1060.8) {1060,80};
      \end{tikzpicture}
  opgave: |-
    Iemand stort aan het begin van elk jaar hetzelfde bedrag. De staven tonen het saldo op het einde van elk jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het saldo na 1 jaar $a\,u$ is en na 2 jaar $a\,u + a\,u^2$.
      antwoord: |-
        de eerste storting groeit 1 of 2 jaar aan
      uitwerking: |-
        Na 1 jaar is de eerste storting $a\,u$. Na 2 jaar is die $a\,u^2$, en de tweede storting $a\,u$.
    - opgave: |-
        Bereken uit de twee gegeven saldi de rentevoet en het termijnbedrag.
      antwoord: |-
        $i = 4\,\%$; $a = 500$ euro
      uitwerking: |-
        $\frac{a\,u + a\,u^2}{a\,u} = 1 + u = \frac{1060{,}80}{520} = 2{,}04$, dus $u = 1{,}04$. Dan $a = \frac{520}{1{,}04} = 500$ euro.
    - opgave: |-
        Bereken het saldo na 6 jaar met de formule, en controleer op de figuur.
      antwoord: |-
        $\approx 3449{,}15$ euro
      uitwerking: |-
        $E = 500 \cdot 1{,}04 \cdot \frac{1{,}04^6 - 1}{0{,}04} \approx 3449{,}15$ euro: de laatste staaf komt net onder 3500.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    klassieke fouten: waar of vals
  opgave: |-
    Waar of vals? Verbeter wat vals is.
  lijst: enumerate
  delen:
    - opgave: |-
        De eindwaarde van een prenumerando annuïteit is $u$ keer de eindwaarde van de postnumerando annuïteit met dezelfde $a$, $i$ en $n$.
      antwoord: |-
        waar
      uitwerking: |-
        Elke storting staat één periode langer uit, dus elke term is $u$ keer zo groot.
    - opgave: |-
        Bij stortingen per maand mag je met de jaarrente gedeeld door 12 rekenen.
      antwoord: |-
        vals
      uitwerking: |-
        Dat is de proportionele rentevoet; je moet de gelijkwaardige maandrente $(1 + i)^{\frac1{12}} - 1$ gebruiken.
    - opgave: |-
        Wie elke maand dubbel zoveel stort, heeft op het einde een dubbele eindwaarde.
      antwoord: |-
        waar
      uitwerking: |-
        $E$ is evenredig met $a$.
    - opgave: |-
        Wie dubbel zo lang stort, heeft op het einde een dubbele eindwaarde.
      antwoord: |-
        vals: meer dan dubbel
      uitwerking: |-
        $\frac{u^{2n} - 1}{u^n - 1} = u^n + 1 > 2$: de eerste stortingen hebben ook dubbel zo lang tijd om aan te groeien.
    - opgave: |-
        Een rente van 0\,\% kun je niet in de formule invullen, maar dan is de eindwaarde gewoon $n \cdot a$.
      antwoord: |-
        waar
      uitwerking: |-
        Voor $i = 0$ is de noemer 0. Zonder rente is de eindwaarde de som van de stortingen, $n\,a$.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    looptijd
  opgave: |-
    Hoeveel stortingen aan het begin van elke periode zijn nodig?
  lijst: enumerate
  delen:
    - opgave: |-
        \eur 200 per maand aan 2,4\,\% per jaar, tot er minstens \eur 10\,000 op staat.
      antwoord: |-
        48
      uitwerking: |-
        $\um^n = 1 + \frac{10\,000\,\im}{200\,\um}$ geeft $n \approx 47{,}64$, dus 48 stortingen. Controle: $E_{47} \approx 9860{,}16$ en $E_{48} \approx 10\,080{,}06$.
    - opgave: |-
        \eur 3000 per jaar aan 3\,\% per jaar, tot er minstens \eur 50\,000 op staat.
      antwoord: |-
        14
      uitwerking: |-
        $1{,}03^n = 1 + \frac{50\,000 \cdot 0{,}03}{3000 \cdot 1{,}03}$ geeft $n \approx 13{,}39$. Controle: $E_{13} \approx 48\,258{,}97$ en $E_{14} \approx 52\,796{,}74$.
    - opgave: |-
        \eur 25 per maand aan 1\,\% per maand, tot er minstens \eur 1000 op staat.
      antwoord: |-
        34
      uitwerking: |-
        $1{,}01^n = 1 + \frac{1000 \cdot 0{,}01}{25 \cdot 1{,}01} \approx 1{,}396$ geeft $n \approx 33{,}53$. Controle: $E_{33} \approx 981{,}44$ en $E_{34} \approx 1016{,}51$: 34 stortingen.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    prenumerando en postnumerando vergelijken
  opgave: |-
    Iemand stort 10 jaar lang \eur 500 per jaar aan 2\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de eindwaarde als hij aan het begin van elk jaar stort.
      antwoord: |-
        $\approx 5584{,}36$ euro
      uitwerking: |-
        $500 \cdot 1{,}02 \cdot \frac{1{,}02^{10} - 1}{0{,}02} \approx 5584{,}36$ euro.
    - opgave: |-
        Bereken het saldo na de laatste storting als hij op het einde van elk jaar stort.
      antwoord: |-
        $\approx 5474{,}86$ euro
      uitwerking: |-
        $500 \cdot \frac{1{,}02^{10} - 1}{0{,}02} \approx 5474{,}86$ euro (cursus Rijen).
    - opgave: |-
        Toon met een berekening aan dat het verschil een factor $u$ is, en verklaar dat met een tijdlijn.
      antwoord: |-
        $5474{,}86 \cdot 1{,}02 \approx 5584{,}36$
      uitwerking: |-
        $5474{,}86 \cdot 1{,}02 \approx 5584{,}36$. Op de tijdlijn ligt elke storting bij prenumerando een jaar vroeger, en groeit ze een jaar langer aan.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    pensioensparen
  opgave: |-
    Eva begint op haar 30ste met pensioensparen. Ze stort aan het begin van elke maand \eur 80, tot een maand voor haar 65ste. Neem een vaste opbrengst van 2\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel stortingen doet ze, en hoeveel heeft ze op haar 65ste?
      antwoord: |-
        420; $\approx 48\,513{,}07$ euro
      uitwerking: |-
        $35 \cdot 12 = 420$ stortingen. $E = 80\,\um \cdot \frac{\um^{420} - 1}{\im} \approx 48\,513{,}07$ euro, met $\im = 1{,}02^{\frac1{12}} - 1$.
    - opgave: |-
        Hoeveel heeft ze zelf gestort, en hoeveel is rente?
      antwoord: |-
        33\,600 euro; $\approx 14\,913{,}07$ euro
      uitwerking: |-
        $420 \cdot 80 = 33\,600$ euro gestort, dus $48\,513{,}07 - 33\,600 \approx 14\,913{,}07$ euro rente.
    - opgave: |-
        Hoeveel heeft ze als ze pas op haar 40ste begint?
      antwoord: |-
        $\approx 31\,081{,}20$ euro
      uitwerking: |-
        Dan zijn er 300 stortingen: $E \approx 31\,081{,}20$ euro. Tien jaar later beginnen kost meer dan \eur 17\,000.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    vroeg of laat beginnen
  opgave: |-
    Arne stort van zijn 20ste tot zijn 30ste aan het begin van elke maand \eur 150, en laat het geld dan 25 jaar staan. Bo stort van haar 30ste tot haar 55ste aan het begin van elke maand \eur 150. Beide rekeningen brengen 2,5\,\% per jaar op.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel heeft Arne op zijn 55ste?
      antwoord: |-
        $\approx 37\,891{,}17$ euro
      uitwerking: |-
        Na 120 stortingen: $150\,\um \cdot \frac{\um^{120} - 1}{\im}$, dan nog $\cdot\,1{,}025^{25}$: $\approx 37\,891{,}17$ euro.
    - opgave: |-
        Hoeveel heeft Bo op haar 55ste?
      antwoord: |-
        $\approx 62\,313{,}43$ euro
      uitwerking: |-
        300 stortingen: $E \approx 62\,313{,}43$ euro.
    - opgave: |-
        Hoeveel had Bo per maand moeten storten om op haar 55ste evenveel te hebben als Arne? Vergelijk wat ze elk zelf storten.
      antwoord: |-
        $\approx 91{,}21$ euro; 18\,000 tegen 27\,363 euro
      uitwerking: |-
        $a = \frac{37\,891{,}17\,\im}{\um\,(\um^{300} - 1)} \approx 91{,}21$ euro. Arne stort $120 \cdot 150 = 18\,000$ euro, Bo dan $300 \cdot 91{,}21 \approx 27\,363$ euro voor hetzelfde resultaat.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    startkapitaal en stortingen samen
  opgave: |-
    Je zet vandaag \eur 2000 op een rekening aan 2,4\,\% per jaar, en stort daarna aan het begin van elke maand nog \eur 100, de eerste keer vandaag, 5 jaar lang.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel staat er na 5 jaar op?
      antwoord: |-
        $\approx 8628{,}33$ euro
      uitwerking: |-
        Het startkapitaal: $2000 \cdot 1{,}024^5 \approx 2251{,}79$. De stortingen: $100\,\um \cdot \frac{\um^{60} - 1}{\im} \approx 6376{,}53$. Samen \eur 8628,33.
    - opgave: |-
        Hoeveel moet je per maand storten om na 5 jaar \eur 12\,000 te hebben?
      antwoord: |-
        $\approx 152{,}88$ euro
      uitwerking: |-
        De stortingen moeten $12\,000 - 2251{,}79 = 9748{,}21$ euro opleveren: $a = \frac{9748{,}21\,\im}{\um\,(\um^{60} - 1)} \approx 152{,}88$ euro.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    rentevoet numeriek
  opgave: |-
    Een bank biedt een spaarplan aan: 4 jaar lang aan het begin van elke maand \eur 150 storten, en na 4 jaar \eur 7600 ontvangen.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de eindwaarde bij een maandrente van 0,2\,\% en van 0,3\,\%.
      antwoord: |-
        $\approx 7564{,}11$ en $\approx 7754{,}95$ euro
      uitwerking: |-
        $E(0{,}002) = 150 \cdot 1{,}002 \cdot \frac{1{,}002^{48} - 1}{0{,}002} \approx 7564{,}11$ en $E(0{,}003) \approx 7754{,}95$ euro.
    - opgave: |-
        Pas twee stappen van de methode van de intervalmiddens toe. Tussen welke grenzen ligt de maandrente van het plan?
      antwoord: |-
        tussen 0,2\,\% en 0,225\,\%
      uitwerking: |-
        $E(0{,}0025) \approx 7658{,}78 > 7600$: $[0{,}002;\ 0{,}0025]$. $E(0{,}00225) \approx 7611{,}3 > 7600$: $[0{,}002;\ 0{,}00225]$.
    - opgave: |-
        De echte maandrente is ongeveer 0,219\,\%. Welke jaarrente is dat? Is het plan beter dan een rekening met 2,5\,\% per jaar?
      antwoord: |-
        $\approx 2{,}66\,\%$; ja
      uitwerking: |-
        $1{,}002\,19^{12} - 1 \approx 0{,}0266$, meer dan 2,5\,\%.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    rentevoet die verandert
  opgave: |-
    Je stort 6 jaar lang aan het begin van elke maand \eur 100. De eerste 3 jaar geeft de rekening 1,5\,\% per jaar, daarna 2,5\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel staat er na 3 jaar op?
      antwoord: |-
        $\approx 3683{,}89$ euro
      uitwerking: |-
        $\im = 1{,}015^{\frac1{12}} - 1$, $n = 36$: $E \approx 3683{,}89$ euro.
    - opgave: |-
        Hoeveel staat er na 6 jaar op? Splits in het bedrag van na 3 jaar en de nieuwe stortingen.
      antwoord: |-
        $\approx 7707{,}69$ euro
      uitwerking: |-
        Het bedrag van na 3 jaar groeit nog 3 jaar aan 2,5\,\%: $3683{,}89 \cdot 1{,}025^3 \approx 3967{,}15$. De 36 nieuwe stortingen aan 2,5\,\%: $\approx 3740{,}54$. Samen \eur 7707,69.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    termijnbedrag met een wachttijd
  opgave: |-
    Jonas wil op zijn 30ste \eur 20\,000 hebben voor een eigen woning. Hij stort van zijn 18de tot zijn 25ste aan het begin van elke maand hetzelfde bedrag (84 stortingen), en laat het geld daarna 5 jaar staan. De rekening geeft 2,2\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel moet er op zijn 25ste op de rekening staan?
      antwoord: |-
        $\approx 17\,938{,}06$ euro
      uitwerking: |-
        De beginwaarde van \eur 20\,000 vijf jaar eerder: $20\,000 \cdot 1{,}022^{-5} \approx 17\,938{,}06$ euro.
    - opgave: |-
        Hoeveel moet hij per maand storten?
      antwoord: |-
        $\approx 197{,}52$ euro
      uitwerking: |-
        $a = \frac{17\,938{,}06\,\im}{\um\,(\um^{84} - 1)} \approx 197{,}52$ euro, met $\im = 1{,}022^{\frac1{12}} - 1$.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    rekenblad lezen en opstellen
  opgave: |-
    Een rekenblad volgt een spaarplan met stortingen aan het begin van elke maand. Kolom B is het saldo op het einde van de maand.
    \begin{rekenblad}{2}{A & B}
    1 & maand & saldo \\ \hline
    2 & 0 & 0,00 \\ \hline
    3 & 1 & 30,06 \\ \hline
    4 & 2 & 60,18 \\ \hline
    5 & 3 & 90,36 \\ \hline
    \end{rekenblad}
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $S_1 = a\,u$ en $S_2 = a\,u + a\,u^2$. Bereken de maandrente en het termijnbedrag.
      antwoord: |-
        $\im = 0{,}2\,\%$; $a = 30$ euro
      uitwerking: |-
        $\frac{S_2}{S_1} = 1 + u \approx \frac{60{,}18}{30{,}06} \approx 2{,}002$, dus $u \approx 1{,}002$. Dan $a = \frac{30{,}06}{1{,}002} = 30$ euro.
    - opgave: |-
        Welke formule staat in cel B3, als de maandrente in cel D1 en het termijnbedrag in cel D2 staan?
      antwoord: |-
        \texttt{=(B2+\$D\$2)*(1+\$D\$1)}
      uitwerking: |-
        $S_k = (S_{k-1} + a)\,u$: het vorige saldo plus de storting, een maand aangegroeid. De dollartekens houden D1 en D2 vast bij het kopiëren.
    - opgave: |-
        Welke jaarrente hoort bij die maandrente? Welk saldo staat er na 10 jaar, op rij 122?
      antwoord: |-
        $\approx 2{,}43\,\%$; $\approx 4072{,}30$ euro
      uitwerking: |-
        $1{,}002^{12} - 1 \approx 0{,}0243$. Rij 122 is maand 120: $E = 30 \cdot 1{,}002 \cdot \frac{1{,}002^{120} - 1}{0{,}002} \approx 4072{,}30$ euro.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    per maand of per jaar storten
  opgave: |-
    Sanne stort 5 jaar lang aan het begin van elke maand \eur 100. Tom stort 5 jaar lang aan het begin van elk jaar \eur 1200. Beide rekeningen geven 3\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken beide eindwaarden.
      antwoord: |-
        Sanne $\approx 6474{,}02$; Tom $\approx 6562{,}09$ euro
      uitwerking: |-
        Sanne: $\im = 1{,}03^{\frac1{12}} - 1$, $n = 60$: $E \approx 6474{,}02$. Tom: $1200 \cdot 1{,}03 \cdot \frac{1{,}03^5 - 1}{0{,}03} \approx 6562{,}09$ euro.
    - opgave: |-
        Ze storten evenveel per jaar. Waarom heeft Tom meer?
      antwoord: |-
        zijn geld staat gemiddeld langer uit
      uitwerking: |-
        Tom stort het geld van een heel jaar al in januari, Sanne verspreid over het jaar. Toms geld brengt dus langer rente op.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    proportionele maandrente in een spaarplan
  opgave: |-
    Een bank rekent bij een spaarplan van \eur 100 per maand (aan het begin), 10 jaar lang, met \textit{3\,\% per jaar}.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de eindwaarde met de gelijkwaardige maandrente.
      antwoord: |-
        $\approx 13\,979{,}19$ euro
      uitwerking: |-
        $\im = 1{,}03^{\frac1{12}} - 1$, $n = 120$: $E \approx 13\,979{,}19$ euro.
    - opgave: |-
        Bereken de eindwaarde met de proportionele maandrente $\frac{3\,\%}{12}$. Wie heeft hier voordeel van de proportionele rentevoet?
      antwoord: |-
        $\approx 14\,009{,}08$ euro; de spaarder
      uitwerking: |-
        Met $i = 0{,}0025$: $E \approx 14\,009{,}08$ euro, \eur 29,89 meer. Bij sparen is een hogere effectieve rente in het voordeel van de spaarder, bij lenen in dat van de bank.

- id: h2-o17
  soort: opdracht
  niveau: 3
  thema: |-
    verband pre- en postnumerando (bewijs)
  opgave: |-
    Noem $E_n^{\text{pre}} = a\,u \cdot \frac{u^n - 1}{i}$ en $E_n^{\text{post}} = a \cdot \frac{u^n - 1}{i}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $E_n^{\text{pre}} = u \cdot E_n^{\text{post}}$.
      antwoord: |-
        rechtstreeks uit de formules
      uitwerking: |-
        $u \cdot a\,\frac{u^n - 1}{i} = a\,u\,\frac{u^n - 1}{i}$.
    - opgave: |-
        Toon aan dat $E_n^{\text{pre}} = E_{n+1}^{\text{post}} - a$, met een berekening en met een tijdlijn.
      antwoord: |-
        een extra storting op het einde, min die storting
      uitwerking: |-
        $E_{n+1}^{\text{post}} - a = a\,\frac{u^{n+1} - 1}{i} - a\,\frac{u - 1}{i} = a\,\frac{u^{n+1} - u}{i} = a\,u\,\frac{u^n - 1}{i}$. Op een tijdlijn: postnumerando met $n + 1$ termijnen heeft betalingen op $1, \ldots, n + 1$; schuif alles een periode op, dan zijn het de $n$ prenumerando stortingen op $0, \ldots, n - 1$ plus een storting op tijdstip $n$, die je aftrekt. (Reken op tijdstip $n$ met één periode verschuiving: dat is precies de factor $u$ uit a.)
    - opgave: |-
        Controleer b met $a = 500$, $i = 2\,\%$ en $n = 10$.
      antwoord: |-
        $5584{,}36$
      uitwerking: |-
        $E_{11}^{\text{post}} = 500 \cdot \frac{1{,}02^{11} - 1}{0{,}02} \approx 6084{,}36$, min 500 is $5584{,}36 = E_{10}^{\text{pre}}$.

- id: h2-o18
  soort: opdracht
  niveau: 3
  thema: |-
    dubbel zo lang sparen (bewijs)
  opgave: |-
    Je stort $2n$ periodes lang $a$ aan het begin van elke periode.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $E_{2n} = E_n \cdot (u^n + 1)$. Leg uit met een tijdlijn waarom: de eerste $n$ stortingen staan na tijdstip $n$ nog $n$ periodes uit.
      antwoord: |-
        $u^{2n} - 1 = (u^n - 1)(u^n + 1)$
      uitwerking: |-
        $E_{2n} = a\,u\,\frac{u^{2n} - 1}{i} = a\,u\,\frac{(u^n - 1)(u^n + 1)}{i} = E_n\,(u^n + 1)$. Op de tijdlijn: de eerste $n$ stortingen zijn op tijdstip $n$ samen $E_n$ waard, en groeien nog tot $E_n\,u^n$; de laatste $n$ stortingen geven nog eens $E_n$.
    - opgave: |-
        Controleer met $a = 50$, $i = 2\,\%$, $n = 10$.
      antwoord: |-
        $E_{20} \approx 1239{,}17$
      uitwerking: |-
        $E_{10} = 50 \cdot 1{,}02 \cdot \frac{1{,}02^{10} - 1}{0{,}02} \approx 558{,}44$, en $558{,}44 \cdot (1{,}02^{10} + 1) \approx 1239{,}17 = E_{20}$.
    - opgave: |-
        Wat zegt dat over de vraag \textit{verdubbelt de eindwaarde als je dubbel zo lang spaart}?
      antwoord: |-
        ze wordt $u^n + 1 > 2$ keer zo groot
      uitwerking: |-
        Ze wordt $u^n + 1$ keer zo groot, en dat is meer dan 2 zodra $i > 0$.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    stijgende stortingen
  opgave: |-
    Lies stort aan het begin van elk jaar, 10 jaar lang. De eerste storting is \eur 1000, en elk jaar stort ze 2\,\% meer, zoals haar loon stijgt. De rekening geeft 3\,\% per jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de storting van jaar $k$ (op tijdstip $k$, met $k = 0, \ldots, 9$) op tijdstip 10 waard is: $1000 \cdot 1{,}02^{k} \cdot 1{,}03^{10-k}$.
      antwoord: |-
        storting $1000 \cdot 1{,}02^k$, $10 - k$ jaar aangegroeid
      uitwerking: |-
        De storting op tijdstip $k$ is $1000 \cdot 1{,}02^k$ en staat $10 - k$ jaar uit aan 3\,\%.
    - opgave: |-
        Die waarden vormen een meetkundige rij. Met welk quotiënt? Toon aan dat de eindwaarde $1000 \cdot 1{,}03 \cdot \frac{1{,}03^{10} - 1{,}02^{10}}{1{,}03 - 1{,}02}$ is.
      antwoord: |-
        quotiënt $\frac{1{,}02}{1{,}03}$
      uitwerking: |-
        Van $k$ naar $k + 1$ vermenigvuldig je met $\frac{1{,}02}{1{,}03}$. De som van de 10 termen, met eerste term $1000 \cdot 1{,}03^{10}$, is $1000 \cdot 1{,}03^{10} \cdot \frac{1 - (1{,}02/1{,}03)^{10}}{1 - 1{,}02/1{,}03}$. Vermenigvuldig teller en noemer met $1{,}03^{10}$ en $1{,}03$: $1000 \cdot 1{,}03 \cdot \frac{1{,}03^{10} - 1{,}02^{10}}{1{,}03 - 1{,}02}$.
    - opgave: |-
        Bereken de eindwaarde.
      antwoord: |-
        $\approx 12\,866{,}96$ euro
      uitwerking: |-
        $1000 \cdot 1{,}03 \cdot \frac{1{,}03^{10} - 1{,}02^{10}}{0{,}01} \approx 12\,866{,}96$ euro.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    eindwaarde als functie van de rentevoet, zonder rente
  opgave: |-
    Bekijk $E(i) = a\,(1 + i) \cdot \frac{(1 + i)^n - 1}{i}$ voor een vaste $a$ en $n$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon met de somvorm $E(i) = a\,(1 + i) + a\,(1 + i)^2 + \cdots + a\,(1 + i)^n$ aan dat $E$ strikt stijgt op $[0, +\infty[$.
      antwoord: |-
        elke term stijgt
      uitwerking: |-
        Elke term $a\,(1 + i)^k$ stijgt strikt met $i$, dus ook hun som.
    - opgave: |-
        Wat is $E(0)$ volgens de somvorm? Toon aan dat $\lim\limits_{i \to 0} E(i)$ dezelfde waarde heeft.
      antwoord: |-
        $n\,a$
      uitwerking: |-
        In de somvorm is $E(0) = a + a + \cdots + a = n\,a$. De somvorm is een veelterm in $i$, dus continu: de limiet is $n\,a$. (Ook: $\frac{(1 + i)^n - 1}{i}$ is het differentiequotiënt van $x^n$ in 1, met limiet $n \cdot 1^{n-1} = n$.)
    - opgave: |-
        Waarom heeft de vergelijking $E(i) = E_0$ hoogstens één oplossing? Wanneer heeft ze er geen positieve?
      antwoord: |-
        $E$ stijgt strikt; als $E_0 \leqslant n\,a$
      uitwerking: |-
        Een strikt stijgende functie neemt elke waarde hoogstens één keer aan. Is het doel $E_0 \leqslant n\,a$, dan is er geen positieve rentevoet nodig of mogelijk.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    sparen met inflatie
  opgave: |-
    Ouders willen op de 18de verjaardag van hun kind een bedrag hebben waarmee je dan koopt wat je vandaag met \eur 15\,000 koopt. De prijzen stijgen met 2\,\% per jaar, de rekening geeft 3\,\% per jaar. Ze storten aan het begin van elke maand, 216 keer, een vast bedrag.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk bedrag hebben ze nodig op de 18de verjaardag?
      antwoord: |-
        $\approx 21\,423{,}69$ euro
      uitwerking: |-
        $15\,000 \cdot 1{,}02^{18} \approx 21\,423{,}69$ euro.
    - opgave: |-
        Hoeveel moeten ze per maand storten? Hoeveel was het zonder inflatie geweest?
      antwoord: |-
        $\approx 75{,}03$ euro; $\approx 52{,}54$ euro
      uitwerking: |-
        Met $\im = 1{,}03^{\frac1{12}} - 1$ en $n = 216$: $a = \frac{21\,423{,}69\,\im}{\um\,(\um^{216} - 1)} \approx 75{,}03$ euro. Voor \eur 15\,000: $a \approx 52{,}54$ euro.
    - opgave: |-
        Waarom is het een slecht idee om de inflatie te negeren bij een spaardoel op lange termijn?
      antwoord: |-
        het bedrag verliest koopkracht
      uitwerking: |-
        Over 18 jaar is \eur 15\,000 maar zoveel waard als $15\,000 \cdot 1{,}02^{-18} \approx 10\,502$ euro vandaag. Het verschil in termijnbedrag (bijna 43\,\% meer) toont hoe groot dat effect is.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: discreet
    onderwerp: |-
      Rijen
  opgave: |-
    Het saldo van een spaarplan met stortingen $a$ aan het begin van elke periode volgt de recursie $S_k = u\,S_{k-1} + a\,u$ met $S_0 = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Een vaste waarde $V$ van de recursie voldoet aan $V = u\,V + a\,u$. Bereken $V$. Is ze positief of negatief?
      antwoord: |-
        $V = -\frac{a\,u}{i}$; negatief
      uitwerking: |-
        $V\,(1 - u) = a\,u$, dus $V = \frac{a\,u}{1 - u} = -\frac{a\,u}{i} < 0$.
    - opgave: |-
        Toon aan dat $T_k = S_k - V$ een meetkundige rij is met quotiënt $u$, en leid de formule van de eindwaarde af.
      antwoord: |-
        $T_k = u\,T_{k-1}$, $T_0 = \frac{a\,u}{i}$
      uitwerking: |-
        $S_k - V = u\,S_{k-1} + a\,u - (u\,V + a\,u) = u\,(S_{k-1} - V)$. Dus $T_k = T_0\,u^k$ met $T_0 = -V = \frac{a\,u}{i}$, en $S_n = V + \frac{a\,u}{i}\,u^n = a\,u\,\frac{u^n - 1}{i}$.
    - opgave: |-
        Bereken $V$ voor $a = 100$ en $i = 2\,\%$. Verklaar de betekenis van een negatief saldo $V$: wat zou er gebeuren als je zo'n schuld had en elke periode $a$ betaalt?
      antwoord: |-
        $V = -5100$; de schuld blijft gelijk
      uitwerking: |-
        $V = -\frac{100 \cdot 1{,}02}{0{,}02} = -5100$. Een schuld van \eur 5100 groeit met de stortingen erbij elke periode tot $(-5100 + 100) \cdot 1{,}02 = -5100$: de stortingen betalen net de rente, en de schuld blijft. Dat is het evenwicht uit de cursus Differentiaalvergelijkingen.

- id: h2-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Schrijf de recursie $S_k = u\,S_{k-1} + a\,u$ als $\begin{pmatrix} S_k \\ 1 \end{pmatrix} = M \begin{pmatrix} S_{k-1} \\ 1 \end{pmatrix}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke $2 \times 2$-matrix $M$ is dat?
      antwoord: |-
        $M = \begin{pmatrix} u & a\,u \\ 0 & 1 \end{pmatrix}$
      uitwerking: |-
        De eerste rij geeft $u\,S_{k-1} + a\,u \cdot 1$, de tweede $0 \cdot S_{k-1} + 1 \cdot 1 = 1$.
    - opgave: |-
        Bereken $M^2$ en $M^3$. Toon met volledige inductie aan dat
        \[M^n = \begin{pmatrix} u^n & a\,u\,(1 + u + \cdots + u^{n-1}) \\ 0 & 1 \end{pmatrix}.\]
      antwoord: |-
        rechtsboven $a\,u\,(1 + u)$ en $a\,u\,(1 + u + u^2)$
      uitwerking: |-
        $M^2 = \begin{pmatrix} u^2 & a\,u^2 + a\,u \\ 0 & 1 \end{pmatrix}$, $M^3 = \begin{pmatrix} u^3 & a\,u^3 + a\,u^2 + a\,u \\ 0 & 1 \end{pmatrix}$. Stel dat het geldt voor $n$; dan is rechtsboven in $M^{n+1} = M \cdot M^n$: $u \cdot a\,u\,(1 + \cdots + u^{n-1}) + a\,u = a\,u\,(1 + u + \cdots + u^n)$.
    - opgave: |-
        Leid de eindwaarde $S_n$ af uit $M^n$.
      antwoord: |-
        $S_n = a\,u\,\frac{u^n - 1}{i}$
      uitwerking: |-
        $\begin{pmatrix} S_n \\ 1 \end{pmatrix} = M^n \begin{pmatrix} 0 \\ 1 \end{pmatrix}$, dus $S_n$ is het element rechtsboven: $a\,u\,\frac{u^n - 1}{u - 1}$.

- id: h2-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Exponentiële en logaritmische functies
  opgave: |-
    Bekijk de eindwaarde als functie van het aantal stortingen: $E(n) = \frac{a\,u}{i}\,(u^n - 1)$, met $a = 100$ en $i = 0{,}5\,\%$ per maand.
  lijst: enumerate
  delen:
    - opgave: |-
        Van welke exponentiële functie is de grafiek van $E$ (voor reële $n$) een transformatie? Welke horizontale asymptoot heeft ze, en wat betekent die?
      antwoord: |-
        $\frac{a\,u}{i}\,u^n$ omlaag geschoven; $y = -\frac{a\,u}{i} = -20\,100$
      uitwerking: |-
        $E(n) = 20\,100 \cdot 1{,}005^n - 20\,100$: de grafiek van $20\,100 \cdot 1{,}005^n$, verticaal 20\,100 omlaag. Voor $n \to -\infty$ gaat $E$ naar $-20\,100$: de schuld uit de vorige oefening, die je met \eur 100 per maand net in evenwicht houdt.
    - opgave: |-
        Na hoeveel maanden is de eindwaarde voor het eerst groter dan het dubbele van wat je stortte?
      antwoord: |-
        na 252 maanden
      uitwerking: |-
        $20\,100\,(1{,}005^n - 1) > 200\,n$. Met een tabel of grafiek op het rekentoestel: bij $n = 251$ is $E \approx 50\,187 < 50\,200$, bij $n = 252$ is $E \approx 50\,539 > 50\,400$. Na 21 jaar is de rente dus groter dan alles wat je stortte.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Een student huurt een kot van 1 september tot en met 30 juni, en betaalt de huur van \eur 420 op het einde van elke maand. Welke soort annuïteit is dat, met hoeveel termijnen? Wanneer valt de laatste betaling?
  antwoord: |-
    postnumerando; 10 termijnen; 30 juni
  uitwerking: |-
    De betaling valt op het einde van de maand: postnumerando. September tot en met juni zijn 10 maanden; de laatste betaling valt op het einde van juni.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Je stort 7 jaar lang aan het begin van elke maand \eur 60 op een rekening aan 2,6\,\% per jaar. Hoeveel staat er na 7 jaar op? Hoeveel is rente?
  antwoord: |-
    $\approx 5527{,}07$ euro; $\approx 487{,}07$ euro rente
  uitwerking: |-
    $\im = 1{,}026^{\frac1{12}} - 1$, $n = 84$: $E = 60\,\um\,\frac{\um^{84} - 1}{\im} \approx 5527{,}07$ euro. Gestort: $84 \cdot 60 = 5040$ euro.

- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    Je stort 6 jaar lang aan het begin van elk jaar \eur 2500 aan 3\,\% per jaar, en laat het geld daarna nog 4 jaar staan. Hoeveel heb je na 10 jaar?
  antwoord: |-
    $\approx 18\,746{,}65$ euro
  uitwerking: |-
    Na 6 jaar: $2500 \cdot 1{,}03 \cdot \frac{1{,}03^6 - 1}{0{,}03} \approx 16\,656{,}16$. Na 10 jaar: $16\,656{,}16 \cdot 1{,}03^4 \approx 18\,746{,}65$ euro.

- id: h2-t4
  soort: test
  niveau: 1
  opgave: |-
    Hoeveel moet je aan het begin van elke maand storten om na 6 jaar \eur 12\,000 te hebben, aan 2,1\,\% per jaar?
  antwoord: |-
    $\approx 156{,}36$ euro
  uitwerking: |-
    $\im = 1{,}021^{\frac1{12}} - 1$, $n = 72$: $a = \frac{12\,000\,\im}{\um\,(\um^{72} - 1)} \approx 156{,}36$ euro.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Je stort aan het begin van elke maand \eur 250 aan 1,9\,\% per jaar. Na hoeveel maanden staat er voor het eerst meer dan \eur 10\,000 op?
  antwoord: |-
    na 39 maanden
  uitwerking: |-
    $\um^n = 1 + \frac{10\,000\,\im}{250\,\um}$ geeft $n \approx 38{,}8$. Controle: $E_{38} \approx 9796{,}50$ en $E_{39} \approx 10\,062{,}27$.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Wie 4 jaar lang aan het begin van elke maand \eur 50 stort, krijgt \eur 2500. Tussen welke twee maandrentes met één beduidend cijfer na 0,1\,\% ligt de rentevoet (bijvoorbeeld tussen 0,1\,\% en 0,2\,\%)? Verfijn één stap.
  antwoord: |-
    tussen 0,15\,\% en 0,2\,\%
  uitwerking: |-
    $E(0{,}001) \approx 2459{,}73 < 2500$ en $E(0{,}002) \approx 2521{,}37 > 2500$. $E(0{,}0015) \approx 2490{,}31 < 2500$: tussen 0,15\,\% en 0,2\,\% (ongeveer 0,166\,\% per maand, of 2,0\,\% per jaar).

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Een grootmoeder stort op elke verjaardag van haar kleinzoon, vanaf zijn geboortedag tot en met zijn 17de verjaardag, hetzelfde bedrag op een rekening aan 2,5\,\% per jaar. Op zijn 18de verjaardag moet er \eur 4000 op staan. Hoeveel stort ze per keer?
  antwoord: |-
    $\approx 174{,}32$ euro
  uitwerking: |-
    18 stortingen aan het begin van elk levensjaar, eindwaarde op de 18de verjaardag: $a = \frac{4000 \cdot 0{,}025}{1{,}025\,(1{,}025^{18} - 1)} \approx 174{,}32$ euro.
