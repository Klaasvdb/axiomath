  niveau: 1
  thema: |-
    vermoeden van Goldbach
  opgave: |-
    Goldbach vermoedde dat elk even getal groter dan 2 een som is van twee priemgetallen. Schrijf het getal op alle mogelijke manieren als $p + q$ met $p \leqslant q$ priem.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        30
      antwoord: |-
        $7 + 23$, $11 + 19$, $13 + 17$
      uitwerking: |-
        $30 - p$ voor $p = 3, 5$ geeft 27 en 25: niet priem.
    - opgave: |-
        50
      antwoord: |-
        $3 + 47$, $7 + 43$, $13 + 37$, $19 + 31$
      uitwerking: |-
        Ga de priemgetallen $p \leqslant 25$ af.
    - opgave: |-
        100
      antwoord: |-
        6 manieren
      uitwerking: |-
        $3 + 97$, $11 + 89$, $17 + 83$, $29 + 71$, $41 + 59$, $47 + 53$.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    kgv in een context
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.62,font=\scriptsize]
        \draw[accent,thick] (0,0) circle (.9);
        \foreach \h in {0,10,...,350}{\draw[accent] (\h:.9) -- (\h:1.02);}
        \draw[accent,thick] (2.52,0) circle (1.5);
        \foreach \h in {0,6,...,354}{\draw[accent] ($(2.52,0)+(\h:1.5)$) -- ($(2.52,0)+(\h:1.38)$);}
        \fill[fel!85!black] (.96,0) circle (2.2pt);
        \node at (0,0) {36};
        \node at (2.52,0) {60};
      \end{tikzpicture}
  opgave: |-
    Twee tandwielen grijpen in elkaar: A heeft 36 tanden, B heeft 60. Bij de start staat het gemerkte paar tanden tegen elkaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Na hoeveel tanden staat dat paar opnieuw tegen elkaar?
      antwoord: |-
        180
      uitwerking: |-
        Na een aantal tanden dat een veelvoud is van 36 en van 60: $\kgv(36, 60) = 180$.
    - opgave: |-
        Hoeveel toeren draait elk wiel dan?
      antwoord: |-
        A: 5, B: 3
      uitwerking: |-
        $180 : 36 = 5$ en $180 : 60 = 3$.
    - opgave: |-
        Een ontwerper wil de slijtage spreiden: elk paar tanden moet zo zelden mogelijk samenkomen. Welk aantal tanden tussen 50 en 60 kiest hij voor B?
      antwoord: |-
        59
      uitwerking: |-
        Het kgv moet zo groot mogelijk zijn: $\kgv(36, B) = \tfrac{36B}{\ggd(36, B)}$. Relatief priem met 36 zijn 53, 55 en 59, met kgv 1908, 1980 en 2124. Kies 59.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    ggd in een context
  opgave: |-
    Een snoepwinkel heeft 156 rode, 234 gele en 390 groene snoepjes. Ze maakt er zakjes van die allemaal hetzelfde zijn, zonder dat er snoepjes overblijven.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel zakjes kan ze hoogstens maken?
      antwoord: |-
        78
      uitwerking: |-
        $156 = 2^2 \cdot 3 \cdot 13$, $234 = 2 \cdot 3^2 \cdot 13$, $390 = 2 \cdot 3 \cdot 5 \cdot 13$. De ggd van de drie is $2 \cdot 3 \cdot 13 = 78$.
    - opgave: |-
        Wat zit er dan in elk zakje? En welke andere aantallen zakjes zijn mogelijk?
      antwoord: |-
        2 rode, 3 gele, 5 groene; de delers van 78
      uitwerking: |-
        $156 : 78 = 2$, $234 : 78 = 3$, $390 : 78 = 5$. Het aantal zakjes moet alle drie de getallen delen, dus 78 delen: 1, 2, 3, 6, 13, 26, 39 of 78.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    priemfactoren van een faculteit
  opgave: |-
    Het getal $100! = 1 \cdot 2 \cdot 3 \cdots 100$ heeft 158 cijfers. Hoeveel nullen staan er achteraan?
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel van de factoren 1 tot 100 zijn deelbaar door 5? En door 25? Hoeveel keer komt de priemfactor 5 voor in $100!$?
      antwoord: |-
        20, 4; 24 keer
      uitwerking: |-
        De 20 vijfvouden leveren elk een factor 5, de 4 veelvouden van 25 nog een extra: $20 + 4 = 24$.
    - opgave: |-
        Hoeveel keer komt de priemfactor 2 voor in $100!$?
      antwoord: |-
        97
      uitwerking: |-
        $50 + 25 + 12 + 6 + 3 + 1 = 97$ (veelvouden van 2, 4, 8, 16, 32, 64).
    - opgave: |-
        Hoeveel nullen staan er achteraan $100!$? Waarom bepaalt de factor 5 het antwoord?
      antwoord: |-
        24
      uitwerking: |-
        Elke nul is een factor $10 = 2 \cdot 5$. Er zijn 24 factoren 5 en meer dan genoeg factoren 2, dus $100! = 10^{24} \cdot m$ met $10 \ndeelt m$.
    - opgave: |-
        Hoeveel nullen staan er achteraan $2026!$?
      antwoord: |-
        505
      uitwerking: |-
        $405 + 81 + 16 + 3 = 505$ (veelvouden van 5, 25, 125 en 625).

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    aantal delers
  opgave: |-
    Bepaal het kleinste natuurlijke getal met precies
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        7 delers
      antwoord: |-
        64
      uitwerking: |-
        7 is priem, dus $(e_1 + 1) \cdots (e_r + 1) = 7$ kan alleen als $n = p^6$. Het kleinste is $2^6$.
    - opgave: |-
        12 delers
      antwoord: |-
        60
      uitwerking: |-
        De exponenten plus 1 geven als product 12: $12$, $6 \cdot 2$, $4 \cdot 3$ of $3 \cdot 2 \cdot 2$. Kandidaten: kandidaten $2^{11}$, $2^5 \cdot 3 = 96$, $2^3 \cdot 3^2 = 72$, $2^2 \cdot 3 \cdot 5 = 60$.
    - opgave: |-
        15 delers
      antwoord: |-
        144
      uitwerking: |-
        $15$ of $5 \cdot 3$: $2^{14}$ of $2^4 \cdot 3^2 = 144$.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    priemgetallen uit een formule
  opgave: |-
    Los op, voor natuurlijke getallen $n$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $n$ is $n^2 - 1$ een priemgetal?
      antwoord: |-
        alleen $n = 2$
      uitwerking: |-
        $n^2 - 1 = (n - 1)(n + 1)$. Dat is priem alleen als de kleinste factor 1 is: $n = 2$, met $n^2 - 1 = 3$.
    - opgave: |-
        Euler merkte op dat $n^2 + n + 41$ een priemgetal is voor $n = 0, 1, \ldots, 39$. Controleer voor $n = 1$ en $n = 2$, en toon aan dat het voor $n = 40$ niet klopt.
      antwoord: |-
        43, 47; $1681 = 41^2$
      uitwerking: |-
        $40^2 + 40 + 41 = 40 \cdot 41 + 41 = 41^2$.
    - opgave: |-
        Toon aan dat $n^4 + 4 = (n^2 + 2n + 2)(n^2 - 2n + 2)$. Voor welke $n$ is $n^4 + 4$ priem?
      antwoord: |-
        alleen $n = 1$
      uitwerking: |-
        Uitwerken: $(n^2 + 2)^2 - (2n)^2 = n^4 + 4n^2 + 4 - 4n^2$. De kleinste factor $n^2 - 2n + 2 = (n - 1)^2 + 1$ is 1 alleen als $n = 1$, met $n^4 + 4 = 5$. Voor $n = 0$ is het 4.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    priemtweelingen
  opgave: |-
    Twee priemgetallen $p$ en $p + 2$ heten een priemtweeling.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef alle priemtweelingen onder 100.
      antwoord: |-
        8 paren
      uitwerking: |-
        $(3, 5)$, $(5, 7)$, $(11, 13)$, $(17, 19)$, $(29, 31)$, $(41, 43)$, $(59, 61)$, $(71, 73)$.
    - opgave: |-
        Toon aan dat voor een priemtweeling met $p > 3$ het getal ertussen deelbaar is door 6.
      antwoord: |-
        $6 \deelt p + 1$
      uitwerking: |-
        $p$ is oneven, dus $p + 1$ is even. Van de drie opeenvolgende getallen $p$, $p + 1$, $p + 2$ is er één deelbaar door 3, en dat is niet $p$ of $p + 2$. Dus $2 \deelt p + 1$ en $3 \deelt p + 1$, en $\ggd(2, 3) = 1$.
    - opgave: |-
        Toon aan dat 3, 5, 7 de enige priemdrieling $p$, $p + 2$, $p + 4$ is.
      antwoord: |-
        een van de drie is een drievoud
      uitwerking: |-
        Van $p$, $p + 1$, $p + 2$ is er één deelbaar door 3. Is dat $p + 1$, dan is ook $p + 4 = (p + 1) + 3$ deelbaar door 3. Dus een van $p$, $p + 2$, $p + 4$ is een drievoud, en dan gelijk aan 3. Dat kan alleen met $p = 3$.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    getallen van Mersenne
  opgave: |-
    De monnik Marin Mersenne bestudeerde rond 1640 de getallen $2^n - 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $2^n - 1$ voor $n = 2, 3, 5, 7, 11$. Welke zijn priem?
      antwoord: |-
        3, 7, 31, 127 priem; $2047 = 23 \cdot 89$
      uitwerking: |-
        $2^{11} - 1 = 2047 = 23 \cdot 89$.
    - opgave: |-
        Toon aan dat $2^a - 1$ een deler is van $2^{ab} - 1$. Gebruik $x^b - 1 = (x - 1)(x^{b - 1} + \cdots + x + 1)$ met $x = 2^a$.
      antwoord: |-
        $x - 1 \deelt x^b - 1$
      uitwerking: |-
        Met $x = 2^a$ is $2^{ab} - 1 = x^b - 1 = (2^a - 1)(x^{b - 1} + \cdots + 1)$, en de tweede factor is geheel.
    - opgave: |-
        Besluit: als $2^n - 1$ priem is, dan is $n$ priem. Geldt het omgekeerde?
      antwoord: |-
        ja; nee ($n = 11$)
      uitwerking: |-
        Is $n = ab$ met $1 < a < n$, dan is $2^a - 1$ een deler met $1 < 2^a - 1 < 2^n - 1$. Het omgekeerde is vals: zie $n = 11$ in a.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    irrationale getallen met de ontbinding
  opgave: |-
    Toon aan met de hoofdstelling van de rekenkunde. Kijk telkens naar de exponent van één priemgetal links en rechts.
  lijst: enumerate
  delen:
    - opgave: |-
        $\sqrt{12}$ is irrationaal.
      antwoord: |-
        exponent van 3
      uitwerking: |-
        Stel $\sqrt{12} = \tfrac ab$, dan $a^2 = 12b^2 = 2^2 \cdot 3 \cdot b^2$. Links is de exponent van 3 even, rechts oneven. Dat is in strijd met de uniciteit.
    - opgave: |-
        $\sqrt[3]{2}$ is irrationaal.
      antwoord: |-
        exponent van 2
      uitwerking: |-
        $a^3 = 2b^3$: links is de exponent van 2 een drievoud, rechts een drievoud plus 1.
    - opgave: |-
        $\log_2 3$ is irrationaal.
      antwoord: |-
        $2^a \neq 3^b$
      uitwerking: |-
        $\log_2 3 > 0$. Stel $\log_2 3 = \tfrac ab$ met $a, b \geqslant 1$. Dan is $2^{a/b} = 3$, dus $2^a = 3^b$: een getal met twee verschillende ontbindingen.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    kgv van meer getallen
  opgave: |-
    Los op.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het kleinste getal $\geqslant 1$ dat deelbaar is door alle getallen van 1 tot 10.
      antwoord: |-
        2520
      uitwerking: |-
        Neem elk priemgetal met de grootste exponent die voorkomt: $2^3 \cdot 3^2 \cdot 5 \cdot 7 = 2520$.
    - opgave: |-
        Een boer verdeelt zijn eieren in groepjes van 2, van 3, \ldots, van 10. Telkens blijft er precies 1 ei over. Hoeveel eieren heeft hij minstens, als het er meer dan 1 zijn?
      antwoord: |-
        2521
      uitwerking: |-
        Het aantal min 1 is deelbaar door 2, 3, \ldots, 10, dus een veelvoud van 2520.
    - opgave: |-
        Bereken het kgv van alle getallen van 1 tot 20.
      antwoord: |-
        232\,792\,560
      uitwerking: |-
        $2^4 \cdot 3^2 \cdot 5 \cdot 7 \cdot 11 \cdot 13 \cdot 17 \cdot 19$.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    ggd en kgv van drie getallen
  opgave: |-
    Neem $a = 12$, $b = 18$ en $c = 30$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\ggd(a, b, c)$ en $\kgv(a, b, c)$ met de priemontbinding.
      antwoord: |-
        6 en 180
      uitwerking: |-
        $12 = 2^2 \cdot 3$, $18 = 2 \cdot 3^2$, $30 = 2 \cdot 3 \cdot 5$: ggd $= 2 \cdot 3$, kgv $= 2^2 \cdot 3^2 \cdot 5$.
    - opgave: |-
        Is $\ggd(a, b, c) \cdot \kgv(a, b, c) = abc$?
      antwoord: |-
        nee: 1080 tegenover 6480
      uitwerking: |-
        $6 \cdot 180 = 1080$ en $12 \cdot 18 \cdot 30 = 6480$.
    - opgave: |-
        Verklaar met de exponenten waarom de formule voor twee getallen werkt, en voor drie niet.
      antwoord: |-
        min + max is de som van twee, niet van drie
      uitwerking: |-
        Voor twee exponenten is $\min + \max = e + f$. Voor drie exponenten $e, f, g$ mis je de middelste: bij de priemfactor 2 is $\min + \max = 1 + 2 = 3$, terwijl $e + f + g = 2 + 1 + 1 = 4$.

- id: h2-o18
  soort: opdracht
  niveau: 2
  thema: |-
    alle delers en hun som
  opgave: |-
    Neem $n = 200$.
  lijst: enumerate
  delen:
    - opgave: |-
        Ontbind 200, en zet alle delers in een tabel zoals bij 72 in sectie 4.
      antwoord: |-
        $2^3 \cdot 5^2$, 12 delers
      uitwerking: |-
        Rijen $5^0, 5^1, 5^2$: 1, 2, 4, 8; 5, 10, 20, 40; 25, 50, 100, 200.
    - opgave: |-
        Toon aan dat de som van alle delers gelijk is aan $(1 + 2 + 4 + 8)(1 + 5 + 25)$, en bereken ze.
      antwoord: |-
        465
      uitwerking: |-
        Werk je het product uit, dan krijg je elke term $2^i \cdot 5^j$ uit de tabel precies één keer. $15 \cdot 31 = 465$.
    - opgave: |-
        Bereken zo de som van de delers van 360.
      antwoord: |-
        1170
      uitwerking: |-
        $(1 + 2 + 4 + 8)(1 + 3 + 9)(1 + 5) = 15 \cdot 13 \cdot 6 = 1170$.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    aantal delers, kwadraten
  opgave: |-
    In een gang hangen 100 lampen met de nummers 1 tot 100, allemaal uit. Leerling 1 drukt op de schakelaar van elke lamp, leerling 2 op die van elke tweede lamp, leerling 3 op die van elke derde, en zo verder tot leerling 100.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe vaak wordt de schakelaar van lamp 12 ingedrukt? Is lamp 12 op het einde aan of uit?
      antwoord: |-
        6 keer, uit
      uitwerking: |-
        Door de leerlingen 1, 2, 3, 4, 6 en 12: de delers van 12. Een even aantal keer drukken: uit.
    - opgave: |-
        Toon aan dat $n$ een oneven aantal delers heeft als en slechts als $n$ een kwadraat is.
      antwoord: |-
        alle $e_i$ even
      uitwerking: |-
        $(e_1 + 1) \cdots (e_r + 1)$ is oneven als en slechts als elke $e_i + 1$ oneven is, dus elke $e_i$ even. Dat betekent dat $n = (p_1^{e_1/2} \cdots p_r^{e_r/2})^2$.
    - opgave: |-
        Welke lampen branden op het einde?
      antwoord: |-
        1, 4, 9, \ldots, 100
      uitwerking: |-
        De lampen met een oneven aantal delers: de tien kwadraten.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    oneindig veel priemgetallen van de vorm 4k + 3
  opgave: |-
    We tonen aan dat er oneindig veel priemgetallen zijn met rest 3 bij deling door 4, zoals 3, 7, 11 en 19.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het product van twee getallen met rest 1 bij deling door 4 weer rest 1 heeft.
      antwoord: |-
        $(4k + 1)(4l + 1) = 4(\ldots) + 1$
      uitwerking: |-
        $(4k + 1)(4l + 1) = 16kl + 4k + 4l + 1 = 4(4kl + k + l) + 1$.
    - opgave: |-
        Toon aan dat een oneven getal met rest 3 bij deling door 4 een priemdeler heeft met rest 3.
      antwoord: |-
        anders rest 1
      uitwerking: |-
        Het getal is oneven, dus al zijn priemdelers ook. Hadden ze allemaal rest 1, dan had het product rest 1 (vraag a, herhaald).
    - opgave: |-
        Stel dat $p_1, \ldots, p_k$ alle priemgetallen met rest 3 zijn. Bekijk $N = 4p_1 \cdots p_k - 1$, en leid een tegenspraak af.
      antwoord: |-
        een priemdeler met rest 3 buiten de lijst
      uitwerking: |-
        $N = 4(p_1 \cdots p_k - 1) + 3$ heeft rest 3, dus een priemdeler $p$ met rest 3 (vraag b). Die staat in de lijst, dus $p \deelt 4p_1 \cdots p_k$, en dan $p \deelt 4p_1 \cdots p_k - N = 1$. Tegenspraak.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    volmaakte getallen
  opgave: |-
    Een getal is \textit{volmaakt} als het gelijk is aan de som van zijn delers kleiner dan zichzelf, zoals $6 = 1 + 2 + 3$. Noem $\sigma(n)$ de som van alle positieve delers van $n$. Dan is $n$ volmaakt als $\sigma(n) = 2n$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\sigma(p^e) = \dfrac{p^{e + 1} - 1}{p - 1}$ voor een priemgetal $p$.
      antwoord: |-
        meetkundige rij
      uitwerking: |-
        De delers zijn $1, p, \ldots, p^e$, met som $\frac{p^{e + 1} - 1}{p - 1}$.
    - opgave: |-
        Toon aan dat 28 en 496 volmaakt zijn. Gebruik $\sigma(ab) = \sigma(a)\sigma(b)$ als $\ggd(a, b) = 1$, zoals in opdracht \ref{oef:h2-o18}.
      antwoord: |-
        $\sigma(28) = 56$, $\sigma(496) = 992$
      uitwerking: |-
        $28 = 2^2 \cdot 7$: $7 \cdot 8 = 56$. $496 = 2^4 \cdot 31$: $31 \cdot 32 = 992$.
    - opgave: |-
        Bewijs (Euclides): als $2^p - 1$ priem is, dan is $n = 2^{p - 1}(2^p - 1)$ volmaakt.
      antwoord: |-
        $\sigma(n) = (2^p - 1) \cdot 2^p$
      uitwerking: |-
        $\sigma(n) = \sigma(2^{p - 1}) \cdot \sigma(2^p - 1) = (2^p - 1) \cdot 2^p = 2n$.

- id: h2-o22
  soort: opdracht
  niveau: 3
  thema: |-
    getallen van Fermat
  opgave: |-
    Fermat vermoedde dat de getallen $F_n = 2^{2^n} + 1$ allemaal priem zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $F_0$ tot $F_4$.
      antwoord: |-
        3, 5, 17, 257, 65\,537
      uitwerking: |-
        $2^1 + 1$, $2^2 + 1$, $2^4 + 1$, $2^8 + 1$, $2^{16} + 1$.
    - opgave: |-
        Ga na dat $F_0 F_1 = F_2 - 2$ en $F_0 F_1 F_2 = F_3 - 2$. Toon aan dat $F_0 F_1 \cdots F_{n - 1} = F_n - 2$, met inductie en $(2^{2^n} - 1)(2^{2^n} + 1) = 2^{2^{n + 1}} - 1$.
      antwoord: |-
        $15 = 17 - 2$, $255 = 257 - 2$
      uitwerking: |-
        Stel $F_0 \cdots F_{n - 1} = F_n - 2 = 2^{2^n} - 1$. Dan $F_0 \cdots F_n = (2^{2^n} - 1)(2^{2^n} + 1) = 2^{2^{n + 1}} - 1 = F_{n + 1} - 2$.
    - opgave: |-
        Toon aan dat twee verschillende getallen van Fermat relatief priem zijn, en leid daaruit opnieuw af dat er oneindig veel priemgetallen zijn.
      antwoord: |-
        een gemeenschappelijke deler deelt 2
      uitwerking: |-
        Neem $m < n$ en $d$ een gemeenschappelijke deler. $d$ deelt $F_m$, dus het product $F_n - 2$, en $F_n$, dus het verschil 2. $F_n$ is oneven, dus $d = 1$. Elk $F_n$ heeft een priemdeler, en die zijn allemaal verschillend.
    - opgave: |-
        Euler vond in 1732 dat $F_5 = 4\,294\,967\,297 = 641 \cdot 6\,700\,417$. Wat betekent dat voor het vermoeden van Fermat?
      antwoord: |-
        het is vals
      uitwerking: |-
        $F_5$ is samengesteld, dus niet alle $F_n$ zijn priem. Tot vandaag kent men geen enkel priemgetal van Fermat na $F_4$.

# --- Koppel -----------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    Bij de complexe getallen met gehele reële en imaginaire delen, zoals $2 + \mathrm{i}$, is 5 geen ``priemgetal'' meer.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $(2 + \mathrm{i})(2 - \mathrm{i})$ en $(3 + 2\mathrm{i})(3 - 2\mathrm{i})$.
      antwoord: |-
        5 en 13
      uitwerking: |-
        $(a + b\mathrm{i})(a - b\mathrm{i}) = a^2 + b^2$: $4 + 1$ en $9 + 4$.
    - opgave: |-
        Toon aan dat 3 niet te schrijven is als $(a + b\mathrm{i})(a - b\mathrm{i})$ met $a, b \in \Z$.
      antwoord: |-
        $a^2 + b^2 \neq 3$
      uitwerking: |-
        Dan was $a^2 + b^2 = 3$, maar de kwadraten kleiner dan 3 zijn 0 en 1, en $0 + 0$, $0 + 1$, $1 + 1$ geven geen 3.
    - opgave: |-
        Bereken $(2 + \mathrm{i})(3 + 2\mathrm{i})$ en $(2 + \mathrm{i})(3 - 2\mathrm{i})$, en leid twee manieren af om $65$ als som van twee kwadraten te schrijven.
      antwoord: |-
        $4 + 7\mathrm{i}$, $8 - \mathrm{i}$; $65 = 4^2 + 7^2 = 8^2 + 1^2$
      uitwerking: |-
        $65 = 5 \cdot 13 = (2 + \mathrm{i})(2 - \mathrm{i})(3 + 2\mathrm{i})(3 - 2\mathrm{i})$. Groepeer als $(4 + 7\mathrm{i})(4 - 7\mathrm{i}) = 16 + 49$ of $(8 - \mathrm{i})(8 + \mathrm{i}) = 64 + 1$.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Exponentiële en logaritmische functies
  opgave: |-
    De priemgetalstelling zegt dat $\pi(x) \approx \dfrac{x}{\ln x}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Er zijn 1229 priemgetallen onder $10^4$. Bereken $\dfrac{x}{\ln x}$ voor $x = 10^4$ en de verhouding met $\pi(x)$.
      antwoord: |-
        1085,7; 1,13
      uitwerking: |-
        $\frac{10\,000}{\ln 10\,000} = \frac{10\,000}{9{,}2103} \approx 1085{,}7$, en $\frac{1229}{1085{,}7} \approx 1{,}13$.
    - opgave: |-
        Een willekeurig getal in de buurt van $x$ is priem met een kans van ongeveer $\dfrac{1}{\ln x}$. Schat die kans voor een getal van 100 cijfers.
      antwoord: |-
        ongeveer $\tfrac{1}{230}$
      uitwerking: |-
        $\ln 10^{100} = 100 \ln 10 \approx 230{,}3$.
    - opgave: |-
        Het grootste priemgetal dat in 2024 bekend was, is $2^{136\,279\,841} - 1$. Hoeveel cijfers heeft het?
      antwoord: |-
        41\,024\,320
      uitwerking: |-
        Het aantal cijfers van $N$ is $\lfloor \log N \rfloor + 1$. $\log(2^{136\,279\,841}) = 136\,279\,841 \cdot \log 2 \approx 41\,024\,319{,}9$. De $-1$ verandert het aantal cijfers niet, want $2^k$ eindigt nooit op 0.

- id: h2-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: discreet
    onderwerp: |-
      Telproblemen
  opgave: |-
    Tel met de productregel.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel delers van $10^6$ zijn een kwadraat?
      antwoord: |-
        16
      uitwerking: |-
        $10^6 = 2^6 \cdot 5^6$. Een kwadraat heeft even exponenten: 0, 2, 4 of 6 voor elk priemgetal: $4 \cdot 4$.
    - opgave: |-
        Hoeveel delers van $2^4 \cdot 3^3 \cdot 5^2$ zijn deelbaar door 6?
      antwoord: |-
        36
      uitwerking: |-
        Exponent van 2: 1 tot 4 (4 keuzes), van 3: 1 tot 3 (3), van 5: 0 tot 2 (3). Samen $4 \cdot 3 \cdot 3$.
    - opgave: |-
        Op hoeveel manieren schrijf je 360 als product $a \cdot b$ van twee natuurlijke getallen, als de volgorde telt? En als ze niet telt?
      antwoord: |-
        24; 12
      uitwerking: |-
        Elke deler $a$ bepaalt $b = \tfrac{360}{a}$: 24 manieren. 360 is geen kwadraat, dus $a \neq b$ en elk paar telt dubbel: 12.

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Zijn 433 en 437 priemgetallen? Verantwoord.
  antwoord: |-
    433 wel, $437 = 19 \cdot 23$ niet
  uitwerking: |-
    $20^2 = 400 < 433 < 437 < 441 = 21^2$: test tot 19. Geen priemgetal tot 19 deelt 433. Wel $437 = 19 \cdot 23$.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Ontbind 7920 in priemfactoren.
  antwoord: |-
    $2^4 \cdot 3^2 \cdot 5 \cdot 11$
  uitwerking: |-
    $7920 = 10 \cdot 792 = 2 \cdot 5 \cdot 8 \cdot 99$.

- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    Hoeveel positieve delers heeft $2^5 \cdot 3^3 \cdot 7$? Hoeveel ervan zijn oneven?
  antwoord: |-
    48; 8
  uitwerking: |-
    $6 \cdot 4 \cdot 2 = 48$. Oneven: exponent van 2 is 0, dus $4 \cdot 2 = 8$.

- id: h2-t4
  soort: test
  niveau: 1
  opgave: |-
    Bereken $\ggd(2100, 3528)$ en $\kgv(2100, 3528)$ met de priemontbinding.
  antwoord: |-
    84 en 88\,200
  uitwerking: |-
    $2100 = 2^2 \cdot 3 \cdot 5^2 \cdot 7$, $3528 = 2^3 \cdot 3^2 \cdot 7^2$. ggd $= 2^2 \cdot 3 \cdot 7$, kgv $= 2^3 \cdot 3^2 \cdot 5^2 \cdot 7^2$.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Twee vuurtorens flitsen tegelijk. De ene flitst om de 18 seconden, de andere om de 24 seconden. Na hoeveel seconden flitsen ze opnieuw samen? Hoe vaak flitsen ze samen in één uur?
  antwoord: |-
    72 s; 50 keer
  uitwerking: |-
    $\kgv(18, 24) = \tfrac{18 \cdot 24}{6} = 72$. $3600 : 72 = 50$.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Pas het bewijs van Euclides toe op de lijst 2, 3, 7. Welk nieuw priemgetal vind je? Waarom kan 3 geen deler zijn van het getal $N$?
  antwoord: |-
    43
  uitwerking: |-
    $N = 2 \cdot 3 \cdot 7 + 1 = 43$, een priemgetal. Deelde 3 het getal $N$, dan ook $N - 42 = 1$.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Het getal $p$ is priem, en $p \deelt a^2 b$, maar $p \ndeelt b$. Toon aan dat $p^2 \deelt a^2$.
  antwoord: |-
    lemma van Euclides
  uitwerking: |-
    $p \deelt a \cdot a \cdot b$ en $p \ndeelt b$, dus $p \deelt a$. Dan $a = pk$ en $a^2 = p^2 k^2$.
