- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    zeef van Eratosthenes
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.56]
        \foreach \r in {0,...,4}{\foreach \k in {1,...,10}{%
          \pgfmathtruncatemacro{\g}{100+10*\r+\k}%
          \pgfmathtruncatemacro{\y}{4-\r}%
          \getalvak{\k}{\y}{\g}}}
      \end{tikzpicture}
  opgave: |-
    Gebruik de zeef van Eratosthenes voor de getallen van 101 tot 150.
  lijst: enumerate
  delen:
    - opgave: |-
        Met welke priemgetallen moet je zeven? Waarom volstaat dat?
      antwoord: |-
        2, 3, 5, 7, 11
      uitwerking: |-
        $\sqrt{150} \approx 12{,}2$: een samengesteld getal tot 150 heeft een priemdeler tot 11.
    - opgave: |-
        Welke getallen blijven over?
      antwoord: |-
        101, 103, 107, 109, 113, 127, 131, 137, 139, 149
      uitwerking: |-
        Schrap de even getallen en de veelvouden van 3, 5, 7 en 11 (zoals 119, 121, 133, 143).
    - opgave: |-
        Wat is het grootste gat tussen twee opeenvolgende priemgetallen in dit stuk?
      antwoord: |-
        13, tussen 113 en 127
      uitwerking: |-
        De getallen 114 tot 126 zijn samengesteld: 13 getallen.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    lemma van Euclides en priemtest
  opgave: |-
    Waar of vals? Bewijs, of geef een tegenvoorbeeld. De letters $p$ en $q$ zijn priemgetallen.
  lijst: enumerate
  delen:
    - opgave: |-
        Als $p \deelt a^2$, dan $p \deelt a$.
      antwoord: |-
        waar
      uitwerking: |-
        Lemma van Euclides met $a \cdot a$.
    - opgave: |-
        Als $4 \deelt a^2$, dan $4 \deelt a$.
      antwoord: |-
        vals
      uitwerking: |-
        $a = 2$.
    - opgave: |-
        Elk samengesteld getal $n$ heeft een priemdeler die strikt kleiner is dan $\sqrt n$.
      antwoord: |-
        vals
      uitwerking: |-
        $n = 49$: de enige priemdeler is $7 = \sqrt{49}$. De priemtest zegt $p \leqslant \sqrt n$.
    - opgave: |-
        Als $p \deelt q$, dan $p = q$.
      antwoord: |-
        waar
      uitwerking: |-
        De positieve delers van $q$ zijn 1 en $q$, en $p \neq 1$.
    - opgave: |-
        Het product van twee opeenvolgende priemgetallen plus 1 is priem.
      antwoord: |-
        vals
      uitwerking: |-
        $3 \cdot 5 + 1 = 16$.

- id: h2-o7
