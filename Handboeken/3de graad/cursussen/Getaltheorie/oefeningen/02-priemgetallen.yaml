# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of beantwoord.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        alle priemgetallen tussen 20 en 40
      antwoord: |-
        23, 29, 31, 37
      uitwerking: |-
        21, 25, 27, 33, 35 en 39 zijn oneven maar deelbaar door 3, 5 of 7.
    - opgave: |-
        $2^3 \cdot 3^2 \cdot 5$
      antwoord: |-
        360
      uitwerking: |-
        $8 \cdot 9 \cdot 5 = 360$.
    - opgave: |-
        84 als product van priemgetallen
      antwoord: |-
        $2 \cdot 2 \cdot 3 \cdot 7$
      uitwerking: |-
        $84 = 2 \cdot 42 = 2 \cdot 2 \cdot 21 = 2 \cdot 2 \cdot 3 \cdot 7$.
    - opgave: |-
        $\ggd(84, 90)$
      antwoord: |-
        6
      uitwerking: |-
        $90 = 84 + 6$ en $84 = 14 \cdot 6$.
    - opgave: |-
        is 91 een priemgetal?
      antwoord: |-
        nee, $91 = 7 \cdot 13$
      uitwerking: |-
        $7 \cdot 13 = 91$.
    - opgave: |-
        het kleinste getal $\geqslant 1$ dat deelbaar is door 4 en door 6
      antwoord: |-
        12
      uitwerking: |-
        De veelvouden van 6 zijn 6, 12, \ldots, en 12 is het eerste dat ook deelbaar is door 4.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Leef even in de wereld $E$ van de even getallen $2, 4, 6, 8, \ldots$ Een getal uit $E$ noemen we er \textit{E-priem} als het geen product is van twee getallen uit $E$. Zo is 8 niet E-priem, want $8 = 2 \cdot 4$, maar 6 wel: $6 = 2 \cdot 3$, en 3 zit niet in $E$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke van de getallen 2, 4, 10, 12, 14, 16 en 30 zijn E-priem?
      antwoord: |-
        2, 10, 14, 30
      uitwerking: |-
        $4 = 2 \cdot 2$, $12 = 2 \cdot 6$ en $16 = 2 \cdot 8$ zijn producten in $E$. De E-priemgetallen zijn de getallen $2 \cdot$ oneven: 2, 10, 14 en 30.
    - opgave: |-
        Schrijf 60 op twee verschillende manieren als product van E-priemgetallen.
      antwoord: |-
        $60 = 2 \cdot 30 = 6 \cdot 10$
      uitwerking: |-
        2, 30, 6 en 10 zijn allemaal E-priem, en $2 \cdot 30 = 6 \cdot 10 = 60$.
    - opgave: |-
        Kan zoiets ook met gewone priemgetallen? Wat denk je?
      antwoord: |-
        nee (zie sectie 3)
      uitwerking: |-
        Met gewone priemgetallen is de ontbinding uniek: $60 = 2^2 \cdot 3 \cdot 5$. Dat is de hoofdstelling van de rekenkunde.

- id: h2-priemtest
  soort: kort
  opgave: |-
    Priemgetal of samengesteld? Geef bij een samengesteld getal een ontbinding.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        143
      antwoord: |-
        $11 \cdot 13$
      uitwerking: |-
        Test tot $\sqrt{143} \approx 12$: 11 deelt.
    - opgave: |-
        179
      antwoord: |-
        priem
      uitwerking: |-
        $\sqrt{179} \approx 13{,}4$; 2, 3, 5, 7, 11 en 13 delen niet.
    - opgave: |-
        289
      antwoord: |-
        $17^2$
      uitwerking: |-
        $\sqrt{289} = 17$, en 17 deelt.
    - opgave: |-
        359
      antwoord: |-
        priem
      uitwerking: |-
        $\sqrt{359} \approx 18{,}9$; geen priemgetal tot 17 deelt.
    - opgave: |-
        403
      antwoord: |-
        $13 \cdot 31$
      uitwerking: |-
        $\sqrt{403} \approx 20$; 13 deelt.
    - opgave: |-
        2027
      antwoord: |-
        priem
      uitwerking: |-
        $\sqrt{2027} \approx 45$; geen van de 14 priemgetallen tot 43 deelt.

- id: h2-oneindig
  soort: kort
  opgave: |-
    Los op.
  lijst: enumerate
  delen:
    - opgave: |-
        Pas het bewijs van Euclides toe op de lijst 2, 5, 11. Welke nieuwe priemgetallen vind je?
      antwoord: |-
        3 en 37
      uitwerking: |-
        $N = 2 \cdot 5 \cdot 11 + 1 = 111 = 3 \cdot 37$.
    - opgave: |-
        Geef acht opeenvolgende samengestelde getallen, met de methode van voorbeeld~\ref{vb:h2-gaten}.
      antwoord: |-
        $9! + 2, \ldots, 9! + 9$
      uitwerking: |-
        $9! = 362\,880$. De getallen $362\,882$, \ldots, $362\,889$: $k \deelt 9! + k$ voor $k = 2, \ldots, 9$.
    - opgave: |-
        Zoek in de zeef van Eratosthenes vijf opeenvolgende samengestelde getallen. Waarom vind je zo veel kleinere dan met de methode van b?
      antwoord: |-
        bv. 24 tot 28
      uitwerking: |-
        24, 25, 26, 27, 28 (ook 90 tot 96). De methode met $n!$ geeft altijd een gat, maar niet het eerste.

- id: h2-lemma
  soort: kort
  opgave: |-
    Los op. De letter $p$ is een priemgetal.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: als $p \deelt a^5$, dan $p \deelt a$.
      antwoord: |-
        lemma voor meer factoren
      uitwerking: |-
        $p$ deelt het product $a \cdot a \cdot a \cdot a \cdot a$, dus een van de factoren.
    - opgave: |-
        Waar of vals: als $9 \deelt a^2$, dan $9 \deelt a$?
      antwoord: |-
        vals
      uitwerking: |-
        $a = 3$: $9 \deelt 9$, maar $9 \ndeelt 3$.
    - opgave: |-
        Toon aan: als $p \ndeelt a$ en $p \ndeelt b$, dan $p \ndeelt ab$.
      antwoord: |-
        contrapositie van het lemma
      uitwerking: |-
        Was $p \deelt ab$, dan $p \deelt a$ of $p \deelt b$ (lemma van Euclides).

- id: h2-ontbind
  soort: kort
  opgave: |-
    Ontbind in priemfactoren.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        2016
      antwoord: |-
        $2^5 \cdot 3^2 \cdot 7$
      uitwerking: |-
        $2016 = 2^5 \cdot 63$.
    - opgave: |-
        3645
      antwoord: |-
        $3^6 \cdot 5$
      uitwerking: |-
        $3645 = 5 \cdot 729$.
    - opgave: |-
        1716
      antwoord: |-
        $2^2 \cdot 3 \cdot 11 \cdot 13$
      uitwerking: |-
        $1716 = 4 \cdot 429 = 4 \cdot 3 \cdot 143$.
    - opgave: |-
        9797
      antwoord: |-
        $97 \cdot 101$
      uitwerking: |-
        Geen priemgetal tot 89 deelt; $97 \cdot 101 = 9797$.
    - opgave: |-
        1155
      antwoord: |-
        $3 \cdot 5 \cdot 7 \cdot 11$
      uitwerking: |-
        $1155 = 5 \cdot 231 = 5 \cdot 3 \cdot 77$.
    - opgave: |-
        6859
      antwoord: |-
        $19^3$
      uitwerking: |-
        $6859 = 19 \cdot 361$.

- id: h2-delers
  soort: kort
  opgave: |-
    Gebruik oefening \ref{oef:h2-ontbind}.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel positieve delers hebben 2016, 3645 en 9797?
      antwoord: |-
        36, 14, 4
      uitwerking: |-
        $6 \cdot 3 \cdot 2 = 36$, $7 \cdot 2 = 14$, $2 \cdot 2 = 4$.
    - opgave: |-
        Hoeveel delers van 2016 zijn oneven? Welke?
      antwoord: |-
        6: 1, 3, 7, 9, 21, 63
      uitwerking: |-
        Exponent van 2 is 0: $3 \cdot 2 = 6$ keuzes, de delers van $63 = 3^2 \cdot 7$.
    - opgave: |-
        Waarom heeft het product van twee verschillende priemgetallen altijd precies vier delers?
      antwoord: |-
        $(1 + 1)(1 + 1)$
      uitwerking: |-
        $pq$ heeft de delers $1$, $p$, $q$ en $pq$, en volgens de formule $2 \cdot 2 = 4$.

- id: h2-ggdkgv
  soort: kort
  opgave: |-
    Bereken de ggd en het kgv met de priemontbinding.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        90 en 168
      antwoord: |-
        6 en 2520
      uitwerking: |-
        $90 = 2 \cdot 3^2 \cdot 5$, $168 = 2^3 \cdot 3 \cdot 7$.
    - opgave: |-
        $2^4 \cdot 3 \cdot 5^2$ en $2^2 \cdot 3^3 \cdot 7$
      antwoord: |-
        12 en $2^4 \cdot 3^3 \cdot 5^2 \cdot 7 = 75\,600$
      uitwerking: |-
        ggd: $2^2 \cdot 3$. kgv: de grootste exponenten.
    - opgave: |-
        385 en 714
      antwoord: |-
        7 en 39\,270
      uitwerking: |-
        $385 = 5 \cdot 7 \cdot 11$, $714 = 2 \cdot 3 \cdot 7 \cdot 17$. kgv $= \tfrac{385 \cdot 714}{7}$.
    - opgave: |-
        1001 en 1716
      antwoord: |-
        143 en 12\,012
      uitwerking: |-
        $1001 = 7 \cdot 11 \cdot 13$, $1716 = 2^2 \cdot 3 \cdot 11 \cdot 13$.

- id: h2-kgv
  soort: kort
  opgave: |-
    Om 7.00 uur vertrekken twee bussen tegelijk aan het station. Lijn A vertrekt om de 12 minuten, lijn B om de 20 minuten.
  lijst: enumerate
  delen:
    - opgave: |-
        Wanneer vertrekken ze opnieuw samen?
      antwoord: |-
        om 8.00 uur
      uitwerking: |-
        $\kgv(12, 20) = 60$: na 60 minuten.
    - opgave: |-
        Hoe vaak vertrekken ze samen tussen 7.00 en 19.00 uur, beide meegeteld?
      antwoord: |-
        13 keer
      uitwerking: |-
        Elk vol uur: 7.00, 8.00, \ldots, 19.00.
    - opgave: |-
        En als lijn B om de 21 minuten rijdt?
      antwoord: |-
        om de 84 minuten, 9 keer
      uitwerking: |-
        $\kgv(12, 21) = \tfrac{12 \cdot 21}{3} = 84$. In 720 minuten: $720 = 8 \cdot 84 + 48$, dus op $0, 84, \ldots, 672$: 9 keer.

