    Bereken de ggd en het kgv. Controleer met $\ggd \cdot \kgv = ab$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        84 en 120
      antwoord: |-
        12 en 840
      uitwerking: |-
        $84 = 2^2 \cdot 3 \cdot 7$, $120 = 2^3 \cdot 3 \cdot 5$. $12 \cdot 840 = 10\,080 = 84 \cdot 120$.
    - opgave: |-
        $2^3 \cdot 5^2 \cdot 7$ en $2 \cdot 5^3 \cdot 11$
      antwoord: |-
