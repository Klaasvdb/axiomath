# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\begin{vmatrix} 1 & 2 & 3 \\ 0 & 1 & 4 \\ 2 & 0 & 1 \end{vmatrix}$
      antwoord: |-
        11
      uitwerking: |-
        $1(1-0)-2(0-8)+3(0-2)=1+16-6=11$.
    - opgave: |-
        het snijpunt van $x + y = 5$ en $2x - y = 1$
      antwoord: |-
        $(2, 3)$
      uitwerking: |-
        Tel op: $3x=6$.
    - opgave: |-
        een richtingsvector van de rechte $3x - 2y = 7$
      antwoord: |-
        $(2, 3)$
      uitwerking: |-
        $(-b, a)=(2, 3)$.
    - opgave: |-
        de oplossingen van $x + 2y - z = 0$, $y + z = 0$
      antwoord: |-
        $t(3, -1, 1)$
      uitwerking: |-
        $y=-z$ en $x=-2y+z=3z$.
    - opgave: |-
        het snijpunt van de rechte $(x, y, z) = t\,(2, 1, 4)$ met het vlak $z = 1$
      antwoord: |-
        $\bigl(\tfrac12,\tfrac14, 1\bigr)$
      uitwerking: |-
        $4t=1$, dus $t=\tfrac14$.
    - opgave: |-
        een normaalvector van het vlak $2x - y + 3z = 0$
      antwoord: |-
        $(2, -1, 3)$
      uitwerking: |-
        De coëfficiënten.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Het oog van een schilder staat in de oorsprong $O$ en kijkt in de richting van de $z$-as. Zijn doek is het vlak $z = 1$, de vloer het vlak $y = -1$. Het punt $(X, Y, Z)$ ziet hij op het doek waar de rechte naar $O$ het doek doorprikt. Op de vloer liggen twee rails: $X = -1$ en $X = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar op het doek ziet hij het vloerpunt $(1, -1, 4)$?
      antwoord: |-
        $\bigl(\tfrac14, -\tfrac14\bigr)$
      uitwerking: |-
        De rechte $t(1, -1, 4)$ prikt $z=1$ door bij $t=\tfrac14$.
    - opgave: |-
        Bereken de beelden van de punten van beide rails met $Z = 1$, 2, 5, 10 en 100.
      antwoord: |-
        $\bigl(\pm\tfrac1Z, -\tfrac1Z\bigr)$
      uitwerking: |-
        $(\pm1, -1)$, $\bigl(\pm\tfrac12, -\tfrac12\bigr)$, $\bigl(\pm\tfrac15, -\tfrac15\bigr)$, $(\pm0{,}1;\,-0{,}1)$, $(\pm0{,}01;\,-0{,}01)$.
    - opgave: |-
        Naar welk punt gaan de beelden van beide rails? Is dat het beeld van een punt van de vloer?
      antwoord: |-
        $(0, 0)$; nee
      uitwerking: |-
        Het beeld $\bigl(\tfrac XZ,\tfrac{-1}{Z}\bigr)$ heeft nooit tweede coördinaat 0. Het punt $(0, 0)$ is het beeld van de punten $(0, 0, Z)$ op ooghoogte, niet van de vloer.
    - opgave: |-
        Op welke rechte van het doek ligt het beeld van de rail $X = 1$?
      antwoord: |-
        $y=-x$
      uitwerking: |-
        Het beeld $\bigl(\tfrac1Z, -\tfrac1Z\bigr)$ ligt op $y=-x$, tussen $(1, -1)$ en $(0, 0)$.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h2-persp
  soort: kort
  opgave: |-
    Het oog staat in $O$ en het doek in het vlak $z = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar op het doek zie je het punt $(2, 1, 4)$?
      antwoord: |-
        $\bigl(\tfrac12,\tfrac14\bigr)$
      uitwerking: |-
        $\bigl(\tfrac XZ,\tfrac YZ\bigr)$.
    - opgave: |-
        Waar ligt het verdwijnpunt van de rechten met richting $(3, 0, 2)$? En van die met richting $(1, 1, 2)$, zoals de leuning van een trap?
      antwoord: |-
        $\bigl(\tfrac32, 0\bigr)$ en $\bigl(\tfrac12,\tfrac12\bigr)$
      uitwerking: |-
        $\bigl(\tfrac ac,\tfrac bc\bigr)$. Het eerste ligt op de horizon, het tweede erboven: de leuning stijgt.
    - opgave: |-
        Hebben de verticale rechten, met richting $(0, 1, 0)$, een verdwijnpunt?
      antwoord: |-
        nee
      uitwerking: |-
        $c=0$: ze zijn evenwijdig met het doek, en hun beelden blijven evenwijdig (verticaal).

- id: h2-oneindig
  soort: kort
  opgave: |-
    Beantwoord in het projectieve vlak.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is het snijpunt van $y = 2x + 1$ en $y = 2x - 3$?
      antwoord: |-
        het punt op oneindig met richting $(1, 2)$
      uitwerking: |-
        Ze zijn evenwijdig, met richting $(1, 2)$.
    - opgave: |-
        Wat is het snijpunt van $y = x$ en de rechte op oneindig?
      antwoord: |-
        het punt op oneindig met richting $(1, 1)$
      uitwerking: |-
        Een gewone rechte snijdt de rechte op oneindig in haar eigen punt op oneindig.
    - opgave: |-
        Welke rechte gaat door de punten op oneindig van de $x$-as en de $y$-as?
      antwoord: |-
        de rechte op oneindig
      uitwerking: |-
        Een gewone rechte heeft maar één punt op oneindig.

- id: h2-hc
  soort: kort
  opgave: |-
    Zet om.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(-1, 4)$ naar homogene coördinaten
      antwoord: |-
        $\hc{-1}41$
      uitwerking: |-
        Een 1 achteraan.
    - opgave: |-
        $\hc{6}{-3}{3}$ naar gewone coördinaten
      antwoord: |-
        $(2, -1)$
      uitwerking: |-
        Deel door 3.
    - opgave: |-
        $\hc250$
      antwoord: |-
        punt op oneindig, richting $(2, 5)$
      uitwerking: |-
        De derde coördinaat is 0.
    - opgave: |-
        $\hc007$
      antwoord: |-
        de oorsprong
      uitwerking: |-
        $\bigl(\tfrac07,\tfrac07\bigr)=(0, 0)$.
    - opgave: |-
        het punt op oneindig van $y = -3x + 1$
      antwoord: |-
        $\hc1{-3}0$
      uitwerking: |-
        De richting is $(1, -3)$.
    - opgave: |-
        $\bigl(\tfrac12, \tfrac13\bigr)$ met gehele coördinaten
      antwoord: |-
        $\hc326$
      uitwerking: |-
        $\hc{\tfrac12}{\tfrac13}{1}$, maal 6.

- id: h2-rechte
  soort: kort
  opgave: |-
    Zet om, en geef het punt op oneindig van de rechte.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = -x + 5$
      antwoord: |-
        $x+y-5z=0$; $\hc1{-1}0$
      uitwerking: |-
        Richting $(1, -1)$.
    - opgave: |-
        $y = 4$
      antwoord: |-
        $y-4z=0$; $\hc100$
      uitwerking: |-
        Een horizontale rechte.
    - opgave: |-
        $3x - y + 2z = 0$
      antwoord: |-
        $y=3x+2$; $\hc130$
      uitwerking: |-
        Stel $z=1$.
    - opgave: |-
        $2x + 5z = 0$
      antwoord: |-
        $x=-\tfrac52$; $\hc010$
      uitwerking: |-
        Een verticale rechte.

- id: h2-snij
  soort: kort
  opgave: |-
    Gebruik het vectorproduct.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal het snijpunt van $2x - y = 1$ en $x + y = 5$.
      antwoord: |-
        $(2, 3)$
      uitwerking: |-
        $\rc{2}{-1}{-1}\times\rc{1}{1}{-5}=(5+1,\,-1+10,\,2+1)=(6, 9, 3)\sim\hc231$.
    - opgave: |-
        Bepaal het snijpunt van $y = 3x$ en $y = 3x + 2$.
      antwoord: |-
        $\hc130$
      uitwerking: |-
        $\rc{3}{-1}{0}\times\rc{3}{-1}{2}=(-2,\,-6,\,0)\sim\hc130$: het punt op oneindig met richting $(1, 3)$.
    - opgave: |-
        Bepaal de rechte door $(2, 1)$ en $(-1, 3)$.
      antwoord: |-
        $2x+3y=7$
      uitwerking: |-
        $\hc211\times\hc{-1}31=(1-3,\,-1-2,\,6+1)=(-2, -3, 7)$: $-2x-3y+7z=0$.
    - opgave: |-
        Bepaal de rechte door $(0, 2)$ met richting $(1, -1)$.
      antwoord: |-
        $x+y=2$
      uitwerking: |-
        $\hc021\times\hc1{-1}0=(0+1,\,1-0,\,0-2)=(1, 1, -2)$.

- id: h2-det
  soort: kort
  opgave: |-
    Gebruik een determinant.
  lijst: enumerate
  delen:
    - opgave: |-
        Liggen $\hc111$, $\hc231$ en $\hc0{-1}1$ op één rechte?
      antwoord: |-
        ja
      uitwerking: |-
        $1(3+1)-1(2-0)+1(-2-0)=0$.
    - opgave: |-
        Gaan $x + y - z = 0$, $2x - y + z = 0$ en $x - 2y + 2z = 0$ door één punt? Welk?
      antwoord: |-
        ja, door $(0, 1)$
      uitwerking: |-
        $1(-2+2)-1(4-1)-1(-4+1)=0$. Het snijpunt van de eerste twee is $\rc11{-1}\times\rc2{-1}1=(0, -3, -3)\sim\hc011$.
    - opgave: |-
        Gaan $y = 2x$, $y = 2x + 1$ en $4x - 2y + 3 = 0$ door één punt?
      antwoord: |-
        ja, door $\hc120$
      uitwerking: |-
        De rechten zijn evenwijdig. De determinant is 0, want de eerste kolom is $-2$ keer de tweede: $\rc2{-1}0$, $\rc2{-1}1$, $\rc4{-2}3$.

- id: h2-desargues
  soort: kort
  opgave: |-
    Neem $O(0, 0)$, $A(1, 0)$, $B(0, 1)$, $C(1, 1)$, en $A'(2, 0)$, $B'(0, 3)$, $C'(4, 4)$. Ga na dat de driehoeken in perspectief staan vanuit $O$, bereken $P = BC \cap B'C'$, $Q = CA \cap C'A'$ en $R = AB \cap A'B'$, en controleer Desargues.
  antwoord: |-
    $P(-8, 1)$, $Q(1, -2)$, $R(4, -3)$, op $x+3y+5=0$
  uitwerking: |-
    $A'=2A$, $B'=3B$, $C'=4C$ liggen op de rechten door $O$. $BC=\rc01{-1}$, $B'C'=\rc{-1}{4}{-12}$, $P=\hc{-8}11$. $CA=\rc10{-1}$, $C'A'=\rc4{-2}{-8}$, $Q=\hc1{-2}1$. $AB=\rc{-1}{-1}1$, $A'B'=\rc{-3}{-2}6$, $R=\hc4{-3}1$. De drie punten liggen op $x+3y+5=0$: $-8+3+5=0$, $1-6+5=0$, $4-9+5=0$.

- id: h2-trans
  soort: kort
  opgave: |-
    Stuur de rechte $l: y = 2$ naar oneindig.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een geschikte matrix $A$.
      antwoord: |-
        $A=\um{rrr}{1 & 0 & 0 \\ 0 & 1 & 0 \\ 0 & 1 & -2}$
      uitwerking: |-
        De derde rij is $\rc01{-2}$, en $\det A=-2\neq0$.
    - opgave: |-
        De rechten $x = 0$ en $y = x + 2$ snijden elkaar op $l$. Wat worden ze?
      antwoord: |-
        $x'=0$ en $x'=1$
      uitwerking: |-
        $(A^{-1})\tr=\um{rrr}{1 & 0 & 0 \\ 0 & 1 & \tfrac12 \\ 0 & 0 & -\tfrac12}$. Dan $\rc100\mapsto\rc100$ en $\rc1{-1}2\mapsto\rc10{-1}$: twee evenwijdige rechten.

- id: h2-pappus
  soort: kort
  opgave: |-
    Neem $A(1, 0)$, $B(3, 0)$, $C(4, 0)$ en $A'(0, 1)$, $B'(0, 2)$, $C'(0, 4)$. Bereken $X = AB' \cap A'B$, $Y = AC' \cap A'C$ en $Z = BC' \cap B'C$, en controleer Pappus.
  antwoord: |-
    $X\bigl(\tfrac35,\tfrac45\bigr)$, $Y\bigl(\tfrac45,\tfrac45\bigr)$, $Z\bigl(\tfrac{12}5,\tfrac45\bigr)$, op $y=\tfrac45$
  uitwerking: |-
    $AB'=\rc{-2}{-1}2$, $A'B=\rc13{-3}$; $AC'=\rc{-4}{-1}4$, $A'C=\rc14{-4}$; $BC'=\rc{-4}{-3}{12}$, $B'C=\rc24{-8}$. De snijpunten hebben allemaal $y=\tfrac45$.

- id: h2-terug
  soort: kort
  opgave: |-
    Het oog staat op 1,5 m boven de vloer, en het doek op 2 m van het oog. Een vloerpunt $(X, Z)$ ligt dan in de ruimte in $(X; -1{,}5; Z)$, en komt op het doek $z = 2$ in $\bigl(\tfrac{2X}{Z}, -\tfrac{3}{Z}\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf het perspectief als een projectieve transformatie.
      antwoord: |-
        $\hc XZW\mapsto\hc{2X}{-3W}{Z}$
      uitwerking: |-
        $\bigl(\tfrac{2X}{Z}, -\tfrac3Z\bigr)=\hc{2X}{-3}{Z}$, met matrix $\um{rrr}{2 & 0 & 0 \\ 0 & 0 & -3 \\ 0 & 1 & 0}$ en determinant 6.
    - opgave: |-
        Waar liggen het verdwijnpunt $V$ van de voegen in de diepte en het afstandspunt $D$ van de diagonalen?
      antwoord: |-
        $V(0, 0)$ en $D(2, 0)$
      uitwerking: |-
        $\hc010\mapsto\hc001$ en $\hc110\mapsto\hc201$. Het afstandspunt ligt op 2 m van $V$: zo ver als het doek van het oog.

# --- Opdrachten ------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    homogene coördinaten van punten
  opgave: |-
    Zet om naar homogene of naar gewone coördinaten. Zeg het als het een punt op oneindig is.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $(-2, 5)$
      antwoord: |-
        $\hc{-2}51$
      uitwerking: |-
        Een 1 achteraan.
    - opgave: |-
        $\hc8{-4}4$
      antwoord: |-
        $(2, -1)$
      uitwerking: |-
        Deel door 4.
    - opgave: |-
        $\hc3{-1}0$
      antwoord: |-
        op oneindig, richting $(3, -1)$
      uitwerking: |-
        De derde coördinaat is 0.
    - opgave: |-
        $\hc00{-2}$
      antwoord: |-
        $(0, 0)$
      uitwerking: |-
        Deel door $-2$.
    - opgave: |-
        het punt op oneindig van de $y$-as
      antwoord: |-
        $\hc010$
      uitwerking: |-
        Richting $(0, 1)$.
    - opgave: |-
        $\bigl(\tfrac13, 2\bigr)$
      antwoord: |-
        $\hc163$
      uitwerking: |-
        Maal 3.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    homogene vergelijking van een rechte
  opgave: |-
    Geef de homogene vergelijking en het punt op oneindig van de gewone rechte, of de gewone vergelijking van de homogene.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = -2x + 3$
      antwoord: |-
        $2x+y-3z=0$; $\hc1{-2}0$
      uitwerking: |-
        Richting $(1, -2)$.
    - opgave: |-
        $x = -1$
      antwoord: |-
        $x+z=0$; $\hc010$
      uitwerking: |-
        Verticaal.
    - opgave: |-
        de $x$-as
      antwoord: |-
        $y=0$; $\hc100$
      uitwerking: |-
        Er komt geen $z$ in voor.
    - opgave: |-
        $x - 3y + 6z = 0$
      antwoord: |-
        $y=\tfrac13x+2$
      uitwerking: |-
        Stel $z=1$.
    - opgave: |-
        $4x + 2y = 0$
      antwoord: |-
        $y=-2x$
      uitwerking: |-
        Een rechte door de oorsprong.
    - opgave: |-
        $5z = 0$
      antwoord: |-
        de rechte op oneindig
      uitwerking: |-
        Dat is $z=0$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    snijpunt met het vectorproduct
  opgave: |-
    Bepaal het snijpunt in het projectieve vlak.
  lijst: enumerate
  delen:
    - opgave: |-
        $x + y = 4$ en $x - y = 2$
      antwoord: |-
        $(3, 1)$
      uitwerking: |-
        $\rc11{-4}\times\rc1{-1}{-2}=(-2-4,\,-4+2,\,-1-1)=(-6, -2, -2)\sim\hc311$.
    - opgave: |-
        $2x - 3y = 1$ en $4x - 6y = 5$
      antwoord: |-
        $\hc320$
      uitwerking: |-
        $\rc2{-3}{-1}\times\rc4{-6}{-5}=(15-6,\,-4+10,\,-12+12)=(9, 6, 0)\sim\hc320$: ze zijn evenwijdig.
    - opgave: |-
        $x = 2$ en de rechte op oneindig
      antwoord: |-
        $\hc010$
      uitwerking: |-
        $\rc10{-2}\times\rc001=(0, -1, 0)$.
    - opgave: |-
        $x - y = 0$ en $2x - 2y + z = 0$
      antwoord: |-
        $\hc110$
      uitwerking: |-
        $\rc1{-1}0\times\rc2{-2}1=(-1, -1, 0)$: de rechten $y=x$ en $y=x+\tfrac12$ zijn evenwijdig.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    verbindingsrechte met het vectorproduct
  opgave: |-
    Bepaal de rechte door de twee punten.
  lijst: enumerate
  delen:
    - opgave: |-
        $(1, 1)$ en $(4, 7)$
      antwoord: |-
        $2x-y=1$
      uitwerking: |-
        $\hc111\times\hc471=(1-7,\,4-1,\,7-4)=(-6, 3, 3)\sim\rc2{-1}{-1}$.
    - opgave: |-
        $(2, -1)$ en $\hc130$
      antwoord: |-
        $y=3x-7$
      uitwerking: |-
        $\hc2{-1}1\times\hc130=(0-3,\,1-0,\,6+1)=(-3, 1, 7)$: $-3x+y+7=0$.
    - opgave: |-
        $\hc100$ en $\hc001$
      antwoord: |-
        de $x$-as
      uitwerking: |-
        $\hc100\times\hc001=(0, -1, 0)$: $y=0$. Het punt op oneindig van de $x$-richting en de oorsprong.
    - opgave: |-
        $\hc120$ en $\hc360$. Wat loopt er mis?
      antwoord: |-
        het vectorproduct is $(0, 0, 0)$
      uitwerking: |-
        Het is twee keer hetzelfde punt: er gaan oneindig veel rechten door.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    perspectief
  opgave: |-
    Het oog staat in $O$ en het doek in het vlak $z = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar op het doek zie je het punt $(-3, 2, 6)$?
      antwoord: |-
        $\bigl(-\tfrac12,\tfrac13\bigr)$
      uitwerking: |-
        Deel door $Z=6$.
    - opgave: |-
        Welke punten van de ruimte zie je op de plaats $(1, 2)$ van het doek?
      antwoord: |-
        de punten $t(1, 2, 1)$ met $t>0$
      uitwerking: |-
        De lichtstraal door $O$ en $(1, 2, 1)$.
    - opgave: |-
        Een weg loopt een helling af met richting $(2, -1, 4)$. Waar ligt haar verdwijnpunt?
      antwoord: |-
        $\bigl(\tfrac12, -\tfrac14\bigr)$
      uitwerking: |-
        Onder de horizon, want de weg daalt.
    - opgave: |-
        Een vlakke weg loopt in de richting $(1, 0, 3)$. Waar ligt haar verdwijnpunt?
      antwoord: |-
        $\bigl(\tfrac13, 0\bigr)$, op de horizon
      uitwerking: |-
        $b=0$.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    op één rechte, door één punt
  opgave: |-
    Gebruik een determinant.
  lijst: enumerate
  delen:
    - opgave: |-
        Liggen $\hc211$, $\hc110$ en $\hc532$ op één rechte?
      antwoord: |-
        ja
      uitwerking: |-
        $2(2-0)-1(2-0)+1(3-5)=0$. Ook: $(5, 3, 2)=2(2, 1, 1)+(1, 1, 0)$.
    - opgave: |-
        Gaan $x - y = 0$, $x + y - 2z = 0$ en $3x - y - 2z = 0$ door één punt? Welk?
      antwoord: |-
        ja, door $(1, 1)$
      uitwerking: |-
        $1(-2-2)+1(-2+6)+0=0$. $(1, 1, 1)$ voldoet aan alle drie.
    - opgave: |-
        Voor welke $k$ liggen $\hc1k0$, $\hc011$ en $\hc201$ op één rechte?
      antwoord: |-
        $k=-\tfrac12$
      uitwerking: |-
        $\begin{vmatrix} 1 & k & 0 \\ 0 & 1 & 1 \\ 2 & 0 & 1 \end{vmatrix}=1+2k=0$.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    dualiteit
  opgave: |-
    Formuleer de duale uitspraak: wissel punten en rechten.
  lijst: enumerate
  delen:
    - opgave: |-
        Twee verschillende punten liggen op precies één rechte.
      antwoord: |-
        Twee verschillende rechten gaan door precies één punt.
      uitwerking: |-
        Beide zijn waar in het projectieve vlak.
    - opgave: |-
        Drie punten liggen op één rechte als en slechts als hun determinant 0 is.
      antwoord: |-
        Drie rechten gaan door één punt als en slechts als hun determinant 0 is.
      uitwerking: |-
        De twee stellingen uit de leerstof.
    - opgave: |-
        Er bestaan vier punten waarvan er geen drie op één rechte liggen.
      antwoord: |-
        Er bestaan vier rechten waarvan er geen drie door één punt gaan.
      uitwerking: |-
        Bijvoorbeeld $x=0$, $y=0$, $z=0$ en $x+y+z=0$.
    - opgave: |-
        Op elke rechte liggen oneindig veel punten.
      antwoord: |-
        Door elk punt gaan oneindig veel rechten.
      uitwerking: |-
        Ook door een punt op oneindig: alle rechten met die richting, en de rechte op oneindig.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    projectieve transformatie
  opgave: |-
    Neem de projectieve transformatie met matrix $A = \um{ccc}{1 & 0 & 0 \\ 0 & 1 & 0 \\ 1 & 0 & 1}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal het beeld van $(1, 2)$.
      antwoord: |-
        $\bigl(\tfrac12, 1\bigr)$
      uitwerking: |-
        $A\hc121=\hc122$.
    - opgave: |-
        Welke rechte gaat naar oneindig?
      antwoord: |-
        $x=-1$
      uitwerking: |-
        De derde coördinaat van het beeld is $x+z$: die is 0 op $x+z=0$.
    - opgave: |-
        Op welke rechte komt de rechte op oneindig terecht?
      antwoord: |-
        $x=1$
      uitwerking: |-
        $\hc xy0\mapsto\hc xyx$: de punten met $x'=z'$.
    - opgave: |-
        Welk punt gaat naar het punt op oneindig $\hc100$?
      antwoord: |-
        $(-1, 0)$
      uitwerking: |-
        $A^{-1}\hc100=\hc10{-1}$.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    Desargues narekenen
  opgave: |-
    Neem $O(0, 0)$, $A(2, 0)$, $B(0, 2)$, $C(2, 2)$, $A'(4, 0)$ en $B'(0, 3)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Neem $C'(6, 6)$. Bereken de drie snijpunten van overeenkomstige zijden en controleer Desargues.
      antwoord: |-
        $P(-2, 2)$, $Q(2, -6)$, $R(-4, 6)$, op $2x+y+2=0$
      uitwerking: |-
        $BC=\rc02{-4}$, $B'C'=\rc{-3}6{-18}$, $P=\hc{-2}21$. $CA=\rc20{-4}$, $C'A'=\rc6{-2}{-24}$, $Q=\hc2{-6}1$. $AB=\rc{-2}{-2}4$, $A'B'=\rc{-3}{-4}{12}$, $R=\hc{-4}61$. Controle: $-4+2+2=0$, $4-6+2=0$, $-8+6+2=0$.
    - opgave: |-
        Neem nu $C'(4, 4)$. Wat gebeurt er met $Q$? Toon aan dat de rechte $PR$ evenwijdig is met $CA$.
      antwoord: |-
        $Q=\hc010$; $PR: x=-4$
      uitwerking: |-
        $CA: x=2$ en $C'A': x=4$ zijn evenwijdig: $Q$ ligt op oneindig. $B'C': y=3+\tfrac x4$ snijdt $BC: y=2$ in $P(-4, 2)$, en $R(-4, 6)$ verandert niet. $PR$ is verticaal, net als $CA$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    perspectief van een spoorweg
  opgave: |-
    Je staat tussen de rails van een rechte spoorweg, met je oog op 1,6 m boven de grond. De rails liggen op 0,75 m links en rechts van je, en je houdt een glasplaat recht voor je, op 0,5 m van je oog. Neem je oog als oorsprong. Een punt $(X, Y, Z)$ zie je op het glas in $\bigl(0{,}5\,\tfrac XZ;\ 0{,}5\,\tfrac YZ\bigr)$, in meter.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar op het glas lopen de rails samen?
      antwoord: |-
        in $(0, 0)$, recht voor je oog
      uitwerking: |-
        Richting $(0, 0, 1)$: het verdwijnpunt is $(0, 0)$.
    - opgave: |-
        De dwarsliggers liggen op $Z = 3$, $3{,}6$ en $4{,}2$ m. Op welke hoogte zie je ze op het glas?
      antwoord: |-
        $-26{,}7$, $-22{,}2$ en $-19{,}0$ cm
      uitwerking: |-
        $0{,}5\cdot\tfrac{-1{,}6}{Z}=-\tfrac{0{,}8}{Z}$: $-0{,}267$, $-0{,}222$ en $-0{,}190$ m.
    - opgave: |-
        De dwarsliggers liggen op de grond even ver uit elkaar. Op het glas ook?
      antwoord: |-
        nee: 4,4 cm en 3,2 cm
      uitwerking: |-
        $26{,}7-22{,}2\approx4{,}4$ en $22{,}2-19{,}0\approx3{,}2$ cm: verder weg komen ze dichter bij elkaar. Een projectieve transformatie bewaart geen deelverhoudingen.
    - opgave: |-
        Hoe breed zie je de dwarsligger op $Z = 3$, tussen de rails?
      antwoord: |-
        25 cm
      uitwerking: |-
        Van $X=-0{,}75$ tot $0{,}75$: $0{,}5\cdot\tfrac{1{,}5}{3}=0{,}25$ m.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    rechten door een punt op oneindig
  opgave: |-
    Neem het punt op oneindig $P = \hc210$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef een vergelijking van alle rechten door $P$.
      antwoord: |-
        $x-2y+cz=0$, en $z=0$
      uitwerking: |-
        $\rc abc$ gaat door $P$ als $2a+b=0$, dus $\rc{a}{-2a}{c}$. Met $a=1$: de evenwijdige rechten $x-2y+c=0$ met richting $(2, 1)$. Met $a=0$: de rechte op oneindig.
    - opgave: |-
        Welke van die rechten gaat door $(4, 5)$?
      antwoord: |-
        $x-2y+6=0$
      uitwerking: |-
        $4-10+c=0$.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    Pappus narekenen
  figuur:
    opties: |-
      3.8cm
    code: |-
      \begin{tikzpicture}[scale=.45,font=\scriptsize]
        \rooster{-1}{1}{5}{-1}{1}{5}
        \punt[below]{1}{0}{A}
        \punt[below]{2}{0}{B}
        \punt[below]{4}{0}{C}
        \punt[left]{0}{4}{A'}
        \punt[left]{0}{1}{B'}
        \punt[left]{0}{2}{C'}
      \end{tikzpicture}
  opgave: |-
    Neem $A(1, 0)$, $B(2, 0)$, $C(4, 0)$ en $A'(0, 4)$, $B'(0, 1)$, $C'(0, 2)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $X = AB' \cap A'B$, $Y = AC' \cap A'C$ en $Z = BC' \cap B'C$.
      antwoord: |-
        $X(3, -2)$, $Y(-2, 6)$, $Z\bigl(\tfrac43,\tfrac23\bigr)$
      uitwerking: |-
        $AB'=\rc{-1}{-1}1$, $A'B=\rc42{-8}$; $AC'=\rc{-2}{-1}2$, $A'C=\rc44{-16}$; $BC'=\rc{-2}{-2}4$, $B'C=\rc14{-4}$. Neem telkens het vectorproduct.
    - opgave: |-
        Geef de rechte van Pappus, en controleer dat de drie punten erop liggen.
      antwoord: |-
        $8x+5y=14$
      uitwerking: |-
        $X\times Z$ geeft $\rc85{-14}$. Controle: $24-10=14$, $-16+30=14$, $\tfrac{32}3+\tfrac{10}3=14$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    een driehoek met een hoekpunt op oneindig
  opgave: |-
    Neem de rechten $x = 0$, $x = 2$ en $y = x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de drie snijpunten, twee aan twee, in homogene coördinaten.
      antwoord: |-
        $\hc010$, $\hc001$, $\hc221$
      uitwerking: |-
        $\rc100\times\rc10{-2}=(0, 2, 0)$, $\rc100\times\rc1{-1}0=(0, 0, -1)$, $\rc10{-2}\times\rc1{-1}0=(-2, -2, -1)$.
    - opgave: |-
        Toon met een determinant aan dat de drie rechten niet door één punt gaan.
      antwoord: |-
        de determinant is $-2$
      uitwerking: |-
        $\begin{vmatrix} 1 & 0 & 0 \\ 1 & 0 & -2 \\ 1 & -1 & 0 \end{vmatrix}=1\cdot(0-2)=-2\neq0$.
    - opgave: |-
        Hoe ziet die driehoek eruit in het gewone vlak?
      antwoord: |-
        twee evenwijdige zijden die naar boven nooit samenkomen
      uitwerking: |-
        Twee hoekpunten zijn gewoon, $(0, 0)$ en $(2, 2)$. Het derde ligt op oneindig in de verticale richting: de zijden $x=0$ en $x=2$ zijn evenwijdige halfrechten.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    Ceva met een punt op oneindig
  opgave: |-
    Neem de standaarddriehoek $A(0, 0)$, $B(1, 0)$, $C(0, 1)$, en de drie evenwijdige rechten door $A$, $B$ en $C$ met richting $(1, 1)$. Ze snijden de overstaande zijden (of hun verlengden) in $P$, $Q$ en $R$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $P$, $Q$ en $R$.
      antwoord: |-
        $P\bigl(\tfrac12,\tfrac12\bigr)$, $Q(0, -1)$, $R(-1, 0)$
      uitwerking: |-
        $AP$: $(t, t)$ snijdt $x+y=1$ bij $t=\tfrac12$. $BQ$: $(1+t, t)$ snijdt $x=0$ bij $t=-1$. $CR$: $(t, 1+t)$ snijdt $y=0$ bij $t=-1$.
    - opgave: |-
        Bereken het product van Ceva.
      antwoord: |-
        $1\cdot(-2)\cdot\bigl(-\tfrac12\bigr)=1$
      uitwerking: |-
        $P$ is het midden: 1. $Q=\dfrac{C+qA}{1+q}=\bigl(0,\tfrac{1}{1+q}\bigr)=(0, -1)$ geeft $q=-2$. $R=\bigl(\tfrac{r}{1+r}, 0\bigr)=(-1, 0)$ geeft $r=-\tfrac12$.
    - opgave: |-
        Het product is 1, maar de rechten hebben geen gemeenschappelijk punt. Verklaar met het projectieve vlak.
      antwoord: |-
        ze gaan door $\hc110$
      uitwerking: |-
        In het projectieve vlak gaan evenwijdige rechten door hun punt op oneindig. Het \textit{of evenwijdig} in de stelling van Ceva is dus geen uitzondering: de drie rechten gaan door één punt, op oneindig.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    determinant met een parameter
  opgave: |-
    Voor welke $k$ liggen de punten $\hc1k1$, $\hc k11$ en $\hc11k$ op één rechte? Welke rechte is het in het interessante geval?
  antwoord: |-
    $k=1$ (drie keer hetzelfde punt) of $k=-2$: de rechte $x+y+z=0$
  uitwerking: |-
    $\begin{vmatrix} 1 & k & 1 \\ k & 1 & 1 \\ 1 & 1 & k \end{vmatrix}=(k-1)-k(k^2-1)+(k-1)=-(k-1)^2(k+2)$. Voor $k=1$ zijn de drie punten gelijk. Voor $k=-2$ is de som van de drie vectoren $(0, 0, 0)$, en elk punt ligt op $x+y+z=0$: in gewone coördinaten $(1, -2)$, $(-2, 1)$ en $\bigl(-\tfrac12, -\tfrac12\bigr)$ op $x+y+1=0$.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    perspectief bewaart geen middens
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=2.6,font=\scriptsize]
        \draw[thick] (-.15,0) -- (1.25,0) node[below left] {horizon};
        \fill[accent!20] (0,-1) -- (1,-1) -- (.5,-.5) -- (0,-.5) -- cycle;
        \draw[accent,thick] (0,-1) -- (1,-1) -- (.5,-.5) -- (0,-.5) -- cycle;
        \draw[grijs,dashed] (0,-.5) -- (0,0) (.5,-.5) -- (0,0);
        \fill (0,0) circle (.6pt);
      \end{tikzpicture}
  opgave: |-
    Het oog staat op hoogte 1 en het doek op afstand 1. Het vloerpunt $(X, Z)$ komt op het doek in $\bigl(\tfrac XZ, -\tfrac1Z\bigr)$. Een tegel heeft de hoekpunten $(0, 1)$, $(1, 1)$, $(1, 2)$ en $(0, 2)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de beelden van de hoekpunten. Welke vorm heeft het beeld?
      antwoord: |-
        $(0, -1)$, $(1, -1)$, $\bigl(\tfrac12, -\tfrac12\bigr)$, $\bigl(0, -\tfrac12\bigr)$: een trapezium
      uitwerking: |-
        De voor- en achterkant blijven horizontaal (evenwijdig met het doek). De zijkanten lopen naar $(0, 0)$.
    - opgave: |-
        Het midden van de rechterzijde is $(1; 1{,}5)$. Is zijn beeld het midden van het beeld van die zijde?
      antwoord: |-
        nee
      uitwerking: |-
        Het beeld is $\bigl(\tfrac23, -\tfrac23\bigr)$, het midden van $(1, -1)$ en $\bigl(\tfrac12, -\tfrac12\bigr)$ is $\bigl(\tfrac34, -\tfrac34\bigr)$.
    - opgave: |-
        Het middelpunt van de tegel is $(0{,}5;\ 1{,}5)$. Toon aan dat zijn beeld wel het snijpunt van de beelddiagonalen is. Waarom moet dat zo zijn?
      antwoord: |-
        $\bigl(\tfrac13, -\tfrac23\bigr)$; snijpunten blijven snijpunten
      uitwerking: |-
        De beelddiagonalen zijn $y=x-1$ en $y=-1+\tfrac12(1-x)$, die snijden in $\bigl(\tfrac13, -\tfrac23\bigr)$. Een projectieve transformatie beeldt rechten af op rechten, dus het snijpunt van twee rechten op het snijpunt van hun beelden.

- id: h2-o17
  soort: opdracht
  niveau: 3
  thema: |-
    omgekeerde van Desargues door dualiteit
  opgave: |-
    Een driehoek bestaat uit drie punten, maar ook uit drie rechten (zijn zijden).
  lijst: enumerate
  delen:
    - opgave: |-
        Formuleer de duale stelling van Desargues. Vertrek van twee driehoeken met zijden $a, b, c$ en $a', b', c'$.
      antwoord: |-
        Liggen $a\cap a'$, $b\cap b'$ en $c\cap c'$ op één rechte, dan gaan de verbindingsrechten van $b\cap c$ en $b'\cap c'$, van $c\cap a$ en $c'\cap a'$, en van $a\cap b$ en $a'\cap b'$ door één punt.
      uitwerking: |-
        Wissel overal punt en rechte, en snijpunt en verbindingsrechte.
    - opgave: |-
        Noem de hoekpunten $A = b \cap c$, $B = c \cap a$, $C = a \cap b$, en net zo $A'$, $B'$, $C'$. Toon aan dat de duale stelling de omgekeerde stelling van Desargues is.
      antwoord: |-
        Liggen $P$, $Q$ en $R$ op één rechte, dan gaan $AA'$, $BB'$ en $CC'$ door één punt.
      uitwerking: |-
        $a=BC$ en $a'=B'C'$, dus $a\cap a'=P$, en net zo $b\cap b'=Q$, $c\cap c'=R$. De verbindingsrechte van $b\cap c=A$ en $b'\cap c'=A'$ is $AA'$. De duale stelling zegt dus: liggen $P$, $Q$, $R$ op één rechte, dan gaan $AA'$, $BB'$ en $CC'$ door één punt. Door het dualiteitsprincipe is ze bewezen.

- id: h2-o18
  soort: opdracht
  niveau: 3
  thema: |-
    Desargues in de ruimte
  opgave: |-
    Twee driehoeken $ABC$ en $A'B'C'$ in de ruimte liggen in twee verschillende vlakken $\alpha$ en $\alpha'$ die elkaar snijden volgens een rechte $s$. De rechten $AA'$, $BB'$ en $CC'$ gaan door één punt $O$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $BC$ en $B'C'$ in één vlak liggen, en dus een snijpunt $P$ hebben (of evenwijdig zijn).
      antwoord: |-
        ze liggen in het vlak $OBC$
      uitwerking: |-
        $B'$ ligt op $OB$ en $C'$ op $OC$, dus $B'C'$ ligt in het vlak door $O$, $B$ en $C$, net als $BC$. Twee rechten in een vlak snijden elkaar of zijn evenwijdig.
    - opgave: |-
        Toon aan dat $P$, $Q$ en $R$ op $s$ liggen.
      antwoord: |-
        $P$ ligt in $\alpha$ en in $\alpha'$
      uitwerking: |-
        $P$ ligt op $BC$, dus in $\alpha$, en op $B'C'$, dus in $\alpha'$. Dus ligt $P$ op de snijlijn $s$. Net zo voor $Q$ en $R$: ze liggen op één rechte, zonder te rekenen.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    vectorproduct nul
  opgave: |-
    Neem twee vectoren $P$ en $Q$ verschillend van $(0, 0, 0)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: is $Q = kP$, dan is $P \times Q = (0, 0, 0)$.
      antwoord: |-
        elke component wordt $k(p_ip_j-p_jp_i)=0$
      uitwerking: |-
        Bijvoorbeeld de eerste component: $p_2\cdot kp_3-p_3\cdot kp_2=0$.
    - opgave: |-
        Toon omgekeerd aan: is $P \times Q = (0, 0, 0)$ en $p_1 \neq 0$, dan is $Q = \tfrac{q_1}{p_1}P$. Wat betekent dat voor de punten $P$ en $Q$?
      antwoord: |-
        $P$ en $Q$ zijn hetzelfde punt
      uitwerking: |-
        De derde component geeft $p_1q_2=p_2q_1$, dus $q_2=\tfrac{q_1}{p_1}p_2$. De tweede geeft $p_3q_1=p_1q_3$, dus $q_3=\tfrac{q_1}{p_1}p_3$. En $q_1=\tfrac{q_1}{p_1}p_1$. Omdat $Q\neq(0, 0, 0)$ is $q_1\neq0$: $P$ en $Q$ zijn homogene coördinaten van hetzelfde punt.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    het afstandspunt van Alberti
  opgave: |-
    Het oog staat op hoogte $h$ boven de vloer en het doek op afstand $d$. Het vloerpunt $(X, Z)$ komt op het doek in $\bigl(\tfrac{dX}{Z}, -\tfrac{dh}{Z}\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat alle rechten van de vloer met richting $(a, c)$, met $c > 0$, verdwijnen in $\bigl(\tfrac{da}{c}, 0\bigr)$.
      antwoord: |-
        $\hc ac0\mapsto\hc{da}{0}{c}$
      uitwerking: |-
        Homogeen is de afbeelding $\hc XZW\mapsto\hc{dX}{-dhW}{Z}$. Het punt op oneindig $\hc ac0$ gaat naar $\hc{da}0c$, dus $\bigl(\tfrac{da}{c}, 0\bigr)$.
    - opgave: |-
        Waar verdwijnen de diagonalen van de tegels? Hoe kan een schilder zo de afstand $d$ van zijn oog tot het doek op het doek aflezen?
      antwoord: |-
        in $(\pm d, 0)$
      uitwerking: |-
        De richtingen $(1, 1)$ en $(-1, 1)$ geven $(\pm d, 0)$: de afstand van het afstandspunt tot $V$ is precies $d$, onafhankelijk van $h$.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    het midden vinden met alleen een lat
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[scale=.9,font=\scriptsize]
        \draw[thick] (0,0) -- (3,0) -- (2,1.4) -- (.8,1.4) -- cycle;
        \draw[grijs] (0,0) -- (1.333,2.333) (3,0) -- (1.333,2.333);
        \draw[grijs] (0,0) -- (2,1.4) (3,0) -- (.8,1.4);
        \draw[accent,thick] (1.521,-.3) -- (1.314,2.6);
        \punt[below left]{0}{0}{A}
        \punt[below right]{3}{0}{B}
        \punt[right]{2}{1.4}{C}
        \punt[left]{.8}{1.4}{D}
        \punt[left]{1.333}{2.333}{S}
        \punt[right]{1.429}{1}{T}
      \end{tikzpicture}
  opgave: |-
    In een trapezium $ABCD$ is $AB \parallel CD$. De opstaande zijden $AD$ en $BC$ snijden elkaar in $S$, de diagonalen $AC$ en $BD$ in $T$.
  lijst: enumerate
  delen:
    - opgave: |-
        Neem $A(0, 0)$, $B(2a, 0)$, $D(p, 1)$ en $C(q, 1)$ in een affien assenstelsel. Toon aan dat $S$, $T$ en het midden $M(a, 0)$ van $[AB]$ op één rechte liggen.
      antwoord: |-
        de determinant van $S$, $T$, $M$ is 0
      uitwerking: |-
        Met het vectorproduct: $AD=\rc{1}{-p}{0}$, $BC=\rc{1}{2a-q}{-2a}$, $S=\hc{2ap}{2a}{2a-q+p}$. $AC=\rc1{-q}0$, $BD=\rc{1}{2a-p}{-2a}$, $T=\hc{2aq}{2a}{2a-p+q}$. Ontwikkel $\begin{vmatrix} 2ap & 2a & 2a-q+p \\ 2aq & 2a & 2a-p+q \\ a & 0 & 1 \end{vmatrix}$: na uitwerken is ze 0. (Reken na, of vereenvoudig eerst door de eerste twee rijen door $2a$ te delen.)
    - opgave: |-
        Toon net zo aan dat ook het midden $N$ van $[CD]$ op die rechte ligt.
      antwoord: |-
        de determinant van $S$, $T$, $N$ is 0
      uitwerking: |-
        $N=\hc{p+q}{2}{2}$. De determinant met de rijen $S$, $T$ en $N$ is na uitwerken 0.
    - opgave: |-
        Hoe vind je zo het midden van een lijnstuk $[AB]$ met alleen een lat, als je een rechte evenwijdig met $AB$ gegeven krijgt?
      antwoord: |-
        teken een trapezium en snijd $ST$ met $AB$
      uitwerking: |-
        Kies $C$ en $D$ op de evenwijdige rechte, teken $AD$, $BC$, $AC$ en $BD$, en dan $S$ en $T$. De rechte $ST$ snijdt $[AB]$ in zijn midden.

# --- Koppel ---------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Ruimtemeetkunde
  opgave: |-
    In het model van de schilder is een punt $\hc xyz$ een rechte door $O$ in de ruimte, en een rechte $\rc abc$ het vlak $ax + by + cz = 0$ door $O$.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke normaalvector heeft het vlak van de rechte $\rc abc$? Toon aan dat $l \times m$ loodrecht staat op $l$ en $m$. Wat betekent dat voor de snijlijn van twee vlakken door $O$?
      antwoord: |-
        $(a, b, c)$; $l\times m$ is de richting van de snijlijn
      uitwerking: |-
        $l\cdot(l\times m)=0$ en $m\cdot(l\times m)=0$ (twee gelijke rijen in de determinant). Een vector die loodrecht staat op beide normaalvectoren, ligt in beide vlakken: hij is een richtingsvector van de snijlijn, en die snijlijn is het snijpunt van de twee rechten.
    - opgave: |-
        Het vlak $2x - y + 3z = 0$ snijdt het doek $z = 1$ volgens een rechte. Welke?
      antwoord: |-
        $2x-y+3=0$
      uitwerking: |-
        Stel $z=1$: dat is de gewone vergelijking van de rechte $\rc2{-1}3$.

- id: h2-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Getaltheorie
  opgave: |-
    Neem homogene coördinaten modulo 2: elke coördinaat is 0 of 1, niet alle drie 0, en je rekent modulo 2. Zo krijg je een projectief vlak met eindig veel punten, het \textit{vlak van Fano}.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel punten heeft dat vlak? (Modulo 2 is de enige factor $k \neq 0$ het getal 1.)
      antwoord: |-
        7
      uitwerking: |-
        $2^3-1=7$ drietallen van nullen en enen zonder $(0, 0, 0)$, en geen twee zijn veelvouden van elkaar.
    - opgave: |-
        Welke punten liggen op de rechte $x + y + z = 0$ (modulo 2)?
      antwoord: |-
        $\hc110$, $\hc101$, $\hc011$
      uitwerking: |-
        Een even aantal enen.
    - opgave: |-
        Hoeveel punten liggen op elke rechte, en hoeveel rechten zijn er?
      antwoord: |-
        3 punten; 7 rechten
      uitwerking: |-
        Een rechte $\rc abc$ heeft ook coördinaten 0 of 1: 7 rechten. Op elke rechte liggen 3 punten, zoals bij $x+y+z=0$. Door elk punt gaan ook 3 rechten: dualiteit.

- id: h2-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Groepen
  opgave: |-
    De projectieve transformaties $X \mapsto AX$ met $\det A \neq 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $A$ en $2A$ dezelfde projectieve transformatie geven.
      antwoord: |-
        $2AX$ en $AX$ zijn hetzelfde punt
      uitwerking: |-
        Homogene coördinaten mogen met een factor $k\neq0$ vermenigvuldigd worden.
    - opgave: |-
        Vormen de projectieve transformaties een groep voor de samenstelling?
      antwoord: |-
        ja
      uitwerking: |-
        $X\mapsto B(AX)=(BA)X$ met $\det(BA)\neq0$; de identiteit is $I$; de inverse is $A^{-1}$; de samenstelling is associatief.
    - opgave: |-
        Toon aan dat de matrices met onderste rij $(0, 0, 1)$ een deelgroep vormen. Welke transformaties zijn dat?
      antwoord: |-
        de affiene transformaties
      uitwerking: |-
        Het product van twee zulke matrices heeft weer onderste rij $(0, 0, 1)\cdot B=(0, 0, 1)$, en de inverse ook. Het zijn de affiene transformaties uit hoofdstuk 1.

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Welk punt is $\hc6{-2}2$? En $\hc310$? Geef homogene coördinaten van $(-2, 3)$.
  antwoord: |-
    $(3, -1)$; op oneindig met richting $(3, 1)$; $\hc{-2}31$
  uitwerking: |-
    Deel door 2. De derde coördinaat 0 geeft een punt op oneindig. Een 1 achteraan.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Geef de homogene vergelijking van $y = -x + 4$ en haar punt op oneindig.
  antwoord: |-
    $x+y-4z=0$; $\hc1{-1}0$
  uitwerking: |-
    Richting $(1, -1)$.

- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    Bepaal het snijpunt van $2x - y + 1 = 0$ en $4x - 2y + 3 = 0$ in het projectieve vlak.
  antwoord: |-
    $\hc120$
  uitwerking: |-
    $\rc2{-1}1\times\rc4{-2}3=(-3+2,\,4-6,\,-4+4)=(-1, -2, 0)$.

- id: h2-t4
  soort: test
  niveau: 1
  opgave: |-
    Bepaal een vergelijking van de rechte door $(1, 3)$ en het punt op oneindig $\hc210$.
  antwoord: |-
    $x-2y+5=0$
  uitwerking: |-
    $\hc131\times\hc210=(0-1,\,2-0,\,1-6)=(-1, 2, -5)$.

- id: h2-t5
  soort: test
  niveau: 1
  opgave: |-
    Liggen $\hc101$, $\hc011$ en $\hc112$ op één rechte?
  antwoord: |-
    ja
  uitwerking: |-
    $1(2-1)-0+1(0-1)=0$. Ook: $(1, 1, 2)=(1, 0, 1)+(0, 1, 1)$.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Het oog staat in $O$ en het doek in het vlak $z = 1$. Waar liggen de verdwijnpunten van de rechten met richting $(2, 0, 5)$ en van die met richting $(1, 1, 2)$? Welk ligt op de horizon?
  antwoord: |-
    $\bigl(\tfrac25, 0\bigr)$ en $\bigl(\tfrac12,\tfrac12\bigr)$; het eerste
  uitwerking: |-
    $\bigl(\tfrac ac,\tfrac bc\bigr)$. Het eerste heeft $b=0$.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Neem de projectieve transformatie met matrix $A = \um{ccc}{1 & 0 & 0 \\ 0 & 1 & 0 \\ 0 & 1 & 1}$. Welke rechte gaat naar oneindig? Wat is het beeld van $(2, 1)$?
  antwoord: |-
    $y=-1$; $\bigl(1,\tfrac12\bigr)$
  uitwerking: |-
    De derde coördinaat van het beeld is $y+z$: 0 op $y+z=0$. $A\hc211=\hc212$.
