# Oefeningen van hoofdstuk 3. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of bepaal.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de soort kegelsnede $4x^2 + 9y^2 = 36$
      antwoord: |-
        een ellips
      uitwerking: |-
        $\tfrac{x^2}{9}+\tfrac{y^2}{4}=1$.
    - opgave: |-
        de asymptoten van $x^2 - \tfrac{y^2}{4} = 1$
      antwoord: |-
        $y=\pm2x$
      uitwerking: |-
        $y=\pm\tfrac ba x$ met $a=1$, $b=2$.
    - opgave: |-
        $\begin{vmatrix} 1 & 2 & 0 \\ 2 & 1 & 0 \\ 0 & 0 & 3 \end{vmatrix}$
      antwoord: |-
        $-9$
      uitwerking: |-
        Ontwikkel naar de derde rij: $3(1-4)=-9$.
    - opgave: |-
        $X\tr MX$ voor $M = \um{cc}{1 & 2 \\ 2 & 3}$ en $X = \kol{x \\ y}$
      antwoord: |-
        $x^2+4xy+3y^2$
      uitwerking: |-
        $x^2+2xy+2xy+3y^2$.
    - opgave: |-
        $x^2 - 4y^2$ ontbinden
      antwoord: |-
        $(x-2y)(x+2y)$
      uitwerking: |-
        Een verschil van twee kwadraten.
    - opgave: |-
        de verhouding $x : y$ uit $x^2 - 3xy + 2y^2 = 0$
      antwoord: |-
        $x=y$ of $x=2y$
      uitwerking: |-
        $(x-y)(x-2y)=0$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem de parabool $y = x^2$, de cirkel $x^2 + y^2 = 1$ en de hyperbool $xy = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Vervang in elke vergelijking $x$ door $\tfrac xz$ en $y$ door $\tfrac yz$, en maak de noemers weg.
      antwoord: |-
        $yz=x^2$, $x^2+y^2=z^2$, $xy=z^2$
      uitwerking: |-
        Vermenigvuldig met $z$ of $z^2$.
    - opgave: |-
        Zoek telkens de punten op oneindig: stel $z = 0$.
      antwoord: |-
        $\hc010$; geen; $\hc100$ en $\hc010$
      uitwerking: |-
        $x^2=0$ geeft één punt. $x^2+y^2=0$ heeft geen reële oplossing behalve $(0, 0, 0)$, en dat is geen punt. $xy=0$ geeft twee punten.
    - opgave: |-
        Vergelijk met de grafieken. In welke richtingen gaan ze naar oneindig?
      antwoord: |-
        parabool: verticaal; cirkel: niet; hyperbool: langs de assen
      uitwerking: |-
        De parabool stijgt aan beide kanten, de cirkel is begrensd, en de hyperbool nadert de assen, haar asymptoten.
    - opgave: |-
        Welk vermoeden heb je over ellipsen, parabolen en hyperbolen?
      antwoord: |-
        0, 1 en 2 punten op oneindig
      uitwerking: |-
        Een ellips heeft er geen, een parabool één en een hyperbool twee: de richtingen van de asymptoten.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h3-homogeen
  soort: kort
  opgave: |-
    Maak homogeen en zoek de punten op oneindig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^2 - 4y^2 = 4$
      antwoord: |-
        $x^2-4y^2=4z^2$; $\hc210$, $\hc2{-1}0$
      uitwerking: |-
        $z=0$: $(x-2y)(x+2y)=0$.
    - opgave: |-
        $x = y^2 + 3y$
      antwoord: |-
        $xz=y^2+3yz$; $\hc100$
      uitwerking: |-
        $z=0$: $y^2=0$.
    - opgave: |-
        $x^2 + xy + y^2 = 1$
      antwoord: |-
        $x^2+xy+y^2=z^2$; geen
      uitwerking: |-
        $z=0$: $x^2+xy+y^2=0$ met discriminant $1-4<0$.
    - opgave: |-
        $xy + x - 1 = 0$
      antwoord: |-
        $xy+xz-z^2=0$; $\hc100$, $\hc010$
      uitwerking: |-
        $z=0$: $xy=0$.

- id: h3-matrix
  soort: kort
  opgave: |-
    Geef de symmetrische matrix, of de vergelijking.
  lijst: enumerate
  delen:
    - opgave: |-
        $3x^2 - 2xy + 5x - y + 4 = 0$
      antwoord: |-
        $\um{rrr}{3 & -1 & \tfrac52 \\ -1 & 0 & -\tfrac12 \\ \tfrac52 & -\tfrac12 & 4}$
      uitwerking: |-
        Homogeen: $3x^2-2xy+5xz-yz+4z^2$. De halve gemengde coëfficiënten naast de diagonaal.
    - opgave: |-
        $M = \um{rrr}{1 & 0 & -2 \\ 0 & 2 & 3 \\ -2 & 3 & 0}$
      antwoord: |-
        $x^2+2y^2-4x+6y=0$
      uitwerking: |-
        $x^2+2y^2+2\cdot(-2)xz+2\cdot3yz$, met $z=1$.

- id: h3-transf
  soort: kort
  opgave: |-
    Neem de projectieve transformatie $\hc xyz \mapsto \hc zyx$. Haar matrix $A$ is de eenheidsmatrix met de eerste en de derde rij gewisseld.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal het beeld van de cirkel $x^2 + y^2 = 1$ met de formule $M' = (A^{-1})\tr MA^{-1}$.
      antwoord: |-
        $x^2-y^2=1$
      uitwerking: |-
        $A^{-1}=A$ en $A\tr=A$. $M'=A\um{rrr}{1 & 0 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & -1}A=\um{rrr}{-1 & 0 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 1}$: $-x^2+y^2+z^2=0$.
    - opgave: |-
        Welke punten van de cirkel gaan naar oneindig? Wat worden ze?
      antwoord: |-
        $(0, \pm1)$; $\hc1{\pm1}0$
      uitwerking: |-
        Het beeld heeft derde coördinaat $x$: de punten met $x=0$. $\hc0{\pm1}1\mapsto\hc1{\pm1}0$: de richtingen van de asymptoten $y=\pm x$.

- id: h3-ontaard
  soort: kort
  opgave: |-
    Is de kegelsnede ontaard? Zo ja, bepaal de top en de twee rechten.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 - 4y^2 - 2x + 1 = 0$
      antwoord: |-
        ja: top $(1, 0)$, $x-1=\pm2y$
      uitwerking: |-
        $\det\um{rrr}{1 & 0 & -1 \\ 0 & -4 & 0 \\ -1 & 0 & 1}=-4(1-1)=0$. $M\hc101=0$. $(x-1)^2-4y^2=0$.
    - opgave: |-
        $x^2 + y^2 - 2x + 2 = 0$
      antwoord: |-
        nee, maar ze heeft geen reële punten
      uitwerking: |-
        $\det\um{rrr}{1 & 0 & -1 \\ 0 & 1 & 0 \\ -1 & 0 & 2}=1\cdot2-1=1\neq0$. En $(x-1)^2+y^2=-1$ heeft geen oplossing.
    - opgave: |-
        $4x^2 - 4xy + y^2 - 9 = 0$
      antwoord: |-
        ja: top $\hc120$, $2x-y=\pm3$
      uitwerking: |-
        $\det M=-9\,(4-4)=0$, $M\hc120=0$. $(2x-y)^2=9$: twee evenwijdige rechten.

- id: h3-type
  soort: kort
  opgave: |-
    Bepaal de soort. Ga eerst na dat de kegelsnede niet ontaard is.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + xy - 6y^2 + 2x - 1 = 0$
      antwoord: |-
        hyperbool
      uitwerking: |-
        $\det M=\tfrac{49}{4}\neq0$. $z=0$: $(x+3y)(x-2y)=0$, twee punten $\hc3{-1}0$ en $\hc210$.
    - opgave: |-
        $9x^2 - 6xy + y^2 + 2x = 0$
      antwoord: |-
        parabool
      uitwerking: |-
        $\det M=-1\neq0$. $z=0$: $(3x-y)^2=0$, één punt $\hc130$: de richting van de as.
    - opgave: |-
        $x^2 + xy + y^2 - 3 = 0$
      antwoord: |-
        ellips
      uitwerking: |-
        $\det M=-3\bigl(1-\tfrac14\bigr)=-\tfrac94\neq0$. $B^2-4AC=1-4<0$, en $(1, 1)$ ligt erop.

- id: h3-raak
  soort: kort
  opgave: |-
    Gebruik de raaklijn $(MP) \cdot X = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de raaklijn aan $x^2 + 2y^2 = 3$ in $(1, 1)$.
      antwoord: |-
        $x+2y=3$
      uitwerking: |-
        $M\hc111=(1, 2, -3)$.
    - opgave: |-
        Bepaal de asymptoten van $x^2 - 4y^2 + 2x - 3 = 0$.
      antwoord: |-
        $x-2y+1=0$ en $x+2y+1=0$
      uitwerking: |-
        $\det M=16\neq0$. Op oneindig: $\hc210$ en $\hc2{-1}0$. $M=\um{rrr}{1 & 0 & 1 \\ 0 & -4 & 0 \\ 1 & 0 & -3}$, dus $M\hc210=(2, -4, 2)$ en $M\hc2{-1}0=(2, 4, 2)$. Controle: $(x+1)^2-4y^2=4$.

- id: h3-gelijk
  soort: kort
  opgave: |-
    Neem $\hc xyz \mapsto \hc{x}{z + y}{z - y}$, die de cirkel $x^2 + y^2 = 1$ afbeeldt op de parabool $y = x^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is het beeld van $(0, -1)$ en van $(1, 0)$?
      antwoord: |-
        $(0, 0)$ en $(1, 1)$
      uitwerking: |-
        $\hc0{-1}1\mapsto\hc002$ en $\hc101\mapsto\hc111$. Beide liggen op $y=x^2$.
    - opgave: |-
        Waar komt de raaklijn $y = -1$ aan de cirkel terecht?
      antwoord: |-
        bij $y=0$, de raaklijn in de top
      uitwerking: |-
        $\hc x{-1}1\mapsto\hc x02$: de $x$-as, de raaklijn aan $y=x^2$ in $(0, 0)$.

- id: h3-terug
  soort: kort
  opgave: |-
    Een cirkel op de vloer heeft straal 4 en middelpunt op 6 m recht voor de tekenaar. Het oog staat op hoogte 1 en het glas op afstand 1.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de vergelijking van het beeld op het glas. Welke soort is het?
      antwoord: |-
        $x^2+20y^2+12y+1=0$; een ellips
      uitwerking: |-
        Met $c=6$, $r=4$: $x^2+(36-16)y^2+12y+1=0$. Op oneindig: $x^2+20y^2=0$, geen punten.
    - opgave: |-
        Hoe dicht moet de tekenaar komen opdat het beeld een parabool wordt?
      antwoord: |-
        tot het middelpunt op 4 m staat
      uitwerking: |-
        $c=r=4$: dan raakt de cirkel de rechte onder het oog, evenwijdig met het glas.

# --- Opdrachten ------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    homogeen maken en terug
  opgave: |-
    Maak homogeen, of geef de gewone vergelijking.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y = 3x^2$
      antwoord: |-
        $yz=3x^2$
      uitwerking: |-
        $y$ krijgt een $z$.
    - opgave: |-
        $\tfrac{x^2}{4} + y^2 = 1$
      antwoord: |-
        $x^2+4y^2=4z^2$
      uitwerking: |-
        Maal 4, en $1\to z^2$.
    - opgave: |-
        $xy = 6$
      antwoord: |-
        $xy=6z^2$
      uitwerking: |-
        $6\to6z^2$.
    - opgave: |-
        $x^2 - y^2 + 2x = 0$
      antwoord: |-
        $x^2-y^2+2xz=0$
      uitwerking: |-
        $2x\to2xz$.
    - opgave: |-
        $x^2 + yz = 0$
      antwoord: |-
        $y=-x^2$
      uitwerking: |-
        Stel $z=1$.
    - opgave: |-
        $x^2 + y^2 - 2xz = 0$
      antwoord: |-
        $(x-1)^2+y^2=1$
      uitwerking: |-
        $x^2-2x+y^2=0$: een cirkel met middelpunt $(1, 0)$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    soort uit de punten op oneindig
  opgave: |-
    De kegelsneden zijn niet ontaard. Bepaal de punten op oneindig en de soort.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + 4xy + 3y^2 - 2y = 0$
      antwoord: |-
        $\hc1{-1}0$, $\hc3{-1}0$: hyperbool
      uitwerking: |-
        $(x+y)(x+3y)=0$.
    - opgave: |-
        $x^2 + 2xy + y^2 - 4y = 0$
      antwoord: |-
        $\hc1{-1}0$: parabool
      uitwerking: |-
        $(x+y)^2=0$.
    - opgave: |-
        $5x^2 + 2xy + y^2 - 4 = 0$
      antwoord: |-
        geen: ellips
      uitwerking: |-
        $B^2-4AC=4-20<0$, en $(0, 2)$ ligt erop.
    - opgave: |-
        $xy + 2x - 3y = 0$
      antwoord: |-
        $\hc100$, $\hc010$: hyperbool
      uitwerking: |-
        $xy=0$. De asymptoten zijn evenwijdig met de assen.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    matrix van een kegelsnede
  opgave: |-
    Geef de matrix, of de vergelijking.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + 2xy - y^2 + 4x - 6 = 0$
      antwoord: |-
        $\um{rrr}{1 & 1 & 2 \\ 1 & -1 & 0 \\ 2 & 0 & -6}$
      uitwerking: |-
        Halve coëfficiënten naast de diagonaal.
    - opgave: |-
        $3xy - z^2 = 0$
      antwoord: |-
        $\um{ccc}{0 & \tfrac32 & 0 \\ \tfrac32 & 0 & 0 \\ 0 & 0 & -1}$
      uitwerking: |-
        Alleen een term in $xy$ en in $z^2$.
    - opgave: |-
        $M = \um{rrr}{2 & 1 & 0 \\ 1 & 0 & -1 \\ 0 & -1 & 3}$
      antwoord: |-
        $2x^2+2xy-2y+3=0$
      uitwerking: |-
        $2x^2+2xy-2yz+3z^2=0$, met $z=1$.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    ontaard of niet
  opgave: |-
    Is de kegelsnede ontaard? Zo ja, geef de top en de rechten.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^2 + xy - 2y^2 - x + 4y - 2 = 0$
      antwoord: |-
        ja: $x-y+1=0$ en $x+2y-2=0$, top $(0, 1)$
      uitwerking: |-
        $\det M=0$. $M\hc011=0$ geeft de top $(0, 1)$. Twee rechten door $(0, 1)$ met de richtingen uit $x^2+xy-2y^2=(x-y)(x+2y)$: $(x-y+1)(x+2y-2)=0$. Reken na door uit te werken.
    - opgave: |-
        $x^2 - 9y^2 + 6y - 1 = 0$
      antwoord: |-
        ja: $x=\pm(3y-1)$, top $\bigl(0, \tfrac13\bigr)$
      uitwerking: |-
        $\det\um{rrr}{1 & 0 & 0 \\ 0 & -9 & 3 \\ 0 & 3 & -1}=9-9=0$, en $x^2-(3y-1)^2=0$.
    - opgave: |-
        $x^2 + 2xy + 3y^2 - 1 = 0$
      antwoord: |-
        nee: een ellips
      uitwerking: |-
        $\det\um{rrr}{1 & 1 & 0 \\ 1 & 3 & 0 \\ 0 & 0 & -1}=-(3-1)=-2\neq0$, en $B^2-4AC=4-12<0$.
    - opgave: |-
        $y^2 - 2yz = 0$
      antwoord: |-
        ja: $y=0$ en $y=2$, top $\hc100$
      uitwerking: |-
        $y(y-2z)=0$: twee evenwijdige rechten, met top op oneindig.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    raaklijn met MP
  opgave: |-
    Bepaal de raaklijn.
  lijst: enumerate
  delen:
    - opgave: |-
        aan $x^2 + y^2 = 25$ in $(3, 4)$
      antwoord: |-
        $3x+4y=25$
      uitwerking: |-
        $M\hc341=(3, 4, -25)$.
    - opgave: |-
        aan de parabool $yz = x^2$ in $(2, 4)$
      antwoord: |-
        $y=4x-4$
      uitwerking: |-
        $x^2-yz=0$ heeft $M=\um{ccc}{1 & 0 & 0 \\ 0 & 0 & -\tfrac12 \\ 0 & -\tfrac12 & 0}$, en $M\hc241=\bigl(2, -\tfrac12, -2\bigr)\sim(4, -1, -4)$. Met de afgeleide: richtingscoëfficiënt $2\cdot2=4$.
    - opgave: |-
        aan dezelfde parabool in haar punt op oneindig
      antwoord: |-
        $z=0$
      uitwerking: |-
        $M\hc010=\bigl(0, 0, -\tfrac12\bigr)$: de rechte op oneindig.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    asymptoten
  opgave: |-
    Bepaal de asymptoten.
  lijst: enumerate
  delen:
    - opgave: |-
        $xy - 2x + y = 0$
      antwoord: |-
        $y=2$ en $x=-1$
      uitwerking: |-
        $M=\um{ccc}{0 & \tfrac12 & -1 \\ \tfrac12 & 0 & \tfrac12 \\ -1 & \tfrac12 & 0}$, $\det M=-\tfrac12$. $M\hc100=\bigl(0, \tfrac12, -1\bigr)$ en $M\hc010=\bigl(\tfrac12, 0, \tfrac12\bigr)$. Controle: $y=\tfrac{2x}{x+1}$.
    - opgave: |-
        $x^2 - y^2 + 2x + 4y - 7 = 0$
      antwoord: |-
        $x-y+3=0$ en $x+y-1=0$
      uitwerking: |-
        $M=\um{rrr}{1 & 0 & 1 \\ 0 & -1 & 2 \\ 1 & 2 & -7}$, $\det M=4$. Op oneindig: $\hc110$ en $\hc1{-1}0$. $M\hc110=(1, -1, 3)$ en $M\hc1{-1}0=(1, 1, -1)$. Controle: $(x+1)^2-(y-2)^2=4$.

- id: h3-o7
  soort: opdracht
  niveau: 2
  thema: |-
    een parameter
  opgave: |-
    Neem de kegelsnede $x^2 + kxy + y^2 = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $k$ is ze ontaard? Wat is ze dan?
      antwoord: |-
        $k=\pm2$: twee evenwijdige rechten
      uitwerking: |-
        $\det M=-\bigl(1-\tfrac{k^2}{4}\bigr)=0$. Voor $k=2$: $(x+y)^2=1$, dus $x+y=\pm1$. Voor $k=-2$: $x-y=\pm1$.
    - opgave: |-
        Voor welke $k$ is ze een ellips, en voor welke een hyperbool?
      antwoord: |-
        ellips voor $|k|<2$, hyperbool voor $|k|>2$
      uitwerking: |-
        $B^2-4AC=k^2-4$. Ze heeft altijd reële punten, zoals $(1, 0)$.
    - opgave: |-
        Voor welke $k$ is ze een parabool? Verklaar.
      antwoord: |-
        voor geen enkele
      uitwerking: |-
        Een parabool vraagt $k^2=4$, maar dan is de kegelsnede ontaard: de \textit{parabool} valt uiteen in twee evenwijdige rechten.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    de cirkel wordt een parabool
  opgave: |-
    Neem de transformatie met matrix $A = \um{rrr}{1 & 0 & 0 \\ 0 & 1 & 1 \\ 0 & -1 & 1}$, dus $\hc xyz \mapsto \hc{x}{y + z}{z - y}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\det A$ en het beeld van de cirkel $x^2 + y^2 = z^2$ met $M' = (A^{-1})\tr MA^{-1}$.
      antwoord: |-
        $\det A=2$; $x^2-yz=0$
      uitwerking: |-
        $A^{-1}=\tfrac12\um{rrr}{2 & 0 & 0 \\ 0 & 1 & -1 \\ 0 & 1 & 1}$, en $M'=\um{ccc}{1 & 0 & 0 \\ 0 & 0 & -\tfrac12 \\ 0 & -\tfrac12 & 0}$.
    - opgave: |-
        Welke rechte gaat naar de rechte op oneindig? Wat is haar ligging tegenover de cirkel?
      antwoord: |-
        $y=1$, een raaklijn
      uitwerking: |-
        De derde coördinaat van het beeld is $z-y$. De rechte $y=z$, of $y=1$, raakt de cirkel in $(0, 1)$.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    een rotonde op de dashcam
  opgave: |-
    Een dashcam hangt op 1,2 m hoogte en filmt recht vooruit. Een punt van de weg op $X$ m opzij en $Z$ m vooruit komt in het beeld op $\bigl(\tfrac XZ, -\tfrac{1{,}2}{Z}\bigr)$. Op de weg ligt een rotonde, een cirkel met straal 10 m en middelpunt 30 m vooruit.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het beeld de vergelijking $1{,}44x^2 + 800y^2 + 72y + 1{,}44 = 0$ heeft.
      antwoord: |-
        met $X=-\tfrac{1{,}2x}{y}$ en $Z=-\tfrac{1{,}2}{y}$
      uitwerking: |-
        Uit $y=-\tfrac{1{,}2}{Z}$ en $x=\tfrac XZ$. Vul in in $X^2+(Z-30)^2=100$ en vermenigvuldig met $y^2$: $1{,}44x^2+(1{,}2+30y)^2=100y^2$.
    - opgave: |-
        Welke soort kegelsnede is het beeld?
      antwoord: |-
        een ellips
      uitwerking: |-
        $\det M=1{,}44\,(800\cdot1{,}44-36^2)=-207{,}36\neq0$, en $1{,}44x^2+800y^2=0$ heeft geen oplossing: geen punten op oneindig.
    - opgave: |-
        De auto rijdt naar de rotonde toe. Bij welke afstand tot het middelpunt wordt het beeld een parabool?
      antwoord: |-
        bij 10 m
      uitwerking: |-
        Algemeen: $1{,}44x^2+(c^2-100)y^2+2{,}4cy+1{,}44=0$, met één punt op oneindig als $c^2=100$. Dan loopt de rotonde tot net onder de camera.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    snijpunten van een rechte en een kegelsnede
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \rooster{-3}{1}{3}{-3}{1}{3}
        \hyperbool{0}{0}{1}{1}{1.8}
        \begin{scope}\clip (-3.3,-3.3) rectangle (3.3,3.3);
        \draw[grijs] (-3.3,-3.3) -- (3.3,3.3) (-1.6,-3.2) -- (1.6,3.2) (-3.3,-2.3) -- (2.3,3.3);
        \end{scope}
      \end{tikzpicture}
  opgave: |-
    Neem de hyperbool $x^2 - y^2 = 1$, homogeen $x^2 - y^2 = z^2$. Bepaal in het projectieve vlak de snijpunten met de rechte:
  lijst: enumerate
  delen:
    - opgave: |-
        $y = x$, een asymptoot;
      antwoord: |-
        alleen $\hc110$, dubbel
      uitwerking: |-
        $x^2-x^2=z^2$ geeft $z^2=0$: een dubbele wortel. De asymptoot raakt in het punt op oneindig.
    - opgave: |-
        $y = 2x$;
      antwoord: |-
        geen
      uitwerking: |-
        $-3x^2=z^2$ geeft $x=z=0$ en dan $y=0$: geen punt.
    - opgave: |-
        $y = x + 1$, evenwijdig met een asymptoot.
      antwoord: |-
        $(-1, 0)$ en $\hc110$
      uitwerking: |-
        $x^2-(x+z)^2=z^2$ geeft $-2z(x+z)=0$. In het gewone vlak is er maar één snijpunt, het andere ligt op oneindig.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    as van een parabool
  opgave: |-
    Neem $x^2 + 4xy + 4y^2 + x = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het een parabool is.
      antwoord: |-
        $\det M=-1$, één punt op oneindig
      uitwerking: |-
        $M=\um{ccc}{1 & 2 & \tfrac12 \\ 2 & 4 & 0 \\ \tfrac12 & 0 & 0}$, $\det M=\tfrac12\bigl(0-4\cdot\tfrac12\bigr)=-1$. $z=0$: $(x+2y)^2=0$.
    - opgave: |-
        In welke richting loopt haar as?
      antwoord: |-
        $(2, -1)$
      uitwerking: |-
        Het punt op oneindig is $\hc2{-1}0$.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    een cirkel wordt nooit ontaard
  opgave: |-
    Neem een projectieve transformatie met matrix $A$ en een kegelsnede met matrix $M$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\det M' = \dfrac{\det M}{(\det A)^2}$.
      antwoord: |-
        $\det(A^{-1})=\tfrac{1}{\det A}$
      uitwerking: |-
        $\det M'=\det\bigl((A^{-1})\tr\bigr)\det M\det(A^{-1})=\tfrac{1}{\det A}\det M\tfrac{1}{\det A}$.
    - opgave: |-
        Kan een tekenaar een cirkel ooit als twee rechten tekenen?
      antwoord: |-
        nee
      uitwerking: |-
        Een cirkel is niet ontaard, $\det M\neq0$, dus ook $\det M'\neq0$: het beeld is niet ontaard.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    de raaklijn aan xy = 1
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \assen{-.3}{4.6}{-.3}{4.3}
        \kromme{.25}{4.3}{1/(\x)}
        \draw[grijs] (0,1) -- (4,0);
        \punt[above right]{2}{.5}{P}
      \end{tikzpicture}
  opgave: |-
    Neem de hyperbool $xy = 1$, homogeen $xy = z^2$, en een punt $P\bigl(a, \tfrac1a\bigr)$ met $a > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon met $MP$ aan dat de raaklijn in $P$ de vergelijking $\dfrac{x}{2a} + \dfrac{ay}{2} = 1$ heeft.
      antwoord: |-
        $MP=\bigl(\tfrac{1}{2a}, \tfrac a2, -1\bigr)$
      uitwerking: |-
        $M=\um{ccc}{0 & \tfrac12 & 0 \\ \tfrac12 & 0 & 0 \\ 0 & 0 & -1}$ en $P=\hc{a}{\tfrac1a}{1}$.
    - opgave: |-
        De raaklijn snijdt de asymptoten in $A$ en $B$. Toon aan dat $P$ het midden is van $[AB]$.
      antwoord: |-
        $A(2a, 0)$, $B\bigl(0, \tfrac2a\bigr)$
      uitwerking: |-
        De asymptoten zijn de assen. $\tfrac12\bigl((2a, 0)+(0, \tfrac2a)\bigr)=\bigl(a, \tfrac1a\bigr)$.
    - opgave: |-
        Toon aan dat de driehoek die de raaklijn met de asymptoten insluit, voor elke $a$ dezelfde oppervlakte heeft.
      antwoord: |-
        2
      uitwerking: |-
        $\tfrac12\cdot2a\cdot\tfrac2a=2$.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    evenwijdige rechten als kegelsnede
  opgave: |-
    Neem de kegelsnede $x^2 = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat ze ontaard is, en bepaal haar top.
      antwoord: |-
        $\det M=0$, top $\hc010$
      uitwerking: |-
        $M=\um{rrr}{1 & 0 & 0 \\ 0 & 0 & 0 \\ 0 & 0 & -1}$, en $M\hc010=0$. Het zijn de rechten $x=1$ en $x=-1$.
    - opgave: |-
        In Kegelsneden (hoofdstuk 1) gaf een vlak door de top van een kegel een ontaarde doorsnede. Welke ruimtelijke figuur hoort bij deze kegelsnede, met de top op oneindig?
      antwoord: |-
        een cilinder
      uitwerking: |-
        Een kegel met de top op oneindig is een cilinder: een vlak evenwijdig met de as snijdt die volgens twee evenwijdige rechten.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    wanneer tekent de tekenaar een parabool?
  opgave: |-
    Het oog van een tekenaar staat op hoogte $h$ boven de vloer, het glas op afstand 1. Een vloerpunt $(X, Z)$ komt op het glas in $\bigl(\tfrac XZ, -\tfrac hZ\bigr)$. Op de vloer ligt een cirkel met straal $r$ en middelpunt $(0, c)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het beeld de vergelijking $h^2x^2 + (c^2 - r^2)\,y^2 + 2hc\,y + h^2 = 0$ heeft.
      antwoord: |-
        met $Z=-\tfrac hy$ en $X=-\tfrac{hx}{y}$
      uitwerking: |-
        Vul in in $X^2+(Z-c)^2=r^2$ en vermenigvuldig met $y^2$: $h^2x^2+(h+cy)^2=r^2y^2$.
    - opgave: |-
        Toon aan dat de soort niet afhangt van de ooghoogte $h$.
      antwoord: |-
        de punten op oneindig hangen alleen af van $c^2-r^2$
      uitwerking: |-
        Met $z=0$: $h^2x^2+(c^2-r^2)y^2=0$. Geen, één of twee punten naargelang $c>r$, $c=r$ of $c<r$.
    - opgave: |-
        Neem $h = 1{,}6$ en $r = c = 4$. Geef de vergelijking van de parabool, en haar top.
      antwoord: |-
        $y=-0{,}2(x^2+1)$; top $(0;-0{,}2)$
      uitwerking: |-
        $2{,}56x^2+12{,}8y+2{,}56=0$.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    hyperbool met gegeven asymptoten
  opgave: |-
    Een hyperbool heeft de asymptoten $y = x$ en $y = -x + 2$, en gaat door $(1, 3)$. Zoek ze in de vorm $(x - y)(x + y - 2) = k$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $k$ en werk de vergelijking uit.
      antwoord: |-
        $k=-4$; $x^2-y^2-2x+2y+4=0$
      uitwerking: |-
        $(1-3)(1+3-2)=-4$. Uitwerken: $x^2-y^2-2x+2y=-4$.
    - opgave: |-
        Toon aan dat ze niet ontaard is.
      antwoord: |-
        $\det M=-4$
      uitwerking: |-
        $M=\um{rrr}{1 & 0 & -1 \\ 0 & -1 & 1 \\ -1 & 1 & 4}$, $\det M=1(-4-1)-1(0-1)=-4$.
    - opgave: |-
        Controleer de asymptoten met de raaklijnen in de punten op oneindig.
      antwoord: |-
        $M\hc110=(1, -1, 0)$ en $M\hc1{-1}0=(1, 1, -2)$
      uitwerking: |-
        De punten op oneindig komen uit $x^2-y^2=0$. De raaklijnen zijn $x-y=0$ en $x+y-2=0$.
    - opgave: |-
        Voor welke $k$ is $(x - y)(x + y - 2) = k$ ontaard? Wat is het dan?
      antwoord: |-
        $k=0$: de twee asymptoten
      uitwerking: |-
        Voor $k=0$ is de vergelijking een product van twee factoren van graad 1. Voor elke andere $k$ is $\det M=k\neq0$ (reken na met $F=-k$).

- id: h3-o16
  soort: opdracht
  niveau: 3
  thema: |-
    een parabool raakt de rechte op oneindig
  opgave: |-
    Neem een niet-ontaarde kegelsnede $Ax^2 + Bxy + Cy^2 + Dxz + Eyz + Fz^2 = 0$ met precies één punt op oneindig $P = \hc pq0$. Omdat $Ap^2 + Bpq + Cq^2 = 0$ een dubbele wortel heeft, is $2Ap + Bq = 0$ en $Bp + 2Cq = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $MP$, en toon aan dat de raaklijn in $P$ de rechte op oneindig is.
      antwoord: |-
        $MP=\bigl(0, 0, \tfrac{Dp+Eq}{2}\bigr)$
      uitwerking: |-
        De eerste component is $Ap+\tfrac B2q=\tfrac12(2Ap+Bq)=0$, de tweede $\tfrac B2p+Cq=0$. Dus is $MP=(0, 0, m)$, met $m\neq0$ omdat $\det M\neq0$: de rechte $z=0$.
    - opgave: |-
        Waarom kan een ellips of een hyperbool de rechte op oneindig niet raken?
      antwoord: |-
        een raakpunt zou een punt op oneindig zijn
      uitwerking: |-
        Een ellips heeft geen punt op oneindig. Een hyperbool heeft er twee, en een raaklijn heeft maar één (dubbel) snijpunt: de rechte op oneindig snijdt ze.

- id: h3-o17
  soort: opdracht
  niveau: 3
  thema: |-
    de poollijn
  opgave: |-
    De formule $(MP) \cdot X = 0$ geeft ook een rechte als $P$ niet op de kegelsnede ligt: de \textit{poollijn} van $P$. Neem de cirkel $x^2 + y^2 = 1$ en $P(2, 0)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de poollijn van $P$ en haar snijpunten met de cirkel.
      antwoord: |-
        $x=\tfrac12$; $\bigl(\tfrac12, \pm\tfrac{\sqrt3}{2}\bigr)$
      uitwerking: |-
        $MP=(2, 0, -1)$: $2x-1=0$. Met $x^2+y^2=1$: $y=\pm\tfrac{\sqrt3}{2}$.
    - opgave: |-
        Toon aan dat de raaklijnen in die twee punten door $P$ gaan.
      antwoord: |-
        $\tfrac12x\pm\tfrac{\sqrt3}{2}y=1$ gaat door $(2, 0)$
      uitwerking: |-
        Ontdubbelen: $\tfrac12x\pm\tfrac{\sqrt3}2y=1$, en $\tfrac12\cdot2=1$.
    - opgave: |-
        Toon algemeen aan: ligt $Q$ op de kegelsnede en gaat de raaklijn in $Q$ door $P$, dan ligt $Q$ op de poollijn van $P$.
      antwoord: |-
        $(MQ)\cdot P=(MP)\cdot Q$
      uitwerking: |-
        De raaklijn in $Q$ gaat door $P$: $(MQ)\cdot P=Q\tr MP=0$, omdat $M$ symmetrisch is. Dat is $(MP)\cdot Q=0$: $Q$ ligt op de poollijn.

- id: h3-o18
  soort: opdracht
  niveau: 3
  thema: |-
    de stelling van Pascal
  opgave: |-
    Blaise Pascal vond in 1640, op zijn zestiende: neem zes punten $A$, $B$, $C$, $D$, $E$, $F$ op een niet-ontaarde kegelsnede. Dan liggen $AB \cap DE$, $BC \cap EF$ en $CD \cap FA$ op één rechte.
  lijst: enumerate
  delen:
    - opgave: |-
        Controleer dat voor de cirkel $x^2 + y^2 = 25$ met $A(5, 0)$, $B(3, 4)$, $C(-4, 3)$, $D(-3, -4)$, $E(0, -5)$ en $F(4, -3)$.
      antwoord: |-
        $(9, -8)$, $(24, 7)$, $(-1, -18)$, op $y=x-17$
      uitwerking: |-
        $AB=\rc{-4}{-2}{20}$, $DE=\rc{1}{3}{15}$, snijpunt $(9, -8)$. $BC=\rc1{-7}{25}$, $EF=\rc{-2}4{20}$, snijpunt $(24, 7)$. $CD=\rc71{25}$, $FA=\rc{-3}1{15}$, snijpunt $(-1, -18)$. Alle drie op $y=x-17$.
    - opgave: |-
        Vervang de kegelsnede door een ontaarde: $A$, $C$, $E$ op een rechte $l$ en $B$, $D$, $F$ op een rechte $m$. Welke stelling uit hoofdstuk 2 krijg je?
      antwoord: |-
        de stelling van Pappus
      uitwerking: |-
        De zes punten liggen afwisselend op $l$ en $m$, en de drie snijpunten zijn die uit Pappus (met andere letters).

- id: h3-o19
  soort: opdracht
  niveau: 3
  thema: |-
    een kegelsnede door vijf punten
  opgave: |-
    Zoek de kegelsnede $ax^2 + bxy + cy^2 + dx + ey + f = 0$ door $(0, 0)$, $(1, 0)$, $(0, 1)$, $(1, 1)$ en $(2, 3)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel het stelsel op en los het op. Waarom liggen de coëfficiënten maar vast op een factor na?
      antwoord: |-
        $3x^2-y^2-3x+y=0$
      uitwerking: |-
        $f=0$, $a+d=0$, $c+e=0$, $a+b+c+d+e=0$ (dus $b=0$), $4a+9c+2d+3e=0$ (dus $2a+6c=0$). Met $c=-1$: $a=3$, $d=-3$, $e=1$. Vijf vergelijkingen met zes onbekenden: de oplossingen zijn veelvouden van elkaar, en die geven dezelfde kegelsnede.
    - opgave: |-
        Welke soort is het?
      antwoord: |-
        een hyperbool
      uitwerking: |-
        $\det M=\tfrac32\neq0$, en $3x^2-y^2=0$ geeft twee punten op oneindig $\hc1{\pm\sqrt3}0$.

- id: h3-o20
  soort: opdracht
  niveau: 3
  thema: |-
    drie soorten uit één kegel
  opgave: |-
    In de ruimte is $x^2 + y^2 = z^2$ een dubbelkegel met top $O$: de lichtstralen van het oog naar de punten van een cirkel. Snijd die kegel met drie doeken.
  lijst: enumerate
  delen:
    - opgave: |-
        het doek $z = 1$
      antwoord: |-
        de cirkel $x^2+y^2=1$
      uitwerking: |-
        Vul $z=1$ in.
    - opgave: |-
        het doek $y = 1$, met coördinaten $x$ en $z$
      antwoord: |-
        de hyperbool $z^2-x^2=1$
      uitwerking: |-
        $x^2+1=z^2$. Het doek is evenwijdig met de as.
    - opgave: |-
        het doek $z - y = 1$, met coördinaten $x$ en $y$
      antwoord: |-
        de parabool $y=\tfrac12x^2-\tfrac12$
      uitwerking: |-
        $x^2+y^2=(1+y)^2$ geeft $x^2=1+2y$. Het doek is evenwijdig met de beschrijvende rechte door $(0, 1, 1)$.

# --- Koppel ---------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Kegelsneden
  opgave: |-
    In Kegelsneden, hoofdstuk 5, vond je de regel met $B^2 - 4AC$ zonder bewijs. Gebruik nu de punten op oneindig.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke soort is $x^2 - 2xy + y^2 + 4x + 4y - 4 = 0$, en waarom kon je dat in hoofdstuk 5 van Kegelsneden niet bewijzen?
      antwoord: |-
        een parabool
      uitwerking: |-
        $\det M=-16\neq0$, en met $z=0$ is $(x-y)^2=0$: één punt op oneindig, $\hc110$. In Kegelsneden ontbrak het bewijs dat het teken van $B^2-4AC$ de soort bepaalt; hier is dat het aantal punten op oneindig.
    - opgave: |-
        De excentriciteit bepaalt in Kegelsneden ook de soort. Geef de homogene vergelijking van de kegelsnede met brandpunt $(0, 0)$, richtlijn $x = -1$ en excentriciteit $e$, en tel de punten op oneindig.
      antwoord: |-
        $(1-e^2)x^2+y^2-2e^2xz-e^2z^2=0$
      uitwerking: |-
        $x^2+y^2=e^2(x+1)^2$, homogeen $x^2+y^2=e^2(x+z)^2$. Met $z=0$: $(1-e^2)x^2+y^2=0$: geen punten als $e<1$, één ($\hc010$) als $e=1$, twee als $e>1$.

- id: h3-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Eigenwaarden en eigenvectoren
  opgave: |-
    De termen van graad 2 van een kegelsnede vormen de matrix $S = \um{cc}{A & \tfrac B2 \\[.5ex] \tfrac B2 & C}$, linksboven in $M$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\det S = -\tfrac14(B^2 - 4AC)$. Wat zeggen de tekens van de eigenwaarden van $S$ dan over de soort?
      antwoord: |-
        zelfde teken: ellips; tegengesteld: hyperbool; een nul: parabool
      uitwerking: |-
        $\det S=AC-\tfrac{B^2}{4}$, en het is het product van de eigenwaarden. Positief product (zelfde teken) betekent $B^2-4AC<0$.
    - opgave: |-
        Neem $5x^2 - 6xy + 5y^2 = 8$. Bepaal de eigenwaarden en eigenvectoren van $S$, en de halve assen van de ellips.
      antwoord: |-
        2 met $(1, 1)$, 8 met $(-1, 1)$; halve assen 2 en 1
      uitwerking: |-
        In de orthonormale coördinaten $u$, $v$ langs de eigenvectoren is de vergelijking $2u^2+8v^2=8$, of $\tfrac{u^2}{4}+v^2=1$: halve as 2 in de richting $(1, 1)$ en 1 in de richting $(-1, 1)$.

- id: h3-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    Laat ook complexe homogene coördinaten toe.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat elke cirkel $(x - a)^2 + (y - b)^2 = r^2$ de rechte op oneindig snijdt in de punten $\hc1{\mathrm{i}}0$ en $\hc1{-\mathrm{i}}0$.
      antwoord: |-
        met $z=0$ blijft $x^2+y^2=0$
      uitwerking: |-
        Homogeen: $(x-az)^2+(y-bz)^2=r^2z^2$. Met $z=0$: $x^2+y^2=(x+\mathrm{i}y)(x-\mathrm{i}y)=0$, dus $y=\pm\mathrm{i}x$.
    - opgave: |-
        Toon omgekeerd aan: gaat een kegelsnede $Ax^2 + Bxy + Cy^2 + Dx + Ey + F = 0$ door die twee punten, dan is $A = C$ en $B = 0$: een cirkel (of ontaard, of leeg).
      antwoord: |-
        $A-C\pm B\mathrm{i}=0$
      uitwerking: |-
        Invullen van $\hc1{\mathrm{i}}0$: $A+B\mathrm{i}-C=0$, dus het reële deel $A-C=0$ en het imaginaire deel $B=0$. Dan is de vergelijking $A(x^2+y^2)+Dx+Ey+F=0$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Maak $y = x^2 - 4x + 1$ homogeen, en bepaal de punten op oneindig.
  antwoord: |-
    $yz=x^2-4xz+z^2$; $\hc010$
  uitwerking: |-
    $z=0$ geeft $x^2=0$.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Geef de matrix van $2x^2 - 2xy + 3y^2 + 4x - 1 = 0$.
  antwoord: |-
    $\um{rrr}{2 & -1 & 2 \\ -1 & 3 & 0 \\ 2 & 0 & -1}$
  uitwerking: |-
    Halve coëfficiënten naast de diagonaal.

- id: h3-t3
  soort: test
  niveau: 1
  opgave: |-
    Toon aan dat $x^2 - 9y^2 + 6y - 1 = 0$ ontaard is, en bepaal de top.
  antwoord: |-
    $\det M=0$; top $\bigl(0, \tfrac13\bigr)$
  uitwerking: |-
    $\det\um{rrr}{1 & 0 & 0 \\ 0 & -9 & 3 \\ 0 & 3 & -1}=9-9=0$. $MP=0$ geeft $x=0$ en $z=3y$: $\hc013$. De rechten zijn $x=\pm(3y-1)$.

- id: h3-t4
  soort: test
  niveau: 2
  opgave: |-
    Welke soort is $x^2 + xy - 2y^2 + 3x - 1 = 0$?
  antwoord: |-
    een hyperbool
  uitwerking: |-
    $\det M=\tfrac{27}{4}\neq0$. Met $z=0$: $(x+2y)(x-y)=0$, twee punten op oneindig.

- id: h3-t5
  soort: test
  niveau: 2
  opgave: |-
    Toon aan dat $4x^2 + 4xy + y^2 + 2x - y = 0$ een parabool is, en geef de richting van de as.
  antwoord: |-
    $\det M=-4$; as in de richting $(1, -2)$
  uitwerking: |-
    $M=\um{ccc}{4 & 2 & 1 \\ 2 & 1 & -\tfrac12 \\ 1 & -\tfrac12 & 0}$, $\det M=-4\neq0$. $z=0$: $(2x+y)^2=0$, één punt $\hc1{-2}0$.

- id: h3-t6
  soort: test
  niveau: 2
  opgave: |-
    Bepaal de asymptoten van $xy + 3x - y = 0$ met de raaklijnen in de punten op oneindig.
  antwoord: |-
    $y=-3$ en $x=1$
  uitwerking: |-
    $M=\um{ccc}{0 & \tfrac12 & \tfrac32 \\ \tfrac12 & 0 & -\tfrac12 \\ \tfrac32 & -\tfrac12 & 0}$, $\det M=-\tfrac34\neq0$. $M\hc100=\bigl(0, \tfrac12, \tfrac32\bigr)$: $y=-3$. $M\hc010=\bigl(\tfrac12, 0, -\tfrac12\bigr)$: $x=1$. Controle: $y=\tfrac{-3x}{x-1}$.

- id: h3-t7
  soort: test
  niveau: 2
  opgave: |-
    Een cirkel op de vloer heeft straal 2 en middelpunt op 2 m recht voor de tekenaar. Het oog staat op hoogte 1 en het glas op afstand 1. Welke kromme tekent hij? Verklaar.
  antwoord: |-
    een parabool
  uitwerking: |-
    $c=r=2$: het beeld $x^2+4y+1=0$ heeft één punt op oneindig. De cirkel raakt de rechte op de vloer recht onder het oog, en dat raakpunt gaat naar oneindig.
