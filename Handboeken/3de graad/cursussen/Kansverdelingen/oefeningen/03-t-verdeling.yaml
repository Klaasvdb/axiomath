# Oefeningen van hoofdstuk 3 (De t-verdeling). Zie oefeningenbank.py voor de velden.
# Alle getallen nagerekend met mpmath (t-verdeling via de onvolledige bètafunctie) en sympy.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: enumerate
  delen:
    - opgave: |-
        Een aselecte steekproef van 25 waarnemingen uit een populatie met $\sigma = 5$ heeft gemiddelde 40. Bereken het 95~\%-betrouwbaarheidsinterval voor $\mu$.
      antwoord: |-
        $[38{,}04;\ 41{,}96]$
      uitwerking: |-
        $E = 1{,}96 \cdot \frac{5}{\sqrt{25}} = 1{,}96$, dus $[40 - 1{,}96;\ 40 + 1{,}96] = [38{,}04;\ 41{,}96]$.
    - opgave: |-
        Waar komt het getal 1,96 vandaan? Bereken het met \texttt{invNorm}.
      antwoord: |-
        \texttt{invNorm(0.975,0,1)} $\approx 1{,}96$
      uitwerking: |-
        Tussen $-1{,}96$ en $1{,}96$ ligt 95~\% van de oppervlakte onder de standaardnormale kromme, dus links van 1,96 ligt $0{,}975$: \texttt{invNorm(0.975,0,1)} $\approx 1{,}960$.
    - opgave: |-
        Een populatie heeft $\sigma = 12$. Wat is de standaardafwijking van het gemiddelde $\overline{X}$ van een steekproef van 16 waarnemingen?
      antwoord: |-
        3
      uitwerking: |-
        $\frac{\sigma}{\sqrt n} = \frac{12}{\sqrt{16}} = 3$.
    - opgave: |-
        Bij een eenzijdige toets met $H_1\colon \mu < \mu_0$ is $z = -2{,}1$. Bereken de p-waarde. Wat besluit je bij $\alpha = 0{,}05$?
      antwoord: |-
        $\approx 0{,}018$; $H_0$ verwerpen
      uitwerking: |-
        \texttt{normalcdf(-1E99,-2.1,0,1)} $\approx 0{,}018 \leqslant 0{,}05$: $H_0$ verwerpen.
    - opgave: |-
        Bereken de standaardafwijking van 2, 4, 4, 6 zoals in de 2de graad: de wortel uit het gemiddelde kwadraat van de afwijkingen.
      antwoord: |-
        $\sqrt2 \approx 1{,}41$
      uitwerking: |-
        $\xbar = 4$, afwijkingen $-2, 0, 0, 2$, kwadraten samen 8, gedeeld door 4 is 2: $\sigma x = \sqrt2 \approx 1{,}41$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Een computer trekt zes steekproeven van 4 waarden uit een normaal verdeelde populatie met $\mu = 50$ en $\sigma = 10$. Van elke steekproef geeft hij het gemiddelde $\xbar$ en de steekproefstandaardafwijking $s$.

    \smallskip
    {\centering\small\renewcommand{\arraystretch}{1.15}\begin{tabular}{|l|c|c|c|c|c|c|}\hline
    steekproef & 1 & 2 & 3 & 4 & 5 & 6 \\\hline
    $\xbar$ & 56 & 46,25 & 55,75 & 44,5 & 44,5 & 54 \\\hline
    $s$ & 4,2 & 13,5 & 4,7 & 1,7 & 5,9 & 9,8 \\\hline
    \end{tabular}\par}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken voor elke steekproef $z = \dfrac{\xbar - 50}{10/\sqrt4}$.
      antwoord: |-
        $1{,}2$; \ ${-0{,}75}$; \ $1{,}15$; \ ${-1{,}1}$; \ ${-1{,}1}$; \ $0{,}8$
      uitwerking: |-
        $\frac{10}{\sqrt4} = 5$, dus $z = \frac{\xbar - 50}{5}$: $1{,}2$; $-0{,}75$; $1{,}15$; $-1{,}1$; $-1{,}1$; $0{,}8$.
    - opgave: |-
        Doe alsof je $\sigma$ niet kent, en vervang ze door $s$: bereken $t = \dfrac{\xbar - 50}{s/\sqrt4}$.
      antwoord: |-
        $2{,}86$; \ ${-0{,}56}$; \ $2{,}45$; \ ${-6{,}47}$; \ ${-1{,}86}$; \ $0{,}82$
      uitwerking: |-
        $t = \frac{\xbar - 50}{s/2}$, bijvoorbeeld $\frac{6}{2{,}1} \approx 2{,}86$ en $\frac{-5{,}5}{0{,}85} \approx -6{,}47$. Samen: $2{,}86$; $-0{,}56$; $2{,}45$; $-6{,}47$; $-1{,}86$; $0{,}82$.
    - opgave: |-
        Hoeveel waarden van $z$ liggen buiten $[-1{,}96;\ 1{,}96]$? Hoeveel van $t$? Hoeveel verwacht je bij $z$?
      antwoord: |-
        0 en 3; ongeveer 5~\%, dus 0
      uitwerking: |-
        Geen enkele $z$, maar drie $t$-waarden (steekproef 1, 3 en 4). Bij $z$ verwacht je 5~\% van 6, dus meestal 0.
    - opgave: |-
        Wat hebben de steekproeven met een grote $|t|$ gemeen?
      antwoord: |-
        een kleine $s$
      uitwerking: |-
        Steekproef 1, 3 en 4 hebben een kleine $s$ (4,2; 4,7 en 1,7). Delen door een klein getal maakt $t$ groot: $s$ onderschat dan $\sigma = 10$ sterk.

# ---------------------------------------------------------------- korte oefeningen

- id: h3-s
  soort: kort
  opgave: |-
    Bereken $\xbar$, $s$ en $\sigma x$. Reken $s$ met de hand en controleer met \texttt{1-Var Stats}.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        12, 15, 11, 14, 13
      antwoord: |-
        $13$; \ $\approx 1{,}58$; \ $\approx 1{,}41$
      uitwerking: |-
        Afwijkingen $-1, 2, -2, 1, 0$, kwadraten samen 10. $s = \sqrt{\frac{10}{4}} \approx 1{,}58$ en $\sigma x = \sqrt{\frac{10}{5}} \approx 1{,}41$.
    - opgave: |-
        2,4; \ 3,1; \ 2,8; \ 3,5
      antwoord: |-
        $2{,}95$; \ $\approx 0{,}466$; \ $\approx 0{,}403$
      uitwerking: |-
        Afwijkingen $-0{,}55$; $0{,}15$; $-0{,}15$; $0{,}55$, kwadraten samen $0{,}65$. $s = \sqrt{\frac{0{,}65}{3}} \approx 0{,}466$ en $\sigma x = \sqrt{\frac{0{,}65}{4}} \approx 0{,}403$.

- id: h3-tcdf
  soort: kort
  opgave: |-
    Maak telkens een schets en bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $P(T < 1{,}5)$ voor $T \sim t_6$
      antwoord: |-
        $\approx 0{,}908$
      uitwerking: |-
        \texttt{tcdf(-1E99,1.5,6)} $\approx 0{,}908$.
    - opgave: |-
        $P(T > 2{,}5)$ voor $T \sim t_{12}$
      antwoord: |-
        $\approx 0{,}014$
      uitwerking: |-
        \texttt{tcdf(2.5,1E99,12)} $\approx 0{,}014$.
    - opgave: |-
        $P(-1 < T < 1)$ voor $T \sim t_2$
      antwoord: |-
        $\approx 0{,}577$
      uitwerking: |-
        \texttt{tcdf(-1,1,2)} $\approx 0{,}577$. Bij de normale verdeling is dat 0,683: bij $t_2$ ligt veel meer in de staarten.
    - opgave: |-
        $t^*$ bij 95~\% en $n = 20$
      antwoord: |-
        $\approx 2{,}093$
      uitwerking: |-
        $\nu = 19$: \texttt{invT(0.975,19)} $\approx 2{,}093$.
    - opgave: |-
        $t^*$ bij 90~\% en $n = 8$
      antwoord: |-
        $\approx 1{,}895$
      uitwerking: |-
        $\nu = 7$, en links van $t^*$ ligt $0{,}95$: \texttt{invT(0.95,7)} $\approx 1{,}895$.
    - opgave: |-
        $t^*$ bij 99~\% en $n = 31$
      antwoord: |-
        $\approx 2{,}750$
      uitwerking: |-
        $\nu = 30$: \texttt{invT(0.995,30)} $\approx 2{,}750$.

- id: h3-interval
  soort: kort
  opgave: |-
    Een tuinder meet de suikergraad van 14 aselect gekozen meloenen. Het gemiddelde is 4,36 (in een eigen eenheid), met $s = 0{,}52$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken een 95~\%-betrouwbaarheidsinterval voor de gemiddelde suikergraad van alle meloenen.
      antwoord: |-
        $[4{,}06;\ 4{,}66]$
      uitwerking: |-
        $\nu = 13$, $t^* = \texttt{invT(0.975,13)} \approx 2{,}160$, $E = 2{,}160 \cdot \frac{0{,}52}{\sqrt{14}} \approx 0{,}300$: $[4{,}06;\ 4{,}66]$.
    - opgave: |-
        Bereken ook een 90~\%-interval. Is het breder of smaller? Waarom?
      antwoord: |-
        $[4{,}11;\ 4{,}61]$; smaller
      uitwerking: |-
        $t^* = \texttt{invT(0.95,13)} \approx 1{,}771$, $E \approx 0{,}246$: $[4{,}11;\ 4{,}61]$. Smaller: met minder betrouwbaarheid mag het interval $\mu$ vaker missen.

- id: h3-interval-data
  soort: kort
  opgave: |-
    Een leerling meet negen keer hoeveel seconden het duurt voor een ijsblokje in een glas water smelt (in tientallen seconden): 61, 58, 66, 63, 59, 64, 60, 62, 65. Bereken met \texttt{TInterval} een 95~\%-betrouwbaarheidsinterval voor de gemiddelde smelttijd. Controleer met de formule.
  antwoord: |-
    $[59{,}9;\ 64{,}1]$
  uitwerking: |-
    $\xbar = 62$, $s \approx 2{,}739$, $\nu = 8$, $t^* \approx 2{,}306$, $E = 2{,}306 \cdot \frac{2{,}739}{3} \approx 2{,}11$: $[59{,}9;\ 64{,}1]$.

- id: h3-marge
  soort: kort
  opgave: |-
    Een onderzoekster wil de gemiddelde wachttijd aan een loket schatten tot op 4 minuten, met 95~\% betrouwbaarheid. Een proefsteekproef gaf $s = 12$ minuten. Hoeveel wachtenden moet ze ondervragen? Reken eerst met 1,96 en controleer met $t^*$.
  antwoord: |-
    38
  uitwerking: |-
    $n \geqslant \bigl(\frac{1{,}96 \cdot 12}{4}\bigr)^2 \approx 34{,}6$: eerste schatting 35. Controle: bij $n = 35$ is $E = \texttt{invT(0.975,34)} \cdot \frac{12}{\sqrt{35}} \approx 4{,}12$, bij $n = 37$ nog $4{,}001$, bij $n = 38$ is $E \approx 3{,}94$. Dus 38.

- id: h3-toets
  soort: kort
  opgave: |-
    Op een zak chips staat 250~g. Een consument weegt 12 zakken: gemiddeld 246,8~g, met $s = 4{,}9$~g. Toets bij $\alpha = 0{,}05$ of de zakken gemiddeld te licht zijn.
  antwoord: |-
    $t \approx -2{,}26$, p-waarde $\approx 0{,}022$: $H_0$ verwerpen
  uitwerking: |-
    $H_0\colon \mu = 250$, $H_1\colon \mu < 250$. $t = \frac{246{,}8 - 250}{4{,}9/\sqrt{12}} \approx -2{,}26$ met $\nu = 11$. p-waarde = \texttt{tcdf(-1E99,-2.26,11)} $\approx 0{,}022 \leqslant 0{,}05$: $H_0$ verwerpen, de zakken zijn waarschijnlijk gemiddeld te licht.

- id: h3-toets-2
  soort: kort
  opgave: |-
    Een fabrikant van verf belooft dat een laag gemiddeld 5,0 uur nodig heeft om te drogen. Een schilder meet tien keer: 5,3; 4,6; 5,8; 5,1; 4,9; 5,6; 5,4; 5,7; 5,2; 5,5 uur. Wijkt de droogtijd af van wat de fabrikant belooft? Toets tweezijdig bij $\alpha = 0{,}05$, met \texttt{T-Test} en Inpt: Data.
  antwoord: |-
    $t \approx 2{,}63$, p-waarde $\approx 0{,}027$: $H_0$ verwerpen
  uitwerking: |-
    $H_0\colon \mu = 5$, $H_1\colon \mu \neq 5$. $\xbar = 5{,}31$, $s \approx 0{,}373$, $t = \frac{0{,}31}{0{,}373/\sqrt{10}} \approx 2{,}63$ met $\nu = 9$. p-waarde $= 2 \cdot \texttt{tcdf(2.63,1E99,9)} \approx 0{,}027 \leqslant 0{,}05$: de droogtijd wijkt waarschijnlijk af, ze is langer.

- id: h3-interval-toets
  soort: kort
  opgave: |-
    Een 95~\%-betrouwbaarheidsinterval voor een gemiddelde is $[18{,}7;\ 23{,}5]$. Welke nulhypothesen verwerpt een tweezijdige t-toets bij $\alpha = 0{,}05$ met dezelfde gegevens?
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\mu = 18$
      antwoord: |-
        verwerpen
      uitwerking: |-
        18 ligt niet in het interval: verwerpen.
    - opgave: |-
        $\mu = 20$
      antwoord: |-
        niet verwerpen
      uitwerking: |-
        20 ligt in het interval: niet verwerpen.
    - opgave: |-
        $\mu = 23{,}4$
      antwoord: |-
        niet verwerpen
      uitwerking: |-
        23,4 ligt (net) in het interval: niet verwerpen.
    - opgave: |-
        $\mu = 25$
      antwoord: |-
        verwerpen
      uitwerking: |-
        25 ligt niet in het interval: verwerpen.

- id: h3-gepaard
  soort: kort
  opgave: |-
    Zes metalen staafjes worden gemeten met een nieuwe schuifmaat A en een gekeurde schuifmaat B (in mm). Meet A gemiddeld meer dan B? Toets bij $\alpha = 0{,}05$.

    \smallskip
    {\centering\small\renewcommand{\arraystretch}{1.15}\begin{tabular}{|l|c|c|c|c|c|c|}\hline
    staafje & 1 & 2 & 3 & 4 & 5 & 6 \\\hline
    A & 24,1 & 25,3 & 22,8 & 26,0 & 23,5 & 24,7 \\\hline
    B & 23,6 & 25,1 & 22,1 & 25,2 & 23,4 & 24,0 \\\hline
    \end{tabular}\par}
  antwoord: |-
    $t \approx 4{,}23$, p-waarde $\approx 0{,}004$: $H_0$ verwerpen
  uitwerking: |-
    Verschillen $d = A - B$: $0{,}5$; $0{,}2$; $0{,}7$; $0{,}8$; $0{,}1$; $0{,}7$. $\overline{d} = 0{,}5$, $s_d \approx 0{,}290$. $H_0\colon \mu_d = 0$, $H_1\colon \mu_d > 0$. $t = \frac{0{,}5}{0{,}290/\sqrt6} \approx 4{,}23$ met $\nu = 5$, p-waarde $\approx 0{,}004$: schuifmaat A meet waarschijnlijk systematisch te veel.

- id: h3-voorwaarden
  soort: kort
  figuur:
    code: |-
      \begin{tikzpicture}[x=.32cm,font=\scriptsize]
        \draw[->,grijs] (0,0) -- (21,0) node[right,text=black] {min};
        \foreach \t in {0,5,10,15,20}{\draw[grijs] (\t,.08) -- (\t,-.08) node[below,text=black] {\t};}
        \foreach \v/\h in {2/1,3/1,3/2,4/1,4/2,4/3,5/1,5/2,6/1,7/1,9/1,19/1}{\fill[accent] (\v,{.25*\h}) circle (2.2pt);}
      \end{tikzpicture}
  opgave: |-
    Een leerling noteert twaalf dagen hoeveel minuten ze op de trein wacht. Rechts zie je de waarden. Mag ze met een t-interval het gemiddelde schatten? Leg uit wat ze best doet.
  antwoord: |-
    niet zomaar: scheef, met een uitschieter (19)
  uitwerking: |-
    Met $n = 12 < 15$ moeten de waarden ongeveer symmetrisch liggen, zonder uitschieters. Hier zijn ze scheef naar rechts, met een uitschieter bij 19 minuten. Ze zoekt uit wat er die dag gebeurde (een staking?), meldt het resultaat met en zonder die waarde, of verzamelt meer gegevens.

# ---------------------------------------------------------------- opdrachten, niveau 1

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    steekproefstandaardafwijking
  opgave: |-
    Bereken $\xbar$ en $s$ met de hand. Controleer met \texttt{1-Var Stats}.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        8, 10, 9, 13
      antwoord: |-
        $10$; \ $\approx 2{,}16$
      uitwerking: |-
        Afwijkingen $-2, 0, -1, 3$, kwadraten samen 14: $s = \sqrt{\frac{14}{3}} \approx 2{,}16$.
    - opgave: |-
        0,2; \ 0,5; \ 0,1; \ 0,4; \ 0,3
      antwoord: |-
        $0{,}3$; \ $\approx 0{,}158$
      uitwerking: |-
        Afwijkingen $-0{,}1$; $0{,}2$; $-0{,}2$; $0{,}1$; $0$, kwadraten samen $0{,}1$: $s = \sqrt{\frac{0{,}1}{4}} \approx 0{,}158$.
    - opgave: |-
        105, 98, 110, 101, 96, 102
      antwoord: |-
        $102$; \ $\approx 5{,}02$
      uitwerking: |-
        Afwijkingen $3, -4, 8, -1, -6, 0$, kwadraten samen 126: $s = \sqrt{\frac{126}{5}} \approx 5{,}02$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    kansen met tcdf
  opgave: |-
    Bereken met \texttt{tcdf}. Maak bij elke opgave een schets.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $P(T < 1{,}5)$ voor $T \sim t_4$
      antwoord: |-
        $\approx 0{,}896$
      uitwerking: |-
        \texttt{tcdf(-1E99,1.5,4)} $\approx 0{,}896$.
    - opgave: |-
        $P(T > 2{,}2)$ voor $T \sim t_{10}$
      antwoord: |-
        $\approx 0{,}026$
      uitwerking: |-
        \texttt{tcdf(2.2,1E99,10)} $\approx 0{,}026$.
    - opgave: |-
        $P(-2 < T < 2)$ voor $T \sim t_3$
      antwoord: |-
        $\approx 0{,}861$
      uitwerking: |-
        \texttt{tcdf(-2,2,3)} $\approx 0{,}861$.
    - opgave: |-
        $P(|T| > 2{,}5)$ voor $T \sim t_{20}$
      antwoord: |-
        $\approx 0{,}021$
      uitwerking: |-
        Beide staarten: $2 \cdot \texttt{tcdf(2.5,1E99,20)} \approx 0{,}021$.
    - opgave: |-
        $P(T < -1)$ voor $T \sim t_1$
      antwoord: |-
        $0{,}25$
      uitwerking: |-
        \texttt{tcdf(-1E99,-1,1)} $= 0{,}25$. (Bij $t_1$ is dat exact $\frac14$: zie de Koppel.)
    - opgave: |-
        $P(T > 3)$ voor $T \sim t_{30}$, en $P(Z > 3)$ voor $Z$ standaardnormaal
      antwoord: |-
        $\approx 0{,}0027$; \ $\approx 0{,}0013$
      uitwerking: |-
        \texttt{tcdf(3,1E99,30)} $\approx 0{,}0027$ en \texttt{normalcdf(3,1E99,0,1)} $\approx 0{,}0013$: ook bij $\nu = 30$ is de staart ver weg nog dubbel zo dik.

