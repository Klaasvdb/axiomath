# Oefeningen van hoofdstuk 4. Zie oefeningenbank.py voor de velden.

- id: h4-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $Z$ is standaardnormaal. Bereken $P(Z \geqslant 1{,}96)$.
      antwoord: |-
        $\approx 0{,}025$
      uitwerking: |-
        \texttt{normalcdf(1.96,1E99,0,1)} $\approx 0{,}025$.
    - opgave: |-
        Bereken $P(|Z| \geqslant 2)$.
      antwoord: |-
        $\approx 0{,}046$
      uitwerking: |-
        Door de symmetrie: $2 \cdot P(Z \geqslant 2) \approx 2 \cdot 0{,}0228 \approx 0{,}046$.
    - opgave: |-
        Je gooit 60 keer met een zuivere dobbelsteen. Hoeveel zessen verwacht je?
      antwoord: |-
        10
      uitwerking: |-
        $\E(X) = np = 60 \cdot \frac16 = 10$.
    - opgave: |-
        $A$ en $B$ zijn onafhankelijk, met $P(A) = 0{,}4$ en $P(B) = 0{,}25$. Bereken $P(A \cap B)$.
      antwoord: |-
        $0{,}1$
      uitwerking: |-
        $P(A \cap B) = P(A) \cdot P(B) = 0{,}4 \cdot 0{,}25 = 0{,}1$.
    - opgave: |-
        Een toets geeft p-waarde 0,03. Wat besluit je bij $\alpha = 0{,}05$?
      antwoord: |-
        $H_0$ verwerpen
      uitwerking: |-
        $0{,}03 \leqslant 0{,}05$: het resultaat is significant, je verwerpt $H_0$.
    - opgave: |-
        Bereken $\dfrac{(26 - 20)^2}{20}$.
      antwoord: |-
        $1{,}8$
      uitwerking: |-
        $\frac{36}{20} = 1{,}8$.

- id: h4-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Bram gooit 60 keer met een dobbelsteen en telt 8, 12, 9, 11, 6 en 14 keer één tot zes ogen. Saar gooit 600 keer met een andere dobbelsteen en telt 104, 96, 103, 97, 94 en 106.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel keer verwacht Bram elk aantal ogen bij een zuivere dobbelsteen? Bereken bij Bram voor elke zijde de afwijking $O - E$ (waargenomen min verwacht), en de som van de zes afwijkingen.
      antwoord: |-
        10; \ $-2$, $2$, $-1$, $1$, $-4$, $4$; som 0
      uitwerking: |-
        $E = 60 \cdot \frac16 = 10$. De afwijkingen zijn $-2$, $2$, $-1$, $1$, $-4$ en $4$, samen 0.
    - opgave: |-
        Leg uit waarom de som van de afwijkingen bij elke dobbelsteen 0 is. Is die som dan een goede maat voor de afwijking?
      antwoord: |-
        $\sum O = n = \sum E$; nee
      uitwerking: |-
        De waargenomen aantallen tellen op tot het aantal worpen, en de verwachte ook. Dus $\sum (O - E) = n - n = 0$, altijd: de som zegt niets.
    - opgave: |-
        Bereken bij Bram en bij Saar de som van de kwadraten $(O - E)^2$. Welke dobbelsteen lijkt volgens die som het minst zuiver?
      antwoord: |-
        Bram 42, Saar 122: die van Saar
      uitwerking: |-
        Bram: $4 + 4 + 1 + 1 + 16 + 16 = 42$. Saar: $E = 100$, en $16 + 16 + 9 + 9 + 36 + 36 = 122$. Volgens die som wijkt de dobbelsteen van Saar het meest af.
    - opgave: |-
        Toch lijkt de dobbelsteen van Saar het meest zuiver: haar afwijkingen zijn klein \textit{in verhouding tot} 100. Pas de som aan zodat ze daar rekening mee houdt, en bereken ze opnieuw voor beiden.
      antwoord: |-
        delen door $E$: Bram 4,2, Saar 1,22
      uitwerking: |-
        Deel elk kwadraat door het verwachte aantal: $\sum \frac{(O - E)^2}{E}$. Bram: $\frac{42}{10} = 4{,}2$. Saar: $\frac{122}{100} = 1{,}22$. Nu wijkt Bram het meest af.

#----------------------------------------------------------------------------------------
# Korte oefeningen
#----------------------------------------------------------------------------------------

- id: h4-x2
  soort: kort
  opgave: |-
    Bereken $X^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Een munt valt 31 keer op kop en 19 keer op munt. Model: een eerlijke munt.
      antwoord: |-
        $2{,}88$
      uitwerking: |-
        $E = 25$ en $25$: $X^2 = \frac{6^2}{25} + \frac{6^2}{25} = 2{,}88$.
    - opgave: |-
        Een draaischijf met vier even grote vakken stopt 26, 14, 22 en 18 keer op elk vak. Model: elk vak even waarschijnlijk.
      antwoord: |-
        $4$
      uitwerking: |-
        $n = 80$, $E = 20$: $X^2 = \frac{36 + 36 + 4 + 4}{20} = 4$.
    - opgave: |-
        Drie categorieën met waargenomen aantallen 16, 14 en 10. Model: kansen $\frac12$, $\frac14$ en $\frac14$.
      antwoord: |-
        $2{,}4$
      uitwerking: |-
        $n = 40$, dus $E = 20$, $10$, $10$: $X^2 = \frac{16}{20} + \frac{16}{10} + 0 = 2{,}4$.

- id: h4-z2
  soort: kort
  opgave: |-
    Een punaise valt bij 400 worpen 248 keer met de punt omhoog. Je toetst het model $p = 0{,}6$ voor \textit{punt omhoog}.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de z-score van 248.
      antwoord: |-
        $\approx 0{,}82$
      uitwerking: |-
        $np = 240$ en $\sqrt{400 \cdot 0{,}6 \cdot 0{,}4} = \sqrt{96} \approx 9{,}80$, dus $z = \frac{8}{9{,}80} \approx 0{,}82$.
    - opgave: |-
        Bereken $X^2$ met de twee categorieën \textit{punt omhoog} en \textit{punt opzij}.
      antwoord: |-
        $\approx 0{,}667$
      uitwerking: |-
        $E = 240$ en $160$: $X^2 = \frac{64}{240} + \frac{64}{160} \approx 0{,}267 + 0{,}4 = 0{,}667$.
    - opgave: |-
        Ga na dat $X^2 = z^2$.
      antwoord: |-
        $z^2 = \tfrac{64}{96} = \tfrac23$
      uitwerking: |-
        $z^2 = \frac{8^2}{96} = \frac{2}{3} \approx 0{,}667$, en $X^2 = \frac{64}{240} + \frac{64}{160} = \frac{64 \cdot 400}{240 \cdot 160} = \frac23$.

- id: h4-verdeling
  soort: kort
  opgave: |-
    Over de chi-kwadraatverdeling.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de verwachtingswaarde van $\chi^2_7$? Welke waarden kan $\chi^2_7$ aannemen?
      antwoord: |-
        7; \ alleen waarden $\geqslant 0$
      uitwerking: |-
        $\E(\chi^2_k) = k = 7$. Een som van kwadraten is nooit negatief.
    - opgave: |-
        Bereken $P(\chi^2_1 \geqslant 6{,}63)$ met de standaardnormale verdeling, zoals in voorbeeld \ref{vb:h4-k1}.
      antwoord: |-
        $\approx 0{,}01$
      uitwerking: |-
        $\chi^2_1 = Z^2 \geqslant 6{,}63 \iff |Z| \geqslant \sqrt{6{,}63} \approx 2{,}575$. Dus $2 \cdot P(Z \geqslant 2{,}575) \approx 2 \cdot 0{,}005 = 0{,}01$.
    - opgave: |-
        Welke van de twee is groter: $P(\chi^2_2 \geqslant 6)$ of $P(\chi^2_{10} \geqslant 6)$? Verklaar zonder te rekenen, en controleer met je rekentoestel.
      antwoord: |-
        $P(\chi^2_{10} \geqslant 6)$; \ $0{,}050$ en $0{,}815$
      uitwerking: |-
        $\chi^2_{10}$ heeft verwachtingswaarde 10, dus 6 ligt links van het midden: de kans erboven is groot. $\chi^2_2$ heeft verwachtingswaarde 2, dus 6 ligt ver in de staart. \texttt{$\chi^2$cdf(6,1E99,2)} $\approx 0{,}050$ en \texttt{$\chi^2$cdf(6,1E99,10)} $\approx 0{,}815$.

- id: h4-pwaarde
  soort: kort
  opgave: |-
    Bereken de p-waarde, of zoek de kritieke waarde in de tabel.
  lijst: enumerate
  delen:
    - opgave: |-
        $X^2 = 6{,}2$ met 2 vrijheidsgraden. Besluit bij $\alpha = 0{,}05$.
      antwoord: |-
        $\approx 0{,}045$; verwerpen
      uitwerking: |-
        \texttt{$\chi^2$cdf(6.2,1E99,2)} $\approx 0{,}045 \leqslant 0{,}05$: $H_0$ verwerpen. Ook $6{,}2 \geqslant 5{,}99$.
    - opgave: |-
        $X^2 = 12{,}5$ met 4 vrijheidsgraden. Besluit bij $\alpha = 0{,}01$.
      antwoord: |-
        $\approx 0{,}014$; niet verwerpen
      uitwerking: |-
        \texttt{$\chi^2$cdf(12.5,1E99,4)} $\approx 0{,}014 > 0{,}01$: $H_0$ niet verwerpen. Ook $12{,}5 < 13{,}28$.
    - opgave: |-
        $X^2 = 3{,}1$ met 1 vrijheidsgraad. Besluit bij $\alpha = 0{,}10$.
      antwoord: |-
        $\approx 0{,}078$; verwerpen
      uitwerking: |-
        \texttt{$\chi^2$cdf(3.1,1E99,1)} $\approx 0{,}078 \leqslant 0{,}10$: $H_0$ verwerpen. Ook $3{,}1 \geqslant 2{,}71$.
    - opgave: |-
        De kritieke waarden bij 6 vrijheidsgraden, voor $\alpha = 0{,}05$ en $\alpha = 0{,}01$.
      antwoord: |-
        $12{,}59$ en $16{,}81$
      uitwerking: |-
        Uit de tabel, kolom 6.

- id: h4-aanpassing
  soort: kort
  opgave: |-
    Een draaischijf heeft vijf even grote vakken. Bij 150 keer draaien stopt ze 38, 27, 24, 33 en 28 keer op elk vak. Toets bij $\alpha = 0{,}05$ of elk vak even waarschijnlijk is.
  antwoord: |-
    $X^2 \approx 4{,}07$, p $\approx 0{,}40$: niet verwerpen
  uitwerking: |-
    $H_0\colon p_i = \frac15$ voor elk vak. $E = 30$ voor elk vak, allemaal $\geqslant 5$. $X^2 = \frac{64 + 9 + 36 + 9 + 4}{30} = \frac{122}{30} \approx 4{,}07$, met $5 - 1 = 4$ vrijheidsgraden. p-waarde $= P(\chi^2_4 \geqslant 4{,}07) \approx 0{,}40 > 0{,}05$: $H_0$ niet verwerpen. Er is geen aanwijzing dat de schijf een vak voortrekt.

- id: h4-model
  soort: kort
  opgave: |-
    Bij een kruising van planten verwacht een bioloog de verhouding $3 : 1$ voor paarse en witte bloemen. Van 240 planten bloeien er 167 paars. Toets bij $\alpha = 0{,}05$.
  antwoord: |-
    $X^2 \approx 3{,}76$, p $\approx 0{,}053$: net niet verwerpen
  uitwerking: |-
    $H_0\colon p = \frac34, \frac14$. $E = 180$ en $60$; $O = 167$ en $73$. $X^2 = \frac{13^2}{180} + \frac{13^2}{60} \approx 0{,}939 + 2{,}817 = 3{,}76$, met 1 vrijheidsgraad. p-waarde $= P(\chi^2_1 \geqslant 3{,}76) \approx 0{,}053 > 0{,}05$: $H_0$ net niet verwerpen ($3{,}76 < 3{,}84$). Een randgeval: meer planten tellen.

- id: h4-samennemen
  soort: kort
  opgave: |-
    Je toetst of het aantal telefoontjes per minuut bij een kleine hulplijn Poissonverdeeld is, met 100 waargenomen minuten. Met $\lambda = 1$ zijn de verwachte aantallen 36,8 (0 telefoontjes), 36,8 (1), 18,4 (2), 6,1 (3), 1,5 (4) en 0,4 (5 of meer).
  lijst: enumerate
  delen:
    - opgave: |-
        Welke categorieën neem je samen? Hoeveel categorieën blijven er over?
      antwoord: |-
        3, 4 en 5 of meer samen; 4 categorieën
      uitwerking: |-
        3 alleen is genoeg ($6{,}1 \geqslant 5$), maar 4 en 5 of meer zijn te klein. Samen met 3 wordt het \textit{3 of meer}, met $E = 8{,}0$. Er blijven 4 categorieën: 0, 1, 2 en 3 of meer.
    - opgave: |-
        Hoeveel vrijheidsgraden heeft de toets als $\lambda = 1$ vooraf vastlag?
      antwoord: |-
        3
      uitwerking: |-
        $\vg = 4 - 1 = 3$.
    - opgave: |-
        En als $\lambda = 1$ het gemiddelde van de 100 minuten zelf is?
      antwoord: |-
        2
      uitwerking: |-
        Eén geschatte parameter: $\vg = 4 - 1 - 1 = 2$.

- id: h4-verwacht
  soort: kort
  opgave: |-
    Een school vraagt aan 200 leerlingen uit drie richtingen of ze in een sportclub zitten.

    \begin{center}\small\renewcommand{\arraystretch}{1.15}
    \begin{tabular}{|l|c|c|c|}\hline
     & sportclub & geen sportclub & totaal \\\hline
    Wetenschappen & 34 & 16 & 50 \\\hline
    Economie & 40 & 30 & 70 \\\hline
    Latijn & 46 & 34 & 80 \\\hline
    totaal & 120 & 80 & 200 \\\hline
    \end{tabular}
    \end{center}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de verwachte aantallen als richting en sportclub onafhankelijk zijn.
      antwoord: |-
        30, 20; 42, 28; 48, 32
      uitwerking: |-
        $E_{ij} = \frac{r_i c_j}{n}$: $\frac{50 \cdot 120}{200} = 30$ en $20$; $\frac{70 \cdot 120}{200} = 42$ en $28$; $\frac{80 \cdot 120}{200} = 48$ en $32$.
    - opgave: |-
        Hoeveel vrijheidsgraden heeft de tabel? Hoeveel verwachte aantallen moest je echt uitrekenen?
      antwoord: |-
        2; \ 2
      uitwerking: |-
        $(3 - 1)(2 - 1) = 2$. Ken je 30 en 42, dan volgt de rest uit de totalen: $48 = 120 - 30 - 42$, en de tweede kolom is telkens rijtotaal min de eerste.

- id: h4-onafh
  soort: kort
  opgave: |-
    Van 400 personen lieten er 240 zich vaccineren tegen griep. Van hen kregen er 18 griep; van de 160 anderen 22. Toets bij $\alpha = 0{,}05$ of griep en vaccinatie samenhangen.
  antwoord: |-
    $X^2 \approx 4{,}17$, p $\approx 0{,}041$: verwerpen
  uitwerking: |-
    Rijen: gevaccineerd (18 griep, 222 geen), niet gevaccineerd (22, 138). Kolomtotalen 40 en 360. $E = 24$, $216$, $16$, $144$, allemaal $\geqslant 5$. $X^2 = \frac{36}{24} + \frac{36}{216} + \frac{36}{16} + \frac{36}{144} = 1{,}5 + 0{,}167 + 2{,}25 + 0{,}25 \approx 4{,}17$, met $(2 - 1)(2 - 1) = 1$ vrijheidsgraad. p-waarde $\approx 0{,}041 \leqslant 0{,}05$: $H_0$ verwerpen. Bij gevaccineerden kreeg 7,5~\% griep, bij de anderen 13,75~\%.

