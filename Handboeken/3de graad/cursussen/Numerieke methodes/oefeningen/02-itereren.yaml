# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of beantwoord.
  lijst: enumerate
  delen:
    - opgave: |-
        De afgeleide van $f(x) = x - 0{,}5 \cos x$ en van $g(x) = \sqrt[3]{5 - 2x}$.
      antwoord: |-
        $1 + 0{,}5 \sin x$; $\dfrac{-2}{3\sqrt[3]{(5 - 2x)^2}}$
      uitwerking: |-
        $f'(x) = 1 + 0{,}5 \sin x$. $g(x) = (5 - 2x)^{1/3}$, dus met de kettingregel $g'(x) = \tfrac13 (5 - 2x)^{-2/3} \cdot (-2)$.
    - opgave: |-
        Een vergelijking van de raaklijn aan $y = x^2$ in $(3, 9)$, en het snijpunt van die raaklijn met de $x$-as.
      antwoord: |-
        $y = 6x - 9$; $(1{,}5;\ 0)$
      uitwerking: |-
        De richtingscoëfficiënt is $2 \cdot 3 = 6$: $y = 9 + 6(x - 3) = 6x - 9$. Stel $y = 0$: $x = 1{,}5$.
    - opgave: |-
        $\lim\limits_{n \to +\infty} 5 \cdot 0{,}8^n$ en $\lim\limits_{n \to +\infty} (-1{,}2)^n$.
      antwoord: |-
        0; bestaat niet
      uitwerking: |-
        $|0{,}8| < 1$, dus $0{,}8^n \to 0$. Bij $(-1{,}2)^n$ groeit de absolute waarde onbeperkt en wisselt het teken: geen limiet.
    - opgave: |-
        Los op: $x = 0{,}6\,x + 4$.
      antwoord: |-
        $x = 10$
      uitwerking: |-
        $0{,}4\,x = 4$, dus $x = 10$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad De vergelijking $x^3 + 2x - 5 = 0$ heeft één oplossing, bij $1{,}33$. Je kunt ze herschrijven als $x = g(x)$, met
    \[ g_1(x) = \frac{5 - x^3}{2}, \qquad g_2(x) = \sqrt[3]{5 - 2x}, \qquad g_3(x) = \frac{5}{x^2 + 2} . \]
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de oplossing van de vergelijking voldoet aan $x = g_1(x)$, aan $x = g_2(x)$ en aan $x = g_3(x)$.
      antwoord: |-
        telkens herleiden tot $x^3 + 2x - 5 = 0$
      uitwerking: |-
        $x = \frac{5 - x^3}{2} \Leftrightarrow 2x = 5 - x^3$. $x = \sqrt[3]{5 - 2x} \Leftrightarrow x^3 = 5 - 2x$. $x = \frac{5}{x^2 + 2} \Leftrightarrow x^3 + 2x = 5$. Telkens is dat $x^3 + 2x - 5 = 0$.
    - opgave: |-
        Begin bij $x_0 = 1{,}3$ en bereken telkens vijf termen van $x_{n+1} = g(x_n)$, voor elk van de drie functies.
      antwoord: |-
        $g_1$: weg; $g_2$: snel naar 1,328; $g_3$: traag zigzaggend
      uitwerking: |-
        $g_1$: 1,4015; 1,1236; 1,7908; $-0{,}3714$; 2,5256. $g_2$: 1,3389; 1,3243; 1,3298; 1,3277; 1,3285. $g_3$: 1,3550; 1,3034; 1,3518; 1,3064; 1,3489.
    - opgave: |-
        Wat valt op? Heb je een idee waaraan het ligt?
      antwoord: |-
        drie heel verschillende rijen
      uitwerking: |-
        Met $g_1$ vliegt de rij weg, met $g_2$ convergeert ze snel, met $g_3$ traag, en alle drie springen ze beurtelings boven en onder de oplossing. Het verschil zit in hoe steil de grafiek van $g$ is bij de oplossing (sectie 1).

- id: h2-dekpunt
  soort: kort
  opgave: |-
    De vergelijking $x^2 - x - 2 = 0$ heeft de oplossingen $-1$ en 2.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf ze op drie manieren als $x = g(x)$: met $x^2$ alleen links, met een vierkantswortel, en door te delen door $x$.
      antwoord: |-
        bv.\ $x = x^2 - 2$; $x = \sqrt{x + 2}$; $x = 1 + \frac2x$
      uitwerking: |-
        $x = x^2 - 2$ (breng $x$ naar links). $x^2 = x + 2$ geeft $x = \sqrt{x + 2}$ (alleen voor de positieve oplossing). Delen door $x$: $x - 1 - \frac2x = 0$, dus $x = 1 + \frac2x$.
    - opgave: |-
        Bereken vier termen van $x_{n+1} = \sqrt{x_n + 2}$ met $x_0 = 0$. Naar welk dekpunt gaat de rij?
      antwoord: |-
        $1{,}4142$; $1{,}8478$; $1{,}9616$; $1{,}9904$; naar 2
      uitwerking: |-
        $\sqrt 2 \approx 1{,}4142$, $\sqrt{3{,}4142} \approx 1{,}8478$, $\sqrt{3{,}8478} \approx 1{,}9616$, $\sqrt{3{,}9616} \approx 1{,}9904$: de rij stijgt naar 2.

- id: h2-aantrek
  soort: kort
  opgave: |-
    Is het dekpunt aantrekkend of afstotend? Zigzagt de rij of beweegt ze trapsgewijs?
  lijst: enumerate
  delen:
    - opgave: |-
        $g(x) = \sqrt{x + 2}$, dekpunt 2
      antwoord: |-
        aantrekkend, trapsgewijs
      uitwerking: |-
        $g'(x) = \frac{1}{2\sqrt{x + 2}}$, $g'(2) = \frac14$: $0 < g'(2) < 1$.
    - opgave: |-
        $g(x) = x^2 - 2$, dekpunten $-1$ en 2
      antwoord: |-
        allebei afstotend
      uitwerking: |-
        $g'(x) = 2x$: $g'(-1) = -2$ en $g'(2) = 4$, allebei met absolute waarde groter dan 1.
    - opgave: |-
        $g(x) = 1 + \frac2x$, dekpunten $-1$ en 2
      antwoord: |-
        2 aantrekkend (zigzag), $-1$ afstotend
      uitwerking: |-
        $g'(x) = -\frac{2}{x^2}$: $g'(2) = -\frac12$, aantrekkend met een zigzag; $g'(-1) = -2$, afstotend.

- id: h2-fout
  soort: kort
  opgave: |-
    Gegeven is $x_{n+1} = 1 + 0{,}4 \sin x_n$, met $x_0 = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de rij voor elke $x_0$ convergeert naar het enige dekpunt $L$. Hoeveel stappen zijn vanaf $x_0 = 1$ zeker genoeg voor een fout kleiner dan $10^{-6}$, als je weet dat $L \in [1, 2]$?
      antwoord: |-
        $|g'| \leqslant 0{,}4$; 16 stappen
      uitwerking: |-
        $g'(x) = 0{,}4 \cos x$, dus $|g'(x)| \leqslant 0{,}4$ voor alle $x$: de stelling geldt op elk interval. $|x_0 - L| \leqslant 1$, dus volstaat $0{,}4^n < 10^{-6}$, of $n > \frac{\log 10^{-6}}{\log 0{,}4} \approx 15{,}1$: 16 stappen.
    - opgave: |-
        Bereken $x_5$ en $x_6$, en geef met de foutschatting achteraf een foutgrens voor $x_6$.
      antwoord: |-
        $x_5 \approx 1{,}393\,745$, $x_6 \approx 1{,}393\,747$; foutgrens $1{,}1 \cdot 10^{-6}$
      uitwerking: |-
        $x_1 \approx 1{,}336\,588$, $x_2 \approx 1{,}389\,079$, $x_3 \approx 1{,}393\,414$, $x_4 \approx 1{,}393\,724$, $x_5 \approx 1{,}393\,745$, $x_6 \approx 1{,}393\,747$. $|x_6 - x_5| \approx 1{,}54 \cdot 10^{-6}$, dus $|x_6 - L| \leqslant \frac{0{,}4}{0{,}6} \cdot 1{,}54 \cdot 10^{-6} \approx 1{,}03 \cdot 10^{-6}$. De garantie van 16 stappen was veel te voorzichtig.

- id: h2-newton
  soort: kort
  opgave: |-
    Geef het voorschrift van Newton, en bereken $x_1$, $x_2$ en $x_3$.
  lijst: enumerate
  delen:
    - opgave: |-
        $x^3 - x - 1 = 0$, met $x_0 = 1$
      antwoord: |-
        $1{,}5$; $1{,}347\,826$; $1{,}325\,200$
      uitwerking: |-
        $x_{n+1} = x_n - \frac{x_n^3 - x_n - 1}{3x_n^2 - 1}$. $x_1 = 1 - \frac{-1}{2} = 1{,}5$, $x_2 \approx 1{,}347\,826$, $x_3 \approx 1{,}325\,200$. (De nulwaarde is $1{,}324\,718$.)
    - opgave: |-
        $\e^x + x = 2$, met $x_0 = 0$
      antwoord: |-
        $0{,}5$; $0{,}443\,852$; $0{,}442\,855$
      uitwerking: |-
        $f(x) = \e^x + x - 2$, $f'(x) = \e^x + 1$. $x_1 = 0 - \frac{-1}{2} = 0{,}5$, $x_2 \approx 0{,}443\,852$, $x_3 \approx 0{,}442\,855$. (De nulwaarde is $0{,}442\,854$.)

- id: h2-heron
  soort: kort
  opgave: |-
    Los op.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $\sqrt 7$ met de methode van Newton vanaf $x_0 = 3$, in drie stappen. Voorspel de fout van $x_1$ met de stelling over de vierkantswortel.
      antwoord: |-
        $2{,}666\,667$; $2{,}645\,833$; $2{,}645\,751\,3$; fout van $x_1 \approx 0{,}021$
      uitwerking: |-
        $x_{n+1} = \tfrac12\bigl(x_n + \tfrac{7}{x_n}\bigr)$: $x_1 = \frac83$, $x_2 = \frac{127}{48} \approx 2{,}645\,833$, $x_3 \approx 2{,}645\,751\,3$. Fout van $x_1$: $\frac{(3 - 2{,}6458)^2}{6} \approx 0{,}021$; inderdaad $2{,}6667 - 2{,}6458 = 0{,}021$.
    - opgave: |-
        Toon aan dat Newton voor $f(x) = x^3 - a$ het voorschrift $x_{n+1} = \frac13\bigl(2x_n + \frac{a}{x_n^2}\bigr)$ geeft. Bereken $\sqrt[3]{10}$ vanaf $x_0 = 2$ in drie stappen.
      antwoord: |-
        $2{,}166\,667$; $2{,}154\,504$; $2{,}154\,434\,7$
      uitwerking: |-
        $x - \frac{x^3 - a}{3x^2} = \frac{3x^3 - x^3 + a}{3x^2} = \frac{2x^3 + a}{3x^2} = \frac13\bigl(2x + \frac{a}{x^2}\bigr)$. $x_1 = \frac13(4 + 2{,}5) \approx 2{,}166\,667$, $x_2 \approx 2{,}154\,504$, $x_3 \approx 2{,}154\,434\,7$. ($\sqrt[3]{10} = 2{,}154\,434\,69\ldots$)

- id: h2-faal
  soort: kort
  opgave: |-
    Wat loopt er mis met de methode van Newton? Verklaar met een schets.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = x^3 - 3x$, met $x_0 = 1$
      antwoord: |-
        $f'(1) = 0$
      uitwerking: |-
        $f'(x) = 3x^2 - 3$, dus $f'(1) = 0$: de raaklijn in $(1, -2)$ is horizontaal en snijdt de $x$-as niet. De formule deelt door 0.
    - opgave: |-
        $f(x) = x\,\e^{-x}$, met $x_0 = 2$
      antwoord: |-
        $4$; $5{,}33$; $6{,}56$; weg van 0
      uitwerking: |-
        $f'(x) = (1 - x)\e^{-x}$, dus $x_{n+1} = x_n - \frac{x_n}{1 - x_n} = \frac{x_n^2}{x_n - 1}$. Vanaf 2: 4, $\frac{16}{3} \approx 5{,}33$, $6{,}56$, \ldots De grafiek nadert de $x$-as voor grote $x$, en de raaklijnen wijzen steeds verder naar rechts. De nulwaarde 0 vindt de rij nooit; de rij gaat naar $+\infty$.

- id: h2-snelheid
  soort: kort
  opgave: |-
    Convergeert de rij met deze fouten lineair of kwadratisch? Schat $k$ of $C$.
  lijst: enumerate
  delen:
    - opgave: |-
        $|e_n|$: $0{,}4$; $0{,}12$; $0{,}036$; $0{,}0108$; $0{,}003\,24$
      antwoord: |-
        lineair, $k = 0{,}3$
      uitwerking: |-
        $\frac{|e_{n+1}|}{|e_n|} = 0{,}3$ telkens: lineair met factor 0,3.
    - opgave: |-
        $|e_n|$: $0{,}3$; $0{,}045$; $0{,}001$; $5 \cdot 10^{-7}$
      antwoord: |-
        kwadratisch, $C \approx 0{,}5$
      uitwerking: |-
        $\frac{|e_{n+1}|}{|e_n|^2}$: $\frac{0{,}045}{0{,}09} = 0{,}5$; $\frac{0{,}001}{0{,}002\,025} \approx 0{,}49$; $\frac{5 \cdot 10^{-7}}{10^{-6}} = 0{,}5$. Het eerste quotiënt ($0{,}15$; $0{,}022$; $0{,}0005$) gaat naar 0.

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    itereren en een webgrafiek tekenen
  opgave: |-
    Gegeven is $x_{n+1} = \sqrt{x_n + 3}$ met $x_0 = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $x_1$ tot $x_4$ op vier decimalen.
      antwoord: |-
        $2$; $2{,}2361$; $2{,}2882$; $2{,}2997$
      uitwerking: |-
        $\sqrt 4 = 2$, $\sqrt 5 \approx 2{,}2361$, $\sqrt{5{,}2361} \approx 2{,}2882$, $\sqrt{5{,}2882} \approx 2{,}2997$.
    - opgave: |-
        Welke vergelijking los je zo op? Bereken de limiet exact.
      antwoord: |-
        $x^2 - x - 3 = 0$; $\frac{1 + \sqrt{13}}{2} \approx 2{,}3028$
      uitwerking: |-
        Een dekpunt voldoet aan $x = \sqrt{x + 3}$, dus $x^2 = x + 3$ met $x \geqslant 0$: $x = \frac{1 + \sqrt{13}}{2}$.
    - opgave: |-
        Teken de grafiek van $g(x) = \sqrt{x + 3}$ en de rechte $y = x$ op $[1;\ 2{,}6]$, en de webgrafiek van de eerste drie stappen. Is het een trap of een spiraal? Waarom?
      antwoord: |-
        een trap: $0 < g'(L) < 1$
      uitwerking: |-
        $g'(x) = \frac{1}{2\sqrt{x + 3}}$, en $g'(L) = \frac{1}{2L} \approx 0{,}22$: positief en kleiner dan 1. De webgrafiek is een trap die naar het snijpunt klimt.
        \figuren{\begin{tikzpicture}[x=2.2cm,y=2.2cm,font=\scriptsize]
          \draw[black!14,very thin,step=.25] (1,1) grid (2.5,2.5);
          \draw[->,grijs] (1,1) -- (2.6,1) node[right,text=black] {$x$};
          \draw[->,grijs] (1,1) -- (1,2.6) node[above,text=black] {$y$};
          \foreach \t in {1.5,2,2.5}{\node[below,inner sep=1.5pt] at (\t,1) {$\t$};\node[left,inner sep=1.5pt] at (1,\t) {$\t$};}
          \draw[grijs] (1,1) -- (2.5,2.5);
          \kromme{1}{2.5}{sqrt(\x+3)}
          \draw[fel!80!black,thick] (1,1) -- (1,2) -- (2,2) -- (2,2.2361) -- (2.2361,2.2361) -- (2.2361,2.2882) -- (2.2882,2.2882);
        \end{tikzpicture}}

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    Newton uitvoeren
  opgave: |-
    Los op met de methode van Newton. Geef het voorschrift en drie termen na $x_0$.
  lijst: enumerate
  delen:
    - opgave: |-
        $x \ln x = 1$, met $x_0 = 2$
      antwoord: |-
        $1{,}771\,848$; $1{,}763\,236$; $1{,}763\,223$
      uitwerking: |-
        $f(x) = x \ln x - 1$, $f'(x) = \ln x + 1$: $x_{n+1} = x_n - \frac{x_n \ln x_n - 1}{\ln x_n + 1}$. $x_1 \approx 1{,}771\,848$, $x_2 \approx 1{,}763\,236$, $x_3 \approx 1{,}763\,223$.
    - opgave: |-
        $x^5 = 100$, met $x_0 = 3$
      antwoord: |-
        $2{,}646\,914$; $2{,}524\,978$; $2{,}512\,021$
      uitwerking: |-
        $x_{n+1} = x_n - \frac{x_n^5 - 100}{5x_n^4} = \frac15\bigl(4x_n + \frac{100}{x_n^4}\bigr)$. $x_1 \approx 2{,}646\,914$, $x_2 \approx 2{,}524\,978$, $x_3 \approx 2{,}512\,021$. ($\sqrt[5]{100} \approx 2{,}511\,886$: de start 3 was wat ver.)
    - opgave: |-
        $\cos x = x$, met $x_0 = 0{,}7$
      antwoord: |-
        $0{,}739\,436$; $0{,}739\,085\,2$; $0{,}739\,085\,13$
      uitwerking: |-
        $f(x) = \cos x - x$, $f'(x) = -\sin x - 1$. $x_1 \approx 0{,}739\,436$, $x_2 \approx 0{,}739\,085\,16$, $x_3 \approx 0{,}739\,085\,13$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    dekpunten berekenen en onderzoeken
  opgave: |-
    Bepaal alle dekpunten exact, en onderzoek of ze aantrekkend of afstotend zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        $g(x) = \dfrac{x^2 + 1}{3}$
      antwoord: |-
        $\frac{3 - \sqrt5}{2}$ aantrekkend, $\frac{3 + \sqrt5}{2}$ afstotend
      uitwerking: |-
        $x = \frac{x^2 + 1}{3} \Leftrightarrow x^2 - 3x + 1 = 0 \Leftrightarrow x = \frac{3 \pm \sqrt 5}{2}$, dus 0,382 en 2,618. $g'(x) = \frac{2x}{3}$: $g'(0{,}382) \approx 0{,}25$ en $g'(2{,}618) \approx 1{,}75$.
    - opgave: |-
        $g(x) = \dfrac{6}{x + 1}$
      antwoord: |-
        2 aantrekkend; $-3$ afstotend
      uitwerking: |-
        $x(x + 1) = 6 \Leftrightarrow x^2 + x - 6 = 0 \Leftrightarrow x = 2$ of $x = -3$. $g'(x) = -\frac{6}{(x + 1)^2}$: $g'(2) = -\frac23$ (aantrekkend, zigzag), $g'(-3) = -\frac32$ (afstotend).
    - opgave: |-
        $g(x) = 2x - x^2$
      antwoord: |-
        0 afstotend; 1 aantrekkend
      uitwerking: |-
        $x = 2x - x^2 \Leftrightarrow x^2 - x = 0 \Leftrightarrow x \in \{0, 1\}$. $g'(x) = 2 - 2x$: $g'(0) = 2$ (afstotend) en $g'(1) = 0$ (aantrekkend, en zelfs heel snel).

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    lineaire en kwadratische convergentie in een tabel
  opgave: |-
    Een rij nadert $c = 2$. Hieronder staan de termen.
    \begin{center}\renewcommand{\arraystretch}{1.2}\begin{tabular}{c|ccccc}
    $n$ & 0 & 1 & 2 & 3 & 4 \\ \hline
    rij A & 2,5 & 2,2 & 2,08 & 2,032 & 2,0128 \\
    rij B & 2,5 & 2,1 & 2,003 & 2,000\,003 & 2,000\,000\,000\,003 \\
    \end{tabular}\end{center}
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de fouten en de quotiënten $\frac{|e_{n+1}|}{|e_n|}$ voor rij A. Welke soort convergentie?
      antwoord: |-
        lineair, $k = 0{,}4$
      uitwerking: |-
        Fouten 0,5; 0,2; 0,08; 0,032; 0,0128. De quotiënten zijn telkens 0,4.
    - opgave: |-
        Bereken de quotiënten $\frac{|e_{n+1}|}{|e_n|^2}$ voor rij B. Welke soort convergentie?
      antwoord: |-
        kwadratisch, $C \approx 0{,}3$ tot $0{,}4$
      uitwerking: |-
        Fouten 0,5; 0,1; 0,003; $3 \cdot 10^{-6}$; $3 \cdot 10^{-12}$. $\frac{0{,}1}{0{,}25} = 0{,}4$, $\frac{0{,}003}{0{,}01} = 0{,}3$, $\frac{3 \cdot 10^{-6}}{9 \cdot 10^{-6}} \approx 0{,}33$, $\frac{3 \cdot 10^{-12}}{9 \cdot 10^{-12}} \approx 0{,}33$: ongeveer constant, dus kwadratisch.
    - opgave: |-
        Hoeveel stappen heeft elke rij ongeveer nodig om 12 juiste decimalen te hebben?
      antwoord: |-
        A: ongeveer 31; B: 4
      uitwerking: |-
        Rij A: $0{,}5 \cdot 0{,}4^n < 5 \cdot 10^{-13}$ geeft $n > \frac{\log 10^{-12}}{\log 0{,}4} \approx 30{,}2$: ongeveer 31 stappen. Rij B heeft na 4 stappen een fout van $3 \cdot 10^{-12}$: bijna 12 decimalen.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    webgrafiek lezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=1.1cm,y=1.1cm,font=\scriptsize]
        \begin{scope}
          \draw[->,grijs] (0,0) -- (2.2,0); \draw[->,grijs] (0,0) -- (0,2.2);
          \draw[grijs] (0,0) -- (2.1,2.1);
          \kromme{0.2}{2}{1+0.75*(\x-1)-0.15*(\x-1)^2}
          \webgrafiek{1+0.75*(\x-1)-0.15*(\x-1)^2}{0.25}{5}
          \node at (1,-.3) {A};
        \end{scope}
        \begin{scope}[xshift=2.6cm]
          \draw[->,grijs] (0,0) -- (2.2,0); \draw[->,grijs] (0,0) -- (0,2.2);
          \draw[grijs] (0,0) -- (2.1,2.1);
          \kromme{0.35}{1.65}{1-1.25*(\x-1)}
          \webgrafiek{1-1.25*(\x-1)}{1.2}{4}
          \node at (1,-.3) {B};
        \end{scope}
      \end{tikzpicture}
  opgave: |-
    De figuren tonen de webgrafiek van twee iteraties $x_{n+1} = g(x_n)$, met de grafiek van $g$ en de rechte $y = x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Convergeert de rij in A? En in B?
      antwoord: |-
        A wel, B niet
      uitwerking: |-
        In A klimt de trap naar het snijpunt. In B draait de spiraal naar buiten, weg van het snijpunt.
    - opgave: |-
        Wat kun je zeggen over het teken en de grootte van $g'(L)$ in A en in B?
      antwoord: |-
        A: $0 < g'(L) < 1$; B: $g'(L) < -1$
      uitwerking: |-
        Een trap hoort bij een positieve helling, een spiraal bij een negatieve. In A wordt de trap kleiner: $|g'(L)| < 1$. In B wordt de spiraal groter: $|g'(L)| > 1$.
    - opgave: |-
        Iemand wil de vergelijking van B toch oplossen met de methode van de dekpunten. Hoe kan dat, als $g$ een dalende rechte is met $g'(L) = -1{,}25$?
      antwoord: |-
        herschrijf als $x = g^{-1}(x)$, met helling $-0{,}8$
      uitwerking: |-
        $x = g(x)$ betekent ook $g^{-1}(x) = x$: hetzelfde dekpunt is een dekpunt van de inverse functie. De grafiek van $g^{-1}$ is het spiegelbeeld om $y = x$, met helling $\frac{1}{-1{,}25} = -0{,}8$ in het dekpunt. Dat dekpunt is aantrekkend.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    middelwaardestelling van Lagrange
  opgave: |-
    Zoek alle $\xi$ uit de middelwaardestelling van Lagrange.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = x^2$ op $[1, 3]$
      antwoord: |-
        $\xi = 2$
      uitwerking: |-
        $\frac{9 - 1}{2} = 4 = 2\xi$, dus $\xi = 2$: het midden van het interval.
    - opgave: |-
        $f(x) = x^3$ op $[0, 2]$
      antwoord: |-
        $\xi = \frac{2}{\sqrt 3} \approx 1{,}155$
      uitwerking: |-
        $\frac{8 - 0}{2} = 4 = 3\xi^2$, dus $\xi = \frac{2}{\sqrt3}$ (de negatieve oplossing ligt niet in $\left]0, 2\right[$).
    - opgave: |-
        $f(x) = \sqrt x$ op $[1, 4]$
      antwoord: |-
        $\xi = \frac94$
      uitwerking: |-
        $\frac{2 - 1}{3} = \frac13 = \frac{1}{2\sqrt\xi}$, dus $\sqrt\xi = \frac32$ en $\xi = \frac94$.
    - opgave: |-
        $f(x) = |x|$ op $[-1, 2]$. Waarom is er geen $\xi$? Welke voorwaarde is niet voldaan?
      antwoord: |-
        $f$ is niet afleidbaar in 0
      uitwerking: |-
        De koorde heeft richtingscoëfficiënt $\frac{2 - 1}{3} = \frac13$, maar $f'(x)$ is $-1$ of $1$. De stelling vraagt dat $f$ afleidbaar is op $\left]-1, 2\right[$, en in 0 is dat niet zo.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    waar of vals: dekpunten en Newton
  opgave: |-
    Waar of vals? Verklaar, of geef een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        Elk dekpunt van $g$ is een nulwaarde van $f(x) = g(x) - x$.
      antwoord: |-
        waar
      uitwerking: |-
        $g(L) = L \Leftrightarrow g(L) - L = 0$.
    - opgave: |-
        Is $|g'(L)| < 1$, dan convergeert $x_{n+1} = g(x_n)$ naar $L$ voor elke startwaarde.
      antwoord: |-
        vals
      uitwerking: |-
        Alleen voor een startwaarde dicht genoeg bij $L$. Bij $g(x) = x^2$ is $g'(0) = 0$, maar vanaf $x_0 = 2$ gaat de rij naar $+\infty$.
    - opgave: |-
        Heeft $f$ een nulwaarde, dan vindt de methode van Newton ze vanuit elke startwaarde.
      antwoord: |-
        vals
      uitwerking: |-
        Bij $x^3 - 2x + 2$ vanaf 0 ontstaat een cyclus, en bij $\sqrt[3]x$ vliegt de rij weg vanuit elke start behalve 0.
    - opgave: |-
        De methode van Newton is een methode van de dekpunten.
      antwoord: |-
        waar
      uitwerking: |-
        Met $g(x) = x - \frac{f(x)}{f'(x)}$ is $x_{n+1} = g(x_n)$, en de nulwaarden van $f$ (met $f' \neq 0$) zijn de dekpunten van $g$.
    - opgave: |-
        Convergeert een methode kwadratisch, dan verdubbelt het aantal juiste decimalen ongeveer bij elke stap.
      antwoord: |-
        waar
      uitwerking: |-
        Is $|e_{n+1}| \approx C|e_n|^2$ en $|e_n| = 10^{-d}$, dan is $|e_{n+1}| \approx C \cdot 10^{-2d}$: ongeveer $2d$ decimalen (op $\log C$ na).

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    foutschatting achteraf bij $\cos x = x$
  opgave: |-
    We lossen $\cos x = x$ op met $x_{n+1} = \cos x_n$ en $x_0 = 0{,}7$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat alle termen in $[0{,}69;\ 0{,}8]$ liggen, en dat $|g'(x)| \leqslant 0{,}72$ op dat interval.
      antwoord: |-
        $\cos$ beeldt $[0{,}69;\ 0{,}8]$ af in $[0{,}696;\ 0{,}772]$; $\sin 0{,}8 < 0{,}72$
      uitwerking: |-
        $\cos$ daalt op $[0{,}69;\ 0{,}8]$, met $\cos 0{,}8 \approx 0{,}697$ en $\cos 0{,}69 \approx 0{,}771$. Het beeld van het interval ligt dus weer in het interval, en omdat $x_0 = 0{,}7$ erin ligt, liggen alle termen erin. $|g'(x)| = \sin x \leqslant \sin 0{,}8 \approx 0{,}717 < 0{,}72$.
    - opgave: |-
        Hoeveel stappen zijn nodig tot de foutschatting achteraf met $k = 0{,}72$ kleiner is dan $10^{-3}$? Wat is de echte fout dan?
      antwoord: |-
        14 stappen; echte fout $1{,}5 \cdot 10^{-4}$
      uitwerking: |-
        $\frac{k}{1 - k} = \frac{0{,}72}{0{,}28} \approx 2{,}57$. Bij $n = 14$ is $|x_{14} - x_{13}| \approx 3{,}8 \cdot 10^{-4}$, en $2{,}57 \cdot 3{,}8 \cdot 10^{-4} \approx 9{,}8 \cdot 10^{-4} < 10^{-3}$. De echte fout van $x_{14} \approx 0{,}738\,932$ is $1{,}5 \cdot 10^{-4}$.
    - opgave: |-
        Hoeveel stappen van Newton vanaf $x_0 = 0{,}7$ zijn nodig voor dezelfde nauwkeurigheid?
      antwoord: |-
        2
      uitwerking: |-
        $x_1 \approx 0{,}739\,436$ (fout $3{,}5 \cdot 10^{-4}$), $x_2 \approx 0{,}739\,085\,2$ (fout $3 \cdot 10^{-8}$).

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    delen zonder te delen (Newton voor $\frac1a$)
  opgave: |-
    Een processor kan snel optellen en vermenigvuldigen, maar delen is traag. Om $\frac1a$ te berekenen, gebruikt hij Newton op $f(x) = \frac1x - a$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het voorschrift $x_{n+1} = x_n\,(2 - a\,x_n)$ is: er komt geen deling in voor.
      antwoord: |-
        $x - \frac{1/x - a}{-1/x^2} = x + x - a x^2$
      uitwerking: |-
        $f'(x) = -\frac{1}{x^2}$, dus $x_{n+1} = x_n + x_n^2\bigl(\frac{1}{x_n} - a\bigr) = x_n + x_n - a x_n^2 = x_n(2 - a x_n)$.
    - opgave: |-
        Bereken $\frac17$ vanaf $x_0 = 0{,}1$ in vier stappen.
      antwoord: |-
        $0{,}13$; $0{,}1417$; $0{,}142\,847\,77$; $0{,}142\,857\,142$
      uitwerking: |-
        $x_1 = 0{,}1 \cdot (2 - 0{,}7) = 0{,}13$, $x_2 = 0{,}13 \cdot 1{,}09 = 0{,}1417$, $x_3 = 0{,}1417 \cdot 1{,}0081 \approx 0{,}142\,847\,77$, $x_4 \approx 0{,}142\,857\,142$.
    - opgave: |-
        Toon aan dat $\frac1a - x_{n+1} = a\,\bigl(\frac1a - x_n\bigr)^2$. Wat zegt dat over de snelheid?
      antwoord: |-
        kwadratische convergentie met $C = a$
      uitwerking: |-
        Stel $d = \frac1a - x_n$. Dan is $x_{n+1} = \bigl(\frac1a - d\bigr)(1 + a d) = \frac1a + d - d - a d^2 = \frac1a - a d^2$. De nieuwe fout is $a$ maal het kwadraat van de vorige.
    - opgave: |-
        Voor welke startwaarden convergeert de rij?
      antwoord: |-
        $0 < x_0 < \frac2a$
      uitwerking: |-
        Uit c volgt $a\bigl(\frac1a - x_{n+1}\bigr) = \bigl(a\bigl(\frac1a - x_n\bigr)\bigr)^2$: met $u_n = 1 - a x_n$ is $u_{n+1} = u_n^2$, dus $u_n = u_0^{2^n}$. Dat gaat naar 0 als $|u_0| < 1$, dus als $0 < x_0 < \frac2a$. Voor $a = 7$: $0 < x_0 < 0{,}2857$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    een uitgezette spoorstaaf (context)
  figuur:
    code: |-
      \begin{tikzpicture}[x=1cm,y=1cm,font=\scriptsize]
        \draw[grijs,thick] (0,0) -- (4,0);
        \draw[accent,thick] (0,0) arc[start angle=143.13,end angle=36.87,radius=2.5];
        \draw[grijs,dashed] (2,-1.5) -- (0,0) (2,-1.5) -- (4,0) (2,-1.5) -- (2,1);
        \draw[<->,fel!80!black] (2.12,0) -- (2.12,1) node[midway,right] {$h$};
        \node[below] at (1,0) {500};
        \node at (2,-1.75) {$M$};
        \draw[grijs] (2,-1.1) arc[start angle=90,end angle=36.87,radius=.4] node[midway,above right,inner sep=1pt] {$\theta$};
      \end{tikzpicture}
  opgave: |-
    Een spoorstaaf van 1000 m ligt vast aan beide uiteinden. Door de hitte zet ze 1 m uit, en buigt ze op als een cirkelboog (sterk overdreven in de figuur). Hoe hoog komt het midden?
  lijst: enumerate
  delen:
    - opgave: |-
        Noem $R$ de straal en $\theta$ de halve middelpuntshoek (in radialen). Toon aan dat $R\theta = 500{,}5$ en $R \sin\theta = 500$, en dus $\sin\theta = k\,\theta$ met $k = \frac{500}{500{,}5}$.
      antwoord: |-
        halve boog en halve koorde
      uitwerking: |-
        De halve boog heeft lengte $R\theta = 500{,}5$, de halve koorde is $R\sin\theta = 500$. Deel: $\frac{\sin\theta}{\theta} = \frac{500}{500{,}5}$.
    - opgave: |-
        Los $\sin\theta - k\theta = 0$ op met Newton vanaf $\theta_0 = 0{,}1$. Waarom is $\theta = 0$ geen goede start?
      antwoord: |-
        $\theta \approx 0{,}077\,433$; 0 is ook een (nutteloze) oplossing
      uitwerking: |-
        $\theta_{n+1} = \theta_n - \frac{\sin\theta_n - k\theta_n}{\cos\theta_n - k}$: 0,083\,316; 0,078\,002; 0,077\,439; 0,077\,432\,6. $\theta = 0$ is zelf een oplossing (een rechte staaf), en vlak bij 0 is $f'(\theta) = \cos\theta - k \approx 0$.
    - opgave: |-
        Bereken de hoogte $h = R\,(1 - \cos\theta)$. Had je dat verwacht?
      antwoord: |-
        $h \approx 19{,}4$ m
      uitwerking: |-
        $R = \frac{500}{\sin\theta} \approx 6464$ m, en $h = 6464\,(1 - \cos 0{,}077\,433) \approx 19{,}4$ m. Eén meter uitzetting geeft een bult van bijna 20 m: dat verklaart waarom spoorstaven met voegen of onder spanning gelegd worden.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    Newton bij een dubbele nulwaarde
  opgave: |-
    Neem $f(x) = (x - 1)^2$, met de dubbele nulwaarde 1.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken drie stappen van Newton vanaf $x_0 = 2$.
      antwoord: |-
        $1{,}5$; $1{,}25$; $1{,}125$
      uitwerking: |-
        $x_{n+1} = x_n - \frac{(x_n - 1)^2}{2(x_n - 1)} = x_n - \frac{x_n - 1}{2}$: 1,5; 1,25; 1,125.
    - opgave: |-
        Toon aan dat $x_{n+1} - 1 = \tfrac12(x_n - 1)$. Is de convergentie lineair of kwadratisch?
      antwoord: |-
        lineair met $k = \frac12$
      uitwerking: |-
        $x_{n+1} - 1 = (x_n - 1) - \frac{x_n - 1}{2} = \frac{x_n - 1}{2}$. Lineair met factor $\frac12$: niet sneller dan de intervalmiddens.
    - opgave: |-
        Toon aan dat Newton voor $f(x) = (x - c)^m$ lineair convergeert met factor $\frac{m - 1}{m}$.
      antwoord: |-
        $x_{n+1} - c = \frac{m - 1}{m}(x_n - c)$
      uitwerking: |-
        $\frac{f(x)}{f'(x)} = \frac{(x - c)^m}{m(x - c)^{m-1}} = \frac{x - c}{m}$, dus $x_{n+1} - c = (x_n - c) - \frac{x_n - c}{m} = \frac{m - 1}{m}(x_n - c)$.
    - opgave: |-
        Iemand stelt voor: $x_{n+1} = x_n - m\,\frac{f(x_n)}{f'(x_n)}$. Wat geeft dat bij $f(x) = (x - 1)^2$ met $m = 2$?
      antwoord: |-
        $x_1 = 1$: exact na één stap
      uitwerking: |-
        $x_1 = 2 - 2 \cdot \frac{1}{2} = 1$. Bij een nulwaarde met multipliciteit $m$ herstelt de factor $m$ de kwadratische convergentie (als je $m$ kent).

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    een peilstok voor een liggende tank (context)
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.9,font=\scriptsize]
        \begin{scope}
          \clip (-1.3,-1.3) rectangle (1.3,-0.4848);
          \fill[accent!30] (0,0) circle (1.2);
        \end{scope}
        \draw[accent,thick] (0,0) circle (1.2);
        \draw[accent!70] (-1.0977,-.4848) -- (1.0977,-.4848);
        \draw[grijs] (0,0) -- (-1.0977,-.4848) (0,0) -- (1.0977,-.4848);
        \draw[grijs] (203.83:.4) arc[start angle=203.83,end angle=336.17,radius=.4] node[midway,below,inner sep=1pt] {$\theta$};
        \draw[<->,fel!80!black] (1.45,-1.2) -- (1.45,-.4848) node[midway,right] {$h$};
        \fill (0,0) circle (1pt);
      \end{tikzpicture}
  opgave: |-
    Een liggende cilindrische tank met straal $r$ is voor een kwart gevuld. Het water vult een cirkelsegment met middelpuntshoek $\theta$ en oppervlakte $\tfrac12 r^2(\theta - \sin\theta)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\theta - \sin\theta = \frac{\pi}{2}$.
      antwoord: |-
        $\tfrac12 r^2(\theta - \sin\theta) = \tfrac14 \pi r^2$
      uitwerking: |-
        Een kwart van de doorsnede is $\frac14\pi r^2$. Gelijkstellen en vermenigvuldigen met $\frac{2}{r^2}$.
    - opgave: |-
        Iteer $\theta_{n+1} = \frac{\pi}{2} + \sin\theta_n$ vanaf $\theta_0 = 2$. Convergeert de rij? Hoe snel?
      antwoord: |-
        ja, traag en zigzaggend
      uitwerking: |-
        2; 2,4801; 2,1851; 2,3880; 2,2551; 2,3457; 2,2853; 2,3262; 2,2988; \ldots naar 2,3099. $g'(\theta) = \cos\theta$, en $\cos 2{,}31 \approx -0{,}67$: lineair met factor 0,67, en zigzaggend.
    - opgave: |-
        Los dezelfde vergelijking op met Newton vanaf $\theta_0 = 2$.
      antwoord: |-
        $2{,}339\,014$; $2{,}310\,063$; $2{,}309\,881\,5$
      uitwerking: |-
        $f(\theta) = \theta - \sin\theta - \frac{\pi}{2}$, $f'(\theta) = 1 - \cos\theta$. $\theta_1 \approx 2{,}339\,014$, $\theta_2 \approx 2{,}310\,063$, $\theta_3 \approx 2{,}309\,881\,5$. De oplossing is $2{,}309\,881\,46$.
    - opgave: |-
        De waterhoogte is $h = r\,(1 - \cos\frac{\theta}{2})$. Waar zet je op een peilstok het streepje \textit{een kwart vol}?
      antwoord: |-
        op $0{,}596\,r$, of 29,8\,\% van de diameter
      uitwerking: |-
        $1 - \cos 1{,}154\,94 \approx 0{,}596$. Het streepje staat op $0{,}596\,r = 0{,}298 \cdot 2r$: hoger dan een kwart van de diameter, omdat de tank onderaan smal is.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    elke herschrijving vindt één oplossing
  opgave: |-
    De vergelijking $x^2 - 3x + 1 = 0$ heeft de oplossingen $a \approx 0{,}382$ en $b \approx 2{,}618$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de methode van de dekpunten met $g_1(x) = \frac{x^2 + 1}{3}$ alleen $a$ kan vinden. Bereken vier termen vanaf $x_0 = 1$.
      antwoord: |-
        $g_1'(a) \approx 0{,}25$, $g_1'(b) \approx 1{,}75$; $0{,}6667$; $0{,}4815$; $0{,}4106$; $0{,}3895$
      uitwerking: |-
        $g_1'(x) = \frac{2x}{3}$: in $a$ aantrekkend, in $b$ afstotend. Vanaf 1: 0,6667; 0,4815; 0,4106; 0,3895, naar $a$.
    - opgave: |-
        Toon aan dat $g_2(x) = 3 - \frac1x$ alleen $b$ kan vinden. Bereken vier termen vanaf $x_0 = 1$.
      antwoord: |-
        $g_2'(b) \approx 0{,}15$, $g_2'(a) \approx 6{,}85$; 2; 2,5; 2,6; 2,6154
      uitwerking: |-
        $g_2'(x) = \frac{1}{x^2}$: $g_2'(b) \approx 0{,}146$ (aantrekkend), $g_2'(a) \approx 6{,}85$ (afstotend). Vanaf 1: 2; 2,5; 2,6; 2,6154, naar $b$.
    - opgave: |-
        Geef het voorschrift van Newton voor $x^2 - 3x + 1 = 0$. Bereken twee stappen vanaf $x_0 = 0$ en vanaf $x_0 = 3$. Welke methode vindt beide oplossingen?
      antwoord: |-
        $x_{n+1} = \frac{x_n^2 - 1}{2x_n - 3}$; $0{,}3333$; $0{,}3810$ en $2{,}6667$; $2{,}6190$; Newton
      uitwerking: |-
        $x - \frac{x^2 - 3x + 1}{2x - 3} = \frac{2x^2 - 3x - x^2 + 3x - 1}{2x - 3} = \frac{x^2 - 1}{2x - 3}$. Vanaf 0: $\frac13$, $\frac{1/9 - 1}{2/3 - 3} \approx 0{,}3810$, naar $a$. Vanaf 3: $\frac83$, $\frac{64/9 - 1}{16/3 - 3} \approx 2{,}6190$, naar $b$. Newton vindt beide, afhankelijk van de start: links van $1{,}5$ (de top van de parabool) vind je $a$, rechts ervan $b$. De dekpuntmethodes vinden er elk maar één.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    kortste afstand tot een parabool
  opgave: |-
    Welk punt van de parabool $y = x^2$ ligt het dichtst bij $P(2, 0)$?
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de $x$-coördinaat voldoet aan $2x^3 + x - 2 = 0$. Gebruik het kwadraat van de afstand.
      antwoord: |-
        $D(x) = (x - 2)^2 + x^4$, $D'(x) = 0$
      uitwerking: |-
        $D(x) = (x - 2)^2 + (x^2)^2$. $D'(x) = 2(x - 2) + 4x^3 = 2(2x^3 + x - 2)$. De afstand is het kleinst waar $D' = 0$ (en $D$ heeft maar één minimum, want $2x^3 + x - 2$ stijgt strikt).
    - opgave: |-
        Los die vergelijking op met Newton vanaf $x_0 = 1$, tot op $10^{-6}$.
      antwoord: |-
        $x \approx 0{,}835\,122$
      uitwerking: |-
        $x_{n+1} = x_n - \frac{2x_n^3 + x_n - 2}{6x_n^2 + 1}$: 0,857\,143; 0,835\,580; 0,835\,123; 0,835\,122\,35.
    - opgave: |-
        Geef het punt en de kleinste afstand.
      antwoord: |-
        $(0{,}8351;\ 0{,}6974)$; afstand $1{,}3577$
      uitwerking: |-
        $y = 0{,}835\,122^2 \approx 0{,}697\,43$. Afstand $\sqrt{(0{,}835\,12 - 2)^2 + 0{,}697\,43^2} \approx 1{,}3577$.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    $\pi$ met Newton: sneller dan kwadratisch
  opgave: |-
    Pas de methode van Newton toe op $f(x) = \sin x$ vanaf $x_0 = 3$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $x_{n+1} = x_n - \tan x_n$, en bereken $x_1$ en $x_2$ op tien decimalen.
      antwoord: |-
        $3{,}142\,546\,543\,1$; $3{,}141\,592\,653\,3$
      uitwerking: |-
        $\frac{\sin x}{\cos x} = \tan x$. $x_1 = 3 - \tan 3 \approx 3{,}142\,546\,543\,1$, $x_2 \approx 3{,}141\,592\,653\,3$.
    - opgave: |-
        Bereken de fouten $e_0$, $e_1$, $e_2$, en de quotiënten $\frac{|e_1|}{|e_0|^3}$ en $\frac{|e_2|}{|e_1|^3}$. Wat stel je vast?
      antwoord: |-
        $0{,}14$; $9{,}5 \cdot 10^{-4}$; $2{,}9 \cdot 10^{-10}$; beide ongeveer $\frac13$
      uitwerking: |-
        $e_0 \approx 0{,}1416$, $e_1 \approx 9{,}54 \cdot 10^{-4}$, $e_2 \approx 2{,}89 \cdot 10^{-10}$. $\frac{9{,}54 \cdot 10^{-4}}{0{,}1416^3} \approx 0{,}336$ en $\frac{2{,}89 \cdot 10^{-10}}{(9{,}54 \cdot 10^{-4})^3} \approx 0{,}333$. De fout is evenredig met de derde macht: het aantal decimalen verdrievoudigt.
    - opgave: |-
        In de tekst staat $x_{n+1} - c \approx \frac{f''(c)}{2f'(c)}(x_n - c)^2$. Verklaar daarmee waarom het hier zelfs sneller gaat dan kwadratisch.
      antwoord: |-
        $f''(\pi) = -\sin\pi = 0$
      uitwerking: |-
        $f''(x) = -\sin x$, dus $f''(\pi) = 0$: de term met $(x_n - c)^2$ valt weg, en de volgende orde blijft over. Dicht bij $\pi$ is de grafiek van $\sin$ bijna recht (een buigpunt), zodat de raaklijn de grafiek extra goed volgt.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    garantie vooraf en achteraf
  opgave: |-
    Gegeven is $x_{n+1} = 2 + 0{,}3 \sin x_n$, met $x_0 = 2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het dekpunt $L$ in $[1{,}7;\ 2{,}3]$ ligt, en dat de rij er altijd naar convergeert.
      antwoord: |-
        $2 + 0{,}3\sin x \in [1{,}7;\ 2{,}3]$; $|g'| \leqslant 0{,}3$
      uitwerking: |-
        Voor elke $x$ is $2 + 0{,}3 \sin x \in [1{,}7;\ 2{,}3]$: alle termen vanaf $x_1$, en dus ook het dekpunt, liggen daar. $|g'(x)| = 0{,}3|\cos x| \leqslant 0{,}3$: de stelling geldt met $k = 0{,}3$.
    - opgave: |-
        Hoeveel stappen zijn vooraf zeker genoeg voor een fout kleiner dan $10^{-8}$?
      antwoord: |-
        15
      uitwerking: |-
        $|x_0 - L| \leqslant 0{,}6$ (beide in $[1{,}7;\ 2{,}3]$), dus volstaat $0{,}6 \cdot 0{,}3^n < 10^{-8}$: $n > \frac{\log(10^{-8}/0{,}6)}{\log 0{,}3} \approx 14{,}9$, dus 15 stappen.
    - opgave: |-
        Bereken de termen tot de foutschatting achteraf kleiner is dan $10^{-8}$. Hoeveel stappen waren er echt nodig?
      antwoord: |-
        na 11 stappen; $L \approx 2{,}236\,031\,5$
      uitwerking: |-
        $x_1 \approx 2{,}272\,789$, $x_2 \approx 2{,}229\,067$, $x_3 \approx 2{,}237\,315$, $x_4 \approx 2{,}235\,794$, \ldots, $x_{10} \approx 2{,}236\,031\,486$, $x_{11} \approx 2{,}236\,031\,497$. Met $\frac{k}{1-k} = \frac{0{,}3}{0{,}7}$ is de schatting achteraf $2{,}6 \cdot 10^{-8}$ bij $n = 10$ en $4{,}9 \cdot 10^{-9}$ bij $n = 11$. Dicht bij $L$ is $|g'(L)| = 0{,}3\,|\cos 2{,}236| \approx 0{,}19$: de fout krimpt sneller dan de garantie met $k = 0{,}3$ voorspelt.

- id: h2-o17
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs: de methode van Heron convergeert altijd
  opgave: |-
    Neem $a > 0$, $x_0 > 0$ en $x_{n+1} = \frac12\bigl(x_n + \frac{a}{x_n}\bigr)$. Gebruik de stelling over de fout bij de vierkantswortel.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $x_n \geqslant \sqrt a$ voor elke $n \geqslant 1$.
      antwoord: |-
        $x_{n} - \sqrt a = \frac{(x_{n-1} - \sqrt a)^2}{2x_{n-1}} \geqslant 0$
      uitwerking: |-
        Alle termen zijn positief (een gemiddelde van twee positieve getallen). In de formule is de teller een kwadraat en de noemer positief, dus $x_n - \sqrt a \geqslant 0$ voor $n \geqslant 1$.
    - opgave: |-
        Toon aan dat $0 \leqslant x_{n+1} - \sqrt a \leqslant \tfrac12\,(x_n - \sqrt a)$ voor $n \geqslant 1$.
      antwoord: |-
        $\frac{x_n - \sqrt a}{2x_n} \leqslant \frac12$
      uitwerking: |-
        $x_{n+1} - \sqrt a = (x_n - \sqrt a) \cdot \frac{x_n - \sqrt a}{2x_n}$, en $0 \leqslant x_n - \sqrt a \leqslant x_n$, dus de tweede factor ligt tussen 0 en $\frac12$.
    - opgave: |-
        Besluit dat de rij voor elke $x_0 > 0$ naar $\sqrt a$ convergeert. Wat gebeurt er als $x_0 < 0$?
      antwoord: |-
        $0 \leqslant x_n - \sqrt a \leqslant \frac{x_1 - \sqrt a}{2^{n-1}} \to 0$; naar $-\sqrt a$
      uitwerking: |-
        Met inductie is $0 \leqslant x_n - \sqrt a \leqslant \frac{x_1 - \sqrt a}{2^{n-1}}$, en dat gaat naar 0 (insluitstelling). Is $x_0 < 0$, dan zijn alle termen negatief, en de rij $-x_n$ voldoet aan hetzelfde voorschrift: ze gaat naar $-\sqrt a$.

- id: h2-o18
  soort: opdracht
  niveau: 3
  thema: |-
    Newton bij $\bgtan x$: een kritieke startwaarde
  opgave: |-
    We passen Newton toe op $f(x) = \bgtan x$, met als enige nulwaarde 0.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $x_{n+1} = x_n - (1 + x_n^2)\bgtan x_n$, en bereken vier termen vanaf $x_0 = 1$ en vanaf $x_0 = 1{,}5$.
      antwoord: |-
        vanaf 1: naar 0; vanaf 1,5: weg
      uitwerking: |-
        $f'(x) = \frac{1}{1 + x^2}$. Vanaf 1: $-0{,}5708$; $0{,}1169$; $-0{,}0011$; $8 \cdot 10^{-10}$. Vanaf 1,5: $-1{,}6941$; $2{,}3211$; $-5{,}1141$; $32{,}2957$.
    - opgave: |-
        Er is een startwaarde $x^* > 0$ waarvoor $x_1 = -x^*$. Wat gebeurt er dan? Toon aan dat $x^*$ voldoet aan $(1 + x^2)\bgtan x = 2x$.
      antwoord: |-
        een cyclus $x^*, -x^*, x^*, \ldots$
      uitwerking: |-
        Omdat $\bgtan$ oneven is, geeft $-x^*$ dan weer $x^*$: de rij springt heen en weer. $x_1 = -x^*$ betekent $x^* - (1 + x^{*2})\bgtan x^* = -x^*$, dus $(1 + x^{*2})\bgtan x^* = 2x^*$.
    - opgave: |-
        Bepaal $x^*$ met de methode van de intervalmiddens op $[1, 2]$ tot op 0,01. Wat gebeurt er met Newton als $|x_0| < x^*$, en als $|x_0| > x^*$?
      antwoord: |-
        $x^* \approx 1{,}39$
      uitwerking: |-
        Neem $h(x) = (1 + x^2)\bgtan x - 2x$: $h(1) = 2 \cdot 0{,}785 - 2 < 0$, $h(2) = 5 \cdot 1{,}107 - 4 > 0$. Zes stappen geven $x^* \approx 1{,}39$ (precies: $1{,}3917$). Voor $|x_0| < x^*$ worden de termen in absolute waarde kleiner en gaat de rij naar 0; voor $|x_0| > x^*$ worden ze groter en vliegt de rij weg. Bij 1,5 zat je dus net aan de verkeerde kant.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    de secantmethode
  opgave: |-
    De \textit{secantmethode} lijkt op de regula falsi, maar houdt geen tekenwissel bij: ze trekt de koorde door de laatste twee benaderingen,
    \[ x_{n+1} = x_n - f(x_n)\,\frac{x_n - x_{n-1}}{f(x_n) - f(x_{n-1})} . \]
  lijst: enumerate
  delen:
    - opgave: |-
        Waar komt deze formule vandaan? Vergelijk met de formule van Newton.
      antwoord: |-
        $f'(x_n)$ vervangen door de helling van een koorde
      uitwerking: |-
        Het is de nulwaarde van de koorde door $(x_{n-1}, f(x_{n-1}))$ en $(x_n, f(x_n))$. In de formule van Newton is $f'(x_n)$ vervangen door het differentiequotiënt $\frac{f(x_n) - f(x_{n-1})}{x_n - x_{n-1}}$.
    - opgave: |-
        Pas ze toe op $x^3 - 2x - 5 = 0$ met $x_0 = 2$ en $x_1 = 3$. Bereken $x_2$ tot $x_5$.
      antwoord: |-
        $2{,}058\,824$; $2{,}081\,264$; $2{,}094\,824$; $2{,}094\,549$
      uitwerking: |-
        $f(2) = -1$, $f(3) = 16$: $x_2 = 3 - 16 \cdot \frac{1}{17} \approx 2{,}058\,824$. Daarna $x_3 \approx 2{,}081\,264$, $x_4 \approx 2{,}094\,824$, $x_5 \approx 2{,}094\,549$, $x_6 \approx 2{,}094\,551\,48$.
    - opgave: |-
        Per stap berekent de secantmethode één nieuwe functiewaarde, Newton twee ($f$ en $f'$). Welke methode is per functiewaarde sneller, als je weet dat de fout bij de secantmethode zich gedraagt als $|e_{n+1}| \approx C\,|e_n|^{1{,}618}$?
      antwoord: |-
        de secantmethode
      uitwerking: |-
        Twee stappen van de secantmethode kosten evenveel als één stap Newton, en geven een orde $1{,}618^2 \approx 2{,}618 > 2$. Per functiewaarde is de secantmethode dus sneller. (Het getal 1,618 is de gulden snede, $\frac{1 + \sqrt 5}{2}$; ze duikt op omdat de fouten zich gedragen als de rij van Fibonacci.)

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    de constante van de kwadratische convergentie nagaan
  opgave: |-
    Voor Newton geldt dicht bij een nulwaarde $c$ met $f'(c) \neq 0$: $x_{n+1} - c \approx \frac{f''(c)}{2f'(c)}\,(x_n - c)^2$. Ga dat na voor $f(x) = x^3 - 2x - 5$, met $c \approx 2{,}094\,551\,48$ en $x_0 = 2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $x_1$, $x_2$, $x_3$ en de fouten $e_1$, $e_2$, $e_3$.
      antwoord: |-
        $e_1 \approx 5{,}45 \cdot 10^{-3}$, $e_2 \approx 1{,}66 \cdot 10^{-5}$, $e_3 \approx 1{,}6 \cdot 10^{-10}$
      uitwerking: |-
        $x_1 = 2{,}1$, $x_2 \approx 2{,}094\,568\,12$, $x_3 \approx 2{,}094\,551\,482$. De fouten: $0{,}005\,449$; $1{,}664 \cdot 10^{-5}$; $1{,}56 \cdot 10^{-10}$.
    - opgave: |-
        Bereken $\frac{e_2}{e_1^2}$ en $\frac{e_3}{e_2^2}$, en $\frac{f''(c)}{2f'(c)}$.
      antwoord: |-
        $0{,}561$; $0{,}563$; $0{,}563$
      uitwerking: |-
        $\frac{1{,}664 \cdot 10^{-5}}{(0{,}005\,449)^2} \approx 0{,}561$ en $\frac{1{,}56 \cdot 10^{-10}}{(1{,}664 \cdot 10^{-5})^2} \approx 0{,}563$. $f''(c) = 6c \approx 12{,}567$, $f'(c) = 3c^2 - 2 \approx 11{,}161$: $\frac{12{,}567}{22{,}323} \approx 0{,}563$.
    - opgave: |-
        Verklaar met een schets: waarom hangt de constante af van $f''$ en van $f'$?
      antwoord: |-
        $f''$: hoe sterk de grafiek van de raaklijn afwijkt; $f'$: hoe steil
      uitwerking: |-
        De raaklijn wijkt af van de grafiek door de kromming, gemeten door $f''$: hoe meer kromming, hoe verder het voetpunt van de raaklijn naast de nulwaarde. Die afwijking in de verticale richting wordt omgezet in een fout op $x$ door te delen door de helling $f'$: hoe steiler de grafiek, hoe kleiner de fout op $x$.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    de vergelijking van Kepler bij een komeet
  opgave: |-
    Een komeet beweegt in een ellips met excentriciteit $e = 0{,}97$. Kort na zijn passage dicht bij de zon geldt $x - 0{,}97 \sin x = 0{,}1$.
  lijst: enumerate
  delen:
    - opgave: |-
        De oplossing is $L \approx 0{,}787$. Hoe snel convergeert de methode van de dekpunten met $x = 0{,}1 + 0{,}97 \sin x$? Hoeveel stappen verwacht je voor een fout van $10^{-6}$, vanaf $x_0 = 0{,}1$?
      antwoord: |-
        factor $\approx 0{,}68$; ongeveer 40 stappen
      uitwerking: |-
        $g'(L) = 0{,}97 \cos 0{,}787 \approx 0{,}685$. De fout krimpt per stap met ongeveer 0,685: van ongeveer 0,7 naar $10^{-6}$ vraagt $n \approx \frac{\log(10^{-6}/0{,}7)}{\log 0{,}685} \approx 36$. Een computer heeft er 40 nodig.
    - opgave: |-
        Pas Newton toe vanaf $x_0 = 0{,}1$. Waarom springt $x_1$ zo ver?
      antwoord: |-
        $x_1 \approx 2{,}88$: $f'(0{,}1) \approx 0{,}035$
      uitwerking: |-
        $f(x) = x - 0{,}97\sin x - 0{,}1$, $f'(x) = 1 - 0{,}97\cos x$. In 0,1 is $f'(0{,}1) \approx 0{,}035$: de raaklijn is bijna horizontaal. $x_1 \approx 2{,}879$, daarna 1,574; 1,072; 0,848; 0,791; 0,786\,99: zeven stappen.
    - opgave: |-
        Pas Newton toe vanaf $x_0 = 1$. Welke les trek je voor het kiezen van een startwaarde?
      antwoord: |-
        vier stappen; start waar $f'$ niet klein is
      uitwerking: |-
        0,823\,972; 0,788\,385; 0,786\,975; 0,786\,972\,7. Een startwaarde waar $f'$ klein is, stuurt de rij ver weg; wie eerst de grafiek bekijkt of een paar stappen van de intervalmiddens zet, wint tijd.

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: discreet
    onderwerp: |-
      Rijen
  opgave: |-
    In de cursus Rijen zag je het discrete dynamische proces $u_n = a\,u_{n-1} + b$, met evenwicht $L = \frac{b}{1 - a}$ als $|a| < 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat dit de methode van de dekpunten is voor een functie $g$. Wat is het dekpunt van $g$?
      antwoord: |-
        $g(x) = ax + b$; $L = \frac{b}{1-a}$
      uitwerking: |-
        $u_n = g(u_{n-1})$ met $g(x) = ax + b$. Een dekpunt voldoet aan $L = aL + b$, dus $L = \frac{b}{1 - a}$ (als $a \neq 1$): het evenwicht.
    - opgave: |-
        Wat zegt de convergentiestelling over $g$? Vergelijk met de voorwaarde uit de cursus Rijen.
      antwoord: |-
        $g'(x) = a$: convergentie als $|a| < 1$
      uitwerking: |-
        $|g'(x)| = |a|$ overal. Is $|a| < 1$, dan geldt de stelling met $k = |a|$ op heel $\R$: dezelfde voorwaarde als in Rijen.
    - opgave: |-
        Voor een rechte is de afschatting $|u_n - L| \leqslant k^n|u_0 - L|$ zelfs een gelijkheid. Toon dat aan, en controleer met het zwembad $u_n = 0{,}8\,u_{n-1} + 50$, $u_0 = 400$.
      antwoord: |-
        $u_n - L = a^n(u_0 - L)$; $u_n = 250 + 150 \cdot 0{,}8^n$
      uitwerking: |-
        $u_n - L = a\,u_{n-1} + b - (aL + b) = a(u_{n-1} - L)$, dus $u_n - L = a^n(u_0 - L)$ en $|u_n - L| = |a|^n|u_0 - L|$. Zwembad: $L = 250$ en $u_n - 250 = 0{,}8^n \cdot 150$.

- id: h2-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    De vergelijking $z^2 + 1 = 0$ heeft geen reële oplossingen, maar wel de complexe $i$ en $-i$. De methode van Newton werkt ook met complexe getallen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het voorschrift $z_{n+1} = \frac12\bigl(z_n - \frac{1}{z_n}\bigr)$ is.
      antwoord: |-
        $z - \frac{z^2 + 1}{2z}$
      uitwerking: |-
        $z - \frac{z^2 + 1}{2z} = \frac{2z^2 - z^2 - 1}{2z} = \frac{z^2 - 1}{2z} = \frac12\bigl(z - \frac1z\bigr)$.
    - opgave: |-
        Bereken vijf termen vanaf $z_0 = 2$. Waarom kan deze rij nooit convergeren?
      antwoord: |-
        $0{,}75$; $-0{,}2917$; $1{,}5685$; $0{,}4654$; $-0{,}8415$
      uitwerking: |-
        Vanaf een reële start blijven alle termen reëel. Als de rij convergeerde, dan naar een nulwaarde van $z^2 + 1$ (een dekpunt), en er is geen reële. De termen springen grillig heen en weer.
    - opgave: |-
        Bereken $z_1$ en $z_2$ vanaf $z_0 = 1 + i$. Naar welke oplossing gaat de rij?
      antwoord: |-
        $z_1 = 0{,}25 + 0{,}75i$; $z_2 = -0{,}075 + 0{,}975i$; naar $i$
      uitwerking: |-
        $\frac{1}{1 + i} = \frac{1 - i}{2}$, dus $z_1 = \frac12\bigl(1 + i - \frac12 + \frac i2\bigr) = 0{,}25 + 0{,}75i$. Met $\frac{1}{z_1} = \frac{0{,}25 - 0{,}75i}{0{,}625} = 0{,}4 - 1{,}2i$ is $z_2 = \frac12(-0{,}15 + 1{,}95i) = -0{,}075 + 0{,}975i$. Daarna $0{,}0017 + 0{,}9973i$: de rij gaat naar $i$. (Elke start in het bovenhalfvlak gaat naar $i$, elke start in het onderhalfvlak naar $-i$.)

- id: h2-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Exponentiële en logaritmische functies
  opgave: |-
    De vergelijking $x\,\e^x = 1$ heeft één oplossing $L \approx 0{,}5671$. Je kunt ze schrijven als $x = \e^{-x}$ of als $x = -\ln x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $g_1(x) = \e^{-x}$ en $g_2(x) = -\ln x$ elkaars inverse zijn.
      antwoord: |-
        $y = \e^{-x} \Leftrightarrow x = -\ln y$
      uitwerking: |-
        $y = \e^{-x} \Leftrightarrow -x = \ln y \Leftrightarrow x = -\ln y$, voor $y > 0$.
    - opgave: |-
        Bereken $g_1'(L)$ en $g_2'(L)$. Welke iteratie vindt $L$?
      antwoord: |-
        $-L \approx -0{,}567$ en $-\frac1L \approx -1{,}763$; alleen $g_1$
      uitwerking: |-
        $g_1'(L) = -\e^{-L} = -L \approx -0{,}567$: aantrekkend. $g_2'(L) = -\frac{1}{L} \approx -1{,}763$: afstotend. Vanaf 0,5 geeft $g_2$: 0,6931; 0,3665; 1,0037; $-0{,}0037$, en dan bestaat $\ln$ niet meer.
    - opgave: |-
        Verklaar met de grafieken: waarom is het product van de twee hellingen 1?
      antwoord: |-
        spiegeling om $y = x$
      uitwerking: |-
        De grafiek van een inverse functie is het spiegelbeeld om $y = x$. Een raaklijn met helling $m$ wordt gespiegeld tot een raaklijn met helling $\frac1m$, en het dekpunt ligt op de spiegelas. Zo is $g_1'(L) \cdot g_2'(L) = (-L) \cdot \bigl(-\frac1L\bigr) = 1$: als het ene dekpunt aantrekt, stoot het andere af.

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    De vergelijking $x^2 - 5x + 3 = 0$ wordt geschreven als $x = \frac{x^2 + 3}{5}$. Bepaal de dekpunten exact. Welk dekpunt vindt de methode van de dekpunten, en zigzagt de rij of niet?
  antwoord: |-
    $\frac{5 \pm \sqrt{13}}{2}$; alleen $\frac{5 - \sqrt{13}}{2} \approx 0{,}697$, zonder zigzag
  uitwerking: |-
    De dekpunten zijn de oplossingen: $\frac{5 \pm \sqrt{13}}{2}$, dus 0,697 en 4,303. $g'(x) = \frac{2x}{5}$: $g'(0{,}697) \approx 0{,}28$ (aantrekkend, positief: een trap) en $g'(4{,}303) \approx 1{,}72$ (afstotend).

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Bereken $x_1$ tot $x_5$ voor $x_{n+1} = 1 + \frac{1}{x_n}$ met $x_0 = 1$. Welke vergelijking los je op, en waarom convergeert de rij?
  antwoord: |-
    2; 1,5; 1,6667; 1,6; 1,625; $x^2 - x - 1 = 0$; $|g'(L)| \approx 0{,}38$
  uitwerking: |-
    $x = 1 + \frac1x \Leftrightarrow x^2 = x + 1$: de gulden snede $L = \frac{1 + \sqrt 5}{2} \approx 1{,}618$. $g'(x) = -\frac{1}{x^2}$, dus $g'(L) \approx -0{,}38$: aantrekkend, met een zigzag.

- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    Leid de formule van Newton af uit de vergelijking van de raaklijn. Pas ze daarna toe op $x^3 - x - 1 = 0$ vanaf $x_0 = 1{,}5$, in drie stappen.
  antwoord: |-
    $x_{n+1} = x_n - \frac{f(x_n)}{f'(x_n)}$; $1{,}347\,826$; $1{,}325\,200$; $1{,}324\,718$
  uitwerking: |-
    De raaklijn in $(x_n, f(x_n))$ is $y = f(x_n) + f'(x_n)(x - x_n)$; $y = 0$ geeft $x = x_n - \frac{f(x_n)}{f'(x_n)}$. Met $f'(x) = 3x^2 - 1$: $x_1 = 1{,}5 - \frac{0{,}875}{5{,}75} \approx 1{,}347\,826$, $x_2 \approx 1{,}325\,200$, $x_3 \approx 1{,}324\,718$.

- id: h2-t4
  soort: test
  niveau: 2
  opgave: |-
    Toon aan dat $x_{n+1} = 1 + 0{,}5 \cos x_n$ voor elke startwaarde convergeert. Hoeveel stappen zijn zeker genoeg voor een fout kleiner dan $10^{-6}$, als $|x_0 - L| \leqslant 1$?
  antwoord: |-
    $|g'(x)| \leqslant 0{,}5$; 20 stappen
  uitwerking: |-
    $g'(x) = -0{,}5 \sin x$, dus $|g'(x)| \leqslant 0{,}5 < 1$ overal. $|x_n - L| \leqslant 0{,}5^n$, en $0{,}5^n < 10^{-6}$ geeft $n > \frac{-6}{\log 0{,}5} \approx 19{,}9$: 20 stappen.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Wat gebeurt er met de methode van Newton? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        $f(x) = x^3 - 2x + 2$ vanaf $x_0 = 0$
      antwoord: |-
        een cyclus 0, 1, 0, 1, \ldots
      uitwerking: |-
        $x_1 = 0 - \frac{2}{-2} = 1$ en $x_2 = 1 - \frac{1}{1} = 0$: de raaklijnen in 0 en 1 wijzen elkaars voetpunt aan.
    - opgave: |-
        $f(x) = (x - 2)^2$ vanaf $x_0 = 3$
      antwoord: |-
        convergeert, maar lineair met factor $\frac12$
      uitwerking: |-
        2 is een dubbele nulwaarde, dus ook $f'(2) = 0$. $x_{n+1} - 2 = \frac12(x_n - 2)$: 2,5; 2,25; 2,125; \ldots

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Twee methodes geven deze fouten. Convergeren ze lineair of kwadratisch? Schat $k$ of $C$.
  lijst: enumerate
  delen:
    - opgave: |-
        $0{,}1$; $0{,}03$; $0{,}009$; $0{,}0027$
      antwoord: |-
        lineair, $k = 0{,}3$
      uitwerking: |-
        $\frac{|e_{n+1}|}{|e_n|} = 0{,}3$ telkens.
    - opgave: |-
        $0{,}1$; $0{,}02$; $0{,}0008$; $1{,}28 \cdot 10^{-6}$
      antwoord: |-
        kwadratisch, $C = 2$
      uitwerking: |-
        $\frac{0{,}02}{0{,}01} = 2$, $\frac{0{,}0008}{0{,}0004} = 2$, $\frac{1{,}28 \cdot 10^{-6}}{6{,}4 \cdot 10^{-7}} = 2$.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Bereken $\sqrt{7}$ met de methode van Newton vanaf $x_0 = 2{,}5$, in twee stappen. Voorspel met de stelling over de vierkantswortel de fout van $x_2$, zonder $\sqrt 7$ te gebruiken.
  antwoord: |-
    $x_1 = 2{,}65$; $x_2 \approx 2{,}645\,755$; fout $\approx 3{,}4 \cdot 10^{-6}$
  uitwerking: |-
    $x_1 = \frac12\bigl(2{,}5 + \frac{7}{2{,}5}\bigr) = 2{,}65$, $x_2 = \frac12\bigl(2{,}65 + \frac{7}{2{,}65}\bigr) \approx 2{,}645\,755$. De fout van $x_1$ is ongeveer $x_1 - x_2 \approx 0{,}0042$ (want $x_2$ is veel nauwkeuriger). Dan is de fout van $x_2$ ongeveer $\frac{0{,}0042^2}{2 \cdot 2{,}65} \approx 3{,}4 \cdot 10^{-6}$. (Echt: $2{,}645\,755 - 2{,}645\,751 = 3{,}4 \cdot 10^{-6}$.)
