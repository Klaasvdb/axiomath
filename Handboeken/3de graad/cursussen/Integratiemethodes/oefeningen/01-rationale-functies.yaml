# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of werk uit.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        ontbind $x^2 - x - 6$
      antwoord: |-
        $(x-3)(x+2)$
      uitwerking: |-
        Som $1$, product $-6$: de nulwaarden zijn 3 en $-2$.
    - opgave: |-
        zet op gelijke noemer: $\dfrac{2}{x - 1} - \dfrac{1}{x + 2}$
      antwoord: |-
        $\dfrac{x+5}{(x-1)(x+2)}$
      uitwerking: |-
        $2(x+2)-(x-1)=x+5$.
    - opgave: |-
        deel $x^2 + 3x + 1$ door $x + 1$
      antwoord: |-
        quotiënt $x+2$, rest $-1$
      uitwerking: |-
        $x^2+3x+1=(x+1)(x+2)-1$.
    - opgave: |-
        $\ig \dfrac{1}{x - 3}\dx$
      antwoord: |-
        $\ln|x-3|+C$
      uitwerking: |-
        Een lineaire binnenste functie met $a=1$.
    - opgave: |-
        $\ig \dfrac{1}{x^2 + 9}\dx$
      antwoord: |-
        $\tfrac13\bgtan\tfrac x3+C$
      uitwerking: |-
        De standaardvorm met $a=3$.
    - opgave: |-
        splits het kwadraat af in $x^2 + 4x + 13$
      antwoord: |-
        $(x+2)^2+9$
      uitwerking: |-
        $x^2+4x+4+9$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Hoe integreer je $\dfrac{2}{x^2 - 1}$?
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{1}{x - 1} - \dfrac{1}{x + 1} = \dfrac{2}{x^2 - 1}$.
      antwoord: |-
        op gelijke noemer
      uitwerking: |-
        $\dfrac{(x+1)-(x-1)}{(x-1)(x+1)}=\dfrac{2}{x^2-1}$.
    - opgave: |-
        Bereken $\ig_2^3 \dfrac{2}{x^2 - 1}\dx$.
      antwoord: |-
        $\ln\tfrac32$
      uitwerking: |-
        $\bigl[\ln|x-1|-\ln|x+1|\bigr]_2^3=(\ln2-\ln4)-(0-\ln3)=\ln\tfrac32\approx0{,}405$.
    - opgave: |-
        Iemand stelt $u = x^2 - 1$. Waarom helpt dat niet?
      antwoord: |-
        $x$ ontbreekt in de teller
      uitwerking: |-
        $\mathrm{d}u=2x\dx$, maar in de teller staat geen $x$: er blijft een $x$ over na de substitutie.
    - opgave: |-
        Zoek getallen $A$ en $B$ met $\dfrac{4}{x^2 - 4} = \dfrac{A}{x - 2} + \dfrac{B}{x + 2}$.
      antwoord: |-
        $A=1$, $B=-1$
      uitwerking: |-
        Op gelijke noemer: $A(x+2)+B(x-2)=4$. Met $x=2$: $4A=4$. Met $x=-2$: $-4B=4$.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h1-delen
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig \dfrac{x^2 + 1}{x - 1}\dx$
      antwoord: |-
        $\tfrac{x^2}{2}+x+2\ln|x-1|+C$
      uitwerking: |-
        $x^2+1=(x-1)(x+1)+2$, dus de integrand is $x+1+\dfrac{2}{x-1}$.
    - opgave: |-
        $\ig \dfrac{3x - 1}{x + 2}\dx$
      antwoord: |-
        $3x-7\ln|x+2|+C$
      uitwerking: |-
        $3x-1=3(x+2)-7$, dus de integrand is $3-\dfrac{7}{x+2}$.
    - opgave: |-
        $\ig \dfrac{x^2}{x^2 + 4}\dx$
      antwoord: |-
        $x-2\bgtan\tfrac x2+C$
      uitwerking: |-
        $x^2=(x^2+4)-4$, dus de integrand is $1-\dfrac{4}{x^2+4}$, en $\displaystyle\int\dfrac{4}{x^2+4}\dx=4\cdot\tfrac12\bgtan\tfrac x2$.
    - opgave: |-
        $\ig_0^1 \dfrac{x^3}{x + 1}\dx$
      antwoord: |-
        $\tfrac56-\ln2$
      uitwerking: |-
        $x^3=(x+1)(x^2-x+1)-1$, dus $\displaystyle\int_0^1\Bigl(x^2-x+1-\dfrac{1}{x+1}\Bigr)\dx=\tfrac13-\tfrac12+1-\ln2=\tfrac56-\ln2\approx0{,}140$.

- id: h1-twee
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig \dfrac{1}{x^2 - 4}\dx$
      antwoord: |-
        $\tfrac14\ln\Bigl|\dfrac{x-2}{x+2}\Bigr|+C$
      uitwerking: |-
        $A=\tfrac{1}{2+2}=\tfrac14$ en $B=\tfrac{1}{-2-2}=-\tfrac14$.
    - opgave: |-
        $\ig \dfrac{x + 5}{x^2 + x - 2}\dx$
      antwoord: |-
        $2\ln|x-1|-\ln|x+2|+C$
      uitwerking: |-
        $(x-1)(x+2)$: $A=\tfrac{6}{3}=2$ en $B=\tfrac{3}{-3}=-1$.
    - opgave: |-
        $\ig \dfrac{3x}{x^2 - x - 6}\dx$
      antwoord: |-
        $\tfrac95\ln|x-3|+\tfrac65\ln|x+2|+C$
      uitwerking: |-
        $(x-3)(x+2)$: $A=\tfrac{9}{5}$ en $B=\tfrac{-6}{-5}=\tfrac65$.
    - opgave: |-
        $\ig \dfrac{1}{2x^2 + x - 1}\dx$
      antwoord: |-
        $\tfrac13\ln\Bigl|\dfrac{2x-1}{x+1}\Bigr|+C$
      uitwerking: |-
        $2x^2+x-1=2\bigl(x-\tfrac12\bigr)(x+1)$. Zet $\tfrac12$ voor de integraal: $\dfrac{1}{(x-\frac12)(x+1)}=\dfrac{2/3}{x-\frac12}-\dfrac{2/3}{x+1}$. Dus $\tfrac13\ln\bigl|x-\tfrac12\bigr|-\tfrac13\ln|x+1|+C$, en $\ln\bigl|x-\tfrac12\bigr|=\ln|2x-1|-\ln2$: de constante zit in $C$.

- id: h1-tweegrens
  soort: kort
  opgave: |-
    Bereken $\ig_2^4 \dfrac{1}{x^2 - 1}\dx$, en controleer met een schets van de grafiek.
  antwoord: |-
    $\tfrac12\ln\tfrac95\approx0{,}294$
  uitwerking: |-
    $\dfrac{1}{x^2-1}=\dfrac{1/2}{x-1}-\dfrac{1/2}{x+1}$, dus $\tfrac12\Bigl[\ln\dfrac{x-1}{x+1}\Bigr]_2^4=\tfrac12\bigl(\ln\tfrac35-\ln\tfrac13\bigr)=\tfrac12\ln\tfrac95$. De functie daalt van $\tfrac13$ naar $\tfrac1{15}$ op een interval met breedte 2: de oppervlakte ligt tussen $0{,}13$ en $0{,}67$.

- id: h1-dubbel
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig \dfrac{2x - 3}{(x - 2)^2}\dx$
      antwoord: |-
        $2\ln|x-2|-\dfrac{1}{x-2}+C$
      uitwerking: |-
        $A=2$ en $B=2\cdot2-3=1$.
    - opgave: |-
        $\ig \dfrac{x + 4}{x^2 + 6x + 9}\dx$
      antwoord: |-
        $\ln|x+3|-\dfrac{1}{x+3}+C$
      uitwerking: |-
        $(x+3)^2$: $A=1$ en $B=-3+4=1$.
    - opgave: |-
        $\ig_0^1 \dfrac{x}{(x + 1)^2}\dx$
      antwoord: |-
        $\ln2-\tfrac12$
      uitwerking: |-
        $A=1$, $B=-1$: $\Bigl[\ln(x+1)+\dfrac{1}{x+1}\Bigr]_0^1=\ln2+\tfrac12-1$.

- id: h1-geen
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig \dfrac{1}{x^2 + 6x + 10}\dx$
      antwoord: |-
        $\bgtan(x+3)+C$
      uitwerking: |-
        $x^2+6x+10=(x+3)^2+1$.
    - opgave: |-
        $\ig \dfrac{4x + 2}{x^2 + x + 1}\dx$
      antwoord: |-
        $2\ln(x^2+x+1)+C$
      uitwerking: |-
        De teller is precies twee keer de afgeleide $2x+1$ van de noemer: er blijft geen constante over, dus geen boogtangens.
    - opgave: |-
        $\ig \dfrac{x}{x^2 - 2x + 2}\dx$
      antwoord: |-
        $\tfrac12\ln(x^2-2x+2)+\bgtan(x-1)+C$
      uitwerking: |-
        $x=\tfrac12(2x-2)+1$ en $x^2-2x+2=(x-1)^2+1$.
    - opgave: |-
        $\ig_1^3 \dfrac{1}{x^2 - 2x + 5}\dx$
      antwoord: |-
        $\tfrac{\pi}{8}$
      uitwerking: |-
        $(x-1)^2+4$: $\tfrac12\Bigl[\bgtan\dfrac{x-1}{2}\Bigr]_1^3=\tfrac12\bigl(\tfrac{\pi}{4}-0\bigr)$.

- id: h1-ontb
  soort: kort
  opgave: |-
    Ontbind in reële factoren die je niet verder kunt ontbinden.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $x^3 - x$
      antwoord: |-
        $x(x-1)(x+1)$
      uitwerking: |-
        Zonder $x$ af, en een verschil van kwadraten.
    - opgave: |-
        $x^3 - 27$
      antwoord: |-
        $(x-3)(x^2+3x+9)$
      uitwerking: |-
        Een verschil van derdemachten; $D=9-36<0$.
    - opgave: |-
        $x^4 - 16$
      antwoord: |-
        $(x-2)(x+2)(x^2+4)$
      uitwerking: |-
        $(x^2-4)(x^2+4)$, en $x^2+4$ heeft geen nulwaarden.
    - opgave: |-
        $x^3 + x^2 + x + 1$
      antwoord: |-
        $(x+1)(x^2+1)$
      uitwerking: |-
        Groepeer: $x^2(x+1)+(x+1)$.
    - opgave: |-
        $x^4 + 4$
      antwoord: |-
        $(x^2-2x+2)(x^2+2x+2)$
      uitwerking: |-
        $(x^2+2)^2-4x^2$, een verschil van kwadraten. Beide discriminanten zijn $-4$.
    - opgave: |-
        $x^4 + 3x^2 + 2$
      antwoord: |-
        $(x^2+1)(x^2+2)$
      uitwerking: |-
        Stel $t=x^2$: $t^2+3t+2=(t+1)(t+2)$.

- id: h1-alg
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig \dfrac{1}{x^3 - x}\dx$
      antwoord: |-
        $\tfrac12\ln|x^2-1|-\ln|x|+C$
      uitwerking: |-
        $x(x-1)(x+1)$: bedekken geeft $\dfrac{-1}{x}+\dfrac{1/2}{x-1}+\dfrac{1/2}{x+1}$. Samen: $-\ln|x|+\tfrac12\ln|x-1|+\tfrac12\ln|x+1|$.
    - opgave: |-
        $\ig \dfrac{x^2 + 1}{x(x - 1)^2}\dx$
      antwoord: |-
        $\ln|x|-\dfrac{2}{x-1}+C$
      uitwerking: |-
        $\dfrac Ax+\dfrac{B}{x-1}+\dfrac{C}{(x-1)^2}$. Bedekken: $A=1$ en $C=2$. Coëfficiënt van $x^2$: $1=A+B$, dus $B=0$.

- id: h1-keuze
  soort: kort
  opgave: |-
    Kies de kortste methode en bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig \dfrac{2x + 1}{x^2 + x}\dx$
      antwoord: |-
        $\ln|x^2+x|+C$
      uitwerking: |-
        De afgeleide van de noemer staat in de teller. Partieelbreuken kan ook, maar is langer.
    - opgave: |-
        $\ig \dfrac{1}{x^2 + x}\dx$
      antwoord: |-
        $\ln\Bigl|\dfrac{x}{x+1}\Bigr|+C$
      uitwerking: |-
        Partieelbreuken: $\dfrac1x-\dfrac{1}{x+1}$.
    - opgave: |-
        $\ig \dfrac{x}{(x^2 + 4)^2}\dx$
      antwoord: |-
        $-\dfrac{1}{2(x^2+4)}+C$
      uitwerking: |-
        Stel $u=x^2+4$: $\tfrac12\displaystyle\int u^{-2}\du=-\dfrac{1}{2u}+C$.
    - opgave: |-
        $\ig \dfrac{x^3}{x^2 + 4}\dx$
      antwoord: |-
        $\tfrac{x^2}{2}-2\ln(x^2+4)+C$
      uitwerking: |-
        Eerst delen: $x^3=x(x^2+4)-4x$, en $\displaystyle\int\dfrac{4x}{x^2+4}\dx=2\ln(x^2+4)$.

# --- Opdrachten ------------------------------------------------------------------------

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    integralen van rationale functies, gemengd
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig \dfrac{5}{x^2 + x - 6}\dx$
      antwoord: |-
        $\ln\Bigl|\dfrac{x-2}{x+3}\Bigr|+C$
      uitwerking: |-
        $(x-2)(x+3)$: $A=1$, $B=-1$.
    - opgave: |-
        $\ig \dfrac{x^2 - x + 1}{x - 2}\dx$
      antwoord: |-
        $\tfrac{x^2}{2}+x+3\ln|x-2|+C$
      uitwerking: |-
        $x^2-x+1=(x-2)(x+1)+3$.
    - opgave: |-
        $\ig \dfrac{1}{x^2 + 4x + 5}\dx$
      antwoord: |-
        $\bgtan(x+2)+C$
      uitwerking: |-
        $(x+2)^2+1$.
    - opgave: |-
        $\ig \dfrac{2x}{x^2 - 9}\dx$
      antwoord: |-
        $\ln|x^2-9|+C$
      uitwerking: |-
        De afgeleide van de noemer staat in de teller.
    - opgave: |-
        $\ig \dfrac{x - 1}{(x + 1)^2}\dx$
      antwoord: |-
        $\ln|x+1|+\dfrac{2}{x+1}+C$
      uitwerking: |-
        $A=1$, $B=-1-1=-2$.
    - opgave: |-
        $\ig \dfrac{x + 3}{x^2 + 2x + 2}\dx$
      antwoord: |-
        $\tfrac12\ln(x^2+2x+2)+2\bgtan(x+1)+C$
      uitwerking: |-
        $x+3=\tfrac12(2x+2)+2$ en $(x+1)^2+1$.
    - opgave: |-
        $\ig \dfrac{x^2}{x^2 - 1}\dx$
      antwoord: |-
        $x+\tfrac12\ln\Bigl|\dfrac{x-1}{x+1}\Bigr|+C$
      uitwerking: |-
        $\dfrac{x^2}{x^2-1}=1+\dfrac{1}{x^2-1}$.
    - opgave: |-
        $\ig \dfrac{1}{x(x + 4)}\dx$
      antwoord: |-
        $\tfrac14\ln\Bigl|\dfrac{x}{x+4}\Bigr|+C$
      uitwerking: |-
        $A=\tfrac14$, $B=-\tfrac14$.
    - opgave: |-
        $\ig \dfrac{3x + 2}{x^2 + 4}\dx$
      antwoord: |-
        $\tfrac32\ln(x^2+4)+\bgtan\tfrac x2+C$
      uitwerking: |-
        Splits: $\tfrac32\cdot\dfrac{2x}{x^2+4}+\dfrac{2}{x^2+4}$.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    splitsen in partieelbreuken
  opgave: |-
    Schrijf als een som van een veelterm en partieelbreuken. Je hoeft niet te integreren.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x + 11}{(x - 3)(x + 4)}$
      antwoord: |-
        $\dfrac{2}{x-3}-\dfrac{1}{x+4}$
      uitwerking: |-
        $A=\tfrac{14}{7}$, $B=\tfrac{7}{-7}$.
    - opgave: |-
        $\dfrac{2x + 1}{(x - 1)^2}$
      antwoord: |-
        $\dfrac{2}{x-1}+\dfrac{3}{(x-1)^2}$
      uitwerking: |-
        $A=2$, $B=2+1=3$.
    - opgave: |-
        $\dfrac{5}{x(x^2 + 5)}$
      antwoord: |-
        $\dfrac1x-\dfrac{x}{x^2+5}$
      uitwerking: |-
        $A=\tfrac55=1$. Dan $5=(x^2+5)+(Bx+C)x$, dus $B=-1$ en $C=0$.
    - opgave: |-
        $\dfrac{1}{x^2(x + 1)}$
      antwoord: |-
        $-\dfrac1x+\dfrac{1}{x^2}+\dfrac{1}{x+1}$
      uitwerking: |-
        Bedekken: $B=1$ bij $\tfrac{1}{x^2}$ en $C=1$ bij $\tfrac{1}{x+1}$. Coëfficiënt van $x^2$: $0=A+C$.
    - opgave: |-
        $\dfrac{4x^2}{(x - 1)^2(x + 1)}$
      antwoord: |-
        $\dfrac{3}{x-1}+\dfrac{2}{(x-1)^2}+\dfrac{1}{x+1}$
      uitwerking: |-
        Bedekken: $\tfrac{4}{4}=1$ bij $x+1$ en $\tfrac42=2$ bij $(x-1)^2$. Coëfficiënt van $x^2$: $4=A+1$.
    - opgave: |-
        $\dfrac{x^3}{x^2 - 1}$
      antwoord: |-
        $x+\dfrac{1/2}{x-1}+\dfrac{1/2}{x+1}$
      uitwerking: |-
        Eerst delen: $x^3=x(x^2-1)+x$. Dan $\dfrac{x}{(x-1)(x+1)}$ met $A=\tfrac12$ en $B=\tfrac{-1}{-2}=\tfrac12$.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    de vorm van de splitsing
  opgave: |-
    Geef de vorm van de splitsing in partieelbreuken, met letters voor de onbekenden. Je hoeft ze niet te berekenen.
  lijst: enumerate
  delen:
    - opgave: |-
        $\dfrac{x + 2}{(x - 1)(x + 3)(x - 5)}$
      antwoord: |-
        $\dfrac{A}{x-1}+\dfrac{B}{x+3}+\dfrac{C}{x-5}$
      uitwerking: |-
        Drie enkele factoren.
    - opgave: |-
        $\dfrac{1}{x^3(x + 2)}$
      antwoord: |-
        $\dfrac Ax+\dfrac{B}{x^2}+\dfrac{C}{x^3}+\dfrac{D}{x+2}$
      uitwerking: |-
        De factor $x$ staat tot de derde macht: drie partieelbreuken. Vier onbekenden, want de noemer heeft graad 4.
    - opgave: |-
        $\dfrac{x^2 + 1}{(x - 2)(x^2 + x + 1)}$
      antwoord: |-
        $\dfrac{A}{x-2}+\dfrac{Bx+C}{x^2+x+1}$
      uitwerking: |-
        $x^2+x+1$ heeft discriminant $-3$: een teller van de eerste graad.
    - opgave: |-
        $\dfrac{3x}{(x^2 + 4)^2}$
      antwoord: |-
        het is al een partieelbreuk
      uitwerking: |-
        De vorm is $\dfrac{Ax+B}{x^2+4}+\dfrac{Cx+D}{(x^2+4)^2}$, met $A=B=D=0$ en $C=3$: er valt niets te splitsen. Integreren gaat met $u=x^2+4$.
    - opgave: |-
        $\dfrac{x^4}{x^2 - 1}$
      antwoord: |-
        $x^2+1+\dfrac{A}{x-1}+\dfrac{B}{x+1}$
      uitwerking: |-
        De breuk is niet echt: eerst delen, $x^4=(x^2-1)(x^2+1)+1$.
    - opgave: |-
        $\dfrac{1}{x^2 + 4x + c}$ voor $c = 3$, $c = 4$ en $c = 5$
      antwoord: |-
        $\tfrac{A}{x+1}+\tfrac{B}{x+3}$; $\tfrac{A}{x+2}+\tfrac{B}{(x+2)^2}$; niet te splitsen
      uitwerking: |-
        De discriminant is $16-4c$: positief, nul en negatief. Bij $c=4$ is de breuk zelf al $\tfrac{1}{(x+2)^2}$, dus $A=0$ en $B=1$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    ontbinden in reële factoren
  opgave: |-
    Ontbind in reële factoren die je niet verder kunt ontbinden.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $x^3 + 2x^2 - x - 2$
      antwoord: |-
        $(x-1)(x+1)(x+2)$
      uitwerking: |-
        Groepeer: $x^2(x+2)-(x+2)$.
    - opgave: |-
        $x^3 - 3x + 2$
      antwoord: |-
        $(x-1)^2(x+2)$
      uitwerking: |-
        $x=1$ is een nulwaarde. Horner: $x^3-3x+2=(x-1)(x^2+x-2)=(x-1)(x-1)(x+2)$.
    - opgave: |-
        $x^4 - 1$
      antwoord: |-
        $(x-1)(x+1)(x^2+1)$
      uitwerking: |-
        $(x^2-1)(x^2+1)$.
    - opgave: |-
        $x^3 + 3x^2 + 4x + 2$
      antwoord: |-
        $(x+1)(x^2+2x+2)$
      uitwerking: |-
        $x=-1$: $-1+3-4+2=0$. Horner geeft $x^2+2x+2$, met $D=-4$.
    - opgave: |-
        $x^4 + x^2 + 1$
      antwoord: |-
        $(x^2-x+1)(x^2+x+1)$
      uitwerking: |-
        $(x^2+1)^2-x^2$, een verschil van kwadraten.
    - opgave: |-
        $x^6 - 1$
      antwoord: |-
        $(x-1)(x+1)(x^2+x+1)(x^2-x+1)$
      uitwerking: |-
        $(x^3-1)(x^3+1)$, en elk is een verschil of som van derdemachten.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    bepaalde integralen van rationale functies
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_0^2 \dfrac{1}{x^2 + 4x + 3}\dx$
      antwoord: |-
        $\tfrac12\ln\tfrac95$
      uitwerking: |-
        $\tfrac12\Bigl[\ln\dfrac{x+1}{x+3}\Bigr]_0^2=\tfrac12\bigl(\ln\tfrac35-\ln\tfrac13\bigr)$.
    - opgave: |-
        $\ig_3^5 \dfrac{x + 1}{x^2 - 3x + 2}\dx$
      antwoord: |-
        $\ln\tfrac{27}{4}$
      uitwerking: |-
        $(x-1)(x-2)$: $A=\tfrac{2}{-1}=-2$, $B=\tfrac31=3$. $\bigl[-2\ln(x-1)+3\ln(x-2)\bigr]_3^5=(-2\ln4+3\ln3)-(-2\ln2)=3\ln3-2\ln2$.
    - opgave: |-
        $\ig_{-1}^1 \dfrac{1}{x^2 + 2x + 2}\dx$
      antwoord: |-
        $\bgtan2\approx1{,}107$
      uitwerking: |-
        $\bigl[\bgtan(x+1)\bigr]_{-1}^1=\bgtan2-0$.
    - opgave: |-
        $\ig_0^1 \dfrac{x^2 + 1}{(x + 1)^2}\dx$
      antwoord: |-
        $2-2\ln2$
      uitwerking: |-
        $\dfrac{x^2+1}{(x+1)^2}=1-\dfrac{2x}{(x+1)^2}=1-\dfrac{2}{x+1}+\dfrac{2}{(x+1)^2}$. $\Bigl[x-2\ln(x+1)-\dfrac{2}{x+1}\Bigr]_0^1=(1-2\ln2-1)-(-2)$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    oppervlakte met partieelbreuken
  figuur:
    code: |-
      \begin{tikzpicture}[x=1.2cm,y=.4cm,font=\scriptsize]
        \gebied{1}{3}{6/(\x*(\x+1))}
        \draw[black!14,very thin,xstep=1,ystep=1] (0,0) grid (4,4);
        \draw[->,grijs] (0,0) -- (4.3,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,0) -- (0,4.5) node[above,text=black] {$y$};
        \kromme{.9}{4}{6/(\x*(\x+1))}
        \foreach \t in {1,2,3,4} \node[below] at (\t,0) {\t};
        \foreach \t in {1,2,3} \node[left] at (0,\t) {\t};
      \end{tikzpicture}
  opgave: |-
    De figuur toont de grafiek van $f(x) = \dfrac{6}{x^2 + x}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $f(x) = \dfrac6x - \dfrac{6}{x + 1}$.
      antwoord: |-
        bedekken: $A=6$, $B=-6$
      uitwerking: |-
        $x^2+x=x(x+1)$: $A=\tfrac{6}{0+1}=6$ en $B=\tfrac{6}{-1}=-6$.
    - opgave: |-
        Bereken de oppervlakte van het gekleurde gebied, en controleer met de figuur.
      antwoord: |-
        $6\ln\tfrac32\approx2{,}43$
      uitwerking: |-
        $6\Bigl[\ln\dfrac{x}{x+1}\Bigr]_1^3=6\bigl(\ln\tfrac34-\ln\tfrac12\bigr)=6\ln\tfrac32$. In de figuur: een gebied met breedte 2, en een hoogte die daalt van 3 naar $\tfrac12$, ongeveer $2{,}4$ vakjes.

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten
  opgave: |-
    Zoek de fout en verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Ruben schrijft $\dfrac{x + 3}{(x - 1)^2} = \dfrac{A}{x - 1} + \dfrac{B}{x - 1}$.
      antwoord: |-
        $\tfrac{1}{x-1}+\tfrac{4}{(x-1)^2}$
      uitwerking: |-
        Het rechterlid is $\tfrac{A+B}{x-1}$: daarmee krijg je nooit $(x-1)^2$ in de noemer. Juist is $\dfrac{A}{x-1}+\dfrac{B}{(x-1)^2}$ met $A=1$ en $B=1+3=4$.
    - opgave: |-
        Lisa schrijft $\dfrac{x^3}{x^2 - 1} = \dfrac{A}{x - 1} + \dfrac{B}{x + 1}$ en vindt met bedekken $A = B = \tfrac12$.
      antwoord: |-
        eerst delen: $x+\tfrac{1/2}{x-1}+\tfrac{1/2}{x+1}$
      uitwerking: |-
        De breuk is niet echt: de som van twee partieelbreuken heeft altijd een teller van hoogstens graad 1. Na de deling $x^3=x(x^2-1)+x$ splits je $\tfrac{x}{x^2-1}$, en dan kloppen de waarden van $A$ en $B$ toevallig wel.
    - opgave: |-
        Tom schrijft $\ig \dfrac{1}{x^2 + 4}\dx = \dfrac{\ln(x^2 + 4)}{2x} + C$.
      antwoord: |-
        $\tfrac12\bgtan\tfrac x2+C$
      uitwerking: |-
        Tom deelt door de afgeleide $2x$ alsof het een constante is. Afleiden toont de fout: dat geeft niet de integrand. Er staat geen $x$ in de teller, dus het is een boogtangens.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    snelheid en afstand uit de versnelling
  opgave: |-
    Een parachutist met een andere houding valt met versnelling $a(v) = 9{,}8\bigl(1 - \tfrac{v^2}{3600}\bigr)$, met $v$ in m/s.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke snelheid nadert hij?
      antwoord: |-
        60 m/s
      uitwerking: |-
        De versnelling is 0 bij $v^2=3600$.
    - opgave: |-
        Na hoeveel seconden valt hij 30 m/s?
      antwoord: |-
        $\tfrac{30}{9{,}8}\ln3\approx3{,}36$ s
      uitwerking: |-
        $t=\dfrac{3600}{9{,}8}\displaystyle\int_0^{30}\dfrac{\mathrm{d}v}{(60-v)(60+v)}=\dfrac{3600}{9{,}8}\cdot\dfrac{1}{120}\Bigl[\ln\dfrac{60+v}{60-v}\Bigr]_0^{30}=\dfrac{30}{9{,}8}\ln3$.
    - opgave: |-
        En na hoeveel seconden 59 m/s?
      antwoord: |-
        $\tfrac{30}{9{,}8}\ln119\approx14{,}6$ s
      uitwerking: |-
        $\ln\tfrac{119}{1}$: de laatste meter per seconde kost meer tijd dan de eerste 30.
    - opgave: |-
        Om de afstand te vinden, geldt $\Delta s \approx v\,\Delta t \approx \dfrac{v}{a(v)}\,\Delta v$. Hoeveel meter valt hij tot hij 30 m/s haalt?
      antwoord: |-
        $\tfrac{1800}{9{,}8}\ln\tfrac43\approx52{,}8$ m
      uitwerking: |-
        $s=\dfrac{3600}{9{,}8}\displaystyle\int_0^{30}\dfrac{v}{3600-v^2}\dv=\dfrac{3600}{9{,}8}\Bigl[-\tfrac12\ln(3600-v^2)\Bigr]_0^{30}=\dfrac{1800}{9{,}8}\ln\dfrac{3600}{2700}$. Hier volstaat substitutie: $v$ is op een factor na de afgeleide van de noemer.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    een chemische reactie
  opgave: |-
    In een vat reageren twee stoffen tot een product. Is er na $t$ minuten $x$ mol product gevormd, dan neemt die hoeveelheid toe met een snelheid van $0{,}1\,(2 - x)(3 - x)$ mol per minuut. In het begin is er nog geen product.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg uit, zoals bij de parachutist, waarom de tijd tot er 1 mol product is gelijk is aan $\ig_0^1 \dfrac{10}{(2 - x)(3 - x)}\dx$.
      antwoord: |-
        $\Delta t\approx\dfrac{\Delta x}{\text{snelheid}}$
      uitwerking: |-
        Om $\Delta x$ mol bij te maken heb je ongeveer $\dfrac{\Delta x}{0{,}1(2-x)(3-x)}$ minuten nodig. Tel op en neem de limiet.
    - opgave: |-
        Bereken die tijd.
      antwoord: |-
        $10\ln\tfrac43\approx2{,}88$ min
      uitwerking: |-
        $\dfrac{1}{(2-x)(3-x)}=\dfrac{1}{2-x}-\dfrac{1}{3-x}$. $10\bigl[-\ln(2-x)+\ln(3-x)\bigr]_0^1=10\bigl(\ln2-(\ln3-\ln2)\bigr)=10\ln\tfrac43$.
    - opgave: |-
        Toon aan dat er nooit 2 mol product komt.
      antwoord: |-
        de integraal tot 2 divergeert
      uitwerking: |-
        De tijd tot $x=b$ is $10\ln\dfrac{2(3-b)}{3(2-b)}$, en die gaat naar $+\infty$ als $b$ naar 2 gaat. Dat klopt: dan is een van de stoffen bijna op, en de reactie wordt steeds trager.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    oneigenlijke integralen
  opgave: |-
    Bereken de oneigenlijke integraal, of toon aan dat ze divergeert.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_1^{+\infty} \dfrac{1}{x(x + 1)}\dx$
      antwoord: |-
        $\ln2$
      uitwerking: |-
        $\Bigl[\ln\dfrac{x}{x+1}\Bigr]_1^b=\ln\dfrac{b}{b+1}+\ln2\to0+\ln2$.
    - opgave: |-
        $\ig_0^{+\infty} \dfrac{1}{x^2 + 2x + 2}\dx$
      antwoord: |-
        $\tfrac{\pi}{4}$
      uitwerking: |-
        $\bigl[\bgtan(x+1)\bigr]_0^b\to\tfrac{\pi}{2}-\tfrac{\pi}{4}$.
    - opgave: |-
        $\ig_2^{+\infty} \dfrac{1}{x^2 - 1}\dx$
      antwoord: |-
        $\tfrac12\ln3$
      uitwerking: |-
        $\tfrac12\Bigl[\ln\dfrac{x-1}{x+1}\Bigr]_2^b\to0-\tfrac12\ln\tfrac13$.
    - opgave: |-
        $\ig_1^{+\infty} \dfrac{1}{x(x^2 + 1)}\dx$
      antwoord: |-
        $\tfrac12\ln2$
      uitwerking: |-
        $\dfrac1x-\dfrac{x}{x^2+1}$, met primitieve $\ln x-\tfrac12\ln(x^2+1)=\ln\dfrac{x}{\sqrt{x^2+1}}$. Die gaat naar $\ln1=0$, en in 1 is ze $\ln\tfrac{1}{\sqrt2}$.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    eerst substitutie, dan partieelbreuken
  opgave: |-
    Na de gegeven substitutie staat er een rationale functie. Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        $\ig \dfrac{\cos x}{\sin^2 x - 3\sin x + 2}\dx$ \ met $u = \sin x$
      antwoord: |-
        $\ln\dfrac{2-\sin x}{1-\sin x}+C$
      uitwerking: |-
        $\displaystyle\int\dfrac{\mathrm{d}u}{(u-1)(u-2)}=\int\Bigl(\dfrac{-1}{u-1}+\dfrac{1}{u-2}\Bigr)\du=\ln\Bigl|\dfrac{u-2}{u-1}\Bigr|+C$. Omdat $\sin x<1$ (waar de integrand bestaat) en $\sin x<2$, is het quotiënt positief.
    - opgave: |-
        $\ig \dfrac{\e^x}{\e^{2x} - 1}\dx$ \ met $u = \e^x$
      antwoord: |-
        $\tfrac12\ln\Bigl|\dfrac{\e^x-1}{\e^x+1}\Bigr|+C$
      uitwerking: |-
        $\mathrm{d}u=\e^x\dx$: $\displaystyle\int\dfrac{\mathrm{d}u}{u^2-1}$.
    - opgave: |-
        $\ig \dfrac{1}{1 + \e^x}\dx$ \ met $u = \e^x$
      antwoord: |-
        $x-\ln(1+\e^x)+C$
      uitwerking: |-
        $\mathrm{d}x=\dfrac{\mathrm{d}u}{u}$: $\displaystyle\int\dfrac{\mathrm{d}u}{u(1+u)}=\ln u-\ln(1+u)+C$, en $\ln\e^x=x$.
    - opgave: |-
        $\ig \dfrac{\sqrt{x}}{x - 1}\dx$ \ met $u = \sqrt{x}$
      antwoord: |-
        $2\sqrt x+\ln\Bigl|\dfrac{\sqrt x-1}{\sqrt x+1}\Bigr|+C$
      uitwerking: |-
        $x=u^2$ en $\mathrm{d}x=2u\du$: $\displaystyle\int\dfrac{2u^2}{u^2-1}\du=\int\Bigl(2+\dfrac{1}{u-1}-\dfrac{1}{u+1}\Bigr)\du$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    volume van een omwentelingslichaam
  figuur:
    code: |-
      \begin{tikzpicture}[x=1.1cm,y=1.6cm,font=\scriptsize]
        \lichaam{0}{3}{sqrt(\x)/(\x+1)}
        \assen{-.2}{3.5}{-.75}{.8}
        \foreach \t in {1,2,3} \node[below] at (\t,-.5) {\t};
      \end{tikzpicture}
  opgave: |-
    De grafiek van $f(x) = \dfrac{\sqrt{x}}{x + 1}$ op $[0, 3]$ wentelt om de $x$-as.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het volume $V = \pi\ig_0^3 \dfrac{x}{(x + 1)^2}\dx$ is.
      antwoord: |-
        $V=\pi\displaystyle\int f(x)^2\dx$
      uitwerking: |-
        De formule voor een omwentelingslichaam, met $f(x)^2=\dfrac{x}{(x+1)^2}$.
    - opgave: |-
        Bereken het volume.
      antwoord: |-
        $\pi\bigl(2\ln2-\tfrac34\bigr)\approx2{,}00$
      uitwerking: |-
        $\dfrac{x}{(x+1)^2}=\dfrac{1}{x+1}-\dfrac{1}{(x+1)^2}$. $\pi\Bigl[\ln(x+1)+\dfrac{1}{x+1}\Bigr]_0^3=\pi\bigl(\ln4+\tfrac14-1\bigr)$.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    afbraak van alcohol
  opgave: |-
    De lever breekt alcohol af, maar niet sneller dan een bepaald maximum. Een eenvoudig model: bij een concentratie $c$ (in g/l) daalt die met $\dfrac{0{,}2\,c}{0{,}1 + c}$ g/l per uur.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang duurt het om van 1 g/l naar 0,2 g/l te gaan?
      antwoord: |-
        $4+0{,}5\ln5\approx4{,}8$ uur
      uitwerking: |-
        Een daling met $\Delta c$ kost ongeveer $\Delta c$ gedeeld door de snelheid: $t=\displaystyle\int_{0{,}2}^1\dfrac{0{,}1+c}{0{,}2\,c}\,\mathrm{d}c=\int_{0{,}2}^1\Bigl(\dfrac{0{,}5}{c}+5\Bigr)\mathrm{d}c=0{,}5\ln5+5\cdot0{,}8$.
    - opgave: |-
        Toon aan dat de afbraak voor grote $c$ bijna constant is. Hoe lang zou het met die constante snelheid duren? Waarom duurt het in werkelijkheid langer?
      antwoord: |-
        0,2 g/l per uur; 4 uur; bij lage $c$ trager
      uitwerking: |-
        $\dfrac{0{,}2c}{0{,}1+c}\to0{,}2$ als $c$ groot is. $\tfrac{0{,}8}{0{,}2}=4$ uur. Bij een lage concentratie is de snelheid kleiner, en dat geeft de extra $0{,}5\ln5\approx0{,}8$ uur.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    een formule voor $1/(x^2 - a^2)$
  opgave: |-
    Neem $a > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\ig \dfrac{1}{x^2 - a^2}\dx = \dfrac{1}{2a}\ln\Bigl|\dfrac{x - a}{x + a}\Bigr| + C$.
      antwoord: |-
        $A=\tfrac{1}{2a}$, $B=-\tfrac{1}{2a}$
      uitwerking: |-
        Bedek $x-a$ en vul $x=a$ in: $\tfrac{1}{2a}$. Bedek $x+a$ en vul $x=-a$ in: $-\tfrac{1}{2a}$.
    - opgave: |-
        Bereken $\ig \dfrac{1}{x^2 - 7}\dx$.
      antwoord: |-
        $\dfrac{1}{2\sqrt7}\ln\Bigl|\dfrac{x-\sqrt7}{x+\sqrt7}\Bigr|+C$
      uitwerking: |-
        $a=\sqrt7$: ook bij een irrationale nulwaarde werkt de formule.
    - opgave: |-
        Bereken $\ig \dfrac{1}{4x^2 - 9}\dx$.
      antwoord: |-
        $\tfrac{1}{12}\ln\Bigl|\dfrac{2x-3}{2x+3}\Bigr|+C$
      uitwerking: |-
        $\tfrac14\displaystyle\int\dfrac{1}{x^2-\frac94}\dx=\tfrac14\cdot\tfrac13\ln\Bigl|\dfrac{x-\frac32}{x+\frac32}\Bigr|+C$.
    - opgave: |-
        Vergelijk met $\ig \dfrac{1}{x^2 + a^2}\dx$. Welk verschil in de noemer maakt van een logaritme een boogtangens?
      antwoord: |-
        het teken van $a^2$
      uitwerking: |-
        $x^2+a^2$ heeft geen nulwaarden, $x^2-a^2$ wel twee. Eén teken beslist dus of je partieelbreuken krijgt.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    de kromme van Agnesi
  figuur:
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.55cm,font=\scriptsize]
        \gebiedtussen{-2}{2}{8/((\x)^2+4)}{(\x)^2/4}
        \rooster{-4}{1}{4}{0}{1}{3}
        \kromme{-4}{4}{8/((\x)^2+4)}
        \kromme{-3.2}{3.2}{(\x)^2/4}
      \end{tikzpicture}
  opgave: |-
    De kromme $y = \dfrac{8}{x^2 + 4}$ heet de kromme van Agnesi, naar de Italiaanse wiskundige Maria Gaetana Agnesi, die ze in 1748 beschreef in haar handboek over analyse. De figuur toont ze samen met de parabool $y = \tfrac14 x^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de snijpunten.
      antwoord: |-
        $(\pm2, 1)$
      uitwerking: |-
        $\dfrac{8}{x^2+4}=\dfrac{x^2}{4}$ geeft $x^4+4x^2-32=0$, dus $x^2=4$ (of $x^2=-8$).
    - opgave: |-
        Bereken de oppervlakte van het gekleurde gebied.
      antwoord: |-
        $2\pi-\tfrac43\approx4{,}95$
      uitwerking: |-
        Even functie: $2\displaystyle\int_0^2\Bigl(\dfrac{8}{x^2+4}-\dfrac{x^2}{4}\Bigr)\dx=2\Bigl[4\bgtan\dfrac x2-\dfrac{x^3}{12}\Bigr]_0^2=2\bigl(\pi-\tfrac23\bigr)$.
    - opgave: |-
        Bereken de oppervlakte tussen de hele kromme van Agnesi en de $x$-as.
      antwoord: |-
        $4\pi$
      uitwerking: |-
        $2\displaystyle\int_0^{+\infty}\dfrac{8}{x^2+4}\dx=2\lim_{b\to+\infty}\Bigl[4\bgtan\dfrac x2\Bigr]_0^b=2\cdot4\cdot\dfrac{\pi}{2}$.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    noemer van graad 3 zonder gegeven ontbinding
  opgave: |-
    Bereken $\ig \dfrac{3}{x^3 + 1}\dx$.
  lijst: enumerate
  delen:
    - opgave: |-
        Ontbind de noemer en splits in partieelbreuken.
      antwoord: |-
        $\dfrac{1}{x+1}+\dfrac{-x+2}{x^2-x+1}$
      uitwerking: |-
        $x^3+1=(x+1)(x^2-x+1)$. Bedekken: $A=\tfrac{3}{1+1+1}=1$. Dan $3=(x^2-x+1)+(Bx+C)(x+1)$: coëfficiënt van $x^2$ geeft $B=-1$, de constante term $C=2$.
    - opgave: |-
        Integreer.
      antwoord: |-
        $\ln|x+1|-\tfrac12\ln(x^2-x+1)+\sqrt3\bgtan\dfrac{2x-1}{\sqrt3}+C$
      uitwerking: |-
        $-x+2=-\tfrac12(2x-1)+\tfrac32$, en $x^2-x+1=\bigl(x-\tfrac12\bigr)^2+\tfrac34$: $\tfrac32\cdot\tfrac{2}{\sqrt3}\bgtan\dfrac{x-\frac12}{\sqrt3/2}=\sqrt3\bgtan\dfrac{2x-1}{\sqrt3}$.

- id: h1-o17
  soort: opdracht
  niveau: 3
  thema: |-
    pi is kleiner dan 22/7
  opgave: |-
    Archimedes toonde aan dat $\pi < \tfrac{22}{7}$, met veelhoeken met 96 zijden. Met één integraal gaat het sneller.
  lijst: enumerate
  delen:
    - opgave: |-
        Waarom is $\ig_0^1 \dfrac{x^4(1 - x)^4}{1 + x^2}\dx > 0$?
      antwoord: |-
        de integrand is positief
      uitwerking: |-
        Op $]0,1[$ zijn teller en noemer positief, en de functie is continu.
    - opgave: |-
        Toon aan dat $x^4(1 - x)^4 = (1 + x^2)(x^6 - 4x^5 + 5x^4 - 4x^2 + 4) - 4$.
      antwoord: |-
        uitwerken, of de euclidische deling
      uitwerking: |-
        Werk beide leden uit: $x^8-4x^7+6x^6-4x^5+x^4$.
    - opgave: |-
        Bereken de integraal.
      antwoord: |-
        $\tfrac{22}{7}-\pi$
      uitwerking: |-
        $\displaystyle\int_0^1(x^6-4x^5+5x^4-4x^2+4)\dx-4\int_0^1\dfrac{\mathrm{d}x}{1+x^2}=\tfrac17-\tfrac23+1-\tfrac43+4-4\cdot\tfrac{\pi}{4}=\tfrac{22}{7}-\pi$.
    - opgave: |-
        Besluit dat $\pi < \tfrac{22}{7}$.
      antwoord: |-
        uit a en c
      uitwerking: |-
        $\tfrac{22}{7}-\pi>0$.
    - opgave: |-
        Op $[0, 1]$ is $\tfrac12 \leqslant \tfrac{1}{1 + x^2} \leqslant 1$, en $\ig_0^1 x^4(1 - x)^4\dx = \tfrac{1}{630}$. Hoe nauwkeurig is $\tfrac{22}{7}$ als benadering van $\pi$?
      antwoord: |-
        $\tfrac{22}{7}-\tfrac{1}{630}<\pi<\tfrac{22}{7}-\tfrac{1}{1260}$
      uitwerking: |-
        Vermenigvuldig de ongelijkheid met $x^4(1-x)^4\geqslant0$ en integreer: $\tfrac{1}{1260}\leqslant\tfrac{22}{7}-\pi\leqslant\tfrac{1}{630}$. De fout ligt tussen $0{,}0008$ en $0{,}0016$.

- id: h1-o18
  soort: opdracht
  niveau: 3
  thema: |-
    de breuk van Leibniz
  opgave: |-
    Leibniz dacht dat $\dfrac{1}{x^4 + 1}$ niet in reële partieelbreuken te splitsen was. Noem $s = \sqrt2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{1}{x^4 + 1} = \dfrac{1}{2s}\Bigl(\dfrac{x + s}{x^2 + sx + 1} - \dfrac{x - s}{x^2 - sx + 1}\Bigr)$.
      antwoord: |-
        op gelijke noemer
      uitwerking: |-
        De noemer is $(x^2+sx+1)(x^2-sx+1)=x^4+1$. De teller is $(x+s)(x^2-sx+1)-(x-s)(x^2+sx+1)=2s$, want de termen in $x^3$, $x^2$ en $x$ vallen weg en $s+s=2s$.
    - opgave: |-
        Toon aan dat $\ig \dfrac{x + s}{x^2 + sx + 1}\dx = \tfrac12\ln(x^2 + sx + 1) + \bgtan(sx + 1) + C$.
      antwoord: |-
        verdeel de teller
      uitwerking: |-
        $x+s=\tfrac12(2x+s)+\tfrac s2$ en $x^2+sx+1=\bigl(x+\tfrac s2\bigr)^2+\tfrac12$. De tweede term geeft $\tfrac s2\cdot s\bgtan\bigl(s(x+\tfrac s2)\bigr)=\bgtan(sx+1)$, want $s^2=2$.
    - opgave: |-
        Bereken $\ig_0^{+\infty} \dfrac{1}{x^4 + 1}\dx$.
      antwoord: |-
        $\dfrac{\pi}{2\sqrt2}\approx1{,}111$
      uitwerking: |-
        Net zo is $\displaystyle\int\dfrac{x-s}{x^2-sx+1}\dx=\tfrac12\ln(x^2-sx+1)-\bgtan(sx-1)+C$. Een primitieve is dus $\dfrac{1}{2s}\Bigl(\tfrac12\ln\dfrac{x^2+sx+1}{x^2-sx+1}+\bgtan(sx+1)+\bgtan(sx-1)\Bigr)$. Voor $x\to+\infty$ gaat de logaritme naar $\ln1=0$ en de boogtangensen naar $\tfrac{\pi}{2}+\tfrac{\pi}{2}$. In 0 is ze $0+\tfrac{\pi}{4}-\tfrac{\pi}{4}=0$. Dus $\dfrac{\pi}{2s}$.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    de som van de tellers
  opgave: |-
    Neem een echte breuk $\dfrac{p(x)}{(x - a_1)(x - a_2)\cdots(x - a_n)}$ met $n$ verschillende nulwaarden in de noemer, en een teller van graad hoogstens $n - 2$. Splits ze in $\dfrac{A_1}{x - a_1} + \cdots + \dfrac{A_n}{x - a_n}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Controleer dat $A_1 + A_2 + A_3 = 0$ bij $\dfrac{1}{x^3 - x}$.
      antwoord: |-
        $-1+\tfrac12+\tfrac12=0$
      uitwerking: |-
        Zie de korte oefening: $\dfrac{-1}{x}+\dfrac{1/2}{x-1}+\dfrac{1/2}{x+1}$.
    - opgave: |-
        Vermenigvuldig de splitsing met $x$ en laat $x$ naar $+\infty$ gaan. Bewijs zo dat $A_1 + \cdots + A_n = 0$.
      antwoord: |-
        links gaat het naar 0, rechts naar de som
      uitwerking: |-
        $\dfrac{x\,p(x)}{(x-a_1)\cdots(x-a_n)}$ heeft een teller van graad hoogstens $n-1$ en een noemer van graad $n$, dus de limiet is 0. Rechts is $\dfrac{A_kx}{x-a_k}\to A_k$.
    - opgave: |-
        Splits $\dfrac{1}{(x - 1)(x - 2)(x - 3)}$: bereken twee tellers door te bedekken, en de derde met b.
      antwoord: |-
        $\dfrac{1/2}{x-1}-\dfrac{1}{x-2}+\dfrac{1/2}{x-3}$
      uitwerking: |-
        $A_1=\dfrac{1}{(-1)(-2)}=\tfrac12$ en $A_3=\dfrac{1}{2\cdot1}=\tfrac12$, dus $A_2=-1$.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    bedekken met de afgeleide van de noemer
  opgave: |-
    Neem een echte breuk $\dfrac{p(x)}{N(x)}$ waarvan de noemer alleen enkele nulwaarden heeft.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $N(x) = (x - a)\,M(x)$. Toon aan dat $N'(a) = M(a)$, en besluit dat de teller bij $x - a$ gelijk is aan $A = \dfrac{p(a)}{N'(a)}$.
      antwoord: |-
        productregel
      uitwerking: |-
        $N'(x)=M(x)+(x-a)M'(x)$, dus $N'(a)=M(a)$. Bedekken geeft $A=\dfrac{p(a)}{M(a)}$.
    - opgave: |-
        Splits $\dfrac{1}{x^3 - 7x + 6}$ met deze regel. De nulwaarden zijn gehele getallen.
      antwoord: |-
        $\dfrac{-1/4}{x-1}+\dfrac{1/5}{x-2}+\dfrac{1/20}{x+3}$
      uitwerking: |-
        De nulwaarden zijn 1, 2 en $-3$, en $N'(x)=3x^2-7$: $N'(1)=-4$, $N'(2)=5$, $N'(-3)=20$. Controle met de vorige opdracht: $-\tfrac14+\tfrac15+\tfrac1{20}=0$.
    - opgave: |-
        Bereken $\ig \dfrac{1}{x^3 - 7x + 6}\dx$.
      antwoord: |-
        $-\tfrac14\ln|x-1|+\tfrac15\ln|x-2|+\tfrac1{20}\ln|x+3|+C$
      uitwerking: |-
        Integreer de drie partieelbreuken.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    een kwadratische factor in het kwadraat
  opgave: |-
    Bij $\dfrac{1}{(1 + x^2)^2}$ is er niets te splitsen, en substitutie lukt niet. Toch kun je ze met partiële integratie integreren.
  lijst: enumerate
  delen:
    - opgave: |-
        Pas partiële integratie toe op $\ig \dfrac{1}{1 + x^2}\dx$ met $f(x) = \dfrac{1}{1 + x^2}$ en $g'(x) = 1$. Toon aan dat $\ig \dfrac{1}{1 + x^2}\dx = \dfrac{x}{1 + x^2} + \ig \dfrac{2x^2}{(1 + x^2)^2}\dx$.
      antwoord: |-
        $f'(x)=-\dfrac{2x}{(1+x^2)^2}$, $g=x$
      uitwerking: |-
        $\displaystyle\int fg'\dx=fg-\int f'g\dx=\dfrac{x}{1+x^2}+\int\dfrac{2x^2}{(1+x^2)^2}\dx$.
    - opgave: |-
        Schrijf $\dfrac{2x^2}{(1 + x^2)^2} = \dfrac{2}{1 + x^2} - \dfrac{2}{(1 + x^2)^2}$, en besluit dat $\ig \dfrac{1}{(1 + x^2)^2}\dx = \dfrac12\Bigl(\dfrac{x}{1 + x^2} + \bgtan x\Bigr) + C$.
      antwoord: |-
        los op naar de gezochte integraal
      uitwerking: |-
        $2x^2=2(1+x^2)-2$. Noem $J=\displaystyle\int\dfrac{\mathrm{d}x}{(1+x^2)^2}$: dan $\bgtan x=\dfrac{x}{1+x^2}+2\bgtan x-2J$, dus $2J=\dfrac{x}{1+x^2}+\bgtan x$.
    - opgave: |-
        Bereken $\ig_0^1 \dfrac{1}{(1 + x^2)^2}\dx$.
      antwoord: |-
        $\tfrac14+\tfrac{\pi}{8}\approx0{,}643$
      uitwerking: |-
        $\tfrac12\bigl(\tfrac12+\tfrac{\pi}{4}\bigr)$. In hoofdstuk 2 vind je dit nog eens, met een goniometrische substitutie.

# --- Koppel ----------------------------------------------------------------------------

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Differentiaalvergelijkingen
  opgave: |-
    Een populatie vissen groeit logistisch: $y' = 0{,}5\,y\Bigl(1 - \dfrac{y}{1000}\Bigr)$, met $y$ het aantal vissen en $t$ in jaar. In het begin zijn er 100 vissen. Deel door het rechterlid: $\dfrac{1000}{y(1000 - y)}\,y' = 0{,}5$. Integreer je beide leden naar $t$, dan geeft de substitutieregel links een integraal naar $y$.
  lijst: enumerate
  delen:
    - opgave: |-
        Splits $\dfrac{1000}{y(1000 - y)}$ in partieelbreuken.
      antwoord: |-
        $\dfrac1y+\dfrac{1}{1000-y}$
      uitwerking: |-
        Bedekken: $\tfrac{1000}{1000}=1$ bij $y$, en $\tfrac{1000}{1000}=1$ bij $1000-y$.
    - opgave: |-
        Integreer beide leden en toon aan dat $\ln\dfrac{y}{1000 - y} = 0{,}5\,t + C$ (met $0 < y < 1000$). Bepaal $C$.
      antwoord: |-
        $C=\ln\tfrac19$
      uitwerking: |-
        $\displaystyle\int\Bigl(\dfrac1y+\dfrac{1}{1000-y}\Bigr)\mathrm{d}y=\ln y-\ln(1000-y)$. Met $y=100$ bij $t=0$: $C=\ln\tfrac{100}{900}$.
    - opgave: |-
        Los op naar $y$, en controleer met de differentiaalvergelijking.
      antwoord: |-
        $y=\dfrac{1000}{1+9\e^{-0{,}5t}}$
      uitwerking: |-
        $\dfrac{y}{1000-y}=\tfrac19\e^{0{,}5t}$, dus $9y=(1000-y)\e^{0{,}5t}$ en $y=\dfrac{1000\,\e^{0{,}5t}}{9+\e^{0{,}5t}}$.
    - opgave: |-
        Wanneer zijn er 900 vissen?
      antwoord: |-
        $t=2\ln81\approx8{,}8$ jaar
      uitwerking: |-
        $\dfrac{900}{100}=9=\tfrac19\e^{0{,}5t}$, dus $\e^{0{,}5t}=81$.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Reeksen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.9cm,y=3.2cm,font=\scriptsize]
        \foreach \n in {1,2,3,4}{\draw[accent,fill=accent!22] (\n,0) rectangle (\n+1,{1/(\n*(\n+1))});}
        \draw[->,grijs] (0,0) -- (5.6,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,0) -- (0,.62) node[above,text=black] {$y$};
        \draw[fel!80!black,thick] plot[domain=1:5.4,samples=60,smooth] (\x,{1/(\x*(\x+1))});
        \foreach \t in {1,2,3,4,5} \node[below] at (\t,0) {\t};
        \node[left] at (0,.5) {0,5};
      \end{tikzpicture}
  opgave: |-
    Vergelijk een som en een integraal met dezelfde partieelbreuken.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\displaystyle\sum_{n=1}^{+\infty} \dfrac{1}{n(n + 1)} = 1$: splits de term en schrap.
      antwoord: |-
        $s_N=1-\tfrac{1}{N+1}\to1$
      uitwerking: |-
        $\dfrac{1}{n(n+1)}=\dfrac1n-\dfrac{1}{n+1}$: in de partieelsom valt alles weg behalve $1-\tfrac{1}{N+1}$.
    - opgave: |-
        Bereken $\ig_1^{+\infty} \dfrac{1}{x(x + 1)}\dx$.
      antwoord: |-
        $\ln2\approx0{,}693$
      uitwerking: |-
        Zie de opdrachten: $\Bigl[\ln\dfrac{x}{x+1}\Bigr]_1^{+\infty}=0-\ln\tfrac12$.
    - opgave: |-
        Verklaar met de figuur waarom de som groter is dan de integraal.
      antwoord: |-
        de rechthoeken liggen boven de grafiek
      uitwerking: |-
        De som is de oppervlakte van rechthoeken met breedte 1 en hoogte $f(n)$. De functie daalt, dus op $[n,n+1]$ ligt de grafiek onder de rechthoek.
    - opgave: |-
        Bereken $\displaystyle\sum_{n=1}^{+\infty} \dfrac{1}{n(n + 2)}$. Hier valt telkens een term verder iets weg.
      antwoord: |-
        $\tfrac34$
      uitwerking: |-
        $\dfrac{1}{n(n+2)}=\tfrac12\Bigl(\dfrac1n-\dfrac{1}{n+2}\Bigr)$. Na het schrappen blijft $\tfrac12\bigl(1+\tfrac12\bigr)$ over.

- id: h1-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    In $\C$ heeft $x^2 + 1$ wel nulwaarden. Dan kun je ook daar bedekken.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{1}{x^2 + 1} = \dfrac{A}{x - i} + \dfrac{B}{x + i}$ met $A = -\tfrac{i}{2}$ en $B = \tfrac{i}{2}$. Wat valt op aan $A$ en $B$?
      antwoord: |-
        $B=\conj{A}$
      uitwerking: |-
        Bedekken: $A=\dfrac{1}{i+i}=\dfrac{1}{2i}=-\dfrac i2$ en $B=\dfrac{1}{-2i}=\dfrac i2$. Ze zijn elkaars toegevoegde.
    - opgave: |-
        Neem een complex getal $B$. Toon aan dat $\dfrac{B}{x - i} + \dfrac{\conj{B}}{x + i} = \dfrac{2\,\mathrm{Re}(B)\,x - 2\,\mathrm{Im}(B)}{x^2 + 1}$.
      antwoord: |-
        een reële breuk
      uitwerking: |-
        De teller is $B(x+i)+\conj B(x-i)=(B+\conj B)\,x+i(B-\conj B)=2\,\mathrm{Re}(B)\,x+i\cdot2i\,\mathrm{Im}(B)$.
    - opgave: |-
        Splits $\dfrac{x + 3}{(x - 1)(x^2 + 1)}$ in $\C$ door te bedekken, en zet de twee niet-reële partieelbreuken samen met b. Vergelijk met de reële splitsing.
      antwoord: |-
        $\dfrac{2}{x-1}+\dfrac{-2x-1}{x^2+1}$
      uitwerking: |-
        Bij $x-1$: $\tfrac{4}{2}=2$. Bij $x-i$: $\dfrac{i+3}{(i-1)\cdot2i}=-1+\tfrac i2$. Met b: $\dfrac{-2x-1}{x^2+1}$. Controle: $2(x^2+1)+(-2x-1)(x-1)=x+3$. Zo zie je waarom bij een factor van de tweede graad een teller $Bx+C$ hoort.

- id: h1-koppel-4
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    Splits $\dfrac{3x^2 + 2x + 1}{(x - 1)(x^2 + 1)} = \dfrac{A}{x - 1} + \dfrac{Bx + C}{x^2 + 1}$ door coëfficiënten te vergelijken.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf het stelsel voor $A$, $B$ en $C$ als een matrixvergelijking.
      antwoord: |-
        $\begin{pmatrix}1&1&0\\0&-1&1\\1&0&-1\end{pmatrix}\begin{pmatrix}A\\B\\C\end{pmatrix}=\begin{pmatrix}3\\2\\1\end{pmatrix}$
      uitwerking: |-
        $A(x^2+1)+(Bx+C)(x-1)=(A+B)x^2+(-B+C)x+(A-C)$.
    - opgave: |-
        Bereken de determinant. Wat zegt die over de splitsing?
      antwoord: |-
        2; er is juist één oplossing
      uitwerking: |-
        $1\cdot(1-0)-1\cdot(0-1)+0=2\neq0$: het stelsel heeft juist één oplossing, zoals de stelling over partieelbreuken zegt.
    - opgave: |-
        Los op, en bereken $\ig \dfrac{3x^2 + 2x + 1}{(x - 1)(x^2 + 1)}\dx$.
      antwoord: |-
        $A=3$, $B=0$, $C=2$; $3\ln|x-1|+2\bgtan x+C'$
      uitwerking: |-
        Uit de eerste en de derde vergelijking: $B=3-A$ en $C=A-1$; de tweede geeft $-(3-A)+A-1=2$, dus $A=3$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Bereken $\ig \dfrac{x^2 + 2x}{x + 1}\dx$.
  antwoord: |-
    $\tfrac{x^2}{2}+x-\ln|x+1|+C$
  uitwerking: |-
    $x^2+2x=(x+1)^2-1$, dus de integrand is $x+1-\dfrac{1}{x+1}$.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Bereken $\ig \dfrac{x + 4}{x^2 + x - 2}\dx$.
  antwoord: |-
    $\tfrac53\ln|x-1|-\tfrac23\ln|x+2|+C$
  uitwerking: |-
    $(x-1)(x+2)$: $A=\tfrac53$ en $B=\tfrac{2}{-3}$.

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Bereken $\ig \dfrac{2x - 1}{(x + 1)^2}\dx$.
  antwoord: |-
    $2\ln|x+1|+\dfrac{3}{x+1}+C$
  uitwerking: |-
    $A=2$ en $B=-2-1=-3$: $\dfrac{2}{x+1}-\dfrac{3}{(x+1)^2}$.

- id: h1-t4
  soort: test
  niveau: 2
  opgave: |-
    Bereken $\ig_0^1 \dfrac{2x + 4}{x^2 + 2x + 2}\dx$ exact, en rond af op twee decimalen.
  antwoord: |-
    $\ln\tfrac52+2\bgtan2-\tfrac{\pi}{2}\approx1{,}56$
  uitwerking: |-
    $2x+4=(2x+2)+2$: $\bigl[\ln(x^2+2x+2)+2\bgtan(x+1)\bigr]_0^1=\ln5+2\bgtan2-\ln2-2\cdot\tfrac{\pi}{4}$.

- id: h1-t5
  soort: test
  niveau: 1
  opgave: |-
    Ontbind $x^3 + x - 2$ in reële factoren die je niet verder kunt ontbinden.
  antwoord: |-
    $(x-1)(x^2+x+2)$
  uitwerking: |-
    $x=1$ is een nulwaarde. Horner geeft $x^2+x+2$, met $D=1-8<0$.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Bereken $\ig \dfrac{4}{x^3 + 4x}\dx$.
  antwoord: |-
    $\ln|x|-\tfrac12\ln(x^2+4)+C$
  uitwerking: |-
    $\dfrac{4}{x(x^2+4)}=\dfrac Ax+\dfrac{Bx+C}{x^2+4}$: $A=1$, en $4=(x^2+4)+(Bx+C)x$ geeft $B=-1$, $C=0$.

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Een hagelsteen valt met versnelling $a(v) = 9{,}8\bigl(1 - \tfrac{v^2}{400}\bigr)$, met $v$ in m/s. Na hoeveel seconden valt hij 15 m/s?
  antwoord: |-
    $\tfrac{10}{9{,}8}\ln7\approx1{,}99$ s
  uitwerking: |-
    $t=\dfrac{400}{9{,}8}\displaystyle\int_0^{15}\dfrac{\mathrm{d}v}{(20-v)(20+v)}=\dfrac{400}{9{,}8}\cdot\dfrac{1}{40}\Bigl[\ln\dfrac{20+v}{20-v}\Bigr]_0^{15}=\dfrac{10}{9{,}8}\ln\dfrac{35}{5}$.

- id: h1-t8
  soort: test
  niveau: 2
  opgave: |-
    Kies telkens de kortste methode en bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig \dfrac{x}{x^2 - 4}\dx$
      antwoord: |-
        $\tfrac12\ln|x^2-4|+C$
      uitwerking: |-
        Substitutie: de afgeleide van de noemer staat op een factor 2 na in de teller.
    - opgave: |-
        $\ig \dfrac{x^2}{x^2 - 4}\dx$
      antwoord: |-
        $x+\ln\Bigl|\dfrac{x-2}{x+2}\Bigr|+C$
      uitwerking: |-
        Delen: $1+\dfrac{4}{x^2-4}$, en $\dfrac{4}{x^2-4}=\dfrac{1}{x-2}-\dfrac{1}{x+2}$.
