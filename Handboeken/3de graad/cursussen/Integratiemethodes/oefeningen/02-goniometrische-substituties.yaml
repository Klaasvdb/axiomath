# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Vereenvoudig of bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\sqrt{1 - \sin^2 u}$ \ voor $u \in \bigl[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\bigr]$
      antwoord: |-
        $\cos u$
      uitwerking: |-
        $\sqrt{\cos^2u}=|\cos u|$, en op dat interval is $\cos u\geqslant0$.
    - opgave: |-
        $1 + \tan^2 u$
      antwoord: |-
        $\dfrac{1}{\cos^2u}$
      uitwerking: |-
        $\dfrac{\cos^2u+\sin^2u}{\cos^2u}$.
    - opgave: |-
        de afgeleide van $\tan u$
      antwoord: |-
        $\dfrac{1}{\cos^2u}$
      uitwerking: |-
        Een basisafgeleide.
    - opgave: |-
        $\bgsin\tfrac12$ \ en \ $\bgtan\sqrt3$
      antwoord: |-
        $\tfrac{\pi}{6}$ en $\tfrac{\pi}{3}$
      uitwerking: |-
        $\sin\tfrac{\pi}{6}=\tfrac12$ en $\tan\tfrac{\pi}{3}=\sqrt3$.
    - opgave: |-
        $\sin 2u$ \ in $\sin u$ en $\cos u$
      antwoord: |-
        $2\sin u\cos u$
      uitwerking: |-
        De formule voor de dubbele hoek.
    - opgave: |-
        $\ig \cos^2 u\du$
      antwoord: |-
        $\tfrac u2+\tfrac{\sin2u}{4}+C$
      uitwerking: |-
        Carnot: $\cos^2u=\tfrac{1+\cos2u}{2}$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem $I = \ig_0^1 \sqrt{1 - x^2}\dx$.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de grafiek van $y = \sqrt{1 - x^2}$. Welke waarde heeft $I$?
      antwoord: |-
        $\tfrac{\pi}{4}$
      uitwerking: |-
        Een halve cirkel met straal 1. $I$ is een kwart van de schijf.
    - opgave: |-
        Iemand stelt $u = 1 - x^2$. Waarom lukt dat niet?
      antwoord: |-
        er blijft een $x$ over
      uitwerking: |-
        $\mathrm{d}u=-2x\dx$, maar in de integrand staat geen factor $x$.
    - opgave: |-
        Stel nu $x = \sin u$ met $u \in \bigl[0, \tfrac{\pi}{2}\bigr]$. Schrijf $\sqrt{1 - x^2}$ en $\mathrm{d}x$ met $u$. Welke waarden van $u$ horen bij $x = 0$ en $x = 1$?
      antwoord: |-
        $\cos u$, $\cos u\du$; $0$ en $\tfrac{\pi}{2}$
      uitwerking: |-
        $\sqrt{1-\sin^2u}=\cos u$ en $\mathrm{d}x=\cos u\du$.
    - opgave: |-
        Bereken $\ig_0^{\pi/2} \cos^2 u\du$. Vind je $I$ terug?
      antwoord: |-
        $\tfrac{\pi}{4}$
      uitwerking: |-
        $\Bigl[\tfrac u2+\tfrac{\sin2u}{4}\Bigr]_0^{\pi/2}=\tfrac{\pi}{4}$.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h2-andere
  soort: kort
  opgave: |-
    Bereken met de gegeven substitutie. Reken eerst de grenzen om.
  lijst: enumerate
  delen:
    - opgave: |-
        $\ig_0^1 \dfrac{1}{\sqrt{4 - x^2}}\dx$ \ met $x = 2\sin u$
      antwoord: |-
        $\tfrac{\pi}{6}$
      uitwerking: |-
        Grenzen 0 en $\tfrac{\pi}{6}$, want $\sin u=\tfrac12$. De integrand wordt $\dfrac{2\cos u}{2\cos u}=1$.
    - opgave: |-
        $\ig_0^1 \dfrac{1}{1 + x^2}\dx$ \ met $x = \tan u$
      antwoord: |-
        $\tfrac{\pi}{4}$
      uitwerking: |-
        Grenzen 0 en $\tfrac{\pi}{4}$. $\dfrac{1}{1+\tan^2u}\cdot\dfrac{1}{\cos^2u}=1$. Controle: $\bgtan1=\tfrac{\pi}{4}$.
    - opgave: |-
        $\ig_0^4 \dfrac{1}{1 + \sqrt{x}}\dx$ \ met $x = u^2$, $u \geqslant 0$
      antwoord: |-
        $4-2\ln3\approx1{,}80$
      uitwerking: |-
        Grenzen 0 en 2, $\mathrm{d}x=2u\du$: $\displaystyle\int_0^2\dfrac{2u}{1+u}\du=2\int_0^2\Bigl(1-\dfrac{1}{1+u}\Bigr)\du=2(2-\ln3)$. Ook een substitutie $x=g(u)$, zonder goniometrie.

- id: h2-sin
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_0^3 \sqrt{9 - x^2}\dx$
      antwoord: |-
        $\tfrac{9\pi}{4}$
      uitwerking: |-
        $x=3\sin u$, grenzen 0 en $\tfrac{\pi}{2}$: $9\displaystyle\int_0^{\pi/2}\cos^2u\du=\tfrac{9\pi}{4}$. Een kwart van een schijf met straal 3.
    - opgave: |-
        $\ig_0^1 \sqrt{4 - x^2}\dx$
      antwoord: |-
        $\tfrac{\sqrt3}{2}+\tfrac{\pi}{3}\approx1{,}913$
      uitwerking: |-
        De formule met $a=2$: $\Bigl[2\bgsin\tfrac x2+\tfrac x2\sqrt{4-x^2}\Bigr]_0^1=2\cdot\tfrac{\pi}{6}+\tfrac{\sqrt3}{2}$.
    - opgave: |-
        $\ig \dfrac{x^2}{\sqrt{9 - x^2}}\dx$
      antwoord: |-
        $\tfrac92\bgsin\tfrac x3-\tfrac x2\sqrt{9-x^2}+C$
      uitwerking: |-
        $x=3\sin u$: $\displaystyle\int\dfrac{9\sin^2u}{3\cos u}\,3\cos u\du=9\int\sin^2u\du=\tfrac92(u-\sin u\cos u)+C$. Terug met de driehoek.
    - opgave: |-
        $\ig \dfrac{1}{x^2\sqrt{4 - x^2}}\dx$
      antwoord: |-
        $-\dfrac{\sqrt{4-x^2}}{4x}+C$
      uitwerking: |-
        $x=2\sin u$: $\displaystyle\int\dfrac{2\cos u}{4\sin^2u\cdot2\cos u}\du=\tfrac14\int\dfrac{\mathrm{d}u}{\sin^2u}=-\tfrac14\,\dfrac{\cos u}{\sin u}+C$, en $\dfrac{\cos u}{\sin u}=\dfrac{\sqrt{4-x^2}}{x}$.

- id: h2-tan
  soort: kort
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig \dfrac{1}{(x^2 + 9)^{3/2}}\dx$
      antwoord: |-
        $\dfrac{x}{9\sqrt{x^2+9}}+C$
      uitwerking: |-
        $x=3\tan u$: $\displaystyle\int\dfrac{3}{\cos^2u}\cdot\dfrac{\cos^3u}{27}\du=\tfrac19\sin u+C$.
    - opgave: |-
        $\ig_0^{\sqrt3} \dfrac{1}{\sqrt{x^2 + 1}}\dx$
      antwoord: |-
        $\ln(2+\sqrt3)\approx1{,}317$
      uitwerking: |-
        $\bigl[\ln(x+\sqrt{x^2+1})\bigr]_0^{\sqrt3}=\ln(\sqrt3+2)-\ln1$.
    - opgave: |-
        $\ig_0^2 \sqrt{x^2 + 4}\dx$
      antwoord: |-
        $2\sqrt2+2\ln(1+\sqrt2)\approx4{,}59$
      uitwerking: |-
        $\tfrac12\bigl[x\sqrt{x^2+4}+4\ln(x+\sqrt{x^2+4})\bigr]_0^2=\tfrac12\bigl(2\sqrt8+4\ln(2+2\sqrt2)-4\ln2\bigr)$.
    - opgave: |-
        $\ig \dfrac{x}{\sqrt{x^2 + 4}}\dx$
      antwoord: |-
        $\sqrt{x^2+4}+C$
      uitwerking: |-
        Geen goniometrie nodig: met $u=x^2+4$ is dit $\tfrac12\displaystyle\int u^{-1/2}\du$.

- id: h2-sec
  soort: kort
  opgave: |-
    Bereken, voor $x > 1$.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig \dfrac{1}{x^2\sqrt{x^2 - 1}}\dx$
      antwoord: |-
        $\dfrac{\sqrt{x^2-1}}{x}+C$
      uitwerking: |-
        $x=\tfrac{1}{\cos u}$: $\displaystyle\int\cos^2u\cdot\dfrac{1}{\tan u}\cdot\dfrac{\sin u}{\cos^2u}\du=\int\cos u\du=\sin u+C$, en $\sin u=\sqrt{1-\cos^2u}=\dfrac{\sqrt{x^2-1}}{x}$.
    - opgave: |-
        $\ig_1^2 \dfrac{\sqrt{x^2 - 1}}{x}\dx$
      antwoord: |-
        $\sqrt3-\tfrac{\pi}{3}\approx0{,}685$
      uitwerking: |-
        $x=\tfrac{1}{\cos u}$, grenzen 0 en $\tfrac{\pi}{3}$: zoals in het voorbeeld wordt de integrand $\tan^2u$, dus $\bigl[\tan u-u\bigr]_0^{\pi/3}$.

- id: h2-t
  soort: kort
  opgave: |-
    Bereken met de t-formules.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_0^{\pi/2} \dfrac{1}{1 + \sin x + \cos x}\dx$
      antwoord: |-
        $\ln2$
      uitwerking: |-
        De noemer wordt $\dfrac{(1+t^2)+2t+(1-t^2)}{1+t^2}=\dfrac{2+2t}{1+t^2}$, dus $\displaystyle\int_0^1\dfrac{2}{2+2t}\dt=\bigl[\ln(1+t)\bigr]_0^1$.
    - opgave: |-
        $\ig \dfrac{1}{1 - \cos x}\dx$ \ op $]0, \pi[$
      antwoord: |-
        $-\dfrac{1}{\tan\frac x2}+C$
      uitwerking: |-
        $1-\cos x=\dfrac{2t^2}{1+t^2}$, dus $\displaystyle\int\dfrac{1}{t^2}\dt=-\dfrac1t+C$.
    - opgave: |-
        $\ig_0^{\pi/3} \dfrac{1}{\cos x}\dx$ \ met de t-formules, en ook met de stelling over $\tfrac{1}{\cos x}$
      antwoord: |-
        $\ln(2+\sqrt3)\approx1{,}317$
      uitwerking: |-
        $\displaystyle\int_0^{1/\sqrt3}\dfrac{2}{1-t^2}\dt=\Bigl[\ln\dfrac{1+t}{1-t}\Bigr]_0^{1/\sqrt3}=\ln\dfrac{\sqrt3+1}{\sqrt3-1}=\ln(2+\sqrt3)$. Met de stelling: $\ln\dfrac{1+\frac{\sqrt3}{2}}{\frac12}=\ln(2+\sqrt3)$.

- id: h2-kort
  soort: kort
  opgave: |-
    Bereken zonder t-formules.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig \sin^3 x\dx$
      antwoord: |-
        $-\cos x+\tfrac13\cos^3x+C$
      uitwerking: |-
        $\sin^3x=\sin x\,(1-\cos^2x)$, en stel $u=\cos x$.
    - opgave: |-
        $\ig \dfrac{\cos x}{(1 + \sin x)^2}\dx$
      antwoord: |-
        $-\dfrac{1}{1+\sin x}+C$
      uitwerking: |-
        Stel $u=1+\sin x$: $\displaystyle\int u^{-2}\du$.
    - opgave: |-
        $\ig \dfrac{\sin x\cos x}{1 + \cos^2 x}\dx$
      antwoord: |-
        $-\tfrac12\ln(1+\cos^2x)+C$
      uitwerking: |-
        De afgeleide van $1+\cos^2x$ is $-2\sin x\cos x$.

- id: h2-keuze
  soort: kort
  opgave: |-
    Kies een methode en bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig \dfrac{1}{\sqrt{x^2 + 4x + 5}}\dx$
      antwoord: |-
        $\ln\bigl(x+2+\sqrt{x^2+4x+5}\bigr)+C$
      uitwerking: |-
        $x^2+4x+5=(x+2)^2+1$: de formule met $u=x+2$ en $a=1$.
    - opgave: |-
        $\ig \dfrac{\sin x}{2 + \cos x}\dx$
      antwoord: |-
        $-\ln(2+\cos x)+C$
      uitwerking: |-
        De afgeleide van de noemer staat, op het teken na, in de teller.
    - opgave: |-
        $\ig \dfrac{1}{4 + x^2}\dx$
      antwoord: |-
        $\tfrac12\bgtan\tfrac x2+C$
      uitwerking: |-
        Een standaardvorm: geen wortel, geen substitutie.
    - opgave: |-
        $\ig \sqrt{8 + 2x - x^2}\dx$
      antwoord: |-
        $\tfrac92\bgsin\tfrac{x-1}{3}+\tfrac{x-1}{2}\sqrt{8+2x-x^2}+C$
      uitwerking: |-
        $8+2x-x^2=9-(x-1)^2$: de formule voor $\sqrt{a^2-u^2}$ met $u=x-1$ en $a=3$.

# --- Opdrachten ------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    goniometrische substituties, gemengd
  opgave: |-
    Bereken.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig \sqrt{16 - x^2}\dx$
      antwoord: |-
        $8\bgsin\tfrac x4+\tfrac x2\sqrt{16-x^2}+C$
      uitwerking: |-
        De formule met $a=4$.
    - opgave: |-
        $\ig \dfrac{1}{(x^2 + 1)^{3/2}}\dx$
      antwoord: |-
        $\dfrac{x}{\sqrt{x^2+1}}+C$
      uitwerking: |-
        $x=\tan u$: $\displaystyle\int\cos u\du=\sin u+C$.
    - opgave: |-
        $\ig \dfrac{1}{\sqrt{x^2 + 9}}\dx$
      antwoord: |-
        $\ln\bigl(x+\sqrt{x^2+9}\bigr)+C$
      uitwerking: |-
        De formule met $a=3$.
    - opgave: |-
        $\ig \dfrac{x^2}{\sqrt{4 - x^2}}\dx$
      antwoord: |-
        $2\bgsin\tfrac x2-\tfrac x2\sqrt{4-x^2}+C$
      uitwerking: |-
        $x=2\sin u$: $4\displaystyle\int\sin^2u\du=2(u-\sin u\cos u)+C$.
    - opgave: |-
        $\ig \dfrac{1}{1 - \cos x}\dx$
      antwoord: |-
        $-\dfrac{1}{\tan\frac x2}+C$
      uitwerking: |-
        Zie de korte oefening: $\displaystyle\int t^{-2}\dt$.
    - opgave: |-
        $\ig \dfrac{\sqrt{x^2 - 9}}{x}\dx$ \ ($x > 3$)
      antwoord: |-
        $\sqrt{x^2-9}-3\bgcos\tfrac3x+C$
      uitwerking: |-
        $x=\tfrac{3}{\cos u}$: $3\displaystyle\int\tan^2u\du=3(\tan u-u)+C$, met $\tan u=\tfrac{\sqrt{x^2-9}}{3}$ en $u=\bgcos\tfrac3x$.
    - opgave: |-
        $\ig \dfrac{1}{x^2\sqrt{9 - x^2}}\dx$
      antwoord: |-
        $-\dfrac{\sqrt{9-x^2}}{9x}+C$
      uitwerking: |-
        $x=3\sin u$: $\tfrac19\displaystyle\int\dfrac{\mathrm{d}u}{\sin^2u}=-\tfrac19\,\dfrac{\cos u}{\sin u}+C$.
    - opgave: |-
        $\ig x\sqrt{1 - x^2}\dx$
      antwoord: |-
        $-\tfrac13(1-x^2)^{3/2}+C$
      uitwerking: |-
        Geen goniometrie: $u=1-x^2$, $\mathrm{d}u=-2x\dx$.
    - opgave: |-
        $\ig \dfrac{\sin x}{1 + \cos^2 x}\dx$
      antwoord: |-
        $-\bgtan(\cos x)+C$
      uitwerking: |-
        $u=\cos x$, $\mathrm{d}u=-\sin x\dx$: $-\displaystyle\int\dfrac{\mathrm{d}u}{1+u^2}$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    bepaalde integralen met een goniometrische substitutie
  opgave: |-
    Bereken exact.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig_0^{3/2} \dfrac{1}{(9 - x^2)^{3/2}}\dx$
      antwoord: |-
        $\tfrac{\sqrt3}{27}$
      uitwerking: |-
        $x=3\sin u$, grenzen 0 en $\tfrac{\pi}{6}$: $\tfrac19\displaystyle\int_0^{\pi/6}\dfrac{\mathrm{d}u}{\cos^2u}=\tfrac19\tan\tfrac{\pi}{6}=\tfrac{1}{9\sqrt3}$.
    - opgave: |-
        $\ig_0^2 x^2\sqrt{4 - x^2}\dx$
      antwoord: |-
        $\pi$
      uitwerking: |-
        $x=2\sin u$: $16\displaystyle\int_0^{\pi/2}\sin^2u\cos^2u\du=4\int_0^{\pi/2}\sin^22u\du=4\cdot\tfrac{\pi}{4}$.
    - opgave: |-
        $\ig_0^{4/3} \dfrac{1}{\sqrt{x^2 + 1}}\dx$
      antwoord: |-
        $\ln3$
      uitwerking: |-
        $\ln\bigl(\tfrac43+\tfrac53\bigr)$.
    - opgave: |-
        $\ig_0^{\pi/2} \dfrac{1}{2 - \cos x}\dx$
      antwoord: |-
        $\dfrac{2\pi}{3\sqrt3}\approx1{,}209$
      uitwerking: |-
        $2-\cos x=\dfrac{1+3t^2}{1+t^2}$: $\displaystyle\int_0^1\dfrac{2}{1+3t^2}\dt=\dfrac{2}{\sqrt3}\bigl[\bgtan(\sqrt3\,t)\bigr]_0^1=\dfrac{2}{\sqrt3}\cdot\dfrac{\pi}{3}$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    terug naar x met een driehoek
  opgave: |-
    Druk uit in $x$, met een rechthoekige driehoek.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = 3\sin u$ met $u \in \bigl]-\tfrac{\pi}{2}, \tfrac{\pi}{2}\bigr[$: geef $\cos u$, $\tan u$ en $\sin 2u$.
      antwoord: |-
        $\tfrac{\sqrt{9-x^2}}{3}$, $\tfrac{x}{\sqrt{9-x^2}}$, $\tfrac{2x\sqrt{9-x^2}}{9}$
      uitwerking: |-
        Schuine zijde 3, overstaand $x$, aanliggend $\sqrt{9-x^2}$. En $\sin2u=2\sin u\cos u$.
    - opgave: |-
        $x = 2\tan u$ met $u \in \bigl]-\tfrac{\pi}{2}, \tfrac{\pi}{2}\bigr[$: geef $\sin u$, $\cos u$ en $u$.
      antwoord: |-
        $\tfrac{x}{\sqrt{x^2+4}}$, $\tfrac{2}{\sqrt{x^2+4}}$, $\bgtan\tfrac x2$
      uitwerking: |-
        Overstaand $x$, aanliggend 2, schuine zijde $\sqrt{x^2+4}$.
    - opgave: |-
        $x = \dfrac{5}{\cos u}$ met $u \in \bigl[0, \tfrac{\pi}{2}\bigr[$: geef $\cos u$, $\sin u$ en $\tan u$.
      antwoord: |-
        $\tfrac5x$, $\tfrac{\sqrt{x^2-25}}{x}$, $\tfrac{\sqrt{x^2-25}}{5}$
      uitwerking: |-
        Schuine zijde $x$, aanliggend 5, overstaand $\sqrt{x^2-25}$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    welke substitutie?
  opgave: |-
    Welke substitutie kies je, en wat wordt de wortel of de breuk dan? Je hoeft niet te integreren.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig \sqrt{25 - x^2}\dx$
      antwoord: |-
        $x=5\sin u$; $5\cos u$
      uitwerking: |-
        Een wortel van $a^2-x^2$.
    - opgave: |-
        $\ig \dfrac{1}{\sqrt{x^2 + 3}}\dx$
      antwoord: |-
        $x=\sqrt3\tan u$; $\tfrac{\sqrt3}{\cos u}$
      uitwerking: |-
        $a=\sqrt3$. Of meteen de formule.
    - opgave: |-
        $\ig \dfrac{\sqrt{x^2 - 16}}{x}\dx$
      antwoord: |-
        $x=\tfrac{4}{\cos u}$; $4\tan u$
      uitwerking: |-
        Een wortel van $x^2-a^2$.
    - opgave: |-
        $\ig \sqrt{4 - 9x^2}\dx$
      antwoord: |-
        $x=\tfrac23\sin u$; $2\cos u$
      uitwerking: |-
        $4-9x^2=4-(3x)^2$: stel $3x=2\sin u$.
    - opgave: |-
        $\ig \dfrac{1}{\sqrt{x^2 - 6x + 13}}\dx$
      antwoord: |-
        $x-3=2\tan u$; $\tfrac{2}{\cos u}$
      uitwerking: |-
        $(x-3)^2+4$.
    - opgave: |-
        $\ig \dfrac{1}{3 + \sin x}\dx$
      antwoord: |-
        $t=\tan\tfrac x2$; $\tfrac{3+3t^2+2t}{1+t^2}$
      uitwerking: |-
        Een breuk met $\sin x$ zonder bruikbare afgeleide.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    de t-formules gebruiken
  opgave: |-
    Bereken $\sin x$ en $\cos x$ zonder rekentoestel. Controleer met $\sin^2 x + \cos^2 x = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        $\tan\tfrac x2 = \tfrac12$
      antwoord: |-
        $\sin x=\tfrac45$, $\cos x=\tfrac35$
      uitwerking: |-
        $\dfrac{1}{1+\frac14}=\tfrac45$ en $\dfrac{1-\frac14}{1+\frac14}=\tfrac35$.
    - opgave: |-
        $\tan\tfrac x2 = 3$. In welk kwadrant ligt $x$?
      antwoord: |-
        $\tfrac35$ en $-\tfrac45$; tweede kwadrant
      uitwerking: |-
        $\tfrac{6}{10}$ en $\tfrac{-8}{10}$: de sinus is positief en de cosinus negatief.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    oppervlakte van een cirkelsegment
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.6,font=\scriptsize]
        \fill[accent!30] (1,-1.732) arc[start angle=-60,end angle=60,radius=2] -- cycle;
        \rooster{-2}{1}{2}{-2}{1}{2}
        \draw[accent,thick] (0,0) circle (2);
        \draw[accent] (1,-2.3) -- (1,2.3);
      \end{tikzpicture}
  opgave: |-
    De rechte $x = 1$ snijdt van de cirkel $x^2 + y^2 = 4$ een stuk af. Bereken de oppervlakte van het kleinste stuk. Controleer met een sector min een driehoek.
  antwoord: |-
    $\tfrac{4\pi}{3}-\sqrt3\approx2{,}46$
  uitwerking: |-
    $2\displaystyle\int_1^2\sqrt{4-x^2}\dx=\Bigl[4\bgsin\tfrac x2+x\sqrt{4-x^2}\Bigr]_1^2=2\pi-\tfrac{2\pi}{3}-\sqrt3$. Controle: de sector heeft hoek $\tfrac{2\pi}{3}$ en oppervlakte $\tfrac12\cdot4\cdot\tfrac{2\pi}{3}$, de driehoek $\tfrac12\cdot2\sqrt3\cdot1$.

- id: h2-o7
  soort: opdracht
  niveau: 2
  thema: |-
    peilstok van een liggende tank
  prent:
    naam: ton
  opgave: |-
    Bij de tank uit het probleem (lengte 3~m, straal 1~m) wil je streepjes op de peilstok zetten.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat bij een hoogte $h$ (in m) het volume $V(h) = 3\Bigl((h - 1)\sqrt{2h - h^2} + \bgsin(h - 1) + \dfrac{\pi}{2}\Bigr)$ is.
      antwoord: |-
        integreer van $-1$ tot $h-1$
      uitwerking: |-
        $3\displaystyle\int_{-1}^{h-1}2\sqrt{1-y^2}\,\mathrm{d}y=3\bigl[y\sqrt{1-y^2}+\bgsin y\bigr]_{-1}^{h-1}$, met $1-(h-1)^2=2h-h^2$ en $\bgsin(-1)=-\tfrac{\pi}{2}$.
    - opgave: |-
        Hoeveel liter zit erin bij 25~cm, 1~m en 1,5~m?
      antwoord: |-
        ongeveer 680, 4712 en 7582 liter
      uitwerking: |-
        $V(0{,}25)\approx0{,}680$, $V(1)=\tfrac{3\pi}{2}\approx4{,}712$ en $V(1{,}5)\approx7{,}582$ m$^3$. Controle: $V(1{,}5)=3\pi-V(0{,}5)$, door de symmetrie.
    - opgave: |-
        Bij welke hoogte is de tank voor een kwart vol? Los numeriek op.
      antwoord: |-
        ongeveer 0,60 m
      uitwerking: |-
        $V(h)=\tfrac{3\pi}{4}$, of $(h-1)\sqrt{2h-h^2}+\bgsin(h-1)=-\tfrac{\pi}{4}$. Met het rekentoestel: $h\approx0{,}596$.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    lengte van een kabel
  prent:
    naam: hangbrug
  opgave: |-
    De kabel van een hangbrug hangt als de parabool $y = \dfrac{x^2}{250}$ tussen twee pylonen in $x = -50$ en $x = 50$ (in meter).
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel hangt de kabel in het midden door? Toon aan dat de lengte $L = \dfrac{2}{125}\ig_0^{50} \sqrt{x^2 + 125^2}\dx$ is.
      antwoord: |-
        10 m
      uitwerking: |-
        $y(50)=10$. $y'=\tfrac{x}{125}$, dus $\sqrt{1+y'^2}=\tfrac{1}{125}\sqrt{125^2+x^2}$, en de functie is even.
    - opgave: |-
        Bereken de lengte. Hoeveel langer dan 100~m is de kabel?
      antwoord: |-
        ongeveer 102,6 m
      uitwerking: |-
        Met de formule: $\dfrac{1}{125}\Bigl[x\sqrt{x^2+15625}+15625\ln\bigl(x+\sqrt{x^2+15625}\bigr)\Bigr]_0^{50}\approx102{,}6$. Bijna 2,6 m meer dan de afstand tussen de pylonen.

- id: h2-o9
  soort: opdracht
  niveau: 2
  thema: |-
    primitieve van $1/\sqrt{x^2 - a^2}$
  opgave: |-
    Neem $a > 0$ en $x > a$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon met $x = \dfrac{a}{\cos u}$ aan dat $\ig \dfrac{1}{\sqrt{x^2 - a^2}}\dx = \ln\bigl(x + \sqrt{x^2 - a^2}\bigr) + C$.
      antwoord: |-
        de integrand wordt $\tfrac{1}{\cos u}$
      uitwerking: |-
        $\dfrac{1}{a\tan u}\cdot\dfrac{a\sin u}{\cos^2u}=\dfrac{1}{\cos u}$. Dus $\ln\Bigl(\dfrac{1+\sin u}{\cos u}\Bigr)=\ln\Bigl(\dfrac xa+\dfrac{\sqrt{x^2-a^2}}{a}\Bigr)$, en $-\ln a$ zit in $C$.
    - opgave: |-
        Bereken $\ig_5^{13} \dfrac{1}{\sqrt{x^2 - 25}}\dx$.
      antwoord: |-
        $\ln5$
      uitwerking: |-
        $\ln(13+12)-\ln(5+0)=\ln\tfrac{25}{5}$.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    de kaart van Mercator
  opgave: |-
    Op een kaart volgens Mercator, met de aarde als bol met straal 1, ligt de breedtecirkel met breedte $\varphi$ op hoogte $y(\varphi) = \ig_0^\varphi \dfrac{1}{\cos\theta}\,\mathrm{d}\theta$ boven de evenaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Op welke hoogte ligt de breedtecirkel van $60^\circ$?
      antwoord: |-
        $\ln(2+\sqrt3)\approx1{,}317$
      uitwerking: |-
        $\ln\dfrac{1+\sin\frac{\pi}{3}}{\cos\frac{\pi}{3}}=\ln\dfrac{1+\frac{\sqrt3}{2}}{\frac12}$.
    - opgave: |-
        Brussel ligt op $50{,}85^\circ$. Bereken $y$ en vergelijk met de afstand op de bol, $\varphi$ in radialen.
      antwoord: |-
        $y\approx1{,}034$, tegenover $0{,}888$
      uitwerking: |-
        $\varphi\approx0{,}8875$ rad. Op de kaart is de afstand 16~\% langer: de kaart rekt in de hoogte uit.
    - opgave: |-
        Waarom staat de noordpool niet op de kaart?
      antwoord: |-
        de integraal divergeert
      uitwerking: |-
        Voor $\varphi\to\tfrac{\pi}{2}$ gaat $\cos\varphi$ naar 0 en $\dfrac{1+\sin\varphi}{\cos\varphi}$ naar $+\infty$: de pool ligt oneindig hoog.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    een andere weg naar $\sqrt{a^2 - x^2}$
  opgave: |-
    Neem $I = \ig \sqrt{1 - x^2}\dx$.
  lijst: enumerate
  delen:
    - opgave: |-
        Pas partiële integratie toe met $f = \sqrt{1 - x^2}$ en $g' = 1$, zoals bij $\sqrt{x^2 + a^2}$. Toon aan dat $I = x\sqrt{1 - x^2} - I + \bgsin x + C$.
      antwoord: |-
        schrijf $-x^2=(1-x^2)-1$
      uitwerking: |-
        $I=x\sqrt{1-x^2}+\displaystyle\int\dfrac{x^2}{\sqrt{1-x^2}}\dx$ en $\dfrac{x^2}{\sqrt{1-x^2}}=\dfrac{1}{\sqrt{1-x^2}}-\sqrt{1-x^2}$.
    - opgave: |-
        Besluit wat $I$ is. Vergelijk met de stelling: welke methode vind je het kortst?
      antwoord: |-
        $\tfrac12\bigl(x\sqrt{1-x^2}+\bgsin x\bigr)+C$
      uitwerking: |-
        $2I=x\sqrt{1-x^2}+\bgsin x+C$: dezelfde formule met $a=1$, zonder goniometrische substitutie.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    volume van een omwentelingslichaam
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=1cm,font=\scriptsize]
        \fill[accent!30] plot[domain=-4:4,samples=60] (\x,{1/(1+(\x)^2)}) -- plot[domain=4:-4,samples=60] (\x,{-1/(1+(\x)^2)}) -- cycle;
        \kromme{-4}{4}{1/(1+(\x)^2)}
        \kromme{-4}{4}{-1/(1+(\x)^2)}
        \draw[accent,fill=accent!45] (0,0) ellipse (.14 and 1);
        \assen{-4.3}{4.6}{-1.2}{1.4}
      \end{tikzpicture}
  opgave: |-
    De grafiek van $f(x) = \dfrac{1}{1 + x^2}$ wentelt om de $x$-as. Het lichaam loopt oneindig ver door.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het volume tussen $x = 0$ en $x = b$ gelijk is aan $\dfrac{\pi}{2}\Bigl(\dfrac{b}{1 + b^2} + \bgtan b\Bigr)$.
      antwoord: |-
        $x=\tan u$
      uitwerking: |-
        $\pi\displaystyle\int_0^b\dfrac{\mathrm{d}x}{(1+x^2)^2}=\pi\int_0^{\bgtan b}\cos^2u\du=\dfrac{\pi}{2}\bigl[u+\sin u\cos u\bigr]_0^{\bgtan b}$, en $\sin u\cos u=\dfrac{b}{1+b^2}$.
    - opgave: |-
        Bereken het volume van het hele lichaam.
      antwoord: |-
        $\tfrac{\pi^2}{2}\approx4{,}93$
      uitwerking: |-
        Voor $b\to+\infty$ gaat dat naar $\tfrac{\pi}{2}\cdot\tfrac{\pi}{2}$, en het lichaam is symmetrisch: twee keer $\tfrac{\pi^2}{4}$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte van een lens
  figuur:
    code: |-
      \begin{tikzpicture}[scale=1.1,font=\scriptsize]
        \fill[accent!35] (.5,.866) arc[start angle=120,end angle=240,radius=1] arc[start angle=-60,end angle=60,radius=1] -- cycle;
        \draw[accent,thick] (0,0) circle (1) (1,0) circle (1);
        \draw[->,grijs] (-1.2,0) -- (2.3,0) node[right,text=black] {$x$};
        \fill (0,0) circle (1pt) (1,0) circle (1pt);
        \node[below] at (1,0) {1};
      \end{tikzpicture}
  opgave: |-
    Twee cirkels met straal 1 hebben als middelpunten $(0, 0)$ en $(1, 0)$. Elk middelpunt ligt op de andere cirkel.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de oppervlakte van het gemeenschappelijke deel $4\ig_{1/2}^1 \sqrt{1 - x^2}\dx$ is.
      antwoord: |-
        symmetrie
      uitwerking: |-
        De lens is symmetrisch ten opzichte van de $x$-as en van de rechte $x=\tfrac12$: vier keer het stuk van de eerste cirkel rechts van $x=\tfrac12$ en boven de $x$-as.
    - opgave: |-
        Bereken de oppervlakte.
      antwoord: |-
        $\tfrac{2\pi}{3}-\tfrac{\sqrt3}{2}\approx1{,}228$
      uitwerking: |-
        $2\bigl[\bgsin x+x\sqrt{1-x^2}\bigr]_{1/2}^1=2\bigl(\tfrac{\pi}{2}-\tfrac{\pi}{6}-\tfrac{\sqrt3}{4}\bigr)$.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    t-formules met partieelbreuken of boogtangens
  opgave: |-
    Bereken.
  lijst: enumerate
  delen:
    - opgave: |-
        $\ig \dfrac{1}{2 + \sin x}\dx$ \ op $]-\pi, \pi[$
      antwoord: |-
        $\dfrac{2}{\sqrt3}\bgtan\dfrac{2\tan\frac x2+1}{\sqrt3}+C$
      uitwerking: |-
        $2+\sin x=\dfrac{2t^2+2t+2}{1+t^2}$, dus $\displaystyle\int\dfrac{\mathrm{d}t}{t^2+t+1}$, met $t^2+t+1=\bigl(t+\tfrac12\bigr)^2+\tfrac34$.
    - opgave: |-
        $\ig \dfrac{1}{4 + 5\cos x}\dx$ \ op $]-\bgcos(-\tfrac45), \bgcos(-\tfrac45)[$
      antwoord: |-
        $\tfrac13\ln\Bigl|\dfrac{3+\tan\frac x2}{3-\tan\frac x2}\Bigr|+C$
      uitwerking: |-
        $4+5\cos x=\dfrac{9-t^2}{1+t^2}$, dus $\displaystyle\int\dfrac{2}{9-t^2}\dt=\tfrac13\ln\Bigl|\dfrac{3+t}{3-t}\Bigr|+C$. Op het interval is de noemer positief.
    - opgave: |-
        $\ig_0^{\pi/2} \dfrac{\cos x}{1 + \cos x}\dx$
      antwoord: |-
        $\tfrac{\pi}{2}-1$
      uitwerking: |-
        $\dfrac{\cos x}{1+\cos x}=1-\dfrac{1}{1+\cos x}$, en $1+\cos x=\dfrac{2}{1+t^2}$: $\displaystyle\int_0^1\dfrac{1+t^2}{2}\cdot\dfrac{2}{1+t^2}\dt=1$. Dus $\tfrac{\pi}{2}-1$.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten
  opgave: |-
    Zoek de fout en verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Kato stelt $x = \sin u$ met $u \in [0, \pi]$, en schrijft $\sqrt{1 - x^2} = \cos u$.
      antwoord: |-
        $|\cos u|$; kies $u\in\bigl[-\tfrac{\pi}{2},\tfrac{\pi}{2}\bigr]$
      uitwerking: |-
        Voor $u>\tfrac{\pi}{2}$ is $\cos u<0$, maar een wortel is nooit negatief.
    - opgave: |-
        Mira berekent $\ig_0^1 \sqrt{1 - x^2}\dx$ met $x = \sin u$ als $\ig_0^1 \cos^2 u\du \approx 0{,}727$.
      antwoord: |-
        de grenzen worden $0$ en $\tfrac{\pi}{2}$; uitkomst $\tfrac{\pi}{4}$
      uitwerking: |-
        Mira hield de grenzen van $x$. Bij $x=1$ hoort $u=\tfrac{\pi}{2}$, niet $u=1$.
    - opgave: |-
        Jonas berekent $\ig_0^{2\pi} \dfrac{1}{2 + \cos x}\dx$ met $t = \tan\tfrac x2$. Beide grenzen worden $t = 0$, dus hij vindt 0. Hoe zie je meteen dat dat fout is?
      antwoord: |-
        de integrand is positief; uitkomst $\tfrac{2\pi}{\sqrt3}$
      uitwerking: |-
        In $x=\pi$ bestaat $\tan\tfrac x2$ niet: de t-formules gelden alleen op $]-\pi,\pi[$. Gebruik de periodiciteit: $\displaystyle\int_{-\pi}^{\pi}=2\int_0^{\pi}=2\lim_{b\to+\infty}\int_0^b\dfrac{2}{3+t^2}\dt=2\cdot\dfrac{2}{\sqrt3}\cdot\dfrac{\pi}{2}$.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    eerst het kwadraat afsplitsen
  opgave: |-
    Bereken. Kijk telkens eerst of je de uitkomst ook zonder rekenen ziet.
  lijst: enumerate
  delen:
    - opgave: |-
        $\ig \dfrac{1}{\sqrt{8 + 2x - x^2}}\dx$
      antwoord: |-
        $\bgsin\tfrac{x-1}{3}+C$
      uitwerking: |-
        $9-(x-1)^2$.
    - opgave: |-
        $\ig_1^3 \sqrt{3 + 2x - x^2}\dx$
      antwoord: |-
        $\pi$
      uitwerking: |-
        $4-(x-1)^2$: de grafiek is de bovenste helft van een cirkel met middelpunt $(1,0)$ en straal 2. Van 1 tot 3 is het een kwart schijf, $\tfrac14\cdot4\pi$.
    - opgave: |-
        $\ig_0^1 \dfrac{1}{\sqrt{x^2 + 2x + 2}}\dx$
      antwoord: |-
        $\ln\dfrac{2+\sqrt5}{1+\sqrt2}\approx0{,}562$
      uitwerking: |-
        $(x+1)^2+1$: $\bigl[\ln\bigl(x+1+\sqrt{x^2+2x+2}\bigr)\bigr]_0^1=\ln(2+\sqrt5)-\ln(1+\sqrt2)$.

- id: h2-o17
  soort: opdracht
  niveau: 3
  thema: |-
    gemiddelde van 1/(a + b cos x)
  opgave: |-
    Neem $a > b > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\ig_0^{\pi} \dfrac{1}{5 + 3\cos x}\dx = \lim\limits_{c \to +\infty} \ig_0^c \dfrac{1}{4 + t^2}\dt$, en bereken.
      antwoord: |-
        $\tfrac{\pi}{4}$
      uitwerking: |-
        $5+3\cos x=\dfrac{8+2t^2}{1+t^2}$, en $x\to\pi$ geeft $t\to+\infty$. $\displaystyle\int_0^c\dfrac{\mathrm{d}t}{4+t^2}=\tfrac12\bgtan\tfrac c2\to\tfrac{\pi}{4}$.
    - opgave: |-
        Besluit dat $\ig_0^{2\pi} \dfrac{1}{5 + 3\cos x}\dx = \dfrac{\pi}{2}$. Wat is de gemiddelde waarde van de functie over een periode?
      antwoord: |-
        $\tfrac14$
      uitwerking: |-
        De grafiek is symmetrisch ten opzichte van $x=\pi$: twee keer $\tfrac{\pi}{4}$. Gemiddelde: $\tfrac{\pi/2}{2\pi}=\tfrac14$.
    - opgave: |-
        Toon op dezelfde manier aan dat $\ig_0^{2\pi} \dfrac{1}{a + b\cos x}\dx = \dfrac{2\pi}{\sqrt{a^2 - b^2}}$. Controleer met a.
      antwoord: |-
        $\sqrt{25-9}=4$
      uitwerking: |-
        $a+b\cos x=\dfrac{(a+b)+(a-b)t^2}{1+t^2}$. Met $k^2=\tfrac{a+b}{a-b}$: $2\displaystyle\int_0^{+\infty}\dfrac{2}{(a-b)(k^2+t^2)}\dt=\dfrac{4}{a-b}\cdot\dfrac{1}{k}\cdot\dfrac{\pi}{2}=\dfrac{2\pi}{\sqrt{(a-b)(a+b)}}$.

- id: h2-o18
  soort: opdracht
  niveau: 3
  thema: |-
    machten van $1 + x^2$
  opgave: |-
    Met $x = \tan u$ wordt $\ig_0^{+\infty} \dfrac{1}{(1 + x^2)^n}\dx$ een integraal van een macht van $\cos u$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\ig_0^{+\infty} \dfrac{1}{(1 + x^2)^n}\dx = \ig_0^{\pi/2} \cos^{2n - 2} u\du$.
      antwoord: |-
        $(1+\tan^2u)^{-n}=\cos^{2n}u$
      uitwerking: |-
        $\mathrm{d}x=\dfrac{\mathrm{d}u}{\cos^2u}$, en $x\to+\infty$ geeft $u\to\tfrac{\pi}{2}$.
    - opgave: |-
        Bereken het voor $n = 2$ en $n = 3$. Gebruik $\cos^4 u = \Bigl(\dfrac{1 + \cos 2u}{2}\Bigr)^2$.
      antwoord: |-
        $\tfrac{\pi}{4}$ en $\tfrac{3\pi}{16}$
      uitwerking: |-
        $\displaystyle\int_0^{\pi/2}\cos^2u\du=\tfrac{\pi}{4}$. $\cos^4u=\tfrac14\bigl(1+2\cos2u+\cos^22u\bigr)$, en over $\bigl[0,\tfrac{\pi}{2}\bigr]$ geeft dat $\tfrac14\bigl(\tfrac{\pi}{2}+0+\tfrac{\pi}{4}\bigr)=\tfrac{3\pi}{16}$.
    - opgave: |-
        Teken $\dfrac{1}{1 + x^2}$ en $\dfrac{1}{(1 + x^2)^3}$. Waarom is de tweede oppervlakte kleiner?
      antwoord: |-
        $\tfrac{1}{(1+x^2)^3}\leqslant\tfrac{1}{1+x^2}$
      uitwerking: |-
        Voor $x\neq0$ is $1+x^2>1$, dus een hogere macht in de noemer geeft een kleinere waarde: $\tfrac{3\pi}{16}<\tfrac{\pi}{2}$.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    een sector van een hyperbool
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.75,font=\scriptsize]
        \fill[accent!35] (0,0) -- (2,1.732) -- plot[domain=1.317:-1.317,samples=40,smooth] ({cosh(\x)},{sinh(\x)}) -- cycle;
        \draw[->,grijs] (-.3,0) -- (2.7,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,-2) -- (0,2.2) node[above,text=black] {$y$};
        \draw[accent,thick] plot[domain=-1.5:1.5,samples=60,smooth] ({cosh(\x)},{sinh(\x)});
        \draw[accent] (0,0) -- (2,1.732) (0,0) -- (2,-1.732);
        \draw[lijngrijs,dashed] (2,-1.732) -- (2,1.732);
        \node[below right] at (2,0) {$a$};
        \node[below left] at (1,0) {1};
      \end{tikzpicture}
  opgave: |-
    De hyperbool $x^2 - y^2 = 1$ en de rechte $x = a$ (met $a > 1$) sluiten een gebied in. Samen met de oorsprong vormt dat een sector, zoals in de figuur.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon met de afgeleide aan dat $\ig \sqrt{x^2 - 1}\dx = \dfrac12\Bigl(x\sqrt{x^2 - 1} - \ln\bigl(x + \sqrt{x^2 - 1}\bigr)\Bigr) + C$.
      antwoord: |-
        zoals bij $\sqrt{x^2+a^2}$
      uitwerking: |-
        $\tfrac12\Bigl(\sqrt{x^2-1}+\dfrac{x^2}{\sqrt{x^2-1}}-\dfrac{1}{\sqrt{x^2-1}}\Bigr)=\tfrac12\Bigl(\sqrt{x^2-1}+\dfrac{x^2-1}{\sqrt{x^2-1}}\Bigr)=\sqrt{x^2-1}$.
    - opgave: |-
        Bereken de oppervlakte tussen de hyperbool en de rechte $x = a$.
      antwoord: |-
        $a\sqrt{a^2-1}-\ln\bigl(a+\sqrt{a^2-1}\bigr)$
      uitwerking: |-
        $2\displaystyle\int_1^a\sqrt{x^2-1}\dx$, en in $x=1$ is de primitieve 0.
    - opgave: |-
        Toon aan dat de sector oppervlakte $\ln\bigl(a + \sqrt{a^2 - 1}\bigr)$ heeft. Vergelijk met een sector van de cirkel $x^2 + y^2 = 1$, waar de oppervlakte de halve middelpuntshoek is.
      antwoord: |-
        driehoek min het gebied uit b
      uitwerking: |-
        De driehoek met hoekpunten $O$ en $\bigl(a,\pm\sqrt{a^2-1}\bigr)$ heeft oppervlakte $a\sqrt{a^2-1}$. Bij de cirkel speelt de hoek de rol die hier $\ln\bigl(a+\sqrt{a^2-1}\bigr)$ speelt: men noemt dat getal daarom een hyperbolische hoek.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    een substitutie zonder goniometrie
  opgave: |-
    Euler bedacht een substitutie die een wortel $\sqrt{x^2 + 1}$ algebraïsch wegwerkt: stel $t = x + \sqrt{x^2 + 1}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $x = \dfrac{t^2 - 1}{2t}$ en $\sqrt{x^2 + 1} = \dfrac{t^2 + 1}{2t}$.
      antwoord: |-
        kwadrateer $t-x=\sqrt{x^2+1}$
      uitwerking: |-
        $(t-x)^2=x^2+1$ geeft $t^2-2tx=1$. Dan $\sqrt{x^2+1}=t-x=t-\dfrac{t^2-1}{2t}=\dfrac{t^2+1}{2t}$.
    - opgave: |-
        Toon aan dat $\mathrm{d}x = \dfrac{t^2 + 1}{2t^2}\dt$, en bereken zo $\ig \dfrac{1}{\sqrt{x^2 + 1}}\dx$.
      antwoord: |-
        $\ln\bigl(x+\sqrt{x^2+1}\bigr)+C$
      uitwerking: |-
        $x=\tfrac t2-\tfrac{1}{2t}$, dus $x'(t)=\tfrac12+\tfrac{1}{2t^2}$. De integrand wordt $\dfrac{2t}{t^2+1}\cdot\dfrac{t^2+1}{2t^2}=\dfrac1t$, en $\displaystyle\int\dfrac{\mathrm{d}t}{t}=\ln t+C$.
    - opgave: |-
        Vergelijk met de tangenssubstitutie. Wat is het voordeel van elk?
      antwoord: |-
        Euler: meteen rationaal; tangens: een vast recept
      uitwerking: |-
        Met de substitutie van Euler wordt elke rationale functie van $x$ en $\sqrt{x^2+1}$ een rationale functie van $t$, zonder goniometrie. Met $x=\tan u$ krijg je goniometrische integralen, maar de terugweg met de driehoek is eenvoudig.

# --- Koppel ----------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Goniometrische functies
  opgave: |-
    De t-formules helpen ook bij vergelijkingen. Los $3\sin x + 4\cos x = 5$ op in $]-\pi, \pi[$.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel $t = \tan\tfrac x2$ en toon aan dat de vergelijking $9t^2 - 6t + 1 = 0$ wordt.
      antwoord: |-
        vermenigvuldig met $1+t^2$
      uitwerking: |-
        $6t+4(1-t^2)=5(1+t^2)$, dus $9t^2-6t+1=0$.
    - opgave: |-
        Los op, en controleer: de oplossing is ook $\bgtan\tfrac34$.
      antwoord: |-
        $x=2\bgtan\tfrac13\approx0{,}644$
      uitwerking: |-
        $(3t-1)^2=0$, dus $t=\tfrac13$. Met de t-formules: $\sin x=\tfrac35$ en $\cos x=\tfrac45$, dus $\tan x=\tfrac34$. Dat is het enige punt waar $3\sin x+4\cos x$ zijn maximum 5 bereikt.

- id: h2-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    Neem een reëel getal $t$ en het complexe getal $z = \dfrac{(1 + it)^2}{1 + t^2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $z = \dfrac{1 - t^2}{1 + t^2} + i\,\dfrac{2t}{1 + t^2}$.
      antwoord: |-
        werk het kwadraat uit
      uitwerking: |-
        $(1+it)^2=1+2it-t^2$.
    - opgave: |-
        Bereken de modulus en een argument van $1 + it$, en daarmee die van $z$. Leid de t-formules af.
      antwoord: |-
        $|z|=1$, $\arg z=2\bgtan t$
      uitwerking: |-
        $|1+it|=\sqrt{1+t^2}$ en een argument is $\bgtan t$. Bij een kwadraat verdubbelt het argument en wordt de modulus gekwadrateerd: $|z|=\dfrac{1+t^2}{1+t^2}=1$ en $\arg z=2\bgtan t=x$. Dus $z=\cos x+i\sin x$, en reëel en imaginair deel geven de t-formules.

- id: h2-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Oppervlakken
  opgave: |-
    Een torus ontstaat door de cirkel met middelpunt $(0, R)$ en straal $r < R$ in het $xy$-vlak om de $x$-as te wentelen.
  lijst: enumerate
  delen:
    - opgave: |-
        Een doorsnede loodrecht op de $x$-as op de plaats $x$ is een ring. Toon aan dat de buitenstraal $R + \sqrt{r^2 - x^2}$ en de binnenstraal $R - \sqrt{r^2 - x^2}$ is, en dat de ring oppervlakte $4\pi R\sqrt{r^2 - x^2}$ heeft.
      antwoord: |-
        verschil van twee schijven
      uitwerking: |-
        De cirkel is $x^2+(y-R)^2=r^2$, dus $y=R\pm\sqrt{r^2-x^2}$. $\pi\bigl((R+w)^2-(R-w)^2\bigr)=4\pi Rw$ met $w=\sqrt{r^2-x^2}$.
    - opgave: |-
        Toon aan dat het volume van de torus $2\pi^2 Rr^2$ is.
      antwoord: |-
        $4\pi R\cdot\tfrac{\pi r^2}{2}$
      uitwerking: |-
        $\displaystyle\int_{-r}^r4\pi R\sqrt{r^2-x^2}\dx=4\pi R\cdot\tfrac12\pi r^2$, want de integraal is een halve schijf met straal $r$.
    - opgave: |-
        Interpreteer: het volume is de oppervlakte van de cirkel maal de omtrek van de cirkel die het middelpunt beschrijft.
      antwoord: |-
        $\pi r^2\cdot2\pi R$
      uitwerking: |-
        Dat is de regel van Pappus en Guldinus: het volume van een omwentelingslichaam is de oppervlakte maal de weg die het zwaartepunt aflegt.

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Bereken $\ig \sqrt{25 - x^2}\dx$ met een goniometrische substitutie.
  antwoord: |-
    $\tfrac{25}{2}\bgsin\tfrac x5+\tfrac x2\sqrt{25-x^2}+C$
  uitwerking: |-
    $x=5\sin u$: $25\displaystyle\int\cos^2u\du=\tfrac{25}{2}(u+\sin u\cos u)+C$, met $\sin u=\tfrac x5$ en $\cos u=\tfrac{\sqrt{25-x^2}}{5}$.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Bereken $\ig \dfrac{1}{(x^2 + 16)^{3/2}}\dx$.
  antwoord: |-
    $\dfrac{x}{16\sqrt{x^2+16}}+C$
  uitwerking: |-
    $x=4\tan u$: $\tfrac{1}{16}\displaystyle\int\cos u\du=\tfrac{1}{16}\sin u+C$.

- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    Bereken $\ig_0^3 \dfrac{1}{\sqrt{x^2 + 16}}\dx$ exact.
  antwoord: |-
    $\ln2$
  uitwerking: |-
    $\ln(3+5)-\ln(0+4)=\ln2$.

- id: h2-t4
  soort: test
  niveau: 2
  opgave: |-
    Bereken $\ig_2^4 \dfrac{1}{x\sqrt{x^2 - 4}}\dx$.
  antwoord: |-
    $\tfrac{\pi}{6}$
  uitwerking: |-
    $x=\tfrac{2}{\cos u}$, grenzen 0 en $\tfrac{\pi}{3}$: de integrand wordt $\dfrac{\cos u}{2}\cdot\dfrac{1}{2\tan u}\cdot\dfrac{2\sin u}{\cos^2u}=\dfrac12$.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Bereken $\ig_0^{\pi/2} \dfrac{1}{3 + \cos x}\dx$ exact, en rond af op drie decimalen.
  antwoord: |-
    $\tfrac{1}{\sqrt2}\bgtan\tfrac{1}{\sqrt2}\approx0{,}435$
  uitwerking: |-
    $3+\cos x=\dfrac{4+2t^2}{1+t^2}$: $\displaystyle\int_0^1\dfrac{\mathrm{d}t}{2+t^2}=\dfrac{1}{\sqrt2}\Bigl[\bgtan\dfrac{t}{\sqrt2}\Bigr]_0^1$.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Een liggende cilindervormige tank is 2~m lang en heeft een straal van 60~cm. Het water staat 30~cm hoog. Hoeveel liter zit erin?
  antwoord: |-
    ongeveer 442 liter
  uitwerking: |-
    In meter: $2\displaystyle\int_{-0{,}6}^{-0{,}3}2\sqrt{0{,}36-y^2}\,\mathrm{d}y=2\cdot0{,}36\Bigl(\dfrac{\pi}{3}-\dfrac{\sqrt3}{4}\Bigr)\approx0{,}442$ m$^3$. Dezelfde figuur als in het probleem, met alle lengtes maal 0,6.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Kies een methode en bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\ig \dfrac{x}{\sqrt{9 - x^2}}\dx$
      antwoord: |-
        $-\sqrt{9-x^2}+C$
      uitwerking: |-
        Substitutie $u=9-x^2$.
    - opgave: |-
        $\ig \dfrac{\sqrt{9 - x^2}}{x^2}\dx$
      antwoord: |-
        $-\dfrac{\sqrt{9-x^2}}{x}-\bgsin\tfrac x3+C$
      uitwerking: |-
        $x=3\sin u$: $\displaystyle\int\dfrac{\cos^2u}{\sin^2u}\du=\int\Bigl(\dfrac{1}{\sin^2u}-1\Bigr)\du=-\dfrac{\cos u}{\sin u}-u+C$.
