# Oefeningen van hoofdstuk 3. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken of vereenvoudig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de afgeleide van $x(t) = R(t - \sin t)$
      antwoord: |-
        $R(1-\cos t)$
      uitwerking: |-
        $R$ is een constante.
    - opgave: |-
        $1 - \cos t$ \ met $\sin\tfrac t2$
      antwoord: |-
        $2\sin^2\tfrac t2$
      uitwerking: |-
        Carnot: $\sin^2\tfrac t2=\tfrac{1-\cos t}{2}$.
    - opgave: |-
        de cartesische coördinaten van $\bigl[2, \tfrac{\pi}{3}\bigr]$
      antwoord: |-
        $(1, \sqrt3)$
      uitwerking: |-
        $x=2\cos\tfrac{\pi}{3}$ en $y=2\sin\tfrac{\pi}{3}$.
    - opgave: |-
        $\ig_0^{2\pi} \cos^2 t\dt$
      antwoord: |-
        $\pi$
      uitwerking: |-
        $\Bigl[\tfrac t2+\tfrac{\sin2t}{4}\Bigr]_0^{2\pi}$.
    - opgave: |-
        de formule voor de lengte van de grafiek van $f$ op $[a, b]$
      antwoord: |-
        $\displaystyle\int_a^b\sqrt{1+f'(x)^2}\dx$
      uitwerking: |-
        Uit Integralen, hoofdstuk 4.
    - opgave: |-
        de manteloppervlakte van een kegel met straal 3 en hoogte 4
      antwoord: |-
        $15\pi$
      uitwerking: |-
        Schuine zijde $s=5$, dus $\pi rs=15\pi$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Een punt beweegt volgens $x = 3t + 1$, $y = 4t - 2$, voor $t \in [0, 2]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Teken de baan. Hoe lang is ze?
      antwoord: |-
        10
      uitwerking: |-
        Een lijnstuk van $(1, -2)$ naar $(7, 6)$: $\sqrt{36+64}=10$.
    - opgave: |-
        Bereken de snelheidsvector en de snelheid.
      antwoord: |-
        $(3, 4)$; 5
      uitwerking: |-
        $(x', y')=(3, 4)$ en $\sqrt{9+16}=5$.
    - opgave: |-
        Wat is het verband tussen de lengte, de snelheid en de tijd?
      antwoord: |-
        lengte = snelheid maal tijd
      uitwerking: |-
        $5\cdot2=10$.
    - opgave: |-
        Een ander punt beweegt volgens $x = 2\cos t$, $y = 2\sin t$ voor $t \in [0, \pi]$. Bereken de snelheid. Klopt hetzelfde verband?
      antwoord: |-
        snelheid 2; lengte $2\pi$
      uitwerking: |-
        $\sqrt{4\sin^2t+4\cos^2t}=2$, en $2\cdot\pi=2\pi$: een halve cirkel met straal 2. Is de snelheid niet constant, dan wordt de som een integraal.

# --- Korte oefeningen ------------------------------------------------------------------

- id: h3-boog
  soort: kort
  opgave: |-
    Bereken de lengte van de kromme.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = 3\cos t$, $y = 3\sin t$ \ voor $t \in \bigl[0, \tfrac{\pi}{2}\bigr]$
      antwoord: |-
        $\tfrac{3\pi}{2}$
      uitwerking: |-
        De snelheid is 3. Een kwart van een cirkel met straal 3.
    - opgave: |-
        $x = t^3$, $y = \tfrac32 t^2$ \ voor $t \in [0, 1]$
      antwoord: |-
        $2\sqrt2-1\approx1{,}83$
      uitwerking: |-
        $x'^2+y'^2=9t^4+9t^2$, dus de snelheid is $3t\sqrt{t^2+1}$, en $\bigl[(t^2+1)^{3/2}\bigr]_0^1$.
    - opgave: |-
        $x = 2(t - \sin t)$, $y = 2(1 - \cos t)$ \ voor $t \in [0, \pi]$
      antwoord: |-
        8
      uitwerking: |-
        Een halve boog van de cycloïde met $R=2$: $\displaystyle\int_0^{\pi}4\sin\tfrac t2\dt=\Bigl[-8\cos\tfrac t2\Bigr]_0^{\pi}=8$, de helft van $8R=16$.

- id: h3-fiets
  soort: kort
  opgave: |-
    Een kind fietst 2~km op een fiets met wielen met een straal van 25~cm. Welke weg legt het ventiel van het voorwiel af? Hangt dat af van de straal?
  antwoord: |-
    ongeveer 2546 m; nee
  uitwerking: |-
    Het ventiel beschrijft een cycloïde: per omwenteling $8R$ tegenover $2\pi R$ voor de fiets. $2000\cdot\tfrac{4}{\pi}\approx2546$ m, voor elke straal.

- id: h3-boogpool
  soort: kort
  opgave: |-
    Bereken de lengte van de kromme.
  lijst: enumerate
  delen:
    - opgave: |-
        de cardioïde $r = 3(1 + \cos\theta)$
      antwoord: |-
        24
      uitwerking: |-
        $r^2+r'^2=9\bigl((1+\cos\theta)^2+\sin^2\theta\bigr)=18(1+\cos\theta)=36\cos^2\tfrac\theta2$. $\displaystyle\int_0^{2\pi}6\bigl|\cos\tfrac\theta2\bigr|\dth=2\int_0^{\pi}6\cos\tfrac\theta2\dth=24$. Het is de cardioïde met $2a=3$, gedraaid: $16a=24$.
    - opgave: |-
        de spiraal $r = \e^{-\theta}$ voor $\theta \geqslant 0$, die oneindig vaak rond de pool draait
      antwoord: |-
        $\sqrt2$
      uitwerking: |-
        $r^2+r'^2=2\e^{-2\theta}$, dus $\displaystyle\int_0^{+\infty}\sqrt2\,\e^{-\theta}\dth=\sqrt2$: oneindig veel windingen, en toch een eindige lengte.

- id: h3-opppar
  soort: kort
  opgave: |-
    Bereken de oppervlakte met een parameter.
  lijst: enumerate
  delen:
    - opgave: |-
        tussen de $x$-as en de kromme $x = 2t$, $y = 1 - t^2$ \ voor $t \in [-1, 1]$
      antwoord: |-
        $\tfrac83$
      uitwerking: |-
        $x$ stijgt en $y\geqslant0$: $\displaystyle\int_{-1}^1(1-t^2)\cdot2\dt=\tfrac83$. Het is de parabool $y=1-\tfrac{x^2}{4}$.
    - opgave: |-
        binnen de ellips $x = 4\cos t$, $y = \sin t$
      antwoord: |-
        $4\pi$
      uitwerking: |-
        Bovenste helft, $t$ van $\pi$ naar 0: $\displaystyle\int_\pi^0\sin t\cdot(-4\sin t)\dt=4\int_0^\pi\sin^2t\dt=2\pi$. Twee helften: $4\pi=\pi\cdot4\cdot1$.

- id: h3-opppool
  soort: kort
  opgave: |-
    Bereken de oppervlakte in poolcoördinaten.
  lijst: enumerate
  delen:
    - opgave: |-
        binnen de cirkel $r = 3$
      antwoord: |-
        $9\pi$
      uitwerking: |-
        $\tfrac12\displaystyle\int_0^{2\pi}9\dth$.
    - opgave: |-
        binnen één blad van de roos $r = \cos 2\theta$
      antwoord: |-
        $\tfrac{\pi}{8}$
      uitwerking: |-
        Het blad rond de poolas hoort bij $\theta\in\bigl[-\tfrac{\pi}{4}, \tfrac{\pi}{4}\bigr]$: $\tfrac12\displaystyle\int\cos^22\theta\dth=\tfrac12\cdot\tfrac{\pi}{4}$.
    - opgave: |-
        binnen de cardioïde $r = 2(1 + \cos\theta)$
      antwoord: |-
        $6\pi$
      uitwerking: |-
        $\tfrac12\displaystyle\int_0^{2\pi}4(1+2\cos\theta+\cos^2\theta)\dth=2(2\pi+\pi)$.

- id: h3-volume
  soort: kort
  opgave: |-
    De kromme wentelt om de $x$-as. Bereken het volume.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = t^3$, $y = t^2$ \ voor $t \in [0, 1]$
      antwoord: |-
        $\tfrac{3\pi}{7}$
      uitwerking: |-
        $\pi\displaystyle\int_0^1t^4\cdot3t^2\dt=\tfrac{3\pi}{7}$.
    - opgave: |-
        de bovenste helft van de ellips $x = 2\cos t$, $y = \sin t$
      antwoord: |-
        $\tfrac{8\pi}{3}$
      uitwerking: |-
        $t$ van $\pi$ naar 0: $\pi\displaystyle\int_\pi^0\sin^2t\cdot(-2\sin t)\dt=2\pi\int_0^\pi\sin^3t\dt=2\pi\cdot\tfrac43$. Een ellipsoïde, $\tfrac43\pi\cdot2\cdot1\cdot1$.

- id: h3-mantel
  soort: kort
  opgave: |-
    De grafiek wentelt om de $x$-as. Bereken de manteloppervlakte.
  lijst: enumerate
  delen:
    - opgave: |-
        $y = 3$ \ op $[0, 4]$. Controleer met een cilinder.
      antwoord: |-
        $24\pi$
      uitwerking: |-
        $2\pi\displaystyle\int_0^43\dx=24\pi=2\pi rh$.
    - opgave: |-
        $y = \sqrt{x}$ \ op $[0, 6]$
      antwoord: |-
        $\tfrac{62\pi}{3}\approx64{,}9$
      uitwerking: |-
        $f^2+(ff')^2=x+\tfrac14$: $2\pi\Bigl[\tfrac23\bigl(x+\tfrac14\bigr)^{3/2}\Bigr]_0^6=\tfrac{4\pi}{3}\bigl(\tfrac{125}{8}-\tfrac18\bigr)$.
    - opgave: |-
        $y = 2\sqrt{x}$ \ op $[0, 3]$
      antwoord: |-
        $\tfrac{56\pi}{3}\approx58{,}6$
      uitwerking: |-
        $f^2+(ff')^2=4x+4$: $2\pi\displaystyle\int_0^32\sqrt{x+1}\dx=4\pi\cdot\tfrac23(8-1)$.

# --- Opdrachten ------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    booglengte met een parameter
  opgave: |-
    Bereken de lengte van de kromme.
  lijst: enumerate
  delen:
    - opgave: |-
        $x = 3t$, $y = 4t$ \ voor $t \in [0, 2]$. Controleer met Pythagoras.
      antwoord: |-
        10
      uitwerking: |-
        De snelheid is 5. Het lijnstuk van $(0, 0)$ naar $(6, 8)$.
    - opgave: |-
        $x = t^2$, $y = \tfrac23 t^3$ \ voor $t \in [0, \sqrt3]$
      antwoord: |-
        $\tfrac{14}{3}$
      uitwerking: |-
        Snelheid $\sqrt{4t^2+4t^4}=2t\sqrt{1+t^2}$: $\Bigl[\tfrac23(1+t^2)^{3/2}\Bigr]_0^{\sqrt3}=\tfrac23(8-1)$.
    - opgave: |-
        $x = \e^t\cos t$, $y = \e^t\sin t$ \ voor $t \in [0, \ln 2]$
      antwoord: |-
        $\sqrt2$
      uitwerking: |-
        $x'=\e^t(\cos t-\sin t)$, $y'=\e^t(\sin t+\cos t)$: $x'^2+y'^2=2\e^{2t}$. $\displaystyle\int_0^{\ln2}\sqrt2\,\e^t\dt=\sqrt2(2-1)$.
    - opgave: |-
        $x = \cos t + t\sin t$, $y = \sin t - t\cos t$ \ voor $t \in [0, 2\pi]$
      antwoord: |-
        $2\pi^2$
      uitwerking: |-
        $x'=t\cos t$ en $y'=t\sin t$, dus de snelheid is $t$: $\Bigl[\tfrac{t^2}{2}\Bigr]_0^{2\pi}$. Het is de baan van het uiteinde van een touw dat je van een klos afwikkelt.
    - opgave: |-
        de astroïde $x = \cos^3 t$, $y = \sin^3 t$ \ voor $t \in [0, 2\pi]$
      antwoord: |-
        6
      uitwerking: |-
        $x'^2+y'^2=9\cos^4t\sin^2t+9\sin^4t\cos^2t=9\sin^2t\cos^2t$. De snelheid is $3|\sin t\cos t|$. Door de symmetrie: $4\displaystyle\int_0^{\pi/2}3\sin t\cos t\dt=4\cdot\tfrac32$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    oppervlakte in poolcoördinaten
  opgave: |-
    Bereken de oppervlakte van het gebied binnen de kromme. Teken de kromme eerst.
  lijst: enumerate
  delen:
    - opgave: |-
        $r = 2\sin\theta$ \ voor $\theta \in [0, \pi]$
      antwoord: |-
        $\pi$
      uitwerking: |-
        $\tfrac12\displaystyle\int_0^\pi4\sin^2\theta\dth=\pi$: een cirkel met straal 1 door de pool.
    - opgave: |-
        de spiraal $r = \theta$ voor $\theta \in [0, 2\pi]$, samen met het stuk van de poolas tussen 0 en $2\pi$
      antwoord: |-
        $\tfrac{4\pi^3}{3}\approx41{,}3$
      uitwerking: |-
        $\tfrac12\displaystyle\int_0^{2\pi}\theta^2\dth=\tfrac{(2\pi)^3}{6}$.
    - opgave: |-
        de roos $r = \sin 2\theta$, alle bladen samen
      antwoord: |-
        $\tfrac{\pi}{2}$
      uitwerking: |-
        Vier bladen. Over $[0, 2\pi]$ wordt elk blad één keer doorlopen (ook waar $r<0$, want dan ligt het punt in de tegengestelde richting): $\tfrac12\displaystyle\int_0^{2\pi}\sin^22\theta\dth=\tfrac{\pi}{2}$.
    - opgave: |-
        de cardioïde $r = 1 + \cos\theta$
      antwoord: |-
        $\tfrac{3\pi}{2}$
      uitwerking: |-
        $\tfrac12\displaystyle\int_0^{2\pi}(1+2\cos\theta+\cos^2\theta)\dth=\tfrac12(2\pi+\pi)$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    manteloppervlakte
  opgave: |-
    De grafiek wentelt om de $x$-as. Bereken de manteloppervlakte.
  lijst: enumerate
  delen:
    - opgave: |-
        $y = 2x$ \ op $[0, 3]$. Controleer met $\pi rs$.
      antwoord: |-
        $18\sqrt5\,\pi\approx126{,}4$
      uitwerking: |-
        $2\pi\displaystyle\int_0^32x\sqrt5\dx=18\sqrt5\,\pi$. Kegel: $r=6$, $s=\sqrt{9+36}=3\sqrt5$.
    - opgave: |-
        $y = x^3$ \ op $[0, 1]$
      antwoord: |-
        $\tfrac{\pi}{27}\bigl(10\sqrt{10}-1\bigr)\approx3{,}56$
      uitwerking: |-
        $2\pi\displaystyle\int_0^1x^3\sqrt{1+9x^4}\dx$. Stel $u=1+9x^4$, $\mathrm{d}u=36x^3\dx$: $\tfrac{2\pi}{36}\cdot\tfrac23\bigl[u^{3/2}\bigr]_1^{10}$.
    - opgave: |-
        $y = \sqrt{4 - x^2}$ \ op $[-1, 1]$
      antwoord: |-
        $8\pi$
      uitwerking: |-
        Zoals bij de bol is $f\sqrt{1+f'^2}=2$: $2\pi\cdot2\cdot2$.
    - opgave: |-
        $y = \e^x$ \ op $[0, 1]$. Gebruik hoofdstuk 2.
      antwoord: |-
        ongeveer 22,94
      uitwerking: |-
        $2\pi\displaystyle\int_0^1\e^x\sqrt{1+\e^{2x}}\dx$. Stel $u=\e^x$: $2\pi\displaystyle\int_1^{\e}\sqrt{1+u^2}\du=\pi\Bigl[u\sqrt{1+u^2}+\ln\bigl(u+\sqrt{1+u^2}\bigr)\Bigr]_1^{\e}\approx22{,}94$.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    booglengte in poolcoördinaten
  opgave: |-
    Bereken de lengte van de kromme.
  lijst: enumerate
  delen:
    - opgave: |-
        $r = 5$ \ voor $\theta \in [0, 2\pi]$
      antwoord: |-
        $10\pi$
      uitwerking: |-
        $r'=0$: $\displaystyle\int_0^{2\pi}5\dth$.
    - opgave: |-
        $r = \e^\theta$ \ voor $\theta \in [0, 2\pi]$
      antwoord: |-
        $\sqrt2\bigl(\e^{2\pi}-1\bigr)\approx756$
      uitwerking: |-
        $r^2+r'^2=2\e^{2\theta}$.
    - opgave: |-
        $r = \theta^2$ \ voor $\theta \in [0, \sqrt5]$
      antwoord: |-
        $\tfrac{19}{3}$
      uitwerking: |-
        $\sqrt{\theta^4+4\theta^2}=\theta\sqrt{\theta^2+4}$: $\Bigl[\tfrac13(\theta^2+4)^{3/2}\Bigr]_0^{\sqrt5}=\tfrac13(27-8)$.
    - opgave: |-
        $r = 1 + \cos\theta$
      antwoord: |-
        8
      uitwerking: |-
        Een cardioïde met $2a=1$: $16a=8$. Of rechtstreeks: $\sqrt{2+2\cos\theta}=2\bigl|\cos\tfrac\theta2\bigr|$.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    oppervlakte met een parameter
  opgave: |-
    Bereken de oppervlakte met een parameter.
  lijst: enumerate
  delen:
    - opgave: |-
        binnen de ellips $x = 3\cos t$, $y = 2\sin t$. Controleer met $\pi ab$.
      antwoord: |-
        $6\pi$
      uitwerking: |-
        Zie de Nu jij bij het voorbeeld met de lus.
    - opgave: |-
        tussen de $x$-as en $x = t^2$, $y = t$ \ voor $t \in [0, 1]$. Welke grafiek is dit? Controleer.
      antwoord: |-
        $\tfrac23$
      uitwerking: |-
        $\displaystyle\int_0^1t\cdot2t\dt=\tfrac23$. Het is $y=\sqrt x$ op $[0, 1]$, en $\displaystyle\int_0^1\sqrt x\dx=\tfrac23$.
    - opgave: |-
        binnen de astroïde $x = \cos^3 t$, $y = \sin^3 t$
      antwoord: |-
        $\tfrac{3\pi}{8}$
      uitwerking: |-
        Vier keer het stuk in het eerste kwadrant, waar $t$ van $\tfrac{\pi}{2}$ naar 0 gaat: $4\displaystyle\int_0^{\pi/2}\sin^3t\cdot3\cos^2t\sin t\dt=12\int_0^{\pi/2}\sin^4t\cos^2t\dt=12\cdot\tfrac{\pi}{32}$.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    volume met een parameter
  opgave: |-
    De kromme wentelt om de $x$-as. Bereken het volume.
  lijst: enumerate
  delen:
    - opgave: |-
        de ellips $x = 3\cos t$, $y = 2\sin t$. Welk lichaam krijg je?
      antwoord: |-
        $16\pi$; een ellipsoïde
      uitwerking: |-
        $2\pi\displaystyle\int_0^{\pi/2}4\sin^2t\cdot3\sin t\dt=24\pi\cdot\tfrac23=16\pi$, met $\displaystyle\int_0^{\pi/2}\sin^3t\dt=\tfrac23$.
    - opgave: |-
        de astroïde $x = \cos^3 t$, $y = \sin^3 t$
      antwoord: |-
        $\tfrac{32\pi}{105}\approx0{,}957$
      uitwerking: |-
        $2\pi\displaystyle\int_0^{\pi/2}\sin^6t\cdot3\cos^2t\sin t\dt$. Stel $u=\cos t$: $6\pi\displaystyle\int_0^1(1-u^2)^3u^2\du=6\pi\bigl(\tfrac13-\tfrac35+\tfrac37-\tfrac19\bigr)=6\pi\cdot\tfrac{16}{315}$.

- id: h3-o7
  soort: opdracht
  niveau: 1
  thema: |-
    de juiste formule kiezen
  opgave: |-
    Schrijf de integraal op die het gevraagde geeft. Je hoeft ze niet te berekenen.
  lijst: enumerate
  delen:
    - opgave: |-
        de lengte van de grafiek van $y = \ln x$ op $[1, 2]$
      antwoord: |-
        $\displaystyle\int_1^2\sqrt{1+\tfrac{1}{x^2}}\dx$
      uitwerking: |-
        De formule uit Integralen.
    - opgave: |-
        de oppervlakte binnen $r = 1 + \sin\theta$
      antwoord: |-
        $\tfrac12\displaystyle\int_0^{2\pi}(1+\sin\theta)^2\dth$
      uitwerking: |-
        Een gedraaide cardioïde; de uitkomst is $\tfrac{3\pi}{2}$.
    - opgave: |-
        de lengte van $x = \cos t$, $y = \sin 2t$ \ voor $t \in [0, 2\pi]$
      antwoord: |-
        $\displaystyle\int_0^{2\pi}\sqrt{\sin^2t+4\cos^22t}\dt$
      uitwerking: |-
        Een Lissajousfiguur; alleen numeriek te berekenen.
    - opgave: |-
        de manteloppervlakte als $y = \e^x$ op $[0, 1]$ om de $x$-as wentelt
      antwoord: |-
        $2\pi\displaystyle\int_0^1\e^x\sqrt{1+\e^{2x}}\dx$
      uitwerking: |-
        Met de wortel van de booglengte.
    - opgave: |-
        het volume als $y = \e^x$ op $[0, 1]$ om de $x$-as wentelt
      antwoord: |-
        $\pi\displaystyle\int_0^1\e^{2x}\dx$
      uitwerking: |-
        Zonder wortel: schijven, geen banden.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    de cardioïde van twee munten
  opgave: |-
    Een munt van 1 euro heeft een diameter van 23,25~mm. Je rolt een munt rond een tweede, zoals in de module Krommen en meetkundige plaatsen. Een punt van de rand beschrijft de cardioïde $r = 2a(1 - \cos\theta)$, met $a$ de straal.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de cardioïde?
      antwoord: |-
        ongeveer 18,6 cm
      uitwerking: |-
        $16a=16\cdot1{,}1625$~cm.
    - opgave: |-
        Hoeveel keer de oppervlakte van een munt is de oppervlakte binnen de cardioïde?
      antwoord: |-
        6 keer; ongeveer $25{,}5$ cm$^2$
      uitwerking: |-
        $\tfrac12\displaystyle\int_0^{2\pi}4a^2(1-\cos\theta)^2\dth=2a^2(2\pi+\pi)=6\pi a^2$.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    de lemniscaat
  opgave: |-
    De lemniscaat met brandpunten $(\pm c, 0)$ heeft poolvergelijking $r^2 = 2c^2\cos 2\theta$.
  lijst: enumerate
  delen:
    - opgave: |-
        Iemand berekent $\tfrac12\ig_0^{2\pi} 2c^2\cos 2\theta\dth = 0$. Wat is er fout?
      antwoord: |-
        $r^2$ is soms negatief
      uitwerking: |-
        Waar $\cos2\theta<0$, bestaat er geen punt: daar mag je niet integreren. Integreer alleen over $\bigl[-\tfrac{\pi}{4}, \tfrac{\pi}{4}\bigr]$ en $\bigl[\tfrac{3\pi}{4}, \tfrac{5\pi}{4}\bigr]$.
    - opgave: |-
        Bereken de oppervlakte binnen de lemniscaat met $c = 3$.
      antwoord: |-
        18
      uitwerking: |-
        $2c^2$, zoals in het voorbeeld.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    het bifolium
  figuur:
    code: |-
      \begin{tikzpicture}[scale=3.2,font=\scriptsize]
        \fill[accent!30] plot[domain=0:180,samples=120,variable=\t] (\t:{sin(\t)*(cos(\t))^2}) -- cycle;
        \draw[->,grijs] (-.5,0) -- (.55,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,-.05) -- (0,.4) node[above,text=black] {$y$};
        \poolkromme{0}{180}{sin(\t)*(cos(\t))^2}
      \end{tikzpicture}
  opgave: |-
    Het bifolium (tweeblad) heeft poolvergelijking $r = a\sin\theta\cos^2\theta$, met $a > 0$. De figuur toont het voor $a = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de kromme één keer doorlopen wordt voor $\theta \in [0, \pi]$, en dat $r \geqslant 0$ op dat interval.
      antwoord: |-
        $r(\theta+\pi)=-r(\theta)$
      uitwerking: |-
        $\sin\theta\geqslant0$ en $\cos^2\theta\geqslant0$ op $[0, \pi]$. Voor $\theta+\pi$ is $r$ tegengesteld, en $[-r, \theta+\pi]$ is hetzelfde punt als $[r, \theta]$: het tweede halve toertje tekent de kromme opnieuw.
    - opgave: |-
        Bereken de oppervlakte binnen de twee bladen.
      antwoord: |-
        $\tfrac{\pi a^2}{32}$
      uitwerking: |-
        $\tfrac{a^2}{2}\displaystyle\int_0^\pi\sin^2\theta\cos^4\theta\dth$. Met $\sin\theta\cos\theta=\tfrac12\sin2\theta$ en $\cos^2\theta=\tfrac{1+\cos2\theta}{2}$ wordt de integrand $\tfrac18\sin^22\theta\,(1+\cos2\theta)$. Over $[0, \pi]$ geeft $\sin^22\theta$ de waarde $\tfrac{\pi}{2}$ en $\sin^22\theta\cos2\theta$ de waarde 0. Dus $\tfrac{a^2}{2}\cdot\tfrac18\cdot\tfrac{\pi}{2}$.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    oppervlakte tussen twee poolkrommen
  figuur:
    code: |-
      \begin{tikzpicture}[scale=.75,font=\scriptsize]
        \fill[accent!30] plot[domain=-60:60,samples=60,variable=\t] (\t:{3*cos(\t)}) -- plot[domain=60:-60,samples=60,variable=\t] (\t:{1+cos(\t)}) -- cycle;
        \draw[->,grijs] (-.6,0) -- (3.5,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,-1.7) -- (0,1.9) node[above,text=black] {$y$};
        \poolkromme{-90}{90}{3*cos(\t)}
        \poolkromme[dashed]{0}{360}{1+cos(\t)}
      \end{tikzpicture}
  opgave: |-
    De figuur toont de cirkel $r = 3\cos\theta$ en de cardioïde $r = 1 + \cos\theta$ (gestreept).
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de snijpunten buiten de pool.
      antwoord: |-
        $\bigl[\tfrac32, \pm\tfrac{\pi}{3}\bigr]$
      uitwerking: |-
        $3\cos\theta=1+\cos\theta$ geeft $\cos\theta=\tfrac12$.
    - opgave: |-
        Bereken de oppervlakte van het gebied binnen de cirkel en buiten de cardioïde.
      antwoord: |-
        $\pi$
      uitwerking: |-
        Het verschil van twee sectoren: $\tfrac12\displaystyle\int_{-\pi/3}^{\pi/3}\bigl(9\cos^2\theta-(1+\cos\theta)^2\bigr)\dth=\int_0^{\pi/3}(8\cos^2\theta-2\cos\theta-1)\dth=\Bigl[3\theta+2\sin2\theta-2\sin\theta\Bigr]_0^{\pi/3}=\pi$.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    een lus
  figuur:
    code: |-
      \begin{tikzpicture}[scale=1.2,font=\scriptsize]
        \fill[accent!30] plot[domain=-1:1,samples=60,variable=\t] ({(\t)^2-1},{(\t)^3-\t}) -- cycle;
        \draw[->,grijs] (-1.3,0) -- (1.5,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,-.9) -- (0,.9) node[above,text=black] {$y$};
        \pkromme{-1.45}{1.45}{(\t)^2-1}{(\t)^3-\t}
        \node[below left] at (-1,0) {$-1$};
      \end{tikzpicture}
  opgave: |-
    De kromme $x = t^2 - 1$, $y = t^3 - t$ heeft een lus.
  lijst: enumerate
  delen:
    - opgave: |-
        Bij welke twee waarden van $t$ gaat de kromme door hetzelfde punt? Welk punt?
      antwoord: |-
        $t=\pm1$; de oorsprong
      uitwerking: |-
        Dezelfde $x$ vraagt $t_2=-t_1$, dezelfde $y$ dan $t^3-t=0$ met $t\neq0$.
    - opgave: |-
        Bereken de oppervlakte binnen de lus.
      antwoord: |-
        $\tfrac{8}{15}$
      uitwerking: |-
        Symmetrisch ten opzichte van de $x$-as. Voor $t\in[-1, 0]$ is $y\geqslant0$ en daalt $x$: $-\displaystyle\int_{-1}^0(t^3-t)\cdot2t\dt=\tfrac{4}{15}$. Twee keer.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    de groef van een grammofoonplaat
  opgave: |-
    De groef van een grammofoonplaat is een spiraal $r = b\theta$. Na één toer is de afstand tot het middelpunt 0,1~mm kleiner. De groef loopt van $r = 15$~cm tot $r = 6$~cm.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $b$ (in cm), en hoeveel toeren de groef maakt.
      antwoord: |-
        $b=\tfrac{0{,}01}{2\pi}$; 900 toeren
      uitwerking: |-
        Na een toer verandert $r$ met $2\pi b=0{,}01$~cm. $\tfrac{15-6}{0{,}01}=900$.
    - opgave: |-
        Toon aan dat $\sqrt{r^2 + r'^2}$ hier bijna gelijk is aan $r$.
      antwoord: |-
        $r'=b$ is heel klein tegenover $r$
      uitwerking: |-
        $r'=b\approx0{,}0016$ cm, en $r\geqslant6$ cm: $\sqrt{r^2+b^2}=r\sqrt{1+\tfrac{b^2}{r^2}}$, met $\tfrac{b^2}{r^2}<10^{-7}$.
    - opgave: |-
        Hoe lang is de groef ongeveer?
      antwoord: |-
        ongeveer 594 m
      uitwerking: |-
        $L\approx\displaystyle\int r\dth=\int_{r_1/b}^{r_2/b}b\theta\dth=\dfrac{r_2^2-r_1^2}{2b}=\dfrac{\pi(225-36)}{0{,}01}\approx59\,376$ cm. Dat is de oppervlakte van de ring gedeeld door de breedte van een toer.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    de mantel van een afgeknotte kegel
  prent:
    naam: vaas
  opgave: |-
    Een afgeknotte kegel heeft stralen $r_1 < r_2$ en schuine zijde $s$. Hij is een kegel met schuine zijde $s_2$ waarvan een kegel met schuine zijde $s_1 = s_2 - s$ is afgesneden.
  lijst: enumerate
  delen:
    - opgave: |-
        Verklaar $\dfrac{s_1}{r_1} = \dfrac{s_2}{r_2}$, en toon aan dat de mantel $\pi r_2 s_2 - \pi r_1 s_1 = \pi(r_1 + r_2)\,s$ is.
      antwoord: |-
        gelijkvormigheid
      uitwerking: |-
        De twee kegels zijn gelijkvormig. Met $r_1s_2=r_2s_1$ is $r_2s_2-r_1s_1=r_2s_2-r_1s_1+(r_1s_2-r_2s_1)=(r_1+r_2)(s_2-s_1)$.
    - opgave: |-
        Controleer met de formule voor de manteloppervlakte, voor $y = \tfrac12 x + 1$ op $[0, 2]$.
      antwoord: |-
        $3\sqrt5\,\pi$
      uitwerking: |-
        Stralen 1 en 2, $s=\sqrt{4+1}=\sqrt5$: $3\sqrt5\,\pi$. Met de integraal: $2\pi\displaystyle\int_0^2\bigl(\tfrac x2+1\bigr)\tfrac{\sqrt5}{2}\dx=\pi\sqrt5\bigl[\tfrac{x^2}{4}+x\bigr]_0^2=3\sqrt5\,\pi$.
    - opgave: |-
        Een lampenkap is bovenaan 20~cm breed, onderaan 30~cm, en 25~cm hoog. Hoeveel stof is er nodig?
      antwoord: |-
        ongeveer 2000 cm$^2$
      uitwerking: |-
        $s=\sqrt{25^2+5^2}\approx25{,}5$ cm: $\pi(10+15)\cdot25{,}5\approx2002$ cm$^2$.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten
  opgave: |-
    Zoek de fout en verbeter.
  lijst: enumerate
  delen:
    - opgave: |-
        Wout berekent de mantel als $y = \sqrt{x}$ op $[0, 2]$ wentelt als $2\pi\ig_0^2 \sqrt{x}\dx \approx 11{,}85$.
      antwoord: |-
        de wortel ontbreekt; $\tfrac{13\pi}{3}\approx13{,}61$
      uitwerking: |-
        Wout rekent met $\Delta x$ in plaats van $\Delta s$: zijn uitkomst is te klein. Zie de Nu jij bij de bol.
    - opgave: |-
        Noor berekent de lengte van de astroïde $x = \cos^3 t$, $y = \sin^3 t$ als $\ig_0^{2\pi} 3\sin t\cos t\dt = 0$.
      antwoord: |-
        $\sqrt{u^2}=|u|$; uitkomst 6
      uitwerking: |-
        Een lengte kan niet 0 zijn. De wortel van $9\sin^2t\cos^2t$ is $3|\sin t\cos t|$, en die is niet overal gelijk aan $3\sin t\cos t$.
    - opgave: |-
        Sam berekent de oppervlakte binnen het trifolium $r = \cos 3\theta$ als $\tfrac12\ig_0^{2\pi} \cos^2 3\theta\dth = \tfrac{\pi}{2}$.
      antwoord: |-
        elk blad telt dubbel; $\tfrac{\pi}{4}$
      uitwerking: |-
        Over $[0, \pi]$ wordt het trifolium al één keer volledig doorlopen; over $[0, 2\pi]$ twee keer.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    de stelling van Archimedes over de bolschijf
  opgave: |-
    Een bol met straal 3 wordt gesneden door twee evenwijdige vlakken op afstand 2 van elkaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de oppervlakte van het stuk boloppervlak tussen de vlakken $x = 1$ en $x = 3$, en tussen $x = -1$ en $x = 1$.
      antwoord: |-
        $12\pi$ en $12\pi$
      uitwerking: |-
        $f\sqrt{1+f'^2}=3$ voor $f=\sqrt{9-x^2}$: telkens $2\pi\cdot3\cdot2$.
    - opgave: |-
        Een sinaasappel met diameter 8~cm wordt in 8 even dikke schijven gesneden. Welke schijf heeft de meeste schil?
      antwoord: |-
        alle even veel: $8\pi$ cm$^2$
      uitwerking: |-
        Elke schijf is 1~cm dik, met $r=4$: $2\pi\cdot4\cdot1=8\pi$ cm$^2$ schil, ook de buitenste. (Een schijf in het midden is breder, maar de schil van een buitenste schijf staat schuiner.)

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    snelheid op een hoge bi
  prent:
    naam: fiets
  opgave: |-
    Een hoge bi had een voorwiel met een diameter van 1,5~m. De fietser rijdt 15~km/h.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke weg legt een punt van de band af per omwenteling, en welke de fiets?
      antwoord: |-
        6 m en ongeveer 4,71 m
      uitwerking: |-
        $8R=8\cdot0{,}75$ m en $2\pi R=1{,}5\pi$ m.
    - opgave: |-
        Wat is de gemiddelde snelheid van dat punt? En de grootste?
      antwoord: |-
        ongeveer 19,1 km/h; 30 km/h
      uitwerking: |-
        $15\cdot\tfrac{4}{\pi}\approx19{,}1$. Bovenaan gaat het punt twee keer zo snel als de fiets: de snelheid van het middelpunt plus die van het draaien.

- id: h3-o18
  soort: opdracht
  niveau: 3
  thema: |-
    de hoorn van Gabriël
  figuur:
    code: |-
      \begin{tikzpicture}[x=.55cm,y=.8cm,font=\scriptsize]
        \lichaam{1}{6}{1/\x}
        \assen{-.2}{6.6}{-1.3}{1.4}
        \node[below] at (1,-1) {1};
      \end{tikzpicture}
  opgave: |-
    De grafiek van $y = \dfrac1x$ op $[1, +\infty[$ wentelt om de $x$-as. Torricelli onderzocht dit lichaam in 1643.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het volume $\pi$ is.
      antwoord: |-
        $\pi\displaystyle\int_1^{+\infty}\tfrac{1}{x^2}\dx$
      uitwerking: |-
        $\pi\Bigl[-\tfrac1x\Bigr]_1^b=\pi\bigl(1-\tfrac1b\bigr)\to\pi$.
    - opgave: |-
        Toon aan dat de manteloppervlakte oneindig is: vergelijk de integrand met $\tfrac1x$.
      antwoord: |-
        $\tfrac1x\sqrt{1+\tfrac1{x^4}}\geqslant\tfrac1x$
      uitwerking: |-
        $S\geqslant2\pi\displaystyle\int_1^b\tfrac1x\dx=2\pi\ln b$, en dat gaat naar $+\infty$.
    - opgave: |-
        Je kunt de hoorn dus vullen met $\pi$ liter verf, maar niet schilderen. Hoe verklaar je die paradox?
      antwoord: |-
        een laag verf heeft een dikte
      uitwerking: |-
        Om de wand te schilderen, heb je een laag met een vaste dikte nodig. Ver in de hoorn is de straal kleiner dan die dikte, en daar past de laag niet meer. Wiskundig is een oppervlakte iets anders dan een volume.

- id: h3-o19
  soort: opdracht
  niveau: 3
  thema: |-
    manteloppervlakte met een parameter
  opgave: |-
    Voor een kromme met een parameter, met $y(t) \geqslant 0$, is de manteloppervlakte bij het wentelen om de $x$-as $S = 2\pi\ig_\alpha^\beta y(t)\sqrt{x'(t)^2 + y'(t)^2}\dt$.
  lijst: enumerate
  delen:
    - opgave: |-
        Verklaar die formule met de bandjes uit de opbouw: wat is $\Delta s$ hier?
      antwoord: |-
        $\Delta s\approx\sqrt{x'^2+y'^2}\,\Delta t$
      uitwerking: |-
        Elk stukje boog beschrijft een band met omtrek $2\pi y(t)$ en breedte $\Delta s$, en $\Delta s$ is de booglengte met een parameter.
    - opgave: |-
        De cirkel $x = r\cos t$, $y = R + r\sin t$ (met $r < R$) wentelt om de $x$-as: een torus. Toon aan dat de oppervlakte $4\pi^2Rr$ is.
      antwoord: |-
        $2\pi\displaystyle\int_0^{2\pi}(R+r\sin t)\,r\dt$
      uitwerking: |-
        De snelheid is $r$, en $\displaystyle\int_0^{2\pi}\sin t\dt=0$: $2\pi r\cdot2\pi R$. De omtrek van de cirkel maal de weg van het middelpunt.
    - opgave: |-
        Eén boog van de cycloïde $x = R(t - \sin t)$, $y = R(1 - \cos t)$ wentelt om de $x$-as. Toon aan dat de manteloppervlakte $\tfrac{64}{3}\pi R^2$ is.
      antwoord: |-
        $2\pi\displaystyle\int_0^{2\pi}2R^2\sin^2\tfrac t2\cdot2\sin\tfrac t2\dt$
      uitwerking: |-
        $y=2R\sin^2\tfrac t2$ en de snelheid is $2R\sin\tfrac t2$. Met $u=\tfrac t2$: $16\pi R^2\displaystyle\int_0^\pi\sin^3u\du=16\pi R^2\cdot\tfrac43$.

- id: h3-o20
  soort: opdracht
  niveau: 3
  thema: |-
    de sectorformule van Leibniz
  opgave: |-
    Een gesloten kromme wordt één keer tegen de klok in doorlopen, voor $t \in [\alpha, \beta]$. Dan is de oppervlakte erbinnen $A = \dfrac12\ig_\alpha^\beta \bigl(x\,y' - y\,x'\bigr)\dt$.
  lijst: enumerate
  delen:
    - opgave: |-
        De driehoek met hoekpunten $O$, $P(x, y)$ en $Q(x + \Delta x, y + \Delta y)$ heeft oppervlakte $\tfrac12(x\,\Delta y - y\,\Delta x)$ als $Q$ tegen de klok in na $P$ komt. Verklaar daarmee de formule.
      antwoord: |-
        som van smalle driehoeken vanuit $O$
      uitwerking: |-
        Verdeel het gebied in smalle driehoeken met top $O$, zoals bij de sectoren in poolcoördinaten. Met $\Delta x\approx x'\Delta t$ en $\Delta y\approx y'\Delta t$ is elke driehoek $\tfrac12(xy'-yx')\,\Delta t$, en de som wordt een integraal.
    - opgave: |-
        Controleer met de ellips $x = 3\cos t$, $y = 2\sin t$.
      antwoord: |-
        $6\pi$
      uitwerking: |-
        $xy'-yx'=6\cos^2t+6\sin^2t=6$: $\tfrac12\cdot6\cdot2\pi$.
    - opgave: |-
        Toon aan dat de formule voor een poolkromme $x = r\cos\theta$, $y = r\sin\theta$ de formule $\tfrac12\ig r^2\dth$ wordt.
      antwoord: |-
        $xy'-yx'=r^2$
      uitwerking: |-
        Met de afgeleiden uit het bewijs van de booglengte in poolcoördinaten: $r\cos\theta(r'\sin\theta+r\cos\theta)-r\sin\theta(r'\cos\theta-r\sin\theta)=r^2$.

- id: h3-o21
  soort: opdracht
  niveau: 2
  thema: |-
    lengte en oppervlakte van een lus
  figuur:
    code: |-
      \begin{tikzpicture}[x=.3cm,y=.3cm,font=\scriptsize]
        \fill[accent!30] plot[domain=-1.732:1.732,samples=60,variable=\t] ({3*(\t)^2},{3*\t-(\t)^3}) -- cycle;
        \draw[->,grijs] (-.5,0) -- (13,0) node[right,text=black] {$x$};
        \draw[->,grijs] (0,-4) -- (0,4.2) node[above,text=black] {$y$};
        \pkromme{-2.05}{2.05}{3*(\t)^2}{3*\t-(\t)^3}
        \node[below] at (9,0) {9};
      \end{tikzpicture}
  opgave: |-
    De kromme $x = 3t^2$, $y = 3t - t^3$ heeft een lus voor $t \in [-\sqrt3, \sqrt3]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de kromme bij $t = \pm\sqrt3$ door hetzelfde punt gaat.
      antwoord: |-
        $(9, 0)$
      uitwerking: |-
        $x=9$ en $y=\pm\sqrt3(3-3)=0$.
    - opgave: |-
        Bereken de lengte van de lus.
      antwoord: |-
        $12\sqrt3\approx20{,}8$
      uitwerking: |-
        $x'^2+y'^2=36t^2+9(1-t^2)^2=9(1+t^2)^2$, dus de snelheid is $3(1+t^2)$. $\displaystyle\int_{-\sqrt3}^{\sqrt3}3(1+t^2)\dt=6\sqrt3+6\sqrt3$.
    - opgave: |-
        Bereken de oppervlakte binnen de lus.
      antwoord: |-
        $\tfrac{72\sqrt3}{5}\approx24{,}9$
      uitwerking: |-
        Symmetrisch ten opzichte van de $x$-as. Voor $t\in[0, \sqrt3]$ stijgt $x$ en is $y\geqslant0$: $\displaystyle\int_0^{\sqrt3}(3t-t^3)\,6t\dt=6\Bigl[t^3-\tfrac{t^5}{5}\Bigr]_0^{\sqrt3}=\tfrac{36\sqrt3}{5}$. Twee keer.

# --- Koppel ----------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Numerieke methodes
  opgave: |-
    De omtrek van de ellips $x = 2\cos t$, $y = \sin t$ kun je niet exact berekenen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de omtrek $L = 4\ig_0^{\pi/2} \sqrt{1 + 3\sin^2 t}\dt$ is.
      antwoord: |-
        $4\sin^2t+\cos^2t=1+3\sin^2t$
      uitwerking: |-
        $x'=-2\sin t$, $y'=\cos t$, en vier gelijke kwarten.
    - opgave: |-
        Benader de integraal met de regel van Simpson, $\ig_a^b f \approx \tfrac{h}{3}\bigl(f_0 + 4f_1 + 2f_2 + 4f_3 + f_4\bigr)$, met vier deelintervallen.
      antwoord: |-
        $L\approx9{,}691$
      uitwerking: |-
        $h=\tfrac{\pi}{8}$. De functiewaarden in $0, \tfrac{\pi}{8}, \ldots, \tfrac{\pi}{2}$ zijn ongeveer $1$; $1{,}1997$; $1{,}5811$; $1{,}8870$; $2$. Dat geeft $4\cdot2{,}4228\approx9{,}691$; de echte waarde is $9{,}688$.
    - opgave: |-
        Waarom ligt de omtrek tussen $2\pi$ en $4\pi$?
      antwoord: |-
        de ellips ligt tussen twee cirkels
      uitwerking: |-
        De snelheid $\sqrt{1+3\sin^2t}$ ligt tussen 1 en 2: de omtrek ligt tussen die van de cirkels met straal 1 en 2.

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Kegelsneden
  opgave: |-
    Een planeet beweegt op een ellips rond de zon, in de pool. Op tijdstip $t$ is ze in $\bigl[r(t), \theta(t)\bigr]$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de voerstraal tussen $t_1$ en $t_2$ een oppervlakte $\tfrac12\ig_{t_1}^{t_2} r^2\,\theta'(t)\dt$ veegt.
      antwoord: |-
        substitutie $\theta=\theta(t)$
      uitwerking: |-
        De oppervlakte is $\tfrac12\displaystyle\int r^2\dth$, en met $\theta=\theta(t)$ is $\mathrm{d}\theta=\theta'(t)\dt$.
    - opgave: |-
        De tweede wet van Kepler zegt dat de voerstraal in gelijke tijden gelijke oppervlakten veegt. Waarom betekent dat dat $r^2\theta'$ constant is?
      antwoord: |-
        de afgeleide van de geveegde oppervlakte
      uitwerking: |-
        De geveegde oppervlakte $A(t)$ groeit dan lineair: $A'(t)=\tfrac12r^2\theta'$ is constant (hoofdstelling).
    - opgave: |-
        De aarde staat 147,1 miljoen km van de zon in januari en 152,1 miljoen km in juli. Hoeveel keer sneller draait ze in januari rond de zon (in radialen per dag)?
      antwoord: |-
        ongeveer 1,069 keer
      uitwerking: |-
        $\theta'$ is omgekeerd evenredig met $r^2$: $\bigl(\tfrac{152{,}1}{147{,}1}\bigr)^2\approx1{,}069$.

- id: h3-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Oppervlakken
  opgave: |-
    Een schotelantenne is een stuk van een omwentelingsparaboloïde, 80~cm breed en 12~cm diep. Leg de as van de schotel langs de $x$-as.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de schotel ontstaat door $y = \sqrt{\tfrac{400}{3}x}$ op $[0, 12]$ om de $x$-as te wentelen.
      antwoord: |-
        $y(12)=40$
      uitwerking: |-
        Een parabool met de top in de oorsprong en as langs de $x$-as heeft de vorm $y^2=kx$; met de rand $(12, 40)$ is $k=\tfrac{1600}{12}=\tfrac{400}{3}$.
    - opgave: |-
        Bereken de oppervlakte van de schotel, en vergelijk met een vlakke schijf met straal 40~cm.
      antwoord: |-
        ongeveer 5455 cm$^2$; 8,5\,\% meer
      uitwerking: |-
        $f^2+(ff')^2=kx+\tfrac{k^2}{4}$. $S=2\pi\displaystyle\int_0^{12}\sqrt{kx+\tfrac{k^2}{4}}\dx=\dfrac{4\pi}{3k}\Bigl[\bigl(kx+\tfrac{k^2}{4}\bigr)^{3/2}\Bigr]_0^{12}\approx5455$ cm$^2$, tegenover $\pi\cdot40^2\approx5027$ cm$^2$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Bereken de lengte van de kromme $x = 1 + 3t^2$, $y = 2t^3$ voor $t \in [0, 1]$.
  antwoord: |-
    $2(2\sqrt2-1)\approx3{,}66$
  uitwerking: |-
    $x'=6t$, $y'=6t^2$: de snelheid is $6t\sqrt{1+t^2}$, en $\Bigl[2(1+t^2)^{3/2}\Bigr]_0^1$.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Bereken de lengte van de spiraal $r = \e^{2\theta}$ voor $\theta \in [0, 1]$.
  antwoord: |-
    $\tfrac{\sqrt5}{2}(\e^2-1)\approx7{,}14$
  uitwerking: |-
    $r^2+r'^2=\e^{4\theta}+4\e^{4\theta}=5\e^{4\theta}$, dus $\displaystyle\int_0^1\sqrt5\,\e^{2\theta}\dth$.

- id: h3-t3
  soort: test
  niveau: 1
  opgave: |-
    Bereken de oppervlakte onder één boog van de cycloïde $x = 2(t - \sin t)$, $y = 2(1 - \cos t)$.
  antwoord: |-
    $12\pi$
  uitwerking: |-
    $\displaystyle\int_0^{2\pi}4(1-\cos t)^2\dt=4\cdot3\pi$: $3\pi R^2$ met $R=2$.

- id: h3-t4
  soort: test
  niveau: 2
  opgave: |-
    Bereken de oppervlakte van één blad van de roos $r = 2\sin 3\theta$.
  antwoord: |-
    $\tfrac{\pi}{3}$
  uitwerking: |-
    Een blad hoort bij $\theta\in\bigl[0, \tfrac{\pi}{3}\bigr]$: $\tfrac12\displaystyle\int_0^{\pi/3}4\sin^23\theta\dth=2\cdot\tfrac{\pi}{6}$.

- id: h3-t5
  soort: test
  niveau: 1
  opgave: |-
    De kromme $x = t^2$, $y = t$ voor $t \in [0, 2]$ wentelt om de $x$-as. Bereken het volume, en controleer met de vergelijking van de kromme.
  antwoord: |-
    $8\pi$
  uitwerking: |-
    $\pi\displaystyle\int_0^2t^2\cdot2t\dt=8\pi$. Het is $y=\sqrt x$ op $[0, 4]$: $\pi\displaystyle\int_0^4x\dx=8\pi$.

- id: h3-t6
  soort: test
  niveau: 2
  opgave: |-
    De grafiek van $f(x) = \sqrt{9 - x^2}$ op $[0, 2]$ wentelt om de $x$-as. Bereken de manteloppervlakte.
  antwoord: |-
    $12\pi$
  uitwerking: |-
    $f\sqrt{1+f'^2}=\sqrt{f^2+(ff')^2}=\sqrt{9-x^2+x^2}=3$: $2\pi\cdot3\cdot2$.

- id: h3-t7
  soort: test
  niveau: 2
  opgave: |-
    Een fietser met wielen met een straal van 30~cm rijdt 3~km. Welke weg legt een steentje in de band af?
  antwoord: |-
    ongeveer 3820 m
  uitwerking: |-
    $3000\cdot\tfrac{8R}{2\pi R}=3000\cdot\tfrac{4}{\pi}\approx3820$ m.
