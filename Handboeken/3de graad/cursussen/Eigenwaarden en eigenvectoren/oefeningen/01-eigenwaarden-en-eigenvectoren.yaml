# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\km{3 & 1 \\ 2 & 5}\kol{2 \\ -1}$
      antwoord: |-
        $\kol{5 \\ -1}$
      uitwerking: |-
        $\kol{6 - 1 \\ 4 - 5} = \kol{5 \\ -1}$.
    - opgave: |-
        $\det\km{4 & -2 \\ 3 & 1}$
      antwoord: |-
        10
      uitwerking: |-
        $4 \cdot 1 - (-2) \cdot 3 = 4 + 6 = 10$.
    - opgave: |-
        de oplossingen van $x^2 - 5x + 4 = 0$
      antwoord: |-
        1 en 4
      uitwerking: |-
        $(x - 1)(x - 4) = 0$.
    - opgave: |-
        de oplossingen in $\C$ van $x^2 - 2x + 5 = 0$
      antwoord: |-
        $1 \pm 2i$
      uitwerking: |-
        $D = 4 - 20 = -16$, dus $x = \dfrac{2 \pm 4i}{2} = 1 \pm 2i$.
    - opgave: |-
        alle oplossingen van $2x - 6y = 0$, $-x + 3y = 0$
      antwoord: |-
        $(3t, t)$ met $t \in \R$
      uitwerking: |-
        De tweede vergelijking is $-\tfrac12$ keer de eerste. Uit $x = 3y$ en $y = t$ volgt $(3t, t)$.
    - opgave: |-
        $\det\km{1 & 2 & 0 \\ 0 & 3 & 1 \\ 2 & 0 & 1}$
      antwoord: |-
        7
      uitwerking: |-
        Sarrus: $(3 + 4 + 0) - (0 + 0 + 0) = 7$.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem de matrix $A = \km{3 & -1 \\ 2 & 0}$ uit het probleem.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken het beeld $AX$ van de vectoren $(1, 0)$, $(0, 1)$, $(1, 1)$, $(1, 2)$, $(1, -1)$ en $(2, 4)$.
      antwoord: |-
        $(3, 2)$, $(-1, 0)$, $(2, 2)$, $(1, 2)$, $(4, 2)$, $(2, 4)$
      uitwerking: |-
        Telkens $(3x - y, 2x)$: $(3, 2)$, $(-1, 0)$, $(2, 2)$, $(1, 2)$, $(4, 2)$ en $(2, 4)$.
    - opgave: |-
        Bij welke van die vectoren ligt het beeld op dezelfde rechte door de oorsprong als de vector zelf? Met welke factor is de vector dan vermenigvuldigd?
      antwoord: |-
        $(1, 1)$ met factor 2, $(1, 2)$ en $(2, 4)$ met factor 1
      uitwerking: |-
        $(2, 2) = 2(1, 1)$, $(1, 2) = 1 \cdot (1, 2)$ en $(2, 4) = 1 \cdot (2, 4)$. De andere beelden zijn geen veelvoud: $(3, 2)$ ligt niet op de $x$-as, $(-1, 0)$ niet op de $y$-as en $(4, 2)$ niet op $y = -x$.
    - opgave: |-
        Vermoed: welke rechten door de oorsprong komen op zichzelf terecht?
      antwoord: |-
        $y = x$ en $y = 2x$
      uitwerking: |-
        De rechte door $(1, 1)$, dus $y = x$, en de rechte door $(1, 2)$ en $(2, 4)$, dus $y = 2x$. Dat het er niet meer zijn, volgt in sectie 2.

# ---------------------------------------------------------------- korte oefeningen

- id: h1-check
  soort: kort
  opgave: |-
    Ga na of de vector een eigenvector is van $A = \km{5 & -2 \\ 4 & -1}$. Geef zo ja de eigenwaarde.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $(1, 1)$
      antwoord: |-
        ja, 3
      uitwerking: |-
        $A\kol{1 \\ 1} = \kol{3 \\ 3} = 3\kol{1 \\ 1}$.
    - opgave: |-
        $(1, 2)$
      antwoord: |-
        ja, 1
      uitwerking: |-
        $A\kol{1 \\ 2} = \kol{1 \\ 2}$.
    - opgave: |-
        $(2, 1)$
      antwoord: |-
        nee
      uitwerking: |-
        $A\kol{2 \\ 1} = \kol{8 \\ 7}$, geen veelvoud van $(2, 1)$.
    - opgave: |-
        $(-2, -4)$
      antwoord: |-
        ja, 1
      uitwerking: |-
        $A\kol{-2 \\ -4} = \kol{-10 + 8 \\ -8 + 4} = \kol{-2 \\ -4}$: een veelvoud van $(1, 2)$.

- id: h1-meetk
  soort: kort
  opgave: |-
    Bepaal zonder te rekenen de eigenwaarden en eigenruimten. Controleer daarna met de matrix.
  lijst: enumerate
  delen:
    - opgave: |-
        de spiegeling om de $x$-as, met matrix $\km{1 & 0 \\ 0 & -1}$
      antwoord: |-
        $\Eig{1}$ is de $x$-as, $\Eig{-1}$ de $y$-as
      uitwerking: |-
        De punten van de $x$-as blijven staan: eigenwaarde 1. De $y$-as gaat naar zichzelf, maar elke vector keert om: eigenwaarde $-1$. Controle: $(1, 0) \mapsto (1, 0)$ en $(0, 1) \mapsto (0, -1)$.
    - opgave: |-
        de homothetie met centrum $O$ en factor 3, met matrix $\km{3 & 0 \\ 0 & 3}$
      antwoord: |-
        alleen 3, $\Eig{3}$ is het hele vlak
      uitwerking: |-
        Elke vector wordt 3 keer zo lang in dezelfde richting: elke vector $\neq \nulv$ is een eigenvector bij 3.
    - opgave: |-
        de draaiing om $O$ over $180^\circ$, met matrix $\km{-1 & 0 \\ 0 & -1}$
      antwoord: |-
        alleen $-1$, $\Eig{-1}$ is het hele vlak
      uitwerking: |-
        Elke vector keert om: $A\vec v = -\vec v$ voor elke $\vec v$. Een draaiing over $180^\circ$ is een puntspiegeling.

- id: h1-kar
  soort: kort
  opgave: |-
    Bereken de karakteristieke veelterm en de eigenwaarden.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $\km{6 & -2 \\ 2 & 1}$
      antwoord: |-
        $\lambda^2 - 7\lambda + 10$; 2 en 5
      uitwerking: |-
        $(6 - \lambda)(1 - \lambda) + 4 = \lambda^2 - 7\lambda + 10 = (\lambda - 2)(\lambda - 5)$.
    - opgave: |-
        $\km{0 & 1 \\ -6 & 5}$
      antwoord: |-
        $\lambda^2 - 5\lambda + 6$; 2 en 3
      uitwerking: |-
        $-\lambda(5 - \lambda) + 6 = \lambda^2 - 5\lambda + 6 = (\lambda - 2)(\lambda - 3)$.
    - opgave: |-
        $\km{1 & 2 \\ 3 & 0}$
      antwoord: |-
        $\lambda^2 - \lambda - 6$; 3 en $-2$
      uitwerking: |-
        $(1 - \lambda)(-\lambda) - 6 = \lambda^2 - \lambda - 6 = (\lambda - 3)(\lambda + 2)$.
    - opgave: |-
        $\km{5 & -1 \\ 4 & 1}$
      antwoord: |-
        $(\lambda - 3)^2$; 3
      uitwerking: |-
        $(5 - \lambda)(1 - \lambda) + 4 = \lambda^2 - 6\lambda + 9 = (\lambda - 3)^2$: één eigenwaarde, twee keer.

- id: h1-vec
  soort: kort
  opgave: |-
    Bereken de eigenwaarden en bij elke eigenwaarde een eigenvector.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\km{-1 & 4 \\ 1 & 2}$
      antwoord: |-
        3 bij $(1, 1)$, $-2$ bij $(-4, 1)$
      uitwerking: |-
        $(-1 - \lambda)(2 - \lambda) - 4 = \lambda^2 - \lambda - 6 = 0$: $\lambda = 3$ of $\lambda = -2$.\\
        $\lambda = 3$: $\km{-4 & 4 \\ 1 & -1}$, dus $x = y$. $\lambda = -2$: $\km{1 & 4 \\ 1 & 4}$, dus $x = -4y$.
    - opgave: |-
        $\km{1 & 4 \\ 1 & 1}$
      antwoord: |-
        3 bij $(2, 1)$, $-1$ bij $(2, -1)$
      uitwerking: |-
        $(1 - \lambda)^2 - 4 = 0$: $1 - \lambda = \pm 2$, dus $\lambda = -1$ of $\lambda = 3$.\\
        $\lambda = 3$: $\km{-2 & 4 \\ 1 & -2}$, dus $x = 2y$. $\lambda = -1$: $\km{2 & 4 \\ 1 & 2}$, dus $x = -2y$.

- id: h1-drie
  soort: kort
  opgave: |-
    Bereken de eigenwaarden en eigenvectoren van $\km{3 & 0 & 2 \\ 0 & 3 & 2 \\ -2 & 1 & 0}$. Zoek eerst een eigenwaarde tussen de delers van de constante term.
  antwoord: |-
    1 bij $(-1, -1, 1)$, 2 bij $(-2, -2, 1)$, 3 bij $(1, 2, 0)$
  uitwerking: |-
    Sarrus: $p(\lambda) = (3 - \lambda)^2(-\lambda) + 0 + 0 - \bigl(-4(3 - \lambda) + 0 + 2(3 - \lambda)\bigr) = -\lambda(3 - \lambda)^2 + 2(3 - \lambda) = (3 - \lambda)\bigl(-3\lambda + \lambda^2 + 2\bigr)$.\\
    Dus $p(\lambda) = (3 - \lambda)(\lambda - 1)(\lambda - 2)$: eigenwaarden 1, 2 en 3. (Ook met delers: $p(1) = 0$, en Horner.)\\
    $\lambda = 1$: $\km{2 & 0 & 2 \\ 0 & 2 & 2 \\ -2 & 1 & -1}$ geeft $x = -z$, $y = -z$: $(-1, -1, 1)$.\\
    $\lambda = 2$: $\km{1 & 0 & 2 \\ 0 & 1 & 2 \\ -2 & 1 & -2}$ geeft $x = -2z$, $y = -2z$: $(-2, -2, 1)$.\\
    $\lambda = 3$: $\km{0 & 0 & 2 \\ 0 & 0 & 2 \\ -2 & 1 & -3}$ geeft $z = 0$ en $y = 2x$: $(1, 2, 0)$.

- id: h1-complex
  soort: kort
  opgave: |-
    Bereken de complexe eigenwaarden en bij elke eigenwaarde een eigenvector.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\km{1 & -1 \\ 1 & 1}$
      antwoord: |-
        $1 + i$ bij $(i, 1)$, $1 - i$ bij $(-i, 1)$
      uitwerking: |-
        $(1 - \lambda)^2 + 1 = 0$: $1 - \lambda = \pm i$, dus $\lambda = 1 \mp i$.\\
        $\lambda = 1 + i$: $\km{-i & -1 \\ 1 & -i}$, rij $(1, -i)$ geeft $(-i, -1)$, of $(i, 1)$. Voor $1 - i$ de toegevoegde $(-i, 1)$.
    - opgave: |-
        $\km{3 & -5 \\ 1 & -1}$
      antwoord: |-
        $1 + i$ bij $(2 + i, 1)$, $1 - i$ bij $(2 - i, 1)$
      uitwerking: |-
        $(3 - \lambda)(-1 - \lambda) + 5 = \lambda^2 - 2\lambda + 2 = 0$: $\lambda = 1 \pm i$.\\
        $\lambda = 1 + i$: $\km{2 - i & -5 \\ 1 & -2 - i}$, rij $(1, -2 - i)$ geeft $(-2 - i, -1)$, of $(2 + i, 1)$. Voor $1 - i$ de toegevoegde.

- id: h1-spoor
  soort: kort
  opgave: |-
    Gebruik het spoor en de determinant.
  lijst: enumerate
  delen:
    - opgave: |-
        De matrix $\km{7 & 2 \\ -4 & 1}$ heeft de eigenwaarde 3. Bepaal de andere.
      antwoord: |-
        5
      uitwerking: |-
        $3 + \lambda_2 = 7 + 1 = 8$, dus $\lambda_2 = 5$. Controle: $3 \cdot 5 = 15 = 7 + 8 = \det A$.
    - opgave: |-
        Een $2 \times 2$-matrix heeft spoor 6 en determinant 9. Wat zijn de eigenwaarden?
      antwoord: |-
        3 (twee keer)
      uitwerking: |-
        $p(\lambda) = \lambda^2 - 6\lambda + 9 = (\lambda - 3)^2$.
    - opgave: |-
        Een $3 \times 3$-matrix heeft spoor 7 en de eigenwaarden 1 en 2. Bepaal de derde eigenwaarde en de determinant.
      antwoord: |-
        4; $\det A = 8$
      uitwerking: |-
        $1 + 2 + \lambda_3 = 7$, dus $\lambda_3 = 4$, en $\det A = 1 \cdot 2 \cdot 4 = 8$.

- id: h1-driehoek
  soort: kort
  opgave: |-
    Geef de eigenwaarden zonder te rekenen.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\km{3 & 0 \\ 5 & -1}$
      antwoord: |-
        3 en $-1$
      uitwerking: |-
        Een benedendriehoeksmatrix.
    - opgave: |-
        $\km{2 & 4 & 7 \\ 0 & -1 & 3 \\ 0 & 0 & 5}$
      antwoord: |-
        2, $-1$ en 5
      uitwerking: |-
        Een bovendriehoeksmatrix.
    - opgave: |-
        $\km{4 & 0 & 0 \\ 0 & 4 & 0 \\ 0 & 0 & 1}$
      antwoord: |-
        4 (twee keer) en 1
      uitwerking: |-
        Een diagonaalmatrix.

- id: h1-inv
  soort: kort
  opgave: |-
    Gebruik de eigenwaarden.
  lijst: enumerate
  delen:
    - opgave: |-
        Is $\km{2 & 4 \\ 1 & 2}$ inverteerbaar?
      antwoord: |-
        nee, 0 is een eigenwaarde
      uitwerking: |-
        $p(\lambda) = \lambda^2 - 4\lambda + 0 = \lambda(\lambda - 4)$: de eigenwaarden zijn 0 en 4. Want 0 is een eigenwaarde, dus de matrix is niet inverteerbaar (ook: $\det = 0$).
    - opgave: |-
        Geef de eigenwaarden en eigenvectoren van $B^{-1}$, met $B = \km{5 & -2 \\ 4 & -1}$ uit oefening~\ref{oef:h1-check}.
      antwoord: |-
        $1$ bij $(1, 2)$, $\tfrac13$ bij $(1, 1)$
      uitwerking: |-
        $B$ heeft de eigenwaarde 3 bij $(1, 1)$ en 1 bij $(1, 2)$. De inverse heeft dezelfde eigenvectoren, met $\tfrac13$ en $1$.

# ---------------------------------------------------------------- opdrachten, niveau 1

- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    eigenvector nagaan
  opgave: |-
    Ga na of de vector een eigenvector is van $A = \km{1 & 4 \\ 2 & 3}$. Geef zo ja de eigenwaarde.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $(1, 1)$
      antwoord: |-
        ja, 5
      uitwerking: |-
        $A\kol{1 \\ 1} = \kol{5 \\ 5}$.
    - opgave: |-
        $(2, -1)$
      antwoord: |-
        ja, $-1$
      uitwerking: |-
        $A\kol{2 \\ -1} = \kol{-2 \\ 1} = -\kol{2 \\ -1}$.
    - opgave: |-
        $(1, 2)$
      antwoord: |-
        nee
      uitwerking: |-
        $A\kol{1 \\ 2} = \kol{9 \\ 8}$, geen veelvoud.
    - opgave: |-
        $(0, 0)$
      antwoord: |-
        nee
      uitwerking: |-
        Wel is $A\nulv = \nulv$, maar de nulvector is per definitie nooit een eigenvector.

- id: h1-o2
  soort: opdracht
  niveau: 1
  thema: |-
    eigenruimten meetkundig
  opgave: |-
    Bepaal zonder te rekenen de eigenwaarden en eigenruimten van de afbeelding. Controleer met de matrix.
  lijst: enumerate
  delen:
    - opgave: |-
        de spiegeling om de rechte $y = -x$, met matrix $\km{0 & -1 \\ -1 & 0}$
      antwoord: |-
        1 bij $\vb{(1, -1)}$, $-1$ bij $\vb{(1, 1)}$
      uitwerking: |-
        De spiegelas $y = -x$ blijft staan: $\Eig{1}$ is de rechte door $(1, -1)$. De loodlijn $y = x$ keert om: $\Eig{-1}$ is de rechte door $(1, 1)$. Controle: $(1, -1) \mapsto (1, -1)$ en $(1, 1) \mapsto (-1, -1)$.
    - opgave: |-
        de uitrekking in de richting van de $x$-as met factor 2, met matrix $\km{2 & 0 \\ 0 & 1}$
      antwoord: |-
        2 bij de $x$-as, 1 bij de $y$-as
      uitwerking: |-
        Horizontale vectoren worden twee keer zo lang, verticale blijven gelijk. Elke andere vector draait naar de $x$-as toe.
    - opgave: |-
        de draaiing om $O$ over $90^\circ$, met matrix $\km{0 & -1 \\ 1 & 0}$
      antwoord: |-
        geen reële eigenwaarden
      uitwerking: |-
        Elke vector draait een kwart, dus geen enkele rechte door $O$ komt op zichzelf terecht. Controle: $p(\lambda) = \lambda^2 + 1$ heeft geen reële nulwaarden.
    - opgave: |-
        de loodrechte projectie op het $xy$-vlak in de ruimte, met matrix $\km{1 & 0 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 0}$
      antwoord: |-
        1 bij het $xy$-vlak, 0 bij de $z$-as
      uitwerking: |-
        De punten van het $xy$-vlak blijven staan: $\Eig{1}$ is dat vlak. De $z$-as gaat naar de oorsprong: $\Eig{0}$ is de $z$-as.

- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    karakteristieke veelterm
  opgave: |-
    Bereken de karakteristieke veelterm en de eigenwaarden. Reken zo nodig in $\C$.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\km{2 & 3 \\ 3 & 2}$
      antwoord: |-
        $\lambda^2 - 4\lambda - 5$; 5 en $-1$
      uitwerking: |-
        $(2 - \lambda)^2 - 9 = 0$: $2 - \lambda = \pm 3$.
    - opgave: |-
        $\km{0 & 2 \\ -1 & 3}$
      antwoord: |-
        $\lambda^2 - 3\lambda + 2$; 1 en 2
      uitwerking: |-
        $-\lambda(3 - \lambda) + 2 = \lambda^2 - 3\lambda + 2$.
    - opgave: |-
        $\km{3 & -5 \\ 1 & -1}$
      antwoord: |-
        $\lambda^2 - 2\lambda + 2$; $1 \pm i$
      uitwerking: |-
        $(3 - \lambda)(-1 - \lambda) + 5 = \lambda^2 - 2\lambda + 2$, met $D = -4$.
    - opgave: |-
        $\km{2 & -1 \\ 1 & 4}$
      antwoord: |-
        $(\lambda - 3)^2$; 3
      uitwerking: |-
        $(2 - \lambda)(4 - \lambda) + 1 = \lambda^2 - 6\lambda + 9$.
    - opgave: |-
        $\km{1 & 3 \\ 3 & 1}$
      antwoord: |-
        $\lambda^2 - 2\lambda - 8$; 4 en $-2$
      uitwerking: |-
        $(1 - \lambda)^2 - 9 = 0$: $1 - \lambda = \pm 3$.
    - opgave: |-
        $\km{1 & -4 \\ 1 & 1}$
      antwoord: |-
        $\lambda^2 - 2\lambda + 5$; $1 \pm 2i$
      uitwerking: |-
        $(1 - \lambda)^2 + 4 = 0$: $1 - \lambda = \pm 2i$.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    driehoeksmatrix en eigenvectoren
  opgave: |-
    Neem $A = \km{1 & 2 & 3 \\ 0 & 4 & 5 \\ 0 & 0 & 6}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de eigenwaarden zonder te rekenen.
      antwoord: |-
        1, 4 en 6
      uitwerking: |-
        Een bovendriehoeksmatrix: de elementen op de hoofddiagonaal.
    - opgave: |-
        Bepaal een eigenvector bij 4.
      antwoord: |-
        $(2, 3, 0)$
      uitwerking: |-
        $A - 4I = \km{-3 & 2 & 3 \\ 0 & 0 & 5 \\ 0 & 0 & 2}$: $z = 0$ en $-3x + 2y = 0$. Kies $x = 2$, $y = 3$.
    - opgave: |-
        Bepaal een eigenvector bij 6.
      antwoord: |-
        $(16, 25, 10)$
      uitwerking: |-
        $A - 6I = \km{-5 & 2 & 3 \\ 0 & -2 & 5 \\ 0 & 0 & 0}$: $y = \tfrac52 z$ en $5x = 2y + 3z = 8z$. Met $z = 10$: $(16, 25, 10)$.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    eigenvectoren berekenen
  opgave: |-
    Bereken bij elke eigenwaarde de eigenruimte. De eigenwaarden vond je in opdracht~\ref{oef:h1-o3}.
  lijst: enumerate
  delen:
    - opgave: |-
        $\km{0 & 2 \\ -1 & 3}$, met eigenwaarden 1 en 2
      antwoord: |-
        $\Eig{1} = \vb{(2, 1)}$, $\Eig{2} = \vb{(1, 1)}$
      uitwerking: |-
        $\lambda = 1$: $\km{-1 & 2 \\ -1 & 2}$, dus $x = 2y$. $\lambda = 2$: $\km{-2 & 2 \\ -1 & 1}$, dus $x = y$.
    - opgave: |-
        $\km{2 & 3 \\ 3 & 2}$, met eigenwaarden 5 en $-1$
      antwoord: |-
        $\Eig{5} = \vb{(1, 1)}$, $\Eig{-1} = \vb{(1, -1)}$
      uitwerking: |-
        $\lambda = 5$: $\km{-3 & 3 \\ 3 & -3}$, dus $x = y$. $\lambda = -1$: $\km{3 & 3 \\ 3 & 3}$, dus $x = -y$.
    - opgave: |-
        $\km{2 & -1 \\ 1 & 4}$, met de dubbele eigenwaarde 3
      antwoord: |-
        $\Eig{3} = \vb{(1, -1)}$, een rechte
      uitwerking: |-
        $A - 3I = \km{-1 & -1 \\ 1 & 1}$: $x = -y$. Er is maar één rechte met eigenvectoren, hoewel de eigenwaarde twee keer voorkomt.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    eigenwaarden van een 3 x 3-matrix
  opgave: |-
    Bereken de eigenwaarden en bij elke eigenwaarde een eigenvector. Ontwikkel naar een rij of kolom met nullen.
  lijst: enumerate
  delen:
    - opgave: |-
        $\km{1 & -1 & 1 \\ 0 & 3 & 0 \\ 0 & 2 & 2}$
      antwoord: |-
        1 bij $(1, 0, 0)$, 2 bij $(1, 0, 1)$, 3 bij $(1, 2, 4)$
      uitwerking: |-
        Naar de eerste kolom: $p(\lambda) = (1 - \lambda)\bigl((3 - \lambda)(2 - \lambda) - 0\bigr) = (1 - \lambda)(2 - \lambda)(3 - \lambda)$.\\
        $\lambda = 2$: $\km{-1 & -1 & 1 \\ 0 & 1 & 0 \\ 0 & 2 & 0}$ geeft $y = 0$, $x = z$.\\
        $\lambda = 3$: $\km{-2 & -1 & 1 \\ 0 & 0 & 0 \\ 0 & 2 & -1}$ geeft $z = 2y$ en $2x = -y + z = y$: met $y = 2$ is $(1, 2, 4)$.
    - opgave: |-
        $\km{3 & 0 & 0 \\ 3 & 2 & 4 \\ -1 & 0 & 1}$
      antwoord: |-
        1 bij $(0, -4, 1)$, 2 bij $(0, 1, 0)$, 3 bij $(-2, -2, 1)$
      uitwerking: |-
        Naar de eerste rij: $p(\lambda) = (3 - \lambda)\bigl((2 - \lambda)(1 - \lambda) - 0\bigr)$.\\
        $\lambda = 1$: $\km{2 & 0 & 0 \\ 3 & 1 & 4 \\ -1 & 0 & 0}$ geeft $x = 0$, $y = -4z$.\\
        $\lambda = 2$: $\km{1 & 0 & 0 \\ 3 & 0 & 4 \\ -1 & 0 & -1}$ geeft $x = z = 0$.\\
        $\lambda = 3$: $\km{0 & 0 & 0 \\ 3 & -1 & 4 \\ -1 & 0 & -2}$ geeft $x = -2z$ en $y = 3x + 4z = -2z$.

# ---------------------------------------------------------------- opdrachten, niveau 2

- id: h1-o7
  soort: opdracht
  niveau: 2
  thema: |-
    matrix met een parameter
  opgave: |-
    Neem $A = \km{1 & k \\ 2 & 3}$ met $k \in \R$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $k$ is 5 een eigenwaarde?
      antwoord: |-
        $k = 4$
      uitwerking: |-
        $p(\lambda) = \lambda^2 - 4\lambda + 3 - 2k$, en $p(5) = 8 - 2k = 0$.
    - opgave: |-
        Voor welke $k$ is $A$ niet inverteerbaar?
      antwoord: |-
        $k = \tfrac32$
      uitwerking: |-
        Als 0 een eigenwaarde is: $p(0) = \det A = 3 - 2k = 0$.
    - opgave: |-
        Voor welke $k$ zijn de eigenwaarden reëel?
      antwoord: |-
        $k \geqslant -\tfrac12$
      uitwerking: |-
        De discriminant van $p$ is $16 - 4(3 - 2k) = 4 + 8k \geqslant 0$.
    - opgave: |-
        Neem $k = -\tfrac12$. Bepaal de eigenwaarde en de eigenruimte.
      antwoord: |-
        2, met $\Eig{2} = \vb{(1, -2)}$
      uitwerking: |-
        $p(\lambda) = \lambda^2 - 4\lambda + 4 = (\lambda - 2)^2$. $A - 2I = \km{-1 & -\tfrac12 \\ 2 & 1}$, dus $y = -2x$.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    context: stof uitrekken
  opgave: |-
    Een machine rekt een vierkant stuk stof uit. Een punt $(x, y)$ van de stof (in cm, met de oorsprong in een hoek) komt terecht in $(1{,}2x + 0{,}1y,\ 0{,}2x + 1{,}1y)$.
  figuur:
    opties: |-
      3.6cm
    code: |-
      \begin{tikzpicture}[scale=.36,font=\scriptsize]
        \rooster{0}{2}{8}{0}{2}{8}
        \draw[grijs,thick] (0,0) rectangle (6,6);
        \fill[accent,opacity=.15] (0,0) -- (7.2,1.2) -- (7.8,7.8) -- (.6,6.6) -- cycle;
        \draw[accent,thick] (0,0) -- (7.2,1.2) -- (7.8,7.8) -- (.6,6.6) -- cycle;
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de matrix $A$ van deze afbeelding.
      antwoord: |-
        $\km{1{,}2 & 0{,}1 \\ 0{,}2 & 1{,}1}$
      uitwerking: |-
        De coëfficiënten van $x$ en $y$, rij per rij.
    - opgave: |-
        Bereken de eigenwaarden en eigenvectoren.
      antwoord: |-
        $1{,}3$ bij $(1, 1)$, $1$ bij $(1, -2)$
      uitwerking: |-
        $p(\lambda) = \lambda^2 - 2{,}3\lambda + 1{,}3 = (\lambda - 1)(\lambda - 1{,}3)$.\\
        $\lambda = 1{,}3$: $\km{-0{,}1 & 0{,}1 \\ 0{,}2 & -0{,}2}$, $x = y$. $\lambda = 1$: $\km{0{,}2 & 0{,}1 \\ 0{,}2 & 0{,}1}$, $y = -2x$.
    - opgave: |-
        In welke richting rekt de stof het meest uit, en met hoeveel procent?
      antwoord: |-
        langs $(1, 1)$, met 30~\%
      uitwerking: |-
        De grootste eigenwaarde is $1{,}3$, langs de diagonaal $(1, 1)$: een draad in die richting wordt 30~\% langer.
    - opgave: |-
        Wat gebeurt er met een draad in de richting $(1, -2)$?
      antwoord: |-
        hij draait niet en blijft even lang
      uitwerking: |-
        Eigenwaarde 1: elke vector in die richting blijft dezelfde vector.
    - opgave: |-
        Met welke factor wordt de oppervlakte van de stof vermenigvuldigd? Gebruik de eigenwaarden.
      antwoord: |-
        $1{,}3$
      uitwerking: |-
        De factor is $|\det A|$ (Matrices), en $\det A = 1{,}3 \cdot 1 = 1{,}3$. Controle: $1{,}32 - 0{,}02 = 1{,}3$.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    complexe eigenwaarden
  opgave: |-
    Neem $A = \km{1 & -4 \\ 1 & 1}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de eigenwaarden.
      antwoord: |-
        $1 \pm 2i$
      uitwerking: |-
        $(1 - \lambda)^2 + 4 = 0$, dus $1 - \lambda = \pm 2i$.
    - opgave: |-
        Bereken een eigenvector bij $1 + 2i$, en daaruit een eigenvector bij $1 - 2i$.
      antwoord: |-
        $(2i, 1)$ en $(-2i, 1)$
      uitwerking: |-
        $A - (1 + 2i)I = \km{-2i & -4 \\ 1 & -2i}$. De rij $(1, -2i)$ geeft $(-2i, -1)$, of $(2i, 1)$. Controle: $A\kol{2i \\ 1} = \kol{2i - 4 \\ 2i + 1}$ en $(1 + 2i) \cdot 2i = 2i - 4$. Bij $1 - 2i$ hoort de toegevoegde $(-2i, 1)$.
    - opgave: |-
        Leg uit waarom $A$ geen reële eigenvector heeft.
      antwoord: |-
        geen reële eigenwaarde
      uitwerking: |-
        Een reële eigenvector $\vec v$ geeft $A\vec v = \lambda\vec v$ met $\lambda$ reëel, want $A\vec v$ is dan reëel. Maar er is geen reële eigenwaarde, want de discriminant $4 - 20$ is negatief.

- id: h1-o10
  soort: opdracht
  niveau: 2
  thema: |-
    een matrix maken bij eigenvectoren
  opgave: |-
    Bepaal de $2 \times 2$-matrix $A$ met de gegeven eigenvectoren en eigenwaarden.
  lijst: enumerate
  delen:
    - opgave: |-
        $(1, 0)$ bij de eigenwaarde 2 en $(1, 1)$ bij de eigenwaarde 3
      antwoord: |-
        $\km{2 & 1 \\ 0 & 3}$
      uitwerking: |-
        $A\kol{1 \\ 0} = \kol{2 \\ 0}$ is de eerste kolom. Uit $A\kol{1 \\ 1} = \kol{3 \\ 3}$ volgt de tweede kolom $\kol{3 \\ 3} - \kol{2 \\ 0} = \kol{1 \\ 3}$.
    - opgave: |-
        $(1, 2)$ bij de eigenwaarde 0 en $(1, -1)$ bij de eigenwaarde 3
      antwoord: |-
        $\km{2 & -1 \\ -2 & 1}$
      uitwerking: |-
        Met $A = \km{a & b \\ c & d}$: $a + 2b = 0$, $a - b = 3$, dus $a = 2$, $b = -1$; $c + 2d = 0$, $c - d = -3$, dus $c = -2$, $d = 1$. Controle: spoor $3 = 0 + 3$ en $\det A = 0$.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    de methode met y = mx mist een rechte
  opgave: |-
    Neem $A = \km{2 & 0 \\ 1 & 3}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek, zoals in de poging van sectie 1, de rechten $y = mx$ die op zichzelf terechtkomen.
      antwoord: |-
        alleen $y = -x$
      uitwerking: |-
        $A\kol{1 \\ m} = \kol{2 \\ 1 + 3m}$ ligt op $y = mx$ als $1 + 3m = 2m$, dus $m = -1$.
    - opgave: |-
        Bereken de eigenwaarden en eigenruimten.
      antwoord: |-
        2 bij $\vb{(1, -1)}$, 3 bij $\vb{(0, 1)}$
      uitwerking: |-
        Een benedendriehoeksmatrix: 2 en 3. $\lambda = 2$: $\km{0 & 0 \\ 1 & 1}$, $x = -y$. $\lambda = 3$: $\km{-1 & 0 \\ 1 & 0}$, $x = 0$.
    - opgave: |-
        Welke rechte mist de methode met $y = mx$, en waarom?
      antwoord: |-
        de $y$-as
      uitwerking: |-
        De eigenruimte $\Eig{3}$ is de $y$-as, $x = 0$. Die heeft geen richtingscoëfficiënt, dus de vorm $y = mx$ kan haar niet geven.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    eigenwaarden van verwante matrices
  opgave: |-
    Stel dat $A\vec v = 3\vec v$ met $\vec v \neq \nulv$. Toon aan dat $\vec v$ ook een eigenvector is van de volgende matrix, en geef de eigenwaarde.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $A^2$
      antwoord: |-
        9
      uitwerking: |-
        $A^2\vec v = A(3\vec v) = 3A\vec v = 9\vec v$.
    - opgave: |-
        $A + 2I$
      antwoord: |-
        5
      uitwerking: |-
        $(A + 2I)\vec v = 3\vec v + 2\vec v = 5\vec v$.
    - opgave: |-
        $4A$
      antwoord: |-
        12
      uitwerking: |-
        $(4A)\vec v = 4 \cdot 3\vec v = 12\vec v$.
    - opgave: |-
        $A^{-1}$
      antwoord: |-
        $\tfrac13$
      uitwerking: |-
        Uit $A\vec v = 3\vec v$ volgt $\vec v = 3A^{-1}\vec v$, dus $A^{-1}\vec v = \tfrac13\vec v$ (als $A$ inverteerbaar is).

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    context: cursieve letters
  opgave: |-
    Een tekenprogramma maakt een letter cursief met de afbeelding $f(x, y) = \bigl(x + \tfrac12 y,\ y\bigr)$: elk punt schuift horizontaal op, evenveel als de helft van zijn hoogte.
  figuur:
    opties: |-
      3.4cm
    code: |-
      \begin{tikzpicture}[scale=.55,font=\scriptsize]
        \rooster{0}{1}{4}{0}{1}{4}
        \draw[grijs,thick,line join=round] (1,0) -- (1,4) -- (2.5,4) (1,2) -- (2,2);
        \draw[accent,very thick,line join=round] (1,0) -- (3,4) -- (4.5,4) (2,2) -- (3,2);
      \end{tikzpicture}
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de matrix van $f$.
      antwoord: |-
        $\km{1 & \tfrac12 \\ 0 & 1}$
      uitwerking: |-
        De beelden van $(1, 0)$ en $(0, 1)$ zijn $(1, 0)$ en $\bigl(\tfrac12, 1\bigr)$.
    - opgave: |-
        Bereken de eigenwaarden.
      antwoord: |-
        1 (twee keer)
      uitwerking: |-
        Een bovendriehoeksmatrix met 1 en 1 op de hoofddiagonaal: $p(\lambda) = (1 - \lambda)^2$.
    - opgave: |-
        Bereken de eigenruimte.
      antwoord: |-
        de $x$-as
      uitwerking: |-
        $A - I = \km{0 & \tfrac12 \\ 0 & 0}$ geeft $y = 0$: $\Eig{1} = \vb{(1, 0)}$.
    - opgave: |-
        Verklaar het resultaat met de figuur.
      antwoord: |-
        alleen horizontale vectoren blijven
      uitwerking: |-
        Een punt op hoogte 0 schuift niet op: de $x$-as blijft punt voor punt staan. Elke andere vector kantelt naar rechts, ook de verticale stam van de letter.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    3 x 3 met Horner
  opgave: |-
    Neem $A = \km{3 & 1 & -2 \\ -2 & 2 & 2 \\ 4 & 1 & -3}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $p_A(\lambda) = -\lambda^3 + 2\lambda^2 + \lambda - 2$, en bereken de eigenwaarden.
      antwoord: |-
        $-1$, 1 en 2
      uitwerking: |-
        Sarrus geeft $-\lambda^3 + 2\lambda^2 + \lambda - 2$. Een deler van $-2$: $p(1) = -1 + 2 + 1 - 2 = 0$. Horner: $p(\lambda) = (\lambda - 1)(-\lambda^2 + \lambda + 2) = -(\lambda - 1)(\lambda - 2)(\lambda + 1)$.
    - opgave: |-
        Bereken bij elke eigenwaarde een eigenvector.
      antwoord: |-
        $-1$ bij $(4, -2, 7)$, 1 bij $(1, 0, 1)$, 2 bij $(1, 1, 1)$
      uitwerking: |-
        $\lambda = 1$: $\km{2 & 1 & -2 \\ -2 & 1 & 2 \\ 4 & 1 & -4}$ herleidt tot $x = z$, $y = 0$.\\
        $\lambda = 2$: $\km{1 & 1 & -2 \\ -2 & 0 & 2 \\ 4 & 1 & -5}$ herleidt tot $x = z$, $y = z$.\\
        $\lambda = -1$: $\km{4 & 1 & -2 \\ -2 & 3 & 2 \\ 4 & 1 & -2}$ herleidt tot $x = \tfrac47 z$, $y = -\tfrac27 z$: met $z = 7$ is $(4, -2, 7)$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten: waar of vals
  opgave: |-
    Waar of vals? Verklaar, of geef een tegenvoorbeeld.
  lijst: enumerate
  delen:
    - opgave: |-
        Elke $2 \times 2$-matrix met reële elementen heeft een reële eigenwaarde.
      antwoord: |-
        vals
      uitwerking: |-
        De draaiing over $90^\circ$, $\km{0 & -1 \\ 1 & 0}$, heeft alleen de eigenwaarden $\pm i$.
    - opgave: |-
        Als 0 een eigenwaarde is van $A$, dan is $\det A = 0$.
      antwoord: |-
        waar
      uitwerking: |-
        $\det(A - 0I) = \det A = 0$.
    - opgave: |-
        De eigenwaarden van $A + B$ zijn de sommen van een eigenwaarde van $A$ en een eigenwaarde van $B$.
      antwoord: |-
        vals
      uitwerking: |-
        $A = \km{0 & 1 \\ 0 & 0}$ en $B = \km{0 & 0 \\ 1 & 0}$ hebben alleen de eigenwaarde 0, maar $A + B = \km{0 & 1 \\ 1 & 0}$ heeft de eigenwaarden 1 en $-1$.
    - opgave: |-
        Een eigenvector kan bij twee verschillende eigenwaarden horen.
      antwoord: |-
        vals
      uitwerking: |-
        Uit $A\vec v = \lambda\vec v$ en $A\vec v = \mu\vec v$ volgt $(\lambda - \mu)\vec v = \nulv$, en omdat $\vec v \neq \nulv$, is $\lambda = \mu$.
    - opgave: |-
        De som van twee eigenvectoren is een eigenvector.
      antwoord: |-
        vals
      uitwerking: |-
        Bij $\km{3 & -1 \\ 2 & 0}$ uit het probleem zijn $(1, 1)$ en $(1, 2)$ eigenvectoren, maar het beeld van $(2, 3)$ is $(3, 4)$, geen veelvoud. Bij dezelfde eigenwaarde klopt het wel, als de som niet $\nulv$ is.

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    een dubbele eigenwaarde met een rechte
  opgave: |-
    Neem $A = \km{4 & 0 & 0 \\ 0 & 2 & 1 \\ -2 & 0 & 2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de eigenwaarden.
      antwoord: |-
        2 (twee keer) en 4
      uitwerking: |-
        Naar de eerste rij: $p(\lambda) = (4 - \lambda)(2 - \lambda)^2$.
    - opgave: |-
        Bereken de eigenruimten. Wat is hun dimensie?
      antwoord: |-
        $\Eig{2} = \vb{(0, 1, 0)}$ en $\Eig{4} = \vb{(-2, 1, 2)}$, allebei dimensie 1
      uitwerking: |-
        $\lambda = 2$: $\km{2 & 0 & 0 \\ 0 & 0 & 1 \\ -2 & 0 & 0}$ geeft $x = 0$, $z = 0$: één parameter.\\
        $\lambda = 4$: $\km{0 & 0 & 0 \\ 0 & -2 & 1 \\ -2 & 0 & -2}$ geeft $z = 2y$ en $x = -z$: met $y = 1$ is $(-2, 1, 2)$.
    - opgave: |-
        Vergelijk met de matrix $D$ uit voorbeeld~\ref{vb:h1-dubbel}, die ook de dubbele eigenwaarde 2 heeft.
      antwoord: |-
        daar was $\Eig{2}$ een vlak
      uitwerking: |-
        Bij $D$ had $\Eig{2}$ dimensie 2, hier maar 1. Een eigenwaarde die twee keer voorkomt, geeft dus niet altijd een vlak met eigenvectoren. In hoofdstuk 3 zie je waarom dat belangrijk is.

- id: h1-o17
  soort: opdracht
  niveau: 2
  thema: |-
    spoor en determinant bij 3 x 3
  opgave: |-
    Neem $A = \km{2 & 1 & 0 \\ 1 & 3 & 1 \\ 0 & 1 & 2}$. Je weet dat 1 en 4 eigenwaarden zijn.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de derde eigenwaarde met het spoor.
      antwoord: |-
        2
      uitwerking: |-
        $1 + 4 + \lambda_3 = 2 + 3 + 2 = 7$, dus $\lambda_3 = 2$.
    - opgave: |-
        Controleer met de determinant.
      antwoord: |-
        $\det A = 8 = 1 \cdot 4 \cdot 2$
      uitwerking: |-
        Sarrus: $(12 + 0 + 0) - (0 + 2 + 2) = 8$.

# ---------------------------------------------------------------- opdrachten, niveau 3

- id: h1-o18
  soort: opdracht
  niveau: 3
  thema: |-
    A en de getransponeerde
  opgave: |-
    Neem een vierkante matrix $A$ en haar getransponeerde $A\tr$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $A$ en $A\tr$ dezelfde karakteristieke veelterm hebben.
      antwoord: |-
        $\det(A\tr - \lambda I) = \det(A - \lambda I)$
      uitwerking: |-
        $A\tr - \lambda I = (A - \lambda I)\tr$, want $I\tr = I$. En $\det M\tr = \det M$ (Matrices, hoofdstuk 3).
    - opgave: |-
        Bereken de eigenvectoren van $A = \km{1 & 1 \\ 0 & 2}$ en van $A\tr$.
      antwoord: |-
        $A$: 1 bij $(1, 0)$, 2 bij $(1, 1)$; $A\tr$: 1 bij $(1, -1)$, 2 bij $(0, 1)$
      uitwerking: |-
        $A - I = \km{0 & 1 \\ 0 & 1}$, $A - 2I = \km{-1 & 1 \\ 0 & 0}$. $A\tr = \km{1 & 0 \\ 1 & 2}$: $A\tr - I = \km{0 & 0 \\ 1 & 1}$ en $A\tr - 2I = \km{-1 & 0 \\ 1 & 0}$.
    - opgave: |-
        Wat besluit je?
      antwoord: |-
        zelfde eigenwaarden, andere eigenvectoren
      uitwerking: |-
        $A$ en $A\tr$ hebben altijd dezelfde eigenwaarden, maar meestal niet dezelfde eigenvectoren.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    projectie: $P^2 = P$
  opgave: |-
    Een matrix $P$ met $P^2 = P$ heet een \textit{projectie}: twee keer projecteren is hetzelfde als één keer.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat een eigenwaarde van een projectie altijd 0 of 1 is.
      antwoord: |-
        $\lambda^2 = \lambda$
      uitwerking: |-
        Uit $P\vec v = \lambda\vec v$ volgt $P^2\vec v = \lambda^2\vec v$. Maar $P^2\vec v = P\vec v = \lambda\vec v$, dus $(\lambda^2 - \lambda)\vec v = \nulv$, en omdat $\vec v \neq \nulv$ is $\lambda^2 = \lambda$.
    - opgave: |-
        Ga na dat $P = \tfrac15\km{1 & 2 \\ 2 & 4}$ een projectie is.
      antwoord: |-
        $P^2 = P$
      uitwerking: |-
        $P^2 = \tfrac{1}{25}\km{5 & 10 \\ 10 & 20} = \tfrac15\km{1 & 2 \\ 2 & 4}$.
    - opgave: |-
        Bepaal de eigenruimten van $P$. Op welke rechte projecteert $P$, en in welke richting?
      antwoord: |-
        $\Eig{1} = \vb{(1, 2)}$, $\Eig{0} = \vb{(-2, 1)}$
      uitwerking: |-
        $P - I = \tfrac15\km{-4 & 2 \\ 2 & -1}$: $y = 2x$. $P$: $x + 2y = 0$. $P$ projecteert loodrecht op de rechte $y = 2x$: de punten erop blijven staan, en de loodlijn erop gaat naar $O$.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    draaiing in de ruimte: de as
  opgave: |-
    Neem $P = \km{0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $P(x, y, z) = (z, x, y)$ en dat $P^3 = I$.
      antwoord: |-
        de coördinaten schuiven op
      uitwerking: |-
        $P\kol{x \\ y \\ z} = \kol{z \\ x \\ y}$. Drie keer opschuiven geeft $(x, y, z)$ terug, dus $P^3 = I$.
    - opgave: |-
        Toon aan dat $p_P(\lambda) = 1 - \lambda^3$, en bereken alle eigenwaarden in $\C$.
      antwoord: |-
        $1$ en $-\tfrac12 \pm \tfrac{\sqrt3}{2}\,i$
      uitwerking: |-
        Sarrus: $-\lambda^3 + 1 + 0 - 0 = 1 - \lambda^3$. Dus $\lambda^3 = 1$: de derdemachtswortels van 1. Met $1 - \lambda^3 = (1 - \lambda)(1 + \lambda + \lambda^2)$ en $D = -3$ zijn dat 1 en $\tfrac{-1 \pm \sqrt3\,i}{2}$.
    - opgave: |-
        Bepaal de eigenruimte bij 1.
      antwoord: |-
        $\Eig{1} = \vb{(1, 1, 1)}$
      uitwerking: |-
        $(z, x, y) = (x, y, z)$ geeft $x = y = z$.
    - opgave: |-
        $P$ is een draaiing in de ruimte. Rond welke as, en over welke hoek?
      antwoord: |-
        rond de rechte door $(1, 1, 1)$, over $120^\circ$
      uitwerking: |-
        De punten op de rechte door $(1, 1, 1)$ blijven staan: dat is de as. De drie assen worden cyclisch verwisseld en $P^3 = I$, dus de hoek is $\tfrac{360^\circ}{3} = 120^\circ$. Ook het argument van de complexe eigenwaarden is $\pm 120^\circ$. Euler bewees in 1775 dat elke draaiing in de ruimte zo'n as heeft: een karakteristieke veelterm van graad 3 heeft altijd een reële nulwaarde.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    nilpotente matrix
  opgave: |-
    Neem $A = \km{2 & -4 \\ 1 & -2}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $A^2$.
      antwoord: |-
        $O$
      uitwerking: |-
        $\km{4 - 4 & -8 + 8 \\ 2 - 2 & -4 + 4} = O$.
    - opgave: |-
        Toon aan: als $A^2 = O$, dan is 0 de enige eigenwaarde van $A$.
      antwoord: |-
        $\lambda^2\vec v = \nulv$
      uitwerking: |-
        Uit $A\vec v = \lambda\vec v$ volgt $\nulv = A^2\vec v = \lambda^2\vec v$, dus $\lambda^2 = 0$ en $\lambda = 0$.
    - opgave: |-
        Bepaal de eigenruimte van $A$.
      antwoord: |-
        $\Eig{0} = \vb{(2, 1)}$
      uitwerking: |-
        $A\vec v = \nulv$ geeft $x = 2y$. Ook hier: een dubbele eigenwaarde ($p(\lambda) = \lambda^2$) met maar een rechte eigenvectoren.

- id: h1-o22
  soort: opdracht
  niveau: 3
  thema: |-
    wanneer zijn de eigenwaarden reëel?
  opgave: |-
    Neem $A = \km{a & b \\ c & d}$ met reële elementen.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de discriminant van $p_A$ gelijk is aan $(a - d)^2 + 4bc$.
      antwoord: |-
        $(a + d)^2 - 4(ad - bc)$
      uitwerking: |-
        $p_A(\lambda) = \lambda^2 - (a + d)\lambda + ad - bc$, dus $D = (a + d)^2 - 4ad + 4bc = (a - d)^2 + 4bc$.
    - opgave: |-
        Besluit: is $bc > 0$, dan heeft $A$ twee verschillende reële eigenwaarden. Geldt het omgekeerde?
      antwoord: |-
        nee
      uitwerking: |-
        Met $bc > 0$ is $D > 0$. Het omgekeerde geldt niet: $\km{3 & 0 \\ 0 & 1}$ heeft $bc = 0$ en toch twee eigenwaarden, en $\km{5 & -1 \\ 1 & 1}$ heeft $bc = -1$ en $D = 16 - 4 = 12 > 0$.
    - opgave: |-
        Leid af dat een symmetrische matrix ($b = c$) altijd reële eigenwaarden heeft.
      antwoord: |-
        $D = (a - d)^2 + 4b^2 \geqslant 0$
      uitwerking: |-
        Met $c = b$ is $D$ een som van kwadraten.

# ---------------------------------------------------------------- koppel

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  thema: |-
    vermenigvuldigen met a + bi
  opgave: |-
    In het vlak van Gauss is vermenigvuldigen met $z = a + bi$ een afbeelding: het punt $x + yi$ gaat naar $(a + bi)(x + yi)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de matrix van die afbeelding $\km{a & -b \\ b & a}$ is.
      antwoord: |-
        $(ax - by) + (bx + ay)i$
      uitwerking: |-
        $(a + bi)(x + yi) = (ax - by) + (bx + ay)i$, dus $(x, y) \mapsto (ax - by,\ bx + ay)$.
    - opgave: |-
        Toon aan dat de eigenwaarden $a + bi$ en $a - bi$ zijn.
      antwoord: |-
        $(a - \lambda)^2 + b^2 = 0$
      uitwerking: |-
        $p(\lambda) = (a - \lambda)^2 + b^2 = 0 \iff a - \lambda = \pm bi$.
    - opgave: |-
        Neem $z = 1 + i\sqrt3$. Geef de modulus en het argument, en leg uit waarom de matrix geen reële eigenvectoren heeft.
      antwoord: |-
        modulus 2, argument $60^\circ$
      uitwerking: |-
        Vermenigvuldigen met $z$ draait elke vector over $60^\circ$ en maakt hem 2 keer zo lang. Geen enkele vector blijft op zijn rechte.

- id: h1-koppel-2
  soort: koppel
  niveau: 3
  koppel:
    rubriek: algebra
    onderwerp: |-
      Vectorruimten
  thema: |-
    eigenfuncties van de afgeleide
  opgave: |-
    Afleiden is een lineaire afbeelding $D$ van de vectorruimte van de afleidbare functies: $D(f) = f'$. Een functie $f \neq 0$ met $D(f) = \lambda f$ heet een \textit{eigenfunctie}.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $f(x) = \e^{3x}$ een eigenfunctie is. Bij welke eigenwaarde?
      antwoord: |-
        3
      uitwerking: |-
        $D(\e^{3x}) = 3\e^{3x}$.
    - opgave: |-
        Toon aan dat elk reëel getal $k$ een eigenwaarde van $D$ is.
      antwoord: |-
        $\e^{kx}$
      uitwerking: |-
        $D(\e^{kx}) = k\e^{kx}$, en $\e^{kx} \neq 0$.
    - opgave: |-
        Op de veeltermen van graad hoogstens 2, met basis $(1, x, x^2)$, heeft $D$ de matrix $\km{0 & 1 & 0 \\ 0 & 0 & 2 \\ 0 & 0 & 0}$. Verklaar die matrix, en bepaal de eigenwaarden en de eigenruimte.
      antwoord: |-
        alleen 0, met de constante veeltermen
      uitwerking: |-
        De kolommen zijn de coördinaten van $D(1) = 0$, $D(x) = 1$ en $D(x^2) = 2x$. Een bovendriehoeksmatrix met nullen op de hoofddiagonaal: alleen de eigenwaarde 0. De kern: $b = 0$ en $c = 0$ in $a + bx + cx^2$, dus de constanten. Logisch: een veelterm die een veelvoud is van zijn afgeleide, moet een constante zijn, want de afgeleide heeft een lagere graad.

- id: h1-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: |-
      Multivariate statistiek
  thema: |-
    symmetrische matrices
  opgave: |-
    In Multivariate statistiek zag je dat een symmetrische matrix reële eigenwaarden heeft, met loodrechte eigenvectoren.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de eigenwaarden en eigenvectoren van $S = \km{3 & 1 \\ 1 & 3}$, en ga na dat de eigenvectoren loodrecht op elkaar staan.
      antwoord: |-
        4 bij $(1, 1)$, 2 bij $(1, -1)$
      uitwerking: |-
        $(3 - \lambda)^2 - 1 = 0$: $\lambda = 2$ of $4$. $\lambda = 4$: $x = y$; $\lambda = 2$: $x = -y$. Scalair product: $1 - 1 = 0$.
    - opgave: |-
        Doe hetzelfde voor de matrix $A = \km{3 & -1 \\ 2 & 0}$ uit het probleem. Wat besluit je?
      antwoord: |-
        niet loodrecht
      uitwerking: |-
        De eigenvectoren $(1, 1)$ en $(1, 2)$ hebben scalair product $3 \neq 0$. De eigenschap geldt alleen voor symmetrische matrices.

- id: h1-koppel-4
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Ruimtemeetkunde
  thema: |-
    spiegeling om een vlak
  opgave: |-
    De spiegeling om het vlak $\alpha \leftrightarrow x + y + z = 0$ heeft als matrix $S = \tfrac13\km{1 & -2 & -2 \\ -2 & 1 & -2 \\ -2 & -2 & 1}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef zonder te rekenen de eigenwaarden en eigenruimten van $S$.
      antwoord: |-
        1 bij het vlak $\alpha$, $-1$ bij de normaal $\vb{(1, 1, 1)}$
      uitwerking: |-
        De punten van $\alpha$ blijven staan: $\Eig{1} = \alpha$, een vlak. De normaal $(1, 1, 1)$ staat loodrecht op $\alpha$ en keert om: $\Eig{-1}$ is de rechte door $(1, 1, 1)$.
    - opgave: |-
        Controleer met $(1, 1, 1)$ en met $(1, -1, 0)$.
      antwoord: |-
        $S(1, 1, 1) = (-1, -1, -1)$, $S(1, -1, 0) = (1, -1, 0)$
      uitwerking: |-
        $\tfrac13(1 - 2 - 2, \ldots) = (-1, -1, -1)$ en $\tfrac13(1 + 2, -2 - 1, -2 + 2) = (1, -1, 0)$; dat laatste punt ligt in $\alpha$.
    - opgave: |-
        Controleer het spoor en de determinant met de eigenwaarden.
      antwoord: |-
        $\spoor S = 1$, $\det S = -1$
      uitwerking: |-
        De eigenwaarden zijn 1, 1 en $-1$: som $1 = \tfrac13(1 + 1 + 1)$ en product $-1$. Een spiegeling keert de oriëntatie om.

# ---------------------------------------------------------------- test

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Ga na of de vector een eigenvector is van $\km{4 & -3 \\ 2 & -1}$. Geef zo ja de eigenwaarde.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $(3, 2)$
      antwoord: |-
        ja, 2
      uitwerking: |-
        $\kol{12 - 6 \\ 6 - 2} = \kol{6 \\ 4} = 2\kol{3 \\ 2}$.
    - opgave: |-
        $(1, 2)$
      antwoord: |-
        nee
      uitwerking: |-
        $\kol{4 - 6 \\ 2 - 2} = \kol{-2 \\ 0}$, geen veelvoud.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Geef zonder te rekenen de eigenwaarden en eigenruimten van $\km{0 & 0 \\ 0 & 1}$, de loodrechte projectie op de $y$-as.
  antwoord: |-
    1 bij de $y$-as, 0 bij de $x$-as
  uitwerking: |-
    De punten van de $y$-as blijven staan; de $x$-as gaat naar de oorsprong.

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Bereken de eigenwaarden en eigenvectoren van $\km{2 & 1 \\ 4 & -1}$.
  antwoord: |-
    3 bij $(1, 1)$, $-2$ bij $(1, -4)$
  uitwerking: |-
    $(2 - \lambda)(-1 - \lambda) - 4 = \lambda^2 - \lambda - 6 = 0$: 3 en $-2$.\\
    $\lambda = 3$: $\km{-1 & 1 \\ 4 & -4}$, $x = y$. $\lambda = -2$: $\km{4 & 1 \\ 4 & 1}$, $y = -4x$.

- id: h1-t4
  soort: test
  niveau: 2
  opgave: |-
    Bereken de eigenwaarden en eigenvectoren van $\km{2 & 0 & 0 \\ 4 & 1 & 1 \\ 2 & 0 & 3}$.
  antwoord: |-
    1 bij $(0, 1, 0)$, 2 bij $(1, 2, -2)$, 3 bij $(0, 1, 2)$
  uitwerking: |-
    Naar de eerste rij: $p(\lambda) = (2 - \lambda)(1 - \lambda)(3 - \lambda)$.\\
    $\lambda = 1$: $\km{1 & 0 & 0 \\ 4 & 0 & 1 \\ 2 & 0 & 2}$ geeft $x = z = 0$.\\
    $\lambda = 2$: $\km{0 & 0 & 0 \\ 4 & -1 & 1 \\ 2 & 0 & 1}$ geeft $z = -2x$, $y = 4x + z = 2x$.\\
    $\lambda = 3$: $\km{-1 & 0 & 0 \\ 4 & -2 & 1 \\ 2 & 0 & 0}$ geeft $x = 0$, $z = 2y$.

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    Bereken de eigenwaarden van $\km{0 & -2 \\ 1 & 2}$ en een eigenvector bij elke eigenwaarde.
  antwoord: |-
    $1 + i$ bij $(1 - i, -1)$, $1 - i$ bij $(1 + i, -1)$
  uitwerking: |-
    $-\lambda(2 - \lambda) + 2 = \lambda^2 - 2\lambda + 2 = 0$: $\lambda = 1 \pm i$.\\
    $\lambda = 1 + i$: $\km{-1 - i & -2 \\ 1 & 1 - i}$, rij $(1, 1 - i)$ geeft $(1 - i, -1)$. De toegevoegde hoort bij $1 - i$.

- id: h1-t6
  soort: test
  niveau: 1
  opgave: |-
    De matrix $\km{6 & -4 \\ 3 & -1}$ heeft de eigenwaarde 2. Bepaal de andere zonder de karakteristieke vergelijking op te lossen, en controleer.
  antwoord: |-
    3
  uitwerking: |-
    Spoor: $2 + \lambda_2 = 5$, dus $\lambda_2 = 3$. Controle: $2 \cdot 3 = 6 = -6 + 12 = \det A$.

- id: h1-t7
  soort: test
  niveau: 2
  opgave: |-
    Een matrix $A$ heeft de eigenwaarde 2 bij $(1, 0)$ en $-1$ bij $(1, 1)$. Is $A$ inverteerbaar? Geef de eigenwaarden en eigenvectoren van $A^{-1}$.
  antwoord: |-
    ja; $\tfrac12$ bij $(1, 0)$, $-1$ bij $(1, 1)$
  uitwerking: |-
    0 is geen eigenwaarde, want een $2 \times 2$-matrix heeft er hoogstens twee. $A^{-1}$ heeft dezelfde eigenvectoren met de omgekeerde eigenwaarden.
