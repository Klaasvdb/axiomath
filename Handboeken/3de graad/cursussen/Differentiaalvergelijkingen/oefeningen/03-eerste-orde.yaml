# Oefeningen van hoofdstuk 3. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken (telkens $+\,C$).
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\ig \dfrac{1}{3y}\dy$
      antwoord: |-
        $\tfrac13\ln|y|$
      uitwerking: |-
        $\tfrac13 \int \tfrac1y\dy$.
    - opgave: |-
        $\ig t\,\e^{t^2}\dt$
      antwoord: |-
        $\tfrac12\,\e^{t^2}$
      uitwerking: |-
        Stel $u = t^2$, $\mathrm{d}u = 2t\dt$.
    - opgave: |-
        $\ig t\,\e^{2t}\dt$
      antwoord: |-
        $\bigl(\tfrac t2 - \tfrac14\bigr)\e^{2t}$
      uitwerking: |-
        Partieel: $\tfrac t2\,\e^{2t} - \int \tfrac12\,\e^{2t}\dt$.
    - opgave: |-
        $\ig \dfrac{1}{1 + y^2}\dy$
      antwoord: |-
        $\bgtan y$
      uitwerking: |-
        Een basisprimitieve.
    - opgave: |-
        $\ig \dfrac{1}{\sqrt{y}}\dy$
      antwoord: |-
        $2\sqrt{y}$
      uitwerking: |-
        $\int y^{-1/2}\dy = 2\,y^{1/2}$.
    - opgave: |-
        $\ig \dfrac{1}{4 - y}\dy$
      antwoord: |-
        $-\ln|4 - y|$
      uitwerking: |-
        De afgeleide van $4 - y$ is $-1$.

- id: h3-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem de differentiaalvergelijking $y' = t\,y$, en een oplossing met $y > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $y = \e^{t^2/2}$ een oplossing is.
      antwoord: |-
        $y' = t\,\e^{t^2/2} = t\,y$
      uitwerking: |-
        Kettingregel: $(\e^{t^2/2})' = t\,\e^{t^2/2}$.
    - opgave: |-
        Toon aan dat voor elke oplossing met $y > 0$ geldt: $\bigl(\ln y\bigr)' = t$.
      antwoord: |-
        $(\ln y)' = \frac{y'}{y} = t$
      uitwerking: |-
        Kettingregel, en deel $y' = t\,y$ door $y$.
    - opgave: |-
        Welke functies hebben $t$ als afgeleide? Wat volgt daaruit voor $\ln y$, en voor $y$?
      antwoord: |-
        $\ln y = \tfrac{t^2}{2} + C$, $y = \e^C\,\e^{t^2/2}$
      uitwerking: |-
        De primitieven van $t$ zijn $\tfrac{t^2}{2} + C$.
    - opgave: |-
        Geef de oplossing met $y(0) = 5$.
      antwoord: |-
        $y = 5\,\e^{t^2/2}$
      uitwerking: |-
        $\e^C = 5$.

- id: h3-scheiden
  soort: kort
  opgave: |-
    Los op door de veranderlijken te scheiden.
  lijst: enumerate
  delen:
    - opgave: |-
        $y' = t^2\,y$, \ $y(0) = 2$
      antwoord: |-
        $y = 2\,\e^{t^3/3}$
      uitwerking: |-
        $\ln|y| = \tfrac{t^3}{3} + C$, en $y(0) = 2$.
    - opgave: |-
        $y' = \dfrac{t + 1}{y}$, \ $y(0) = 3$
      antwoord: |-
        $y = \sqrt{t^2 + 2t + 9}$
      uitwerking: |-
        $\tfrac{y^2}{2} = \tfrac{t^2}{2} + t + C$ met $C = \tfrac92$; $y > 0$. Onder de wortel staat $(t + 1)^2 + 8 > 0$: de oplossing bestaat voor elke $t$.
    - opgave: |-
        $y' = \e^{-y}$, \ $y(0) = 0$
      antwoord: |-
        $y = \ln(t + 1)$, voor $t > -1$
      uitwerking: |-
        $\int \e^{y}\dy = \int 1\dt$ geeft $\e^y = t + C$ met $C = 1$.

- id: h3-constant
  soort: kort
  opgave: |-
    Bepaal alle oplossingen. Vergeet de constante oplossingen niet.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $y' = 2\,(y + 3)$
      antwoord: |-
        $y = -3 + D\,\e^{2t}$, $D \in \R$
      uitwerking: |-
        Constant: $y = -3$ ($D = 0$). Scheiden: $\ln|y + 3| = 2t + C$.
    - opgave: |-
        $y' = (1 - t)\,y$
      antwoord: |-
        $y = D\,\e^{t - t^2/2}$, $D \in \R$
      uitwerking: |-
        Constant: $y = 0$. Scheiden: $\ln|y| = t - \tfrac{t^2}{2} + C$.
    - opgave: |-
        $y' = y\cos t$
      antwoord: |-
        $y = D\,\e^{\sin t}$, $D \in \R$
      uitwerking: |-
        Constant: $y = 0$. Scheiden: $\ln|y| = \sin t + C$.

- id: h3-logistisch
  soort: kort
  opgave: |-
    Logistische groei.
  lijst: enumerate
  delen:
    - opgave: |-
        Los op: $y' = 0{,}5\,y\,\bigl(1 - \tfrac{y}{1000}\bigr)$ met $y(0) = 100$. Wanneer is $y = 900$?
      antwoord: |-
        $y = \frac{1000}{1 + 9\,\e^{-0{,}5t}}$; na ongeveer 8,8
      uitwerking: |-
        $C = \tfrac{900}{100} = 9$. Uit $1 + 9\,\e^{-0{,}5t} = \tfrac{10}{9}$: $\e^{-0{,}5t} = \tfrac{1}{81}$, dus $t = 2\ln 81 \approx 8{,}79$.
    - opgave: |-
        Waar ligt het buigpunt van die oplossing?
      antwoord: |-
        $t = 2\ln 9 \approx 4{,}39$, bij $y = 500$
      uitwerking: |-
        $t = \tfrac{\ln C}{k} = \tfrac{\ln 9}{0{,}5}$.
    - opgave: |-
        Schrijf $y' = 2\,y - 0{,}01\,y^2$ in de logistische vorm. Wat zijn $k$ en $M$?
      antwoord: |-
        $y' = 2\,y\,\bigl(1 - \tfrac{y}{200}\bigr)$: $k = 2$, $M = 200$
      uitwerking: |-
        Zet $2y$ voorop: $0{,}01\,y^2 = 2y \cdot \tfrac{y}{200}$.

- id: h3-singulier
  soort: kort
  opgave: |-
    Neem $y' = 4\sqrt{y}$ (met $y \geqslant 0$).
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de algemene oplossing.
      antwoord: |-
        $y = (2t + C)^2$, voor $t \geqslant -\tfrac C2$
      uitwerking: |-
        $\int \tfrac{1}{4\sqrt y}\dy = \int 1\dt$ geeft $\tfrac12\sqrt y = t + c$, dus $\sqrt y = 2t + C$ (en dat moet $\geqslant 0$ zijn).
    - opgave: |-
        Geef een singuliere oplossing, en twee verschillende oplossingen met $y(1) = 0$.
      antwoord: |-
        $y = 0$; bijvoorbeeld $y = 0$ en $y = 4(t - 1)^2$ voor $t \geqslant 1$ (0 daarvoor)
      uitwerking: |-
        $y = 0$ zit voor geen enkele $C$ in de familie. Door $(1, 0)$: de singuliere oplossing, of de as tot $t = 1$ en daarna $(2t - 2)^2$.

- id: h3-kogel
  soort: kort
  opgave: |-
    Een voorwerp schuift over een ruwe vloer en remt af volgens $v' = -6\sqrt{v}$, met $v(0) = 9$ (in m/s).
  lijst: enumerate
  delen:
    - opgave: |-
        Los op. Wanneer staat het voorwerp stil?
      antwoord: |-
        $v = 9\,(1 - t)^2$ voor $t \leqslant 1$; na 1 s
      uitwerking: |-
        $2\sqrt v = -6t + C$ met $C = 6$, dus $\sqrt v = 3 - 3t$. Daarna is $v = 0$.
    - opgave: |-
        Welke afstand legt het af?
      antwoord: |-
        3 m
      uitwerking: |-
        $\int_0^1 9\,(1 - t)^2\dt = \bigl[-3\,(1 - t)^3\bigr]_0^1 = 3$.

- id: h3-lineair
  soort: kort
  opgave: |-
    Los op met een integrerende factor.
  lijst: enumerate
  delen:
    - opgave: |-
        $y' + 3y = 6$, \ $y(0) = 0$
      antwoord: |-
        $y = 2 - 2\,\e^{-3t}$
      uitwerking: |-
        $\mu = \e^{3t}$: $(\e^{3t}y)' = 6\,\e^{3t}$, dus $\e^{3t}y = 2\,\e^{3t} + C$ met $C = -2$.
    - opgave: |-
        $y' - y = \e^{2t}$, \ $y(0) = 0$
      antwoord: |-
        $y = \e^{2t} - \e^{t}$
      uitwerking: |-
        $\mu = \e^{-t}$: $(\e^{-t}y)' = \e^{t}$, dus $\e^{-t}y = \e^t + C$ met $C = -1$.
    - opgave: |-
        $t\,y' + y = 2t$, \ voor $t > 0$ (algemene oplossing)
      antwoord: |-
        $y = t + \dfrac{C}{t}$
      uitwerking: |-
        Het linkerlid is al $(t\,y)'$. Of: deel door $t$, $p = \tfrac1t$, $\mu = t$. Dus $t\,y = t^2 + C$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h3-meng
  soort: kort
  opgave: |-
    Een vat bevat 50 liter zuiver water. Er stroomt pekel in met 0,1 kg zout per liter, aan 5 liter per minuut, en het gemengde water stroomt er even snel uit.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel de differentiaalvergelijking op voor de hoeveelheid zout $S$ (in kg), en los op.
      antwoord: |-
        $S' = 0{,}5 - 0{,}1\,S$, $S = 5 - 5\,\e^{-0{,}1t}$
      uitwerking: |-
        Binnen $0{,}1 \cdot 5$, buiten $\tfrac{S}{50} \cdot 5$. $\mu = \e^{0{,}1t}$: $\e^{0{,}1t}S = 5\,\e^{0{,}1t} + C$ met $C = -5$.
    - opgave: |-
        Wanneer zit er 4 kg zout in het vat?
      antwoord: |-
        na ongeveer 16 minuten
      uitwerking: |-
        $5\,\e^{-0{,}1t} = 1$ geeft $t = 10\ln 5 \approx 16{,}1$.

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    scheiden van veranderlijken
  opgave: |-
    Bepaal de algemene oplossing door de veranderlijken te scheiden.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y' = 3t^2\,y$
      antwoord: |-
        $y = D\,\e^{t^3}$
      uitwerking: |-
        $\ln|y| = t^3 + C$; met $D \in \R$ zit ook $y = 0$ erbij.
    - opgave: |-
        $y' = y^2\cos t$
      antwoord: |-
        $y = -\dfrac{1}{\sin t + C}$ en $y = 0$
      uitwerking: |-
        $\int y^{-2}\dy = \int \cos t\dt$ geeft $-\tfrac1y = \sin t + C$.
    - opgave: |-
        $y' = \dfrac{1 + y^2}{1 + t^2}$
      antwoord: |-
        $\bgtan y = \bgtan t + C$
      uitwerking: |-
        Beide leden integreren met de basisprimitieve van $\tfrac{1}{1 + u^2}$. Naar $y$: $y = \tan(\bgtan t + C)$.
    - opgave: |-
        $y' = \e^{t - y}$
      antwoord: |-
        $y = \ln(\e^t + C)$
      uitwerking: |-
        $\e^{t - y} = \e^t\,\e^{-y}$, dus $\int \e^y\dy = \int \e^t\dt$.
    - opgave: |-
        $y\,y' = t$
      antwoord: |-
        $y^2 = t^2 + C$
      uitwerking: |-
        $\int y\dy = \int t\dt$: hyperbolen (en voor $C = 0$ de rechten $y = \pm t$).
    - opgave: |-
        $t\,y' = y + 1$, \ voor $t > 0$
      antwoord: |-
        $y = D\,t - 1$
      uitwerking: |-
        $\int \tfrac{1}{y + 1}\dy = \int \tfrac1t\dt$ geeft $\ln|y + 1| = \ln t + C$; $y = -1$ is de constante oplossing ($D = 0$).

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    integrerende factor
  opgave: |-
    Bepaal de algemene oplossing met een integrerende factor.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y' + 4y = 8$
      antwoord: |-
        $y = 2 + C\,\e^{-4t}$
      uitwerking: |-
        $\mu = \e^{4t}$: $\e^{4t}y = 2\,\e^{4t} + C$.
    - opgave: |-
        $y' - 2y = \e^{t}$
      antwoord: |-
        $y = -\e^{t} + C\,\e^{2t}$
      uitwerking: |-
        $\mu = \e^{-2t}$: $(\e^{-2t}y)' = \e^{-t}$, dus $\e^{-2t}y = -\e^{-t} + C$.
    - opgave: |-
        $y' + \dfrac{y}{t} = 1$, \ $t > 0$
      antwoord: |-
        $y = \dfrac t2 + \dfrac Ct$
      uitwerking: |-
        $\mu = \e^{\ln t} = t$: $(t\,y)' = t$, dus $t\,y = \tfrac{t^2}{2} + C$.
    - opgave: |-
        $y' + 2t\,y = 2t$
      antwoord: |-
        $y = 1 + C\,\e^{-t^2}$
      uitwerking: |-
        $\mu = \e^{t^2}$: $(\e^{t^2}y)' = 2t\,\e^{t^2}$, dus $\e^{t^2}y = \e^{t^2} + C$. (Ook scheidbaar: $y' = 2t\,(1 - y)$.)
    - opgave: |-
        $y' + y = \sin t$
      antwoord: |-
        $y = \tfrac12(\sin t - \cos t) + C\,\e^{-t}$
      uitwerking: |-
        $\mu = \e^t$: $\int \e^t\sin t\dt = \tfrac12\,\e^t(\sin t - \cos t)$, met twee keer partiële integratie.
    - opgave: |-
        $y' - \dfrac{y}{t} = t^2$, \ $t > 0$
      antwoord: |-
        $y = \dfrac{t^3}{2} + C\,t$
      uitwerking: |-
        $\mu = \e^{-\ln t} = \tfrac1t$: $\bigl(\tfrac yt\bigr)' = t$, dus $\tfrac yt = \tfrac{t^2}{2} + C$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    beginwaardeproblemen
  opgave: |-
    Los op met de gegeven beginvoorwaarde. Kies zelf de methode.
  lijst: enumerate
  delen:
    - opgave: |-
        $y' = 2t\,(y + 1)$, \ $y(0) = 0$
      antwoord: |-
        $y = \e^{t^2} - 1$
      uitwerking: |-
        Scheiden: $\ln|y + 1| = t^2 + C$, en $y(0) = 0$ geeft $y + 1 = \e^{t^2}$.
    - opgave: |-
        $y' = t\,y^2$, \ $y(0) = 1$. Op welk interval bestaat de oplossing?
      antwoord: |-
        $y = \dfrac{2}{2 - t^2}$, op $\bigl]{-\sqrt2}, \sqrt2\bigr[$
      uitwerking: |-
        $-\tfrac1y = \tfrac{t^2}{2} + C$ met $C = -1$. De noemer is 0 in $t = \pm\sqrt2$: het interval rond $t = 0$ is $\bigl]{-\sqrt2}, \sqrt2\bigr[$.
    - opgave: |-
        $y' + y = \e^{-t}$, \ $y(0) = 2$
      antwoord: |-
        $y = (t + 2)\,\e^{-t}$
      uitwerking: |-
        $\mu = \e^t$: $(\e^t y)' = 1$, dus $\e^t y = t + 2$.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    welke methode?
  opgave: |-
    Is de vergelijking scheidbaar, lineair, allebei of geen van beide?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $y' = t\,y$
      antwoord: |-
        allebei
      uitwerking: |-
        $g(t)\,h(y)$ met $h(y) = y$, en ook $y' - t\,y = 0$.
    - opgave: |-
        $y' = t + y$
      antwoord: |-
        lineair
      uitwerking: |-
        $y' - y = t$; $t + y$ is geen product.
    - opgave: |-
        $y' = y^2 + 1$
      antwoord: |-
        scheidbaar
      uitwerking: |-
        $g(t) = 1$; niet lineair door $y^2$.
    - opgave: |-
        $y' = t^2 + y^2$
      antwoord: |-
        geen van beide
      uitwerking: |-
        Geen product, en $y^2$ is niet lineair.
    - opgave: |-
        $y' = y\sin t + t$
      antwoord: |-
        lineair
      uitwerking: |-
        $y' - (\sin t)\,y = t$.
    - opgave: |-
        $y' = \e^{t + y}$
      antwoord: |-
        scheidbaar
      uitwerking: |-
        $\e^{t + y} = \e^t\,\e^y$.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    logistische kromme lezen
  opgave: |-
    Een populatie groeit volgens $y = \dfrac{600}{1 + 5\,\e^{-0{,}4t}}$ ($t$ in jaar).
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de draagkracht, en hoe groot is de populatie bij de start?
      antwoord: |-
        600 en 100
      uitwerking: |-
        $M = 600$ en $y(0) = \tfrac{600}{6} = 100$.
    - opgave: |-
        Geef de differentiaalvergelijking.
      antwoord: |-
        $y' = 0{,}4\,y\,\bigl(1 - \tfrac{y}{600}\bigr)$
      uitwerking: |-
        Vergelijk met $\tfrac{M}{1 + C\,\e^{-kt}}$: $k = 0{,}4$.
    - opgave: |-
        Wanneer groeit de populatie het snelst, en hoe snel?
      antwoord: |-
        na ongeveer 4,0 jaar, 60 per jaar
      uitwerking: |-
        $t = \tfrac{\ln 5}{0{,}4} \approx 4{,}02$, bij $y = 300$: $y' = 0{,}4 \cdot 300 \cdot \tfrac12 = 60$.
    - opgave: |-
        Wanneer is de populatie 500?
      antwoord: |-
        na ongeveer 8,0 jaar
      uitwerking: |-
        $1 + 5\,\e^{-0{,}4t} = 1{,}2$ geeft $\e^{-0{,}4t} = 0{,}04$, dus $t = \tfrac{\ln 25}{0{,}4} \approx 8{,}05$.

- id: h3-o6
  soort: opdracht
  niveau: 1
  thema: |-
    constante oplossingen en stabiliteit
  opgave: |-
    Neem $y' = (y - 1)(y - 4)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de constante oplossingen.
      antwoord: |-
        $y = 1$ en $y = 4$
      uitwerking: |-
        Het rechterlid is 0 voor $y = 1$ en $y = 4$.
    - opgave: |-
        Bepaal het teken van $y'$, en zeg welk evenwicht stabiel is.
      antwoord: |-
        $y = 1$ stabiel, $y = 4$ onstabiel
      uitwerking: |-
        $y' > 0$ voor $y < 1$ en $y > 4$, $y' < 0$ voor $1 < y < 4$. Onder en net boven 1 gaan de krommen naar 1; rond 4 lopen ze ervan weg.
    - opgave: |-
        Wat gebeurt er met de oplossing met $y(0) = 3$?
      antwoord: |-
        ze daalt naar 1
      uitwerking: |-
        Tussen 1 en 4 is $y' < 0$: de oplossing daalt en nadert 1, zonder het te bereiken (twee integraalkrommen snijden elkaar hier niet).

- id: h3-o7
  soort: opdracht
  niveau: 1
  thema: |-
    begrippen, klassieke fouten
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Bij het scheiden van $y' = g(t)\,h(y)$ mag je altijd door $h(y)$ delen zonder een oplossing te verliezen.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: is $h(c) = 0$, dan is $y = c$ een oplossing die je zo niet vindt.
    - opgave: |-
        Elke lineaire vergelijking van de eerste orde is scheidbaar.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $y' + y = t$ is lineair, maar $t - y$ is geen product $g(t)\,h(y)$.
    - opgave: |-
        Bij de integrerende factor $\e^{P(t)}$ mag je de integratieconstante van $P$ weglaten.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: een andere constante vermenigvuldigt $\mu$ met een vast getal $\e^c$, en dat valt weg.
    - opgave: |-
        Een logistische oplossing met $0 < y_0 < M$ komt nooit boven $M$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $\tfrac{M}{1 + C\,\e^{-kt}} < M$ omdat $C\,\e^{-kt} > 0$.
    - opgave: |-
        Bij het scheiden moet je aan beide kanten een integratieconstante schrijven.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: twee constanten $C_1$ en $C_2$ kun je samennemen tot één constante $C = C_2 - C_1$.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    logistische groei, gerucht
  opgave: |-
    Op een school met 1200 leerlingen kennen 10 leerlingen een gerucht. Een dag later zijn het er 60. Neem aan dat het gerucht zich logistisch verspreidt, met $M = 1200$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $C$ en $k$.
      antwoord: |-
        $C = 119$, $k = \ln\tfrac{119}{19} \approx 1{,}83$ per dag
      uitwerking: |-
        $C = \tfrac{1190}{10} = 119$. Uit $\tfrac{1200}{1 + 119\,\e^{-k}} = 60$: $119\,\e^{-k} = 19$.
    - opgave: |-
        Wanneer kent de helft van de school het gerucht?
      antwoord: |-
        na ongeveer 2,6 dagen
      uitwerking: |-
        Het buigpunt: $t = \tfrac{\ln 119}{k} \approx 2{,}60$.
    - opgave: |-
        Wanneer kennen 1100 leerlingen het gerucht?
      antwoord: |-
        na ongeveer 3,9 dagen
      uitwerking: |-
        $1 + 119\,\e^{-kt} = \tfrac{12}{11}$ geeft $\e^{-kt} = \tfrac{1}{1309}$, dus $t = \tfrac{\ln 1309}{k} \approx 3{,}91$.

- id: h3-o9
  soort: opdracht
  prent:
    naam: ton
  niveau: 2
  thema: |-
    mengvat met veranderend volume
  opgave: |-
    In een vat zit 100 liter water met 5 kg zout. Er stroomt pekel in met 0,2 kg zout per liter, aan 4 liter per minuut. Het gemengde water stroomt eruit aan 2 liter per minuut.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het volume na $t$ minuten $100 + 2t$ liter is, en dat
        \[ S' = 0{,}8 - \frac{2\,S}{100 + 2t} . \]
      antwoord: |-
        binnen 0,8 kg/min, buiten $2 \cdot \frac{S}{100 + 2t}$ kg/min
      uitwerking: |-
        Er komt per minuut $4 - 2 = 2$ liter bij. Wat buitengaat, heeft de concentratie $\tfrac{S}{V}$.
    - opgave: |-
        Toon aan dat $\mu = 100 + 2t$ een integrerende factor is, en los op.
      antwoord: |-
        $S = \dfrac{0{,}8\,t^2 + 80\,t + 500}{100 + 2t}$
      uitwerking: |-
        $p = \tfrac{2}{100 + 2t}$ heeft primitieve $\ln(100 + 2t)$, dus $\mu = 100 + 2t$. $\bigl((100 + 2t)\,S\bigr)' = 0{,}8\,(100 + 2t)$ geeft $(100 + 2t)\,S = 80t + 0{,}8\,t^2 + C$ met $C = 500$.
    - opgave: |-
        Het vat loopt over bij 300 liter. Wat is dan de concentratie?
      antwoord: |-
        ongeveer 0,19 kg per liter
      uitwerking: |-
        Na 100 minuten: $S = \tfrac{8000 + 8000 + 500}{300} = 55$ kg in 300 liter: $\tfrac{55}{300} \approx 0{,}183$ kg per liter, iets minder dan in de pekel.

- id: h3-o10
  soort: opdracht
  prent:
    naam: trechter
  niveau: 2
  thema: |-
    wet van Torricelli
  opgave: |-
    Een cilindervormig vat loopt leeg door een gaatje in de bodem. Volgens de wet van Torricelli is $h' = -k\sqrt{h}$, met $h$ de hoogte van het water (in m) en $t$ in minuten. Bij de start is $h = 1{,}44$, na 10 minuten is $h = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Los op door te scheiden, en bepaal $k$.
      antwoord: |-
        $\sqrt{h} = 1{,}2 - \tfrac k2\,t$, $k = 0{,}04$
      uitwerking: |-
        $\int h^{-1/2}\,\mathrm{d}h = -k\int 1\dt$ geeft $2\sqrt h = -kt + C$ met $C = 2{,}4$. Uit $h(10) = 1$: $2 = 2{,}4 - 10k$.
    - opgave: |-
        Wanneer is het vat leeg?
      antwoord: |-
        na 60 minuten
      uitwerking: |-
        $\sqrt h = 1{,}2 - 0{,}02\,t = 0$ geeft $t = 60$.
    - opgave: |-
        Welke oplossing beschrijft het vat na 60 minuten? Waarom is dat een singuliere oplossing?
      antwoord: |-
        $h = 0$
      uitwerking: |-
        Een leeg vat blijft leeg: $h = 0$. De familie $h = (1{,}2 - 0{,}02\,t)^2$ geeft die oplossing voor geen enkele waarde van de constante; ze omhult de parabolen.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    afkoelen in een kamer die afkoelt
  opgave: |-
    's Avonds daalt de temperatuur in een kamer volgens $A(t) = 20 - 2t$ ($t$ in uur). Een kom soep van 90\,°C volgt de wet van Newton: $T' = -\bigl(T - A(t)\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf de vergelijking in de vorm $T' + p\,T = q(t)$, en los op.
      antwoord: |-
        $T = 22 - 2t + 68\,\e^{-t}$
      uitwerking: |-
        $T' + T = 20 - 2t$. $\mu = \e^t$: $\e^t\,T = \int (20 - 2t)\,\e^t\dt = (22 - 2t)\,\e^t + C$ (partieel), en $C = 68$.
    - opgave: |-
        Wat is op lange termijn het verschil tussen de soep en de kamer? Verklaar.
      antwoord: |-
        de soep is 2 graden warmer
      uitwerking: |-
        $T - A = 2 + 68\,\e^{-t} \to 2$. De kamer koelt 2 graden per uur af; de soep volgt met vertraging. Een verschil van 2 graden geeft juist een afkoeling van 2 graden per uur.

- id: h3-o12
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijking bij een familie
  opgave: |-
    Zoek een differentiaalvergelijking van de eerste orde waarvan de krommen de integraalkrommen zijn. Werk de constante weg.
  lijst: enumerate
  delen:
    - opgave: |-
        $y = C\,\e^{t^2}$
      antwoord: |-
        $y' = 2t\,y$
      uitwerking: |-
        $y' = 2t\,C\,\e^{t^2} = 2t\,y$.
    - opgave: |-
        $y = t + \dfrac{C}{t}$
      antwoord: |-
        $y' = 2 - \dfrac yt$
      uitwerking: |-
        $y' = 1 - \tfrac{C}{t^2}$, en $C = t\,(y - t)$, dus $y' = 1 - \tfrac{y - t}{t} = 2 - \tfrac yt$.
    - opgave: |-
        $t^2 + y^2 = C$ (cirkels)
      antwoord: |-
        $y' = -\dfrac ty$
      uitwerking: |-
        Leid af naar $t$: $2t + 2y\,y' = 0$.

- id: h3-o13
  soort: opdracht
  niveau: 2
  thema: |-
    logistische groei, eendenkroos
  opgave: |-
    Eendenkroos bedekt 2\,\% van een vijver. Vijf dagen later is dat 10\,\%. Neem aan dat de bedekte fractie (in \%) logistisch groeit met $M = 100$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $C$ en $k$.
      antwoord: |-
        $C = 49$, $k \approx 0{,}339$ per dag
      uitwerking: |-
        $C = \tfrac{98}{2} = 49$. Uit $1 + 49\,\e^{-5k} = 10$: $k = \tfrac15\ln\tfrac{49}{9} \approx 0{,}339$.
    - opgave: |-
        Wanneer is de vijver voor de helft bedekt? En voor 90\,\%?
      antwoord: |-
        na ongeveer 11,5 en 18,0 dagen
      uitwerking: |-
        Helft: $t = \tfrac{\ln 49}{k} \approx 11{,}5$. 90\,\%: $49\,\e^{-kt} = \tfrac19$, dus $t = \tfrac{\ln 441}{k} \approx 18{,}0$.

- id: h3-o14
  soort: opdracht
  niveau: 2
  thema: |-
    vervuiling die afneemt
  opgave: |-
    Een meer van $10^6$ m\textsuperscript{3} krijgt per dag 1000 m\textsuperscript{3} rivierwater, en er stroomt evenveel weg. Het rivierwater bevat een vervuilende stof met een concentratie van $0{,}01\,\e^{-0{,}02t}$ kg per m\textsuperscript{3}, die afneemt omdat een fabriek stroomopwaarts minder loost. Bij de start is het meer zuiver.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de hoeveelheid $P$ (in kg) voldoet aan $P' + 0{,}001\,P = 10\,\e^{-0{,}02t}$.
      antwoord: |-
        binnen $1000 \cdot 0{,}01\,\e^{-0{,}02t}$, buiten $1000 \cdot \frac{P}{10^6}$
      uitwerking: |-
        Per dag komt er $10\,\e^{-0{,}02t}$ kg binnen, en gaat er $0{,}001\,P$ kg buiten.
    - opgave: |-
        Los op.
      antwoord: |-
        $P = \tfrac{10\,000}{19}\bigl(\e^{-0{,}001t} - \e^{-0{,}02t}\bigr)$
      uitwerking: |-
        $\mu = \e^{0{,}001t}$: $(\mu P)' = 10\,\e^{-0{,}019t}$, dus $\mu P = -\tfrac{10}{0{,}019}\,\e^{-0{,}019t} + C$ met $C = \tfrac{10\,000}{19}$.
    - opgave: |-
        Wanneer zit er het meeste vuil in het meer?
      antwoord: |-
        na ongeveer 158 dagen
      uitwerking: |-
        $P' = 0$: $0{,}001\,\e^{-0{,}001t} = 0{,}02\,\e^{-0{,}02t}$, dus $\e^{0{,}019t} = 20$ en $t = \tfrac{\ln 20}{0{,}019} \approx 157{,}7$.

- id: h3-o15
  soort: opdracht
  niveau: 2
  thema: |-
    singuliere oplossingen als omhullende
  opgave: |-
    Neem $y' = \sqrt{1 - y^2}$, met $-1 \leqslant y \leqslant 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon door te scheiden aan dat $y = \sin(t + C)$, voor $-\tfrac\pi2 \leqslant t + C \leqslant \tfrac\pi2$.
      antwoord: |-
        $\bgsin y = t + C$
      uitwerking: |-
        $\int \tfrac{1}{\sqrt{1 - y^2}}\dy = \int 1\dt$ geeft $\bgsin y = t + C$, en $\bgsin y$ ligt tussen $-\tfrac\pi2$ en $\tfrac\pi2$. Daar is $\cos(t + C) \geqslant 0$, zodat $y' = \cos(t + C) = \sqrt{1 - \sin^2(t + C)}$.
    - opgave: |-
        Geef twee singuliere oplossingen. Hoe liggen ze ten opzichte van de sinuskrommen?
      antwoord: |-
        $y = 1$ en $y = -1$; ze raken de krommen in hun toppen
      uitwerking: |-
        $y = \pm 1$ geeft $0 = \sqrt{0}$. Elk stijgend stuk van een sinuskromme raakt $y = 1$ bovenaan en $y = -1$ onderaan: de rechten omhullen de familie.
    - opgave: |-
        Waarom is $y = \sin t$ op $[0, \pi]$ geen oplossing?
      antwoord: |-
        na $\tfrac\pi2$ daalt ze, maar $y' \geqslant 0$
      uitwerking: |-
        Het rechterlid is nooit negatief, dus een oplossing kan niet dalen. Na $t = \tfrac\pi2$ daalt $\sin t$: daar is de afgeleide $\cos t < 0$, maar $\sqrt{1 - \sin^2 t} = |\cos t| > 0$. Een oplossing die $y = 1$ bereikt, kan daar blijven: dat is de singuliere oplossing.

- id: h3-o16
  soort: opdracht
  niveau: 2
  thema: |-
    logistische groei met een vaste afvang
  opgave: |-
    Een beverpopulatie groeit logistisch, $y' = 0{,}5\,y\,\bigl(1 - \tfrac{y}{1000}\bigr)$, maar er worden 80 bevers per jaar verhuisd: $y' = 0{,}5\,y\,\bigl(1 - \tfrac{y}{1000}\bigr) - 80$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de constante oplossingen. Welke is stabiel?
      antwoord: |-
        $y = 200$ (onstabiel) en $y = 800$ (stabiel)
      uitwerking: |-
        $0{,}5\,y - 0{,}0005\,y^2 = 80 \iff y^2 - 1000\,y + 160\,000 = 0 \iff y = 200$ of $y = 800$. Tussen beide is $y' > 0$, daarbuiten $y' < 0$.
    - opgave: |-
        Wat gebeurt er met een populatie van 150 bevers?
      antwoord: |-
        ze sterft uit
      uitwerking: |-
        Onder 200 is $y' < 0$: de populatie daalt steeds sneller, tot 0.
    - opgave: |-
        Hoeveel bevers kan men hoogstens per jaar verhuizen zonder de populatie op termijn te laten uitsterven, als ze nu groot is?
      antwoord: |-
        125
      uitwerking: |-
        Er moet een evenwicht zijn: $0{,}5\,y\,(1 - \tfrac{y}{1000}) = q$ moet een oplossing hebben. Het maximum van het linkerlid ligt bij $y = 500$ en is $0{,}5 \cdot 500 \cdot 0{,}5 = 125$.

- id: h3-o17
  soort: opdracht
  niveau: 2
  thema: |-
    remmen evenredig met de snelheid
  opgave: |-
    Een andere kogel dringt met 400 m/s een materiaal binnen, waar $v' = -1500\,v$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef $v(t)$. Staat de kogel ooit stil?
      antwoord: |-
        $v = 400\,\e^{-1500t}$; nee
      uitwerking: |-
        Exponentieel verval: $v > 0$ voor elke $t$.
    - opgave: |-
        Bereken de afgelegde weg $\ig_0^{+\infty} v\dt$.
      antwoord: |-
        ongeveer 0,267 m
      uitwerking: |-
        $\lim_{b \to +\infty} \Bigl[-\tfrac{400}{1500}\,\e^{-1500t}\Bigr]_0^b = \tfrac{400}{1500} \approx 0{,}267$ m: dezelfde diepte als bij $v' = -20\,000\,\sqrt v$.
    - opgave: |-
        Een kogel die met 400 m/s in hout dringt, waar $v' = -20\,000\,\sqrt{v}$, staat na 2 ms stil (voorbeeld~\ref{vb:h3-terug}). Vergelijk de snelheid van deze kogel na 2 ms.
      antwoord: |-
        ongeveer 20 m/s tegenover 0 m/s
      uitwerking: |-
        $400\,\e^{-3} \approx 19{,}9$ m/s. De kogel in het hout staat dan al stil.

- id: h3-o18
  soort: opdracht
  niveau: 3
  thema: |-
    structuur van de oplossingen
  opgave: |-
    Neem $y' + p(t)\,y = q(t)$, met $\mu = \e^{P}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat het verschil van twee oplossingen een oplossing is van de \textit{homogene} vergelijking $y' + p(t)\,y = 0$.
      antwoord: |-
        $(y_1 - y_2)' + p\,(y_1 - y_2) = q - q = 0$
      uitwerking: |-
        Trek de twee gelijkheden van elkaar af.
    - opgave: |-
        Toon aan dat de oplossingen van de homogene vergelijking de functies $\dfrac{C}{\mu} = C\,\e^{-P(t)}$ zijn.
      antwoord: |-
        $(\mu y)' = 0$
      uitwerking: |-
        Met $q = 0$ geeft de stelling $(\mu\,y)' = 0$, dus $\mu\,y = C$.
    - opgave: |-
        Besluit: is $y_p$ één oplossing, dan zijn alle oplossingen $y = y_p + C\,\e^{-P(t)}$. Illustreer met voorbeeld~\ref{vb:h3-lineair}.
      antwoord: |-
        $y = (t - 1) + C\,\e^{-t}$
      uitwerking: |-
        Is $y$ een oplossing, dan is $y - y_p$ homogeen, dus $C\,\e^{-P}$. In het voorbeeld is $y_p = t - 1$ en $P = t$.

- id: h3-o19
  soort: opdracht
  niveau: 3
  thema: |-
    vergelijking van Bernoulli
  opgave: |-
    De vergelijking $y' + y = y^2$ is niet lineair, maar een substitutie maakt ze lineair.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel $z = \dfrac1y$. Toon aan dat $z' - z = -1$.
      antwoord: |-
        $z' = -\frac{y'}{y^2}$
      uitwerking: |-
        $z' = -\tfrac{y'}{y^2} = -\tfrac{y^2 - y}{y^2} = -1 + \tfrac1y = -1 + z$.
    - opgave: |-
        Los op naar $z$ en daarna naar $y$.
      antwoord: |-
        $y = \dfrac{1}{1 + C\,\e^{t}}$
      uitwerking: |-
        $\mu = \e^{-t}$: $(\e^{-t}z)' = -\e^{-t}$, dus $\e^{-t}z = \e^{-t} + C$ en $z = 1 + C\,\e^t$.
    - opgave: |-
        Welke oplossing ga je zo verloren? Is ze singulier?
      antwoord: |-
        $y = 0$
      uitwerking: |-
        $y = 0$ is een oplossing, maar $z = \tfrac1y$ bestaat niet. In de vorm $\tfrac{1}{1 + C\,\e^t}$ zit ze niet: volgens de definitie is ze singulier. Schrijf je de familie als $\tfrac{D}{D + \e^t}$, dan geeft $D = 0$ ze wel: of een oplossing singulier heet, kan afhangen van hoe je de familie schrijft.

- id: h3-o20
  soort: opdracht
  niveau: 3
  thema: |-
    logistische groei op twee manieren
  opgave: |-
    Los $y' = k\,y\,\bigl(1 - \tfrac yM\bigr)$ op met de substitutie $z = \dfrac1y$, en vergelijk met het bewijs in de leerstof.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $z' + k\,z = \dfrac kM$.
      antwoord: |-
        $z' = -\frac{y'}{y^2} = -\frac ky + \frac kM$
      uitwerking: |-
        $-\tfrac{y'}{y^2} = -\tfrac{k}{y} + \tfrac{k}{M} = -k\,z + \tfrac kM$.
    - opgave: |-
        Los op, en toon aan dat je dezelfde formule vindt.
      antwoord: |-
        $z = \frac1M + D\,\e^{-kt}$, $y = \frac{M}{1 + MD\,\e^{-kt}}$
      uitwerking: |-
        Dat is groei naar een evenwicht (hoofdstuk 2) met $A = \tfrac1M$. Dus $y = \tfrac1z = \tfrac{M}{1 + MD\,\e^{-kt}}$, met $C = MD$.
    - opgave: |-
        Welke aanpak vind je eenvoudiger? Waarom heb je bij de tweede geen splitsing in breuken nodig?
      antwoord: |-
        de substitutie maakt de vergelijking lineair
      uitwerking: |-
        Na de substitutie is het een lineaire vergelijking met constante coëfficiënten, die we al konden oplossen. Het scheiden vraagt de splitsing $\tfrac{1}{y(M - y)} = \tfrac1M\bigl(\tfrac1y + \tfrac{1}{M - y}\bigr)$.

- id: h3-o21
  soort: opdracht
  niveau: 3
  thema: |-
    vrije val met kwadratische luchtweerstand
  opgave: |-
    Een parachutist in vrije val, met een gesloten valscherm, ondervindt een luchtweerstand evenredig met het kwadraat van zijn snelheid: $v' = g - c\,v^2$, met $g = 9{,}8$ en $c = 0{,}0035$ (in SI-eenheden).
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de eindsnelheid $a$.
      antwoord: |-
        $a = \sqrt{g/c} \approx 52{,}9$ m/s
      uitwerking: |-
        $v' = 0$ als $v^2 = \tfrac gc = 2800$: ongeveer 190 km/h.
    - opgave: |-
        Toon aan dat $v = a\,\dfrac{\e^{2bt} - 1}{\e^{2bt} + 1}$ met $b = \sqrt{gc}$ de oplossing is met $v(0) = 0$.
      antwoord: |-
        invullen en vereenvoudigen
      uitwerking: |-
        Met $u = \e^{2bt}$: $v' = a\,\dfrac{4b\,u}{(u + 1)^2}$ en $g - c\,v^2 = g\,\dfrac{(u + 1)^2 - (u - 1)^2}{(u + 1)^2} = \dfrac{4g\,u}{(u + 1)^2}$, want $c\,a^2 = g$. En $a\,b = \sqrt{g/c}\sqrt{gc} = g$. Bovendien is $v(0) = 0$.
    - opgave: |-
        Na hoeveel seconden is de snelheid 50 m/s?
      antwoord: |-
        na ongeveer 9,6 s
      uitwerking: |-
        $\tfrac{u - 1}{u + 1} = \tfrac{50}{a}$ geeft $u = \tfrac{a + 50}{a - 50} \approx 35{,}3$, en $t = \tfrac{\ln u}{2b} \approx 9{,}62$ met $b \approx 0{,}185$.

# --- Koppel -----------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: meetkunde
    onderwerp: |-
      Kegelsneden
  opgave: |-
    Hier is $x$ de veranderlijke en $y$ een functie van $x$. Toon aan dat de integraalkrommen kegelsneden zijn, en zeg welke.
  lijst: enumerate
  delen:
    - opgave: |-
        $y' = -\dfrac{4x}{y}$
      antwoord: |-
        ellipsen $4x^2 + y^2 = C$
      uitwerking: |-
        $\int y\dy = \int -4x\dx$ geeft $\tfrac{y^2}{2} = -2x^2 + c$, dus $4x^2 + y^2 = C$ met $C > 0$.
    - opgave: |-
        $y' = \dfrac{x}{y}$
      antwoord: |-
        hyperbolen $y^2 - x^2 = C$
      uitwerking: |-
        $\tfrac{y^2}{2} = \tfrac{x^2}{2} + c$: gelijkzijdige hyperbolen met de asymptoten $y = \pm x$.
    - opgave: |-
        $y' = \dfrac{1}{2y}$
      antwoord: |-
        parabolen $y^2 = x + C$
      uitwerking: |-
        $\int 2y\dy = \int 1\dx$: parabolen met de $x$-as als as.

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Goniometrische functies
  opgave: |-
    Neem $y' = 1 + y^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de algemene oplossing $y = \tan(t + C)$ is.
      antwoord: |-
        $\bgtan y = t + C$
      uitwerking: |-
        Scheiden: $\int \tfrac{1}{1 + y^2}\dy = \int 1\dt$. Controle: $(\tan u)' = 1 + \tan^2 u$.
    - opgave: |-
        Op welk interval bestaat de oplossing met $y(0) = 1$? Wat gebeurt er aan de randen?
      antwoord: |-
        $\bigl]{-\tfrac{3\pi}{4}}, \tfrac\pi4\bigr[$
      uitwerking: |-
        $\tan C = 1$, dus $C = \tfrac\pi4$. De tangens bestaat tussen twee opeenvolgende verticale asymptoten: $-\tfrac\pi2 < t + \tfrac\pi4 < \tfrac\pi2$. Aan de randen gaat $y$ naar $\pm\infty$.
    - opgave: |-
        Al is het rechterlid overal gedefinieerd, toch bestaat geen enkele oplossing op heel $\R$. Verklaar met de groei van $y'$.
      antwoord: |-
        $y' \geqslant y^2$ groeit zo snel dat $y$ ontploft
      uitwerking: |-
        Zoals bij $y' = y^2$ in hoofdstuk 2: de snelheid groeit kwadratisch met $y$, en dan wordt $y$ oneindig na een eindige tijd.

- id: h3-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: |-
      Statistiek
  opgave: |-
    Neem $y' = -t\,y$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de algemene oplossing.
      antwoord: |-
        $y = C\,\e^{-t^2/2}$
      uitwerking: |-
        Scheiden: $\ln|y| = -\tfrac{t^2}{2} + c$.
    - opgave: |-
        Voor welke $C$ is dat de dichtheidsfunctie van de standaardnormale verdeling?
      antwoord: |-
        $C = \dfrac{1}{\sqrt{2\pi}}$
      uitwerking: |-
        De standaardnormale dichtheid is $\tfrac{1}{\sqrt{2\pi}}\,\e^{-t^2/2}$: de totale oppervlakte moet 1 zijn.
    - opgave: |-
        Bepaal $y''$ met de differentiaalvergelijking, zonder de formule af te leiden, en toon aan dat de buigpunten op $t = \pm 1$ liggen: op één standaardafwijking van het gemiddelde.
      antwoord: |-
        $y'' = (t^2 - 1)\,y$
      uitwerking: |-
        $y'' = (-t\,y)' = -y - t\,y' = -y + t^2\,y = (t^2 - 1)\,y$. Omdat $y > 0$, wisselt $y''$ van teken in $t = \pm1$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  opgave: |-
    Los op: $y' = 3t^2\,y^2$ met $y(0) = 1$.
  antwoord: |-
    $y = \dfrac{1}{1 - t^3}$
  uitwerking: |-
    $\int y^{-2}\dy = \int 3t^2\dt$ geeft $-\tfrac1y = t^3 + C$ met $C = -1$.

- id: h3-t2
  soort: test
  niveau: 1
  opgave: |-
    Bepaal alle oplossingen van $y' = 3t^2\,(y - 2)$.
  antwoord: |-
    $y = 2 + D\,\e^{t^3}$, $D \in \R$
  uitwerking: |-
    Constante oplossing $y = 2$. Scheiden: $\ln|y - 2| = t^3 + C$. Met $D = 0$ zit de constante oplossing erbij.

- id: h3-t3
  soort: test
  niveau: 1
  opgave: |-
    Een populatie groeit volgens $y' = 0{,}5\,y\,\bigl(1 - \tfrac{y}{800}\bigr)$, met $y(0) = 50$. Geef $y(t)$, en bepaal wanneer $y = 400$.
  antwoord: |-
    $y = \dfrac{800}{1 + 15\,\e^{-0{,}5t}}$; $t = 2\ln 15 \approx 5{,}4$
  uitwerking: |-
    $C = \tfrac{750}{50} = 15$. $y = 400$ is het buigpunt: $t = \tfrac{\ln 15}{0{,}5}$.

- id: h3-t4
  soort: test
  niveau: 2
  opgave: |-
    Toon aan dat $y = \tfrac14(t + C)^2$ (voor $t \geqslant -C$) de algemene oplossing is van $y' = \sqrt{y}$, en dat $y = 0$ een singuliere oplossing is.
  antwoord: |-
    $2\sqrt y = t + C$; $y = 0$ zit niet in de familie
  uitwerking: |-
    $\int y^{-1/2}\dy = \int 1\dt$ geeft $2\sqrt y = t + C$, dus $y = \tfrac14(t + C)^2$ met $t + C \geqslant 0$. $y = 0$ voldoet, maar geen enkele $C$ geeft de nulfunctie.

- id: h3-t5
  soort: test
  niveau: 2
  opgave: |-
    Los op: $y' + 2y = 4t$ met $y(0) = 0$.
  antwoord: |-
    $y = 2t - 1 + \e^{-2t}$
  uitwerking: |-
    $\mu = \e^{2t}$: $\e^{2t}y = \int 4t\,\e^{2t}\dt = (2t - 1)\,\e^{2t} + C$ (partieel), en $C = 1$.

- id: h3-t6
  soort: test
  niveau: 2
  opgave: |-
    Bepaal de algemene oplossing van $y' - \dfrac{y}{t} = t^2$ voor $t > 0$.
  antwoord: |-
    $y = \dfrac{t^3}{2} + C\,t$
  uitwerking: |-
    $\mu = \tfrac1t$: $\bigl(\tfrac yt\bigr)' = t$, dus $\tfrac yt = \tfrac{t^2}{2} + C$.

- id: h3-t7
  soort: test
  niveau: 2
  opgave: |-
    Een voorwerp remt af volgens $v' = -4\sqrt{v}$, met $v(0) = 25$ (m/s). Wanneer staat het stil, en welke afstand legt het af?
  antwoord: |-
    na 2,5 s; ongeveer 20,8 m
  uitwerking: |-
    $2\sqrt v = -4t + 10$, dus $v = (5 - 2t)^2$ tot $t = 2{,}5$. Afstand: $\int_0^{2{,}5} (5 - 2t)^2\dt = \Bigl[-\tfrac{(5 - 2t)^3}{6}\Bigr]_0^{2{,}5} = \tfrac{125}{6} \approx 20{,}8$ m.
