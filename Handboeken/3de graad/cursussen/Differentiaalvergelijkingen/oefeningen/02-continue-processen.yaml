# Oefeningen van hoofdstuk 2. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de afgeleide van $5\,\e^{-2t}$
      antwoord: |-
        $-10\,\e^{-2t}$
      uitwerking: |-
        Kettingregel: $5 \cdot (-2)\,\e^{-2t}$.
    - opgave: |-
        de afgeleide van $t\,\e^{t}$
      antwoord: |-
        $(1 + t)\,\e^t$
      uitwerking: |-
        Productregel: $\e^t + t\,\e^t$.
    - opgave: |-
        de afgeleide van $\ln(t^2 + 1)$
      antwoord: |-
        $\frac{2t}{t^2 + 1}$
      uitwerking: |-
        Kettingregel met $(\ln u)' = \tfrac{u'}{u}$.
    - opgave: |-
        alle primitieven van $4t^3 - 2$
      antwoord: |-
        $t^4 - 2t + C$
      uitwerking: |-
        Controle: $(t^4 - 2t)' = 4t^3 - 2$.
    - opgave: |-
        $t$ als $\e^{0{,}5t} = 8$
      antwoord: |-
        $t = 2\ln 8 \approx 4{,}16$
      uitwerking: |-
        $0{,}5\,t = \ln 8$.
    - opgave: |-
        $\e^{-\ln 2}$
      antwoord: |-
        $\tfrac12$
      uitwerking: |-
        $\e^{-\ln 2} = \tfrac{1}{\e^{\ln 2}} = \tfrac12$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Iemand meet om de 5 minuten de temperatuur van een tas thee in een kamer van 20\,°C.

    \smallskip
    {\centering\renewcommand{\arraystretch}{1.3}\begin{tabular}{|c|c|c|c|c|c|}
    \hline
    $t$ (min) & 0 & 5 & 10 & 15 & 20 \\ \hline
    $T$ (°C) & 90 & 70 & 55,7 & 45,5 & 38,2 \\ \hline
    \end{tabular}\par}
  lijst: enumerate
  delen:
    - opgave: |-
        Daalt de temperatuur elke 5 minuten met evenveel graden?
      antwoord: |-
        nee: 20; 14,3; 10,2 en 7,3 graden
      uitwerking: |-
        De dalingen worden kleiner: $20$; $14{,}3$; $10{,}2$; $7{,}3$.
    - opgave: |-
        Bereken telkens het verschil $T - 20$, en het quotiënt van twee opeenvolgende verschillen.
      antwoord: |-
        70; 50; 35,7; 25,5; 18,2; quotiënt ongeveer 0,71
      uitwerking: |-
        $\tfrac{50}{70} \approx \tfrac{35{,}7}{50} \approx \tfrac{25{,}5}{35{,}7} \approx \tfrac{18{,}2}{25{,}5} \approx 0{,}71$.
    - opgave: |-
        Wat voor rij vormen de verschillen? Welk model past bij de temperatuur?
      antwoord: |-
        een meetkundige rij; $T = 20 + 70 \cdot 0{,}71^{t/5}$
      uitwerking: |-
        Het verschil met de kamertemperatuur wordt elke 5 minuten met hetzelfde getal vermenigvuldigd: een exponentiële afname naar 20\,°C.
    - opgave: |-
        Schat wanneer de thee 55\,°C is.
      antwoord: |-
        na ongeveer 10 minuten
      uitwerking: |-
        Op $t = 10$ is $T \approx 55{,}7$: iets meer dan 10 minuten.

- id: h2-controle
  soort: kort
  opgave: |-
    Is de functie een oplossing van de differentiaalvergelijking?
  lijst: enumerate
  delen:
    - opgave: |-
        $y = 2 + \e^{-t}$ \ van \ $y' = 2 - y$
      antwoord: |-
        ja
      uitwerking: |-
        $y' = -\e^{-t}$ en $2 - y = -\e^{-t}$.
    - opgave: |-
        $y = \cos 2t$ \ van \ $y'' + 4y = 0$
      antwoord: |-
        ja
      uitwerking: |-
        $y'' = -4\cos 2t$, dus $y'' + 4y = 0$.
    - opgave: |-
        $y = t^2$ \ van \ $y' = \dfrac{y}{t}$
      antwoord: |-
        nee
      uitwerking: |-
        $y' = 2t$, maar $\tfrac{y}{t} = t$. (Wel van $y' = \tfrac{2y}{t}$.)
    - opgave: |-
        $y = \dfrac{1}{1 + t}$ \ van \ $y' = -y^2$ \ (voor $t > -1$)
      antwoord: |-
        ja
      uitwerking: |-
        $y' = -\dfrac{1}{(1 + t)^2} = -y^2$.

- id: h2-particulier
  soort: kort
  opgave: |-
    Bepaal de oplossing met de gegeven beginvoorwaarde.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $y' = 4t - 1$, \ $y(0) = 2$
      antwoord: |-
        $y = 2t^2 - t + 2$
      uitwerking: |-
        $y = 2t^2 - t + C$ en $C = 2$.
    - opgave: |-
        $y' = \cos t$, \ $y(\pi) = 1$
      antwoord: |-
        $y = \sin t + 1$
      uitwerking: |-
        $y = \sin t + C$ en $0 + C = 1$.
    - opgave: |-
        $y' = \dfrac{1}{t}$, \ $y(1) = 3$ \ ($t > 0$)
      antwoord: |-
        $y = \ln t + 3$
      uitwerking: |-
        $y = \ln t + C$ en $\ln 1 = 0$.

- id: h2-exp
  soort: kort
  opgave: |-
    Exponentiële groei en verval.
  lijst: enumerate
  delen:
    - opgave: |-
        Los op: $y' = -0{,}5\,y$ met $y(0) = 6$. Bereken $y(4)$.
      antwoord: |-
        $y = 6\,\e^{-0{,}5t}$, $y(4) \approx 0{,}81$
      uitwerking: |-
        $y(4) = 6\,\e^{-2} \approx 0{,}812$.
    - opgave: |-
        Een cultuur voldoet aan $y' = ky$ en verdubbelt elke 3 uur. Bepaal $k$.
      antwoord: |-
        $k = \tfrac{\ln 2}{3} \approx 0{,}231$ per uur
      uitwerking: |-
        $\e^{3k} = 2$, dus $3k = \ln 2$.
    - opgave: |-
        Een oplossing van $y' = 1{,}5\,y$ heeft $y(2) = 10$. Bepaal $y(0)$.
      antwoord: |-
        $10\,\e^{-3} \approx 0{,}50$
      uitwerking: |-
        $y = C\,\e^{1{,}5t}$ met $C\,\e^{3} = 10$, dus $y(0) = C = 10\,\e^{-3} \approx 0{,}498$.

- id: h2-verval
  soort: kort
  opgave: |-
    Halveringstijd en absorptie.
  lijst: enumerate
  delen:
    - opgave: |-
        Cesium-137 heeft een halveringstijd van 30 jaar. Welk percentage is er na 100 jaar nog over?
      antwoord: |-
        ongeveer 9,9\,\%
      uitwerking: |-
        $\bigl(\tfrac12\bigr)^{100/30} \approx 0{,}0992$.
    - opgave: |-
        Een stof voldoet aan $N' = -0{,}06\,N$ (met $t$ in uur). Bepaal de halveringstijd.
      antwoord: |-
        ongeveer 11,6 uur
      uitwerking: |-
        $T = \tfrac{\ln 2}{0{,}06} \approx 11{,}55$ uur.
    - opgave: |-
        In een soort glas is $\mu = 0{,}05$ per mm. Hoe dik moet het glas zijn om de helft van het licht tegen te houden?
      antwoord: |-
        ongeveer 13,9 mm
      uitwerking: |-
        $\e^{-0{,}05x} = \tfrac12$ geeft $x = \tfrac{\ln 2}{0{,}05} \approx 13{,}9$ mm.

- id: h2-evenwicht
  soort: kort
  opgave: |-
    Groei naar een evenwicht.
  lijst: enumerate
  delen:
    - opgave: |-
        Los op: $y' = 10 - 0{,}5\,y$ met $y(0) = 4$.
      antwoord: |-
        $y = 20 - 16\,\e^{-0{,}5t}$
      uitwerking: |-
        $y' = -0{,}5\,(y - 20)$, dus $y = 20 + C\,\e^{-0{,}5t}$ met $C = 4 - 20$.
    - opgave: |-
        Los op: $y' = 0{,}2\,y - 3$ met $y(0) = 20$. Is het evenwicht stabiel?
      antwoord: |-
        $y = 15 + 5\,\e^{0{,}2t}$, onstabiel
      uitwerking: |-
        $y' = 0{,}2\,(y - 15)$ met $k = 0{,}2 > 0$: de oplossingen lopen weg van 15.
    - opgave: |-
        Koffie van 85\,°C staat in een kamer van 21\,°C, en is na 10 minuten 60\,°C. Wanneer is ze 40\,°C?
      antwoord: |-
        na ongeveer 24,5 minuten
      uitwerking: |-
        $T = 21 + 64\,\e^{-kt}$ en $\e^{-10k} = \tfrac{39}{64}$. Uit $64\,\e^{-kt} = 19$: $t = 10 \cdot \dfrac{\ln(64/19)}{\ln(64/39)} \approx 24{,}5$.

- id: h2-veld
  soort: kort
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[scale=.8,font=\scriptsize]
        \draw[black!8,very thin] (-1.5,-1.5) grid (2.5,3);
        \draw[->,grijs] (-1.5,0) -- (2.7,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,-1.5) -- (0,3.2) node[above,text=black] {$y$};
        \foreach \t in {-1,1,2}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {-1,1,2,3}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \richtingsveld{-1.5,-1,...,2.5}{-1.5,-1,...,3}{\y-\x}{1.3mm}
      \end{tikzpicture}
  opgave: |-
    De figuur toont het richtingsveld van $y' = y - t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Waar zijn de lijnstukjes horizontaal?
      antwoord: |-
        op de rechte $y = t$
      uitwerking: |-
        $y' = 0$ als $y = t$.
    - opgave: |-
        Schets de integraalkrommen door $(0, 2)$ en door $(0, 0)$.
      antwoord: |-
        door $(0, 2)$ stijgend, door $(0, 0)$ dalend
      uitwerking: |-
        Door $(0, 2)$ is de helling 2, en de kromme stijgt steeds sneller ($y = t + 1 + \e^t$). Door $(0, 0)$ is de helling 0; daarna wordt ze negatief en daalt de kromme steeds sneller ($y = t + 1 - \e^t$).
        \figuren{\begin{tikzpicture}[scale=.7,font=\scriptsize]
          \draw[black!8,very thin] (-1.5,-1.5) grid (2.5,3);
          \draw[->,grijs] (-1.5,0) -- (2.7,0) node[right,text=black] {$t$};
          \draw[->,grijs] (0,-1.5) -- (0,3.2) node[above,text=black] {$y$};
          \richtingsveld{-1.5,-1,...,2.5}{-1.5,-1,...,3}{\y-\x}{1.2mm}
          \draw[accent,thick] plot[domain=-1.5:.42,samples=40,smooth] (\x,{\x+1+exp(\x)});
          \draw[accent,thick] plot[domain=-1.5:1.25,samples=40,smooth] (\x,{\x+1-exp(\x)});
          \draw[accent!60,thick,dashed] (-1.5,-.5) -- (2,3);
        \end{tikzpicture}}
    - opgave: |-
        Toon aan dat een rechte $y = t + q$ een integraalkromme is, en bepaal $q$.
      antwoord: |-
        $q = 1$
      uitwerking: |-
        Voor $y = t + q$ is $y' = 1$ en $y - t = q$. Dat is gelijk als $q = 1$: de rechte $y = t + 1$.

- id: h2-euler
  soort: kort
  opgave: |-
    Neem $y' = y + t$ met $y(0) = 1$. De exacte oplossing is $y = 2\,\e^t - t - 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Benader $y(0{,}2)$ met de methode van Euler met $h = 0{,}1$.
      antwoord: |-
        1,22
      uitwerking: |-
        $y_1 = 1 + 0{,}1 \cdot 1 = 1{,}1$ en $y_2 = 1{,}1 + 0{,}1 \cdot (1{,}1 + 0{,}1) = 1{,}22$.
    - opgave: |-
        Doe hetzelfde met $h = 0{,}2$, en vergelijk beide benaderingen met de exacte waarde.
      antwoord: |-
        1,2; exact 1,2428
      uitwerking: |-
        Eén stap: $1 + 0{,}2 \cdot 1 = 1{,}2$. Exact: $2\,\e^{0{,}2} - 1{,}2 \approx 1{,}2428$. De fout is 0,043 met $h = 0{,}2$ en 0,023 met $h = 0{,}1$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    orde
  opgave: |-
    Geef de orde van de differentiaalvergelijking.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $y' = t\,y^2$
      antwoord: |-
        1
      uitwerking: |-
        Alleen $y'$.
    - opgave: |-
        $y'' + 3y' = \sin t$
      antwoord: |-
        2
      uitwerking: |-
        De hoogste afgeleide is $y''$.
    - opgave: |-
        $(y')^2 = y$
      antwoord: |-
        1
      uitwerking: |-
        Een kwadraat van $y'$ is geen tweede afgeleide.
    - opgave: |-
        $y''' = 0$
      antwoord: |-
        3
      uitwerking: |-
        De derde afgeleide.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    algemene oplossing door te integreren
  opgave: |-
    Bepaal de algemene oplossing.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $y' = t^2 + \dfrac{1}{t^2}$
      antwoord: |-
        $\tfrac13 t^3 - \tfrac1t + C$
      uitwerking: |-
        $\tfrac{1}{t^2} = t^{-2}$ heeft primitieve $-t^{-1}$.
    - opgave: |-
        $y' = \e^{2t}$
      antwoord: |-
        $\tfrac12\,\e^{2t} + C$
      uitwerking: |-
        Controle met de kettingregel.
    - opgave: |-
        $y' = \sin 3t$
      antwoord: |-
        $-\tfrac13\cos 3t + C$
      uitwerking: |-
        $(-\tfrac13\cos 3t)' = \sin 3t$.
    - opgave: |-
        $y' = \dfrac{1}{1 + t^2}$
      antwoord: |-
        $\bgtan t + C$
      uitwerking: |-
        Een basisprimitieve.
    - opgave: |-
        $y' = \dfrac{2t}{t^2 + 4}$
      antwoord: |-
        $\ln(t^2 + 4) + C$
      uitwerking: |-
        De afgeleide van de noemer staat in de teller.
    - opgave: |-
        $y'' = 6t$
      antwoord: |-
        $t^3 + C_1 t + C_2$
      uitwerking: |-
        Twee keer integreren: $y' = 3t^2 + C_1$, dan $y = t^3 + C_1 t + C_2$. Een vergelijking van de tweede orde geeft twee constanten.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    exponentiële groei
  opgave: |-
    Los op, en beantwoord de vraag.
  lijst: enumerate
  delen:
    - opgave: |-
        $y' = 0{,}04\,y$ met $y(0) = 250$. Bereken $y(10)$.
      antwoord: |-
        $y = 250\,\e^{0{,}04t}$, $y(10) \approx 373$
      uitwerking: |-
        $250\,\e^{0{,}4} \approx 372{,}96$.
    - opgave: |-
        $y' = -3y$ met $y(1) = 2$. Bereken $y(0)$.
      antwoord: |-
        $y = 2\,\e^{-3(t - 1)}$, $y(0) = 2\,\e^3 \approx 40{,}2$
      uitwerking: |-
        $C\,\e^{-3} = 2$ geeft $C = 2\,\e^3$.
    - opgave: |-
        $\afg{P}{t} = 0{,}015\,P$ met $P(0) = 11{,}6$ (miljoen inwoners, $t$ in jaar). Wanneer zijn het er 15 miljoen?
      antwoord: |-
        na ongeveer 17,1 jaar
      uitwerking: |-
        $\e^{0{,}015t} = \tfrac{15}{11{,}6}$, dus $t = \tfrac{1}{0{,}015}\ln\tfrac{15}{11{,}6} \approx 17{,}1$.

- id: h2-o4
  soort: opdracht
  niveau: 1
  thema: |-
    een differentiaalvergelijking opstellen
  opgave: |-
    Stel een differentiaalvergelijking op. Noem de evenredigheidsconstante $k > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        In een school van $M$ leerlingen verspreidt een gerucht zich met een snelheid die evenredig is met het aantal $y$ dat het al kent, en met het aantal dat het nog niet kent.
      antwoord: |-
        $y' = k\,y\,(M - y)$
      uitwerking: |-
        Het aantal dat het nog niet kent, is $M - y$. Het product drukt uit dat er pas veel nieuwe toehoorders komen als beide groepen groot zijn.
    - opgave: |-
        Het waterpeil $h$ in een lekkende ton daalt met een snelheid die evenredig is met de vierkantswortel van het peil.
      antwoord: |-
        $h' = -k\sqrt{h}$
      uitwerking: |-
        Een daling: een minteken.
    - opgave: |-
        Een kogel die in hout dringt, vertraagt evenredig met de vierkantswortel van zijn snelheid $v$.
      antwoord: |-
        $v' = -k\sqrt{v}$
      uitwerking: |-
        De versnelling is $v'$, en ze is negatief.
    - opgave: |-
        Op een spaarrekening met een continue rente van 3\,\% per jaar wordt voortdurend geld afgehaald, 1200 euro per jaar.
      antwoord: |-
        $K' = 0{,}03\,K - 1200$
      uitwerking: |-
        De rente brengt $0{,}03\,K$ per jaar op, en er gaat 1200 per jaar af.

- id: h2-o5
  soort: opdracht
  niveau: 1
  thema: |-
    halveringstijd
  opgave: |-
    Polonium-210 heeft een halveringstijd van 138 dagen.
  lijst: enumerate
  delen:
    - opgave: |-
        Welk percentage is er na een jaar (365 dagen) nog over?
      antwoord: |-
        ongeveer 16\,\%
      uitwerking: |-
        $\bigl(\tfrac12\bigr)^{365/138} \approx 0{,}160$.
    - opgave: |-
        Bepaal $\lambda$ in $N' = -\lambda N$.
      antwoord: |-
        $\lambda \approx 0{,}00502$ per dag
      uitwerking: |-
        $\lambda = \tfrac{\ln 2}{138} \approx 0{,}005\,02$.
    - opgave: |-
        Na hoeveel dagen is er nog 1\,\% over?
      antwoord: |-
        na ongeveer 917 dagen
      uitwerking: |-
        $\bigl(\tfrac12\bigr)^{t/138} = 0{,}01$ geeft $t = 138 \cdot \tfrac{\ln 100}{\ln 2} \approx 916{,}9$.

- id: h2-o6
  soort: opdracht
  niveau: 1
  thema: |-
    model aflezen uit een grafiek
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.28cm,y=.12cm,font=\scriptsize]
        \draw[black!14,very thin,xstep=1,ystep=1] (0,0) grid (15,27);
        \draw[black!30,very thin,xstep=5,ystep=5] (0,0) grid (15,25);
        \draw[->,grijs] (0,0) -- (15.8,0) node[right,text=black] {$t$};
        \draw[->,grijs] (0,0) -- (0,28.5) node[above,text=black] {$T$};
        \foreach \t in {5,10,15}{\node[below,inner sep=1.5pt] at (\t,0) {$\t$};}
        \foreach \t in {5,10,15,20,25}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
        \draw[grijs,dashed] (0,25) -- (15,25);
        \draw[accent,thick] plot[domain=0:15,samples=50,smooth] (\x,{25-20*exp(-0.2*\x)});
        \fill[accent] (5,17.64) circle (2.5pt);
      \end{tikzpicture}
  opgave: |-
    Een fles frisdrank komt uit de koelkast in een warme kamer. De grafiek toont de temperatuur $T$ (in °C) na $t$ minuten. Ze voldoet aan $T' = -k\,(T - A)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees de kamertemperatuur $A$ en de begintemperatuur af.
      antwoord: |-
        $A = 25$\,°C, begintemperatuur 5\,°C
      uitwerking: |-
        De horizontale asymptoot is 25, de grafiek begint in 5.
    - opgave: |-
        Geef $T(t)$ met de onbekende $k$.
      antwoord: |-
        $T = 25 - 20\,\e^{-kt}$
      uitwerking: |-
        $C = 5 - 25 = -20$.
    - opgave: |-
        Bepaal $k$ met het aangeduide punt $(5;\ 17{,}6)$.
      antwoord: |-
        $k \approx 0{,}2$
      uitwerking: |-
        $20\,\e^{-5k} = 7{,}4$ geeft $k = \tfrac15\ln\tfrac{20}{7{,}4} \approx 0{,}199$.

- id: h2-o7
  soort: opdracht
  niveau: 1
  thema: |-
    begrippen, klassieke fouten
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        $y = C\,\e^{2t} + 5$ is voor elke $C$ een oplossing van $y' = 2y$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $y' = 2C\,\e^{2t}$, maar $2y = 2C\,\e^{2t} + 10$. Wel van $y' = 2(y - 5)$.
    - opgave: |-
        Alle oplossingen van $y' = 2y$ gaan door de oorsprong.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $y(0) = C$. Alleen $y = 0$ gaat door de oorsprong.
    - opgave: |-
        Hoe meer radioactieve stof er is, hoe langer het duurt voor ze gehalveerd is.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $T = \tfrac{\ln 2}{\lambda}$ hangt niet af van de hoeveelheid.
    - opgave: |-
        Twee verschillende integraalkrommen van $y' = -2\,(y - 5)$ kunnen elkaar snijden.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $5 + C_1\,\e^{-2t} = 5 + C_2\,\e^{-2t}$ geeft $C_1 = C_2$, omdat $\e^{-2t} \neq 0$.
    - opgave: |-
        Bij $y' = -0{,}1\,(y - 20)$ daalt elke oplossing.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: onder 20 is $y' > 0$ en stijgt de oplossing naar 20. De constante oplossing $y = 20$ daalt ook niet.

- id: h2-o8
  soort: opdracht
  niveau: 2
  thema: |-
    parachutist, afgelegde weg
  opgave: |-
    Een parachutist van 90 kg opent zijn scherm bij 55 m/s. Daarna is $90\,v' = 90 \cdot 9{,}8 - 180\,v$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de eindsnelheid en $v(t)$.
      antwoord: |-
        $4{,}9$ m/s; $v = 4{,}9 + 50{,}1\,\e^{-2t}$
      uitwerking: |-
        $v' = 9{,}8 - 2v = -2\,(v - 4{,}9)$, en $C = 55 - 4{,}9 = 50{,}1$.
    - opgave: |-
        Na hoeveel seconden is de snelheid lager dan 5,5 m/s?
      antwoord: |-
        na ongeveer 2,2 s
      uitwerking: |-
        $50{,}1\,\e^{-2t} < 0{,}6$ geeft $t > \tfrac12\ln\tfrac{50{,}1}{0{,}6} \approx 2{,}21$.
    - opgave: |-
        Hoeveel meter zakt hij in de eerste 3 seconden na het openen?
      antwoord: |-
        ongeveer 39,7 m
      uitwerking: |-
        $\ig_0^3 v\dt = \Bigl[4{,}9\,t - 25{,}05\,\e^{-2t}\Bigr]_0^3 = 14{,}7 + 25{,}05\,(1 - \e^{-6}) \approx 39{,}7$ m.

- id: h2-o9
  soort: opdracht
  prent:
    naam: koffie
  niveau: 2
  thema: |-
    afkoelingswet van Newton
  opgave: |-
    Een kop koffie van 85\,°C staat in een kamer van 21\,°C. Na 10 minuten is de koffie 60\,°C.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $k$ in $T' = -k\,(T - 21)$.
      antwoord: |-
        $k \approx 0{,}0495$ per minuut
      uitwerking: |-
        $64\,\e^{-10k} = 39$, dus $k = \tfrac{1}{10}\ln\tfrac{64}{39} \approx 0{,}0495$.
    - opgave: |-
        Hoe warm is de koffie na 20 minuten?
      antwoord: |-
        ongeveer 44,8\,°C
      uitwerking: |-
        $T(20) = 21 + 64\,\bigl(\tfrac{39}{64}\bigr)^2 = 21 + \tfrac{1521}{64} \approx 44{,}8$.
    - opgave: |-
        Iemand zegt dat de koffie 5 minuten vóór de start 100\,°C was. Kan dat volgens het model?
      antwoord: |-
        bijna: het model geeft 103\,°C
      uitwerking: |-
        $T(-5) = 21 + 64\,\bigl(\tfrac{64}{39}\bigr)^{1/2} \approx 103$\,°C. Koffie kookt niet boven 100\,°C: het model geldt pas vanaf het ogenblik dat de koffie is ingeschonken.

- id: h2-o10
  soort: opdracht
  niveau: 2
  thema: |-
    absorptie van licht
  opgave: |-
    Een glasplaat van 2 mm houdt 10\,\% van het licht tegen. Volgens de wet van Lambert is $I(x) = I_0\,\e^{-\mu x}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $\mu$.
      antwoord: |-
        $\mu \approx 0{,}0527$ per mm
      uitwerking: |-
        $\e^{-2\mu} = 0{,}9$, dus $\mu = \tfrac12\ln\tfrac{1}{0{,}9} \approx 0{,}0527$.
    - opgave: |-
        Hoeveel procent houden vijf zulke platen samen tegen?
      antwoord: |-
        ongeveer 41\,\%
      uitwerking: |-
        Er gaat $0{,}9^5 \approx 0{,}590$ door, dus $41\,\%$ wordt tegengehouden. Niet $5 \cdot 10\,\% = 50\,\%$.
    - opgave: |-
        Hoe dik moet het glas zijn om de helft tegen te houden?
      antwoord: |-
        ongeveer 13,2 mm
      uitwerking: |-
        $x = \tfrac{\ln 2}{\mu} = \tfrac{2\ln 2}{\ln(1/0{,}9)} \approx 13{,}16$ mm.

- id: h2-o11
  soort: opdracht
  niveau: 2
  thema: |-
    infuus
  opgave: |-
    Een geneesmiddel komt via een infuus binnen met $r$ mg per uur. Het lichaam breekt per uur 25\,\% af van wat er is. Bij de start is er niets.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel de differentiaalvergelijking op, en geef het evenwicht.
      antwoord: |-
        $y' = r - 0{,}25\,y$, evenwicht $4r$
      uitwerking: |-
        $y' = -0{,}25\,(y - 4r)$.
    - opgave: |-
        De arts wil op lange termijn 120 mg in het bloed. Welke $r$ kiest hij?
      antwoord: |-
        30 mg per uur
      uitwerking: |-
        $4r = 120$.
    - opgave: |-
        Na hoeveel uur is er 100 mg?
      antwoord: |-
        na ongeveer 7,2 uur
      uitwerking: |-
        $y = 120\,(1 - \e^{-0{,}25t}) = 100$ geeft $\e^{-0{,}25t} = \tfrac16$, dus $t = 4\ln 6 \approx 7{,}17$.

- id: h2-o12
  soort: opdracht
  niveau: 2
  thema: |-
    onstabiel evenwicht
  opgave: |-
    Een vispopulatie groeit met een snelheid van 10\,\% per jaar, maar er wordt voortdurend gevist: 90 ton per jaar. Dan is $P' = 0{,}1\,P - 90$ (in ton).
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal het evenwicht. Is het stabiel?
      antwoord: |-
        900 ton, onstabiel
      uitwerking: |-
        $P' = 0{,}1\,(P - 900)$ met $k = 0{,}1 > 0$.
    - opgave: |-
        Los op met $P(0) = 1000$ en met $P(0) = 800$.
      antwoord: |-
        $900 + 100\,\e^{0{,}1t}$ en $900 - 100\,\e^{0{,}1t}$
      uitwerking: |-
        $C = 1000 - 900 = 100$ en $C = 800 - 900 = -100$.
    - opgave: |-
        Wanneer is de populatie in het tweede geval weggevist?
      antwoord: |-
        na ongeveer 22 jaar
      uitwerking: |-
        $100\,\e^{0{,}1t} = 900$ geeft $t = 10\ln 9 \approx 22{,}0$.

- id: h2-o13
  soort: opdracht
  niveau: 2
  thema: |-
    richtingsvelden herkennen
  opgave: |-
    Welk richtingsveld hoort bij welke differentiaalvergelijking? Verklaar.
    \figuren{\begin{tikzpicture}[scale=.55,font=\scriptsize]
      \draw[->,grijs] (-1.7,0) -- (1.9,0) node[right,text=black] {$t$};
      \draw[->,grijs] (0,-1.7) -- (0,1.9) node[above,text=black] {$y$};
      \richtingsveld{-1.5,-1,...,1.5}{-1.5,-1,...,1.5}{\x}{1.1mm}
      \node at (-1.2,1.9) {A};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[scale=.55,font=\scriptsize]
      \draw[->,grijs] (-1.7,0) -- (1.9,0) node[right,text=black] {$t$};
      \draw[->,grijs] (0,-1.7) -- (0,1.9) node[above,text=black] {$y$};
      \richtingsveld{-1.5,-1,...,1.5}{-1.5,-1,...,1.5}{\x*\y}{1.1mm}
      \node at (-1.2,1.9) {B};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[scale=.55,font=\scriptsize]
      \draw[->,grijs] (-1.7,0) -- (1.9,0) node[right,text=black] {$t$};
      \draw[->,grijs] (0,-1.7) -- (0,1.9) node[above,text=black] {$y$};
      \richtingsveld{-1.5,-1,...,1.5}{-1.5,-1,...,1.5}{1-\y}{1.1mm}
      \node at (-1.2,1.9) {C};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[scale=.55,font=\scriptsize]
      \draw[->,grijs] (-1.7,0) -- (1.9,0) node[right,text=black] {$t$};
      \draw[->,grijs] (0,-1.7) -- (0,1.9) node[above,text=black] {$y$};
      \richtingsveld{-1.5,-1,...,1.5}{-1.5,-1,...,1.5}{\y}{1.1mm}
      \node at (-1.2,1.9) {D};
    \end{tikzpicture}}
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $y' = y$
      antwoord: |-
        D
      uitwerking: |-
        Hangt alleen van $y$ af (gelijke stukjes per rij), horizontaal op $y = 0$.
    - opgave: |-
        $y' = t$
      antwoord: |-
        A
      uitwerking: |-
        Hangt alleen van $t$ af: gelijke stukjes per kolom.
    - opgave: |-
        $y' = 1 - y$
      antwoord: |-
        C
      uitwerking: |-
        Gelijke stukjes per rij, horizontaal op $y = 1$.
    - opgave: |-
        $y' = t\,y$
      antwoord: |-
        B
      uitwerking: |-
        Horizontaal op beide assen, en de helling wisselt van teken per kwadrant.

- id: h2-o14
  soort: opdracht
  niveau: 2
  thema: |-
    Euler en recursievergelijkingen
  opgave: |-
    Pas de methode van Euler toe op de afkoelingswet $T' = -0{,}1\,(T - 20)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de methode met $h = 1$ de recursievergelijking $T_n = 0{,}9\,T_{n-1} + 2$ geeft.
      antwoord: |-
        $T_n = T_{n-1} - 0{,}1\,(T_{n-1} - 20)$
      uitwerking: |-
        $T_n = T_{n-1} + 1 \cdot (-0{,}1)(T_{n-1} - 20) = 0{,}9\,T_{n-1} + 2$: het discrete model van hoofdstuk 1.
    - opgave: |-
        Welke recursievergelijking geeft $h = 0{,}5$? Wat is haar evenwicht?
      antwoord: |-
        $T_n = 0{,}95\,T_{n-1} + 1$, evenwicht 20
      uitwerking: |-
        $T_n = T_{n-1} - 0{,}05\,(T_{n-1} - 20)$. Het evenwicht is $\tfrac{1}{0{,}05} = 20$, zoals bij de differentiaalvergelijking.
    - opgave: |-
        Vertrek bij 90\,°C. Vergelijk de benadering van $T(10)$ met $h = 1$ en $h = 0{,}5$ met de exacte waarde.
      antwoord: |-
        44,4; 45,1; exact 45,8
      uitwerking: |-
        $h = 1$: $20 + 70 \cdot 0{,}9^{10} \approx 44{,}41$. $h = 0{,}5$: $20 + 70 \cdot 0{,}95^{20} \approx 45{,}09$. Exact: $20 + 70\,\e^{-1} \approx 45{,}75$.

- id: h2-o15
  soort: opdracht
  niveau: 2
  thema: |-
    Euler in een tabel
  opgave: |-
    Neem $y' = t^2 - y$ met $y(0) = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Benader $y(1)$ met de methode van Euler met $h = 0{,}25$. Maak een tabel.
      antwoord: |-
        0,5127
      uitwerking: |-
        $y_1 = 1 + 0{,}25 \cdot (0 - 1) = 0{,}75$; $y_2 = 0{,}75 + 0{,}25\,(0{,}0625 - 0{,}75) = 0{,}578\,125$; $y_3 = 0{,}496\,094$; $y_4 = 0{,}512\,695$.
    - opgave: |-
        Controleer dat $y = t^2 - 2t + 2 - \e^{-t}$ de exacte oplossing is, en bereken de fout.
      antwoord: |-
        $y(1) \approx 0{,}6321$, fout 0,12
      uitwerking: |-
        $y' = 2t - 2 + \e^{-t}$ en $t^2 - y = 2t - 2 + \e^{-t}$; $y(0) = 2 - 1 = 1$. $y(1) = 1 - \e^{-1} \approx 0{,}632$, dus de fout is ongeveer 0,119.
    - opgave: |-
        Zonder te rekenen: wordt de benadering beter of slechter met $h = 0{,}1$?
      antwoord: |-
        beter
      uitwerking: |-
        Een kleinere stap volgt de kromme beter: de fout is ongeveer evenredig met $h$, dus ongeveer 0,05.

- id: h2-o16
  soort: opdracht
  niveau: 2
  thema: |-
    opwarmen in een oven
  opgave: |-
    Een taart van 20\,°C gaat in een oven van 200\,°C. Na een uur is ze binnenin 120\,°C. Ze is gaar als ze binnenin 160\,°C is. Neem aan dat de wet van Newton geldt.
  antwoord: |-
    na ongeveer 1 uur en 51 minuten
  uitwerking: |-
    $T = 200 - 180\,\e^{-kt}$ met $180\,\e^{-k} = 80$, dus $\e^{-k} = \tfrac49$. Uit $180\,\e^{-kt} = 40$: $\bigl(\tfrac49\bigr)^t = \tfrac29$, dus $t = \dfrac{\ln(9/2)}{\ln(9/4)} \approx 1{,}855$ uur.

- id: h2-o17
  soort: opdracht
  niveau: 2
  thema: |-
    richtingsveld en evenwichten
  opgave: |-
    Neem $y' = y\,(y - 3)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de constante oplossingen.
      antwoord: |-
        $y = 0$ en $y = 3$
      uitwerking: |-
        $y' = 0$ als $y = 0$ of $y = 3$.
    - opgave: |-
        Waar is $y' > 0$, en waar $y' < 0$? Welke evenwichten zijn stabiel?
      antwoord: |-
        $y' > 0$ voor $y < 0$ of $y > 3$; $y = 0$ stabiel, $y = 3$ onstabiel
      uitwerking: |-
        Tussen 0 en 3 dalen de krommen naar 0, boven 3 stijgen ze weg van 3, onder 0 stijgen ze naar 0.
    - opgave: |-
        Schets het richtingsveld en de integraalkrommen door $(0, 1)$, $(0, 2{,}9)$ en $(0, -1)$.
      antwoord: |-
        twee krommen naar 0, de derde daalt ook naar 0
      uitwerking: |-
        Door $(0, 1)$ en $(0, 2{,}9)$: dalend naar 0 (de tweede eerst traag, vlak bij 3). Door $(0, -1)$: stijgend naar 0.
        \figuren{\begin{tikzpicture}[x=.6cm,y=.6cm,font=\scriptsize]
          \draw[->,grijs] (0,0) -- (4.4,0) node[right,text=black] {$t$};
          \draw[->,grijs] (0,-1.6) -- (0,4.2) node[above,text=black] {$y$};
          \foreach \t in {-1,1,2,3}{\node[left,inner sep=1.5pt] at (0,\t) {$\t$};}
          \richtingsveld{.4,.9,...,4.2}{-1.5,-1,...,4}{\y*(\y-3)}{1.1mm}
          \draw[grijs,dashed] (0,3) -- (4.2,3);
          \draw[accent,thick] plot[domain=0:4.2,samples=50,smooth] (\x,{3*exp(-3*\x)/(exp(-3*\x)+2)});
          \draw[accent,thick] plot[domain=0:4.2,samples=80,smooth] (\x,{3*exp(-3*\x)/(exp(-3*\x)+1/29)});
          \draw[accent,thick] plot[domain=0:4.2,samples=50,smooth] (\x,{3*exp(-3*\x)/(exp(-3*\x)-4)});
        \end{tikzpicture}}

- id: h2-o18
  soort: opdracht
  niveau: 3
  thema: |-
    discreet en continu
  opgave: |-
    Neem een oplossing $y = C\,\e^{kt}$ van $y' = ky$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $y(0)$, $y(1)$, $y(2)$, \ldots\ een meetkundige rij vormen. Wat is het quotiënt?
      antwoord: |-
        quotiënt $\e^k$
      uitwerking: |-
        $\dfrac{y(n)}{y(n - 1)} = \dfrac{C\,\e^{kn}}{C\,\e^{k(n-1)}} = \e^k$.
    - opgave: |-
        Een bank geeft 6\,\% rente per jaar, maar schrijft ze voortdurend bij: $K' = 0{,}06\,K$. Met welk percentage groeit het kapitaal per jaar?
      antwoord: |-
        ongeveer 6,18\,\%
      uitwerking: |-
        $\e^{0{,}06} \approx 1{,}0618$.
    - opgave: |-
        In hoofdstuk 1 daalde het verschil met de kamertemperatuur elke minuut met 10\,\%. Welke $k$ in $T' = k\,(T - 20)$ geeft dezelfde temperaturen op de hele minuten? Waarom is dat niet $-0{,}1$?
      antwoord: |-
        $k = \ln 0{,}9 \approx -0{,}105$
      uitwerking: |-
        Er moet gelden $\e^k = 0{,}9$. Met $k = -0{,}1$ daalt het verschil per minuut met $1 - \e^{-0{,}1} \approx 9{,}5\,\%$: wie voortdurend afkoelt, koelt over een minuut iets minder af dan 10\,\%, omdat het verschil onderweg al kleiner wordt.

- id: h2-o19
  soort: opdracht
  niveau: 3
  thema: |-
    Euler onderschat bij een holle grafiek
  opgave: |-
    Neem $y' = -y$ met $y(0) = 1$, met de exacte oplossing $\e^{-t}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de methode van Euler met stap $h$ geeft: $y_n = (1 - h)^n$.
      antwoord: |-
        $y_n = y_{n-1} - h\,y_{n-1}$
      uitwerking: |-
        $y_n = (1 - h)\,y_{n-1}$: een meetkundige rij met $y_0 = 1$.
    - opgave: |-
        Benader $y(1)$ met $h = 0{,}5$ en $h = 0{,}25$, en vergelijk met $\e^{-1}$.
      antwoord: |-
        0,25 en 0,316; $\e^{-1} \approx 0{,}368$
      uitwerking: |-
        $0{,}5^2 = 0{,}25$ en $0{,}75^4 \approx 0{,}316$.
    - opgave: |-
        Verklaar met de ongelijkheid $\e^{-h} > 1 - h$ (voor $h > 0$) waarom elke benadering te klein is.
      antwoord: |-
        $(1 - h)^n < (\e^{-h})^n = \e^{-nh}$
      uitwerking: |-
        De rechte $y = 1 - t$ is de raaklijn aan de holle grafiek van $\e^{-t}$ in $(0, 1)$, en die grafiek ligt boven haar raaklijnen: $\e^{-h} > 1 - h$. Voor $0 < h < 1$ volgt $(1 - h)^n < \e^{-nh}$: de benadering in $t = nh$ is te klein. Elke stap volgt de raaklijn en komt dus onder de kromme uit.

- id: h2-o20
  soort: opdracht
  niveau: 3
  thema: |-
    wet van Lambert, lagen stapelen
  opgave: |-
    Neem $I(x) = I_0\,\e^{-\mu x}$, de intensiteit na een laag van dikte $x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $\dfrac{I(x_1 + x_2)}{I_0} = \dfrac{I(x_1)}{I_0} \cdot \dfrac{I(x_2)}{I_0}$. Wat betekent dat voor twee lagen na elkaar?
      antwoord: |-
        de doorgelaten fracties vermenigvuldigen
      uitwerking: |-
        $\e^{-\mu(x_1 + x_2)} = \e^{-\mu x_1}\,\e^{-\mu x_2}$. De tweede laag laat dezelfde fractie door, ongeacht hoeveel licht erop valt.
    - opgave: |-
        Een laag laat 80\,\% door. Hoeveel lagen zijn nodig om minder dan 1\,\% door te laten?
      antwoord: |-
        21 lagen
      uitwerking: |-
        $0{,}8^{\,n} < 0{,}01$ geeft $n > \tfrac{\ln 0{,}01}{\ln 0{,}8} \approx 20{,}6$.
    - opgave: |-
        Toon omgekeerd aan: als een functie $f$ met $f(0) = 1$ voldoet aan $f(x_1 + x_2) = f(x_1)\,f(x_2)$ en afleidbaar is, dan is $f' = f'(0) \cdot f$, en dus $f(x) = \e^{f'(0)\,x}$.
      antwoord: |-
        leid af naar $x_2$ in $x_2 = 0$
      uitwerking: |-
        $f(x + h) = f(x)\,f(h)$, dus $\dfrac{f(x + h) - f(x)}{h} = f(x)\,\dfrac{f(h) - f(0)}{h} \to f(x)\,f'(0)$. Dus $f' = f'(0)\,f$, en met $f(0) = 1$ volgt $f(x) = \e^{f'(0)\,x}$.

- id: h2-o21
  soort: opdracht
  niveau: 3
  thema: |-
    een oplossing die ontploft
  opgave: |-
    Neem $y' = y^2$ met $y(0) = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $y = \dfrac{1}{1 - t}$ een oplossing is op $]{-\infty}, 1[$.
      antwoord: |-
        $y' = \frac{1}{(1 - t)^2} = y^2$
      uitwerking: |-
        $y = (1 - t)^{-1}$, dus $y' = (1 - t)^{-2}$, en $y(0) = 1$.
    - opgave: |-
        Wat gebeurt er als $t$ naar 1 gaat? Vergelijk met de oplossing van $y' = y$ met $y(0) = 1$.
      antwoord: |-
        $y \to +\infty$ al voor $t = 1$; $\e^t$ blijft eindig
      uitwerking: |-
        $\liml{t}{1} \dfrac{1}{1 - t} = +\infty$. Bij $y' = y$ groeit $\e^t$ ook onbegrensd, maar pas als $t \to +\infty$. Bij $y' = y^2$ groeit de snelheid zo hard mee dat de oplossing in een eindige tijd ontploft.
    - opgave: |-
        Wat zegt dat over een model waarin een populatie groeit met een snelheid evenredig met het kwadraat van haar grootte?
      antwoord: |-
        het kan maar kort geldig zijn
      uitwerking: |-
        Het model voorspelt een oneindige populatie op een eindig tijdstip: het is alleen bruikbaar over een korte tijd, of er moet een rem in.

# --- Koppel -----------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Exponentiële functies
  opgave: |-
    Benader $y(1)$ voor $y' = y$ met $y(0) = 1$, met de methode van Euler met $n$ stappen van $h = \tfrac1n$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de benadering $\bigl(1 + \tfrac1n\bigr)^n$ is.
      antwoord: |-
        $y_k = (1 + h)\,y_{k-1}$
      uitwerking: |-
        Elke stap vermenigvuldigt met $1 + h$, en er zijn $n$ stappen.
    - opgave: |-
        Bereken de benadering voor $n = 2$, $4$, $10$ en $100$.
      antwoord: |-
        2,25; 2,441; 2,594; 2,705
      uitwerking: |-
        $1{,}5^2 = 2{,}25$; $1{,}25^4 \approx 2{,}441$; $1{,}1^{10} \approx 2{,}594$; $1{,}01^{100} \approx 2{,}705$.
    - opgave: |-
        Naar welk getal gaat de rij $\bigl(1 + \tfrac1n\bigr)^n$? Waarom past dat bij de methode van Euler?
      antwoord: |-
        naar $\e$
      uitwerking: |-
        De exacte waarde is $y(1) = \e^1$. Een steeds kleinere stap geeft een steeds betere benadering, en de limiet van de rij is het getal van Euler, $\e \approx 2{,}718$: zo werd het in de cursus Exponentiële en logaritmische functies gedefinieerd, met intrest die steeds vaker wordt bijgeteld.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Integralen
  opgave: |-
    Neem een differentiaalvergelijking waarin het rechterlid alleen van $t$ afhangt: $y' = f(t)$, met $y(a) = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de methode van Euler met $n$ stappen van $h$ geeft: $y_n = h\,\bigl(f(t_0) + f(t_1) + \cdots + f(t_{n-1})\bigr)$. Welke som is dat?
      antwoord: |-
        een linkse Riemannsom
      uitwerking: |-
        Elke stap telt $h\,f(t_k)$ op. De som van de rechthoeken met hoogte $f$ in het linkerpunt is een Riemannsom van $\int_a^{a + nh} f(t)\dt$.
    - opgave: |-
        Benader zo $y(1)$ voor $y' = t^2$ met $y(0) = 0$ en $h = 0{,}25$, en vergelijk met de exacte oplossing.
      antwoord: |-
        0,21875; exact $\tfrac13$
      uitwerking: |-
        $0{,}25\,(0 + 0{,}0625 + 0{,}25 + 0{,}5625) = 0{,}218\,75$, en $y = \tfrac{t^3}{3}$ geeft $y(1) = \tfrac13$.

- id: h2-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: |-
      Kansrekenen
  opgave: |-
    Een radioactieve kern met halveringstijd $T$ vervalt op een toevallig ogenblik. De kans dat ze na een tijd $t$ nog niet vervallen is, is $\bigl(\tfrac12\bigr)^{t/T}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Wat is de kans dat ze vervalt tussen $T$ en $2T$?
      antwoord: |-
        $\tfrac14$
      uitwerking: |-
        $P(\text{nog niet na } T) - P(\text{nog niet na } 2T) = \tfrac12 - \tfrac14$.
    - opgave: |-
        We volgen 3 kernen, die onafhankelijk vervallen. Wat is de kans dat er na een tijd $T$ precies één over is?
      antwoord: |-
        $\tfrac38$
      uitwerking: |-
        Binomiaal met $n = 3$ en $p = \tfrac12$: $\binom31 \bigl(\tfrac12\bigr)^3 = \tfrac38$.
    - opgave: |-
        Waarom is het verval van een grote hoeveelheid kernen wel voorspelbaar, al is dat van één kern toeval?
      antwoord: |-
        het verwachte aantal is $N_0 \bigl(\tfrac12\bigr)^{t/T}$, met een kleine relatieve spreiding
      uitwerking: |-
        Het aantal kernen dat over is, is binomiaal met verwachting $N_0\,p$ en standaardafwijking $\sqrt{N_0\,p\,(1 - p)}$. Ten opzichte van de verwachting is die spreiding verwaarloosbaar als $N_0$ heel groot is, zoals bij $10^{20}$ kernen.

# --- Test jezelf ------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  opgave: |-
    Is $y = 3\,\e^{2t} - 1$ een oplossing van $y' = 2y + 2$?
  antwoord: |-
    ja
  uitwerking: |-
    $y' = 6\,\e^{2t}$ en $2y + 2 = 6\,\e^{2t} - 2 + 2 = 6\,\e^{2t}$.

- id: h2-t2
  soort: test
  niveau: 1
  opgave: |-
    Bepaal de oplossing van $y' = 6t^2 + 2$ met $y(1) = 0$.
  antwoord: |-
    $y = 2t^3 + 2t - 4$
  uitwerking: |-
    $y = 2t^3 + 2t + C$ en $2 + 2 + C = 0$.

- id: h2-t3
  soort: test
  niveau: 1
  opgave: |-
    Van een radioactieve stof vervalt 20\,\% in 3 dagen. Bepaal de halveringstijd.
  antwoord: |-
    ongeveer 9,3 dagen
  uitwerking: |-
    $\e^{-3\lambda} = 0{,}8$, dus $\lambda = \tfrac13\ln 1{,}25 \approx 0{,}0744$ en $T = \tfrac{\ln 2}{\lambda} \approx 9{,}32$ dagen.

- id: h2-t4
  soort: test
  niveau: 2
  opgave: |-
    Soep van 80\,°C staat in een kamer van 20\,°C, en is na 10 minuten 50\,°C. Wanneer is ze 30\,°C?
  antwoord: |-
    na ongeveer 25,8 minuten
  uitwerking: |-
    Het verschil met 20 halveert in 10 minuten (van 60 naar 30). Van 60 naar 10: $\bigl(\tfrac12\bigr)^{t/10} = \tfrac16$, dus $t = 10\,\log_2 6 \approx 25{,}8$.

- id: h2-t5
  soort: test
  niveau: 2
  opgave: |-
    Voor een parachutist van 75 kg is $75\,v' = 75 \cdot 9{,}8 - 150\,v$. Hij opent zijn scherm bij 40 m/s. Bepaal de eindsnelheid en $v(t)$.
  antwoord: |-
    $4{,}9$ m/s; $v = 4{,}9 + 35{,}1\,\e^{-2t}$
  uitwerking: |-
    $v' = 9{,}8 - 2v = -2\,(v - 4{,}9)$ en $C = 40 - 4{,}9$.

- id: h2-t6
  soort: test
  niveau: 2
  opgave: |-
    Schets het richtingsveld van $y' = y - 1$, en de integraalkromme door $(0, 0)$. Is het evenwicht stabiel?
  antwoord: |-
    evenwicht $y = 1$, onstabiel; de kromme door $(0, 0)$ daalt steeds sneller
  uitwerking: |-
    De stukjes zijn horizontaal op $y = 1$, stijgend erboven en dalend eronder. De kromme door $(0, 0)$ is $y = 1 - \e^t$.

- id: h2-t7
  soort: test
  niveau: 2
  opgave: |-
    Benader $y(1)$ voor $y' = 2t - y$ met $y(0) = 0$, met de methode van Euler met $h = 0{,}5$. De exacte waarde is $2\,\e^{-1}$. Hoe groot is de fout?
  antwoord: |-
    0,5; fout ongeveer 0,24
  uitwerking: |-
    $y_1 = 0 + 0{,}5 \cdot 0 = 0$ en $y_2 = 0 + 0{,}5 \cdot (1 - 0) = 0{,}5$. $2\,\e^{-1} \approx 0{,}736$.
