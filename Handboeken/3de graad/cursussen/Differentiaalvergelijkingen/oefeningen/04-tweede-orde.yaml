# Oefeningen van hoofdstuk 4. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h4-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        de wortels van $r^2 + 2r - 8 = 0$
      antwoord: |-
        $2$ en $-4$
      uitwerking: |-
        $(r - 2)(r + 4) = 0$.
    - opgave: |-
        de complexe wortels van $r^2 + 6r + 13 = 0$
      antwoord: |-
        $-3 \pm 2i$
      uitwerking: |-
        $D = 36 - 52 = -16 = (4i)^2$, dus $r = \tfrac{-6 \pm 4i}{2}$.
    - opgave: |-
        de tweede afgeleide van $\cos 3t$
      antwoord: |-
        $-9\cos 3t$
      uitwerking: |-
        $(\cos 3t)' = -3\sin 3t$, en nog eens afleiden.
    - opgave: |-
        de afgeleide van $t\,\e^{2t}$
      antwoord: |-
        $(1 + 2t)\,\e^{2t}$
      uitwerking: |-
        Productregel.
    - opgave: |-
        de afgeleide van $\e^{-t}\sin t$
      antwoord: |-
        $\e^{-t}(\cos t - \sin t)$
      uitwerking: |-
        Productregel: $-\e^{-t}\sin t + \e^{-t}\cos t$.
    - opgave: |-
        $C_1$ en $C_2$ als $C_1 + C_2 = 1$ en $2C_1 - C_2 = 5$
      antwoord: |-
        $C_1 = 2$, $C_2 = -1$
      uitwerking: |-
        Optellen: $3C_1 = 6$.

- id: h4-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad Neem $y'' - 5y' + 6y = 0$, en probeer functies $y = \e^{rt}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Vul $y = \e^{rt}$ in. Voor welke $r$ is het een oplossing?
      antwoord: |-
        $r = 2$ en $r = 3$
      uitwerking: |-
        $(r^2 - 5r + 6)\,\e^{rt} = 0$, en $\e^{rt} \neq 0$: $r^2 - 5r + 6 = 0$.
    - opgave: |-
        Is $\e^{2t} + \e^{3t}$ ook een oplossing? En $4\,\e^{2t} - 7\,\e^{3t}$?
      antwoord: |-
        ja, allebei
      uitwerking: |-
        Invullen: de termen in $\e^{2t}$ en in $\e^{3t}$ geven elk afzonderlijk 0.
    - opgave: |-
        Zoek een oplossing met $y(0) = 0$ en $y'(0) = 1$.
      antwoord: |-
        $y = \e^{3t} - \e^{2t}$
      uitwerking: |-
        $C_1 + C_2 = 0$ en $2C_1 + 3C_2 = 1$ geeft $C_2 = 1$ en $C_1 = -1$.

- id: h4-trilling
  soort: kort
  opgave: |-
    Harmonische trillingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Los op: $y'' = -16y$ met $y(0) = 2$ en $y'(0) = 0$. Wat is de periode?
      antwoord: |-
        $y = 2\cos 4t$, periode $\tfrac\pi2$
      uitwerking: |-
        $\omega = 4$, $C_1 = 2$, $C_2 = 0$; $T = \tfrac{2\pi}{4}$.
    - opgave: |-
        Los op: $x'' + 9x = 0$ met $x(0) = 0$ en $x'(0) = 6$.
      antwoord: |-
        $x = 2\sin 3t$
      uitwerking: |-
        $\omega = 3$: $C_1 = 0$ en $C_2 = \tfrac63 = 2$.
    - opgave: |-
        Een blokje van 0,2 kg hangt aan een veer met $k = 80$ N/m. Wat is de periode van de trilling?
      antwoord: |-
        ongeveer 0,31 s
      uitwerking: |-
        $\omega = \sqrt{80/0{,}2} = 20$, dus $T = \tfrac{2\pi}{20} \approx 0{,}314$ s.

- id: h4-karakteristiek
  soort: kort
  opgave: |-
    Voor welke $r$ is $\e^{rt}$ een oplossing?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $y'' - 4y' + 3y = 0$
      antwoord: |-
        $r = 1$ of $r = 3$
      uitwerking: |-
        $r^2 - 4r + 3 = (r - 1)(r - 3)$.
    - opgave: |-
        $y'' + y' = 0$
      antwoord: |-
        $r = 0$ of $r = -1$
      uitwerking: |-
        $r(r + 1) = 0$; $\e^{0t} = 1$ is een constante oplossing.
    - opgave: |-
        $y'' + 4y = 0$
      antwoord: |-
        geen reële $r$
      uitwerking: |-
        $r^2 = -4$: de wortels zijn $\pm 2i$.

- id: h4-reeel
  soort: kort
  opgave: |-
    Los op.
  lijst: enumerate
  delen:
    - opgave: |-
        $y'' - 4y = 0$, \ $y(0) = 2$, \ $y'(0) = 0$
      antwoord: |-
        $y = \e^{2t} + \e^{-2t}$
      uitwerking: |-
        $C_1 + C_2 = 2$ en $2C_1 - 2C_2 = 0$.
    - opgave: |-
        $y'' + 3y' + 2y = 0$, \ $y(0) = 0$, \ $y'(0) = 1$
      antwoord: |-
        $y = \e^{-t} - \e^{-2t}$
      uitwerking: |-
        $(r + 1)(r + 2) = 0$; $C_1 + C_2 = 0$ en $-C_1 - 2C_2 = 1$.

- id: h4-dubbel
  soort: kort
  opgave: |-
    Los op: $y'' - 2y' + y = 0$ met $y(0) = 1$ en $y'(0) = 3$.
  antwoord: |-
    $y = (1 + 2t)\,\e^{t}$
  uitwerking: |-
    $(r - 1)^2 = 0$: $y = (C_1 + C_2 t)\,\e^t$ en $y' = (C_1 + C_2 + C_2 t)\,\e^t$. $C_1 = 1$ en $C_1 + C_2 = 3$.

- id: h4-complex
  soort: kort
  opgave: |-
    Los op: $y'' + 4y' + 8y = 0$ met $y(0) = 1$ en $y'(0) = 0$.
  antwoord: |-
    $y = \e^{-2t}(\cos 2t + \sin 2t)$
  uitwerking: |-
    $r = -2 \pm 2i$. $C_1 = 1$, en $y'(0) = -2C_1 + 2C_2 = 0$ geeft $C_2 = 1$.

- id: h4-homogeen
  soort: kort
  opgave: |-
    Bepaal de algemene oplossing.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y'' + y' - 12y = 0$
      antwoord: |-
        $C_1\,\e^{3t} + C_2\,\e^{-4t}$
      uitwerking: |-
        $(r - 3)(r + 4) = 0$.
    - opgave: |-
        $y'' - 10y' + 25y = 0$
      antwoord: |-
        $(C_1 + C_2\,t)\,\e^{5t}$
      uitwerking: |-
        $(r - 5)^2 = 0$.
    - opgave: |-
        $y'' + 6y' + 25y = 0$
      antwoord: |-
        $\e^{-3t}(C_1\cos 4t + C_2\sin 4t)$
      uitwerking: |-
        $r = \tfrac{-6 \pm \sqrt{-64}}{2} = -3 \pm 4i$.
    - opgave: |-
        $y'' + 16y = 0$
      antwoord: |-
        $C_1\cos 4t + C_2\sin 4t$
      uitwerking: |-
        $r = \pm 4i$: $\alpha = 0$ en $\beta = 4$.

- id: h4-demping
  soort: kort
  opgave: |-
    Een massa van 2 kg hangt aan een veer met $k = 50$ N/m, met een demper.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de kritische demping. Is de trilling onderkritisch, kritisch of overkritisch bij $c = 12$, $c = 20$ en $c = 30$?
      antwoord: |-
        $c_k = 20$: onder-, kritisch, overkritisch
      uitwerking: |-
        $c_k = 2\sqrt{50 \cdot 2} = 20$ Ns/m.
    - opgave: |-
        Neem $c = 12$. Wat is de periode van de uitdovende trilling?
      antwoord: |-
        $\tfrac\pi2 \approx 1{,}57$ s
      uitwerking: |-
        $x'' + 6x' + 25x = 0$: $r = -3 \pm 4i$, dus $\beta = 4$ en $T = \tfrac{2\pi}{4}$.

- id: h4-nh
  soort: kort
  opgave: |-
    Niet-homogene vergelijkingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal de algemene oplossing van $y'' + 9y = 18$.
      antwoord: |-
        $y = 2 + C_1\cos 3t + C_2\sin 3t$
      uitwerking: |-
        $y_p = A$: $9A = 18$.
    - opgave: |-
        Bepaal de algemene oplossing van $y'' - y' - 2y = 4\,\e^{3t}$.
      antwoord: |-
        $y = \e^{3t} + C_1\,\e^{2t} + C_2\,\e^{-t}$
      uitwerking: |-
        $y_p = A\,\e^{3t}$: $(9 - 3 - 2)A = 4$. Homogeen: $(r - 2)(r + 1) = 0$.
    - opgave: |-
        Bepaal de algemene oplossing van $y'' + 4y' + 4y = 8t$.
      antwoord: |-
        $y = 2t - 2 + (C_1 + C_2\,t)\,\e^{-2t}$
      uitwerking: |-
        $y_p = At + B$: $4A + 4At + 4B = 8t$, dus $A = 2$ en $B = -2$.
    - opgave: |-
        Los op: $y'' + y = 2$ met $y(0) = 0$ en $y'(0) = 0$.
      antwoord: |-
        $y = 2 - 2\cos t$
      uitwerking: |-
        $y = 2 + C_1\cos t + C_2\sin t$; $C_1 = -2$ en $C_2 = 0$.

# --- Opdrachten -------------------------------------------------------------------------

- id: h4-o1
  soort: opdracht
  niveau: 1
  thema: |-
    homogene vergelijkingen, drie gevallen
  opgave: |-
    Bepaal de algemene oplossing.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y'' - 5y' + 6y = 0$
      antwoord: |-
        $C_1\,\e^{2t} + C_2\,\e^{3t}$
      uitwerking: |-
        $(r - 2)(r - 3) = 0$.
    - opgave: |-
        $y'' + 6y' + 9y = 0$
      antwoord: |-
        $(C_1 + C_2\,t)\,\e^{-3t}$
      uitwerking: |-
        $(r + 3)^2 = 0$.
    - opgave: |-
        $y'' + 9y = 0$
      antwoord: |-
        $C_1\cos 3t + C_2\sin 3t$
      uitwerking: |-
        $r = \pm 3i$.
    - opgave: |-
        $y'' - 4y = 0$
      antwoord: |-
        $C_1\,\e^{2t} + C_2\,\e^{-2t}$
      uitwerking: |-
        $r = \pm 2$.
    - opgave: |-
        $y'' + 2y' + 10y = 0$
      antwoord: |-
        $\e^{-t}(C_1\cos 3t + C_2\sin 3t)$
      uitwerking: |-
        $r = -1 \pm 3i$.
    - opgave: |-
        $y'' - 3y' = 0$
      antwoord: |-
        $C_1 + C_2\,\e^{3t}$
      uitwerking: |-
        $r(r - 3) = 0$: $\e^{0t} = 1$.
    - opgave: |-
        $4y'' - 4y' + y = 0$
      antwoord: |-
        $(C_1 + C_2\,t)\,\e^{t/2}$
      uitwerking: |-
        $(2r - 1)^2 = 0$: deel eerst door 4, de wortel is $\tfrac12$.
    - opgave: |-
        $y'' + 4y' + 13y = 0$
      antwoord: |-
        $\e^{-2t}(C_1\cos 3t + C_2\sin 3t)$
      uitwerking: |-
        $r = -2 \pm 3i$.

- id: h4-o2
  soort: opdracht
  niveau: 1
  thema: |-
    beginwaardeproblemen
  opgave: |-
    Los op.
  lijst: enumerate
  delen:
    - opgave: |-
        $y'' + y' - 2y = 0$, \ $y(0) = 3$, \ $y'(0) = 0$
      antwoord: |-
        $y = 2\,\e^{t} + \e^{-2t}$
      uitwerking: |-
        $C_1 + C_2 = 3$ en $C_1 - 2C_2 = 0$.
    - opgave: |-
        $y'' + 4y = 0$, \ $y(0) = 1$, \ $y'(0) = 6$
      antwoord: |-
        $y = \cos 2t + 3\sin 2t$
      uitwerking: |-
        $C_1 = 1$ en $2C_2 = 6$.
    - opgave: |-
        $y'' - 2y' + y = 0$, \ $y(0) = 2$, \ $y'(0) = 1$
      antwoord: |-
        $y = (2 - t)\,\e^{t}$
      uitwerking: |-
        $y = (C_1 + C_2 t)\,\e^t$, $y' = (C_1 + C_2 + C_2 t)\,\e^t$: $C_1 = 2$ en $C_1 + C_2 = 1$.

- id: h4-o3
  soort: opdracht
  niveau: 1
  thema: |-
    massa aan een veer
  opgave: |-
    Een blokje van 0,2 kg hangt aan een veer met $k = 20$ N/m. Het wordt 5 cm naar beneden getrokken en losgelaten.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef $x(t)$ (in m).
      antwoord: |-
        $x = 0{,}05\cos 10t$
      uitwerking: |-
        $\omega = \sqrt{20/0{,}2} = 10$, $x(0) = 0{,}05$ en $x'(0) = 0$.
    - opgave: |-
        Wat zijn de periode en de frequentie (het aantal trillingen per seconde)?
      antwoord: |-
        0,63 s en 1,59 Hz
      uitwerking: |-
        $T = \tfrac{2\pi}{10} \approx 0{,}628$ s, $f = \tfrac1T \approx 1{,}59$.
    - opgave: |-
        Wat is de grootste snelheid, en waar bereikt het blokje ze?
      antwoord: |-
        0,5 m/s, in de rustpositie
      uitwerking: |-
        $x' = -0{,}5\sin 10t$: grootst als $|\sin 10t| = 1$, dus als $\cos 10t = 0$ en $x = 0$.

- id: h4-o4
  soort: opdracht
  niveau: 1
  thema: |-
    begrippen, klassieke fouten
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        De oplossingen van $y'' = -4y$ zijn periodiek met periode $\pi$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $\omega = 2$ en $T = \tfrac{2\pi}{2}$.
    - opgave: |-
        Zijn $y_1$ en $y_2$ oplossingen van $y'' + y = 1$, dan ook $y_1 + y_2$.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $y_1 + y_2$ geeft rechts $1 + 1 = 2$. De superpositie geldt alleen voor homogene vergelijkingen.
    - opgave: |-
        $y = t\,\e^{-t}$ is een oplossing van $y'' + 2y' + y = 0$.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $(r + 1)^2 = 0$, en $t\,\e^{rt}$ hoort bij een dubbele wortel.
    - opgave: |-
        Bij een vergelijking van de tweede orde volstaat één beginvoorwaarde.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: de algemene oplossing heeft twee constanten. Je hebt bijvoorbeeld $y(0)$ en $y'(0)$ nodig.
    - opgave: |-
        Bij $y'' + 2y' + 5y = 0$ geven de wortels $-1 \pm 2i$ de oplossing $C_1\,\e^{(-1 + 2i)t} + \ldots$, maar die is complex en dus onbruikbaar.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: de reële oplossingen zijn $\e^{-t}(C_1\cos 2t + C_2\sin 2t)$. Het reële deel van de wortel geeft de exponentiële factor, het imaginaire deel de trilling.

- id: h4-o5
  soort: opdracht
  niveau: 1
  thema: |-
    vergelijking bij gegeven oplossingen
  opgave: |-
    Zoek een vergelijking $y'' + a\,y' + b\,y = 0$ met de gegeven oplossing(en).
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\e^{t}$ en $\e^{-3t}$
      antwoord: |-
        $y'' + 2y' - 3y = 0$
      uitwerking: |-
        $(r - 1)(r + 3) = r^2 + 2r - 3$.
    - opgave: |-
        $\cos 2t$
      antwoord: |-
        $y'' + 4y = 0$
      uitwerking: |-
        $r = \pm 2i$: $r^2 + 4$.
    - opgave: |-
        $t\,\e^{5t}$
      antwoord: |-
        $y'' - 10y' + 25y = 0$
      uitwerking: |-
        Dubbele wortel 5: $(r - 5)^2$.
    - opgave: |-
        $\e^{-t}\sin t$
      antwoord: |-
        $y'' + 2y' + 2y = 0$
      uitwerking: |-
        $r = -1 \pm i$: $(r + 1)^2 + 1 = r^2 + 2r + 2$.

- id: h4-o6
  soort: opdracht
  niveau: 1
  thema: |-
    grafiek herkennen
  opgave: |-
    Elke vergelijking heeft een oplossing met $y(0) = 1$ en $y'(0) = 0$. Welke grafiek hoort bij welke vergelijking? Verklaar met de karakteristieke vergelijking.
    \figuren{\begin{tikzpicture}[x=.55cm,y=.7cm,font=\scriptsize]
      \draw[->,grijs] (0,0) -- (3.4,0) node[right,text=black] {$t$};
      \draw[->,grijs] (0,-1.1) -- (0,2.4);
      \node[left,inner sep=1pt] at (0,1) {1};
      \draw[accent,thick] plot[domain=0:1.5,samples=40,smooth] (\x,{(exp(\x)+exp(-\x))/2});
      \node at (1.6,2.3) {A};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.55cm,y=.7cm,font=\scriptsize]
      \draw[->,grijs] (0,0) -- (3.4,0) node[right,text=black] {$t$};
      \draw[->,grijs] (0,-1.1) -- (0,2.4);
      \node[left,inner sep=1pt] at (0,1) {1};
      \draw[accent,thick] plot[domain=0:3.2,samples=80,smooth] (\x,{exp(-\x)*(cos(2*\x r)+0.5*sin(2*\x r))});
      \node at (1.6,2.3) {B};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.55cm,y=.7cm,font=\scriptsize]
      \draw[->,grijs] (0,0) -- (3.4,0) node[right,text=black] {$t$};
      \draw[->,grijs] (0,-1.1) -- (0,2.4);
      \node[left,inner sep=1pt] at (0,1) {1};
      \draw[accent,thick] plot[domain=0:3.2,samples=80,smooth] (\x,{cos(2*\x r)});
      \node at (1.6,2.3) {C};
    \end{tikzpicture}\quad
    \begin{tikzpicture}[x=.55cm,y=.7cm,font=\scriptsize]
      \draw[->,grijs] (0,0) -- (3.4,0) node[right,text=black] {$t$};
      \draw[->,grijs] (0,-1.1) -- (0,2.4);
      \node[left,inner sep=1pt] at (0,1) {1};
      \draw[accent,thick] plot[domain=0:3.2,samples=60,smooth] (\x,{(1+2*\x)*exp(-2*\x)});
      \node at (1.6,2.3) {D};
    \end{tikzpicture}}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $y'' + 4y = 0$
      antwoord: |-
        C
      uitwerking: |-
        $r = \pm 2i$, $\alpha = 0$: een trilling die niet uitdooft, $y = \cos 2t$.
    - opgave: |-
        $y'' + 2y' + 5y = 0$
      antwoord: |-
        B
      uitwerking: |-
        $r = -1 \pm 2i$: een uitdovende trilling.
    - opgave: |-
        $y'' + 4y' + 4y = 0$
      antwoord: |-
        D
      uitwerking: |-
        Dubbele wortel $-2$: $(1 + 2t)\,\e^{-2t}$, zonder schommeling naar 0.
    - opgave: |-
        $y'' - y = 0$
      antwoord: |-
        A
      uitwerking: |-
        $r = \pm 1$: $y = \tfrac12(\e^t + \e^{-t})$, die blijft stijgen.

- id: h4-o7
  soort: opdracht
  niveau: 2
  thema: |-
    niet-homogene vergelijkingen
  opgave: |-
    Bepaal de algemene oplossing.
  lijst: enumerate
  delen:
    - opgave: |-
        $y'' + 4y = 8$
      antwoord: |-
        $y = 2 + C_1\cos 2t + C_2\sin 2t$
      uitwerking: |-
        $y_p = 2$.
    - opgave: |-
        $y'' - 3y' + 2y = 6t - 1$
      antwoord: |-
        $y = 3t + 4 + C_1\,\e^{t} + C_2\,\e^{2t}$
      uitwerking: |-
        $y_p = At + B$: $-3A + 2At + 2B = 6t - 1$, dus $A = 3$ en $2B = -1 + 9$.
    - opgave: |-
        $y'' + y' - 2y = 10\,\e^{-3t}$
      antwoord: |-
        $y = 2{,}5\,\e^{-3t} + C_1\,\e^{t} + C_2\,\e^{-2t}$
      uitwerking: |-
        $y_p = A\,\e^{-3t}$: $(9 - 3 - 2)A = 10$, dus $A = 2{,}5$.
    - opgave: |-
        $y'' + 2y' + y = t^2$
      antwoord: |-
        $y = t^2 - 4t + 6 + (C_1 + C_2\,t)\,\e^{-t}$
      uitwerking: |-
        $y_p = At^2 + Bt + C$: $2A + 2(2At + B) + At^2 + Bt + C = t^2$ geeft $A = 1$, $4A + B = 0$, $2A + 2B + C = 0$.

- id: h4-o8
  soort: opdracht
  prent:
    naam: veer
  niveau: 2
  thema: |-
    een hangende massa
  opgave: |-
    Een blokje van 0,5 kg hangt aan een veer met $k = 49$ N/m. Het wordt losgelaten waar de veer niet uitgerekt is. Meet $x$ naar beneden vanaf dat punt, en neem $g = 9{,}8$ m/s\textsuperscript{2}.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $x'' + 98\,x = 9{,}8$.
      antwoord: |-
        $0{,}5\,x'' = -49\,x + 0{,}5 \cdot 9{,}8$
      uitwerking: |-
        Deel door 0,5.
    - opgave: |-
        Los op, en zeg waar het blokje rond trilt.
      antwoord: |-
        $x = 0{,}1 - 0{,}1\cos(\sqrt{98}\,t)$, rond 10 cm
      uitwerking: |-
        $x_p = \tfrac{9{,}8}{98} = 0{,}1$; $x(0) = 0$ geeft $C_1 = -0{,}1$, $x'(0) = 0$ geeft $C_2 = 0$.
    - opgave: |-
        Hoe ver zakt het blokje, en wat is de periode?
      antwoord: |-
        20 cm; ongeveer 0,63 s
      uitwerking: |-
        Het laagste punt is $0{,}1 + 0{,}1 = 0{,}2$ m. $T = \tfrac{2\pi}{\sqrt{98}} \approx 0{,}635$ s.

- id: h4-o9
  soort: opdracht
  prent:
    naam: auto
  niveau: 2
  thema: |-
    schokdemper
  opgave: |-
    Een wiel van een lichtere auto draagt 300 kg, met een veer van $k = 30\,000$ N/m.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de kritische demping.
      antwoord: |-
        6000 Ns/m
      uitwerking: |-
        $c_k = 2\sqrt{30\,000 \cdot 300} = 2 \cdot 3000$.
    - opgave: |-
        Met een versleten demper is $c = 3000$. Toon aan dat de carrosserie schommelt, en bereken de periode.
      antwoord: |-
        $r = -5 \pm 5\sqrt3\,i$; periode ongeveer 0,73 s
      uitwerking: |-
        $x'' + 10x' + 100x = 0$: $r = -5 \pm \sqrt{25 - 100} = -5 \pm 5\sqrt3\,i$. $T = \tfrac{2\pi}{5\sqrt3} \approx 0{,}726$ s.
    - opgave: |-
        Met $c = 7500$ is de demping overkritisch. Geef de algemene oplossing.
      antwoord: |-
        $x = C_1\,\e^{-5t} + C_2\,\e^{-20t}$
      uitwerking: |-
        $x'' + 25x' + 100x = 0$: $(r + 5)(r + 20) = 0$. De term $\e^{-5t}$ dooft traag uit.

- id: h4-o10
  soort: opdracht
  niveau: 2
  thema: |-
    uitdovende trilling
  opgave: |-
    Neem $y'' + 2y' + 5y = 0$ met $y(0) = 1$ en $y'(0) = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Los op.
      antwoord: |-
        $y = \e^{-t}(\cos 2t + \sin 2t)$
      uitwerking: |-
        $C_1 = 1$; $y'(0) = -C_1 + 2C_2 = 1$ geeft $C_2 = 1$.
    - opgave: |-
        Wanneer is $y$ voor het eerst 0?
      antwoord: |-
        $t = \tfrac{3\pi}{8} \approx 1{,}18$
      uitwerking: |-
        $\cos 2t + \sin 2t = 0 \iff \tan 2t = -1$, dus $2t = \tfrac{3\pi}{4}$.
    - opgave: |-
        Toon aan dat $|y| \leqslant \sqrt2\,\e^{-t}$.
      antwoord: |-
        $|\cos 2t + \sin 2t| \leqslant \sqrt2$
      uitwerking: |-
        $\cos 2t + \sin 2t = \sqrt2\cos\bigl(2t - \tfrac\pi4\bigr)$, en een cosinus ligt tussen $-1$ en 1.

- id: h4-o11
  soort: opdracht
  niveau: 2
  thema: |-
    rechterlid met twee termen
  opgave: |-
    Neem $y'' + y = 3 + \e^{2t}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek een particuliere oplossing van $y'' + y = 3$, en een van $y'' + y = \e^{2t}$.
      antwoord: |-
        $3$ en $\tfrac15\,\e^{2t}$
      uitwerking: |-
        $A = 3$; en $A\,\e^{2t}$ met $(4 + 1)A = 1$.
    - opgave: |-
        Toon aan dat hun som een particuliere oplossing is van de gegeven vergelijking, en geef de algemene oplossing.
      antwoord: |-
        $y = 3 + \tfrac15\,\e^{2t} + C_1\cos t + C_2\sin t$
      uitwerking: |-
        Het linkerlid is lineair: de som geeft rechts $3 + \e^{2t}$.

- id: h4-o12
  soort: opdracht
  niveau: 2
  thema: |-
    slinger
  opgave: |-
    Voor een slinger met lengte $L$ is de uitwijkingshoek $\theta$ bij kleine hoeken ongeveer een oplossing van $\theta'' = -\tfrac gL\,\theta$, met $g = 9{,}81$ m/s\textsuperscript{2}.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat de periode $T = 2\pi\sqrt{L/g}$ is. Hangt ze af van hoe ver je de slinger uittrekt?
      antwoord: |-
        $\omega = \sqrt{g/L}$; nee
      uitwerking: |-
        $T = \tfrac{2\pi}{\omega}$. De beginhoek bepaalt alleen $C_1$, niet $\omega$ (zolang de hoeken klein blijven).
    - opgave: |-
        Hoe lang moet een slinger zijn die er 2 seconden over doet om heen en terug te gaan?
      antwoord: |-
        ongeveer 0,99 m
      uitwerking: |-
        $2 = 2\pi\sqrt{L/9{,}81}$ geeft $L = \tfrac{9{,}81}{\pi^2} \approx 0{,}994$ m.
    - opgave: |-
        Hoeveel keer zo lang moet een slinger zijn om twee keer zo traag te gaan?
      antwoord: |-
        4 keer
      uitwerking: |-
        $T$ is evenredig met $\sqrt L$.

- id: h4-o13
  soort: opdracht
  niveau: 2
  thema: |-
    wanneer schommelt het?
  opgave: |-
    Neem $y'' + a\,y' + 9y = 0$ met $a \geqslant 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Voor welke $a$ schommelen de oplossingen?
      antwoord: |-
        $0 \leqslant a < 6$
      uitwerking: |-
        Complexe wortels als $a^2 - 36 < 0$.
    - opgave: |-
        Voor welke $a$ is de periode van de schommeling $\pi$?
      antwoord: |-
        $a = 2\sqrt5$
      uitwerking: |-
        $\beta = \tfrac12\sqrt{36 - a^2} = 2$ geeft $36 - a^2 = 16$, dus $a = \sqrt{20}$.
    - opgave: |-
        Wat gebeurt er met de periode als $a$ naar 6 gaat?
      antwoord: |-
        ze gaat naar oneindig
      uitwerking: |-
        $\beta \to 0$, dus $\tfrac{2\pi}{\beta} \to +\infty$: de schommeling wordt steeds trager, tot ze verdwijnt bij de kritische demping.

- id: h4-o14
  soort: opdracht
  niveau: 2
  thema: |-
    wanneer de proefvorm niet werkt
  opgave: |-
    Neem $y'' - y' - 2y = \e^{2t}$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $y_p = A\,\e^{2t}$ voor geen enkele $A$ een oplossing is. Waarom niet?
      antwoord: |-
        links komt 0
      uitwerking: |-
        $(4 - 2 - 2)\,A\,\e^{2t} = 0$: $\e^{2t}$ is zelf een oplossing van de homogene vergelijking, want 2 is een wortel van $r^2 - r - 2$.
    - opgave: |-
        Probeer $y_p = A\,t\,\e^{2t}$, en bepaal $A$.
      antwoord: |-
        $A = \tfrac13$
      uitwerking: |-
        $y_p' = A(1 + 2t)\,\e^{2t}$ en $y_p'' = A(4 + 4t)\,\e^{2t}$. Invullen: $A\,(4 + 4t - 1 - 2t - 2t)\,\e^{2t} = 3A\,\e^{2t}$.
    - opgave: |-
        Geef de algemene oplossing.
      antwoord: |-
        $y = \tfrac13\,t\,\e^{2t} + C_1\,\e^{2t} + C_2\,\e^{-t}$
      uitwerking: |-
        Homogeen: $(r - 2)(r + 1) = 0$.

- id: h4-o15
  soort: opdracht
  niveau: 3
  thema: |-
    resonantie
  opgave: |-
    Een schommel wordt in haar eigen ritme aangeduwd: $y'' + y = \cos t$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $y_p = \tfrac t2\sin t$ een oplossing is.
      antwoord: |-
        $y_p'' + y_p = \cos t$
      uitwerking: |-
        $y_p' = \tfrac12\sin t + \tfrac t2\cos t$ en $y_p'' = \cos t - \tfrac t2\sin t$, dus $y_p'' + y_p = \cos t$.
    - opgave: |-
        Wat gebeurt er met de uitwijking op lange termijn?
      antwoord: |-
        ze groeit onbeperkt
      uitwerking: |-
        Elke oplossing is $\tfrac t2\sin t + C_1\cos t + C_2\sin t$, met een amplitude die evenredig met $t$ groeit. Dat heet resonantie.
    - opgave: |-
        Duw je in een ander ritme, $y'' + y = \cos 1{,}1t$, dan is er een oplossing $A\cos 1{,}1t$. Bepaal $A$. Groeit de uitwijking nu ook?
      antwoord: |-
        $A = -\tfrac{1}{0{,}21} \approx -4{,}76$; nee
      uitwerking: |-
        $(-1{,}21 + 1)\,A = 1$. Alle oplossingen blijven begrensd, maar de uitwijking kan groot worden: hoe dichter het ritme bij 1, hoe groter $|A|$.

- id: h4-o16
  soort: opdracht
  niveau: 3
  thema: |-
    prooi en roofdier
  opgave: |-
    Konijnen $x$ en vossen $y$ (in aantallen) voldoen aan het model van Lotka en Volterra:
    \[
    x' = 0{,}5\,x - 0{,}01\,x\,y , \qquad y' = -0{,}4\,y + 0{,}002\,x\,y \qquad (t \text{ in jaar}) .
    \]
  lijst: enumerate
  delen:
    - opgave: |-
        Verklaar elke term in woorden.
      antwoord: |-
        groei, opgegeten worden, sterfte, voedsel
      uitwerking: |-
        Zonder vossen groeien de konijnen exponentieel ($0{,}5\,x$). Per ontmoeting worden konijnen opgegeten ($-0{,}01\,xy$). Zonder konijnen sterven de vossen uit ($-0{,}4\,y$). Ontmoetingen leveren voedsel en dus jonge vossen ($0{,}002\,xy$).
    - opgave: |-
        Bepaal het evenwicht met $x > 0$ en $y > 0$.
      antwoord: |-
        $x = 200$, $y = 50$
      uitwerking: |-
        $x' = 0$ geeft $y = 50$, en $y' = 0$ geeft $x = 200$.
    - opgave: |-
        Stel $x = 200 + u$ en $y = 50 + v$ met kleine $u$ en $v$. Verwaarloos het product $u\,v$, en toon aan dat $u' \approx -2v$ en $v' \approx 0{,}1\,u$.
      antwoord: |-
        uitwerken en $uv$ weglaten
      uitwerking: |-
        $u' = (200 + u)(0{,}5 - 0{,}5 - 0{,}01\,v) = -2v - 0{,}01\,uv$ en $v' = (50 + v)(-0{,}4 + 0{,}4 + 0{,}002\,u) = 0{,}1\,u + 0{,}002\,uv$.
    - opgave: |-
        Leid af dat $u'' \approx -0{,}2\,u$. Met welke periode schommelen de populaties rond het evenwicht?
      antwoord: |-
        ongeveer 14 jaar
      uitwerking: |-
        $u'' = -2v' = -0{,}2\,u$: een harmonische trilling met $\omega = \sqrt{0{,}2}$, en $T = \tfrac{2\pi}{\sqrt{0{,}2}} \approx 14{,}0$ jaar. De vossen lopen een kwart periode achter op de konijnen.

- id: h4-o17
  soort: opdracht
  niveau: 3
  thema: |-
    energie
  opgave: |-
    Neem een oplossing $y$ van $y'' + c\,y' + \omega^2 y = 0$, met $c \geqslant 0$, en $E = (y')^2 + \omega^2 y^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $E' = -2c\,(y')^2$.
      antwoord: |-
        $E' = 2y'(y'' + \omega^2 y)$
      uitwerking: |-
        $E' = 2y'\,y'' + 2\omega^2 y\,y' = 2y'\,(y'' + \omega^2 y) = 2y'\,(-c\,y')$.
    - opgave: |-
        Wat betekent dat voor $c = 0$, en voor $c > 0$?
      antwoord: |-
        $E$ constant; $E$ dalend
      uitwerking: |-
        Zonder demping blijft de energie behouden. Met demping daalt ze: de demper zet bewegingsenergie om in warmte.
    - opgave: |-
        Leid af dat een oplossing met $y(0) = y'(0) = 0$ de nulfunctie is, ook als $c > 0$.
      antwoord: |-
        $0 \leqslant E \leqslant E(0) = 0$
      uitwerking: |-
        $E$ daalt (voor $t \geqslant 0$) en is nooit negatief; omdat $E(0) = 0$, is $E = 0$, dus $y = 0$.

- id: h4-o18
  soort: opdracht
  niveau: 3
  thema: |-
    Euler bij een trilling
  opgave: |-
    Om $y'' = -y$ met de methode van Euler te benaderen, schrijf je ze als twee vergelijkingen van de eerste orde: $y' = v$ en $v' = -y$. Neem $y(0) = 1$, $v(0) = 0$ en stap $h$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $y_{n+1} = y_n + h\,v_n$ en $v_{n+1} = v_n - h\,y_n$. Bereken met $h = 0{,}1$ de waarden na twee stappen.
      antwoord: |-
        $y_2 = 0{,}99$, $v_2 = -0{,}2$
      uitwerking: |-
        $y_1 = 1$, $v_1 = -0{,}1$; $y_2 = 1 - 0{,}01 = 0{,}99$, $v_2 = -0{,}1 - 0{,}1 = -0{,}2$.
    - opgave: |-
        Toon aan dat $y_{n+1}^2 + v_{n+1}^2 = (1 + h^2)\,(y_n^2 + v_n^2)$.
      antwoord: |-
        de dubbele producten vallen weg
      uitwerking: |-
        $(y_n + h v_n)^2 + (v_n - h y_n)^2 = y_n^2 + v_n^2 + h^2(v_n^2 + y_n^2)$.
    - opgave: |-
        De exacte oplossing $\cos t$ heeft $y^2 + v^2 = 1$. Wat doet de benadering? Hoe groot is $y_n^2 + v_n^2$ na $t = 2\pi$ met $h = 0{,}1$?
      antwoord: |-
        de energie groeit; ongeveer 1,87
      uitwerking: |-
        Elke stap vermenigvuldigt met $1{,}01$; na ongeveer 63 stappen is dat $1{,}01^{63} \approx 1{,}87$. De benadering spiraalt naar buiten: de methode van Euler voegt energie toe.

- id: h4-o19
  soort: opdracht
  niveau: 3
  thema: |-
    een stelsel wordt tweede orde
  opgave: |-
    Twee grootheden voldoen aan $x' = 3x - 2y$ en $y' = x$, met $x(0) = 1$ en $y(0) = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Leid $x' = 3x - 2y$ af, en toon aan dat $x'' - 3x' + 2x = 0$.
      antwoord: |-
        $x'' = 3x' - 2y' = 3x' - 2x$
      uitwerking: |-
        Vervang $y'$ door $x$.
    - opgave: |-
        Los op naar $x$, en bepaal daarna $y$.
      antwoord: |-
        $x = 2\,\e^{2t} - \e^{t}$, $y = \e^{2t} - \e^{t}$
      uitwerking: |-
        $x = C_1\,\e^{t} + C_2\,\e^{2t}$ met $x(0) = 1$ en $x'(0) = 3x(0) - 2y(0) = 3$: $C_1 + C_2 = 1$ en $C_1 + 2C_2 = 3$. Dan $y = \tfrac{3x - x'}{2}$.

- id: h4-o20
  soort: opdracht
  niveau: 3
  thema: |-
    vergelijking van Euler
  opgave: |-
    De coëfficiënten van $t^2\,y'' - 2t\,y' + 2y = 0$ (voor $t > 0$) zijn niet constant. Probeer daarom geen $\e^{rt}$, maar $y = t^r$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $t^r$ een oplossing is als $r^2 - 3r + 2 = 0$.
      antwoord: |-
        $r(r - 1) - 2r + 2 = 0$
      uitwerking: |-
        $t^2 \cdot r(r - 1)\,t^{r-2} - 2t \cdot r\,t^{r-1} + 2t^r = \bigl(r(r - 1) - 2r + 2\bigr)\,t^r$.
    - opgave: |-
        Geef twee oplossingen, en een oplossing met $y(1) = 0$ en $y'(1) = 1$.
      antwoord: |-
        $t$ en $t^2$; $y = t^2 - t$
      uitwerking: |-
        $r = 1$ of $r = 2$. Met $y = C_1 t + C_2 t^2$: $C_1 + C_2 = 0$ en $C_1 + 2C_2 = 1$.

- id: h4-o21
  soort: opdracht
  niveau: 3
  thema: |-
    kritisch of overkritisch
  opgave: |-
    Vergelijk $x'' + 2x' + x = 0$ (kritisch) en $x'' + 3x' + x = 0$ (overkritisch), telkens met $x(0) = 1$ en $x'(0) = 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Los beide op.
      antwoord: |-
        $(1 + t)\,\e^{-t}$; $C_1\,\e^{r_1 t} + C_2\,\e^{r_2 t}$ met $r_{1,2} = \tfrac{-3 \pm \sqrt5}{2}$
      uitwerking: |-
        Kritisch: $C_1 = 1$, $C_2 - C_1 = 0$. Overkritisch: $r_1 \approx -0{,}382$, $r_2 \approx -2{,}618$, $C_1 + C_2 = 1$ en $r_1 C_1 + r_2 C_2 = 0$, dus $C_1 = \tfrac{r_2}{r_2 - r_1} \approx 1{,}171$ en $C_2 \approx -0{,}171$.
    - opgave: |-
        Bereken beide oplossingen in $t = 3$. Welke is het dichtst bij de rustpositie? Verklaar met de wortels.
      antwoord: |-
        0,199 tegenover 0,372: de kritische
      uitwerking: |-
        $4\,\e^{-3} \approx 0{,}199$ en $1{,}171\,\e^{-1{,}146} - 0{,}171\,\e^{-7{,}85} \approx 0{,}372$. De overkritische oplossing wordt bepaald door $\e^{-0{,}382t}$, die trager uitdooft dan $\e^{-t}$.

# --- Koppel -----------------------------------------------------------------------------

- id: h4-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Complexe getallen
  opgave: |-
    De karakteristieke vergelijking heeft reële coëfficiënten $a$ en $b$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan: is $r = \alpha + \beta i$ een wortel van $r^2 + ar + b = 0$, dan ook de toegevoegde $\overline{r}$.
      antwoord: |-
        neem de toegevoegde van beide leden
      uitwerking: |-
        $\overline{r^2 + ar + b} = \overline{r}^{\,2} + a\,\overline{r} + b$, omdat $a$ en $b$ reëel zijn, en $\overline{0} = 0$.
    - opgave: |-
        Toon aan dat de som en het product van de wortels $-a$ en $b$ zijn, en bepaal $\alpha$ en $\beta^2$ in functie van $a$ en $b$.
      antwoord: |-
        $\alpha = -\tfrac a2$, $\beta^2 = b - \tfrac{a^2}{4}$
      uitwerking: |-
        $(r - r_1)(r - r_2) = r^2 - (r_1 + r_2)r + r_1 r_2$. Hier is $r_1 + r_2 = 2\alpha = -a$ en $r_1 r_2 = \alpha^2 + \beta^2 = b$.
    - opgave: |-
        Een vergelijking heeft de oplossing $\e^{-2t}\cos 5t$. Welke vergelijking?
      antwoord: |-
        $y'' + 4y' + 29y = 0$
      uitwerking: |-
        $r = -2 \pm 5i$: $a = 4$ en $b = 4 + 25$.

- id: h4-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: |-
      Goniometrische functies
  opgave: |-
    Een trilling $y = 3\cos 2t + 4\sin 2t$ is ook een verschoven cosinus $R\cos(2t - \varphi)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Werk $R\cos(2t - \varphi)$ uit met de verschilformule, en bepaal $R > 0$ en $\varphi$.
      antwoord: |-
        $R = 5$, $\varphi = \bgtan\tfrac43 \approx 0{,}927$
      uitwerking: |-
        $R\cos\varphi\cos 2t + R\sin\varphi\sin 2t$: $R\cos\varphi = 3$ en $R\sin\varphi = 4$, dus $R^2 = 9 + 16$ en $\tan\varphi = \tfrac43$, met $\varphi$ in het eerste kwadrant.
    - opgave: |-
        Wat zijn de amplitude en de periode? Wanneer bereikt $y$ voor het eerst zijn maximum?
      antwoord: |-
        amplitude 5, periode $\pi$, maximum in $t \approx 0{,}464$
      uitwerking: |-
        Maximum als $2t - \varphi = 0$, dus $t = \tfrac\varphi2$.

- id: h4-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: discreet
    onderwerp: |-
      Rijen
  opgave: |-
    De rij van Fibonacci voldoet aan $F_n = F_{n-1} + F_{n-2}$ met $F_0 = 0$ en $F_1 = 1$: een recursievergelijking van de tweede orde.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek de getallen $q$ waarvoor $F_n = q^n$ aan de recursievergelijking voldoet.
      antwoord: |-
        $q = \tfrac{1 \pm \sqrt5}{2}$
      uitwerking: |-
        $q^n = q^{n-1} + q^{n-2}$ geeft $q^2 = q + 1$: een karakteristieke vergelijking, net zoals bij $y'' + ay' + by = 0$.
    - opgave: |-
        Zoals bij differentiaalvergelijkingen is elke $C_1 q_1^n + C_2 q_2^n$ een oplossing. Bepaal $C_1$ en $C_2$ met $F_0$ en $F_1$.
      antwoord: |-
        $F_n = \dfrac{1}{\sqrt5}\Bigl(\bigl(\tfrac{1 + \sqrt5}{2}\bigr)^n - \bigl(\tfrac{1 - \sqrt5}{2}\bigr)^n\Bigr)$
      uitwerking: |-
        $C_1 + C_2 = 0$ en $C_1 q_1 + C_2 q_2 = 1$, met $q_1 - q_2 = \sqrt5$: $C_1 = \tfrac{1}{\sqrt5}$, $C_2 = -\tfrac{1}{\sqrt5}$. Controle: $F_2 = 1$, $F_5 = 5$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h4-t1
  soort: test
  niveau: 1
  opgave: |-
    Bepaal de algemene oplossing van $y'' - 2y' - 8y = 0$.
  antwoord: |-
    $y = C_1\,\e^{4t} + C_2\,\e^{-2t}$
  uitwerking: |-
    $(r - 4)(r + 2) = 0$.

- id: h4-t2
  soort: test
  niveau: 1
  opgave: |-
    Los op: $y'' + 6y' + 9y = 0$ met $y(0) = 1$ en $y'(0) = 0$.
  antwoord: |-
    $y = (1 + 3t)\,\e^{-3t}$
  uitwerking: |-
    Dubbele wortel $-3$: $C_1 = 1$ en $C_2 - 3C_1 = 0$.

- id: h4-t3
  soort: test
  niveau: 1
  opgave: |-
    Bepaal de algemene oplossing van $y'' + 2y' + 17y = 0$.
  antwoord: |-
    $y = \e^{-t}(C_1\cos 4t + C_2\sin 4t)$
  uitwerking: |-
    $r = \tfrac{-2 \pm \sqrt{4 - 68}}{2} = -1 \pm 4i$.

- id: h4-t4
  soort: test
  niveau: 1
  opgave: |-
    Los op: $x'' + 25x = 0$ met $x(0) = 0{,}02$ en $x'(0) = 0$. Wat is de periode?
  antwoord: |-
    $x = 0{,}02\cos 5t$; periode $\tfrac{2\pi}{5} \approx 1{,}26$
  uitwerking: |-
    $\omega = 5$, $C_1 = 0{,}02$, $C_2 = 0$.

- id: h4-t5
  soort: test
  niveau: 2
  opgave: |-
    Bepaal de algemene oplossing van $y'' - y = 2 - t$.
  antwoord: |-
    $y = t - 2 + C_1\,\e^{t} + C_2\,\e^{-t}$
  uitwerking: |-
    $y_p = At + B$: $-At - B = 2 - t$, dus $A = 1$ en $B = -2$.

- id: h4-t6
  soort: test
  niveau: 2
  opgave: |-
    Een massa van 1 kg hangt aan een veer met $k = 16$ N/m, met een demper. Bij welke $c$ is de demping kritisch? Neem $c = 4$: schommelt de massa, en met welke periode?
  antwoord: |-
    $c = 8$; ja, periode ongeveer 1,81 s
  uitwerking: |-
    $c_k = 2\sqrt{16} = 8$. Met $c = 4$: $x'' + 4x' + 16x = 0$, $r = -2 \pm 2\sqrt3\,i$, dus $T = \tfrac{2\pi}{2\sqrt3} \approx 1{,}81$ s.
