          \draw[lijngrijs,thick] (0,0) -- (8.3,8.3);
          \draw[accent,thick] (0,1) -- (8.3,7.225);
          \draw[grijs] (0,0) -- (0,1) -- (1,1) -- (1,1.75) -- (1.75,1.75) -- (1.75,2.3125) -- (2.3125,2.3125) -- (2.3125,2.734) -- (2.734,2.734);
          \draw[grijs] (7,0) -- (7,6.25) -- (6.25,6.25) -- (6.25,5.6875) -- (5.6875,5.6875) -- (5.6875,5.2656) -- (5.2656,5.2656) -- (5.2656,4.949);
          \fill[accent] (4,4) circle (4pt);
