  opgave: |-
    Teken het spinnenwebdiagram en lees het evenwicht af.
  lijst: enumerate
  delen:
    - opgave: |-
        $t_n = 0{,}75\,t_{n-1} + 1$, vanaf $t_0 = 0$ en vanaf $t_0 = 7$
      antwoord: |-
        $E = 4$; twee trappen naar $(4, 4)$, van onder en van boven
      uitwerking: |-
        Het snijpunt van $y = 0{,}75x + 1$ en $y = x$ is $(4, 4)$. Vanaf 0: $1$; $1{,}75$; $2{,}31$; \ldots\ Vanaf 7: $6{,}25$; $5{,}69$; $5{,}27$; \ldots
