- id: h1-o3
  soort: opdracht
  niveau: 1
  thema: |-
    model opstellen en oplossen
  opgave: |-
    Een jeugdbeweging heeft 240 leden. Elk jaar stopt 15\,\% van de leden, en komen er 45 nieuwe bij.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel een recursievergelijking op voor het aantal leden $t_n$ na $n$ jaar.
      antwoord: |-
        $t_n = 0{,}85\,t_{n-1} + 45$, $t_0 = 240$
      uitwerking: |-
        Er blijft 85\,\% over, en er komen 45 leden bij.
    - opgave: |-
        Bepaal het evenwicht en zeg wat het betekent.
      antwoord: |-
        300 leden
      uitwerking: |-
        $E = \tfrac{45}{0{,}15} = 300$: bij 300 leden stoppen er per jaar precies 45, evenveel als er bijkomen.
    - opgave: |-
        Geef een expliciet voorschrift, en bereken het aantal leden na 5 jaar.
      antwoord: |-
        $t_n = 300 - 60 \cdot 0{,}85^{\,n}$, ongeveer 273 leden
      uitwerking: |-
        $c = 240 - 300 = -60$. $t_5 = 300 - 60 \cdot 0{,}4437 \approx 273{,}4$.
    - opgave: |-
        Haalt de jeugdbeweging ooit 300 leden?
      antwoord: |-
        nee, ze nadert 300
      uitwerking: |-
        Nee: $60 \cdot 0{,}85^{\,n} > 0$ voor elke $n$. Het aantal komt wel willekeurig dicht bij 300.

- id: h1-o4
  soort: opdracht
  niveau: 1
  thema: |-
    begrippen, klassieke fouten
  opgave: |-
    Waar of niet waar? Verklaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Het evenwicht van $t_n = 0{,}5\,t_{n-1} + 3$ is 6.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: $E = \tfrac{3}{1 - 0{,}5} = 6$, en $0{,}5 \cdot 6 + 3 = 6$.
    - opgave: |-
        Is $a > 1$, dan stijgt de rij altijd.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: bij een lening van 12\,000 euro aan 0,5\,\% per maand, met 250 euro afbetaling per maand, is $t_n = 1{,}005\,t_{n-1} - 250$ en $E = 50\,000$. Daar is $a = 1{,}005$, en daalt de schuld omdat $t_0 < E$. Een onstabiel evenwicht duwt de rij weg, naar boven of naar beneden.
    - opgave: |-
        Een recursievergelijking met $a < 0$ heeft geen evenwicht.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $E = \tfrac{b}{1 - a}$ bestaat voor elke $a \neq 1$. De rij springt er dan wel omheen.
    - opgave: |-
        Is $t_0 = E$, dan is de rij constant.
      antwoord: |-
        waar
      uitwerking: |-
        Waar: dan is $c = 0$ en $t_n = E$ voor elke $n$.
    - opgave: |-
        Is $a = 1$ en $b \neq 0$, dan heeft de recursievergelijking een evenwicht.
      antwoord: |-
        niet waar
      uitwerking: |-
        Niet waar: $E = E + b$ heeft geen oplossing. De rij is rekenkundig.

- id: h1-o5
  soort: opdracht
  niveau: 1
  thema: |-
    differentie- en recursievergelijking
  opgave: |-
    Zet om, en geef het evenwicht.
  lijst: enumerate
  delen:
    - opgave: |-
        $\Delta t_n = -0{,}2\,t_{n-1} + 50$ \ naar een recursievergelijking
      antwoord: |-
        $t_n = 0{,}8\,t_{n-1} + 50$, $E = 250$
      uitwerking: |-
        Tel $t_{n-1}$ op. $E = \tfrac{50}{0{,}2} = 250$.
    - opgave: |-
        $\Delta t_n = 0{,}1\,(t_{n-1} - 30)$ \ naar een recursievergelijking
      antwoord: |-
        $t_n = 1{,}1\,t_{n-1} - 3$, $E = 30$
      uitwerking: |-
        $t_n = t_{n-1} + 0{,}1\,t_{n-1} - 3$. Het evenwicht staat in de vorm: $E = 30$.
    - opgave: |-
        $t_n = 1{,}25\,t_{n-1} - 10$ \ naar een differentievergelijking in de vorm met het evenwicht
      antwoord: |-
        $\Delta t_n = 0{,}25\,(t_{n-1} - 40)$
      uitwerking: |-
        $\Delta t_n = 0{,}25\,t_{n-1} - 10$ en $E = \tfrac{-10}{-0{,}25} = 40$.

- id: h1-o6
  soort: opdracht
  niveau: 1
  thema: |-
    spinnenwebdiagram aflezen
  figuur:
    opties: |-
      4cm
    code: |-
      \begin{tikzpicture}[scale=.5,font=\scriptsize]
        \rooster{0}{1}{7}{0}{1}{7}
        \draw[lijngrijs,thick] (0,0) -- (7.3,7.3) node[above,text=black] {$y = x$};
        \draw[accent,thick] (0,6) -- (7.3,2.35);
      \end{tikzpicture}
  opgave: |-
    De figuur toont de rechte $y = ax + b$ van een recursievergelijking $t_n = a\,t_{n-1} + b$, en de rechte $y = x$.
  lijst: enumerate
  delen:
    - opgave: |-
        Lees het evenwicht af.
      antwoord: |-
        $E = 4$
      uitwerking: |-
        Het snijpunt van de twee rechten is $(4, 4)$.
    - opgave: |-
        Bepaal $a$ en $b$.
      antwoord: |-
        $a = -0{,}5$, $b = 6$
      uitwerking: |-
        De rechte gaat door $(0, 6)$ en $(4, 4)$: richtingscoëfficiënt $\tfrac{4 - 6}{4} = -0{,}5$.
    - opgave: |-
        Teken het spinnenwebdiagram vanaf $t_0 = 0$, en geef $t_1$, $t_2$ en $t_3$.
      antwoord: |-
        6; 3; 4,5
      uitwerking: |-
        Verticaal naar $(0, 6)$, horizontaal naar $(6, 6)$, verticaal naar $(6, 3)$, horizontaal naar $(3, 3)$, verticaal naar $(3; 4{,}5)$: een spinnenweb rond $(4, 4)$.
    - opgave: |-
        Is het evenwicht stabiel? Hoe zie je dat aan de figuur?
      antwoord: |-
        ja: de rechte is minder steil dan $y = x$
      uitwerking: |-
        Ja: $|a| = 0{,}5 < 1$. In de figuur: de rechte daalt minder steil dan $y = x$ stijgt, en het spinnenweb wordt kleiner.

- id: h1-o7
  soort: opdracht
  niveau: 1
  thema: |-
    geneesmiddel, vlak na en vlak voor
  opgave: |-
    Iemand neemt elke dag om 8 uur een tablet van 50 mg. Tegen de volgende ochtend is 80\,\% ervan afgebroken.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel een recursievergelijking op voor de hoeveelheid $t_n$ vlak na de inname.
      antwoord: |-
        $t_n = 0{,}2\,t_{n-1} + 50$, $t_0 = 50$
      uitwerking: |-
        Er blijft 20\,\% over, en er komt 50 mg bij.
    - opgave: |-
        Naar welke hoeveelheid gaat het vlak na de inname?
      antwoord: |-
        62,5 mg
      uitwerking: |-
        $E = \tfrac{50}{0{,}8} = 62{,}5$ mg, stabiel want $|0{,}2| < 1$.
    - opgave: |-
        En vlak voor de inname?
      antwoord: |-
        12,5 mg
      uitwerking: |-
        Vlak voor de inname is er 20\,\% van de hoeveelheid erna: $0{,}2 \cdot 62{,}5 = 12{,}5$ mg. Controle: $12{,}5 + 50 = 62{,}5$.

- id: h1-o8
  soort: opdracht
  niveau: 2
  thema: |-
    vervuiling van een meer
  opgave: |-
    Een meer bevat 500 kg van een verontreinigende stof. Elk jaar spoelt de rivier 30\,\% van de stof in het meer weg, en een fabriek loost er elk jaar 60 kg in.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel een recursievergelijking op en bepaal het evenwicht.
      antwoord: |-
        $t_n = 0{,}7\,t_{n-1} + 60$, $E = 200$ kg
      uitwerking: |-
        $E = \tfrac{60}{0{,}3} = 200$ kg.
    - opgave: |-
        Geef een expliciet voorschrift.
      antwoord: |-
        $t_n = 200 + 300 \cdot 0{,}7^{\,n}$
      uitwerking: |-
        $c = 500 - 200 = 300$.
    - opgave: |-
        Na hoeveel jaar zit er minder dan 210 kg in het meer?
      antwoord: |-
        na 10 jaar
      uitwerking: |-
        $300 \cdot 0{,}7^{\,n} < 10$ geeft $0{,}7^{\,n} < \tfrac1{30}$, dus $n > \tfrac{\ln(1/30)}{\ln 0{,}7} \approx 9{,}54$.
    - opgave: |-
        Hoeveel mag de fabriek hoogstens lozen, opdat de hoeveelheid op lange termijn onder 100 kg blijft?
      antwoord: |-
        minder dan 30 kg per jaar
      uitwerking: |-
        Het evenwicht $\tfrac{b}{0{,}3}$ moet kleiner zijn dan 100, dus $b < 30$ kg per jaar.

- id: h1-o9
  soort: opdracht
  niveau: 2
  thema: |-
    sparen, negatief evenwicht
  opgave: |-
    Je stort elke maand 200 euro op een spaarrekening die 0,25\,\% rente per maand geeft. Je begint met 0 euro.
  lijst: enumerate
  delen:
    - opgave: |-
        Stel een recursievergelijking op, en geef een expliciet voorschrift.
      antwoord: |-
        $t_n = 1{,}0025\,t_{n-1} + 200$, $t_n = 80\,000 \cdot 1{,}0025^{\,n} - 80\,000$
      uitwerking: |-
        $E = \tfrac{200}{1 - 1{,}0025} = -80\,000$ en $c = 0 + 80\,000$.
    - opgave: |-
        Na hoeveel maanden staat er meer dan 10\,000 euro op de rekening?
      antwoord: |-
        na 48 maanden
      uitwerking: |-
        $1{,}0025^{\,n} > 1{,}125$ geeft $n > \tfrac{\ln 1{,}125}{\ln 1{,}0025} \approx 47{,}2$. Controle: $t_{47} \approx 9961$ en $t_{48} \approx 10\,186$.
    - opgave: |-
        Het evenwicht is negatief. Wat betekent het in deze context?
      antwoord: |-
        een schuld van 80\,000 euro, waarop de rente precies 200 euro is
      uitwerking: |-
        Op een negatief saldo van $-80\,000$ euro (een schuld met dezelfde rentevoet) is de rente $-200$ euro: dan heft de storting de rente juist op, en verandert het saldo niet.

- id: h1-o10
  soort: opdracht
  prent:
    naam: bever
  niveau: 2
  thema: |-
    populatie met een vast afschot
  opgave: |-
    In een natuurgebied leven 900 bevers. Zonder ingrijpen groeit de populatie met 10\,\% per jaar. Om schade te beperken, verhuist men elk jaar $q$ bevers naar een ander gebied.
  lijst: enumerate
  delen:
    - opgave: |-
        Neem $q = 60$. Bepaal het evenwicht. Groeit de populatie of krimpt ze?
      antwoord: |-
        $E = 600$, ze groeit
      uitwerking: |-
        $t_n = 1{,}1\,t_{n-1} - 60$, $E = 600$. Onstabiel, en $t_0 = 900 > 600$: de populatie groeit.
    - opgave: |-
        Neem $q = 100$. Na hoeveel jaar zijn er geen bevers meer?
      antwoord: |-
        na 25 jaar
      uitwerking: |-
        $E = 1000$, dus $t_n = 1000 - 100 \cdot 1{,}1^{\,n}$. $t_n \leqslant 0$ als $1{,}1^{\,n} \geqslant 10$, dus $n \geqslant 24{,}2$.
    - opgave: |-
        Hoeveel bevers mag men hoogstens per jaar verhuizen, zodat de populatie niet daalt?
      antwoord: |-
        90
      uitwerking: |-
        De populatie daalt niet als $t_0 \geqslant E = \tfrac{q}{0{,}1}$, dus $q \leqslant 90$. Bij $q = 90$ blijft ze 900.

- id: h1-o11
  soort: opdracht
  niveau: 2
  thema: |-
    vergelijking uit drie termen
  opgave: |-
    Drie opeenvolgende termen van een rij met $t_n = a\,t_{n-1} + b$ zijn 10, 16 en 19.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal $a$ en $b$.
      antwoord: |-
        $a = 0{,}5$, $b = 11$
      uitwerking: |-
        $16 = 10a + b$ en $19 = 16a + b$. Aftrekken: $3 = 6a$, dus $a = 0{,}5$ en $b = 11$.
    - opgave: |-
        Bepaal het evenwicht, en de volgende twee termen.
      antwoord: |-
        $E = 22$; 20,5 en 21,25
      uitwerking: |-
        $E = \tfrac{11}{0{,}5} = 22$. $0{,}5 \cdot 19 + 11 = 20{,}5$ en $0{,}5 \cdot 20{,}5 + 11 = 21{,}25$.
    - opgave: |-
        Toon aan dat de verschillen met het evenwicht een meetkundige rij vormen.
      antwoord: |-
        $-12$, $-6$, $-3$, \ldots: quotiënt $0{,}5$
      uitwerking: |-
        $10 - 22 = -12$, $16 - 22 = -6$, $19 - 22 = -3$: telkens de helft, het quotiënt is $a$.

- id: h1-o12
  soort: opdracht
  niveau: 2
  thema: |-
    lening afbetalen
  opgave: |-
    Een gezin leent 150\,000 euro voor een huis, aan 0,3\,\% rente per maand.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoeveel moet het gezin minstens per maand afbetalen om de schuld ooit af te lossen?
      antwoord: |-
        meer dan 450 euro
      uitwerking: |-
        Het evenwicht $E = \tfrac{m}{0{,}003}$ moet groter zijn dan 150\,000, dus $m > 450$ euro: meer dan de rente van de eerste maand.
    - opgave: |-
        Het gezin betaalt 900 euro per maand. Na hoeveel maanden is de lening afgelost?
      antwoord: |-
        na 232 maanden
      uitwerking: |-
        $t_n = 1{,}003\,t_{n-1} - 900$, $E = 300\,000$, $t_n = 300\,000 - 150\,000 \cdot 1{,}003^{\,n}$. $t_n = 0$ als $1{,}003^{\,n} = 2$, dus $n \approx 231{,}4$.
    - opgave: |-
        Hoeveel betaalt het gezin ongeveer in totaal terug?
      antwoord: |-
        ongeveer 208\,000 euro
      uitwerking: |-
        231 betalingen van 900 euro en een laatste van ongeveer 356 euro: $207\,900 + 356 \approx 208\,256$ euro.

- id: h1-o13
  soort: opdracht
  niveau: 2
  thema: |-
    groeifactor $-1$
  opgave: |-
    Neem $t_n = -t_{n-1} + 6$ met $t_0 = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken de eerste vijf termen. Wat valt op?
      antwoord: |-
        1, 5, 1, 5, 1: de rij wisselt tussen twee waarden
      uitwerking: |-
        $t_1 = 5$, $t_2 = 1$, $t_3 = 5$, \ldots
    - opgave: |-
        Bepaal het evenwicht en een expliciet voorschrift.
      antwoord: |-
        $E = 3$, $t_n = 3 - 2\,(-1)^n$
      uitwerking: |-
        $E = \tfrac{6}{2} = 3$ en $c = 1 - 3 = -2$.
    - opgave: |-
        Waarom is het evenwicht stabiel noch onstabiel?
      antwoord: |-
        $|t_n - E| = |t_0 - E|$ blijft gelijk
      uitwerking: |-
        $|t_n - 3| = 2$ voor elke $n$: de rij gaat niet naar het evenwicht, en loopt er ook niet van weg.

- id: h1-o14
  soort: opdracht
  niveau: 2
  thema: |-
    afkoelen in stappen
  opgave: |-
    Een kom soep van 80\,°C staat in een keuken van 20\,°C. Elke minuut daalt het verschil met de keukentemperatuur met 8\,\%.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de differentievergelijking en de recursievergelijking voor de temperatuur $T_n$ na $n$ minuten.
      antwoord: |-
        $\Delta T_n = -0{,}08\,(T_{n-1} - 20)$, $T_n = 0{,}92\,T_{n-1} + 1{,}6$
      uitwerking: |-
        Het verschil $T_{n-1} - 20$ daalt met 8\,\%. Tel $T_{n-1}$ op: $T_n = 0{,}92\,T_{n-1} + 0{,}08 \cdot 20$.
    - opgave: |-
        Geef een expliciet voorschrift.
      antwoord: |-
        $T_n = 20 + 60 \cdot 0{,}92^{\,n}$
      uitwerking: |-
        $E = 20$ en $c = 80 - 20 = 60$.
    - opgave: |-
        Na hoeveel minuten is de soep onder 40\,°C?
      antwoord: |-
        na 14 minuten
      uitwerking: |-
        $60 \cdot 0{,}92^{\,n} < 20$ geeft $n > \tfrac{\ln(1/3)}{\ln 0{,}92} \approx 13{,}2$. Controle: $T_{13} \approx 40{,}3$ en $T_{14} \approx 38{,}7$.

- id: h1-o15
  soort: opdracht
  niveau: 2
  thema: |-
    dosis kiezen
  opgave: |-
    Een geneesmiddel wordt om de 8 uur ingenomen. Tegen de volgende inname is er nog 40\,\% van over. De arts wil dat er op lange termijn vlak na de inname 900 mg in het lichaam zit.
  lijst: enumerate
  delen:
    - opgave: |-
        Welke dosis moet de patiënt telkens innemen?
      antwoord: |-
        540 mg
      uitwerking: |-
        $\tfrac{b}{1 - 0{,}4} = 900$ geeft $b = 540$ mg.
    - opgave: |-
        Hoeveel zit er dan op lange termijn vlak voor een inname in het lichaam?
      antwoord: |-
        360 mg
      uitwerking: |-
        $0{,}4 \cdot 900 = 360$ mg, en $360 + 540 = 900$.
    - opgave: |-
        Bij de hoeveelste inname is er voor het eerst minstens 95\,\% van 900 mg?
      antwoord: |-
        bij de vierde
      uitwerking: |-
        $t_0 = 540$ (eerste inname), $t_n = 900 - 360 \cdot 0{,}4^{\,n} \geqslant 855$ geeft $0{,}4^{\,n} \leqslant 0{,}125$, dus $n \geqslant 2{,}27$: $n = 3$, de vierde inname ($t_3 \approx 877$).

- id: h1-o16
  soort: opdracht
  niveau: 2
  thema: |-
    spinnenweb bij een onstabiel evenwicht
  opgave: |-
    Neem $t_n = -1{,}5\,t_{n-1} + 5$ met $t_0 = 1{,}8$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bepaal het evenwicht en de termen tot $t_4$.
      antwoord: |-
        $E = 2$; $2{,}3$; $1{,}55$; $2{,}675$; $0{,}9875$
      uitwerking: |-
        $E = \tfrac{5}{2{,}5} = 2$. De afwijkingen $-0{,}2$; $0{,}3$; $-0{,}45$; $0{,}675$; $-1{,}0125$ worden telkens met $-1{,}5$ vermenigvuldigd.
    - opgave: |-
        Teken het spinnenwebdiagram. Hoe ziet het eruit?
      antwoord: |-
        een spinnenweb dat zich steeds verder opent
      uitwerking: |-
        De rechte $y = -1{,}5x + 5$ is steiler dan $y = x$: het web draait om $(2, 2)$ en wordt bij elke ronde groter.
        \figuren{\begin{tikzpicture}[scale=.9,font=\scriptsize]
          \rooster{0}{1}{4}{0}{1}{4}
          \draw[lijngrijs,thick] (0,0) -- (4.2,4.2);
          \draw[accent,thick] (.67,4) -- (3.33,0);
          \draw[grijs] (1.8,0) -- (1.8,2.3) -- (2.3,2.3) -- (2.3,1.55) -- (1.55,1.55) -- (1.55,2.675) -- (2.675,2.675) -- (2.675,.9875) -- (.9875,.9875) -- (.9875,3.52);
          \fill[accent] (2,2) circle (2pt);
        \end{tikzpicture}}

- id: h1-o17
  soort: opdracht
  niveau: 3
  thema: |-
    bewijs met volledige inductie
  opgave: |-
    Bewijs met volledige inductie dat $t_n = E + (t_0 - E)\,a^n$ voor elke $n \in \mathbb{N}$, als $t_n = a\,t_{n-1} + b$ en $E = \tfrac{b}{1 - a}$ met $a \neq 1$.
  antwoord: |-
    basisstap $n = 0$ en inductiestap met $aE + b = E$
  uitwerking: |-
    Voor $n = 0$ staat er $t_0 = E + (t_0 - E)$: waar. Stel dat $t_{k} = E + (t_0 - E)\,a^{k}$. Dan is
    $t_{k+1} = a\,t_k + b = aE + b + (t_0 - E)\,a^{k+1} = E + (t_0 - E)\,a^{k+1}$, want $aE + b = E$.

- id: h1-o18
  soort: opdracht
  niveau: 3
  thema: |-
    twee stappen tegelijk
  opgave: |-
    Neem $t_n = a\,t_{n-1} + b$ met $a \neq \pm 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $t_n = a^2\,t_{n-2} + (a + 1)\,b$.
      antwoord: |-
        vul $t_{n-1} = a\,t_{n-2} + b$ in
      uitwerking: |-
        $t_n = a\,(a\,t_{n-2} + b) + b = a^2\,t_{n-2} + (a + 1)\,b$.
    - opgave: |-
        Toon aan dat die vergelijking in twee stappen hetzelfde evenwicht heeft.
      antwoord: |-
        $\frac{(a + 1)\,b}{1 - a^2} = \frac{b}{1 - a}$
      uitwerking: |-
        Het evenwicht is $\dfrac{(a + 1)\,b}{1 - a^2} = \dfrac{(a + 1)\,b}{(1 - a)(1 + a)} = \dfrac{b}{1 - a}$.
    - opgave: |-
        Bij $a < 0$ springt de rij om het evenwicht heen. Wat doen de termen met een even index? Verklaar met de groeifactor in twee stappen.
      antwoord: |-
        ze naderen het evenwicht (of lopen ervan weg) aan één kant
      uitwerking: |-
        In twee stappen is de groeifactor $a^2 > 0$: de termen $t_0$, $t_2$, $t_4$, \ldots blijven aan één kant van het evenwicht. Is $|a| < 1$, dan naderen ze het, anders lopen ze ervan weg.

- id: h1-o19
  soort: opdracht
  niveau: 3
  thema: |-
    toevoer die per stap verandert
  opgave: |-
    Neem $t_n = 0{,}5\,t_{n-1} + n$ met $t_0 = 0$. Omdat $b = n$ niet constant is, werkt het evenwicht niet meer.
  lijst: enumerate
  delen:
    - opgave: |-
        Zoek een oplossing van de vorm $p_n = \alpha n + \beta$ (zonder beginwaarde).
      antwoord: |-
        $p_n = 2n - 2$
      uitwerking: |-
        $\alpha n + \beta = 0{,}5\,(\alpha(n - 1) + \beta) + n$. De termen in $n$: $\alpha = 0{,}5\,\alpha + 1$, dus $\alpha = 2$. De constanten: $\beta = -0{,}5\,\alpha + 0{,}5\,\beta$, dus $\beta = -2$.
    - opgave: |-
        Toon aan dat $v_n = t_n - p_n$ een meetkundige rij is, en geef een expliciet voorschrift voor $t_n$.
      antwoord: |-
        $t_n = 2n - 2 + 2 \cdot 0{,}5^{\,n}$
      uitwerking: |-
        $v_n = t_n - p_n = 0{,}5\,(t_{n-1} - p_{n-1}) = 0{,}5\,v_{n-1}$, met $v_0 = 0 - (-2) = 2$. Controle: $t_1 = 1$ en $t_2 = 2{,}5$.
    - opgave: |-
        Wat doet $t_n - 2n$ op lange termijn?
      antwoord: |-
        het gaat naar $-2$
      uitwerking: |-
        $t_n - 2n = -2 + 2 \cdot 0{,}5^{\,n} \to -2$: de rij volgt op den duur de rechte $2n - 2$.

- id: h1-o20
  soort: opdracht
  niveau: 3
  thema: |-
    twee doseringen vergelijken
  opgave: |-
    Een geneesmiddel wordt zo afgebroken dat er na 12 uur nog 30\,\% over is, en na 24 uur nog $0{,}3^2 = 9\,\%$. Schema A: elke 12 uur 400 mg. Schema B: elke 24 uur 800 mg.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken voor beide schema's de hoeveelheid op lange termijn vlak na en vlak voor een inname.
      antwoord: |-
        A: 571 en 171 mg; B: 879 en 79 mg
      uitwerking: |-
        A: $E = \tfrac{400}{0{,}7} \approx 571{,}4$, ervoor $0{,}3E \approx 171{,}4$. B: $E = \tfrac{800}{0{,}91} \approx 879{,}1$, ervoor $0{,}09E \approx 79{,}1$.
    - opgave: |-
        Een geneesmiddel werkt pas boven 150 mg, en is schadelijk boven 800 mg. Welk schema is het beste? Verklaar.
      antwoord: |-
        schema A
      uitwerking: |-
        Schema A blijft op lange termijn tussen 171 en 571 mg: altijd werkzaam en nooit schadelijk. Schema B gaat boven 800 mg en zakt onder 150 mg. Dezelfde dagdosis, in kleinere porties, geeft een gelijkmatiger hoeveelheid.

- id: h1-o21
  soort: opdracht
  niveau: 3
  thema: |-
    corrigeren met een factor $k$
  opgave: |-
    Een thermostaat corrigeert elke minuut de temperatuur van een bad met $k$ keer het verschil met de gewenste temperatuur $M$: $\Delta T_n = k\,(M - T_{n-1})$, met $k > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de recursievergelijking, de groeifactor en het evenwicht.
      antwoord: |-
        $T_n = (1 - k)\,T_{n-1} + kM$, groeifactor $1 - k$, evenwicht $M$
      uitwerking: |-
        $T_n = T_{n-1} + kM - k\,T_{n-1}$. Het evenwicht is $\tfrac{kM}{1 - (1 - k)} = M$.
    - opgave: |-
        Voor welke $k$ nadert de temperatuur $M$ zonder erover te gaan? Voor welke $k$ schiet ze telkens voorbij $M$, maar nadert ze toch? En wanneer loopt het mis?
      antwoord: |-
        $0 < k < 1$; $1 < k < 2$; $k > 2$
      uitwerking: |-
        $0 < k < 1$: groeifactor tussen 0 en 1, aan één kant. $1 < k < 2$: groeifactor tussen $-1$ en 0, springend maar stabiel. $k > 2$: groeifactor kleiner dan $-1$, onstabiel: de thermostaat corrigeert te hard.
    - opgave: |-
        Wat gebeurt er bij $k = 1$?
      antwoord: |-
        na één stap is de temperatuur $M$
      uitwerking: |-
        De groeifactor is 0: $T_n = M$ voor elke $n \geqslant 1$. De thermostaat corrigeert in één keer het hele verschil.

# --- Koppel -----------------------------------------------------------------------------

- id: h1-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: |-
      Kansrekenen
  opgave: |-
    Regent het vandaag, dan regent het morgen met kans 0,6. Regent het vandaag niet, dan regent het morgen met kans 0,2. Noem $p_n$ de kans op regen na $n$ dagen. Vandaag regent het: $p_0 = 1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon met de wet van de totale kans aan dat $p_n = 0{,}4\,p_{n-1} + 0{,}2$.
      antwoord: |-
        $p_n = 0{,}6\,p_{n-1} + 0{,}2\,(1 - p_{n-1})$
      uitwerking: |-
        $P(\text{regen op dag } n) = 0{,}6 \cdot p_{n-1} + 0{,}2 \cdot (1 - p_{n-1}) = 0{,}4\,p_{n-1} + 0{,}2$.
    - opgave: |-
        Bereken de kans op regen binnen drie dagen.
      antwoord: |-
        0,376
      uitwerking: |-
        $p_1 = 0{,}6$, $p_2 = 0{,}44$, $p_3 = 0{,}376$.
    - opgave: |-
        Wat is op lange termijn de kans op regen, en hangt die af van het weer van vandaag?
      antwoord: |-
        $\tfrac13$, niet afhankelijk van vandaag
      uitwerking: |-
        $E = \tfrac{0{,}2}{0{,}6} = \tfrac13$, stabiel want $|0{,}4| < 1$: elke beginwaarde $p_0$ geeft dezelfde limiet.

- id: h1-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: |-
      Matrices
  opgave: |-
    In een regio wonen 1 miljoen mensen, in de stad of op het platteland. Elk jaar verhuist 10\,\% van de stedelingen naar het platteland, en 5\,\% van de plattelanders naar de stad. Noem $s_n$ en $p_n$ de aantallen (in miljoen) na $n$ jaar.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf het model als $\begin{pmatrix} s_n \\ p_n \end{pmatrix} = A \begin{pmatrix} s_{n-1} \\ p_{n-1} \end{pmatrix}$. Geef $A$.
      antwoord: |-
        $A = \begin{pmatrix} 0{,}9 & 0{,}05 \\ 0{,}1 & 0{,}95 \end{pmatrix}$
      uitwerking: |-
        $s_n = 0{,}9\,s_{n-1} + 0{,}05\,p_{n-1}$ en $p_n = 0{,}1\,s_{n-1} + 0{,}95\,p_{n-1}$.
    - opgave: |-
        Gebruik $s_n + p_n = 1$ om een recursievergelijking voor $s_n$ alleen op te stellen.
      antwoord: |-
        $s_n = 0{,}85\,s_{n-1} + 0{,}05$
      uitwerking: |-
        $s_n = 0{,}9\,s_{n-1} + 0{,}05\,(1 - s_{n-1}) = 0{,}85\,s_{n-1} + 0{,}05$.
    - opgave: |-
        Hoeveel mensen wonen er op lange termijn in de stad? Controleer dat die verdeling niet verandert als je ze met $A$ vermenigvuldigt.
      antwoord: |-
        $\tfrac13$ miljoen
      uitwerking: |-
        $E = \tfrac{0{,}05}{0{,}15} = \tfrac13$. $A \begin{pmatrix} 1/3 \\ 2/3 \end{pmatrix} = \begin{pmatrix} 0{,}3 + 0{,}0\overline{3} \\ 0{,}0\overline{3} + 0{,}6\overline{3} \end{pmatrix} = \begin{pmatrix} 1/3 \\ 2/3 \end{pmatrix}$.

- id: h1-koppel-3
  soort: koppel
  niveau: 3
  koppel:
    rubriek: discreet
    onderwerp: |-
      Rijen
  opgave: |-
    Je kunt het expliciete voorschrift ook vinden met de somformule van een meetkundige rij.
  lijst: enumerate
  delen:
    - opgave: |-
        Toon aan dat $t_n = a^n t_0 + b\,(1 + a + a^2 + \cdots + a^{n-1})$.
      antwoord: |-
        stap voor stap invullen
      uitwerking: |-
        $t_1 = a t_0 + b$, $t_2 = a^2 t_0 + ab + b$, $t_3 = a^3 t_0 + a^2 b + ab + b$, en zo verder: bij elke stap wordt alles met $a$ vermenigvuldigd en komt er $b$ bij.
    - opgave: |-
        Gebruik de somformule om te tonen dat dit hetzelfde is als $E + (t_0 - E)\,a^n$.
      antwoord: |-
        $b\,\frac{1 - a^n}{1 - a} = E - E a^n$
      uitwerking: |-
        $b\,(1 + a + \cdots + a^{n-1}) = b\,\dfrac{1 - a^n}{1 - a} = E\,(1 - a^n)$, dus $t_n = a^n t_0 + E - E a^n = E + (t_0 - E)\,a^n$.

# --- Test jezelf ------------------------------------------------------------------------

- id: h1-t1
  soort: test
  niveau: 1
  opgave: |-
    Een bibliotheek heeft 5000 boeken. Elk jaar wordt 6\,\% van de boeken afgevoerd, en komen er 400 nieuwe bij. Stel een recursievergelijking op, en bereken het aantal boeken na twee jaar.
  antwoord: |-
    $t_n = 0{,}94\,t_{n-1} + 400$; 5194 boeken
  uitwerking: |-
    $t_1 = 4700 + 400 = 5100$ en $t_2 = 4794 + 400 = 5194$.

- id: h1-t2
  soort: test
  niveau: 1
  opgave: |-
    Bepaal het evenwicht en een expliciet voorschrift van $t_n = 0{,}4\,t_{n-1} + 9$ met $t_0 = 3$.
  antwoord: |-
    $E = 15$, $t_n = 15 - 12 \cdot 0{,}4^{\,n}$
  uitwerking: |-
    $E = \tfrac{9}{0{,}6} = 15$ en $c = 3 - 15 = -12$. Controle: $t_1 = 10{,}2 = 15 - 4{,}8$.

- id: h1-t3
  soort: test
  niveau: 1
  opgave: |-
    Is het evenwicht stabiel? Gebeurt het aan één kant of springend?
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $t_n = -0{,}9\,t_{n-1} + 19$
      antwoord: |-
        $E = 10$, stabiel, springend
      uitwerking: |-
        $-1 < a < 0$.
    - opgave: |-
        $t_n = 1{,}2\,t_{n-1} - 2$
      antwoord: |-
        $E = 10$, onstabiel, aan één kant
      uitwerking: |-
        $a > 1$.
    - opgave: |-
        $t_n = 0{,}3\,t_{n-1} + 7$
      antwoord: |-
        $E = 10$, stabiel, aan één kant
      uitwerking: |-
        $0 < a < 1$.

- id: h1-t4
  soort: test
  niveau: 2
  opgave: |-
    Teken het spinnenwebdiagram van $t_n = -0{,}5\,t_{n-1} + 6$ vanaf $t_0 = 0$. Lees het evenwicht af, en beschrijf het verloop van de rij.
  antwoord: |-
    $E = 4$, stabiel, springend: 0; 6; 3; 4,5; 3,75; \ldots
  uitwerking: |-
    Het snijpunt van $y = -0{,}5x + 6$ en $y = x$ is $(4, 4)$. Het web snoert zich toe: de termen $6$; $3$; $4{,}5$; $3{,}75$; $4{,}125$ liggen afwisselend boven en onder 4.

- id: h1-t5
  soort: test
  niveau: 2
  opgave: |-
    Een proces voldoet aan $\Delta t_n = 0{,}25\,(800 - t_{n-1})$ met $t_0 = 200$. Geef de recursievergelijking en het evenwicht. Na hoeveel stappen is $t_n$ groter dan 750?
  antwoord: |-
    $t_n = 0{,}75\,t_{n-1} + 200$, $E = 800$; na 9 stappen
  uitwerking: |-
    $t_n = 800 - 600 \cdot 0{,}75^{\,n} > 750$ geeft $0{,}75^{\,n} < \tfrac1{12}$, dus $n > 8{,}64$. Controle: $t_8 \approx 739{,}9$ en $t_9 \approx 754{,}9$.

- id: h1-t6
  soort: test
  niveau: 2
  opgave: |-
    Je leent 20\,000 euro aan 0,4\,\% per maand, en betaalt elke maand 300 euro af. Na hoeveel maanden is de schuld afgelost? Hoeveel moet je per maand minstens afbetalen om ooit van de schuld af te raken?
  antwoord: |-
    na 78 maanden; meer dan 80 euro
  uitwerking: |-
    $t_n = 1{,}004\,t_{n-1} - 300$, $E = 75\,000$, $t_n = 75\,000 - 55\,000 \cdot 1{,}004^{\,n}$. $t_n = 0$ geeft $n = \tfrac{\ln(15/11)}{\ln 1{,}004} \approx 77{,}7$. Minstens: meer dan de rente $0{,}004 \cdot 20\,000 = 80$ euro.
