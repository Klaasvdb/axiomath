    - opgave: |-
        $t_n = -0{,}75\,t_{n-1} + 7$, vanaf $t_0 = 2$
      antwoord: |-
        $E = 4$; een spinnenweb dat zich rond $(4, 4)$ toesnoert
      uitwerking: |-
        $x = -0{,}75x + 7$ geeft $x = 4$. De termen: $5{,}5$; $2{,}88$; $4{,}84$; $3{,}37$; \ldots
