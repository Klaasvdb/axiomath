- id: h1-o1
  soort: opdracht
  niveau: 1
  thema: |-
    evenwicht en expliciet voorschrift
  opgave: |-
    Bepaal het evenwicht en een expliciet voorschrift. Bereken daarmee $t_{10}$ (op twee decimalen).
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $t_n = 0{,}5\,t_{n-1} + 4$, \ $t_0 = 0$
      antwoord: |-
        $t_n = 8 - 8 \cdot 0{,}5^{\,n}$, $t_{10} \approx 7{,}99$
      uitwerking: |-
        $E = 8$, $c = -8$. $t_{10} = 8 - \tfrac{8}{1024} \approx 7{,}99$.
    - opgave: |-
        $t_n = 1{,}5\,t_{n-1} - 2$, \ $t_0 = 6$
      antwoord: |-
        $t_n = 4 + 2 \cdot 1{,}5^{\,n}$, $t_{10} \approx 119{,}33$
      uitwerking: |-
        $E = \tfrac{-2}{-0{,}5} = 4$, $c = 2$. $t_{10} = 4 + 2 \cdot 57{,}665 \approx 119{,}33$.
    - opgave: |-
        $t_n = -0{,}25\,t_{n-1} + 10$, \ $t_0 = 0$
      antwoord: |-
        $t_n = 8 - 8\,(-0{,}25)^n$, $t_{10} \approx 8{,}00$
      uitwerking: |-
        $E = \tfrac{10}{1{,}25} = 8$, $c = -8$. $(-0{,}25)^{10} \approx 9{,}5 \cdot 10^{-7}$, dus $t_{10} \approx 7{,}999\,992$.
    - opgave: |-
        $t_n = 0{,}2\,t_{n-1} - 4$, \ $t_0 = 0$
      antwoord: |-
        $t_n = -5 + 5 \cdot 0{,}2^{\,n}$, $t_{10} \approx -5{,}00$
      uitwerking: |-
        $E = \tfrac{-4}{0{,}8} = -5$, $c = 5$. Een negatief evenwicht.

