# Oefeningen van hoofdstuk 1. Zie Opmaak/oefeningenbank.py voor de velden.

- id: h1-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}\quad Bereken.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $t_3$ als $t_n = 2\,t_{n-1} - 1$ en $t_0 = 3$
      antwoord: |-
        17
      uitwerking: |-
        $t_1 = 5$, $t_2 = 9$, $t_3 = 17$.
    - opgave: |-
        $u_4$ van de meetkundige rij met $u_0 = 5$ en $q = 3$
      antwoord: |-
        405
      uitwerking: |-
        $u_4 = 5 \cdot 3^4 = 405$.
    - opgave: |-
        $n$ als $0{,}8^{\,n} = 0{,}2$
      antwoord: |-
        $n \approx 7{,}21$
      uitwerking: |-
        $n = \dfrac{\ln 0{,}2}{\ln 0{,}8} \approx 7{,}21$.
    - opgave: |-
        de kleinste $n \in \mathbb{N}$ met $1{,}04^{\,n} > 2$
      antwoord: |-
        18
      uitwerking: |-
        $n > \dfrac{\ln 2}{\ln 1{,}04} \approx 17{,}67$.
    - opgave: |-
        $\displaystyle\lim_{n \to +\infty} 0{,}9^{\,n}$ en $\displaystyle\lim_{n \to +\infty} 1{,}1^{\,n}$
      antwoord: |-
        0 en $+\infty$
      uitwerking: |-
        Een meetkundige rij met $|q| < 1$ gaat naar 0; met $q > 1$ naar $+\infty$.
    - opgave: |-
        de factor bij een daling met 12\,\%
      antwoord: |-
        0,88
      uitwerking: |-
        Er blijft $100\,\% - 12\,\% = 88\,\%$ over.

- id: h1-verken
  soort: start
  opgave: |-
    \blokkop{Verken}\quad In een sporthal zijn 600 mensen. Elke minuut vertrekt 10\,\% van de aanwezigen, en komen er 30 nieuwe binnen. Noem $t_n$ het aantal aanwezigen na $n$ minuten.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $t_1$, $t_2$ en $t_3$.
      antwoord: |-
        570; 543; 518,7
      uitwerking: |-
        $t_n = 0{,}9\,t_{n-1} + 30$: $t_1 = 540 + 30 = 570$, $t_2 = 513 + 30 = 543$, $t_3 = 488{,}7 + 30 = 518{,}7$.
    - opgave: |-
        Wat gebeurt er als er op een ogenblik precies 300 mensen zijn?
      antwoord: |-
        het aantal blijft 300
      uitwerking: |-
        Er vertrekken er 30 en er komen er 30 binnen: $0{,}9 \cdot 300 + 30 = 300$.
    - opgave: |-
        Zijn er meer dan 300 mensen, daalt het aantal dan of stijgt het? En bij minder dan 300?
      antwoord: |-
        boven 300 daalt het, onder 300 stijgt het
      uitwerking: |-
        Boven 300 vertrekken er meer dan 30 per minuut, en daalt het aantal. Onder 300 vertrekken er minder dan 30, en stijgt het.
    - opgave: |-
        Hoeveel mensen verwacht je na een uur?
      antwoord: |-
        ongeveer 300
      uitwerking: |-
        Het aantal nadert 300. Met het voorschrift uit dit hoofdstuk: $t_{60} = 300 + 300 \cdot 0{,}9^{60} \approx 300{,}5$.

- id: h1-opstellen
  soort: kort
  opgave: |-
    Stel een recursievergelijking op en bereken $t_1$.
  lijst: enumerate
  delen:
    - opgave: |-
        Op een spaarrekening staat 1000 euro. Ze brengt 2\,\% rente per jaar op, en elk jaar stort je er 500 euro bij.
      antwoord: |-
        $t_n = 1{,}02\,t_{n-1} + 500$, $t_1 = 1520$
      uitwerking: |-
        Rente bijschrijven is vermenigvuldigen met 1,02; de storting komt erbij. $t_1 = 1020 + 500 = 1520$ euro.
    - opgave: |-
        Een stuwmeer bevat 8000 m\textsuperscript{3} water. Elke dag stroomt 5\,\% van het water weg, en komt er 300 m\textsuperscript{3} bij.
      antwoord: |-
        $t_n = 0{,}95\,t_{n-1} + 300$, $t_1 = 7900$
      uitwerking: |-
        Er blijft 95\,\% over: $t_1 = 7600 + 300 = 7900$ m\textsuperscript{3}.
    - opgave: |-
        Een busmaatschappij heeft 60\,000 abonnees. Elk jaar zegt 4\,\% het abonnement op, en komen er 2000 nieuwe abonnees bij.
      antwoord: |-
        $t_n = 0{,}96\,t_{n-1} + 2000$, $t_1 = 59\,600$
      uitwerking: |-
        $t_1 = 57\,600 + 2000 = 59\,600$.

- id: h1-evenwicht
  soort: kort
  opgave: |-
    Bepaal het evenwicht, als het bestaat.
  lijst: reeks
  kolommen: 4
  delen:
    - opgave: |-
        $t_n = 0{,}9\,t_{n-1} + 45$
      antwoord: |-
        450
      uitwerking: |-
        $\tfrac{45}{0{,}1} = 450$.
    - opgave: |-
        $t_n = 1{,}05\,t_{n-1} - 100$
      antwoord: |-
        2000
      uitwerking: |-
        $\tfrac{-100}{-0{,}05} = 2000$.
    - opgave: |-
        $t_n = -t_{n-1} + 8$
      antwoord: |-
        4
      uitwerking: |-
        $\tfrac{8}{2} = 4$.
    - opgave: |-
        $t_n = t_{n-1} + 3$
      antwoord: |-
        geen
      uitwerking: |-
        $a = 1$ en $b \neq 0$.

- id: h1-expliciet
  soort: kort
  opgave: |-
    Bepaal het evenwicht en een expliciet voorschrift.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $t_n = 0{,}6\,t_{n-1} + 8$, \ $t_0 = 5$
      antwoord: |-
        $E = 20$, $t_n = 20 - 15 \cdot 0{,}6^{\,n}$
      uitwerking: |-
        $E = \tfrac{8}{0{,}4} = 20$ en $c = 5 - 20 = -15$.
    - opgave: |-
        $t_n = 3\,t_{n-1} - 4$, \ $t_0 = 1$
      antwoord: |-
        $E = 2$, $t_n = 2 - 3^n$
      uitwerking: |-
        $E = \tfrac{-4}{1 - 3} = 2$ en $c = 1 - 2 = -1$. Controle: $t_1 = 3 - 4 = -1 = 2 - 3$.
    - opgave: |-
        $t_n = -2\,t_{n-1} + 6$, \ $t_0 = 0$
      antwoord: |-
        $E = 2$, $t_n = 2 - 2\,(-2)^n$
      uitwerking: |-
        $E = \tfrac{6}{1 + 2} = 2$ en $c = -2$. Controle: $t_1 = 6 = 2 - 2 \cdot (-2)$.
    - opgave: |-
        $t_n = t_{n-1} + 7$, \ $t_0 = 3$
      antwoord: |-
        geen evenwicht, $t_n = 3 + 7n$
      uitwerking: |-
        $a = 1$: een rekenkundige rij met verschil 7, zonder evenwicht.

- id: h1-terugrekenen
  soort: kort
  opgave: |-
    Reken terug met het expliciete voorschrift.
  lijst: enumerate
  delen:
    - opgave: |-
        In de vijver is $t_n = 800 + 100 \cdot 0{,}75^{\,n}$. Na hoeveel jaar zijn er minder dan 810 vissen?
      antwoord: |-
        na 9 jaar
      uitwerking: |-
        $0{,}75^{\,n} < 0{,}1$ geeft $n > \tfrac{\ln 0{,}1}{\ln 0{,}75} \approx 8{,}004$.
    - opgave: |-
        Bij de herten is $t_n = 1500 - 300 \cdot 1{,}02^{\,n}$. Na hoeveel jaar zijn er minder dan 500?
      antwoord: |-
        na 61 jaar
      uitwerking: |-
        $300 \cdot 1{,}02^{\,n} > 1000$ geeft $n > \tfrac{\ln(10/3)}{\ln 1{,}02} \approx 60{,}8$.

- id: h1-stabiel
  soort: kort
  opgave: |-
    Bepaal het evenwicht. Is het stabiel of onstabiel, en gebeurt het aan één kant of springend?
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $t_n = 0{,}9\,t_{n-1} + 1$
      antwoord: |-
        $E = 10$, stabiel, aan één kant
      uitwerking: |-
        $E = \tfrac{1}{0{,}1} = 10$ en $0 < a < 1$.
    - opgave: |-
        $t_n = -0{,}8\,t_{n-1} + 18$
      antwoord: |-
        $E = 10$, stabiel, springend
      uitwerking: |-
        $E = \tfrac{18}{1{,}8} = 10$ en $-1 < a < 0$.
    - opgave: |-
        $t_n = 1{,}1\,t_{n-1} - 1$
      antwoord: |-
        $E = 10$, onstabiel, aan één kant
      uitwerking: |-
        $E = \tfrac{-1}{-0{,}1} = 10$ en $a > 1$.
    - opgave: |-
        $t_n = -1{,}5\,t_{n-1} + 25$
      antwoord: |-
        $E = 10$, onstabiel, springend
      uitwerking: |-
        $E = \tfrac{25}{2{,}5} = 10$ en $a < -1$.

- id: h1-spinnenweb
