- id: h1-differentie
  soort: kort
  opgave: |-
    Differentie- en recursievergelijkingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de differentievergelijking bij $t_n = 0{,}7\,t_{n-1} + 12$, in de vorm met het evenwicht.
      antwoord: |-
        $\Delta t_n = -0{,}3\,(t_{n-1} - 40)$
      uitwerking: |-
        $\Delta t_n = -0{,}3\,t_{n-1} + 12$ en $E = \tfrac{12}{0{,}3} = 40$.
    - opgave: |-
        In een dorp van 3000 inwoners hoort elke dag 20\,\% van wie het nieuws nog niet kent het nieuws. Stel de differentievergelijking en de recursievergelijking op voor het aantal $t_n$ dat het nieuws kent.
      antwoord: |-
        $\Delta t_n = 0{,}2\,(3000 - t_{n-1})$, $t_n = 0{,}8\,t_{n-1} + 600$
      uitwerking: |-
        Wie het nieuws niet kent: $3000 - t_{n-1}$. Tel $t_{n-1}$ op: $t_n = 0{,}8\,t_{n-1} + 600$.
    - opgave: |-
        Geef de recursievergelijking en het evenwicht bij $\Delta t_n = 0{,}03\,t_{n-1} - 60$.
      antwoord: |-
        $t_n = 1{,}03\,t_{n-1} - 60$, $E = 2000$
      uitwerking: |-
        $t_n = t_{n-1} + \Delta t_n$. Het evenwicht: $\Delta t_n = 0$ geeft $t_{n-1} = 2000$.

