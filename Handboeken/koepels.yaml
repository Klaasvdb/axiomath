# Welke handboeken een richting volgt, per graad en per koepel.
# Bron voor de website: kies graad → koepel → richting en toon eerst `verplicht`, daarna apart `keuze` en `uitbreiding`.
# De uitleg en de bronnen staan in Ontwerp/koepels.md. Stand: 15 november 2026.
#
# Verwijzingen naar een handboek gebruiken de sleutel van maak-voorkanten.py: "<pakket>/<rubriek>/<cursus>",
# met pakket "1".."4" in de 3de graad en "2g1".."2g5" in de 2de. Een verwijzing die met "nieuw:" begint,
# is een module die nog niet bestaat. "pakket: X" betekent: alle handboeken van dat pakket, behalve `niet`.
#   verplicht:   pakket + extra
#   keuze:       wat de school of het leerplan als keuze laat (KOV-keuzedoelen, GO!-optiepakket)
#   uitbreiding: wat verder gaat dan het leerplan (KOV Complementair, extra lesuren)
#   niet:        handboeken van het pakket die deze koepel niet vraagt (op de site bij uitbreiding tonen)
# Per profiel ook:
#   label:       een korte naam voor de groep, voor de voorkant als de lijst met richtingen te lang wordt
#                (Ontwerp/voorkanten/maak-voorkanten.py, richtingen_tekst)
#   graaduren:   bij GO: het aantal graaduren wiskunde in de indicatieve lessentabel van GO! (2 graaduren = 1 uur
#                per week in beide jaren). KOV: de uren per pakket in maak-voorkanten.py, zoals op de voorkant.
# maak-voorkanten.py zet dit om naar handboeken (koepeltabel) en maakt er de voorkanten per koepel mee;
# Website/leerkrachten/maak.py zet het in boeken.json voor de keuze op de site.

koepels:
  KOV: {naam: Katholiek Onderwijs Vlaanderen, aandeel: "71 % (vrij net)"}
  GO: {naam: "GO!", aandeel: "21 %"}
  POV: {naam: Provinciaal Onderwijs Vlaanderen, aandeel: "3 %"}
  OVSG:
    naam: Onderwijs Vlaamse Steden en Gemeenten
    aandeel: "4 %"
    kiest_uit: [GO, KOV, POV]   # geen eigen leerplannen in de 2de en 3de graad: de school kiest via de gemeenteraad

graden:
  3:
